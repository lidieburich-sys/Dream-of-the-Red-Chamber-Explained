<script type="text/plain" id="ch19">
# 一、省亲之后
话说贾妃回宫，次日见驾谢恩，并回奏归省之事，龙颜甚悦。|贾妃回宫后，第二天去见皇上谢恩，并回禀省亲的情形，皇上很高兴。
又发内帑彩缎金银等物，以赐贾政及各椒房等员，不必细说。|又从宫中库房拿出彩缎金银等东西，赏给贾政和各位妃嫔的家属，这里不必细说。
且说荣宁二府中因连日用尽心力，真是人人力倦，各各神疲，|再说荣宁二府因为连日来用尽心力，真是人人疲倦，个个精神不济，
又将园中一应陈设动用之物收拾了两三天方完。|又把园子里所有陈设和用过的东西收拾了两三天才完。
第一个凤姐事多任重，别人或可偷安躲静，独他是不能脱得的，|头一个就是凤姐，事情多、担子重，别人还能偷个懒躲个清静，只有她是脱不开身的；
二则本性要强，不肯落人褒贬，只扎挣著与无事的人一样。|二来她本性要强，不肯让人说闲话，只硬撑着装得跟没事人一样。
第一个宝玉是极无事最闲暇的。|最清闲没事的头一个就是宝玉。
偏这日一早，袭人的母亲又亲来回过贾母，接袭人家去吃年茶，晚间才得回来。|偏偏这天一早，袭人的母亲又亲自来禀告贾母，接袭人回家喝年茶，晚上才能回来。
因此，宝玉只和众丫头们掷骰子赶围棋作戏。|因此宝玉只和丫头们掷骰子、下围棋玩。
正在房内顽的没兴头，忽见丫头们来回说：“东府珍大爷来请过去看戏，放花灯。”|正在屋里玩得没劲，忽然丫头们来报：“东府珍大爷来请您过去看戏、放花灯。”
宝玉听了，便命换衣裳。|宝玉听了，就叫人换衣服。
才要去时，忽又有贾妃赐出糖蒸酥酪来，宝玉想上次袭人喜吃此物，便命留与袭人了。|刚要走，忽然又有贾妃赏出来的糖蒸酥酪，宝玉想起上次袭人爱吃这个，就叫留给袭人。
自己回过贾母，过去看戏。|自己禀过贾母，过去看戏了。
! 凤姐“扎挣著与无事的人一样”，这份要强一直透支着她的身体，后面她小产、得血山崩，都和这份强撑有关。
! 贵妃赏的酥酪，宝玉留给一个丫鬟，下面就惹出事来。

# 二、宁府的热闹戏
谁想贾珍这边唱的是《丁郎认父》，《黄伯央大摆阴魂阵》，更有《孙行者大闹天宫》，《姜子牙斩将封神》等类的戏文，|谁知贾珍这边唱的是《丁郎认父》《黄伯央大摆阴魂阵》，还有《孙行者大闹天宫》《姜子牙斩将封神》之类的戏，
倏尔神鬼乱出，忽又妖魔毕露，甚至于扬幡过会，号佛行香，锣鼓喊叫之声远闻巷外。|一会儿神鬼乱窜，一会儿妖魔全出，甚至打着幡、游着会、念着佛、烧着香，锣鼓叫喊的声音传到巷子外面老远。
满街之人个个都赞：“好热闹戏，别人家断不能有的。”|满街的人个个都夸：“好热闹的戏，别人家绝对没有。”
宝玉见繁华热闹到如此不堪的田地，只略坐了一坐，便走开各处闲耍。|宝玉见热闹到这种不堪的地步，只稍微坐了一会儿，就走开到处去玩。
先是进内去和尤氏和丫鬟姬妾说笑了一回，便出二门来。|先是进里面和尤氏、丫鬟、姬妾们说笑了一阵，就出了二门。
尤氏等仍料他出来看戏，遂也不曾照管。|尤氏等人以为他出去看戏了，也就没管他。
贾珍，贾琏，薛蟠等只顾猜枚行令，百般作乐，也不理论，|贾珍、贾琏、薛蟠等人只顾着猜拳行酒令，变着法儿作乐，也不管他，
纵一时不见他在座，只道在里边去了，故也不问。|就算一时不见他在座，也只当他到里面去了，所以也不问。
至于跟宝玉的小厮们，那年纪大些的，知宝玉这一来了，必是晚间才散，|至于跟宝玉的小厮们，年纪大些的，知道宝玉这一来，一定要到晚上才散，
因此偷空也有去会赌的，也有往亲友家去吃年茶的，更有或嫖或饮的，都私散了，待晚间再来，|所以趁空有去赌钱的，有到亲友家喝年茶的，还有去嫖去喝的，都私自散了，等晚上再来；
那小些的，都钻进戏房里瞧热闹去了。|那些小的，都钻到戏房里看热闹去了。
! 宝玉嫌宁府的戏“热闹到如此不堪”：满台神鬼妖魔，吵得满街都听得见。宁府的品味，和元春省亲时的清雅完全不同。
! 主子只顾作乐，小厮各自散去，宁府上下一片放纵。

# 三、小书房里的茗烟
宝玉见一个人没有，因想“这里素日有个小书房，内曾挂著一轴美人，极画的得神。|宝玉见一个人也没有，心想：“这里平时有个小书房，里面挂着一幅美人画，画得极其传神。
今日这般热闹，想那里自然无人，那美人也自然是寂寞的，须得我去望慰他一回。”|今天这么热闹，想必那里没人，那美人自然也寂寞了，我得去看看她、安慰安慰她。”
想著，便往书房里来。|想着就往书房走去。
刚到窗前，闻得房内有呻吟之韵。|刚到窗前，听见屋里有呻吟的声音。
宝玉倒唬了一跳：敢是美人活了不成？|宝玉倒吓了一跳：难道是美人活了？
乃乍著胆子，舔破窗纸，向内一看——|就壮着胆子，舔破窗纸往里一看——
那轴美人却不曾活，却是茗烟按著一个女孩子，也干那警幻所训之事。|那幅美人画并没有活，却是茗烟按着一个女孩子，也在做警幻仙姑教过的那种事。
宝玉禁不住大叫：“了不得！”一脚踹进门去，将那两个唬开了，抖衣而颤。|宝玉忍不住大叫：“不得了！”一脚踹开门进去，把那两个人吓得分开了，浑身发抖。
! 宝玉想去“安慰”一幅画中的美人，怕她寂寞。这就是宝玉的痴：对画里的女子也有情。
! “警幻所训之事”指第五回警幻仙姑在梦里教宝玉的男女之事。

# 四、卍儿
茗烟见是宝玉，忙跪求不迭。|茗烟见是宝玉，连忙跪下求饶。
宝玉道：“青天白日，这是怎么说。珍大爷知道，你是死是活？”|宝玉说：“大白天的，这算怎么回事。珍大爷知道了，你还要不要命？”
一面看那丫头，虽不标致，倒还白净，些微亦有动人处，羞的脸红耳赤，低首无言。|一面看那丫头，虽然不算漂亮，倒还白净，也有一点动人的地方，羞得面红耳赤，低着头不说话。
宝玉跺脚道：“还不快跑！”|宝玉跺脚说：“还不快跑！”
一语提醒了那丫头，飞也似去了。|一句话提醒了那丫头，飞也似的跑了。
宝玉又赶出去，叫道：“你别怕，我是不告诉人的。”|宝玉又追出去，叫道：“你别怕，我不会告诉别人的。”
急的茗烟在后叫：“祖宗，这是分明告诉人了！”|急得茗烟在后面叫：“祖宗，你这么一喊，分明就是告诉别人了！”
宝玉因问：“那丫头十几岁了？”|宝玉问：“那丫头十几岁了？”
茗烟道：“大不过十六七岁了。”|茗烟说：“大概不超过十六七岁。”
宝玉道：“连他的岁属也不问问，别的自然越发不知了。|宝玉说：“连她多大、属什么都不问问，别的就更不知道了。
可见他白认得你了。可怜，可怜！”|可见她白认识你了。可怜，可怜！”
又问：“名字叫什么？”|又问：“她叫什么名字？”
茗烟大笑道：“若说出名字来话长，真真新鲜奇文，竟是写不出来的。|茗烟大笑道：“要说她的名字，话可长了，真是新鲜稀奇，简直写不出来。
据他说，他母亲养他的时节做了个梦，梦见得了一匹锦，上面是五色富贵不断头卍字的花样，所以他的名字叫作卍儿。”|据她说，她母亲生她的时候做了个梦，梦见得了一匹锦缎，上面是五色富贵不断头的卍字花样，所以她的名字叫卍儿。”
宝玉听了笑道：“真也新奇，想必他将来有些造化。”|宝玉听了笑道：“真是新奇，想必她将来有些福气。”
说著，沉思一会。|说着，沉思了一会儿。
! 宝玉不怪茗烟坏了规矩，倒怪他“连他的岁属也不问问”，替那女孩子不值。在宝玉眼里，女孩子的心意比什么都要紧。
! 宝玉喊“我是不告诉人的”，是好心，也是傻气。

# 五、去袭人家
茗烟因问：“二爷为何不看这样的好戏？”|茗烟问：“二爷为什么不看这么好的戏？”
宝玉道：“看了半日，怪烦的，出来逛逛，就遇见你们了。这会子作什么呢？”|宝玉说：“看了半天，烦得很，出来逛逛，就碰上你们了。这会儿干什么好呢？”
茗烟嘻嘻笑道：“这会子没人知道，我悄悄的引二爷往城外逛逛去，一会子再往这里来，他们就不知道了。”|茗烟嘻嘻笑道：“这会儿没人知道，我悄悄带二爷到城外逛逛去，一会儿再回这里来，他们就不知道了。”
宝玉道：“不好，仔细花子拐了去。|宝玉说：“不好，小心被叫花子拐走。
便是他们知道了，又闹大了，不如往熟近些的地方去。还可就来。”|就算他们知道了，也会闹大，不如去近一点、熟一点的地方，还能马上回来。”
茗烟道：“熟近地方，谁家可去？这却难了。”|茗烟说：“熟一点近一点的地方，谁家能去？这倒难了。”
宝玉笑道：“依我的主意，咱们竟找你花大姐姐去，瞧他在家作什么呢。”|宝玉笑道：“依我的主意，咱们干脆去找你花大姐姐，看她在家干什么呢。”
茗烟笑道：“好，好！倒忘了他家。”|茗烟笑道：“好，好！倒把她家忘了。”
又道：“若他们知道了，说我引著二爷胡走，要打我呢？”|又说：“要是他们知道了，说我带着二爷乱跑，要打我怎么办？”
宝玉道：“有我呢。”|宝玉说：“有我呢。”
茗烟听说，拉了马，二人从后门就走了。|茗烟听了，牵了马，两人从后门走了。
幸而袭人家不远，不过一半里路程，展眼已到门前。|幸好袭人家不远，不过一里半里路，转眼就到了门前。
茗烟先进去叫袭人之兄花自芳。|茗烟先进去叫袭人的哥哥花自芳。
彼时袭人之母接了袭人与几个外甥女儿，几个侄女儿来家，正吃果茶，|这时袭人的母亲接了袭人和几个外甥女、侄女回家，正在吃果茶，
听见外面有人叫“花大哥”，花自芳忙出去看时，见是他主仆两个，唬的惊疑不止，|听见外面有人叫“花大哥”，花自芳连忙出去看，见是他们主仆两个，吓得又惊又疑，
连忙抱下宝玉来，在院内嚷道：“宝二爷来了！”|连忙把宝玉从马上抱下来，在院子里嚷道：“宝二爷来了！”
! 宝玉是贾府的“凤凰”，私自出门是天大的事。他一时兴起，跑到一个丫鬟家里去，这是他心里没有尊卑的表现。

# 六、袭人又惊又喜
别人听见还可，袭人听了，也不知为何，忙跑出来迎著宝玉，一把拉著问：“你怎么来了？”|别人听见还没什么，袭人听了，也不知道是怎么回事，连忙跑出来迎着宝玉，一把拉住问：“你怎么来了？”
宝玉笑道：“我怪闷的，来瞧瞧你作什么呢。”|宝玉笑道：“我闷得慌，来看看你在干什么。”
袭人听了，才放下心来，嗐了一声，笑道：“你也忒胡闹了，可作什么来呢！”|袭人听了，才放下心来，“嗐”了一声，笑道：“你也太胡闹了，来干什么呢！”
一面又问茗烟：“还有谁跟来？”|一面又问茗烟：“还有谁跟着来了？”
茗烟笑道：“别人都不知，就只有我们两个。”|茗烟笑道：“别人都不知道，就我们两个。”
袭人听了，复又惊慌，说道：|袭人听了，又惊慌起来，说：
“这还了得！倘或碰见了人，或是遇见了老爷，街上人挤车碰，马轿纷纷的，若有个闪失，也是顽得的！|“这还了得！要是碰见了人，或者遇见了老爷，街上人挤车撞，马和轿子乱哄哄的，要是有个闪失，那可不是闹着玩的！
你们的胆子比斗还大。|你们的胆子比斗还大。
都是茗烟调唆的，回去我定告诉嬷嬷们打你。”|都是茗烟撺掇的，回去我一定告诉嬷嬷们打你。”
茗烟撅了嘴道：“二爷骂著打著，叫我引了来，这会子推到我身上。|茗烟撅着嘴说：“是二爷又骂又打，叫我带他来的，这会儿倒推到我身上。
我说别来罢，——不然我们还去罢。”|我说别来吧，——要不我们还是回去吧。”
花自芳忙劝：“罢了，已是来了，也不用多说了。|花自芳连忙劝道：“算了，已经来了，就不用多说了。
只是茅檐草舍，又窄又脏，爷怎么坐呢？”|只是我们这茅草屋又窄又脏，爷怎么坐呢？”
! 茗烟说“二爷骂著打著”是撒谎，明明是他自己出的主意。下人们都会把责任往主子身上推。

# 七、袭人招待宝玉
袭人之母也早迎了出来。|袭人的母亲也早迎了出来。
袭人拉了宝玉进去。|袭人拉着宝玉进去。
宝玉见房中三五个女孩儿，见他进来，都低了头，羞惭惭的。|宝玉见屋里有三五个女孩子，见他进来，都低下头，害羞得很。
花自芳母子两个百般怕宝玉冷，又让他上炕，又忙另摆果桌，又忙倒好茶。|花自芳母子俩生怕宝玉冷着，又让他上炕，又忙着另摆果盘，又忙着倒好茶。
袭人笑道：“你们不用白忙，我自然知道。|袭人笑道：“你们不用瞎忙，我自然知道。
果子也不用摆，也不敢乱给东西吃。”|果子也不用摆，也不敢随便给他东西吃。”
一面说，一面将自己的坐褥拿了铺在一个炕上，宝玉坐了，|一边说，一边把自己的坐垫拿来铺在炕上，让宝玉坐下，
用自己的脚炉垫了脚，向荷包内取出两个梅花香饼儿来，又将自己的手炉掀开焚上，仍盖好，放与宝玉怀内，|用自己的脚炉给他垫脚，又从荷包里拿出两个梅花香饼，把自己的手炉打开点上，再盖好，放到宝玉怀里，
然后将自己的茶杯斟了茶，送与宝玉。|然后用自己的茶杯倒了茶，递给宝玉。
彼时他母兄已是忙另齐齐整整摆上一桌子果品来。|这时她母亲和哥哥已经另外整整齐齐摆上了一桌果品。
袭人见总无可吃之物，因笑道：|袭人见没有一样能吃的东西，就笑道：
“既来了，没有空去之理，好歹尝一点儿，也是来我家一趟。”|“既然来了，没有空着嘴走的道理，好歹尝一点，也算来我家一趟。”
说著，便拈了几个松子穰，吹去细皮，用手帕托著送与宝玉。|说着拈了几个松子仁，吹掉上面的细皮，用手帕托着递给宝玉。
! 坐褥、脚炉、手炉、茶杯，全用袭人自己的。在她心里，家里的东西都不配给宝玉用，只有她自己的才干净。
! 袭人在家人面前处处显出她和宝玉的亲近，这是做给家里人看的，下面就明白了。

# 八、袭人哭过
宝玉看见袭人两眼微红，粉光融滑，因悄问袭人：“好好的哭什么？”|宝玉见袭人两眼微微发红，脸上粉光滑润，就悄悄问她：“好好的哭什么？”
袭人笑道：“何尝哭，才迷了眼揉的。”|袭人笑道：“哪里哭了，刚才迷了眼揉的。”
因此便遮掩过了。|就这样遮掩过去了。
当下宝玉穿著大红金蟒狐腋箭袖，外罩石青貂裘排穗褂。|当时宝玉穿着大红金蟒狐腋箭袖袍，外面罩着石青色貂皮排穗褂子。
袭人道：“你特为往这里来又换新服，他们就不问你往那去的？”|袭人说：“你特地到这里来，又换了新衣服，他们就不问你去哪里？”
宝玉笑道：“珍大爷那里去看戏换的。”|宝玉笑道：“是去珍大爷那里看戏换的。”
袭人点头。|袭人点点头。
又道：“坐一坐就回去罢，这个地方不是你来的。”|又说：“坐一会儿就回去吧，这地方不是你该来的。”
宝玉笑道：“你就家去才好呢，我还替你留著好东西呢。”|宝玉笑道：“你也该回家才好呢，我还替你留着好东西呢。”
袭人悄笑道：“悄悄的，叫他们听著什么意思。”|袭人小声笑道：“小声点，叫他们听见算什么。”
一面又伸手从宝玉项上将通灵玉摘了下来，向他姊妹们笑道：|一面又伸手把宝玉脖子上的通灵宝玉摘下来，对她的姐妹们笑道：
“你们见识见识。时常说起来都当希罕，恨不能一见，今儿可尽力瞧了。|“你们见识见识。平时说起来都当成稀罕东西，恨不得能看一眼，今天可以看个够了。
再瞧什么希罕物儿，也不过是这么个东西。”|再看什么稀罕东西，也不过就是这么个东西。”
说毕，递与他们传看了一遍，仍与宝玉挂好。|说完，递给她们传着看了一遍，又给宝玉挂好。
! 袭人为什么哭？下面才揭晓：家里要赎她出去。
! 当着家人的面摘下宝玉的玉，这份亲密，是袭人有意给家人看的：她在贾府的地位，不是一般丫鬟。

# 九、送宝玉回去
又命他哥哥去或雇一乘小轿，或雇一辆小车，送宝玉回去。|又叫她哥哥去雇一顶小轿或一辆小车，送宝玉回去。
花自芳道：“有我送去，骑马也不妨了。”|花自芳说：“有我送去，骑马也不要紧。”
袭人道：“不为不妨，为的是碰见人。”|袭人说：“不是要不要紧的事，是怕碰见人。”
花自芳忙去雇了一顶小轿来，众人也不敢相留，只得送宝玉出去，|花自芳连忙去雇了一顶小轿来，大家也不敢留，只好送宝玉出去。
袭人又抓果子与茗烟，又把些钱与他买花炮放，教他“不可告诉人，连你也有不是。”|袭人又抓了些果子给茗烟，又给了他些钱买花炮放，叮嘱他“不许告诉别人，不然连你也有错。”
一直送宝玉至门前，看著上轿，放下轿帘。|一直把宝玉送到门口，看着他上了轿，放下轿帘。
花，茗二人牵马跟随。|花自芳和茗烟牵着马跟在后面。
来至宁府街，茗烟命住轿，向花自芳道：|到了宁府那条街，茗烟叫停轿，对花自芳说：
“须等我同二爷还到东府里混一混，才好过去的，不然人家就疑惑了。”|“得等我和二爷还到东府里混一会儿，才好回去，不然别人会起疑心。”
花自芳听说有理，忙将宝玉抱出轿来，送上马去。|花自芳觉得有理，连忙把宝玉抱出轿子，送上马去。
宝玉笑说：“倒难为你了。”|宝玉笑着说：“倒难为你了。”
于是仍进后门来。|于是仍然从后门进去了。
俱不在话下。|这些都不多说。
! 袭人连封口费都想到了，处处周到。

# 十、李嬷嬷来了
却说宝玉自出了门，他房中这些丫鬟们都越性恣意的顽笑，|再说宝玉出门以后，他屋里的丫鬟们更加放开了玩笑，
也有赶围棋的，也有掷骰抹牌的，磕了一地瓜子皮。|有下围棋的，有掷骰子打牌的，嗑了一地的瓜子皮。
偏奶母李嬷嬷拄拐进来请安，瞧瞧宝玉，见宝玉不在家，丫鬟们只顾玩闹，十分看不过。|偏偏奶妈李嬷嬷拄着拐杖进来请安，看看宝玉，见宝玉不在家，丫鬟们只顾着玩闹，很看不过去。
因叹道：“只从我出去了，不大进来，你们越发没个样儿了，别的妈妈们越不敢说你们了。|就叹道：“自从我出去了，不大进来，你们越来越不像样了，别的妈妈们更不敢说你们了。
那宝玉是个丈八的灯台——照见人家，照不见自家的。|那宝玉是个一丈八尺高的灯台——照得见别人，照不见自己。
只知嫌人家脏，这是他的屋子，由著你们糟塌，越不成体统了。”|只知道嫌别人脏，这是他自己的屋子，由着你们糟蹋，越来越不成样子了。”
这些丫头们明知宝玉不讲究这些，二则李嬷嬷已是告老解事出去的了，如今管他们不著，|这些丫头们明知道宝玉不讲究这些，二来李嬷嬷已经告老退休出去了，现在管不着她们，
因此只顾顽，并不理他。|所以只顾着玩，不理她。
那李嬷嬷还只管问“宝玉如今一顿吃多少饭”，“什么时辰睡觉”等语。|那李嬷嬷还一个劲地问“宝玉现在一顿吃多少饭”“什么时候睡觉”这些话。
丫头们总胡乱答应。|丫头们都胡乱答应着。
有的说：“好一个讨厌的老货！”|有的说：“好一个讨厌的老东西！”
! 李嬷嬷是宝玉的奶妈，第八回她吃了宝玉留给晴雯的豆腐皮包子、喝了枫露茶，宝玉一怒之下摔了茶杯，还撵走了丫鬟茜雪。
! 一个退了休的老奶妈，在年轻丫鬟眼里已经是“讨厌的老货”。

# 十一、李嬷嬷吃了酥酪
李嬷嬷又问道：“这盖碗里是酥酪，怎不送与我去？我就吃了罢。”|李嬷嬷又问：“这盖碗里是酥酪，怎么不给我送去？我就吃了吧。”
说毕，拿匙就吃。|说完拿起勺子就吃。
一个丫头道：“快别动！那是说了给袭人留著的，回来又惹气了。|一个丫头说：“快别动！那是说好了给袭人留着的，回来又要惹他生气了。
你老人家自己承认，别带累我们受气。”|您老人家自己担着，别连累我们受气。”
李嬷嬷听了，又气又愧，便说道：|李嬷嬷听了，又气又羞，就说：
“我不信他这样坏了。别说我吃了一碗牛奶，就是再比这个值钱的，也是应该的。|“我不信他变得这么坏了。别说我吃了一碗牛奶，就是比这更值钱的，我也该吃。
难道待袭人比我还重？|难道他待袭人比待我还重？
难道他不想想怎么长大了？|难道他不想想自己是怎么长大的？
我的血变的奶，吃的长这么大，如今我吃他一碗牛奶，他就生气了？|是我的血变成的奶，把他喂到这么大，现在我吃他一碗牛奶，他就生气了？
我偏吃了，看怎么样！|我偏吃了，看能怎么样！
你们看袭人不知怎样，那是我手里调理出来的毛丫头，什么阿物儿！”|你们把袭人看得不知怎么样，那是我手里调教出来的毛丫头，算个什么东西！”
一面说，一面赌气将酥酪吃尽。|一边说，一边赌气把酥酪吃光了。
又一丫头笑道：“他们不会说话，怨不得你老人家生气。|又一个丫头笑道：“她们不会说话，难怪您老人家生气。
宝玉还时常送东西孝敬你老去，岂有为这个不自在的。”|宝玉还常常送东西孝敬您，哪会为这个不高兴。”
李嬷嬷道：“你们也不必妆狐媚子哄我，打量上次为茶撵茜雪的事我不知道呢。|李嬷嬷说：“你们也不用装模作样地哄我，以为上次为了茶撵走茜雪的事我不知道吗。
明儿有了不是，我再来领！”|明天要是有了不是，我再来领罪！”
说著，赌气去了。|说着赌气走了。
! “我的血变的奶”：李嬷嬷觉得自己有功，可在年轻人眼里，她只是个讨嫌的老人。她心里最不平的是袭人比她得宠。
! 第八回茜雪被撵，就是因为李嬷嬷喝了宝玉的枫露茶。李嬷嬷记着这笔账。

# 十二、袭人回来，替李嬷嬷遮掩
少时，宝玉回来，命人去接袭人。|过了一会儿，宝玉回来了，叫人去接袭人。
只见晴雯躺在床上不动，宝玉因问：“敢是病了？再不然输了？”|只见晴雯躺在床上不动，宝玉就问：“是病了？要不就是输了？”
秋纹道：“他倒是赢的，谁知李老太太来了，混输了，他气的睡去了。”|秋纹说：“她本来是赢的，谁知李老太太来了，搅得她输了，她气得睡去了。”
宝玉笑道：“你别和他一般见识，由他去就是了。”|宝玉笑道：“你别跟她一般见识，由她去吧。”
说著，袭人已来，彼此相见。|说着袭人已经回来了，大家见了面。
袭人又问宝玉何处吃饭，多早晚回来，又代母妹问诸同伴姊妹好。|袭人又问宝玉在哪里吃的饭，什么时候回来的，又替母亲妹妹问候各位姐妹好。
一时换衣卸妆。|一会儿换了衣服，卸了妆。
宝玉命取酥酪来，丫鬟们回说：“李奶奶吃了。”|宝玉叫人拿酥酪来，丫鬟们回说：“李奶奶吃了。”
宝玉才要说话，袭人便忙笑道：|宝玉刚要说话，袭人就连忙笑道：
“原来是留的这个，多谢费心。|“原来是留的这个，多谢你费心。
前儿我吃的时候好吃，吃过了好肚子疼，足闹的吐了才好。|前几天我吃的时候倒是好吃，吃完了肚子疼得厉害，一直闹到吐了才好。
他吃了倒好，搁在这里倒白糟塌了。|她吃了倒好，放在这里也是白白糟蹋了。
我只想风干栗子吃，你替我剥栗子，我去铺床。”|我只想吃风干栗子，你替我剥栗子，我去铺床。”
! 袭人一听就明白，马上编了个肚子疼的谎，把一场风波压下去。她怕宝玉又像撵茜雪那样闹起来。
! 晴雯输了钱就躺下生气，袭人回来就忙着息事宁人。两个大丫鬟的性子，一对比就出来了。

# 十三、穿红的女孩
宝玉听了信以为真，方把酥酪丢开，取栗子来，自向灯前检剥，|宝玉听了信以为真，这才不提酥酪了，拿来栗子，自己在灯下拣着剥，
一面见众人不在房里，乃笑问袭人道：“今儿那个穿红的是你什么人？”|一面见别人都不在屋里，就笑着问袭人：“今天那个穿红衣服的是你什么人？”
袭人道：“那是我两姨妹子。”|袭人说：“那是我的两姨表妹。”
宝玉听了，赞叹了两声。|宝玉听了，赞叹了两声。
袭人道：“叹什么？我知道你心里的缘故，想是说他那里配红的。”|袭人说：“叹什么？我知道你心里的意思，想必是说她哪里配穿红的。”
宝玉笑道：“不是，不是。那样的不配穿红的，谁还敢穿。|宝玉笑道：“不是，不是。要是那样的都不配穿红的，谁还敢穿。
我因为见他实在好的很，怎么也得他在咱们家就好了。”|我是因为见她实在太好了，要是她也能在咱们家就好了。”
袭人冷笑道：“我一个人是奴才命罢了，难道连我的亲戚都是奴才命不成？|袭人冷笑道：“我一个人是奴才命也就罢了，难道连我的亲戚都是奴才命不成？
定还要拣实在好的丫头才往你家来。”|一定还要挑实在好的女孩子到你家来当丫头。”
宝玉听了，忙笑道：“你又多心了。|宝玉听了，忙笑道：“你又多心了。
我说往咱们家来，必定是奴才不成？说亲戚就使不得？”|我说到咱们家来，就一定是当奴才吗？说是做亲戚就不行吗？”
袭人道：“那也搬配不上。”|袭人说：“那也高攀不上。”
宝玉便不肯再说，只是剥栗子。|宝玉就不肯再说了，只管剥栗子。
袭人笑道：“怎么不言语了？想是我才冒撞冲犯了你，明儿赌气花几两银子买他们进来就是了。”|袭人笑道：“怎么不说话了？想必是我刚才冒失冲撞了你，明天你赌气花几两银子把她们买进来就是了。”
宝玉笑道：“你说的话，怎么叫我答言呢。|宝玉笑道：“你说的这些话，叫我怎么接呢。
我不过是赞他好，正配生在这深堂大院里，没的我们这种浊物倒生在这里。”|我不过是夸她好，正配生在这深宅大院里，反倒是我们这种浊物生在这里了。”
袭人道：“他虽没这造化，倒也是娇生惯养的呢，我姨爹姨娘的宝贝。|袭人说：“她虽然没这福气，倒也是娇生惯养的，是我姨父姨母的宝贝。
如今十七岁，各样的嫁妆都齐备了，明年就出嫁。”|现在十七岁，各样嫁妆都备齐了，明年就出嫁。”
! 袭人说“奴才命”，话里有刺。她是卖身进来的，最敏感的就是这个身份。
! 宝玉说“我们这种浊物倒生在这里”，在他眼里，好女孩才配享富贵，他自己才是浊物。

# 十四、袭人说要走
宝玉听了“出嫁”二字，不禁又嗐了两声，正是不自在，|宝玉一听“出嫁”两个字，不由得又“嗐”了两声，正觉得不自在，
又听袭人叹道：“只从我来这几年，姊妹们都不得在一处。|又听袭人叹道：“自从我来这几年，姐妹们都不能在一起。
如今我要回去了，他们又都去了。”|现在我要回去了，她们又都要走了。”
宝玉听这话内有文章，不觉吃一惊，忙丢下栗子，问道：“怎么，你如今要回去了？”|宝玉听这话里有话，不由得吃了一惊，连忙丢下栗子问：“怎么，你要回去了？”
袭人道：“我今儿听见我妈和哥哥商议，叫我再耐烦一年，明年他们上来，就赎我出去的呢。”|袭人说：“我今天听见我妈和哥哥商量，叫我再忍耐一年，明年他们就来赎我出去。”
宝玉听了这话，越发怔了，因问：“为什么要赎你？”|宝玉听了这话，更是愣住了，就问：“为什么要赎你？”
袭人道：“这话奇了！|袭人说：“这话就奇怪了！
我又比不得是你这里的家生子儿，一家子都在别处，独我一个人在这里，怎么是个了局？”|我又不像那些你们家里世代为奴的，我一家人都在外面，只有我一个人在这里，这怎么是个了局？”
宝玉道：“我不叫你去也难。”|宝玉说：“我不让你走，你也难走。”
袭人道：“从来没这道理。|袭人说：“从来没有这个道理。
便是朝廷宫里，也有个定例，或几年一选，几年一入，也没有个长远留下人的理，别说你了！”|就是朝廷宫里，也有个规矩，几年一选、几年一放，也没有永远留人的道理，何况你呢！”
! 宝玉一听“出嫁”就不自在：女孩子出嫁，就从“珍珠”变成了“鱼眼睛”（第五十九回宝玉的话），他最怕女孩子们离开。
! 这一大段全是袭人设的局，下面作者自己揭穿。

# 十五、“去定了”
宝玉想一想，果然有理。|宝玉想了想，果然有道理。
又道：“老太太不放你也难。”|又说：“老太太不放你，你也难走。”
袭人道：“为什么不放？|袭人说：“为什么不放？
我果然是个最难得的，或者感动了老太太，老太太必不放我出去的，|我要真是个难得的人，也许能感动老太太，老太太一定不放我出去；
设或多给我们家几两银子，留下我，然或有之，|或者多给我们家几两银子把我留下，也许有这种可能；
其实我也不过是个平常的人，比我强的多而且多。|可其实我也不过是个平常人，比我强的人多得很。
自我从小儿来了，跟著老太太，先伏侍了史大姑娘几年，如今又伏侍了你几年。|我从小来了，跟着老太太，先伺候了史大姑娘几年，现在又伺候了你几年。
如今我们家来赎，正是该叫去的，只怕连身价也不要，就开恩叫我去呢。|现在我们家来赎，正是该让我走的时候，只怕连身价银子都不要，就开恩让我走呢。
若说为伏侍的你好，不叫我去，断然没有的事。|要说因为我伺候你伺候得好，就不让我走，那绝对没有的事。
那伏侍的好，是分内应当的，不是什么奇功。|伺候得好是分内应当的，不是什么大功劳。
我去了，仍旧有好的来了，不是没了我就不成事。”|我走了，还会有好的来，不是没了我就不行。”
宝玉听了这些话，竟是有去的理，无留的理，心内越发急了，因又道：|宝玉听了这些话，竟是只有走的理由、没有留的理由，心里更急了，又说：
“虽然如此说，我只一心留下你，不怕老太太不和你母亲说，多多给你母亲些银子，他也不好意思接你了，”|“虽然这么说，我只要一心留下你，不怕老太太不跟你母亲说，多给你母亲些银子，她也不好意思接你了。”
袭人道：“我妈自然不敢强。|袭人说：“我妈自然不敢硬来。
且漫说和他好说，又多给银子，就便不好和他说，一个钱也不给，安心要强留下我，他也不敢不依。|别说好好跟她说、再多给银子，就是不好好说，一个钱也不给，铁了心硬要留下我，她也不敢不依。
但只是咱们家从没干过这倚势杖贵霸道的事，|只是咱们家从来没干过这种仗势欺人、霸道的事，
这比不得别的东西，因为你喜欢，加十倍利弄了来给你，那卖的人不得吃亏，可以行得。|这不比别的东西，因为你喜欢，加十倍的价钱弄来给你，卖的人不吃亏，还行得通。
如今无故平空留下我，于你又无益，反叫我们骨肉分离，这件事，老太太，太太断不肯行的。”|现在无缘无故硬留下我，对你又没好处，反倒叫我们骨肉分离，这种事，老太太、太太是绝不肯做的。”
宝玉听了，思忖半晌，乃说道：“依你说，你是去定了？”|宝玉听了，想了半天，才说：“照你这么说，你是走定了？”
袭人道：“去定了。”|袭人说：“走定了。”
宝玉听了，自思道：“谁知这样一个人，这样薄情无义。”|宝玉听了，心想：“谁知道这样一个人，竟这样薄情无义。”
乃叹道：“早知道都是要去的，我就不该弄了来，临了剩我一个孤鬼儿。”|就叹道：“早知道都是要走的，我就不该把你们弄来，到头来剩下我一个孤魂野鬼。”
说著，便赌气上床睡去了。|说着就赌气上床睡了。
! 袭人一层层把宝玉的退路都堵死，说得滴水不漏，这份口才和心机，宝玉哪里是对手。
! 宝玉说“临了剩我一个孤鬼儿”：他最怕的就是散，大观园里的人最后一个个散尽，正应了他这份恐惧。

# 十六、袭人其实不想走
原来袭人在家，听见他母兄要赎他回去，他就说至死也不回去的。|原来袭人在家里，听见母亲和哥哥要赎她回去，她就说死也不回去。
又说：“当日原是你们没饭吃，就剩我还值几两银子，若不叫你们卖，没有个看著老子娘饿死的理。|又说：“当初是你们没饭吃，就剩我还值几两银子，要是不让你们卖，总不能眼看着爹娘饿死。
如今幸而卖到这个地方，吃穿和主子一样，也不朝打暮骂。|现在幸好卖到这个地方，吃的穿的和主子一样，也不会早上挨打晚上挨骂。
况且如今爹虽没了，你们却又整理的家成业就，复了元气。|况且现在爹虽然没了，你们却又把家业整顿起来了，恢复了元气。
若果然还艰难，把我赎出来，再多掏澄几个钱，也还罢了，其实又不难了。|要是家里还艰难，把我赎出来再卖几个钱，也还说得过去，可其实家里又不困难了。
这会子又赎我作什么？权当我死了，再不必起赎我的念头！”|这会儿又赎我做什么？就当我死了，再也不要起赎我的念头！”
因此哭闹了一阵。|因此哭闹了一场。
他母兄见他这般坚执，自然必不出来的了。|她母亲和哥哥见她这样坚决，自然知道她是一定不肯出来的了。
况且原是卖倒的死契，明仗著贾宅是慈善宽厚之家，不过求一求，只怕身价银一并赏了这是有的事呢。|况且当初签的是卖断的死契，他们不过是仗着贾家是慈善宽厚的人家，求一求，说不定连身价银都赏了，这也是有的事。
二则，贾府中从不曾作践下人，只有恩多威少的。|二来，贾府从来不糟蹋下人，恩惠多、威严少。
且凡老少房中所有亲侍的女孩子们，更比待家下众人不同，平常寒薄人家的小姐，也不能那样尊重的。|而且凡是老少主子房里贴身伺候的女孩子们，待遇更和一般下人不同，平常穷苦人家的小姐，也没有那样体面。
因此，他母子两个也就死心不赎了。|因此，她母子俩也就死了心不赎了。
次后忽然宝玉去了，他二人又是那般景况，他母子二人心下更明白了，|后来宝玉忽然去了，他俩又是那样亲密的情形，她母子二人心里就更明白了，
越发石头落了地，而且是意外之想，彼此放心，再无赎念了。|更是一块石头落了地，而且是意外之喜，彼此都放心了，再也没有赎她的念头了。
! 原来袭人在家刚刚哭过一场，就是为了不肯被赎出去。她是贾府里的“半个主子”，回家反而是做穷人家的女儿。
! 宝玉一来，袭人家里就“更明白了”：袭人将来是要做宝玉的姨娘的。袭人在家里那些亲密举动，原是做给他们看的。

# 十七、袭人的“箴规”
如今且说袭人自幼见宝玉性格异常，其淘气憨顽自是出于众小儿之外，更有几件千奇百怪口不能言的毛病儿。|再说袭人从小看宝玉性格与众不同，淘气憨顽比一般小孩厉害得多，更有几样千奇百怪、说不出口的毛病。
近来仗著祖母溺爱，父母亦不能十分严紧拘管，更觉放荡弛纵，任性恣情，最不喜务正。|近来仗着祖母溺爱，父母也不能十分严格管束，更加放纵，任性胡来，最不喜欢做正经事。
每欲劝时，料不能听，今日可巧有赎身之论，故先用骗词，以探其情，以压其气，然后好下箴规。|袭人每次想劝，料想他不会听，今天正好有赎身这件事，就先用假话来试探他的心意、压一压他的气焰，然后好劝诫他。
今见他默默睡去了，知其情有不忍，气已馁堕，|现在见他默默地睡了，就知道他舍不得自己，气势已经泄了。
自己原不想栗子吃的，只因怕为酥酪又生事故，亦如茜雪之茶等事，是以假以栗子为由，混过宝玉不提就完了。|她本来并不想吃栗子，只是怕为了酥酪又闹出事来，像茜雪那次为了茶一样，所以借栗子为由，把宝玉岔开，不提就完了。
于是命小丫头们将栗子拿去吃了，自己来推宝玉。|于是叫小丫头们把栗子拿去吃了，自己来推宝玉。
只见宝玉泪痕满面，袭人便笑道：“这有什么伤心的，你果然留我，我自然不出去了。”|只见宝玉满脸泪痕，袭人就笑道：“这有什么好伤心的，你要真想留我，我自然就不走了。”
宝玉见这话有文章，便说道”“你倒说说，我还要怎么留你，我自己也难说了。”|宝玉见这话里有话，就说：“你倒说说，我还要怎么留你，我自己也说不出来了。”
袭人笑道：“咱们素日好处，再不用说。|袭人笑道：“咱们平时的好处，就不用说了。
但今日你安心留我，不在这上头。|可今天你要真心留我，不在这上头。
我另说出两三件事来，你果然依了我，就是你真心留我了，刀搁在脖子上，我也是不出去的了。”|我另外说出两三件事来，你要真依了我，就是真心留我了，就算刀架在脖子上，我也不出去了。”
! 作者把袭人的心思写得明明白白：“先用骗词，以探其情，以压其气，然后好下箴规”。这就是回目“情切切良宵花解语”的“花解语”。
! 袭人姓花，“花解语”是说她像一朵懂人话的花。可这朵花的话里，全是算计。

# 十八、“化成一股轻烟”
宝玉忙笑道：“你说，那几件？我都依你。|宝玉忙笑道：“你说，哪几件？我都依你。
好姐姐，好亲姐姐别说两三件，就是两三百件，我也依。|好姐姐，好亲姐姐，别说两三件，就是两三百件，我也依。
只求你们同看著我，守著我，等我有一日化成了飞灰，|只求你们一起看着我、守着我，等我哪一天化成了飞灰，
——飞灰还不好，灰还有形有迹，还有知识。|——飞灰还不好，灰还有形有迹，还有知觉。
——等我化成一股轻烟，风一吹便散了的时候，你们也管不得我，我也顾不得你们了。|——等我化成一股轻烟，风一吹就散了的时候，你们也管不了我，我也顾不上你们了。
那时凭我去，我也凭你们爱那里去就去了。”|那时随我去哪里，我也随你们爱去哪里就去哪里。”
话未说完，急的袭人忙握他的嘴，说：“好好的，正为劝你这些，倒更说的狠了。”|话还没说完，急得袭人连忙捂住他的嘴，说：“好好的，正是要劝你这些，你倒说得更厉害了。”
宝玉忙说道：“再不说这话了。”|宝玉连忙说：“再也不说这种话了。”
袭人道：“这是头一件要改的。”|袭人说：“这是头一件要改的。”
宝玉道：“改了，再要说，你就拧嘴。还有什么？”|宝玉说：“改了，再要说，你就拧我的嘴。还有什么？”
! “化成一股轻烟，风一吹便散了”：这是宝玉对死亡的想象，也是全书的结局，“落了片白茫茫大地真干净”。
! 宝玉要的只是女孩子们守着他，等他死。这是他心里最深的愿望，也是最不可能实现的。

# 十九、第二件：读书
袭人道：“第二件，你真喜读书也罢，假喜也罢，只是在老爷跟前或在别人跟前，你别只管批驳诮谤，|袭人说：“第二件，你真喜欢读书也好，假喜欢也好，只是在老爷面前或在别人面前，你别只管批评讥讽，
只作出个喜读书的样子来，也教老爷少生些气，在人前也好说嘴。|只要做出个喜欢读书的样子来，也叫老爷少生些气，在别人面前也好说话。
他心里想著，我家代代读书，只从有了你，不承望你不喜读书，已经他心里又气又愧了。|他心里想着，我家世代读书，自从有了你，没想到你不喜欢读书，他心里已经又气又羞了。
而且背前背后乱说那些混话，凡读书上进的人，你就起个名字叫作‘禄蠹’，|而且你当面背后乱说那些混话，凡是读书上进的人，你就给起个名字叫‘禄蠹’（贪图官禄的蛀虫），
又说只除‘明明德’外无书，都是前人自己不能解圣人之书，便另出己意，混编纂出来的。|又说除了‘明明德’以外就没有书了，别的都是前人自己读不懂圣人的书，就另外加上自己的意思胡乱编出来的。
这些话，怎么怨得老爷不气，不时时打你。叫别人怎么想你？”|这些话，怎么能怪老爷生气、不时打你？叫别人怎么看你？”
宝玉笑道：“再不说了，那原是小时不知天高地厚，信口胡说，如今再不敢说了。还有什么？”|宝玉笑道：“再也不说了，那本来是小时候不知天高地厚，随口胡说的，现在再不敢说了。还有什么？”
! “禄蠹”是宝玉发明的词，专骂那些读书只为做官的人。这个词说出了宝玉最核心的态度：他不反对读书，他反对把读书当成升官发财的工具。
! “明明德”出自《大学》开篇。宝玉只认这一句，等于说后人的注解全是歪曲。这在当时是离经叛道的话。

# 二十、第三件：胭脂
袭人道：“再不可毁僧谤道，调脂弄粉。|袭人说：“再不能诋毁和尚道士，摆弄胭脂水粉。
还有更要紧的一件，再不许吃人嘴上擦的胭脂了，与那爱红的毛病儿。”|还有更要紧的一件，再不许吃人家嘴上擦的胭脂了，还有那爱红的毛病。”
宝玉道：“都改，都改。再有什么，快说。”|宝玉说：“都改，都改。还有什么，快说。”
袭人笑道：“再也没有了。只是百事检点些，不任意任情的就是了。|袭人笑道：“再也没有了。只要凡事检点一些，不任性胡来就行了。
你若果都依了，便拿八人轿也抬不出我去了。”|你要是都依了，就是拿八人大轿来抬，也抬不走我了。”
宝玉笑道：“你在这里长远了，不怕没八人轿你坐。”|宝玉笑道：“你在这里待久了，不怕没有八人大轿给你坐。”
袭人冷笑道：“这我可不希罕的。|袭人冷笑道：“这我可不稀罕。
有那个福气，没有那个道理。纵坐了，也没甚趣。”|就算有那个福气，也没有那个道理。就算坐上了，也没什么意思。”
! 宝玉的“爱红”毛病从小就有，第二回冷子兴说他周岁抓周就抓了脂粉钗环，第二十一回还要偷吃胭脂。
! 宝玉说“不怕没八人轿你坐”，意思是将来让她做姨娘。袭人嘴上说“不希罕”，“没有那个道理”，其实这正是她心里最想要的。

# 二十一、袭人病了
二人正说著，只见秋纹走进来，说：“快三更了，该睡了。|两人正说着，只见秋纹走进来说：“快三更了，该睡了。
方才老太太打发嬷嬷来问，我答应睡了。”|刚才老太太派嬷嬷来问，我回答说睡了。”
宝玉命取表来看时，果然针已指到亥正，方从新盥漱，宽衣安歇，不在话下。|宝玉叫人拿表来一看，果然指针已经指到亥正（晚上十点），这才重新洗漱，脱衣睡下，这里不多说。
至次日清晨，袭人起来，便觉身体发重，头疼目胀，四肢火热。|到了第二天清早，袭人起来，就觉得身子沉重，头疼眼胀，四肢发热。
先时还挣扎的住，次后捱不住，只要睡著，因而和衣躺在炕上。|开始还撑得住，后来撑不住了，只想睡，就穿着衣服躺在炕上。
宝玉忙回了贾母，传医诊视，说道：“不过偶感风寒，吃一两剂药疏散疏散就好了。”|宝玉连忙禀告贾母，请医生来看，医生说：“不过偶然受了风寒，吃一两剂药发散发散就好了。”
开方去后，令人取药来煎好，刚服下去，命他盖上被渥汗，宝玉自去黛玉房中来看视。|开了方子走了以后，叫人取药来煎好，刚喝下去，叫她盖上被子捂汗，宝玉自己到黛玉屋里去看她。
! 回目上半句“情切切良宵花解语”写完了，下半句“意绵绵静日玉生香”是写黛玉的。袭人一病，宝玉就去了潇湘馆，作者用这个转得自然。

# 二十二、黛玉午睡
彼时黛玉自在床上歇午，丫鬟们皆出去自便，满屋内静悄悄的，|这时黛玉在床上睡午觉，丫鬟们都出去自便了，满屋子静悄悄的。
宝玉揭起绣线软帘，进入里间，只见黛玉睡在那里，忙走上来推他道：|宝玉掀起绣花软帘，走进里间，只见黛玉在那里睡着，连忙走上前推她说：
“好妹妹，才吃了饭，又睡觉。”|“好妹妹，刚吃了饭，又睡觉。”
将黛玉唤醒。|把黛玉叫醒了。
黛玉见是宝玉，因说道：“你且出去逛逛。我前儿闹了一夜，今儿还没有歇过来，浑身酸疼。”|黛玉见是宝玉，就说：“你先出去逛逛。我前天闹了一夜，今天还没歇过来，浑身酸疼。”
宝玉道：“酸疼事小，睡出来的病大。我替你解闷儿，混过困去就好了。”|宝玉说：“酸疼事小，睡出病来事大。我陪你解解闷，把困劲混过去就好了。”
黛玉只合著眼，说道：“我不困，只略歇歇儿，你且别处去闹会子再来。”|黛玉只闭着眼睛说：“我不困，只是稍微歇一歇，你先到别处去闹一会儿再来。”
宝玉推他道：“我往那去呢，见了别人就怪腻的。”|宝玉推她说：“我去哪里呢，见了别人就烦得很。”
! “见了别人就怪腻的”：宝玉在哪里都待不住，只有在黛玉这里才安心。
! 黛玉“前儿闹了一夜”，指元宵省亲那一夜。

# 二十三、一个枕头
黛玉听了，嗤的一声笑道：“你既要在这里，那边去老老实实的坐著，咱们说话儿。”|黛玉听了，“嗤”的一声笑道：“你既然要在这里，就到那边老老实实坐着，咱们说说话。”
宝玉道：“我也歪著。”|宝玉说：“我也要躺着。”
黛玉道：“你就歪著。”|黛玉说：“那你就躺着。”
宝玉道：“没有枕头，咱们在一个枕头上。”|宝玉说：“没有枕头，咱们枕一个枕头吧。”
黛玉道：“放屁！外头不是枕头？拿一个来枕著。”|黛玉说：“放屁！外面不是有枕头？拿一个来枕着。”
宝玉出至外间，看了一看，回来笑道：“那个我不要，也不知是那个脏婆子的。”|宝玉走到外间看了看，回来笑道：“那个我不要，也不知道是哪个脏婆子的。”
黛玉听了，睁开眼，起身笑道：“真真你就是我命中的‘天魔星’！请枕这一个。”|黛玉听了，睁开眼，起身笑道：“你真是我命中的‘天魔星’！请枕这一个吧。”
说著，将自己枕的推与宝玉，又起身将自己的再拿了一个来，自己枕了，二人对面倒下。|说着把自己枕的推给宝玉，又起身另外拿了一个自己的来枕上，两人面对面躺下了。
! 两小无猜，同榻而卧，作者写得干干净净，没有一丝邪念。这和前面茗烟在书房里的事，正好一俗一雅、一浊一清。
! “天魔星”：黛玉嘴上嫌他，心里是认了命。

# 二十四、腮上的胭脂
黛玉因看见宝玉左边腮上有钮扣大小的一块血渍，便欠身凑近前来，以手抚之细看，|黛玉看见宝玉左边脸颊上有纽扣大小一块血红的印子，就欠起身凑近，用手摸着仔细看，
又道：“这又是谁的指甲刮破了？”|又说：“这又是被谁的指甲刮破了？”
宝玉侧身，一面躲，一面笑道：“不是刮的，只怕是才刚替他们淘漉胭脂膏子，蹭上了一点儿。”|宝玉侧过身，一边躲一边笑道：“不是刮的，只怕是刚才替她们淘洗过滤胭脂膏子，蹭上了一点。”
说著，便找手帕子要揩拭。|说着就找手帕要擦。
黛玉便用自己的帕子替他揩拭了，口内说道：|黛玉就用自己的手帕替他擦了，嘴里说：
“你又干这些事了。干也罢了，必定还要带出幌子来。|“你又干这些事了。干也就罢了，偏还要留下个记号来。
便是舅舅看不见，别人看见了，又当奇事新鲜话儿去学舌讨好儿，吹到舅舅耳朵里，又该大家不干净惹气。”|就算舅舅看不见，别人看见了，又当成新鲜事去学舌讨好，传到舅舅耳朵里，又要大家不得安生、惹一场气了。”
! 昨晚袭人刚要他改掉“调脂弄粉”的毛病，他转身就“替他们淘漉胭脂膏子”。
! 袭人劝他改，黛玉只劝他别被人看见。黛玉从不劝宝玉“上进”，她懂他，所以宝玉说“林妹妹从不说这些混帐话”（第三十二回）。

# 二十五、奇香
宝玉总未听见这些话，只闻得一股幽香，却是从黛玉袖中发出，闻之令人醉魂酥骨。|宝玉一点也没听进这些话，只闻到一股幽香，是从黛玉袖子里发出来的，闻着叫人魂醉骨酥。
宝玉一把便将黛玉的袖子拉住，要瞧笼著何物。|宝玉一把拉住黛玉的袖子，要看里面藏着什么东西。
黛玉笑道：“冬寒十月，谁带什么香呢。”|黛玉笑道：“这样冷的天，谁带什么香呢。”
宝玉笑道：“既然如此，这香是那里来的？”|宝玉笑道：“既然这样，这香是从哪里来的？”
黛玉道：“连我也不知道。|黛玉说：“连我也不知道。
想必是柜子里头的香气，衣服上熏染的也未可知。”|想必是柜子里的香气，熏到衣服上了也说不定。”
宝玉摇头道：“未必，这香的气味奇怪，不是那些香饼子，香球子，香袋子的香。”|宝玉摇头说：“未必，这香味很奇怪，不是那些香饼子、香球子、香袋子的香。”
黛玉冷笑道：“难道我也有什么‘罗汉’‘真人’给我些香不成？|黛玉冷笑道：“难道我也有什么‘罗汉’‘真人’给我些香不成？
便是得了奇香，也没有亲哥哥亲兄弟弄了花儿，朵儿，霜儿，雪儿替我炮制。|就算得了奇香，也没有亲哥哥亲兄弟弄些花儿、朵儿、霜儿、雪儿替我配制。
我有的是那些俗香罢了。”|我有的不过是些俗香罢了。”
! 黛玉身上的香是天生的，这就是回目的“玉生香”。
! “罗汉”“真人”“花儿朵儿霜儿雪儿”是在讽刺宝钗：第七回宝钗说她吃的“冷香丸”是一个和尚给的方子，要用春夏秋冬四季的花蕊和雨露霜雪配制。黛玉说自己没有“亲哥哥”帮忙，又是在刺薛蟠。

# 二十六、“冷香”和“暖香”
宝玉笑道：“凡我说一句，你就拉上这么些，不给你个利害，也不知道，从今儿可不饶你了。|宝玉笑道：“我每说一句，你就扯上这么多，不给你点厉害瞧瞧，你也不知道，从今天起可不饶你了。
说著翻身起来，将两只手呵了两口，便伸手向黛玉膈肢窝内两肋下乱挠。|说着翻身起来，往两只手上呵了两口气，就伸手到黛玉的胳肢窝和两肋下乱挠。
黛玉素性触痒不禁，宝玉两手伸来乱挠，便笑的喘不过气来，|黛玉向来最怕痒，宝玉两只手伸过来乱挠，她就笑得喘不过气来，
口里说：“宝玉，你再闹，我就恼了。”|嘴里说：“宝玉，你再闹，我就生气了。”
宝玉方住了手，笑问道：“你还说这些不说了？”|宝玉这才住手，笑着问：“你还说这些不说了？”
黛玉笑道：“再不敢了。”|黛玉笑道：“再也不敢了。”
一面理鬓笑道：“我有奇香，你有‘暖香’没有？”|一边理着鬓发笑道：“我有奇香，你有‘暖香’没有？”
宝玉见问，一时解不来，因问：“什么‘暖香’？”|宝玉见她问，一时没明白，就问：“什么‘暖香’？”
黛玉点头叹笑道：“蠢才，蠢才！|黛玉点头叹着笑道：“蠢才，蠢才！
你有玉，人家就有金来配你，人家有‘冷香’，你就没有‘暖香’去配？”|你有玉，人家就有金来配你；人家有‘冷香’，你就没有‘暖香’去配吗？”
宝玉方听出来。|宝玉这才听出来。
宝玉笑道：“方才求饶，如今更说狠了。”|宝玉笑道：“刚才求饶，现在说得更厉害了。”
说著，又去伸手。|说着又要伸手。
黛玉忙笑道：“好哥哥，我可不敢了。”|黛玉忙笑道：“好哥哥，我可不敢了。”
宝玉笑道：“饶便饶你，只把袖子我闻一闻。”|宝玉笑道：“饶你可以，只把袖子给我闻一闻。”
说著，便拉了袖子笼在面上，闻个不住。|说着就把她的袖子拉过来罩在脸上，闻个不停。
黛玉夺了手道：“这可该去了。”|黛玉抽回手说：“这下可该走了。”
宝玉笑道：“去，不能。咱们斯斯文文的躺著说话儿。”|宝玉笑道：“走，不行。咱们斯斯文文地躺着说话。”
说著，复又倒下。|说着又躺下了。
黛玉也倒下。用手帕子盖上脸。|黛玉也躺下，用手帕盖上脸。
宝玉有一搭没一搭的说些鬼话，黛玉只不理。|宝玉有一句没一句地说些胡话，黛玉只是不理他。
宝玉问他几岁上京，路上见何景致古迹，扬州有何遗迹故事，土俗民风。|宝玉问她几岁进的京，路上见过什么景致古迹，扬州有什么遗迹故事、风土人情。
黛玉只不答。|黛玉只是不回答。
! “你有玉，人家就有金来配你”：这是全书第一次由黛玉亲口说出“金玉”二字。她心里最在意、最怕的，就是宝钗的金锁和宝玉的玉，那“金玉良缘”的说法。
! 一个“冷香”，一个“暖香”，黛玉随口一句玩笑，却把钗黛之间的心结说透了。

# 二十七、香芋和香玉
宝玉只怕他睡出病来，便哄他道：“嗳哟！你们扬州衙门里有一件大故事，你可知道？”|宝玉怕她睡出病来，就哄她说：“哎哟！你们扬州衙门里有一件大事，你知道吗？”
黛玉见他说的郑重，且又正言厉色，只当是真事，因问：“什么事？”|黛玉见他说得郑重，又一本正经的，以为是真事，就问：“什么事？”
宝玉见问，便忍著笑顺口诌道：“扬州有一座黛山。山上有个林子洞。”|宝玉见她问，就忍着笑随口编道：“扬州有一座黛山，山上有个林子洞。”
黛玉笑道：“就是扯谎，自来也没听见这山。”|黛玉笑道：“这就是扯谎，从来没听说过这座山。”
宝玉道：“天下山水多著呢，你那里知道这些不成。等我说完了，你再批评。”|宝玉说：“天下的山水多着呢，你哪里都知道。等我说完了你再批评。”
黛玉道：“你且说。”|黛玉说：“那你说。”
宝玉又诌道：“林子洞里原来有群耗子精。|宝玉又编道：“林子洞里原来有一群老鼠精。
那一年腊月初七日，老耗子升座议事，|那一年腊月初七，老老鼠升座议事，
因说：‘明日乃是腊八，世上人都熬腊八粥。|说：‘明天是腊八，世上的人都熬腊八粥。
如今我们洞中果品短少，须得趁此打劫些来方妙。’|现在我们洞里果品短缺，得趁这个机会抢些来才好。’
乃拔令箭一枝，遣一能干的小耗前去打听。|就拔了一支令箭，派一只能干的小老鼠去打听。
一时小耗回报：‘各处察访打听已毕，惟有山下庙里果米最多。’|一会儿小老鼠回来报告：‘各处都打听过了，只有山下庙里的果子和米最多。’
老耗问：“米有几样？果有几品？’|老老鼠问：‘米有几样？果子有几种？’
小耗道：‘米豆成仓，不可胜记。|小老鼠说：‘米和豆子堆满了仓，数也数不清。
果品有五种：一红枣，二栗子，三落花生，四菱角，五香芋。’|果子有五种：一红枣，二栗子，三花生，四菱角，五香芋。’
老耗听了大喜，即时点耗前去。|老老鼠听了大喜，马上点派老鼠前去。
乃拔令箭问：‘谁去偷米？’|就拔令箭问：‘谁去偷米？’
一耗便接令去偷米。|一只老鼠就接了令去偷米。
又拔令箭问：‘谁去偷豆？’|又拔令箭问：‘谁去偷豆？’
又一耗接令去偷豆。|又一只老鼠接了令去偷豆。
然后一一的都各领令去了。|然后一个个都领了令去了。
只剩了香芋一种，因又拔令箭问：‘谁去偷香芋？’|只剩下香芋一种，又拔令箭问：‘谁去偷香芋？’
只见一个极小极弱的小耗应道：‘我愿去偷香芋。’|只见一只又小又弱的小老鼠应道：‘我愿意去偷香芋。’
老耗并众耗见他这样，恐不谙练，且怯懦无力，都不准他去。|老老鼠和众老鼠见它这样，怕它不熟练，又胆小没力气，都不准它去。
小耗道：“我虽年小身弱，却是法术无边，口齿伶俐，机谋深远。|小老鼠说：‘我虽然年纪小、身子弱，可是法术无边，口齿伶俐，计谋深远。
此去管比他们偷的还巧呢。’|这一去保管比他们偷得还巧。’
众耗忙问：‘如何比他们巧呢？’|众老鼠忙问：‘怎么比他们巧呢？’
小耗道：“我不学他们直偷。|小老鼠说：‘我不学他们直接去偷。
我只摇身一变，也变成个香芋，滚在香芋堆里，使人看不出，听不见，却暗暗的用分身法搬运，渐渐的就搬运尽了。|我只要摇身一变，也变成一个香芋，滚到香芋堆里，叫人看不出、听不见，却暗地里用分身法搬运，慢慢地就搬光了。
岂不比直偷硬取的巧些？’|岂不比直接去偷去抢巧妙些？’
众耗听了，都道：‘妙却妙，只是不知怎么个变法，你先变个我们瞧瞧。’|众老鼠听了，都说：‘妙是妙，只是不知道怎么变，你先变一个给我们看看。’
小耗听了，笑道：‘这个不难，等我变来。’|小老鼠听了，笑道：‘这不难，等我变来。’
说毕，摇身说‘变’，竟变了一个最标致美貌的一位小姐。|说完摇身一变，竟变成了一位最标致美貌的小姐。
众耗忙笑道：‘变错了，变错了。原说变果子的，如何变出小姐来？’|众老鼠忙笑道：‘变错了，变错了。说好了变果子的，怎么变出个小姐来？’
小耗现形笑道：‘我说你们没见世面，只认得这果子是香芋，却不知盐课林老爷的小姐才是真正的香玉呢。’”|小老鼠现出原形，笑道：‘我说你们没见过世面，只认得这果子是香芋，却不知道盐课林老爷的小姐才是真正的香玉呢。’”
! 宝玉编故事逗黛玉：“黛山”“林子洞”藏着她的名字，“香芋”谐音“香玉”，说她身上的香，又说她是那只最小最弱、却最聪明的小耗子。
! 这是全书最轻快、最甜的一段。宝玉的心思全用在哄黛玉开心上。

# 二十八、宝钗来了
黛玉听了，翻身爬起来，按著宝玉笑道：“我把你烂了嘴的！我就知道你是编我呢。”|黛玉听了，翻身爬起来，按住宝玉笑道：“我撕烂你这张嘴！我就知道你是在编排我。”
说著，便拧的宝玉连连央告，说：“好妹妹，饶我罢，再不敢了！|说着就拧他，拧得宝玉连连求饶，说：“好妹妹，饶了我吧，再也不敢了！
我因为闻你香，忽然想起这个故典来。”|我是因为闻到你身上的香，忽然想起这个典故来的。”
黛玉笑道：“饶骂了人，还说是故典呢。”|黛玉笑道：“骂了人，还说是典故呢。”
一语未了，只见宝钗走来，笑问：“谁说故典呢？我也听听。”|话还没说完，只见宝钗走进来，笑着问：“谁在说典故呢？我也听听。”
黛玉忙让坐，笑道：“你瞧瞧，有谁！他饶骂了人，还说是故典。”|黛玉连忙让座，笑道：“你看看，还有谁！他骂了人，还说是典故。”
宝钗笑道：“原来是宝兄弟，怨不得他，他肚子里的故典原多。|宝钗笑道：“原来是宝兄弟，怪不得，他肚子里的典故本来就多。
只是可惜一件，凡该用故典之时，他偏就忘了。|只是可惜一件，凡是该用典故的时候，他偏偏就忘了。
有今日记得的，前儿夜里的芭蕉诗就该记得。|今天记得这么清楚，前天夜里那首芭蕉诗就该记得了。
眼面前的倒想不起来，别人冷的那样，你急的只出汗。|眼前的典故倒想不起来，别人冷成那样，你急得直冒汗。
这会子偏又有记性了。”|这会儿偏偏又有记性了。”
黛玉听了笑道：“阿弥陀佛！到底是我的好姐姐，你一般也遇见对子了。|黛玉听了笑道：“阿弥陀佛！到底是我的好姐姐，你也碰上对手了。
可知一还一报，不爽不错的。”|可见是一报还一报，一点也不差。”
刚说到这里，只听宝玉房中一片声嚷，吵闹起来。|刚说到这里，只听宝玉房里一片嚷嚷，吵闹起来了。
正是——|正是——
~情切切良宵花解语，意绵绵静日玉生香。|良宵里，情意恳切，袭人这朵花说出了劝诫的话；静日里，情意绵绵，黛玉这块玉散发出幽香。
! 宝钗一来，二人独处的时光就结束了。宝钗提起“绿蜡”那件事，黛玉还不知道，可宝钗说的是她和宝玉之间的小秘密。
! “别人冷的那样”指元春省亲那夜，宝钗记得一清二楚。
! 宝玉房里吵起来，是李嬷嬷又来闹了，下一回接着写。
</script>

<script type="text/plain" id="ch20">
# 一、李嬷嬷又闹起来
话说宝玉在林黛玉房中说“耗子精”，宝钗撞来，讽刺宝玉元宵不知“绿蜡”之典，三人正在房中互相讥刺取笑。|宝玉在林黛玉房里讲“耗子精”，宝钗走进来，取笑宝玉元宵节那晚不知道“绿蜡”的典故，三个人正在房里互相打趣取笑。
那宝玉正恐黛玉饭后贪眠，一时存了食，或夜间走了困，皆非保养身体之法，|宝玉正怕黛玉吃了饭就贪睡，一来容易积食，二来夜里又会睡不着，都不是保养身体的办法，
幸而宝钗走来，大家谈笑，那林黛玉方不欲睡，自己才放了心。|幸好宝钗来了，大家说说笑笑，林黛玉才不想睡了，他这才放了心。
忽听他房中嚷起来，大家侧耳听了一听，林黛玉先笑道：|忽然听见他房里嚷起来，大家侧着耳朵听了听，林黛玉先笑道：
“这是你妈妈和袭人叫嚷呢。|“这是你奶妈在跟袭人吵呢。
那袭人也罢了，你妈妈再要认真排场他，可见老背晦了。”|那袭人也就罢了，你奶妈要是还认真教训她，可见是老糊涂了。”
宝玉忙要赶过来，宝钗忙一把拉住道：|宝玉连忙要赶过去，宝钗一把拉住他说：
“你别和你妈妈吵才是，他老糊涂了，倒要让他一步为是。”|“你可别和你奶妈吵，她老糊涂了，倒该让她一步才是。”
宝玉道：“我知道了。”|宝玉说：“我知道了。”
! 上一回编耗子精，宝玉其实是怕黛玉睡出病来。他对黛玉的体贴，都藏在玩笑里。
! 黛玉一听就知道是谁在吵，宝钗却先拉住宝玉劝他让步。两人的反应，一个机敏，一个周全。

# 二、李嬷嬷骂袭人
说毕走来，只见李嬷嬷拄著拐棍，在当地骂袭人：|说完走过来，只见李嬷嬷拄着拐杖，站在屋子当中骂袭人：
“忘了本的小娼妇！我抬举起你来，这会子我来了，你大模大样的躺在炕上，见我来也不理一理。|“忘了本的小娼妇！是我把你抬举起来的，这会儿我来了，你大模大样地躺在炕上，见我来也不理一理。
一心只想妆狐媚子哄宝玉，哄的宝玉不理我，听你们的话。|一心只想装狐狸精哄宝玉，哄得宝玉不理我，只听你们的话。
你不过是几两臭银子买来的毛丫头，这屋里你就作耗，如何使得！|你不过是几两臭银子买来的毛丫头，在这屋里作威作福，怎么行！
好不好拉出去配一个小子，看你还妖精似的哄宝玉不哄！”|干脆拉出去配一个小厮，看你还像妖精似的哄宝玉不哄！”
袭人先只道李嬷嬷不过为他躺著生气，少不得分辨说“病了，才出汗，蒙著头，原没看见你老人家”等语。|袭人起先只当李嬷嬷不过是因为她躺着生气，只好分辩说“病了，刚出了汗，蒙着头，没看见您老人家”这些话。
后来只管听他说“哄宝玉”，“妆狐媚”，又说“配小子”等，由不得又愧又委屈，禁不住哭起来。|后来只听她一个劲地说“哄宝玉”“装狐狸精”，又说“配小厮”，不由得又羞又委屈，忍不住哭起来。
! 李嬷嬷骂的是袭人，气的其实是宝玉不再亲近她。她把“失宠”的怨气，全撒在了最得宠的丫鬟身上。
! “拉出去配一个小子”是对丫鬟最狠的话，等于要毁了她的前程。

# 三、宝玉替袭人分辩
宝玉虽听了这些话，也不好怎样，少不得替袭人分辨病了吃药等话，又说：“你不信，只问别的丫头们。”|宝玉虽然听了这些话，也不好怎么样，只好替袭人分辩说她病了、在吃药，又说：“你不信，就问别的丫头们。”
李嬷嬷听了这话，益发气起来了，说道：|李嬷嬷听了这话，更生气了，说：
“你只护著那起狐狸，那里认得我了，叫我问谁去？|“你只护着那些狐狸精，哪里还认得我，叫我去问谁？
谁不帮著你呢，谁不是袭人拿下马来的！我都知道那些事。|谁不帮着你？谁不是被袭人收服了的！那些事我都知道。
我只和你在老太太，太太跟前去讲了。|我只跟你到老太太、太太跟前去评理。
把你奶了这么大，到如今吃不著奶了，把我丢在一旁，逞著丫头们要我的强。”|我把你奶到这么大，如今你吃不着奶了，就把我丢在一边，纵着丫头们来欺负我。”
一面说，一面也哭起来。|一边说，一边也哭起来。
彼时黛玉宝钗等也走过来劝说：“妈妈你老人家担待他们一点子就完了。”|这时黛玉、宝钗等人也过来劝她：“妈妈，您老人家担待她们一点就算了。”
李嬷嬷见他二人来了，便拉住诉委屈，将当日吃茶，茜雪出去，与昨日酥酪等事，唠唠叨叨说个不清。|李嬷嬷见她们两个来了，就拉住她们诉委屈，把当初喝茶、茜雪被撵，和昨天酥酪这些事，唠唠叨叨说个没完。
! “把你奶了这么大，到如今吃不著奶了，把我丢在一旁”，话糙，理却是真的。一个老仆人被冷落的悲哀，作者也写到了。

# 四、凤姐来拉走李嬷嬷
可巧凤姐正在上房算完输赢帐，听得后面声嚷，便知是李嬷嬷老病发了，排揎宝玉的人。|正好凤姐在上房刚算完输赢账，听见后面嚷嚷，就知道是李嬷嬷的老毛病又犯了，在教训宝玉屋里的人。
——正值他今儿输了钱，迁怒于人。|——正赶上她今天输了钱，拿别人出气。
便连忙赶过来，拉了李嬷嬷，笑道：|就连忙赶过来，拉住李嬷嬷，笑道：
“好妈妈，别生气。大节下老太太才喜欢了一日，|“好妈妈，别生气。大过节的，老太太才高兴了一天，
你是个老人家，别人高声，你还要管他们呢，难道你反不知道规矩，在这里嚷起来，叫老太太生气不成？|你是个老人家，别人大声嚷嚷你还要管呢，难道你反倒不懂规矩，在这里嚷起来，叫老太太生气不成？
你只说谁不好，我替你打他。|你只说谁不好，我替你打她。
我家里烧的滚热的野鸡，快来跟我吃酒去。”|我家里烧了滚热的野鸡，快跟我喝酒去。”
一面说，一面拉著走，又叫：“丰儿，替你李奶奶拿著拐棍子，擦眼泪的手帕子。”|一边说一边拉着她走，又叫：“丰儿，替你李奶奶拿着拐杖和擦眼泪的手帕。”
那李嬷嬷脚不沾地跟了凤姐走了，一面还说：|那李嬷嬷脚不沾地地被凤姐拉走了，一边还说：
“我也不要这老命了，越性今儿没了规矩，闹一场子，讨个没脸，强如受那娼妇蹄子的气！”|“我也不要这条老命了，干脆今天就不管规矩了，闹一场，丢个脸，也强过受那小娼妇的气！”
后面宝钗黛玉随著。|宝钗、黛玉跟在后面。
见凤姐儿这般，都拍手笑道：“亏这一阵风来，把个老婆子撮了去了。”|见凤姐这样，都拍手笑道：“多亏这一阵风，把这老婆子卷走了。”
! 凤姐一来，软硬兼施：先拿老太太压她，再说替她出气，最后用野鸡和酒哄她走。三言两语就把一场闹剧收了场。
! 作者特意点出凤姐“今儿输了钱”。

# 五、晴雯和袭人
宝玉点头叹道：“这又不知是那里的帐，只拣软的排揎。|宝玉点头叹道：“这又不知道是哪里的账，只拣软柿子捏。
昨儿又不知是那个姑娘得罪了，上在他帐上。”|昨天又不知道是哪个姑娘得罪了她，记在了袭人头上。”
一句未了，晴雯在旁笑道：“谁又不疯了，得罪他作什么。|一句话还没说完，晴雯在旁边笑道：“谁疯了，去得罪她做什么。
便得罪了他，就有本事承任，不犯带累别人！”|就算得罪了她，也有本事自己担着，犯不着连累别人！”
袭人一面哭，一面拉著宝玉道：|袭人一边哭，一边拉着宝玉说：
“为我得罪了一个老奶奶，你这会子又为我得罪这些人，这还不够我受的，还只是拉别人。”|“为了我得罪了一个老奶奶，你这会儿又为了我得罪这些人，这还不够我受的，还要扯上别人。”
宝玉见他这般病势，又添了这些烦恼，连忙忍气吞声，安慰他仍旧睡下出汗。|宝玉见她病成这样，又添了这些烦恼，连忙忍住气，安慰她仍旧躺下出汗。
又见他汤烧火热，自己守著他，歪在旁边，劝他只养著病，别想著些没要紧的事生气。|又见她浑身发烫，自己守着她，靠在旁边，劝她只管养病，别为那些不要紧的事生气。
袭人冷笑道：“要为这些事生气，这屋里一刻还站不得了。|袭人冷笑道：“要是为这些事生气，这屋里一刻也待不下去了。
但只是天长日久，只管这样，可叫人怎么样才好呢。|只是天长日久，老是这样，可叫人怎么办才好呢。
时常我劝你，别为我们得罪人，你只顾一时为我们那样，他们都记在心里，|我常劝你，别为了我们得罪人，你只顾一时为我们出头，她们都记在心里，
遇著坎儿，说的好说不好听，大家什么意思。”|碰到节骨眼上，说出好听不好听的话来，大家脸上都不好看。”
一面说，一面禁不住流泪，又怕宝玉烦恼，只得又勉强忍著。|一边说，一边忍不住流泪，又怕宝玉烦恼，只好又勉强忍着。
! 宝玉说“昨儿又不知是那个姑娘得罪了”，晴雯一听就以为是在说她，马上顶回去。晴雯心直口快、不肯吃亏。
! 袭人怕的是宝玉替她们出头，招来别人的怨恨。她想得远，处处求稳。

# 六、宝玉喂药
一时杂使的老婆子煎了二和药来。|一会儿，打杂的老婆子煎好了第二遍药拿来。
宝玉见他才有汗意，不肯叫他起来，自己便端著就枕与他吃了，即命小丫头子们铺炕。|宝玉见她刚出点汗，不肯让她起来，自己就端着药，让她就着枕头喝了，又叫小丫头们铺炕。
袭人道：“你吃饭不吃饭，到底老太太，太太跟前坐一会子，和姑娘们顽一会子再回来。|袭人说：“你不管吃不吃饭，总得到老太太、太太跟前坐一会儿，和姑娘们玩一会儿再回来。
我就静静的躺一躺也好。”|我也正好静静地躺一躺。”
宝玉听说，只得替他去了簪环，看他躺下，自往上房来。|宝玉听了，只好替她摘下簪子耳环，看她躺下，自己到上房去了。
同贾母吃毕饭，贾母犹欲同那几个老管家嬷嬷斗牌解闷，|陪贾母吃完饭，贾母还想和那几个老管家嬷嬷打牌解闷，
宝玉记著袭人，便回至房中，见袭人朦朦睡去。|宝玉惦记着袭人，就回到房里，见袭人迷迷糊糊地睡着了。
! 贵公子亲手给丫鬟喂药、摘簪环，在当时是不合规矩的，宝玉却做得自然。

# 七、麝月看家
自己要睡，天气尚早。|自己想睡，天还早。
彼时晴雯，绮霰，秋纹，碧痕都寻热闹，找鸳鸯琥珀等耍戏去了，|这时晴雯、绮霰、秋纹、碧痕都去找热闹，找鸳鸯、琥珀她们玩去了，
独见麝月一个人在外间房里灯下抹骨牌。|只见麝月一个人在外间屋里灯下摆骨牌。
宝玉笑问道：“你怎不同他们顽去？”|宝玉笑着问：“你怎么不跟她们玩去？”
麝月道：“没有钱。”|麝月说：“没有钱。”
宝玉道：“床底下堆著那么些，还不够你输的？”|宝玉说：“床底下堆着那么多，还不够你输的？”
麝月道：“都顽去了，这屋里交给谁呢？那一个又病了。|麝月说：“都玩去了，这屋子交给谁呢？那一个又病着。
满屋里上头是灯，地下是火。|满屋子上面是灯，地下是火。
那些老妈妈子们，老天拔地，伏侍一天，也该叫他们歇歇，|那些老妈妈们，年纪那么大了，伺候了一天，也该让她们歇歇；
小丫头子们也是伏侍了一天，这会子还不叫他们顽顽去。|小丫头们也伺候了一天，这会儿还不让她们玩玩去。
所以让他们都去罢，我在这里看著。”|所以让她们都去吧，我在这里看着。”
宝玉听了这话，公然又是一个袭人。|宝玉听了这话，简直又是一个袭人。
! 宝玉的钱就堆在床底下，随便丫鬟们拿去玩，可见他对钱毫不在意。
! 麝月说话做事和袭人如出一辙，作者直说“公然又是一个袭人”。脂批说袭人走后，留在宝玉身边的就是麝月。

# 八、宝玉替麝月篦头
因笑道：“我在这里坐著，你放心去罢。”|就笑道：“我在这里坐着，你放心去吧。”
麝月道：“你既在这里，越发不用去了，咱们两个说话顽笑岂不好？”|麝月说：“你既然在这里，我就更不用去了，咱们两个说说笑笑岂不好？”
宝玉笑道：“咱两个作什么呢？怪没意思的，也罢了，早上你说头痒，这会子没什么事，我替你篦头罢。”|宝玉笑道：“咱们两个做什么呢？怪没意思的。也罢，早上你说头痒，这会儿没事，我替你篦篦头吧。”
麝月听了便道：“就是这样。”|麝月听了就说：“就这样吧。”
说著，将文具镜匣搬来，卸去钗钏，打开头发，宝玉拿了篦子替他一一的梳篦。|说着把梳妆匣子搬过来，摘下钗环，打开头发，宝玉拿着篦子替她一下一下地梳篦。
只篦了三五下，只见晴雯忙忙走进来取钱。|才篦了三五下，只见晴雯急急忙忙走进来拿钱。
一见了他两个，便冷笑道：“哦，交杯盏还没吃，倒上头了！”|一见他俩，就冷笑道：“哦，交杯酒还没喝，倒先梳起头来了！”
宝玉笑道：“你来，我也替你篦一篦。”|宝玉笑道：“你来，我也替你篦一篦。”
晴雯道：“我没那么大福。”|晴雯说：“我没那么大的福气。”
说著，拿了钱，便摔帘子出去了。|说着拿了钱，一摔帘子出去了。
宝玉在麝月身后，麝月对镜，二人在镜内相视。|宝玉在麝月身后，麝月对着镜子，两人在镜子里互相看着。
宝玉便向镜内笑道：“满屋里就只是他磨牙。”|宝玉就对着镜子笑道：“满屋里就她嘴最碎。”
麝月听说，忙向镜中摆手，宝玉会意。|麝月听了，连忙对着镜子摆手，宝玉明白了。
忽听忽一声帘子响，晴雯又跑进来问道：“我怎么磨牙了？咱们倒得说说。”|忽然“呼”的一声帘子响，晴雯又跑进来问：“我怎么嘴碎了？咱们倒要说说。”
麝月笑道：“你去你的罢，又来问人了。”|麝月笑道：“你走你的吧，又来问人。”
晴雯笑道：“你又护著。你们那瞒神弄鬼的，我都知道。|晴雯笑道：“你又护着他。你们那些偷偷摸摸的事，我都知道。
等我捞回本儿来再说话。”|等我把本钱赢回来再跟你们说。”
说著，一径出去了。|说着就出去了。
这里宝玉通了头，命麝月悄悄的伏侍他睡下，不肯惊动袭人。|这边宝玉给麝月梳通了头，叫麝月悄悄地伺候他睡下，不肯惊动袭人。
一宿无话。|一夜无话。
! 新婚之夜才“上头”（梳成妇人发式）、喝“交杯盏”，晴雯是拿这个开玩笑，嘴上刻薄，心里却没有恶意。
! 镜中相视、镜中摆手，作者写得像一幅小画。晴雯的尖刻、麝月的温和、宝玉的随和，三个人的性情全在里面。

# 九、贾环赖钱
至次日清晨起来，袭人已是夜间发了汗，觉得轻省了些，只吃些米汤静养。|第二天清早起来，袭人夜里出了汗，觉得轻松了些，只喝点米汤静养。
宝玉放了心，因饭后走到薛姨妈这边来闲逛。|宝玉放了心，饭后就到薛姨妈这边来闲逛。
彼时正月内，学房中放年学，闺阁中忌针，却都是闲时。|这时是正月里，学堂里放年假，闺阁里忌讳动针线，大家都闲着。
贾环也过来顽，正遇见宝钗，香菱，莺儿三个赶围棋作耍，贾环见了也要顽。|贾环也过来玩，正碰上宝钗、香菱、莺儿三个在下围棋玩，贾环见了也要玩。
宝钗素习看他亦如宝玉，并没他意。|宝钗平时看待他也和宝玉一样，没有别的意思。
今儿听他要顽，让他上来坐了一处。|今天听他要玩，就让他上来坐在一起。
一磊十个钱，头一回自己赢了，心中十分欢喜。|一注十个钱，头一回他自己赢了，心里很高兴。
后来接连输了几盘，便有些著急。|后来接连输了几盘，就有些着急了。
赶著这盘正该自己掷骰子，若掷个七点便赢，若掷个六点，下该莺儿掷三点就赢了。|这一盘正轮到他掷骰子，要是掷个七点就赢；要是掷个六点，下一个轮到莺儿，莺儿掷个三点就赢了。
因拿起骰子来，狠命一掷，一个作定了五，那一个乱转。|于是拿起骰子来，狠命一掷，一个骰子定在了五点，另一个还在乱转。
莺儿拍著手只叫“幺”，贾环便瞪著眼，“六——七——八”混叫。|莺儿拍着手直叫“幺”，贾环就瞪着眼乱叫“六——七——八”。
那骰子偏生转出幺来。|那骰子偏偏转出个幺来。
贾环急了，伸手便抓起骰子来，然后就拿钱，说是个六点。|贾环急了，伸手就把骰子抓起来，然后就去拿钱，说是个六点。
莺儿便说：“分明是个幺！”|莺儿就说：“明明是个幺！”
宝钗见贾环急了，便瞅莺儿说道：“越大越没规矩，难道爷们还赖你？还不放下钱来呢！”|宝钗见贾环急了，就瞪着莺儿说：“越大越没规矩，难道爷们还会赖你？还不把钱放下！”
莺儿满心委屈，见宝钗说，不敢则声，只得放下钱来，口内嘟囔说：|莺儿满心委屈，见宝钗这么说，不敢出声，只好放下钱，嘴里嘟囔着说：
“一个作爷的，还赖我们这几个钱，连我也不放在眼里。|“一个做爷的，还赖我们这几个钱，连我都不放在眼里。
前儿我和宝二爷顽，他输了那些，也没著急。|前些天我跟宝二爷玩，他输了那么多，也没着急。
下剩的钱，还是几个小丫头子们一抢，他一笑就罢了。”|剩下的钱，还被几个小丫头一抢而光，他一笑就算了。”
宝钗不等说完，连忙断喝。|宝钗不等她说完，连忙喝住她。
! 一样是爷，宝玉输了钱一笑了之，贾环为几个钱耍赖。莺儿一句话拿两人一比，正戳在贾环的痛处。
! 宝钗明知贾环赖账，还是先骂自己的丫鬟。她顾全的是主仆尊卑的体面。

# 十、“都欺负我不是太太养的”
贾环道：“我拿什么比宝玉呢。|贾环说：“我拿什么跟宝玉比呢。
你们怕他，都和他好，都欺负我不是太太养的。”|你们怕他，都跟他好，都欺负我不是太太生的。”
说著，便哭了。|说着就哭了。
宝钗忙劝他：“好兄弟，快别说这话，人家笑话你。”|宝钗连忙劝他：“好兄弟，快别说这种话，人家会笑话你的。”
又骂莺儿。|又骂了莺儿。
正值宝玉走来，见了这般形况，问是怎么了。|正好宝玉走过来，见了这情形，问是怎么回事。
贾环不敢则声。|贾环不敢出声。
宝钗素知他家规矩，凡作兄弟的，都怕哥哥。|宝钗一向知道他们家的规矩，凡是做弟弟的都怕哥哥。
却不知那宝玉是不要人怕他的。|却不知道宝玉是不要人怕他的。
! “不是太太养的”：贾环是赵姨娘生的庶子，这是他心里最深的伤。他所有的委屈和怨恨，后来都化成了对宝玉的敌意。
! 第二十五回贾环故意推倒蜡灯烫宝玉，根子就在这里。

# 十一、宝玉的“呆意思”
他想著：“兄弟们一并都有父母教训，何必我多事，反生疏了。|宝玉想：“弟弟们都有父母管教，何必我多事，反倒疏远了。
况且我是正出，他是庶出，饶这样还有人背后谈论，还禁得辖治他了。”|况且我是正房生的，他是偏房生的，就这样还有人背后议论，哪里还经得起我去管他。”
更有个呆意思存在心里。|他心里还有个呆念头。
——你道是何呆意？|——你说是什么呆念头？
因他自幼姊妹丛中长大，亲姊妹有元春，探春，伯叔的有迎春，惜春，亲戚中又有史湘云，林黛玉，薛宝钗等诸人。|因为他从小在姐妹堆里长大，亲姐妹有元春、探春，伯伯叔叔家的有迎春、惜春，亲戚里又有史湘云、林黛玉、薛宝钗等人。
他便料定，原来天生人为万物之灵，凡山川日月之精秀，只钟于女儿，|他就认定，原来天生人是万物之灵，凡是山川日月的精华灵秀，只集中在女孩儿身上，
须眉男子不过是些渣滓浊沫而已。|男人不过是些渣滓泡沫罢了。
因有这个呆念在心，把一切男子都看成混沌浊物，可有可无。|因为心里有这个呆念头，他把所有男人都看成糊涂污浊的东西，可有可无。
只是父亲叔伯兄弟中。因孔子是亘古第一人说下的。不可忤慢，只得要听他这句话。|只是对父亲、叔伯、兄弟，因为孔子这位自古第一人说过要孝悌，不能怠慢，只好听他这句话。
所以，弟兄之间不过尽其大概的情理就罢了，并不想自己是丈夫，须要为子弟之表率。|所以兄弟之间不过尽个大概的情理就算了，并不想到自己是个男子汉，应该给弟弟们做表率。
是以贾环等都不怕他，却怕贾母，才让他三分。|所以贾环他们都不怕他，只是怕贾母，才让他三分。
如今宝钗恐怕宝玉教训他，倒没意思，便连忙替贾环掩饰。|这时宝钗怕宝玉教训他，弄得没意思，就连忙替贾环遮掩。
! “山川日月之精秀，只钟于女儿，须眉男子不过是些渣滓浊沫”，这是宝玉最有名的观念，和第二回冷子兴转述的“女儿是水作的骨肉，男人是泥作的骨肉”是一个意思。
! 宝玉不摆哥哥的架子，对贾环也不苛责，可贾环并不领情。宝玉的宽厚，在贾环眼里只是另一种轻视。

# 十二、宝玉打发贾环
宝玉道：“大正月里哭什么？这里不好，你别处顽去。|宝玉说：“大正月的哭什么？这里不好，你到别处玩去。
你天天念书，倒念糊涂了。|你天天念书，倒念糊涂了。
比如这件东西不好，横竖那一件好，就弃了这件取那个。|比如这件东西不好，反正那一件好，就丢了这件拿那件。
难道你守著这个东西哭一会子就好了不成？|难道你守着这个东西哭一会儿就好了不成？
你原是来取乐顽的，既不能取乐，就往别处去寻乐顽去。|你本来是来找乐子玩的，既然这里不快乐，就到别处找乐子去。
哭一会子，难道算取乐顽了不成？倒招自己烦恼，不如快去为是。”|哭一会儿，难道就算找到乐子了？倒给自己招烦恼，不如快走才是。”
贾环听了，只得回来。|贾环听了，只好回去了。
! 宝玉的道理是“这里不好就去别处”，人生在他看来就该“取乐”。这话对贾环毫无用处，贾环要的是别人瞧得起他。

# 十三、赵姨娘骂儿子，凤姐教训赵姨娘
赵姨娘见他这般，因问：“又是那里垫了踹窝来了？”|赵姨娘见他这样，就问：“又是在哪里被人当垫脚石踩了？”
一问不答，再问时，贾环便说：“同宝姐姐顽的，莺儿欺负我，赖我的钱，宝玉哥哥撵我来了。”|问一声不答，再问时，贾环就说：“跟宝姐姐玩，莺儿欺负我，赖我的钱，宝玉哥哥把我撵回来了。”
赵姨娘啐道：“谁叫你上高台盘去了？下流没脸的东西！|赵姨娘啐道：“谁叫你去攀那高枝儿的？下流没脸的东西！
那里顽不得？谁叫你跑了去讨没意思！”|哪里玩不得？谁叫你跑去讨没趣！”
正说著，可巧凤姐在窗外过。都听在耳内。|正说着，凤姐恰好从窗外经过，全都听在耳里。
便隔窗说道：“大正月又怎么了？|就隔着窗子说：“大正月的又怎么了？
环兄弟小孩子家，一半点儿错了，你只教导他，说这些淡话作什么！|环兄弟是小孩子，有一点半点错，你只管教导他，说这些没用的话做什么！
凭他怎么去，还有太太老爷管他呢，就大口啐他！|不管他怎么样，还有太太老爷管他呢，你就大口啐他！
他现是主子，不好了，横竖有教导他的人，与你什么相干！|他现在是主子，就算不好，反正有教导他的人，跟你有什么相干！
环兄弟，出来，跟我顽去。”|环兄弟，出来，跟我玩去。”
贾环素日怕凤姐比怕王夫人更甚，听见叫他，忙唯唯的出来。|贾环平时怕凤姐比怕王夫人还厉害，听见叫他，连忙答应着出来了。
赵姨娘也不敢则声。|赵姨娘也不敢出声。
! 贾环颠倒是非，明明是自己赖账，却说莺儿“赖我的钱”。
! 凤姐一句“他现是主子”，把赵姨娘压得死死的：儿子是主子，生他的娘却只是个奴才，连骂儿子的资格都没有。这就是回目里的“王熙凤正言弹妒意”。

# 十四、凤姐教训贾环
凤姐向贾环道：“你也是个没气性的！|凤姐对贾环说：“你也是个没骨气的！
时常说给你：要吃，要喝，要顽，要笑，只爱同那一个姐姐妹妹哥哥嫂子顽，就同那个顽。|常跟你说：想吃、想喝、想玩、想笑，爱跟哪个姐姐妹妹哥哥嫂子玩，就跟哪个玩。
你不听我的话，反叫这些人教的歪心邪意，狐媚子霸道的。|你不听我的话，反倒被这些人教得歪心邪意，鬼鬼祟祟又蛮横霸道。
自己不尊重，要往下流走，安著坏心，还只管怨人家偏心。|自己不自重，要往下流走，存着坏心，还只管怨别人偏心。
输了几个钱？就这么个样儿！”|输了几个钱？就这副样子！”
贾环见问，只得诺诺的回说：“输了一二百。”|贾环见她问，只好诺诺地回答：“输了一二百。”
凤姐道：“亏你还是爷，输了一二百钱就这样！”|凤姐说：“亏你还是个爷，输了一二百钱就这样！”
回头叫丰儿：“去取一吊钱来，姑娘们都在后头顽呢，把他送了顽去。|回头叫丰儿：“去拿一吊钱来，姑娘们都在后面玩呢，把他送过去玩。
——你明儿再这么下流狐媚子，我先打了你，打发人告诉学里，皮不揭了你的！|——你以后再这么下流，我先打你，再派人告诉学堂，不揭了你的皮才怪！
为你这个不尊重，恨的你哥哥牙根痒痒，不是我拦著，窝心脚把你的肠子窝出来了。”|就为你这样不自重，你哥哥恨得牙根痒痒，要不是我拦着，一脚就把你的肠子踹出来了。”
喝命：“去罢！”|喝令：“去吧！”
贾环诺诺的跟了丰儿，得了钱，自己和迎春等顽去。|贾环诺诺地跟着丰儿，拿了钱，自己去和迎春她们玩了。
不在话下。|这里不多说。
! “这些人”指的就是赵姨娘。凤姐当着赵姨娘的面骂她“教的歪心邪意”，赵姨娘却不敢回一句。这份积怨，第二十五回赵姨娘请马道婆魇魔凤姐和宝玉，就是爆发。
! 凤姐说“你哥哥”恨得牙痒，“你哥哥”是贾琏。

# 十五、湘云来了
且说宝玉正和宝钗顽笑，忽见人说：“史大姑娘来了。”|再说宝玉正和宝钗说笑，忽然有人来说：“史大姑娘来了。”
宝玉听了，抬身就走。|宝玉听了，起身就走。
宝钗笑道：“等著，咱们两个一齐走，瞧瞧他去。”|宝钗笑道：“等着，咱们两个一起走，去看看她。”
说著，下了炕，同宝玉一齐来至贾母这边。|说着下了炕，和宝玉一起来到贾母这边。
只见史湘云大笑大说的，见他两个来，忙问好厮见。|只见史湘云大说大笑的，见他俩来了，忙问好相见。
正值林黛玉在旁，因问宝玉：“在那里的？”|正好林黛玉在旁边，就问宝玉：“从哪里来？”
宝玉便说：“在宝姐姐家的。”|宝玉就说：“从宝姐姐家来。”
黛玉冷笑道：“我说呢，亏在那里绊住，不然早就飞了来了。”|黛玉冷笑道：“我说呢，亏得在那里绊住了，不然早就飞过来了。”
宝玉笑道：“只许同你顽，替你解闷儿。不过偶然去他那里一趟，就说这话。”|宝玉笑道：“只许跟你玩，替你解闷。不过偶尔去她那里一趟，就说这种话。”
林黛玉道：“好没意思的话！|林黛玉说：“好没意思的话！
去不去管我什么事，我又没叫你替我解闷儿。|去不去关我什么事，我又没叫你替我解闷。
可许你从此不理我呢！”|就许你从此不理我好了！”
说著，便赌气回房去了。|说着就赌气回房去了。
! 湘云第一次正式出场。她“大笑大说”，是个爽朗的女孩子，和黛玉的多愁、宝钗的端庄都不同。
! 黛玉一听宝玉从宝钗那里来，就醋意大发。宝钗偏偏和宝玉“一齐”来，这一幕正戳在黛玉的心上。

# 十六、“死了干净”
宝玉忙跟了来，问道：“好好的又生气了？|宝玉连忙跟过来，问：“好好的又生气了？
就是我说错了，你到底也还坐在那里，和别人说笑一会子。又来自己纳闷。”|就算我说错了，你好歹也坐在那里，和别人说笑一会儿，又来自己生闷气。”
林黛玉道：“你管我呢！”|林黛玉说：“你管我呢！”
宝玉笑道：“我自然不敢管你，只没有个看著你自己作践了身子呢。”|宝玉笑道：“我自然不敢管你，只是不能眼看着你糟蹋自己的身子。”
林黛玉道：“我作践坏了身子，我死，与你何干！”|林黛玉说：“我糟蹋坏了身子，我死，跟你有什么相干！”
宝玉道：“何苦来，大正月里，死了活了的。”|宝玉说：“何苦呢，大正月的，死呀活呀的。”
林黛玉道：“偏说死！我这会子就死！你怕死，你长命百岁的，如何？”|林黛玉说：“偏要说死！我现在就死！你怕死，你长命百岁，怎么样？”
宝玉笑道：“要像只管这样闹，我还怕死呢？倒不如死了干净。”|宝玉笑道：“要是老这样闹，我还怕什么死？倒不如死了干净。”
黛玉忙道：“正是了，要是这样闹，不如死了干净。”|黛玉忙说：“正是，要是这样闹，不如死了干净。”
宝玉道：“我说我自己死了干净，别听错了话赖人。”|宝玉说：“我说的是我自己死了干净，别听错了话赖人。”
正说著，宝钗走来道：“史大妹妹等你呢。”|正说着，宝钗走过来说：“史大妹妹在等你呢。”
说著，便推宝玉走了。|说着就把宝玉推走了。
这里黛玉越发气闷，只向窗前流泪。|这边黛玉越发气闷，只对着窗前流泪。
! 两个人吵来吵去，嘴上全是“死”。这是小儿女的气话，也是全书的谶语：黛玉后来真的泪尽而死。
! 宝钗又一次把宝玉“推”走了。宝钗未必有心，可在黛玉看来，这又是一刺。

# 十七、“我为的是我的心”
没两盏茶的工夫，宝玉仍来了。|不到两盏茶的工夫，宝玉又回来了。
林黛玉见了，越发抽抽噎噎的哭个不住。|林黛玉见了，更是抽抽噎噎地哭个不停。
宝玉见了这样，知难挽回，打叠起千百样的款语温言来劝慰。|宝玉见这样，知道一时难以挽回，就准备了千百句温柔的话来劝慰她。
不料自己未张口，只见黛玉先说道：|没想到自己还没开口，黛玉先说道：
“你又来作什么？横竖如今有人和你顽，比我又会念，又会作，又会写，又会说笑，又怕你生气拉了你去，你又作什么来？|“你又来做什么？反正现在有人陪你玩，比我又会念、又会作、又会写、又会说笑，又怕你生气把你拉了去，你又来做什么？
死活凭我去罢了！”|我是死是活随我去好了！”
宝玉听了忙上来悄悄的说道：|宝玉听了，连忙上前悄悄地说：
“你这么个明白人，难道连‘亲不间疏，先不僭后’也不知道？|“你这么个明白人，难道连‘亲近的不被疏远的离间，先来的不被后来的超越’都不知道？
我虽糊涂，却明白这两句话。|我虽然糊涂，却明白这两句话。
头一件，咱们是姑舅姊妹，宝姐姐是两姨姊妹，论亲戚，他比你疏。|第一，咱们是姑舅表兄妹，宝姐姐是两姨表姐弟，论亲戚，她比你远。
第二件，你先来，咱们两个一桌吃，一床睡，长的这么大了，他是才来的，岂有个为他疏你的？”|第二，你先来的，咱们两个一桌吃饭、一床睡觉，一起长这么大了；她是才来的，哪有为了她疏远你的道理？”
林黛玉啐道：“我难道为叫你疏他？我成了个什么人了呢！|林黛玉啐道：“我难道是为了叫你疏远她？那我成了什么人了！
我为的是我的心。”|我为的是我的心。”
宝玉道：“我也为的是我的心。|宝玉说：“我也为的是我的心。
难道你就知你的心，不知我的心不成？”|难道你只知道你的心，不知道我的心吗？”
林黛玉听了，低头一语不发，半日说道：|林黛玉听了，低头一句话也不说，过了半天才说：
“你只怨人行动嗔怪了你，你再不知道你自己怄人难受。|“你只怨别人动不动就怪你，你从来不知道你自己怎么惹人难受。
就拿今日天气比，分明今儿冷的这样，你怎么倒反把个青肷披风脱了呢？”|就拿今天的天气说，明明今天冷成这样，你怎么反倒把那件青肷披风脱了呢？”
宝玉笑道：“何尝不穿著，见你一恼，我一炮燥就脱了。”|宝玉笑道：“本来穿着呢，见你一生气，我一着急就脱了。”
林黛玉叹道：“回来伤了风，又该饿著吵吃的了。”|林黛玉叹道：“回头伤了风，又该饿着肚子吵着要吃的了。”
! “我为的是我的心”“我也为的是我的心”，这是全书宝黛之间最接近表白的一次对话。两人都没说破，却都懂了。
! 黛玉不要宝玉疏远宝钗，她要的只是确认宝玉的心。宝玉的“亲不间疏”说的是亲戚远近，黛玉要的却是心的远近。
! 黛玉一转眼就心疼他没穿披风。她的醋和她的疼，是同一颗心。

# 十八、湘云咬舌
二人正说著，只见湘云走来，笑道：|两人正说着，只见湘云走过来，笑道：
“二哥哥，林姐姐，你们天天一处顽，我好容易来了，也不理我一理儿。”|“二哥哥，林姐姐，你们天天在一起玩，我好不容易来了，也不理我一下。”
黛玉笑道：“偏是咬舌子爱说话，连个‘二’哥哥也叫不出来，只是‘爱’哥哥‘爱’哥哥的。|黛玉笑道：“偏偏是咬舌头的人爱说话，连个‘二’哥哥都叫不出来，只会叫‘爱’哥哥‘爱’哥哥的。
回来赶围棋儿，又该你闹‘幺爱三四五’了。”|回头下围棋的时候，又该你嚷‘幺爱三四五’了。”
宝玉笑道：“你学惯了他，明儿连你还咬起来呢。”|宝玉笑道：“你学惯了她，明天连你也咬起舌头来了。”
史湘云道：“他再不放人一点儿，专挑人的不好。|史湘云说：“她从来不肯饶人一点，专挑别人的毛病。
你自己便比世人好，也不犯著见一个打趣一个。|你自己就算比世上的人都好，也犯不着见一个打趣一个。
指出一个人来，你敢挑他，我就伏你。”|我指出一个人来，你敢挑她的毛病，我就服你。”
黛玉忙问是谁。|黛玉忙问是谁。
湘云道：“你敢挑宝姐姐的短处，就算你是好的。|湘云说：“你敢挑宝姐姐的短处，就算你厉害。
我算不如你，他怎么不及你呢。”|我算比不上你，可她哪里比不上你呢。”
黛玉听了，冷笑道：“我当是谁，原来是他！我那里敢挑他呢。”|黛玉听了，冷笑道：“我当是谁，原来是她！我哪里敢挑她呢。”
宝玉不等说完，忙用话岔开。|宝玉不等她说完，连忙用话岔开。
湘云笑道：“这一辈子我自然比不上你。|湘云笑道：“这一辈子我自然比不上你。
我只保佑著明儿得一个咬舌的林姐夫，时时刻刻你可听‘爱’‘厄’去。|我只保佑你将来嫁一个咬舌头的林姐夫，让你时时刻刻听他‘爱’呀‘厄’的。
阿弥陀佛，那才现在我眼里！”|阿弥陀佛，那时候我才高兴呢！”
说的众人一笑，湘云忙回身跑了。|说得大家都笑了，湘云连忙转身跑了。
要知端详，下回分解。|要知后事如何，请看下回分解。
! 湘云说话咬舌，把“二”说成“爱”。“爱哥哥”这个称呼，倒成了她和宝玉之间特有的亲昵。
! 湘云站在宝钗一边，黛玉一下子就冷了脸。三个女孩子之间的微妙关系，从这里开始变得复杂。
! 下一回湘云住在黛玉房里，宝玉一早跑去看她俩，又惹出袭人一场气。
</script>

<script type="text/plain" id="ch21">
# 一、湘云跑了
话说史湘云跑了出来，怕林黛玉赶上，|史湘云跑了出来，怕林黛玉追上，
宝玉在后忙说：“仔细绊跌了！那里就赶上了？”|宝玉在后面忙说：“小心绊倒了！哪里就追上了？”
林黛玉赶到门前，被宝玉叉手在门框上拦住，笑劝道：“饶他这一遭罢。”|林黛玉追到门口，被宝玉张开手撑在门框上拦住，笑着劝道：“饶她这一回吧。”
林黛玉搬著手说道：“我若饶过云儿，再不活著！”|林黛玉扳着宝玉的手说：“我要是饶了云儿，我就不活了！”
湘云见宝玉拦住门，料黛玉不能出来，便立住脚笑道：“好姐姐，饶我这一遭罢。”|湘云见宝玉拦住了门，料想黛玉出不来，就站住脚笑道：“好姐姐，饶我这一回吧。”
恰值宝钗来在湘云身后，也笑道：“我劝你两个看宝兄弟分上，都丢开手罢。”|正好宝钗来到湘云身后，也笑道：“我劝你们两个看在宝兄弟的面子上，都算了吧。”
黛玉道：“我不依。你们是一气的，都戏弄我不成！”|黛玉说：“我不答应。你们是一伙的，都来戏弄我是不是！”
宝玉劝道：“谁敢戏弄你！你不打趣他，他焉敢说你。”|宝玉劝道：“谁敢戏弄你！你不打趣她，她怎么敢说你。”
四人正难分解，有人来请吃饭，方往前边来。|四个人正闹得难分难解，有人来请吃饭，才一起到前面去了。
那天早又掌灯时分，王夫人，李纨，凤姐，迎，探，惜等都往贾母这边来，大家闲话了一回，各自归寝。|那天很快又到了点灯时候，王夫人、李纨、凤姐、迎春、探春、惜春等都到贾母这边来，大家闲谈了一阵，各自回去睡了。
湘云仍往黛玉房中安歇。|湘云仍旧住在黛玉房里。
! 宝玉拦着门护着湘云，宝钗也帮湘云说话，黛玉说“你们是一气的”，又觉得自己被孤立了。
! 湘云住在黛玉房里，这也是两人后来亲近的开始。

# 二、清早看姐妹俩
宝玉送他二人到房，那天已二更多时，袭人来催了几次，方回自己房中来睡。|宝玉送她们两个回房，那时已经过了二更，袭人来催了好几次，他才回自己房里睡。
次日天明时，便披衣靸鞋往黛玉房中来，|第二天天刚亮，他就披上衣服、趿着鞋到黛玉房里来，
不见紫鹃，翠缕二人，只见他姊妹两个尚卧在衾内。|没看见紫鹃、翠缕两个丫鬟，只见她们姐妹俩还躺在被窝里。
那林黛玉严严密密裹著一幅杏子红绫被，安稳合目而睡。|林黛玉严严实实地裹着一床杏红色的绫被，安安稳稳地闭着眼睛睡着。
那史湘云却一把青丝拖于枕畔，被只齐胸，一弯雪白的膀子撂于被外，又带著两个金镯子。|史湘云却一把黑发拖在枕边，被子只盖到胸口，一弯雪白的胳膊露在被子外面，还戴着两个金镯子。
宝玉见了，叹道：“睡觉还是不老实！回来风吹了，又嚷肩窝疼了。”|宝玉见了，叹道：“睡觉还是不老实！回头被风吹了，又要嚷肩膀疼了。”
一面说，一面轻轻的替他盖上。|一边说，一边轻轻替她盖上。
林黛玉早已醒了，觉得有人，就猜著定是宝玉，因翻身一看，果中其料。|林黛玉早就醒了，觉得有人进来，就猜一定是宝玉，翻身一看，果然被她猜中了。
因说道：“这早晚就跑过来作什么？”|就说：“这么早跑过来做什么？”
宝玉笑道：“这天还早呢！你起来瞧瞧。”|宝玉笑道：“这天还早呢！你起来看看。”
黛玉道：“你先出去，让我们起来。”|黛玉说：“你先出去，让我们起来。”
宝玉听了，转身出至外边。|宝玉听了，转身走到外间。
! 两个女孩子的睡相，就是两人的性格：黛玉裹得“严严密密”，谨慎自守；湘云“一弯雪白的膀子撂于被外”，豪爽不拘。
! 湘云的金镯子、金麒麟，都和“金”有关。第三十一回她捡到宝玉丢的金麒麟，回目叫“因麒麟伏白首双星”。

# 三、宝玉用湘云的洗脸水
黛玉起来叫醒湘云，二人都穿了衣服。|黛玉起来叫醒湘云，两人都穿好了衣服。
宝玉复又进来，坐在镜台旁边，只见紫鹃，雪雁进来伏侍梳洗。|宝玉又走进来，坐在梳妆台旁边，只见紫鹃、雪雁进来伺候梳洗。
湘云洗了面，翠缕便拿残水要泼，|湘云洗完脸，翠缕就端着剩下的水要去泼掉，
宝玉道：“站著，我趁势洗了就完了，省得又过去费事。”|宝玉说：“站住，我顺便洗了就完了，省得再过去麻烦。”
说著便走过来，弯腰洗了两把。|说着就走过来，弯腰洗了两把。
紫鹃递过香皂去，宝玉道：这盆里的就不少，不用搓了。”|紫鹃递过香皂去，宝玉说：“这盆里的就不少了，不用再搓了。”
再洗了两把，便要手巾。|又洗了两把，就要手巾。
翠缕道：“还是这个毛病儿，多早晚才改。”|翠缕说：“还是这个毛病，什么时候才改。”
宝玉也不理，忙忙的要过青盐擦了牙，嗽了口，完毕，|宝玉也不理她，急急忙忙要过青盐擦了牙，漱了口，洗完了，
见湘云已梳完了头，便走过来笑道：“好妹妹，替我梳上头罢。”|见湘云已经梳好了头，就走过来笑道：“好妹妹，替我梳梳头吧。”
湘云道：“这可不能了。”|湘云说：“这可不行了。”
宝玉笑道：“好妹妹，你先时怎么替我梳了呢？”|宝玉笑道：“好妹妹，你以前怎么替我梳过呢？”
湘云道：“如今我忘了，怎么梳呢？”|湘云说：“现在我忘了，怎么梳呢？”
宝玉道：“横竖我不出门，又不带冠子勒子，不过打几根散辫子就完了。”|宝玉说：“反正我不出门，又不戴冠子抹额，不过编几根散辫子就完了。”
说著，又千妹妹万妹妹的央告。|说着又“好妹妹”“好妹妹”地央求。
! 用女孩子洗剩的水洗脸，这是宝玉对女孩子的“痴”。在他看来，女儿的东西都是干净的。
! 湘云说“如今我忘了”，是因为大了，知道男女有别了。宝玉却还是小时候的样子。

# 四、少了一颗珠子
湘云只得扶过他的头来，一一梳篦。|湘云只好扶过他的头来，一下一下地梳篦。
在家不戴冠，并不总角，只将四围短发编成小辫，往顶心发上归了总，编一根大辫，红绦结住。|宝玉在家不戴冠，也不扎总角，只把四周的短发编成小辫子，往头顶的头发上归拢起来，编成一根大辫子，用红丝绳扎住。
自发顶至辫梢，一路四颗珍珠，下面有金坠脚。|从头顶到辫梢，一路缀着四颗珍珠，下面有金坠脚。
湘云一面编著，一面说道：“这珠子只三颗了，这一颗不是的。|湘云一边编，一边说：“这珠子只剩三颗了，这一颗不是原来的。
我记得是一样的，怎么少了一颗？”|我记得是一样的，怎么少了一颗？”
宝玉道：“丢了一颗。”|宝玉说：“丢了一颗。”
湘云道：“必定是外头去掉下来，不防被人拣了去，倒便宜他。”|湘云说：“一定是在外面掉了，不留神被人捡去了，倒便宜了他。”
黛玉一旁盥手，冷笑道：“也不知是真丢了，也不知是给了人镶什么戴去了！”|黛玉在旁边洗手，冷笑道：“也不知道是真丢了，还是给了别人镶什么戴去了！”
宝玉不答，因镜台两边俱是妆奁等物，顺手拿起来赏玩，|宝玉不回答，因为梳妆台两边都是梳妆匣之类的东西，就顺手拿起来玩，
不觉又顺手拈了胭脂，意欲要往口边送，因又怕史湘云说。|不知不觉又顺手拈起胭脂，想往嘴边送，又怕史湘云说他。
正犹豫间，湘云果在身后看见，一手掠著辫子，便伸手来“拍”的一下，从手中将胭脂打落，|正犹豫的时候，湘云果然在身后看见了，一手挽着辫子，一手伸过来“啪”的一下，把胭脂从他手里打掉，
说道：“这不长进的毛病儿，多早晚才改过！”|说：“这不长进的毛病，什么时候才改！”
! 一颗珍珠的去向，黛玉一句话就怀疑到“给了人”。她的敏感，连一颗珠子都不放过。
! 宝玉前两天刚答应袭人不再吃胭脂，转眼又要往嘴里送，湘云“拍”的一下打掉了。

# 五、袭人和宝钗
一语未了，只见袭人进来，看见这般光景，知是梳洗过了，只得回来自己梳洗。|话还没说完，只见袭人进来，看见这情形，知道他已经梳洗过了，只好回去自己梳洗。
忽见宝钗走来，因问道：“宝兄弟那去了？”|忽然看见宝钗走来，问：“宝兄弟到哪里去了？”
袭人含笑道：“宝兄弟那里还有在家的工夫！”|袭人含笑道：“宝兄弟哪里还有在家的工夫！”
宝钗听说，心中明白。|宝钗听了，心里明白了。
又听袭人叹道：“姊妹们和气，也有个分寸礼节，也没个黑家白日闹的！|又听袭人叹道：“姐妹们和和气气，也该有个分寸礼节，也没有这样白天黑夜地闹的！
凭人怎么劝，都是耳旁风。”|不管别人怎么劝，都是耳边风。”
宝钗听了，心中暗忖道：“倒别看错了这个丫头，听他说话，倒有些识见。”|宝钗听了，心里暗想：“倒别小看了这个丫头，听她说话，倒有些见识。”
宝钗便在炕上坐了，慢慢的闲言中套问他年纪家乡等语，留神窥察，其言语志量深可敬爱。|宝钗就在炕上坐下，在闲谈中慢慢问她的年纪、家乡这些话，留心观察，觉得她的言谈和志向很值得敬重喜爱。
! 袭人在宝钗面前抱怨宝玉和黛玉、湘云“黑家白日闹”，宝钗立刻引她为知己。
! 宝钗和袭人走到一起，是全书很重要的一步：她们都希望宝玉“上进”、守规矩。脂批说袭人是“宝钗之副”。

# 六、袭人动了真气
一时宝玉来了，宝钗方出去。|一会儿宝玉回来了，宝钗才出去。
宝玉便问袭人道：“怎么宝姐姐和你说的这么热闹，见我进来就跑了？”|宝玉就问袭人：“怎么宝姐姐跟你说得这么热闹，见我进来就走了？”
问一声不答，再问时，袭人方道：“你问我么？我那里知道你们的原故。”|问一声不答，再问时，袭人才说：“你问我吗？我哪里知道你们的缘故。”
宝玉听了这话，见他脸上气色非往日可比，便笑道：“怎么动了真气？”|宝玉听了这话，见她脸色和平时不一样，就笑道：“怎么动了真气了？”
袭人冷笑道：“我那里敢动气！只是从今以后别再进这屋子了。|袭人冷笑道：“我哪里敢生气！只是从今以后你别再进这屋子了。
横竖有人伏侍你，再别来支使我。我仍旧还伏侍老太太去。”|反正有人伺候你，别再来使唤我。我还是回去伺候老太太。”
一面说，一面便在炕上合眼倒下。|一边说，一边在炕上闭着眼躺下了。
宝玉见了这般景况，深为骇异，禁不住赶来劝慰。|宝玉见了这情形，很是吃惊，忍不住赶过来劝慰。
那袭人只管合了眼不理。|袭人只管闭着眼不理他。
宝玉无了主意，因见麝月进来，便问道：“你姐姐怎么了？”|宝玉没了主意，见麝月进来，就问：“你姐姐怎么了？”
麝月道：“我知道么？问你自己便明白了。”|麝月说：“我怎么知道？问你自己就明白了。”
宝玉听说，呆了一回，自觉无趣，便起身叹道：“不理我罢，我也睡去。”|宝玉听了，呆了一会儿，觉得没趣，就起身叹道：“不理我就算了，我也睡去。”
说著，便起身下炕，到自己床上歪下。|说着就下了炕，到自己床上躺下了。
! 这就是回目里的“贤袭人娇嗔箴宝玉”。上一回是讲道理，这一回是使性子：不理他、要走、闭眼躺下。

# 七、斗篷一掀
袭人听他半日无动静，微微的打鼾，料他睡著，便起身拿一领斗蓬来，替他刚压上，|袭人听他半天没动静，还微微打鼾，以为他睡着了，就起身拿了一件斗篷来，刚给他盖上，
只听“忽”的一声，宝玉便掀过去，也仍合目装睡。|只听“呼”的一声，宝玉就把斗篷掀开了，仍旧闭着眼装睡。
袭人明知其意，便点头冷笑道：“你也不用生气，从此后我只当哑子，再不说你一声儿，如何？”|袭人明白他的意思，就点头冷笑道：“你也不用生气，从此以后我只当个哑巴，再不说你一句，怎么样？”
宝玉禁不住起身问道：“我又怎么了？你又劝我。|宝玉忍不住起身问：“我又怎么了？你又劝我。
你劝我也罢了，才刚又没见你劝我，一进来你就不理我，赌气睡了。|你劝我也就罢了，刚才又没见你劝我，我一进来你就不理我，赌气睡了。
我还摸不著是为什么，这会子你又说我恼了。|我还摸不着头脑，这会儿你又说我恼了。
我何尝听见你劝我什么话了。”|我哪里听见你劝我什么话了。”
袭人道：“你心里还不明白，还等我说呢！”|袭人说：“你心里还不明白，还要等我说呢！”
! 袭人以为他睡着了，还是要给他盖斗篷。她的“娇嗔”是装出来的，关心是真的。

# 八、四儿
正闹著，贾母遣人来叫他吃饭，方往前边来，胡乱吃了半碗，仍回自己房中。|正闹着，贾母派人来叫他吃饭，他才到前面去，胡乱吃了半碗，又回到自己房里。
只见袭人睡在外头炕上，麝月在旁边抹骨牌。|只见袭人睡在外间炕上，麝月在旁边摆骨牌。
宝玉素知麝月与袭人亲厚，一并连麝月也不理，揭起软帘自往里间来。|宝玉知道麝月和袭人要好，连麝月也一起不理，掀起软帘自己进了里间。
麝月只得跟进来。|麝月只好跟进来。
宝玉便推他出去，说：“不敢惊动你们。”|宝玉就把她推出去，说：“不敢惊动你们。”
麝月只得笑著出来，唤了两个小丫头进来。|麝月只好笑着出来，叫了两个小丫头进去。
宝玉拿一本书，歪著看了半天，因要茶，抬头只见两个小丫头在地下站著。|宝玉拿了一本书，靠着看了半天，因为要喝茶，抬头只见两个小丫头在地上站着。
一个大些儿的生得十分水秀，宝玉便问：“你叫什么名字？”|一个大一点的长得十分水灵秀气，宝玉就问：“你叫什么名字？”
那丫头便说：“叫蕙香。”|那丫头说：“叫蕙香。”
宝玉便问：“是谁起的？”|宝玉问：“是谁起的？”
蕙香道：“我原叫芸香的，是花大姐姐改了蕙香。”|蕙香说：“我原来叫芸香，是花大姐姐改成了蕙香。”
宝玉道：“正经该叫‘晦气’罢了，什么蕙香呢！”|宝玉说：“正经该叫‘晦气’才对，什么蕙香呢！”
又问：“你姊妹几个？”|又问：“你们姐妹几个？”
蕙香道：“四个。”|蕙香说：“四个。”
宝玉道：“你第几？”|宝玉问：“你排第几？”
蕙香道：“第四。”|蕙香说：“第四。”
宝玉道：“明儿就叫‘四儿’，不必什么‘蕙香’‘兰气’的。|宝玉说：“以后就叫‘四儿’，不必什么‘蕙香’‘兰气’的。
那一个配比这些花，没的玷辱了好名好姓。”|哪一个配得上这些花，白白糟蹋了好名字。”
一面说，一面命他倒了茶来吃。|一边说，一边叫她倒茶来喝。
袭人和麝月在外间听了抿嘴而笑。|袭人和麝月在外间听了，抿着嘴笑。
! “蕙香”是袭人取的，宝玉偏要改成“四儿”，故意跟袭人作对。“没的玷辱了好名好姓”是说给外间的袭人听的。
! 袭人和麝月“抿嘴而笑”：她们知道宝玉这是在赌气，撑不了多久。

# 九、宝玉独自闷着
这一日，宝玉也不大出房，也不和姊妹丫头等厮闹，自己闷闷的，只不过拿著书解闷，或弄笔墨，也不使唤众人，只叫四儿答应。|这一天，宝玉也不大出门，也不跟姐妹丫头们玩闹，一个人闷闷的，只拿着书解闷，或者写写画画，也不使唤别人，只叫四儿伺候。
谁知四儿是个聪敏乖巧不过的丫头，见宝玉用他，他变尽方法笼络宝玉。|谁知四儿是个聪明伶俐极了的丫头，见宝玉用她，就想尽办法讨好宝玉。
至晚饭后，宝玉因吃了两杯酒，眼饧耳热之际，|到了晚饭后，宝玉喝了两杯酒，正是眼睛发涩、耳朵发热的时候，
若往日则有袭人等大家喜笑有兴，今日却冷清清的一人对灯，好没兴趣。|要是往常，有袭人她们大家说说笑笑，很有兴致，今天却冷冷清清一个人对着灯，好没意思。
待要赶了他们去，又怕他们得了意，以后越发来劝，|想去把她们叫来，又怕她们得意，以后更要来劝他；
若拿出做上的规矩来镇唬，似乎无情太甚。|要是拿出主子的规矩来压她们，又好像太无情了。
说不得横心只当他们死了，横竖自然也要过的。|只好狠下心来，只当她们死了，反正日子也照样要过。
便权当他们死了，毫无牵挂，反能怡然自悦。|就暂且当她们死了，毫无牵挂，反倒能自得其乐。
因命四儿剪灯烹茶，自己看了一回《南华经》。|就叫四儿剪灯花、煮茶，自己看了一会儿《南华经》。
! 四儿“变尽方法笼络宝玉”，这一笔埋得很深。第七十七回王夫人抄检大观园后，四儿因为和宝玉同一天生日、说过“同日生日就是夫妻”的玩笑，被撵了出去。
! 《南华经》就是《庄子》。宝玉赌气时读庄子，想的是“当他们死了”，这是他第一次想“看破”。

# 十、《庄子·胠箧》
正看至《外篇·胠箧》一则，其文曰：|正看到《外篇·胠箧》一段，原文说：
故绝圣弃知，大盗乃止，擿玉毁珠，小盗不起，|所以抛弃圣人和智慧，大盗就会消失；扔掉美玉、毁掉珍珠，小偷就不会出现；
焚符破玺，而民朴鄙，掊斗折衡，而民不争，|烧掉符信、打碎印玺，百姓就会淳朴；砸烂斗、折断秤，百姓就不会争夺；
殚残天下之圣法，而民始可与论议。|彻底毁掉天下圣人的礼法，才可以和百姓讲道理。
擢乱六律，铄绝竽瑟，塞瞽旷之耳，而天下始人含其聪矣；|搅乱六律，毁掉竽瑟，堵住师旷的耳朵，天下人才能保有自己的听觉；
灭文章，散五采，胶离朱之目，而天下始人含其明矣，|消灭花纹，抛散五彩，粘住离朱的眼睛，天下人才能保有自己的视力；
毁绝钩绳而弃规矩，攦工倕之指，而天下始人有其巧矣。|毁掉曲尺墨线、扔掉圆规角尺，折断巧匠工倕的手指，天下人才能保有自己的灵巧。
! 庄子的意思是：一切聪明、技巧、礼法，都是祸乱的根源，毁掉它们，人才能回到本真。师旷是古代的乐师，离朱是古代眼力最好的人，工倕是古代的巧匠。

# 十一、宝玉续《庄子》
看至此，意趣洋洋，趁著酒兴，不禁提笔续曰：|看到这里，兴致勃勃，趁着酒兴，忍不住提笔续写道：
焚花散麝，而闺阁始人含其劝矣，|烧掉花（袭人）、赶走麝（麝月），闺阁里的人才会把劝诫藏在心里不说；
戕宝钗之仙姿，灰黛玉之灵窍，丧减情意，而闺阁之美恶始相类矣。|毁掉宝钗的美貌，灭掉黛玉的灵慧，消除情意，闺阁里的美丑才会一样。
彼含其劝，则无参商之虞矣，|她们不劝了，就不会有不和的担忧了；
戕其仙姿，无恋爱之心矣，|毁掉她的美貌，就没有爱恋之心了；
灰其灵窍，无才思之情矣。|灭掉她的灵慧，就没有对才情的倾慕了。
彼钗，玉，花，麝者，皆张其罗而穴其隧，所以迷眩缠陷天下者也。|那宝钗、黛玉、袭人、麝月这些人，都是张开罗网、挖好陷阱，用来迷惑、缠绕、陷害天下人的。
续毕，掷笔就寝。|写完，扔下笔就睡了。
! 宝玉模仿庄子的句法，把“绝圣弃知”换成“焚花散麝”。他想的是：只要没有这些女孩子，他就不会烦恼。
! 这是气话，也是宝玉“悟道”的第一步。他后来终究出家，离开的正是“钗、玉、花、麝”。

# 十二、和好
头刚著枕便忽睡去，一夜竟不知所之，直至天明方醒。|头刚挨着枕头就睡着了，一夜都不知道身在何处，一直到天亮才醒。
翻身看时，只见袭人和衣睡在衾上。|翻身一看，只见袭人穿着衣服睡在被子上面。
宝玉将昨日的事已付与度外，便推他说道：“起来好生睡，看冻著了。”|宝玉早把昨天的事抛到脑后了，就推她说：“起来好好睡，小心冻着。”
原来袭人见他无晓夜和姊妹们厮闹，若直劝他，料不能改，故用柔情以警之，料他不过半日片刻仍复好了。|原来袭人见他不分白天黑夜和姐妹们玩闹，要是直接劝他，料想他改不了，所以用柔情来警醒他，以为他过不了半天一会儿就会好的。
不想宝玉一日夜竟不回转，自己反不得主意，直一夜没好生睡得。|没想到宝玉一天一夜竟然不回心转意，她自己反倒没了主意，一整夜都没睡好。
今忽见宝玉如此，料他心意回转，便越性不睬他。|现在忽然见宝玉这样，料想他回心转意了，就干脆不理他。
宝玉见他不应，便伸手替他解衣，刚解开了钮子，被袭人将手推开，又自扣了。|宝玉见她不答应，就伸手替她解衣服，刚解开扣子，就被袭人把手推开，又自己扣上了。
宝玉无法，只得拉他的手笑道：“你到底怎么了？”|宝玉没办法，只好拉着她的手笑道：“你到底怎么了？”
连问几声，袭人睁眼说道：“我也不怎么。|连问了几声，袭人才睁开眼说：“我也不怎么。
你睡醒了，你自过那边房里去梳洗，再迟了就赶不上。”|你睡醒了，你自己到那边屋里去梳洗，再晚就赶不上了。”
宝玉道：“我过那里去？”|宝玉说：“我到哪里去？”
袭人冷笑道：“你问我，我知道？你爱往那里去，就往那里去。|袭人冷笑道：“你问我，我怎么知道？你爱到哪里去，就到哪里去。
从今咱们两个丢开手，省得鸡声鹅斗，叫别人笑。|从今以后咱们两个撒开手，省得吵吵闹闹，叫别人笑话。
横竖那边腻了过来，这边又有个什么‘四儿’‘五儿’伏侍。|反正那边腻了回到这边，这边又有个什么‘四儿’‘五儿’伺候。
我们这起东西，可是白‘玷辱了好名好姓’的。”|我们这些东西，可是白白‘玷辱了好名好姓’的。”
宝玉笑道：“你今儿还记著呢！”|宝玉笑道：“你今天还记着呢！”
袭人道：“一百年还记著呢！|袭人说：“一百年都记着呢！
比不得你，拿著我的话当耳旁风，夜里说了，早起就忘了。”|不像你，拿我的话当耳边风，夜里说了，早上就忘了。”
宝玉见他娇嗔满面，情不可禁，便向枕边拿起一根玉簪来，一跌两段，说道：|宝玉见她满脸娇嗔，情不自禁，就从枕边拿起一根玉簪，一摔两段，说：
“我再不听你说，就同这个一样。”|“我要是再不听你的话，就跟这根簪子一样。”
袭人忙的拾了簪子，说道：“大清早起，这是何苦来！|袭人连忙捡起簪子，说：“大清早的，这是何苦呢！
听不听什么要紧，也值得这种样子。”|听不听有什么要紧，也值得这样。”
宝玉道：“你那里知道我心里急！”|宝玉说：“你哪里知道我心里急！”
袭人笑道：“你也知道著急么！可知我心里怎么样？快起来洗脸去罢。”|袭人笑道：“你也知道着急了！那你可知道我心里怎么样？快起来洗脸去吧。”
说著，二人方起来梳洗。|说着，两人才起来梳洗。
! 袭人“和衣睡在衾上”，是一夜没睡好、等着宝玉回心。她的“柔情以警之”是计，可她自己也慌了。
! 宝玉摔簪发誓，又是一个誓言。可这样的誓言，他发过不止一次，“夜里说了，早起就忘了”。

# 十三、黛玉续诗
宝玉往上房去后，谁知黛玉走来，见宝玉不在房中，因翻弄案上书看，可巧翻出昨儿的《庄子》来。|宝玉到上房去以后，谁知黛玉来了，见宝玉不在屋里，就翻看桌上的书，正好翻出昨天那本《庄子》来。
看至所续之处，不觉又气又笑，不禁也提笔续书一绝云：|看到他续写的地方，不由得又气又笑，也忍不住提笔续写了一首绝句：
~无端弄笔是何人？作践南华《庄子因》。|是谁无缘无故地舞文弄墨？糟蹋了《南华经》，糟蹋了《庄子因》。
~不悔自己无见识，却将丑语怪他人！|不后悔自己没有见识，却用难听的话去怪别人！
写毕，也往上房来见贾母，后往王夫人处来。|写完，也到上房去见贾母，然后又到王夫人那里去了。
! 《庄子因》是清代林云铭注解庄子的书。
! 宝玉说要“灰黛玉之灵窍”，黛玉看见了，不恼他咒自己，只笑他“无见识”。她和宝玉是最能互相读懂的人。

# 十四、大姐出痘
谁知凤姐之女大姐病了，正乱著请大夫来诊脉。|谁知凤姐的女儿大姐病了，正乱着请大夫来看病。
大夫便说：“替夫人奶奶们道喜，姐儿发热是见喜了，并非别病。”|大夫说：“给夫人奶奶们道喜，姐儿发烧是出喜（出天花）了，不是别的病。”
王夫人凤姐听了，忙遣人问：“可好不好？”|王夫人、凤姐听了，连忙派人问：“要紧不要紧？”
医生回道：“病虽险，却顺，倒还不妨。|医生回答：“病虽然凶险，却顺当，倒还不要紧。
预备桑虫猪尾要紧。”|要紧的是预备桑虫和猪尾巴。”
凤姐听了，登时忙将起来：|凤姐听了，马上忙起来：
一面打扫房屋供奉痘疹娘娘，一面传与家人忌煎炒等物，|一面打扫房屋供奉痘疹娘娘，一面传话给家里人，忌吃煎炒的东西，
一面命平儿打点铺盖衣服与贾琏隔房，|一面叫平儿收拾铺盖衣服，让贾琏搬到别的屋子去住，
一面又拿大红尺头与奶子丫头亲近人等裁衣。|一面又拿大红布料给奶妈丫头和亲近的人做衣服。
外面又打扫净室，款留两个医生，轮流斟酌诊脉下药，十二日不放家去。|外面又打扫出干净屋子，留下两位医生，轮流斟酌着诊脉下药，十二天不放他们回家。
贾琏只得搬出外书房来斋戒，凤姐与平儿都随著王夫人日日供奉娘娘。|贾琏只好搬到外书房去斋戒，凤姐和平儿都跟着王夫人天天供奉痘疹娘娘。
! 旧时把出天花叫“见喜”，是避讳的说法。桑虫、猪尾是当时治痘疹的偏方。
! 供奉痘疹娘娘期间要夫妻分房、斋戒。贾琏一离开凤姐，就出了下面的事。
! 这个大姐，就是后来刘姥姥给起名的巧姐。

# 十五、贾琏和多姑娘
那个贾琏，只离了凤姐便要寻事，独寝了两夜，便十分难熬，便暂将小厮们内有清俊的选来出火。|那个贾琏，只要一离开凤姐就要惹事，独自睡了两夜，就十分难熬，就暂时从小厮里挑了长得清秀的来泄火。
不想荣国府内有一个极不成器破烂酒头厨子，名叫多官，人见他懦弱无能，都唤他作“多浑虫”。|荣国府里有一个极不成器、烂醉如泥的厨子，名叫多官，人们见他懦弱无能，都叫他“多浑虫”。
因他自小父母替他在外娶了一个媳妇，今年方二十来往年纪，生得有几分人才，见者无不羡爱。|因为他从小父母就给他在外面娶了个媳妇，今年才二十来岁，长得有几分姿色，见了的人没有不羡慕喜欢的。
他生性轻浮，最喜拈花惹草，多浑虫又不理论，只是有酒有肉有钱，便诸事不管了，所以荣宁二府之人都得入手。|她生性轻浮，最喜欢勾三搭四，多浑虫又不管，只要有酒有肉有钱，什么事都不管，所以荣宁二府的男人都能和她勾搭上。
因这个媳妇美貌异常，轻浮无比，众人都呼他作“多姑娘儿”。|因为这个媳妇美貌出众，又轻浮无比，大家都叫她“多姑娘”。
如今贾琏在外熬煎，往日也曾见过这媳妇，失过魂魄，只是内惧娇妻，外惧娈宠，不曾下得手。|现在贾琏在外面熬着，以前也见过这个媳妇，被她迷得失魂落魄，只是在家怕娇妻，在外怕身边的小厮，一直没得手。
那多姑娘儿也曾有意于贾琏，只恨没空。|那多姑娘也早对贾琏有意，只恨没有机会。
今闻贾琏挪在外书房来，他便没事也要走两趟去招惹。|现在听说贾琏搬到外书房来了，她没事也要去走两趟，招惹他。
惹的贾琏似饥鼠一般，少不得和心腹的小厮们计议，合同遮掩谋求，多以金帛相许。|惹得贾琏像饿老鼠一样，只好和心腹小厮们商量，让他们一起遮掩、帮着谋划，许给他们不少金银布帛。
小厮们焉有不允之理，况都和这媳妇是好友，一说便成。|小厮们哪有不答应的道理，况且他们都和这媳妇相好，一说就成了。
是夜二鼓人定，多浑虫醉昏在炕，贾琏便溜了来相会。|这天夜里二更时分，人都睡了，多浑虫醉倒在炕上，贾琏就溜过来和她相会。
进门一见其态，早已魄飞魂散，也不用情谈款叙，便宽衣动作起来。|（以下是两人私会的露骨描写，白话从略。）
谁知这媳妇有天生的奇趣，一经男子挨身，便觉遍身筋骨瘫软，使男子如卧绵上，|（略）
更兼淫态浪言，压倒娼妓，诸男子至此岂有惜命者哉。|（略）
那贾琏恨不得连身子化在他身上。|（略）
那媳妇故作浪语，在下说道：“你家女儿出花儿，供著娘娘，你也该忌两日，倒为我脏了身子。快离了我这里罢。”|那媳妇故意说：“你家女儿出天花，正供着娘娘，你也该忌讳两天，倒为了我弄脏了身子。快离开我这里吧。”
贾琏一面大动，一面喘吁吁答道：“你就是娘娘！我那里管什么娘娘！”|贾琏喘着气说：“你就是娘娘！我哪里管什么娘娘！”
那媳妇越浪，贾琏越丑态毕露。|（略）
一时事毕，两个又海誓山盟，难分难舍，此后遂成相契。|事后两人又海誓山盟，难分难舍，从此就成了相好。
! 女儿正在生死关头，全家都在斋戒供奉，贾琏却在外面偷情。“你就是娘娘！我那里管什么娘娘”，一句话写尽了他的荒唐。
! 多浑虫夫妇后面还会出现：第七十七回晴雯被撵出大观园，死在她姑舅哥哥家，有的版本里这位哥哥就是多浑虫，那个轻浮的嫂子就是多姑娘一路的人物。

# 十六、大姐痊愈
一日大姐毒尽斑回，十二日后送了娘娘，合家祭天祀祖，还愿焚香，庆贺放赏已毕，贾琏仍复搬进卧室。|大姐的痘毒发尽、斑疹消退了，十二天后送走了痘疹娘娘，全家祭天祭祖、还愿烧香，庆贺放赏都完了，贾琏又搬回卧室。
见了凤姐，正是俗语云“新婚不如远别”，更有无限恩爱，自不必烦絮。|见了凤姐，正如俗话说的“新婚不如久别”，更是无限恩爱，自不必多说。
! 贾琏刚和多姑娘海誓山盟，回来又和凤姐“无限恩爱”。作者冷冷地用了一句俗话。

# 十七、平儿发现一绺头发
次日早起，凤姐往上屋去后，平儿收拾贾琏在外的衣服铺盖，不承望枕套中抖出一绺青丝来。|第二天早上，凤姐到上房去以后，平儿收拾贾琏在外面用的衣服铺盖，没想到从枕套里抖出一绺黑头发来。
平儿会意，忙拽在袖内，便走至这边房内来，拿出头发来，向贾琏笑道：“这是什么？”|平儿心里明白，连忙塞进袖子里，走到这边屋里来，拿出头发，对贾琏笑道：“这是什么？”
贾琏看见著了忙，抢上来要夺。|贾琏一看慌了，抢上来要夺。
平儿便跑，被贾琏一把揪住，按在炕上，掰手要夺，|平儿转身就跑，被贾琏一把揪住，按在炕上，掰她的手要夺，
口内笑道：“小蹄子，你不趁早拿出来，我把你膀子橛折了。”|嘴里笑道：“小蹄子，你不趁早拿出来，我把你胳膊撅断了。”
平儿笑道：“你就是没良心的。我好意瞒著他来问，你倒赌狠！|平儿笑道：“你就是没良心。我好心瞒着她来问你，你倒发狠！
你只赌狠，等他回来我告诉他，看你怎么著。”|你只管发狠，等她回来我告诉她，看你怎么办。”
贾琏听说，忙陪笑央求道：“好人，赏我罢，我再不赌狠了。”|贾琏听了，连忙陪笑央求：“好人，给我吧，我再也不发狠了。”
! 女人的头发是相好之间的信物。平儿一看就明白，却先来问贾琏，不去告诉凤姐。这就是回目里的“俏平儿软语救贾琏”。

# 十八、凤姐盘问
一语未了，只听凤姐声音进来。|话还没说完，只听见凤姐的声音进来了。
贾琏听见松了手，平儿刚起身，凤姐已走进来，命平儿快开匣子，替太太找样子。|贾琏一听就松了手，平儿刚站起来，凤姐已经走进来了，叫平儿快开匣子，替太太找花样。
平儿忙答应了找时，凤姐见了贾琏，忽然想起来，便问平儿：“拿出去的东西都收进来了么？”|平儿连忙答应着去找，凤姐看见贾琏，忽然想起来，就问平儿：“拿出去的东西都收进来了吗？”
平儿道：“收进来了。”|平儿说：“收进来了。”
凤姐道：“可少什么没有？”|凤姐问：“少了什么没有？”
平儿道：“我也怕丢下一两件，细细的查了查，也不少。”|平儿说：“我也怕丢了一两件，仔细查了查，一件也不少。”
凤姐道：“不少就好，只是别多出来罢？”|凤姐说：“不少就好，只怕别多出什么来吧？”
平儿笑道：“不丢万幸，谁还添出来呢？”|平儿笑道：“不丢就是万幸了，谁还会多出来呢？”
凤姐冷笑道：“这半个月难保干净，或者有相厚的丢下的东西：|凤姐冷笑道：“这半个月难保干净，说不定有相好的丢下什么东西：
戒指，汗巾，香袋儿，再至于头发，指甲，都是东西。”|戒指、汗巾、香袋，甚至头发、指甲，都算是东西。”
一席话，说的贾琏脸都黄了。|一席话说得贾琏脸都黄了。
贾琏在凤姐身后，只望著平儿杀鸡抹脖使眼色儿。|贾琏在凤姐身后，只望着平儿又抹脖子又使眼色。
平儿只装著看不见，因笑道：“怎么我的心就和奶奶的心一样！|平儿只装作没看见，笑道：“怎么我的心思就跟奶奶的心思一样！
我就怕有这些个，留神搜了一搜，竟一点破绽也没有。|我就怕有这些东西，留心搜了一搜，竟然一点破绽都没有。
奶奶不信时，那些东西我还没收呢，奶奶亲自翻寻一遍去。”|奶奶要是不信，那些东西我还没收起来，奶奶亲自去翻一遍。”
凤姐笑道：“傻丫头，他便有这些东西，那里就叫咱们翻著了！”|凤姐笑道：“傻丫头，他就是有这些东西，哪里会让咱们翻着！”
说著，寻了样子又上去了。|说着找到了花样，又上去了。
! 凤姐偏偏说出“头发”两个字，贾琏吓得脸都黄了。凤姐未必知道，却句句都在点子上。
! 平儿一句“奶奶亲自翻寻一遍去”，以退为进，是最高明的遮掩。凤姐反倒不翻了。

# 十九、平儿的把柄
平儿指著鼻子，晃著头笑道：“这件事怎么回谢我呢？”|平儿指着自己的鼻子，晃着头笑道：“这件事你怎么谢我？”
喜的个贾琏身痒难挠，跑上来搂著，“心肝肠肉”乱叫乱谢。|喜得贾琏心痒难耐，跑上来搂住她，“心肝宝贝”地乱叫乱谢。
平儿仍拿了头发笑道：“这是我一生的把柄了。好就好，不好就抖露出这事来。”|平儿还拿着头发笑道：“这可是我一辈子的把柄了。你待我好就好，不好我就把这事抖出来。”
贾琏笑道：“你只好生收著罢，千万别叫他知道。”|贾琏笑道：“你只管好好收着吧，千万别让她知道。”
口里说著，瞅他不防，便抢了过来，笑道：|嘴里说着，趁她不防备，一把抢了过来，笑道：
“你拿著终是祸患，不如我烧了他完事了。”|“你拿着终究是个祸害，不如我烧了它了事。”
一面说著，一面便塞于靴掖内。|一边说，一边塞进了靴掖里。
平儿咬牙道：“没良心的东西，过了河就拆桥，明儿还想我替你撒谎！”|平儿咬着牙说：“没良心的东西，过了河就拆桥，以后还想让我替你撒谎！”
! 贾琏嘴上说“烧了”，实际塞进靴子里藏了起来，可见他还舍不得。

# 二十、平儿跑了
贾琏见他娇俏动情，便搂著求欢，被平儿夺手跑了，|贾琏见她娇俏动人，就搂着她求欢，被平儿挣开手跑了，
急的贾琏弯著腰恨道：“死促狭小淫妇！一定浪上人的火来，他又跑了。”|急得贾琏弯着腰恨道：“该死的捉弄人的小淫妇！一定要撩起人的火来，她又跑了。”
平儿在窗外笑道：“我浪我的，谁叫你动火了？|平儿在窗外笑道：“我浪我的，谁叫你动火了？
难道图你受用一回，叫他知道了，又不待见我。”|难道为了让你快活一回，叫她知道了，又不待见我。”
贾琏道：“你不用怕他，等我性子上来，把这醋罐打个稀烂，他才认得我呢！|贾琏说：“你不用怕她，等我性子上来，把这个醋罐子打个稀烂，她才知道我的厉害！
他防我象防贼的，只许他同男人说话，不许我和女人说话，我和女人略近些，他就疑惑，|她防我像防贼一样，只许她跟男人说话，不许我跟女人说话，我跟女人稍微近一点，她就起疑心；
他不论小叔子侄儿，大的小的，说说笑笑，就不怕我吃醋了。|她不管是小叔子还是侄儿，大的小的，说说笑笑，就不怕我吃醋了。
以后我也不许他见人！”|以后我也不许她见人！”
平儿道：“他醋你使得，你醋他使不得。|平儿说：“她吃你的醋行，你吃她的醋可不行。
他原行的正走的正，你行动便有个坏心，连我也不放心，别说他了。”|她本来行得正走得正，你一动就有坏心眼，连我都不放心，更别说她了。”
贾琏道：“你两个一口贼气。都是你们行的是，我凡行动都存坏心。多早晚都死在我手里！”|贾琏说：“你们两个一个鼻孔出气。都是你们对，我做什么都存坏心。早晚都死在我手里！”
! 平儿是凤姐的陪嫁丫头，也是贾琏的通房丫头，夹在两人中间，处境最难。她不敢和贾琏亲近，正是怕凤姐。
! 贾琏说凤姐和“小叔子侄儿”说笑，指的是贾蓉、贾蔷等人。凤姐和贾蓉的关系，书里写得暧昧，这里又点了一笔。

# 二十一、凤姐回来
一句未了，凤姐走进院来，因见平儿在窗外，就问道：|一句话还没说完，凤姐走进院子来，看见平儿在窗外，就问：
“要说话两个人不在屋里说，怎么跑出一个来，隔著窗子，是什么意思？”|“要说话，两个人不在屋里说，怎么跑出一个来，隔着窗子说，是什么意思？”
贾琏在窗内接道：“你可问他，倒象屋里有老虎吃他呢。”|贾琏在窗里接话说：“你倒问问她，好像屋里有老虎要吃她似的。”
平儿道：“屋里一个人没有，我在他跟前作什么？”|平儿说：“屋里一个人也没有，我在他跟前做什么？”
凤姐儿笑道：“正是没人才好呢。”|凤姐笑道：“正是没人才好呢。”
平儿听说，便说道：“这话是说我呢？”|平儿听了，就说：“这话是说我吗？”
凤姐笑道：“不说你说谁？”|凤姐笑道：“不说你说谁？”
平儿道：“别叫我说出好话来了。”|平儿说：“别逼我说出好听的话来。”
说著，也不打帘子让凤姐，自己先摔帘子进来，往那边去了。|说着，也不打帘子让凤姐先进，自己先一摔帘子进来，往那边去了。
凤姐自掀帘子进来，说道：“平儿疯魔了。|凤姐自己掀开帘子进来，说：“平儿疯了。
这蹄子认真要降伏我，仔细你的皮要紧！”|这丫头当真要来降伏我了，小心你的皮！”
贾琏听了，已绝倒在炕上，拍手笑道：“我竟不知平儿这么利害，从此倒伏他了。”|贾琏听了，已经笑倒在炕上，拍手笑道：“我竟不知道平儿这么厉害，从此倒要服她了。”
凤姐道：“都是你惯的他，我只和你说！”|凤姐说：“都是你惯的她，我只找你算账！”
贾琏听说忙道：“你两个不卯，又拿我来作人。我躲开你们。”|贾琏听了忙说：“你们两个不和，又拿我来出气。我躲开你们。”
凤姐道：“我看你躲到那里去。”|凤姐说：“我看你躲到哪里去。”
贾琏道：“我就来。”|贾琏说：“我马上就来。”
凤姐道：“我有话和你商量。”|凤姐说：“我有话跟你商量。”
不知商量何事，且听下回分解。|不知商量什么事，请看下回分解。
正是：|正是：
~淑女从来多抱怨，娇妻自古便含酸。|贤淑的女子向来多有抱怨，娇美的妻子自古就爱吃醋。
! 平儿难得顶撞凤姐一回，“摔帘子进来”，可见她心里也有委屈。凤姐的一句“正是没人才好呢”，戳到了她最难言的地方。
! 这一回写了三个女人的“箴”与“救”：袭人箴宝玉，用的是娇嗔；平儿救贾琏，用的是机智。回末两句诗是作者的感叹。
</script>

<script type="text/plain" id="ch22">
# 一、宝钗的生日怎么办
话说贾琏听凤姐儿说有话商量，因止步问是何话。|贾琏听凤姐说有话要商量，就停下脚步问是什么事。
凤姐道：“二十一是薛妹妹的生日，你到底怎么样呢？”|凤姐说：“二十一号是薛妹妹的生日，你到底打算怎么办？”
贾琏道：“我知道怎么样！你连多少大生日都料理过了，这会子倒没了主意？”|贾琏说：“我哪知道怎么办！你连多少大生日都操办过了，这会儿倒没了主意？”
凤姐道：“大生日料理，不过是有一定的则例在那里。|凤姐说：“操办大生日，不过是有现成的规矩在那里。
如今他这生日，大又不是，小又不是，所以和你商量。”|现在她这个生日，说大不大，说小不小，所以跟你商量。”
贾琏听了，低头想了半日道：“你今儿糊涂了。|贾琏听了，低头想了半天说：“你今天糊涂了。
现有比例，那林妹妹就是例。|现成有个例子，林妹妹就是例子。
往年怎么给林妹妹过的，如今也照依给薛妹妹过就是了。”|往年怎么给林妹妹过的，现在也照样给薛妹妹过就是了。”
凤姐听了，冷笑道：“我难道连这个也不知道？我原也这么想定了。|凤姐听了，冷笑道：“我难道连这个都不知道？我本来也是这么想的。
但昨儿听见老太太说，问起大家的年纪生日来，听见薛大妹妹今年十五岁，虽不是整生日，也算得将笄之年。|可昨天听老太太说，问起大家的年纪生日，听说薛大妹妹今年十五岁，虽然不是整生日，也算是快到成年的年纪了。
老太太说要替他作生日。|老太太说要给她做生日。
想来若果真替他作，自然比往年与林妹妹的不同了。”|想来要是真给她做，自然要和往年给林妹妹过的不一样了。”
贾琏道：“既如此，比林妹妹的多增些。”|贾琏说：“既然这样，就比林妹妹的多加一些。”
凤姐道：“我也这们想著，所以讨你的口气。|凤姐说：“我也是这么想的，所以来问问你的意思。
我若私自添了东西，你又怪我不告诉明白你了。”|我要是私自添了东西，你又要怪我没跟你说清楚了。”
贾琏笑道：“罢，罢，这空头情我不领。你不盘察我就够了，我还怪你！”|贾琏笑道：“算了，算了，这空头人情我不领。你不盘问我就够了，我还怪你！”
说著，一径去了，不在话下。|说完就走了，这里不多说。
! “将笄之年”：古代女子十五岁行笄礼，表示可以出嫁了。贾母偏偏在宝钗十五岁时特意给她做生日，这里面有贾母对宝钗的看重。
! 宝钗的生日要比黛玉的“多增些”，凤姐把分寸掂量得清清楚楚。黛玉要是知道，心里会怎么想？
! 贾琏“你不盘察我就够了”，还在心虚上一回那绺头发。

# 二、湘云留下，贾母出钱
且说史湘云住了两日，因要回去。|再说史湘云住了两天，要回去了。
贾母因说：“等过了你宝姐姐的生日，看了戏再回去。”|贾母就说：“等过了你宝姐姐的生日，看了戏再回去。”
史湘云听了，只得住下。|史湘云听了，只好住下。
又一面遣人回去，将自己旧日作的两色针线活计取来，为宝钗生辰之仪。|又派人回家，把自己以前做的两样针线活拿来，作为宝钗的生日礼物。
谁想贾母自见宝钗来了，喜他稳重和平，正值他才过第一个生辰，便自己蠲资二十两，唤了凤姐来，交与他置酒戏。|原来贾母自从宝钗来了，就喜欢她稳重平和，正赶上她来了以后过第一个生日，就自己拿出二十两银子，叫来凤姐，交给她置办酒席和戏班。
! 湘云的礼物是“自己旧日作的”针线。她家里叔婶管得紧，没什么钱，后面第三十二回宝钗说湘云在家要做针线到半夜。
! 贾母亲自出钱给宝钗过生日，是很重的面子。

# 三、凤姐凑趣
凤姐凑趣笑道：“一个老祖宗给孩子们作生日，不拘怎样，谁还敢争，又办什么酒戏。|凤姐凑趣笑道：“老祖宗给孩子们过生日，不管怎么样，谁还敢争，还办什么酒席戏班。
既高兴要热闹，就说不得自己花上几两。|既然高兴要热闹，就少不得自己花上几两。
巴巴的找出这霉烂的二十两银子来作东道，这意思还叫我赔上。|巴巴地找出这二十两发霉的银子来请客，这意思还要我来贴钱。
果然拿不出来也罢了，金的、银的，圆的、扁的，压塌了箱子底，只是勒掯我们。|要是真拿不出来也就罢了，金的、银的、圆的、扁的，把箱子底都压塌了，只是来为难我们。
举眼看看，谁不是儿女？难道将来只有宝兄弟顶了你老人家上五台山不成？|抬眼看看，谁不是您的儿女？难道将来只有宝兄弟把您老人家顶在头上送上五台山不成？
那些梯己只留于他，我们如今虽不配使，也别苦了我们。|那些私房钱只留给他，我们现在虽然不配用，也别太苦了我们。
这个够酒的？够戏的？”|这点钱够办酒的？够请戏的？”
说的满屋里都笑起来。|说得满屋子的人都笑起来。
贾母亦笑道：“你们听听这嘴！我也算会说的，怎么说不过这猴儿。|贾母也笑道：“你们听听这张嘴！我也算会说话的，怎么说不过这猴儿。
你婆婆也不敢强嘴，你和我绑绑的。”|你婆婆都不敢跟我顶嘴，你倒跟我硬碰硬的。”
凤姐笑道：“我婆婆也是一样的疼宝玉，我也没处去诉冤，倒说我强嘴。”|凤姐笑道：“我婆婆也一样疼宝玉，我也没地方诉冤，倒说我顶嘴。”
说著，又引著贾母笑了一回，贾母十分喜悦。|说着又引得贾母笑了一阵，贾母非常高兴。
! “上五台山”是死后升天的委婉说法。凤姐敢当着贾母开她身后事的玩笑，满屋子只有她敢这样，也只有她能让贾母这样开心。
! 凤姐表面抱怨贾母偏心宝玉，其实是在逗贾母开心，顺便恭维贾母有钱。

# 四、宝钗投贾母所好
到晚间，众人都在贾母前，定昏之馀，大家娘儿姊妹等说笑时，|到了晚上，大家都在贾母跟前，晚间请安以后，娘儿们姐妹们说笑的时候，
贾母因问宝钗爱听何戏，爱吃何物等语。|贾母就问宝钗爱听什么戏、爱吃什么东西。
宝钗深知贾母年老人，喜热闹戏文，爱吃甜烂之食，便总依贾母往日素喜者说了出来。|宝钗深知贾母是老年人，喜欢热闹的戏，爱吃甜的、软烂的东西，就都照着贾母平时喜欢的说了出来。
贾母更加欢悦。|贾母更加高兴了。
次日便先送过衣服玩物礼去，王夫人，凤姐，黛玉等诸人皆有随分不一，不须多记。|第二天就先送去了衣服玩物作为礼物，王夫人、凤姐、黛玉等人也都各自送了礼，不必多记。
! 宝钗被问自己爱什么，说的却全是贾母爱的。这是宝钗的“会做人”，也是很多读者不喜欢她的地方：她似乎从不说自己真正喜欢什么。

# 五、黛玉的醋话
至二十一日，就贾母内院中搭了家常小巧戏台，定了一班新出小戏，昆弋两腔皆有。|到了二十一号，就在贾母的内院里搭起一座家常的小巧戏台，订了一班新出的小戏班，昆腔和弋阳腔都会唱。
就在贾母上房排了几席家宴酒席，并无一个外客，只有薛姨妈、史湘云、宝钗是客，馀者皆是自己人。|就在贾母上房摆了几桌家宴，没有一个外客，只有薛姨妈、史湘云、宝钗是客人，其余都是自家人。
这日早起，宝玉因不见林黛玉，便到他房中来寻，只见林黛玉歪在炕上。|这天一早，宝玉因为没见到林黛玉，就到她房里来找，只见林黛玉靠在炕上。
宝玉笑道：“起来吃饭去，就开戏了。你爱看那一出？我好点。”|宝玉笑道：“起来吃饭去，就要开戏了。你爱看哪一出？我好去点。”
林黛玉冷笑道：“你既这样说，你特叫一班戏来，拣我爱的唱给我看。|林黛玉冷笑道：“你既然这么说，你就专门叫一班戏来，挑我爱看的唱给我看。
这会子犯不上跐著人借光儿问我。”|这会儿犯不着踩着别人、借别人的光来问我。”
宝玉笑道：“这有什么难的。明儿就这样行，也叫他们借咱们的光儿。”|宝玉笑道：“这有什么难的。明天就这么办，也叫他们借借咱们的光。”
一面说，一面拉起他来，携手出去。|一边说，一边把她拉起来，手拉手出去了。
! 黛玉不愿去，是因为这是宝钗的生日。“跐著人借光儿”，一句话里全是委屈和醋意。
! 宝玉一句“也叫他们借咱们的光儿”，就把黛玉哄好了。

# 六、点戏
吃了饭点戏时，贾母一定先叫宝钗点。|吃了饭点戏的时候，贾母一定要先叫宝钗点。
宝钗推让一遍，无法，只得点了一折《西游记》。|宝钗推让了一遍，没办法，只好点了一折《西游记》。
贾母自是欢喜，然后便命凤姐点。|贾母自然高兴，然后叫凤姐点。
凤姐亦知贾母喜热闹，更喜谑笑科诨，便点了一出《刘二当衣》。|凤姐也知道贾母喜欢热闹，更喜欢插科打诨的笑闹戏，就点了一出《刘二当衣》。
贾母果真更又喜欢，然后便命黛玉点。|贾母果然更高兴了，然后叫黛玉点。
黛玉因让薛姨妈王夫人等。|黛玉就让薛姨妈、王夫人等长辈先点。
贾母道：“今日原是我特带著你们取笑，咱们只管咱们的，别理他们。|贾母说：“今天本来是我特地带着你们玩乐，咱们只管咱们的，别理她们。
我巴巴的唱戏摆酒，为他们不成？|我巴巴地唱戏摆酒，难道是为了她们？
他们在这里白听白吃，已经便宜了，还让他们点呢！”|她们在这里白听白吃，已经占便宜了，还让她们点戏呢！”
说著，大家都笑了。|说得大家都笑了。
黛玉方点了一出。|黛玉这才点了一出。
然后宝玉，史湘云，迎，探，惜，李纨等俱各点了，接出扮演。|然后宝玉、史湘云、迎春、探春、惜春、李纨等人都各自点了，依次扮演。
! 宝钗点的戏、凤姐点的戏，都是投贾母所好的热闹戏。黛玉点了什么，作者没写。

# 七、《寄生草》
至上酒席时，贾母又命宝钗点。|到上酒席的时候，贾母又叫宝钗点戏。
宝钗点了一出《鲁智深醉闹五台山》。|宝钗点了一出《鲁智深醉闹五台山》。
宝玉道：“只好点这些戏。”|宝玉说：“只会点这种戏。”
宝钗道：“你白听了这几年的戏，那里知道这出戏的好处，排场又好，词藻更妙。”|宝钗说：“你白听了这几年戏，哪里知道这出戏的好处，排场又好，词句更妙。”
宝玉道：“我从来怕这些热闹。”|宝玉说：“我一向怕这些热闹戏。”
宝钗笑道：“要说这一出热闹，你还算不知戏呢。|宝钗笑道：“要说这一出是热闹戏，你就算不懂戏了。
你过来，我告诉你，这一出戏热闹不热闹。|你过来，我告诉你，这一出戏是不是热闹。
——是一套北《点绛唇》，铿锵顿挫，韵律不用说是好的了，|——这是一套北曲《点绛唇》，抑扬顿挫，音律自然是好的了，
只那词藻中有一支《寄生草》，填的极妙，你何曾知道。”|单说那词句里有一支《寄生草》，填得极妙，你哪里知道。”
宝玉见说的这般好，便凑近来央告：“好姐姐，念与我听听。”|宝玉见她说得这么好，就凑近来央求：“好姐姐，念给我听听。”
宝钗便念道：|宝钗就念道：
~漫揾英雄泪，相离处士家。|且擦去英雄的眼泪，离开这位处士（赵员外）的家。
~谢慈悲剃度在莲台下。|感谢师父慈悲，在莲台下为我剃度出家。
~没缘法转眼分离乍。|可惜没有缘分，转眼就要分离。
~赤条条来去无牵挂。|赤条条地来，赤条条地去，没有一点牵挂。
~那里讨烟蓑雨笠卷单行？|哪里还要什么烟雨中的蓑衣斗笠、卷起铺盖独自远行？
~一任俺芒鞋破钵随缘化！|任凭我穿着草鞋、拿着破钵，随缘化斋去！
! 鲁智深在五台山出家，又因醉酒闹事被赶下山，这支曲子是他辞别师父时唱的。
! “赤条条来去无牵挂”，宝玉一听就记住了，当天晚上就拿来写偈语。宝钗无意中点燃了宝玉心里的“出家”念头，她自己后来也说“都是我昨儿一支曲子惹出来的”。
! 宝钗连这些“杂书”“杂曲”都熟，可她平时总劝别人不要看。她的学问其实很杂，只是藏得深。

# 八、黛玉的讥讽
宝玉听了，喜的拍膝画圈，称赏不已，又赞宝钗无书不知，|宝玉听了，高兴得拍着膝盖、摇头晃脑，称赞不已，又夸宝钗什么书都知道。
林黛玉道：“安静看戏罢，还没唱《山门》，你倒《妆疯》了。”|林黛玉说：“安静看戏吧，还没唱到《山门》，你倒先《装疯》了。”
说的湘云也笑了。|说得湘云也笑了。
于是大家看戏。|于是大家看戏。
! 《山门》《妆疯》都是戏名，《山门》就是鲁智深这出，《妆疯》是另一出戏。黛玉随口用戏名讥讽宝玉，又巧又刻薄。她听宝玉夸宝钗“无书不知”，心里不舒服了。

# 九、小旦像林妹妹
至晚散时，贾母深爱那作小旦的与一个作小丑的，因命人带进来，细看时益发可怜见。|到晚上散戏的时候，贾母很喜欢那个演小旦的和一个演小丑的，就叫人带进来，仔细一看，更觉得可怜可爱。
因问年纪，那小旦才十一岁，小丑才九岁，大家叹息一回。|问起年纪，那小旦才十一岁，小丑才九岁，大家感叹了一番。
贾母令人另拿些肉果与他两个，又另外赏钱两串。|贾母叫人另外拿些肉和果子给他们两个，又另外赏了两串钱。
凤姐笑道：“这个孩子扮上活象一个人，你们再看不出来。”|凤姐笑道：“这个孩子扮上妆，活像一个人，你们再看不出来。”
宝钗心里也知道，便只一笑不肯说。|宝钗心里也知道，只是一笑，不肯说出来。
宝玉也猜著了，亦不敢说。|宝玉也猜到了，也不敢说。
史湘云接著笑道：“倒象林妹妹的模样儿。”|史湘云接着笑道：“倒像林妹妹的模样。”
宝玉听了，忙把湘云瞅了一眼，使个眼色。|宝玉听了，连忙瞅了湘云一眼，给她使了个眼色。
众人却都听了这话，留神细看，都笑起来了，说果然不错。|大家都听见了这话，留心仔细一看，都笑起来，说果然像。
一时散了。|一会儿就散了。
! 把一位小姐比作戏子，在当时是很大的侮辱。凤姐挑起话头，宝钗、宝玉都知道却不说，只有心直口快的湘云说了出来。
! 这个小旦，据脂批就是龄官。第三十回龄官画“蔷”，宝玉也觉得她“大有林黛玉之态”。

# 十、湘云恼了
晚间，湘云更衣时，便命翠缕把衣包打开收拾，都包了起来。|晚上湘云换衣服的时候，就叫翠缕把衣包打开，把东西都收拾好包起来。
翠缕道：“忙什么，等去的日子再包不迟。”|翠缕说：“忙什么，等走的那天再包也不迟。”
湘云道：“明儿一早就走。在这里作什么？——看人家的鼻子眼睛，什么意思！”|湘云说：“明天一早就走。在这里做什么？——看人家的脸色，有什么意思！”
宝玉听了这话，忙赶近前拉他说道：|宝玉听了这话，连忙上前拉住她说：
“好妹妹，你错怪了我。|“好妹妹，你错怪我了。
林妹妹是个多心的人。别人分明知道，不肯说出来，也皆因怕他恼。|林妹妹是个多心的人。别人明明知道，都不肯说出来，就是怕她生气。
谁知你不防头就说了出来，他岂不恼你。|谁知道你冷不防就说了出来，她岂不是要生你的气。
我是怕你得罪了他，所以才使眼色。|我是怕你得罪了她，所以才给你使眼色。
你这会子恼我，不但辜负了我，而且反倒委曲了我。|你这会儿生我的气，不但辜负了我，反倒委屈了我。
若是别人，那怕他得罪了十个人，与我何干呢。”|要是别人，就是得罪了十个人，又与我何干呢。”
湘云摔手道：“你那花言巧语别哄我。|湘云甩开他的手说：“你那些花言巧语别来哄我。
我也原不如你林妹妹，别人说他，拿他取笑都使得，只我说了就有不是。|我本来就比不上你林妹妹，别人说她、拿她取笑都行，只有我说了就有错。
我原不配说他。他是小姐主子，我是奴才丫头，得罪了他，使不得！”|我本来就不配说她。她是小姐主子，我是奴才丫头，得罪了她，那可不行！”
宝玉急的说道：“我倒是为你，反为出不是来了。|宝玉急得说：“我倒是为了你，反倒为出错来了。
我要有外心，立刻就化成灰，叫万人践踹！”|我要是有别的心思，马上就化成灰，叫千万人踩！”
湘云道：“大正月里，少信嘴胡说。|湘云说：“大正月里，少乱说话。
这些没要紧的恶誓，散话，歪话，说给那些小性儿，行动爱恼的人，会辖治你的人听去！别叫我啐你。”|这些没用的毒誓、废话、歪话，说给那些小心眼的、动不动就生气的、能管住你的人听去！别叫我啐你。”
说著，一径至贾母里间，忿忿的躺著去了。|说着就直接到贾母的里间，气呼呼地躺下了。
! 湘云的委屈在于：宝玉向着黛玉。她说“他是小姐主子，我是奴才丫头”，是气话，也透出她寄人篱下的自卑：湘云父母早亡，在叔婶家并不如意。
! “会辖治你的人”指黛玉。湘云一句话就点破了宝玉在黛玉面前的样子。

# 十一、黛玉也恼了
宝玉没趣，只得又来寻黛玉。|宝玉没趣，只好又来找黛玉。
刚到门槛前，黛玉便推出来，将门关上。|刚到门槛前，黛玉就把他推出来，把门关上了。
宝玉又不解其意，在窗外只是吞声叫“好妹妹”。|宝玉又不明白是什么意思，在窗外只是低声叫“好妹妹”。
黛玉总不理他。|黛玉总不理他。
宝玉闷闷的垂头自审。|宝玉闷闷地低着头，自己反省。
袭人早知端的，当此时断不能劝。|袭人早就知道是怎么回事，这时候绝不能劝。
那宝玉只是呆呆的站在那里。|宝玉只是呆呆地站在那里。
黛玉只当他回房去了，便起来开门，只见宝玉还站在那里。|黛玉以为他回房去了，就起来开门，只见宝玉还站在那里。
黛玉反不好意思，不好再关，只得抽身上床躺著。|黛玉反倒不好意思了，不好再关门，只好转身上床躺着。
宝玉随进来问道：“凡事都有个原故，说出来，人也不委曲。|宝玉跟进来问：“凡事都有个原因，说出来，别人也不委屈。
好好的就恼了，终是什么原故起的？”|好好的就生气了，到底是什么原因？”
林黛玉冷笑道：“问的我倒好，我也不知为什么原故。|林黛玉冷笑道：“问得倒好，我也不知道是什么原因。
我原是给你们取笑的，——拿我比戏子取笑。”|我本来就是给你们取笑的，——拿我比戏子来取笑。”
宝玉道：“我并没有比你，我并没笑，为什么恼我呢？”|宝玉说：“我并没有比你，我也没笑，为什么生我的气呢？”
黛玉道：“你还要比？你还要笑？你不比不笑，比人比了笑了的还利害呢！”|黛玉说：“你还要比？你还要笑？你不比不笑，比那些比了笑了的人还厉害呢！”
宝玉听说，无可分辩，不则一声。|宝玉听了，无话可辩，一声不吭。
! 宝玉两头都想护着，结果两头都得罪了。黛玉说他“不比不笑，比人比了笑了的还利害”，是因为她看见了那个眼色。

# 十二、“与你何干”
黛玉又道：“这一节还恕得。|黛玉又说：“这一件还能原谅。
再你为什么又和云儿使眼色？这安的是什么心？|你为什么又和云儿使眼色？这安的是什么心？
莫不是他和我顽，他就自轻自贱了？|莫非她跟我玩，她就自轻自贱了？
他原是公侯的小姐，我原是贫民的丫头，他和我顽，设若我回了口，岂不他自惹人轻贱呢。|她本是公侯人家的小姐，我本是贫民家的丫头，她跟我玩，要是我回了嘴，岂不是她自己招人看轻了。
是这主意不是？|是这个意思不是？
这却也是你的好心，只是那一个偏又不领你这好情，一般也恼了。|这倒也是你的好心，只是那一个偏偏又不领你这份好情，一样也生气了。
你又拿我作情，倒说我小性儿，行动肯恼。|你又拿我来做人情，倒说我小心眼，动不动就生气。
你又怕他得罪了我，我恼他。|你又怕她得罪了我，我生她的气。
我恼他，与你何干？他得罪了我，又与你何干？”|我生她的气，与你何干？她得罪了我，又与你何干？”
宝玉见说，方才与湘云私谈，他也听见了。|宝玉听她这么说，才知道刚才和湘云私下说的话，她也听见了。
! 黛玉把宝玉的心思一层层剥开，句句是反话，句句是委屈。“与你何干”四个字，其实是说：你偏偏要掺和，是因为你心里有她。
! 黛玉说自己是“贫民的丫头”，和湘云说自己是“奴才丫头”一样，都是寄人篱下的女孩子的自卑和自尊。

# 十三、宝玉想起《庄子》
细想自己原为他二人，怕生隙恼，方在中调和，不想并未调和成功，反已落了两处的贬谤。|宝玉仔细想想，自己本来是为了她们两个，怕她们闹翻，才在中间调和，没想到不但没调和成功，反倒落得两边都怪他。
正合著前日所看《南华经》上，有“巧者劳而智者忧，无能者无所求，饱食而遨游，泛若不系之舟”，|正应了前几天看的《南华经》上说的：“灵巧的人辛劳，聪明的人忧愁，无能的人无所求，吃饱了到处游玩，像一只没有系缆绳的船。”
又曰“山木自寇，源泉自盗”等语。|又说“山上的树木招来砍伐，源头的泉水招来汲取”这些话。
因此越想越无趣。|因此越想越没意思。
再细想来，目下不过这两个人，尚未应酬妥协，将来犹欲为何？|再仔细想想，眼下不过这两个人，还没应付妥当，将来还想怎么样？
想到其间也无庸分辩回答自己转身回房来。|想到这里，也不分辩回答，自己转身回房去了。
林黛玉见他去了，便知回思无趣，赌气去了，一言也不曾发，|林黛玉见他走了，就知道他想不通、觉得没意思，赌气走了，一句话也没说，
不禁自己越发添了气，便说道：“这一去，一辈子也别来，也别说话。”|自己不由得更生气了，就说：“这一走，一辈子也别来，也别说话。”
! “山木自寇，源泉自盗”：山上的树因为有用才被砍，泉水因为甘甜才被取。宝玉觉得自己正是因为多情，才招来烦恼。
! 这是宝玉第二次从《庄子》里找出路。上一回是赌气，这一回是真觉得“无趣”。

# 十四、“赤条条来去无牵挂”
宝玉不理，回房躺在床上，只是瞪瞪的。|宝玉不理她，回房躺在床上，只是两眼发直。
袭人深知原委，不敢就说，只得以他事来解释，因说道：|袭人很清楚是怎么回事，不敢直说，只好拿别的事来岔开，就说：
“今儿看了戏，又勾出几天戏来。宝姑娘一定要还席的。”|“今天看了戏，又要引出好几天的戏来。宝姑娘一定要回请的。”
宝玉冷笑道：“他还不还，管谁什么相干。”|宝玉冷笑道：“她回不回请，跟谁有什么相干。”
袭人见这话不是往日的口吻，因又笑道：|袭人见这话不像平时的口气，就又笑道：
“这是怎么说？好好的大正月里，娘儿们姊妹们都喜喜欢欢的，你又怎么这个形景了？”|“这是怎么说的？好好的大正月里，娘儿们姐妹们都高高兴兴的，你怎么又这个样子了？”
宝玉冷笑道：“他们娘儿们姊妹们欢喜不欢喜，也与我无干。”|宝玉冷笑道：“她们娘儿们姐妹们高兴不高兴，也与我无关。”
袭人笑道：“他们既随和，你也随和，岂不大家彼此有趣。”|袭人笑道：“她们既然随和，你也随和，岂不是大家都有意思。”
宝玉道：“什么是‘大家彼此’！|宝玉说：“什么是‘大家彼此’！
他们有‘大家彼此’，我是‘赤条条来去无牵挂’。”|她们有‘大家彼此’，我是‘赤条条来去无牵挂’。”
谈及此句，不觉泪下。|说到这一句，不由得流下泪来。
袭人见此光景，不肯再说。|袭人见这光景，不敢再说了。
! 宝钗白天念的那句曲子，晚上就被宝玉用上了。这句话后来成了宝玉一生的结局：他最后真的“赤条条”地离开了贾府。

# 十五、宝玉写偈
宝玉细想这句趣味，不禁大哭起来，翻身起来至案，遂提笔立占一偈云：|宝玉细细品味这句话的意味，不由得大哭起来，翻身起来走到桌前，就提笔当场作了一首偈语：
~你证我证，心证意证。|你要验证，我要验证，用心去验证，用意去验证。
~是无有证，斯可云证。|直到没有什么可以验证的了，这才可以叫做验证。
~无可云证，是立足境。|没有什么可以说是验证的了，这才是立足的境界。
写毕，自虽解悟，又恐人看此不解，因此亦填一支《寄生草》，也写在偈后。|写完了，自己虽然觉得领悟了，又怕别人看不懂，因此又填了一支《寄生草》，也写在偈语后面。
自己又念一遍，自觉无挂碍，中心自得，便上床睡了。|自己又念了一遍，觉得心里没有牵挂了，很是自得，就上床睡了。
! 偈是佛教里表达悟道的短诗。宝玉的意思是：人与人之间总想互相证明感情，可真正的境界是不再需要证明。他是在说他和黛玉、湘云。
! “自觉无挂碍”，可他明明刚刚还在大哭。宝玉的“悟”，来得快，去得也快。

# 十六、黛玉看见了
谁想黛玉见宝玉此番果断而去，故以寻袭人为由，来视动静。|谁知黛玉见宝玉这回走得这么决绝，就借口找袭人，过来看看动静。
袭人笑回：“已经睡了。”|袭人笑着回答：“已经睡了。”
黛玉听说，便要回去。|黛玉听了，就要回去。
袭人笑道：“姑娘请站住，有一个字帖儿，瞧瞧是什么话。”|袭人笑道：“姑娘请等一下，这里有一张字条，您看看写的是什么。”
说著，便将方才那曲子与偈语悄悄拿来，递与黛玉看。|说着，就把刚才那支曲子和偈语悄悄拿来，递给黛玉看。
黛玉看了，知是宝玉一时感忿而作，不觉可笑可叹，|黛玉看了，知道是宝玉一时感慨气愤写的，不由得又好笑又好叹，
便向袭人道：“作的是玩意儿，无甚关系。”|就对袭人说：“写的是玩意儿，没什么要紧。”
说毕，便携了回房去，与湘云同看。|说完就拿着回房去了，和湘云一起看。
次日又与宝钗看。|第二天又给宝钗看。
宝钗看其词曰：|宝钗看那支曲子写的是：
~无我原非你，从他不解伊。|没有了我，本来也就没有了你；随他们不理解她们吧。
~肆行无碍凭来去。|随心所欲、毫无挂碍地来来去去。
~茫茫著甚悲愁喜，纷纷说甚亲疏密。|茫茫人世，何必有什么悲愁欢喜；纷纷扰扰，还说什么亲近疏远。
~从前碌碌却因何，到如今回头试想真无趣！|从前忙忙碌碌，到底是为了什么？到现在回头想想，真没意思！
! 黛玉嘴上说“无甚关系”，却拿去给湘云、宝钗都看了。三个女孩子要一起去“救”宝玉，刚刚的嫌隙也就这样化解了。
! “茫茫著甚悲愁喜，纷纷说甚亲疏密”：宝玉说的“亲疏”，正是前一天他跟黛玉讲的“亲不间疏”。

# 十七、宝钗撕了偈语
看毕，又看那偈语，又笑道：“这个人悟了。|看完，又看那偈语，又笑道：“这个人悟了。
都是我的不是，都是我昨儿一支曲子惹出来的。|都是我的不是，都是我昨天一支曲子惹出来的。
这些道书禅机最能移性。|这些道书禅机最能改变人的性情。
明儿认真说起这些疯话来，存了这个意思，都是从我这一只曲子上来，我成了个罪魁了。”|以后他要是认真说起这些疯话来，存了这个念头，都是从我这一支曲子上来的，我成了罪魁祸首了。”
说著，便撕了个粉碎，递与丫头们说：“快烧了罢。”|说着就撕得粉碎，递给丫头们说：“快烧了吧。”
黛玉笑道：“不该撕，等我问他。|黛玉笑道：“不该撕，等我问问他。
你们跟我来，包管叫他收了这个痴心邪话。”|你们跟我来，保管叫他收起这些痴心邪话。”
三人果然都往宝玉屋里来。|三个人果然都到宝玉屋里来了。
! 宝钗怕的是宝玉“移性”，走上出家的路，她立刻撕掉烧掉。宝钗是要把宝玉拉回“正路”的人。
! 黛玉不撕，要去“问他”。她不怕宝玉想这些，她要和他斗机锋。

# 十八、“尔有何贵？尔有何坚？”
一进来，黛玉便笑道：“宝玉，我问你：至贵者是‘宝’，至坚者是‘玉’。|一进门，黛玉就笑道：“宝玉，我问你：最珍贵的是‘宝’，最坚硬的是‘玉’。
尔有何贵？尔有何坚？”|你有什么珍贵？你有什么坚硬？”
宝玉竟不能答。|宝玉竟然答不上来。
三人拍手笑道：“这样钝愚，还参禅呢。”|三人拍手笑道：“这样笨，还参禅呢。”
黛玉又道：“你那偈末云，‘无可云证，是立足境’，固然好了，只是据我看，还未尽善。|黛玉又说：“你那偈语最后说‘无可云证，是立足境’，固然好，只是依我看，还不够完善。
我再续两句在后。”|我再在后面续两句。”
因念云：“无立足境，是方干净。”|就念道：“连立足的地方都没有，这才是真正的干净。”
! 黛玉拿宝玉的名字来问他：你叫“宝玉”，可你有什么“贵”、什么“坚”？宝玉答不上来，因为他的心本来就不坚定。
! “无立足境，是方干净”比宝玉的境界更高一层：宝玉还要找一个“立足境”，黛玉说连这个也要放下。这八个字后来成了全书结局的注脚：“白茫茫大地真干净”。
! 讽刺的是，说出最彻底的悟语的是黛玉，可她自己一生都放不下。

# 十九、宝钗讲六祖惠能
宝钗道：“实在这方悟彻。|宝钗说：“这才是真正彻底的领悟。
当日南宗六祖惠能，初寻师至韶州，闻五祖弘忍在黄梅，他便充役火头僧。|当年禅宗南宗的六祖惠能，起初到韶州去寻师，听说五祖弘忍在黄梅，他就去那里当了烧火做饭的和尚。
五祖欲求法嗣，令徒弟诸僧各出一偈。|五祖想找传人，叫徒弟们每人作一首偈。
上座神秀说道：‘身是菩提树，心如明镜台，时时勤拂拭，莫使有尘埃。’|上座弟子神秀说：‘身是菩提树，心像明镜台，要时时勤快地擦拭，不要让它沾上尘埃。’
彼时惠能在厨房碓米，听了这偈，说道：‘美则美矣，了则未了。’|那时惠能在厨房舂米，听了这首偈说：‘美是美了，可还没有彻底领悟。’
因自念一偈曰：‘菩提本非树，明镜亦非台，本来无一物，何处染尘埃？”|就自己念了一首偈：‘菩提本来就不是树，明镜也不是台，本来就什么都没有，哪里会沾上尘埃？’
五祖便将衣钵传他。|五祖就把衣钵传给了他。
今儿这偈语，亦同此意了。|今天这首偈语，也是同样的意思。
只是方才这句机锋，尚未完全了结，这便丢开手不成？”|只是刚才那句机锋，还没有完全了结，就这样算了不成？”
! 宝钗随口讲出禅宗公案，比宝玉熟得多。宝玉的“神秀偈”被黛玉的“惠能偈”超越了。
! 宝钗嘴上劝人别看杂书，自己却什么都懂。她懂，却不信，这正是她的清醒。

# 二十、宝玉不再参禅
黛玉笑道：“彼时不能答，就算输了，这会子答上了也不为出奇。|黛玉笑道：“刚才答不上来，就算输了，这会儿就算答上了也不稀奇。
只是以后再不许谈禅了。|只是以后再不许谈禅了。
连我们两个所知所能的，你还不知不能呢，还去参禅呢。”|连我们两个知道的、会的，你都还不知道不会呢，还去参禅呢。”
宝玉自己以为觉悟，不想忽被黛玉一问，便不能答，|宝玉自以为觉悟了，没想到被黛玉一问，就答不上来，
宝钗又比出“语录”来，此皆素不见他们能者。|宝钗又引出禅宗语录来，这些都是平时没见她们显露过的本事。
自己想了一想：“原来他们比我的知觉在先，尚未解悟，我如今何必自寻苦恼。”|他自己想了想：“原来她们比我先懂这些，她们还没有出家悟道，我现在何必自寻烦恼。”
想毕，便笑道：“谁又参禅，不过一时顽话罢了。”|想完就笑道：“谁参禅了，不过是一时的玩笑话罢了。”
说著，四人仍复如旧。|说着，四个人又和好如初了。
! 三个女孩子一起，用机锋把宝玉的“悟”打了回去。宝玉这次没有出家，可种子已经埋下了。
! 脂批说，宝玉最后“悬崖撒手”，才是真的悟。

# 二十一、元春送来灯谜
忽然人报，娘娘差人送出一个灯谜儿，命你们大家去猜，猜著了每人也作一个进去。|忽然有人来报，说娘娘派人送来一个灯谜，叫你们大家去猜，猜着了每人也作一个送进去。
四人听说忙出去，至贾母上房。|四个人听了，连忙出去，到了贾母的上房。
只见一个小太监，拿了一盏四角平头白纱灯，专为灯谜而制，上面已有一个，众人都争看乱猜。|只见一个小太监，拿着一盏四角平头的白纱灯，是专门为灯谜做的，上面已经有一个谜，大家都争着看、乱猜。
小太监又下谕道：“众小姐猜著了，不要说出来，每人只暗暗的写在纸上，一齐封进宫去，娘娘自验是否。”|小太监又传话说：“各位小姐猜着了，不要说出来，每人只悄悄写在纸上，一起封好送进宫去，娘娘自己检验对不对。”
宝钗等听了，近前一看，是一首七言绝句，并无甚新奇，口中少不得称赞，只说难猜，故意寻思，其实一见就猜著了。|宝钗等人听了，走近一看，是一首七言绝句，并没什么新奇的，嘴上少不得称赞，只说难猜，故意想来想去，其实一看就猜着了。
宝玉，黛玉，湘云，探春四个人也都解了，各自暗暗的写了半日。|宝玉、黛玉、湘云、探春四个人也都猜出来了，各自悄悄写了半天。
一并将贾环，贾兰等传来，一齐各揣机心都猜了，写在纸上。|又把贾环、贾兰等人也叫来，大家各自动脑筋猜了，写在纸上。
然后各人拈一物作成一谜，恭楷写了，挂在灯上。|然后每人选一样东西作一个谜，用工整的楷书写好，挂在灯上。
! 宝钗“其实一见就猜著了”，却“只说难猜，故意寻思”。在贵妃面前不显才，是宝钗的分寸，也是她的心机。

# 二十二、贾环的谜
太监去了，至晚出来传谕：“前娘娘所制，俱已猜著，惟二小姐与三爷猜的不是。|太监走了，到晚上又出来传话：“前面娘娘作的谜，大家都猜着了，只有二小姐和三爷猜得不对。
小姐们作的也都猜了，不知是否。”|小姐们作的谜娘娘也都猜了，不知道对不对。”
说著，也将写的拿出来。|说着也把娘娘写的谜底拿出来。
也有猜著的，也有猜不著的，都胡乱说猜著了。|有猜着的，也有没猜着的，大家都胡乱说猜着了。
太监又将颁赐之物送与猜著之人，每人一个宫制诗筒，一柄茶筅，独迎春，贾环二人未得。|太监又把赏赐的东西送给猜着的人，每人一个宫里做的诗筒、一把茶筅，只有迎春、贾环两人没有。
迎春自为玩笑小事，并不介意，贾环便觉得没趣。|迎春认为是玩笑小事，并不在意，贾环就觉得没面子。
且又听太监说：“三爷说的这个不通，娘娘也没猜，叫我带回问三爷是个什么。”|又听太监说：“三爷作的这个谜不通，娘娘也没猜，叫我带回来问三爷是什么。”
众人听了，都来看他作的什么，写道是：|大家听了，都来看他作的是什么，只见写的是：
~大哥有角只八个，二哥有角只两根。|大哥只有八个角，二哥只有两只角。
~大哥只在床上坐，二哥爱在房上蹲。|大哥只在床上坐，二哥爱在房顶上蹲。
众人看了，大发一笑。|大家看了，哈哈大笑。
贾环只得告诉太监说：“一个枕头，一个兽头。”|贾环只好告诉太监说：“一个是枕头，一个是兽头。”
太监记了，领茶而去。|太监记下了，喝了茶就走了。
! 迎春猜不着“并不介意”，贾环猜不着就“没趣”，两个人的性格一个木讷，一个好胜。
! 贾环的谜粗俗不通，满屋人大笑。这又是贾环被人看不起的一幕，他的怨恨越积越深。

# 二十三、贾政来凑趣
贾母见元春这般有兴，自己越发喜乐，便命速作一架小巧精致围屏灯来，设于当屋，|贾母见元春这么有兴致，自己越发高兴，就叫人赶快做一架小巧精致的围屏灯来，摆在屋子当中，
命他姊妹各自暗暗的作了，写出来粘于屏上，|叫姐妹们各自悄悄作好谜，写出来贴在屏风上，
然后预备下香茶细果以及各色玩物，为猜著之贺。|然后预备好香茶、精致的果子和各种玩物，作为猜着的奖品。
贾政朝罢，见贾母高兴，况在节间，晚上也来承欢取乐。|贾政下朝回来，见贾母高兴，又在过节，晚上也来陪老太太取乐。
设了酒果，备了玩物，上房悬了彩灯，请贾母赏灯取乐。|摆了酒果，备了玩物，上房挂起彩灯，请贾母赏灯取乐。
上面贾母，贾政，宝玉一席，下面王夫人、宝钗、黛玉、湘云又一席，迎、探、惜三个又一席。|上面贾母、贾政、宝玉一桌，下面王夫人、宝钗、黛玉、湘云一桌，迎春、探春、惜春三个又一桌。
地下婆娘丫鬟站满。|地上站满了婆子丫鬟。
李宫裁、王熙凤二人在里间又一席。|李纨、王熙凤两人在里间又是一桌。
贾政因不见贾兰，便问：“怎么不见兰哥？”|贾政因为没见到贾兰，就问：“怎么不见兰哥儿？”
地下婆娘忙进里间问李氏，李氏起身笑著回道：“他说方才老爷并没去叫他，他不肯来。”|地上的婆子连忙进里间问李纨，李纨起身笑着回答：“他说刚才老爷并没有去叫他，他不肯来。”
婆娘回复了贾政。|婆子回禀了贾政。
众人都笑说：“天生的牛心古怪。”|大家都笑着说：“天生的倔脾气。”
贾政忙遣贾环与两个婆娘将贾兰唤来。|贾政连忙派贾环和两个婆子去把贾兰叫来。
贾母命他在身旁坐了，抓果品与他吃。|贾母叫他坐在自己身边，抓果子给他吃。
大家说笑取乐。|大家说说笑笑。
! 贾兰是贾政的长孙、贾珠的遗腹子。“老爷并没去叫他，他不肯来”，小小年纪就有骨气，后来贾兰中了举，是贾家后来少有的指望。

# 二十四、贾政在，大家都拘束
往常间只有宝玉长谈阔论，今日贾政在这里，便惟有唯唯而已。|平时只有宝玉高谈阔论，今天贾政在这里，他就只会“是是是”了。
馀者湘云虽系闺阁弱女，却素喜谈论，今日贾政在席，也自缄口禁言。|其余的人里，湘云虽然是个闺阁弱女，却一向爱说话，今天贾政在座，也闭口不说了。
黛玉本性懒与人共，原不肯多语。|黛玉本来就懒得和人凑在一起，原本就不爱多说话。
宝钗原不妄言轻动，便此时亦是坦然自若。|宝钗向来不乱说乱动，这时候也是坦然自若。
故此一席虽是家常取乐，反见拘束不乐。|所以这一席虽说是家常取乐，反倒显得拘束不快活。
贾母亦知因贾政一人在此所致之故，酒过三巡，便撵贾政去歇息。|贾母也知道是因为贾政一个人在这里的缘故，酒过三巡，就撵贾政去休息。
贾政亦知贾母之意，撵了自己去后，好让他们姊妹兄弟取乐的。|贾政也明白贾母的意思，是要撵走自己，好让孩子们取乐。
贾政忙陪笑道：“今日原听见老太太这里大设春灯雅谜，故也备了彩礼酒席，特来入会。|贾政忙陪笑说：“今天听说老太太这里大摆春灯雅谜，所以也备了彩礼酒席，特地来凑热闹。
何疼孙子孙女之心，便不略赐以儿子半点？”|为什么疼孙子孙女的心，就不能分一点给儿子呢？”
贾母笑道：“你在这里，他们都不敢说笑，没的倒叫我闷。|贾母笑道：“你在这里，他们都不敢说笑，倒叫我闷得慌。
你要猜谜时，我便说一个你猜，猜不著是要罚的。”|你要猜谜，我就说一个你猜，猜不着是要罚的。”
贾政忙笑道：“自然要罚。若猜著了，也是要领赏的。”|贾政忙笑道：“自然要罚。要是猜着了，也是要领赏的。”
贾母道：“这个自然。”|贾母说：“这个自然。”
说著便念道：|说着就念道：
~猴子身轻站树梢。|猴子身子轻，站在树梢上。
——打一果名。|——打一种水果名。
贾政已知是荔枝，便故意乱猜别的，罚了许多东西，然后方猜著，也得了贾母的东西。|贾政早就知道是荔枝（立枝），就故意乱猜别的，被罚了许多东西，然后才猜着，也得了贾母的奖品。
! 一个贾政，就让满屋子的人都噤了声。黛玉“懒与人共”、宝钗“坦然自若”，作者顺手又对比了一次两人。
! 贾政故意猜错、认罚，是为了让母亲高兴。这个严父，在母亲面前也是个孝子。

# 二十五、贾政出谜
然后也念一个与贾母猜，念道：|然后也念了一个谜给贾母猜，念道：
~身自端方，体自坚硬。|身子端端正正，体质坚坚硬硬。
~虽不能言，有言必应。|虽然不会说话，有话一定应答。
——打一用物。|——打一种用品。
说毕，便悄悄的说与宝玉。|说完，就悄悄地告诉了宝玉。
宝玉意会，又悄悄的告诉了贾母。|宝玉会意，又悄悄地告诉了贾母。
贾母想了想，果然不差，便说：“是砚台。”|贾母想了想，果然不错，就说：“是砚台。”
贾政笑道：“到底是老太太，一猜就是。”|贾政笑道：“到底是老太太，一猜就中。”
回头说：“快把贺彩送上来。”|回头说：“快把奖品送上来。”
地下妇女答应一声，大盘小盘一齐捧上。|地上的妇女答应一声，大盘小盘一起捧了上来。
贾母逐件看去，都是灯节下所用所顽新巧之物，甚喜，遂命：“给你老爷斟酒。”|贾母一件件看过去，都是灯节用的、玩的新巧东西，很高兴，就吩咐：“给你老爷斟酒。”
宝玉执壶，迎春送酒。|宝玉拿着酒壶，迎春送酒。
贾母因说：“你瞧瞧那屏上，都是他姊妹们做的，再猜一猜我听。”|贾母就说：“你看看那屏风上，都是她姐妹们作的，再猜一猜给我听。”
贾政答应，起身走至屏前，只见头一个写道是：|贾政答应着，起身走到屏风前，只见第一个写的是：
! “有言必应”：砚台有墨（研），谐“言”。贾政的谜端庄方正，就像他自己。
! 贾政把谜底悄悄告诉宝玉，宝玉再告诉贾母。父亲先让儿子知道，再让母亲猜中，这是一家人难得的温情。

# 二十六、四个不祥的谜
~能使妖魔胆尽摧，身如束帛气如雷。|能叫妖魔吓破胆，身子像一卷束帛，气势像惊雷。
~一声震得人方恐，回首相看已化灰。|一声巨响把人震得刚刚害怕，回头再看，它已经化成了灰。
贾政道：“这是炮竹嗄。”|贾政说：“这是爆竹啊。”
宝玉答道：“是。”|宝玉回答：“是。”
贾政又看道：|贾政又看下一个：
~天运人功理不穷，有功无运也难逢。|天运和人力，道理无穷；有功劳没有运气，也难遇到好结果。
~因何镇日纷纷乱，只为阴阳数不同。|为什么整天乱纷纷的？只因为阴阳的数目不同。
贾政道：“是算盘。”|贾政说：“是算盘。”
迎春笑道：“是。”|迎春笑道：“是。”
又往下看是：|又往下看：
~阶下儿童仰面时，清明妆点最堪宜。|台阶下的孩子们仰着脸看的时候，正是清明节最好的装点。
~游丝一断浑无力，莫向东风怨别离。|那根细丝一断，它就浑身无力，不要对着东风埋怨别离。
贾政道：“这是风筝。”|贾政说：“这是风筝。”
探春笑道：“是。”|探春笑道：“是。”
又看道是：|又看下一个：
~前身色相总无成，不听菱歌听佛经。|前身的形色相貌终究一事无成，不听采菱的歌，只听念佛的经。
~莫道此生沉黑海，性中自有大光明。|别说这一生沉在黑暗的海里，本性中自有一片大光明。
贾政道：“这是佛前海灯嗄。”|贾政说：“这是佛前的海灯啊。”
惜春笑答道：“是海灯。”|惜春笑着回答：“是海灯。”
! 爆竹是元春作的（宝玉替元春答“是”），算盘是迎春的，风筝是探春的，海灯是惜春的。四个谜，就是四姐妹的命运。
! 爆竹：元春的富贵像爆竹一样，一声巨响，转眼成灰。算盘：迎春嫁了孙绍祖，被打得“纷纷乱”。风筝：探春远嫁，“游丝一断”，再也回不来。海灯：惜春出家，青灯古佛。

# 二十七、贾政的心事
贾政心内沉思道：“娘娘所作爆竹，此乃一响而散之物。|贾政心里沉思：“娘娘作的是爆竹，这是一响就散的东西。
迎春所作算盘，是打动乱如麻。|迎春作的是算盘，是被拨得乱如麻的东西。
探春所作风筝，乃飘飘浮荡之物。|探春作的是风筝，是飘飘荡荡的东西。
惜春所作海灯，一发清净孤独。|惜春作的是海灯，更是清净孤独。
今乃上元佳节，如何皆作此不祥之物为戏耶？”|今天是元宵佳节，怎么都拿这些不吉利的东西来作谜？”
心内愈思愈闷，因在贾母之前，不敢形于色，只得仍勉强往下看去。|心里越想越闷，因为在贾母面前，不敢表露出来，只好勉强往下看。
只见后面写著七言律诗一首，却是宝钗所作，随念道：|只见后面写着一首七言律诗，是宝钗作的，就念道：
~朝罢谁携两袖烟，琴边衾里总无缘。|上朝回来，谁还带着满袖的香烟？在琴边、在被里，都和它没有缘分。
~晓筹不用鸡人报，五夜无烦侍女添。|天亮报时，用不着报晓的人；整夜燃烧，不用麻烦侍女添加。
~焦首朝朝还暮暮，煎心日日复年年。|头被烧焦，从早到晚；心被煎熬，一天又一天，一年又一年。
~光阴荏苒须当惜，风雨阴晴任变迁。|时光飞逝，应当珍惜；风雨阴晴，任它变化。
贾政看完，心内自忖道：“此物还倒有限。|贾政看完，心里想：“这东西倒还罢了。
只是小小之人作此词句，更觉不祥，皆非永远福寿之辈。”|只是年纪小小的人写出这样的句子，更觉得不吉利，都不是能长久享福长寿的人。”
想到此处，愈觉烦闷，大有悲戚之状，因而将适才的精神减去十分之八九，只垂头沉思。|想到这里，越发烦闷，满脸悲伤，刚才的精神一下子减去了十之八九，只是低着头沉思。
! 宝钗的谜底是更香（计时的香）。“焦首”“煎心”，日夜燃烧，一年又一年：这是宝钗后来守寡的写照。宝玉出家后，她独守空闺，“琴边衾里总无缘”。
! 贾政是全家最不懂诗的人，却最先从诗里读出了不祥。连他都看出来了，这个家的结局就不是秘密了。
! 黛玉、宝玉、湘云的谜，这一版本里没有写到，原稿据说此回未完成，后人补写了一部分。

# 二十八、贾政退去
贾母见贾政如此光景，想到或是他身体劳乏亦未可定，又兼之恐拘束了众姊妹不得高兴顽耍，|贾母见贾政这个样子，想到也许是他身体累了，又怕他拘束了姐妹们不能高兴地玩，
即对贾政云：“你竟不必猜了，去安歇罢。让我们再坐一会，也好散了。”|就对贾政说：“你不必猜了，去休息吧。让我们再坐一会儿，也好散了。”
贾政一闻此言，连忙答应几个“是”字，又勉强劝了贾母一回酒，方才退出去了。|贾政一听这话，连忙答应了几声“是”，又勉强劝贾母喝了一回酒，才退了出去。
回至房中只是思索，翻来复去竟难成寐，不由伤悲感慨，不在话下。|回到房里只是思索，翻来覆去睡不着，不由得伤心感慨，这里不多说。
! 贾政一夜难眠。一个父亲隐约看见了女儿们的结局，却什么也做不了。

# 二十九、宝玉像开了锁的猴子
且说贾母见贾政去了，便道：“你们可自在乐一乐罢。”|再说贾母见贾政走了，就说：“你们可以自在地乐一乐了。”
一言未了，早见宝玉跑至围屏灯前，指手画脚，满口批评，|一句话还没说完，早见宝玉跑到围屏灯前，指手画脚，满嘴批评，
这个这一句不好，那一个破的不恰当，如同开了锁的猴子一般。|这个这一句不好，那个猜得不恰当，像开了锁的猴子一样。
宝钗便道：“还象适才坐著，大家说说笑笑，岂不斯文些儿。”|宝钗就说：“还像刚才那样坐着，大家说说笑笑，岂不是斯文些。”
凤姐自里间忙出来插口道：“你这个人，就该老爷每日令你寸步不离方好。|凤姐从里间连忙出来插嘴说：“你这个人，就该老爷每天叫你寸步不离才好。
适才我忘了，为什么不当著老爷，撺掇叫你也作诗谜儿。|刚才我忘了，为什么不当着老爷的面，撺掇他叫你也作个诗谜。
若果如此，怕不得这会子正出汗呢。”|要是那样，只怕你这会儿正急得出汗呢。”
说的宝玉急了，扯著凤姐儿，扭股儿糖似的只是厮缠。|说得宝玉急了，扯着凤姐，像扭股糖一样缠着她不放。
贾母又与李宫裁并众姊妹说笑了一会，也觉有些困倦起来。|贾母又和李纨以及姐妹们说笑了一会儿，也觉得有些困了。
听了听已是漏下四鼓，命将食物撤去，赏散与众人，随起身道：|听了听，已经四更了，就叫把食物撤下去，赏给众人，随后起身说：
“我们安歇罢。明日还是节下，该当早起。明日晚间再玩罢。”|“我们休息吧。明天还是过节，应当早起。明天晚上再玩吧。”
且听下回分解。|请看下回分解。
! 贾政一走，宝玉就“如同开了锁的猴子”。他在父亲面前的拘束和父亲不在时的放纵，是贾府里父子关系的写照。
! 宝钗又在劝宝玉“斯文些”。宝钗总在规劝，宝玉总不爱听。

<script type="text/plain" id="ch23">
# 一、刻石
话说贾元春自那日幸大观园回宫去后，便命将那日所有的题咏，命探春依次抄录妥协，|贾元春自从那天游大观园回宫以后，就把那天所有的题咏，叫探春按顺序抄写好，
自己编次，叙其优劣，又命在大观园勒石，为千古风流雅事。|自己编排次序、评定高下，又叫人在大观园里刻成石碑，作为千古流传的风流雅事。
因此，贾政命人各处选拔精工名匠，在大观园磨石镌字，|因此贾政叫人到处挑选手艺精湛的名匠，在大观园里磨石刻字，
贾珍率领蓉，萍等监工。|贾珍带着贾蓉、贾萍等人监工。
因贾蔷又管理著文官等十二个女戏并行头等事，不大得便，因此贾珍又将贾菖，贾菱唤来监工。|因为贾蔷又管着文官等十二个女戏子和戏装等事，不太方便，所以贾珍又把贾菖、贾菱叫来监工。
一日，汤蜡钉朱，动起手来。|一天，烫蜡、描红，动起工来。
这也不在话下。|这些也不多说。
! 元春叫探春抄录，第十八回也是探春誊录诗稿。元春看重的是探春的才干和稳妥。
! 文官是十二个女戏子之一，后来大观园散戏班时，她分给了贾母。

# 二、贾芹谋差事
且说那个玉皇庙并达摩庵两处，一班的十二个小沙弥并十二个小道士，如今挪出大观园来，贾政正想发到各庙去分住。|再说玉皇庙和达摩庵两处，那一班十二个小和尚和十二个小道士，现在从大观园搬出来了，贾政正想把他们分到各个庙里去住。
不想后街上住的贾芹之母周氏，正盘算著也要到贾政这边谋一个大小事务与儿子管管，也好弄些银钱使用，|没想到住在后街的贾芹的母亲周氏，正盘算着也要到贾政这边给儿子谋个大小差事管管，也好弄些银钱用，
可巧听见这件事出来，便坐轿子来求凤姐。|正好听说出了这件事，就坐着轿子来求凤姐。
凤姐因见他素日不大拿班作势的，便依允了，想了几句话便回王夫人说：|凤姐见她平时不怎么摆架子，就答应了，想好几句话就去回王夫人说：
“这些小和尚道士万不可打发到别处去，一时娘娘出来就要承应。|“这些小和尚小道士千万不能打发到别处去，说不定娘娘什么时候出来，就要用他们。
倘或散了，若再用时，可是又费事。|要是散了，再用的时候可就麻烦了。
依我的主意，不如将他们竟送到咱们家庙里铁槛寺去，月间不过派一个人拿几两银子去买柴米就完了。|依我的主意，不如干脆把他们送到咱们家庙铁槛寺去，每个月不过派一个人拿几两银子去买柴米就行了。
说声用，走去叫来，一点儿不费事呢。”|说一声要用，去叫来就是了，一点也不费事。”
王夫人听了，便商之于贾政。|王夫人听了，就去和贾政商量。
贾政听了笑道：“倒是提醒了我，就是这样。”|贾政听了笑道：“倒是提醒了我，就这么办。”

! 凤姐说得冠冕堂皇，全是替娘娘着想，其实是替贾芹谋一个肥差。二十四个小和尚小道士的“柴米钱”，就是贾芹的油水。
! 贾芹后来在铁槛寺聚赌嫖娼，闹出丑事，又是贾家衰败的一个缩影。

# 三、凤姐和贾琏争差事
当下贾琏正同凤姐吃饭，一闻呼唤，不知何事，放下饭便走。|这时贾琏正和凤姐吃饭，一听叫他，不知道什么事，放下饭就走。
凤姐一把拉住，笑道：“你且站住，听我说话。|凤姐一把拉住他，笑道：“你先站住，听我说话。
若是别的事我不管，若是为小和尚们的事，好歹依我这么著。”|要是别的事我不管，要是为了小和尚们的事，你好歹照我说的办。”
如此这般教了一套话。|就如此这般教了他一套话。
贾琏笑道：“我不知道，你有本事你说去。”|贾琏笑道：“我不知道，你有本事你自己说去。”
凤姐听了，把头一梗，把筷子一放，腮上似笑不笑的瞅著贾琏道：“你当真的，是玩话？”|凤姐听了，把头一扬，把筷子一放，脸上似笑非笑地瞅着贾琏说：“你是当真的，还是开玩笑？”
贾琏笑道：“西廊下五嫂子的儿子芸儿来求了我两三遭，要个事情管管。|贾琏笑道：“西廊下五嫂子的儿子芸儿来求了我两三回，要个差事管管。
我依了，叫他等著。|我答应了，叫他等着。
好容易出来这件事，你又夺了去。”|好不容易出了这件事，你又抢了去。”
凤姐儿笑道：“你放心。园子东北角子上，娘娘说了，还叫多多的种松柏树，楼底下还叫种些花草。|凤姐笑道：“你放心。园子东北角上，娘娘说了，还要多种些松柏树，楼底下还要种些花草。
等这件事出来，我管保叫芸儿管这件工程。”|等这件事出来了，我保证叫芸儿管这个工程。”
贾琏道：“果这样也罢了。|贾琏说：“要真这样也就算了。
只是昨儿晚上，我不过是要改个样儿，你就扭手扭脚的。”|只是昨天晚上，我不过是想换个样子，你就扭扭捏捏的。”
凤姐儿听了，嗤的一声笑了，向贾琏啐了一口，低下头便吃饭。|凤姐听了，“嗤”的一声笑了，朝贾琏啐了一口，低下头吃饭。
! 夫妻俩各有各的人要安插：凤姐要安排贾芹，贾琏答应了贾芸。一个差事，两边争抢。
! 贾琏最后一句是夫妻间的私房话，凤姐啐他一口，这是全书里写他俩难得的亲昵。

# 四、贾芹领了银子
贾琏已经笑著去了，到了前面见了贾政，果然是小和尚一事。|贾琏笑着走了，到前面见了贾政，果然是小和尚的事。
贾琏便依了凤姐主意，说道：“如今看来，芹儿倒大大的出息了，这件事竟交予他去管办。|贾琏就照凤姐的主意说：“现在看来，芹儿倒是大有长进了，这件事干脆交给他去办。
横竖照在里头的规例，每月叫芹儿支领就是了。”|反正照着在园里的规矩，每个月叫芹儿来支领就是了。”
贾政原不大理论这些事，听贾琏如此说，便如此依了。|贾政本来不太管这些事，听贾琏这么说，就照着办了。
贾琏回到房中告诉凤姐儿，凤姐即命人去告诉了周氏。|贾琏回到房里告诉凤姐，凤姐马上叫人去告诉了周氏。
贾芹便来见贾琏夫妻两个，感谢不尽。|贾芹就来见贾琏夫妇，千恩万谢。
凤姐又作情央贾琏先支三个月的，叫他写了领字，贾琏批票画了押，登时发了对牌出去。|凤姐又做人情，求贾琏先预支三个月的钱，叫贾芹写了领条，贾琏批了票、画了押，马上发出对牌去。
银库上按数发出三个月的供给来，白花花二三百两。|银库按数发出三个月的费用来，白花花的二三百两银子。
贾芹随手拈一块，撂予掌平的人，叫他们吃茶罢。|贾芹随手拿起一块，扔给管秤的人，叫他们拿去喝茶。
于是命小厮拿回家，与母亲商议。|然后叫小厮拿回家，和母亲商量。
登时雇了大叫驴，自己骑上，又雇了几辆车，至荣国府角门，唤出二十四个人来，坐上车，一径往城外铁槛寺去了。|马上雇了一头大叫驴，自己骑着，又雇了几辆车，到荣国府的角门，叫出二十四个人来，坐上车，直往城外铁槛寺去了。
当下无话。|这里不多说。
! 二十四个小和尚小道士，一个月的柴米钱就要七八十两。贾芹一到手就“随手拈一块”打赏，可见这笔钱的油水有多大。
! 第二十四回贾芸的舅舅卜世仁说“撞见了你们三房里的老四，骑著大叫驴，带著五辆车”，说的就是这一幕。

# 五、元春让姐妹们住进园子
如今且说贾元春，因在宫中自编大观园题咏之后，|再说贾元春在宫里编完大观园的题咏以后，
忽想起那大观园中景致，自己幸过之后，贾政必定敬谨封锁，不敢使人进去骚扰，岂不寥落。|忽然想起大观园的景致，自己游过以后，贾政一定会恭恭敬敬地封锁起来，不敢让人进去打扰，岂不是太冷清了。
况家中现有几个能诗会赋的姊妹，何不命他们进去居住，也不使佳人落魄，花柳无颜。|况且家里现有几个能作诗写赋的姐妹，何不叫她们进去住，也不让美人冷落、花柳失色。
却又想到宝玉自幼在姊妹丛中长大，不比别的兄弟，若不命他进去，只怕他冷清了，|又想到宝玉从小在姐妹堆里长大，和别的兄弟不一样，要是不叫他进去，只怕他会冷清，
一时不大畅快，未免贾母王夫人愁虑，须得也命他进园居住方妙。|一时不痛快，难免让贾母、王夫人担心，必须也叫他进园去住才好。
想毕，遂命太监夏守忠到荣国府来下一道谕，|想好了，就叫太监夏守忠到荣国府来传一道旨意，
命宝钗等只管在园中居住，不可禁约封锢，命宝玉仍随进去读书。|叫宝钗等人只管在园子里住，不要封锁禁闭，叫宝玉也跟着进去读书。
! 一道旨意，让大观园有了主人。元春想到了“佳人落魄，花柳无颜”，也想到了宝玉“冷清”，这位姐姐处处替弟弟打算。
! 这是宝玉一生最快乐的日子的开始。大观园是“女儿国”，是宝玉的理想国，也是一个注定要破灭的梦。

# 六、宝玉被叫去见贾政
贾政，王夫人接了这谕，待夏守忠去后，便来回明贾母，遣人进去各处收拾打扫，安设帘幔床帐。|贾政、王夫人接了这道旨意，等夏守忠走了，就来禀告贾母，派人进园到各处收拾打扫，安设帘幔床帐。

正和贾母盘算，要这个，弄那个，忽见丫鬟来说：“老爷叫宝玉。”|正和贾母盘算着要这个要那个，忽然丫鬟来说：“老爷叫宝玉。”
宝玉听了，好似打了个焦雷，登时扫去兴头，脸上转了颜色，|宝玉听了，好像挨了一个炸雷，马上兴致全无，脸色都变了，
便拉著贾母扭的好似扭股儿糖，杀死不敢去。|拉着贾母扭来扭去像扭股糖一样，打死也不敢去。
贾母只得安慰他道：“好宝贝，你只管去，有我呢，他不敢委屈了你。|贾母只好安慰他说：“好宝贝，你只管去，有我呢，他不敢委屈你。
况且你又作了那篇好文章。|况且你又写了那么好的文章。
想是娘娘叫你进去住，他吩咐你几句，不过不教你在里头淘气。|想必是娘娘叫你进去住，他吩咐你几句，不过是不让你在里面淘气。
他说什么，你只好生答应著就是了。”|他说什么，你只管好好答应着就是了。”

老嬷嬷答应了。|老嬷嬷答应了。
! “好似打了个焦雷”：宝玉怕父亲，怕到这个地步。

# 七、金钏和宝玉
宝玉只得前去，一步挪不了三寸，蹭到这边来。|宝玉只好去了，一步挪不了三寸，磨磨蹭蹭地挪到这边来。
可巧贾政在王夫人房中商议事情，金钏儿，彩云，彩霞，绣鸾，绣凤等众丫鬟都在廊檐底下站著呢，|正好贾政在王夫人房里商量事情，金钏儿、彩云、彩霞、绣鸾、绣凤等丫鬟都在廊檐下站着，
一见宝玉来，都抿著嘴笑。|一见宝玉来，都抿着嘴笑。
金钏一把拉住宝玉，悄悄的笑道：“我这嘴上是才擦的香浸胭脂，你这会子可吃不吃了？”|金钏一把拉住宝玉，悄悄笑道：“我这嘴上是刚擦的香浸胭脂，你这会儿还吃不吃了？”
