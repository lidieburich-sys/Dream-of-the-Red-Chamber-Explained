贾政笑道：“倒是此处有些道理。|贾政笑道：“倒是这里有些道理。
固然系人力穿凿，此时一见，未免勾引起我归农之意。|虽然是人工造出来的，可现在一看，不由得勾起了我回乡种田的念头。
我们且进去歇息歇息。”|我们先进去歇一歇。”
说毕，方欲进篱门去，忽见路旁有一石碣，亦为留题之备。|说完正要进篱笆门，忽然看见路边有一块石碑，也是留着题字用的。
众人笑道：“更妙，更妙，此处若悬匾待题，则田舍家风一洗尽矣。|众人笑道：“更妙，更妙，这里要是挂匾题字，农家的风味就全没了。
立此一碣，又觉生色许多，非范石湖田家之咏不足以尽其妙。”|立这么一块石碑，又增色许多，非得范成大那样写田园的诗才能写尽它的妙处。”
贾政道：“诸公请题。”|贾政说：“各位请题。”
众人道：“方才世兄有云，‘编新不如述旧’，此处古人已道尽矣，莫若直书‘杏花村’妙极，”|众人说：“刚才世兄说过‘编新不如述旧’，这里古人已经说尽了，不如直接写‘杏花村’最妙。”
贾政听了，笑向贾珍道：“正亏提醒了我。|贾政听了，笑着对贾珍说：“正好提醒了我。
此处都妙极，只是还少一个酒幌。|这里样样都好，只是还少一面酒旗。
明日竟作一个，不必华丽，就依外面村庄的式样作来，用竹竿挑在树梢。”|明天就做一个，不必华丽，就照外面村庄的样子做，用竹竿挑在树梢上。”
贾珍答应了，又回道：“此处竟还不可养别的雀鸟，只是买些鹅鸭鸡类，才都相称了。”|贾珍答应了，又回说：“这里也不能养别的鸟，只买些鹅、鸭、鸡之类，才相称。”
贾政与众人都道：“更妙。”|贾政和众人都说：“更妙。”
贾政又向众人道：“‘杏花村’固佳，只是犯了正名，村名直待请名方可。”|贾政又对众人说：“‘杏花村’固然好，只是直接用了村名，村名要等贵妃来定才行。”
众客都道：“是呀。如今虚的，便是什么字样好？”|客人们都说：“是啊。现在先拟个暂用的，用什么字好呢？”
! 这一处就是后来李纨住的稻香村。守寡的李纨“心如槁木死灰”，住在这荒村野舍里正合适。
! 范石湖就是南宋诗人范成大，他的《四时田园杂兴》是写农家生活的名作。

# 十、“杏帘在望”与“稻香村”
大家想著，宝玉却等不得了，也不等贾政的命，便说道：|大家正想着，宝玉却等不及了，也不等贾政吩咐，就说：
“旧诗有云：‘红杏梢头挂酒旗’。如今莫若‘杏帘在望’四字。”|“旧诗里说：‘红杏梢头挂酒旗’。现在不如用‘杏帘在望’四个字。”
众人都道：“好个‘在望’！又暗合‘杏花村’意。”|众人都说：“好个‘在望’！又暗暗合了‘杏花村’的意思。”
宝玉冷笑道：“村名若用‘杏花’二字，则俗陋不堪了。|宝玉冷笑道：“村名要是用‘杏花’两个字，就俗气不堪了。
又有古人诗云：‘柴门临水稻花香’，何不就用‘稻香村’的妙？”|古人还有诗说：‘柴门临水稻花香’，何不就用‘稻香村’，岂不是好？”
众人听了，亦发哄声拍手道：“妙！”|众人听了，更是哄然拍手说：“妙！”
贾政一声断喝：“无知的业障，你能知道几个古人，能记得几首熟诗，也敢在老先生前卖弄！|贾政一声大喝：“无知的孽障，你能知道几个古人，能记得几首熟诗，也敢在老先生们面前卖弄！
你方才那些胡说的，不过是试你的清浊，取笑而已，你就认真了！”|你刚才那些胡说，不过是试试你懂不懂，取笑罢了，你就当真了！”
! 宝玉得意忘形，抢了话头，还“冷笑”别人俗。贾政这一喝，是嫌他张狂。
! “杏帘在望”后来被元春选中，元妃省亲那天，黛玉替宝玉写的一首诗就是《杏帘在望》，元春评为第一。

# 十一、“天然”二字
说著，引人步入茆堂，里面纸窗木榻，富贵气象一洗皆尽。|说着，带人走进茅屋，里面是纸糊的窗、木头的床，富贵气象一扫而光。
贾政心中自是欢喜，却瞅宝玉道。”此处如何？”|贾政心里自然高兴，却瞅着宝玉问：“这里怎么样？”
众人见问，都忙悄悄的推宝玉，教他说好。|众人见他问，都忙悄悄推宝玉，叫他说好。
宝玉不听人言，便应声道：“不及‘有凤来仪’多矣。”|宝玉不听别人的，随口就说：“比‘有凤来仪’差远了。”
贾政听了道：“无知的蠢物！|贾政听了说：“无知的蠢东西！
你只知朱楼画栋，恶赖富丽为佳，那里知道这清幽气象。终是不读书之过！”|你只知道红楼画栋、俗不可耐的富丽才好，哪里懂这清幽的气象。终究是不读书的过错！”
宝玉忙答道：“老爷教训的固是，但古人常云‘天然’二字，不知何意？”|宝玉忙回答：“老爷教训得对，可是古人常说‘天然’两个字，不知是什么意思？”
众人见宝玉牛心，都怪他呆痴不改。|众人见宝玉固执，都怪他呆傻不改。
今见问‘天然’二字，众人忙道：|现在见他问‘天然’两个字，众人忙说：
“别的都明白，为何连‘天然’不知？|“别的都明白，怎么连‘天然’都不知道？
‘天然’者，天之自然而有，非人力之所成也。”|‘天然’，就是天生自然就有的，不是人力造成的。”
宝玉道：“却又来！|宝玉说：“这不就对了！
此处置一田庄，分明见得人力穿凿扭捏而成。|这里摆一个田庄，明明看得出是人工硬造出来的。
远无邻村，近不负郭，背山山无脉，临水水无源，|远处没有邻村，近处不靠城郭，背后的山没有山脉，临着的水没有源头，
高无隐寺之塔，下无通市之桥，峭然孤出，似非大观。|高处没有藏着寺庙的塔，低处没有通向集市的桥，孤零零地突兀在这里，不像是大观。
争似先处有自然之理，得自然之气，虽种竹引泉，亦不伤于穿凿。|哪里比得上刚才那一处有自然的道理、自然的气韵，虽然也种竹引泉，却不显得造作。
古人云‘天然图画’四字，正畏非其地而强为地，非其山而强为山，虽百般精而终不相宜……”|古人说‘天然图画’四个字，正是怕不是那块地硬要造成那块地，不是那座山硬要造成那座山，就算百般精巧，终究不相宜……”
未及说完，贾政气的喝命：“叉出去，”|话还没说完，贾政气得喝令：“叉出去！”
刚出去，又喝命：“回来！”|宝玉刚出去，又喝令：“回来！”
命再题一联：“若不通，一并打嘴！”|命令他再题一副对联：“要是不通，一起打嘴！”
宝玉只得念道：|宝玉只好念道：
~新涨绿添浣葛处，好云香护采芹人。|新涨的春水，给洗葛布的地方添了绿意；美好的云彩带着香气，护着采芹的人。
贾政听了，摇头说：“更不好。”|贾政听了，摇头说：“更不好。”
! 宝玉这番“天然”论，是整回最精彩的见解：在富贵园子里造一个假农庄，本身就是“非其地而强为地”。
! 贾政喜欢稻香村，是因为它合乎“归农”的道德理想；宝玉不喜欢，是因为它假。父子之争，其实是“理”与“情”、“名教”与“自然”之争。
! “采芹人”指读书考取秀才的人（古代考中秀才叫“入泮”“采芹”）。宝玉最不爱功名，却不得不写这个，贾政自然说“更不好”。

# 十二、蓼汀花溆
一面引人出来，转过山坡，穿花度柳，抚石依泉，过了荼蘼架，再入木香棚，越牡丹亭，度芍药圃，入蔷薇院，出芭蕉坞，盘旋曲折。|一面带人出来，转过山坡，穿过花丛柳林，摸着山石、傍着泉水，过了荼蘼架，又进了木香棚，越过牡丹亭，走过芍药圃，进了蔷薇院，出了芭蕉坞，弯弯曲曲地走。
忽闻水声潺湲，泻出石洞，上则萝薜倒垂，下则落花浮荡。|忽然听见潺潺的水声，从石洞里流出来，上面藤萝薜荔倒挂着，下面落花漂荡着。
众人都道：“好景，好景！”|众人都说：“好景，好景！”
贾政道：“诸公题以何名？”|贾政说：“各位题个什么名字？”
众人道：“再不必拟了，恰恰乎是‘武陵源’三个字。”|众人说：“不用再拟了，正好是‘武陵源’三个字。”
贾政笑道：“又落实了，而且陈旧。”|贾政笑道：“又太实了，而且陈旧。”
众人笑道：“不然就用‘秦人旧舍’四字也罢了。”|众人笑道：“要不就用‘秦人旧舍’四个字也行。”
宝玉道：“这越发过露了。‘秦人旧舍’说避乱之意，如何使得？|宝玉说：“这更直露了。‘秦人旧舍’说的是躲避战乱的意思，怎么能用？
莫若‘蓼汀花溆’四字。”|不如用‘蓼汀花溆’四个字。”
贾政听了，更批胡说。|贾政听了，又批他胡说。
! “武陵源”“秦人旧舍”都出自陶渊明《桃花源记》，秦时的人为躲避战乱逃进桃源。贵妃省亲是太平盛事，用“避乱”的典故当然犯忌，宝玉想得周到。
! “蓼汀花溆”意思是长满蓼草的水边小洲、开满花的水湾。元春后来嫌“花溆”二字，只留了“蓼汀”。

# 十三、坐船不成，攀山过去
于是要进港洞时，又想起有船无船。|于是要进港洞的时候，又想起有没有船。
贾珍道：“采莲船共四只，座船一只，如今尚未造成。”|贾珍说：“采莲船一共四只，坐船一只，现在还没造好。”
贾政笑道：“可惜不得入了。”|贾政笑道：“可惜进不去了。”
贾珍道：“从山上盘道亦可以进去。”|贾珍说：“从山上的盘山道也可以进去。”
说毕，在前导引，大家攀藤抚树过去。|说完在前面领路，大家攀着藤蔓、扶着树木过去。
只见水上落花愈多，其水愈清，溶溶荡荡，曲折萦迂。|只见水上的落花越来越多，水也越来越清，荡漾着，曲曲折折地流着。
池边两行垂柳，杂著桃杏，遮天蔽日，真无一些尘土。|池边两行垂柳，夹杂着桃树杏树，遮天蔽日，真是一点尘土都没有。
忽见柳阴中又露出一个折带朱栏板桥来，度过桥去，诸路可通，|忽然看见柳荫里又露出一座曲折的红栏木板桥，过了桥，四面八方的路都能通，
便见一所清凉瓦舍，一色水磨砖墙，清瓦花堵。|就看见一所清凉的瓦房，一色磨光的砖墙，青瓦花墙。
那大主山所分之脉，皆穿墙而过。|那座大主山分出来的山脉，都从墙里穿过去。

# 十四、蘅芷清芬
贾政道：“此处这所房子，无味的很。”|贾政说：“这所房子，没什么意思。”
因而步入门时，忽迎面突出插天的大玲珑山石来，四面群绕各式石块，竟把里面所有房屋悉皆遮住，而且一株花木也无。|可走进门时，忽然迎面突出一块高耸入天的大玲珑山石，四面围绕着各式各样的石块，竟把里面所有的房屋全都遮住了，而且一棵花木也没有。
只见许多异草：或有牵藤的，或有引蔓的，或垂山巅，或穿石隙，|只见许多奇异的草：有牵着藤的，有引着蔓的，有的从山顶垂下来，有的从石缝里穿出来，
甚至垂檐绕柱，萦砌盘阶，或如翠带飘飖，或如金绳盘屈，或实若丹砂，或花如金桂，|甚至挂在屋檐上、缠在柱子上，绕着台阶、盘在阶前；有的像翠绿的带子在飘，有的像金色的绳子盘曲着，有的结的果子像朱砂，有的开的花像金桂，
味芬气馥，非花香之可比。|气味芬芳浓郁，不是花香能比的。
贾政不禁笑道：“有趣！只是不大认识。”|贾政不由得笑道：“有意思！只是不大认识。”
有的说：“是薜荔藤萝。”|有人说：“是薜荔、藤萝。”
贾政道：“薜荔藤萝不得如此异香。”|贾政说：“薜荔、藤萝没有这么奇异的香味。”
宝玉道：“果然不是。|宝玉说：“果然不是。
这些之中也有藤萝薜荔。|这里面也有藤萝薜荔。
那香的是杜若蘅芜，那一种大约是茞兰，这一种大约是清葛，那一种是金簦草，这一种是玉蕗藤，红的自然是紫芸，绿的定是青芷。|那香的是杜若、蘅芜，那一种大概是茞兰，这一种大概是清葛，那一种是金簦草，这一种是玉蕗藤，红的自然是紫芸，绿的一定是青芷。
想来《离骚》，《文选》等书上所有的那些异草，也有叫作什么藿纳姜荨的，也有叫作什么纶组紫绛的，|想来《离骚》《文选》这些书上的那些奇草，有叫什么藿纳、姜荨的，有叫什么纶组、紫绛的，
还有石帆，水松，扶留等样，又有叫什么绿荑的，还有什么丹椒，蘼芜，风连。|还有石帆、水松、扶留这些，又有叫什么绿荑的，还有什么丹椒、蘼芜、风连。
如今年深岁改，人不能识，故皆象形夺名，渐渐的唤差了，也是有的。”|如今年代久远，人们不认识了，所以都按样子另起名字，渐渐叫错了，也是有的。”
未及说完，贾政喝道：“谁问你来！”|话还没说完，贾政喝道：“谁问你了！”
唬的宝玉倒退，不敢再说。|吓得宝玉往后退，不敢再说了。
! 这一处就是后来薛宝钗住的蘅芜苑。没有一株花，只有奇草和冷石，雪洞一般，正合宝钗“冷香”的性子。
! 宝玉说出一大串《离骚》里的香草名，都是屈原用来比喻高洁品格的。贾政问不出来，宝玉说出来了，反而挨骂，因为这是“杂书”里的学问。

# 十五、众清客拟对联
贾政因见两边俱是超手游廊，便顺著游廊步入。|贾政见两边都是抄手游廊，就顺着游廊走进去。
只见上面五间清厦连著卷棚，四面出廊，绿窗油壁，更比前几处清雅不同。|只见上面五间清雅的厦房连着卷棚，四面都有走廊，绿色的窗、油漆的墙壁，比前几处更清雅。
贾政叹道：“此轩中煮茶操琴，亦不必再焚名香矣。|贾政叹道：“在这轩里煮茶弹琴，也不用再烧名贵的香了。
此造已出意外，诸公必有佳作新题以颜其额，方不负此。”|这里造得已经出人意料，各位一定要有好作品新题目来给它题匾，才不辜负它。”
众人笑道：“再莫若‘兰风蕙露’贴切了。”|众人笑道：“再没有比‘兰风蕙露’更贴切的了。”
贾政道：“也只好用这四字。其联若何？”|贾政说：“也只好用这四个字。对联呢？”
一人道：“我倒想了一对，大家批削改正。”|一个人说：“我倒想了一副，请大家批改。”
念道是：|念道：
~麝兰芳霭斜阳院，杜若香飘明月洲。|斜阳下的庭院里，麝香兰花的香气弥漫；明月照着的小洲上，飘着杜若的香气。
众人道：“妙则妙矣，只是‘斜阳’二字不妥。”|众人说：“妙是妙，只是‘斜阳’两个字不妥。”
那人道：“古人诗云‘蘼芜满手泣斜晖’。”|那人说：“古人有诗说‘蘼芜满手泣斜晖’。”
众人道：“颓丧，颓丧。”|众人说：“太颓丧了，太颓丧了。”
又一人道：“我也有一联，诸公评阅评阅。”|又一个人说：“我也有一副，请各位评一评。”
因念道：|就念道：
~三径香风飘玉蕙，一庭明月照金兰。|三条小路上，香风吹着玉一样的蕙草；满院的明月，照着金色的兰花。
! 喜庆的省亲别院，用“斜阳”“泣斜晖”当然不吉利。清客们拍马屁也要有分寸。

# 十六、蘅芷清芬
贾政拈髯沉吟，意欲也题一联。|贾政捋着胡子沉吟，也想题一副对联。
忽抬头见宝玉在旁不敢则声，因喝道：|忽然抬头看见宝玉在旁边不敢出声，就喝道：
“怎么你应说话时又不说了？还要等人请教你不成！”|“怎么该你说话的时候又不说了？还要等人来请教你不成！”
宝玉听说，便回道：|宝玉听了，就回答：
“此处并没有什么‘兰麝’，‘明月’，‘洲渚’之类，若要这样著迹说起来，就题二百联也不能完。”|“这里并没有什么‘兰麝’‘明月’‘洲渚’之类，要是这样死扣着字面去说，就是题二百副对联也题不完。”
贾政道：“谁按著你的头，叫你必定说这些字样呢？”|贾政说：“谁按着你的头，叫你一定要说这些字了？”
宝玉道：“如此说，匾上则莫若‘蘅芷清芬’四字。|宝玉说：“这么说，匾上就不如题‘蘅芷清芬’四个字。
对联则是：|对联是：
~吟成豆蔻才犹艳，睡足酴醾梦也香。|吟成了豆蔻一样的诗句，才情还带着艳丽；在酴醾花下睡足了，连梦都是香的。
贾政笑道：“这是套的‘书成蕉叶文犹绿’，不足为奇。”|贾政笑道：“这是套用的‘书成蕉叶文犹绿’，不算稀奇。”
众客道：“李太白‘凤凰台’之作，全套‘黄鹤楼’，只要套得妙。|客人们说：“李白的《登金陵凤凰台》，全是套崔颢的《黄鹤楼》，只要套得好就行。
如今细评起来，方才这一联，竟比‘书成蕉叶’犹觉幽娴活泼。|现在细细评起来，刚才这一联，竟比‘书成蕉叶’还要幽雅活泼。
视‘书成’之句，竟似套此而来。”|看那‘书成’一句，倒像是套这一句来的。”
贾政笑道：“岂有此理！”|贾政笑道：“哪有这个道理！”
! 贾政一边说宝玉“套”，一边心里高兴；清客们一边吹捧，一边替贾政说出他想听的话。
! “豆蔻”常用来形容少女，“酴醾”是春末最后开的花（“开到荼蘼花事了”）。用在宝钗住处，艳丽中透着一点“春尽”的意思。

# 十七、正殿，似曾相识
说著，大家出来。|说着，大家出来了。
行不多远，则见崇阁巍峨，层楼高起，面面琳宫合抱，迢迢复道萦纡，|走了不远，就看见高大的楼阁巍峨耸立，一层层楼房高高升起，四面都是华美的宫殿环抱，长长的天桥回环曲折，
青松拂檐，玉栏绕砌，金辉兽面，彩焕螭头。|青松拂着屋檐，玉石栏杆绕着台阶，兽面装饰金光闪闪，螭龙头彩色焕发。
贾政道：“这是正殿了，只是太富丽了些。”|贾政说：“这是正殿了，只是太富丽了些。”
众人都道：“要如此方是。|众人都说：“要这样才对。
虽然贵妃崇节尚俭，天性恶繁悦朴，然今日之尊，礼仪如此，不为过也。”|虽然贵妃崇尚节俭，天性不喜繁华、喜欢朴素，可以她今天的尊贵，礼仪就该这样，不算过分。”
一面说，一面走，只见正面现出一座玉石牌坊来，上面龙蟠螭护，玲珑凿就。|一边说一边走，只见正面出现一座玉石牌坊，上面雕着盘龙和螭龙，凿得精巧玲珑。
贾政道：“此处书以何文？”|贾政说：“这里写什么字？”
众人道：“必是‘蓬莱仙境’方妙。”|众人说：“一定要‘蓬莱仙境’才好。”
贾政摇头不语。|贾政摇头不说话。
宝玉见了这个所在，心中忽有所动，寻思起来，倒象那里曾见过的一般，却一时想不起那年月日的事了。|宝玉看到这个地方，心里忽然一动，想来想去，好像在哪里见过似的，却一时想不起是哪年哪月的事了。
贾政又命他作题，宝玉只顾细思前景，全无心于此了。|贾政又叫他题，宝玉只顾着细想以前见过的景象，一点心思都不在这上面了。
众人不知其意，只当他受了这半日的折磨，精神耗散，才尽词穷了，|众人不知道他在想什么，只当他被折腾了半天，精神耗尽，才尽词穷了，
再要考难逼迫，著了急，或生出事来，倒不便。|要是再考他逼他，他着了急，或者闹出什么事来，倒不好。
遂忙都劝贾政：“罢，罢，明日再题罢了。”|于是都忙劝贾政：“算了，算了，明天再题吧。”
贾政心中也怕贾母不放心，遂冷笑道：|贾政心里也怕贾母不放心，就冷笑道：
“你这畜生，也竟有不能之时了。|“你这畜生，也有不行的时候。
也罢，限你一日，明日若再不能，我定不饶。|也罢，限你一天，明天要是还题不出来，我一定不饶你。
这是要紧一处，更要好生作来！”|这是要紧的一处，更要好好地作！”
! 宝玉觉得“曾见过”，因为他在第五回梦里到过太虚幻境，那里也有一座石牌坊，写着“太虚幻境”。
! 大观园就是人间的太虚幻境。元春后来给这座牌坊题名“省亲别墅”，宝玉梦里的那座写的是“太虚幻境”。

# 十八、沁芳闸，一路走过
说著，引人出来，再一观望，原来自进门起，所行至此，才游了十之五六。|说着，带人出来，再一看，原来从进门到现在，才游了十分之五六。
又值人来回，有雨村处遣人回话。|又正好有人来报，说雨村那边派人来回话。
贾政笑道：“此数处不能游了。|贾政笑道：“这几处来不及游了。
虽如此，到底从那一边出去，纵不能细观，也可稍览。”|虽然这样，还是从那一边出去，就算不能细看，也可以稍微看看。”
说著，引客行来，至一大桥前，见水如晶帘一般奔入。|说着带客人走来，到了一座大桥前，看见水像水晶帘子一样奔流进来。
原来这桥便是通外河之闸，引泉而入者。|原来这座桥就是通外河的水闸，从这里引泉水进园。
贾政因问：“此闸何名？”|贾政问：“这水闸叫什么名字？”
宝玉道：“此乃沁芳泉之正源，就名‘沁芳闸’。”|宝玉说：“这是沁芳泉的正源，就叫‘沁芳闸’吧。”
贾政道：“胡说，偏不用‘沁芳’二字。”|贾政说：“胡说，偏不用‘沁芳’两个字。”
于是一路行来，或清堂茅舍，或堆石为垣，或编花为牖，|于是一路走来，有清雅的厅堂和茅屋，有用石头堆成的墙，有用花枝编成的窗，
或山下得幽尼佛寺，或林中藏女道丹房，或长廊曲洞，或方厦圆亭，贾政皆不及进去。|有山下幽静的尼姑佛寺，有林中隐藏的女道士炼丹房，有长廊曲洞，有方形的厦屋、圆形的亭子，贾政都来不及进去。
因说半日腿酸，未尝歇息，忽又见前面又露出一所院落来，|因为走了半天腿酸了，一直没歇息，忽然又看见前面露出一所院落来，
贾政笑道：“到此可要进去歇息歇息了。”|贾政笑道：“到这里可要进去歇一歇了。”
! 贾政说“偏不用‘沁芳’”，可后来这道闸还是叫了“沁芳闸”。
! “幽尼佛寺”就是后来妙玉住的栊翠庵。

# 十九、怡红快绿
说著，一径引人绕著碧桃花，穿过一层竹篱花障编就的月洞门，俄见粉墙环护，绿柳周垂。|说着，一直带人绕过碧桃花，穿过一道用竹篱花障编成的月洞门，就看见粉墙环绕，四周垂着绿柳。
贾政与众人进去，一入门，两边都是游廊相接。|贾政和众人走进去，一进门，两边都是相连的游廊。
院中点衬几块山石，一边种著数本芭蕉，那一边乃是一棵西府海棠，其势若伞，丝垂翠缕，葩吐丹砂。|院子里点缀着几块山石，一边种着几棵芭蕉，另一边是一棵西府海棠，树形像一把伞，枝条像翠绿的丝线垂下来，花朵像朱砂一样红艳。
众人赞道：“好花，好花！|众人赞道：“好花，好花！
从来也见过许多海棠，那里有这样妙的。”|向来也见过许多海棠，哪有这样好的。”
贾政道：“这叫作‘女儿棠’，乃是外国之种。|贾政说：“这叫‘女儿棠’，是外国的品种。
俗传系出‘女儿国’中，云彼国此种最盛，亦荒唐不经之说罢了。”|民间传说是从‘女儿国’来的，说那个国家这种花最多，也是荒唐无稽的说法罢了。”
众人笑道：“然虽不经，如何此名传久了？”|众人笑道：“虽然荒唐，怎么这名字流传这么久了？”
宝玉道：“大约骚人咏士，以此花之色红晕若施脂，轻弱似扶病，大近乎闺阁风度，所以以‘女儿’命名。|宝玉说：“大概是诗人们觉得这花的颜色红晕像搽了胭脂，娇弱得像病中要人扶着，很像闺阁女子的风度，所以用‘女儿’来命名。
想因被世间俗恶听了，他便以野史纂入为证，以俗传俗，以讹传讹，都认真了。”|想必是被世间俗人听了，就拿野史编进去作证据，以俗传俗，以讹传讹，大家都当真了。”
众人都摇身赞妙。|众人都摇头晃脑地称赞。
一面说话，一面都在廊外抱厦下打就的榻上坐了。|一边说话，一边都在廊外抱厦下做好的榻上坐下了。
贾政因问：“想几个什么新鲜字来题此？”|贾政问：“想几个什么新鲜的字来题这里？”
一客道：“‘蕉鹤’二字最妙。”|一个客人说：“‘蕉鹤’两个字最妙。”
又一个道：“‘崇光泛彩’方妙。”|又一个说：“‘崇光泛彩’才好。”
贾政与众人都道：“好个‘崇光泛彩’！”|贾政和众人都说：“好个‘崇光泛彩’！”
宝玉也道：“妙极。”|宝玉也说：“妙极了。”
又叹：“只是可惜了。”|又叹道：“只是可惜了。”
众人问：“如何可惜？”|众人问：“怎么可惜？”
宝玉道：“此处蕉棠两植，其意暗蓄‘红’‘绿’二字在内。|宝玉说：“这里芭蕉和海棠一起种，意思是暗暗含着‘红’‘绿’两个字。
若只说蕉，则棠无著落，若只说棠，蕉亦无著落。|要是只说芭蕉，海棠就没着落；要是只说海棠，芭蕉也没着落。
固有蕉无棠不可，有棠无蕉更不可。”|有芭蕉没海棠固然不行，有海棠没芭蕉更不行。”
贾政道：“依你如何？”|贾政说：“依你怎么样？”
宝玉道：“依我，题‘红香绿玉’四字，方两全其妙。”|宝玉说：“依我看，题‘红香绿玉’四个字，才能两全其美。”
贾政摇头道：“不好，不好！”|贾政摇头说：“不好，不好！”
! 这一处就是宝玉后来住的怡红院。元春把“红香绿玉”改成了“怡红快绿”，宝玉自号“怡红公子”。
! 宝玉对“女儿棠”的解释最能看出他的心：别人说花，他看到的是闺阁女儿。
! 宝玉原来的书房叫“绛芸轩”（第八回），他又有爱吃胭脂的“爱红”毛病，红色贯穿他的一生，书名也叫《红楼梦》。

# 二十、迷宫一样的屋子
说著，引人进入房内。|说着，带人走进房里。
只见这几间房内收拾的与别处不同，竟分不出间隔来的。|只见这几间房收拾得和别处不一样，竟然分不出间隔来。
原来四面皆是雕空玲珑木板，|原来四面都是雕空的玲珑木板，
或“流云百蝠”，或“岁寒三友”，或山水人物，或翎毛花卉，或集锦，或博古，或万福万寿各种花样，|有“流云百蝠”，有“岁寒三友”，有山水人物，有鸟兽花卉，有集锦图，有博古图，有万福万寿等各种花样，
皆是名手雕镂，五彩销金嵌宝的。|都是名家雕刻的，涂着五彩、贴着金、镶着宝石。
一槅一槅，或有贮书处，或有设鼎处，或安置笔砚处，或供花设瓶，安放盆景处。|一格一格的，有的放书，有的摆鼎，有的放笔砚，有的供花摆瓶、放盆景。
其槅各式各样，或天圆地方，或葵花蕉叶，或连环半璧。|格子各式各样，有天圆地方的，有葵花蕉叶形的，有连环半璧形的。
真是花团锦簇，剔透玲珑。|真是花团锦簇，玲珑剔透。
倏尔五色纱糊就，竟系小窗，倏尔彩凌轻覆，竟系幽户。|忽然看见一块五色纱糊的，竟然是一扇小窗；忽然看见一块彩绫轻轻盖着的，竟然是一道小门。
且满墙满壁，皆系随依古董玩器之形抠成的槽子。|而且满墙都是照着古董玩器的形状挖成的凹槽。
诸如琴，剑，悬瓶，桌屏之类，虽悬于壁，却都是与壁相平的。|像琴、剑、挂瓶、桌屏之类，虽然挂在墙上，却都和墙面平齐。
众人都赞：“好精致想头！难为怎么想来，”|众人都赞叹：“好精巧的心思！难为怎么想出来的。”
原来贾政等走了进来，未进两层，便都迷了旧路，|原来贾政等人走进来，还没走两层，就都迷了路，
左瞧也有门可通，右瞧又有窗暂隔，及到了跟前，又被一架书挡住。|往左看有门可以通过，往右看又有窗暂时隔着，走到跟前，又被一架书挡住了。
回头再走，又有窗纱明透，门径可行，及至门前，忽见迎面也进来了一群人，都与自己形相一样，|回头再走，又看见窗纱透亮，有门可走，走到门前，忽然看见迎面也进来一群人，都和自己长得一样，
-却是一架玻璃大镜相照。|——原来是一架大玻璃镜子照着。
及转过镜去，益发见门子多了。|绕过镜子去，越发看见门多了。
贾珍笑道：“老爷随我来。|贾珍笑道：“老爷跟我来。
从这门出去，便是后院，从后院出去，倒比先近了。”|从这道门出去就是后院，从后院出去，倒比原来近了。”
说著，又转了两层纱厨锦槅，果得一门出去，院中满架蔷薇，宝相。|说着，又转过两层纱橱锦格，果然找到一道门出去，院子里满架都是蔷薇和宝相花。
! 宝玉的屋子像迷宫，又有一面大镜子照出另一群人。真与假、虚与实，在这里又一次混在一起。
! 第四十一回刘姥姥喝醉了闯进这屋子，对着镜子把自己当成了亲家母，就是这面镜子。

# 二十一、出园
转过花障，则见青溪前阻。|转过花障，就看见一条清溪挡在前面。
众人吒异：“这股水又是从何而来？”|众人惊奇：“这股水又是从哪里来的？”
贾珍遥指道：“原从那闸起流至那洞口，从东北山坳里引到那村庄里，|贾珍远远指着说：“是从那水闸流到那个洞口，从东北的山坳里引到那个村庄里，
又开一道岔口，引到西南上，共总流到这里，仍旧合在一处，从那墙下出去。”|又开一道岔口，引到西南边，一共流到这里，又合在一起，从那墙下流出去。”
众人听了，都道：“神妙之极，”|众人听了，都说：“神妙极了。”
说著，忽见大山阻路。|说着，忽然一座大山挡住了路。
众人都道“迷了路了。”|众人都说：“迷路了。”
贾珍笑道：“随我来。”|贾珍笑道：“跟我来。”
仍在前导引，众人随他，直由山脚边忽一转，便是平坦宽阔大路，豁然大门前见。|仍在前面领路，众人跟着他，从山脚边一转，就是平坦宽阔的大路，大门豁然出现在眼前。
众人都道：“有趣，有趣，真搜神夺巧之至！”|众人都说：“有意思，有意思，真是巧夺天工！”
于是大家出来。|于是大家出来了。
那宝玉一心只记挂著里边，又不见贾政吩咐，少不得跟到书房。|宝玉一心只惦记着里面，又不见贾政吩咐，只好跟到书房。
贾政忽想起他来，方喝道：“你还不去？难道还逛不足！|贾政忽然想起他来，才喝道：“你还不走？难道还没逛够！
也不想逛了这半日，老太太必悬挂著。|也不想想逛了这半天，老太太一定惦记着。
快进去，疼你也白疼了。”|快进去，疼你也是白疼。”
宝玉听说，方退了出来。|宝玉听了，这才退了出来。
在看下回分解。|再看下回分解。
! 一条沁芳溪，从闸口流进来，经过潇湘馆、稻香村、蘅芜苑、怡红院，最后从墙下流出去。大观园里的人，也都在这条水上。
! 贾政最后一句“疼你也白疼了”，嘴上是骂，其实是叫他回去，怕老太太惦记。这一路上，贾政对宝玉的才气是暗暗满意的。
</script>

<script type="text/plain" id="ch18">
# 一、小厮们讨赏
话说宝玉来至院外，就有跟贾政的几个小厮上来拦腰抱住，都说：|宝玉来到院外，就有几个跟贾政的小厮上来拦腰抱住他，都说：
“今儿亏我们，老爷才喜欢，老太太打发人出来问了几遍，都亏我们回说喜欢，|“今天多亏我们，老爷才高兴。老太太派人出来问了好几遍，都亏我们回说老爷高兴，
不然，若老太太叫你进去，就不得展才了。|不然老太太叫你进去，你就没机会显本事了。
人人都说，你才那些诗比世人的都强。|人人都说，你刚才那些诗比谁的都强。
今儿得了这样的彩头。该赏我们了。”|今天得了这么大的彩头，该赏我们了。”
宝玉笑道：“每人一吊钱。”|宝玉笑道：“每人一吊钱。”
众人道：“谁没见那一吊钱！把这荷包赏了罢。”|众人说：“谁没见过那一吊钱！把这荷包赏了吧。”
说著，一个上来解荷包，那一个就解扇囊，不容分说，将宝玉所佩之物尽行解去。|说着，一个上来解荷包，一个就解扇套，不容分说，把宝玉身上戴的东西全解走了。
又道：“好生送上去罢。”|又说：“好好送他上去吧。”
一个抱了起来，几个围绕，送至贾母二门前。|一个把他抱起来，几个围着，送到贾母的二门前。
那时贾母已命人看了几次。|这时贾母已经派人看了好几次了。
众奶娘丫鬟跟上来，见过贾母，知不曾难为著他，心中自是欢喜。|奶妈丫鬟们跟上来，见过贾母，贾母知道贾政没有为难他，心里自然高兴。
! 小厮们敢把主子身上的东西抢光，可见宝玉待下人随和，没有架子。
! 这一抢，就惹出下面黛玉剪香袋的事来。

# 二、黛玉剪香袋
少时袭人倒了茶来，见身边佩物一件无存，因笑道：“带的东西又是那起没脸的东西们解了去了。”|一会儿袭人倒了茶来，见他身上佩戴的东西一件也没有了，就笑道：“戴的东西又被那些没脸的东西解走了。”
林黛玉听说，走来瞧瞧，果然一件无存，|林黛玉听了，走过来看看，果然一件也没有了，
因向宝玉道：“我给的那个荷包也给他们了？|就对宝玉说：“我给你的那个荷包也给他们了？
你明儿再想我的东西，可不能够了！”|你以后再想要我的东西，可没门了！”
说毕，赌气回房，将前日宝玉所烦他作的那个香袋儿——才做了一半——赌气拿过来就铰。|说完赌气回到房里，把前几天宝玉托她做的那个香袋——才做了一半——赌气拿过来就剪。
宝玉见他生气，便知不妥，忙赶过来，早剪破了。|宝玉见她生气，就知道不好，连忙赶过来，已经剪破了。
宝玉已见过这香囊，虽尚未完，却十分精巧，费了许多工夫。|宝玉见过这个香袋，虽然还没做完，却十分精巧，费了许多工夫。
今见无故剪了，却也可气。|现在见她无缘无故剪了，也觉得可气。
因忙把衣领解了，从里面红袄襟上将黛玉所给的那荷包解了下来，递与黛玉瞧道：|就连忙解开衣领，从里面红袄的衣襟上把黛玉给的那个荷包解下来，递给黛玉看，说：
“你瞧瞧，这是什么！我那一回把你的东西给人了？”|“你看看，这是什么！我哪一回把你的东西给人了？”
林黛玉见他如此珍重，带在里面，可知是怕人拿去之意，|林黛玉见他这样珍重，戴在衣服里面，就知道他是怕被人拿走，
因此又自悔莽撞，未见皂白，就剪了香袋。|因此又后悔自己莽撞，不问青红皂白就剪了香袋。
因此又愧又气，低头一言不发。|所以又惭愧又生气，低着头一句话也不说。
! 黛玉送的荷包，宝玉贴身藏在里衣上。小厮们抢不走的，就是这一件。
! 黛玉的“小性儿”是因为太在乎。别人的东西给了也就给了，她的东西，她要知道在宝玉心里是独一份。

# 三、“你到那里，我跟到那里”
宝玉道：“你也不用剪，我知道你是懒待给我东西。|宝玉说：“你也不用剪，我知道你是懒得给我东西。
我连这荷包奉还，何如？”|我连这荷包也还给你，怎么样？”
说著，掷向他怀中便走。|说着扔到她怀里就走。
黛玉见如此，越发气起来，声咽气堵，又汪汪的滚下泪来，拿起荷包来又剪。|黛玉见他这样，更加生气，哽咽着说不出话，眼泪又汪汪地滚下来，拿起荷包又要剪。
宝玉见他如此，忙回身抢住，笑道：“好妹妹，饶了他罢！”|宝玉见她这样，连忙回身抢住，笑道：“好妹妹，饶了它吧！”
黛玉将剪子一摔，拭泪说道：|黛玉把剪子一摔，擦着眼泪说：
“你不用同我好一阵歹一阵的，要恼，就撂开手。|“你不用跟我一会儿好一会儿坏的，要生气，就撒手别理我。
这当了什么。”|这算什么。”
说著，赌气上床，面向里倒下拭泪。|说着赌气上了床，脸朝里躺下擦眼泪。
禁不住宝玉上来“妹妹”长“妹妹”短赔不是。|架不住宝玉上来“妹妹”长“妹妹”短地赔不是。
前面贾母一片声找宝玉。|前面贾母一声声地找宝玉。
众奶娘丫鬟们忙回说：“在林姑娘房里呢。”|奶妈丫鬟们连忙回说：“在林姑娘屋里呢。”
贾母听说道：“好，好，好！让他姊妹们一处顽顽罢。|贾母听了说：“好，好，好！让他们姐妹在一起玩玩吧。
才他老子拘了他这半天，让他开心一会子罢。|刚才他老子拘了他这半天，让他开心一会儿吧。
只别叫他们拌嘴，不许扭了他。”|只是别让他们拌嘴，不许拗着他。”
众人答应著。|众人答应着。
黛玉被宝玉缠不过，只得起来道：“你的意思不叫我安生，我就离了你。”|黛玉被宝玉缠得没办法，只好起来说：“你的意思是不让我安生，那我就离开你。”
说著往外就走。|说着往外就走。
宝玉笑道：“你到那里，我跟到那里。”|宝玉笑道：“你到哪里，我跟到哪里。”
一面仍拿起荷包来带上，黛玉伸手抢道：|一面又拿起荷包戴上，黛玉伸手来抢，说：
“你说不要了，这会子又带上，我也替你怪臊的！”|“你说不要了，这会儿又戴上，我都替你害臊！”
说著，“嗤”的一声又笑了。|说着“嗤”的一声又笑了。
宝玉道：“好妹妹，明儿另替我作个香袋儿罢。”|宝玉说：“好妹妹，明天再给我做个香袋吧。”
黛玉道：“那也只瞧我高兴罢了。”|黛玉说：“那也得看我高不高兴了。”
一面说，一面二人出房，到王夫人上房中去了，可巧宝钗亦在那里。|一边说着，两人出了房，到王夫人的上房去了，正好宝钗也在那里。
! 这是宝黛小儿女吵架的典型一场：一个剪，一个抢；一个哭，一个哄；最后“嗤”的一声笑了。
! “你到那里，我跟到那里”，宝玉说得随口，却是一生的誓言。

# 四、十二个女孩子和妙玉
此时王夫人那边热闹非常。|这时王夫人那边非常热闹。
原来贾蔷已从姑苏采买了十二个女孩子——并聘了教习——以及行头等事来了。|原来贾蔷已经从苏州买来了十二个女孩子，请好了教戏的师傅，还置办了戏装等东西。
那时薛姨妈另迁于东北上一所幽静房舍居住，将梨香院早已腾挪出来，另行修理了，就令教习在此教演女戏。|这时薛姨妈已经搬到东北边一所幽静的房子里去住，梨香院早就腾出来重新修整过，就叫教习在这里教女孩子们演戏。
又另派家中旧有曾演学过歌唱的女人们——如今皆已皤然老妪了，著他们带领管理。|又另外派了家里从前学过唱戏的女人们——现在都已经是白发老太太了——叫她们带领管理。
就令贾蔷总理其日用出入银钱等事，以及诸凡大小所需之物料账目。|就叫贾蔷总管她们日常的银钱进出和各种大小物料账目。
又有林之孝家的来回：“采访聘买得十个小尼姑，小道姑都有了，连新作的二十分道袍也有了。|又有林之孝家的来回：“打听着买来的十个小尼姑、小道姑都有了，连新做的二十套道袍也有了。
外有一个带发修行的，本是苏州人氏，祖上也是读书仕宦之家。|另外有一个带发修行的，本是苏州人，祖上也是读书做官的人家。
因生了这位姑娘自小多病，买了许多替身儿皆不中用，到底这位姑娘亲自入了空门，方才好了，|因为这位姑娘从小多病，买了许多替身出家都不管用，到底还是这位姑娘自己入了空门，病才好了，
所以带发修行，今年才十八岁，法名妙玉。|所以带发修行，今年才十八岁，法名叫妙玉。
如今父母俱已亡故，身边只有两个老嬷嬷，一个小丫头伏侍。|现在父母都已经去世了，身边只有两个老嬷嬷、一个小丫头伺候。
文墨也极通，经文也不用学了，摸样儿又极好。|文墨极通，经文也不用学了，模样又非常好。
因听见‘长安’都中有观音遗迹并贝叶遗文，去岁随了师父上来，现在西门外牟尼院住著。|因为听说京城里有观音的遗迹和贝叶经文，去年跟着师父来了，现在住在西门外的牟尼院。
他师父极精演先天神数，于去冬圆寂了。|她师父很精通先天神数，去年冬天圆寂了。
妙玉本欲扶灵回乡的，他师父临寂遗言，说他‘衣食起居不宜回乡。|妙玉本来想护送灵柩回乡，她师父临终留下话，说她‘衣食起居不宜回乡，
在此静居，后来自然有你的结果’。所以他竟未回乡。”|在这里静住，以后自然有你的结果’。所以她就没回乡。”
王夫人不等回完，便说：“既这样，我们何不接了他来。”|王夫人不等她说完，就说：“既然这样，我们何不把她接来。”
林之孝家的回道：“请他，他说‘侯门公府，必以贵势压人，我再不去的。’”|林之孝家的回说：“请过她，她说‘侯门公府，一定会仗势欺人，我是不去的。’”
王夫人笑道：“他既是官宦小姐，自然骄傲些，就下个帖子请他何妨。”|王夫人笑道：“她既然是官宦人家的小姐，自然骄傲些，就下个帖子请她又何妨。”
林之孝家的答应了出去，命书启相公写请帖去请妙玉。|林之孝家的答应着出去，叫管文书的相公写请帖去请妙玉。
次日遣人备车轿去接等后话，暂且搁过，此时不能表白。|第二天派人备车轿去接等后来的事，暂时放下，这里先不说。
! 妙玉在正册十二钗里，判词是“欲洁何曾洁，云空未必空”。她小时候和黛玉一样，也是多病、要出家才能好。
! 师父说“后来自然有你的结果”，这个“结果”据判词是“终陷淖泥中”，极为凄惨。
! 她嫌侯门“以贵势压人”，最后还是被一张帖子请进了大观园，住进了栊翠庵。

# 五、众人各自忙
当下又有人回，工程上等著糊东西的纱绫，请凤姐去开楼拣纱绫，|这时又有人来回，说工程上等着要糊东西用的纱绫，请凤姐去开楼挑纱绫；
又有人来回，请凤姐开库，收金银器皿。|又有人来回，请凤姐开库房，收金银器皿。
连王夫人并上房丫鬟等众，皆一时不得闲的。|连王夫人和上房的丫鬟们，都一时闲不下来。
宝钗便说：“咱们别在这里碍手碍脚，找探丫头去。”|宝钗就说：“咱们别在这里碍手碍脚，找探丫头去。”
说著，同宝玉黛玉往迎春等房中来闲顽，无话。|说着，和宝玉、黛玉到迎春她们屋里去玩了，没什么可说的。
王夫人等日日忙乱，直到十月将尽，幸皆全备：|王夫人等人天天忙乱，直到十月快完了，幸好都齐备了：
各处监管都交清账目，各处古董文玩，皆已陈设齐备，|各处管事的都交清了账目，各处的古董文玩都已经陈设好了；
采办鸟雀的，自仙鹤，孔雀以及鹿，兔，鸡，鹅等类，悉已买全，交于园中各处像景饲养；|采办鸟兽的，从仙鹤、孔雀到鹿、兔、鸡、鹅之类，都买齐了，交给园里各处按景致饲养；
贾蔷那边也演出二十出杂戏来，小尼姑，道姑也都学会了念几卷经咒。|贾蔷那边也排出了二十出戏，小尼姑、小道姑也都学会了念几卷经咒。
贾政方略心意宽畅，又请贾母等进园，色色斟酌，点缀妥当，再无一些遗漏不当之处了。|贾政这才稍微放下心来，又请贾母等人进园，样样斟酌，布置妥当，再没有一点遗漏不妥的地方了。
于是贾政方择日题本。|于是贾政才选了日子向皇上上奏本。
本上之日，奉朱批准奏：次年正月十五上元之日，恩准贾妃省亲。|奏本递上去那天，就得到了皇上的朱笔批准：明年正月十五元宵节，恩准贾妃回家省亲。
贾府领了此恩旨，益发昼夜不闲，年也不曾好生过的。|贾府接了这道恩旨，更是日夜不得闲，连年都没好好过。
! 宝钗一句“别在这里碍手碍脚”，处处得体，又顺手把宝玉、黛玉都带走了。

# 六、元宵前的准备
展眼元宵在迩，自正月初八日，就有太监出来先看方向：|转眼元宵节就要到了，从正月初八起，就有太监出来先查看方位：
何处更衣，何处燕坐，何处受礼，何处开宴，何处退息。|在哪里换衣服，在哪里休息闲坐，在哪里受礼，在哪里开宴，在哪里退下歇息。
又有巡察地方总理关防太监等，带了许多小太监出来，各处关防，挡围幕，|又有负责巡察和警卫的总管太监，带着许多小太监出来，到处设警卫、挡围幕，
指示贾宅人员何处退，何处跪，何处进膳，何处启事，种种仪注不一。|指示贾家的人在哪里回避，在哪里下跪，在哪里进膳，在哪里禀事，各种礼仪规矩不一而足。
外面又有工部官员并五城兵备道打扫街道，撵逐闲人。|外面又有工部的官员和五城兵马司打扫街道，驱赶闲人。
贾赦等督率匠人扎花灯烟火之类，至十四日，俱已停妥。|贾赦等人督促工匠扎花灯、做烟火之类，到十四日，都已经准备停当。
这一夜，上下通不曾睡。|这一夜，上上下下都没有睡觉。

# 七、等候
至十五日五鼓，自贾母等有爵者，皆按品服大妆。|到了十五日五更，贾母等有爵位封号的人，都按品级穿戴好礼服。
园内各处，帐舞蟠龙，帘飞彩凤，金银焕彩，珠宝争辉，|园子里各处，帐幔上盘龙飞舞，帘子上彩凤翻飞，金银闪闪发光，珠宝争相辉映，
鼎焚百合之香，瓶插长春之蕊，静悄无人咳嗽。|香鼎里焚着百合香，花瓶里插着长春花，静悄悄的，连一声咳嗽都没有。
贾赦等在西街门外，贾母等在荣府大门外。|贾赦等人在西街门外，贾母等人在荣府大门外。
街头巷口，俱系围幕挡严。|街头巷口，都用围幕挡得严严实实。
正等的不耐烦，忽一太监坐大马而来，贾母忙接入，问其消息。|正等得不耐烦，忽然一个太监骑着大马来了，贾母连忙接进来，问他消息。
太监道：“早多著呢！|太监说：“早着呢！
未初刻用过晚膳，未正二刻还到宝灵宫拜佛，酉初刻进大明宫领宴看灯方请旨，只怕戌初才起身呢。”|未初刻（下午一点）用过晚膳，未正二刻（下午两点半）还要到宝灵宫拜佛，酉初刻（下午五点）进大明宫领宴看灯，然后才请旨，只怕戌初（晚上七点）才动身呢。”
凤姐听了道：“既这么著，老太太，太太且请回房，等是时候再来也不迟。”|凤姐听了说：“既然这样，老太太、太太先请回房，等到时候再来也不迟。”
于是贾母等暂且自便，园中悉赖凤姐照理。|于是贾母等人暂时自便，园子里全靠凤姐照料。
又命执事人带领太监们去吃酒饭。|又叫管事的人带太监们去吃酒饭。
! 五更就穿戴整齐，一直等到晚上七点以后。一位年迈的祖母，要跪在门外等自己的孙女。皇家的“恩典”，代价就是这样。

# 八、元春驾到
一时传人一担一担的挑进蜡烛来，各处点灯。|一会儿叫人一担一担地挑进蜡烛来，各处点灯。
方点完时，忽听外边马跑之声。|刚点完，忽然听见外面马跑的声音。
一时，有十来个太监都喘吁吁跑来拍手儿。|一会儿，有十来个太监气喘吁吁地跑来拍手。
这些太监会意，都知道是“来了，来了”，各按方向站住。|这边的太监们都明白，知道是“来了，来了”，各自按方位站好。
贾赦领合族子侄在西街门外，贾母领合族女眷在大门外迎接。|贾赦带领全族子侄在西街门外，贾母带领全族女眷在大门外迎接。
半日静悄悄的。|好半天静悄悄的。
忽见一对红衣太监骑马缓缓的走来，至西街门下了马，将马赶出围幕之外，便垂手面西站住。|忽然看见一对穿红衣的太监骑马慢慢走来，到西街门下了马，把马赶到围幕外面，就垂着手面朝西站住了。
半日又是一对，亦是如此。|过了半天又来一对，也是这样。
少时便来了十来对，方闻得隐隐细乐之声。|不一会儿来了十来对，才隐隐听见轻柔的乐声。
一对对龙旌凤翣，雉羽夔头，又有销金提炉焚著御香，|一对对龙旗、凤扇、雉羽、夔头等仪仗过去，又有贴金的提炉焚着御香，
然后一把曲柄七凤黄金伞过来，便是冠袍带履。|然后一把曲柄七凤黄金伞过来，接着是捧着冠、袍、带、鞋的。
又有值事太监捧著香珠，绣帕，漱盂，拂尘等类。|又有当值的太监捧着香珠、绣帕、漱口盂、拂尘之类。
一队队过完，后面方是八个太监抬著一顶金顶金黄绣凤版舆，缓缓行来。|一队队过完，后面才是八个太监抬着一顶金顶、金黄色绣凤的轿子，慢慢走来。
贾母等连忙路旁跪下。|贾母等人连忙在路旁跪下。
早飞跑过几个太监来，扶起贾母，邢夫人，王夫人来。|早有几个太监飞跑过来，把贾母、邢夫人、王夫人扶起来。
那版舆抬进大门，入仪门往东去，到一所院落门前，有执拂太监跪请下舆更衣。|那轿子抬进大门，进了仪门往东去，到一所院落门前，有拿拂尘的太监跪着请贵妃下轿更衣。
于是抬舆入门，太监等散去，只有昭容，彩嫔等引领元春下舆。|于是把轿子抬进门，太监们散开，只有昭容、彩嫔等女官扶元春下轿。
只见院内各色花灯烂灼，皆系纱绫扎成，精致非常。|只见院子里各色花灯灿烂辉煌，都是用纱绫扎成的，非常精致。
上面有一匾灯，写著“体仁沐德”四字。|上面有一盏匾灯，写着“体仁沐德”四个字。
! 作者不写元春的脸，先写一对一对的太监、一层一层的仪仗，等了“半日”又“半日”，读者也跟着等。
! 亲祖母要跪下迎接亲孙女，这就是“国礼”压过了“家礼”。

# 九、石头插话
元春入室，更衣毕复出，上舆进园。|元春进屋换好衣服又出来，上轿进园。
只见园中香烟缭绕，花彩缤纷，处处灯光相映，时时细乐声喧，说不尽这太平气象，富贵风流。|只见园子里香烟缭绕，花彩缤纷，处处灯光相映，时时乐声悠扬，说不尽这太平气象、富贵风流。
——此时自己回想当初在大荒山中，青埂峰下，那等凄凉寂寞，|——这时（石头）自己回想当初在大荒山里、青埂峰下，那样凄凉寂寞，
若不亏癞憎，跛道二人携来到此，又安能得见这般世面。|要不是多亏了癞头和尚、跛足道人两个把我带到这里，又怎么能见到这样的世面。
本欲作一篇《灯月赋》，《省亲颂》，以志今日之事，但又恐入了别书的俗套。|本想写一篇《灯月赋》《省亲颂》来记下今天的事，又怕落入别的书的俗套。
按此时之景，即作一赋一赞，也不能形容得尽其妙，|照这时的景象，就是写一篇赋、一篇赞，也形容不尽它的妙处；
即不作赋赞，其豪华富丽，观者诸公亦可想而知矣。|就是不写赋赞，那豪华富丽，各位读者也可以想象得到。
所以倒是省了这工夫纸墨，且说正经的为是。|所以倒不如省了这工夫和纸墨，还是说正经事吧。
! 这是全书极少见的一笔：叙述者“石头”自己跳出来说话。那块被带下凡的顽石，就挂在宝玉的脖子上，所以他亲眼看见了这一夜。
! 想起青埂峰的“凄凉寂寞”，正是在最热闹的时候。作者不让读者忘了：这一切都是石头的一场梦。

# 十、元春叹奢华
且说贾妃在轿内看此园内外如此豪华，因默默叹息奢华过费。|贾妃在轿子里看见园子内外这样豪华，就默默叹息太奢侈浪费了。
忽又见执拂太监跪请登舟，贾妃乃下舆。|忽然又见拿拂尘的太监跪请上船，贾妃就下了轿。
只见清流一带，势如游龙，两边石栏上，皆系水晶玻璃各色风灯，点的如银花雪浪，|只见一道清流，像游龙一样蜿蜒，两边的石栏杆上挂满了水晶玻璃的各色风灯，点得像银花雪浪一样，
上面柳杏诸树虽无花叶，然皆用通草绸绫纸绢依势作成，粘于枝上的，每一株悬灯数盏，|上面的柳树杏树虽然没有花叶，却都用通草、绸绫、纸绢照着样子做成花叶，粘在枝头上，每一棵树挂着几盏灯，
更兼池中荷荇凫鹭之属，亦皆系螺蚌羽毛之类作就的。|再加上池子里的荷花、荇菜、野鸭、白鹭之类，也都是用螺壳、蚌壳和羽毛做成的。
诸灯上下争辉，真系玻璃世界，珠宝乾坤。|各种灯上下争相辉映，真是玻璃世界、珠宝乾坤。
船上亦系各种精致盆景诸灯，珠帘绣幕，桂楫兰桡，自不必说。|船上也摆着各种精致的盆景和灯，珠帘绣幕，桂木的桨、兰木的舵，自然不用说了。
! 正月里没有花叶，就用绸绢做假的；池里没有鸟，就用羽毛做假的。整个园子都是“假”的繁华，元春看得明白，所以“默默叹息”。

# 十一、为什么用宝玉题的匾
已而入一石港，港上一面匾灯，明现著“蓼汀花溆”四字。|不久进了一个石港，港上有一面匾灯，明明白白写着“蓼汀花溆”四个字。
按此四字并“有凤来仪”等处，皆系上回贾政偶然一试宝玉之课艺才情耳，何今日认真用此匾联？|这四个字和“有凤来仪”等处，都是上一回贾政偶然试试宝玉的学问才情罢了，为什么今天当真用了这些匾额对联？
况贾政世代诗书，来往诸客屏侍座陪者，悉皆才技之流，岂无一名手题撰，竟用小儿一戏之辞苟且搪塞？|况且贾政家世代读书，来往陪坐的客人都是有才学的人，难道没有一个高手来题写，竟用小孩子的一句玩笑话来敷衍？
真似暴发新荣之家，滥使银钱，一味抹油涂朱，|这真像暴发户人家，乱花银子，一味地涂红抹绿，
毕则大书“前门绿柳垂金锁，后户青山列锦屏”之类，则以为大雅可观，|完了就大书“前门绿柳垂金锁，后户青山列锦屏”之类的句子，还以为很高雅好看，
岂《石头记》中通部所表之宁荣贾府所为哉！|这哪里是《石头记》整部书里写的宁荣贾府会做的事！
据此论之，竟大相矛盾了。|照这么说，竟然大相矛盾了。
诸公不知，待蠢物将原委说明，大家方知。|各位不知道，等我这个蠢物把来龙去脉说明白，大家就知道了。
! 作者自问自答，先替读者提出疑问，再来解释。“蠢物”就是石头自称。

# 十二、元春和宝玉
当日这贾妃未入宫时，自幼亦系贾母教养。|当年这位贾妃没进宫时，也是从小由贾母抚养教育的。
后来添了宝玉，贾妃乃长姊，宝玉为弱弟，|后来有了宝玉，贾妃是大姐，宝玉是小弟弟，
贾妃之心上念母年将迈，始得此弟，是以怜爱宝玉，与诸弟待之不同。|贾妃想到母亲年纪大了才得了这个弟弟，所以特别疼爱宝玉，对他和对别的弟弟不一样。
且同随祖母，刻未暂离。|而且两人一起跟着祖母，一刻也没分开过。
那宝玉未入学堂之先，三四岁时，已得贾妃手引口传，教授了几本书，数千字在腹内了。|宝玉还没上学的时候，三四岁时，就已经由贾妃手把手、一句句地教了几本书，肚子里有几千个字了。
其名分虽系姊弟，其情状有如母子。|他们名分上虽然是姐弟，情分上却像母子一样。
自入宫后，时时带信出来与父母说：|贾妃进宫以后，常常带信出来对父母说：
“千万好生扶养，不严不能成器，过严恐生不虞，且致父母之忧。”|“千万好好抚养他，不严格管教不能成器，可太严了又怕出意外，反而叫父母担忧。”
眷念切爱之心，刻未能忘。|那份挂念疼爱的心，一刻也没忘过。
前日贾政闻塾师背后赞宝玉偏才尽有，贾政未信，|前些日子贾政听私塾先生背地里称赞宝玉很有些偏才，贾政不信，
适巧遇园已落成，令其题撰，聊一试其情思之清浊。|正好赶上园子建成，就叫他题写，姑且试试他的才思怎么样。
其所拟之匾联虽非妙句，在幼童为之，亦或可取。|他拟的匾额对联虽然不算妙句，可出自一个孩子之手，也还可取。
即另使名公大笔为之，固不费难，然想来倒不如这本家风味有趣。|另请名家大手笔来题，固然不难，可想来倒不如自家人题的有意思。
更使贾妃见之，知系其爱弟所为，亦或不负其素日切望之意。|更让贾妃看见，知道是她心爱的弟弟写的，也不辜负她平日殷切的期望。
因有这段原委，故此竟用了宝玉所题之联额。|因为有这段缘故，所以就用了宝玉题的匾额对联。
那日虽未曾题完，后来亦曾补拟。|那天虽然没题完，后来也补拟了。
! 原来宝玉的启蒙老师是元春。这就解释了为什么元春看见宝玉的题字会那样欢喜。
! “不严不能成器，过严恐生不虞”：元春在宫里还替弟弟操心，这份姐弟之情，是元春这个人物最温暖的一面。

# 十三、省亲别墅
闲文少述，且说贾妃看了四字，笑道：“‘花溆’二字便妥，何必，‘蓼汀’？”|闲话少说，贾妃看了这四个字，笑道：“‘花溆’两个字就够了，何必再加‘蓼汀’？”
侍座太监听了，忙下小舟登岸，飞传与贾政。|陪坐的太监听了，连忙下小船上岸，飞快地传话给贾政。
贾政听了，即忙移换。|贾政听了，马上换了。
一时，舟临内岸，复弃舟上舆，便见琳宫绰约，桂殿巍峨。|一会儿，船靠了内岸，贾妃又下船上轿，只见华美的宫殿轻盈秀丽，桂木的殿堂巍峨高大。
石牌坊上明显“天仙宝境”四字，贾妃忙命换“省亲别墅”四字。|石牌坊上明明白白写着“天仙宝境”四个字，贾妃连忙叫人换成“省亲别墅”四个字。
于是进入行宫。|于是进了行宫。
但见庭燎烧空，香屑布地，火树琪花，金窗玉槛。|只见庭院里的火炬照亮天空，地上铺满香屑，灯火像火树、像玉花，金色的窗、玉石的栏杆。
说不尽帘卷虾须，毯铺鱼獭，鼎飘麝脑之香，屏列雉尾之扇。|说不尽那虾须编的帘子卷起来，鱼獭皮的地毯铺开，香鼎里飘着麝香和龙脑香，屏风前排列着雉尾扇。
真是：|真是：
~金门玉户神仙府，桂殿兰宫妃子家。|金门玉户，像神仙的府第；桂殿兰宫，是贵妃的娘家。
! 元春把“天仙宝境”改成“省亲别墅”：她不要“仙境”，只要“回家”。可这座石牌坊，正是宝玉梦中“太虚幻境”的那一座。

# 十四、正殿受礼
贾妃乃问：“此殿何无匾额？”|贾妃问：“这座殿怎么没有匾额？”
随侍太监跪启曰：“此系正殿，外臣未敢擅拟。”|随侍的太监跪着回禀：“这是正殿，外臣不敢擅自拟名。”
贾妃点头不语。|贾妃点头不说话。
礼仪太监跪请升座受礼，两陛乐起。|礼仪太监跪请贵妃升座受礼，两边台阶上奏起了音乐。
礼仪太监二人引贾赦，贾政等于月台下排班，殿上昭容传谕曰：“免。”|两个礼仪太监领着贾赦、贾政等人在月台下排好班次，殿上的昭容传话说：“免礼。”
太监引贾赦等退出。|太监就领着贾赦等人退了出去。
又有太监引荣国太君及女眷等自东阶升月台上排班，昭容再谕曰：“免。”|又有太监领着荣国太君（贾母）和女眷们从东边台阶上到月台上排班，昭容又传话说：“免礼。”
于是引退。|于是又领她们退下。
! 父亲、祖母都要先在殿外排班行礼，女儿说一声“免”才能退下。这一幕，是全书最冷的“团圆”。

# 十五、骨肉相见
茶已三献，贾妃降座，乐止。|献过三次茶，贾妃走下宝座，音乐停了。
退入侧殿更衣，方备省亲车驾出园。|她退到侧殿换了衣服，才准备省亲的车驾出园。
至贾母正室，欲行家礼，贾母等俱跪止不迭。|到了贾母的正房，贾妃要行家礼，贾母等人都连忙跪下阻止。
贾妃满眼垂泪，方彼此上前厮见，一手搀贾母，一手搀王夫人，|贾妃满眼含泪，这才彼此上前相见，一手搀着贾母，一手搀着王夫人，
三个人满心里皆有许多话，只是俱说不出，只管呜咽对泣。|三个人心里都有许多话，只是都说不出来，只是相对呜咽哭泣。
邢夫人，李纨，王熙凤，迎，探，惜三姊妹等，俱在旁围绕，垂泪无言。|邢夫人、李纨、王熙凤和迎春、探春、惜春三姐妹等，都围在旁边，默默流泪。
半日，贾妃方忍悲强笑，安慰贾母，王夫人道：|过了半天，贾妃才忍住悲伤、强装笑容，安慰贾母和王夫人说：
“当日既送我到那不得见人的去处，好容易今日回家娘儿们一会，|“当初既然把我送到那个见不得人的地方，好不容易今天回家，娘儿们见一面，
不说说笑笑，反倒哭起来。|不说说笑笑，反倒哭起来了。
一会子我去了，又不知多早晚才来！”|过一会儿我走了，又不知道什么时候才能再来！”
说到这句，不禁又哽咽起来。|说到这一句，不由得又哽咽起来。
邢夫人等忙上来解劝。|邢夫人等人连忙上来劝慰。
! “那不得见人的去处”：贵妃自己这样称呼皇宫。这一句是全书最大胆的话之一，富贵到了顶，却是一座牢笼。
! 脂批在这里说，作者写到此处“不禁泪下”。

# 十六、贾政隔帘
贾母等让贾妃归座，又逐次一一见过，又不免哭泣一番。|贾母等人请贾妃坐下，又一个一个依次见过，又免不了哭了一场。
然后东西两府掌家执事人丁在厅外行礼，及两府掌家执事媳妇领丫鬟等行礼毕。|然后东西两府管家管事的男仆在厅外行礼，两府管家管事的媳妇带着丫鬟们也行完了礼。
贾妃因问：“薛姨妈，宝钗，黛玉因何不见？”|贾妃问：“薛姨妈、宝钗、黛玉为什么没见到？”
王夫人启曰：“外眷无职，未敢擅入。”|王夫人回禀：“外亲没有封号，不敢擅自进来。”
贾妃听了，忙命快请。|贾妃听了，连忙叫快请。
一时，薛姨妈等进来，欲行国礼，亦命免过，上前各叙阔别寒温。|一会儿，薛姨妈等人进来，要行国礼，贾妃也叫免了，上前各自叙了离别之情和冷暖寒温。
又有贾妃原带进宫去的丫鬟抱琴等上来叩见，贾母等连忙扶起，命人别室款待。|又有贾妃原来带进宫的丫鬟抱琴等人上来叩见，贾母等人连忙扶起来，叫人在别的屋里招待她们。
执事太监及彩嫔，昭容各侍从人等，宁国府及贾赦那宅两处自有人款待，只留三四个小太监答应。|管事的太监和彩嫔、昭容等侍从，宁国府和贾赦那边两处自有人招待，只留下三四个小太监伺候。
母女姊妹深叙些离别情景，及家务私情。|母女姐妹们细细叙说了离别的情景和家务私事。
又有贾政至帘外问安，贾妃垂帘行参等事。|又有贾政到帘外问安，贾妃隔着帘子行参见礼等事。
又隔帘含泪谓其父曰：|贾妃又隔着帘子含泪对父亲说：
“田舍之家，虽齑盐布帛，终能聚天伦之乐，今虽富贵已极，骨肉各方，然终无意趣！”|“农家人虽然只吃咸菜、穿布衣，终究能享天伦之乐；现在虽然富贵到了极点，骨肉却各在一方，终究没什么意思！”
! 抱琴是元春的丫鬟。元春、迎春、探春、惜春的丫鬟分别叫抱琴、司棋、侍书、入画，合起来是“琴棋书画”。
! 父女见面要隔着一道帘子。元春一句“终无意趣”，把富贵说穿了。

# 十七、贾政的回话
贾政亦含泪启道：|贾政也含着泪回禀：
“臣，草莽寒门，鸠群鸦属之中，岂意得征凤鸾之瑞。|“臣出身草野寒门，在一群斑鸠乌鸦之中，哪里想到能出凤凰这样的祥瑞。
今贵人上锡天恩，下昭祖德，此皆山川日月之精奇，祖宗之远德钟于一人，幸及政夫妇。|现在贵人上承皇上的恩典，下显祖宗的德泽，这都是山川日月的精华、祖宗积下的德行集中在您一人身上，我们夫妇也有幸沾光。
且今上启天地生物之大德，垂古今未有之旷恩，虽肝脑涂地，臣子岂能得报于万一！|况且当今皇上施行天地化育万物的大德，降下古今从来没有的大恩，就算肝脑涂地，做臣子的又怎能报答万分之一！
惟朝乾夕惕，忠于厥职外，愿我君万寿千秋，乃天下苍生之同幸也。|只有早晚勤勉谨慎、尽忠职守之外，祝愿皇上万寿千秋，这是天下百姓共同的幸运。
贵妃切勿以政夫妇残年为念，懑愤金怀，更祈自加珍爱。|贵妃千万不要挂念我们夫妇的晚年，烦闷伤怀，更要请您自己多加保重。
惟业业兢兢，勤慎恭肃以侍上，庶不负上体贴眷爱如此之隆恩也。”|只要小心谨慎、勤勉恭敬地侍奉皇上，才不辜负皇上这样体贴宠爱的大恩。”
贾妃亦嘱“只以国事为重，暇时保养，切勿记念”等语。|贾妃也嘱咐父亲“只以国事为重，有空时保养身体，千万不要挂念我”等话。
贾政又启：“园中所有亭台轩馆，皆系宝玉所题，如果有一二稍可寓目者，请别赐名为幸。”|贾政又回禀：“园子里所有的亭台轩馆，都是宝玉题的，如果有一两处还看得过去，请您另外赐名就是我们的荣幸了。”
元妃听了宝玉能题，便含笑说：“果进益了。”|元妃听说宝玉会题字了，就含笑说：“果然长进了。”
贾政退出。|贾政退了出去。
! 女儿说的是家常话、真心话，父亲回的全是官话、套话，一句一个“臣”。这一问一答，正是“情”与“礼”的对照。
! 只有说到宝玉时，元春才“含笑”。

# 十八、宝玉进见
贾妃见宝，林二人亦发比别姊妹不同，真是姣花软玉一般。|贾妃看宝钗、黛玉两人更是和别的姐妹不同，真像娇艳的花、温软的玉一样。
因问：“宝玉为何不进见？”|又问：“宝玉为什么不进来见我？”
贾母乃启：“无谕，外男不敢擅入。”|贾母回禀：“没有您的旨意，外男不敢擅自进来。”
元妃命快引进来。|元妃叫快领他进来。
小太监出去引宝玉进来，先行国礼毕，元妃命他进前，携手拦于怀内，又抚其头颈笑道：|小太监出去领宝玉进来，宝玉先行了国礼，元妃叫他上前，拉着他的手揽到怀里，又摸着他的头和脖子笑道：
“比先竟长了好些……”|“比以前长高了好些……”
一语未终，泪如雨下。|一句话还没说完，眼泪就像雨一样落下来。
! 这里的“宝、林二人”是宝钗和黛玉（“宝”指宝钗）。元春对这两个女孩子都留了心，后来端午节赏赐时，她给宝钗和宝玉的东西一样，这是她的心意。
! 亲弟弟也成了“外男”。元春抱着宝玉，“比先竟长了好些”，像母亲见到久别的孩子。

# 十九、游园
尤氏，凤姐等上来启道：“筵宴齐备，请贵妃游幸。”|尤氏、凤姐等人上来回禀：“筵席都准备好了，请贵妃游园。”
元妃等起身，命宝玉导引，遂同诸人步至园门前，早见灯光火树之中，诸般罗列非常。|元妃起身，叫宝玉领路，就和众人走到园门前，只见灯火辉煌之中，各种陈设非常齐全。
进园来先从“有凤来仪”，“红香绿玉”，“杏帘在望”，“蘅芷清芬”等处，|进了园，先从“有凤来仪”“红香绿玉”“杏帘在望”“蘅芷清芬”这几处走起，
登楼步阁，涉水缘山，百般眺览徘徊。|上楼登阁，涉水爬山，到处观赏流连。
一处处铺陈不一，一桩桩点缀新奇。|一处处陈设各不相同，一样样点缀都很新奇。
贾妃极加奖赞，又劝：“以后不可太奢，此皆过分之极。”|贾妃大加称赞，又劝道：“以后不要太奢侈了，这些都太过分了。”
已而至正殿，谕免礼归座，大开筵宴。|然后到了正殿，传谕免礼，各自归座，大摆筵席。
贾母等在下相陪，尤氏，李纨，凤姐等亲捧羹把盏。|贾母等人在下面陪着，尤氏、李纨、凤姐等人亲自捧汤端酒。
! 元春第二次说“太奢”“过分之极”。可这园子是为她修的，她说得越多，越显得无奈。

# 二十、元春赐名
元妃乃命传笔砚伺候，亲搦湘管，择其几处最喜者赐名。|元妃叫人拿来笔砚，亲自拿起湘竹笔，挑几处最喜欢的地方赐名。
按其书云：|她写的是：
“顾恩思义”匾额|“顾恩思义”匾额
~天地启宏慈，赤子苍头同感戴，|天地开启宏大的慈恩，孩童和老人都一同感恩戴德；
~古今垂旷典，九州万国被恩荣。|古往今来留下这空前的盛典，九州万国都沐浴着恩荣。
此一匾一联书于正殿。|这一匾一联写在正殿上。
“大观园”园之名，|“大观园”是园子的名字。
“有凤来仪”赐名曰“潇湘馆”，|“有凤来仪”赐名叫“潇湘馆”，
“红香绿玉”改作“怡红快绿”，即名曰“怡红院”，|“红香绿玉”改成“怡红快绿”，名字叫“怡红院”，
“蘅芷清芬”赐名曰“蘅芜苑”，|“蘅芷清芬”赐名叫“蘅芜苑”，
“杏帘在望”赐名曰“浣葛山庄”，|“杏帘在望”赐名叫“浣葛山庄”，
正楼曰“大观楼”。|正楼叫“大观楼”。
东面飞楼曰“缀锦阁”，西面斜楼曰“含芳阁”、|东面的飞楼叫“缀锦阁”，西面的斜楼叫“含芳阁”，
更有“蓼风轩”，“藕香榭”，“紫菱洲”，“荇叶渚”等名，|还有“蓼风轩”“藕香榭”“紫菱洲”“荇叶渚”等名字，
又有四字的匾额十数个，诸如“梨花春雨”，“桐剪秋风”，“荻芦夜雪”等名，此时悉难全记。|又有十几个四字的匾额，像“梨花春雨”“桐剪秋风”“荻芦夜雪”等，这里难以全部记下。
又命旧有匾联俱不必摘去。|又命令原有的匾额对联都不必摘下。
于是先题一绝云：|于是先题了一首绝句：
~衔山抱水建来精，多少工夫筑始成。|依山傍水，建造得这样精巧，花了多少工夫才筑成。
~天上人间诸景备，芳园应锡大观名。|天上人间的各种景致这里都有，这座美丽的园子应该赐名“大观”。
! 从这里起，园子有了正式的名字。“潇湘”用娥皇、女英哭舜、泪洒湘竹的典故，正合黛玉的“还泪”。
! “蓼风轩”是惜春住处，“紫菱洲”是迎春住处，“藕香榭”在后面第三十八回是姐妹们吃螃蟹作菊花诗的地方。
! 元春先叫“浣葛山庄”，看了黛玉代写的诗，才改成“稻香村”。

# 二十一、元春命题
写毕，向诸姊妹笑道：|写完，对姐妹们笑道：
“我素乏捷才，且不长于吟咏，妹辈素所深知。|“我向来没有敏捷的才思，也不擅长作诗，妹妹们是知道的。
今夜聊以塞责，不负斯景而已。|今晚不过是应付一下，不辜负这美景罢了。
异日少暇，必补撰《大观园记》并《省亲颂》等文，以记今日之事。|以后有空，一定补写《大观园记》和《省亲颂》等文章，来记下今天的事。
妹辈亦各题一匾一诗，随才之长短，亦暂吟成，不可因我微才所缚。|妹妹们也各题一个匾额、一首诗，按各人的才情，暂时吟成就行，不要因为我才疏学浅就拘束了。
且喜宝玉竟知题咏，是我意外之想。|更高兴的是宝玉竟然会题咏了，这是我没想到的。
此中‘潇湘馆’，‘蘅芜苑’二处，我所极爱，次之‘怡红院’，‘浣葛山庄’，|这里面‘潇湘馆’‘蘅芜苑’两处，我最喜欢，其次是‘怡红院’‘浣葛山庄’，
此四大处，必得别有章句题咏方妙。|这四大处，一定要另外有诗句题咏才好。
前所题之联虽佳，如今再各赋五言律一首，使我当面试过，方不负我自幼教授之苦心。”|以前题的对联虽然好，现在再各作一首五言律诗，让我当面考一考，才不辜负我从小教他的一番苦心。”
宝玉只得答应了，下来自去构思。|宝玉只好答应了，下去自己构思。
迎，探，惜三人之中，要算探春又出于姊妹之上，然自忖亦难与薛林争衡，只得勉强随众塞责而已。|迎春、探春、惜春三人里，要算探春最出众，可她自己也觉得难以和宝钗、黛玉相比，只好勉强跟着大家应付一下罢了。
李纨也勉强凑成一律。|李纨也勉强凑成了一首律诗。
贾妃先挨次看姊妹们的，写道是：|贾妃先一个个看姐妹们的诗，写的是：

# 二十二、姐妹们的诗
“旷性怡情”匾额　迎春|“旷性怡情”匾额，迎春作
~园成景备特精奇，奉命羞题额旷怡。|园子建成，景致齐备，特别精奇；奉命题匾，惭愧地题了“旷性怡情”。
~谁信世间有此境，游来宁不畅神思？|谁相信世上有这样的境界，游览起来怎能不心旷神怡？
“万象争辉”匾额　探春|“万象争辉”匾额，探春作
~名园筑出势巍巍，奉命何惭学浅微。|名园建成，气势巍峨；奉命题诗，怎敢顾及自己学问浅薄。
~精妙一时言不出，果然万物生光辉。|精妙之处一时说不出来，果然万物都焕发着光辉。
“文章造化”匾额　惜春|“文章造化”匾额，惜春作
~山水横拖千里外，楼台高起五云中。|山水横亘，延伸到千里之外；楼台高耸，直入五彩云中。
~园修日月光辉里，景夺文章造化功。|园子修建在日月的光辉里，景致夺去了文章和造化的功力。
“文采风流”匾额　李纨|“文采风流”匾额，李纨作
~秀水明山抱复回，风流文采胜蓬莱。|秀丽的山水环抱回绕，风流文采胜过蓬莱仙境。
~绿裁歌扇迷芳草，红衬湘裙舞落梅。|绿叶像裁成的歌扇，让芳草也迷离；红花衬着湘裙，像在落梅中起舞。
~珠玉自应传盛世，神仙何幸下瑶台。|珠玉般的诗文自然应该流传于盛世，神仙有幸走下瑶台。
~名园一自邀游赏，未许凡人到此来。|这座名园自从贵妃游赏过，就不许凡人再到这里来了。
“凝晖钟瑞”匾额　薛宝钗|“凝晖钟瑞”匾额，薛宝钗作
~芳园筑向帝城西，华日祥云笼罩奇。|美丽的园子建在京城西边，灿烂的阳光和吉祥的云彩奇妙地笼罩着它。
~高柳喜迁莺出谷，修篁时待凤来仪。|高柳上，黄莺欢喜地从山谷迁来；修竹旁，时时等待着凤凰降临。
~文风已著宸游夕，孝化应隆归省时。|皇家出游的夜晚，文风已经显扬；归家省亲的时刻，孝道教化应当兴盛。
~睿藻仙才盈彩笔，自惭何敢再为辞。|贵妃的妙笔仙才充满了彩笔，我自愧不如，怎么敢再作诗。
“世外仙源”匾额　林黛玉|“世外仙源”匾额，林黛玉作
~名园筑何处，仙境别红尘。|这座名园建在哪里？是一处远离尘世的仙境。
~借得山川秀，添来景物新。|借来了山川的秀美，添上了崭新的景物。
~香融金谷酒，花媚玉堂人。|香气融进了金谷园的美酒，鲜花映衬着玉堂中的美人。
~何幸邀恩宠，宫车过往频。|多么幸运能得到贵妃的恩宠，希望宫车常常来往。
! 迎春、惜春的诗平平，正如作者说的“随众塞责”。
! 宝钗的诗句句颂圣，用了“凤来仪”“孝化”等，最合应制的身份；黛玉的诗清新灵动，“何幸邀恩宠，宫车过往频”，盼贵妃常来，最有人情味。两人的性情，从诗里就分出来了。

# 二十三、黛玉没能大展才华
贾妃看毕，称赏一番，又笑道：“终是薛林二妹之作与众不同，非愚姊妹可同列者。”|贾妃看完，称赞了一番，又笑道：“终究是薛、林两位妹妹的诗与众不同，不是我们这些姐妹能比的。”
原来林黛玉安心今夜大展奇才，将众人压倒，|原来林黛玉打定主意今晚要大展奇才，把大家都比下去，
不想贾妃只命一匾一咏，倒不好违谕多作，只胡乱作一首五言律应景罢了。|没想到贾妃只叫每人题一匾作一首诗，她也不好违命多作，只随便作了一首五言律诗应景罢了。
! 黛玉要“将众人压倒”，这是她好胜的一面。她的才华没处施展，下面就替宝玉代笔了。

# 二十四、“绿蜡”一字师
彼时宝玉尚未作完，只刚作了“潇湘馆”与“蘅芜苑”二首，正作“怡红院”一首，起草内有“绿玉春犹卷”一句。|这时宝玉还没作完，刚作好“潇湘馆”和“蘅芜苑”两首，正在作“怡红院”一首，草稿里有一句“绿玉春犹卷”。
宝钗转眼瞥见，便趁众人不理论，急忙回身悄推他道：|宝钗一转眼瞥见了，就趁大家不注意，急忙回身悄悄推他说：
“他因不喜‘红香绿玉’四字，改了‘怡红快绿’，你这会子偏用‘绿玉’二字，岂不是有意和他争驰了？|“她因为不喜欢‘红香绿玉’四个字，才改成了‘怡红快绿’，你这会儿偏用‘绿玉’两个字，岂不是故意跟她对着干？
况且蕉叶之说也颇多，再想一个字改了罢。”|况且写芭蕉叶的典故也很多，再想一个字改了吧。”
宝玉见宝钗如此说，便拭汗道：“我这会子总想不起什么典故出处来。”|宝玉见宝钗这样说，就擦着汗说：“我这会儿怎么也想不起什么典故出处来。”
宝钗笑道：“你只把‘绿玉’的‘玉’字改作‘蜡’字就是了。”|宝钗笑道：“你只把‘绿玉’的‘玉’字改成‘蜡’字就行了。”
宝玉道：“‘绿蜡’可有出处？”|宝玉说：“‘绿蜡’有出处吗？”
宝钗见问，悄悄的咂嘴点头笑道：|宝钗见他问，悄悄地咂着嘴、点着头笑道：
“亏你今夜不过如此，将来金殿对策，你大约连‘赵钱孙李’都忘了呢！|“亏你今晚不过这样，将来到金殿上对答策问，你大概连‘赵钱孙李’都忘了！
唐钱珝咏芭蕉诗头一句：‘冷烛无烟绿蜡干’，你都忘了不成？”|唐朝钱珝咏芭蕉的诗，头一句就是‘冷烛无烟绿蜡干’，你都忘了不成？”
宝玉听了，不觉洞开心臆，笑道：|宝玉听了，顿时心里豁然开朗，笑道：
“该死，该死！现成眼前之物偏倒想不起来了，真可谓‘一字师’了。|“该死，该死！现成的东西就在眼前，偏偏想不起来，你真可以说是我的‘一字之师’了。
从此后我只叫你师父，再不叫姐姐了。”|从今以后我只叫你师父，再不叫姐姐了。”
宝钗亦悄悄的笑道：“还不快作上去，只管姐姐妹妹的。|宝钗也悄悄笑道：“还不快写上去，只管姐姐妹妹的。
谁是你姐姐？那上头穿黄袍的才是你姐姐，你又认我这姐姐来了。”|谁是你姐姐？上面那个穿黄袍的才是你姐姐，你又来认我这个姐姐了。”
一面说笑，因说笑又怕他耽延工夫，遂抽身走开了。|一边说笑，又怕说笑耽误他的工夫，就抽身走开了。
宝玉只得续成，共有了三首。|宝玉只好接着写完，一共有了三首。
! 宝钗心细如发，元春一个字的好恶她都记着。她处处替宝玉着想，又处处守着分寸。
! “那上头穿黄袍的才是你姐姐”：宝钗的这句玩笑，提醒宝玉君臣之分。宝钗最懂“礼”。

# 二十五、黛玉代笔
此时林黛玉未得展其抱负，自是不快。|这时林黛玉没能施展抱负，自然不高兴。
因见宝玉独作四律，大费神思，何不代他作两首，也省他些精神不到之处。|她见宝玉一个人要作四首律诗，很费心思，心想何不替他作两首，也省得他精神顾不过来。
想著，便也走至宝玉案旁，悄问：“可都有了？”|想着，就也走到宝玉桌旁，悄悄问：“都有了吗？”
宝玉道：“才有了三首，只少‘杏帘在望’一首了。”|宝玉说：“才有了三首，只差‘杏帘在望’一首了。”
黛玉道：“既如此，你只抄录前三首罢。赶你写完那三首，我也替你作出这首了。”|黛玉说：“既然这样，你只管抄前三首吧。等你写完那三首，我也替你作好这一首了。”
说毕，低头一想，早已吟成一律，便写在纸条上，搓成个团子，掷在他跟前。|说完，低头一想，就已经吟成了一首律诗，写在纸条上，搓成一个纸团，扔到他跟前。
宝玉打开一看，只觉此首比自己所作的三首高过十倍，真是喜出望外，遂忙恭楷呈上。|宝玉打开一看，只觉得这一首比自己作的三首高出十倍，真是喜出望外，就连忙用工整的楷书抄好呈上去。
贾妃看道：|贾妃看到：
! 宝钗帮宝玉改了一个字，黛玉帮宝玉写了一整首诗。两人都在帮他，方式全然不同：一个谨慎周到，一个才气纵横、不管规矩。
! 黛玉的诗搓成纸团扔过去，这份“作弊”的胆子，宝钗是绝不会有的。

# 二十六、宝玉的四首诗
有凤来仪　臣宝玉谨题|《有凤来仪》，臣宝玉恭谨题写
~秀玉初成实，堪宜待凤凰。|秀美如玉的竹子刚结了竹实，正好等待凤凰来吃。
~竿竿青欲滴，个个绿生凉。|一竿竿青翠欲滴，一片片竹叶透着凉意。
~迸砌妨阶水，穿帘碍鼎香。|竹笋冒出石砌，挡住了阶前的流水；竹影穿过帘子，拦住了鼎中的香烟。
~莫摇清碎影，好梦昼初长。|别摇动这清疏细碎的竹影，好让白天的美梦长一些。
蘅芷清芬|《蘅芷清芬》
~蘅芜满净苑，萝薜助芬芳。|蘅芜长满了清净的院落，藤萝薜荔又添上芬芳。
~软衬三春草，柔拖一缕香。|柔软地衬托着春天的芳草，轻柔地拖曳着一缕清香。
~轻烟迷曲径，冷翠滴回廊。|轻烟笼罩着曲折的小路，清冷的翠色滴落在回廊上。
~谁谓池塘曲，谢家幽梦长。|谁说只有“池塘生春草”的诗句好，谢家的幽梦更悠长。
怡红快绿|《怡红快绿》
~深庭长日静，两两出婵娟。|深深的庭院里，长日寂静，两两相对开出美好的花木。
~绿蜡春犹卷，红妆夜未眠。|芭蕉像绿蜡烛，春天里还卷着；海棠像红妆的美人，夜里还没有睡。
~凭栏垂绛袖，倚石护青烟。|海棠像靠着栏杆垂下红袖的女子，芭蕉像倚着山石护着青烟。
~对立东风里，主人应解怜。|它们并立在东风里，主人应该懂得怜爱。
杏帘在望|《杏帘在望》（黛玉代作）
~杏帘招客饮，在望有山庄。|杏花丛中的酒帘招呼客人来饮酒，远远望去有一座山庄。
~菱荇鹅儿水，桑榆燕子梁。|鹅在长着菱荇的水中游，燕子在桑榆掩映的屋梁上筑巢。
~一畦春韭绿，十里稻花香。|一畦春韭碧绿，十里稻花飘香。
~盛世无饥馁，何须耕织忙。|太平盛世没有饥饿，何必再为耕田织布忙碌。
! “莫摇清碎影，好梦昼初长”写潇湘馆，宝玉写的仿佛就是黛玉在竹影里午睡。
! “谢家幽梦”用南朝谢灵运梦见族弟写出“池塘生春草”的典故。
! 黛玉代写的一首，末句颂圣，却写得自然不做作，所以元春最喜欢。

# 二十七、稻香村定名
贾妃看毕，喜之不尽，说：“果然进益了！”|贾妃看完，欢喜不已，说：“果然长进了！”
又指“杏帘”一首为前三首之冠，遂将“浣葛山庄”改为“稻香村”。|又指着“杏帘”一首说是这几首里最好的，就把“浣葛山庄”改成了“稻香村”。
又命探春另以彩笺誊录出方才一共十数首诗，出令太监传与外厢。|又叫探春用彩色信笺把刚才一共十几首诗另外抄出来，叫太监传到外面。
贾政等看了，都称颂不已。|贾政等人看了，都称赞不已。
贾政又进《归省颂》。|贾政又献上了一篇《归省颂》。
元春又命以琼酥金脍等物，赐与宝玉并贾兰。|元春又叫人拿琼酥金脍等食物，赏给宝玉和贾兰。
此时贾兰极幼，未达诸事，只不过随母依叔行礼，故无别传。|这时贾兰还很小，不懂事，只不过跟着母亲和叔叔行礼，所以没什么可写的。
贾环从年内染病未痊，自有闲处调养，故亦无传。|贾环从年前就病了，还没好，另外在一个地方调养，所以也没写他。
! 元春最欣赏的一首，偏偏是黛玉写的。“稻香村”这个名字也是宝玉在上一回提过、被贾政骂过的。
! 元春叫探春抄诗，可见她看出了探春的才干。
! 贾环“染病”没来，这样的大日子缺席，是庶出儿子的处境。

# 二十八、演戏，龄官
那时贾蔷带领十二个女戏，在楼下正等的不耐烦，只见一太监飞来说：“作完了诗，快拿戏目来！”|那时贾蔷带着十二个女戏子在楼下正等得不耐烦，只见一个太监飞跑过来说：“诗作完了，快拿戏单来！”
贾蔷急将锦册呈上，并十二个花名单子。|贾蔷急忙把锦缎封面的戏目和十二个人的花名单子呈上去。
少时，太监出来，只点了四出戏：|不一会儿，太监出来，只点了四出戏：
第一出，《豪宴》，第二出，《乞巧》，第三出，《仙缘》，第四出，《离魂》。|第一出《豪宴》，第二出《乞巧》，第三出《仙缘》，第四出《离魂》。
贾蔷忙张罗扮演起来。|贾蔷连忙张罗着扮演起来。
一个个歌欺裂石之音，舞有天魔之态。|一个个唱得声音响亮能裂开石头，舞起来像天上的魔女一样曼妙。
虽是妆演的形容，却作尽悲欢情状。|虽然是装扮出来的样子，却把悲欢离合都演尽了。
刚演完了，一太监执一金盘糕点之属进来，问：“谁是龄官？”|刚演完，一个太监端着一金盘糕点之类进来，问：“谁是龄官？”
贾蔷便知是赐龄官之物，喜的忙接了，命龄官叩头。|贾蔷就知道是赏给龄官的东西，高兴地连忙接过来，叫龄官磕头。
太监又道：“贵妃有谕，说‘龄官极好，再作两出戏，不拘那两出就是了’。”|太监又说：“贵妃有话，说‘龄官演得极好，再演两出戏，随便哪两出都行’。”
贾蔷忙答应了，因命龄官作《游园》《惊梦》二出。|贾蔷连忙答应了，就叫龄官演《游园》《惊梦》两出。
龄官自为此二出原非本角之戏，执意不作，定要作《相约》《相骂》二出。|龄官认为这两出不是自己本行的戏，坚决不演，一定要演《相约》《相骂》两出。
贾蔷扭他不过，只得依他作了。|贾蔷拗不过她，只好依她演了。
贾妃甚喜，命“不可难为了这女孩子，好生教习”，|贾妃非常高兴，吩咐“不要为难这个女孩子，好好教她”，
额外赏了两匹宫缎，两个荷包并金银锞子，食物之类。|另外又赏了两匹宫缎、两个荷包和金银锞子、食物之类。
! 脂批说这四出戏各有所指：《豪宴》伏贾家之败，《乞巧》伏元春之死，《仙缘》伏甄宝玉送玉，《离魂》伏黛玉之死。省亲的热闹里，全是不祥之兆。
! 《乞巧》出自《长生殿》，唐明皇和杨贵妃七夕盟誓，结局是贵妃在马嵬坡被缢死。元春自己点了这出戏。
! 龄官连贵妃面前也敢“执意不作”，是个有骨气的女孩子。第三十回她在蔷薇架下一遍遍画“蔷”字，第三十六回宝玉才知道她心里只有贾蔷。

# 二十九、苦海慈航
然后撤筵，将未到之处复又游顽。|然后撤了筵席，把没到过的地方又游玩了一遍。
忽见山环佛寺，忙另盥手进去焚香拜佛，又题一匾云：“苦海慈航”。|忽然看见山环抱着一座佛寺，连忙另外洗了手进去烧香拜佛，又题了一个匾额：“苦海慈航”。
又额外加恩与一般幽尼女道。|又额外施恩给寺里的尼姑和女道士。
! 在最繁华的一夜，元春题了“苦海慈航”四个字。她把富贵看作“苦海”，这里就是后来妙玉的栊翠庵。

# 三十、元春的赏赐
少时，太监跪启：“赐物俱齐，请验等例。”乃呈上略节。|不一会儿，太监跪着回禀：“赏赐的东西都齐了，请查验等级。”就呈上一份清单。
贾妃从头看了，俱甚妥协，即命照此遵行。|贾妃从头看了，都很妥当，就叫照着办。
太监听了，下来一一发放。|太监听了，下去一一发放。
原来贾母的是金、玉如意各一柄，沉香拐拄一根，伽楠念珠一串，|原来给贾母的是金如意、玉如意各一柄，沉香拐杖一根，伽楠香念珠一串，
“富贵长春”宫缎四匹，“福寿绵长”宫绸四匹，紫金“笔锭如意”锞十锭，“吉庆有鱼”银锞十锭。|“富贵长春”宫缎四匹，“福寿绵长”宫绸四匹，紫金“笔锭如意”锞子十锭，“吉庆有鱼”银锞子十锭。
邢夫人、王夫人二分，只减了如意，拐，珠四样。|邢夫人、王夫人两份，只少了如意、拐杖、念珠四样。
贾敬、贾赦、贾政等，每分御制新书二部，宝墨二匣，金、银爵各二只，表礼按前。|贾敬、贾赦、贾政等人，每人一份皇上御制的新书两部，好墨两盒，金杯、银杯各两只，衣料礼物照前面的例。
宝钗，黛玉诸姊妹等，每人新书一部，宝砚一方，新样格式金银锞二对。|宝钗、黛玉等姐妹，每人新书一部，好砚台一方，新样式的金银锞子两对。
宝玉亦同此。|宝玉也和她们一样。
贾兰则是金银项圈二个，金银锞二对。|贾兰是金银项圈两个，金银锞子两对。
尤氏、李纨、凤姐等，皆金银锞四锭，表礼四端。|尤氏、李纨、凤姐等人，都是金银锞子四锭，衣料四匹。
外表礼二十四端，清钱一百串，是赐与贾母，王夫人及诸姊妹房中奶娘众丫鬟的。|另外衣料二十四匹、铜钱一百串，是赏给贾母、王夫人和各位姐妹房里的奶妈丫鬟们的。
贾珍、贾琏、贾环、贾蓉等，皆是表礼一分，金锞一双。|贾珍、贾琏、贾环、贾蓉等人，都是衣料一份，金锞子一对。
其馀彩缎百端，金银千两，御酒华筵，是赐东西两府凡园中管理工程、陈设、答应及司戏、掌灯诸人的。|其余彩缎一百匹、金银一千两，还有御酒和丰盛的筵席，是赏给东西两府所有在园子里管工程、管陈设、伺候差事以及管戏、管灯的人的。
外有清钱五百串，是赐厨役、优怜、百戏、杂行人丁的。|另外有铜钱五百串，是赏给厨子、戏子、杂耍艺人和各种杂役的。
! 这张清单写得一丝不苟，人人有份，层层分明。贾府的等级秩序，在这份赏赐里看得一清二楚。
! 宝玉和姐妹们一样，可见元春把他当孩子看。

# 三十一、回銮
众人谢恩已毕，执事太监启道：“时已丑正三刻，请驾回銮。”|众人谢完恩，管事的太监回禀：“已经丑正三刻（凌晨两点四十五分）了，请驾回宫。”
贾妃听了，不由的满眼又滚下泪来。|贾妃听了，不由得眼泪又滚了下来。
却又勉强堆笑，拉住贾母，王夫人的手，紧紧的不忍释放，再四叮咛：|却又勉强堆起笑容，拉住贾母、王夫人的手，紧紧地舍不得放开，再三叮嘱：
“不须挂念，好生自养。|“不要挂念我，好好保重自己。
如今天恩浩荡，一月许进内省视一次，见面是尽有的，何必伤惨。|如今皇恩浩荡，一个月准许进宫探望一次，见面的机会多着呢，何必伤心。
倘明岁天恩仍许归省，万不可如此奢华靡费了！”|要是明年皇上还准许回家省亲，千万不要这样奢华浪费了！”
贾母等已哭的哽噎难言了。|贾母等人已经哭得说不出话来了。
贾妃虽不忍别，怎奈皇家规范，违错不得，只得忍心上舆去了。|贾妃虽然舍不得分别，可皇家的规矩违背不得，只好狠下心上轿走了。
这里诸人好容易将贾母，王夫人安慰解劝，方才扶出园门进上房去了。|这边众人好不容易把贾母、王夫人劝住，才扶着她们出了园门回上房去了。
要知端的，且看下回。|要知后事如何，请看下回。
! 晚上七点以后才来，凌晨两点多就走，整个省亲不过几个时辰。为了这几个时辰，贾家盖了一座三里半的园子。
! 元春第三次叮嘱“不可奢华”。可是“明岁”再也没有来过，这是元春唯一一次回家。
! 后来元春把大观园让给姐妹们和宝玉住（第二十三回），这座为她一夜而造的园子，才有了真正的主人。
