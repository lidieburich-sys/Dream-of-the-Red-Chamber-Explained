# 一、题诗
题曰：|题诗说：
~朝叩富儿门，富儿犹未足。|一早去敲富人家的门，富人自己还嫌不够呢。
~虽无千金酬，嗟彼胜骨肉。|虽然没有得到千金的报答，可叹那份情义比亲骨肉还强。
! 题诗说的是刘姥姥：穷人上门求助，得到的不多，却记了一辈子的恩。后来贾府败落，正是她救了巧姐。

# 二、梦醒之后
却说秦氏因听见宝玉从梦中唤他的乳名，心中自是纳闷，又不好细问。|秦氏听见宝玉在梦里叫她的小名，心里当然纳闷，可又不好细问。
彼时宝玉迷迷惑惑，若有所失。|那时宝玉迷迷糊糊，好像丢了什么东西似的。
众人忙端上桂圆汤来，呷了两口，遂起身整衣。|大家忙端上桂圆汤，他喝了两口，就起身整理衣服。
袭人伸手与他系裤带时，不觉伸手至大腿处，只觉冰凉一片沾湿，唬的忙退出手来，问是怎么了。|袭人帮他系裤带时，发觉他的衣裤湿了，吓得赶紧缩回手，问他是怎么了。
宝玉红涨了脸，把他的手一捻。|宝玉涨红了脸，捏了一下她的手。
袭人本是个聪明女子，年纪本又比宝玉大两岁，近来也渐通人事，今见宝玉如此光景，心中便觉察一半了，不觉也羞的红涨了脸面，不敢再问。|袭人是个聪明的女孩子，又比宝玉大两岁，近来也渐渐懂事了，看宝玉这样子，心里就明白了一半，不由得也羞红了脸，不敢再问。
仍旧理好衣裳，遂至贾母处来，胡乱吃毕了晚饭，过这边来。|她仍旧替他理好衣服，就一起回到贾母那里，随便吃了晚饭，回到宝玉这边来。
袭人忙趁众奶娘丫鬟不在旁时，另取出一件中衣来与宝玉换上。|袭人趁奶妈丫鬟们不在旁边，赶紧另拿一件内衣给宝玉换上。
宝玉含羞央告道：“好姐姐，千万别告诉人。”|宝玉害羞地求她：“好姐姐，千万别告诉别人。”
袭人亦含羞笑问道：“你梦见什么故事了？是那里流出来的那些脏东西？”|袭人也害羞地笑着问：“你梦见什么了？弄脏成这样？”
宝玉道：“一言难尽。”|宝玉说：“一言难尽。”
说著便把梦中之事细说与袭人听了。|说着就把梦里的事都告诉了袭人。
然后说至警幻所授云雨之情，羞的袭人掩面伏身而笑。|说到警幻教他的男女之事，袭人羞得捂着脸趴着笑。
宝玉亦素喜袭人柔媚娇俏，遂强袭人同领警幻所训云雨之事。|宝玉一向喜欢袭人温柔可爱，就硬要和袭人一起照警幻教的去做。
袭人素知贾母已将自己与了宝玉的，今便如此，亦不为越礼，遂和宝玉偷试一番，幸得无人撞见。|袭人知道贾母已经把自己给了宝玉，觉得这样也不算越礼，两人就偷偷有了这层关系，幸好没被人撞见。
自此宝玉视袭人更比别个不同，袭人待宝玉更为尽心。|从此宝玉对袭人跟对别人更不一样，袭人对宝玉也更加尽心。
暂且别无话说。|暂且没有别的话。
! 这一段写宝玉进入青春期。袭人是贾母指给宝玉的丫鬟，按当时大户人家的规矩，这类丫鬟往往将来要做妾，所以她觉得“不为越礼”。
! 从此袭人在宝玉身边的地位就不同了，这也是她后来一心要劝宝玉“学好”的缘故。

# 三、从“芥豆之微”说起
按荣府中一宅人合算起来，人口虽不多，从上至下也有三四百丁，虽事不多，一天也有一二十件，竟如乱麻一般，并无个头绪可作纲领。|荣府一家人算起来，人口虽然不算多，从主子到下人也有三四百口；事情虽然不算多，一天也有一二十件，像一团乱麻，找不到个头绪。
正寻思从那一件事自那一个人写起方妙，恰好忽从千里之外，芥豆之微，小小一个人家，因与荣府略有些瓜葛，这日正往荣府中来，因此便就此一家说来，倒还是头绪。|正想着从哪件事、哪个人写起才好，恰好从千里之外，有一户像芥菜籽、豆粒一样微小的人家，因为跟荣府沾点关系，这天正往荣府来，那就从这一家说起，倒也是个头绪。
你道这一家姓甚名谁，又与荣府有甚瓜葛？|你说这一家姓什么、叫什么，跟荣府又有什么关系？
诸公若嫌琐碎粗鄙呢，则快掷下此书，另觅好书去醒目；若谓聊可破闷时，待蠢物逐细言来。|各位要是嫌琐碎粗俗，就赶快扔下这本书，另找好书去看；要是觉得还能解解闷，就听我这蠢东西慢慢道来。
! 作者故意从一个最不起眼的穷亲戚写起，借她的眼睛看荣府。“蠢物”是石头的自称。

# 四、王狗儿一家
方才所说的这小小之家，乃本地人氏，姓王，祖上曾作过小小的一个京官，昔年与凤姐之祖王夫人之父认识。|刚才说的这户小人家，是本地人，姓王，祖上做过一个小小的京官，当年认识凤姐的祖父、也就是王夫人的父亲。
因贪王家的势利，便连了宗认作侄儿。|因为贪图王家的权势，就跟王家连了宗，认作侄子。
那时只有王夫人之大兄凤姐之父与王夫人随在京中的，知有此一门连宗之族，馀者皆不认识。|那时只有王夫人的大哥（凤姐的父亲）和王夫人跟着在京城，知道有这么一门连宗的亲戚，别人都不认识。
目今其祖已故，只有一个儿子，名唤王成，因家业萧条，仍搬出城外原乡中住去了。|现在这家的祖上已经去世，只有一个儿子叫王成，因为家道败落，又搬回城外老家住了。
王成新近亦因病故，只有其子，小名狗儿。|王成最近也病死了，只有个儿子，小名狗儿。
狗儿亦生一子，小名板儿，嫡妻刘氏，又生一女，名唤青儿。|狗儿也生了个儿子，小名板儿；妻子刘氏，又生了个女儿，叫青儿。
一家四口，仍以务农为业。|一家四口，靠种地过日子。
因狗儿白日间又作些生计，刘氏又操井臼等事，青板姊妹两个无人看管，狗儿遂将岳母刘姥姥接来一处过活。|狗儿白天还要做些别的营生，刘氏又要打水舂米操持家务，青儿板儿姐弟俩没人照看，狗儿就把岳母刘姥姥接来一起过。
这刘姥姥乃是个积年的老寡妇，膝下又无儿女，只靠两亩薄田度日。|这刘姥姥守寡多年，没有儿子，只靠两亩薄田过日子。
今者女婿接来养活，岂不愿意，遂一心一计，帮趁著女儿女婿过活起来。|现在女婿接她来养老，哪有不愿意的，就一心一意帮着女儿女婿过日子。
! 王狗儿家跟王家只是“连宗”，并无血缘。四大家族的势力，连这样的远亲都想攀。

# 五、刘姥姥出主意
因这年秋尽冬初，天气冷将上来，家中冬事未办，狗儿未免心中烦虑，吃了几杯闷酒，在家闲寻气恼，刘氏也不敢顶撞。|这一年秋末冬初，天气冷起来了，家里过冬的东西还没准备，狗儿心里烦，喝了几杯闷酒，在家里找茬发脾气，刘氏也不敢顶嘴。
因此刘姥姥看不过，乃劝道：“姑爷，你别嗔著我多嘴。|刘姥姥看不下去，就劝他：“姑爷，你别怪我多嘴。
咱们村庄人，那一个不是老老诚诚的，守多大碗儿吃多大的饭。|咱们庄稼人，哪个不是老老实实的，有多大的碗就吃多少饭。
你皆因年小的时候，托著你那老家之福，吃喝惯了，如今所以把持不住。|你是因为小时候托你家老辈的福，吃喝惯了，所以现在管不住自己。
有了钱就顾头不顾尾，没了钱就瞎生气，成个什么男子汉大丈夫呢！|有了钱就顾头不顾尾，没了钱就瞎生气，这算什么男子汉大丈夫！
如今咱们虽离城住著，终是天子脚下。|咱们现在虽然住得离城远，到底还是在天子脚下。
这长安城中，遍地都是钱，只可惜没人会去拿去罢了。|这京城里遍地是钱，只可惜没人会去拿罢了。
在家跳蹋会子也不中用。”|在家里跳脚也没用。”
狗儿听说，便急道：“你老只会炕头儿上混说，难道叫我打劫偷去不成？”|狗儿听了急道：“您老只会坐在炕头上瞎说，难道叫我去抢去偷不成？”
刘姥姥道：“谁叫你偷去呢。|刘姥姥说：“谁叫你去偷了。
也到底想法儿大家裁度，不然那银子钱自己跑到咱家来不成？”|总得想个办法大家商量商量，不然银子钱会自己跑到咱家来吗？”
狗儿冷笑道：“有法儿还等到这会子呢。|狗儿冷笑道：“有办法还等到现在？
我又没有收税的亲戚，作官的朋友，有什么法子可想的？|我又没有收税的亲戚、当官的朋友，能有什么办法？
便有，也只怕他们未必来理我们呢！”|就算有，只怕人家也不一定理我们！”
刘姥姥道：“这倒不然。|刘姥姥说：“这倒不一定。
谋事在人，成事在天。|谋事在人，成事在天。
咱们谋到了，看菩萨的保佑，有些机会，也未可知。|咱们先想办法，再看菩萨保佑，说不定有机会。
我倒替你们想出一个机会来。|我倒替你们想出一个门路来。
当日你们原是和金陵王家连过宗的，二十年前，他们看承你们还好，如今自然是你们拉硬屎，不肯去亲近他，故疏远起来。|当年你们家跟金陵王家连过宗，二十年前，他们待你们还不错，现在是你们自己死要面子，不肯去亲近，才疏远了。
想当初我和女儿还去过一遭。|想当初我和女儿还去过一回。
他们家的二小姐著实响快，会待人，倒不拿大。|他们家的二小姐真是爽快，会待人，一点架子都没有。
如今现是荣国府贾二老爷的夫人。|如今就是荣国府贾二老爷的夫人。
听得说，如今上了年纪，越发怜贫恤老，最爱斋僧敬道，舍米舍钱的。|听说她现在上了年纪，越发怜惜穷人老人，最喜欢施舍和尚道士，舍米舍钱。
如今王府虽升了边任，只怕这二姑太太还认得咱们。|现在王家老爷虽然升官去了边疆，只怕这位二姑太太还认得咱们。
你何不去走动走动，或者他念旧，有些好处，也未可知。|你何不去走动走动，也许她念旧情，能给些好处。
要是他发一点好心，拔一根寒毛比咱们的腰还粗呢。”|要是她发一点善心，拔根汗毛都比咱们的腰还粗呢。”
刘氏一旁接口道：“你老虽说的是，但只你我这样个嘴脸，怎样好到他门上去的。|刘氏在一旁接话：“您老说得虽然对，可就凭咱们这副模样，怎么好意思到人家门上去。
先不先，他们那些门上的人也未必肯去通信。|先不说别的，他们那些看门的也未必肯给咱们通报。
没的去打嘴现世。”|别去自讨没趣、丢人现眼。”
! 刘姥姥是全书最会说话的人之一，一番话先骂女婿，再给他台阶，最后指出一条路。
! “拔一根寒毛比咱们的腰还粗”，后面她见了凤姐又说了一遍，可见是她心里最实在的一句话。

# 六、刘姥姥决定亲自去
谁知狗儿利名心最重，听如此一说，心下便有些活动起来。|没想到狗儿最贪名利，听这么一说，心里就有点动了。
又听他妻子这话，便笑接道：“姥姥既如此说，况且当年你又见过这姑太太一次，何不你老人家明日就走一趟，先试试风头再说。”|又听见妻子这样说，就笑着接话：“姥姥既然这么说，而且当年您又见过这位姑太太一次，何不明天您老人家就去走一趟，先探探口风再说。”
刘姥姥道：“嗳哟哟！|刘姥姥说：“哎哟哟！
可是说的，‘侯门深似海’，我是个什么东西，他家人又不认得我，我去了也是白去的。”|俗话说‘侯门深似海’，我算个什么东西，他家的人又不认识我，我去了也是白去。”
狗儿笑道：“不妨，我教你老人家一个法子：你竟带了外孙子板儿，先去找陪房周瑞，若见了他，就有些意思了。|狗儿笑道：“不要紧，我教您老人家一个办法：您带上外孙板儿，先去找王夫人的陪房周瑞，要是见着了他，就有点门路了。
这周瑞先时曾和我父亲交过一件事，我们极好的。”|这周瑞以前和我父亲打过交道，关系很好。”
刘姥姥道：“我也知道他的。|刘姥姥说：“我也知道他。
只是许多时不走动，知道他如今是怎样。|只是好久没来往了，谁知道他现在怎么样。
这也说不得了，你又是个男人，又这样个嘴脸，自然去不得，我们姑娘年轻媳妇子，也难卖头卖脚的，倒还是舍著我这付老脸去碰一碰。|这也没办法了。你是个男人，又是这副模样，当然去不得；我女儿是年轻媳妇，也不好抛头露面，还是我豁出这张老脸去碰碰运气。
果然有些好处，大家都有益，便是没银子来，我也到那公府侯门见一见世面，也不枉我一生。”|要是真有好处，大家都沾光；就算拿不到银子，我也到那公侯府第见见世面，也不枉活这一辈子。”
说毕，大家笑了一回。|说完，大家笑了一阵。
当晚计议已定。|当天晚上就商量定了。
! 出主意的是刘姥姥，派她去的却是狗儿。她一句“舍著我这付老脸”，又硬气又心酸。
! “陪房”是跟着小姐出嫁到夫家的仆人。周瑞夫妇是王夫人从娘家带来的。

# 七、荣府门前
次日天未明，刘姥姥便起来梳洗了，又将板儿教训了几句。|第二天天还没亮，刘姥姥就起来梳洗好了，又教了板儿几句话。
那板儿才五六岁的孩子，一无所知，听见刘姥姥带他进城逛去，便喜的无不应承。|板儿才五六岁，什么也不懂，听说姥姥带他进城玩，高兴得什么都答应。
于是刘姥姥带他进城，找至宁荣街。|于是刘姥姥带他进了城，找到宁荣街。
来至荣府大门石狮子前，只见簇簇轿马，刘姥姥便不敢过去，且掸了掸衣服，又教了板儿几句话，然后蹭到角门前。|来到荣府大门的石狮子前，只见一簇簇的轿子马匹，刘姥姥不敢过去，先掸了掸衣服，又教了板儿几句话，然后慢慢挪到角门前。
只见几个挺胸叠肚指手画脚的人，坐在大板凳上，说东谈西呢。|只见几个挺着胸、腆着肚子、指手画脚的人，坐在大板凳上聊天。
刘姥姥只得蹭上来问：“太爷们纳福。”|刘姥姥只好挪上前问：“太爷们好福气。”
众人打量了他一会，便问”那里来的？”|那些人打量了她一会儿，问：“哪儿来的？”
刘姥姥陪笑道：“我找太太的陪房周大爷的，烦那位太爷替我请他老出来。”|刘姥姥赔着笑说：“我找太太的陪房周大爷，麻烦哪位太爷替我请他出来。”
那些人听了，都不瞅睬，半日方说道：“你远远的在那墙角下等著，一会子他们家有人就出来的。”|那些人听了都不理她，过了半天才说：“你远远地到那墙角下等着，一会儿他们家有人就出来了。”
内中有一老年人说道：“不要误他的事，何苦耍他。”|里面有个老年人说：“别误了她的事，何必耍她。”
因向刘姥姥道：“那周大爷已往南边去了。|于是对刘姥姥说：“那周大爷已经到南边去了。
他在后一带住著，他娘子却在家。|他家住在后面那一带，他媳妇倒在家。
你要找时，从这边绕到后街上后门上去问就是了。”|你要找，就从这边绕到后街，到后门去问就是了。”
! 门房都“挺胸叠肚”，叫他们一声“太爷”，他们还耍弄人。荣府的势派，从看门的就看得出来。

# 八、找到周瑞家的
刘姥姥听了谢过，遂携了板儿，绕到后门上。|刘姥姥听了，道过谢，就拉着板儿绕到后门。
只见门前歇著些生意担子，也有卖吃的，也有卖顽耍物件的，闹吵吵三二十个小孩子在那里厮闹。|只见门前歇着一些做买卖的担子，有卖吃的，有卖玩具的，二三十个小孩在那儿吵吵闹闹。
刘姥姥便拉住一个道：“我问哥儿一声，有个周大娘可在家么？”|刘姥姥拉住一个问：“小哥，我问你一声，有个周大娘在家吗？”
孩子们道：“那个周大娘？|孩子们说：“哪个周大娘？
我们这里周大娘有三个呢，还有两个周奶奶，不知是那一行当的？”|我们这儿周大娘有三个，还有两个周奶奶，不知道你找干哪一行的？”
刘姥姥道：“是太太的陪房周瑞。”|刘姥姥说：“是太太的陪房周瑞。”
孩子道：“这个容易，你跟我来。”|孩子说：“这个好办，你跟我来。”
说著，跳蹿蹿的引著刘姥姥进了后门，至一院墙边，指与刘姥姥道：“这就是他家。”|说着，蹦蹦跳跳地领刘姥姥进了后门，到一个院墙边，指给她看：“这就是她家。”
又叫道：“周大娘，有个老奶奶来找你呢，我带了来了。”|又喊：“周大娘，有个老奶奶来找你，我把她带来了。”
周瑞家的在内听说，忙迎了出来，问：“是那位？”|周瑞家的在里面听见，忙迎出来问：“是哪位？”
刘姥姥忙迎上来问道：“好呀，周嫂子！”|刘姥姥忙迎上去说：“您好呀，周嫂子！”
周瑞家的认了半日，方笑道：“刘姥姥，你好呀！|周瑞家的认了半天，才笑道：“刘姥姥，您好呀！
你说说，能几年，我就忘了。|您说说，才几年，我就忘了。
请家里来坐罢。”|请到家里坐吧。”
刘姥姥一壁里走著，一壁笑说道：“你老是贵人多忘事，那里还记得我们呢。”|刘姥姥一边走，一边笑着说：“您老是贵人多忘事，哪还记得我们。”
说著，来至房中。|说着进了屋。
周瑞家的命雇的小丫头倒上茶来吃著。|周瑞家的叫雇来的小丫头倒茶来喝。
周瑞家的又问板儿道：“你都长这们大了！”|周瑞家的又对板儿说：“你都长这么大了！”
又问些别后闲话。|又聊了些分别以后的家常。
又问刘姥姥：“今日还是路过，还是特来的？”|又问刘姥姥：“今天是路过，还是专门来的？”
刘姥姥便说：“原是特来瞧瞧嫂子你，二则也请请姑太太的安。|刘姥姥说：“本来是专门来看看嫂子你，二来也给姑太太请个安。
若可以领我见一见更好，若不能，便借重嫂子转致意罢了。”|要是能领我见一见就更好，要是不能，就麻烦嫂子替我转达一下心意。”
! 后门外的小孩一句“周大娘有三个呢”，写出荣府仆人之多。连仆人家都还雇了“小丫头”。

# 九、周瑞家的卖个面子
周瑞家的听了，便已猜著几分来意。|周瑞家的一听，就猜到了几分来意。
只因昔年他丈夫周瑞争买田地一事，其中多得狗儿之力，今见刘姥姥如此而来，心中难却其意，二则也要显弄自己的体面。|当年她丈夫周瑞跟人争买田地，多亏狗儿出了力，现在刘姥姥这样上门来，她心里不好推辞；二来也想显摆显摆自己的体面。
听如此说，便笑说道：“姥姥你放心。|听她这么说，就笑道：“姥姥您放心。
大远的诚心诚意来了，岂有个不教你见个真佛去的呢。|大老远诚心诚意地来了，哪有不让您见见真佛的道理。
论理，人来客至回话，却不与我相干。|按理说，客人来了通报的事，不归我管。
我们这里都是各占一样儿：我们男的只管春秋两季地租子，闲时只带著小爷们出门子就完了，我只管跟太太奶奶们出门的事。|我们这儿是各管一样：我家男人只管春秋两季收地租，闲了就带着少爷们出门；我只管跟着太太奶奶们出门的事。
皆因你原是太太的亲戚，又拿我当个人，投奔了我来，我就破个例，给你通个信去。|因为您是太太的亲戚，又看得起我，来投奔我，我就破个例，给您通报一声。
但只一件，姥姥有所不知，我们这里又不比五年前了。|只是有一件，姥姥您不知道，我们这儿跟五年前不一样了。
如今太太竟不大管事，都是琏二奶奶管家了。|现在太太不大管事了，都是琏二奶奶当家。
你道这琏二奶奶是谁？|您知道这琏二奶奶是谁？
就是太太的内侄女，当日大舅老爷的女儿，小名凤哥的。”|就是太太的娘家侄女，当年大舅老爷的女儿，小名叫凤哥的那个。”
刘姥姥听了，罕问道：“原来是他！|刘姥姥听了，惊奇地问：“原来是她！
怪道呢，我当日就说他不错呢。|难怪呢，我当年就说她不错。
这等说来，我今儿还得见他了。”|这么说，我今天还得见她了。”
周瑞家的道：“这自然的。|周瑞家的说：“那当然。
如今太太事多心烦，有客来了，略可推得去的就推过去了，都是凤姑娘周旋迎待。|现在太太事多心烦，来了客人，能推的就推了，都是凤姑娘出面招待。
今儿宁可不会太太，倒要见他一面，才不枉这里来一遭。”|今天就算见不着太太，也要见她一面，才不白来一趟。”
刘姥姥道：“阿弥陀佛！|刘姥姥说：“阿弥陀佛！
全仗嫂子方便了。”|全靠嫂子帮忙了。”
周瑞家的道：“说那里话。|周瑞家的说：“说哪里话。
俗语说的：‘与人方便，自己方便。’不过用我说一句话罢了，害著我什么。”|俗话说：‘与人方便，自己方便。’不过是我说句话的事，碍着我什么了。”
说著，便叫小丫头到倒厅上悄悄的打听打听，老太太屋里摆了饭了没有。|说着，就叫小丫头到倒厅那儿悄悄打听打听，老太太屋里开饭了没有。
小丫头去了。|小丫头去了。
这里二人又说些闲话。|这边两人又聊了些闲话。
! 周瑞家的帮忙，一半是还人情，一半是“显弄自己的体面”。作者写人从不只写一面。

# 十、凤姐的本事
刘姥姥因说：“这凤姑娘今年大还不过二十岁罢了，就这等有本事，当这样的家，可是难得的。”|刘姥姥说：“这凤姑娘今年顶多二十岁吧，就这么有本事，当这么大的家，真是难得。”
周瑞家的听了道：“我的姥姥，告诉不得你呢。|周瑞家的听了说：“我的姥姥，跟您说不完呢。
这位凤姑娘年纪虽小，行事却比世人都大呢。|这位凤姑娘年纪虽然小，做起事来比谁都老练。
如今出挑的美人一样的模样儿，少说些有一万个心眼子。|现在长得跟美人一样，少说也有一万个心眼。
再要赌口齿，十个会说话的男人也说他不过。|要是比口才，十个会说话的男人也说不过她。
回头你见了就信了。|一会儿您见了就信了。
就只一件，待下人未免太严些个。”|只有一件，对下人未免太严厉了些。”
说著，只见小丫头回来说：“老太太屋里已摆完了饭了，二奶奶在太太屋里呢。”|正说着，小丫头回来说：“老太太屋里已经吃完饭了，二奶奶在太太屋里呢。”
周瑞家的听了，连忙起身，催著刘姥姥说：“快走，快走。|周瑞家的听了，连忙起身催刘姥姥：“快走，快走。
这一下来他吃饭是个空子，咱们先赶著去。|她下来吃饭这会儿是个空当，咱们赶紧过去。
若迟一步，回事的人也多了，难说话。|要是晚一步，来回事的人多了，就不好说话了。
再歇了中觉，越发没了时候了。”|再等她睡了午觉，就更没时间了。”
! 周瑞家的一句“待下人未免太严”，是凤姐日后众叛亲离的伏笔。

# 十一、平儿
说著一齐下了炕，打扫打扫衣服，又教了板儿几句话，随著周瑞家的，逶迤往贾琏的住处来。|说着两人一起下了炕，拍打拍打衣服，刘姥姥又教了板儿几句话，跟着周瑞家的，弯弯曲曲地往贾琏的住处走去。
先到了倒厅，周瑞家的将刘姥姥安插在那里略等一等。|先到了倒厅，周瑞家的让刘姥姥在那里等一会儿。
自己先过了影壁，进了院门，知凤姐未下来，先找著凤姐的一个心腹通房大丫头名唤平儿的。|自己先绕过影壁进了院门，知道凤姐还没回来，就先找到凤姐的一个心腹大丫头，叫平儿。（通房丫头是主人身边有妾室身份的丫头）
周瑞家的先将刘姥姥起初来历说明，又说：“今日大远的特来请安。|周瑞家的先把刘姥姥的来历说清楚，又说：“她今天大老远专门来请安。
当日太太是常会的，今日不可不见，所以我带了他进来了。|当年太太是常见她的，今天不能不见，所以我把她带进来了。
等奶奶下来，我细细回明，奶奶想也不责备我莽撞的。”|等奶奶回来，我细细禀明，想来奶奶也不会怪我莽撞。”
平儿听了，便作了主意：“叫他们进来，先在这里坐著就是了。”|平儿听了，就做了主：“叫她们进来，先在这里坐着吧。”
周瑞家的听了，方出去引他两个进入院来。|周瑞家的听了，才出去领她们两个进院子。
上了正房台矶，小丫头打起猩红毡帘，才入堂屋，只闻一阵香扑了脸来，竟不辨是何气味，身子如在云端里一般。|上了正房的台阶，小丫头掀起猩红色的毡帘，刚进堂屋，就一阵香气扑面而来，也分不清是什么香，身子像飘在云端里一样。
满屋中之物都耀眼争光的，使人头悬目眩。|满屋子的东西都亮闪闪地晃眼，让人头晕眼花。
刘姥姥此时惟点头咂嘴念佛而已。|刘姥姥这时只会点头、咂嘴、念佛了。
于是来至东边这间屋内，乃是贾琏的女儿大姐儿睡觉之所。|于是来到东边这间屋里，是贾琏的女儿大姐儿睡觉的地方。
平儿站在炕沿边，打量了刘姥姥两眼，只得问个好让坐。|平儿站在炕沿边，打量了刘姥姥两眼，只好问声好，让她坐。
刘姥姥见平儿遍身绫罗，插金带银，花容玉貌的，便当是凤姐儿了。|刘姥姥见平儿满身绫罗绸缎，戴金插银，长得花容月貌，就以为是凤姐了。
才要称姑奶奶，忽见周瑞家的称他是平姑娘，又见平儿赶著周瑞家的称周大娘，方知不过是个有些体面的丫头了。|刚要叫“姑奶奶”，忽然听见周瑞家的叫她“平姑娘”，又听平儿叫周瑞家的“周大娘”，这才知道她不过是个有些体面的丫头。
于是让刘姥姥和板儿上了炕，平儿和周瑞家的对面坐在炕沿上，小丫头子斟了茶来吃茶。|于是让刘姥姥和板儿上了炕，平儿和周瑞家的面对面坐在炕沿上，小丫头倒了茶来喝。
! 刘姥姥把丫头当成了主子，一个丫头的穿戴就让乡下人看傻了眼。这样写，凤姐还没出场，她的排场已经出来了。
! “大姐儿”就是后来的巧姐，判词里那位被刘姥姥救下的“荒村野店”纺绩女子。刘姥姥第一次进府，坐的就是她的屋子。

# 十二、刘姥姥看见自鸣钟
刘姥姥只听见咯当咯当的响声，大有似乎打箩柜筛面的一般，不免东瞧西望的。|刘姥姥只听见“咯当咯当”的响声，很像用箩筐筛面的声音，就不免东张西望。
忽见堂屋中柱子上挂著一个匣子，底下又坠著一个秤砣般一物，却不住的乱幌。|忽然看见堂屋的柱子上挂着一个匣子，下面坠着一个秤砣似的东西，不停地来回晃。
刘姥姥心中想著：“这是什么爱物儿？|刘姥姥心想：“这是什么宝贝？
有甚用呢？”|有什么用呢？”
正呆时，只听得当的一声，又若金钟铜磬一般，不防倒唬的一展眼。|正发呆的时候，忽然“当”的一声，像敲金钟铜磬一样，冷不防吓得她一眨眼。
接著又是一连八九下。|接着又一连响了八九下。
方欲问时，只见小丫头子们齐乱跑，说：“奶奶下来了。”|刚想问，只见小丫头们一齐乱跑，说：“奶奶回来了。”
周瑞家的与平儿忙起身，命刘姥姥“只管等著，是时候我们来请你。”|周瑞家的和平儿忙站起来，叫刘姥姥“只管等着，到时候我们来请你”。
说著，都迎出去了。|说着都迎出去了。
! 那个匣子是西洋自鸣钟。作者不写“钟”字，只写刘姥姥听见什么、看见什么，读起来又好笑又新鲜。

# 十三、等凤姐
刘姥姥屏声侧耳默候。|刘姥姥屏住呼吸，侧着耳朵静静等着。
只听远远有人笑声，约有一二十妇人，衣裙窸窣，渐入堂屋，往那边屋内去了。|只听远远传来笑声，大约有一二十个女人，衣裙窸窸窣窣地响，渐渐进了堂屋，往那边屋里去了。
又见两三个妇人，都捧著大漆捧盒，进这边来等候。|又看见两三个女人，都捧着大漆盒子，进这边来等着。
听得那边说了声“摆饭”，渐渐的人才散出，只有伺候端菜的几个人。|听见那边说了声“摆饭”，人才渐渐散出去，只剩下几个伺候端菜的。
半日鸦雀不闻之后，忽见二人抬了一张炕桌来，放在这边炕上，桌上碗盘森列，仍是满满的鱼肉在内，不过略动了几样。|安静了好半天，忽然看见两个人抬来一张炕桌，放在这边炕上，桌上碗盘摆得满满的，里面的鱼肉还满满的，只稍微动了几样。
板儿一见了，便吵著要肉吃，刘姥姥一巴掌打了他去。|板儿一看见，就吵着要吃肉，刘姥姥一巴掌把他打开了。
忽见周瑞家的笑嘻嘻走过来，招手儿叫他。|忽然看见周瑞家的笑嘻嘻地走过来，招手叫她。
刘姥姥会意，于是带了板儿下炕，至堂屋中，周瑞家的又和他唧咕了一会，方过这边屋里来。|刘姥姥明白了，就带着板儿下了炕，走到堂屋里，周瑞家的又跟她嘀咕了一阵，才领她到这边屋里来。
! 凤姐吃剩的饭菜，在穷人眼里“仍是满满的鱼肉”。板儿要肉吃挨了一巴掌，一个细节写尽了贫富之差。

# 十四、凤姐见刘姥姥
只见门外錾铜钩上悬著大红撒花软帘，南窗下是炕，炕上大红毡条，靠东边板壁立著一个锁子锦靠背与一个引枕，铺著金心绿闪缎大坐褥，旁边有雕漆痰盒。|只见门外錾花铜钩上挂着大红撒花软帘，南窗下是炕，炕上铺着大红毡子，靠东边木板墙立着一个锁子锦靠背和一个靠枕，铺着金心绿闪缎的大坐褥，旁边放着雕漆痰盒。
那凤姐儿家常带著秋板貂鼠昭君套，围著攒珠勒子，穿著桃红撒花袄，石青刻丝灰鼠披风，大红洋绉银鼠皮裙，粉光脂艳，端端正正坐在那里，手内拿著小铜火箸儿拨手炉内的灰。|凤姐平常在家，戴着貂鼠皮的昭君套（一种暖帽），额上围着镶珠的勒子，穿着桃红撒花袄、石青缂丝灰鼠皮披风、大红洋绉银鼠皮裙，脸上搽粉抹胭脂，端端正正坐在那里，手里拿着小铜火筷子拨手炉里的灰。
平儿站在炕沿边，捧著小小的一个填漆茶盘，盘内一个小盖钟。|平儿站在炕沿边，捧着一个小小的填漆茶盘，盘里一个小盖碗。
凤姐也不接茶，也不抬头，只管拨手炉内的灰，慢慢的问道：“怎么还不请进来？”|凤姐也不接茶，也不抬头，只管拨手炉里的灰，慢慢地问：“怎么还不请进来？”
一面说，一面抬身要茶时，只见周瑞家的已带了两个人在地下站著呢。|一边说，一边抬起身来要茶，这才看见周瑞家的已经带着两个人在地上站着了。
这才忙欲起身，犹未起身时，满面春风的问好，又嗔著周瑞家的怎么不早说。|这才忙着要起身，还没站起来，就满脸笑容地问好，又怪周瑞家的怎么不早说。
刘姥姥在地下已是拜了数拜，问姑奶奶安。|刘姥姥在地上已经拜了好几拜，给姑奶奶请安。
凤姐忙说：“周姐姐，快搀起来，别拜罢，请坐。|凤姐忙说：“周姐姐，快扶起来，别拜了，请坐。
我年轻，不大认得，可也不知是什么辈数，不敢称呼。”|我年轻，不大认得，也不知道是什么辈分，不敢称呼。”
周瑞家的忙回道：“这就是我才回的那姥姥了。”|周瑞家的忙回答：“这就是我刚才禀报的那位姥姥。”
凤姐点头。|凤姐点点头。
刘姥姥已在炕沿上坐了。|刘姥姥已经在炕沿上坐下了。
板儿便躲在背后，百般的哄他出来作揖，他死也不肯。|板儿就躲在她背后，怎么哄他出来作揖，他死也不肯。
! 凤姐“也不接茶，也不抬头”，等人站了半天才“满面春风”。这是故意拿架子，冷热之间分寸拿捏得极准。
! 她说“不知是什么辈数，不敢称呼”，其实是不愿认这门穷亲戚。

# 十五、凤姐的客套
凤姐儿笑道：“亲戚们不大走动，都疏远了。|凤姐笑道：“亲戚们不大来往，都疏远了。
知道的呢，说你们弃厌我们，不肯常来，不知道的那起小人，还只当我们眼里没人似的。”|知道的，说是你们嫌弃我们，不肯常来；不知道的那些小人，还以为我们眼里看不起人呢。”
刘姥姥忙念佛道：“我们家道艰难，走不起，来了这里，没的给姑奶奶打嘴，就是管家爷们看著也不象。”|刘姥姥忙念佛说：“我们家日子艰难，走动不起。来这里，别给姑奶奶丢脸，就是管家爷们看着也不像样。”
凤姐儿笑道：“这话没的叫人恶心。|凤姐笑道：“这话说得叫人难受。
不过借赖著祖父虚名，作了穷官儿，谁家有什么，不过是个旧日的空架子。|我们不过是靠着祖上的空名，做了个穷官，谁家又有什么，不过是个旧日的空架子罢了。
俗语说，‘朝廷还有三门子穷亲戚’呢，何况你我。”|俗话说‘皇帝还有三门穷亲戚’呢，何况你我。”
说著，又问周瑞家的回了太太了没有。|说着，又问周瑞家的禀报太太了没有。
周瑞家的道：“如今等奶奶的示下。”|周瑞家的说：“正等奶奶吩咐呢。”
凤姐道：“你去瞧瞧，要是有人有事就罢，得闲儿呢就回，看怎么说。”|凤姐说：“你去看看，要是太太那里有人有事就算了；要是有空，就去禀报，看太太怎么说。”
周瑞家的答应著去了。|周瑞家的答应着去了。
这里凤姐叫人抓些果子与板儿吃，刚问些闲话时，就有家下许多媳妇管事的来回话。|这边凤姐叫人抓些果子给板儿吃，刚说了几句闲话，就有许多管事的媳妇来回事。
平儿回了，凤姐道：“我这里陪客呢，晚上再来回。|平儿来禀报，凤姐说：“我这里陪客呢，晚上再来说。
若有很要紧的，你就带进来现办。”|要是有很要紧的，你就带进来马上办。”
平儿出去了，一会进来说：“我都问了，没什么紧事，我就叫他们散了。”|平儿出去了，一会儿进来说：“我都问过了，没什么要紧事，我就叫她们散了。”
凤姐点头。|凤姐点点头。
! 凤姐嘴上说贾府“不过是个旧日的空架子”，本是客套推辞，却偏偏说中了实情。
! 管事媳妇一拨拨来回话，写的是凤姐当家之忙，也是给刘姥姥看的排场。

# 十六、刘姥姥难开口
只见周瑞家的回来，向凤姐道：“太太说了，今日不得闲，二奶奶陪著便是一样。|只见周瑞家的回来，对凤姐说：“太太说了，今天没空，二奶奶陪着也是一样。
多谢费心想著。|多谢她费心惦记着。
白来逛逛呢便罢，若有甚说的，只管告诉二奶奶，都是一样。”|要是只来逛逛就算了，要是有什么话，只管跟二奶奶说，都是一样的。”
刘姥姥道：“也没甚说的，不过是来瞧瞧姑太太，姑奶奶，也是亲戚们的情分。”|刘姥姥说：“也没什么话，不过是来看看姑太太、姑奶奶，也是亲戚的情分。”
周瑞家的道：“没甚说的便罢，若有话，只管回二奶奶，是和太太一样的。”|周瑞家的说：“没什么话就算了，要是有话，只管跟二奶奶说，跟太太是一样的。”
一面说，一面递眼色与刘姥姥。|一边说，一边给刘姥姥递眼色。
刘姥姥会意，未语先飞红的脸，欲待不说，今日又所为何来？|刘姥姥明白了，还没开口脸先红了。想不说吧，今天又是为什么来的？
只得忍耻说道：“论理今儿初次见姑奶奶，却不该说，只是大远的奔了你老这里来，也少不的说了。”|只好忍着羞说：“按理说，今天头一回见姑奶奶，本不该说，只是大老远地投奔您老人家来，也只好说了。”
刚说到这里，只听二门上小厮们回说：“东府里的小大爷进来了。”|刚说到这里，只听二门上的小厮们通报：“东府的小大爷进来了。”
凤姐忙止刘姥姥：“不必说了。”|凤姐忙拦住刘姥姥：“先别说了。”
一面便问：“你蓉大爷在那里呢？”|一边问：“你们蓉大爷在哪儿呢？”
只听一路靴子脚响，进来了一个十七八岁的少年，面目清秀，身材俊俏，轻裘宝带，美服华冠。|只听一路靴子响，进来一个十七八岁的少年，眉目清秀，身材俊俏，穿着轻暖的皮衣，系着镶宝石的腰带，衣服华美，帽子讲究。
刘姥姥此时坐不是，立不是，藏没处藏。|刘姥姥这时坐也不是，站也不是，想躲又没处躲。
凤姐笑道：“你只管坐著，这是我侄儿。”|凤姐笑道：“你只管坐着，这是我侄儿。”
刘姥姥方扭扭捏捏在炕沿上坐了。|刘姥姥才扭扭捏捏地在炕沿上坐下。
! “未语先飞红的脸”，刘姥姥会说话，可开口求人到底难。作者写她的窘迫，一点不嘲笑。
! 王夫人不见，推给凤姐，又暗示有话只管说。这是大户人家打发穷亲戚的常规。

# 十七、贾蓉借屏风
贾蓉笑道：“我父亲打发我来求婶子，说上回老舅太太给婶子的那架玻璃炕屏，明日请一个要紧的客，借了略摆一摆就送过来。”|贾蓉笑道：“我父亲派我来求婶子，说上回舅太太给婶子的那架玻璃炕屏，明天要请一位要紧的客人，借去摆一摆就送回来。”
凤姐道：“说迟了一日，昨儿已经给了人了。”|凤姐说：“晚说了一天，昨天已经给别人了。”
贾蓉听著，嘻嘻的笑著，在炕沿上半跪道：“婶子若不借，又说我不会说话了，又挨一顿好打呢。|贾蓉听了，嘻嘻笑着，在炕沿上半跪着说：“婶子要是不借，我父亲又要说我不会说话，又要狠狠打我一顿了。
婶子只当可怜侄儿罢。”|婶子就当可怜可怜侄儿吧。”
凤姐笑道：“也没见你们，王家的东西都是好的不成？|凤姐笑道：“真没见过你们这样的，难道王家的东西就都是好的？
你们那里放著那些好东西，只是看不见，偏我的就是好的。”|你们那里放着那么多好东西，偏看不见，就我的是好的。”
贾蓉笑道：“那里有这个好呢！|贾蓉笑道：“哪里有这么好的！
只求开恩罢。”|只求您开开恩吧。”
凤姐道：“若碰一点儿，你可仔细你的皮！”|凤姐说：“要是碰坏一点儿，小心你的皮！”
因命平儿拿了楼房的钥匙，传几个妥当人抬去。|就叫平儿拿楼房的钥匙，叫几个稳妥的人抬去。
贾蓉喜的眉开眼笑，说：“我亲自带了人拿去，别由他们乱碰。”|贾蓉高兴得眉开眼笑，说：“我亲自带人去拿，别让他们乱碰。”
说著便起身出去了。|说着就起身出去了。
这里凤姐忽又想起一事来，便向窗外叫：“蓉哥回来。”|这时凤姐忽然又想起一件事，就朝窗外喊：“蓉哥回来。”
外面几个人接声说：“蓉大爷快回来。”|外面几个人接着喊：“蓉大爷快回来。”
贾蓉忙复身转来，垂手侍立，听何指示。|贾蓉忙转身回来，垂着手站着，听她吩咐。
那凤姐只管慢慢的吃茶，出了半日的神，又笑道：“罢了，你且去罢。|凤姐只管慢慢喝茶，出了半天神，又笑道：“算了，你先去吧。
晚饭后你来再说罢。|晚饭后你再来说吧。
这会子有人，我也没精神了。”|这会儿有人在，我也没精神了。”
贾蓉应了一声，方慢慢的退去。|贾蓉答应一声，才慢慢退出去。
! 凤姐先说“已经给了人”，被求两句就借了，这是她的手段：东西给出去，人情也落下了。
! 叫回贾蓉，出神半天又不说了，“这会子有人”——到底什么事不能当着人说，作者故意留白，不少读者认为这里暗示两人关系不寻常。

# 十八、凤姐给了二十两银子
这里刘姥姥心神方定，才又说道：“今日我带了你侄儿来，也不为别的，只因他老子娘在家里，连吃的都没有。|这时刘姥姥才定下心来，又说：“今天我带你侄儿来，也不为别的，只因为他爹娘在家里连吃的都没有了。
如今天又冷了，越想没个派头儿，只得带了你侄儿奔了你老来。”|现在天又冷了，越想越没个出路，只好带着你侄儿来投奔您老人家。”
说著又推板儿道：“你那爹在家怎么教你来？|说着又推板儿：“你爹在家是怎么教你的？
打发咱们作煞事来？|叫咱们来干什么的？
只顾吃果子咧。”|只顾着吃果子。”
凤姐早已明白了，听他不会说话，因笑止道：“不必说了，我知道了。”|凤姐早就明白了，听她说话不得体，就笑着打断：“不用说了，我知道了。”
因问周瑞家的：“这姥姥不知可用了早饭没有？”|又问周瑞家的：“这位姥姥吃过早饭没有？”
刘姥姥忙说道：“一早就往这里赶咧，那里还有吃饭的工夫咧。”|刘姥姥忙说：“一大早就往这儿赶，哪还有工夫吃饭。”
凤姐听说，忙命快传饭来。|凤姐听了，忙叫快开饭。
一时周瑞家的传了一桌客饭来，摆在东边屋内，过来带了刘姥姥和板儿过去吃饭。|一会儿周瑞家的叫人送来一桌客饭，摆在东边屋里，过来领刘姥姥和板儿去吃。
凤姐说道：“周姐姐，好生让著些儿，我不能陪了。”|凤姐说：“周姐姐，好好招待着，我就不陪了。”
于是过东边房里来。|于是她们去了东边屋里。
又叫过周瑞家的去，问他才回了太太，说了些什么？|凤姐又把周瑞家的叫过去，问她刚才禀报太太，太太说了些什么。
周瑞家的道：“太太说，他们家原不是一家子，不过因出一姓，当年又与太老爷在一处作官，偶然连了宗的。|周瑞家的说：“太太说，他们家原本不是一家人，只因为同姓，当年又跟老太爷在一起做官，偶然连了宗。
这几年来也不大走动。|这几年也不大来往。
当时他们来一遭，却也没空了他们。|以前他们来一趟，也没让他们空手回去。
今儿既来了瞧瞧我们，是他的好意思，也不可简慢了他。|今天既然来看我们，是她的好意，也不能怠慢了她。
便是有什么说的，叫奶奶裁度著就是了。”|就算有什么话，叫奶奶看着办就是了。”
凤姐听了说道：“我说呢，既是一家子，我如何连影儿也不知道。”|凤姐听了说：“我说呢，要真是一家人，我怎么连影子都不知道。”
说话时，刘姥姥已吃毕了饭，拉了板儿过来，抹舌咂嘴的道谢。|说话间，刘姥姥已经吃完饭，拉着板儿过来，咂着嘴道谢。
凤姐笑道：“且请坐下，听我告诉你老人家。|凤姐笑道：“您先坐下，听我跟您老人家说。
方才的意思，我已知道了。|刚才您的意思，我已经知道了。
若论亲戚之间，原该不等上门来就该有照应才是。|论亲戚情分，本该不等您上门就照应着才是。
但如今家内杂事太烦，太太渐上了年纪，一时想不到也是有的。|只是现在家里杂事太多，太太又渐渐上了年纪，一时想不到也是有的。
况是我近来接著管些事，都不知道这些亲戚们。|何况我是最近才接手管事，这些亲戚我都不知道。
二则外头看著虽是烈烈轰轰的，殊不知大有大的艰难去处，说与人也未必信罢。|再说，外面看着我们家轰轰烈烈的，却不知道大有大的难处，说给别人听也未必信。
今儿你既老远的来了，又是头一次见我张口，怎好叫你空回去呢。|今天您大老远来了，又是头一回跟我开口，怎么好让您空手回去。
可巧昨儿太太给我的丫头们做衣裳的二十两银子，我还没动呢，你若不嫌少，就暂且先拿了去罢。”|正巧昨天太太给我丫头们做衣服的二十两银子，我还没动，您要是不嫌少，就先拿去吧。”
! 王夫人一句“不过因出一姓”，凤姐立刻心里有了数。给多少，全看这门亲戚有多近。
! “大有大的艰难去处”，凤姐又一次说出了贾府的实情，只是没人信。
! 二十两银子是什么分量？第三十九回刘姥姥算过，贾府一顿螃蟹宴就要二十多两，够庄稼人过一年。

# 十九、千恩万谢出府
那刘姥姥先听见告艰难，只当是没有，心里便突突的，后来听见给他二十两，喜的又浑身发痒起来，说道：|刘姥姥先听凤姐诉苦，以为没指望了，心里扑通扑通地跳；后来听说给她二十两，高兴得浑身发痒，说：
“嗳，我也是知道艰难的。|“哎，我也知道您的难处。
但俗语说的：‘瘦死的骆驼比马大’，凭他怎样，你老拔根寒毛比我们的腰还粗呢！”|可俗话说‘瘦死的骆驼比马大’，不管怎么样，您老人家拔根汗毛都比我们的腰还粗呢！”
周瑞家的见他说的粗鄙，只管使眼色止他。|周瑞家的见她说话粗俗，一个劲儿使眼色拦她。
凤姐看见，笑而不睬，只命平儿把昨儿那包银子拿来，再拿一吊钱来，都送到刘姥姥的跟前。|凤姐看见了，笑笑不理，只叫平儿把昨天那包银子拿来，再拿一吊钱，都送到刘姥姥跟前。
凤姐乃道：“这是二十两银子，暂且给这孩子做件冬衣罢。|凤姐说：“这是二十两银子，先给这孩子做件冬衣吧。
若不拿著，就真是怪我了。|要是不拿，就是真怪我了。
这钱雇车坐罢。|这些钱雇车坐吧。
改日无事，只管来逛逛，方是亲戚们的意思。|以后没事，只管来逛逛，这才是亲戚的情分。
天也晚了，也不虚留你们了，到家里该问好的问个好儿罢。”|天也晚了，就不留你们了，回家替我向该问好的人问个好吧。”
一面说，一面就站了起来。|一边说，一边就站了起来。
刘姥姥只管千恩万谢的，拿了银子钱，随了周瑞家的来至外面。|刘姥姥只是千恩万谢，拿了银子和钱，跟着周瑞家的出来。
周瑞家的道：“我的娘啊！|周瑞家的说：“我的娘啊！
你见了他怎么倒不会说了？|你见了她怎么反倒不会说话了？
开口就是‘你侄儿’。|一开口就是‘你侄儿’。
我说句不怕你恼的话，便是亲侄儿，也要说和软些。|我说句不怕你生气的话，就算是亲侄儿，也得说得软和些。
蓉大爷才是他的正经侄儿呢，他怎么又跑出这么一个侄儿来了。”|蓉大爷才是她正经的侄儿，她怎么又冒出这么一个侄儿来了。”
刘姥姥笑道：“我的嫂子，我见了他，心眼儿里爱还爱不过来，那里还说的上话来呢。”|刘姥姥笑道：“我的好嫂子，我见了她，心里爱都爱不过来，哪还说得出话来。”
二人说著，又到周瑞家坐了片时。|两人说着，又到周瑞家坐了一会儿。
刘姥姥便要留下一块银子与周瑞家孩子们买果子吃，周瑞家的如何放在眼里，执意不肯。|刘姥姥要留下一块银子给周瑞家的孩子们买果子吃，周瑞家的哪看得上，坚决不要。
刘姥姥感谢不尽，仍从后门去了。|刘姥姥感激不尽，还是从后门走了。
正是：|正是：
~得意浓时易接济，受恩深处胜亲朋。|得意的时候接济别人很容易；受了深恩的人，比亲朋还亲。
! 刘姥姥说“你侄儿”，在乡下人是亲热，在贾府是失礼。刘姥姥这番粗话，凤姐却“笑而不睬”。
! 最后两句诗点题：凤姐顺手给的二十两，后来换来了刘姥姥对巧姐的救命之恩。
</script>
<script type="text/plain" id="ch7">
# 一、题诗
题曰：|题诗说：
~十二花容色最新，不知谁是惜花人。|十二朵宫花颜色最新鲜，不知道谁才是爱惜花的人。
~相逢若问名何氏，家往江南本姓秦。|相逢时要是问起名姓，她家在江南，本来姓秦。
! 前两句写送宫花，“十二花”也暗指金陵十二钗。后两句写秦钟出场，也有人认为指秦可卿。

# 二、宝钗和冷香丸
话说周瑞家的送了刘姥姥去后，便上来回王夫人话。|周瑞家的送走刘姥姥以后，就去向王夫人回话。
谁知王夫人不在上房，问丫鬟们时，方知往薛姨妈那边闲话去了。|谁知王夫人不在上房，问丫鬟们，才知道去薛姨妈那边聊天了。
周瑞家的听说，便转出东角门至东院，往梨香院来。|周瑞家的听了，就从东角门出去到东院，往梨香院走。
刚至院门前，只见王夫人的丫鬟名金钏儿者，和一个才留了头的小女孩儿站在台阶坡上顽。|刚到院门口，只见王夫人的丫鬟金钏儿，和一个刚开始留头发的小女孩站在台阶上玩。
见周瑞家的来了，便知有话回，因向内努嘴儿。|金钏儿见周瑞家的来了，知道她有话要回，就朝里面努努嘴。
周瑞家的轻轻掀帘进去，只见王夫人和薛姨妈长篇大套的说些家务人情等语。|周瑞家的轻轻掀开帘子进去，只见王夫人和薛姨妈正长篇大论地说着家务和人情往来。
周瑞家的不敢惊动，遂进里间来。|周瑞家的不敢打扰，就进了里间。
只见薛宝钗穿著家常衣服，头上只散挽著䰖儿，坐在炕里边，伏在小炕桌上同丫鬟莺儿正描花样子呢。|只见薛宝钗穿着家常衣服，头上随便挽着个发髻，坐在炕里边，趴在小炕桌上和丫鬟莺儿描绣花的样子。
见他进来，宝钗才放下笔，转过身来，满面堆笑让：“周姐姐坐。”|见她进来，宝钗才放下笔，转过身来，满脸笑着让座：“周姐姐坐。”
周瑞家的也忙陪笑问：“姑娘好？”|周瑞家的也忙赔笑问：“姑娘好？”
一面炕沿上坐了，因说：“这有两三天也没见姑娘到那边逛逛去，只怕是你宝兄弟冲撞了你不成？”|一边在炕沿上坐下，说：“这两三天也没见姑娘到那边去逛逛，不会是你宝兄弟得罪了你吧？”
宝钗笑道：“那里的话。|宝钗笑道：“哪里的话。
只因我那种病又发了，所以这两天没出屋子。”|只因为我那老毛病又犯了，所以这两天没出屋。”
周瑞家的道：“正是呢，姑娘到底有什么病根儿，也该趁早儿请个大夫来，好生开个方子，认真吃几剂，一势儿除了根才是。|周瑞家的说：“正是呢，姑娘到底有什么病根？也该趁早请个大夫，好好开个方子，认真吃几服药，一下子把病根除了才好。
小小的年纪倒作下个病根儿，也不是顽的。”|小小年纪落下病根，可不是闹着玩的。”
宝钗听了便笑道：“再不要提吃药。|宝钗听了笑道：“快别提吃药了。
为这病请大夫吃药，也不知白花了多少银子钱呢。|为这病请大夫吃药，不知白花了多少银子。
凭你什么名医仙药，从不见一点儿效。|不管什么名医仙药，从没见一点效果。
后来还亏了一个秃头和尚，说专治无名之症，因请他看了。|后来多亏一个秃头和尚，说他专治说不出名的病，就请他看了。
他说我这是从胎里带来的一股热毒，幸而先天壮，还不相干，若吃寻常药，是不中用的。|他说我这是从娘胎里带来的一股热毒，幸亏我先天身子壮，还不要紧，要是吃普通的药，是没用的。
他就说了一个海上方，又给了一包药末子作引子，异香异气的。|他就说了一个海上仙方，又给了一包药粉做药引子，香得奇怪。
不知是那里弄了来的。|不知道是从哪里弄来的。
他说发了时吃一丸就好。|他说犯病时吃一丸就好。
倒也奇怪，吃他的药倒效验些。”|倒也奇怪，吃他的药还真管用些。”
周瑞家的因问：“不知是个什么海上方儿？|周瑞家的问：“不知是个什么仙方？
姑娘说了，我们也记著，说与人知道，倘遇见这样病，也是行好的事。”|姑娘说说，我们也记着，告诉别人，要是有人得了这种病，也是做好事。”
宝钗见问，乃笑道：“不用这方儿还好，若用了这方儿，真真把人琐碎死。|宝钗见她问，笑道：“不用这方子还好，要是用这方子，真能把人麻烦死。
东西药料一概都有限，只难得‘可巧’二字：|药材东西倒都平常，只难在‘可巧’两个字：
要春天开的白牡丹花蕊十二两，夏天开的白荷花蕊十二两，秋天的白芙蓉蕊十二两，冬天的白梅花蕊十二两。|要春天开的白牡丹花蕊十二两，夏天开的白荷花蕊十二两，秋天的白芙蓉花蕊十二两，冬天的白梅花蕊十二两。
将这四样花蕊，于次年春分这日晒干，和在药末子一处，一齐研好。|把这四样花蕊，在第二年春分那天晒干，和药粉混在一起，一起研磨好。
又要雨水这日的雨水十二钱──”|还要雨水节气那天的雨水十二钱——”
周瑞家的忙道：“嗳哟！|周瑞家的忙说：“哎哟！
这么说来，这就得三年的工夫。|这么说，就得花三年的工夫。
倘或雨水这日竟不下雨，这却怎处呢？”|要是雨水那天偏偏不下雨，那怎么办呢？”

白露这日的露水十二钱，霜降这日的霜十二钱，小雪这日的雪十二钱。|还要白露那天的露水十二钱，霜降那天的霜十二钱，小雪那天的雪十二钱。
把这四样水调匀，和了药，再加十二钱蜂蜜，十二钱白糖，丸了龙眼大的丸子，盛在旧磁坛内，埋在花根底下。|把这四样水调匀，和进药里，再加十二钱蜂蜜、十二钱白糖，搓成龙眼那么大的丸子，装在旧瓷坛子里，埋在花根底下。
若发了病时，拿出来吃一丸，用十二分黄柏煎汤送下。”|犯病的时候，拿出来吃一丸，用十二分黄柏煎的汤送下。”
周瑞家的听了笑道：“阿弥陀佛，真坑死人的事儿！|周瑞家的听了笑道：“阿弥陀佛，真是坑死人的事！
等十年未必都这样巧的呢。”|等十年也未必样样都这么巧。”
宝钗道：“竟好，自他说了去后，一二年间可巧都得了，好容易配成一料。|宝钗说：“偏偏还好，自从他说了以后，一两年里可巧都凑齐了，好不容易配成一料。
如今从南带至北，现在就埋在梨花树底下呢。”|现在从南方带到北方，就埋在梨花树底下呢。”
周瑞家的又问道：“这药可有名子没有呢？”|周瑞家的又问：“这药有名字吗？”

! 冷香丸处处是“十二”，又要四季的白花、四时的雨露霜雪，暗示宝钗冷静自持的性格，也暗示她最后的冷落。

略待半刻，见王夫人无语，方欲退出，薛姨妈忽又笑道：“你且站住。|等了一会儿，见王夫人没说什么，正要退出去，薛姨妈忽然又笑道：“你先站住。

# 四、香菱就是英莲
说著，周瑞家的拿了匣子，走出房门，见金钏仍在那里晒日阳儿。|说着，周瑞家的拿了匣子出门，见金钏儿还在那里晒太阳。

金钏儿笑道：“我也是这们说呢。”|金钏儿笑道：“我也这么说呢。”
周瑞家的又问香菱：“你几岁投身到这里？”|周瑞家的又问香菱：“你几岁到这家来的？”
又问：“你父母今在何处？|又问：“你父母现在在哪里？
今年十几岁了？|今年十几岁了？
本处是那里人？”|老家是哪里的？”

如今周瑞家的故顺路先往这里来，只见几个小丫头子都在抱厦内听呼唤呢。|所以周瑞家的顺路先到这里，只见几个小丫头都在抱厦里听候使唤。
迎春的丫鬟司棋与探春的丫鬟待书二人正掀帘子出来，手里都捧著茶钟，周瑞家的便知他们姊妹在一处坐著呢，遂进入内房，只见迎春探春二人正在窗下围棋。|迎春的丫鬟司棋和探春的丫鬟待书正掀帘子出来，手里都捧着茶碗，周瑞家的就知道她们姐妹坐在一起，进了里屋，只见迎春、探春正在窗下下围棋。

# 六、智能儿和月例银子

奶子摇头儿。|奶妈摇摇头。
正说著，只听那边一阵笑声，却有贾琏的声音。|正说着，只听那边一阵笑声，里面有贾琏的声音。
接著房门响处，平儿拿著大铜盆出来，叫丰儿舀水进去。|接着房门一响，平儿拿着大铜盆出来，叫丰儿打水进去。
平儿便到这边来，一见了周瑞家的便问：“你老人家又跑了来作什么？”|平儿就到这边来，一见周瑞家的就问：“您老人家又跑来做什么？”

周瑞家的这才往贾母这边来。|周瑞家的这才往贾母这边走。

周瑞家的忙问：“你这会跑来作什么？”|周瑞家的忙问：“你这时候跑来做什么？”
他女儿笑道：“妈一向身上好？|她女儿笑道：“妈这阵子身体好吗？
我在家里等了这半日，妈竟不出去，什么事情这样忙的不回家？|我在家等了半天，妈也不出来，什么事这么忙，连家都不回？

妈还有什么不了的差事，手里是什么东西？”|妈还有什么没办完的差事？手里拿的是什么？”
周瑞家的笑道：“嗳！|周瑞家的笑道：“唉！

这会子还没送清楚呢。|到现在还没送完呢。
你这会子跑了来，一定有什么事。”|你这时候跑来，一定有什么事。”

周瑞家的道：“是了。|周瑞家的说：“知道了。
小人儿家没经过什么事，就急得你这样了。”|小孩子家没经过什么事，就急成这样。”
说著，便到黛玉房中去了。|说着，就往黛玉房里去了。
! 一个陪房的女婿吃了官司，在她眼里“有什么大不了”。贾府的势力，连下人都能借来压官司。

# 九、黛玉：别人不挑剩下的也不给我
谁知此时黛玉不在自己房中，却在宝玉房中大家解九连环顽呢。|谁知这时黛玉不在自己房里，却在宝玉房里，大家在玩九连环。
周瑞家的进来笑道：“林姑娘，姨太太著我送花儿与姑娘带来了。”|周瑞家的进来笑道：“林姑娘，姨太太叫我给姑娘送花来了。”
宝玉听说，便先问：“什么花儿？|宝玉听了，先问：“什么花？
拿来给我。”|拿来给我看。”
一面早伸手接过来了。|一边早伸手接了过来。
开匣看时，原来是宫制堆纱新巧的假花儿。|打开匣子一看，原来是宫里做的纱堆的新式假花。
黛玉只就宝玉手中看了一看，便问道：“还是单送我一人的，还是别的姑娘们都有呢？”|黛玉只就着宝玉的手看了一眼，就问：“是单送我一个人的，还是别的姑娘们都有？”
周瑞家的道：“各位都有了，这两枝是姑娘的了。”|周瑞家的说：“各位都有了，这两支是姑娘的。”
黛玉冷笑道：“我就知道，别人不挑剩下的也不给我。”|黛玉冷笑道：“我就知道，别人不挑剩下的，也不会给我。”
周瑞家的听了，一声儿不言语。|周瑞家的听了，一声不吭。
宝玉便问道：“周姐姐，你作什么到那边去了。”|宝玉就问：“周姐姐，你到那边去做什么了？”
周瑞家的因说：“太太在那里，因回话去了，姨太太就顺便叫我带来了。”|周瑞家的说：“太太在那边，我去回话，姨太太就顺便叫我带来了。”
宝玉道：“宝姐姐在家作什么呢？|宝玉说：“宝姐姐在家做什么呢？
怎么这几日也不过这边来？”|怎么这几天也不过来？”
周瑞家的道：“身上不大好呢。”|周瑞家的说：“身上不大舒服呢。”
宝玉听了，便和丫头说：“谁去瞧瞧？|宝玉听了，就对丫头们说：“谁去看看？
只说我与林姑娘打发了来请姨太太姐姐安，问姐姐是什么病，现吃什么药。|就说我和林姑娘派来给姨太太、姐姐请安，问问姐姐是什么病，吃什么药。
论理我该亲自来的，就说才从学里来，也著了些凉，异日再亲自来看罢。”|按理我该亲自去的，就说我刚从学里回来，也着了点凉，改天再亲自去看。”
说著，茜雪便答应去了。|说着，茜雪答应着去了。
周瑞家的自去，无话。|周瑞家的自己走了，没别的话。
! 花是最后送到黛玉这里的，其实只因周瑞家的顺路。黛玉偏偏多心，一句话说得人哑口无言。
! 宝玉打发人去看宝钗，特意说是“我与林姑娘”一起派去的，这是在替黛玉打圆场。

# 十、冷子兴的官司与凤姐回话
原来这周瑞的女婿，便是雨村的好友冷子兴，近因卖古董和人打官司，故教女人来讨情分。|原来周瑞的女婿，就是贾雨村的好朋友冷子兴，最近因为卖古董跟人打官司，所以叫老婆来求情。
周瑞家的仗著主子的势利，把这些事也不放在心上，晚间只求求凤姐儿便完了。|周瑞家的仗着主子的势力，根本不把这事放在心上，晚上求一求凤姐就完了。
至掌灯时分，凤姐已卸了妆，来见王夫人回话：“今儿甄家送了来的东西，我已收了。|到了点灯的时候，凤姐卸了妆，来见王夫人回话：“今天甄家送来的东西，我已经收下了。
咱们送他的，趁著他家有年下进鲜的船回去，一并都交给他们带了去罢？”|咱们回送他们的东西，趁他家年底进贡鲜货的船回去，一起交给他们带走吧？”
王夫人点头。|王夫人点点头。
凤姐又道：“临安伯老太太生日的礼已经打点了，派谁送去呢？”|凤姐又说：“临安伯老太太生日的礼物已经准备好了，派谁送去呢？”
王夫人道：“你瞧谁闲著，就叫他们去四个女人就是了，又来当什么正经事问我。”|王夫人说：“你看谁闲着，就派四个女人去好了，这也当正经事来问我。”
凤姐又笑道：“今日珍大嫂子来，请我明日过去逛逛，明日倒没有什么事情。”|凤姐又笑道：“今天珍大嫂子来，请我明天过去逛逛，明天倒没什么事。”
王夫人道：“有事没事都害不著什么。|王夫人说：“有事没事都不碍事。
每常他来请，有我们，你自然不便意，他既不请我们，单请你，可知是他诚心叫你散淡散淡，别辜负了他的心，便有事也该过去才是。”|平常她来请，有我们在，你自然不方便；她既然不请我们，单请你，可见是诚心叫你去散散心，别辜负了她的心意，就是有事也该去。”
凤姐答应了。|凤姐答应了。
当下李纨、迎、探等姐妹们亦来定省毕，各自归房无话。|这时李纨、迎春、探春等姐妹也来请了晚安，各自回房，没别的话。
! 冷子兴就是第二回“演说荣国府”的古董商。贾府的大小人物，一根线就串起来了。
! 甄家是江南的大族，跟贾家互相送礼，是贾府的“镜子”。后来甄家先被抄，贾家跟着败。

# 十一、宁府初会秦钟
次日凤姐梳洗了，先回王夫人毕，方来辞贾母。|第二天凤姐梳洗完，先向王夫人禀报，才来向贾母辞行。
宝玉听了，也要跟了逛去。|宝玉听说了，也要跟着去玩。
凤姐只得答应，立等著换了衣服，姐儿两个坐了车，一时进入宁府。|凤姐只好答应，等他换了衣服，姐弟两个坐上车，不一会儿进了宁府。
早有贾珍之妻尤氏与贾蓉之妻秦氏婆媳两个，引了多少姬妾丫鬟媳妇等接出仪门。|贾珍的妻子尤氏和贾蓉的妻子秦氏婆媳俩，带着许多姬妾、丫鬟、媳妇，早迎出了仪门。
那尤氏一见了凤姐，必先笑嘲一阵，一手携了宝玉同入上房来归坐。|尤氏一见凤姐，总要先说笑一阵，一手拉着宝玉一起进上房坐下。
秦氏献茶毕，凤姐因说：“你们请我来作什么？|秦氏上过茶，凤姐说：“你们请我来做什么？
有什么好东西孝敬我，就快献上来，我还有事呢。”|有什么好东西孝敬我，就快拿出来，我还有事呢。”
尤氏秦氏未及答话，地下几个姬妾先就笑说：“二奶奶今儿不来就罢，既来了就依不得二奶奶了。”|尤氏、秦氏还没答话，地下几个姬妾先笑道：“二奶奶今天不来就罢了，既然来了，可就由不得二奶奶了。”
正说著，只见贾蓉进来请安。|正说着，贾蓉进来请安。
宝玉因问：“大哥哥今日不在家么？”|宝玉问：“大哥哥今天不在家吗？”
尤氏道：“出城与老爷请安去了。|尤氏说：“出城给老爷请安去了。
可是你怪闷的，坐在这里作什么？|你坐在这里怪闷的，做什么呢？
何不也去逛逛？”|何不也去逛逛？”
秦氏笑道：“今儿巧，上回宝叔立刻要见的我那兄弟，他今儿也在这里，想在书房里呢，宝叔何不去瞧一瞧？”|秦氏笑道：“今天巧了，上回宝叔急着要见的我那弟弟，今天也在这里，大概在书房里，宝叔何不去看看？”
宝玉听了，即便下炕要走。|宝玉听了，马上下炕要走。
尤氏凤姐都忙说：“好生著，忙什么？”|尤氏和凤姐都忙说：“慢着点，急什么？”
一面便吩咐好生小心跟著，别委曲著他，倒比不得跟了老太太过来就罢了。|一边吩咐下人好好小心跟着，别让他受委屈，这次不比跟着老太太来的时候。
凤姐说道：“既这么著，何不请进这秦小爷来，我也瞧一瞧。|凤姐说：“既然这样，何不请这位秦小爷进来，我也看看。
难道我见不得他不成？”|难道我见不得他吗？”
尤氏笑道：“罢，罢！|尤氏笑道：“算了，算了！
可以不必见他，比不得咱们家的孩子们，胡打海摔的惯了。|不必见他了，他比不得咱们家的孩子，打打闹闹惯了的。
人家的孩子都是斯斯文文的惯了，乍见了你这破落户，还被人笑话死了呢。”|人家的孩子斯斯文文惯了，猛一见你这个泼皮，还不被人笑话死。”
凤姐笑道：“普天下的人，我不笑话就罢了，竟叫这小孩子笑话我不成？”|凤姐笑道：“普天下的人，我不笑话他们就不错了，还轮得到这小孩子笑话我？”
贾蓉笑道：“不是这话，他生的䩄腆，没见过大阵仗儿，婶子见了，没的生气。”|贾蓉笑道：“不是这个意思，他生性腼腆，没见过大场面，婶子见了，怕要生气。”
凤姐道：“凭他什么样儿的，我也要见一见！|凤姐说：“不管他什么样，我也要见一见！
别放你娘的屁了。|别放屁了。
再不带我看看，给你一顿好嘴巴。”|再不带来给我看看，赏你一顿嘴巴子。”
贾蓉笑嘻嘻的说：“我不敢扭著，就带他来。”|贾蓉笑嘻嘻地说：“我不敢拗着，这就带他来。”
! 宁府里“姬妾”成群，说话也比荣府放肆。凤姐在这里说话也格外泼辣。

# 十二、宝玉和秦钟
说著，果然出去带进一个小后生来，较宝玉略瘦些，眉清目秀，粉面朱唇，身材俊俏，举止风流，似在宝玉之上，只是怯怯羞羞，有女儿之态，䩄腆含糊，慢向凤姐作揖问好。|说着，果然出去带进一个少年来，比宝玉略瘦些，眉清目秀，脸白唇红，身材俊俏，举止风雅，好像还在宝玉之上，只是怯生生、羞答答的，有女孩子的样子，腼腆地含含糊糊向凤姐作揖问好。
凤姐喜的先推宝玉，笑道：“比下去了！”|凤姐高兴得先推了宝玉一把，笑道：“把你比下去了！”
便探身一把携了这孩子的手，就命他身傍坐了，慢慢的问他：几岁了，读什么书，弟兄几个，学名唤什么。|就探身一把拉住这孩子的手，让他坐在身边，慢慢地问他：几岁了，读什么书，有几个兄弟，学名叫什么。
秦钟一一答应了。|秦钟一一回答了。
早有凤姐的丫鬟媳妇们见凤姐初会秦钟，并未备得表礼来，遂忙过那边去告诉平儿。|凤姐的丫鬟媳妇们见凤姐第一次见秦钟，没准备见面礼，忙到那边去告诉平儿。
平儿知道凤姐与秦氏厚密，虽是小后生家，亦不可太俭，遂自作主意，拿了一匹尺头，两个“状元及第”的小金锞子，交付与来人送过去。|平儿知道凤姐跟秦氏关系亲密，虽然只是个小孩子，也不能太寒酸，就自己做主，拿了一匹衣料、两个刻着“状元及第”的小金锭，交给来人送过去。
凤姐犹笑说太简薄等语。|凤姐还笑着说太微薄了。
秦氏等谢毕。|秦氏等人道了谢。
一时吃过饭，尤氏，凤姐，秦氏等抹骨牌，不在话下。|一会儿吃过饭，尤氏、凤姐、秦氏几个打骨牌，这里不多说。
那宝玉自见了秦钟的人品出众，心中似有所失，痴了半日，自己心中又起了呆意，乃自思道：|宝玉自从见了秦钟人品出众，心里好像丢了什么，发了半天呆，心里又冒出傻念头，想道：
“天下竟有这等人物！|“天下竟有这样的人！
如今看来，我竟成了泥猪癞狗了。|现在看来，我简直成了泥猪癞狗了。
可恨我为什么生在这侯门公府之家，若也生在寒门薄宦之家，早得与他交结，也不枉生了一世。|可恨我为什么生在这侯门公府的人家，要是也生在穷人家、小官家，早就能和他结交，也不枉活这一辈子。
我虽如此比他尊贵，可知锦绣纱罗，也不过裹了我这根死木头，美酒羊羔，也不过填了我这粪窟泥沟。|我虽然比他尊贵，可见绫罗绸缎也不过裹着我这根死木头，美酒羊羔也不过填了我这个粪坑泥沟。
‘富贵’二字，不料遭我荼毒了！”|‘富贵’这两个字，没想到被我糟蹋了！”
秦钟自见了宝玉形容出众，举止不凡，更兼金冠绣服，骄婢侈童，秦钟心中亦自思道：|秦钟见宝玉相貌出众、举止不凡，再加上金冠绣衣，身边有骄傲的丫鬟、阔气的书童，心里也想：
“果然这宝玉怨不得人溺爱他。|“难怪人人都宠这宝玉。
可恨我偏生于清寒之家，不能与他耳鬓交接，可知‘贫窭’二字限人，亦世间之大不快事。”|可恨我偏偏生在清贫人家，不能跟他亲近交往，可见‘贫穷’两个字限制人，也是世上最不痛快的事。”
二人一样的胡思乱想。|两个人一样地胡思乱想。
忽然宝玉问他读什么书。|忽然宝玉问他读什么书。
秦钟见问，因而答以实话。|秦钟见他问，就照实回答了。
二人你言我语，十来句后，越觉亲密起来。|两人你一句我一句，说了十来句以后，越来越亲密了。
! 平儿替凤姐备礼，又快又周到，是凤姐最得力的帮手。
! 一个恨自己富，一个恨自己穷，两人都觉得“富贵”“贫窭”隔开了他们。宝玉对富贵的厌弃，在这里说得最透。
! 秦钟谐音“情种”。他和宝玉、秦可卿，都是“情”字的化身。

# 十三、约定一起上学
一时摆上茶果，宝玉便说：“我两个又不吃酒，把果子摆在里间小炕上，我们那里坐去，省得闹你们。”|一会儿摆上茶点果子，宝玉就说：“我们两个又不喝酒，把果子摆到里间小炕上，我们到那里去坐，省得吵你们。”
于是二人进里间来吃茶。|于是两人进了里间喝茶。
秦氏一面张罗与凤姐摆酒果，一面忙进来嘱宝玉道：“宝叔，你侄儿倘或言语不防头，你千万看著我，不要理他。|秦氏一边张罗着给凤姐摆酒菜，一边忙进来嘱咐宝玉：“宝叔，你侄儿要是说话没轻没重，你千万看在我面上，别跟他计较。
他虽䩄腆，却性子左强，不大随和此是有的。”|他虽然腼腆，脾气却倔，不大随和，这是有的。”
宝玉笑道：“你去罢，我知道了。”|宝玉笑道：“你去吧，我知道了。”
秦氏又嘱了他兄弟一回，方去陪凤姐。|秦氏又嘱咐了她弟弟一番，才去陪凤姐。
一时凤姐尤氏又打发人来问宝玉：“要吃什么，外面有，只管要去。”|一会儿凤姐、尤氏又派人来问宝玉：“想吃什么，外面有，只管去要。”
宝玉只答应著，也无心在饮食上，只问秦钟近日家务等事。|宝玉只是答应着，也没心思吃东西，只问秦钟最近家里的事。
秦钟因说：“业师于去年病故，家父又年纪老迈，残疾在身，公务繁冗，因此尚未议及再延师一事，目下不过在家温习旧课而已。|秦钟说：“我的老师去年病故了，父亲年纪大，身上又有病，公务又多，所以还没顾得上再请老师，现在只在家温习以前学的功课。
再读书一事，必须有一二知己为伴，时常大家讨论，才能进益。”|再说读书这件事，一定要有一两个知心朋友做伴，常在一起讨论，才能有进步。”
宝玉不待说完，便答道：“正是呢，我们却有个家塾，合族中有不能延师的，便可入塾读书，子弟们中亦有亲戚在内可以附读。|宝玉不等他说完，就接着说：“正是呢，我们家有个家塾，族里请不起老师的，就可以进塾读书，亲戚家的子弟也可以来附读。
我因业师上年回家去了，也现荒废著呢。|我的老师去年回家去了，我也正荒废着呢。
家父之意，亦欲暂送我去温习旧书，待明年业师上来，再各自在家里读。|我父亲的意思，也想暂时送我去家塾温习旧书，等明年老师回来，再各自在家里读。
家祖母因说，一则家学里之子弟太多，生恐大家淘气，反不好，二则也因我病了几天，遂暂且耽搁著。|我祖母说，一来家塾里子弟太多，怕大家一起淘气，反倒不好；二来我又病了几天，就暂时耽搁了。
如此说来，尊翁如今也为此事悬心。|这么说来，令尊现在也为这事操心。
今日回去，何不禀明，就往我们敝塾中来，我亦相伴，彼此有益，岂不是好事？”|你今天回去，何不跟令尊说说，就到我们家塾来，我也陪你，彼此都有好处，岂不是好事？”
秦钟笑道：“家父前日在家提起延师一事，也曾提起这里的义学倒好，原要来和这里的亲翁商议引荐。|秦钟笑道：“我父亲前几天在家说起请老师的事，也说起这里的义学挺好，本来想来和这里的亲家商量引荐。
因这里又事忙，不便为这点小事来聒絮的。|因为这边事情忙，不好为这点小事来打扰。
宝叔果然度小侄或可磨墨涤砚，何不速速的作成，又彼此不致荒废，又可以常相谈聚，又可以慰父母之心，又可以得朋友之乐，岂不是美事？”|宝叔要是觉得小侄还配给您磨墨洗砚，何不赶快办成，既不荒废学业，又能常在一起聊天，又能让父母放心，又能享受朋友之乐，岂不是好事？”

咱们回来告诉你姐夫姐姐和琏二嫂子。|咱们回头告诉你姐夫、姐姐和琏二嫂子。
你今日回家就禀明令尊，我回去再禀明祖母，再无不速成之理。”|你今天回家就跟令尊说，我回去再跟祖母说，没有办不成的。”
二人计议一定。|两人就这么商量定了。
那天气已是掌灯时候，出来又看他们顽了一回牌。|天已经到了点灯的时候，两人出来又看她们打了一会儿牌。
算帐时，却又是秦氏尤氏二人输了戏酒的东道，言定后日吃这东道。|算账时，又是秦氏、尤氏两人输了，要请看戏喝酒，说定后天请客。
一面就叫送饭。|一边就叫开饭。
! 宝玉平时最怕上学，这回却主动要去家塾，一半为了秦钟。本回题目“谈肄业秦钟结宝玉”说的就是这件事。
! 两人约着上学，引出第九回的“闹学堂”。

# 十四、焦大醉骂
吃毕晚饭，因天黑了，尤氏说：“先派两个小子送了这秦相公家去。”|吃完晚饭，天黑了，尤氏说：“先派两个小厮送秦相公回家。”
媳妇们传出去半日，秦钟告辞起身。|媳妇们传话出去半天，秦钟告辞起身。
尤氏问：“派了谁送去？”|尤氏问：“派了谁去送？”
媳妇们回说：“外头派了焦大，谁知焦大醉了，又骂呢。”|媳妇们回答：“外面派了焦大，谁知焦大喝醉了，又在骂人呢。”
尤氏秦氏都说道：“偏又派他作什么！|尤氏和秦氏都说：“偏偏派他做什么！
放著这些小子们，那一个派不得？|这么多小厮，哪个派不得？
偏要惹他去。”|偏要去惹他。”
凤姐道：“我成日家说你太软弱了，纵的家里人这样还了得了。”|凤姐说：“我整天说你太软弱了，把家里下人惯成这样，还了得。”
尤氏叹道：“你难道不知这焦大的？|尤氏叹道：“你难道不知道焦大？
连老爷都不理他的，你珍大哥哥也不理他。|连老爷都不管他，你珍大哥也不管他。
只因他从小儿跟著太爷们出过三四回兵，从死人堆里把太爷背了出来，得了命，|只因为他从小跟着老太爷出过三四回兵，从死人堆里把老太爷背了出来，救了老太爷的命；
自己挨著饿，却偷了东西来给主子吃，两日没得水，得了半碗水给主子喝，他自己喝马溺。|自己挨着饿，却偷来东西给主子吃；两天没有水，弄到半碗水给主子喝，他自己喝马尿。
不过仗著这些功劳情分，有祖宗时都另眼相待，如今谁肯难为他去。|就仗着这些功劳和情分，祖宗在世时对他都另眼相看，现在谁肯难为他。
他自己又老了，又不顾体面，一味吃酒，吃醉了，无人不骂。|他自己又老了，又不要脸面，只知道喝酒，喝醉了就谁都骂。
我常说给管事的，不要派他差事，全当一个死的就完了。|我常跟管事的说，别派他差事，就当他死了算了。
今儿又派了他。”|今天又派了他。”
凤姐道：“我何曾不知这焦大。|凤姐说：“我哪会不知道这个焦大。
倒是你们没主意，有这样的，何不打发他远远的庄子上去就完了。”|倒是你们没主意，有这样的人，何不打发他到远远的庄子上去就完了。”
说著，因问：“我们的车可齐备了？”|说着又问：“我们的车准备好了吗？”
地下众人都应道：“伺候齐了。”|地下众人都答应：“都准备好了。”
凤姐起身告辞，和宝玉携手同行。|凤姐起身告辞，和宝玉手拉手一起走。
尤氏等送至大厅，只见灯烛辉煌，众小厮都在丹墀侍立。|尤氏等人送到大厅，只见灯火辉煌，小厮们都站在台阶下伺候。
那焦大又恃贾珍不在家，即在家亦不好怎样他，更可以任意洒落洒落。|焦大又仗着贾珍不在家，就算在家也拿他没办法，更可以随意发泄发泄。
因趁著酒兴，先骂大总管赖二，说他“不公道，欺软怕硬。|于是趁着酒劲，先骂大总管赖二，说他“不公道，欺软怕硬。
有了好差事就派别人，象这等黑更半夜送人的事，就派我。|有了好差事就派别人，像这种黑更半夜送人的事，就派我。
没良心的王八羔子！|没良心的王八羔子！
瞎充管家！|瞎充什么管家！
你也不想想，焦大太爷跷跷脚，比你的头还高呢。|你也不想想，焦大太爷跷跷脚，都比你的头还高。
二十年头里的焦大太爷眼里有谁？|二十年前，焦大太爷眼里有谁？
别说你们这一起杂种王八羔子们！”|更别说你们这帮杂种王八羔子！”
! 焦大是贾府开创时的老功臣，如今却被当成“死的”。祖宗打下的江山，子孙已经不记得是怎么来的了。
! 凤姐说“打发他远远的庄子上去”，她处理人一向干脆利落。

# 十五、“爬灰的爬灰”
正骂的兴头上，贾蓉送凤姐的车出去，众人喝他不听，贾蓉忍不得，便骂了他两句，使人捆起来，“等明日酒醒了，问他还寻死不寻死了！”|正骂得起劲，贾蓉送凤姐的车出来，众人喝止他不听，贾蓉忍不住，骂了他两句，叫人把他捆起来：“等明天酒醒了，问他还找不找死！”
那焦大那里把贾蓉放在眼里，反大叫起来，赶著贾蓉叫：“蓉哥儿，你别在焦大跟前使主子性儿。|焦大哪把贾蓉放在眼里，反倒大叫起来，追着贾蓉喊：“蓉哥儿，你别在焦大面前摆主子架子。

不是焦大一个人，你们就做官儿享荣华受富贵？|要不是焦大一个人，你们能做官、享荣华富贵？
你祖宗九死一生挣下这家业，到如今了，不报我的恩，反和我充起主子来了。|你祖宗九死一生挣下这份家业，到现在，不报我的恩，反倒跟我充起主子来了。
不和我说别的还可，若再说别的，咱们红刀子进去白刀子出来！”|不跟我说别的还好，要是再说别的，咱们就白刀子进、红刀子出！”
凤姐在车上说与贾蓉道：“以后还不早打发了这个没王法的东西！|凤姐在车上对贾蓉说：“以后还不早点打发了这个没王法的东西！
留在这里岂不是祸害？|留在这里岂不是祸害？
倘或亲友知道了，岂不笑话咱们这样的人家，连个王法规矩都没有。”|要是让亲友知道了，岂不笑话咱们这样的人家，连个王法规矩都没有。”

众小厮见他太撒野了，只得上来几个，揪翻捆倒，拖往马圈里去。|小厮们见他太撒野了，只好上来几个，把他揪倒捆起来，拖到马圈里去。

那里承望到如今生下这些畜牲来！|哪想到如今生下这些畜生来！
每日家偷狗戏鸡，爬灰的爬灰，养小叔子的养小叔子，我什么不知道？|整天偷鸡摸狗，公公跟儿媳妇乱来的乱来，嫂子跟小叔子私通的私通，我什么不知道？
咱们‘胳膊折了往袖子里藏’！”|咱们‘胳膊折了往袖子里藏’！”
众小厮听他说出这些没天日的话来，唬的魂飞魄散，也不顾别的了，便把他捆起来，用土和马粪满满的填了他一嘴。|小厮们听他说出这些没天理的话，吓得魂飞魄散，也顾不上别的了，把他捆起来，用土和马粪塞了他满满一嘴。
! 焦大骂人时说“红刀子进去白刀子出来”，是醉话说反了，作者故意这么写。
! “爬灰”指公公和儿媳私通，一般认为暗指贾珍和秦可卿；“养小叔子”有人认为指凤姐和贾蓉，也有其他说法。这是全书第一次有人公开揭宁府的丑事。
! 用马粪堵他的嘴，正说明他说的是真话。

# 十六、宝玉问“爬灰”
凤姐和贾蓉等也遥遥的闻得，便都装作没听见。|凤姐和贾蓉等人远远地也听见了，都装作没听见。
宝玉在车上见这般醉闹，倒也有趣，因问凤姐道：“姐姐，你听他说‘爬灰的爬灰’，什么是‘爬灰’？”|宝玉在车上看他这样醉闹，倒觉得有趣，就问凤姐：“姐姐，你听他说‘爬灰的爬灰’，什么是‘爬灰’？”
凤姐听了，连忙立眉嗔目断喝道：“少胡说！|凤姐听了，连忙竖起眉毛瞪着眼喝道：“少胡说！
那是醉汉嘴里混吣，你是什么样的人，不说没听见，还倒细问！|那是醉汉嘴里胡说八道，你是什么身份的人，不说装没听见，倒还细问！
等我回去回了太太，仔细捶你不捶你！”|等我回去告诉太太，看不揍你一顿！”
唬的宝玉忙央告道：“好姐姐，我再不敢了。”|吓得宝玉忙求她：“好姐姐，我再也不敢了。”
凤姐道：“这才是呢。|凤姐说：“这才对。
等到了家，咱们回了老太太，打发你同秦家侄儿学里念书去要紧。”|等到了家，咱们禀明老太太，打发你跟秦家侄儿一起去学里念书，这才是要紧事。”
说著，却自回往荣府而来。|说着，就回荣府去了。
正是：|正是：
~不因俊俏难为友，正为风流始读书。|不是因为长得俊俏才难交朋友，正是因为风流多情，才开始去读书。
! 凤姐的“断喝”反而说明她最清楚这话的意思。所有人都“装作没听见”，宁府的丑事就这样被捂着。
! 最后两句诗点破：宝玉和秦钟上学，不是为了读书，是为了“风流”。

王夫人本是好清净的，见贾母回来也就回来了。|王夫人本来就喜欢清静，见贾母回来，也跟着回来了。
然后凤姐坐了首席，尽欢至晚无话。|然后凤姐坐了首席，一直玩到晚上，没什么别的事。

# 二、宝玉绕路去看宝钗
却说宝玉因送贾母回来，待贾母歇了中觉，意欲还去看戏取乐，又恐扰的秦氏等人不便，因想起近日薛宝钗在家养病，未去亲候，意欲去望他一望。|宝玉送贾母回来，等贾母睡了午觉，本想再去看戏，又怕打扰秦氏她们不方便，就想起最近薛宝钗在家养病，还没亲自去看过，打算去看看她。
若从上房后角门过去，又恐遇见别事缠绕，再或可巧遇见他父亲，更为不妥，宁可绕远路罢了。|要是从上房后面的角门过去，又怕被别的事缠住，万一碰上父亲更糟，宁可绕远路。
当下众嬷嬷丫鬟伺候他换衣服，见他不换，仍出二门去了，众嬷嬷丫鬟只得跟随出来，还只当他去那府中看戏。|嬷嬷丫鬟们伺候他换衣服，见他不换，还是出了二门，只好跟着出来，还以为他要去那府里看戏。

二人点头道：“老爷在梦坡斋小书房里歇中觉呢，不妨事的。”|两人点头说：“老爷在梦坡斋小书房里睡午觉呢，不碍事。”
一面说，一面走了。|一边说一边走了。
说的宝玉也笑了。|说得宝玉也笑了。
于是转弯向北奔梨香院来。|于是拐弯往北，直奔梨香院。
可巧银库房的总领名唤吴新登与仓上的头目名戴良，还有几个管事的头目，共有七个人，从帐房里出来，一见了宝玉，赶来都一齐垂手站住。|正巧银库房的总管吴新登、粮仓的头目戴良，还有几个管事的头目，一共七个人从账房里出来，一见宝玉，都赶过来垂手站住。
独有一个买办名唤钱华，因他多日未见宝玉，忙上来打千儿请安，宝玉忙含笑携他起来。|只有一个叫钱华的采买，因为好多天没见宝玉了，忙上前打千请安，宝玉忙笑着拉他起来。
众人都笑说：“前儿在一处看见二爷写的斗方儿，字法越发好了，多早晚儿赏我们几张贴贴。”|众人都笑着说：“前两天在一个地方看见二爷写的斗方，字写得越来越好了，什么时候也赏我们几张贴贴。”
宝玉笑道：“在那里看见了？”|宝玉笑道：“在哪儿看见的？”

! 人人都奉承宝玉，夸他的字好。他在家里就是这样被捧着长大的。

# 三、宝钗的模样
闲言少述，且说宝玉来至梨香院中，先入薛姨妈室中来，正见薛姨妈打点针黹与丫鬟们呢。|闲话少说，宝玉来到梨香院，先进了薛姨妈的屋子，正碰上薛姨妈在给丫鬟们分派针线活。
宝玉忙请了安，薛姨妈忙一把拉了他，抱入怀内，笑说：“这们冷天，我的儿，难为你想著来，快上炕来坐著罢。”|宝玉忙请安，薛姨妈一把拉住他，搂在怀里，笑着说：“这么冷的天，我的儿，难为你还想着来，快上炕坐着。”
命人倒滚滚的茶来。|叫人倒滚烫的茶来。
宝玉因问：“哥哥不在家？”|宝玉问：“哥哥不在家？”
薛姨妈叹道：“他是没笼头的马，天天忙不了，那里肯在家一日。”|薛姨妈叹气说：“他是没笼头的马，天天忙个不停，哪肯在家待一天。”
宝玉道：“姐姐可大安了？”|宝玉说：“姐姐病好了吗？”
薛姨妈道：“可是呢，你前儿又想著打发人来瞧他。|薛姨妈说：“正是呢，你前两天还惦记着派人来看她。
他在里间不是，你去瞧他，里间比这里暖和，那里坐著，我收拾收拾就进去和你说话儿。”|她就在里间，你去看她吧，里间比这里暖和，你在那里坐，我收拾收拾就进去跟你说话。”
宝玉听说，忙下了炕来至里间门前，只见吊著半旧的红䌷软帘。|宝玉听了，忙下炕来到里间门口，只见挂着一个半旧的红绸软帘。
宝玉掀帘一迈步进去，先就看见薛宝钗坐在炕上作针线，头上挽著漆黑油光的䰖儿，|宝玉掀起帘子一步跨进去，先看见薛宝钗坐在炕上做针线，头上挽着乌黑油亮的发髻，
蜜合色棉袄，玫瑰紫二色金银鼠比肩褂，葱黄绫棉裙，一色半新不旧，看去不觉奢华。|穿着蜜合色的棉袄，玫瑰紫色镶金银线的银鼠皮坎肩，葱黄绫子的棉裙，一身都是半新不旧的，看上去不显得奢华。
唇不点而红，眉不画而翠，脸若银盆，眼如水杏。|嘴唇不抹也红，眉毛不画也黑，脸像银盆一样圆润，眼睛像水杏一样明亮。
罕言寡语，人谓藏愚，安分随时，自云守拙。|她很少说话，别人说她是把聪明藏起来；她安守本分、随和应时，自己说这是守拙。
宝玉一面看，一面问：“姐姐可大愈了？”|宝玉一边看一边问：“姐姐病全好了吗？”
宝钗抬头只见宝玉进来，连忙起身含笑答说：“已经大好了，倒多谢记挂著。”|宝钗抬头见宝玉进来，连忙起身笑着回答：“已经好多了，多谢你惦记着。”
说著，让他在炕沿上坐了，即命莺儿斟茶来。|说着让他在炕沿上坐下，马上叫莺儿倒茶来。
一面又问老太太姨娘安，别的姐妹们都好。|一边又问老太太、姨妈好，别的姐妹们都好不好。
! 薛蟠是“没笼头的马”，和第四回说的“呆霸王”一样。
! 宝钗的衣服“半新不旧”，人“罕言寡语”，跟冷香丸、不爱花粉都是一路：处处收着，从不张扬。
! 宝钗的外貌写“脸若银盆”，跟黛玉的“病如西子”正好对照：一个丰满健康，一个纤弱多病。

# 四、宝钗看通灵宝玉
一面看宝玉头上戴著累丝嵌宝紫金冠，额上勒著二龙抢珠金抹额，身上穿著秋香色立蟒白狐腋箭袖，系著五色蝴蝶鸾绦，项上挂著长命锁，记名符，另外有一块落草时衔下来的宝玉。|一边看宝玉：头上戴着金丝编成、镶嵌宝石的紫金冠，额上勒着二龙抢珠的金抹额，身上穿着秋香色绣立蟒、白狐腋下皮毛做的箭袖袍，系着五色蝴蝶花纹的丝绦，脖子上挂着长命锁、记名符，另外还有一块生下来时衔在嘴里的宝玉。
宝钗因笑说道：“成日家说你的这玉，究竟未曾细细的赏鉴，我今儿倒要瞧瞧。”|宝钗笑着说：“整天听人说你这块玉，到底没仔细看过，我今天倒要看看。”
说著便挪近前来。|说着就挪近了些。
宝玉亦凑了上去，从项上摘了下来，递在宝钗手内。|宝玉也凑上前去，从脖子上摘下来，递到宝钗手里。
宝钗托于掌上，只见大如雀卵，灿若明霞，莹润如酥，五色花纹缠护。|宝钗托在手掌上，只见它有麻雀蛋那么大，像朝霞一样灿烂，像酥油一样莹润，五色的花纹缠绕在上面。
这就是大荒山中青埂峰下的那块顽石的幻相。|这就是大荒山青埂峰下那块顽石变化出来的样子。
后人曾有诗嘲云：|后人有诗嘲笑它说：
~女娲炼石已荒唐，又向荒唐演大荒。|女娲炼石补天已经够荒唐了，又从这荒唐里演出一段大荒山的故事。
~失去幽灵真境界，幻来亲就臭皮囊。|失去了原来幽静灵秀的仙境，变成幻相来亲近人的肉身。
~好知运败金无彩，堪叹时乖玉不光。|要知道运气败了，金子也会失去光彩；可叹时运不好，玉也没了光泽。
~白骨如山忘姓氏，无非公子与红妆。|白骨堆成山，连姓名都忘了，那里面无非是公子和美人。
! 黛玉说“明日再看也不迟”，结果先细看这块玉的是宝钗。
! “金无彩”“玉不光”说的就是宝钗的金锁和宝玉的玉。还没对上，作者先写了它们的结局。

# 五、玉上的字
那顽石亦曾记下他这幻相并癞僧所镌的篆文，今亦按图画于后。|那顽石也记下了自己的样子和癞头和尚刻的篆字，现在也照着图画在后面。
但其真体最小，方能从胎中小儿口内衔下。|只是它的真身很小，才能被娘胎里的婴儿衔在嘴里。
今若按其体画，恐字迹过于微细，使观者大废眼光，亦非畅事。|现在要是照实际大小画，怕字太小，让读者费眼力，看着也不舒服。
故今只按其形式，无非略展些规矩，使观者便于灯下醉中可阅。|所以只照着它的样子，稍微放大一些，让读者在灯下、醉中也能看清。
今注明此故，方无胎中之儿口有多大，怎得衔此狼犺蠢大之物等语之谤。|在这里说明缘故，免得有人说“婴儿的嘴有多大，怎么衔得下这么笨重的大东西”之类的闲话。
通灵宝玉正面图式|【通灵宝玉正面图】
音注云：“莫失莫忘，仙寿恒昌。”|注音说：“莫失莫忘，仙寿恒昌。”（意思是：不要丢失、不要忘记，就能长寿安康）
通灵宝玉反面图式|【通灵宝玉反面图】
音注云：“一除邪祟，二疗冤疾，三知祸福。”|注音说：“一除邪祟，二疗冤疾，三知祸福。”（意思是：一能驱除邪魔，二能治疗怪病，三能预知祸福）
! 原书这里有玉的图样，正反面刻着篆字，文本里只保留了图名和注音。
! 这三样本事后来都应验了：第二十五回宝玉中邪，就是靠这块玉才救回来的。

# 六、金锁上的字
宝钗看毕，又从新翻过正面来细看，口内念道：“莫失莫忘，仙寿恒昌。”|宝钗看完，又重新翻过正面来细看，嘴里念道：“莫失莫忘，仙寿恒昌。”
念了两遍，乃回头向莺儿笑道：“你不去倒茶，也在这里发呆作什么？”|念了两遍，回头对莺儿笑道：“你不去倒茶，也在这里发什么呆？”
莺儿嘻嘻笑道：“我听这两句话，倒象和姑娘的项圈上的两句话是一对儿。”|莺儿嘻嘻笑道：“我听这两句话，倒像跟姑娘项圈上的两句话是一对儿。”
宝玉听了，忙笑道：“原来姐姐那项圈上也有八个字，我也赏鉴赏鉴。”|宝玉听了，忙笑道：“原来姐姐的项圈上也有八个字，我也看看。”
宝钗道：“你别听他的话，没有什么字。”|宝钗说：“你别听她的，没什么字。”
宝玉笑央：“好姐姐，你怎么瞧我的了呢。”|宝玉笑着央求：“好姐姐，你怎么就看了我的呢。”
宝钗被缠不过，因说道：“也是个人给了两句吉利话儿，所以錾上了，叫天天带著，不然，沉甸甸的有什么趣儿。”|宝钗被他缠不过，就说：“也是有人给了两句吉利话，所以刻上了，叫我天天戴着，不然，沉甸甸的有什么意思。”
一面说，一面解了排扣，从里面大红袄上将那珠宝晶莹黄金灿烂的璎珞掏将出来。|一边说，一边解开衣扣，从里面的大红袄上掏出那个珠宝晶莹、黄金灿烂的项圈来。
宝玉忙托了锁看时，果然一面有四个篆字，两面八字，共成两句吉谶。|宝玉忙托起金锁来看，果然一面有四个篆字，两面一共八个字，合成两句吉利的话。
亦曾按式画下形相：|也照样画下了它的形状：
璎珞正面式|【金锁正面图】
音注云：“不离不弃。”|注音说：“不离不弃。”
璎珞反面式|【金锁反面图】
音注云：“芳龄永继。”|注音说：“芳龄永继。”
宝玉看了，也念了两遍，又念自己的两遍，因笑问：“姐姐这八个字倒真与我的是一对。”|宝玉看了，也念了两遍，又念了两遍自己的，笑着说：“姐姐这八个字倒真跟我的是一对。”
莺儿笑道：“是个癞头和尚送的，他说必须錾在金器上-”|莺儿笑道：“是个癞头和尚送的，他说一定要刻在金器上——”
宝钗不待说完，便嗔他不去倒茶，一面又问宝玉从那里来。|宝钗不等她说完，就怪她不去倒茶，一边又问宝玉从哪里来。
! “不离不弃，芳龄永继”对“莫失莫忘，仙寿恒昌”，字字相对。这就是“金玉良缘”。
! 莺儿话没说完就被宝钗打断。后面的话大概是：“……日后遇见有玉的，才可结为婚姻。”第二十八回薛姨妈就说过这话。宝钗心里明白，所以不让她说下去。
! 宝钗说“没有什么字”，又说“沉甸甸的有什么趣儿”，越是遮掩，越显得她在意。

# 七、冷香
宝玉此时与宝钗就近，只闻一阵阵凉森森甜丝丝的幽香，竟不知系何香气，遂问：“姐姐熏的是什么香？|宝玉这时离宝钗很近，只闻到一阵阵凉丝丝、甜丝丝的幽香，不知道是什么香，就问：“姐姐熏的是什么香？
我竟从未闻见过这味儿。”|我从来没闻过这种味道。”
宝钗笑道：“我最怕熏香，好好的衣服，熏的烟燎火气的。”|宝钗笑道：“我最怕熏香，好好的衣服，熏得一股烟火气。”
宝玉道：“既如此，这是什么香？”|宝玉说：“既然这样，这是什么香？”
宝钗想了一想，笑道：“是了，是我早起吃了丸药的香气。”|宝钗想了想，笑道：“对了，是我早上吃的丸药的香味。”
宝玉笑道：“什么丸药这么好闻？|宝玉笑道：“什么丸药这么好闻？
好姐姐，给我一丸尝尝。”|好姐姐，给我一丸尝尝。”
宝钗笑道：“又混闹了，一个药也是混吃的？”|宝钗笑道：“又胡闹了，药也是随便吃的？”
! 这股香就是第七回的冷香丸。“凉森森甜丝丝”四个字，正好是宝钗给人的感觉。

# 八、黛玉来了
一语未了，忽听外面人说：“林姑娘来了。”|话还没说完，忽然听见外面有人说：“林姑娘来了。”
话犹未了，林黛玉已摇摇的走了进来，一见了宝玉，便笑道：“嗳哟，我来的不巧了！”|话还没说完，林黛玉已经摇摇摆摆地走了进来，一见宝玉就笑道：“哎哟，我来得不巧了！”
宝玉等忙起身笑让坐，宝钗因笑道：“这话怎么说？”|宝玉他们忙起身笑着让座，宝钗笑道：“这话怎么说？”
黛玉笑道：“早知他来，我就不来了。”|黛玉笑道：“早知道他来，我就不来了。”
宝钗道：“我更不解这意。”|宝钗说：“我更不明白这意思了。”
黛玉笑道：“要来一群都来，要不来一个也不来，今儿他来了，明儿我再来，如此间错开了来著，岂不天天有人来了？|黛玉笑道：“要来大家一起来，要不来一个都不来。今天他来了，明天我再来，这样错开来，岂不是天天都有人来了？
也不至于太冷落，也不至于太热闹了。|既不会太冷清，也不会太热闹。
姐姐如何反不解这意思？”|姐姐怎么反倒不明白这意思？”
宝玉因见他外面罩著大红羽缎对衿褂子，因问：“下雪了么？”|宝玉见她外面罩着一件大红羽缎的对襟褂子，就问：“下雪了吗？”
地下婆娘们道：“下了这半日雪珠儿了。”|地下的婆子们说：“下了半天小雪粒了。”
宝玉道：“取了我的斗篷来不曾？”|宝玉说：“把我的斗篷拿来了没有？”
黛玉便道：“是不是，我来了他就该去了。”|黛玉就说：“是不是，我一来他就该走了。”
宝玉笑道：“我多早晚儿说要去了？|宝玉笑道：“我什么时候说要走了？
不过拿来预备著。”|不过是拿来预备着。”
宝玉的奶母李嬷嬷因说道：“天又下雪，也好早晚的了，就在这里同姐姐妹妹一处顽顽罢。|宝玉的奶妈李嬷嬷说：“天又下雪了，时候也不早了，就在这儿跟姐姐妹妹一起玩玩吧。
姨妈那里摆茶果子呢。|姨妈那边正摆茶点果子呢。
我叫丫头去取了斗篷来，说给小幺儿们散了罢。”|我叫丫头去拿斗篷来，再告诉小厮们都散了吧。”
宝玉应允。|宝玉答应了。
李嬷嬷出去，命小厮们都各散去不提。|李嬷嬷出去，叫小厮们都散了，这里不提。
! 黛玉偏偏在宝玉宝钗看完玉和锁、闻完香之后进来。她一句“来的不巧”，句句带刺，又句句说得滴水不漏。
! 宝钗两次说“不解”，其实未必不解。一个话里有话，一个装作听不懂，两人的性格就在这一来一往里。

# 九、宝玉要喝冷酒
这里薛姨妈已摆了几样细茶果来留他们吃茶。|这边薛姨妈已经摆了几样精致的茶点，留他们喝茶。
宝玉因夸前日在那府里珍大嫂子的好鹅掌鸭信。|宝玉夸起前几天在那府里吃的珍大嫂子做的鹅掌鸭舌。
薛姨妈听了，忙也把自己糟的取了些来与他尝。|薛姨妈听了，忙把自己用酒糟腌的也拿了些来给他尝。
宝玉笑道：“这个须得就酒才好。”|宝玉笑道：“这个得配着酒吃才好。”
薛姨妈便令人去灌了最上等的酒来。|薛姨妈就叫人去打最上等的酒来。
李嬷嬷便上来道：“姨太太，酒倒罢了。”|李嬷嬷就上来说：“姨太太，酒就算了吧。”
宝玉央道：“妈妈，我只喝一钟。”|宝玉央求说：“妈妈，我只喝一杯。”
李嬷嬷道：“不中用！|李嬷嬷说：“不行！
当著老太太，太太，那怕你吃一坛呢。|当着老太太、太太的面，就算你喝一坛也行。
想那日我眼错不见一会，不知是那一个没调教的，只图讨你的好儿，不管别人死活，给了你一口酒吃，葬送的我挨了两日骂。|想那天我一眼没看住，不知道是哪个没教养的，只想讨你的好，不管别人死活，给你喝了一口酒，害得我挨了两天骂。
姨太太不知道，他性子又可恶，吃了酒更弄性。|姨太太不知道，他脾气本来就坏，喝了酒更爱使性子。
有一日老太太高兴了，又尽著他吃，什么日子又不许他吃，何苦我白赔在里面。”|有时候老太太高兴，就随他喝；有时候又不许他喝，我何苦白白夹在中间受气。”
薛姨妈笑道：“老货，你只放心吃你的去。|薛姨妈笑道：“老东西，你只管放心去喝你的。
我也不许他吃多了。|我也不许他多喝。
便是老太太问，有我呢。”|就算老太太问起来，有我呢。”
一面令小丫鬟：“来，让你奶奶们去，也吃杯搪搪雪气。”|一边叫小丫鬟：“来，陪你们奶奶们去，也喝杯酒挡挡寒气。”
那李嬷嬷听如此说，只得和众人去吃些酒水。|李嬷嬷听她这么说，只好跟着大家去喝酒了。
这里宝玉又说：“不必温暖了，我只爱吃冷的。”|这边宝玉又说：“不用温了，我就爱喝冷的。”
薛姨妈忙道：“这可使不得，吃了冷酒，写字手打飐儿。”|薛姨妈忙说：“这可使不得，喝了冷酒，写字手会发抖。”
宝钗笑道：“宝兄弟，亏你每日家杂学旁收的，难道就不知道酒性最热，若热吃下去，发散的就快，若冷吃下去，便凝结在内，以五脏去暖他，岂不受害？|宝钗笑道：“宝兄弟，亏你每天杂七杂八地学了那么多，难道不知道酒性最热？热着喝下去，散发得快；冷着喝下去，就凝结在身体里，要用五脏去暖它，岂不伤身？
从此还不快不要吃那冷的了。”|从今以后快别喝冷的了。”
宝玉听这话有情理，便放下冷酒，命人暖来方饮。|宝玉听这话有道理，就放下冷酒，叫人温了再喝。
! 李嬷嬷说一大套没用，薛姨妈一句“有我呢”就把她打发走了。
! 宝钗劝宝玉，说得句句在理，宝玉也听。她劝人从来都是这样，讲道理、不使性子。

# 十、黛玉借手炉讽刺
黛玉磕著瓜子儿，只抿著嘴笑。|黛玉嗑着瓜子，只抿着嘴笑。
可巧黛玉的小丫鬟雪雁走来与黛玉送小手炉，黛玉因含笑问他：“谁叫你送来的？|正巧黛玉的小丫鬟雪雁来给她送小手炉，黛玉笑着问她：“谁叫你送来的？
难为他费心，那里就冷死了我！”|难为她费心，哪里就冻死我了！”
雪雁道：“紫鹃姐姐怕姑娘冷，使我送来的。”|雪雁说：“紫鹃姐姐怕姑娘冷，叫我送来的。”
黛玉一面接了，抱在怀中，笑道：“也亏你倒听他的话。|黛玉一边接过来抱在怀里，一边笑道：“也亏你肯听她的话。
我平日和你说的，全当耳旁风，怎么他说了你就依，比圣旨还快些！”|我平时跟你说的话，你全当耳旁风，怎么她一说你就照办，比圣旨还快！”
宝玉听这话，知是黛玉借此奚落他，也无回复之词，只嘻嘻的笑两阵罢了。|宝玉听了这话，知道黛玉是借这个讽刺他，也没话可说，只嘻嘻地笑了两声。
宝钗素知黛玉是如此惯了的，也不去睬他。|宝钗知道黛玉一向这样，也不理她。
薛姨妈因道：“你素日身子弱，禁不得冷的，他们记挂著你倒不好？”|薛姨妈说：“你平时身子弱，受不得冷，她们惦记着你还不好？”
黛玉笑道：“姨妈不知道。|黛玉笑道：“姨妈不知道。
幸亏是姨妈这里，倘或在别人家，人家岂不恼？|幸亏是在姨妈这里，要是在别人家，人家岂不生气？
好说就看的人家连个手炉也没有，巴巴的从家里送个来。|好像人家连个手炉都没有，巴巴地从家里送一个来。
不说丫鬟们太小心过馀，还只当我素日是这等轻狂惯了呢。”|人家不会说是丫鬟们太小心，还以为我平时就这么轻狂惯了呢。”
薛姨妈道：“你这个多心的，有这样想，我就没这样心。”|薛姨妈说：“你这孩子真多心，你这样想，我可没这个心思。”
! 紫鹃就是第三回贾母给的鹦哥，到这里已改名紫鹃了。
! 黛玉骂的是雪雁，讽刺的是宝玉：宝钗一劝，宝玉就“放下冷酒”。宝玉听懂了，所以只能笑。
! 黛玉又把话圆回来，说是怕得罪姨妈。她嘴尖，心却细。

# 十一、李嬷嬷拦酒，黛玉护着宝玉
说话时，宝玉已是三杯过去。|说话间，宝玉已经喝了三杯。
李嬷嬷又上来拦阻。|李嬷嬷又上来拦。
宝玉正在心甜意洽之时，和宝黛姊妹说说笑笑的，那肯不吃。|宝玉正是心里甜美舒畅的时候，跟宝钗、黛玉姐妹说说笑笑，哪肯不喝。
宝玉只得屈意央告：“好妈妈，我再吃两钟就不吃了。”|宝玉只好低声下气地求：“好妈妈，我再喝两杯就不喝了。”
李嬷嬷道：“你可仔细老爷今儿在家，提防问你的书！”|李嬷嬷说：“你可小心，老爷今天在家，当心问你的功课！”
宝玉听了这话，便心中大不自在，慢慢的放下酒，垂了头。|宝玉听了这话，心里很不痛快，慢慢放下酒杯，低下了头。
黛玉先忙的说：“别扫大家的兴！|黛玉先忙着说：“别扫大家的兴！
舅舅若叫你，只说姨妈留著呢。|舅舅要是叫你，就说姨妈留着你呢。
这个妈妈，他吃了酒，又拿我们来醒脾了！”|这个妈妈，自己喝了酒，又拿我们来消遣了！”
一面悄推宝玉，使他赌气，一面悄悄的咕哝说：“别理那老货，咱们只管乐咱们的。”|一边悄悄推宝玉，激他赌气，一边小声嘀咕：“别理那老东西，咱们只管乐咱们的。”
那李嬷嬷不知黛玉的意思，因说道：“林姐儿，你不要助著他了。|李嬷嬷不知道黛玉的心思，就说：“林姐儿，你别帮着他了。
你倒劝劝他，只怕他还听些。”|你倒是劝劝他，只怕他还肯听些。”
林黛玉冷笑道：“我为什么助他？|林黛玉冷笑道：“我为什么帮他？
我也不犯著劝他。|我也犯不着劝他。
你这妈妈太小心了，往常老太太又给他酒吃，如今在姨妈这里多吃一口，料也不妨事。|你这个妈妈也太小心了，平常老太太也给他酒喝，现在在姨妈这里多喝一口，想来也不碍事。
必定姨妈这里是外人，不当在这里的也未可定。”|莫非姨妈这里是外人，不该在这里喝？也说不定。”
李嬷嬷听了，又是急，又是笑，说道：“真真这林姐儿，说出一句话来，比刀子还尖。|李嬷嬷听了，又急又笑，说：“这林姐儿真是的，说出一句话来，比刀子还尖。
你这算了什么。”|你这算什么呀。”
宝钗也忍不住笑著，把黛玉腮上一拧，说道：“真真这个颦丫头的一张嘴，叫人恨又不是，喜欢又不是。”|宝钗也忍不住笑着，在黛玉脸上拧了一把，说：“真是这个颦丫头的一张嘴，叫人恨也不是，爱也不是。”
薛姨妈一面又说：“别怕，别怕，我的儿！|薛姨妈又说：“别怕，别怕，我的儿！
来这里没好的你吃，别把这点子东西唬的存在心里，倒叫我不安。|来我这里也没什么好的给你吃，别为这点事吓得心里存着，倒叫我不安。
只管放心吃，都有我呢。|只管放心喝，有我呢。
越发吃了晚饭去，便醉了，就跟著我睡罢。”|干脆吃了晚饭再走，就算喝醉了，就跟着我睡。”
因命：“再烫热酒来！|于是吩咐：“再烫热酒来！
姨妈陪你吃两杯，可就吃饭罢。”|姨妈陪你喝两杯，就吃饭吧。”
宝玉听了，方又鼓起兴来。|宝玉听了，才又高兴起来。
! 刚才说“比圣旨还快”的是黛玉，现在帮宝玉喝酒的也是黛玉。她不劝宝玉，偏要护着他，跟宝钗正好相反。
! “必定姨妈这里是外人”，一句话把李嬷嬷堵得无话可说。连宝钗都叫她“颦丫头”，“颦颦”是宝玉第三回给她起的字。

# 十二、吃完饭，黛玉给宝玉戴斗笠
李嬷嬷因吩咐小丫头子们：“你们在这里小心著，我家里换了衣服就来，悄悄的回姨太太，别由著他，多给他吃。”|李嬷嬷吩咐小丫头们：“你们在这里小心着，我回家换了衣服就来。悄悄告诉姨太太，别由着他，给他多喝。”
说著便家去了。|说着就回家去了。
这里虽还有三两个婆子，都是不关痛痒的，见李嬷嬷走了，也都悄悄去寻方便去了。|这里虽然还有两三个婆子，都是不关心的，见李嬷嬷走了，也都悄悄溜去找自己的方便了。
只剩了两个小丫头子，乐得讨宝玉的欢喜。|只剩下两个小丫头，正好讨宝玉的欢心。
幸而薛姨妈千哄万哄的，只容他吃了几杯，就忙收过了。|幸亏薛姨妈千哄万哄，只让他喝了几杯，就赶紧收了。
作酸笋鸡皮汤，宝玉痛喝了两碗，吃了半碗碧粳粥。|又做了酸笋鸡皮汤，宝玉痛痛快快喝了两碗，吃了半碗碧粳米粥。
一时薛林二人也吃完了饭，又酽酽的沏上茶来大家吃了。|一会儿宝钗、黛玉也吃完了饭，又沏了浓浓的茶，大家喝了。
薛姨妈方放了心。|薛姨妈这才放了心。
雪雁等三四个丫头已吃了饭，进来伺候。|雪雁等三四个丫头已经吃过饭，进来伺候。
黛玉因问宝玉道：“你走不走？”|黛玉问宝玉：“你走不走？”
宝玉乜斜倦眼道：“你要走，我和你一同走。”|宝玉眯着醉眼说：“你要走，我跟你一起走。”
黛玉听说，遂起身道：“咱们来了这一日，也该回去了。|黛玉听了，就站起来说：“咱们来了一整天，也该回去了。
还不知那边怎么找咱们呢。”|还不知道那边怎么找咱们呢。”
说著，二人便告辞。|说着，两人就告辞了。
小丫头忙捧过斗笠来，宝玉便把头略低一低，命他戴上。|小丫头忙捧过斗笠来，宝玉把头略低一低，叫她给戴上。
那丫头便将著大红猩毡斗笠一抖，才往宝玉头上一合，宝玉便说：“罢，罢！|那丫头拿着大红猩猩毡的斗笠一抖，刚往宝玉头上一扣，宝玉就说：“算了，算了！
好蠢东西，你也轻些儿！|笨东西，你也轻一点！
难道没见过别人戴过的？|难道没见过别人怎么戴？
让我自己戴罢。”|让我自己戴吧。”
黛玉站在炕沿上道：“罗唆什么，过来，我瞧瞧罢。”|黛玉站在炕沿上说：“啰嗦什么，过来，我给你弄吧。”
宝玉忙就近前来。|宝玉忙走到她跟前。
黛玉用手整理，轻轻笼住束发冠，将笠沿掖在抹额之上，将那一颗核桃大的绛绒簪缨扶起，颤巍巍露于笠外。|黛玉用手整理，轻轻拢住束发的冠，把斗笠边掖在抹额上面，又把那颗核桃大的深红绒缨扶起来，让它颤巍巍地露在斗笠外面。
整理已毕，端相了端相，说道：“好了，披上斗篷罢。”|整理好了，端详了一番，说：“好了，披上斗篷吧。”
宝玉听了，方接了斗篷披上。|宝玉听了，才接过斗篷披上。
薛姨妈忙道：“跟你们的妈妈都还没来呢，且略等等不迟。”|薛姨妈忙说：“跟你们的妈妈们都还没来，先等一等也不迟。”
宝玉道：“我们倒去等他们，有丫头们跟著也够了。”|宝玉说：“我们倒去等她们，有丫头们跟着就够了。”
薛姨妈不放心，到底命两个妇女跟随他兄妹方罢。|薛姨妈不放心，到底派了两个女人跟着他们兄妹俩才罢。
他二人道了扰，一径回至贾母房中。|两人道了谢，直接回到贾母房里。
! 宝玉一句“你要走，我和你一同走”，黛玉就起身告辞。来的时候说“我来了他就该去了”，走的时候却是一起走。
! 黛玉给宝玉戴斗笠，是全书写宝黛亲密最动人的细节之一，一个字的情话都没有。

# 十三、宝玉醉回绛芸轩
贾母尚未用晚饭，知是薛姨妈处来，更加喜欢。|贾母还没吃晚饭，知道他们是从薛姨妈那里回来的，更加高兴。
因见宝玉吃了酒，遂命他自回房去歇著，不许再出来了。|见宝玉喝了酒，就叫他回自己房里歇着，不许再出来。
因命人好生看侍著。|又叫人好好看着伺候。
忽想起跟宝玉的人来，遂问众人：“李奶子怎么不见？”|忽然想起跟宝玉的人，就问大家：“李奶妈怎么不见？”
众人不敢直说家去了，只说：“才进来的，想有事才去了。”|大家不敢直说她回家了，只说：“刚才还在，想是有事才走开了。”
宝玉踉跄回头道：“他比老太太还受用呢，问他作什么！|宝玉跌跌撞撞地回头说：“她比老太太还享福呢，问她做什么！
没有他只怕我还多活两日。”|没有她，只怕我还能多活两天。”
一面说，一面来至自己的卧室。|一边说，一边来到自己的卧室。
只见笔墨在案，晴雯先接出来，笑说道：“好，好，要我研了那些墨，早起高兴，只写了三个字，丢下笔就走了，哄的我们等了一日。|只见桌上摆着笔墨，晴雯先迎出来，笑着说：“好啊，好啊，叫我磨了那么多墨，早上一高兴，只写了三个字，丢下笔就走了，害我们等了一天。
快来与我写完这些墨才罢！”|快来把这些墨写完了才算完！”
宝玉忽然想起早起的事来，因笑道：“我写的那三个字在那里呢？”|宝玉忽然想起早上的事，笑道：“我写的那三个字在哪儿？”
晴雯笑道：“这个人可醉了。|晴雯笑道：“这人真醉了。
你头里过那府里去，嘱咐贴在这门斗上，这会子又这么问。|你早上去那府里之前，嘱咐贴在这门框上面，这会儿又这么问。
我生怕别人贴坏了，我亲自爬高上梯的贴上，这会子还冻的手僵冷的呢。”|我怕别人贴坏了，亲自爬梯子上去贴的，这会儿手还冻得冰凉僵硬呢。”
宝玉听了，笑道：“我忘了。|宝玉听了笑道：“我忘了。
你的手冷，我替你渥著。”|你的手冷，我给你捂着。”
说著便伸手携了晴雯的手，同仰首看门斗上新书的三个字。|说着就伸手拉住晴雯的手，一起抬头看门框上新写的三个字。
一时黛玉来了，宝玉笑道：“好妹妹，你别撒谎，你看这三个字那一个好？”|一会儿黛玉来了，宝玉笑道：“好妹妹，你别说假话，你看这三个字哪个写得好？”
黛玉仰头看里间门斗上，新贴了三个字，写著”绛云轩”。|黛玉抬头看里间门框上，新贴了三个字，写着“绛云轩”。
黛玉笑道：“个个都好。|黛玉笑道：“个个都好。
怎么写的这么好了？|怎么写得这么好了？
明儿也与我写一个匾。”|明天也给我写一块匾。”
宝玉嘻嘻的笑道：“又哄我呢。”|宝玉嘻嘻笑道：“又哄我呢。”
说著又问：“袭人姐姐呢？”|说着又问：“袭人姐姐呢？”
晴雯向里间炕上努嘴。|晴雯朝里间炕上努努嘴。
宝玉一看，只见袭人和衣睡著在那里。|宝玉一看，只见袭人和衣睡在那里。
宝玉笑道：“好，太渥早了些。”|宝玉笑道：“好嘛，睡得也太早了些。”
! 宝玉说李嬷嬷“比老太太还受用”，醉话里带着积怨，为后面摔茶杯埋了伏笔。
! 晴雯是第一次正面出场：爱说爱笑，嘴快心直。宝玉给她捂手，和袭人的温顺正好对照。
! 回目写作“绛芸轩”，正文写作“绛云轩”，各本用字不一。“绛”字又让人想起“绛珠”。

# 十四、豆腐皮包子和枫露茶
因又问晴雯道：“今儿我在那府里吃早饭，有一碟子豆腐皮的包子，我想著你爱吃，和珍大奶奶说了，只说我留著晚上吃，叫人送过来的，你可吃了？”|又问晴雯：“今天我在那府里吃早饭，有一碟豆腐皮包子，我想着你爱吃，跟珍大奶奶说了，只说我留着晚上吃，叫人送过来的，你吃了没有？”
晴雯道：“快别提。|晴雯说：“快别提了。
一送了来，我知道是我的，偏我才吃了饭，就放在那里。|一送来，我就知道是给我的，偏偏我刚吃过饭，就放在那里了。
后来李奶奶来了看见，说：‘宝玉未必吃了，拿了给我孙子吃去罢。’他就叫人拿了家去了。”|后来李奶奶来了看见，说：‘宝玉不一定吃，拿给我孙子吃去吧。’她就叫人拿回家了。”
接著茜雪捧上茶来。|接着茜雪端上茶来。
宝玉因让”林妹妹吃茶。”|宝玉让道：“林妹妹喝茶。”
众人笑说：“林妹妹早走了，还让呢。”|大家笑道：“林妹妹早走了，还让呢。”
宝玉吃了半碗茶，忽又想起早起的茶来，因问茜雪道：“早起沏了一碗枫露茶，我说过，那茶是三四次后才出色的，这会子怎么又沏了这个来？”|宝玉喝了半碗茶，忽然又想起早上的茶，问茜雪：“早上沏了一碗枫露茶，我说过，那茶要泡三四次以后才出颜色，这会儿怎么又沏了这个来？”
茜雪道：“我原是留著的，那会子李奶奶来了，他要尝尝，就给他吃了。”|茜雪说：“我本来是留着的，那会儿李奶奶来了，她要尝尝，就给她喝了。”
! 包子和茶，都被李嬷嬷拿走了。小事一件接一件，宝玉的火就这么攒起来。
! 宝玉醉得连黛玉走了都不知道，还在让“林妹妹吃茶”。

# 十五、摔茶杯
宝玉听了，将手中的茶杯只顺手往地下一掷，豁啷一声，打了个粉碎，泼了茜雪一裙子的茶。|宝玉听了，顺手把手里的茶杯往地上一摔，“哗啦”一声摔得粉碎，茶水泼了茜雪一裙子。
又跳起来问著茜雪道：“他是你那一门子的奶奶，你们这么孝敬他？|又跳起来冲着茜雪问：“她是你哪门子的奶奶，你们这么孝敬她？
不过是仗著我小时候吃过他几日奶罢了。|不过仗着我小时候吃过她几天奶罢了。
如今逞的他比祖宗还大了。|现在把她惯得比祖宗还大了。
如今我又吃不著奶了，白白的养著祖宗作什么！|现在我又不吃奶了，白白养着个祖宗干什么！
撵了出去，大家干净！”|赶出去，大家干净！”
说著便要去立刻回贾母，撵他乳母。|说着就要马上去告诉贾母，把他奶妈赶出去。
原来袭人实未睡著，不过故意装睡，引宝玉来怄他顽耍。|原来袭人并没睡着，只是故意装睡，想引宝玉来逗她玩。
先闻得说字问包子等事，也还可不必起来，后来摔了茶钟，动了气，遂连忙起来解释劝阻。|先听见他们说写字、问包子这些事，还不用起来；后来宝玉摔了茶杯、动了气，她就连忙起来劝解。
早有贾母遣人来问是怎么了。|贾母早已派人来问是怎么回事。
袭人忙道：“我才倒茶来，被雪滑倒了，失手砸了钟子。”|袭人忙说：“我刚才倒茶，被雪滑了一跤，失手把杯子摔了。”
一面又安慰宝玉道：“你立意要撵他也好，我们也都愿意出去，不如趁势连我们一齐撵了，我们也好，你也不愁再有好的来伏侍你。”|一边又安慰宝玉说：“你一定要赶她走也行，我们也都愿意出去，不如趁这个机会把我们一起赶走，我们也好，你也不愁没有更好的人来伺候你。”
宝玉听了这话，方无了言语，被袭人等扶至炕上，脱换了衣服。|宝玉听了这话，才不说话了，被袭人她们扶到炕上，脱了衣服换好。
不知宝玉口内还说些什么，只觉口齿缠绵，眼眉愈加饧涩，忙伏侍他睡下。|不知道宝玉嘴里还在嘟囔什么，只觉得他说话含含糊糊，眼皮越来越沉，就赶紧伺候他睡下。
袭人伸手从他项上摘下那通灵玉来，用自己的手帕包好，塞在褥下，次日带时便冰不著脖子。|袭人伸手从他脖子上摘下通灵宝玉，用自己的手帕包好，塞在褥子底下，这样第二天戴的时候就不会冰着脖子。
那宝玉就枕便睡著了。|宝玉头一挨枕头就睡着了。
彼时李嬷嬷等已进来了，听见醉了，不敢前来再加触犯，只悄悄的打听睡了，方放心散去。|这时李嬷嬷她们已经进来了，听说宝玉醉了，不敢上前再惹他，只悄悄打听到他睡了，才放心散去。
! 袭人一句“被雪滑倒了”，替宝玉、也替李嬷嬷遮掩过去。再一句“连我们一齐撵了”，宝玉就没话了。她最懂怎么劝宝玉。
! 摔茶杯这事看着过去了，其实没完：后来茜雪被撵了出去，有人认为就是因为这件事。
! 袭人把玉包在手帕里塞在褥下，怕冰着宝玉的脖子。这份细心，是她在宝玉身边站稳的根本。

# 十六、秦钟拜见贾母
次日醒来，就有人回：“那边小蓉大爷带了秦相公来拜。”|第二天醒来，就有人来报：“那边小蓉大爷带着秦相公来拜见了。”
宝玉忙接了出去，领了拜见贾母。|宝玉忙迎出去，领他去拜见贾母。
贾母见秦钟形容标致，举止温柔，堪陪宝玉读书，心中十分欢喜，便留茶留饭，又命人带去见王夫人等。|贾母见秦钟相貌俊秀，举止温和，配得上陪宝玉读书，心里十分高兴，就留他喝茶吃饭，又叫人带他去见王夫人等人。
众人因素爱秦氏，今见了秦钟是这般人品，也都欢喜，临去时都有表礼。|大家一向喜欢秦氏，现在见秦钟也是这样的人品，都很喜欢，临走时都送了见面礼。
贾母又与了一个荷包并一个金魁星，取“文星和合”之意。|贾母又送了一个荷包和一个金魁星，取“文星和合”的意思。（魁星是主管文运的星神）
又嘱咐他道：“你家住的远，或有一时寒热饥饱不便，只管住在这里，不必限定了。|又嘱咐他说：“你家住得远，要是遇到冷了热了、饿了饱了不方便的时候，只管住在这里，不必拘束。
只和你宝叔在一处，别跟著那些不长进的东西们学。”|只跟你宝叔在一起，别跟那些不成器的东西学。”
秦钟一一的答应，回去禀知。|秦钟一一答应，回去告诉了父亲。
! 贾母嘱咐“别跟著那些不长进的东西们学”。下一回到了学堂，偏偏就是这些人惹出事来。

# 十七、秦业凑贽见礼
他父亲秦业现任营缮郎，年近七十，夫人早亡。|秦钟的父亲秦业现任营缮郎（工部管营造修缮的小官），快七十岁了，妻子早已去世。
因当年无儿女，便向养生堂抱了一个儿子并一个女儿。|因为当年没有儿女，就从养生堂（收养弃婴的地方）抱养了一个儿子和一个女儿。
谁知儿子又死了，只剩女儿，小名唤可儿，长大时，生的形容袅娜，性格风流。|谁知儿子又死了，只剩下女儿，小名叫可儿，长大以后，模样婀娜，性情风流。
因素与贾家有些瓜葛，故结了亲，许与贾蓉为妻。|因为一向跟贾家有些来往，就结了亲，许配给贾蓉做妻子。
那秦业至五旬之上方得了秦钟。|秦业到五十多岁才生了秦钟。
因去岁业师亡故，未暇延请高明之士，只得暂时在家温习旧课。|因为去年秦钟的老师去世了，还没来得及另请高明的先生，只好暂时在家温习旧功课。
正思要和亲家去商议送往他家塾中，暂且不致荒废，可巧遇见了宝玉这个机会。|正想去跟亲家商量把他送到贾家家塾里，免得荒废，正巧碰上了宝玉这个机会。
又知贾家塾中现今司塾的是贾代儒，乃当今之老儒，秦钟此去，学业料必进益，成名可望，因此十分喜悦。|又知道贾家家塾现在主持的是贾代儒，是当今有名的老学究，秦钟去了，学业一定有长进，有望成名，所以十分高兴。
只是宦囊羞涩，那贾家上上下下都是一双富贵眼睛，容易拿不出来，|只是做官的口袋里没多少钱，贾家上上下下都长着一双富贵眼，拿少了拿不出手，
为儿子的终身大事，说不得东拼西凑的恭恭敬敬封了二十四两贽见礼，亲自带了秦钟，来代儒家拜见了。|为了儿子的终身大事，也只好东拼西凑，恭恭敬敬地包了二十四两银子的拜师礼，亲自带着秦钟到贾代儒家拜见。
然后听宝玉上学之日，好一同入塾。|然后等宝玉上学的日子，好一起进塾读书。
正是：|正是：
~早知日后闲争气，岂肯今朝错读书。|早知道以后会为闲事争气惹祸，当初哪里会走错这一步去读书。
! 秦可卿原来是从养生堂抱来的，出身成谜。有研究者认为她身世大有来头，这是红学的一大悬案。
! 秦钟谐音“情种”，秦业谐音“情孽”。
! 二十四两拜师礼，刘姥姥得的才二十两。穷官为儿子“东拼西凑”，贾府的人却觉得理所当然。
! 最后两句诗预告下一回：秦钟到学堂，没读成书，反惹出一场大闹。
</script>
<script type="text/plain" id="ch9">
# 一、定了上学的日子
话说秦业父子专候贾家的人来送上学择日之信。|秦业父子专等贾家派人来送上学日期的消息。
原来宝玉急于要和秦钟相遇，却顾不得别的，遂择了后日一定上学。|原来宝玉急着要跟秦钟在一起，别的什么都顾不上了，就定了后天一定上学。
”后日一早请秦相公到我这里，会齐了，一同前去。”|“后天一早请秦相公到我这里，会合了一起去。”
打发了人送了信。|就派人去送了信。
! 宝玉以前能拖就拖，这回自己急着定日子。为了谁，一看就明白。

# 二、袭人嘱咐
至是日一早，宝玉起来时，袭人早已把书笔文物包好，收拾的停停妥妥，坐在床沿上发闷。|到了那天一早，宝玉起床时，袭人早已把书和笔墨文具包好，收拾得妥妥当当，坐在床沿上发闷。
见宝玉醒来，只得伏侍他梳洗。|见宝玉醒了，只好伺候他梳洗。
宝玉见他闷闷的，因笑问道：“好姐姐，你怎么又不自在了？|宝玉见她闷闷不乐，就笑着问：“好姐姐，你怎么又不高兴了？
难道怪我上学去丢的你们冷清了不成？”|难道怪我上学去了，丢下你们冷清？”
袭人笑道：“这是那里话。|袭人笑道：“这是哪里的话。
读书是极好的事，不然就潦倒一辈子，终久怎么样呢。|读书是天大的好事，不然一辈子潦倒，到头来能怎么样呢。
但只一件：只是念书的时节想著书，不念的时节想著家些。|只是有一件：念书的时候想着书，不念书的时候也想想家里。
别和他们一处顽闹，碰见老爷不是顽的。|别跟他们一起胡闹，碰上老爷可不是闹着玩的。
虽说是奋志要强，那工课宁可少些，一则贪多嚼不烂，二则身子也要保重。|虽说要立志上进，功课宁可少些：一来贪多嚼不烂，二来身体也要保重。
这就是我的意思，你可要体谅。”|这就是我的意思，你可要体谅。”
袭人说一句，宝玉应一句。|袭人说一句，宝玉答应一句。
袭人又道：“大毛衣服我也包好了，交出给小子们去了。|袭人又说：“厚皮衣服我也包好了，交给小厮们了。
学里冷，好歹想著添换，比不得家里有人照顾。|学里冷，千万记着添减衣服，比不得家里有人照顾。
脚炉手炉的炭也交出去了，你可著他们添。|脚炉手炉的炭也交出去了，你记得叫他们添。
那一起懒贼，你不说，他们乐得不动，白冻坏了你。”|那帮懒东西，你不说，他们乐得不动，白白冻坏了你。”
宝玉道：“你放心，出外头我自己都会调停的。|宝玉说：“你放心，到了外面我自己都会安排的。
你们也别闷死在这屋里，长和林妹妹一处去顽笑著才好。”|你们也别闷在这屋里，常去跟林妹妹一起玩笑才好。”
! 袭人嘴上说“读书是极好的事”，心里却闷闷不乐，舍不得宝玉。她一心盼宝玉学好，又事事替他想着冷暖。
! 宝玉临走还要丫鬟们去陪林妹妹。

# 三、辞别贾政
说著，俱已穿戴齐备，袭人催他去见贾母，贾政，王夫人等。|说着，都已穿戴整齐，袭人催他去拜别贾母、贾政、王夫人等人。
宝玉又去嘱咐了晴雯麝月等几句，方出来见贾母。|宝玉又去嘱咐了晴雯、麝月几句，才出来见贾母。
贾母也未免有几句嘱咐的话。|贾母也免不了嘱咐几句。
然后去见王夫人，又出来书房中见贾政。|然后去见王夫人，又到书房见贾政。
偏生这日贾政回家早些，正在书房中与相公清客们闲谈。|偏偏这天贾政回家早，正在书房里跟清客们闲聊。
忽见宝玉进来请安，回说上学里去，贾政冷笑道：“你如果再提‘上学’两个字，连我也羞死了。|忽然见宝玉进来请安，说要去上学，贾政冷笑道：“你要是再提‘上学’两个字，连我都要羞死了。
依我的话，你竟顽你的去是正理。|依我说，你还是去玩你的才是正经。
仔细站脏了我这地，靠脏了我的门！”|小心站脏了我的地，靠脏了我的门！”
众清客相公们都早起身笑道：“老世翁何必又如此。|清客们都早站起来笑道：“老世翁何必又这样。
今日世兄一去，三二年就可显身成名的了，断不似往年仍作小儿之态了。|世兄今天这一去，两三年就能出人头地了，绝不会再像以前那样孩子气了。
天也将饭时，世兄竟快请罢。”|天也快到饭点了，世兄快请吧。”
说著便有两个年老的携了宝玉出去。|说着就有两个年纪大的拉着宝玉出去了。
! 贾政对儿子只会冷嘲热讽，父子之间几乎没有一句好话。
! 清客们打圆场，说得好听，其实就是“詹光”“单聘仁”这一类人。

# 四、贾政训李贵
贾政因问：“跟宝玉的是谁？”|贾政问：“跟宝玉的是谁？”
只听外面答应了两声，早进来三四个大汉，打千儿请安。|只听外面答应了两声，早进来三四个大汉，打千请安。
贾政看时，认得是宝玉的奶母之子，名唤李贵。|贾政一看，认得是宝玉奶妈的儿子，叫李贵。
因向他道：“你们成日家跟他上学，他到底念了些什么书！|就对他说：“你们整天跟着他上学，他到底念了些什么书！
倒念了些流言混语在肚子里，学了些精致的淘气。|倒是念了一肚子胡言乱语，学了些花样翻新的淘气本事。
等我闲一闲，先揭了你的皮，再和那不长进的算帐！”|等我闲下来，先剥了你的皮，再跟那个不成器的算账！”
吓的李贵忙双膝跪下，摘了帽子，碰头有声，连连答应“是”，|吓得李贵忙跪下，摘了帽子，咚咚地磕头，连声答应“是”，
又回说：“哥儿已念到第三本《诗经》，什么‘呦呦鹿鸣，荷叶浮萍’，小的不敢撒谎。”|又回禀说：“哥儿已经念到第三本《诗经》了，什么‘呦呦鹿鸣，荷叶浮萍’，小的不敢撒谎。”
说的满座哄然大笑起来。|说得满屋子的人哄堂大笑。
贾政也撑不住笑了。|贾政也忍不住笑了。
因说道：“那怕再念三十本《诗经》，也都是掩耳偷铃，哄人而已。|又说：“就算再念三十本《诗经》，也都是掩耳盗铃，骗人罢了。
你去请学里太爷的安，就说我说了：什么《诗经》古文，一概不用虚应故事，只是先把《四书》一气讲明背熟，是最要紧的。”|你去给学里的太爷请安，就说是我说的：什么《诗经》、古文，一概不用装样子，只要先把《四书》一口气讲明白、背熟，这才是最要紧的。”
李贵忙答应“是”，见贾政无话，方退出去。|李贵忙答应“是”，见贾政没别的话，才退了出去。
! 《诗经》原句是“呦呦鹿鸣，食野之苹”，李贵听成了“荷叶浮萍”。一个下人把经书念错，连贾政都笑了。
! 贾政只要《四书》，因为科举考《四书》。在他眼里，读书就是为了考功名。

# 五、辞别黛玉
此时宝玉独站在院外屏声静候，待他们出来，便忙忙的走了。|这时宝玉一个人站在院子外面，屏着气等着，等他们出来，就急急忙忙走了。
李贵等一面掸衣服，一面说道：“哥儿听见了不曾？|李贵他们一边掸衣服，一边说：“哥儿听见了没有？
可先要揭我们的皮呢！|要先剥我们的皮呢！
人家的奴才跟主子赚些好体面，我们这等奴才白陪著挨打受骂的。|别人家的奴才跟着主子能挣些体面，我们这样的奴才白白陪着挨打挨骂。
从此后也可怜见些才好。”|以后您也可怜可怜我们吧。”
宝玉笑道：“好哥哥，你别委曲，我明儿请你。”|宝玉笑道：“好哥哥，你别委屈，我明天请你。”
李贵道：“小祖宗，谁敢望你请，只求听一句半句话就有了。”|李贵说：“小祖宗，谁敢指望你请，只求你听一句半句话就够了。”
说著，又至贾母这边，秦钟早来候著了，贾母正和他说话儿呢。|说着，又到了贾母这边，秦钟早来等着了，贾母正和他说话呢。
于是二人见过，辞了贾母。|于是两人见过面，辞别了贾母。
宝玉忽想起未辞黛玉，因又忙至黛玉房中来作辞。|宝玉忽然想起还没跟黛玉告别，又急忙到黛玉房里去辞行。
彼时黛玉才在窗下对镜理妆，听宝玉说上学去，因笑道：“好，这一去，可定是要‘蟾宫折桂’去了。|那时黛玉刚在窗下对着镜子梳妆，听宝玉说要去上学，就笑道：“好啊，这一去，一定是要‘蟾宫折桂’了。（意思是考中科举）
我不能送你了。”|我就不送你了。”
宝玉道：“好妹妹，等我下了学再吃饭。|宝玉说：“好妹妹，等我放了学再一起吃饭。
和胭脂膏子也等我来再制。”|调胭脂膏子也等我回来再做。”
劳叨了半日，方撤身去了。|唠叨了半天，才转身走了。
黛玉忙又叫住问道：“你怎么不去辞辞你宝姐姐呢？”|黛玉忙又叫住他问：“你怎么不去跟你宝姐姐告别呢？”
宝玉笑而不答，一径同秦钟上学去了。|宝玉笑而不答，径直跟秦钟上学去了。
! 黛玉说“蟾宫折桂”是在打趣他，她知道宝玉根本不是读书考功名的料。
! 宝玉特地回来辞黛玉，却不去辞宝钗。黛玉偏偏要问一句，宝玉“笑而不答”，答案就在不答里。

# 六、贾家义学
原来这贾家之义学，离此也不甚远，不过一里之遥，原系始祖所立，恐族中子弟有贫穷不能请师者，即入此中肄业。|原来贾家的义学离这儿不太远，不过一里路，是始祖设立的，怕族里有穷得请不起老师的子弟，就可以到这里来读书。
凡族中有官爵之人，皆供给银两，按俸之多寡帮助，为学中之费。|凡是族里有官职爵位的人，都要出银子，按俸禄多少资助，作为学里的费用。
特共举年高有德之人为塾掌，专为训课子弟。|又共同推举一位年高德劭的人做塾长，专门教导子弟。
如今宝秦二人来了，一一的都互相拜见过，读起书来。|现在宝玉、秦钟两人来了，跟大家一一见过礼，就读起书来。
自此以后，他二人同来同往，同坐同起，愈加亲密。|从此以后，两人一起来一起走，一起坐一起起，越来越亲密。
又兼贾母爱惜，也时常的留下秦钟，住上三天五日，与自己的重孙一般疼爱。|再加上贾母疼爱，也常常留秦钟住上三五天，跟自己的重孙一样疼他。
因见秦钟不甚宽裕，更又助他些衣履等物。|又见秦钟家不太宽裕，还常送他些衣服鞋袜。
不上一月之工，秦钟在荣府便熟了。|不到一个月，秦钟在荣府就混熟了。
宝玉终是不安本分之人，竟一味的随心所欲，因此又发了癖性，又特向秦钟悄说道：|宝玉到底是个不守本分的人，一味随心所欲，于是又犯了怪脾气，特地悄悄对秦钟说：
“咱们俩个人一样的年纪，况又是同窗，以后不必论叔侄，只论弟兄朋友就是了。”|“咱们两个年纪一样，又是同学，以后不必论叔叔侄子，只当兄弟朋友就好了。”
先是秦钟不肯，当不得宝玉不依，只叫他“兄弟”，或叫他的表字“鲸卿”，秦钟也只得混著乱叫起来。|起初秦钟不肯，可宝玉不依，只叫他“兄弟”，或者叫他的字“鲸卿”，秦钟也只好跟着随便乱叫起来。
! 义学本是始祖为族中穷子弟设的，用意很好。可下面就要写，这里早已乌烟瘴气了。
! 宝玉不肯论辈分，只论朋友。他一向不把礼法上的尊卑当回事。

# 七、学里的流言和薛蟠
原来这学中虽都是本族人丁与些亲戚的子弟，俗语说的好：“一龙生九种，种种各别。”|原来这学里虽然都是本族和亲戚家的子弟，可俗话说得好：“一龙生九子，个个不一样。”
未免人多了，就有龙蛇混杂，下流人物在内。|人一多，难免龙蛇混杂，里面也有下流的人。
自宝，秦二人来了，都生的花朵儿一般的模样，又见秦钟䩄腆温柔，未语面先红，怯怯羞羞，有女儿之风，|自从宝玉、秦钟来了，两人都长得像花一样好看，又见秦钟腼腆温柔，没开口脸先红，怯生生、羞答答的，有女孩子的样子；
宝玉又是天生成惯能作小服低，赔身下气，情性体贴，话语绵缠，因此二人更加亲厚，也怨不得那起同窗人起了疑，|宝玉又天生惯会低声下气、迁就别人，性情体贴，说话温柔，所以两人越发亲厚。这也难怪那帮同学起了疑心，
背地里你言我语，诟谇谣诼，布满书房内外。|背地里你一句我一句，说三道四，造谣中伤，传得学堂里外到处都是。
原来薛蟠自来王夫人处住后，便知有一家学，学中广有青年子弟，不免偶动了龙阳之兴，因此也假来上学读书，|原来薛蟠自从住到王夫人这边以后，就知道有个家塾，学里有许多年轻子弟，他动了歪心思，所以也假装来上学读书，
不过是三日打鱼，两日晒网，白送些束修礼物与贾代儒，却不曾有一些儿进益，只图结交些契弟。|不过是三天打鱼、两天晒网，白白给贾代儒送些学费礼物，一点长进也没有，只想拉拢几个少年跟他厮混。
谁想这学内就有好几个小学生，图了薛蟠的银钱吃穿，被他哄上手的，也不消多记。|谁想这学里就有好几个小学生，贪图薛蟠的钱财吃穿，被他拉拢了过去，这里也不必细说。
更又有两个多情的小学生，亦不知是那一房的亲眷，亦未考真名姓，只因生得妩媚风流，满学中都送了他两个外号，一号“香怜”，一号“玉爱”。|另外还有两个多情的小学生，不知道是哪一房的亲戚，也没查过真名实姓，只因长得秀美，全学堂都给他俩起了外号，一个叫“香怜”，一个叫“玉爱”。
虽都有窃慕之意，将不利于孺子之心，只是都惧薛蟠的威势，不敢来沾惹。|大家虽然都暗暗打他们的主意，存着坏心，只是都怕薛蟠的势力，不敢去招惹。
! 作者明说“下流人物在内”。宝玉秦钟太亲近，招来流言；薛蟠来学堂根本不为读书，学堂成了藏污纳垢的地方。
! 贾代儒收了学费不管事，薛蟠“白送些束修”就能来去自如，可见义学已经名存实亡。

# 八、四人眉目传情
如今宝，秦二人一来，见了他两个，也不免绻缱羡慕，亦因知系薛蟠相知，故未敢轻举妄动。|现在宝玉、秦钟一来，见了他们俩，也不免心生好感，只因知道他们是薛蟠的朋友，才不敢轻举妄动。
香，玉二人心中，也一般的留情与宝，秦。|香怜、玉爱两人心里，也一样对宝玉、秦钟有好感。
因此四人心中虽有情意，只未发迹。|所以四个人心里虽然互相有意，只是没有表露。
每日一入学中，四处各坐，却八目勾留，或设言托意，或咏桑寓柳，遥以心照，却外面自为避人眼目。|每天一进学堂，四个人各坐一处，八只眼睛却总往一块儿瞟；有时借话传意，有时指桑说槐，远远地心照不宣，表面上还装作避人耳目。
不意偏又有几个滑贼看出形景来，都背后挤眉弄眼，或咳嗽扬声，这也非止一日。|没想到偏偏有几个油滑的家伙看出了苗头，都在背后挤眉弄眼，或者故意大声咳嗽，这样已经不是一天了。
! 这一段写得含蓄，作者用“咏桑寓柳”“遥以心照”，只写到眼神来往为止。
! 那几个“滑贼”起哄，就是后面闹事的引子。

# 九、金荣撞见秦钟和香怜
可巧这日代儒有事，早已回家去了，只留下一句七言对联，命学生对了，明日再来上书，将学中之事，又命贾瑞暂且管理。|正巧这天贾代儒有事，早早回家去了，只留下一句七言对联，叫学生们对好，明天再来上课，学里的事又叫孙子贾瑞暂时管着。
妙在薛蟠如今不大来学中应卯了，因此秦钟趁此和香怜挤眉弄眼，递暗号儿，二人假装出小恭，走至后院说梯己话。|妙的是薛蟠现在不大来学里点卯了，秦钟就趁机和香怜挤眉弄眼，递暗号，两人假装出去小解，走到后院说悄悄话。
秦钟先问他：“家里的大人可管你交朋友不管？”|秦钟先问他：“家里大人管不管你交朋友？”
一语未了，只听背后咳嗽了一声。|话还没说完，只听背后有人咳嗽了一声。
二人唬的忙回头看时，原来是窗友名金荣者。|两人吓得赶紧回头看，原来是同学金荣。
香怜有些性急，羞怒相激，问他道：“你咳嗽什么？|香怜性子有点急，又羞又恼，问他：“你咳嗽什么？
难道不许我两个说话不成？”|难道不许我们两个说话？”
金荣笑道：“许你们说话，难道不许我咳嗽不成？|金荣笑道：“许你们说话，难道就不许我咳嗽？
我只问你们：有话不明说，许你们这样鬼鬼祟祟的干什么故事？|我只问你们：有话不明着说，这样鬼鬼祟祟的干什么勾当？
我可也拿住了，还赖什么！|我可抓住你们了，还赖什么！
先得让我抽个头儿，咱们一声儿不言语，不然大家就奋起来。”|先得分我点好处，咱们就一声不吭；不然，大家就闹开来。”
秦，香二人急的飞红的脸，便问道：“你拿住什么了？”|秦钟、香怜急得满脸通红，问：“你抓住什么了？”
金荣笑道：“我现拿住了是真的。”|金荣笑道：“我现在抓住的可是真的。”
说著，又拍著手笑嚷道：“贴的好烧饼！|说着，又拍着手，笑着嚷出一句挖苦他们的下流话：“贴的好烧饼！
你们都不买一个吃去？”|你们都不去买一个吃？”
! 贾瑞是贾代儒的孙子，第十一、十二回写他对凤姐起了邪念，被凤姐设计害死。
! 金荣要“抽个头儿”，就是要好处才肯闭嘴。他抓住的其实也没什么，只是借题发挥。

# 十、贾瑞偏袒金荣
秦钟香怜二人又气又急，忙进去向贾瑞前告金荣，说金荣无故欺负他两个。|秦钟、香怜又气又急，忙进去向贾瑞告金荣，说金荣无缘无故欺负他们两个。
原来这贾瑞最是个图便宜没行止的人，每在学中以公报私，勒索子弟们请他，后又附助著薛蟠图些银钱酒肉，一任薛蟠横行霸道，他不但不去管约，反助纣为虐讨好儿。|原来这贾瑞最爱占便宜、品行不端，常在学里假公济私，勒索子弟们请他吃喝；后来又巴结薛蟠，图些银钱酒肉，任凭薛蟠横行霸道，他不但不管，反而助纣为虐，讨薛蟠的好。
偏那薛蟠本是浮萍心性，今日爱东，明日爱西，近来又有了新朋友，把香，玉二人又丢开一边。|偏偏薛蟠心性像浮萍一样没定准，今天喜欢东，明天喜欢西，最近又有了新朋友，把香怜、玉爱丢到一边了。
就连金荣亦是当日的好朋友，自有了香，玉二人，便弃了金荣。|连金荣也是他以前的好朋友，自从有了香怜、玉爱，就把金荣甩了。
近日连香，玉亦已见弃。|最近连香怜、玉爱也被甩了。
故贾瑞也无了提携帮衬之人，不说薛蟠得新弃旧，只怨香，玉二人不在薛蟠前提携帮补他，因此贾瑞金荣等一干人，也正在醋妒他两个。|所以贾瑞也没了替他在薛蟠面前说好话的人。他不说薛蟠喜新厌旧，只怨香怜、玉爱不在薛蟠面前帮衬他，因此贾瑞、金荣这一伙人，正在嫉妒他们两个。
今见秦，香二人来告金荣，贾瑞心中便更不自在起来，虽不好呵叱秦钟，却拿著香怜作法，反说他多事，著实抢白了几句。|现在见秦钟、香怜来告金荣，贾瑞心里更不痛快，虽然不好骂秦钟，却拿香怜开刀，反说他多事，狠狠数落了他几句。
香怜反讨了没趣，连秦钟也讪讪的各归坐位去了。|香怜反倒讨了个没趣，连秦钟也讪讪地回到各自的座位上去了。
金荣越发得了意，摇头咂嘴的，口内还说许多闲话，玉爱偏又听了不忿，两个人隔座咕咕唧唧的角起口来。|金荣更得意了，摇头咂嘴，嘴里还说了许多闲话。玉爱听了不服气，两人隔着座位嘀嘀咕咕地吵起嘴来。
金荣只一口咬定说：“方才明明的撞见他两个在后院子里亲嘴摸屁股，一对一肏，撅草根儿抽长短，谁长谁先干。”|金荣一口咬定，说刚才明明撞见他们两个在后院里干下流勾当，嘴里说的全是不堪入耳的脏话。
金荣只顾得意乱说，却不防还有别人。|金荣只顾得意地乱说，却没提防还有别人在听。
! 管学的贾瑞反而偏袒闹事的人，原因全在一个“醋”字和一个“钱”字。
! 原文金荣这句话极其粗俗，作者让他说出来，正是要写这个学堂的下流。

# 十一、贾蔷借刀
谁知早又触怒了一个。|谁知早又惹恼了一个人。
你道这个是谁？|你知道这人是谁？
原来这一个名唤贾蔷，亦系宁府中之正派玄孙，父母早亡，从小儿跟著贾珍过活，如今长了十六岁，比贾蓉生的还风流俊俏。|原来这人叫贾蔷，也是宁府正支的玄孙，父母早亡，从小跟着贾珍过日子，如今十六岁了，长得比贾蓉还要风流俊俏。
他弟兄二人最相亲厚，常相共处。|他跟贾蓉兄弟俩最亲近，常在一起。
宁府人多口杂，那些不得志的奴仆们，专能造言诽谤主人，因此不知又有什么小人诟谇谣诼之词。|宁府人多嘴杂，那些不得志的奴仆专会造谣诽谤主子，所以不知道又有些什么小人编出来的难听话。
贾珍想亦风闻得些口声不大好，自己也要避些嫌疑，如今竟分与房舍，命贾蔷搬出宁府，自去立门户过活去了。|贾珍大概也听到了一些风声，自己也要避避嫌，就分给贾蔷一处房子，让他搬出宁府，自立门户过日子去了。
这贾蔷外相既美，内性又聪明，虽然应名来上学，亦不过虚掩眼目而已。|这贾蔷外表漂亮，心思又聪明，虽然名义上来上学，也不过是装装样子。
仍是斗鸡走狗，赏花玩柳。|照样斗鸡遛狗、寻欢作乐。
总恃上有贾珍溺爱，下有贾蓉匡助，因此族人谁敢来触逆于他。|他仗着上面有贾珍宠爱，下面有贾蓉帮衬，所以族里谁也不敢得罪他。
他既和贾蓉最好，今见有人欺负秦钟，如何肯依？|他跟贾蓉最好，现在见有人欺负贾蓉的小舅子秦钟，哪里肯答应？
如今自己要挺身出来报不平，心中却忖度一番，想道：|他本想自己挺身出来打抱不平，心里却盘算了一番，想道：
“金荣贾瑞一干人，都是薛大叔的相知，向日我又与薛大叔相好，倘或我一出头，他们告诉了老薛，我们岂不伤和气？|“金荣、贾瑞这帮人，都是薛大叔的朋友，我平时又跟薛大叔交好，要是我一出头，他们去告诉老薛，我们岂不伤了和气？
待要不管，如此谣言，说的大家没趣。|要是不管，这种谣言传出去，大家都没面子。
如今何不用计制伏，又止息口声，又伤不了脸面。”|不如用个计策制住他们，既能平息谣言，又伤不了面子。”
想毕，也装作出小恭，走至外面，悄悄的把跟宝玉的书童名唤茗烟者唤到身边，如此这般，调拨他几句。|想好了，也装作出去小解，走到外面，悄悄把宝玉的书童茗烟叫到身边，如此这般，挑唆了他几句。
! 贾蔷从小在宁府长大，也有流言，贾珍为“避嫌”把他打发出去。宁府的事，作者总是点到即止。
! 贾蔷自己不出头，借茗烟的手闹事，聪明，也狡猾。

# 十二、茗烟大闹
这茗烟乃是宝玉第一个得用的，且又年轻不谙世事，如今听贾蔷说金荣如此欺负秦钟，连他爷宝玉都干连在内，不给他个利害，下次越发狂纵难制了。|这茗烟是宝玉最得力的书童，又年轻不懂事。现在听贾蔷说金荣这样欺负秦钟，连他家主子宝玉都牵扯在内，不给金荣点厉害看看，下次就更狂得管不住了。
这茗烟无故就要欺压人的，如今得了这个信，又有贾蔷助著，便一头进来找金荣，也不叫金相公了，只说”姓金的，你是什么东西！”|这茗烟平时没事都要欺负人，现在得了这个消息，又有贾蔷撑腰，就一头冲进来找金荣，也不叫“金相公”了，只说：“姓金的，你是什么东西！”
贾蔷遂跺一跺靴子，故意整整衣服，看看日影儿说：“是时候了。”|贾蔷就跺跺靴子，故意整整衣服，看看太阳影子说：“是时候了。”
遂先向贾瑞说有事要早走一步。|就先跟贾瑞说有事要早走一步。
贾瑞不敢强他，只得随他去了。|贾瑞不敢拦他，只好随他去了。
这里茗烟先一把揪住金荣，问道：“我们肏屁股不肏，管你相干，横竖没肏你爹去罢了！|这边茗烟先一把揪住金荣，骂道：“我们的事关你什么相干！（原文这里是一串极粗的骂人话）
你是好小子，出来动一动你茗大爷！”|你要是好汉，出来跟你茗大爷较量较量！”
唬的满屋中子弟都怔怔的痴望。|吓得满屋子的学生都呆呆地看着。
贾瑞忙吆喝：“茗烟不得撒野！”|贾瑞忙喝道：“茗烟不许撒野！”
金荣气黄了脸，说：“反了！|金荣气得脸都黄了，说：“反了！
奴才小子都敢如此，我只和你主子说。”|一个奴才小子都敢这样，我只跟你主子说。”
便夺手要去抓打宝玉秦钟。|说着就挣开手，要去抓打宝玉和秦钟。
尚未去时，从脑后飕的一声，早见一方砚瓦飞来，并不知系何人打来的，幸未打著，却又打在旁人的座上，这座上乃是贾兰贾菌。|还没过去，只听脑后“嗖”的一声，一块砚台飞了过来，也不知道是谁扔的，幸好没打着人，却落在了别人的座位上，那座位上坐的是贾兰和贾菌。
! 贾蔷挑完事就借口走了，“看看日影儿说是时候了”，装得跟真的一样。
! 一个书童敢揪住主子的同学破口大骂，可见宝玉身边的人仗着主子有多横。

# 十三、全堂大乱
这贾菌亦系荣国府近派的重孙，其母亦少寡，独守著贾菌。|这贾菌也是荣国府近支的重孙，他母亲也是年轻守寡，一个人带着他。
这贾菌与贾兰最好，所以二人同桌而坐。|贾菌和贾兰最要好，所以两人坐同一张桌子。
谁知贾菌年纪虽小，志气最大，极是淘气不怕人的。|谁知贾菌年纪虽小，脾气却最大，特别淘气，谁也不怕。
他在座上冷眼看见金荣的朋友暗助金荣，飞砚来打茗烟，偏没打著茗烟，便落在他桌上，正打在面前，将一个磁砚水壶打了个粉碎，溅了一书黑水。|他在座位上冷眼看见金荣的朋友暗中帮金荣，扔砚台打茗烟，偏偏没打着茗烟，落在了他的桌上，正砸在面前，把一个瓷砚水壶砸得粉碎，墨水溅了一书。
贾菌如何依得，便骂：“好囚攮的们，这不都动了手了么！”|贾菌哪里肯罢休，就骂：“好一群杀胚，这不都动手了吗！”
骂著，也便抓起砚砖来要打回去。|骂着也抓起砚台要砸回去。
贾兰是个省事的，忙按住砚，极口劝道：“好兄弟，不与咱们相干。”|贾兰是个怕事的，忙按住砚台，一个劲儿地劝：“好兄弟，不关咱们的事。”
贾菌如何忍得住，便两手抱起书匣子来，照那边抡了去。|贾菌哪里忍得住，就两手抱起书匣子，朝那边抡过去。
终是身小力薄，却抡不到那里，刚到宝玉秦钟桌案上就落了下来。|到底人小力气弱，抡不了那么远，刚到宝玉、秦钟的桌上就掉了下来。
只听哗啷啷一声，砸在桌上，书本纸片等至于笔砚之物撒了一桌，又把宝玉的一碗茶也砸得碗碎茶流。|只听“哗啦啦”一声，砸在桌上，书本、纸张、笔砚撒了一桌，又把宝玉的一碗茶砸得碗碎茶流。
贾菌便跳出来，要揪打那一个飞砚的。|贾菌就跳出来，要去揪打那个扔砚台的人。
金荣此时随手抓了一根毛竹大板在手，地狭人多，那里经得舞动长板。|金荣这时随手抓起一根毛竹大板，屋子小人又多，哪里经得起挥舞长板。
茗烟早吃了一下，乱嚷：“你们还不来动手！”|茗烟早挨了一下，乱叫：“你们还不来动手！”
宝玉还有三个小厮：一名锄药，一名扫红，一名墨雨。|宝玉还有三个小厮：一个叫锄药，一个叫扫红，一个叫墨雨。
这三个岂有不淘气的，一齐乱嚷：“小妇养的！|这三个哪有不淘气的，一齐乱叫：“狗娘养的！
动了兵器了！”|动家伙了！”
墨雨遂掇起一根门闩，扫红锄药手中都是马鞭子，蜂拥而上。|墨雨就抄起一根门闩，扫红、锄药手里拿着马鞭子，一拥而上。
贾瑞急的拦一回这个，劝一回那个，谁听他的话，肆行大闹。|贾瑞急得拦拦这个、劝劝那个，可谁听他的，大家放开了大闹。
众顽童也有趁势帮著打太平拳助乐的，也有胆小藏在一边的，也有直立在桌上拍著手儿乱笑，喝著声儿叫打的。|学生们有趁机帮着打几拳凑热闹的，有胆小躲在一边的，还有站在桌子上拍手乱笑、喊着叫打的。
登时间鼎沸起来。|学堂里一下子像开了锅一样。
! 贾兰是李纨的儿子，“省事”二字写出他像母亲一样守规矩、不惹事。
! 宝玉的小厮名字也成套：锄药、扫红、墨雨、茗烟（茶烟），都是风雅的名字，干的却是打架的事。
! 一个读书的地方，变成了打群架的战场。贾府子弟的样子，全在这一场里了。

# 十四、李贵劝架
外边李贵等几个大仆人听见里边作起反来，忙都进来一齐喝住。|外面李贵等几个大仆人听见里面闹翻了天，忙都进来一起喝住。
问是何原故，众声不一，这一个如此说，那一个又如彼说。|问是什么缘故，大家说法不一，这个这样说，那个那样说。
李贵且喝骂了茗烟四个一顿，撵了出去。|李贵先把茗烟他们四个骂了一顿，赶了出去。
秦钟的头早撞在金荣的板上，打起一层油皮，宝玉正拿褂襟子替他揉呢，见喝住了众人，便命：“李贵，收书！|秦钟的头早撞在金荣的板子上，擦破了一层皮，宝玉正拿衣襟给他揉，见众人被喝住了，就吩咐：“李贵，收拾书！
拉马来，我去回太爷去！|牵马来，我要去告诉太爷！
我们被人欺负了，不敢说别的，守礼来告诉瑞大爷，瑞大爷反倒派我们的不是，听著人家骂我们，还调唆他们打我们茗烟，连秦钟的头也打破。|我们被人欺负了，不敢说别的，按规矩来告诉瑞大爷，瑞大爷反倒说我们不对，听着别人骂我们，还挑唆他们打我们的茗烟，连秦钟的头都打破了。
这还在这里念什么书！|这还在这里念什么书！
茗烟他也是为有人欺侮我的。|茗烟也是因为有人欺负我才出头的。
不如散了罢。”|不如散了吧。”
李贵劝道：“哥儿不要性急。|李贵劝道：“哥儿别着急。
太爷既有事回家去了，这会子为这点子事去聒噪他老人家，倒显的咱们没理。|太爷既然有事回家了，这时候为这点小事去吵他老人家，倒显得咱们没道理。
依我的主意，那里的事那里了结好，何必去惊动他老人家。|依我看，哪里的事哪里了结最好，何必去惊动他老人家。
这都是瑞大爷的不是，太爷不在这里，你老人家就是这学里的头脑了，众人看著你行事。|这都是瑞大爷的不是。太爷不在，您老人家就是这学里的头儿，大家都看着您怎么办。
众人有了不是，该打的打，该罚的罚，如何等闹到这步田地还不管？”|大家有了错，该打的打、该罚的罚，怎么等闹到这个地步还不管？”
贾瑞道：“我吆喝著都不听。”|贾瑞说：“我喝他们，他们都不听。”
李贵笑道：“不怕你老人家恼我，素日你老人家到底有些不正经，所以这些兄弟才不听。|李贵笑道：“您老人家别怪我说，平时您老人家到底有些不正经，所以这些兄弟才不听您的。
就闹到太爷跟前去，连你老人家也是脱不过的。|真闹到太爷跟前，连您老人家也脱不了干系。
还不快作主意撕罗开了罢。”|还不快拿个主意把事情了结了吧。”
宝玉道：“撕罗什么？|宝玉说：“了结什么？
我必是回去的！”|我一定要回去告状！”
秦钟哭道：“有金荣，我是不在这里念书的。”|秦钟哭着说：“有金荣在，我就不在这里念书了。”
宝玉道：“这是为什么？|宝玉说：“这是为什么？
难道有人家来的，咱们倒来不得？|难道别人家的人来得，咱们倒来不得？
我必回明白众人，撵了金荣去。”|我一定要跟大家说清楚，把金荣赶出去。”
又问李贵：“金荣是那一房的亲戚？”|又问李贵：“金荣是哪一房的亲戚？”
李贵想了一想道：“也不用问了。|李贵想了想说：“也别问了。
若问起那一房的亲戚，更伤了兄弟们的和气。”|要是问起是哪一房的亲戚，更伤兄弟们的和气。”
! 李贵是个明白人：先骂自家人，再说贾瑞的不是，还劝宝玉别闹大。上一回他还把《诗经》念错，这里却最懂事理。
! 宝玉闹着要告状，其实是护着秦钟。

# 十五、茗烟揭金荣的底
茗烟在窗外道：“他是东胡同子里璜大奶奶的侄儿。|茗烟在窗外说：“他是东胡同里璜大奶奶的侄子。
那是什么硬正仗腰子的，也来唬我们。|那算什么硬靠山，也来吓唬我们。
璜大奶奶是他姑娘。|璜大奶奶是他姑妈。
你那姑妈只会打旋磨子，给我们琏二奶奶跪著借当头。|你那姑妈只会围着人转、巴结讨好，给我们琏二奶奶跪着借东西去当。
我眼里就看不起他那样的主子奶奶！”|我眼里就看不起她那样的主子奶奶！”
李贵忙断喝不止，说：“偏你这小狗肏的知道，有这些蛆嚼！”|李贵忙喝止他，骂道：“就你这小兔崽子知道，嚼这些舌根！”
宝玉冷笑道：“我只当是谁的亲戚，原来是璜嫂子的侄儿，我就去问问他来！”|宝玉冷笑道：“我当是谁的亲戚，原来是璜嫂子的侄子，我这就去问问她！”
说著便要走。|说着就要走。
叫茗烟进来包书。|叫茗烟进来包书。
茗烟包著书，又得意道：“爷也不用自己去见，等我到他家，就说老太太有说的话问他呢，雇上一辆车拉进去，当著老太太问他，岂不省事。”|茗烟一边包书，一边得意地说：“爷也不用自己去，等我到她家，就说老太太有话问她，雇辆车把她拉进府，当着老太太的面问她，岂不省事。”
李贵忙喝道：“你要死！|李贵忙喝道：“你找死！
仔细回去我好不好先捶了你，然后再回老爷太太，就说宝玉全是你调唆的。|小心回去我先揍你一顿，再去禀告老爷太太，就说宝玉全是你挑唆的。
我这里好容易劝哄好了一半了，你又来生个新法子。|我这里好不容易劝好了一半，你又来出新花样。
你闹了学堂，不说变法儿压息了才是，倒要往大里闹！”|你闹了学堂，不说想办法平息，倒要往大里闹！”
茗烟方不敢作声儿了。|茗烟这才不敢出声了。
! 茗烟一张嘴就把金荣家底揭了：靠着姑妈巴结凤姐，才进得了这个学堂。
! “跪著借当头”，连主子奶奶都要向凤姐下跪借钱，可见贾家族人里贫富悬殊。

# 十六、金荣磕头
此时贾瑞也怕闹大了，自己也不干净，只得委曲著来央告秦钟，又央告宝玉。|这时贾瑞也怕事情闹大，自己也脱不了干系，只好委委屈屈地来求秦钟，又求宝玉。
先是他二人不肯。|起初他们两人不肯。
后来宝玉说：“不回去也罢了，只叫金荣赔不是便罢。”|后来宝玉说：“不回去告状也行，只要金荣赔个不是就算了。”
金荣先是不肯，后来禁不得贾瑞也来逼他去赔不是，李贵等只得好劝金荣说：“原是你起的端，你不这样，怎得了局？”|金荣起初不肯，后来经不住贾瑞也来逼他赔不是，李贵他们也只好好言劝金荣：“本来就是你挑起来的，你不这样，怎么收场？”
金荣强不得，只得与秦钟作了揖。|金荣拗不过，只好给秦钟作了个揖。
宝玉还不依，偏定要磕头。|宝玉还不答应，一定要他磕头。
贾瑞只要暂息此事，又悄悄的劝金荣说：“俗语说的好：‘杀人不过头点地。’你既惹出事来，少不得下点气儿，磕个头就完事了。”|贾瑞只想把事情暂时压下去，又悄悄劝金荣说：“俗话说得好：‘杀人不过头点地。’你既然惹出事来，就少不得低个头，磕个头就完事了。”
金荣无奈，只得进前来与秦钟磕头。|金荣没办法，只好上前给秦钟磕了头。
且听下回分解。|且听下回分解。
! 宝玉平时惯会“作小服低”，这回却非要金荣磕头不可，为了秦钟，他也会仗势逼人。
! 金荣磕了头，心里却咽不下这口气。下一回他回家一说，又引出他姑妈璜大奶奶来。
</script>
<script type="text/plain" id="ch10">
# 一、金荣越想越气
话说金荣因人多势众，又兼贾瑞勒令，赔了不是，给秦钟磕了头，宝玉方才不吵闹了。|金荣因为对方人多势众，又被贾瑞逼着，赔了不是，给秦钟磕了头，宝玉这才不闹了。
大家散了学，金荣回到家中，越想越气，说：|大家放了学，金荣回到家里，越想越气，说：
“秦钟不过是贾蓉的小舅子，又不是贾家的子孙，附学读书，也不过和我一样。|“秦钟不过是贾蓉的小舅子，又不是贾家的子孙，来附读，也不过跟我一样。
他因仗著宝玉和他好，他就目中无人。|他仗着宝玉跟他好，就目中无人。
他既是这样，就该行些正经事，人也没的说。|他既然这样，就该做些正经事，别人也没话说。
他素日又和宝玉鬼鬼祟祟的，只当人都是瞎子，看不见。|他平时又跟宝玉鬼鬼祟祟的，当别人都是瞎子，看不见。
今日他又去勾搭人，偏偏的撞在我眼睛里。|今天他又去勾搭人，偏偏被我撞见了。
就是闹出事来，我还怕什么不成？”|就算闹出事来，我还怕什么不成？”
! 金荣说秦钟“又不是贾家的子孙”，可他自己也只是贾家亲戚的侄儿。他气的不是秦钟，是秦钟有宝玉撑腰。

# 二、胡氏劝儿子
他母亲胡氏听见他咕咕嘟嘟的说，因问道：“你又要争什么闲气？|他母亲胡氏听见他嘟嘟囔囔的，就问：“你又要争什么闲气？
好容易我望你姑妈说了，你姑妈千方百计的才向他们西府里的琏二奶奶跟前说了，你才得了这个念书的地方。|我好不容易求了你姑妈，你姑妈又想尽办法到西府的琏二奶奶跟前说了，你才得了这个念书的地方。
若不是仗著人家，咱们家里还有力量请的起先生？|要不是靠着人家，咱们家哪有能力请得起先生？
况且人家学里，茶也是现成的，饭也是现成的。|况且人家学里，茶是现成的，饭也是现成的。
你这二年在那里念书，家里也省好大的嚼用呢。|你这两年在那里念书，家里也省了好大一笔吃喝开销。
省出来的，你又爱穿件鲜明衣服。|省下来的钱，你又爱穿件光鲜衣服。
再者，不是因你在那里念书，你就认得什么薛大爷了？|再说，要不是你在那里念书，你能认识什么薛大爷？
那薛大爷一年补给补给，这二年也帮了咱们有七八十两银子。|那薛大爷一年贴补贴补，这两年也帮了咱们七八十两银子。
你如今要闹出了这个学房，再要找这么个地方，我告诉你说罢，比登天还难呢！|你现在要是闹得离开了这个学堂，再想找这么个地方，我告诉你，比登天还难！
你给我老老实实的顽一会子睡你的觉去，好多著呢。”|你给我老老实实地玩一会儿，就去睡你的觉，这样好多了。”
于是金荣忍气吞声，不多一时他自去睡了。|于是金荣忍气吞声，不一会儿自己去睡了。
次日仍旧上学去了。|第二天照旧上学去了。
不在话下。|这里不多说。
! 胡氏一笔一笔算账：茶饭省了，衣服有了，薛大爷还给了七八十两。穷亲戚靠着贾府的边角过日子，哪里敢争闲气。
! 薛蟠给金荣钱，是为什么，上一回已经说过了。胡氏只看见银子。

# 三、璜大奶奶
且说他姑娘，原聘给的是贾家玉字辈的嫡派，名唤贾璜。|再说金荣的姑妈，嫁的是贾家“玉”字辈的嫡系子孙，名叫贾璜。
但其族人那里皆能象宁荣二府的富势，原不用细说。|可贾家族人哪能都像宁荣二府那么有钱有势，这本来不用细说。
这贾璜夫妻守著些小的产业，又时常到宁荣二府里去请请安，又会奉承凤姐儿并尤氏，所以凤姐儿尤氏也时常资助资助他，方能如此度日。|贾璜夫妻守着一点小家业，又常到宁荣二府去请请安，又会奉承凤姐和尤氏，所以凤姐、尤氏也常资助他们，才能这样过日子。
今日正遇天气晴明，又值家中无事，遂带了一个婆子，坐上车，来家里走走，瞧瞧寡嫂并侄儿。|这天天气晴朗，家里又没事，她就带了一个婆子，坐上车，回娘家走走，看看守寡的嫂子和侄子。
闲话之间，金荣的母亲偏提起昨日贾家学房里的那事，从头至尾，一五一十都向他小姑子说了。|闲聊的时候，金荣的母亲偏偏提起昨天贾家学堂里的那件事，从头到尾一五一十都跟小姑子说了。
这璜大奶奶不听则已，听了，一时怒从心上起，说道：|这璜大奶奶不听还好，一听，顿时怒从心头起，说：
“这秦钟小崽子是贾门的亲戚，难道荣儿不是贾门的亲戚？|“这秦钟小崽子是贾家的亲戚，难道荣儿就不是贾家的亲戚？
人都别忒势利了，况且都作的是什么有脸的好事！|人都别太势利了，何况他们干的是什么有脸面的好事！
就是宝玉，也犯不上向著他到这个样。|就是宝玉，也犯不着这么护着他。
等我去到东府瞧瞧我们珍大奶奶，再向秦钟他姐姐说说，叫他评评这个理。”|等我去东府看看我们珍大奶奶，再跟秦钟他姐姐说说，叫她评评这个理。”
这金荣的母亲听了这话，急的了不得，忙说道：“这都是我的嘴快，告诉了姑奶奶了，求姑奶奶别去，别管他们谁是谁非。|金荣的母亲听了这话，急得不得了，忙说：“都怪我嘴快，告诉了姑奶奶。求姑奶奶别去，别管他们谁对谁错。
倘或闹起来，怎么在那里站得住。|要是闹起来，荣儿怎么在那里待得下去。
若是站不住，家里不但不能请先生，反倒在他身上添出许多嚼用来呢。”|要是待不下去，家里不但请不起先生，反倒还要在他身上多出许多花销。”
璜大奶奶听了，说道：“那里管得许多，你等我说了，看是怎么样！”|璜大奶奶听了说：“哪管得了那么多，你等我去说了，看会怎么样！”
也不容他嫂子劝，一面叫老婆子瞧了车，就坐上往宁府里来。|也不让嫂子再劝，一面叫婆子去看车，就坐上车往宁府去了。
! 茗烟说她“给我们琏二奶奶跪著借当头”，这里作者也说她靠“奉承凤姐儿并尤氏”过日子。
! 回目里的“金寡妇”，一般认为是金荣守寡的母亲胡氏：她为了贪图好处，宁可叫儿子忍气吞声。

# 四、尤氏说秦氏的病
到了宁府，进了车门，到了东边小角门前下了车，进去见了贾珍之妻尤氏。|到了宁府，进了车门，在东边小角门前下了车，进去见贾珍的妻子尤氏。
也未敢气高，殷殷勤勤叙过寒温，说了些闲话，方问道：“今日怎么没见蓉大奶奶？”|她也不敢气势太盛，殷殷勤勤地问候了冷暖，说了些闲话，才问：“今天怎么没见蓉大奶奶？”
尤氏说道：“他这些日子不知怎么著，经期有两个多月没来。|尤氏说：“她这些日子不知道怎么了，月经有两个多月没来了。
叫大夫瞧了，又说并不是喜。|叫大夫看了，又说不是怀孕。
那两日，到了下半天就懒待动，话也懒待说，眼神也发眩。|那两天，一到下午就懒得动，话也懒得说，眼睛也发花。
我说他：‘你且不必拘礼，早晚不必照例上来，你就好生养养罢。|我跟她说：‘你先别拘礼，早晚不必照规矩来请安，你就好好养着吧。
就是有亲戚一家儿来，有我呢。|就是有亲戚来了，有我呢。
就有长辈们怪你，等我替你告诉。’|就算长辈们怪你，我替你去说。’
连蓉哥我都嘱咐了，我说：‘你不许累掯他，不许招他生气，叫他静静的养养就好了。|连蓉哥我都嘱咐了，我说：‘你不许为难她，不许惹她生气，让她静静养着就好了。
他要想什么吃，只管到我这里取来。|她想吃什么，只管到我这里来拿。
倘或我这里没有，只管望你琏二婶子那里要去。|要是我这里没有，只管到你琏二婶子那里去要。
倘或他有个好和歹，你再要娶这么一个媳妇，这么个模样儿，这么个性情的人儿，打著灯笼也没地方找去。’|要是她有个三长两短，你再想娶这样一个媳妇，这样的模样、这样的性情，打着灯笼也没处找去。’
他这为人行事，那个亲戚，那个一家的长辈不喜欢他？|她的为人处事，哪个亲戚、哪个长辈不喜欢她？
所以我这两日好不烦心，焦的我了不得。|所以我这两天烦得很，急得不得了。
偏偏今日早晨他兄弟来瞧他，谁知那小孩子家不知好歹，看见他姐姐身上不大爽快，就有事也不当告诉他，别说是这么一点子小事，就是你受了一万分的委曲，也不该向他说才是。|偏偏今天早上她弟弟来看她，谁知那孩子不懂事，看见姐姐身体不舒服，就算有事也不该告诉她；别说是这么点小事，就算受了一万分的委屈，也不该跟她说。
谁知他们昨儿学房里打架，不知是那里附学来的一个人欺侮了他了。|谁知道他们昨天在学堂里打架，不知是哪里来附读的一个人欺负了他。
里头还有些不干不净的话，都告诉了他姐姐。|里面还有些不干不净的话，他都告诉了他姐姐。
婶子，你是知道那媳妇的：虽则见了人有说有笑，会行事儿，他可心细，心又重，不拘听见个什么话儿，都要度量个三日五夜才罢。|婶子，你是知道这个媳妇的：她虽然见了人有说有笑，会办事，可她心细，心思又重，不管听到什么话，都要琢磨个三天五夜才罢休。
这病就是打这个秉性上头思虑出来的。|这病就是从这个性子上想出来的。
今儿听见有人欺负了他兄弟，又是恼，又是气。|今天听说有人欺负她弟弟，又恼又气。
恼的是那群混帐狐朋狗友的扯是搬非，调三惑四的那些人，气的是他兄弟不学好，不上心念书，以致如此学里吵闹。|恼的是那帮混账的狐朋狗友搬弄是非、挑拨离间；气的是她弟弟不学好，不用心念书，才弄得在学里吵闹。
他听了这事，今日索性连早饭也没吃。|她听了这事，今天干脆连早饭都没吃。
我听见了，我方到他那边安慰了他一会子，又劝解了他兄弟一会子。|我听说了，才到她那边安慰了她一阵，又劝了她弟弟一阵。
我叫他兄弟到那边府里找宝玉去了，我才看著他吃了半盏燕窝汤，我才过来了。|我叫她弟弟到那边府里找宝玉去了，又看着她喝了半碗燕窝汤，我才过来的。
婶子，你说我心焦不心焦？|婶子，你说我心急不心急？
况且如今又没个好大夫，我想到他这病上，我心里倒象针扎似的。|况且现在又没个好大夫，我一想到她这病，心里就像针扎一样。
你们知道有什么好大夫没有？”|你们知道有什么好大夫没有？”
! 尤氏对儿媳的疼爱，说得滔滔不绝。她连“打著灯笼也没地方找去”都说出来了，秦可卿在宁府的分量可见一斑。
! 秦氏“心细，心又重”，什么话都要“度量个三日五夜”。焦大那句醉话，她未必没听见。

# 五、璜大奶奶的气没了
金氏听了这半日话，把方才在他嫂子家的那一团要向秦氏理论的盛气，早吓的都丢在爪洼国去了。|金氏听了这半天话，刚才在嫂子家那股要找秦氏理论的气焰，早吓得丢到爪哇国去了。
听见尤氏问他有知道好大夫的话，连忙答道：“我们这么听著，实在也没见人说有个好大夫。|听尤氏问她知不知道好大夫，连忙回答：“我们这样听来听去，实在也没听人说有什么好大夫。
如今听起大奶奶这个来，定不得还是喜呢。|现在听大奶奶这么一说，说不定还是怀孕呢。
嫂子倒别教人混治。|嫂子可别叫人乱治。
倘或认错了，这可是了不得的。”|要是认错了，那可不得了。”
尤氏道：“可不是呢。”|尤氏说：“可不是嘛。”
正是说话间，贾珍从外进来，见了金氏，便向尤氏问道：“这不是璜大奶奶么？”|正说着，贾珍从外面进来，见了金氏，就问尤氏：“这不是璜大奶奶吗？”
金氏向前给贾珍请了安。|金氏上前给贾珍请安。
贾珍向尤氏说道：“让这大妹妹吃了饭去。”|贾珍对尤氏说：“让这位大妹妹吃了饭再走。”
贾珍说著话，就过那屋里去了。|贾珍说着话，就到那边屋里去了。
金氏此来，原要向秦氏说说秦钟欺负了他侄儿的事，听见秦氏有病，不但不能说，亦且不敢提了。|金氏这次来，本想找秦氏说说秦钟欺负她侄子的事，听说秦氏病了，不但不能说，连提都不敢提了。
况且贾珍尤氏又待的很好，反转怒为喜，又说了一会子话儿，方家去了。|况且贾珍、尤氏又待她很好，她反倒转怒为喜，又聊了一会儿，才回家去了。
! 璜大奶奶气势汹汹而来，一个字没敢说，吃了顿饭就转怒为喜地走了。她也靠宁荣二府接济过日子，“贪利”二字同样说中了她的软处。
! 金荣挨的欺负，最后不了了之。在贾府，穷亲戚的委屈连说出口的机会都没有。

# 六、贾珍请来张友士
金氏去后，贾珍方过来坐下，问尤氏道：“今日他来，有什么说的事情么？”|金氏走后，贾珍才过来坐下，问尤氏：“她今天来，有什么事要说吗？”
尤氏答道：“倒没说什么。|尤氏回答：“倒没说什么。
一进来的时候，脸上倒象有些著了恼的气色似的，及说了半天话，又提起媳妇这病，他倒渐渐的气色平定了。|刚进来的时候，脸上倒像有点生气的样子，等说了半天话，又提起媳妇的病，她的脸色倒渐渐平和了。
你又叫让他吃饭，他听见媳妇这么病，也不好意思只管坐著，又说了几句闲话儿就去了，倒没求什么事。|你又叫留她吃饭，她听说媳妇病成这样，也不好意思一直坐着，又说了几句闲话就走了，倒没求什么事。
如今且说媳妇这病，你到那里寻一个好大夫来与他瞧瞧要紧，可别耽误了。|现在先说媳妇的病，你到哪里找个好大夫来给她看看才要紧，可别耽误了。
现今咱们家走的这群大夫，那里要得，一个个都是听著人的口气儿，人怎么说，他也添几句文话儿说一遍。|现在咱们家来往的这帮大夫，哪里中用，一个个都是听着别人的口气，别人怎么说，他就添几句文绉绉的话再说一遍。
可倒殷勤的很，三四个人一日轮流著倒有四五遍来看脉。|殷勤倒是很殷勤，三四个人一天轮流来看四五遍脉。
他们大家商量著立个方子，吃了也不见效，倒弄得一日换四五遍衣裳，坐起来见大夫，其实于病人无益。”|他们大家商量着开个方子，吃了也不见效，倒弄得她一天换四五遍衣服，坐起来见大夫，其实对病人一点好处都没有。”
贾珍说道：“可是。|贾珍说：“可不是。
这孩子也糊涂，何必脱脱换换的，倘再著了凉，更添一层病，那还了得。|这孩子也糊涂，何必脱了换、换了脱的，要是再着了凉，又添一层病，那还了得。
衣裳任凭是什么好的，可又值什么，孩子的身子要紧，就是一天穿一套新的，也不值什么。|衣服不管多好，又值什么，孩子的身子要紧，就是一天穿一套新的，也不算什么。
我正进来要告诉你：方才冯紫英来看我，他见我有些抑郁之色，问我是怎么了。|我正要进来告诉你：刚才冯紫英来看我，见我有些愁眉不展，问我怎么了。
我才告诉他说，媳妇忽然身子有好大的不爽快，因为不得个好太医，断不透是喜是病，又不知有妨碍无妨碍，所以我这两日心里著实著急。|我就告诉他，媳妇忽然身子很不舒服，因为找不到好大夫，断不准是怀孕还是生病，又不知道要不要紧，所以我这两天心里实在着急。
冯紫英因说起他有一个幼时从学的先生，姓张名友士，学问最渊博的，更兼医理极深，且能断人的生死。|冯紫英就说起他小时候跟着读书的一位先生，姓张名友士，学问最渊博，医术又极精深，还能断定人的生死。
今年是上京给他儿子来捐官，现在他家住著呢。|今年是进京来给他儿子捐官的，现在就住在冯家。
这么看来，竟是合该媳妇的病在他手里除灾亦未可知。|这么看来，说不定媳妇的病就该在他手里好起来。
我即刻差人拿我的名帖请去了。|我马上派人拿我的名帖去请了。
今日倘或天晚了不能来，明日想必一定来。|今天要是天晚了来不了，明天想必一定来。
况且冯紫英又即刻回家亲自去求他，务必叫他来瞧瞧。|况且冯紫英又马上回家亲自去求他，一定叫他来看看。
等这个张先生来瞧了再说罢。”|等这位张先生来看了再说吧。”
! 贾珍对儿媳的病，比对什么都上心，说“一天穿一套新的，也不值什么”。这份着急，跟第七回焦大的醉话连起来看，就别有意味了。
! 张友士是“上京给他儿子来捐官”的。“捐官”就是花钱买官，书里连医生都在跑官。

# 七、贾敬的寿日
尤氏听了，心中甚喜，因说道：“后日是太爷的寿日，到底怎么办？”|尤氏听了，心里很高兴，又说：“后天是太爷的生日，到底怎么办？”
贾珍说道：“我方才到了太爷那里去请安，兼请太爷来家来受一受一家子的礼。|贾珍说：“我刚才到太爷那里去请安，顺便请太爷回家来受一受全家的礼。
太爷因说道：‘我是清净惯了的，我不愿意往你们那是非场中去闹去。|太爷说：‘我清静惯了，不愿意到你们那是非之地去闹。
你们必定说是我的生日，要叫我去受众人些头，莫过你把我从前注的《阴骘文》给我令人好好的写出来刻了，比叫我无故受众人的头还强百倍呢。|你们一定说是我的生日，要叫我去受大家的磕头，还不如把我以前注的《阴骘文》叫人好好抄写出来刻印了，比叫我白白受大家磕头强一百倍。
倘或后日这两日一家子要来，你就在家里好好的款待他们就是了。|要是后天这两天一家人要来，你就在家里好好招待他们就是了。
也不必给我送什么东西来，连你后日也不必来，你要心中不安，你今日就给我磕了头去。|也不必给我送什么东西，连你后天也不必来。你要是心里不安，今天就给我磕了头走。
倘或后日你要来，又跟随多少人来闹我，我必和你不依。’|要是后天你还来，又带一大帮人来吵我，我一定饶不了你。’
如此说了又说，后日我是再不敢去的了。|这样说了又说，后天我是再也不敢去了。
且叫来升来，吩咐他预备两日的筵席。”|先叫来升来，吩咐他准备两天的酒席。”
尤氏因叫人叫了贾蓉来：“吩咐来升照旧例预备两日的筵席，要丰丰富富的。|尤氏就叫人把贾蓉叫来：“吩咐来升照老规矩准备两天的酒席，要丰丰盛盛的。
你再亲自到西府里去请老太太，大太太，二太太和你琏二婶子来逛逛。|你再亲自到西府去请老太太、大太太、二太太和你琏二婶子来逛逛。
你父亲今日又听见一个好大夫，业已打发人请去了，想必明日必来。|你父亲今天又打听到一个好大夫，已经派人去请了，想来明天一定来。
你可将他这些日子的病症细细的告诉他。”|你可把她这些日子的病情仔细告诉大夫。”
! 太爷就是贾珍的父亲贾敬，一心修道炼丹，住在城外道观里，家事全不管。第五回《好事终》里“箕裘颓堕皆从敬”说的就是他。
! 他嫌家里是“是非场”，可这是非场正是他撒手不管才变成这样的。
! 寿日照样要摆两天酒席，主角不来，宴席照开。

# 八、张先生明日来
贾蓉一一的答应著出去了。|贾蓉一一答应着出去了。
正遇著方才去冯紫英家请那先生的小子回来了，因回道：|正碰上刚才去冯紫英家请那位先生的小厮回来了，回禀说：
“奴才方才到了冯大爷家，拿了老爷的名帖请那先生去。|“奴才刚才到了冯大爷家，拿老爷的名帖去请那位先生。
那先生说道：‘方才这里大爷也向我说了。|那先生说：‘刚才这里的冯大爷也跟我说了。
但是今日拜了一天的客，才回到家，此时精神实在不能支持，就是去到府上也不能看脉。’|只是今天拜了一天的客，才回到家，现在精神实在撑不住了，就是去了府上也没法看脉。’
他说等调息一夜，明日务必到府。|他说等休息一夜，明天一定到府上来。
他又说，他‘医学浅薄，本不敢当此重荐，因我们冯大爷和府上的大人既已如此说了，又不得不去，你先替我回明大人就是了。|他又说，他‘医术浅薄，本来不敢当这么郑重的推荐，可冯大爷和府上的大人既然这么说了，又不得不去，你先替我回禀大人就是了。
大人的名帖实不敢当。’|大人的名帖实在不敢当。’
仍叫奴才拿回来了。|还是叫奴才把名帖拿回来了。
哥儿替奴才回一声儿罢。”|哥儿替奴才回禀一声吧。”
贾蓉转身复进去，回了贾珍尤氏的话，方出来叫了来升来，吩咐他预备两日的筵席的话。|贾蓉转身又进去，把话回给了贾珍、尤氏，才出来叫来升，吩咐他准备两天酒席的事。
来升听毕，自去照例料理。|来升听完，自己照规矩去办了。
不在话下。|这里不多说。
! 张友士说精神不济、不能看脉，正说明他看病认真。跟尤氏说的那帮“一日四五遍来看脉”的大夫正好相反。

# 九、张友士诊脉
且说次日午间，人回道：“请的那张先生来了。”|第二天中午，有人来报：“请的那位张先生来了。”
贾珍遂延入大厅坐下。|贾珍就请他到大厅坐下。
茶毕，方开言道：“昨承冯大爷示知老先生人品学问，又兼深通医学，小弟不胜钦仰之至。”|喝过茶，贾珍才开口说：“昨天承蒙冯大爷告诉我老先生的人品学问，又精通医术，小弟敬仰极了。”
张先生道：“晚生粗鄙下士，本知见浅陋，昨因冯大爷示知，大人家第谦恭下士，又承呼唤，敢不奉命。|张先生说：“晚生是个粗俗的读书人，见识浅陋。昨天听冯大爷说，大人府上谦恭待人，又承蒙召唤，怎敢不来。
但毫无实学，倍增颜汗。”|只是我没有真才实学，实在惭愧。”
贾珍道：“先生何必过谦。|贾珍说：“先生何必过谦。
就请先生进去看看儿妇，仰仗高明，以释下怀。”|就请先生进去看看儿媳妇，仰仗您的高明，好让我放心。”
于是，贾蓉同了进去。|于是贾蓉陪着他进去了。
到了贾蓉居室，见了秦氏，向贾蓉说道：“这就是尊夫人了？”|到了贾蓉的卧室，见了秦氏，张先生对贾蓉说：“这就是尊夫人吧？”
贾蓉道：“正是。|贾蓉说：“正是。
请先生坐下，让我把贱内的病说一说再看脉如何？”|请先生坐下，让我先把内人的病说一说，再看脉，怎么样？”
那先生道：“依小弟的意思，竟先看过脉再说的为是。|张先生说：“依小弟的意思，还是先看过脉再说为好。
我是初造尊府的，本也不晓得什么，但是我们冯大爷务必叫小弟过来看看，小弟所以不得不来。|我是第一次到府上来，本来也不懂什么，只是冯大爷一定要小弟过来看看，小弟才不得不来。
如今看了脉息，看小弟说的是不是，再将这些日子的病势讲一讲，大家斟酌一个方儿，可用不可用，那时大爷再定夺。”|现在先看脉，看小弟说得对不对，再把这些日子的病情讲一讲，大家斟酌一个方子，能不能用，那时大爷再决定。”
贾蓉道：“先生实在高明，如今恨相见之晚。|贾蓉说：“先生实在高明，真恨见面太晚。
就请先生看一看脉息，可治不可治，以便使家父母放心。”|就请先生看看脉，能治不能治，好让家父家母放心。”
于是家下媳妇们捧过大迎枕来，一面给秦氏拉著袖口，露出脉来。|于是家里的媳妇们捧过一个大靠枕来，一边给秦氏拉起袖口，露出手腕。
先生方伸手按在右手脉上，调息了至数，宁神细诊了有半刻的工夫，方换过左手，亦复如是。|先生才伸手按在她右手的脉上，调匀自己的呼吸，静下心来仔细诊了半刻钟，又换到左手，也是这样。
诊毕脉息，说道：“我们外边坐罢。”|诊完了脉，说：“我们到外面坐吧。”
! 张友士坚持先诊脉、不先听病情，就是要凭本事说话，不像那些“听著人的口气儿”的大夫。

# 十、张友士论病
贾蓉于是同先生到外间房里床上坐下，一个婆子端了茶来。|贾蓉就陪先生到外间屋里的床上坐下，一个婆子端来茶。
贾蓉道：“先生请茶。”|贾蓉说：“先生请喝茶。”
于是陪先生吃了茶，遂问道：“先生看这脉息，还治得治不得？”|陪先生喝了茶，就问：“先生看这脉，还能治吗？”
先生道：“看得尊夫人这脉息：左寸沉数，左关沉伏，右寸细而无力，右关虚而无神。|先生说：“我看尊夫人的脉象：左手寸脉沉而快，左手关脉沉而伏，右手寸脉细而无力，右手关脉虚而无神。
其左寸沉数者，乃心气虚而生火，左关沉伏者，乃肝家气滞血亏。|左寸沉而快，是心气虚而生了火；左关沉而伏，是肝气郁滞、血不足。
右寸细而无力者，乃肺经气分太虚，右关虚而无神者，乃脾土被肝木克制。|右寸细而无力，是肺气太虚；右关虚而无神，是脾土被肝木克制了。
心气虚而生火者，应现经期不调，夜间不寐。|心气虚而生火，就应该有月经不调、夜里睡不着的症状。
肝家血亏气滞者，必然肋下疼胀，月信过期，心中发热。|肝血亏、肝气滞，一定会肋下胀痛、月经推迟、心里发热。
肺经气分太虚者，头目不时眩晕，寅卯间必然自汗，如坐舟中。|肺气太虚，就会时常头晕眼花，清晨寅卯时分（凌晨三点到七点）一定会出虚汗，像坐在船上一样晃晃悠悠。
脾土被肝木克制者，必然不思饮食，精神倦怠，四肢酸软。|脾被肝克制，一定吃不下饭，精神疲倦，四肢酸软。
据我看这脉息，应当有这些症候才对。|照我看这脉象，应该有这些症状才对。
或以这个脉为喜脉，则小弟不敢从其教也。”|要是有人把这个脉当成喜脉，小弟可不敢赞同。”
旁边一个贴身伏侍的婆子道：“何尝不是这样呢。|旁边一个贴身伺候的婆子说：“可不就是这样嘛。
真正先生说的如神，倒不用我们告诉了。|先生真是说得神了，倒不用我们说了。
如今我们家里现有好几位太医老爷瞧著呢，都不能的当真切的这么说。|现在我们家有好几位太医老爷在看，都没有说得这么准、这么透的。
有一位说是喜，有一位说是病，这位说不相干，那位说怕冬至，总没有个准话儿。|有一位说是怀孕，有一位说是病；这位说不要紧，那位说怕过不了冬至，总没有个准话。
求老爷明白指示指示。”|求老爷明明白白地指点指点。”
! 中医讲五行生克：肝属木，脾属土，“木克土”就是肝气太旺压住了脾。张友士用的是正经的中医道理。
! “那位说怕冬至”，一句随口的话，却埋下了不祥的影子。

# 十一、病源：思虑太过
那先生笑道：“大奶奶这个症候，可是那众位耽搁了。|张先生笑道：“大奶奶这个病，是被那几位耽误了。
要在初次行经的日期就用药治起来，不但断无今日之患，而且此时已全愈了。|要是在第一次月经不调的时候就用药治，不但绝不会有今天的病，而且这时早就好了。
如今既是把病耽误到这个地位，也是应有此灾。|现在既然把病耽误到这个地步，也是命中该有这场灾。
依我看来，这病尚有三分治得。|依我看，这病还有三分把握能治。
吃了我的药看，若是夜里睡的著觉，那时又添了二分拿手了。|先吃我的药看看，要是夜里能睡着觉，那就又多了两分把握。
据我看这脉息：大奶奶是个心性高强聪明不过的人，聪明忒过，则不如意事常有，不如意事常有，则思虑太过。|照我看这脉象：大奶奶是个心气高、聪明极了的人。太聪明了，不如意的事就常有；不如意的事常有，就会思虑太多。
此病是忧虑伤脾，肝木忒旺，经血所以不能按时而至。|这病是忧虑伤了脾，肝气又太旺，所以月经不能按时来。
大奶奶从前的行经的日子问一问，断不是常缩，必是常长的。|问问大奶奶以前的月经日子，一定不是常提前，而是常推后的。
是不是？”|是不是？”
这婆子答道：“可不是，从没有缩过，或是长两日三日，以至十日都长过。”|那婆子回答：“可不是，从来没提前过，有时推后两三天，甚至推后过十天。”
先生听了道：“妙啊！|先生听了说：“对了！
这就是病源了。|这就是病根了。
从前若能够以养心调经之药服之，何至于此。|以前要是能吃些养心调经的药，哪会到这个地步。
这如今明显出一个水亏木旺的症候来。|现在已经明显是个水亏木旺的病症了。
待用药看看。”|先用药看看吧。”
于是写了方子，递与贾蓉，上写的是：|于是写了方子，递给贾蓉，上面写着：
益气养荣补脾和肝汤|【益气养荣补脾和肝汤】
人参二钱、白术二钱、土炒云苓三钱、熟地四钱、归身二钱、酒洗白芍二钱、炒川芎钱半、黄苓三钱、香附米二钱、制醋柴胡八分、怀山药二钱、炒真阿胶二钱、蛤粉炒延胡索钱半、酒炒炙甘草八分，引用建莲子七粒去心、红枣二枚。|人参二钱、白术二钱、土炒茯苓三钱、熟地四钱、当归身二钱、酒洗白芍二钱、炒川芎一钱半、黄芩三钱、香附二钱、醋制柴胡八分、山药二钱、炒阿胶二钱、蛤粉炒延胡索一钱半、酒炒炙甘草八分；药引用去心的建莲子七粒、红枣两枚。
! “心性高强聪明不过”“思虑太过”，张友士说的不只是病，也是秦可卿这个人。
! 只有“三分治得”。名医都这么说，秦氏的结局已经很清楚了。
! 这张方子是用来补气血、健脾、疏肝的，药方本身合乎中医道理。不少学者认为作者懂医。

# 十二、“过了春分，就可望全愈”
贾蓉看了，说：“高明的很。|贾蓉看了说：“高明得很。
还要请教先生，这病与性命终久有妨无妨？”|还要请教先生，这病到底会不会危及性命？”
先生笑道：“大爷是最高明的人。|先生笑道：“大爷是最聪明的人。
人病到这个地位，非一朝一夕的症候，吃了这药也要看医缘了。|人病到这个地步，不是一天两天的毛病了，吃了这药也要看缘分。
依小弟看来，今年一冬是不相干的。|依小弟看，今年冬天是不要紧的。
总是过了春分，就可望全愈了。”|总要过了春分，才有望痊愈。”
贾蓉也是个聪明人，也不往下细问了。|贾蓉也是个聪明人，就不再往下细问了。
于是贾蓉送了先生去了，方将这药方子并脉案都给贾珍看了，说的话也都回了贾珍并尤氏了。|于是贾蓉送走了先生，才把药方和脉案都拿给贾珍看，先生说的话也都告诉了贾珍和尤氏。
尤氏向贾珍说道：“从来大夫不象他说的这么痛快，想必用的药也不错。”|尤氏对贾珍说：“从来没有大夫像他说得这么痛快，想来用的药也不会错。”
贾珍道：“人家原不是混饭吃久惯行医的人。|贾珍说：“人家本来就不是靠行医混饭吃的人。
因为冯紫英我们好，他好容易求了他来了。|因为冯紫英跟我们好，他好不容易才把他求来的。
既有这个人，媳妇的病或者就能好了。|既然有这个人，媳妇的病也许就能好了。
他那方子上有人参，就用前日买的那一斤好的罢。”|他那方子上有人参，就用前几天买的那一斤好的吧。”
贾蓉听毕话，方出来叫人打药去煎给秦氏吃。|贾蓉听完，才出来叫人去抓药，煎给秦氏吃。
不知秦氏服了此药病势如何，下回分解。|不知秦氏吃了这药病情怎么样，下回分解。
! “今年一冬是不相干的”“过了春分就可望全愈”，听着是宽慰，其实是在说：这个冬天熬得过，春分就难说了。贾蓉“也不往下细问了”，是听懂了。
! 秦可卿到第十三回就死了。张友士的话，句句都是预言。
</script>

function parse(text){
  const secs=[]; let cur=null;
  for(const raw of text.split("\n")){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith("# ")){ cur={title:line.slice(2),pairs:[],notes:[]}; secs.push(cur); continue; }
    if(line.startsWith("! ")){ cur.notes.push(line.slice(2)); continue; }
    let poem=false, l=line;
    if(l.startsWith("~")){ poem=true; l=l.slice(1); }
    const i=l.indexOf("|");
    cur.pairs.push({yw:l.slice(0,i), bh:l.slice(i+1), poem});
  }
  return secs;
}

function render(id){
  const app=document.getElementById("app");
  const idx=CHAPTERS.findIndex(c=>c.id===id);
  const ch=CHAPTERS[idx];
  let h=`<div class="hero"><h1>${ch.n}</h1><div>${ch.title}</div><div class="sub">一句原文 · 一句白话 · 伏笔与深意</div></div>`;
  const src=document.getElementById(id);
  if(!src){
    h+=`<div class="soon">本回正在整理中，敬请期待。</div>`;
  } else {
    const secs=parse(src.textContent);
    h+=`<nav class="toc"><b>本回目录</b>`+secs.map((s,i)=>`<a href="#${id}-s${i}">${esc(s.title)}</a>`).join("")+`</nav>`;
    secs.forEach((s,i)=>{
      h+=`<section class="sec"><h2 id="${id}-s${i}">${esc(s.title)}</h2>`;
      for(const p of s.pairs){
        h+=`<div class="pair"><div class="yw${p.poem?" poem":""}">${esc(p.yw)}</div><div class="bh">${esc(p.bh)}</div></div>`;
      }
      if(s.notes.length){
        h+=`<div class="note"><h3>伏笔与深意</h3><ul>${s.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`;
      }
      h+=`</section>`;
    });
  }
  const prev=CHAPTERS[idx-1], next=CHAPTERS[idx+1];
  h+=`<div class="pager"><span>${prev?`<a href="#${prev.id}">← ${prev.n}</a>`:""}</span><span>${next?`<a href="#${next.id}">${next.n} →</a>`:""}</span></div>`;
  app.innerHTML=h;
  document.getElementById("chap").value=id;
}

function route(){
  const hash=location.hash.slice(1);
  const chId=(hash.match(/^ch\d+/)||[])[0];
  const id=CHAPTERS.some(c=>c.id===chId)?chId:"ch1";
  if(document.getElementById("app").dataset.ch!==id){
    render(id); document.getElementById("app").dataset.ch=id;
    if(!hash.includes("-s")) window.scrollTo(0,0);
  }
  if(hash.includes("-s")){ const el=document.getElementById(hash); if(el) el.scrollIntoView(); }
}

// controls
const sel=document.getElementById("chap");
sel.innerHTML=CHAPTERS.map(c=>`<option value="${c.id}">${c.n}${document.getElementById(c.id)?"":"（整理中）"}</option>`).join("");
sel.onchange=()=>{ location.hash=sel.value; };

function toggle(btn,cls,key){
  const apply=on=>{ document.body.classList.toggle(cls,!on); btn.classList.toggle("on",on); };
  let on=store.get(key,true); apply(on);
  btn.onclick=()=>{ on=!on; apply(on); store.set(key,on); };
}
toggle(document.getElementById("bBh"),"hide-bh","hlm-bh");
toggle(document.getElementById("bNote"),"hide-note","hlm-note");

let fs=store.get("hlm-fs",parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||18);
const setFs=v=>{ fs=Math.max(14,Math.min(26,v)); document.documentElement.style.setProperty("--fs",fs+"px"); store.set("hlm-fs",fs); };
if(store.get("hlm-fs",null)!==null) setFs(fs);
document.getElementById("bMinus").onclick=()=>setFs(fs-1);
document.getElementById("bPlus").onclick=()=>setFs(fs+1);

const bDark=document.getElementById("bDark");
const setDark=d=>{ document.body.classList.toggle("dark",d); bDark.textContent=d?"☀":"☾"; store.set("hlm-dark",d); };
setDark(store.get("hlm-dark",false));
bDark.onclick=()=>setDark(!document.body.classList.contains("dark"));

// tap to peek 白话 when hidden
document.getElementById("app").addEventListener("click",e=>{
  if(!document.body.classList.contains("hide-bh")) return;
  const p=e.target.closest(".pair"); if(p) p.classList.toggle("peek");
});

const toTop=document.getElementById("totop");
window.addEventListener("scroll",()=>{ toTop.style.display=window.scrollY>600?"block":"none"; });
toTop.onclick=()=>window.scrollTo(0,0);

window.addEventListener("hashchange",route);
route();
</script>
