凤姐儿说道：“在这里不便宜，背地里又不知干什么去了！”|凤姐说：“在这里不方便，背地里又不知道干什么去了！”
尤氏笑道：“那里都象你这么正经人呢。”|尤氏笑道：“哪里都像你这么正经。”
于是说说笑笑，点的戏都唱完了，方才撤下酒席，摆上饭来。|大家说说笑笑，点的戏都唱完了，才撤下酒席，摆上饭来。
吃毕，大家才出园子来，到上房坐下，吃了茶，方才叫预备车，向尤氏的母亲告了辞。|吃完饭，大家才出了园子，到上房坐下喝茶，然后叫人备车，向尤氏的母亲告辞。
尤氏率同众姬妾并家下婆子媳妇们方送出来，贾珍率领众子侄都在车旁侍立，等候著呢，|尤氏带着众姬妾和家里的婆子媳妇送出来，贾珍带着子侄们都在车旁站着等候，
见了邢夫人，王夫人道：“二位婶子明日还过来逛逛。”|见了邢夫人、王夫人，说：“两位婶子明天还过来逛逛。”
王夫人道：“罢了，我们今日整坐了一日，也乏了，明日歇歇罢。”|王夫人说：“算了，我们今天整整坐了一天，也累了，明天歇歇吧。”
于是都上车去了。|于是都上车走了。
贾瑞犹不时拿眼睛觑著凤姐儿。|贾瑞还不时拿眼睛偷看凤姐。
贾珍等进去后，李贵才拉过马来，宝玉骑上，随了王夫人去了。|贾珍等人进去以后，李贵才牵过马来，宝玉骑上，跟着王夫人走了。
这里贾珍同一家子的弟兄子侄吃过了晚饭，方大家散了。|这边贾珍和族里的兄弟子侄吃过晚饭，大家才散了。
! 凤姐一句“背地里又不知干什么去了”，尤氏笑她太正经。宁府的爷们背地里干什么，尤氏心里有数，只是不说。

# 十五、冬至前后，秦氏越来越瘦
次日，仍是众族人等闹了一日，不必细说。|第二天，族里的人又热闹了一天，不必细说。
此后凤姐儿不时亲自来看秦氏。|此后凤姐常常亲自来看秦氏。
秦氏也有几日好些，也有几日仍是那样。|秦氏有几天好一点，有几天还是老样子。
贾珍，尤氏，贾蓉好不焦心。|贾珍、尤氏、贾蓉都非常着急。
且说贾瑞到荣府来了几次，偏都遇见凤姐儿往宁府那边去了。|再说贾瑞到荣府来了几次，偏偏都赶上凤姐去宁府了。
这年正是十一月三十日冬至。|这一年冬至正是十一月三十日。
到交节的那几日，贾母，王夫人，凤姐儿日日差人去看秦氏，回来的人都说：“这几日也没见添病，也不见甚好。”|到了交节气的那几天，贾母、王夫人、凤姐天天派人去看秦氏，回来的人都说：“这几天病没见加重，也不见怎么好。”
王夫人向贾母说：“这个症候，遇著这样大节不添病，就有好大的指望了。”|王夫人对贾母说：“这种病，碰上这样的大节气没有加重，就有很大的希望了。”
贾母说：“可是呢，好个孩子，要是有些原故，可不叫人疼死。”|贾母说：“可不是，多好的孩子，要是有个好歹，可不叫人心疼死。”
说著，一阵心酸，叫凤姐儿说道：|说着一阵心酸，叫凤姐说：
“你们娘儿两个也好了一场，明日大初一，过了明日，你后日再去看一看他去。|“你们娘儿俩也好了一场，明天是初一，过了明天，你后天再去看看她。
你细细的瞧瞧他那光景，倘或好些儿，你回来告诉我，我也喜欢喜欢。|你仔细看看她的样子，要是好些了，回来告诉我，让我也高兴高兴。
那孩子素日爱吃的，你也常叫人做些给他送过去。”|那孩子平时爱吃的东西，你也常叫人做些给她送去。”
凤姐儿一一的答应了。|凤姐一一答应了。
! 第十回有个大夫说“怕冬至”。冬至过了没添病，大家都松了口气，可凤姐亲眼看到的是另一回事。
! 贾母说秦氏是“重孙媳中第一个得意之人”（第五回），这里一阵心酸，是真疼她。

# 十六、凤姐看出没救了
到了初二日，吃了早饭，来到宁府，看见秦氏的光景，虽未甚添病，但是那脸上身上的肉全瘦干了。|到了初二，凤姐吃过早饭来到宁府，看秦氏的样子，病虽然没怎么加重，可脸上身上的肉都瘦干了。
于是和秦氏坐了半日，说了些闲话儿，又将这病无妨的话开导了一遍。|于是陪秦氏坐了半天，说了些闲话，又拿这病不要紧的话开导了她一遍。
秦氏说道：“好不好，春天就知道了。|秦氏说：“好不好，到春天就知道了。
如今现过了冬至，又没怎么样，或者好的了也未可知。|现在过了冬至，也没怎么样，或许能好也说不定。
婶子回老太太，太太放心罢。|婶子回去告诉老太太、太太放心吧。
昨日老太太赏的那枣泥馅的山药糕，我倒吃了两块，倒象克化的动似的。”|昨天老太太赏的枣泥馅山药糕，我倒吃了两块，好像还消化得了。”
凤姐儿说道：“明日再给你送来。|凤姐说：“明天再给你送来。
我到你婆婆那里瞧瞧，就要赶著回去回老太太的话去。”|我到你婆婆那里看看，就要赶回去回老太太的话。”
秦氏道：“婶子替我请老太太，太太安罢。”|秦氏说：“婶子替我给老太太、太太请安吧。”
凤姐儿答应著就出来了，到了尤氏上房坐下。|凤姐答应着出来，到尤氏上房坐下。
尤氏道：“你冷眼瞧媳妇是怎么样？”|尤氏问：“你冷眼看，媳妇到底怎么样？”
凤姐儿低了半日头，说道：“这实在没法儿了。|凤姐低头半天，才说：“这实在没办法了。
你也该将一应的后事用的东西给他料理料理，冲一冲也好。”|你也该把后事要用的东西给她料理料理，冲一冲喜也好。”
尤氏道：“我也叫人暗暗的预备了。|尤氏说：“我也叫人暗暗预备了。
就是那件东西不得好木头，暂且慢慢的办罢。”|只是那件东西（棺材）找不到好木头，暂且慢慢办吧。”
于是凤姐儿吃了茶，说了一会子话儿，说道：“我要快回去回老太太的话去呢。”|凤姐喝了茶，说了一会儿话，说：“我得赶快回去回老太太的话了。”
尤氏道：“你可缓缓的说，别吓著老太太。”|尤氏说：“你可要慢慢说，别吓着老太太。”
凤姐儿道：“我知道。”|凤姐说：“我知道。”
! “冲一冲”是旧俗：病重时先备下寿衣棺木，盼着把病冲好。
! 尤氏说的“那件东西”就是棺材。好木头一时找不到，第十三回薛蟠送来一副“樯木”板，原是义忠亲王坏了事没用上的。

# 十七、凤姐回贾母的话
于是凤姐儿就回来了。|于是凤姐就回来了。
到了家中，见了贾母，说：“蓉哥儿媳妇请老太太安，给老太太磕头，说他好些了，求老祖宗放心罢。|回到家里见了贾母，说：“蓉哥儿媳妇给老太太请安、磕头，说她好些了，求老祖宗放心。
他再略好些，还要给老祖宗磕头请安来呢。”|她再好一点，还要来给老祖宗磕头请安呢。”
贾母道：“你看他是怎么样？”|贾母问：“你看她到底怎么样？”
凤姐儿说：“暂且无妨，精神还好呢。”|凤姐说：“暂时没事，精神还好呢。”
贾母听了，沉吟了半日，因向凤姐儿说：“你换换衣服歇歇去罢。”|贾母听了，沉吟了半天，对凤姐说：“你换换衣服歇歇去吧。”
! 凤姐对尤氏说“实在没法儿了”，对贾母说“暂且无妨”。贾母“沉吟了半日”，大概也听出来了，只是不再追问。

# 十八、贾瑞又来打听
凤姐儿答应著出来，见过了王夫人，到了家中，平儿将烘的家常的衣服给凤姐儿换了。|凤姐答应着出来，见过王夫人，回到家里，平儿拿烘好的家常衣服给凤姐换上。
凤姐儿方坐下，问道：“家里没有什么事么？”|凤姐刚坐下，问：“家里没什么事吧？”
平儿方端了茶来，递了过去，说道：“没有什么事。|平儿端了茶递过去，说：“没什么事。
就是那三百银子的利银，旺儿媳妇送进来，我收了。|就是那三百两银子的利息，旺儿媳妇送进来了，我收下了。
再有瑞大爷使人来打听奶奶在家没有，他要来请安说话。”|还有瑞大爷派人来打听奶奶在不在家，说要来请安说话。”
凤姐儿听了，哼了一声，说道：“这畜生合该作死，看他来了怎么样！”|凤姐听了，哼了一声说：“这畜生该死，看他来了怎么样！”
平儿因问道：“这瑞大爷是因什么只管来？”|平儿问：“这瑞大爷为什么老来？”
凤姐儿遂将九月里宁府园子里遇见他的光景，他说的话，都告诉了平儿。|凤姐就把九月里在宁府园子里遇见他的情形和他说的话，都告诉了平儿。
平儿说道：“癞蛤蟆想天鹅肉吃，没人伦的混帐东西，起这个念头，叫他不得好死！”|平儿说：“癞蛤蟆想吃天鹅肉，不讲人伦的混账东西，起这种念头，叫他不得好死！”
凤姐儿道：“等他来了，我自有道理。”|凤姐说：“等他来了，我自有办法。”
不知贾瑞来时作何光景，且听下回分解。|不知贾瑞来了会怎样，请看下回分解。
! “三百银子的利银”一笔带过，却很要紧：凤姐私下拿公中的月钱放高利贷，旺儿媳妇替她经手。后来抄家时，这正是凤姐的罪状之一。
! 平儿一向温和，这里骂得比凤姐还狠，可见贾瑞这念头是多么出格。
</script>

<script type="text/plain" id="ch12">
# 一、贾瑞上门
话说凤姐正与平儿说话，只见有人回说：“瑞大爷来了。”|凤姐正和平儿说话，有人来报：“瑞大爷来了。”
凤姐急命“快请进来。”|凤姐连忙吩咐：“快请进来。”
贾瑞见往里让，心中喜出望外，急忙进来，见了凤姐，满面陪笑，连连问好。|贾瑞见被请进去，心里喜出望外，急忙进来，见了凤姐满脸堆笑，连声问好。
凤姐儿也假意殷勤，让茶让坐。|凤姐也假装热情，又让茶又让座。
贾瑞见凤姐如此打扮，亦发酥倒，因饧了眼问道：“二哥哥怎么还不回来？”|贾瑞见凤姐这样打扮，更是骨头都酥了，眯着眼睛问：“二哥哥怎么还不回来？”
凤姐道：“不知什么原故。”|凤姐说：“不知道什么缘故。”
贾瑞笑道：“别是路上有人绊住了脚了，舍不得回来也未可知？”|贾瑞笑道：“别是在路上被什么人绊住了脚，舍不得回来吧？”
凤姐道：“也未可知。|凤姐说：“也说不定。
男人家见一个爱一个也是有的。”|男人见一个爱一个也是有的。”
贾瑞笑道：“嫂子这话说错了，我就不这样。”|贾瑞笑道：“嫂子这话说错了，我就不这样。”
凤姐笑道：“象你这样的人能有几个呢，十个里也挑不出一个来。”|凤姐笑道：“像你这样的人能有几个？十个里也挑不出一个来。”
贾瑞听了喜的抓耳挠腮，又道：“嫂子天天也闷的很。”|贾瑞听了高兴得抓耳挠腮，又说：“嫂子天天也闷得很吧。”
凤姐道：“正是呢，只盼个人来说话解解闷儿。”|凤姐说：“正是呢，就盼着有个人来说说话解解闷。”
贾瑞笑道：“我倒天天闲著，天天过来替嫂子解解闲闷可好不好？”|贾瑞笑道：“我倒是天天闲着，天天过来替嫂子解解闷，好不好？”
凤姐笑道：“你哄我呢，你那里肯往我这里来。”|凤姐笑道：“你哄我呢，你哪里肯到我这里来。”
贾瑞道：“我在嫂子跟前，若有一点谎话，天打雷劈！|贾瑞说：“我在嫂子面前要是有半句谎话，天打雷劈！
只因素日闻得人说，嫂子是个利害人，在你跟前一点也错不得，所以唬住了我。|只因为平时听人说嫂子是个厉害人，在你面前一点错都不能出，所以把我吓住了。
如今见嫂子最是个有说有笑极疼人的，我怎么不来，死了也愿意！”|如今见嫂子是个有说有笑、最疼人的，我怎么会不来？死了也愿意！”
凤姐笑道：“果然你是个明白人，比贾蓉两个强远了。|凤姐笑道：“你果然是个明白人，比贾蓉他们两个强多了。
我看他那样清秀，只当他们心里明白，谁知竟是两个胡涂虫，一点不知人心。”|我看他们长得那么清秀，还以为他们心里明白，谁知竟是两个糊涂虫，一点不懂人心。”
! 凤姐句句顺着贾瑞的话往下引，“男人家见一个爱一个”“比贾蓉两个强远了”，都是饵。
! 贾瑞说“死了也愿意”，一语成谶。

# 二、凤姐约他夜里在穿堂等
贾瑞听了这话，越发撞在心坎儿上，由不得又往前凑了一凑，觑著眼看凤姐带的荷包，然后又问带著什么戒指。|贾瑞听了这话，更是说到了心坎上，不由得又往前凑了凑，眯着眼看凤姐戴的荷包，又问她戴的是什么戒指。
凤姐悄悄道：“放尊重著，别叫丫头们看了笑话。”|凤姐小声说：“放尊重些，别叫丫头们看了笑话。”
贾瑞如听纶音佛语一般，忙往后退。|贾瑞像听到了圣旨佛语一样，连忙往后退。
凤姐笑道：“你该走了。”|凤姐笑道：“你该走了。”
贾瑞说：“我再坐一坐儿。|贾瑞说：“我再坐一会儿。
——好狠心的嫂子。”|——好狠心的嫂子。”
凤姐又悄悄的道：“大天白日，人来人往，你就在这里也不方便。|凤姐又小声说：“大白天的，人来人往，你在这里也不方便。
你且去，等著晚上起了更你来，悄悄的在西边穿堂儿等我。”|你先走，等晚上打过初更你再来，悄悄在西边的穿堂里等我。”
贾瑞听了，如得珍宝，忙问道：“你别哄我。|贾瑞听了，像得了宝贝一样，忙问：“你别哄我。
但只那里人过的多，怎么好躲的？”|可是那里过路的人多，怎么好躲？”
凤姐道：“你只放心。|凤姐说：“你只管放心。
我把上夜的小厮们都放了假，两边门一关，再没别人了。”|我把守夜的小厮都放了假，两边门一关，就再没别人了。”
贾瑞听了，喜之不尽，忙忙的告辞而去，心内以为得手。|贾瑞听了高兴极了，急急忙忙告辞走了，心里以为已经得手了。
! “穿堂”是两头有门、穿过去走路的过道屋，四面透风。凤姐挑这个地方，是早算好了要冻他。

# 三、穿堂里冻了一夜
盼到晚上，果然黑地里摸入荣府，趁掩门时，钻入穿堂。|好不容易盼到晚上，他果然摸黑进了荣府，趁着关门的时候钻进了穿堂。
果见漆黑无一人，往贾母那边去的门户已倒锁，只有向东的门未关。|里面果然漆黑一片，没有一个人。通往贾母那边的门已经从外面锁上了，只有朝东的门还没关。
贾瑞侧耳听著，半日不见人来，忽听咯登一声，东边的门也倒关了。|贾瑞侧着耳朵听，半天不见有人来，忽然“咯噔”一声，东边的门也从外面锁上了。
贾瑞急的也不敢则声，只得悄悄的出来，将门撼了撼，关的铁桶一般。|贾瑞急得也不敢出声，只好悄悄走出来摇了摇门，门关得像铁桶一样。
此时要求出去亦不能够，南北皆是大房墙，要跳亦无攀援。|这时候想出去也出不去了，南北两面都是高大的房墙，想跳墙也没处攀。
这屋内又是过门风，空落落，现是腊月天气，夜又长，朔风凛凛，侵肌裂骨，一夜几乎不曾冻死。|这屋里又是穿堂风，空空荡荡，正是腊月天，夜又长，北风刺骨，一夜下来差点冻死。
好容易盼到早晨，只见一个老婆子先将东门开了，进去叫西门。|好不容易盼到天亮，只见一个老婆子先开了东门，进去叫开西门。
贾瑞瞅他背著脸，一溜烟抱著肩跑了出来，|贾瑞趁她背过脸去，抱着肩膀一溜烟跑了出来，
幸而天气尚早，人都未起，从后门一径跑回家去。|幸好天还早，人都没起，他从后门一直跑回了家。

# 四、代儒重罚
原来贾瑞父母早亡，只有他祖父代儒教养。|原来贾瑞父母早死，只有祖父代儒抚养他。
那代儒素日教训最严，不许贾瑞多走一步，生怕他在外吃酒赌钱，有误学业。|代儒平时管教最严，不许贾瑞多走一步，生怕他在外面喝酒赌钱，耽误学业。
今忽见他一夜不归，只料定他在外非饮即赌，嫖娼宿妓，那里想到这段公案，因此气了一夜。|现在忽然见他一夜没回来，认定他在外面不是喝酒就是赌钱，或者去嫖娼了，哪里想得到是这么回事，因此气了一整夜。
贾瑞也捻著一把汗，少不得回来撒谎，只说：“往舅舅家去了，天黑了，留我住了一夜。”|贾瑞也捏着一把汗，只好回来撒谎说：“到舅舅家去了，天黑了，舅舅留我住了一夜。”
代儒道：“自来出门，非禀我不敢擅出，如何昨日私自去了？|代儒说：“从来出门，不禀告我是不许擅自出去的，你昨天怎么私自走了？
据此亦该打，何况是撒谎。”|就凭这个也该打，何况还撒谎。”
因此，发狠到底打了三四十扳，不许吃饭，令他跪在院内读文章，定要补出十天的工课来方罢。|于是狠狠打了他三四十板子，不许吃饭，叫他跪在院子里读文章，一定要补出十天的功课才算完。
贾瑞直冻了一夜，今又遭了苦打，且饿著肚子，跪著在风地里读文章，其苦万状。|贾瑞冻了一整夜，现在又挨了一顿苦打，还饿着肚子跪在风地里读书，苦不堪言。
! 代儒管得越严，贾瑞越不敢说实话，越只能偷偷摸摸。这个家教只管住了他的脚，管不住他的心。

# 五、凤姐再设圈套
此时贾瑞前心犹是未改，再想不到是凤姐捉弄他。|这时贾瑞的心思还是没改，怎么也想不到是凤姐在捉弄他。
过后两日，得了空，便仍来找凤姐。|过了两天，找到机会，又来找凤姐。
凤姐故意抱怨他失信，贾瑞急的赌身发誓。|凤姐故意埋怨他不守信，贾瑞急得赌咒发誓。
凤姐因见他自投罗网，少不得再寻别计令他知改，故又约他道：|凤姐见他自投罗网，只好再想别的办法让他知道悔改，就又约他说：
“今日晚上，你别在那里了。|“今天晚上，你别在那里了。
你在我这房后小过道子里那间空屋里等我，可别冒撞了。”|你到我这屋后小过道里那间空屋等我，可别莽撞了。”
贾瑞道：“果真？”|贾瑞说：“真的？”
凤姐道：“谁可哄你，你不信就别来。”|凤姐说：“谁哄你，你不信就别来。”
贾瑞道：“来，来，来。死也要来！”|贾瑞说：“来，来，来！死也要来！”
凤姐道：“这会子你先去罢。”|凤姐说：“现在你先走吧。”
贾瑞料定晚间必妥，此时先去了。|贾瑞认定晚上一定能成，就先走了。
凤姐在这里便点兵派将，设下圈套。|凤姐这边就调兵遣将，设下了圈套。
! “令他知改”是凤姐给自己的说法。可第一回已经冻得半死，她还要再来一回，这已经不是教训，是要整死他。
! 又一句“死也要来”。

# 六、空屋里抱错了人
那贾瑞只盼不到晚上，偏生家里亲戚又来了，直等吃了晚饭才去，那天已有掌灯时候。|贾瑞只嫌天黑得慢，偏偏家里又来了亲戚，一直等到吃过晚饭才走，那时天已经点灯了。
又等他祖父安歇了，方溜进荣府，直往那夹道中屋子里来等著，热锅上的蚂蚁一般，只是干转。|又等祖父睡下了，他才溜进荣府，直奔夹道里的那间屋子等着，像热锅上的蚂蚁一样团团转。
左等不见人影，右听也没声响，心下自思：“别是又不来了，又冻我一夜不成？”|左等不见人影，右听也没动静，心里想：“别是又不来了，又要冻我一夜吧？”
正自胡猜，只见黑魆魆的来了一个人，|正在胡猜，只见黑乎乎地来了一个人。
贾瑞便意定是凤姐，不管皂白，饿虎一般，等那人刚至门前，便如猫捕鼠的一般，抱住叫道：“亲嫂子，等死我了。”|贾瑞认定是凤姐，不分青红皂白，像饿虎一样，等那人刚到门口，就像猫捉老鼠似的一把抱住，叫道：“亲嫂子，等死我了。”
说著，抱到屋里炕上就亲嘴扯裤子，满口里“亲娘”“亲爹”的乱叫起来。|说着抱到屋里炕上就亲嘴、扯裤子，满嘴“亲娘”“亲爹”地乱叫起来。
那人只不作声。|那人一声不吭。
贾瑞拉了自己裤子，硬帮帮的就想顶入。|贾瑞扯下自己的裤子，硬邦邦的就想往里顶。
忽见灯光一闪，只见贾蔷举著个捻子照道：“谁在屋里？”|忽然灯光一闪，只见贾蔷举着个纸捻子照着问：“谁在屋里？”
只见炕上那人笑道：“瑞大叔要肏我呢。”|只见炕上那人笑道：“瑞大叔要肏我呢。”
贾瑞一见，却是贾蓉，真臊的无地可入，不知要怎么样才好，回身就要跑，|贾瑞一看，竟是贾蓉，臊得无地自容，不知怎么办才好，转身就要跑，
被贾蔷一把揪住道：“别走！|被贾蔷一把揪住说：“别走！
如今琏二嫂已经告到太太跟前，说你无故调戏他。|琏二嫂已经告到太太那里了，说你无缘无故调戏她。
他暂用了个脱身计，哄你在这边等著，太太气死过去，因此叫我来拿你。|她先用了个脱身计，哄你在这里等着。太太气得昏过去了，所以叫我来抓你。
刚才你又拦住他，没的说，跟我去见太太！”|刚才你又拦住他（贾蓉）乱来，没什么好说的，跟我去见太太！”
! 贾蓉、贾蔷是凤姐派来的“兵将”。上一回凤姐刚说过他俩是“胡涂虫”，转眼就用上了。
! “告到太太跟前”是假话，这事要是真闹到王夫人那里，凤姐自己也说不清。她要的是私下整治。

# 七、写下两张欠条
贾瑞听了，魂不附体，只说：“好侄儿，只说没有见我，明日我重重的谢你。”|贾瑞一听，吓得魂飞魄散，只说：“好侄儿，你只说没见到我，明天我重重谢你。”
贾蔷道：“你若谢我，放你不值什么，只不知你谢我多少？|贾蔷说：“你要谢我，放了你倒不算什么，只是不知道你谢我多少？
况且口说无凭，写一文契来。”|况且空口无凭，写个字据来。”
贾瑞道：“这如何落纸呢？”|贾瑞说：“这种事怎么能写在纸上？”
贾蔷道：“这也不妨，写一个赌钱输了外人帐目，借头家银若干两便罢。”|贾蔷说：“这也不要紧，就写成赌钱输给外人，向庄家借了多少两银子就行。”
贾瑞道：“这也容易。|贾瑞说：“这也容易。
只是此时无纸笔。”|只是现在没有纸笔。”
贾蔷道：“这也容易。”|贾蔷说：“这也容易。”
说罢翻身出来，纸笔现成，拿来命贾瑞写。|说完转身出去，纸笔是现成的，拿来叫贾瑞写。
他两作好作歹，只写了五十两，然后画了押，贾蔷收起来。|两人一个唱红脸一个唱白脸，最后只写了五十两，贾瑞画了押，贾蔷收了起来。
然后撕逻贾蓉。|然后又去拉扯贾蓉。
贾蓉先咬定牙不依，只说：“明日告诉族中的人评评理。”|贾蓉先是咬定不答应，只说：“明天告诉族里的人评评理。”
贾瑞急的至于叩头。|贾瑞急得直磕头。
贾蔷作好作歹的，也写了一张五十两欠契才罢。|贾蔷又在中间打圆场，贾瑞又写了一张五十两的欠条才算完。
! “纸笔现成”四个字露了底：这一切都是预先备好的。
! 贾瑞家里穷，一百两银子对他是一笔巨债，这是第三件压垮他的事。

# 八、一桶粪水
贾蔷又道：“如今要放你，我就担著不是。|贾蔷又说：“现在要放你，我就得担着干系。
老太太那边的门早已关了，老爷正在厅上看南京的东西，那一条路定难过去，如今只好走后门。|老太太那边的门早关了，老爷正在厅上看南京送来的东西，那条路肯定过不去，现在只能走后门。
若这一走，倘或遇见了人，连我也完了。|这一走要是碰见人，连我也完了。
等我们先去哨探哨探，再来领你。|等我们先去探探路，再来领你。
这屋你还藏不得，少时就来堆东西。|这间屋你也藏不得，待会儿就有人来堆东西。
等我寻个地方。”|等我给你找个地方。”
说毕，拉著贾瑞，仍熄了灯，出至院外，摸著大台矶底下，说道：|说完，拉着贾瑞，又熄了灯，走到院子外面，摸到大台阶底下，说：
“这窝儿里好，你只蹲著，别哼一声，等我们来再动。”|“这个角落好，你就蹲着，别出一声，等我们来了再动。”
说毕，二人去了。|说完，两人走了。
贾瑞此时身不由己，只得蹲在那里。|贾瑞这时身不由己，只好蹲在那里。
心下正盘算，只听头顶上一声响，哗拉拉一净桶尿粪从上面直泼下来，可巧浇了他一身一头。|心里正盘算着，只听头顶上一声响，哗啦啦一桶粪水从上面直泼下来，正好浇了他一头一身。
贾瑞掌不住嗳哟了一声，忙又掩住口，不敢声张，满头满脸浑身皆是尿屎，冰冷打战。|贾瑞忍不住“哎哟”一声，又赶紧捂住嘴，不敢声张，满头满脸浑身都是屎尿，冷得直打哆嗦。
只见贾蔷跑来叫：“快走，快走！”|只见贾蔷跑来叫：“快走，快走！”
贾瑞如得了命，三步两步从后门跑到家里，天已三更，只得叫门。|贾瑞像捡回一条命，三步并两步从后门跑回家，天已三更，只好叫门。
开门人见他这般景况，问是怎的。|开门的人见他这副模样，问是怎么了。
少不得扯谎说：“黑了，失脚掉在茅厕里了。”|他只好撒谎说：“天黑，失脚掉进茅厕里了。”
一面到了自己房中更衣洗濯，心下方想到是凤姐顽他，|一边回到自己房里换衣服洗澡，心里这才想到是凤姐在耍他，
因此发一回恨，再想想凤姐的模样儿，又恨不得一时搂在怀内，一夜竟不曾合眼。|因此恨了一阵；可再想想凤姐的模样，又恨不得马上搂在怀里，一夜都没合眼。
! 寒冬腊月，先冻一夜，再浇一身冰冷的粪水，这两回都伤了身子。
! 明知被耍，还是放不下。作者写的正是“邪思妄动”到了无药可救的地步，下面那面镜子就是为这个来的。

# 九、贾瑞病倒
自此满心想凤姐，只不敢往荣府去了。|从此他满心想着凤姐，只是不敢再去荣府了。
贾蓉两个又常常的来索银子，他又怕祖父知道，|贾蓉两个又常来讨债，他又怕祖父知道，
正是相思尚且难禁，更又添了债务，日间工课又紧，|相思已经叫他受不了，又添了债务，白天功课又紧，
他二十来岁人，尚未娶亲，迩来想著凤姐，未免有那指头告了消乏等事，|他二十来岁还没娶亲，近来想着凤姐，难免有些自我消耗身体的事，
更兼两回冻恼奔波，因此三五下里夹攻，不觉就得了一病：|再加上两回挨冻受气、奔波劳累，几样夹攻之下，不知不觉就得了一场病：
心内发膨胀，口中无滋味，脚下如绵，眼中似醋，|心里发胀，嘴里没味，脚下发软，眼睛酸涩，
黑夜作烧，白昼常倦，下溺连精，嗽痰带血。|夜里发烧，白天总是困倦，小便带着精液，咳痰带血。
诸如此症，不上一年都添全了。|这些病症，不到一年全都添齐了。
于是不能支持，一头睡倒，合上眼还只梦魂颠倒，满口乱说胡话，惊怖异常。|于是撑不住了，一头病倒，闭上眼还是魂梦颠倒，满嘴胡话，惊恐得很。
百般请医疗治，诸如肉桂，附子，鳖甲，麦冬，玉竹等药，吃了有几十斤下去，也不见个动静。|想尽办法请医生治，肉桂、附子、鳖甲、麦冬、玉竹这些药，吃了有几十斤，也不见效果。
倏又腊尽春回，这病更又沉重。|转眼腊月过完、春天来了，病更重了。
! 作者一条条列出病因：相思、债务、功课、自损、受冻。贾瑞的死不是一件事造成的，是几样“夹攻”。
! 肉桂、附子是温补的药，麦冬、玉竹是滋阴的药，冷热一起乱用，可见医生也束手无策。

# 十、凤姐给的人参
代儒也著了忙，各处请医疗治，皆不见效。|代儒也慌了，到处请医生，都不见效。
因后来吃“独参汤”，代儒如何有这力量，只得往荣府来寻。|后来要吃“独参汤”，代儒哪有这个财力，只好到荣府来求。
王夫人命凤姐秤二两给他，|王夫人叫凤姐称二两人参给他，
凤姐回说：“前儿新近都替老太太配了药，那整的太太又说留著送杨提督的太太配药，偏生昨儿我已送了去了。”|凤姐回说：“前几天刚给老太太配了药；那些整枝的，太太又说留着送杨提督太太配药，偏偏我昨天已经送去了。”
王夫人道：“就是咱们这边没了，你打发个人往你婆婆那边问问，或是你珍大哥哥那府里再寻些来，凑著给人家。|王夫人说：“就算咱们这边没有了，你派个人到你婆婆那边问问，或者到你珍大哥哥府里再找些来，凑一凑给人家。
吃好了，救人一命，也是你的好处。”|吃好了，救人一命，也是你的功德。”
凤姐听了，也不遣人去寻，只得将些渣末泡须凑了几钱，命人送去，只说：“太太送来的，再也没了。”|凤姐听了，也不派人去找，只拿些碎渣和须根凑了几钱，叫人送去，只说：“这是太太送来的，再也没有了。”
然后回王夫人，只说：“都寻了来，共凑了有二两送去。”|然后回王夫人，只说：“都找来了，一共凑了二两送去了。”
! “独参汤”是只用一味人参熬的汤，专门用来救急、吊命。
! 一边是贾府随手送人整枝人参，一边是凤姐只给“渣末泡须”。她对王夫人说凑足了二两，其实只给了几钱，这是在暗中断贾瑞的命。

# 十一、跛足道人送来风月宝鉴
那贾瑞此时要命心甚切，无药不吃，只是白花钱，不见效。|贾瑞这时一心想活命，什么药都吃，只是白花钱，不见效。
忽然这日有个跛足道人来化斋，口称专治冤业之症。|忽然这天有个瘸腿道士来化斋，嘴里说专治冤孽之病。
贾瑞偏生在内就听见了，直著声叫喊说：“快请进那位菩萨来救我！”|贾瑞偏偏在屋里听见了，扯着嗓子喊：“快请那位菩萨进来救我！”
一面叫，一面在枕上叩首。|一边喊，一边在枕头上磕头。
众人只得带了那道士进来。|大家只好把道士领进来。
贾瑞一把拉住，连叫“菩萨救我！”|贾瑞一把拉住他，连声叫：“菩萨救我！”
那道士叹道：“你这病非药可医。|道士叹道：“你这病不是药能治的。
我有个宝贝与你，你天天看时，此命可保矣。”|我有个宝贝给你，你天天照着看，这条命就保得住。”
说毕，从褡裢中取出一面镜子来——两面皆可照人，镜把上面錾著“风月宝鉴”四字——递与贾瑞道：|说完，从褡裢里拿出一面镜子来——两面都能照人，镜柄上刻着“风月宝鉴”四个字——递给贾瑞说：
“这物出自太虚幻境空灵殿上，警幻仙子所制，专治邪思妄动之症，有济世保生之功。|“这东西出自太虚幻境空灵殿上，是警幻仙子做的，专治胡思乱想、欲念妄动的病，有救世保命的功效。
所以带他到世上，单与那些聪明杰俊，风雅王孙等看照。|所以把它带到人间，专给那些聪明俊秀、风流的公子王孙照。
千万不可照正面，只照他的背面，要紧，要紧！|千万不能照正面，只能照背面，要紧，要紧！
三日后吾来收取，管叫你好了。”|三天后我来收回，保管你好了。”
说毕，佯常而去，众人苦留不住。|说完，不慌不忙地走了，大家怎么留也留不住。
! 这个跛足道人就是第一回和癞头和尚一起带石头下凡、唱《好了歌》的那位。
! 《风月宝鉴》也是这部书早年的书名之一（见第一回）。作者等于告诉读者：这本书也是一面镜子，要会看它的反面。

# 十二、镜子的正面和反面
贾瑞收了镜子，想道：“这道士倒有意思，我何不照一照试试。”|贾瑞收了镜子，心想：“这道士倒有点意思，我何不照照试试。”
想毕，拿起风月鉴来，向反面一照，只见一个骷髅立在里面，|想完，拿起风月宝鉴，向反面一照，只见一个骷髅立在里面，
唬得贾瑞连忙掩了，骂：“道士混帐，如何吓我！|吓得贾瑞连忙盖上，骂道：“混账道士，为什么吓我！
我倒再照照正面是什么。”|我倒要照照正面是什么。”
想著，又将正面一照，只见凤姐站在里面招手叫他。|想着，又照正面，只见凤姐站在里面向他招手。
贾瑞心中一喜，荡悠悠的觉得进了镜子，与凤姐云雨一番，凤姐仍送他出来。|贾瑞心里一喜，飘飘悠悠地觉得自己进了镜子，和凤姐欢好了一番，凤姐又把他送了出来。
到了床上，哎哟了一声，一睁眼，镜子从手里掉过来，仍是反面立著一个骷髅。|回到床上，“哎哟”一声，一睁眼，镜子从手里翻过来，反面仍然立着一个骷髅。
贾瑞自觉汗津津的，底下已遗了一滩精。|贾瑞觉得浑身是汗，身下已经遗了一滩精。
心中到底不足，又翻过正面来，只见凤姐还招手叫他，他又进去。|心里还是不满足，又翻过正面，只见凤姐还在招手叫他，他又进去了。
如此三四次。|这样反复了三四次。
到了这次，刚要出镜子来，只见两个人走来，拿铁锁把他套住，拉了就走。|到了最后这次，刚要出镜子，只见两个人走过来，用铁锁把他套住，拉着就走。
贾瑞叫道：“让我拿了镜子再走。”|贾瑞叫道：“让我拿了镜子再走。”
只说了这句，就再不能说话了。|只说了这一句，就再也说不出话了。
! 正面是美人，反面是骷髅。贪恋的东西照见的是死，吓人的东西照见的是真相，贾瑞却偏要照正面。
! 被铁锁套走的两个人，就是来勾魂的鬼差。临死还要“拿了镜子再走”，到死也没醒悟。

# 十三、贾瑞之死，镜子被收回
旁边伏侍贾瑞的众人，只见他先还拿著镜子照，落下来，仍睁开眼拾在手内，末后镜子落下来便不动了。|旁边伺候贾瑞的人，只见他先是拿着镜子照，镜子掉下来，他又睁眼捡起来；最后镜子掉下来，他就不动了。
众人上来看看，已没了气。|大家上前一看，已经断了气。
身子底下冰凉渍湿一大滩精，这才忙著穿衣抬床。|身子底下冰凉湿透一大滩精，这才忙着给他穿寿衣、抬床。
代儒夫妇哭的死去活来，大骂道士，“是何妖镜！|代儒夫妇哭得死去活来，大骂道士：“这是什么妖镜！
若不早毁此物，遗害于世不小。”|要是不早点毁了它，害人可不小。”
遂命架火来烧，只听镜内哭道：|就叫人生火来烧，只听镜子里哭道：
“谁叫你们瞧正面了！|“谁叫你们照正面了！
你们自己以假为真，何苦来烧我？”|你们自己把假的当成真的，何苦来烧我？”
正哭著，只见那跛足道人从外面跑来，喊道：“谁毁‘风月鉴’，吾来救也！”|正哭着，只见那个瘸腿道士从外面跑来，喊道：“谁要毁‘风月鉴’，我来救它！”
说著，直入中堂，抢入手内，飘然去了。|说着直冲进中堂，把镜子抢到手里，飘然而去。
! “以假为真”呼应第一回太虚幻境的对联：“假作真时真亦假”。
! 镜子不该被烧，因为镜子没有错，错的是照镜子的人。作者也是在替自己这本书说话：别只看书里的风月。

# 十四、丧事
当下，代儒料理丧事，各处去报丧。|代儒办理丧事，到处报丧。
三日起经，七日发引，寄灵于铁槛寺，日后带回原籍。|第三天开始念经，第七天出殡，灵柩暂时寄放在铁槛寺，以后再运回老家。
当下贾家众人齐来吊问，荣国府贾赦赠银二十两，贾政亦是二十两，宁国府贾珍亦有二十两，|贾家族人都来吊唁，荣国府贾赦送了二十两银子，贾政也是二十两，宁国府贾珍也有二十两，
别者族中贫富不等，或三两五两，不可胜数。|族中其他人家贫富不同，有送三两的，有送五两的，数也数不过来。
另有各同窗家分资，也凑了二三十两。|还有同学们各家凑了份子，也有二三十两。
代儒家道虽然淡薄，倒也丰丰富富完了此事。|代儒家虽然清贫，倒也体体面面地办完了这件事。
! 二两人参凑不齐，丧事却每家二十两。活着时没人救，死了倒办得“丰丰富富”。
! 铁槛寺是贾家的家庙，后面秦可卿的灵柩也要停在这里。

# 十五、林如海病重，黛玉回扬州
谁知这年冬底，林如海的书信寄来，却为身染重疾，写书特来接林黛玉回去。|谁知这年冬天快过完时，林如海寄来书信，说自己得了重病，特地写信来接林黛玉回去。
贾母听了，未免又加忧闷，只得忙忙的打点黛玉起身。|贾母听了，心里更加忧闷，只好急忙给黛玉打点行装。
宝玉大不自在，争奈父女之情，也不好拦劝。|宝玉很不高兴，可父女之情摆在那里，也不好拦着。
于是贾母定要贾琏送他去，仍叫带回来。|于是贾母一定要贾琏送她去，还叮嘱要把她带回来。
一应土仪盘缠，不消烦说，自然要妥贴。|一切土产礼物和路费，不用多说，自然都安排得妥妥当当。
作速择了日期，贾琏与林黛玉辞别了贾母等，带领仆从，登舟往扬州去了。|很快选好日子，贾琏和林黛玉辞别了贾母等人，带着仆人坐船往扬州去了。
要知端的，且听下回分解。|要知后事如何，请看下回分解。
! 贾母说“仍叫带回来”，她已经准备好黛玉长住贾府了。第十四回林如海去世，黛玉从此成了真正的孤女。
! 贾琏一走，凤姐独守，才有了下一回秦可卿托梦和凤姐协理宁国府。
</script>

<script type="text/plain" id="ch13">
# 一、秦氏托梦
话说凤姐儿自贾琏送黛玉往扬州去后，心中实在无趣，每到晚间，不过和平儿说笑一回，就胡乱睡了。|自从贾琏送黛玉去了扬州，凤姐心里实在无聊，每到晚上，不过和平儿说笑一阵，就随便睡了。
这日夜间，正和平儿灯下拥炉倦绣，早命浓薰绣被，二人睡下，屈指算行程该到何处，不知不觉已交三鼓。|这天夜里，她和平儿在灯下围着火炉，绣花绣累了，早就叫人把被子熏得香香的。两人睡下，掐着手指算贾琏该走到哪里了，不知不觉已经到了三更。
平儿已睡熟了。|平儿已经睡熟了。
凤姐方觉星眼微朦，恍惚只见秦氏从外走来，含笑说道：|凤姐刚觉得眼睛有点迷糊，恍恍惚惚看见秦氏从外面走进来，笑着说：
“婶子好睡！|“婶子睡得好香！
我今日回去，你也不送我一程。|我今天要回去了，你也不送我一程。
因娘儿们素日相好，我舍不得婶子，故来别你一别。|因为咱们娘儿俩平时要好，我舍不得婶子，所以来跟你告个别。
还有一件心愿未了，非告诉婶子，别人未必中用。”|还有一桩心愿没了，非得告诉婶子不可，告诉别人未必管用。”
! 秦氏说“我今日回去”，回的不是娘家，是太虚幻境。第五回里她本就是警幻的妹妹“可卿”。

# 二、“月满则亏，水满则溢”
凤姐听了，恍惚问道：“有何心愿？|凤姐听了，迷迷糊糊地问：“有什么心愿？
你只管托我就是了。”|你只管托给我就是。”
秦氏道：“婶婶，你是个脂粉队里的英雄，连那些束带顶冠的男子也不能过你，你如何连两句俗语也不晓得？|秦氏说：“婶婶，你是女人里的英雄，连那些当官的男人都比不上你，怎么连两句俗话也不知道？
常言‘月满则亏，水满则溢’，又道是‘登高必跌重’。|俗话说‘月亮圆了就要缺，水满了就要溢’，又说‘爬得高摔得重’。
如今我们家赫赫扬扬，已将百载，|如今我们家显赫风光，已经快一百年了，
一日倘或乐极悲生，若应了那句‘树倒猢狲散’的俗语，岂不虚称了一世的诗书旧族了！”|万一哪天乐极生悲，应了‘树倒猢狲散’那句俗话，岂不是白当了一辈子的书香世家！”
凤姐听了此话，心胸大快，十分敬畏，忙问道：|凤姐听了这话，心胸豁然开朗，十分敬佩，忙问：
“这话虑的极是，但有何法可以永保无虞？”|“这话想得太对了。可有什么办法能永保平安？”
秦氏冷笑道：“婶子好痴也。|秦氏冷笑道：“婶子太傻了。
否极泰来，荣辱自古周而复始，岂人力能可保常的。|坏到头就会转好，荣耀和屈辱自古就是轮流来的，哪是人力能永远保住的。
但如今能于荣时筹画下将来衰时的世业，亦可谓常保永全了。|只是如果能趁着兴旺的时候，替将来衰败的时候安排好产业，也就算能长久保全了。
即如今日诸事都妥，只有两件未妥，若把此事如此一行，则后日可保永全了。”|就像现在各样事都还妥当，只有两件不妥。要是把这两件这样办了，将来就可以保全了。”
! 整个贾府，看得最远的竟是一个将死的年轻媳妇，听她托付的是一个女人。秦氏自己也说了：男人们都不如凤姐。
! 秦氏不劝凤姐挽救盛世，只劝她给败落留条退路。作者早已知道贾家的结局。

# 三、两件未妥之事
凤姐便问何事。|凤姐就问是哪两件。
秦氏道：“目今祖茔虽四时祭祀，只是无一定的钱粮，第二，家塾虽立，无一定的供给。|秦氏说：“眼下祖坟虽然一年四季都有祭祀，却没有固定的钱粮来源；第二，家塾虽然办着，也没有固定的经费。
依我想来，如今盛时固不缺祭祀供给，但将来败落之时，此二项有何出处？|依我看，现在兴旺的时候当然不缺这些开销，可将来败落了，这两项钱从哪里来？
莫若依我定见，趁今日富贵，将祖茔附近多置田庄房舍地亩，以备祭祀供给之费皆出自此处，将家塾亦设于此。|不如按我的主意，趁现在富贵，在祖坟附近多买些田庄、房屋和地，让祭祀和家塾的费用都从这里出，把家塾也搬到那里去。
合同族中长幼，大家定了则例，日后按房掌管这一年的地亩，钱粮，祭祀，供给之事。|和族里的长辈晚辈一起定下规矩，以后各房轮流，每年由一房管这些地、钱粮、祭祀和供给的事。
如此周流，又无争竞，亦不有典卖诸弊。|这样轮流着管，不会有争抢，也不会有人把产业典当变卖。
便是有了罪，凡物可入官，这祭祀产业连官也不入的。|就算家里获了罪，别的东西都要没收充公，祭祀的产业官府也不没收。
便败落下来，子孙回家读书务农，也有个退步，祭祀又可永继。|就是败落了，子孙也能回老家读书种地，有条退路，祭祀也能一直延续下去。
若目今以为荣华不绝，不思后日，终非长策。|要是现在以为荣华富贵永远不会断，不考虑以后，终究不是长久之计。
! 按清代律例，犯罪抄家时，祭田一般不入官。秦氏说的“便是有了罪”，等于直接预言了后来的抄家。
! 这番话凤姐后来并没有照办。脂批在这里叹道：贾府后来子孙流散，正是因为没听这番话。

# 四、“三春过后诸芳尽”
眼见不日又有一件非常喜事，真是烈火烹油，鲜花著锦之盛。|眼看不久又有一件天大的喜事，那真是烈火上浇油、锦缎上绣花一样的盛况。
要知道，也不过是瞬间的繁华，一时的欢乐，万不可忘了那‘盛筵必散’的俗语。|可要知道，这也不过是转眼的繁华、一时的欢乐，千万别忘了‘没有不散的宴席’这句俗话。
此时若不早为后虑，临期只恐后悔无益了。”|这时候要是不早点为以后打算，到时候只怕后悔也来不及了。”
凤姐忙问：“有何喜事？”|凤姐忙问：“什么喜事？”
秦氏道：“天机不可泄漏。|秦氏说：“天机不能泄露。
只是我与婶子好了一场，临别赠你两句话，须要记著。”|只是我和婶子好了一场，临别送你两句话，一定要记住。”
因念道：|于是念道：
~三春过后诸芳尽，各自须寻各自门。|三个春天过去，所有的花都要凋谢；到那时候，大家只能各自去找各自的出路。
! “非常喜事”就是第十六回元春封妃、第十八回元春省亲。“烈火烹油”形容的就是那一场盛况。
! “三春”有几种读法：指迎春、探春、惜春三姐妹，或指元春之后的三年。“诸芳尽”就是第五回那些判词所写的群芳散尽。
! “盛筵必散”接着第一回《好了歌》注里的“盛席华筵终散场”。

# 五、云板四响，秦氏死了
凤姐还欲问时，只听二门上传事云板连叩四下，将凤姐惊醒。|凤姐还想再问，只听二门上报事的云板连敲了四下，把凤姐惊醒了。
人回：“东府蓉大奶奶没了。”|有人来报：“东府的蓉大奶奶没了。”
凤姐闻听，吓了一身冷汗，出了一回神，只得忙忙的穿衣，往王夫人处来。|凤姐一听，吓出一身冷汗，愣了一会儿神，只好急忙穿上衣服，到王夫人那里去。
彼时合家皆知，无不纳罕，都有些疑心。|这时全家都知道了，没有一个不觉得奇怪，都有些起疑心。
那长一辈的想他素日孝顺，平一辈的想他素日和睦亲密，下一辈的想他素日慈爱，以及家中仆从老小想他素日怜贫惜贱，慈老爱幼之恩，莫不悲嚎痛哭者。|长辈想起她平时孝顺，同辈想起她平时和睦亲热，晚辈想起她平时慈爱，家里的仆人老小想起她平时怜惜穷苦下人、敬老爱幼的恩情，没有一个不放声痛哭的。
! 云板敲四下是报丧的规矩，俗称“神三鬼四”。
! “都有些疑心”很要紧：上一回她明明“暂且无妨”，怎么突然就死了？脂批说原稿写她在天香楼上吊自尽，作者奉命删去，却故意留下“疑心”二字。
! 据脂批，“秦可卿淫丧天香楼”这一节原稿约四五页，后来删掉了。下文丫鬟瑞珠触柱而死，也是删改后留下的线头。

# 六、宝玉吐血
闲言少叙，却说宝玉因近日林黛玉回去，剩得自己孤凄，也不和人顽耍，每到晚间便索然睡了。|闲话少说。宝玉因为林黛玉最近回去了，剩下自己孤零零的，也不跟人玩，每到晚上就没精打采地睡了。
如今从梦中听见说秦氏死了，连忙翻身爬起来，只觉心中似戳了一刀的不忍，哇的一声，直奔出一口血来。|现在在梦里听见说秦氏死了，连忙翻身爬起来，只觉得心里像被捅了一刀那样难受，“哇”的一声，喷出一口血来。
袭人等慌慌忙忙上来搀扶，问是怎么样，又要回贾母来请大夫。|袭人她们慌慌张张上来扶他，问他怎么了，又要去回贾母请大夫。
宝玉笑道：“不用忙，不相干，这是急火攻心，血不归经。”|宝玉笑道：“不用忙，不要紧，这是急火攻心，血不归经。”
说著便爬起来，要衣服换了，来见贾母，即时要过去。|说着就爬起来，要了衣服换上，来见贾母，要马上过去。
袭人见他如此，心中虽放不下，又不敢拦，只是由他罢了。|袭人见他这样，心里虽然放心不下，又不敢拦，只好由着他。
贾母见他要去，因说：“才咽气的人，那里不干净，二则夜里风大，等明早再去不迟。”|贾母见他要去，就说：“刚断气的人，那里不干净；再说夜里风大，等明天早上再去也不晚。”
宝玉那里肯依。|宝玉哪里肯听。
贾母命人备车，多派跟随人役，拥护前来。|贾母只好叫人备车，多派些跟随的人，护送他过去。
! 一个侄媳妇的死，叫宝玉吐了血。第五回梦里，他在可卿身边初尝情事，这份痛是梦里的情，不只是叔侄之情。

# 七、宁府哭成一片
一直到了宁国府前，只见府门洞开，两边灯笼照如白昼，乱烘烘人来人往，里面哭声摇山振岳。|一直到了宁国府门前，只见大门敞开，两边的灯笼照得像白天一样，乱哄哄的人来人往，里面的哭声震天动地。
宝玉下了车，忙忙奔至停灵之室，痛哭一番。|宝玉下了车，急忙跑到停灵的屋子，痛哭了一场。
然后见过尤氏。|然后去见尤氏。
谁知尤氏正犯了胃疼旧疾，睡在床上。|谁知尤氏正犯了胃疼的老毛病，躺在床上。
然后又出来见贾珍。|然后又出来见贾珍。
彼时贾代儒，代修，贾敕，贾效，贾敦，贾赦，贾政，贾琮，贾㻞，贾珩，贾珖，贾琛，贾琼，贾璘，贾蔷，贾菖，贾菱，贾芸，贾芹，贾蓁，贾萍，贾藻，贾蘅，贾芬，贾芳，贾兰，贾菌，贾芝等都来了。|这时贾代儒、贾代修、贾敕、贾效、贾敦、贾赦、贾政、贾琮、贾㻞、贾珩、贾珖、贾琛、贾琼、贾璘、贾蔷、贾菖、贾菱、贾芸、贾芹、贾蓁、贾萍、贾藻、贾蘅、贾芬、贾芳、贾兰、贾菌、贾芝等族人都来了。
贾珍哭的泪人一般，正和贾代儒等说道：|贾珍哭得像个泪人，正对贾代儒等人说：
“合家大小，远近亲友，谁不知我这媳妇比儿子还强十倍。|“全家老小、远近亲友，谁不知道我这媳妇比我儿子还强十倍。
如今伸腿去了，可见这长房内绝灭无人了。”|如今她撒手走了，可见我们这长房是要断绝无人了。”
说著又哭起来。|说着又哭起来。
众人忙劝：“人已辞世，哭也无益，且商议如何料理要紧。”|大家忙劝：“人已经走了，哭也没用，还是商量怎么办丧事要紧。”
贾珍拍手道：“如何料理，不过尽我所有罢了！”|贾珍拍着手说：“怎么办？不过把我所有的都拿出来罢了！”
! 婆婆尤氏偏偏“犯了胃疼”躺着，公公贾珍却哭成泪人、要倾家办丧事。一个装病不出，一个悲痛过头，这份反常正是作者留给读者的暗示。
! 族人名字排了一长串：“代”字辈、“文”字辈、“玉”字辈、“草”字辈，四代人都到了。这是贾府人丁最旺的时候。

# 八、四十九日的道场
正说著，只见秦业，秦钟并尤氏的几个眷属尤氏姊妹也都来了。|正说着，秦业、秦钟和尤氏的几个亲眷，还有尤氏的两个妹妹也都来了。
贾珍便命贾琼，贾琛，贾璘，贾蔷四个人去陪客，|贾珍就叫贾琼、贾琛、贾璘、贾蔷四个人去陪客，
一面吩咐去请钦天监阴阳司来择日，择准停灵七七四十九日，三日后开丧送讣闻。|又吩咐去请钦天监阴阳司的人来选日子，定下停灵七七四十九天，三天后开丧、发讣告。
这四十九日，单请一百单八众禅僧在大厅上拜大悲忏，超度前亡后化诸魂，以免亡者之罪，|这四十九天里，专门请了一百零八位和尚在大厅上拜大悲忏，超度先后死去的亡魂，替死者消罪；
另设一坛于天香楼上，是九十九位全真道士，打四十九日解冤洗业醮。|另外在天香楼上设一座法坛，请九十九位全真道士，做四十九天解冤洗业的醮事。
然后停灵于会芳园中，灵前另外五十众高僧，五十众高道，对坛按七作好事。|然后把灵柩停在会芳园中，灵前另有五十位高僧、五十位高道，两坛相对，每七天做一次法事。
那贾敬闻得长孙媳死了，因自为早晚就要飞升，如何肯又回家染了红尘，将前功尽弃呢，因此并不在意，只凭贾珍料理。|贾敬听说长孙媳妇死了，因为自以为早晚就要成仙飞升，怎么肯再回家沾染尘世、前功尽弃呢，所以并不放在心上，全凭贾珍去办。
! 尤氏姊妹就是尤二姐、尤三姐，这里第一次露面，后面第六十三回起有她们的大段故事。
! 天香楼上专设道场“解冤洗业”，正是秦氏死的地方。

# 九、樯木棺材
贾珍见父亲不管，亦发恣意奢华。|贾珍见父亲不管，更加放开手脚，铺张奢华。
看板时，几副杉木板皆不中用。|挑棺材板的时候，几副杉木板都看不上。
可巧薛蟠来吊问，因见贾珍寻好板，便说道：|正好薛蟠来吊唁，见贾珍在找好棺材板，就说：
“我们木店里有一副板，叫作什么樯木，出在潢海铁网山上，作了棺材，万年不坏。|“我们木店里有一副板，叫什么樯木，出在潢海铁网山上，做成棺材，一万年都不会坏。
这还是当年先父带来，原系义忠亲王老千岁要的，因他坏了事，就不曾拿去。|这还是当年我父亲带来的，本来是义忠亲王老千岁要的，因为他出了事，就没拿去。
现在还封在店内，也没有人出价敢买。|现在还封在店里，也没人敢出价买。
你若要，就抬来使罢。”|你要是要，就抬来用吧。”
贾珍听说，喜之不尽，即命人抬来。|贾珍一听，高兴极了，马上叫人抬来。
大家看时，只见帮底皆厚八寸，纹若槟榔，味若檀麝，以手扣之，玎珰如金玉。|大家一看，棺材的帮和底都有八寸厚，纹理像槟榔，气味像檀香和麝香，用手一敲，叮当作响，像敲金玉一样。
大家都奇异称赞。|大家都啧啧称奇。
贾珍笑问：“价值几何？”|贾珍笑着问：“要多少钱？”
薛蟠笑道：“拿一千两银子来，只怕也没处买去。|薛蟠笑道：“拿一千两银子来，只怕也没处买去。
什么价不价，赏他们几两工钱就是了。”|还说什么价不价的，赏他们几两工钱就行了。”
贾珍听说，忙谢不尽，即命解锯糊漆。|贾珍听了，连连道谢，马上叫人锯开刷漆。
贾政因劝道：“此物恐非常人可享者，殓以上等杉木也就是了。”|贾政劝道：“这东西恐怕不是一般人能用的，用上等杉木装殓也就行了。”
此时贾珍恨不能代秦氏之死，这话如何肯听。|这时候贾珍恨不得替秦氏去死，这话哪里肯听。
! 这副棺材是给亲王预备的，一个五品命妇睡亲王的棺材，就是越制。贾政说“非常人可享”，正是怕这个。
! “义忠亲王坏了事”是书里少见的政治暗笔。有学者认为秦可卿身世和这位获罪的亲王有关，这是红学中“秦可卿出身之谜”的由来。
! 贾珍“恨不能代秦氏之死”，公公对儿媳哀痛到这个地步，作者的暗示已经很明白了。

# 十、瑞珠触柱，宝珠认作义女
因忽又听得秦氏之丫鬟名唤瑞珠者，见秦氏死了，他也触柱而亡。|忽然又听说秦氏的丫鬟瑞珠，见秦氏死了，也撞柱子死了。
此事可罕，合族人也都称叹。|这事很少见，全族的人都赞叹不已。
贾珍遂以孙女之礼敛殡，一并停灵于会芳园中之登仙阁。|贾珍就按孙女的礼节给她装殓，一起停灵在会芳园的登仙阁里。
小丫鬟名宝珠者，因见秦氏身无所出，乃甘心愿为义女，誓任摔丧驾灵之任。|还有个小丫鬟叫宝珠，因为秦氏没有生儿育女，就甘愿给她做义女，发誓担起摔丧盆、护灵柩的责任。
贾珍喜之不尽，即时传下，从此皆呼宝珠为小姐。|贾珍高兴极了，马上传下话去，从此大家都叫宝珠“小姐”。
那宝珠按未嫁女之丧，在灵前哀哀欲绝。|宝珠按照没出嫁的女儿给母亲守丧的礼节，在灵前哭得死去活来。
于是，合族人丁并家下诸人，都各遵旧制行事，自不得紊乱。|于是全族的人和家里的下人，都按老规矩办事，一点也不乱。
! 一个丫鬟为什么要殉主？一个丫鬟为什么愿意终身守灵、再也不回府里？据脂批，删去的原稿里，是她们撞见了天香楼上的事，一个死，一个躲。
! 第十五回送殡后，宝珠执意留在铁槛寺不肯回家，正是这条线。

# 十一、给贾蓉捐官
贾珍因想著贾蓉不过是个黉门监，灵幡经榜上写时不好看，便是执事也不多，因此心下甚不自在。|贾珍想到贾蓉不过是个国子监的监生，灵幡和经榜上写出来不好看，出殡的仪仗也排不了多少，心里很不痛快。
可巧这日正是首七第四日，早有大明宫掌宫内相戴权，先备了祭礼遣人来，次后坐了大轿，打伞鸣锣，亲来上祭。|正好这天是头七的第四天，大明宫的掌宫太监戴权，先备了祭礼派人送来，接着自己坐着大轿、打着伞、敲着锣，亲自来上祭。
贾珍忙接著，让至逗蜂轩献茶。|贾珍连忙迎接，请到逗蜂轩奉茶。
贾珍心中打算定了主意，因而趁便就说要与贾蓉捐个前程的话。|贾珍心里早打定了主意，就趁机提出要给贾蓉捐个官。
戴权会意，因笑道：“想是为丧礼上风光些。”|戴权心领神会，笑道：“想是为了丧礼上风光些吧。”
贾珍忙笑道：“老内相所见不差。”|贾珍忙笑道：“公公说得一点不错。”
戴权道：“事倒凑巧，正有个美缺，如今三百员龙禁尉短了两员，|戴权说：“事情倒也凑巧，正有个好缺：三百名龙禁尉缺了两名，
昨儿襄阳侯的兄弟老三来求我，现拿了一千五百两银子，送到我家里。|昨天襄阳侯的三弟来求我，拿了一千五百两银子送到我家里。
你知道，咱们都是老相与，不拘怎么样，看著他爷爷的分上，胡乱应了。|你知道，咱们都是老交情，不管怎么说，看在他爷爷的面子上，就随便答应了。
还剩了一个缺，谁知永兴节度使冯胖子来求，要与他孩子捐，我就没工夫应他。|还剩一个缺，偏偏永兴节度使冯胖子来求，要给他孩子捐，我还没顾上答应他。
既是咱们的孩子要捐，快写个履历来。”|既然是咱们的孩子要捐，快写个履历来。”
贾珍听说，忙吩咐：“快命书房里人恭敬写了大爷的履历来。”|贾珍听了，忙吩咐：“快叫书房里的人恭恭敬敬写好大爷的履历拿来。”
小厮不敢怠慢，去了一刻，便拿了一张红纸来与贾珍。|小厮不敢怠慢，去了一会儿，就拿来一张红纸交给贾珍。
贾珍看了，忙送与戴权。|贾珍看了，连忙递给戴权。
看时，上面写道：|只见上面写着：
江南江宁府江宁县监生贾蓉，年二十岁。|江南江宁府江宁县监生贾蓉，二十岁。
曾祖，原任京营节度使世袭一等神威将军贾代化，|曾祖父：原任京营节度使、世袭一等神威将军贾代化；
祖，乙卯科进士贾敬，|祖父：乙卯科进士贾敬；
父，世袭三品爵威烈将军贾珍。|父亲：世袭三品爵威烈将军贾珍。
! 龙禁尉是皇宫的禁卫官，名义上五品。宫里的太监公然卖官，价码随口就报，这是作者对官场的讽刺。
! 履历一写，宁府四代一目了然：曾祖是一等将军，祖父中了进士却去修道，父亲袭了三品，到贾蓉只是个监生，一代不如一代。

# 十二、一千二百两
戴权看了，回手便递与一个贴身的小厮收了，说道：|戴权看了，随手递给一个贴身小厮收着，说：
“回来送与户部堂官老赵，说我拜上他，起一张五品龙禁尉的票，再给个执照，就把这履历填上，明儿我来兑银子送去。”|“回去送给户部的赵堂官，说我问他好，开一张五品龙禁尉的票，再给个执照，把这份履历填上，明天我来兑了银子送去。”
小厮答应了，戴权也就告辞了。|小厮答应了，戴权也就告辞了。
贾珍十分款留不住，只得送出府门。|贾珍怎么留也留不住，只好送出府门。
临上轿，贾珍因问：“银子还是我到部兑，还是一并送入老内相府中？”|临上轿时，贾珍问：“银子是我到户部去交，还是一起送到公公府上？”
戴权道：“若到部里，你又吃亏了。|戴权说：“要是到户部去交，你又吃亏了。
不如平准一千二百两银子，送到我家就完了。”|不如照实一千二百两银子，送到我家就行了。”
贾珍感谢不尽，只说：“待服满后，亲带小犬到府叩谢。”|贾珍千恩万谢，只说：“等丧服期满，我亲自带犬子到府上磕头道谢。”
于是作别。|于是告别。
! 襄阳侯家出了一千五百两，贾家只要一千二百两，还说“到部里你又吃亏”。看上去是给面子，其实钱都进了太监自己的口袋。

# 十三、各家来祭
接著，便又听喝道之声，原来是忠靖侯史鼎的夫人来了。|接着又听见开道的吆喝声，原来是忠靖侯史鼎的夫人来了。
王夫人，邢夫人，凤姐等刚迎入上房，又见锦乡侯，川宁侯，寿山伯三家祭礼摆在灵前。|王夫人、邢夫人、凤姐等刚把她迎进上房，又见锦乡侯、川宁侯、寿山伯三家的祭礼摆到了灵前。
少时，三人下轿，贾政等忙接上大厅。|不一会儿，三位老爷下了轿，贾政等人连忙接到大厅上。
如此亲朋你来我去，也不能胜数。|这样亲朋好友你来我往，数也数不清。
只这四十九日，宁国府街上一条白漫漫人来人往，花簇簇官去官来。|单这四十九天里，宁国府那条街上白茫茫一片穿孝的人来来往往，花团锦簇的官员去去来来。
! 忠靖侯史鼎是史湘云的叔叔，史家是“护官符”上“阿房宫，三百里，住不下金陵一个史”的那一家。

# 十四、五品恭人的排场
贾珍命贾蓉次日换了吉服，领凭回来。|贾珍叫贾蓉第二天换上吉服，把任命的凭证领回来。
灵前供用执事等物俱按五品职例。|灵前用的供品和仪仗，全都按五品官的规格。
灵牌疏上皆写“天朝诰授贾门秦氏恭人之灵位”。|灵牌和疏文上都写着“天朝诰授贾门秦氏恭人之灵位”。
会芳园临街大门洞开，旋在两边起了鼓乐厅，两班青衣按时奏乐，一对对执事摆的刀斩斧齐。|会芳园临街的大门大开，两边临时搭起了鼓乐厅，两班乐手按时奏乐，一对对仪仗排得整整齐齐。
更有两面朱红销金大字牌对竖在门外，上面大书：“防护内廷紫禁道御前侍卫龙禁尉”。|门外还竖着两面朱红底、贴金大字的牌子，上面写着：“防护内廷紫禁道御前侍卫龙禁尉”。
对面高起著宣坛，僧道对坛榜文，榜上大书：|对面高高搭起宣讲的法坛，和尚道士对坛贴出榜文，榜上大字写着：
“世袭宁国公冢孙妇，防护内廷御前侍卫龙禁尉贾门秦氏恭人之丧。|“世袭宁国公长孙媳妇，防护内廷御前侍卫龙禁尉贾门秦氏恭人之丧。
四大部州至中之地，奉天承运太平之国，总理虚无寂静教门僧录司正堂万虚，总理元始三一教门道录司正堂叶生等，敬谨修斋，朝天叩佛”，|四大部洲最中心的地方、奉天承运的太平之国，总管佛教的僧录司正堂万虚、总管道教的道录司正堂叶生等，恭敬地设斋，朝拜上天、叩拜佛祖”，
以及“恭请诸伽蓝，揭谛，功曹等神，圣恩普锡，神威远镇，四十九日消灾洗业平安水陆道场”等语，亦不消烦记。|还有“恭请各位伽蓝、揭谛、功曹等神灵，普施恩泽，神威镇守，四十九天消灾洗业平安水陆道场”等话，就不必一一记下了。
! “恭人”是五品官妻子的封号。一千二百两银子换来的，就是牌位上这两个字。
! 僧录司的“万虚”、道录司的“叶生”，名字也有寓意：万般皆虚，“叶生”或谐“业生”。

# 十五、内宅无人主持
只是贾珍虽然此时心意满足，但里面尤氏又犯了旧疾，不能料理事务，|贾珍这时虽然心满意足，可里头尤氏又犯了老病，不能管事，
惟恐各诰命来往，亏了礼数，怕人笑话，因此心中不自在。|他怕各家诰命夫人来来往往，礼数不周，叫人笑话，所以心里不痛快。
当下正忧虑时，因宝玉在侧问道：“事事都算安贴了，大哥哥还愁什么？”|正发愁的时候，宝玉在旁边问：“样样事都算安排妥当了，大哥哥还愁什么？”
贾珍见问，便将里面无人的话说了出来。|贾珍见他问，就把里头没人主事的话说了出来。
宝玉听说笑道：“这有何难，我荐一个人与你权理这一个月的事，管必妥当。”|宝玉听了笑道：“这有什么难的，我推荐一个人给你，暂时管这一个月的事，保管妥当。”
贾珍忙问：“是谁？”|贾珍忙问：“是谁？”
宝玉见座间还有许多亲友，不便明言，走至贾珍耳边说了两句。|宝玉见座上还有许多亲友，不便明说，走到贾珍耳边说了两句。
贾珍听了喜不自禁，连忙起身笑道：“果然安贴，如今就去。”|贾珍听了喜出望外，连忙站起来笑道：“果然妥当，现在就去。”
说著拉了宝玉，辞了众人，便往上房里来。|说着拉上宝玉，辞别众人，就往上房来了。
! 推荐凤姐的偏偏是宝玉。他最懂得哪个女子有本事，第一回作者说“闺阁中本自历历有人”，凤姐就是其中之一。

# 十六、贾珍求凤姐
可巧这日非正经日期，亲友来的少，里面不过几位近亲堂客，邢夫人，王夫人，凤姐并合族中的内眷陪坐。|正好这天不是正日子，来的亲友少，里面只有几位近亲女客，由邢夫人、王夫人、凤姐和族里的女眷陪着。
闻人报：“大爷进来了。”|听见有人报：“大爷进来了。”
唬的众婆娘忽的一声，往后藏之不迭，独凤姐款款站了起来。|吓得那些女眷呼的一声往后躲都来不及，只有凤姐不慌不忙地站了起来。
贾珍此时也有些病症在身，二则过于悲痛了，因拄个拐踱了进来。|贾珍这时身上也有些病，再加上悲痛过度，就拄着一根拐杖慢慢走了进来。
邢夫人等因说道：“你身上不好，又连日事多，该歇歇才是，又进来做什么？”|邢夫人等说：“你身子不好，又连着几天事情多，该歇歇才是，又进来做什么？”
贾珍一面扶拐，扎挣著要蹲身跪下请安道乏。|贾珍一边扶着拐杖，一边硬撑着要跪下请安、道辛苦。
邢夫人等忙叫宝玉搀住，命人挪椅子来与他坐。|邢夫人等连忙叫宝玉扶住他，叫人搬椅子来给他坐。
贾珍断不肯坐，因勉强陪笑道：“侄儿进来有一件事要求二位婶子并大妹妹。”|贾珍说什么也不肯坐，勉强陪着笑说：“侄儿进来，有一件事要求二位婶子和大妹妹。”
邢夫人等忙问：“什么事？”|邢夫人等忙问：“什么事？”
贾珍忙笑道：“婶子自然知道，如今孙子媳妇没了，侄儿媳妇偏又病倒，我看里头著实不成个体统。|贾珍忙笑道：“婶子自然知道，现在孙子媳妇没了，侄儿媳妇偏偏又病倒了，我看里头实在不成样子。
怎么屈尊大妹妹一个月，在这里料理料理，我就放心了。”|能不能委屈大妹妹一个月，在这里料理料理，我就放心了。”
! 别的女眷都躲，只有凤姐“款款站了起来”。这一个动作，已经写出了她和众人的不同。
! 贾珍为儿媳拄拐，作者特意写他“也有些病症在身”“过于悲痛”。

# 十七、王夫人犹豫
邢夫人笑道：“原来为这个。|邢夫人笑道：“原来是为这个。
你大妹妹现在你二婶子家，只和你二婶子说就是了。”|你大妹妹现在在你二婶子家，你只跟你二婶子说就是了。”
王夫人忙道：“他一个小孩子家，何曾经过这样事，倘或料理不清，反叫人笑话，倒是再烦别人好。”|王夫人忙说：“她一个小孩子家，哪里经过这样的事，要是料理不清，反倒叫人笑话，还是再请别人好。”
贾珍笑道：“婶子的意思侄儿猜著了，是怕大妹妹劳苦了。|贾珍笑道：“婶子的意思侄儿猜到了，是怕大妹妹太辛苦。
若说料理不开，我包管必料理的开，便是错一点儿，别人看著还是不错的。|要说料理不过来，我保证她料理得过来，就算出一点错，别人看着也还是不错的。
从小儿大妹妹顽笑著就有杀伐决断，如今出了阁，又在那府里办事，越发历练老成了。|大妹妹从小玩着闹着就有杀伐决断的魄力，现在出了嫁，又在那府里管事，越发历练得老成了。
我想了这几日，除了大妹妹再无人了。|我想了这几天，除了大妹妹再没别人了。
婶子不看侄儿，侄儿媳妇的分上，只看死了的分上罢！”|婶子不看侄儿和侄儿媳妇的面子，就看在死了的人的面子上吧！”
说著滚下泪来。|说着滚下泪来。
! 邢夫人一句“只和你二婶子说”，把事推得干干净净。凤姐是她的儿媳，却住在王夫人那边当家，邢夫人心里一直不痛快。
! “杀伐决断”四个字，正是凤姐管家的本色，下一回就要见识。

# 十八、凤姐接下对牌
王夫人心中怕的是凤姐儿未经过丧事，怕他料理不清，惹人耻笑。|王夫人心里担心的是凤姐没办过丧事，怕她料理不清，惹人笑话。
今见贾珍苦苦的说到这步田地，心中已活了几分，却又眼看著凤姐出神。|现在见贾珍苦苦哀求到这个地步，心里已经松动了几分，就看着凤姐出神。
那凤姐素日最喜揽事办，好卖弄才干，虽然当家妥当，也因未办过婚丧大事，恐人还不伏，巴不得遇见这事。|凤姐平时最喜欢揽事，爱显摆本事。她虽然管家妥当，可因为没办过婚丧大事，怕别人还不服气，正巴不得碰上这种事。
今见贾珍如此一来，他心中早已欢喜。|现在见贾珍这样来求，她心里早就高兴了。
先见王夫人不允，后见贾珍说的情真，王夫人有活动之意，便向王夫人道：|先是见王夫人不答应，后来见贾珍说得情真意切，王夫人有松口的意思，就对王夫人说：
“大哥哥说的这么恳切，太太就依了罢。”|“大哥哥说得这么恳切，太太就答应了吧。”
王夫人悄悄的道：“你可能么？”|王夫人小声问：“你能行吗？”
凤姐道：“有什么不能的。|凤姐说：“有什么不行的。
外面的大事已经大哥哥料理清了，不过是里头照管照管，便是我有不知道的，问问太太就是了。”|外面的大事大哥哥已经料理清楚了，不过是里头照看照看，就算有我不知道的，问问太太就是了。”
王夫人见说的有理，便不作声。|王夫人见她说得有理，就不作声了。
贾珍见凤姐允了，又陪笑道：“也管不得许多了，横竖要求大妹妹辛苦辛苦。|贾珍见凤姐答应了，又陪笑说：“也顾不了那么多了，反正要求大妹妹辛苦辛苦。
我这里先与妹妹行礼，等事完了，我再到那府里去谢。”|我这里先给妹妹行礼，等事完了，我再到那府里去道谢。”
说著就作揖下去，凤姐儿还礼不迭。|说着就作揖，凤姐连忙还礼。
! 作者直说凤姐“最喜揽事办，好卖弄才干”。她的才干是真的，她的好强也是真的，后来的祸根就在这份好强里。

# 十九、“只要好看为上”
贾珍便忙向袖中取了宁国府对牌出来，命宝玉送与凤姐，又说：|贾珍连忙从袖子里拿出宁国府的对牌，叫宝玉交给凤姐，又说：
“妹妹爱怎样就怎样，要什么只管拿这个取去，也不必问我。|“妹妹想怎么办就怎么办，要什么只管拿这个去取，也不必问我。
只求别存心替我省钱，只要好看为上，二则也要同那府里一样待人才好，不要存心怕人抱怨。|只求你别存心替我省钱，好看最要紧；第二，待人也要和那府里一样，不要怕人抱怨。
只这两件外，我再没不放心的了。”|除了这两件，我再没有不放心的了。”
凤姐不敢就接牌，只看著王夫人。|凤姐不敢马上接对牌，只看着王夫人。
王夫人道：“你哥哥既这么说，你就照看照看罢了。|王夫人说：“你哥哥既然这么说，你就照看照看吧。
只是别自作主意，有了事，打发人问你哥哥，嫂子要紧。”|只是别自作主张，有了事，派人问你哥哥、嫂子要紧。”
宝玉早向贾珍手里接过对牌来，强递与凤姐了。|宝玉早从贾珍手里接过对牌，硬塞给了凤姐。
又问：“妹妹住在这里，还是天天来呢？|贾珍又问：“妹妹是住在这里，还是天天来？
若是天天来，越发辛苦了。|要是天天来，就更辛苦了。
不如我这里赶著收拾出一个院落来，妹妹住过这几日倒安稳。”|不如我这里赶紧收拾出一个院子来，妹妹住这几天倒安稳些。”
凤姐笑道：“不用。|凤姐笑道：“不用。
那边也离不得我，倒是天天来的好。”|那边也离不了我，还是天天来的好。”
贾珍听说，只得罢了。|贾珍听了，只好作罢。
然后又说了一回闲话，方才出去。|然后又说了一会儿闲话，才出去。
! “对牌”是支取财物的凭证，拿着它就能到库房领东西。贾珍把宁府的对牌交出去，等于把一府的财权都交给了凤姐。
! 贾珍只要“好看”，不心疼钱。宁府后来败落，这份挥霍是一个原因。
! 凤姐不肯住在宁府，是聪明的避嫌。

# 二十、凤姐理出五件弊病
一时女眷散后，王夫人因问凤姐：“你今儿怎么样？”|女眷们散了以后，王夫人问凤姐：“你今天怎么打算？”
凤姐儿道：“太太只管请回去，我须得先理出一个头绪来，才回去得呢。”|凤姐说：“太太只管先回去，我得先理出个头绪来，才能回去。”
王夫人听说，便先同邢夫人等回去，不在话下。|王夫人听了，就先和邢夫人等回去了，这里不多说。
这里凤姐儿来至三间一所抱厦内坐了，因想：|凤姐来到一所三间的抱厦里坐下，心想：
头一件是人口混杂，遗失东西，|第一件，人多手杂，容易丢东西；
第二件，事无专执，临期推委，|第二件，事情没有专人负责，到时候互相推诿；
第三件，需用过费，滥支冒领，|第三件，开销太大，乱支乱领；
第四件，任无大小，苦乐不均，|第四件，差事不分大小，有的苦有的闲，苦乐不均；
第五件，家人豪纵，有脸者不服钤束，无脸者不能上进。|第五件，家里的仆人放纵惯了，有体面的不服管教，没体面的又没法出头。
此五件实是宁国府中风俗，不知凤姐如何处治，且听下回分解。|这五件实在是宁国府的老毛病，不知凤姐怎么整治，请看下回分解。
正是：|正是：
~金紫万千谁治国，裙钗一二可齐家。|朝廷里穿金戴紫的官员成千上万，有谁能治好国家？闺阁里一两个女子，倒能把家管好。
! 凤姐一坐下就把宁府的病根看透了，五条句句切中。这也是贾府整体的病：人多、推诿、浪费、不公、仆人骄纵。
! 回末两句和秦氏托梦里的“脂粉队里的英雄”遥相呼应，作者是真心佩服这样的女子。
</script>

<script type="text/plain" id="ch14">
# 一、宁府管家的担心
话说宁国府中都总管来升闻得里面委请了凤姐，因传齐同事人等说道：|宁国府的大总管来升听说里头请了凤姐来管事，就把同事们召集起来说：
“如今请了西府里琏二奶奶管理内事，倘或他来支取东西，或是说话，我们须要比往日小心些。|“现在请了西府的琏二奶奶来管内宅的事，要是她来支取东西，或者有话吩咐，我们得比往常小心些。
每日大家早来晚散，宁可辛苦这一个月，过后再歇著，不要把老脸丢了。|每天大家早来晚走，宁可辛苦这一个月，过后再歇着，别把老脸丢了。
那是个有名的烈货，脸酸心硬，一时恼了，不认人的。”|那是个有名的厉害角色，脸一沉心就硬，一旦恼了，谁的情面也不认。”
众人都道：“有理。”|大家都说：“有道理。”
又有一个笑道：“论理，我们里面也须得他来整治整治，都忒不像了。”|又有一个人笑道：“说实话，我们里头也该有她来整治整治，都太不像话了。”
正说著，只见来旺媳妇拿了对牌来领取呈文京榜纸札，票上批著数目。|正说着，只见来旺媳妇拿着对牌来领取写文书、贴榜文用的纸张，票子上写着数目。
众人连忙让坐倒茶，一面命人按数取纸来抱著，同来旺媳妇一路来至仪门口，方交与来旺媳妇自己抱进去了。|大家连忙让座倒茶，一面叫人按数取了纸抱着，陪来旺媳妇一路走到仪门口，才交给来旺媳妇自己抱进去。
! 凤姐还没到，名声已经先到了。连宁府的下人都知道宁府“忒不像了”。
! 来旺媳妇是凤姐的陪房。宁府的人对她格外殷勤，正是看凤姐的面子。

# 二、点名
凤姐即命彩明钉造簿册。|凤姐马上叫彩明装订簿册。
即时传来升媳妇，兼要家口花名册来查看，又限于明日一早传齐家人媳妇进来听差等语。|又立刻叫来来升媳妇，要了全家仆人的花名册来查看，还限定明天一早把家里的媳妇们都传齐，进来听候差遣。
大概点了一点数目单册，问了来升媳妇几句话，便坐车回家。|大概清点了一下数目和名册，问了来升媳妇几句话，就坐车回家了。
一宿无话。|一夜无话。
至次日，卯正二刻便过来了。|第二天，卯正二刻（早上六点半）就过来了。
那宁国府中婆娘媳妇闻得到齐，只见凤姐正与来升媳妇分派，众人不敢擅入，只在窗外听觑。|宁国府的婆子媳妇听说要到齐，都来了，只见凤姐正和来升媳妇分派差事，大家不敢随便进去，只在窗外偷听偷看。
只听凤姐与来升媳妇道：|只听凤姐对来升媳妇说：
“既托了我，我就说不得要讨你们嫌了。|“既然托付给了我，我就顾不得招你们讨厌了。
我可比不得你们奶奶好性儿，由著你们去。|我可不像你们奶奶脾气好，由着你们去。
再不要说你们‘这府里原是这样’的话，如今可要依著我行，|再别说‘我们这府里原来就是这样’的话，现在可要照我的办，
错我半点儿，管不得谁是有脸的，谁是没脸的，一例现清白处理。”|错了我半点，不管谁有体面谁没体面，一律当场照规矩处理。”
说著，便吩咐彩明念花名册，按名一个一个的唤进来看视。|说着，就吩咐彩明念花名册，按名字一个一个叫进来看。
! 彩明是凤姐身边识字的小厮。凤姐自己不识字，账目全靠他念、他记。
! 一上来先堵住“这府里原是这样”这句话，凤姐把宁府最大的毛病点破了：什么都推给惯例。

# 三、分派差事
一时看完，便又吩咐道：|看完了，又吩咐说：
“这二十个分作两班，一班十个，每日在里头单管人客来往倒茶，别的事不用他们管。|“这二十个人分成两班，一班十个，每天在里面专管客人来往倒茶，别的事不用他们管。
这二十个也分作两班，每日单管本家亲戚茶饭，别的事也不用他们管。|这二十个也分两班，每天专管本家亲戚的茶饭，别的事也不用他们管。
这四十个人也分作两班，单在灵前上香添油，挂幔守灵，供饭供茶，随起举哀，别的事也不与他们相干。|这四十个人也分两班，专在灵前上香添油、挂帐守灵、供饭供茶，有人哭就跟着哭，别的事也和他们无关。
这四个人单在内茶房收管杯碟茶器，若少一件，便叫他四个描赔。|这四个人专在内茶房管杯碟茶具，少一件就叫他们四个赔。
这四个人单管酒饭器皿，少一件，也是他四个描赔。|这四个人专管酒饭器皿，少一件，也是他们四个赔。
这八个单管监收祭礼。|这八个专管监收各家送来的祭礼。
这八个单管各处灯油，蜡烛，纸札，我总支了来，交与你八个，然后按我的定数再往各处去分派。|这八个专管各处的灯油、蜡烛、纸张，我统一领来交给你们八个，再按我定的数目分到各处去。
这三十个每日轮流各处上夜，照管门户，监察火烛，打扫地方。|这三十个每天轮流在各处守夜，照看门户，检查火烛，打扫地面。
这下剩的按著房屋分开，某人守某处，某处所有桌椅古董起，至于痰盒掸帚，一草一苗，或丢或坏，就和守这处的人算帐描赔。|剩下的按房屋分开，谁守哪里，那里所有的东西，从桌椅古董起，到痰盒掸子，一草一木，丢了坏了，就找守那里的人算账赔偿。
来升家的每日揽总查看，或有偷懒的，赌钱吃酒的，打架拌嘴的，立刻来回我，|来升媳妇每天总负责查看，有偷懒的、赌钱喝酒的、打架吵嘴的，立刻来报告我。
你有徇情，经我查出，三四辈子的老脸就顾不成了。|你要是徇私包庇，被我查出来，你家三四代人的老脸面就保不住了。
如今都有定规，以后那一行乱了，只和那一行说话。|现在都定好了规矩，以后哪一行出了乱子，就只找哪一行问。
素日跟我的人，随身自有钟表，不论大小事，我是皆有一定的时辰。|平时跟我的人，身上都带着钟表，不论大事小事，我都有一定的时辰。
横竖你们上房里也有时辰钟。|反正你们上房里也有时钟。
卯正二刻我来点卯，巳正吃早饭，凡有领牌回事的，只在午初刻。|卯正二刻（六点半）我来点名，巳正（上午十点）吃早饭，凡是领对牌、回事情的，只在午初刻（十一点）。
戌初烧过黄昏纸，我亲到各处查一遍，回来上夜的交明钥匙。|戌初（晚上七点）烧过黄昏纸，我亲自到各处查一遍，回来后守夜的交清钥匙。
第二日仍是卯正二刻过来。|第二天还是卯正二刻过来。
说不得咱们大家辛苦这几日罢，事完了，你们家大爷自然赏你们。”|没办法，咱们大家辛苦这几天吧，事完了，你们大爷自然会赏你们。”
! 这一段就是凤姐对上一回“五件弊病”开的药方：分工到人、责任到人、赔偿到人、时间到点。用今天的话说，就是岗位责任制。
! 凤姐用西洋钟表计时，这在当时是很稀罕的东西，也写出她做事讲效率。

# 四、立见成效
说罢，又吩咐按数发与茶叶，油烛，鸡毛掸子，笤帚等物。|说完，又吩咐按数目发给茶叶、灯油蜡烛、鸡毛掸子、扫帚等东西。
一面又搬取家伙：桌围，椅搭，坐褥，毡席，痰盒，脚踏之类。|一面又搬出家具用品：桌围、椅套、坐垫、毡席、痰盒、脚凳之类。
一面交发，一面提笔登记，某人管某处，某人领某物，开得十分清楚。|一边发放，一边让人提笔登记，谁管哪里、谁领了什么，记得清清楚楚。
众人领了去，也都有了投奔，不似先时只拣便宜的做，剩下的苦差没个招揽。|大家领了差事去，都有了着落，不像以前那样只挑轻松的干，苦差事没人接。
各房中也不能趁乱失迷东西。|各房里也没法趁乱丢失东西了。
便是人来客往，也都安静了，|就算客人来来往往，也都安静了，
不比先前一个正摆茶，又去端饭，正陪举哀，又顾接客。|不像以前那样，一个人刚摆上茶，又去端饭，正陪着哭灵，又要去接客。
如这些无头绪，荒乱，推托，偷闲，窃取等弊，次日一概都蠲了。|像这些没头绪、慌乱、推诿、偷懒、偷东西的毛病，第二天就全都没有了。
凤姐儿见自己威重令行，心中十分得意。|凤姐见自己有威望、令出必行，心里十分得意。
因见尤氏犯病，贾珍又过于悲哀，不大进饮食，|又因为尤氏病着，贾珍又悲伤过度，不怎么吃东西，
自己每日从那府中煎了各样细粥，精致小菜，命人送来劝食。|她每天从荣府那边熬好各种细粥、做好精致的小菜，叫人送过来劝他们吃。
贾珍也另外吩咐每日送上等菜到抱厦内，单与凤姐。|贾珍也另外吩咐每天送上等菜到抱厦里，专门给凤姐吃。
那凤姐不畏勤劳，天天于卯正二刻就过来点卯理事，独在抱厦内起坐，不与众妯娌合群，便有堂客来往，也不迎会。|凤姐不怕辛苦，天天卯正二刻就过来点名理事，一个人在抱厦里起居，不和妯娌们凑在一起，就是有女客来往，也不去应酬。
! “次日一概都蠲了”：凤姐只用了一天。
! “心中十分得意”，作者不忘点出这份得意。凤姐的才干和她的虚荣是连在一起的。

# 五、五七那天的法事
这日乃五七正五日上，那应佛僧正开方破狱，传灯照亡，参阎君，拘都鬼，筵请地藏王，开金桥，引幢幡，|这天是五七的第五天，应佛的和尚们正在做“开方破狱”的法事：传灯照亮亡魂的路，参拜阎王，拘来都鬼，设宴请地藏王，开金桥，引幢幡；
那道士们正伏章申表，朝三清，叩玉帝，|道士们正跪着上奏表章，朝拜三清，叩拜玉帝；
禅僧们行香，放焰口，拜水忏，|禅僧们在烧香、放焰口、拜水忏；
又有十三众尼僧，搭绣衣，靸红鞋，在灵前默诵接引诸咒，十分热闹。|还有十三位尼姑，披着绣花袈裟，趿着红鞋，在灵前默念接引亡魂的各种咒语，十分热闹。
那凤姐必知今日人客不少，在家中歇宿一夜，至寅正，平儿便请起来梳洗。|凤姐料定今天客人不少，在家里歇了一夜，到寅正（凌晨四点），平儿就请她起来梳洗。
及收拾完备，更衣盥手，吃了两口奶子糖粳米粥，漱口已毕，已是卯正二刻了。|等收拾停当，换好衣服洗了手，喝了两口奶糖粳米粥，漱完口，已经是卯正二刻了。
来旺媳妇率领诸人伺候已久。|来旺媳妇带着众人已经伺候了很久。
! 佛教、道教、禅宗、尼姑一齐上阵，各做各的法事。作者写得越热闹，越显出这场丧事的铺张。

# 六、凤姐哭灵
凤姐出至厅前，上了车，前面打了一对明角灯，大书“荣国府”三个大字，款款来至宁府。|凤姐走到厅前上了车，前面打着一对明角灯，上面写着“荣国府”三个大字，不慌不忙地来到宁府。
大门上门灯朗挂，两边一色戳灯，照如白昼，白汪汪穿孝仆从两边侍立。|宁府大门上挂着明亮的门灯，两边一色的落地灯，照得像白天一样，穿着白色孝服的仆人在两边站着。
请车至正门上，小厮等退去，众媳妇上来揭起车帘。|车到了正门，小厮们退下，媳妇们上来掀起车帘。
凤姐下了车，一手扶著丰儿，两个媳妇执著手把灯罩，簇拥著凤姐进来。|凤姐下了车，一只手扶着丰儿，两个媳妇举着手提灯，簇拥着凤姐进来。
宁府诸媳妇迎来请安接待。|宁府的媳妇们迎上来请安接待。
凤姐缓缓走入会芳园中登仙阁灵前，一见了棺材，那眼泪恰似断线之珠，滚将下来。|凤姐慢慢走进会芳园登仙阁的灵前，一看见棺材，眼泪就像断了线的珠子一样滚下来。
院中许多小厮垂手伺候烧纸。|院子里许多小厮垂着手等着烧纸。
凤姐吩咐得一声：“供茶烧纸。”|凤姐吩咐一声：“供茶，烧纸。”
只听一棒锣鸣，诸乐齐奏，早有人端过一张大圈椅来，放在灵前，凤姐坐了，放声大哭。|只听一声锣响，各种乐器一齐奏起，早有人端来一把大圈椅放在灵前，凤姐坐下，放声大哭。
于是里外男女上下，见凤姐出声，都忙忙接声嚎哭。|于是里里外外、男男女女、上上下下，见凤姐哭出声来，都赶紧跟着放声大哭。
! 凤姐的眼泪是真的，她和秦氏是真好。可这场哭也是一场仪式：锣一响，乐一奏，她一开口，全府跟着哭。
! 真情和排场搅在一起，这正是贾府的样子。

# 七、迟到的人
一时贾珍尤氏遣人来劝，凤姐方才止住。|过了一会儿，贾珍、尤氏派人来劝，凤姐才止住哭。
来旺媳妇献茶漱口毕，凤姐方起身，别过族中诸人，自入抱厦内来。|来旺媳妇递茶给她漱了口，凤姐才站起来，辞别族里的人，自己回到抱厦里来。
按名查点，各项人数都已到齐，只有迎送亲客上的一人未到。|按名单点名，各项的人都到齐了，只有负责迎送亲客的一个人没到。
即命传到，那人已张惶愧惧。|立刻叫人把他传来，那人已经慌张害怕得不得了。
凤姐冷笑道：“我说是谁误了，原来是你！|凤姐冷笑道：“我说是谁误了事，原来是你！
你原比他们有体面，所以才不听我的话。”|你本来就比他们有体面，所以才不听我的话。”
那人道：“小的天天都来的早，只有今儿，醒了觉得早些，因又睡迷了，来迟了一步，求奶奶饶过这次。”|那人说：“小的天天都来得早，只有今天，醒来觉得还早，就又睡过头了，来晚了一步，求奶奶饶过这一回。”
正说著，只见荣国府中的王兴媳妇来了，在前探头。|正说着，只见荣国府的王兴媳妇来了，在门前探头探脑。

# 八、一件件领牌回事
凤姐且不发放这人，却先问：“王兴媳妇作什么？”|凤姐先不处置这个人，却问：“王兴媳妇来做什么？”
王兴媳妇巴不得先问他完了事，连忙进去说：“领牌取线，打车轿网络。”|王兴媳妇巴不得先问她把事办了，连忙进去说：“来领对牌取线，编车轿上的网络。”
说著，将个帖儿递上去。|说着递上一张帖子。
凤姐命彩明念道：“大轿两顶，小轿四顶，车四辆，共用大小络子若干根，用珠儿线若干斤。”|凤姐叫彩明念，彩明念道：“大轿两顶，小轿四顶，车四辆，共用大小络子多少根，用珠儿线多少斤。”
凤姐听了，数目相合，便命彩明登记，取荣国府对牌掷下。|凤姐听了，数目对得上，就叫彩明登记，取出荣国府的对牌扔了下去。
王兴家的去了。|王兴媳妇就走了。
凤姐方欲说话时，见荣国府的四个执事人进来，都是要支取东西领牌来的。|凤姐正要说话，又见荣国府的四个管事的人进来，都是来领对牌支东西的。
凤姐命彩明要了帖念过，听了一共四件，指两件说道：“这两件开销错了，再算清了来取。”|凤姐叫彩明要了帖子念，一共四件，她指着其中两件说：“这两件开销算错了，再算清楚了来领。”
说著掷下帖子来。|说着把帖子扔了下来。
那二人扫兴而去。|那两个人扫兴地走了。
凤姐因见张材家的在旁，因问：“你有什么事？”|凤姐见张材媳妇在旁边，就问：“你有什么事？”
张材家的忙取帖儿回说：“就是方才车轿围作成，领取裁缝工银若干两。”|张材媳妇连忙拿出帖子回说：“就是刚才车轿的围子做好了，来领裁缝的工钱多少两。”
凤姐听了，便收了帖子，命彩明登记。|凤姐听了，就收下帖子，叫彩明登记。
待王兴家的交过牌，得了买办的回押相符，然后方与张材家的去领。|要等王兴媳妇交回对牌、买办那边的回执也对上了，才让张材媳妇去领钱。
一面又命念那一个，是为宝玉外书房完竣，支买纸料糊裱。|一面又叫念另一张，是宝玉的外书房修好了，要支钱买纸来裱糊。
凤姐听了，即命收帖儿登记，待张材家的缴清，又发与这人去了。|凤姐听了，就叫收下帖子登记，等张材媳妇的账交清了，再发给这个人。
! 凤姐不识字，靠彩明念，却一听就能挑出算错的两件。她的心算比账房还快。
! 两府的事她一手抓：荣府的人跑到宁府来回事，她一样处理，账目还要前后对上才放钱。

# 九、打二十板子
凤姐便说道：“明儿他也睡迷了，后儿我也睡迷了，将来都没了人了。|凤姐这才说：“明天他也睡过头，后天我也睡过头，以后就都没人干活了。
本来要饶你，只是我头一次宽了，下次人就难管，不如现开发的好。”|本来想饶你，可我头一回宽容了，下回人就难管了，不如现在就处置的好。”
登时放下脸来，喝命：“带出去，打二十板子！”|立刻沉下脸来，喝令：“带出去，打二十板子！”
一面又掷下宁国府对牌：“出去说与来升，革他一月银米！”|一面又扔下宁国府的对牌：“出去告诉来升，扣他一个月的银子和米！”
众人听说，又见凤姐眉立，知是恼了，不敢怠慢，拖人的出去拖人，执牌传谕的忙去传谕。|众人听了，又见凤姐竖起了眉毛，知道她恼了，不敢怠慢，拖人的拖人，拿对牌去传话的赶紧去传话。
那人身不由己，已拖出去挨了二十大板，还要进来叩谢。|那人身不由己，被拖出去挨了二十大板，还得进来磕头谢恩。
凤姐道：“明日再有误的，打四十，后日的六十，有要挨打的，只管误！”|凤姐说：“明天再有误事的打四十，后天的打六十，有想挨打的，只管误！”
说著，吩咐：“散了罢。”|说完，吩咐：“散了吧。”
窗外众人听说，方各自执事去了。|窗外的众人听了，才各自去干活了。
彼时宁府荣府两处执事领牌交牌的，人来人往不绝，|这时宁府、荣府两边领对牌交对牌的人来来往往不断，
那抱愧被打之人含羞去了，这才知道凤姐利害。|那个挨了打的人满脸羞愧地走了，大家这才知道凤姐的厉害。
众人不敢偷闲，自此兢兢业业，执事保全。|大家不敢偷懒，从此兢兢业业，差事都办得妥妥当当。
不在话下。|这里不多说。
! 凤姐先不罚他，先办完别人的事，让他在旁边干等着看。这一等，比打更让人害怕。
! “杀一儆百”，凤姐第一天就立住了威。上一回贾珍说她“杀伐决断”，就是这样。

# 十、宝玉、秦钟来抱厦
如今且说宝玉因见今日人众，恐秦钟受了委曲，因默与他商议，要同他往凤姐处来坐。|再说宝玉见今天人多，怕秦钟受委屈，就悄悄和他商量，要一起到凤姐那里去坐。
秦钟道：“他的事多，况且不喜人去，咱们去了，他岂不烦腻。”|秦钟说：“她事情多，又不喜欢人去打扰，咱们去了，她岂不嫌烦。”
宝玉道：“他怎好腻我们，不相干，只管跟我来。”|宝玉说：“她怎么会嫌我们，不要紧，只管跟我来。”
说著，便拉了秦钟，直至抱厦。|说着就拉着秦钟，直接到了抱厦。
凤姐才吃饭，见他们来了，便笑道：“好长腿子，快上来罢。”|凤姐刚在吃饭，见他们来了，就笑道：“好长的腿，快上来吧。”
宝玉道：“我们偏了。”|宝玉说：“我们已经吃过了。”
凤姐道：“在这边外头吃的，还是那边吃的？”|凤姐问：“是在这边外头吃的，还是在那边吃的？”
宝玉道：“这边同那些浑人吃什么！|宝玉说：“在这边跟那些浑人吃什么！
原是那边，我们两个同老太太吃了来的。”|是在那边，我们两个跟老太太一起吃了来的。”
一面归坐。|一面坐下。
! 秦钟是死者的亲弟弟，可在宁府的人堆里，他只是个穷官家的孩子，所以宝玉怕他“受了委曲”。

# 十一、宝玉讨对牌
凤姐吃毕饭，就有宁国府中的一个媳妇来领牌，为支取香灯事。|凤姐吃完饭，就有宁国府的一个媳妇来领对牌，支取香烛灯油。
凤姐笑道：“我算著你们今儿该来支取，总不见来，想是忘了。|凤姐笑道：“我算着你们今天该来支取，老不见来，想是忘了。
这会子到底来取，要忘了，自然是你们包出来，都便宜了我。”|这会儿到底来了。要是忘了，自然得你们自己掏钱补上，倒便宜了我。”
那媳妇笑道：“何尝不是忘了，方才想起来，再迟一步，也领不成了。”|那媳妇笑道：“可不是忘了，刚刚才想起来，再晚一步就领不成了。”
说罢，领牌而去。|说完领了对牌走了。
一时登记交牌。|一会儿登记好，交回对牌。
秦钟因笑道：“你们两府里都是这牌，倘或别人私弄一个，支了银子跑了，怎样？”|秦钟笑道：“你们两府用的都是这种牌子，要是有人私下仿造一个，支了银子跑了，怎么办？”
凤姐笑道：“依你说，都没王法了。”|凤姐笑道：“照你这么说，就没有王法了。”
宝玉因道：“怎么咱们家没人领牌子做东西？”|宝玉问：“怎么咱们家没人领牌子做东西？”
凤姐道：“人家来领的时候，你还做梦呢。|凤姐说：“人家来领的时候，你还在做梦呢。
我且问你，你们这夜书多早晚才念呢？”|我倒要问你，你们这夜书什么时候才念呢？”
宝玉道：“巴不得这如今就念才好，他们只是不快收拾出书房来，这也无法。”|宝玉说：“巴不得现在就念才好，可他们就是不快点把书房收拾出来，这也没办法。”
凤姐笑道：“你请我一请，包管就快了。”|凤姐笑道：“你请我一请，保管就快了。”
宝玉道：“你要快也不中用，他们该作到那里的，自然就有了。”|宝玉说：“你想快也没用，他们该做到哪一步，自然就做好了。”
凤姐笑道：“便是他们作，也得要东西，搁不住我不给对牌是难的。”|凤姐笑道：“就算他们做，也得要东西，我要是不给对牌，他们就难办了。”
宝玉听说，便猴向凤姐身上立刻要牌，说：“好姐姐，给出牌子来，叫他们要东西去。”|宝玉听了，就像猴子一样缠到凤姐身上，立刻要对牌，说：“好姐姐，把牌子给出来，叫他们领东西去。”
凤姐道：“我乏的身子上生疼，还搁的住揉搓。|凤姐说：“我累得浑身疼，哪里经得起你这样揉搓。
你放心罢，今儿才领了纸裱糊去了，他们该要的还等叫去呢，可不傻了？”|你放心吧，今天刚领了纸去裱糊了，他们该要的东西还等着人去叫吗？那不是傻了？”
宝玉不信，凤姐便叫彩明查册子与宝玉看了。|宝玉不信，凤姐就叫彩明查出簿子给宝玉看了。
! 什么时候该领什么东西，凤姐心里有一本账，连别人忘了都知道。
! 宝玉急着念的“夜书”，其实是要和秦钟在一起。秦钟这时已经和智能儿有了私情，下一回就要出事。

# 十二、林如海去世
正闹著，人回：“苏州去的人昭儿来了。”|正闹着，有人来报：“去苏州的昭儿回来了。”
凤姐急命唤进来。|凤姐连忙叫他进来。
昭儿打千儿请安。|昭儿打千请安。
凤姐便问：“回来做什么的？”|凤姐问：“回来做什么？”
昭儿道：“二爷打发回来的。|昭儿说：“是二爷派我回来的。
林姑老爷是九月初三日巳时没的。”|林姑老爷是九月初三巳时去世的。
二爷带了林姑娘同送林姑老爷灵到苏州，大约赶年底就回来。|二爷带着林姑娘一起送林姑老爷的灵柩到苏州，大约年底就能回来。
二爷打发小的来报个信请安，讨老太太示下，还瞧瞧奶奶家里好，叫把大毛衣服带几件去。”|二爷叫小的回来报个信、请个安，听老太太的吩咐，再看看奶奶家里好不好，还叫带几件大毛衣服去。”
凤姐道：“你见过别人了没有？”|凤姐问：“你见过别人了没有？”
昭儿道：“都见过了。”|昭儿说：“都见过了。”
说毕，连忙退去。|说完连忙退下了。
凤姐向宝玉笑道：“你林妹妹可在咱们家住长了。”|凤姐对宝玉笑道：“你林妹妹可要在咱们家长住了。”
宝玉道：“了不得，想来这几日他不知哭的怎样呢。”|宝玉说：“不得了，想来这几天她不知哭成什么样了。”
说著，蹙眉长叹。|说着皱着眉长叹一声。
! 回目里的“林如海捐馆扬州城”，只用了一句话交代。“捐馆”是去世的委婉说法。
! 黛玉父母双亡，从此只能依靠贾府。凤姐说“住长了”，宝玉想的却是她在哭。

# 十三、凤姐连夜打点
凤姐见昭儿回来，因当著人未及细问贾琏，心中自是记挂，|凤姐见昭儿回来了，因为当着人没来得及细问贾琏的情况，心里自然惦记着。
待要回去，争奈事情繁杂，一时去了，恐有延迟失误，惹人笑话。|想回去，又因为事情繁杂，一走开恐怕耽误出错，惹人笑话。
少不得耐到晚上回来，复令昭儿进来，细问一路平安信息。|只好忍到晚上回去，又叫昭儿进来，仔细问了一路上平安与否。
连夜打点大毛衣服，和平儿亲自检点包裹，再细细追想所需何物，一并包藏交付昭儿。|连夜收拾大毛衣服，和平儿亲自检点包裹，又仔细想还需要什么，一起包好交给昭儿。
又细细吩咐昭儿：|又仔细吩咐昭儿：
“在外好生小心伏侍，不要惹你二爷生气，时时劝他少吃酒，别勾引他认得混帐老婆，回来打折你的腿”等语。|“在外面好好小心伺候，别惹你二爷生气，时时劝他少喝酒，别引着他去认识不三不四的女人，不然回来打断你的腿”等等。
赶乱完了，天已四更将尽，总睡下又走了困，不觉天明鸡唱，忙梳洗过宁府中来。|忙完的时候，天已经快过四更了，刚睡下又睡不着了，不知不觉天亮鸡叫，又赶忙梳洗到宁府来。
! 凤姐对贾琏是真惦记，也是真不放心。“别勾引他认得混帐老婆”，第二十一回贾琏和多姑娘的事，就证明她的担心不是多余的。

# 十四、铁槛寺预备停灵
那贾珍因见发引日近。|贾珍见出殡的日子近了，
亲自坐车，带了阴阳司吏，往铁槛寺来踏看寄灵所在。|就亲自坐车，带着阴阳司的官员，到铁槛寺去察看寄放灵柩的地方。
又一一嘱咐住持色空，好生预备新鲜陈设，多请名僧，以备接灵使用。|又一一嘱咐住持色空，好好预备新的陈设，多请些有名的和尚，准备接灵用。
色空忙看晚斋。|色空忙着安排晚斋。
贾珍也无心茶饭，因天晚不得进城，就在净室胡乱歇了一夜。|贾珍也没心思吃饭，因为天晚了进不了城，就在静室里随便歇了一夜。
次日早，便进城来料理出殡之事，|第二天一早就进城来料理出殡的事，
一面又派人先往铁槛寺，连夜另外修饰停灵之处，并厨茶等项接灵人口坐落。|一面又派人先去铁槛寺，连夜另外修整停灵的地方，还有厨房、茶房和接灵的人住的地方。
! 住持法号“色空”，就是第一回空空道人“因空见色，由色生情”的“色”和“空”。

# 十五、凤姐忙得茶饭不思
里面凤姐见日期有限，也预先逐细分派料理，|里头凤姐见日子不多了，也提前一样样细细分派料理，
一面又派荣府中车轿人从跟王夫人送殡，又顾自己送殡去占下处。|一面派荣府的车轿和随从跟王夫人送殡，又要安排自己送殡时住的地方。
目今正值缮国公诰命亡故，王邢二夫人又去打祭送殡，|偏偏这时缮国公的诰命夫人去世了，王夫人、邢夫人又要去祭奠送殡；
西安郡王妃华诞，送寿礼，|西安郡王妃过生日，要送寿礼；
镇国公诰命生了长男，预备贺礼，|镇国公的诰命夫人生了长子，要预备贺礼；
又有胞兄王仁连家眷回南，一面写家信禀叩父母并带往之物，|又有她的亲哥哥王仁带着家眷回南方，要写家信给父母请安，还要预备让他带去的东西；
又有迎春染病，每日请医服药，看医生启帖，症源，药案等事，亦难尽述。|又有迎春病了，每天请医吃药，看医生写的帖子、病源、药方这些事，也说不完。
又兼发引在迩，因此忙的凤姐茶饭也没工夫吃得，坐卧不能清净。|再加上出殡的日子就在眼前，凤姐忙得连茶饭都顾不上吃，坐也坐不安，睡也睡不稳。
刚到了宁府，荣府的人又跟到宁府，既回到荣府，宁府的人又找到荣府。|刚到宁府，荣府的人就跟到宁府；刚回荣府，宁府的人又找到荣府。
凤姐见如此，心中倒十分欢喜，并不偷安推托，恐落人褒贬，因此日夜不暇，筹划得十分的整肃。|凤姐见这样，心里反而非常高兴，一点也不偷懒推托，生怕落人话柄，所以日夜不停，安排得井井有条。
于是合族上下无不称叹者。|于是全族上下没有不称赞的。
! 婚丧寿诞、人情往来，一样样压在凤姐一个人身上，她却“十分欢喜”。这份要强，正是判词里说的“机关算尽太聪明”。
! 王仁就是后来曲子《留馀庆》里要卖巧姐的“狠舅”。

# 十六、伴宿之夜
这日伴宿之夕，里面两班小戏并耍百戏的与亲朋堂客伴宿，|这天是出殡前一夜的伴宿，里头有两班小戏和耍杂技的，陪着亲朋女客守夜，
尤氏犹卧于内室，一应张罗款待，独是凤姐一人周全承应。|尤氏还躺在里屋，所有张罗招待的事，全靠凤姐一个人周到应付。
合族中虽有许多妯娌，但或有羞口的，或有羞脚的，或有不惯见人的，或有惧贵怯官的，种种之类，|族里虽然有许多妯娌，可有的嘴笨不会说话，有的怕走动，有的不惯见人，有的见了贵人当官的就害怕，种种不一，
俱不及凤姐举止舒徐，言语慷慨，珍贵宽大，|都比不上凤姐举止从容、说话爽快、气度大方，
因此也不把众人放在眼里，挥霍指示，任其所为，目若无人。|因此她也不把众人放在眼里，指挥调度，随心所欲，目中无人。
一夜中灯明火彩，客送官迎，那百般热闹，自不用说的。|这一夜灯火辉煌，送客迎官，那种热闹，自然不用说了。
! “目若无人”四个字，夸中带贬。凤姐越出风头，越不知道收敛，后面弄权铁槛寺就是从这份自负来的。

# 十七、出殡
至天明，吉时已到，一般六十四名青衣请灵，前面铭旌上大书：|到了天亮，吉时到了，六十四名穿青衣的人抬灵，前面的铭旌上写着大字：
~奉天洪建兆年不易之朝誥封一等|奉天洪建兆年不易之朝，诰封一等
~寧國公冢孫婦防護內廷紫禁道|宁国公长孙媳妇，防护内廷紫禁道
~御前侍衛龍禁尉享強壽賈門秦氏恭人之靈柩|御前侍卫龙禁尉，享强寿，贾门秦氏恭人之灵柩
一应执事陈设，皆系现赶著新做出来的，一色光艳夺目。|所有的仪仗和陈设，都是现赶着新做出来的，一色光彩夺目。
宝珠自行未嫁女之礼外，摔丧驾灵，十分哀苦。|宝珠除了行未出嫁女儿的礼节，还摔丧盆、护灵柩，非常哀痛。
! 铭旌是出殡时写着死者官衔姓名的长幡。“奉天洪建兆年不易之朝”是作者虚构的朝代名，避开了写明哪一朝。
! “享强寿”：古人称四十岁为“强”，秦氏这么年轻，却写“强寿”，是丧礼上的客套话。
! 一千二百两捐来的“龙禁尉”，到这时全写上了铭旌，这就是贾珍要的“风光”。

# 十八、送殡的王公侯伯
那时官客送殡的，有镇国公牛清之孙现袭一等伯牛继宗，|当时送殡的男客，有镇国公牛清的孙子、现袭一等伯的牛继宗，
理国公柳彪之孙现袭一等子柳芳，|理国公柳彪的孙子、现袭一等子的柳芳，
齐国公陈翼之孙世袭三品威镇将军陈瑞文，|齐国公陈翼的孙子、世袭三品威镇将军陈瑞文，
治国公马魁之孙世袭三品威远将军马尚，|治国公马魁的孙子、世袭三品威远将军马尚，
修国公侯晓明之孙世袭一等子侯孝康，|修国公侯晓明的孙子、世袭一等子侯孝康，
缮国公诰命亡故，故其孙石光珠守孝不曾来得。|缮国公的诰命夫人去世了，所以他的孙子石光珠在守孝，没能来。
这六家与宁荣二家，当日所称“八公”的便是。|这六家加上宁荣二府，就是当年所说的“八公”。
馀者更有南安郡王之孙，西宁郡王之孙，忠靖侯史鼎，平原侯之孙世袭二等男蒋子宁，|其余还有南安郡王的孙子、西宁郡王的孙子、忠靖侯史鼎、平原侯的孙子世袭二等男蒋子宁，
定城侯之孙世袭二等男兼京营游击谢鲸，襄阳侯之孙世袭二等男戚建辉，景田侯之孙五城兵马司裘良。|定城侯的孙子世袭二等男兼京营游击谢鲸、襄阳侯的孙子世袭二等男戚建辉、景田侯的孙子五城兵马司裘良。
馀者锦乡伯公子韩奇，神武将军公子冯紫英，陈也俊，卫若兰等诸王孙公子，不可枚数。|另外还有锦乡伯的公子韩奇、神武将军的公子冯紫英，以及陈也俊、卫若兰等各位王孙公子，数也数不清。
堂客算来亦有十来顶大轿，三四十小轿，连家下大小轿车辆，不下百馀十乘。|女客算起来也有十来顶大轿、三四十顶小轿，连家里大大小小的轿子车辆，不下一百多辆。
连前面各色执事，陈设，百耍，浩浩荡荡，一带摆三四里远。|加上前面的各种仪仗、陈设、杂耍，浩浩荡荡，一路摆开有三四里远。
! 这里一口气写出了“四王八公”的大半，是贾府背后整个开国勋贵集团的亮相。
! 冯紫英就是推荐张太医的那位。卫若兰后面和史湘云的结局有关，脂批说他是湘云后来的丈夫。

# 十九、四王路祭，北静王亲临
走不多时，路旁彩棚高搭。|走了不久，路边高高搭起了彩棚。
设席张筵，和音奏乐，俱是各家路祭：|摆着酒席，奏着音乐，都是各家设的路祭：
第一座是东平王府祭棚，第二座是南安郡王祭棚，第三座是西宁郡王，第四座是北静郡王的。|第一座是东平王府的祭棚，第二座是南安郡王的，第三座是西宁郡王的，第四座是北静郡王的。
原来这四王，当日惟北静王功高，及今子孙犹袭王爵。|原来这四位王爷，当年只有北静王功劳最大，到现在子孙还承袭着王爵。
现今北静王水溶年未弱冠，生得形容秀美，情性谦和。|现在的北静王水溶还不到二十岁，长得清秀俊美，性情谦和。
近闻宁国公冢孙妇告殂，因想当日彼此祖父相与之情，同难同荣，未以异姓相视，|最近听说宁国公的长孙媳妇去世了，想起当年两家祖父的交情，同患难、共荣耀，从没把对方当外姓看待，
因此不以王位自居，上日也曾探丧上祭，如今又设路奠，命麾下各官在此伺候。|所以不摆王爷的架子，前些日子也亲自来吊唁上祭过，现在又设了路祭，叫手下的官员在这里伺候。
自己五更入朝，公事一毕，便换了素服，坐大轿鸣锣张伞而来，至棚前落轿。|他自己五更上朝，公事一完，就换上素服，坐着大轿、敲锣打伞地赶来，在棚前落了轿。
手下各官两旁拥侍，军民人众不得往还。|手下的官员在两边簇拥伺候，百姓兵丁都不得来往通行。
! 北静王是全书里少有的正面贵族形象：年轻、俊美、谦和。宝玉对他心向往之，后面两人常有往来。
! “未以异姓相视”：四王八公当年是一起打天下的功臣，这层关系也是贾府最大的靠山。

# 二十、北静王召见宝玉
一时只见宁府大殡浩浩荡荡，压地银山一般从北而至。|不一会儿，只见宁府的送殡队伍浩浩荡荡，像一座银山压在地上一样从北边过来了。
早有宁府开路传事人看见，连忙回去报与贾珍。|宁府开路报信的人早看见了，连忙回去报告贾珍。
贾珍急命前面驻扎，同贾赦贾政三人连忙迎来，以国礼相见。|贾珍急忙叫前面停下，和贾赦、贾政三个人连忙迎上来，按君臣的国礼相见。
水溶在轿内欠身含笑答礼，仍以世交称呼接待，并不妄自尊大。|水溶在轿里欠身含笑还礼，仍然用世交的称呼相待，一点也不摆架子。
贾珍道：“犬妇之丧，累蒙郡驾下临，荫生辈何以克当。”|贾珍说：“小儿媳妇的丧事，几次劳动王驾亲临，我们这些靠祖荫的晚辈怎么担当得起。”
水溶笑道：“世交之谊，何出此言。”|水溶笑道：“咱们是世交，何必说这种话。”
遂回头命长府官主祭代奠。|就回头叫王府的长史官主持祭奠，代他行礼。
贾赦等一旁还礼毕，复身又来谢恩。|贾赦等人在旁边还完礼，又转身来谢恩。
水溶十分谦逊，因问贾政道：|水溶十分谦逊，问贾政：
“那一位是衔宝而诞者？|“哪一位是嘴里衔着宝玉出生的？
几次要见一见，都为杂冗所阻，想今日是来的，何不请来一会。”|几次想见一见，都被杂事耽误了，想必今天来了，何不请来见见。”
贾政听说，忙回去，急命宝玉脱去孝服，领他前来。|贾政听了，连忙回去，急忙叫宝玉脱下孝服，领他过来。
那宝玉素日就曾听得父兄亲友人等说闲话时，赞水溶是个贤王，且生得才貌双全，风流潇洒，每不以官俗国体所缚。|宝玉平时就常听父兄亲友们闲谈时称赞水溶是位贤王，又才貌双全、风流潇洒，从来不被官场俗礼束缚。
每思相会，只是父亲拘束严密，无由得会，今见反来叫他，自是欢喜。|他常想见一面，只是父亲管得严，没机会，今天对方反倒来叫他，自然高兴。
一面走，一面早瞥见那水溶坐在轿内，好个仪表人材。|一边走，一边早看见水溶坐在轿里，好一表人才。
不知近看时又是怎样，且听下回分解。|不知近看又是什么模样，请看下回分解。
! 宝玉的“通灵宝玉”名声已经传到王府里了。
! 要脱孝服才能见王爷，因为穿着孝服见贵人不吉利。
</script>

<script type="text/plain" id="ch15">
# 一、宝玉见北静王
话说宝玉举目见北静王水溶头上戴著洁白簪缨银翅王帽，穿著江牙海水五爪坐龙白蟒袍，系著碧玉红鞓带，|宝玉抬眼一看，只见北静王水溶头戴洁白簪缨的银翅王帽，身穿绣着江牙海水、五爪坐龙的白蟒袍，腰系碧玉红皮带，
面如美玉，目似明星，真好秀丽人物。|脸像美玉，眼像明星，真是个秀美的人物。
宝玉忙抢上来参见，水溶连忙从轿内伸出手来挽住。|宝玉连忙抢上前去参拜，水溶赶紧从轿里伸出手来扶住他。
见宝玉戴著束发银冠，勒著双龙出海抹额，穿著白蟒箭袖，围著攒珠银带，|只见宝玉戴着束发银冠，额上勒着双龙出海的抹额，穿着白蟒箭袖袍，腰围攒珠银带，
面若春花，目如点漆。|脸像春天的花，眼睛像点了漆一样黑亮。
水溶笑道：“名不虚传，果然如‘宝’似‘玉’。”|水溶笑道：“名不虚传，果然像宝又像玉。”
因问：“衔的那宝贝在那里？”|又问：“你衔着出生的那块宝贝在哪里？”
宝玉见问，连忙从衣内取了递与过去。|宝玉见问，连忙从衣服里取出来递过去。
水溶细细的看了，又念了那上头的字，因问：“果灵验否？”|水溶仔细看了，又念了上面的字，问：“真的灵验吗？”
贾政忙道：“虽如此说，只是未曾试过。”|贾政忙说：“虽然这么说，只是没试过。”
水溶一面极口称奇道异，一面理好彩绦，亲自与宝玉带上，又携手问宝玉几岁，读何书。|水溶一边连声称奇，一边理好彩色丝绦，亲手给宝玉戴上，又拉着他的手问他几岁、读什么书。
宝玉一一的答应。|宝玉一一回答了。
! 两人都穿白：一个是王爷素服来吊丧，一个是刚脱了孝服。一对白衣公子相见，作者写得像一幅画。
! 贾政说玉“未曾试过”。第二十五回宝玉中邪，和尚拿这块玉一念，才算“试”了一回。

# 二、北静王赠念珠
水溶见他语言清楚，谈吐有致，一面又向贾政笑道：|水溶见他说话清楚、谈吐有分寸，又对贾政笑道：
“令郎真乃龙驹凤雏，非小王在世翁前唐突，将来‘雏凤清于老凤声’，未可量也。”|“令郎真是龙驹凤雏。不是小王在您面前冒昧，将来真是‘雏凤清于老凤声’，前途不可估量。”
贾政忙陪笑道：“犬子岂敢谬承金奖。|贾政忙陪笑说：“犬子哪敢当这样的夸奖。
赖蕃郡馀祯，果如是言，亦荫生辈之幸矣。”|托王爷的福气，要真像您说的那样，也是我们这些晚辈的幸运了。”
水溶又道：“只是一件，令郎如是资质，想老太夫人，夫人辈自然钟爱极矣，|水溶又说：“只有一件，令郎这样的资质，想来老太太、太太们自然疼爱极了。
但吾辈后生，甚不宜钟溺，钟溺则未免荒失学业。|可我们这些年轻人，最不该被溺爱，溺爱了就难免荒废学业。
昔小王曾蹈此辙，想令郎亦未必不如是也。|小王从前就走过这条路，想来令郎也未必不是这样。
若令郎在家难以用功，不妨常到寒第。|要是令郎在家难以用功，不妨常到我府上来。
小王虽不才，却多蒙海上众名士凡至都者，未有不另垂青目。|小王虽然没什么才能，可各地来京城的名士，没有一个不另眼看待我的。
是以寒第高人颇聚。|所以我府上聚着不少高人。
令郎常去谈会谈会，则学问可以日进矣。”|令郎常去谈谈，学问就能一天天长进了。”
贾政忙躬身答应。|贾政连忙躬身答应。
水溶又将腕上一串念珠卸了下来，递与宝玉道：|水溶又从手腕上褪下一串念珠，递给宝玉说：
“今日初会，仓促竟无敬贺之物，此是前日圣上亲赐鹡鸰香念珠一串，权为贺敬之礼。”|“今天初次见面，仓促间没有准备礼物，这是前些天皇上亲赐的一串鹡鸰香念珠，就当作见面礼吧。”
宝玉连忙接了，回身奉与贾政。|宝玉连忙接过来，转身捧给贾政。
贾政与宝玉一齐谢过。|贾政和宝玉一起道谢。
! “雏凤清于老凤声”出自李商隐的诗，夸儿子会比父亲强。
! 鹡鸰是一种鸟，《诗经》用它比喻兄弟情谊。北静王送“鹡鸰香念珠”，意思是两家世代如兄弟。第十六回宝玉把这串念珠转送黛玉，黛玉却说“什么臭男人拿过的”，不要。

# 三、北静王让殡先行
于是贾赦、贾珍等一齐上来请回舆，|于是贾赦、贾珍等一起上前请北静王回驾。
水溶道：“逝者已登仙界，非碌碌你我尘寰中之人也。|水溶说：“死者已经升入仙界，不再是你我这些尘世中忙碌的俗人了。
小王虽上叨天恩，虚邀郡袭，岂可越仙輀而进也？”|小王虽然承蒙皇恩，白白承袭了郡王的爵位，又怎么能抢在仙人的灵车前面走呢？”
贾赦等见执意不从，只得告辞谢恩回来，命手下掩乐停音，滔滔然将殡过完，方让水溶回舆去了。|贾赦等人见他坚持不肯，只好告辞谢恩回来，叫手下停了鼓乐，浩浩荡荡把送殡队伍全部过完，才让水溶起驾回去。
不在话下。|这里不多说。
! 王爷让臣子家的灵柩先过，这在礼法上是极大的面子。北静王的谦和，在这一个细节上写尽了。

# 四、凤姐叫宝玉坐车
且说宁府送殡，一路热闹非常。|再说宁府送殡，一路上非常热闹。
刚至城门前，又有贾赦、贾政、贾珍等诸同僚属下各家祭棚接祭，一一的谢过，然后出城，竟奔铁槛寺大路行来。|刚到城门前，又有贾赦、贾政、贾珍等人的同僚下属各家搭了祭棚接着祭奠，一一谢过以后才出城，直奔铁槛寺的大路走去。
彼时贾珍带贾蓉来到诸长辈前，让坐轿上马，因而贾赦一辈的各自上了车轿，贾珍一辈的也将要上马。|这时贾珍带着贾蓉来到各位长辈面前，请他们坐轿骑马。于是贾赦一辈的各自上了车轿，贾珍一辈的也要上马。
凤姐儿因记挂著宝玉，怕他在郊外纵性逞强，不服家人的话，|凤姐惦记着宝玉，怕他到了郊外放纵任性、逞强，不听家人的话，
贾政管不著这些小事，惟恐有个失闪，难见贾母，因此便命小厮来唤他。|贾政又不管这些小事，生怕出点差错，没法向贾母交代，所以就叫小厮去叫他来。
宝玉只得来到他车前。|宝玉只好来到她车前。
凤姐笑道：“好兄弟，你是个尊贵人，女孩儿一样的人品，别学他们猴在马上。|凤姐笑道：“好兄弟，你是个尊贵人，像女孩儿一样的人品，别学他们像猴子一样骑在马上。
下来，咱们姐儿两个坐车，岂不好？”|下来，咱们姐弟俩坐车，岂不好？”
宝玉听说，忙下了马，爬入凤姐车上，二人说笑前来。|宝玉听了，连忙下马，爬上凤姐的车，两人说说笑笑地往前走。
! 凤姐说宝玉是“女孩儿一样的人品”，正说中了宝玉的性情。

# 五、路边农庄歇脚
不一时，只见从那边两骑马压地飞来，离凤姐车不远，一齐蹿下来，扶车回说：|不一会儿，只见那边两匹马飞奔而来，到离凤姐车不远的地方，两人一齐跳下马来，扶着车说：
“这里有下处，奶奶请歇更衣。”|“这里有歇脚的地方，请奶奶歇歇、更更衣。”
凤姐急命请邢夫人王夫人的示下，|凤姐连忙叫人去请示邢夫人、王夫人。
那人回来说：“太太们说不用歇了，叫奶奶自便罢。”|那人回来说：“太太们说不用歇了，叫奶奶自便吧。”
凤姐听了，便命歇了再走。|凤姐听了，就吩咐歇一会儿再走。
众小厮听了，一带辕马，岔出人群，往北飞走。|小厮们听了，一拉车马，从人群里岔出去，往北飞快地走了。
宝玉在车内急命请秦相公。|宝玉在车里急忙叫人去请秦相公。
那时秦钟正骑马随著他父亲的轿，忽见宝玉的小厮跑来，请他去打尖。|这时秦钟正骑马跟着他父亲的轿子，忽然看见宝玉的小厮跑来，请他去歇脚吃点东西。
秦钟看时，只见凤姐儿的车往北而去，后面拉著宝玉的马，搭著鞍笼，便知宝玉同凤姐坐车，自己也便带马赶上去，同入一庄门内。|秦钟一看，只见凤姐的车往北去了，后面牵着宝玉的马，搭着鞍罩，就知道宝玉和凤姐同坐一车，自己也就打马赶上去，一起进了一个庄子的门。
早有家人将众庄汉撵尽。|家人早已把庄上的男人都赶走了。
那庄农人家无多房舍，婆娘们无处回避，只得由他们去了。|那农户人家没多少房子，妇女们没地方躲，只好由他们去了。
那些村姑庄妇见了凤姐、宝玉、秦钟的人品衣服，礼数款段，岂有不爱看的？|那些村姑农妇看见凤姐、宝玉、秦钟的模样、衣服、礼节和气派，哪有不爱看的？
! 太太们说不歇，凤姐偏要歇：她比长辈更会给自己方便。
! 宝玉一出城，就像鸟出了笼。下面是他平生第一次看见农家的生活。

# 六、“谁知盘中餐，粒粒皆辛苦”
一时凤姐进入茅堂，因命宝玉等先出去顽顽。|凤姐进了茅草屋，就叫宝玉他们先出去玩玩。
宝玉等会意，因同秦钟出来，带著小厮们各处游顽。|宝玉他们明白她的意思（她要更衣），就和秦钟出来，带着小厮们到处游玩。
凡庄农动用之物，皆不曾见过。|凡是农家用的东西，他都没见过。
宝玉一见了锹、橛、锄、犁等物，皆以为奇，不知何项所使，其名为何。|宝玉一看见铁锹、木橛、锄头、犁这些东西，都觉得稀奇，不知道是干什么用的，叫什么名字。
小厮在旁一一的告诉了名色，说明原委。|小厮在旁边一一告诉他名称，讲明用处。
宝玉听了，因点头叹道：“怪道古人诗上说，‘谁知盘中餐，粒粒皆辛苦’，正为此也。”|宝玉听了，点头叹道：“怪不得古人的诗里说‘谁知盘中餐，粒粒皆辛苦’，原来就是这个意思。”
一面说，一面又至一间房前，只见炕上有个纺车，宝玉又问小厮们：“这又是什么？”|一边说，一边又走到一间房前，只见炕上有个纺车，宝玉又问小厮们：“这又是什么？”
小厮们又告诉他原委。|小厮们又告诉了他。
宝玉听说，便上来拧转作耍，自为有趣。|宝玉听了，就上去摇着纺车玩，自己觉得很有意思。
! 一个锦衣玉食的公子，连锄头都不认识。作者让他在去送殡的路上念出“粒粒皆辛苦”，富贵人家的奢华和农家的辛苦，在这里对照了一下。

# 七、二丫头
只见一个约有十七八岁的村庄丫头跑了来乱嚷：“别动坏了！”|只见一个十七八岁的村姑跑过来嚷道：“别弄坏了！”
众小厮忙断喝拦阻。|小厮们连忙呵斥阻拦。
宝玉忙丢开手，陪笑说道：“我因为没见过这个，所以试他一试。”|宝玉连忙松开手，陪笑说：“我因为没见过这个，所以试一试。”
那丫头道：“你们那里会弄这个，站开了，我纺与你瞧。”|那姑娘说：“你们哪里会弄这个，站开，我纺给你看。”
秦钟暗拉宝玉笑道：“此卿大有意趣。”|秦钟偷偷拉了拉宝玉，笑道：“这姑娘挺有意思。”
宝玉一把推开，笑道：“该死的！再胡说，我就打了。”|宝玉一把推开他，笑道：“该死的！再胡说，我就打你了。”
说著，只见那丫头纺起线来。|说着，只见那姑娘纺起线来。
宝玉正要说话时，只听那边老婆子叫道：“二丫头，快过来！”|宝玉正要说话，只听那边一个老婆子喊：“二丫头，快过来！”
那丫头听见，丢下纺车，一径去了。|那姑娘听见，丢下纺车就走了。
! 秦钟一开口就是轻薄话，宝玉却骂他“该死的”。同是看一个女孩子，两人心思不同。
! 二丫头不怕公子，也不讨好公子，是书里少见的干干净净的乡下女子。

# 八、以目相送
宝玉怅然无趣。|宝玉怅怅然，觉得没意思了。
只见凤姐儿打发人来叫他两个进去。|只见凤姐派人来叫他俩进去。
凤姐洗了手，换衣服抖灰，问他们换不换。|凤姐洗了手，换了衣服、抖掉灰尘，问他们换不换。
宝玉不换，只得罢了。|宝玉不换，也就算了。
家下仆妇们将带著行路的茶壶茶杯，十锦屉盒，各样小食端来，|家里的仆妇们把带着路上用的茶壶茶杯、什锦食盒和各种小吃端上来，
凤姐等吃过茶，待他们收拾完毕，便起身上车。|凤姐等人喝过茶，等她们收拾好，就起身上车。
外面旺儿预备下赏封，赏了本村主人。|外面旺儿预备好了赏钱封包，赏给这家农户。
庄妇等来叩赏。|农妇们来磕头谢赏。
凤姐并不在意，宝玉却留心看时，内中并无二丫头。|凤姐并不在意，宝玉却留心看了看，里面没有二丫头。
一时上了车，出来走不多远，只见迎头二丫头怀里抱著他小兄弟，同著几个小女孩子说笑而来。|上了车，出来没走多远，只见迎面二丫头怀里抱着她的小弟弟，和几个小女孩说说笑笑地走过来。
宝玉恨不得下车跟了他去，料是众人不依的，少不得以目相送，|宝玉恨不得下车跟她去，料想大家不会答应，只好用眼睛目送她，
争奈车轻马快，一时展眼无踪。|无奈车轻马快，一眨眼就不见了。
! 一面之缘，转眼即逝。宝玉对每个美好女子都有这样的怅惘，这就是脂批说的宝玉“情不情”：连不相干的人也用情。

# 九、铁槛寺安灵
走不多时，仍又跟上大殡了。|走了不久，又跟上了送殡的大队。
早有前面法鼓金铙，幢幡宝盖：铁槛寺接灵众僧齐至。|早有前面的法鼓金铙、幢幡宝盖迎来：铁槛寺来接灵的和尚们都到了。
少时到入寺中，另演佛事，重设香坛。|不一会儿进了寺里，又做佛事，重新设了香坛。
安灵于内殿偏室之中，宝珠安于里寝室相伴。|灵柩安放在内殿的偏室里，宝珠住在里面的寝室陪着。
外面贾珍款待一应亲友，也有扰饭的，也有不吃饭而辞的，|外面贾珍招待各位亲友，有留下吃饭的，也有不吃饭就告辞的，
一应谢过乏，从公侯伯子男一起一起的散去，至未末时分方才散尽了。|一一道谢辛苦以后，从公侯伯子男一批一批地散去，到未时末（下午三点）才散完。
里面的堂客皆是凤姐张罗接待，先从显官诰命散起，也到晌午大错时方散尽了。|里面的女客都是凤姐张罗接待，先从显贵官员的诰命夫人散起，也到过了中午很久才散完。
只有几个亲戚是至近的，等做过三日安灵道场方去。|只有几个最亲近的亲戚，要等做完三天的安灵道场才走。
那时邢，王二夫人知凤姐必不能来家，也便就要进城。|这时邢夫人、王夫人知道凤姐肯定回不了家，自己也就要进城了。
王夫人要带宝玉去，宝玉乍到郊外，那里肯回去，只要跟凤姐住著。|王夫人要带宝玉一起走，宝玉刚到郊外，哪里肯回去，只要跟着凤姐住。
王夫人无法，只得交与凤姐便回来了。|王夫人没办法，只好把他交给凤姐，自己回去了。

# 十、铁槛寺和馒头庵
原来这铁槛寺原是宁荣二公当日修造，现今还是有香火地亩布施，以备京中老了人口，在此便宜寄放。|原来这铁槛寺是当年宁荣二公修建的，现在还有专供香火的田地，以备京城里有人去世时，可以方便地把灵柩寄放在这里。
其中阴阳两宅俱已预备妥贴，好为送灵人口寄居。|寺里放灵柩的屋子和住人的屋子都预备得妥妥当当，好让送灵的人住。
不想如今后辈人口繁盛，其中贫富不一，或性情参商：|没想到如今后辈人口多了，有穷有富，性情也各不相同：
有那家业艰难安分的，便住在这里了，|有家境艰难又安分的，就住在这里；
有那尚排场有钱势的，只说这里不方便，一定另外或村庄或尼庵寻个下处，为事毕宴退之所。|有讲排场、有钱有势的，就说这里不方便，一定另外到村庄或尼姑庵找个住处，作为事后休息的地方。
即今秦氏之丧，族中诸人皆权在铁槛寺下榻，独有凤姐嫌不方便，|这次秦氏的丧事，族里的人都暂时住在铁槛寺，只有凤姐嫌不方便，
因而早遣人来和馒头庵的姑子净虚说了，腾出两间房子来作下处。|所以早派人来和馒头庵的尼姑净虚说好，腾出两间房来做住处。
原来这馒头庵就是水月庵，因他庙里做的馒头好，就起了这个浑号，离铁槛寺不远。|原来这馒头庵就是水月庵，因为庵里做的馒头好吃，就得了这个外号，离铁槛寺不远。
! “铁槛”和“馒头”合起来，出自宋代范成大的诗：“纵有千年铁门槛，终须一个土馒头。”意思是门槛修得再结实，人终究要进坟墓（坟头像馒头）。后来妙玉最爱这两句。
! “水月庵”，水中月，也是一场空。这一回的地名，都在说“空”。

# 十一、智能儿
当下和尚工课已完，奠过茶饭，贾珍便命贾蓉请凤姐歇息。|这时和尚们的功课做完了，供过茶饭，贾珍就叫贾蓉请凤姐去歇息。
凤姐见还有几个妯娌陪著女亲，自己便辞了众人，带了宝玉，秦钟往水月庵来。|凤姐见还有几个妯娌陪着女亲戚，自己就辞别众人，带着宝玉、秦钟往水月庵来了。
原来秦业年迈多病，不能在此，只命秦钟等待安灵罢了。|原来秦业年老多病，不能留在这里，只叫秦钟等到安灵完了再走。
那秦钟便只跟著凤姐，宝玉，一时到了水月庵，净虚带领智善，智能两个徒弟出来迎接，大家见过。|秦钟就跟着凤姐和宝玉。到了水月庵，净虚带着智善、智能两个徒弟出来迎接，大家见过礼。
凤姐等来至净室更衣净手毕，因见智能儿越发长高了，模样儿越发出息了，因说道：|凤姐等人到静室换了衣服、洗了手，见智能儿越发长高了，模样也越发标致了，就说：
“你们师徒怎么这些日子也不往我们那里去？”|“你们师徒怎么这些日子也不到我们那里去？”
净虚道：“可是这几天都没工夫，因胡老爷府里产了公子，太太送了十两银子来这里，叫请几位师父念三日《血盆经》，忙的没个空儿，就没来请奶奶的安。”|净虚说：“这几天实在没空。胡老爷府里生了公子，太太送了十两银子来，叫请几位师父念三天《血盆经》，忙得没有一点空，就没去给奶奶请安。”
不言老尼陪著凤姐。|老尼姑陪着凤姐，这里先不说。
! 智能儿第七回出场过，那时在荣府和惜春玩，惜春还说要“剃了头同他作姑子去”。
! 净虚一开口就说“十两银子”，三句话不离钱，下面就要给凤姐送一桩生意。

# 十二、抢茶
且说秦钟，宝玉二人正在殿上顽耍，因见智能过来，宝玉笑道：“能儿来了。”|再说秦钟和宝玉正在殿上玩，看见智能过来，宝玉笑道：“能儿来了。”
秦钟道：“理那东西作什么？”|秦钟说：“理那东西做什么？”
宝玉笑道：“你别弄鬼，那一日在老太太屋里，一个人没有，你搂著他作什么？|宝玉笑道：“你别装蒜，那天在老太太屋里，一个人也没有，你搂着她做什么？
这会子还哄我。”|这会儿还想哄我。”
秦钟笑道：“这可是没有的话。”|秦钟笑道：“这可是没有的事。”
宝玉笑道：“有没有也不管你，你只叫住他倒碗茶来我吃，就丢开手。”|宝玉笑道：“有没有我也不管，你只要叫住她给我倒碗茶来喝，我就不说了。”
秦钟笑道：“这又奇了，你叫他倒去，还怕他不倒？何必要我说呢。”|秦钟笑道：“这又奇怪了，你叫她倒，还怕她不倒？何必要我说。”
宝玉道：“我叫他倒的是无情意的，不及你叫他倒的是有情意的。”|宝玉说：“我叫她倒的是没有情意的，比不上你叫她倒的有情意。”
秦钟只得说道：“能儿，倒碗茶来给我。”|秦钟只好说：“能儿，倒碗茶来给我。”
那智能儿自幼在荣府走动，无人不识，因常与宝玉秦钟顽笑。|那智能儿从小在荣府来往，没有人不认识她，所以常和宝玉、秦钟说笑。
他如今大了，渐知风月，便看上了秦钟人物风流，那秦钟也极爱他妍媚，|她现在大了，渐渐懂得男女之情，就看上了秦钟人品风流，秦钟也很喜欢她的娇媚，
二人虽未上手，却已情投意合了。|两人虽然还没有私情，却已经情投意合了。
今智能见了秦钟，心眼俱开，走去倒了茶来。|现在智能见了秦钟，心里眼里都乐开了花，走去倒了茶来。
秦钟笑道：“给我。”|秦钟笑道：“给我。”
宝玉叫：“给我！”|宝玉叫道：“给我！”
智能儿抿嘴笑道：“一碗茶也争，我难道手里有蜜！”|智能儿抿着嘴笑道：“一碗茶也争，难道我手里有蜜不成！”
宝玉先抢得了，吃著，方要问话，|宝玉先抢到手，喝着，正要问话，
只见智善来叫智能去摆茶碟子，一时来请他两个去吃茶果点心。|只见智善来叫智能去摆茶点碟子，一会儿又来请他俩去吃茶点。
他两个那里吃这些东西，坐一坐仍出来顽耍。|他俩哪里吃这些东西，坐了一会儿又出来玩。
! 宝玉逼秦钟叫智能倒茶，是在替两人牵线，也是少年人的起哄。
! 一个从小在庵里长大的小尼姑，“渐知风月”，这是作者对尼庵生活的冷眼。

# 十三、净虚求凤姐办一桩官司
凤姐也略坐片时，便回至净室歇息，老尼相送。|凤姐也稍微坐了一会儿，就回静室歇息，老尼姑送她。
此时众婆娘媳妇见无事，都陆续散了，自去歇息，跟前不过几个心腹常侍小婢，|这时婆子媳妇们见没事了，都陆续散了，各自去歇息，凤姐身边只剩几个心腹的贴身小丫头，
老尼便趁机说道：“我正有一事，要到府里求太太，先请奶奶一个示下。”|老尼姑就趁机说：“我正有一件事，要到府里去求太太，先请奶奶给个主意。”
凤姐因问何事。|凤姐问是什么事。
老尼道：“阿弥陀佛！|老尼姑说：“阿弥陀佛！
只因当日我先在长安县内善才庵内出家的时节，那时有个施主姓张，是大财主。|当年我在长安县善才庵出家的时候，有个施主姓张，是个大财主。
他有个女儿小名金哥，那年都往我庙里来进香，不想遇见了长安府府太爷的小舅子李衙内。|他有个女儿小名叫金哥，那年来我庙里进香，没想到碰上了长安府知府的小舅子李衙内。
那李衙内一心看上，要娶金哥，打发人来求亲，不想金哥已受了原任长安守备的公子的聘定。|李衙内一眼看上了，要娶金哥，派人来求亲。没想到金哥已经收了原任长安守备家公子的聘礼。
张家若退亲，又怕守备不依，因此说已有了人家。|张家要退亲，又怕守备不答应，所以就说女儿已经许了人家。
谁知李公子执意不依，定要娶他女儿，张家正无计策，两处为难。|谁知李公子死活不依，一定要娶他女儿，张家正没办法，两头为难。
不想守备家听了此言，也不管青红皂白，便来作践辱骂，说一个女儿许几家，偏不许退定礼，就打官司告状起来。|没想到守备家听说了，也不问青红皂白，就跑来羞辱叫骂，说一个女儿许了几家，偏不许退聘礼，就打起官司来。
那张家急了，只得著人上京来寻门路，赌气偏要退定礼。|张家急了，只好派人到京城来找门路，赌气偏要退掉聘礼。
我想如今长安节度云老爷与府上最契，可以求太太与老爷说声，打发一封书去，求云老爷和那守备说一声，不怕那守备不依。|我想现在长安的节度使云老爷和府上最要好，可以求太太跟老爷说一声，写封信去，求云老爷跟那守备说一声，不怕守备不答应。
若是肯行，张家连倾家孝顺也都情愿。”|要是肯办，张家就是倾家荡产来孝敬也情愿。”
! 一个尼姑，满嘴“阿弥陀佛”，做的却是替财主走后门、包揽诉讼的买卖。

# 十四、“你叫他拿三千银子来”
凤姐听了笑道：“这事倒不大，只是太太再不管这样的事。”|凤姐听了笑道：“这事倒不大，只是太太从来不管这种事。”
老尼道：“太太不管，奶奶也可以主张了。”|老尼姑说：“太太不管，奶奶也可以做主啊。”
凤姐听说笑道：“我也不等银子使，也不做这样的事。”|凤姐听了笑道：“我也不缺银子用，也不干这种事。”
净虚听了，打去妄想，半晌叹道：|净虚听了，打消了念头，半天才叹道：
“虽如此说，张家已知我来求府里，如今不管这事，|“话虽这么说，可张家已经知道我来求府里了，现在不管这事，
张家不知道没工夫管这事，不希罕他的谢礼，倒象府里连这点子手段也没有的一般。”|张家不会知道府里是没空管、不稀罕他的谢礼，倒好像府里连这点本事都没有似的。”
凤姐听了这话，便发了兴头，说道：|凤姐听了这话，就来了兴致，说：
“你是素日知道我的，从来不信什么是阴司地狱报应的，凭是什么事，我说要行就行。|“你平时是了解我的，我从来不信什么阴间地狱报应，不管什么事，我说要办就办。
你叫他拿三千银子来，我就替他出这口气。”|你叫他拿三千两银子来，我就替他出这口气。”
老尼听说，喜不自禁，忙说：“有，有！这个不难。”|老尼姑听了，喜出望外，忙说：“有，有！这个不难。”
凤姐又道：“我比不得他们扯篷拉牵的图银子。|凤姐又说：“我可不像他们那些拉关系、跑门路的人，是为了图银子。
这三千银子，不过是给打发说去的小厮作盘缠，使他赚几个辛苦钱，我一个钱也不要他的。|这三千两银子，不过是给派去说情的小厮当路费，让他们赚几个辛苦钱，我一个钱也不要。
便是三万两，我此刻也拿的出来。”|就是三万两，我现在也拿得出来。”
! 净虚用的是激将法：“倒象府里连这点子手段也没有”。凤姐最受不得别人说她没本事，一激就上钩。
! “从来不信什么是阴司地狱报应”：这是凤姐最可怕的一句话。在佛门净地说出来，更显得她无所顾忌。
! 嘴上说“一个钱也不要”，三千两却一分不少地收了。

# 十五、净虚奉承
老尼连忙答应，又说道：“既如此，奶奶明日就开恩也罢了。”|老尼姑连忙答应，又说：“既然这样，奶奶明天就开开恩吧。”
凤姐道：“你瞧瞧我忙的，那一处少了我？|凤姐说：“你瞧我忙的，哪一处少得了我？
既应了你，自然快快的了结。”|既然答应了你，自然很快就办完。”
老尼道：“这点子事，在别人的跟前就忙的不知怎么样，若是奶奶的跟前，再添上些也不够奶奶一发挥的。|老尼姑说：“这点小事，要是在别人那里，早就忙得不知怎么样了；要是在奶奶这里，再多添些也不够奶奶施展的。
只是俗语说的，‘能者多劳’，太太因大小事见奶奶妥贴，越性都推给奶奶了，奶奶也要保重金体才是。”|只是俗话说‘能者多劳’，太太见奶奶大事小事都办得妥当，干脆都推给奶奶了，奶奶也要保重身体才是。”
一路话奉承的凤姐越发受用，也不顾劳乏，更攀谈起来。|这一路话奉承得凤姐越发舒服，也不顾累了，更和她聊了起来。
! “能者多劳”这顶高帽，正是凤姐最爱戴的。

# 十六、秦钟和智能儿
谁想秦钟趁黑无人，来寻智能。|谁想秦钟趁着天黑没人，来找智能。
刚至后面房中，只见智能独在房中洗茶碗，秦钟跑来便搂著亲嘴。|刚到后面的屋里，只见智能一个人在洗茶碗，秦钟跑过去就搂着她亲。
智能急的跺脚说：“这算什么！再这么我就叫唤。”|智能急得跺脚说：“这算什么！再这样我就喊了。”
秦钟求道：“好人，我已急死了。|秦钟求她说：“好人，我已经急死了。
你今儿再不依，我就死在这里。”|你今天再不答应，我就死在这里。”
智能道：“你想怎样？|智能说：“你想怎么样？
除非等我出了这牢坑，离了这些人，才依你。”|除非等我出了这个牢坑，离开这些人，才答应你。”
秦钟道：“这也容易，只是远水救不得近渴。”|秦钟说：“这也容易，只是远水解不了近渴。”
说著，一口吹了灯，满屋漆黑，将智能抱到炕上，就云雨起来。|说着一口吹灭了灯，满屋漆黑，把智能抱到炕上，就干起那事来。
那智能百般的挣挫不起，又不好叫的，少不得依他了。|智能怎么挣扎也起不来，又不好喊叫，只好依了他。
正在得趣，只见一人进来，将他二人按住，也不则声。|正在快活的时候，只见一个人进来，把他俩按住，也不出声。
二人不知是谁，唬的不敢动一动。|两人不知道是谁，吓得一动也不敢动。
只听那人嗤的一声，掌不住笑了，二人听声方知是宝玉。|只听那人“嗤”的一声忍不住笑了，两人一听声音，才知道是宝玉。
秦钟连忙起来，抱怨道：“这算什么？”|秦钟连忙起来，埋怨说：“这算什么？”
宝玉笑道：“你倒不依，咱们就叫喊起来。”|宝玉笑道：“你还不服，那咱们就喊起来。”
羞的智能趁黑地跑了。|智能羞得趁黑跑了。
宝玉拉了秦钟出来道：“你可还和我强？”|宝玉拉着秦钟出来说：“你还跟我嘴硬吗？”
秦钟笑道：“好人，你只别嚷的众人知道，你要怎样我都依你。”|秦钟笑道：“好人，你只要别嚷得大家都知道，你要怎样我都依你。”
宝玉笑道：“这会子也不用说，等一会睡下，再细细的算帐。”|宝玉笑道：“现在先不说，等一会儿睡下了，再细细算账。”
! 智能说“出了这牢坑”：在她眼里，尼庵是牢笼。她是被送进来的，不是自己要出家。
! 这件事就是回目里的“秦鲸卿得趣馒头庵”。下一回智能私逃进城找秦钟，秦业气死，秦钟也病死了。

# 十七、“此是疑案，不敢纂创”
一时宽衣安歇的时节，凤姐在里间，秦钟宝玉在外间，满地下皆是家下婆子，打铺坐更。|到了脱衣睡觉的时候，凤姐在里间，秦钟、宝玉在外间，满地都是家里的婆子，打着地铺守夜。
凤姐因怕通灵玉失落，便等宝玉睡下，命人拿来塞在自己枕边。|凤姐怕通灵宝玉丢了，就等宝玉睡下，叫人拿来塞在自己枕头边。
宝玉不知与秦钟算何帐目，未见真切，未曾记得，此是疑案，不敢纂创。|宝玉和秦钟算了什么账，作者没看真切，也没记清，这是一桩疑案，不敢胡编。
! 作者在这里故意装糊涂，用说书人的口吻说“不敢纂创”，其实是留白，让读者自己去想。
! 那块玉偏偏这一夜不在宝玉身上。脂批说：“通灵玉”离身，宝玉就更像一个凡人了。

# 十八、多住一天
一宿无话。|一夜无话。
至次日一早，便有贾母王夫人打发了人来看宝玉，又命多穿两件衣服，无事宁可回去。|第二天一早，贾母、王夫人就派人来看宝玉，又叫他多穿两件衣服，没事最好回去。
宝玉那里肯回去，又有秦钟恋著智能，调唆宝玉求凤姐再住一天。|宝玉哪里肯回去，秦钟又舍不得智能，撺掇宝玉去求凤姐再住一天。
凤姐想了一想：凡丧仪大事虽妥，还有一半点小事未曾安插，|凤姐想了想：丧事的大事虽然都办妥了，还有一点小事没安排好，
可以指此再住一日，岂不又在贾珍跟前送了满情，|可以借这个再住一天，岂不是又在贾珍面前做足了人情；
二则又可以完净虚那事，|二来又可以把净虚那件事办了；
三则顺了宝玉的心，贾母听见，岂不欢喜？|三来顺了宝玉的心，贾母听见了，岂不高兴？
因有此三益，便向宝玉道：|因为有这三样好处，就对宝玉说：
“我的事都完了，你要在这里逛，少不得越性辛苦一日罢了，明儿可是定要走的了。”|“我的事都办完了，你要在这里玩，我只好再辛苦一天，明天可是一定要走了。”
宝玉听说，千姐姐万姐姐的央求：“只住一日，明儿必回去的。”|宝玉听了，“好姐姐”“好姐姐”地央求：“只住一天，明天一定回去。”
于是又住了一夜。|于是又住了一夜。
! 凤姐做一件事要算出“三益”，自己的私事（净虚那桩）就夹在中间，别人还要领她的情。这就是凤姐的算计。

# 十九、一封信，三千两
凤姐便命悄悄将昨日老尼之事，说与来旺儿。|凤姐就叫人悄悄把昨天老尼姑说的事告诉来旺儿。
来旺儿心中俱已明白，急忙进城找著主文的相公，假托贾琏所嘱，修书一封，连夜往长安县来，|来旺儿心里全明白了，急忙进城找到管文书的师爷，假托是贾琏的意思，写了一封信，连夜往长安县送去，
不过百里路程，两日工夫俱已妥协。|不过一百里路，两天工夫就办妥了。
那节度使名唤云光，久见贾府之情，这点小事，岂有不允之理，给了回书，旺儿回来。|那节度使名叫云光，一向承贾府的情，这点小事哪有不答应的，就写了回信，旺儿带着回来了。
且不在话下。|这里先不说。
! 凤姐假托贾琏的名义，贾琏本人并不知道。后来抄家时，“私用丈夫名帖包揽词讼”正是凤姐的大罪。
! 下一回交代结局：金哥和守备公子都自尽了，一对年轻人为三千两银子送了命，凤姐却“安享三千两”。

# 二十、分别
却说凤姐等又过一日，次日方别了老尼，著他三日后往府里去讨信。|凤姐等人又住了一天，第二天才辞别老尼姑，叫她三天后到府里去听回信。
那秦钟与智能百般不忍分离，背地里多少幽期密约，俱不用细述，只得含恨而别。|秦钟和智能怎么也舍不得分开，背地里约了多少次私会，都不用细说，只好含恨分别。
凤姐又到铁槛寺中照望一番。|凤姐又到铁槛寺照看了一番。
宝珠执意不肯回家，贾珍只得派妇女相伴。|宝珠坚持不肯回家，贾珍只好派了几个妇女陪着她。
后回再见。|后面再讲。
! 宝珠宁愿守着灵柩住在荒寺里，也不肯回宁府。宁府里到底有什么让她不敢回去，作者没有说。
</script>

<script type="text/plain" id="ch16">
# 一、秦钟病倒
话说宝玉见收拾了外书房，约定与秦钟读夜书。|宝玉见外书房收拾好了，就和秦钟约好一起读夜书。
偏那秦钟秉赋最弱，因在郊外受了些风霜，又与智能儿偷期绻缱，未免失于调养，|偏偏秦钟天生体弱，在郊外受了些风寒，又和智能儿偷偷幽会缠绵，难免没有好好调养，
回来时便咳嗽伤风，懒进饮食，大有不胜之状，遂不敢出门，只在家中养息。|回来就咳嗽伤风，不想吃东西，一副支撑不住的样子，于是不敢出门，只在家里休养。
宝玉便扫了兴头，只得付于无可奈何，且自静候大愈时再约。|宝玉很扫兴，也没办法，只好等他病好了再约。
! 秦钟的病，一半是风寒，一半是在馒头庵的“偷期绻缱”。上一回的“得趣”，这一回就要还账。

# 二、金哥之死，凤姐坐享三千两
那凤姐儿已是得了云光的回信，俱已妥协。|凤姐已经收到云光的回信，事情都办妥了。
老尼达知张家，果然那守备忍气吞声的受了前聘之物。|老尼姑通知了张家，那守备果然忍气吞声地收回了原先的聘礼。
谁知那张家父母如此爱势贪财，却养了一个知义多情的女儿，|谁知张家父母那样贪图权势钱财，却养了一个懂情义、重感情的女儿，
闻得父母退了前夫，他便一条麻绳悄悄的自缢了。|她听说父母退掉了原来的未婚夫，就悄悄用一根麻绳上吊死了。
那守备之子闻得金哥自缢，他也是个极多情的，遂也投河而死，不负妻义。|守备的儿子听说金哥上吊死了，他也是个极重情的人，也投河死了，没有辜负妻子的情义。
张李两家没趣，真是人财两空。|张家、李家落了个没趣，真是人财两空。
这里凤姐却坐享了三千两，王夫人等连一点消息也不知道。|这边凤姐却安安稳稳得了三千两，王夫人等连一点消息都不知道。
自此凤姐胆识愈壮，以后有了这样的事，便恣意的作为起来。|从此凤姐胆子更大了，以后再有这样的事，就随心所欲地干起来。
也不消多记。|这里也不必多记。
! 两条年轻的性命，换来凤姐的三千两。作者只用了几句话，却是全书最冷的一笔。
! “胆识愈壮”“恣意的作为”：从这里起，凤姐的弄权一发不可收拾，也一步步把自己推向结局。

# 三、宫中来人
一日正是贾政的生辰，宁荣二处人丁都齐集庆贺，闹热非常。|这天正是贾政的生日，宁荣两府的人都聚在一起庆贺，非常热闹。
忽有门吏忙忙进来，至席前报说：“有六宫都太监夏老爷来降旨。”|忽然有个看门的急急忙忙跑进来，到席前报告：“六宫都太监夏老爷来传圣旨了。”
唬的贾赦贾政等一干人不知是何消息，忙止了戏文，撤去酒席，摆了香案，启中门跪接。|吓得贾赦、贾政等人不知道是什么消息，连忙停了戏，撤了酒席，摆上香案，打开中门跪着迎接。
早见六宫都太监夏守忠乘马而至，前后左右又有许多内监跟从。|只见六宫都太监夏守忠骑马来了，前后左右还跟着许多太监。
那夏守忠也并不曾负诏捧敕，至檐前下马，满面笑容，走至厅上，南面而立，|那夏守忠也没有捧着诏书，到屋檐前下了马，满脸笑容，走到厅上，面朝南站着，
口内说：“特旨：立刻宣贾政入朝，在临敬殿陛见。”|嘴里说：“特旨：立刻宣贾政进宫，在临敬殿见驾。”
说毕，也不及吃茶，便乘马去了。|说完，连茶都来不及喝，就骑马走了。
贾赦等不知是何兆头。|贾赦等人不知道这是什么兆头。
只得急忙更衣入朝。|贾政只好急忙换上朝服进宫。
! 太监进门，全家先是“唬的”：在这样的人家，宫里来人可能是天大的喜事，也可能是抄家大祸。
! 夏守忠“满面笑容”，又不捧诏书，其实已经透出是喜事，只是贾家人慌了，没看出来。

# 四、元春封妃
贾母等合家人等心中皆惶惶不定，不住的使人飞马来往报信。|贾母等全家人心里都惶惶不安，不停地派人骑快马来回打听消息。
有两个时辰工夫，忽见赖大等三四个管家喘吁吁跑进仪门报喜，|过了大约两个时辰，忽然看见赖大等三四个管家气喘吁吁地跑进仪门报喜，
又说“奉老爷命，速请老太太带领太太等进朝谢恩”等语。|又说“奉老爷的命，请老太太快带着太太们进宫谢恩”等等。
那时贾母正心神不定，在大堂廊下伫立，|这时贾母正心神不定，站在大堂的廊下，
那邢夫人、王夫人、尤氏、李纨、凤姐、迎春姊妹以及薛姨妈等皆在一处，|邢夫人、王夫人、尤氏、李纨、凤姐、迎春姐妹和薛姨妈等都在一起，
听如此信至，贾母便唤进赖大来细问端的。|听到这个消息，贾母就叫赖大进来仔细问是怎么回事。
赖大禀道：“小的们只在临敬门外伺候，里头的信息一概不能得知。|赖大回禀说：“小的们只在临敬门外伺候，里面的消息一点也不知道。
后来还是夏太监出来道喜，说咱们家大小姐晋封为凤藻宫尚书，加封贤德妃。|后来还是夏太监出来道喜，说咱们家大小姐晋封为凤藻宫尚书，加封贤德妃。
后来老爷出来亦如此吩咐小的。|后来老爷出来，也是这样吩咐小的。
如今老爷又往东宫去了，速请老太太领著太太们去谢恩。”|现在老爷又到东宫去了，请老太太快带着太太们去谢恩。”
贾母等听了方心神安定，不免又都洋洋喜气盈腮。|贾母等人听了，这才放下心来，脸上不由得都洋溢着喜气。
于是都按品大妆起来。|于是都按照品级穿戴起正式的礼服。
贾母带领邢夫人、王夫人、尤氏，一共四乘大轿入朝。|贾母带着邢夫人、王夫人、尤氏，一共四顶大轿进宫。
贾赦、贾珍亦换了朝服，带领贾蓉、贾蔷奉侍贾母大轿前往。|贾赦、贾珍也换了朝服，带着贾蓉、贾蔷护送贾母的大轿前去。
于是宁荣两处上下里外，莫不欣然踊跃，个个面上皆有得意之状，言笑鼎沸不绝。|于是宁荣两府上上下下、里里外外，没有不欢欣鼓舞的，个个脸上都带着得意的神色，说笑声沸腾不止。
! 这就是秦可卿托梦说的“非常喜事”“烈火烹油，鲜花著锦之盛”，应验了。
! 元春的判词“二十年来辨是非，榴花开处照宫闱”：她入宫多年，终于封妃，这是贾府最风光的顶点，也是走下坡的起点。
! 元春生在大年初一，所以叫“元春”。贾府四个女儿的名字连起来是“原应叹息”（元迎探惜），是作者埋的谐音。

# 五、秦业气死，宝玉怅然
谁知近日水月庵的智能私逃进城，找至秦钟家下看视秦钟，|谁知最近水月庵的智能偷偷逃进城，找到秦钟家里去看他，
不意被秦业知觉，将智能逐出，将秦钟打了一顿，自己气的老病发作，三五日光景呜呼死了。|没想到被秦业发觉了，把智能赶了出去，把秦钟打了一顿，自己气得旧病复发，三五天就死了。
秦钟本自怯弱，又带病未愈，受了笞杖，今见老父气死，此时悔痛无及，更又添了许多症候。|秦钟本来就体弱，病又没好，挨了打，现在又看见老父亲被气死了，后悔痛苦也来不及了，病又添了许多。
因此宝玉心中怅然如有所失。|因此宝玉心里怅然若失。
虽闻得元春晋封之事，亦未解得愁闷。|虽然听说了元春封妃的事，也解不了他的愁闷。
贾母等如何谢恩，如何回家，亲朋如何来庆贺，宁荣两处近日如何热闹，众人如何得意，|贾母等人怎样谢恩、怎样回家，亲友怎样来庆贺，宁荣两府近来怎样热闹，大家怎样得意，
独他一个皆视有如无，毫不曾介意。|只有他一个人全都视而不见，一点也不放在心上。
因此众人嘲他越发呆了。|所以大家都笑他越来越呆了。
! 全家都在庆贺封妃，宝玉却只惦着一个将死的朋友。他在乎的从来不是功名富贵。
! 智能“私逃进城”，应了上一回她说的“出了这牢坑”，可她出来了，秦家却毁了。

# 六、黛玉要回来了
且喜贾琏与黛玉回来，先遣人来报信，明日就可到家，宝玉听了，方略有些喜意。|幸好贾琏和黛玉要回来了，先派人来报信，说明天就能到家，宝玉听了，才稍微有点高兴。
细问原由，方知贾雨村亦进京陛见，皆由王子腾累上保本，此来后补京缺，|仔细一问，才知道贾雨村也进京见皇上来了，都是靠王子腾一再上奏保举，这次来是要补京城的官缺。
与贾琏是同宗弟兄，又与黛玉有师从之谊，故同路作伴而来。|他和贾琏是同宗兄弟，又是黛玉的老师，所以一路结伴而来。
林如海已葬入祖坟了，诸事停妥，贾琏方进京的。|林如海已经葬进了祖坟，各样事都办妥了，贾琏才回京城来。
本该出月到家，因闻得元春喜信，遂昼夜兼程而进，一路俱各平安。|本来下个月才能到家，因为听到元春的喜讯，就日夜兼程赶路，一路上都平安。
宝玉只问得黛玉“平安”二字，馀者也就不在意了。|宝玉只问到黛玉“平安”两个字，其余的也就不在意了。
! 贾雨村又升官了，靠的是王子腾。第四回他乱判薛蟠的案子，讨好的正是王、薛两家，现在得到了回报。
! 宝玉只要“平安”二字。他心里的分量，一目了然。

# 七、黛玉回府，拒收念珠
好容易盼至明日午错，果报：“琏二爷和林姑娘进府了。”|好不容易盼到第二天过了中午，果然有人来报：“琏二爷和林姑娘进府了。”
见面时彼此悲喜交接，未免又大哭一阵，后又致喜庆之词。|见面时大家悲喜交加，免不了又大哭一场，然后又说了些道喜的话。
宝玉心中品度黛玉，越发出落的超逸了。|宝玉心里端详黛玉，觉得她越发出落得清秀脱俗了。
黛玉又带了许多书籍来，忙著打扫卧室，安插器具，又将些纸笔等物分送宝钗、迎春、宝玉等人。|黛玉又带来许多书，忙着打扫卧室、安放器具，又把一些纸笔之类分送给宝钗、迎春、宝玉等人。
宝玉又将北静王所赠鹡鸰香串珍重取出来，转赠黛玉。|宝玉又郑重地拿出北静王送的鹡鸰香念珠，转送给黛玉。
黛玉说：“什么臭男人拿过的！我不要他。”|黛玉说：“什么臭男人拿过的东西！我不要。”
遂掷而不取。|说着就扔回去不要。
宝玉只得收回，暂且无话。|宝玉只好收回，暂时也就没说什么。
! 黛玉从扬州带回来的是“许多书籍”，不是金银，这就是林家“书香之族”的女儿。
! 皇上赐给王爷、王爷送给宝玉的东西，黛玉一句“臭男人拿过的”就扔了。她看不上的正是这些官场上的体面，宝玉自己也说过“男人是泥作的骨肉”。

# 八、凤姐给贾琏接风
且说贾琏自回家参见过众人，回至房中。|再说贾琏回家见过了大家，回到自己房里。
正值凤姐近日多事之时，无片刻闲暇之工，见贾琏远路归来，少不得拨冗接待，|正赶上凤姐最近事多，一点空闲都没有，见贾琏远道回来，只好挤出时间来接待。
房内无外人，便笑道：“国舅老爷大喜！国舅老爷一路风尘辛苦。|屋里没有外人，她就笑着说：“国舅老爷大喜！国舅老爷一路风尘辛苦了。
小的听见昨日的头起报马来报，说今日大驾归府，略预备了一杯水酒掸尘，不知赐光谬领否？”|小的听昨天头一批报信的马来报，说今天大驾回府，略备了一杯薄酒给您接风洗尘，不知肯不肯赏光？”
贾琏笑道：“岂敢岂敢，多承多承。”|贾琏笑道：“不敢不敢，多谢多谢。”
一面平儿与众丫鬟参拜毕，献茶。|一面平儿和丫鬟们拜见过，献上茶来。
贾琏遂问别后家中的诸事，又谢凤姐的操持劳碌。|贾琏就问分别后家里的各种事情，又感谢凤姐操持辛苦。
! 元春是贾琏的堂妹，凤姐叫他“国舅老爷”，是夫妻间的玩笑，也是在得意。

# 九、凤姐“诉苦”
凤姐道：“我那里照管得这些事！|凤姐说：“我哪里管得了这些事！
见识又浅，口角又笨，心肠又直率，人家给个棒槌，我就认作‘针’。|见识又浅，嘴又笨，心肠又直，人家给个棒槌，我就当成了针（认了真）。
脸又软，搁不住人给两句好话，心里就慈悲了。|脸皮又薄，经不住别人说两句好话，心就软了。
况且又没经历过大事，胆子又小，太太略有些不自在，就吓的我连觉也睡不著了。|况且又没经过大事，胆子又小，太太稍微有点不高兴，就吓得我连觉都睡不着。
我苦辞了几回，太太又不容辞，倒反说我图受用，不肯习学了。|我苦苦推辞了好几回，太太不许我推，反倒说我贪图享福，不肯学着做事。
殊不知我是捻著一把汗儿呢。|哪知道我是捏着一把汗呢。
一句也不敢多说，一步也不敢多走。|一句话也不敢多说，一步路也不敢多走。
你是知道的，咱们家所有的这些管家奶奶们，那一位是好缠的？|你是知道的，咱们家这些管家奶奶们，哪一个是好对付的？
错一点儿他们就笑话打趣，偏一点儿他们就指桑说槐的报怨。|错一点她们就笑话打趣，偏一点她们就指桑骂槐地抱怨。
‘坐山观虎斗’，‘借剑杀人’，‘引风吹火’，‘站干岸儿’，‘推倒油瓶不扶’，都是全挂子的武艺。|‘坐山观虎斗’‘借刀杀人’‘煽风点火’‘站在岸上看热闹’‘油瓶倒了都不扶’，这些本事样样精通。
况且我年纪轻，头等不压众，怨不得不放我在眼里。|况且我年纪轻，资历压不住人，也难怪她们不把我放在眼里。
更可笑那府里忽然蓉儿媳妇死了，珍大哥又再三再四的在太太跟前跪著讨情，只要请我帮他几日，|更可笑的是那府里蓉儿媳妇忽然死了，珍大哥又三番五次在太太跟前跪着求情，非要请我帮他几天。
我是再四推辞，太太断不依，只得从命。|我是一再推辞，太太偏不答应，只好从命。
依旧被我闹了个马仰人翻，更不成个体统，至今珍大哥哥还抱怨后悔呢。|结果还是被我弄得人仰马翻，更不成样子，到现在珍大哥还在抱怨后悔呢。
你这一来了，明儿你见了他，好歹描补描补，就说我年纪小，原没见过世面，谁叫大爷错委他的。”|你这一回来，明天见了他，好歹替我弥补弥补，就说我年纪小，本来就没见过世面，谁叫大爷错托了她。”
! 这一大段全是反话。说自己“口角又笨”，却一口气说了这么多；说“闹了个马仰人翻”，其实合族都夸她。凤姐是要贾琏夸她。
! “坐山观虎斗”“借剑杀人”这些，她说的是管家奶奶们，其实也是她自己最拿手的。第六十九回她借秋桐的手逼死尤二姐，就是“借剑杀人”。

# 十、香菱
正说著，只听外间有人说话，凤姐便问：“是谁？”|正说着，只听外屋有人说话，凤姐就问：“是谁？”
平儿进来回道：“姨太太打发了香菱妹子来问我一句话，我已经说了，打发他回去了。”|平儿进来回说：“姨太太派香菱妹子来问我一句话，我已经告诉她了，打发她回去了。”
贾琏笑道：“正是呢，方才我见姨妈去，不防和一个年轻的小媳妇子撞了个对面，生的好齐整模样。|贾琏笑道：“正是呢，刚才我去见姨妈，冷不防和一个年轻的小媳妇撞了个对面，长得真标致。
我疑惑咱家并无此人，说话时因问姨妈，谁知就是上京来买的那小丫头，名叫香菱的，竟与薛大傻子作了房里人，|我想咱们家没有这个人，说话时就问姨妈，谁知就是进京时买的那个小丫头，叫香菱的，竟然给薛大傻子做了屋里人，
开了脸，越发出挑的标致了。|开了脸（绞了脸上的汗毛，表示已成了妇人），越发出落得漂亮了。
那薛大傻子真玷辱了他。”|那薛大傻子真是糟蹋了她。”
凤姐道：“嗳！往苏杭走了一趟回来，也该见些世面了，还是这么眼馋肚饱的。|凤姐说：“哎！去苏杭走了一趟回来，也该见过些世面了，还是这么吃着碗里的还馋别人的。
你要爱他，不值什么，我去拿平儿换了他来如何？|你要是喜欢她，这不算什么，我拿平儿去把她换来怎么样？
那薛老大也是‘吃著碗里看著锅里’的，这一年来的光景，他为要香菱不能到手，和姨妈打了多少饥荒。|那薛老大也是个‘吃着碗里看着锅里’的人，这一年来，他为了得不到香菱，跟姨妈闹了多少回。
也因姨妈看著香菱模样儿好还是末则，其为人行事，却又比别的女孩子不同，温柔安静，差不多的主子姑娘也跟他不上呢，|姨妈看香菱模样好还是其次，主要是她为人处事和别的女孩子不同，温柔安静，一般的小姐都比不上她，
故此摆酒请客的费事，明堂正道的与他作了妾。|所以才费事摆酒请客，正大光明地给薛蟠做了妾。
过了没半月，也看的马棚风一般了，我倒心里可惜了的。”|过了不到半个月，薛蟠就把她看得像马棚里的风一样不当回事了，我心里倒替她可惜。”
一语未了，二门上小厮传报：“老爷在大书房等二爷呢。”|话还没说完，二门上的小厮来报：“老爷在大书房等二爷呢。”
贾琏听了，忙忙整衣出去。|贾琏听了，连忙整理好衣服出去了。
! 香菱就是第一回被拐的英莲、第四回被薛蟠抢去的那个女孩子。到这里她已成了薛蟠的妾。
! 凤姐说“拿平儿换了他来”是玩笑，也是敲打：贾琏一见漂亮女人就动心，她看得清清楚楚。
! “马棚风”：薛蟠得手半个月就丢开了。香菱判词说“平生遭际实堪伤”。

# 十一、平儿替凤姐遮掩
这里凤姐乃问平儿：“方才姨妈有什么事，巴巴打发了香菱来？”|凤姐问平儿：“刚才姨妈有什么事，特意派香菱来？”
平儿笑道：“那里来的香菱，是我借他暂撒个谎。|平儿笑道：“哪里来的香菱，是我借她的名字撒了个谎。
奶奶说说，旺儿嫂子越发连个承算也没了。”|奶奶您说说，旺儿嫂子越来越没个算计了。”
说著，又走至凤姐身边，悄悄的说道：|说着又走到凤姐身边，小声说：
“奶奶的那利钱银子，迟不送来，早不送来，这会子二爷在家，他且送这个来了。|“奶奶的那笔利钱银子，早不送晚不送，偏偏二爷在家的时候送来了。
幸亏我在堂屋里撞见，不然时走了来回奶奶，二爷倘或问奶奶是什么利钱，奶奶自然不肯瞒二爷的，少不得照实告诉二爷。|幸亏我在堂屋里碰见了，不然她走进来回奶奶，二爷要是问是什么利钱，奶奶自然不肯瞒着二爷，少不得要照实告诉他。
我们二爷那脾气，油锅里的钱还要找出来花呢，听见奶奶有了这个梯己，他还不放心的花了呢。|我们二爷那脾气，油锅里的钱都要捞出来花，听说奶奶有这笔私房钱，他还不放开手花了？
所以我赶著接了过来，叫我说了他两句，谁知奶奶偏听见了问，我就撒谎说香菱来了。”|所以我赶紧接了过来，还说了她两句，谁知奶奶偏偏听见了问，我就撒谎说是香菱来了。”
凤姐听了笑道：“我说呢，姨妈知道你二爷来了，忽喇巴的反打发个房里人来了？|凤姐听了笑道：“我说呢，姨妈明知道你二爷回来了，怎么忽然反倒派个屋里人来？
原来你这蹄子肏鬼。”|原来是你这丫头在捣鬼。”
! 又是“利钱银子”。第十一回旺儿媳妇送来三百两，这回又送，凤姐放高利贷是瞒着贾琏的。
! 平儿说“奶奶自然不肯瞒二爷的”，是替凤姐留面子，其实凤姐正是要瞒。平儿替主子遮掩，又说得滴水不漏。

# 十二、赵嬷嬷求差事
说话时贾琏已进来，凤姐便命摆上酒馔来，夫妻对坐。|说话间贾琏已经进来了，凤姐就叫摆上酒菜，夫妻俩对面坐下。
凤姐虽善饮，却不敢任兴，只陪侍著贾琏。|凤姐虽然能喝酒，却不敢尽兴，只是陪着贾琏。
一时贾琏的乳母赵嬷嬷走来，贾琏凤姐忙让吃酒，令其上炕去。|一会儿贾琏的奶妈赵嬷嬷来了，贾琏、凤姐连忙请她喝酒，让她上炕坐。
赵嬷嬷执意不肯。|赵嬷嬷坚决不肯。
平儿等早于炕沿下设下一杌，又有一小脚踏，赵嬷嬷在脚踏上坐了。|平儿等人早在炕沿下放了一张小凳，又有一个小脚踏，赵嬷嬷就在脚踏上坐了。
贾琏向桌上拣两盘肴馔与他放在杌上自吃。|贾琏从桌上挑了两盘菜放在小凳上给她吃。
凤姐又道：“妈妈很嚼不动那个，倒没的矼了他的牙。”|凤姐又说：“妈妈嚼不动那个，别硌了她的牙。”
因向平儿道：“早起我说那一碗火腿炖肘子很烂，正好给妈妈吃，你怎么不拿了去赶著叫他们热来？”|又对平儿说：“早上我说那碗火腿炖肘子很烂，正好给妈妈吃，你怎么不拿去赶紧叫她们热来？”
又道：“妈妈，你尝一尝你儿子带来的惠泉酒。”|又说：“妈妈，你尝尝你儿子带回来的惠泉酒。”
赵嬷嬷道：“我喝呢，奶奶也喝一盅，怕什么？只不要过多了就是了。|赵嬷嬷说：“我喝，奶奶也喝一杯，怕什么？只要别喝多了就行。
我这会子跑了来，倒也不为饮酒，倒有一件正经事，奶奶好歹记在心里，疼顾我些罢。|我这会儿跑来，倒不是为了喝酒，是有一件正经事，奶奶好歹记在心上，照顾照顾我吧。
我们这爷，只是嘴里说的好，到了跟前就忘了我们。|我们这位爷，只是嘴上说得好，到了要紧时候就把我们忘了。
幸亏我从小儿奶了你这么大。|亏我从小把他奶到这么大。
我也老了，有的是那两个儿子，你就另眼照看他们些，别人也不敢呲牙儿的。|我也老了，就只有那两个儿子，你就另眼照看他们一点，别人也不敢说什么。
我还再四的求了你几遍，你答应的倒好，到如今还是燥屎。|我还再三求了你几次，你答应得倒好，到现在还是一点动静都没有。
这如今又从天上跑出这一件大喜事来，那里用不著人？|现在天上又掉下这么一件大喜事来，哪里用不着人？
所以倒是来和奶奶来说是正经，靠著我们爷，只怕我还饿死了呢。”|所以还是来跟奶奶说才是正经，靠我们爷，只怕我饿死了也没用。”
! 赵嬷嬷知道这个家谁说了算：求贾琏没用，要求凤姐。
! “从天上跑出这一件大喜事来，那里用不著人”：元春省亲是大工程，有差事就有油水，人人都想分一杯羹。

# 十三、“内人”和“外人”
凤姐笑道：“妈妈你放心，两个奶哥哥都交给我。|凤姐笑道：“妈妈你放心，两个奶哥哥都交给我。
你从小儿奶的儿子，你还有什么不知他那脾气的？|你从小奶大的儿子，你还不知道他那脾气？
拿著皮肉倒往那不相干的外人身上贴。|拿着自己的皮肉往不相干的外人身上贴。
可是现放著奶哥哥，那一个不比人强？|现放着两个奶哥哥，哪一个不比别人强？
你疼顾照看他们，谁敢说个‘不’字儿？|你照顾他们，谁敢说个‘不’字？
没的白便宜了外人。|白白便宜了外人。
-我这话也说错了，我们看著是‘外人’，你却看著‘内人’一样呢。”|——我这话也说错了，我们看着是‘外人’，你却当她们像‘内人’一样呢。”
说的满屋里人都笑了。|说得满屋子的人都笑了。
赵嬷嬷也笑个不住，又念佛道：“可是屋子里跑出青天来了。|赵嬷嬷也笑个不停，又念佛说：“这可真是屋里出了青天大老爷了。
若说‘内人’‘外人’这些混帐原故，我们爷是没有，不过是脸软心慈，搁不住人求两句罢了。”|要说‘内人’‘外人’这些乱七八糟的事，我们爷是没有的，不过是脸皮薄心肠软，经不住别人求两句罢了。”
凤姐笑道：“可不是呢，有‘内人’的他才慈软呢，他在咱们娘儿们跟前才是刚硬呢！”|凤姐笑道：“可不是嘛，对‘内人’他才心软呢，在咱们娘儿们跟前才硬气呢！”
赵嬷嬷笑道：“奶奶说的太尽情了，我也乐了，再吃一杯好酒。|赵嬷嬷笑道：“奶奶说得太透了，我也乐了，再喝一杯好酒。
从此我们奶奶作了主，我就没的愁了。”|从此有我们奶奶做主，我就不用发愁了。”
! “内人”是双关：既指妻子，也指贾琏在外面的女人。凤姐借着给奶妈的儿子要差事，当着众人把贾琏的风流事挖苦了一通。
! 赵嬷嬷的两个儿子就是下面的赵天梁、赵天栋，凤姐当场就给安排了。

# 十四、皇上恩准省亲
贾琏此时没好意思，只是讪笑吃酒，说“胡说”二字，——“快盛饭来，吃碗子还要往珍大爷那边去商议事呢。”|贾琏这时不好意思，只是讪笑着喝酒，说了“胡说”两个字，——“快盛饭来，吃完还要到珍大爷那边去商量事呢。”
凤姐道：“可是别误了正事。|凤姐说：“可别耽误了正事。
才刚老爷叫你作什么？”|刚才老爷叫你去做什么？”
贾琏道：“就为省亲。”|贾琏说：“就是为了省亲的事。”
凤姐忙问道：“省亲的事竟准了不成？”|凤姐忙问：“省亲的事真的批准了？”
贾琏笑道：“虽不十分准，也有八分准了。”|贾琏笑道：“虽然不是十分确定，也有八分准了。”
凤姐笑道：“可见当今的隆恩。|凤姐笑道：“可见当今皇上的恩典之大。
历来听书看戏，古时从未有的。”|从来听书看戏，古时候都没有过这种事。”
赵嬷嬷又接口道：“可是呢，我也老糊涂了。|赵嬷嬷接着说：“可不是嘛，我也老糊涂了。
我听见上上下下吵嚷了这些日子，什么省亲不省亲，我也不理论他去，如今又说省亲，到底是怎么个原故？”|我听见上上下下吵嚷了这些天，什么省亲不省亲的，我也没去管它，现在又说省亲，到底是怎么回事？”
! “省亲”就是出嫁的女儿回娘家探望父母。妃子省亲，历史上并没有这种制度，是作者虚构的。脂批说这一段借省亲写的其实是康熙南巡。

# 十五、贾琏讲省亲的来历
贾琏道：“如今当今贴体万人之心，世上至大莫如‘孝’字，想来父母儿女之性，皆是一理，不是贵贱上分别的。|贾琏说：“当今皇上体贴万民的心意，觉得世上最大的莫过于一个‘孝’字，想来父母儿女之间的天性，都是一样的道理，不分贵贱。
当今自为日夜侍奉太上皇，皇太后，尚不能略尽孝意，|皇上自己日夜侍奉太上皇、皇太后，还觉得不能尽孝；
因见宫里嫔妃才人等皆是入宫多年，抛离父母音容，岂有不思想之理？|又见宫里的嫔妃才人们都入宫多年，离开了父母，哪有不想念的道理？
在儿女思想父母，是分所应当。|儿女想念父母，是理所应当的。
想父母在家，若只管思念女儿，竟不能见，倘因此成疾致病，甚至死亡，皆由朕躬禁锢，不能使其遂天伦之愿，亦大伤天和之事。|想到父母在家，只是思念女儿却见不到，要是因此生病甚至死了，都是因为朕把她们关在宫里，不能让她们实现天伦之愿，这也是大伤天理人和的事。
故启奏太上皇，皇太后，每月逢二六日期，准其椒房眷属入宫请候看视。|所以禀告太上皇、皇太后，每月逢二、逢六的日子，准许妃嫔的家属进宫探望。
于是太上皇，皇太后大喜，深赞当今至孝纯仁，体天格物。|太上皇、皇太后非常高兴，大大称赞当今皇上至孝仁厚，顺应天理。
因此二位老圣人又下旨意，说椒房眷属入宫，未免有国体仪制，母女尚不能惬怀。|因此两位老圣人又下旨说：家属进宫，难免有国家礼制的约束，母女还是不能尽情相聚。
竟大开方便之恩，特降谕诸椒房贵戚，除二六日入宫之恩外，|于是特别开恩，下旨给各位妃嫔的亲属：除了逢二逢六可以进宫以外，
凡有重宇别院之家，可以驻跸关防之外，不妨启请内廷鸾舆入其私第，|凡是家里有深宅别院、可以供皇家驻驾并安排警卫的，不妨奏请让妃嫔的车驾到家里来，
庶可略尽骨肉私情，天伦中之至性。|这样也可以稍微尽一尽骨肉之情和天伦至性。
此旨一下，谁不踊跃感戴？|这道圣旨一下，谁不欢欣鼓舞、感恩戴德？
现今周贵人的父亲已在家里动了工了，修盖省亲别院呢。|现在周贵人的父亲已经在家里动工，修建省亲别院了。
又有吴贵妃的父亲吴天祐家，也往城外踏看地方去了。|还有吴贵妃的父亲吴天祐家，也到城外去看地方了。
这岂不有八九分了？”|这还不是有八九分准了吗？”
! “椒房”指后妃，汉代皇后的宫殿用花椒和泥涂墙，取温暖、多子之意。
! 条件是“有重宇别院之家”，就是说要自己盖得起一座园子。皇上的“恩典”，要各家自己掏钱来接，这就是下面大观园的由来。

# 十六、赵嬷嬷说接驾
赵嬷嬷道：“阿弥陀佛！原来如此。|赵嬷嬷说：“阿弥陀佛！原来是这样。
这样说，咱们家也要预备接咱们大小姐了？”|这么说，咱们家也要预备接咱们大小姐了？”
贾琏道：“这何用说呢！不然，这会子忙的是什么？”|贾琏说：“这还用说吗！不然现在忙的是什么？”
凤姐笑道：“若果如此，我可也见个大世面了。|凤姐笑道：“要真是这样，我也能见见大世面了。
可恨我小几岁年纪，若早生二三十年，如今这些老人家也不薄我没见世面了。|可恨我年纪小了几岁，要是早生二三十年，现在这些老人家也不会看不起我没见过世面了。
说起当年太祖皇帝仿舜巡的故事，比一部书还热闹，我偏没造化赶上。”|说起当年太祖皇帝仿照舜帝巡游天下的事，比一部书还热闹，我偏偏没福气赶上。”
赵嬷嬷道：“唉哟哟，那可是千载希逢的！|赵嬷嬷说：“哎哟哟，那可是千年难逢的事！
那时候我才记事儿，咱们贾府正在姑苏扬州一带监造海舫，修理海塘，只预备接驾一次，把银子都花的淌海水似的！|那时候我刚记事，咱们贾府正在苏州扬州一带监造海船、修理海堤，只预备接驾一次，银子就花得像海水一样流出去！
说起来……”|说起来……”
凤姐忙接道：“我们王府也预备过一次。|凤姐赶忙接着说：“我们王家也预备过一次。
那时我爷爷单管各国进贡朝贺的事，凡有的外国人来，都是我们家养活。|那时我爷爷专管各国进贡朝贺的事，凡是有外国人来，都是我们家招待供养。
粤、闽、滇、浙所有的洋船货物都是我们家的。”|广东、福建、云南、浙江所有的洋船货物都归我们家管。”
! 这一段是全书离曹家真实历史最近的地方。曹雪芹的祖父曹寅在江南做织造，康熙六次南巡，曹家接驾四次，花费巨大，留下亏空，最后被雍正抄家。
! 赵嬷嬷说“银子都花的淌海水似的”，正是贾府、也是曹家衰败的根源。

# 十七、“拿著皇帝家的银子往皇帝身上使”
赵嬷嬷道：“那是谁不知道的？|赵嬷嬷说：“那谁不知道？
如今还有个口号儿呢，说‘东海少了白玉床，龙王来请江南王’，这说的就是奶奶府上了。|现在还有句口号，说‘东海少了白玉床，龙王来请江南王’，说的就是奶奶府上。
还有如今现在江南的甄家，嗳哟哟，好势派！|还有现在江南的甄家，哎哟哟，好大的气派！
独他家接驾四次，若不是我们亲眼看见，告诉谁谁也不信的。|只有他家接驾四次，要不是我们亲眼看见，说给谁听谁也不信。
别讲银子成了土泥，凭是世上所有的，没有不是堆山塞海的，‘罪过可惜’四个字竟顾不得了。”|别说银子花得像泥土一样，凡是世上有的东西，没有不是堆成山、塞满海的，‘罪过可惜’这四个字竟然顾不上了。”
凤姐道：“常听见我们太爷们也这样说，岂有不信的。|凤姐说：“常听我们家太爷们也这么说，哪有不信的。
只纳罕他家怎么就这么富贵呢？”|只是奇怪他家怎么这么富贵？”
赵嬷嬷道：“告诉奶奶一句话，也不过是拿著皇帝家的银子往皇帝身上使罢了！|赵嬷嬷说：“告诉奶奶一句话，也不过是拿着皇帝家的银子往皇帝身上花罢了！
谁家有那些钱买这个虚热闹去？”|谁家有那么多钱去买这个虚热闹？”
! “东海少了白玉床，龙王来请江南王”就是第四回“护官符”上写王家的那一句。
! 甄家“接驾四次”，和曹家完全对得上。甄家是贾家的影子：“真”家先败，“假”家随后。
! 赵嬷嬷一句大实话戳破了一切：皇帝家的银子借来花在皇帝身上，账总有一天要还。曹家就是因为还不上这笔亏空被抄的。

# 十八、选定园址
正说的热闹，王夫人又打发人来瞧凤姐吃了饭不曾。|正说得热闹，王夫人又派人来看凤姐吃了饭没有。
凤姐便知有事等他，忙忙的吃了半碗饭，漱口要走，|凤姐就知道有事在等她，急忙吃了半碗饭，漱了口要走，
又有二门上小厮们回：“东府里蓉，蔷二位哥儿来了。”|二门上的小厮又来报：“东府的蓉、蔷两位哥儿来了。”
贾琏才漱了口，平儿捧著盆盥手，见他二人来了，便问：“什么话？快说。”|贾琏刚漱了口，平儿捧着盆子给他洗手，见他俩来了，就问：“什么事？快说。”
凤姐且止步稍候，听他二人回些什么。|凤姐先停下脚步等一等，听他俩说些什么。
贾蓉先回说：“我父亲打发我来回叔叔：|贾蓉先回说：“我父亲派我来告诉叔叔：
老爷们已经议定了，从东边一带，借著东府里花园起，转至北边，一共丈量准了，三里半大，可以盖造省亲别院了。|老爷们已经商量定了，从东边一带，借用东府的花园，转到北边，一共量准了，有三里半大，可以盖省亲别院了。
已经传人画图样去了，明日就得。|已经叫人去画图样了，明天就能画好。
叔叔才回家，未免劳乏，不用过我们那边去，有话明日一早再请过去面议。”|叔叔刚回家，难免累了，不用到我们那边去了，有话明天一早再请您过去当面商量。”
贾琏笑著忙说：“多谢大爷费心体谅，我就不过去了。|贾琏笑着忙说：“多谢大爷体谅，我就不过去了。
正经是这个主意才省事，盖造也容易，若采置别处地方去，那更费事，且倒不成体统。|这个主意才最省事，盖起来也容易；要是到别处去买地，那就更费事，也不成样子。
你回去说这样很好，若老爷们再要改时，全仗大爷谏阻，万不可另寻地方。|你回去说这样很好，要是老爷们还想改，全靠大爷劝阻，千万不要另找地方。
明日一早我给大爷去请安去，再议细话。”|明天一早我去给大爷请安，再商量细节。”
贾蓉忙应几个“是”。|贾蓉连忙答应了几声“是”。
! 这块三里半的地，就是后来的大观园。会芳园是秦可卿死后停灵的地方，现在要拆了盖省亲别院，丧事和喜事接在了一块地上。

# 十九、贾蔷下姑苏
贾蔷又近前回说：“下姑苏聘请教习，采买女孩子，置办乐器行头等事，|贾蔷又上前回说：“下苏州请戏班教习、买女孩子、置办乐器和戏装这些事，
大爷派了侄儿，带领著来管家两个儿子，还有单聘仁，卜固修两个清客相公，一同前往，所以命我来见叔叔。”|大爷派了侄儿，带着来管家的两个儿子，还有单聘仁、卜固修两位清客相公一起去，所以叫我来见叔叔。”
贾琏听了，将贾蔷打谅了打谅，笑道：“你能在这一行么？|贾琏听了，把贾蔷上下打量了一番，笑道：“你干得了这一行吗？
这个事虽不算甚大，里头大有藏掖的。”|这件事虽然不算大，里面的花样可不少。”
贾蔷笑道：“只好学习著办罢了。”|贾蔷笑道：“只好边学边办了。”
贾蓉在身旁灯影下悄拉凤姐的衣襟，凤姐会意，因笑道：|贾蓉在旁边的灯影里悄悄拉了拉凤姐的衣襟，凤姐会意，就笑道：
“你也太操心了，难道大爷比咱们还不会用人？偏你又怕他不在行了。|“你也太操心了，难道大爷还不如咱们会用人？偏你又怕他不在行。
谁都是在行的？孩子们已长的这么大了，‘没吃过猪肉，也看见过猪跑’。|谁天生就在行？孩子们都长这么大了，‘没吃过猪肉，也见过猪跑’。
大爷派他去，原不过是个坐纛旗儿，难道认真的叫他去讲价钱会经纪去呢！|大爷派他去，本来就不过是个挂名坐镇的，难道真叫他去讲价钱、跟商人打交道！
依我说就很好。”|依我看就很好。”
贾琏道：“自然是这样。并不是我驳回，少不得替他算计算计。”|贾琏说：“自然是这样。我不是要驳回，只是少不得替他盘算盘算。”
因问：“这一项银子动那一处的？”|又问：“这一笔银子从哪里出？”
贾蔷道：“才也议到这里。|贾蔷说：“刚才也商量到这里了。
赖爷爷说，不用从京里带下去，江南甄家还收著我们五万银子。|赖爷爷说，不用从京城带下去，江南甄家还替我们存着五万两银子。
明日写一封书信会票我们带去，先支三万，下剩二万存著，等置办花烛彩灯并各色帘栊帐缦的使费。”|明天写一封信和汇票让我们带去，先支三万，剩下二万存着，留作置办花烛彩灯和各种帘子帐幔的费用。”
贾琏点头道：“这个主意好。”|贾琏点头说：“这个主意好。”
! 单聘仁谐“善骗人”，卜固修谐“不顾羞”，这两个清客的名字就是作者的评语。
! 贾琏说“大有藏掖”，就是说里面油水多。贾蓉拉凤姐的衣襟，是求她说情，下面就看出为什么了。
! 这十二个买来的女孩子，就是后来梨香院的十二个小戏子，龄官、芳官、藕官等都在其中。

# 二十、各有私心
凤姐忙向贾蔷道：“既这样，我有两个在行妥当人，你就带他们去办，这个便宜了你呢。”|凤姐忙对贾蔷说：“既然这样，我有两个在行又稳妥的人，你就带他们去办，这可便宜你了。”
贾蔷忙陪笑说：“正要和婶婶讨两个人呢，这可巧了。”|贾蔷忙陪笑说：“正要跟婶婶讨两个人呢，这可巧了。”
因问名字。|就问名字。
凤姐便问赵嬷嬷。|凤姐就问赵嬷嬷。
彼时赵嬷嬷已听呆了话，平儿忙笑推他，他才醒悟过来，忙说：“一个叫赵天梁，一个叫赵天栋。”|这时赵嬷嬷已经听呆了，平儿忙笑着推了她一下，她才醒过神来，忙说：“一个叫赵天梁，一个叫赵天栋。”
凤姐道：“可别忘了，我可干我的去了。”|凤姐说：“可别忘了，我干我的去了。”
说著便出去了。|说着就出去了。
贾蓉忙送出来，又悄悄的向凤姐道：|贾蓉连忙送出来，又悄悄对凤姐说：
“婶子要什么东西，吩咐我开个帐给蔷兄弟带了去，叫他按帐置办了来。”|“婶子要什么东西，吩咐我开个单子让蔷兄弟带去，叫他照单子买来。”
凤姐笑道：“别放你娘的屁！|凤姐笑道：“别放屁！
我的东西还没处撂呢，希罕你们鬼鬼祟祟的？”|我的东西还没地方放呢，稀罕你们这些鬼鬼祟祟的？”
说著一径去了。|说着就走了。
这里贾蔷也悄问贾琏：“要什么东西？顺便织来孝敬。”|这边贾蔷也悄悄问贾琏：“您要什么东西？我顺便织来孝敬您。”
贾琏笑道：“你别兴头。|贾琏笑道：“你别得意。
才学著办事，倒先学会了这把戏。|刚学着办事，倒先学会了这一套。
我短了什么，少不得写信来告诉你，且不要论到这里。”|我缺了什么，自然会写信告诉你，现在先别说这个。”
说毕，打发他二人去了。|说完，打发他俩走了。
! 一桩差事，人人都插了一手：凤姐塞进奶妈的两个儿子，贾蓉、贾蔷要孝敬叔叔婶子。省亲还没开始，钱已经在一层层漏了。
! 凤姐骂着说不稀罕，贾琏说“我短了什么少不得写信”，都没有真拒绝。

# 二十一、大观园动工
接著回事的人来，不止三四次，贾琏害乏，便传与二门上，一应不许传报，俱等明日料理。|接着来回事的人不止三四次，贾琏累了，就传话给二门上，一律不许再通报，都等明天再办。
凤姐至三更时分方下来安歇，一宿无话。|凤姐到三更时分才回来歇下，一夜无话。
次早贾琏起来，见过贾赦贾政，便往宁府中来，|第二天一早贾琏起来，见过贾赦、贾政，就到宁府来，
合同老管事的人等，并几位世交门下清客相公，审察两府地方，缮画省亲殿宇，一面察度办理人丁。|和老管事们以及几位世交门下的清客相公一起，察看两府的地方，规划省亲的殿宇，一面安排办事的人手。
自此后，各行匠役齐集，金银铜锡以及土木砖瓦之物，搬运移送不歇。|从此以后，各行各业的工匠都聚齐了，金银铜锡和土木砖瓦这些东西，搬来运去没有停过。
先令匠人拆宁府会芳园墙垣楼阁，直接入荣府东大院中。|先叫工匠拆掉宁府会芳园的围墙楼阁，直接连到荣府的东大院里。
荣府东边所有下人一带群房尽已拆去。|荣府东边下人住的那一片房子全部拆掉了。
当日宁荣二宅，虽有一小巷界断不通，然这小巷亦系私地，并非官道，故可以连属。|原来宁荣两府之间，虽然有一条小巷隔开不通，可这条小巷也是自家的地，不是官道，所以可以连起来。
会芳园本是从北拐角墙下引来一股活水，今亦无烦再引。|会芳园本来就从北边拐角的墙下引进来一股活水，现在也不用再引了。
其山石树木虽不敷用，贾赦住的乃是荣府旧园，其中竹树山石以及亭榭栏杆等物，皆可挪就前来。|山石树木虽然不够用，可贾赦住的是荣府的旧花园，里面的竹子树木、山石和亭榭栏杆这些东西，都可以挪过来用。
如此两处又甚近，凑来一处，省得许多财力，纵亦不敷，所添亦有限。|这样两处又很近，凑到一起，省了许多钱财人力，就算不够，再添也有限。
全亏一个老明公号山子野者，一一筹画起造。|全靠一位号叫“山子野”的老行家，一一规划建造。
! 大观园是拆了宁府的会芳园、荣府的下人房和贾赦的旧园拼起来的。作者特意写“省得许多财力”，可后面还是花了无数银子。
! “山子野”是堆假山的高手，名字本身就是“山野之人”。

# 二十二、各司其职
贾政不惯于俗务，只凭贾赦，贾珍，贾琏，赖大，来升，林之孝，吴新登，詹光，程日兴等几人安插摆布。|贾政不习惯这些俗务，只让贾赦、贾珍、贾琏、赖大、来升、林之孝、吴新登、詹光、程日兴这几个人去安排布置。
凡堆山凿池，起楼竖阁，种竹栽花，一应点景等事，又有山子野制度。|凡是堆山挖池、盖楼建阁、种竹栽花这些布置景致的事，又有山子野来设计。
下朝闲暇，不过各处看望看望，最要紧处和贾赦等商议商议便罢了。|贾政下朝有空，不过到各处看看，最要紧的地方和贾赦等人商量商量就行了。
贾赦只在家高卧，有芥豆之事，贾珍等或自去回明，或写略节，或有话说，便传呼贾琏，赖大等领命。|贾赦只在家里高枕而卧，有一点小事，贾珍等人或者亲自去禀报，或者写个简单的条子，贾赦有话要说，就叫贾琏、赖大等人来领命。
贾蓉单管打造金银器皿。|贾蓉专管打造金银器皿。
贾蔷已起身往姑苏去了。|贾蔷已经动身去苏州了。
贾珍，赖大等又点人丁，开册籍，监工等事，一笔不能写到，不过是喧阗热闹非常而已。|贾珍、赖大等人又清点人手、造册登记、监督施工，这些事一笔也写不完，总之是喧闹热闹得很。
暂且无话。|暂时不多说。
! 詹光谐“沾光”，程日兴谐“成日兴”，又是两个清客的名字带着讽刺。
! 贾政不管、贾赦不动，实际经手的全是贾珍、贾琏和管家们，这里面的油水，下面不再细写。

# 二十三、秦钟不行了
且说宝玉近因家中有这等大事，贾政不来问他的书，心中是件畅事，|再说宝玉最近因为家里有这样的大事，贾政顾不上来问他的功课，心里很痛快，
无奈秦钟之病日重一日，也著实悬心，不能乐业。|无奈秦钟的病一天比一天重，他实在担心，也快活不起来。
这日一早起来才梳洗完毕，意欲回了贾母去望候秦钟，|这天一早起来，刚梳洗完，想去禀告贾母，好去看望秦钟，
忽见茗烟在二门照壁前探头缩脑，宝玉忙出来问他：“作什么？”|忽然看见茗烟在二门的照壁前探头探脑，宝玉连忙出来问他：“做什么？”
茗烟道：“秦相公不中用了！”|茗烟说：“秦相公不行了！”
宝玉听说，吓了一跳，忙问道：“我昨儿才瞧了他来，还明明白白，怎么就不中用了？”|宝玉一听，吓了一跳，忙问：“我昨天才去看过他，还明明白白的，怎么就不行了？”
茗烟道：“我也不知道，才刚是他家的老头子来特告诉我的。”|茗烟说：“我也不知道，刚才是他家的老仆人特意来告诉我的。”
宝玉听了，忙转身回明贾母。|宝玉听了，连忙转身去禀告贾母。
贾母吩咐：“好生派妥当人跟去，到那里尽一尽同窗之情就回来，不许多耽搁了。”|贾母吩咐：“好好派几个妥当的人跟着去，到那里尽一尽同学的情分就回来，不许多耽搁。”
宝玉听了，忙忙的更衣出来，车犹未备，急的满厅乱转。|宝玉听了，急忙换了衣服出来，车还没备好，急得满厅乱转。
一时催促的车到，忙上了车，李贵，茗烟等跟随。|一会儿催来了车，赶忙上车，李贵、茗烟等人跟着。
来至秦钟门首，悄无一人，遂蜂拥至内室，唬的秦钟的两个远房婶母并几个弟兄都藏之不迭。|到了秦钟家门口，静悄悄的一个人也没有，于是一拥进了内室，吓得秦钟的两个远房婶娘和几个兄弟都来不及躲。
! 秦家冷冷清清，“悄无一人”。秦业死了，秦钟将死，家里只剩几个远房亲戚，和宁府办丧事的排场比起来，天差地别。

# 二十四、鬼判拿人
此时秦钟已发过两三次昏了，移床易箦多时矣。|这时秦钟已经昏过去两三次了，早就从床上挪到了地铺上。
宝玉一见，便不禁失声。|宝玉一看，忍不住哭出声来。
李贵忙劝道：“不可不可，秦相公是弱症，未免炕上挺扛的骨头不受用，所以暂且挪下来松散些。|李贵忙劝道：“不能哭，不能哭，秦相公是虚弱的病，躺在炕上骨头硌得难受，所以暂时挪下来松快些。
哥儿如此，岂不反添了他的病？”|哥儿这样哭，岂不是反倒加重他的病？”
宝玉听了，方忍住近前，见秦钟面如白蜡，合目呼吸于枕上。|宝玉听了，才忍住哭走上前去，只见秦钟脸色像白蜡一样，闭着眼睛躺在枕头上喘气。
宝玉忙叫道：“鲸兄！宝玉来了。”|宝玉连忙叫道：“鲸兄！宝玉来了。”
连叫两三声，秦钟不睬。|连叫了两三声，秦钟都没有反应。
宝玉又道：“宝玉来了。”|宝玉又说：“宝玉来了。”
那秦钟早已魂魄离身，只剩得一口悠悠馀气在胸，正见许多鬼判持牌提索来捉他。|那秦钟早已魂魄离身，只剩胸口一丝微弱的气息，正看见许多鬼差判官拿着令牌、提着绳索来捉他。
那秦钟魂魄那里肯就去，又记念著家中无人掌管家务，又记挂著父亲还有留积下的三四千两银子，又记挂著智能尚无下落，因此百般求告鬼判。|秦钟的魂魄哪里肯走，又惦记着家里没人管家务，又惦记着父亲留下的三四千两银子，又惦记着智能还没有下落，所以百般哀求鬼差判官。
无奈这些鬼判都不肯徇私，反叱吒秦钟道：|无奈这些鬼判都不肯徇私情，反而呵斥秦钟说：
“亏你还是读过书的人，岂不知俗语说的：‘阎王叫你三更死，谁敢留人到五更。’|“亏你还是读过书的人，难道不知道俗话说的：‘阎王叫你三更死，谁敢留人到五更。’
我们阴间上下都是铁面无私的，不比你们阳间瞻情顾意，有许多的关碍处。”|我们阴间上上下下都是铁面无私的，不像你们阳间讲人情、顾面子，有许多牵扯。”
! “移床易箦”是旧俗：人快断气时，要从床上挪到地上，叫“易箦”。
! 秦钟临死惦记的三件事：家务、银子、智能，全是俗事，一件也放不下。
! 鬼判说阴间“铁面无私”，不像阳间“瞻情顾意”，话音刚落，就被一个“宝玉”吓住了。

# 二十五、“宝玉”二字
正闹著，那秦钟魂魄忽听见“宝玉来了”四字，便忙又央求道：|正闹着，秦钟的魂魄忽然听见“宝玉来了”四个字，又忙央求说：
“列位神差，略发慈悲，让我回去，和这一个好朋友说一句话就来的。”|“各位神差，发发慈悲，让我回去，和这个好朋友说一句话就来。”
众鬼道：“又是什么好朋友？”|众鬼说：“又是什么好朋友？”
秦钟道：“不瞒列位，就是荣国公的孙子，小名宝玉。”|秦钟说：“不瞒各位，就是荣国公的孙子，小名叫宝玉。”
都判官听了，先就唬慌起来，忙喝骂鬼使道：|都判官一听，先就慌了，连忙喝骂鬼差说：
“我说你们放了他回去走走罢，你们断不依我的话，如今只等他请出个运旺时盛的人来才罢。”|“我说你们放他回去走走吧，你们偏不听我的话，现在等他请出一个运气正旺的人来才算完。”
众鬼见都判如此，也都忙了手脚，一面又抱怨道：|众鬼见都判官这样，也都手忙脚乱，一面又抱怨说：
“你老人家先是那等雷霆电雹，原来见不得‘宝玉’二字。|“您老人家刚才那样雷霆大发，原来一听‘宝玉’两个字就怕了。
依我们愚见，他是阳，我们是阴，怕他们也无益于我们。”|依我们看，他是阳间的人，我们是阴间的鬼，怕他也没什么用。”
都判道：“放屁！|都判官说：“放屁！
俗语说的好，‘天下官管天下事’，自古人鬼之道却是一般，阴阳并无二理。|俗话说得好，‘天下官管天下事’，自古以来人间鬼界的道理都是一样的，阴阳没有两样。
别管他阴也罢，阳也罢，还是把他放回没有错了的。”|别管他阴也好阳也好，还是把他放回去没错。”
! 这是作者的一段讽刺：阴间的判官和阳间的官一样，见了权贵就怕，“阴阳并无二理”。
! 刚说完阴间“铁面无私”，转眼就徇了私。“护官符”不只在人间管用。

# 二十六、秦钟遗言
众鬼听说，只得将秦魂放回，哼了一声，微开双目，见宝玉在侧，|众鬼听了，只好把秦钟的魂放回去。秦钟哼了一声，微微睁开眼，看见宝玉在旁边，
乃勉强叹道：“怎么不肯早来？再迟一步也不能见了。”|就勉强叹道：“怎么不早点来？再晚一步就见不到了。”
宝玉忙携手垂泪道：“有什么话留下两句。”|宝玉连忙拉着他的手流泪说：“有什么话，留下两句吧。”
秦钟道：“并无别话。|秦钟说：“没有别的话。
以前你我见识自为高过世人，我今日才知自误了。|以前你我自以为见识比世人高，我今天才知道是自己误了自己。
以后还该立志功名，以荣耀显达为是。”|以后还是应该立志求取功名，以荣耀显达为正路。”
说毕，便长叹一声，萧然长逝了。|说完，长叹一声，就凄凉地死去了。
! 秦钟临死劝宝玉“立志功名”，这正是宝玉最厌恶的“仕途经济”。最懂宝玉的朋友，死前却说出了和贾政一样的话。
! 脂批说秦钟这番话是“扭转”，也有人认为后人改过。一个“情种”临死悔悟，作者写的是人在生死关头对自己一生的怀疑。
! 秦钟谐音“情种”。可卿（情可轻）死了，情种也死了，宝玉人生中“情”的启蒙到这里告一段落，接下来是大观园。
</script>

<script type="text/plain" id="ch17">
# 一、秦钟下葬，园子完工
话说秦钟既死，宝玉痛哭不已，李贵等好容易劝解半日方住，归时犹是凄恻哀痛。|秦钟死了，宝玉痛哭不止，李贵等人劝了好半天才止住，回来的时候还是凄凉悲痛。
贾母帮了几十两银子，外又另备奠仪，宝玉去吊纸。|贾母资助了几十两银子，另外又备了祭礼，让宝玉去吊唁烧纸。
七日后便送殡掩埋了，别无述记。|七天后就出殡下葬了，没什么可记的。
只有宝玉日日思慕感悼，然亦无可如何了。|只有宝玉天天思念哀悼，可也没有办法了。
又不知历几何时，这日贾珍等来回贾政：|又不知过了多久，这天贾珍等人来回禀贾政：
“园内工程俱已告竣，大老爷已瞧过了，只等老爷瞧了，或有不妥之处，再行改造，好题匾额对联的。”|“园子里的工程都完工了，大老爷已经看过了，只等老爷看了，如有不妥当的地方再改，好题写匾额对联。”
! 秦钟的丧事和秦可卿比，只有“几十两银子”“别无述记”。贵贱之别，作者一笔带过。
! 这一回在通行本里叫第十七回，脂本原是第十七、十八回合为一回，所以回目和内容有些交错。

# 二、匾额对联怎么题
贾政听了，沉思一回，说道：“这匾额对联倒是一件难事。|贾政听了，想了一会儿，说：“这匾额对联倒是件难事。
论理该请贵妃赐题才是，然贵妃若不亲睹其景，大约亦必不肯妄拟，|按理应该请贵妃题才对，可贵妃没亲眼看见景致，大概也不肯随便拟；
若直待贵妃游幸过再请题，偌大景致，若干亭榭，无字标题，也觉寥落无趣，任有花柳山水，也断不能生色。”|要是等贵妃来游过了再请她题，这么大的园子、这么多亭台楼阁，没有一个字的题名，也显得冷清无趣，就算有花柳山水，也绝不能增色。”
众清客在旁笑答道：“老世翁所见极是。|清客们在旁边笑着回答：“老世翁想得极对。
如今我们有个愚见：各处匾额对联断不可少，亦断不可定名。|我们倒有个浅见：各处的匾额对联不能少，也不能定死。
如今且按其景致，或两字，三字，四字，虚合其意，拟了出来，暂且做灯匾联悬了。|现在先按景致，或两个字、三个字、四个字，大致合着意思拟出来，暂时做成灯匾灯联挂上。
待贵妃游幸时，再请定名，岂不两全？”|等贵妃来游览时，再请她定名，岂不是两全其美？”
贾政等听了，都道：“所见不差。|贾政等人听了，都说：“说得不错。
我们今日且看看去，只管题了，若妥当便用，不妥时，然后将雨村请来，令他再拟。”|我们今天先去看看，只管题，要是妥当就用，不妥当，再把雨村请来让他拟。”
众人笑道：“老爷今日一拟定佳，何必又待雨村。”|众人笑道：“老爷今天一拟定然是好的，何必再等雨村。”
贾政笑道：“你们不知，我自幼于花鸟山水题咏上就平平，如今上了年纪，且案牍劳烦，于这怡情悦性文章上更生疏了。|贾政笑道：“你们不知道，我从小在花鸟山水的题咏上就很平常，现在上了年纪，公文又繁忙，对这种怡情养性的文章就更生疏了。
纵拟了出来，不免迂腐古板，反不能使花柳园亭生色，似不妥协，反没意思。”|就算拟出来，难免迂腐古板，反倒不能给花柳园亭增色，不妥当，反而没意思。”
众清客笑道：“这也无妨。|清客们笑道：“这也不要紧。
我们大家看了公拟，各举其长，优则存之，劣则删之，未为不可。”|我们大家看了一起拟，各自说出好的，好的留下，不好的删掉，也未尝不可。”
贾政道：“此论极是。|贾政说：“这话很对。
且喜今日天气和暖，大家去逛逛。”|正好今天天气暖和，大家去逛逛。”
说著起身，引众人前往。|说着起身，带着众人前去。
! 贾政自己承认不擅长题咏，这是实话。他是个正经读书做官的人，诗情才气全在宝玉身上，可他偏偏看不起这种“歪才”。

# 三、宝玉撞上贾政
贾珍先去园中知会众人。|贾珍先到园子里通知众人。
可巧近日宝玉因思念秦钟，忧戚不尽，贾母常命人带他到园中来戏耍。|正好最近宝玉因为思念秦钟，忧伤不已，贾母常叫人带他到园子里来玩。
此时亦才进去，忽见贾珍走来，向他笑道：“你还不出去，老爷就来了。”|这时他刚进去，忽然看见贾珍走过来，对他笑道：“你还不出去，老爷就要来了。”
宝玉听了，带著奶娘小厮们，一溜烟就出园来。|宝玉听了，带着奶妈小厮们一溜烟跑出园子。
方转过弯，顶头贾政引众客来了，躲之不及，只得一边站了。|刚转过弯，迎面贾政带着众客人来了，躲也躲不开，只好站在一边。
贾政近因闻得塾掌称赞宝玉专能对对联，虽不喜读书，偏倒有些歪才情似的，|贾政最近听私塾先生称赞宝玉特别会对对联，虽然不爱读书，倒好像有些歪才，
今日偶然撞见这机会，便命他跟来。|今天正好碰上这个机会，就叫他跟着来。
宝玉只得随往，尚不知何意。|宝玉只好跟着去，还不知道是什么意思。
! 宝玉见了父亲就像老鼠见了猫，“一溜烟”“躲之不及”，写得很传神。
! 贾政叫他跟来，一半是试他，一半其实也想看看儿子到底有没有才。

# 四、园门
贾政刚至园门前，只见贾珍带领许多执事人来，一旁侍立。|贾政刚到园门前，只见贾珍带着许多管事的人来，在一旁站着伺候。
贾政道：“你且把园门都关上，我们先瞧了外面再进去。”|贾政说：“你先把园门都关上，我们先看看外面再进去。”
贾珍听说，命人将门关了。|贾珍听了，叫人把门关上。
贾政先秉正看门。|贾政先端端正正地看大门。
只见正门五间，上面桶瓦泥鳅脊，那门栏窗槅，皆是细雕新鲜花样，并无朱粉涂饰，|只见正门有五间，上面是筒瓦，屋脊像泥鳅背一样圆滑，门栏窗格都雕着精细新颖的花样，没有涂红抹粉，
一色水磨群墙，下面白石台矶，凿成西番草花样。|一色磨得光滑的砖墙，下面是白石台阶，凿成西番草的花纹。
左右一望，皆雪白粉墙，下面虎皮石，随势砌去，果然不落富丽俗套，自是欢喜。|左右一看，都是雪白的粉墙，墙脚用虎皮石顺着地势砌过去，果然不落富丽俗套，贾政心里很高兴。
! 大门不刷红漆、不描金彩，走的是清雅一路，这合贾政的口味，也合元春“崇节尚俭”的性子。

# 五、翠嶂和“曲径通幽处”
遂命开门，只见迎面一带翠嶂挡在前面。|于是叫人开门，只见迎面一道青翠的假山挡在前面。
众清客都道：“好山，好山！”|清客们都说：“好山，好山！”
贾政道：“非此一山，一进来园中所有之景悉入目中，则有何趣。”|贾政说：“要不是这座山挡着，一进来园里所有的景色都看见了，还有什么意思。”
众人道：“极是。非胸中大有邱壑，焉想及此。”|众人说：“极是。要不是心里大有丘壑，怎么想得到这一层。”
说毕，往前一望，见白石峻嶒，或如鬼怪，或如猛兽，纵横拱立，|说完往前一看，只见白石嶙峋，有的像鬼怪，有的像猛兽，横的竖的拱立着，
上面苔藓成斑，藤萝掩映，其中微露羊肠小径。|上面长满斑斑点点的青苔，藤萝掩映，中间隐约露出一条羊肠小路。
贾政道：“我们就从此小径游去，回来由那一边出去，方可遍览。”|贾政说：“我们就从这条小路进去，回来从那一边出去，才能看遍。”
说毕，命贾珍在前引导，自己扶了宝玉，逶迤进入山口。|说完，叫贾珍在前面领路，自己扶着宝玉，弯弯曲曲地走进山口。
抬头忽见山上有镜面白石一块，正是迎面留题处。|抬头忽然看见山上有一块像镜面一样平滑的白石，正是迎面留着题字的地方。
贾政回头笑道：“诸公请看，此处题以何名方妙？”|贾政回头笑道：“各位请看，这里题个什么名字才好？”
众人听说，也有说该题“叠翠”二字，也有说该提“锦嶂”的，又有说“赛香炉”的，又有说“小终南”的，种种名色，不止几十个。|众人听了，有说该题“叠翠”两个字的，有说该题“锦嶂”的，又有说“赛香炉”的，又有说“小终南”的，各种名字，不下几十个。
原来众客心中早知贾政要试宝玉的功业进益如何，只将些俗套来敷衍。|原来清客们心里早知道贾政要试试宝玉的学问有没有长进，所以只拿些俗套来敷衍。
宝玉亦料定此意。|宝玉也猜到了这个意思。
贾政听了，便回头命宝玉拟来。|贾政听了，就回头叫宝玉拟一个。
宝玉道：“尝闻古人有云：‘编新不如述旧，刻古终胜雕今。’|宝玉说：“听说古人说过：‘编新的不如沿用旧的，刻古的终究胜过雕今的。’
况此处并非主山正景，原无可题之处，不过是探景一进步耳。|况且这里不是主山正景，本来就没什么可题的，不过是探看景致的第一步罢了。
莫若直书‘曲径通幽处’这句旧诗在上，倒还大方气派。”|不如直接把‘曲径通幽处’这句旧诗写在上面，倒还大方有气派。”
众人听了，都赞道：“是极！二世兄天分高，才情远，不似我们读腐了书的。”|众人听了，都称赞道：“极是！二世兄天分高、才情远，不像我们这些读书读腐了的人。”
贾政笑道：“不可谬奖。他年小，不过以一知充十用，取笑罢了。再俟选拟。”|贾政笑道：“不要乱夸。他年纪小，不过是知道一点就当十点用，取笑罢了。再选吧。”
! “曲径通幽处”出自唐代常建的诗《题破山寺后禅院》。
! 清客们故意说俗名，好让宝玉出彩、讨贾政欢心。这是清客的生存之道。
! 贾政嘴上说“不可谬奖”，心里其实是满意的。

# 六、沁芳亭
说著，进入石洞来。|说着进了石洞。
只见佳木茏葱，奇花闪灼，一带清流，从花木深处曲折泻于石隙之下。|只见好树葱葱茏茏，奇花鲜艳闪烁，一道清澈的溪流从花木深处弯弯曲曲地流到石缝底下。
再进数步，渐向北边，平坦宽豁，两边飞楼插空，雕甍绣槛，皆隐于山坳树杪之间。|再往前走几步，渐渐转向北边，地势平坦开阔，两边高楼耸入天空，雕花的屋脊、绣饰的栏杆，都隐藏在山坳和树梢之间。
俯而视之，则清溪泻雪，石磴穿云，白石为栏，环抱池沿，石桥三港，兽面衔吐。|低头一看，清溪像雪一样奔泻，石阶像穿过云层，白石做的栏杆环绕着池边，石桥有三个桥洞，桥洞上雕着兽头，口中吐水。
桥上有亭。|桥上有个亭子。
贾政与诸人上了亭子，倚栏坐了，因问：“诸公以何题此？”|贾政和众人上了亭子，靠着栏杆坐下，问：“各位用什么来题这里？”
诸人都道：“当日欧阳公《醉翁亭记》有云：‘有亭翼然’，就名‘翼然’。”|众人都说：“当年欧阳修《醉翁亭记》里说‘有亭翼然’，就叫‘翼然’吧。”
贾政笑道：“‘翼然’虽佳，但此亭压水而成，还须偏于水题方称。|贾政笑道：“‘翼然’虽然好，可这亭子建在水上，还得偏重写水才相称。
依我拙裁，欧阳公之‘泻出于两峰之间’，竟用他这一个‘泻’字。”|依我的拙见，欧阳修有一句‘泻出于两峰之间’，就用他这个‘泻’字。”
有一客道：“是极，是极。竟是‘泻玉’二字妙。”|有个客人说：“极是，极是。就用‘泻玉’两个字最妙。”
贾政拈髯寻思，因抬头见宝玉侍侧，便笑命他也拟一个来。|贾政捋着胡子思索，抬头看见宝玉站在旁边，就笑着叫他也拟一个。
宝玉听说，连忙回道：“老爷方才所议已是。|宝玉听了，连忙回答：“老爷刚才说的已经很好了。
但是如今追究了去，似乎当日欧阳公题酿泉用一‘泻’字，则妥，今日此泉若亦用‘泻’字，则觉不妥。|不过仔细推敲起来，当年欧阳修写酿泉用一个‘泻’字是妥当的，今天这泉水也用‘泻’字，就觉得不妥了。
况此处虽云省亲驻跸别墅，亦当入于应制之例，用此等字眼，亦觉粗陋不雅。|况且这里虽说是省亲时停驾的别墅，也该算是奉旨应制的作品，用这种字眼，也显得粗陋不雅。
求再拟较此蕴籍含蓄者。”|请再拟个比这更含蓄的。”
贾政笑道：“诸公听此论若何？|贾政笑道：“各位听听这话怎么样？
方才众人编新，你又说不如述古，如今我们述古，你又说粗陋不妥。|刚才大家编新的，你说不如用旧的；现在我们用旧的，你又说粗陋不妥。
你且说你的来我听。”|你先说说你的给我听。”
宝玉道：“有用‘泻玉’二字，则莫若‘沁芳’二字，岂不新雅？”|宝玉说：“与其用‘泻玉’两个字，不如用‘沁芳’两个字，岂不是新颖雅致？”
贾政拈髯点头不语。|贾政捋着胡子点头不说话。
众人都忙迎合，赞宝玉才情不凡。|众人都忙着迎合，称赞宝玉才情不凡。
贾政道：“匾上二字容易。再作一副七言对联来。”|贾政说：“匾上两个字容易。再作一副七言对联来。”
宝玉听说，立于亭上，四顾一望，便机上心来，乃念道：|宝玉听了，站在亭上向四周一看，灵机一动，就念道：
~绕堤柳借三篙翠，隔岸花分一脉香。|环绕堤岸的柳树，借来了三篙深的碧绿水色；对岸的花，分来了一脉清香。
贾政听了，点头微笑。|贾政听了，点头微笑。
众人先称赞不已。|众人早就称赞不已。
! “沁芳”的意思是花香沁入水中，比“泻玉”含蓄得多。这个名字被元春保留了下来，沁芳亭、沁芳闸、沁芳溪贯穿整个大观园。
! “沁芳”也暗含“花落水流”：大观园的群芳，最终都要随水流去。第二十三回黛玉葬花、宝玉把落花撒在水里，就在这沁芳闸边。
! 贾政“点头不语”“点头微笑”，是他这一路上给宝玉最高的评价了。

# 七、有凤来仪
于是出亭过池，一山一石，一花一木，莫不著意观览。|于是出了亭子过了池子，一山一石、一花一木，都仔细地观赏。
忽抬头看见前面一带粉垣，里面数楹修舍，有千百竿翠竹遮映。|忽然抬头看见前面一道粉墙，里面有几间房舍，被千百竿翠竹遮掩着。
众人都道：“好个所在！”|众人都说：“好个地方！”
于是大家进入，只见入门便是曲折游廊，阶下石子漫成甬路。|于是大家走进去，只见一进门就是曲折的游廊，台阶下用石子铺成小路。
上面小小两三间房舍，一明两暗，里面都是合著地步打就的床几椅案。|上面是小小的两三间房，一间明间两间暗间，里面的床、几、椅、桌都是按照房间的尺寸量身做的。
从里间房内又得一小门，出去则是后院，有大株梨花兼著芭蕉。|从里间又有一个小门，出去是后院，有大棵的梨树和芭蕉。
又有两间小小退步。|又有两间小小的退居屋子。
后院墙下忽开一隙，得泉一派，开沟仅尺许，灌入墙内，绕阶缘屋至前院，盘旋竹下而出。|后院墙脚下开了一道缝，引进一股泉水，挖了一尺来宽的小沟，灌进墙内，绕着台阶、顺着房屋流到前院，在竹林下盘旋着流出去。
贾政笑道：“这一处还罢了。|贾政笑道：“这一处还不错。
若能月夜坐此窗下读书，不枉虚生一世。”|要是能在月夜坐在这窗下读书，这一辈子就没白活。”
说毕，看著宝玉，唬的宝玉忙垂了头。|说完看着宝玉，吓得宝玉连忙低下了头。
众客忙用话开释，又说道：“此处的匾该题四个字。”|客人们连忙用话岔开，又说：“这里的匾该题四个字。”
贾政笑问：“那四字？”|贾政笑问：“哪四个字？”
一个道是“淇水遗风”。|一个说是“淇水遗风”。
贾政道：“俗。”|贾政说：“俗。”
又一个是“睢园雅迹”。|又一个说是“睢园雅迹”。
贾政道：“也俗。”|贾政说：“也俗。”
贾珍笑道：“还是宝兄弟拟一个来。”|贾珍笑道：“还是让宝兄弟拟一个吧。”
贾政道：“他未曾作，先要议论人家的好歹，可见就是个轻薄人。”|贾政说：“他还没作，先要评论别人的好坏，可见是个轻浮的人。”
众客道：“议论的极是，其奈他何。”|客人们说：“他评论得都对，又能把他怎么样呢。”
贾政忙道：“休如此纵了他。”|贾政忙说：“别这样纵容他。”
因命他道：“今日任你狂为乱道，先设议论来，然后方许你作。|又对宝玉说：“今天随你狂说乱讲，先说说你的评论，然后才许你作。
方才众人说的，可有使得的？”|刚才大家说的，有能用的吗？”
宝玉见问，答道：“都似不妥。”|宝玉见问，回答：“好像都不妥当。”
贾政冷笑道：“怎么不妥？”|贾政冷笑道：“怎么不妥？”
宝玉道：“这是第一处行幸之处，必须颂圣方可。|宝玉说：“这是贵妃来游的第一处地方，必须颂扬圣上才行。
若用四字的匾，又有古人现成的，何必再作。”|要用四个字的匾，古人又有现成的，何必再作。”
贾政道：“难道‘淇水’‘睢园’不是古人的？”|贾政说：“难道‘淇水’‘睢园’不是古人的？”
宝玉道：“这太板腐了。莫若‘有凤来仪’四字。”|宝玉说：“这太呆板陈腐了。不如用‘有凤来仪’四个字。”
众人都哄然叫妙。|众人都哄然叫好。
贾政点头道：“畜生，畜生，可谓‘管窥蠡测’矣。”|贾政点头说：“畜生，畜生，真是‘以管窥天，以蠡测海’。”
因命：“再题一联来。”|又命令：“再题一副对联来。”
宝玉便念道：|宝玉就念道：
~宝鼎茶闲烟尚绿，幽窗棋罢指犹凉。|宝鼎里不再煮茶，烟气却还是绿的；幽静的窗下棋已下完，手指还觉得凉。
贾政摇头说道：“也未见长。”|贾政摇头说：“也不见得好。”
! 这一处就是后来林黛玉住的潇湘馆。千百竿竹、梨花、芭蕉、绕阶的泉水，处处合她的清冷。
! “淇水”用《诗经》“瞻彼淇奥，绿竹猗猗”，“睢园”指汉代梁孝王的竹园，都和竹有关，可太直白了。
! “有凤来仪”出自《尚书》，凤凰来朝是太平祥瑞，暗指贵妃驾临，又暗合竹子（凤凰只吃竹实）。
! 贾政骂“畜生”，其实是满意。“管窥蠡测”是谦词，是父亲在客人面前替儿子谦虚。

# 八、贾琏报账
说毕，引众人出来。|说完，带众人出来。
方欲走时，忽又想起一事来，因问贾珍道：|正要走，忽然又想起一件事，就问贾珍：
“这些院落房宇并几案桌椅都算有了，还有那些帐幔帘子并陈设玩器古董，可也都是一处一处合式配就的？”|“这些院落房屋和桌椅几案都算齐了，还有那些帐幔帘子和陈设的玩器古董，也都是一处一处合着样式配好的吗？”
贾珍回道：“那陈设的东西早已添了许多，自然临期合式陈设。|贾珍回答：“陈设的东西早已添了许多，到时候自然会合式地摆上。
帐幔帘子，昨日听见琏兄弟说，还不全。|帐幔帘子，昨天听琏兄弟说，还没齐。
那原是一起工程之时就画了各处的图样，量准尺寸，就打发人办去的。|那是一开工的时候就画了各处的图样，量好尺寸，就派人去办的。
想必昨日得了一半。”|想必昨天已经得了一半。”
贾政听了，便知此事不是贾珍的首尾，便命人去唤贾琏。|贾政听了，就知道这件事不归贾珍管，就叫人去叫贾琏。
一时，贾琏赶来，贾政问他共有几种，现今得了几种，尚欠几种。|一会儿贾琏赶来了，贾政问他一共有几种，现在得了几种，还差几种。
贾琏见问，忙向靴桶取靴掖内装的一个纸折略节来，看了一看，回道：|贾琏见问，连忙从靴筒里取出装在靴掖里的一个纸折子清单，看了看，回答说：
“妆蟒绣堆，刻丝弹墨并各色绸绫大小幔子一百二十架，昨日得了八十架，下欠四十架。|“妆蟒绣堆、刻丝弹墨和各色绸缎大小幔子一百二十架，昨天得了八十架，还差四十架。
帘子二百挂，昨日俱得了。|帘子二百挂，昨天都得了。
外有猩猩毡帘二百挂，金丝藤红漆竹帘二百挂，黑漆竹帘二百挂，五彩线络盘花帘二百挂，每样得了一半，也不过秋天都全了。|另外还有猩猩毡帘二百挂、金丝藤红漆竹帘二百挂、黑漆竹帘二百挂、五彩线络盘花帘二百挂，每样得了一半，到秋天也就全了。
椅搭，桌围，床裙，桌套，每分一千二百件，也有了。”|椅套、桌围、床裙、桌套，每样一千二百件，也都有了。”
! 一串数字，就是大观园花钱的流水账：光帘子就有一千挂，桌套椅套每样一千二百件。
! 贾琏把清单藏在靴子里，随身带着，可见他管的是实事、经手的是实钱。

# 九、稻香村
一面走，一面说，倏尔青山斜阻。|一边走一边说，忽然一座青山斜挡在前面。
转过山怀中，隐隐露出一带黄泥筑就矮墙，墙头皆用稻茎掩护。|转进山怀里，隐隐露出一道黄泥筑的矮墙，墙头上都用稻草盖着。
有几百株杏花，如喷火蒸霞一般。|有几百棵杏花，开得像喷火、像蒸腾的彩霞一样。
里面数楹茅屋。|里面有几间茅屋。
外面却是桑，榆，槿，柘，各色树稚新条，随其曲折，编就两溜青篱。|外面是桑树、榆树、木槿、柘树，各种树的嫩枝新条，顺着地势弯弯曲曲地编成两道青篱笆。
篱外山坡之下，有一土井，旁有桔槔辘轳之属。|篱笆外的山坡下，有一口土井，旁边有桔槔、辘轳这些汲水的工具。
下面分畦列亩，佳蔬菜花，漫然无际。|下面分成一畦一畦的田地，种着好蔬菜和菜花，一眼望不到边。
