<script type="text/plain" id="ch28">
# 一、宝玉恸倒山坡
话说林黛玉只因昨夜晴雯不开门一事，错疑在宝玉身上。|林黛玉只因为昨夜晴雯不开门的事，错怪到了宝玉身上。
至次日又可巧遇见饯花之期，正是一腔无明正未发泄，又勾起伤春愁思，|第二天又正好赶上饯花的日子，一肚子无名火正没处发，又勾起伤春的愁思，
因把些残花落瓣去掩埋，由不得感花伤己，哭了几声，便随口念了几句。|就把些残花落瓣拿去掩埋，由不得看花伤己，哭了几声，随口念了几句。
不想宝玉在山坡上听见，先不过点头感叹，|没想到宝玉在山坡上听见了，起初不过点头感叹，
次后听到“侬今葬花人笑痴，他年葬侬知是谁”，“一朝春尽红颜老，花落人亡两不知”等句，|后来听到“侬今葬花人笑痴，他年葬侬知是谁”“一朝春尽红颜老，花落人亡两不知”这些句子，
不觉恸倒山坡之上，怀里兜的落花撒了一地。|不由得悲痛得倒在山坡上，怀里兜的落花撒了一地。
试想林黛玉的花颜月貌，将来亦到无可寻觅之时，宁不心碎肠断！|想想林黛玉如花似月的容貌，将来也会到无处寻找的那一天，怎能不心碎肠断！
既黛玉终归无可寻觅之时，推之于他人，如宝钗，香菱，袭人等，亦可到无可寻觅之时矣。|既然黛玉终有一天找不到了，推想到别人，像宝钗、香菱、袭人等，也会有找不到的一天。
宝钗等终归无可寻觅之时，则自己又安在哉？|宝钗她们终有找不到的时候，那么自己又在哪里呢？
且自身尚不知何在何往，则斯处，斯园，斯花，斯柳，又不知当属谁姓矣！|自己尚且不知在哪里、往哪里去，那么这地方、这园子、这花、这柳，又不知该归谁家了！
——因此一而二，二而三，反复推求了去，真不知此时此际欲为何等蠢物，杳无所知，|就这样一想再想，反复推究下去，真不知道此时此刻该变成什么样的无知之物，什么都不知道，
逃大造，出尘网，使可解释这段悲伤。|才能逃出天地造化、跳出尘世罗网，解开这一段悲伤。
正是：花影不离身左右，鸟声只在耳东西。|正是：花影总在身边左右，鸟声只在耳边东西。
! 宝玉从黛玉想到宝钗、香菱、袭人，再想到自己，再想到这园子将来“当属谁姓”。这一层层推想，是全书大结局的预演：人散了，园子也归了别人。
! 黛玉的诗叫宝玉“恸倒”，两人在悲伤上是相通的。这就是第二十九回说的“两个人原本是一个心”。

# 二、“既有今日，何必当初”
那林黛玉正自伤感，忽听山坡上也有悲声，心下想道：|林黛玉正在伤心，忽然听见山坡上也有哭声，心里想：
“人人都笑我有些痴病，难道还有一个痴子不成？”|“人人都笑我有点痴病，难道还有一个痴子不成？”
想著，抬头一看，见是宝玉。|想着，抬头一看，原来是宝玉。
林黛玉看见，便道：“啐！我道是谁，原来是这个狠心短命的……”|林黛玉一见，就说：“呸！我当是谁，原来是这个狠心短命的……”
刚说到“短命”二字，又把口掩住，长叹了一声，自己抽身便走了。|刚说到“短命”两个字，又把嘴捂住了，长叹一声，自己转身就走了。
这里宝玉悲恸了一回，忽然抬头不见了黛玉，便知黛玉看见他躲开了，|宝玉伤心了一会儿，忽然抬头不见了黛玉，知道是黛玉看见他躲开了，
自己也觉无味，抖抖土起来，下山寻归旧路，往怡红院来。|自己也觉得没意思，抖抖身上的土站起来，下山顺着原路往怡红院走。
可巧看见林黛玉在前头走，连忙赶上去，说道：“你且站住。|正好看见林黛玉在前面走，连忙赶上去说：“你先站住。
我知你不理我，我只说一句话，从今后撂开手。”|我知道你不理我，我只说一句话，从今以后就丢开手。”
林黛玉回头看见是宝玉，待要不理他，听他说”只说一句话，从此撂开手”，|林黛玉回头见是宝玉，本想不理他，听他说“只说一句话，从此丢开手”，
这话里有文章，少不得站住说道：“有一句话，请说来。”|这话里有文章，只好站住说：“有一句话，请说吧。”
宝玉笑道：“两句话，说了你听不听？”|宝玉笑道：“两句话，说了你听不听？”
黛玉听说，回头就走。|黛玉听了，回头就走。
宝玉在身后面叹道：“既有今日，何必当初！”|宝玉在后面叹道：“既有今天，何必当初！”
林黛玉听见这话，由不得站住，回头道：“当初怎么样？今日怎么样？”|林黛玉听见这话，不由得站住了，回头说：“当初怎么样？今天又怎么样？”
! 黛玉骂“短命的”，刚出口就捂嘴。她心里恼他，却连一句咒他的话都舍不得说完。

# 三、宝玉诉委屈
宝玉叹道：“当初姑娘来了，那不是我陪著顽笑？|宝玉叹道：“当初姑娘来的时候，哪一次不是我陪着玩笑？
凭我心爱的，姑娘要，就拿去，我爱吃的，听见姑娘也爱吃，连忙干干净净收著等姑娘吃。|只要是我心爱的东西，姑娘要，就拿去；我爱吃的，听说姑娘也爱吃，就赶紧干干净净收着，等姑娘来吃。
一桌子吃饭，一床上睡觉。|一张桌子吃饭，一张床上睡觉。
丫头们想不到的，我怕姑娘生气，我替丫头们想到了。|丫头们想不到的，我怕姑娘生气，就替丫头们想到了。
我心里想著：姊妹们从小儿长大，亲也罢，热也罢，和气到了儿，才见得比人好。|我心里想：姐妹们从小一起长大，亲也好，热也好，一直和和气气到最后，才见得比别人好。
如今谁承望姑娘人大心大，不把我放在眼睛里，|如今谁想到姑娘人大了心也大了，不把我放在眼里，
倒把外四路的什么宝姐姐凤姐姐的放在心坎儿上，倒把我三日不理四日不见的。|倒把外人什么宝姐姐、凤姐姐的放在心上，倒把我三天不理、四天不见的。
我又没个亲兄弟亲姊妹。|我又没有亲兄弟亲姐妹。
——虽然有两个，你难道不知道是和我隔母的？|虽然有两个，你难道不知道是跟我不同母亲的？
我也和你似的独出，只怕同我的心一样。|我也和你一样是独一个，只当你的心和我的心一样。
谁知我是白操了这个心，弄的有冤无处诉！”|谁知我白操了这份心，弄得有冤无处诉！”
说著不觉滴下眼泪来。|说着不由得掉下泪来。
! 宝玉说“外四路的什么宝姐姐凤姐姐”，把宝钗凤姐都算作外人，只有黛玉和他是自己人。这句话正说到黛玉心里去了。
! “隔母的”指探春和贾环，都是赵姨娘所生。宝玉说自己也是“独出”，和黛玉一样孤单，把两人放在同一处境里。

# 四、误会冰释
黛玉耳内听了这话，眼内见了这形景，心内不觉灰了大半，也不觉滴下泪来，低头不语。|黛玉耳朵里听了这些话，眼睛里看见这情形，心里的气不由得消了大半，也不由得掉下泪来，低头不说话。
宝玉见他这般形景，遂又说道：“我也知道我如今不好了，但只凭著怎么不好，万不敢在妹妹跟前有错处。|宝玉见她这样，就又说：“我也知道我如今不好了，可是不管怎么不好，也万万不敢在妹妹面前有错。
便有一二分错处，你倒是或教导我，戒我下次，或骂我两句，打我两下，我都不灰心。|就算有一两分错，你或者教导我，叫我下次改，或者骂我两句、打我两下，我都不灰心。
谁知你总不理我，叫我摸不著头脑，少魂失魄，不知怎么样才好。|谁知你总是不理我，叫我摸不着头脑，丢魂失魄的，不知道怎么才好。
就便死了，也是个屈死鬼，任凭高僧高道忏悔也不能超生，|就算死了，也是个冤死鬼，任凭高僧高道怎么超度也不能投生，
还得你申明了缘故，我才得托生呢！”|还得你说明了缘故，我才能投胎呢！”
黛玉听了这个话，不觉将昨晚的事都忘在九霄云外了，|黛玉听了这番话，不知不觉把昨晚的事忘到九霄云外去了，
便说道：“你既这么说，昨儿为什么我去了，你不叫丫头开门？”|就说：“你既然这么说，昨天我去了，你为什么不叫丫头开门？”
宝玉诧异道：“这话从那里说起？我要是这么样，立刻就死了！”|宝玉惊讶地说：“这话从哪里说起？我要是这样，立刻就死！”
林黛玉啐道：“大清早起死呀活的，也不忌讳。|林黛玉啐道：“大清早的死呀活的，也不忌讳。
你说有呢就有，没有就没有，起什么誓呢。”|你说有就有，没有就没有，发什么誓呢。”
宝玉道：“实在没有见你去。就是宝姐姐坐了一坐，就出来了。”|宝玉说：“我真没看见你去。只有宝姐姐坐了一会儿，就出来了。”
林黛玉想了一想，笑道：“是了。想必是你的丫头们懒待动，丧声歪气的也是有的。”|林黛玉想了想，笑道：“是了。想必是你的丫头们懒得动，没好声气，也是有的。”
宝玉道：“想必是这个原故。等我回去问了是谁，教训教训他们就好了。”|宝玉说：“想必是这个原因。等我回去问问是谁，教训教训她们就好了。”
黛玉道：“你的那些姑娘们也该教训教训，只是我论理不该说。|黛玉说：“你那些姑娘们也该教训教训了，只是照理我不该说。
今儿得罪了我的事小，倘或明儿宝姑娘来，什么贝姑娘来，也得罪了，事情岂不大了。”|今天得罪了我是小事，要是明天宝姑娘来、什么‘贝’姑娘来，也得罪了，那事情岂不闹大了。”
说著抿著嘴笑。|说着抿着嘴笑。
宝玉听了，又是咬牙，又是笑。|宝玉听了，又是咬牙，又是笑。
! 气一消，黛玉的刺又出来了：“宝姑娘”“贝姑娘”，“宝”和“贝”连起来是“宝贝”，暗讽宝玉把宝钗当宝贝。

# 五、宝玉胡诌药方
二人正说话，只见丫头来请吃饭，遂都往前头来了。|两人正说着话，丫头来请吃饭，就都往前面来了。
王夫人见了林黛玉，因问道：“大姑娘，你吃那鲍太医的药可好些？”|王夫人见了林黛玉，就问：“大姑娘，你吃那鲍太医的药好些了吗？”
林黛玉道：“也不过这么著。老太太还叫我吃王大夫的药呢。”|林黛玉说：“也就那样。老太太还叫我吃王大夫的药呢。”
宝玉道：“太太不知道，林妹妹是内症，先天生的弱，所以禁不住一点风寒，|宝玉说：“太太不知道，林妹妹是内里的病，天生身子弱，所以受不了一点风寒，
不过吃两剂煎药就好了，散了风寒，还是吃丸药的好。”|不过吃两剂汤药就好了；风寒散了，还是吃丸药好。”
王夫人道：“前儿大夫说了个丸药的名字，我也忘了。”|王夫人说：“前些天大夫说了个丸药的名字，我也忘了。”
宝玉道：“我知道那些丸药，不过叫他吃什么人参养荣丸。”|宝玉说：“我知道那些丸药，不过是叫她吃什么人参养荣丸。”
王夫人道：“不是。”|王夫人说：“不是。”
宝玉又道：“八珍益母丸？左归？右归？再不，就是麦味地黄丸。”|宝玉又说：“八珍益母丸？左归丸？右归丸？再不然，就是麦味地黄丸。”
王夫人道：“都不是。我只记得有个‘金刚’两个字的。”|王夫人说：“都不是。我只记得有‘金刚’两个字。”
宝玉扎手笑道：“从来没听见有个什么‘金刚丸’。若有了‘金刚丸’，自然有‘菩萨散’了！”|宝玉拍手笑道：“从来没听说有什么‘金刚丸’。要是有了‘金刚丸’，自然也有‘菩萨散’了！”
说的满屋里人都笑了。|说得满屋子人都笑了。
宝钗抿嘴笑道：“想是天王补心丹。”|宝钗抿嘴笑道：“想必是天王补心丹。”
王夫人笑道：“是这个名儿。如今我也糊涂了。”|王夫人笑道：“就是这个名字。如今我也糊涂了。”
宝玉道：“太太倒不糊涂，都是叫‘金刚’‘菩萨’支使糊涂了。”|宝玉说：“太太倒不糊涂，都是被‘金刚’‘菩萨’支使糊涂了。”
王夫人道：“扯你娘的臊！又欠你老子捶你了。”|王夫人说：“胡说八道！又欠你老子揍你了。”
宝玉笑道：“我老子再不为这个捶我的。”|宝玉笑道：“我老子才不会为这个揍我呢。”
! 八珍益母丸是妇科药，宝玉随口乱报，可见他懂的药名也只是一知半解。
! 王夫人记不住药名，宝钗一下就说出来了。宝钗处处周到，什么都知道，连黛玉吃什么药都记得。

# 六、三百六十两银子的药方
王夫人又道：“既有这个名儿，明儿就叫人买些来吃。”|王夫人又说：“既然有这个名字，明天就叫人买些来吃。”
宝玉笑道：“这些都不中用的。太太给我三百六十两银子，我替妹妹配一料丸药，包管一料不完就好了。”|宝玉笑道：“这些都不管用。太太给我三百六十两银子，我替妹妹配一料丸药，保管一料没吃完病就好了。”
王夫人道：“放屁！什么药就这么贵？”|王夫人说：“胡说！什么药这么贵？”
宝玉笑道：“当真的呢，我这个方子比别的不同。|宝玉笑道：“是真的，我这个方子和别的不一样。
那个药名儿也古怪，一时也说不清。|那个药名也古怪，一时说不清。
只讲那头胎紫河车，人形带叶参，三百六十两不足。|单说那头胎的紫河车、长成人形还带叶子的人参，三百六十两还不够。
龟大何首乌，千年松根茯苓胆，诸如此类的药都不算为奇，只在群药里算。|像乌龟那么大的何首乌、千年松树根下的茯苓心，这类药都不算稀奇，只算是一般的配药。
那为君的药，说起来唬人一跳。|那做主药的，说出来吓人一跳。
前儿薛大哥哥求了我一二年，我才给了他这方子。|前些天薛大哥求了我一两年，我才把这个方子给了他。
他拿了方子去又寻了二三年，花了有上千的银子，才配成了。|他拿着方子又找了两三年，花了上千两银子，才配成了。
太太不信，只问宝姐姐。”|太太不信，问宝姐姐就知道了。”
宝钗听说，笑著摇手儿说：“我不知道，也没听见。你别叫姨娘问我。”|宝钗听了，笑着摆手说：“我不知道，也没听说过。你别让姨妈问我。”
王夫人笑道：“到底是宝丫头，好孩子，不撒谎。”|王夫人笑道：“到底是宝丫头，好孩子，不撒谎。”
宝玉站在当地，听见如此说，一回身把手一拍，说道：“我说的倒是真话呢，倒说我撒谎。”|宝玉站在屋子中间，听她这么说，一转身把手一拍，说：“我说的可是真话，倒说我撒谎。”
口里说著，忽一回身，只见林黛玉坐在宝钗身后抿著嘴笑，用手指头在脸上画著羞他。|嘴里说着，忽然一回身，只见林黛玉坐在宝钗身后抿着嘴笑，用手指在脸上划着羞他。
! 紫河车是胎盘，入药用。宝玉的方子听着离奇，后面凤姐出来作证，原来是真的。
! 宝钗明知其事，却说“不知道”。她不肯替宝玉圆谎，也不肯拆穿，置身事外，王夫人还夸她“不撒谎”。

# 七、凤姐作证
凤姐因在里间屋里看著人放桌子，听如此说，便走来笑道：|凤姐正在里屋看着人摆桌子，听见这话，就走过来笑道：
“宝兄弟不是撒谎，这倒是有的。上日薛大哥亲自和我来寻珍珠，我问他作什么，他说配药。|“宝兄弟没撒谎，这事倒是有的。前些天薛大哥亲自来找我要珍珠，我问他做什么，他说配药。
他还抱怨说，不配也罢了，如今那里知道这么费事。|他还抱怨说，早知道不配也罢了，谁知道这么费事。
我问他什么药，他说是宝兄弟的方子，说了多少药，我也没工夫听。|我问他什么药，他说是宝兄弟的方子，说了一大堆药名，我也没工夫听。
他说不然我也买几颗珍珠了，只是定要头上带过的，所以来和我寻。|他说要不然他也就去买几颗珍珠了，只是一定要头上戴过的，所以才来找我要。
他说：‘妹妹就没散的，花儿上也得，掐下来，过后儿我拣好的再给妹妹穿了来。’|他说：‘妹妹要是没有散的，珠花上的也行，掐下来，过后我挑好的再给妹妹穿上。’
我没法儿，把两枝珠花儿现拆了给他。|我没办法，把两枝珠花当场拆了给他。
还要了一块三尺上用大红纱去，乳钵乳了隔面子呢。”|还要了一块三尺长的宫里用的大红纱，说是乳钵研碎了用来筛药粉的。”
凤姐说一句，那宝玉念一句佛，说：“太阳在屋子里呢！”|凤姐说一句，宝玉就念一句佛，说：“太阳就在屋子里照着呢！”
凤姐说完了，宝玉又道：“太太想，这不过是将就呢。|凤姐说完了，宝玉又说：“太太想想，这还是将就着用呢。
正经按那方子，这珍珠宝石定要在古坟里的，有那古时富贵人家装裹的头面，拿了来才好。|正经按那方子，这珍珠宝石一定要古坟里的，要那古时候富贵人家入殓时戴的首饰，拿来才好。
如今那里为这个去刨坟掘墓，所以只是活人带过的，也可以使得。”|如今哪能为这个去刨坟掘墓，所以只要是活人戴过的，也可以用。”
王夫人道：“阿弥陀佛，不当家花花的！|王夫人说：“阿弥陀佛，罪过罪过！
就是坟里有这个，人家死了几百年，这会子翻尸盗骨的，作了药也不灵！”|就算坟里有这个，人家死了几百年，这会儿翻尸盗骨的，做了药也不灵！”
! “太阳在屋子里”是发誓的话，意思是青天白日在上，我说的是实话。
! 宝钗不作证，凤姐来作证。宝钗明哲保身，凤姐爱凑趣讨好，两人的性格在这一处对比得很清楚。

# 八、黛玉不等宝玉
宝玉向林黛玉说道：“你听见了没有，难道二姐姐也跟著我撒谎不成？”|宝玉对林黛玉说：“你听见没有，难道二姐姐也跟着我撒谎不成？”
脸望著黛玉说话，却拿眼睛瞟著宝钗。|脸对着黛玉说话，眼睛却瞟着宝钗。
黛玉便拉王夫人道：“舅母听听，宝姐姐不替他圆谎，他支吾著我。”|黛玉就拉着王夫人说：“舅母听听，宝姐姐不替他圆谎，他倒冲着我来。”
王夫人也道：“宝玉很会欺负你妹妹。”|王夫人也说：“宝玉就会欺负你妹妹。”
宝玉笑道：“太太不知道这原故。宝姐姐先在家里住著，那薛大哥哥的事，他也不知道，|宝玉笑道：“太太不知道这里头的缘故。宝姐姐从前在家里住着，薛大哥的事她都不知道，
何况如今在里头住著呢，自然是越发不知道了。林妹妹才在背后羞我，打谅我撒谎呢。”|何况现在住在园子里，自然越发不知道了。林妹妹刚才在背后羞我，以为我撒谎呢。”
正说著，只见贾母房里的丫头找宝玉林黛玉去吃饭。|正说着，贾母房里的丫头来找宝玉、林黛玉去吃饭。
林黛玉也不叫宝玉，便起身拉了那丫头就走。|林黛玉也不叫宝玉，起身拉着那丫头就走。
那丫头说等著宝玉一块儿走。|那丫头说等宝玉一起走。
林黛玉道：“他不吃饭了，咱们走。我先走了。”说著便出去了。|林黛玉说：“他不吃饭了，咱们走。我先走了。”说着就出去了。
宝玉道：“我今儿还跟著太太吃罢。”|宝玉说：“我今天还是跟着太太吃吧。”
王夫人道：“罢，罢，我今儿吃斋，你正经吃你的去罢。”|王夫人说：“算了算了，我今天吃斋，你正经吃你的去。”
宝玉道：“我也跟著吃斋。”说著便叫那丫头”去罢”，自己先跑到桌子上坐了。|宝玉说：“我也跟着吃斋。”说着就叫那丫头“去吧”，自己先跑到桌边坐下了。
王夫人向宝钗等笑道：“你们只管吃你们的，由他去罢。”|王夫人对宝钗等人笑道：“你们只管吃你们的，随他去吧。”
宝钗因笑道：“你正经去罢。吃不吃，陪著林姑娘走一趟，他心里打紧的不自在呢。”|宝钗就笑道：“你还是去吧。吃不吃都行，陪林姑娘走一趟，她心里正不自在呢。”
宝玉道：“理他呢，过一会子就好了。”|宝玉说：“理她呢，过一会儿就好了。”
! 宝玉嘴上对着黛玉，眼睛却瞟着宝钗，因为不肯作证的是宝钗。黛玉看见了，又不痛快。
! 宝玉说“理他呢，过一会子就好了”，下面黛玉原封不动地把这句话还给他。

# 九、凤姐要红玉
一时吃过饭，宝玉一则怕贾母记挂，二则也记挂著林黛玉，忙忙的要茶漱口。|一会儿吃完饭，宝玉一来怕贾母惦记，二来也惦记林黛玉，急忙要茶漱口。
探春惜春都笑道：“二哥哥，你成日家忙些什么？吃饭吃茶也是这么忙碌碌的。”|探春、惜春都笑道：“二哥哥，你整天忙些什么？吃饭喝茶也这么急急忙忙的。”
宝钗笑道：“你叫他快吃了瞧林妹妹去罢，叫他在这里胡羼些什么。”|宝钗笑道：“你们让他快吃完了去看林妹妹吧，让他在这里瞎搅和什么。”
宝玉吃了茶，便出来，一直往西院来。|宝玉喝了茶，就出来，一直往西院去。
可巧走到凤姐儿院门前，只见凤姐蹬著门槛子拿耳挖子剔牙，看著十来个小厮们挪花盆呢。|正好走到凤姐院门前，只见凤姐踩着门槛拿耳挖子剔牙，看着十来个小厮搬花盆。
见宝玉来了，笑道：“你来的好。进来，进来，替我写几个字儿。”|见宝玉来了，笑道：“你来得正好。进来进来，替我写几个字。”
宝玉只得跟了进来。|宝玉只好跟了进去。
到了屋里，凤姐命人取过笔砚纸来，向宝玉道：|到了屋里，凤姐叫人拿来笔墨纸砚，对宝玉说：
“大红妆缎四十匹，蟒缎四十匹，上用纱各色一百匹，金项圈四个。”|“大红妆缎四十匹，蟒缎四十匹，宫里用的各色纱一百匹，金项圈四个。”
宝玉道：“这算什么？又不是帐，又不是礼物，怎么个写法？”|宝玉说：“这算什么？又不是账，又不是礼单，怎么写？”
凤姐儿道：“你只管写上，横竖我自己明白就罢了。”|凤姐说：“你只管写上，反正我自己明白就行了。”
宝玉听说只得写了。|宝玉听了只好写了。
凤姐一面收起，一面笑道：“还有句话告诉你，不知你依不依？|凤姐一边收起来，一边笑道：“还有句话告诉你，不知你答不答应？
你屋里有个丫头叫红玉，我要叫了来使唤，明儿我再替你挑几个，可使得？”|你屋里有个丫头叫红玉，我想叫她来使唤，以后我再替你挑几个，行吗？”
宝玉道：“我屋里的人也多的很，姐姐喜欢谁，只管叫了来，何必问我。”|宝玉说：“我屋里的人多得很，姐姐喜欢谁，只管叫去，何必问我。”
凤姐笑道：“既这么著，我就叫人带他去了。”|凤姐笑道：“既然这样，我就叫人带她去了。”
宝玉道：“只管带去。”说著便要走。|宝玉说：“只管带去。”说着就要走。
凤姐儿道：“你回来，我还有一句话呢。”|凤姐说：“你回来，我还有一句话呢。”
宝玉道：“老太太叫我呢，有话等我回来罢。”|宝玉说：“老太太叫我呢，有话等我回来再说吧。”
说著便来至贾母这边，只见都已吃完饭了。|说着就来到贾母这边，只见大家都已经吃完饭了。
贾母因问他：“跟著你娘吃了什么好的？”|贾母问他：“跟着你娘吃了什么好东西？”
宝玉笑道：“也没什么好的，我倒多吃了一碗饭。”|宝玉笑道：“也没什么好的，我倒多吃了一碗饭。”
因问：“林妹妹在那里？”|又问：“林妹妹在哪里？”
贾母道：“里头屋里呢。”|贾母说：“在里屋呢。”
! 凤姐要红玉，宝玉连名字都没问清就答应了。宝玉根本不记得屋里有个红玉，这正应了红玉在怡红院“熬不出头”。
! 凤姐叫宝玉写的那几行东西，有人认为与后文有关，原文没有交代。凤姐不识字，记账要靠别人代写。

# 十、黛玉裁衣
宝玉进来，只见地下一个丫头吹熨斗，炕上两个丫头打粉线，黛玉弯著腰拿著剪子裁什么呢。|宝玉进去，只见地上一个丫头吹熨斗，炕上两个丫头打粉线，黛玉弯着腰拿剪子在裁什么东西。
宝玉走进来笑道：“哦，这是作什么呢？才吃了饭，这么空著头，一会子又头疼了。”|宝玉走进来笑道：“哦，这是做什么呢？刚吃了饭，就这么低着头，一会儿又要头疼了。”
黛玉并不理，只管裁他的。|黛玉也不理他，只管裁她的。
有一个丫头说道：“那块绸子角儿还不好呢，再熨他一熨。”|有个丫头说：“那块绸子的角还不平呢，再熨一熨。”
黛玉便把剪子一撂，说道：“理他呢，过一会子就好了。”|黛玉就把剪子一放，说：“理它呢，过一会儿就好了。”
宝玉听了，只是纳闷。|宝玉听了，只是纳闷。
只见宝钗探春等也来了，和贾母说了一回话。|只见宝钗、探春等人也来了，和贾母说了一会儿话。
宝钗也进来问：“林妹妹作什么呢？”|宝钗也进来问：“林妹妹在做什么呢？”
因见林黛玉裁剪，因笑道：“妹妹越发能干了，连裁剪都会了。”|见林黛玉在裁剪，就笑道：“妹妹越来越能干了，连裁剪都会了。”
黛玉笑道：“这也不过是撒谎哄人罢了。”|黛玉笑道：“这也不过是撒谎哄人罢了。”
宝钗笑道：“我告诉你个笑话儿，才刚为那个药，我说了个不知道，宝兄弟心里不受用了。”|宝钗笑道：“我告诉你个笑话，刚才为那个药，我说了句不知道，宝兄弟心里不痛快了。”
林黛玉道：“理他呢，过会子就好了。”|林黛玉说：“理他呢，过一会儿就好了。”
宝玉向宝钗道：“老太太要抹骨牌，正没人呢，你抹骨牌去罢。”|宝玉对宝钗说：“老太太要打骨牌，正缺人呢，你打骨牌去吧。”
宝钗听说，便笑道：“我是为抹骨牌才来了？”说著便走了。|宝钗听了，就笑道：“我是为了打骨牌才来的？”说着就走了。
林黛玉道：“你倒是去罢，这里有老虎，看吃了你！”说著又裁。|林黛玉说：“你倒是去吧，这里有老虎，小心吃了你！”说着又裁。
宝玉见他不理，只得还陪笑说道：“你也出去逛逛再裁不迟。”|宝玉见她不理，只好还赔着笑说：“你也出去逛逛再裁也不迟。”
林黛玉总不理。|林黛玉还是不理。
宝玉便问丫头们：“这是谁叫裁的？”|宝玉就问丫头们：“这是谁叫裁的？”
林黛玉见问丫头们，便说道：“凭他谁叫我裁，也不管二爷的事！”|林黛玉见他问丫头，就说：“不管谁叫我裁，也不关二爷的事！”
宝玉方欲说话，只见有人进来回说“外头有人请”。|宝玉正要说话，有人进来回说“外面有人请”。
宝玉听了，忙撤身出来。|宝玉听了，赶紧转身出来。
黛玉向外头说道：“阿弥陀佛！赶你回来，我死了也罢了。”|黛玉朝外说：“阿弥陀佛！等你回来，我死了也罢了。”
! 黛玉把宝玉那句“理他呢，过一会子就好了”连说两遍，一遍借着绸子说，一遍借着宝钗的话说。宝玉说她的话，她全听见了。
! 宝玉想支走宝钗，宝钗当然听得出来，一句“我是为抹骨牌才来了”，不软不硬。
! 黛玉说“这也不过是撒谎哄人”，又是在说宝玉刚才“撒谎”的事。

# 十一、冯紫英家的酒宴
宝玉出来，到外面，只见焙茗说道：“冯大爷家请。”|宝玉出来到外面，只见焙茗说：“冯大爷家来请。”
宝玉听了，知道是昨日的话，便说：“要衣裳去。”自己便往书房里来。|宝玉听了，知道是昨天说的那件事，就说：“去拿衣裳。”自己往书房去。
焙茗一直到了二门前等人，只见一个老婆子出来了，|焙茗一直到二门前等人，只见一个老婆子出来，
焙茗上去说道：“宝二爷在书房里等出门的衣裳，你老人家进去带个信儿。”|焙茗上去说：“宝二爷在书房里等出门的衣裳，您老人家进去带个信。”
那婆子说：“放你娘的屁！倒好，宝二爷如今在园里住著，跟他的人都在园里，你又跑了这里来带信儿来了！”|那婆子说：“放你娘的屁！倒好，宝二爷如今住在园子里，跟他的人都在园子里，你倒跑到这里来带信了！”
焙茗听了，笑道：“骂的是，我也糊涂了。”|焙茗听了，笑道：“骂得对，我也糊涂了。”
说著一径往东边二门前来。|说着一直往东边二门前去。
可巧门上小厮在甬路底下踢球，焙茗将原故说了。|正好门上的小厮在甬路下踢球，焙茗把事情说了。
小厮跑了进去，半日抱了一个包袱出来，递与焙茗。|小厮跑了进去，过了半天抱出一个包袱，递给焙茗。
回到书房里，宝玉换了，命人备马，只带著焙茗，锄药，双瑞，双寿四个小厮去了。|回到书房，宝玉换了衣服，叫人备马，只带着焙茗、锄药、双瑞、双寿四个小厮去了。
一径到了冯紫英家门口，有人报与了冯紫英，出来迎接进去。|直接到了冯紫英家门口，有人报给冯紫英，他出来把宝玉接了进去。
只见薛蟠早已在那里久候，还有许多唱曲儿的小厮并唱小旦的蒋玉菡，锦香院的妓女云儿。|只见薛蟠早已在那里等候多时，还有许多唱曲的小厮、唱小旦的蒋玉菡，以及锦香院的妓女云儿。
大家都见过了，然后吃茶。|大家都见过了，然后喝茶。
宝玉擎茶笑道：“前儿所言幸与不幸之事，我昼悬夜想，今日一闻呼唤即至。”|宝玉端着茶笑道：“前天说的‘幸与不幸’那件事，我日夜惦记，今天一听叫就来了。”
冯紫英笑道：“你们令表兄弟倒都心实。前日不过是我的设辞，诚心请你们一饮，恐又推托，故说下这句话。|冯紫英笑道：“你们表兄弟俩倒都实心眼。前天那不过是我的托辞，诚心想请你们喝一回，怕你们又推辞，才说了那句话。
今日一邀即至，谁知都信真了。”|今天一请就来了，谁知你们都当真了。”
说毕大家一笑，然后摆上酒来，依次坐定。|说完大家一笑，然后摆上酒来，按次序坐好。
冯紫英先命唱曲儿的小厮过来让酒，然后命云儿也来敬。|冯紫英先叫唱曲的小厮过来劝酒，然后叫云儿也来敬酒。
! 冯紫英说“不幸之幸”只是“设辞”，上一回的悬念就这样轻轻放下了。可他上回确实急着回去见父亲，这个“设辞”反倒更显得有事瞒着。
! 蒋玉菡是唱小旦的名角，出场就在这里，他和宝玉、袭人都有很深的缘分。

# 十二、云儿唱曲
那薛蟠三杯下肚，不觉忘了情，拉著云儿的手笑道：“你把那梯己新样儿的曲子唱个我听，我吃一坛如何？”|薛蟠三杯酒下肚，不觉忘乎所以，拉着云儿的手笑道：“你把那私下里新学的曲子唱一个给我听，我喝一坛怎么样？”
云儿听说，只得拿起琵琶来，唱道：|云儿听了，只好拿起琵琶唱道：
~两个冤家，都难丢下，想著你来又记挂著他。|两个冤家，都难以丢下，想着你又惦记着他。
~两个人形容俊俏，都难描画。|两个人模样都俊俏，都难以描画。
~想昨宵幽期私订在荼縻架，一个偷情，一个寻拿，拿住了三曹对案，我也无回话。|想起昨夜在荼蘼架下偷偷约会，一个来偷情，一个来捉拿，被抓住了三方对质，我也无话可说。
唱毕笑道：“你喝一坛子罢了。”|唱完笑道：“你喝一坛吧。”
薛蟠听说，笑道：“不值一坛，再唱好的来。”|薛蟠听了，笑道：“不值一坛，再唱个好的。”
! 云儿唱的是一个女子同时被两个男人爱着、左右为难。在这个场合唱，带着挑逗的意味。

# 十三、宝玉行酒令
宝玉笑道：“听我说来：如此滥饮，易醉而无味。|宝玉笑道：“听我说：这样乱喝，容易醉又没意思。
我先喝一大海，发一新令，有不遵者，连罚十大海，逐出席外与人斟酒。”|我先喝一大碗，出一个新酒令，有不遵守的，连罚十大碗，赶出席外给别人倒酒。”
冯紫英蒋玉菡等都道：“有理，有理。”|冯紫英、蒋玉菡等人都说：“有理，有理。”
宝玉拿起海来一气饮干，说道：|宝玉端起大碗一口喝干，说：
“如今要说悲、愁、喜、乐四字，却要说出女儿来，还要注明这四字原故。|“如今要说‘悲、愁、喜、乐’四个字，还要说出是女儿的，并注明这四个字的缘故。
说完了，饮门杯。|说完了，喝一杯门杯酒。
酒面要唱一个新鲜时样曲子，酒底要席上生风一样东西，或古诗，旧对，《四书》《五经》成语。”|喝酒前要唱一支新鲜时兴的曲子，喝完后要就着席上的一样东西，说一句古诗、旧对联或《四书》《五经》里的成语。”
薛蟠未等说完，先站起来拦道：“我不来，别算我。这竟是捉弄我呢！”|薛蟠没等他说完，先站起来拦着说：“我不来，别算我。这分明是捉弄我！”
云儿也站起来，推他坐下，笑道：“怕什么？这还亏你天天吃酒呢，难道你连我也不如！|云儿也站起来，把他推回座位，笑道：“怕什么？亏你还天天喝酒，难道连我都不如！
我回来还说呢。说是了，罢，不是了，不过罚上几杯，那里就醉死了。|我等会儿也要说的。说对了就罢，说不对，不过罚几杯，哪里就醉死了。
你如今一乱令，倒喝十大海，下去斟酒不成？”|你现在一捣乱，倒要喝十大碗，还要下去倒酒不成？”
众人都拍手道妙。|大家都拍手叫好。
薛蟠听说无法，只得坐了。|薛蟠听了没办法，只好坐下了。
听宝玉说道：“女儿悲，青春已大守空闺。|听宝玉说：“女儿悲，青春已大守空闺。（女儿悲伤的是：年纪大了，还独守空房。）
女儿愁，悔教夫婿觅封侯。|女儿愁，悔教夫婿觅封侯。（女儿发愁的是：后悔让丈夫出门去求功名。）
女儿喜，对镜晨妆颜色美。|女儿喜，对镜晨妆颜色美。（女儿欢喜的是：早晨对镜梳妆，容颜美丽。）
女儿乐，秋千架上春衫薄。”|女儿乐，秋千架上春衫薄。”（女儿快乐的是：在秋千架上，穿着薄薄的春衫。）
众人听了，都道：“说得有理。”|大家听了，都说：“说得好。”
薛蟠独扬著脸摇头说：“不好，该罚！”|只有薛蟠仰着脸摇头说：“不好，该罚！”
众人问：“如何该罚？”|大家问：“为什么该罚？”
薛蟠道：“他说的我通不懂，怎么不该罚？”|薛蟠说：“他说的我一点都不懂，怎么不该罚？”
云儿便拧他一把，笑道：“你悄悄的想你的罢。回来说不出，又该罚了。”|云儿就拧了他一把，笑道：“你悄悄想你的吧。等会儿说不出来，又该罚了。”
! “悔教夫婿觅封侯”出自唐代王昌龄的《闺怨》。宝玉连行酒令，也不喜欢“封侯”这类功名。

# 十四、红豆曲
于是拿琵琶听宝玉唱道：|于是云儿弹起琵琶，听宝玉唱道：
~滴不尽相思血泪抛红豆，开不完春柳春花满画楼。|流不尽的相思血泪，像抛撒的红豆；开不完的春柳春花，开满了画楼。
~睡不稳纱窗风雨黄昏后，忘不了新愁与旧愁。|黄昏后纱窗外风雨交加，睡也睡不安稳；新愁旧愁，总也忘不了。
~咽不下玉粒金莼噎满喉，照不见菱花镜里形容瘦。|珍贵的饭食咽不下去，噎满了喉咙；不敢照那菱花镜，怕看见自己憔悴消瘦的模样。
~展不开的眉头，捱不明的更漏。|舒展不开的眉头，熬不到天亮的长夜。
~呀，恰便似遮不住的青山隐隐，流不断的绿水悠悠。|呀，正像那遮不住的青山隐隐约约，流不断的绿水悠悠长长。
唱完，大家齐声喝彩，独薛蟠说无板。|唱完，大家齐声喝彩，只有薛蟠说不合板眼。
宝玉饮了门杯，便拈起一片梨来，说道：“雨打梨花深闭门。”完了令。|宝玉喝了门杯酒，就拿起一片梨，说：“雨打梨花深闭门。”完成了酒令。
! 这支《红豆曲》一连十个“不”字，是宝玉写给心中所爱的。“滴不尽相思血泪”，后来黛玉正是泪尽而逝。
! “雨打梨花深闭门”出自宋代李重元的《忆王孙》，写闺中女子的孤寂，与曲意相合。

# 十五、冯紫英与云儿的酒令
下该冯紫英，说道：“女儿悲，儿夫染病在垂危。|轮到冯紫英，他说：“女儿悲，儿夫染病在垂危。（丈夫病重快要死了。）
女儿愁，大风吹倒梳妆楼。|女儿愁，大风吹倒梳妆楼。
女儿喜，头胎养了双生子。|女儿喜，头胎养了双生子。（头一胎就生了双胞胎。）
女儿乐，私向花园掏蟋蟀。”|女儿乐，私向花园掏蟋蟀。”（偷偷到花园里捉蟋蟀。）
说毕，端起酒来，唱道：|说完，端起酒来唱道：
~你是个可人，你是个多情，你是个刁钻古怪鬼灵精，你是个神仙也不灵。|你是个可爱的人，你是个多情的人，你是个刁钻古怪的鬼机灵，你是个神仙也猜不透的人。
~我说的话儿你全不信，只叫你去背地里细打听，才知道我疼你不疼！|我说的话你全都不信，只要你背地里仔细打听，才知道我疼不疼你！
唱完，饮了门杯，说道：“鸡声茅店月。”令完，下该云儿。|唱完，喝了门杯酒，说：“鸡声茅店月。”酒令完了，轮到云儿。
云儿便说道：“女儿悲，将来终身指靠谁？”|云儿就说：“女儿悲，将来终身指靠谁？”（将来一辈子依靠谁呢？）
薛蟠叹道：“我的儿，有你薛大爷在，你怕什么！”|薛蟠叹道：“我的乖乖，有你薛大爷在，你怕什么！”
众人都道：“别混他，别混他！”|大家都说：“别打岔，别打岔！”
云儿又道：“女儿愁，妈妈打骂何时休！”|云儿又说：“女儿愁，妈妈打骂何时休！”（妓院里的鸨母什么时候才不打骂我！）
薛蟠道：“前儿我见了你妈，还吩咐他不叫他打你呢。”|薛蟠说：“前天我见了你妈，还吩咐她不许打你呢。”
众人都道：“再多言者罚酒十杯。”|大家都说：“再多嘴的罚酒十杯。”
薛蟠连忙自己打了一个嘴巴子，说道：“没耳性，再不许说了。”|薛蟠连忙自己打了一个嘴巴，说：“记性不好，再不许说了。”
云儿又道：“女儿喜，情郎不舍还家里。|云儿又说：“女儿喜，情郎不舍还家里。（情郎舍不得回家。）
女儿乐，住了箫管弄弦索。”|女儿乐，住了箫管弄弦索。”（停了箫管，弹起琴弦。）
说完，便唱道：|说完，就唱道：
~豆蔻开花三月三，一个虫儿往里钻。|（这是一支带色情双关的俗曲，略。）
~钻了半日不得进去，爬到花儿上打秋千。|（略。）
~肉儿小心肝，我不开了你怎么钻？|（略。）
唱毕，饮了门杯，说道：“桃之夭夭。”令完了，下该薛蟠。|唱完，喝了门杯酒，说：“桃之夭夭。”酒令完了，轮到薛蟠。
! “鸡声茅店月”出自唐代温庭筠的《商山早行》，冯紫英拿的是席上的鸡。“桃之夭夭”出自《诗经》，云儿拿的是桃。
! 云儿是妓女，她说的“将来终身指靠谁”“妈妈打骂何时休”，是真心话。薛蟠连连插嘴，可见他只顾自己。

# 十六、薛蟠的酒令
薛蟠道：“我可要说了：女儿悲——”说了半日，不见说底下的。|薛蟠说：“我可要说了：女儿悲——”说了半天，不见下文。
冯紫英笑道：“悲什么？快说来。”|冯紫英笑道：“悲什么？快说。”
薛蟠登时急的眼睛铃铛一般，瞪了半日，才说道：“女儿悲——”|薛蟠立刻急得眼睛瞪得像铃铛，瞪了半天，才说：“女儿悲——”
又咳嗽了两声，说道：“女儿悲，嫁了个男人是乌龟。”|又咳嗽两声，说：“女儿悲，嫁了个男人是乌龟。”（乌龟是骂人的话，指妻子不贞的男人。）
众人听了都大笑起来。|大家听了都大笑起来。
薛蟠道：“笑什么，难道我说的不是？一个女儿嫁了汉子，要当忘八，他怎么不伤心呢？”|薛蟠说：“笑什么，难道我说得不对？一个女儿嫁了男人，男人当了王八，她怎么不伤心呢？”
众人笑的弯腰说道：“你说的很是，快说底下的。”|大家笑弯了腰说：“你说得很对，快说下面的。”
薛蟠瞪了一瞪眼，又说道：“女儿愁——”说了这句，又不言语了。|薛蟠瞪了瞪眼，又说：“女儿愁——”说了这句，又不吭声了。
众人道：“怎么愁？”|大家说：“怎么愁？”
薛蟠道：“绣房撺出个大马猴。”|薛蟠说：“绣房撺出个大马猴。”
众人呵呵笑道：“该罚，该罚！这句更不通，先还可恕。”|大家呵呵笑道：“该罚，该罚！这句更不通，前一句还可以饶过。”
说著便要筛酒。|说着就要倒酒罚他。
宝玉笑道：“押韵就好。”|宝玉笑道：“押韵就行。”
薛蟠道：“令官都准了，你们闹什么？”|薛蟠说：“令官都准了，你们闹什么？”
众人听说，方才罢了。|大家听了，才作罢。
云儿笑道：“下两句越发难说了，我替你说罢。”|云儿笑道：“下面两句更难说了，我替你说吧。”
薛蟠道：“胡说！当真我就没好的了！听我说罢：女儿喜，洞房花烛朝慵起。”|薛蟠说：“胡说！难道我真没好句子了！听我说：女儿喜，洞房花烛朝慵起。”（新婚之夜后，早上懒得起床。）
众人听了，都诧异道：“这句何其太韵？”|大家听了，都惊讶地说：“这句怎么这么雅？”
薛蟠又道：“女儿乐，一根𣬠𣬶往里戳。”|（薛蟠又说了一句下流话，略。）
众人听了，都扭著脸说道：“该死，该死！快唱了罢。”|大家听了，都扭过脸去说：“该死，该死！快唱吧。”
薛蟠便唱道：“一个蚊子哼哼哼。”|薛蟠就唱道：“一个蚊子哼哼哼。”
众人都怔了，说：“这是个什么曲儿？”|大家都愣了，说：“这是什么曲子？”
薛蟠还唱道：“两个苍蝇嗡嗡嗡。”|薛蟠还唱：“两个苍蝇嗡嗡嗡。”
众人都道：“罢，罢，罢！”|大家都说：“算了，算了，算了！”
薛蟠道：“爱听不听！这是新鲜曲儿，叫作哼哼韵。你们要懒待听，连酒底都免了，我就不唱。”|薛蟠说：“爱听不听！这是新鲜曲子，叫‘哼哼韵’。你们要是懒得听，连酒底都免了，我就不唱。”
众人都道：“免了罢，免了罢，倒别耽误了别人家。”|大家都说：“免了吧，免了吧，别耽误了别人。”
! 薛蟠的酒令是全书最有名的笑料之一。宝玉作令官，偏偏放他过关，说“押韵就好”。
! 薛蟠偶尔冒出一句“洞房花烛朝慵起”，众人反倒吃惊，可见平时有多粗俗。

# 十七、蒋玉菡的酒令
于是蒋玉菡说道：“女儿悲，丈夫一去不回归。|于是蒋玉菡说：“女儿悲，丈夫一去不回归。
女儿愁，无钱去打桂花油。|女儿愁，无钱去打桂花油。（没钱买梳头用的桂花油。）
女儿喜，灯花并头结双蕊。|女儿喜，灯花并头结双蕊。（灯芯结了两朵并头的灯花，是喜兆。）
女儿乐，夫唱妇随真和合。”|女儿乐，夫唱妇随真和合。”（夫妻和睦，丈夫唱、妻子随。）
说毕，唱道：|说完，唱道：
~可喜你天生成百媚娇，恰便似活神仙离碧霄。|可喜你天生千娇百媚，就像活神仙离开了天上。
~度青春，年正小；配鸾凤，真也著。|正当青春，年纪还小；和你结成夫妻，真是般配。
~呀！看天河正高，听谯楼鼓敲，剔银灯同入鸳帏悄。|呀！看天上银河正高，听城楼上更鼓敲响，挑亮银灯，悄悄一同进入鸳鸯帐。
唱毕，饮了门杯，笑道：“这诗词上我倒有限。|唱完，喝了门杯酒，笑道：“诗词上我懂得有限。
幸而昨日见了一副对子，可巧只记得这句，幸而席上还有这件东西。”|幸好昨天见了一副对联，正好只记得这一句，幸好席上还有这样东西。”
说毕，便干了酒，拿起一朵木樨来，念道：“花气袭人知昼暖。”|说完，就干了酒，拿起一朵桂花，念道：“花气袭人知昼暖。”
! 蒋玉菡说的是最平常的夫妻日子：盼丈夫回来、没钱买油、夫唱妇随。这四句正是他和袭人将来的写照。
! 他随手拿起桂花念出“花气袭人”，正好念出了袭人的名字。他与袭人的姻缘，就在这里埋下了第一个伏笔。

# 十八、“袭人”是宝贝
众人倒都依了，完令。|大家都认可了，完成酒令。
薛蟠又跳了起来，喧嚷道：“了不得，了不得！该罚，该罚！这席上又没有宝贝，你怎么念起宝贝来？”|薛蟠又跳起来嚷道：“不得了，不得了！该罚，该罚！这席上又没有宝贝，你怎么念起宝贝来了？”
蒋玉菡怔了，说道：“何曾有宝贝？”|蒋玉菡愣了，说：“哪里有宝贝？”
薛蟠道：“你还赖呢！你再念来。”|薛蟠说：“你还赖！你再念一遍。”
蒋玉菡只得又念了一遍。|蒋玉菡只好又念了一遍。
薛蟠道：“袭人可不是宝贝是什么！你们不信，只问他。”说毕，指著宝玉。|薛蟠说：“‘袭人’可不就是宝贝！你们不信，问他。”说完，指着宝玉。
宝玉没好意思起来，说：“薛大哥，你该罚多少？”|宝玉不好意思起来，说：“薛大哥，你该罚多少？”
薛蟠道：“该罚，该罚！”说著拿起酒来，一饮而尽。|薛蟠说：“该罚，该罚！”说着端起酒来一口喝干。
冯紫英与蒋玉菡等不知原故，云儿便告诉了出来。|冯紫英和蒋玉菡等人不知道缘故，云儿就把事情说了出来。
蒋玉菡忙起身陪罪。|蒋玉菡连忙起身赔罪。
众人都道：“不知者不作罪。”|大家都说：“不知者不怪罪。”
! 在外人席上说出宝玉房里丫头的名字，是很失礼的事。薛蟠一闹，蒋玉菡第一次知道了“袭人”这个人。

# 十九、交换汗巾
少刻，宝玉出席解手，蒋玉菡便随了出来。|过了一会儿，宝玉离席去解手，蒋玉菡就跟了出来。
二人站在廊檐下，蒋玉菡又陪不是。|两人站在廊檐下，蒋玉菡又赔了不是。
宝玉见他妩媚温柔，心中十分留恋，便紧紧的搭著他的手，叫他：“闲了往我们那里去。|宝玉见他妩媚温柔，心里十分喜爱，就紧紧拉着他的手，对他说：“有空到我们那里去。
还有一句话借问，也是你们贵班中，有一个叫琪官的，他在那里？如今名驰天下，我独无缘一见。”|还有一句话想问你，也是你们班子里的，有一个叫琪官的，他在哪里？如今名满天下，偏偏我无缘见一面。”
蒋玉菡笑道：“就是我的小名儿。”|蒋玉菡笑道：“那就是我的小名。”
宝玉听说，不觉欣然跌足笑道：“有幸，有幸！果然名不虚传。今儿初会，便怎么样呢？”|宝玉听了，高兴得直跺脚，笑道：“有幸，有幸！果然名不虚传。今天初次见面，该怎么样呢？”
想了一想，向袖中取出扇子，将一个玉玦扇坠解下来，递与琪官，道：“微物不堪，略表今日之谊。”|想了想，从袖子里取出扇子，把一个玉玦扇坠解下来，递给琪官，说：“小东西不值什么，略表今天的情谊。”
琪官接了，笑道：“无功受禄，何以克当！|琪官接过来，笑道：“无功受禄，怎么当得起！
也罢，我这里得了一件奇物，今日早起方系上，还是簇新的，聊可表我一点亲热之意。”|也好，我这里得了一件稀罕东西，今天早上才系上，还是崭新的，聊表我一点亲热的心意。”
说毕撩衣，将系小衣儿一条大红汗巾子解了下来，递与宝玉，道：|说完撩起衣襟，把系内衣的一条大红汗巾解下来，递给宝玉，说：
“这汗巾子是茜香国女国王所贡之物，夏天系著，肌肤生香，不生汗渍。|“这条汗巾是茜香国女国王进贡的东西，夏天系着，皮肤生香，不出汗渍。
昨日北静王给我的，今日才上身。若是别人，我断不肯相赠。|是昨天北静王给我的，今天才系上。要是别人，我绝不肯送。
二爷请把自己系的解下来，给我系著。”|二爷请把您自己系的解下来，给我系着。”
宝玉听说，喜不自禁，连忙接了，将自己一条松花汗巾解了下来，递与琪官。|宝玉听了，喜不自禁，连忙接过来，把自己的一条松花绿汗巾解下来递给琪官。
二人方束好，只见一声大叫：“我可拿住了！”|两人刚系好，只听一声大叫：“我可抓住了！”
只见薛蟠跳了出来，拉著二人道：“放著酒不吃，两个人逃席出来干什么？快拿出来我瞧瞧。”|只见薛蟠跳出来，拉着两人说：“放着酒不喝，两个人溜出来干什么？快拿出来给我看看。”
二人都道：“没有什么。”|两人都说：“没什么。”
薛蟠那里肯依，还是冯紫英出来才解开了。|薛蟠哪里肯依，还是冯紫英出来才把他们拉开。
于是复又归坐饮酒，至晚方散。|于是又回座喝酒，到晚上才散。
! 这条大红汗巾是北静王送的，琪官又是忠顺王府的戏子。两位王爷之间的关系，宝玉毫不知情，就这样卷了进去。第三十三回忠顺府来要人，凭的就是这条红汗巾。
! 宝玉送出去的松花汗巾，其实是袭人的（见下文）。汗巾辗转到了琪官身上，袭人后来果然嫁给了琪官。
! 薛蟠撞见了换汗巾，下一回他被人怀疑向贾政告密，就是因为这件事他知道。

# 二十、袭人的汗巾
宝玉回至园中，宽衣吃茶。|宝玉回到园里，脱了外衣喝茶。
袭人见扇子上的坠儿没了，便问他：“往那里去了？”|袭人见扇子上的坠子没了，就问他：“到哪里去了？”
宝玉道：“马上丢了。”|宝玉说：“骑马时丢了。”
睡觉时只见腰里一条血点似的大红汗巾子，袭人便猜了八九分，|睡觉时，只见他腰里系着一条血一样鲜红的大红汗巾，袭人就猜到了八九分，
因说道：“你有了好的系裤子，把我那条还我罢。”|就说：“你有了好的系裤子，把我那条还我吧。”
宝玉听说，方想起那条汗巾子原是袭人的，不该给人才是，心里后悔，口里说不出来，|宝玉听了，才想起那条汗巾原来是袭人的，不该送人，心里后悔，嘴上说不出来，
只得笑道：“我赔你一条罢。”|只好笑道：“我赔你一条吧。”
袭人听了，点头叹道：“我就知道又干这些事！|袭人听了，点头叹道：“我就知道你又干这种事！
也不该拿著我的东西给那起混帐人去。也难为你，心里没个算计儿。”|也不该拿我的东西给那些不三不四的人。也难为你，心里一点打算都没有。”
再要说几句，又恐怄上他的酒来，少不得也睡了，一宿无话。|还想说几句，又怕惹得他酒劲上来，只好也睡了，一夜无话。
至次日天明，方才醒了，只见宝玉笑道：“夜里失了盗也不晓得，你瞧瞧裤子上。”|到第二天天亮，刚醒来，只听宝玉笑道：“夜里被偷了都不知道，你看看裤子上。”
袭人低头一看，只见昨日宝玉系的那条汗巾子系在自己腰里呢，便知是宝玉夜间换了，|袭人低头一看，只见昨天宝玉系的那条汗巾正系在自己腰上，就知道是宝玉夜里给她换上了，
忙一顿把解下来，说道：“我不希罕这行子，趁早儿拿了去！”|连忙一把解下来，说：“我不稀罕这东西，趁早拿走！”
宝玉见他如此，只得委婉解劝了一回。|宝玉见她这样，只好好言好语劝了一番。
袭人无法，只得系在腰里。|袭人没办法，只好系在腰里。
过后宝玉出去，终久解下来掷在个空箱子里，自己又换了一条系著。|等宝玉出去以后，她终究还是解下来扔进一个空箱子里，自己又换了一条系上。
! 袭人骂琪官是“混帐人”，却不知道自己将来要嫁的正是这个人。她扔进箱子里的这条红汗巾，八十回后会再出现：袭人出嫁那天，两人一对汗巾，才知道是前缘。
! 汗巾是贴身之物，一来一回，已经把宝玉、琪官、袭人三人连在了一起。

# 二十一、元春赐端午节礼
宝玉并未理论，因问起昨日可有什么事情。|宝玉也没在意，就问昨天有什么事。
袭人便回说：“二奶奶打发人叫了红玉去了。|袭人就回说：“二奶奶打发人把红玉叫去了。
他原要等你来的，我想什么要紧，我就作了主，打发他去了。”|她本想等你回来的，我想这有什么要紧，就做主让她去了。”
宝玉道：“很是。我已知道了，不必等我罢了。”|宝玉说：“很对。我已经知道了，不用等我。”
袭人又道：“昨儿贵妃打发夏太监出来，送了一百二十两银子，|袭人又说：“昨天贵妃打发夏太监出来，送来一百二十两银子，
叫在清虚观初一到初三打三天平安醮，唱戏献供，叫珍大爷领著众位爷们跪香拜佛呢。|叫在清虚观从初一到初三做三天平安醮，唱戏上供，叫珍大爷领着各位爷们跪香拜佛。
还有端午儿的节礼也赏了。”|还赏了端午节的节礼。”
说著命小丫头子来，将昨日所赐之物取了出来，|说着叫小丫头把昨天赏的东西拿出来，
只见上等宫扇两柄，红麝香珠二串，凤尾罗二端，芙蓉簟一领。|只见是上等宫扇两把，红麝香珠两串，凤尾罗两匹，芙蓉竹席一张。
宝玉见了，喜不自胜，问”别人的也都是这个？”|宝玉见了，非常高兴，问：“别人的也都是这些？”
袭人道：“老太太的多著一个香如意，一个玛瑙枕。|袭人说：“老太太的多一个香如意、一个玛瑙枕。
太太，老爷，姨太太的只多著一个如意。|太太、老爷、姨太太的只多一个如意。
你的同宝姑娘的一样。|你的和宝姑娘的一样。
林姑娘同二姑娘，三姑娘，四姑娘只单有扇子同数珠儿，别人都没了。|林姑娘和二姑娘、三姑娘、四姑娘只有扇子和数珠，别的都没有。
大奶奶，二奶奶他两个是每人两匹纱，两匹罗，两个香袋，两个锭子药。”|大奶奶、二奶奶她们两个是每人两匹纱、两匹罗、两个香袋、两锭药。”
宝玉听了，笑道：“这是怎么个原故？怎么林姑娘的倒不同我的一样，倒是宝姐姐的同我一样！别是传错了罢？”|宝玉听了，笑道：“这是什么缘故？怎么林姑娘的倒不和我的一样，倒是宝姐姐的和我一样！别是传错了吧？”
袭人道：“昨儿拿出来，都是一份一份的写著签子，怎么就错了！|袭人说：“昨天拿出来的时候，都是一份一份写着签子的，怎么会错！
你的是在老太太屋里的，我去拿了来了。|你的那份在老太太屋里，我去拿回来了。
老太太说了，明儿叫你一个五更天进去谢恩呢。”|老太太说了，明天叫你五更天就进去谢恩呢。”
宝玉道：“自然要走一趟。”|宝玉说：“自然要去一趟。”
说著便叫紫绡来：“拿了这个到林姑娘那里去，就说是昨儿我得的，爱什么留下什么。”|说着就叫紫绡来：“把这些拿到林姑娘那里去，就说是我昨天得的，她喜欢什么就留下什么。”
紫绡答应了，拿了去，不一时回来说：“林姑娘说了，昨儿也得了，二爷留著罢。”|紫绡答应着拿去了，不一会儿回来说：“林姑娘说了，她昨天也得了，二爷留着吧。”
! 这是极重要的一笔：元春赏的节礼，宝玉和宝钗一模一样，黛玉却和三春一样。元春身在宫中，用节礼表明了她的意思：她看中的是宝钗。
! “金玉良缘”从此不只是和尚的话，有了贵妃的分量。黛玉的“木石前盟”，在家长们眼里越来越没有指望。
! 红麝香珠，就是回目里宝钗“羞笼”的那一串。

# 二十二、宝玉起誓
宝玉听说，便命人收了。|宝玉听了，就叫人收起来。
刚洗了脸出来，要往贾母那里请安去，只见林黛玉顶头来了。|刚洗了脸出来，要到贾母那里请安，迎面碰见林黛玉来了。
宝玉赶上去笑道：“我的东西叫你拣，你怎么不拣？”|宝玉赶上去笑道：“我的东西叫你挑，你怎么不挑？”
林黛玉昨日所恼宝玉的心事早又丢开，又顾今日的事了，因说道：|林黛玉昨天恼宝玉的心事早丢开了，又顾着今天的事，就说：
“我没这么大福禁受，比不得宝姑娘，什么金什么玉的，我们不过是草木之人！”|“我没这么大的福气受用，比不得宝姑娘，什么金什么玉的，我们不过是草木之人！”
宝玉听他提出”金玉”二字来，不觉心动疑猜，便说道：|宝玉听她提出“金玉”两个字，不由得心里一动，起了疑，就说：
“除了别人说什么金什么玉，我心里要有这个想头，天诛地灭，万世不得人身！”|“除了别人说什么金什么玉以外，我心里要是有这个念头，天诛地灭，万世不得做人！”
林黛玉听他这话，便知他心里动了疑，忙又笑道：|林黛玉听了这话，就知道他心里起了疑，连忙又笑道：
“好没意思，白白的说什么誓？管你什么金什么玉的呢！”|“真没意思，白白地发什么誓？管你什么金什么玉的呢！”
宝玉道：“我心里的事也难对你说，日后自然明白。|宝玉说：“我心里的事也难跟你说，以后你自然会明白。
除了老太太，老爷，太太这三个人，第四个就是妹妹了。要有第五个人，我也说个誓。”|除了老太太、老爷、太太这三个人，第四个就是妹妹了。要是有第五个人，我也发个誓。”
林黛玉道：“你也不用说誓，我很知道你心里有‘妹妹’，但只是见了‘姐姐’，就把‘妹妹’忘了。”|林黛玉说：“你也不用发誓，我很知道你心里有‘妹妹’，只是一见了‘姐姐’，就把‘妹妹’忘了。”
宝玉道：“那是你多心，我再不的。”|宝玉说：“那是你多心，我绝不会的。”
林黛玉道：“昨儿宝丫头不替你圆谎，为什么问著我呢？那要是我，你又不知怎么样了。”|林黛玉说：“昨天宝丫头不替你圆谎，你为什么冲着我来？要是换了我，你又不知道要怎么样了。”
! 黛玉自称“草木之人”，正是她的来历：她前世是灵河岸边的绛珠仙草。“木石前盟”的“木”就是她。
! 宝玉说“第四个就是妹妹”，在长辈之后、所有人之前。这几乎就是表白了。

# 二十三、宝钗笼红麝串
正说著，只见宝钗从那边来了，二人便走开了。|正说着，只见宝钗从那边来了，两人就走开了。
宝钗分明看见，只装看不见，低著头过去了，|宝钗明明看见了，只装没看见，低着头走过去了，
到了王夫人那里，坐了一回，然后到了贾母这边，只见宝玉在这里呢。|到王夫人那里坐了一会儿，然后又到贾母这边，只见宝玉在这里。
薛宝钗因往日母亲对王夫人等曾提过”金锁是个和尚给的，等日后有玉的方可结为婚姻”等语，所以总远著宝玉。|薛宝钗因为从前母亲对王夫人等人提过“金锁是个和尚给的，以后要找个有玉的才能结亲”这类话，所以总是躲着宝玉。
昨儿见元春所赐的东西，独他与宝玉一样，心里越发没意思起来。|昨天见元春赏的东西，唯独她和宝玉的一样，心里越发不自在起来。
幸亏宝玉被一个林黛玉缠绵住了，心心念念只记挂著林黛玉，并不理论这事。|幸亏宝玉被林黛玉缠住了，心心念念只惦记着林黛玉，并没在意这件事。
此刻忽见宝玉笑问道：“宝姐姐，我瞧瞧你的红麝串子？”|这时忽然听见宝玉笑问：“宝姐姐，让我看看你的红麝串？”
可巧宝钗左腕上笼著一串，见宝玉问他，少不得褪了下来。|正好宝钗左手腕上戴着一串，见宝玉问，只好褪下来。
宝钗生的肌肤丰泽，容易褪不下来。|宝钗皮肤丰润，不容易褪下来。
宝玉在旁看著雪白一段酥臂，不觉动了羡慕之心，暗暗想道：|宝玉在旁边看着那一段雪白丰润的手臂，不由得动了爱慕之心，暗暗想道：
“这个膀子要长在林妹妹身上，或者还得摸一摸，偏生长在他身上。”|“这条胳膊要是长在林妹妹身上，或许还能摸一摸，偏偏长在她身上。”
正是恨没福得摸，忽然想起“金玉”一事来，再看看宝钗形容，|正恨自己没福气摸，忽然想起“金玉”的事来，再看看宝钗的容貌，
只见脸若银盆，眼似水杏，唇不点而红，眉不画而翠，比林黛玉另具一种妩媚风流，|只见她脸像银盘，眼像水杏，嘴唇不点就红，眉毛不画就翠，比林黛玉另有一种妩媚风流，
不觉就呆了，宝钗褪了串子来递与他也忘了接。|不由得看呆了，宝钗褪下串子递给他，他也忘了接。
宝钗见他怔了，自己倒不好意思的，丢下串子，回身才要走，|宝钗见他发愣，自己倒不好意思了，丢下串子，转身正要走，
只见林黛玉蹬著门槛子，嘴里咬著手帕子笑呢。|只见林黛玉踩着门槛，嘴里咬着手帕在笑呢。
! 宝钗知道“金玉”之说，所以有意“远著宝玉”。她不是不在乎，是太在乎，才要避嫌。
! 宝玉心里也有对宝钗的倾慕，只是“恨没福得摸”。他心里分得很清：爱的是黛玉，宝钗的美他也看得见。
! 黛玉站在门口“咬著手帕子笑”，宝玉看呆的那一幕全被她看在眼里。

# 二十四、“呆雁”
宝钗道：“你又禁不得风吹，怎么又站在那风口里？”|宝钗说：“你又经不起风吹，怎么又站在风口上？”
林黛玉笑道：“何曾不是在屋里的。只因听见天上一声叫唤，出来瞧了瞧，原来是个呆雁。”|林黛玉笑道：“本来是在屋里的。只因听见天上叫了一声，出来瞧瞧，原来是个呆雁。”
薛宝钗道：“呆雁在那里呢？我也瞧一瞧。”|薛宝钗说：“呆雁在哪里呢？我也瞧瞧。”
林黛玉道：“我才出来，他就‘忒儿’一声飞了。”|林黛玉说：“我刚一出来，它就‘扑棱’一声飞走了。”
口里说著，将手里的帕子一甩，向宝玉脸上甩来。|嘴里说着，把手里的手帕一甩，朝宝玉脸上甩过来。
宝玉不防，正打在眼上，“嗳哟”了一声。|宝玉没防备，正打在眼睛上，“哎哟”了一声。
要知端的，且听下回分解。|要知后事如何，请看下回。
! “呆雁”骂的是宝玉看宝钗看呆了。黛玉不点破，只借天上的大雁说事，一帕子甩过去，醋意全在里面了。
! 回目“薛宝钗羞笼红麝串”，“羞”字最传神：宝钗被宝玉看得害羞，又被黛玉撞见，所以“丢下串子”就要走。
</script>
<script type="text/plain" id="ch29">
# 一、凤姐约看戏
话说宝玉正自发怔，不想黛玉将手帕子甩了来，正碰在眼睛上，倒唬了一跳，问是谁。|宝玉正在发呆，没想到黛玉把手帕甩过来，正打在眼睛上，倒吓了一跳，问是谁。
林黛玉摇著头儿笑道：“不敢，是我失了手。因为宝姐姐要看呆雁，我比给他看，不想失了手。”|林黛玉摇着头笑道：“不敢，是我失手了。因为宝姐姐要看呆雁，我比划给她看，没想到失手了。”
宝玉揉著眼睛，待要说什么，又不好说的。|宝玉揉着眼睛，想说什么，又不好说。
一时，凤姐儿来了，因说起初一日在清虚观打醮的事来，遂约著宝钗，宝玉，黛玉等看戏去。|一会儿，凤姐来了，说起初一在清虚观做法事的事，就约宝钗、宝玉、黛玉等人去看戏。
宝钗笑道：“罢，罢，怪热的。什么没看过的戏，我就不去了。”|宝钗笑道：“算了算了，热得很。什么戏没看过，我就不去了。”
凤姐儿道：“他们那里凉快，两边又有楼。|凤姐说：“他们那里凉快，两边又有楼。
咱们要去，我头几天打发人去，把那些道士都赶出去，把楼打扫干净，挂起帘子来，一个闲人不许放进庙去，才是好呢。|咱们要去，我提前几天打发人去，把那些道士都赶出去，把楼打扫干净，挂起帘子，一个闲人都不许放进庙里，那才好呢。
我已经回了太太了，你们不去我去。|我已经回过太太了，你们不去我去。
这些日子也闷的很了。家里唱动戏，我又不得舒舒服服的看。”|这些日子也闷得慌。家里唱戏，我又不能舒舒服服地看。”
! 黛玉甩了帕子，还说是替宝钗“比给他看”，把宝钗也拉了进来。
! 凤姐说在家看戏“不得舒舒服服的看”，因为她要伺候贾母、张罗一切。她也想偷个闲。

# 二、贾母也要去
贾母听说，笑道：“既这么著，我同你去。”|贾母听了，笑道：“既然这样，我和你一起去。”
凤姐听说，笑道：“老祖宗也去，敢情好了！就只是我又不得受用了。”|凤姐听了，笑道：“老祖宗也去，那可好了！只是我又不能自在了。”
贾母道：“到明儿，我在正面楼上，你在旁边楼上，你也不用到我这边来立规矩，可好不好？”|贾母说：“到时候，我在正面楼上，你在旁边楼上，你也不用到我这边来立规矩，好不好？”
凤姐儿笑道：“这就是老祖宗疼我了。”|凤姐笑道：“这就是老祖宗疼我了。”
贾母因又向宝钗道：“你也去，连你母亲也去。长天老日的，在家里也是睡觉。”|贾母又对宝钗说：“你也去，连你母亲也去。白天这么长，在家里也是睡觉。”
宝钗只得答应著。|宝钗只好答应了。
贾母又打发人去请了薛姨妈，顺路告诉王夫人，要带了他们姊妹去。|贾母又打发人去请薛姨妈，顺路告诉王夫人，要带姐妹们去。
王夫人因一则身上不好，二则预备著元春有人出来，早已回了不去的，|王夫人一来身体不舒服，二来要等着元春那边来人，早就说了不去，
听贾母如今这样说，笑道：“还是这么高兴。”|听贾母这么说，笑道：“老太太还是这么有兴致。”
因打发人去到园里告诉：“有要逛的，只管初一跟了老太太逛去。”|就打发人到园里去说：“有想去逛的，只管初一跟老太太去。”
这个话一传开了，别人都还可已，|这话一传开，别人还罢了，
只是那些丫头们天天不得出门槛子，听了这话，谁不要去。|那些丫头们天天出不了门，听了这话，谁不想去。
便是各人的主子懒怠去，他也百般撺掇了去，|就算各自的主子懒得去，她们也百般撺掇主子去，
因此李宫裁等都说去。|因此李纨等人都说要去。
贾母越发心中喜欢，早已吩咐人去打扫安置，都不必细说。|贾母越发高兴，早就吩咐人去打扫布置，不必细说。

# 三、浩浩荡荡出门
单表到了初一这一日，荣国府门前车辆纷纷，人马簇簇。|单说到了初一这天，荣国府门前车辆纷纷，人马成群。
那底下凡执事人等，闻得是贵妃作好事，贾母亲去拈香，|下面那些管事的人，听说是贵妃做善事，贾母亲自去烧香，
正是初一日乃月之首日，况是端阳节间，因此凡动用的什物，一色都是齐全的，不同往日。|又正是初一，是一个月的头一天，又在端午节期间，所以凡是用得着的东西，样样齐全，和往常不同。
少时，贾母等出来。|一会儿，贾母等人出来了。
贾母坐一乘八人大轿，李氏，凤姐儿，薛姨妈每人一乘四人轿，|贾母坐一顶八人抬的大轿，李纨、凤姐、薛姨妈每人坐一顶四人轿，
宝钗，黛玉二人共坐一辆翠盖珠缨八宝车，迎春，探春，惜春三人共坐一辆朱轮华盖车。|宝钗、黛玉两人同坐一辆翠绿车盖、缀着珠缨的八宝车，迎春、探春、惜春三人同坐一辆红轮华盖车。
然后贾母的丫头鸳鸯，鹦鹉，琥珀，珍珠，林黛玉的丫头紫鹃，雪雁，春纤，|然后是贾母的丫头鸳鸯、鹦鹉、琥珀、珍珠，林黛玉的丫头紫鹃、雪雁、春纤，
宝钗的丫头莺儿，文杏，迎春的丫头司棋，绣桔，探春的丫头侍书，翠墨，惜春的丫头入画，彩屏，|宝钗的丫头莺儿、文杏，迎春的丫头司棋、绣桔，探春的丫头侍书、翠墨，惜春的丫头入画、彩屏，
薛姨妈的丫头同喜，同贵，外带著香菱，香菱的丫头臻儿，|薛姨妈的丫头同喜、同贵，外加香菱和香菱的丫头臻儿，
李氏的丫头素云、碧月，凤姐儿的丫头平儿、丰儿、小红，|李纨的丫头素云、碧月，凤姐的丫头平儿、丰儿、小红，
并王夫人两个丫头也要跟了凤姐儿去的金钏，彩云，|还有王夫人的两个丫头、也要跟凤姐去的金钏、彩云，
奶子抱著大姐儿带著巧姐儿另在一车，还有两个丫头，|奶妈抱着大姐儿、带着巧姐儿另坐一辆车，还有两个丫头，
一共又连上各房的老嬷嬷奶娘并跟出门的家人媳妇子，乌压压的占了一街的车。|再加上各房的老嬷嬷、奶妈和跟着出门的家人媳妇们，黑压压的车占了一整条街。
贾母等已经坐轿去了多远，这门前尚未坐完。|贾母等人的轿子已经走出去老远，门前的人还没坐完。
这个说：“我不同你在一处”，那个说“你压了我们奶奶的包袱”，|这个说“我不跟你坐一起”，那个说“你压着我们奶奶的包袱了”，
那边车上又说“蹭了我的花儿”，这边又说“碰折了我的扇子”，咭咭呱呱，说笑不绝。|那边车上又说“蹭掉我的花了”，这边又说“碰折我的扇子了”，叽叽喳喳，说笑不停。
周瑞家的走来过去的说道：“姑娘们，这是街上，看人笑话。”|周瑞家的走来走去地说：“姑娘们，这是在街上，叫人看笑话。”
说了两遍，方觉好了。|说了两遍，才安静些。
前头的全副执事摆开，早已到了清虚观了。|前面全副仪仗摆开，早已到了清虚观。
宝玉骑著马，在贾母轿前。街上人都站在两边。|宝玉骑着马，走在贾母的轿子前面。街上的人都站在两边看。
! 这是前八十回里贾府最风光的一次出行，丫头的名字就点了几十个。金钏也在其中，她这时还不知道，一个月以后自己就要投井。
! 丫头们“天天不得出门槛子”，所以一听能出门，个个兴高采烈。

# 四、凤姐打小道士
将至观前，只听钟鸣鼓响，早有张法官执香披衣，带领众道士在路旁迎接。|快到观前，只听钟鼓齐鸣，早有张法官手拿香、身披法衣，带领众道士在路旁迎接。
贾母的轿刚至山门以内，贾母在轿内因看见有守门大帅并千里眼，顺风耳，当方土地，本境城隍各位泥胎圣像，便命住轿。|贾母的轿子刚进山门，贾母在轿里看见守门大帅和千里眼、顺风耳、当地土地、本境城隍各位泥塑神像，就叫停轿。
贾珍带领各子弟上来迎接。|贾珍带领各位子弟上来迎接。
凤姐儿知道鸳鸯等在后面，赶不上来搀贾母，自己下了轿，忙要上来搀。|凤姐知道鸳鸯她们在后面，赶不上来搀贾母，自己下了轿，赶紧要上去搀。
可巧有个十二三岁的小道士儿，拿著剪筒，照管剪各处蜡花，正欲得便且藏出去，|正好有个十二三岁的小道士，拿着剪筒，负责剪各处的烛花，正想找个机会躲出去，
不想一头撞在凤姐儿怀里。|没想到一头撞进了凤姐怀里。
凤姐便一扬手，照脸一下，把那小孩子打了一个筋斗，|凤姐一扬手，照脸就是一巴掌，把那小孩打得翻了个跟头，
骂道：“野牛肏的，胡朝那里跑！”|骂道：“野杂种，往哪里乱跑！”
那小道士也不顾拾烛剪，爬起来往外还要跑。|那小道士也顾不上捡烛剪，爬起来还往外跑。
正值宝钗等下车，众婆娘媳妇正围随的风雨不透，|正赶上宝钗等人下车，婆子媳妇们正围得风雨不透，
但见一个小道士滚了出来，都喝声叫“拿，拿，拿！打，打，打！”|只见一个小道士滚了出来，都一齐喝道：“抓住，抓住，抓住！打，打，打！”

# 五、贾母怜惜小道士
贾母听了忙问：“是怎么了？”|贾母听了，连忙问：“怎么了？”
贾珍忙出来问。|贾珍赶紧出来问。
凤姐上去搀住贾母，就回说：“一个小道士儿，剪灯花的，没躲出去，这会子混钻呢。”|凤姐上去搀住贾母，回说：“一个剪灯花的小道士，没躲出去，这会儿乱钻呢。”
贾母听说，忙道：“快带了那孩子来，别唬著他。|贾母听了，忙说：“快把那孩子带来，别吓着他。
小门小户的孩子，都是娇生惯养的，那里见的这个势派。|小门小户的孩子，也都是爹妈娇生惯养的，哪里见过这种阵势。
倘或唬著他，倒怪可怜见的，他老子娘岂不疼的慌？”|要是吓着他，怪可怜的，他爹妈岂不心疼得慌？”
说著，便叫贾珍去好生带了来。|说着，就叫贾珍去好好把他带来。
贾珍只得去拉了那孩子来。|贾珍只好去把那孩子拉来。
那孩子还一手拿著蜡剪，跪在地下乱战。|那孩子一只手还拿着烛剪，跪在地上直发抖。
贾母命贾珍拉起来，“叫他别怕。问他几岁了。”|贾母叫贾珍把他拉起来，说：“叫他别怕。问他几岁了。”
那孩子通说不出话来。|那孩子吓得一句话也说不出来。
贾母还说”可怜见的”，又向贾珍道：“珍哥儿，带他去罢。给他些钱买果子吃，别叫人难为了他。”|贾母还说“可怜见的”，又对贾珍说：“珍哥儿，带他去吧。给他些钱买果子吃，别叫人为难他。”
贾珍答应，领他去了。|贾珍答应着，领他去了。
这里贾母带著众人，一层一层的瞻拜观玩。|这边贾母带着众人，一层一层地瞻仰参拜、观赏游玩。
外面小厮们见贾母等进入二层山门，忽见贾珍领了一个小道士出来，|外面的小厮们见贾母等人进了第二层山门，忽然看见贾珍领着一个小道士出来，
叫人来带去，给他几百钱，不要难为了他。|叫人来带他去，给他几百钱，不要为难他。
家人听说，忙上来领了下去。|家人听了，连忙上来把他领下去了。
! 凤姐一巴掌、一句粗话，贾母一句“可怜见的”，两人对下人的态度截然不同。贾母的慈，正衬出凤姐的狠。
! 贾母说“小门小户的孩子，都是娇生惯养的”，意思是穷人家的孩子也是爹妈的心头肉。后面刘姥姥进府，贾母也是这样“惜老怜贫”。

# 六、贾珍训贾蓉
贾珍站在阶矶上，因问：“管家在那里？”|贾珍站在台阶上问：“管家在哪里？”
底下站的小厮们见问，都一齐喝声说：“叫管家！”|下面站着的小厮们听见问，一齐高声喊：“叫管家！”
登时林之孝一手整理著帽子跑了来，到贾珍跟前。|林之孝立刻一手整理着帽子跑过来，到了贾珍跟前。
贾珍道：“虽说这里地方大，今儿不承望来这么些人。|贾珍说：“虽说这里地方大，今天没想到来这么多人。
你使的人，你就带了往你的那院里去，使不著的，打发到那院里去。|你用得着的人，就带到你那个院子里去；用不着的，打发到那个院子去。
把小幺儿们多挑几个在这二层门上同两边的角门上，伺候著要东西传话。|多挑几个小厮守在这二层门和两边的角门上，伺候着拿东西、传话。
你可知道不知道，今儿小姐奶奶们都出来，一个闲人也到不了这里。”|你知道不知道，今天小姐奶奶们都出来了，一个闲人也不能到这里来。”
林之孝忙答应“晓得”，又说了几个“是”。|林之孝连忙答应“知道”，又说了几个“是”。
贾珍道：“去罢。”又问：“怎么不见蓉儿？”|贾珍说：“去吧。”又问：“怎么不见蓉儿？”
一声未了，只见贾蓉从钟楼里跑了出来。|话音没落，只见贾蓉从钟楼里跑了出来。
贾珍道：“你瞧瞧他，我这里也还没敢说热，他倒乘凉去了！”|贾珍说：“你们看看他，我在这里还没敢说热呢，他倒先乘凉去了！”
喝命家人啐他。|喝令家人啐他。
那小厮们都知道贾珍素日的性子，违拗不得，有个小厮便上来向贾蓉脸上啐了一口。|小厮们都知道贾珍平时的脾气，违抗不得，有个小厮就上去朝贾蓉脸上啐了一口。
贾珍又道：“问著他！”|贾珍又说：“问他！”
那小厮便问贾蓉道：“爷还不怕热，哥儿怎么先乘凉去了？”|那小厮就问贾蓉：“老爷还不怕热，少爷怎么先去乘凉了？”
贾蓉垂著手，一声不敢说。|贾蓉垂着手，一声也不敢吭。
那贾芸，贾萍，贾芹等听见了，不但他们慌了，亦且连贾璜，贾㻞，贾琼等也都忙了，一个一个从墙根下慢慢的溜上来。|贾芸、贾萍、贾芹等人听见了，不但他们慌了，连贾璜、贾㻞、贾琼等人也都慌了，一个一个从墙根下慢慢溜上来。
贾珍又向贾蓉道：“你站著作什么？还不骑了马跑到家里，告诉你娘母子去！|贾珍又对贾蓉说：“你站着干什么？还不骑马跑回家，告诉你娘和你媳妇去！
老太太同姑娘们都来了，叫他们快来伺候。”|老太太和姑娘们都来了，叫她们快来伺候。”
贾蓉听说，忙跑了出来，一叠声要马，一面抱怨道：“早都不知作什么的，这会子寻趁我。”|贾蓉听了，赶紧跑出来，一连声要马，一边抱怨：“早先都不知干什么去了，这会儿来找我的茬。”
一面又骂小子：“捆著手呢？马也拉不来。”|一边又骂小厮：“手被捆着了吗？马都牵不来。”
待要打发小子去，又恐后来对出来，说不得亲自走一趟，骑马去了，不在话下。|本想打发小厮去，又怕以后对质出来，只好亲自走一趟，骑马去了。
! 叫小厮当众啐儿子的脸，这是贾珍做给贾母看的“家教”。贾蓉早已娶妻成家，却只能垂手挨啐。
! 贾珍在贾母面前装严父，其实宁府最不守规矩的正是他自己。

# 七、张道士
且说贾珍方要抽身进去，只见张道士站在旁边陪笑说道：|贾珍正要转身进去，只见张道士站在旁边赔笑说：
“论理我不比别人，应该里头伺候。|“照理我和别人不一样，应该在里面伺候。
只因天气炎热，众位千金都出来了，法官不敢擅入，请爷的示下。|只因天气炎热，各位小姐都出来了，我不敢擅自进去，请老爷吩咐。
恐老太太问，或要随喜那里，我只在这里伺候罢了。”|怕老太太问起，或者要到哪里去参观，我就在这里伺候吧。”
贾珍知道这张道士虽然是当日荣国府国公的替身，曾经先皇御口亲呼为“大幻仙人”，|贾珍知道这张道士是当年荣国公的替身，先皇曾亲口称他为“大幻仙人”，
如今现掌“道录司”印，又是当今封为“终了真人”，现今王公藩镇都称他为“神仙”，所以不敢轻慢。|如今掌管道录司的大印，又被当今皇上封为“终了真人”，现在王公藩镇都称他为“神仙”，所以不敢怠慢。
二则他又常往两个府里去，凡夫人小姐都是见的。|二来他又常到两府里去，夫人小姐们都见过他。
今见他如此说，便笑道：“咱们自己，你又说起这话来。|今天见他这么说，就笑道：“都是自己人，你又说这种话。
再多说，我把你这胡子还挦了呢！还不跟我进来。”|再多说，我把你的胡子拔了！还不跟我进来。”
那张道士呵呵大笑，跟了贾珍进来。|张道士呵呵大笑，跟着贾珍进来了。
! “替身”是富贵人家怕孩子养不大，让别人代替出家修行。张道士替的是荣国公贾源，即贾母的公公。
! “大幻仙人”“终了真人”，一个“幻”，一个“了”，暗示这一场繁华终是幻梦，终要了结。

# 八、张道士忆国公
贾珍到贾母跟前，控身陪笑说：“这张爷爷进来请安。”|贾珍到贾母跟前，弯着身子赔笑说：“这位张爷爷进来请安。”
贾母听了，忙道：“搀他来。”贾珍忙去搀了过来。|贾母听了，忙说：“扶他过来。”贾珍赶紧去把他扶了过来。
那张道士先哈哈笑道：“无量寿佛！老祖宗一向福寿安康？众位奶奶小姐纳福？|张道士先哈哈笑道：“无量寿佛！老祖宗一向福寿安康？各位奶奶小姐都好？
一向没到府里请安，老太太气色越发好了。”|一直没到府上请安，老太太气色越发好了。”
贾母笑道：“老神仙，你好？”|贾母笑道：“老神仙，你好吗？”
张道士笑道：“托老太太万福万寿，小道也还康健。|张道士笑道：“托老太太的万福万寿，小道还算健康。
别的倒罢，只记挂著哥儿，一向身上好？|别的倒罢了，只惦记着哥儿，一向身体好吗？
前日四月二十六日，我这里做遮天大王的圣诞，人也来的少，东西也很干净，我说请哥儿来逛逛，怎么说不在家？”|前些天四月二十六日，我这里给遮天大王过圣诞，人来得少，东西也干净，我说请哥儿来逛逛，怎么说不在家？”
贾母说道：“果真不在家。”一面回头叫宝玉。|贾母说：“真的不在家。”一边回头叫宝玉。
谁知宝玉解手去了才来，忙上前问：“张爷爷好？”|谁知宝玉刚解手回来，连忙上前问：“张爷爷好？”
张道士忙抱住问了好，又向贾母笑道：“哥儿越发发福了。”|张道士连忙抱住他问好，又对贾母笑道：“哥儿越发胖了。”
贾母道：“他外头好，里头弱。|贾母说：“他外面看着好，里面弱。
又搭著他老子逼著他念书，生生的把个孩子逼出病来了。”|再加上他老子逼着他念书，硬生生把个孩子逼出病来了。”
张道士道：“前日我在好几处看见哥儿写的字，作的诗，都好的了不得，|张道士说：“前些天我在好几处看见哥儿写的字、作的诗，都好得不得了，
怎么老爷还抱怨说哥儿不大喜欢念书呢？依小道看来，也就罢了。”|怎么老爷还抱怨哥儿不大喜欢念书呢？依小道看，也就够了。”
又叹道：“我看见哥儿的这个形容身段，言谈举动，怎么就同当日国公爷一个稿子！”|又叹道：“我看哥儿这模样身段、言谈举止，怎么跟当年国公爷一个样子！”
说著两眼流下泪来。|说着两眼流下泪来。
贾母听说，也由不得满脸泪痕，说道：|贾母听了，也不由得满脸泪痕，说：
“正是呢，我养这些儿子孙子，也没一个像他爷爷的，就只这玉儿像他爷爷。”|“可不是吗，我养了这些儿子孙子，没一个像他爷爷的，就只有这玉儿像他爷爷。”
! 四月二十六日正是上一回饯花、黛玉葬花的那一天。同一天，园里葬花，观里做寿，两处热闹两处悲。
! 张道士最会说话：先说想念宝玉，再夸宝玉的字诗，再说宝玉像国公爷，句句说到贾母心坎上。他这样铺垫，是为了下面提亲。
! 贾母说只有宝玉像他爷爷，这是贾母偏疼宝玉的根由。

# 九、张道士提亲
那张道士又向贾珍道：“当日国公爷的模样儿，爷们一辈的不用说，自然没赶上，|张道士又对贾珍说：“当年国公爷的模样，你们这一辈的不用说，自然没赶上，
大约连大老爷，二老爷也记不清楚了。”|大概连大老爷、二老爷也记不清了。”
说毕呵呵又一大笑，道：“前日在一个人家看见一位小姐，今年十五岁了，生的倒也好个模样儿。|说完又呵呵大笑，说：“前些天在一户人家看见一位小姐，今年十五岁了，长得模样倒也很好。
我想著哥儿也该寻亲事了。|我想着哥儿也该找亲事了。
若论这个小姐模样儿，聪明智慧，根基家当，倒也配的过。|要论这位小姐的模样、聪明才智、门第家产，倒也配得上。
但不知老太太怎么样，小道也不敢造次。|只是不知老太太意下如何，小道也不敢冒失。
等请了老太太的示下，才敢向人去说。”|等请了老太太的意思，才敢去跟人家说。”
贾母道：“上回有和尚说了，这孩子命里不该早娶，等再大一大儿再定罢。|贾母说：“上回有个和尚说了，这孩子命里不该早娶，等再大一点再定吧。
你可如今打听著，不管他根基富贵，只要模样配的上就好，来告诉我。|你现在可以打听着，不管人家门第贵贱，只要模样配得上就好，来告诉我。
便是那家子穷，不过给他几两银子罢了。只是模样性格儿难得好的。”|就算那家穷，不过给他们几两银子罢了。只是模样性格好的难得。”
! 贾母说“不管他根基富贵，只要模样配的上”，不看门第，只看人品容貌。黛玉父母双亡、没有家底，贾母这话对她是有利的。
! 宝钗家是皇商，有钱有势。贾母偏偏说不看“根基富贵”，有人认为这是在回绝薛家的“金玉”之说。

# 十、凤姐打趣张道士
说毕，只见凤姐儿笑道：“张爷爷，我们丫头的寄名符儿你也不换去。|说完，只听凤姐笑道：“张爷爷，我们丫头的寄名符你也不换去。
前儿亏你还有那么大脸，打发人和我要鹅黄缎子去！|前些天亏你还有那么大的脸，打发人来找我要鹅黄缎子！
要不给你，又恐怕你那老脸上过不去。”|要是不给你，又怕你那张老脸挂不住。”
张道士呵呵大笑道：“你瞧，我眼花了，也没看见奶奶在这里，也没道多谢。|张道士呵呵大笑道：“你看，我眼花了，也没看见奶奶在这里，也没道谢。
符早已有了，前日原要送去的，不指望娘娘来作好事，就混忘了，还在佛前镇著。待我取来。”|符早就有了，前些天本来要送去的，没想到娘娘来做善事，就忘了，还在佛前供着。等我去取来。”
说著跑到大殿上去，一时拿了一个茶盘，搭著大红蟒缎经袱子，托出符来。|说着跑到大殿上去，一会儿拿来一个茶盘，盘上铺着大红蟒缎经袱，托着符出来。
大姐儿的奶子接了符。|大姐儿的奶妈接过符。
张道士方欲抱过大姐儿来，只见凤姐笑道：“你就手里拿出来罢了，又用个盘子托著。”|张道士正要把大姐儿抱过来，只听凤姐笑道：“你直接用手拿出来就是了，还用个盘子托着。”
张道士道：“手里不干不净的，怎么拿，用盘子洁净些。”|张道士说：“手上不干不净的，怎么拿？用盘子干净些。”
凤姐儿笑道：“你只顾拿出盘子来，倒唬我一跳。我不说你是为送符，倒象是和我们化布施来了。”|凤姐笑道：“你这一拿出盘子来，倒吓我一跳。我还以为你不是来送符，倒像是来跟我们化缘了。”
众人听说，哄然一笑，连贾珍也掌不住笑了。|大家听了，哄堂大笑，连贾珍也忍不住笑了。
贾母回头道：“猴儿猴儿，你不怕下割舌头地狱？”|贾母回头说：“猴儿猴儿，你不怕下割舌头地狱？”
凤姐儿笑道：“我们爷儿们不相干。他怎么常常的说我该积阴骘，迟了就短命呢！”|凤姐笑道：“我们爷儿俩之间不要紧。他怎么常常说我该积阴德，晚了就短命呢！”
! 寄名符是把孩子“寄名”给神佛，求保平安。大姐儿就是后来的巧姐。
! 凤姐一句玩笑，打断了提亲的话头。张道士说亲正在要紧处，凤姐偏偏岔开，是有意还是无意，书中不说。
! 张道士说凤姐“迟了就短命”，凤姐当笑话说出来。她后来果然“机关算尽太聪明，反算了卿卿性命”。

# 十一、请玉
张道士也笑道：“我拿出盘子来一举两用，却不为化布施，倒要将哥儿的这玉请了下来，|张道士也笑道：“我拿出盘子来是一举两得，倒不是为化缘，是要把哥儿这块玉请下来，
托出去给那些远来的道友并徒子徒孙们见识见识。”|托出去给那些远道而来的道友和徒子徒孙们见识见识。”
贾母道：“既这们著，你老人家老天拔地的跑什么，就带他去瞧了，叫他进来，岂不省事？”|贾母说：“既然这样，你老人家这么大年纪跑来跑去做什么，就带他去给他们看，再叫他回来，岂不省事？”
张道士道：“老太太不知道，看著小道是八十多岁的人，托老太太的福倒也健壮，|张道士说：“老太太不知道，别看小道八十多岁了，托老太太的福倒还健壮，
二则外面的人多，气味难闻，况是个暑热的天，哥儿受不惯，倘或哥儿受了腌臜气味，倒值多了。”|二来外面人多，气味难闻，又是大热天，哥儿受不惯，万一哥儿受了脏气，那就不值了。”
贾母听说，便命宝玉摘下通灵玉来，放在盘内。|贾母听了，就叫宝玉摘下通灵玉，放在盘子里。
那张道士兢兢业业的用蟒袱子垫著，捧了出去。|张道士小心翼翼地用蟒缎经袱垫着，捧了出去。
这里贾母与众人各处游玩了一回，方去上楼。|这边贾母和众人各处游玩了一会儿，才去上楼。
只见贾珍回说：“张爷爷送了玉来了。”|只见贾珍来回说：“张爷爷把玉送回来了。”
刚说著，只见张道士捧了盘子，走到跟前笑道：|刚说着，只见张道士捧着盘子走到跟前笑道：
“众人托小道的福，见了哥儿的玉，实在可罕。|“大家托小道的福，见了哥儿的玉，实在稀罕。
都没什么敬贺之物，这是他们各人传道的法器，都愿意为敬贺之礼。|都没有什么贺礼，这是他们各人传道的法器，都愿意拿来作为贺礼。
哥儿便不希罕，只留著在房里顽耍赏人罢。”|哥儿就算不稀罕，也留着在房里玩，或者赏人吧。”
贾母听说，向盘内看时，只见也有金璜，也有玉玦，或有事事如意，或有岁岁平安，|贾母听了，往盘里一看，只见有金璜，有玉玦，有“事事如意”的，有“岁岁平安”的，
皆是珠穿宝贯，玉琢金镂，共有三五十件。|都是珍珠串、宝石嵌，玉雕金镂，一共有三五十件。
因说道：“你也胡闹。他们出家人是那里来的，何必这样，这不能收。”|就说：“你也胡闹。他们出家人哪里来的这些，何必这样，这不能收。”
张道士笑道：“这是他们一点敬心，小道也不能阻挡。|张道士笑道：“这是他们一点敬意，小道也拦不住。
老太太若不留下，岂不叫他们看著小道微薄，不象是门下出身了。”|老太太要是不收，岂不叫他们觉得小道没面子，不像是府上出来的人了。”
贾母听如此说，方命人接了。|贾母听他这么说，才叫人接了。
! 出家人拿出三五十件金玉宝物，说是“传道的法器”。这些东西是从哪里来的，贾母一问就点破了。这其实是道观借机巴结贾府。

# 十二、宝玉要散给穷人
宝玉笑道：“老太太，张爷爷既这么说，又推辞不得，我要这个也无用，|宝玉笑道：“老太太，张爷爷既然这么说，又推辞不掉，我要这些也没用，
不如叫小子们捧了这个，跟著我出去散给穷人罢。”|不如叫小厮们捧着，跟我出去散给穷人吧。”
贾母笑道：“这倒说的是。”|贾母笑道：“这话倒说得对。”
张道士又忙拦道：“哥儿虽要行好，但这些东西虽说不甚希奇，到底也是几件器皿。|张道士又连忙拦着说：“哥儿虽然要行善，可这些东西虽说不算稀奇，到底也是几件器物。
若给了乞丐，一则与他们无益，二则反倒遭塌了这些东西。|要是给了乞丐，一来对他们没用，二来反倒糟蹋了这些东西。
要舍给穷人，何不就散钱与他们。”|要施舍穷人，何不直接散钱给他们。”
宝玉听说，便命收下，等晚间拿钱施舍罢了。|宝玉听了，就叫人收下，等晚上拿钱施舍好了。
说毕，张道士方退出去。|说完，张道士才退了出去。
! 宝玉要把金玉散给乞丐，是他的天真，也是他不看重这些身外之物。张道士说给乞丐“无益”，倒也是实话。

# 十三、神前拈戏
这里贾母与众人上了楼，在正面楼上归坐。|这边贾母和众人上了楼，在正面楼上坐下。
凤姐等占了东楼。众丫头等在西楼，轮流伺候。|凤姐等人占了东楼。丫头们在西楼，轮流伺候。
贾珍一时来回：“神前拈了戏，头一本《白蛇记》。”|一会儿贾珍来回话：“在神前抽签点了戏，头一本是《白蛇记》。”
贾母问“《白蛇记》是什么故事？”|贾母问：“《白蛇记》是什么故事？”
贾珍道：“是汉高祖斩蛇方起首的故事。第二本是《满床笏》。”|贾珍说：“是汉高祖斩白蛇起兵开国的故事。第二本是《满床笏》。”
贾母笑道：“这倒是第二本上？也罢了。神佛要这样，也只得罢了。”|贾母笑道：“这倒排在第二本？也罢了。神佛要这样，也只好这样。”
又问第三本，贾珍道：“第三本是《南柯梦》。”|又问第三本，贾珍说：“第三本是《南柯梦》。”
贾母听了便不言语。|贾母听了就不说话了。
贾珍退了下来，至外边预备著申表，焚钱粮，开戏，不在话下。|贾珍退下来，到外面准备上表、烧纸钱、开戏。
! 这三本戏是贾家的命运：《白蛇记》是汉高祖起兵开国，好比贾家祖上随皇帝打天下；《满床笏》是郭子仪七子八婿都做高官，笏板堆满一床，好比贾家眼下的鼎盛；《南柯梦》是一场富贵大梦，醒来一场空，就是贾家的结局。
! 贾母听到《满床笏》排第二，笑说“也罢了”；听到《南柯梦》，就不说话了。她是明白人，听出了不祥。

# 十四、金麒麟
且说宝玉在楼上，坐在贾母旁边，因叫个小丫头子捧著方才那一盘子贺物，|宝玉在楼上坐在贾母旁边，叫一个小丫头捧着刚才那一盘贺礼，
将自己的玉带上，用手翻弄寻拨，一件一件的挑与贾母看。|把自己的玉戴上，用手翻来翻去，一件一件挑出来给贾母看。
贾母因看见有个赤金点翠的麒麟，便伸手拿了起来，笑道：“这件东西好象我看见谁家的孩子也带著这么一个的。”|贾母看见有一个赤金点翠的麒麟，就伸手拿起来，笑道：“这件东西，好像我看见谁家的孩子也戴着这么一个。”
宝钗笑道：“史大妹妹有一个，比这个小些。”|宝钗笑道：“史大妹妹有一个，比这个小些。”
贾母道：“是云儿有这个。”|贾母说：“是云儿有这个。”
宝玉道：“他这么往我们家去住著，我也没看见。”|宝玉说：“她这么常到我们家来住，我也没看见过。”
探春笑道：“宝姐姐有心，不管什么他都记得。”|探春笑道：“宝姐姐有心，不管什么她都记得。”
林黛玉冷笑道：“他在别的上还有限，惟有这些人带的东西上越发留心。”|林黛玉冷笑道：“她在别的事上还有限，唯独在别人戴的东西上格外留心。”
宝钗听说，便回头装没听见。|宝钗听了，就回过头去装没听见。
宝玉听见史湘云有这件东西，自己便将那麒麟忙拿起来揣在怀里。|宝玉听说史湘云有这样东西，自己就赶紧把那麒麟拿起来揣进怀里。
一面心里又想到怕人看见他听见史湘云有了，他就留这件，因此手里揣著，却拿眼睛瞟人。|一边心里又怕别人看出他是因为听说史湘云有，才留下这一件，所以手里揣着，眼睛却瞟着别人。
只见众人都倒不大理论，惟有林黛玉瞅著他点头儿，似有赞叹之意。|只见大家都不怎么在意，只有林黛玉瞅着他点头，好像在“赞叹”。
宝玉不觉心里没好意思起来，又掏了出来，向黛玉笑道：|宝玉不由得心里不好意思起来，又掏出来，对黛玉笑道：
“这个东西倒好顽，我替你留著，到了家穿上你带。”|“这个东西倒好玩，我替你留着，到家穿上绳给你戴。”
林黛玉将头一扭，说道：“我不希罕。”|林黛玉把头一扭，说：“我不稀罕。”
宝玉笑道：“你果然不希罕，我少不得就拿著。”说著又揣了起来。|宝玉笑道：“你真不稀罕，我就只好自己拿着了。”说着又揣了起来。
! 这个金麒麟极重要，就是第三十一回回目“因麒麟伏白首双星”的那一只。宝玉后来把它弄丢了，偏偏被史湘云捡到。
! 黛玉说宝钗“惟有这些人带的东西上越发留心”，是讽刺宝钗时时留心宝玉的玉，因为她有金锁。宝钗听见了，装没听见。
! 宝钗有金锁，湘云有金麒麟，“金”都配“玉”。黛玉什么金器也没有，所以她最怕的就是“金”。

# 十五、各家送礼
刚要说话，只见贾珍贾蓉的妻子婆媳两个来了，彼此见过，|刚要说话，只见贾珍、贾蓉的妻子婆媳两个来了，彼此见过，
贾母方说：“你们又来做什么，我不过没事来逛逛。”|贾母才说：“你们又来做什么，我不过没事来逛逛。”
一句话没说了，只见人报：“冯将军家有人来了。”|一句话还没说完，只听人报：“冯将军家有人来了。”
原来冯紫英家听见贾府在庙里打醮，连忙预备了猪羊香烛茶银之类的东西送礼。|原来冯紫英家听说贾府在庙里做法事，连忙准备了猪羊、香烛、茶叶、银子之类的东西来送礼。
凤姐儿听了，忙赶过正楼来，拍手笑道：“嗳呀！我就不防这个。|凤姐听了，赶紧来到正楼，拍手笑道：“哎呀！我就没防着这个。
只说咱们娘儿们来闲逛逛，人家只当咱们大摆斋坛的来送礼。|只说咱们娘儿们来闲逛逛，人家还当咱们大摆斋坛，都来送礼了。
都是老太太闹的。这又不得不预备赏封儿。”|都是老太太闹的。这又不得不准备赏钱了。”
刚说了，只见冯家的两个管家娘子上楼来了。|刚说完，只见冯家的两个管家娘子上楼来了。
冯家两个未去，接著赵侍郎也有礼来了。|冯家的两个还没走，接着赵侍郎家也送礼来了。
于是接二连三，都听见贾府打醮，女眷都在庙里，凡一应远亲近友，世家相与都来送礼。|于是接二连三，凡是听说贾府做法事、女眷都在庙里的，所有远亲近友、世交来往的人家都来送礼。
贾母才后悔起来，说：“又不是什么正经斋事，我们不过闲逛逛，就想不到这礼上，没的惊动了人。”|贾母这才后悔起来，说：“又不是什么正经斋事，我们不过闲逛逛，就没想到会有人送礼，平白惊动了人家。”
因此虽看了一天戏，至下午便回来了，次日便懒怠去。|因此虽然看了一天戏，到下午就回来了，第二天就懒得去了。
凤姐又说：“打墙也是动土，已经惊动了人，今儿乐得还去逛逛。|凤姐又说：“打墙也是动土，反正已经惊动了人，今天乐得再去逛逛。”
那贾母因昨日张道士提起宝玉说亲的事来，|贾母因为昨天张道士提起给宝玉说亲的事，
谁知宝玉一日心中不自在，回家来生气，嗔著张道士与他说了亲，|谁知宝玉一整天心里不痛快，回家来生气，怪张道士给他说亲，
口口声声说从今以后不再见张道士了，别人也并不知为什么原故，|口口声声说从今以后再也不见张道士了，别人也不知道是什么缘故，
二则林黛玉昨日回家又中了暑：|二来林黛玉昨天回家又中了暑：
因此二事，贾母便执意不去了。|因为这两件事，贾母就执意不去了。
凤姐见不去，自己带了人去，也不在话下。|凤姐见贾母不去，自己带人去了，不必细说。
! 贾府一出门，满城的世家都来送礼。这是贾家势力的鼎盛时刻，也是《满床笏》的现实版。
! 宝玉一听说亲就恼了，“不再见张道士”。黛玉回家就中了暑。两人一个生气、一个生病，为的都是同一件事。

# 十六、宝玉黛玉又吵起来
且说宝玉因见林黛玉又病了，心里放不下，饭也懒去吃，不时来问。|宝玉见林黛玉又病了，心里放不下，饭也懒得吃，时时来问候。
林黛玉又怕他有个好歹，因说道：“你只管看你的戏去，在家里作什么？”|林黛玉又怕他有个好歹，就说：“你只管去看你的戏，在家里做什么？”
宝玉因昨日张道士提亲，心中大不受用，今听见林黛玉如此说，心里因想道：|宝玉因为昨天张道士提亲，心里很不痛快，现在听林黛玉这么说，心里就想：
“别人不知道我的心还可恕，连他也奚落起我来。”|“别人不知道我的心还可以原谅，连她也来讽刺我。”
因此心中更比往日的烦恼加了百倍。|因此心里比往常烦恼了一百倍。
若是别人跟前，断不能动这肝火，只是林黛玉说了这话，倒比往日别人说这话不同，|要是在别人面前，绝不会动这样的肝火，只是林黛玉说了这话，比平时别人说这话感觉不一样，
由不得立刻沉下脸来，说道：“我白认得了你。罢了，罢了！”|不由得立刻沉下脸来，说：“我白认识你了。罢了，罢了！”
林黛玉听说，便冷笑了两声，“我也知道白认得了我，那里象人家有什么配的上呢。”|林黛玉听了，冷笑两声说：“我也知道你白认识我了，哪里像人家有什么配得上的东西呢。”
宝玉听了，便向前来直问到脸上：“你这么说，是安心咒我天诛地灭？”|宝玉听了，就上前凑到她脸跟前直问：“你这么说，是存心咒我天诛地灭？”
林黛玉一时解不过这个话来。|林黛玉一时没明白这话的意思。
宝玉又道：“昨儿还为这个赌了几回咒，今儿你到底又准我一句。|宝玉又说：“昨天还为这个发了几回誓，今天你到底又拿这话来堵我。
我便天诛地灭，你又有什么益处？”|我就算天诛地灭了，你又有什么好处？”
林黛玉一闻此言，方想起上日的话来。|林黛玉一听这话，才想起前几天的话来。
今日原是自己说错了，又是著急，又是羞愧，便颤颤兢兢的说道：|今天原是自己说错了，又着急，又羞愧，就颤颤巍巍地说：
“我要安心咒你，我也天诛地灭。何苦来！|“我要是存心咒你，我也天诛地灭。何苦呢！
我知道，昨日张道士说亲，你怕阻了你的好姻缘，你心里生气，来拿我煞性子。”|我知道，昨天张道士说亲，你怕耽误了你的好姻缘，你心里生气，拿我来出气。”
! 前一回宝玉发过誓：心里若有“金玉”的念头就“天诛地灭”。黛玉说“人家有什么配的上”，又提起金玉，等于说他那个誓是假的，所以宝玉才说她“咒我天诛地灭”。
! 宝玉生气，是因为“连他也奚落起我来”。全世界都可以不懂他，只有黛玉不能不懂。

# 十七、两个假意，一个真心
原来那宝玉自幼生成有一种下流痴病，况从幼时和黛玉耳鬓厮磨，心情相对，|原来宝玉从小就有一种不入正道的痴病，再加上从小和黛玉耳鬓厮磨，心意相通，
及如今稍明时事，又看了那些邪书僻传，|到如今稍稍懂事了，又看了那些不正经的杂书野史，
凡远亲近友之家所见的那些闺英闱秀，皆未有稍及林黛玉者，|凡是在远亲近友家里见过的那些闺阁小姐，没有一个比得上林黛玉的，
所以早存了一段心事，只不好说出来，故每每或喜或怒，变尽法子暗中试探。|所以早就存了一段心事，只是不好说出来，所以常常时喜时怒，想尽办法暗中试探。
那林黛玉偏生也是个有些痴病的，也每用假情试探。|林黛玉偏偏也是个有些痴病的，也常常用假意来试探。
因你也将真心真意瞒了起来，只用假意，我也将真心真意瞒了起来，只用假意，|因为你也把真心藏起来，只用假意；我也把真心藏起来，只用假意，
如此两假相逢，终有一真。|这样两个假意碰在一起，终究有一个真心在里面。
其间琐琐碎碎，难保不有口角之争。|这中间琐琐碎碎，难免会有口角争吵。
即如此刻，宝玉的心内想的是：|就像这会儿，宝玉心里想的是：
“别人不知我的心，还有可恕，难道你就不想我的心里眼里只有你！|“别人不知道我的心，还可以原谅，难道你就不想想我心里眼里只有你！
你不能为我烦恼，反来以这话奚落堵我。|你不能替我解烦恼，反而拿这话来讽刺我、堵我。
可见我心里一时一刻白有你，你竟心里没我。”|可见我心里时时刻刻白有你了，你心里竟没有我。”
心里这意思，只是口里说不出来。|心里这个意思，只是嘴上说不出来。
那林黛玉心里想著：“你心里自然有我，虽有‘金玉相对’之说，你岂是重这邪说不重我的。|林黛玉心里想的是：“你心里自然有我，虽然有‘金玉相配’的说法，你难道会看重这种歪理而不看重我吗？
我便时常提这‘金玉’，你只管了然自若无闻的，方见得是待我重，而毫无此心了。|我就算常常提‘金玉’，你只管坦然自若、当没听见，才见得你待我好，心里一点没有这个念头。
如何我只一提‘金玉’的事，你就著急，可知你心里时时有‘金玉’，|怎么我只要一提‘金玉’，你就着急，可见你心里时时刻刻有‘金玉’，
见我一提，你又怕我多心，故意著急，安心哄我。”|见我一提，你又怕我多心，所以故意着急，存心哄我。”
! 作者在这里停下故事，直接替两人剖白心思。“两假相逢，终有一真”，是宝黛爱情最准确的写照。
! 宝玉恼黛玉不信他，黛玉恼宝玉太着急。一个着急是因为在乎，一个看他着急又疑心他心虚。

# 十八、求近反远
看来两个人原本是一个心，但都多生了枝叶，反弄成两个心了。|看来两个人原本是一条心，只是都多生出些枝枝叶叶，反倒弄成了两条心。
那宝玉心中又想著：“我不管怎么样都好，只要你随意，我便立刻因你死了也情愿。|宝玉心里又想：“我不管怎样都好，只要你称心，我就算立刻为你死了也情愿。
你知也罢，不知也罢，只由我的心，可见你方和我近，不和我远。”|你知道也好，不知道也好，只要随我的心，这才见得你和我亲近，不和我疏远。”
那林黛玉心里又想著：“你只管你，你好我自好，你何必为我而自失。|林黛玉心里又想：“你只管顾你自己，你好了我自然就好，你何必为了我而失了自己。
殊不知你失我自失。可见是你不叫我近你，有意叫我远你了。”|殊不知你失了自己，我也就失了自己。可见是你不让我亲近你，有意让我疏远你了。”
如此看来，却都是求近之心，反弄成疏远之意。|这样看来，两人都是想要亲近的心，反倒弄成了疏远的意思。
如此之话，皆他二人素习所存私心，也难备述。|这些话，都是他们两人平时藏在心里的私心话，也难以一一细说。
! “你失我自失”：你若为我伤了自己，我也就跟着伤了。这是黛玉最深的情，也是她最怕的事。
! “求近之心，反弄成疏远之意”，一句话说尽了宝黛之间所有的争吵。

# 十九、宝玉砸玉
如今只述他们外面的形容。|现在只说他们外表的样子。
那宝玉又听见他说”好姻缘”三个字，越发逆了己意，心里干噎，口里说不出话来，|宝玉又听见她说“好姻缘”三个字，越发不合自己的心意，心里堵得慌，嘴里说不出话来，
便赌气向颈上抓下通灵宝玉，咬牙恨命往地下一摔，道：“什么捞什骨子，我砸了你完事！”|就赌气从脖子上抓下通灵宝玉，咬着牙狠命往地上一摔，说：“什么破东西，我砸了你就完了！”
偏生那玉坚硬非常，摔了一下，竟文风没动。|偏偏那玉非常坚硬，摔了一下，竟然纹丝没动。
宝玉见没摔碎，便回身找东西来砸。|宝玉见没摔碎，就回身找东西来砸。
林黛玉见他如此，早已哭起来，说道：“何苦来，你摔砸那哑吧物件。有砸他的，不如来砸我。”|林黛玉见他这样，早就哭起来了，说：“何苦呢，你摔那不会说话的东西做什么。有砸它的工夫，不如来砸我。”
二人闹著，紫鹃雪雁等忙来解劝。|两人闹着，紫鹃、雪雁等人连忙来劝。
后来见宝玉下死力砸玉，忙上来夺，又夺不下来，|后来见宝玉下死劲砸玉，赶紧上来抢，又抢不下来，
见比往日闹的大了，少不得去叫袭人。|见比往常闹得大，只好去叫袭人。
袭人忙赶了来，才夺了下来。|袭人赶紧跑来，才把玉抢了下来。
宝玉冷笑道：“我砸我的东西，与你们什么相干！”|宝玉冷笑道：“我砸我的东西，跟你们有什么相干！”
! 这是宝玉第二次摔玉。第一次是第三回初见黛玉，听说黛玉没有玉就摔了。两次摔玉都是为了黛玉。
! 玉是“金玉良缘”的“玉”，宝玉要砸的其实是那个“金玉”之说。可玉“坚硬非常”，砸不碎，就像那桩婚姻，他想甩也甩不掉。

# 二十、四人对泣
袭人见他脸都气黄了，眼眉都变了，从来没气的这样，便拉著他的手，笑道：|袭人见他脸都气黄了，眉眼都变了样，从来没气成这样过，就拉着他的手笑道：
“你同妹妹拌嘴，不犯著砸他，倘或砸坏了，叫他心里脸上怎么过的去？”|“你和妹妹拌嘴，犯不着砸它。万一砸坏了，叫她心里脸上怎么过得去？”
林黛玉一行哭著，一行听了这话说到自己心坎儿上来，可见宝玉连袭人不如，越发伤心大哭起来。|林黛玉一边哭，一边听这话说到了自己心坎上，可见宝玉还不如袭人懂她，越发伤心大哭起来。
心里一烦恼，方才吃的香薷饮解暑汤便承受不住，”哇”的一声都吐了出来。|心里一烦，刚才喝的香薷饮解暑汤就压不住了，“哇”的一声全吐了出来。
紫鹃忙上来用手帕子接住，登时一口一口的把一块手帕子吐湿。|紫鹃连忙上来用手帕接住，一口一口地，一块手帕立刻就吐湿了。
雪雁忙上来捶。|雪雁连忙上来给她捶背。
紫鹃道：“虽然生气，姑娘到底也该保重著些。|紫鹃说：“虽然生气，姑娘到底也该保重些。
才吃了药好些，这会子因和宝二爷拌嘴，又吐出来。|刚吃了药好些，这会儿因为和宝二爷拌嘴，又吐出来了。
倘或犯了病，宝二爷怎么过的去呢？”|万一犯了病，宝二爷怎么过意得去呢？”
宝玉听了这话说到自己心坎儿上来，可见黛玉不如一紫鹃。|宝玉听这话说到了自己心坎上，可见黛玉还不如紫鹃懂他。
又见林黛玉脸红头胀，一行啼哭，一行气凑，一行是泪，一行是汗，不胜怯弱。|又见林黛玉脸红头胀，一边哭，一边喘，一边流泪，一边出汗，十分虚弱。
宝玉见了这般，又自己后悔方才不该同他较证，这会子他这样光景，我又替不了他。|宝玉见她这样，又后悔刚才不该和她争，这会儿她这样子，我又替不了她。
心里想著，也由不的滴下泪来了。|心里想着，也不由得掉下泪来。
袭人见他两个哭，由不得守著宝玉也心酸起来，又摸著宝玉的手冰凉，|袭人见他们两个哭，守着宝玉也不由得心酸起来，又摸到宝玉的手冰凉，
待要劝宝玉不哭罢，一则又恐宝玉有什么委曲闷在心里，二则又恐薄了林黛玉。|想劝宝玉别哭，一来怕宝玉有委屈闷在心里，二来又怕怠慢了林黛玉。
不如大家一哭，就丢开手了，因此也流下泪来。|不如大家哭一场，也就算了，所以也流下泪来。
紫鹃一面收拾了吐的药，一面拿扇子替林黛玉轻轻的扇著，|紫鹃一边收拾吐出来的药，一边拿扇子给林黛玉轻轻扇着，
见三个人都鸦雀无声，各人哭各人的，也由不得伤心起来，也拿手帕子擦泪。|见三个人都不出声，各哭各的，也不由得伤心起来，也拿手帕擦眼泪。
四个人都无言对泣。|四个人都默默相对而哭。
! 黛玉觉得“宝玉连袭人不如”，宝玉觉得“黛玉不如一紫鹃”。两人都在旁人的话里听出了自己想说却说不出的话。
! 袭人说的是黛玉的心，紫鹃说的是宝玉的心。两个丫头都懂，偏偏当事的两人互相不懂。

# 二十一、黛玉剪穗子
一时，袭人勉强笑向宝玉道：“你不看别的，你看看这玉上穿的穗子，也不该同林姑娘拌嘴。”|过了一会儿，袭人勉强笑着对宝玉说：“你不看别的，看看这玉上穿的穗子，也不该和林姑娘拌嘴。”
林黛玉听了，也不顾病，赶来夺过去，顺手抓起一把剪子来要剪。|林黛玉听了，也顾不上病，赶过来抢过去，顺手抓起一把剪子就要剪。
袭人紫鹃刚要夺，已经剪了几段。|袭人、紫鹃刚要去抢，已经剪成了几段。
林黛玉哭道：“我也是白效力。他也不希罕，自有别人替他再穿好的去。”|林黛玉哭道：“我也是白费力气。他也不稀罕，自有别人替他再穿更好的去。”
袭人忙接了玉道：“何苦来，这是我才多嘴的不是了。”|袭人连忙接过玉来说：“何苦呢，这是我刚才多嘴的错了。”
宝玉向林黛玉道：“你只管剪，我横竖不带他，也没什么。”|宝玉对林黛玉说：“你只管剪，我反正不戴它，也没什么。”
! 玉上的穗子是黛玉亲手穿的。袭人本想提醒宝玉念着黛玉的好，却反而让黛玉剪了。
! “自有别人替他再穿好的去”，第三十五回果然是宝钗叫莺儿给宝玉的玉打了一根金线络子。黛玉的话一语成谶。

# 二十二、惊动贾母
只顾里头闹，谁知那些老婆子们见林黛玉大哭大吐，宝玉又砸玉，不知道要闹到什么田地，|里面只顾着闹，谁知那些老婆子见林黛玉大哭大吐，宝玉又砸玉，不知道要闹到什么地步，
倘或连累了他们，便一齐往前头回贾母王夫人知道，好不干连了他们。|怕连累到她们，就一齐到前面去告诉了贾母、王夫人，好撇清自己。
那贾母王夫人见他们忙忙的作一件正经事来告诉，也都不知有了什么大祸，便一齐进园来瞧他兄妹。|贾母、王夫人见她们慌慌张张当一件大事来报告，也不知出了什么大祸，就一齐进园来看他们兄妹。
急的袭人抱怨紫鹃为什么惊动了老太太，太太，紫鹃又只当是袭人去告诉的，也抱怨袭人。|急得袭人怪紫鹃为什么惊动了老太太、太太，紫鹃又以为是袭人去告诉的，也怪袭人。
那贾母，王夫人进来，见宝玉也无言，林黛玉也无话，问起来又没为什么事，|贾母、王夫人进来，见宝玉不说话，林黛玉也不说话，问起来又说没什么事，
便将这祸移到袭人紫鹃两个人身上，说”为什么你们不小心伏侍，这会子闹起来都不管了！”|就把这场祸转到袭人、紫鹃两人身上，说：“你们为什么不小心伺候，这会儿闹起来都不管了！”
因此将他二人连骂带说教训了一顿。|因此把她们两个连骂带说教训了一顿。
二人都没话，只得听著。|两人都没话说，只好听着。
还是贾母带出宝玉去了，方才平服。|还是贾母把宝玉带了出去，才平息下来。
! 主子吵架，丫头挨骂。老婆子们怕“连累”自己，先去告状，袭人紫鹃白白受了一顿教训。

# 二十三、“不是冤家不聚头”
过了一日，至初三日，乃是薛蟠生日，家里摆酒唱戏，来请贾府诸人。|过了一天，到了初三，是薛蟠的生日，家里摆酒唱戏，来请贾府的人。
宝玉因得罪了林黛玉，二人总未见面，心中正自后悔，无精打采的，那里还有心肠去看戏，因而推病不去。|宝玉因为得罪了林黛玉，两人一直没见面，心里正后悔，没精打采的，哪还有心思去看戏，就推说病了不去。
林黛玉不过前日中了些暑溽之气，本无甚大病，听见他不去，心里想：|林黛玉不过是前天中了点暑气，本来没什么大病，听说他不去，心里想：
“他是好吃酒看戏的，今日反不去，自然是因为昨儿气著了。|“他是爱喝酒看戏的，今天反倒不去，自然是因为昨天气着了。
再不然，他见我不去，他也没心肠去。|要不然，就是他见我不去，他也没心思去。
只是昨儿千不该万不该剪了那玉上的穗子。|只是昨天千不该万不该剪了那玉上的穗子。
管定他再不带了，还得我穿了他才带。”|他一定不会再戴了，还得我给他穿好了他才会戴。”
因而心中十分后悔。|因此心里十分后悔。
那贾母见他两个都生了气，只说趁今儿那边看戏，他两个见了也就完了，不想又都不去。|贾母见他们两个都生了气，只想着趁今天那边看戏，他们两个见了面也就好了，没想到又都不去。
老人家急的抱怨说：“我这老冤家是那世里的孽障，偏生遇见了这么两个不省事的小冤家，没有一天不叫我操心。|老人家急得抱怨说：“我这个老冤家是哪辈子造的孽，偏偏遇上这么两个不懂事的小冤家，没有一天不叫我操心。
真是俗语说的，‘不是冤家不聚头’。|真是俗话说的，‘不是冤家不聚头’。
几时我闭了这眼，断了这口气，凭著这两个冤家闹上天去，我眼不见心不烦，也就罢了。|哪天我闭上这双眼、断了这口气，任凭这两个冤家闹翻了天，我眼不见心不烦，也就罢了。
偏又不咽这口气。”|偏偏又咽不下这口气。”
自己抱怨著也哭了。|自己抱怨着也哭了。
这话传入宝林二人耳内。|这话传到了宝玉、黛玉两人耳朵里。
原来他二人竟是从未听见过”不是冤家不聚头”的这句俗语，|原来他们两个竟然从没听过“不是冤家不聚头”这句俗话，
如今忽然得了这句话，好似参禅的一般，都低头细嚼此话的滋味，都不觉潸然泣下。|如今忽然听到这句话，就像参禅一样，都低着头细细品味这句话的滋味，都不由得流下泪来。
虽不曾会面，然一个在潇湘馆临风洒泪，一个在怡红院对月长吁，|虽然没有见面，可一个在潇湘馆对着风落泪，一个在怡红院对着月长叹，
却不是人居两地，情发一心！|这不正是人住两处，情出一心！
! 贾母说“不是冤家不聚头”，是把宝黛当作一对来说的。这句话从贾母口中说出，宝黛二人听了，比什么表白都重。
! 黛玉后悔剪了穗子，想着“还得我穿了他才带”。她心里早已原谅了宝玉。

# 二十四、袭人劝宝玉赔不是
袭人因劝宝玉道：“千万不是，都是你的不是，|袭人就劝宝玉说：“千错万错，都是你的错。
往日家里小厮们和他们的姊妹拌嘴，或是两口子分争，你听见了，你还骂小厮们蠢，不能体贴女孩儿们的心。|往常家里小厮们和他们的姐妹拌嘴，或是两口子吵架，你听见了，还骂小厮们蠢，不懂得体贴女孩儿的心。
今儿你也这么著了。|今天你也这样了。
明儿初五，大节下，你们两个再这们仇人似的，老太太越发要生气，一定弄的大家不安生。|后天初五，是大节日，你们两个再这样像仇人似的，老太太越发要生气，一定弄得大家都不安生。
依我劝，你正经下个气，陪个不是，大家还是照常一样，这么也好，那么也好。”|依我劝，你正经低个头，赔个不是，大家还像平常一样，这样也好，那样也好。”
那宝玉听见了不知依与不依，要知端详，且听下回分解。|宝玉听了，不知依还是不依，要知后事如何，请看下回。
! 回目“享福人福深还祷福，痴情女情重愈斟情”：享福人是贾母，已经享尽了福还要去观里祈福；痴情女是黛玉，情越深就越要掂量、越要试探。

# 一、紫鹃劝黛玉
话说林黛玉与宝玉角口后，也自后悔，但又无去就他之理，因此日夜闷闷，如有所失。|林黛玉和宝玉吵架以后，自己也后悔，可又没有去迁就他的道理，因此日夜闷闷不乐，好像丢了什么似的。
紫鹃度其意，乃劝道：“若论前日之事，竟是姑娘太浮躁了些。|紫鹃揣摩到她的心思，就劝道：“要说前天的事，还是姑娘太急躁了些。
别人不知宝玉那脾气，难道咱们也不知道的。为那玉也不是闹了一遭两遭了。”|别人不知道宝玉那脾气，难道咱们也不知道。为那块玉也不是闹了一回两回了。”
黛玉啐道：“你倒来替人派我的不是。我怎么浮躁了？”|黛玉啐道：“你倒来替别人数落我的不是。我怎么急躁了？”
紫鹃笑道：“好好的，为什么又剪了那穗子？岂不是宝玉只有三分不是，姑娘倒有七分不是。|紫鹃笑道：“好好的，为什么又剪了那穗子？这不是宝玉只有三分错，姑娘倒有七分错吗？
我看他素日在姑娘身上就好，皆因姑娘小性儿，常要歪派他，才这么样。”|我看他平日对姑娘就很好，都是因为姑娘使小性子，常常冤枉他，才弄成这样。”
! 紫鹃是全书里最敢说黛玉不是的人。“三分不是”对“七分不是”，说得透彻，却是一片真心为黛玉好。

# 二、宝玉上门赔罪
林黛玉正欲答话，只听院外叫门。|林黛玉正要回话，只听院外有人叫门。
紫鹃听了一听，笑道：“这是宝玉的声音，想必是来赔不是来了。”|紫鹃听了听，笑道：“这是宝玉的声音，想必是来赔不是的。”
林黛玉听了道：“不许开门！”|林黛玉听了说：“不许开门！”
紫鹃道：“姑娘又不是了。这么热天毒日头地下，晒坏了他如何使得呢！”|紫鹃说：“姑娘又不对了。这么热的天，大太阳底下，晒坏了他怎么得了！”
口里说著，便出去开门，果然是宝玉。|嘴里说着，就出去开门，果然是宝玉。
一面让他进来，一面笑道：“我只当是宝二爷再不上我们这门了，谁知这会子又来了。”|一边让他进来，一边笑道：“我还以为宝二爷再也不上我们家门了，谁知这会儿又来了。”
宝玉笑道：“你们把极小的事倒说大了。好好的为什么不来？|宝玉笑道：“你们把一点点小事倒说大了。好好的为什么不来？
我便死了，魂也要一日来一百遭。妹妹可大好了？”|我就是死了，魂也要一天来一百回。妹妹全好了吗？”
紫鹃道：“身上病好了，只是心里气不大好。”|紫鹃说：“身上的病好了，只是心里的气还没全消。”
宝玉笑道：“我晓得有什么气。”|宝玉笑道：“我知道她有什么气。”
一面说著，一面进来，只见林黛玉又在床上哭。|一边说，一边进来，只见林黛玉又在床上哭。
! 黛玉说“不许开门”，紫鹃偏去开门。上回晴雯不开门让黛玉伤心了一夜，这回黛玉不许开门，却被紫鹃打开了。

# 三、“你死了，我做和尚”
那林黛玉本不曾哭，听见宝玉来，由不得伤了心，止不住滚下泪来。|林黛玉本来没哭，一听见宝玉来了，不由得伤心起来，止不住掉下泪来。
宝玉笑著走近床来，道：“妹妹身上可大好了？”|宝玉笑着走到床前，说：“妹妹身体全好了吗？”
林黛玉只顾拭泪，并不答应。|林黛玉只顾擦眼泪，并不回答。
宝玉因便挨在床沿上坐了，一面笑道：“我知道妹妹不恼我。|宝玉就挨着床沿坐下，一边笑道：“我知道妹妹不恼我。
但只是我不来，叫旁人看著，倒象是咱们又拌了嘴的似的。|只是我不来，叫别人看着，倒像咱们又吵架了似的。
若等他们来劝咱们，那时节岂不咱们倒觉生分了？|要是等他们来劝咱们，那时候咱们岂不是倒显得生分了？
不如这会子，你要打要骂，凭著你怎么样，千万别不理我。”|不如趁现在，你要打要骂，随你怎么样，千万别不理我。”
说著，又把”好妹妹”叫了几万声。|说着，又把“好妹妹”叫了几万声。
林黛玉心里原是再不理宝玉的，这会子见宝玉说别叫人知道他们拌了嘴就生分了似的这一句话，|林黛玉心里本来是再也不理宝玉的，这会儿听宝玉说别叫人知道他们吵了架、显得生分了这句话，
又可见得比人原亲近，因又撑不住哭道：|又可见他们本来就比别人亲近，就又忍不住哭道：
“你也不用哄我。从今以后，我也不敢亲近二爷，二爷也全当我去了。”|“你也不用哄我。从今以后，我也不敢亲近二爷了，二爷就当我走了吧。”
宝玉听了笑道：“你往那去呢？”|宝玉听了笑道：“你往哪里去呢？”
林黛玉道：“我回家去。”|林黛玉说：“我回家去。”
宝玉笑道：“我跟了你去。”|宝玉笑道：“我跟你去。”
林黛玉道：“我死了。”|林黛玉说：“我死了。”
宝玉道：“你死了，我做和尚！”|宝玉说：“你死了，我就去做和尚！”
林黛玉一闻此言，登时将脸放下来，问道：“想是你要死了，胡说的是什么！|林黛玉一听这话，立刻沉下脸来，问道：“想必是你要死了，胡说些什么！
你家倒有几个亲姐姐亲妹妹呢，明儿都死了，你几个身子去作和尚？|你家里有好几个亲姐姐亲妹妹呢，明天都死了，你有几个身子去做和尚？
明儿我倒把这话告诉别人去评评。”|明天我倒要把这话告诉别人，让大家评评理。”
! “你死了，我做和尚”，这是宝玉第一次说出这样的话，等于以死相许。宝玉最后真的出了家。
! 黛玉立刻翻脸，是因为这话太重，男女之间说这种话，传出去就是丑事。她一面恼他说得太露骨，一面心里又何尝不明白。

# 四、黛玉摔帕子
宝玉自知这话说的造次了，后悔不来，登时脸上红胀起来，低著头不敢则一声。|宝玉知道这话说得太冒失了，后悔已经来不及，立刻脸涨得通红，低着头一声也不敢吭。
幸而屋里没人。|幸好屋里没有别人。
林黛玉直瞪瞪的瞅了他半天，气的一声儿也说不出来。|林黛玉直勾勾地瞪了他半天，气得一句话也说不出来。
见宝玉憋的脸上紫胀，便咬著牙用指头狠命的在他额颅上戳了一下，|见宝玉憋得脸都紫了，就咬着牙用手指狠狠在他额头上戳了一下，
哼了一声，咬牙说道：“你这——”|哼了一声，咬着牙说：“你这——”
刚说了两个字，便又叹了一口气，仍拿起手帕子来擦眼泪。|刚说了两个字，又叹了口气，仍旧拿起手帕擦眼泪。
宝玉心里原有无限的心事，又兼说错了话，正自后悔，|宝玉心里本来有无限的心事，又加上说错了话，正在后悔，
又见黛玉戳他一下，要说又说不出来，自叹自泣，因此自己也有所感，不觉滚下泪来。|又见黛玉戳了他一下，想说又说不出来，只是自己叹气、自己哭，因此自己也有所感触，不由得掉下泪来。
要用帕子揩拭，不想又忘了带来，便用衫袖去擦。|想用手帕擦，没想到又忘了带，就用衣袖去擦。
林黛玉虽然哭著，却一眼看见了，见他穿著簇新藕合纱衫，竟去拭泪，|林黛玉虽然在哭，却一眼看见了，见他穿着崭新的藕荷色纱衫，竟然用来擦眼泪，
便一面自己拭著泪，一面回身将枕边搭的一方绡帕子拿起来，向宝玉怀里一摔，一语不发，仍掩面自泣。|就一边自己擦着泪，一边回身把枕边搭着的一块绡帕拿起来，往宝玉怀里一摔，一句话不说，仍旧捂着脸哭。
宝玉见他摔了帕子来，忙接住拭了泪，又挨近前些，伸手拉了林黛玉一只手，笑道：|宝玉见她摔了帕子过来，连忙接住擦了泪，又凑近些，伸手拉住林黛玉一只手，笑道：
“我的五脏都碎了，你还只是哭。走罢，我同你往老太太跟前去。”|“我的五脏六腑都碎了，你还只是哭。走吧，我和你一起去老太太那里。”
林黛玉将手一摔道：“谁同你拉拉扯扯的。|林黛玉把手一甩说：“谁跟你拉拉扯扯的。
一天大似一天的，还这么涎皮赖脸的，连个道理也不知道。”|一天比一天大了，还这么嬉皮笑脸的，连个道理都不懂。”
! 黛玉骂“你这——”，骂不下去，只能叹气。她再气，看见宝玉用新衣裳擦泪，还是心疼，扔过帕子去。
! 这一摔帕子，是黛玉心软了。第三十四回宝玉送她两块旧帕子，她在帕子上题了三首诗。帕子在两人之间，是最私密的信物。

# 五、凤姐“黄鹰抓住鹞子的脚”
一句没说完，只听喊道：“好了！”|一句话还没说完，只听有人喊道：“好了！”
宝林二人不防，都唬了一跳，回头看时，只见凤姐儿跳了进来，笑道：|宝玉、黛玉两人没防备，都吓了一跳，回头一看，只见凤姐跳了进来，笑道：
“老太太在那里抱怨天抱怨地，只叫我来瞧瞧你们好了没有。|“老太太在那里怨天怨地，只叫我来看看你们和好了没有。
我说不用瞧，过不了三天，他们自己就好了。老太太骂我，说我懒。|我说不用看，过不了三天，他们自己就好了。老太太骂我，说我懒。
我来了，果然应了我的话了。|我来了，果然应了我的话。
也没见你们两个人有些什么可拌的，三日好了，两日恼了，越大越成了孩子了！|也没见你们两个有什么好吵的，三天好了，两天又恼了，越大越像小孩子了！
有这会子拉著手哭的，昨儿为什么又成了乌眼鸡呢！|这会儿拉着手哭，昨天为什么又成了斗红眼的乌鸡呢！
还不跟我走，到老太太跟前，叫老人家也放些心。”|还不跟我走，到老太太跟前去，叫老人家也放点心。”
说著拉了林黛玉就走。|说着拉着林黛玉就走。
林黛玉回头叫丫头们，一个也没有。|林黛玉回头叫丫头，一个也没有。
凤姐道：“又叫他们作什么，有我伏侍你呢。”|凤姐说：“又叫她们做什么，有我伺候你呢。”
一面说，一面拉了就走。|一边说，一边拉着就走。
宝玉在后面跟著出了园门。|宝玉在后面跟着出了园门。
到了贾母跟前，凤姐笑道：“我说他们不用人费心，自己就会好的。|到了贾母跟前，凤姐笑道：“我说他们不用别人费心，自己就会和好的。
老祖宗不信，一定叫我去说合。|老祖宗不信，一定要我去说和。
我及至到那里要说合，谁知两个人倒在一处对赔不是了。|我到了那里要说和，谁知他们两个倒在一起互相赔不是了。
对笑对诉，倒象‘黄鹰抓住了鹞子的脚’，两个都扣了环了，那里还要人去说合。”|对着笑、对着诉，倒像‘黄鹰抓住了鹞子的脚’，两个都扣在一起了，哪里还用人去说和。”
说的满屋里都笑起来。|说得满屋子人都笑起来。
! “黄鹰抓住了鹞子的脚”，两只鸟互相抓住，谁也离不开谁。凤姐这一句玩笑，把宝黛的关系说得再清楚不过，当着贾母和满屋子人。
! 凤姐来得正巧，“好了”一声，正撞上两人拉手。屋里刚才那些不能被人看见的话，她听去了多少，书里没说。

# 六、宝玉比宝钗为杨妃
此时宝钗正在这里。|这时宝钗正在这里。
那林黛玉只一言不发，挨著贾母坐下。|林黛玉一句话不说，挨着贾母坐下了。
宝玉没甚说的，便向宝钗笑道：“大哥哥好日子，偏生我又不好了，没别的礼送，连个头也不得磕去。|宝玉没什么可说的，就对宝钗笑道：“大哥哥过生日，偏偏我又病了，没别的礼送，连个头也没能去磕。
大哥哥不知我病，倒象我懒，推故不去的。|大哥哥不知道我病了，倒像是我懒，故意找借口不去。
倘或明儿恼了，姐姐替我分辨分辨。”|要是他明天恼了，姐姐替我分辩分辩。”
宝钗笑道：“这也多事。你便要去也不敢惊动，何况身上不好，|宝钗笑道：“这也是多余的。你就是要去，我们也不敢惊动你，何况你身体不好，
弟兄们日日一处，要存这个心倒生分了。”|兄弟们天天在一处，要是存这个心，倒显得生分了。”
宝玉又笑道：“姐姐知道体谅我就好了。”|宝玉又笑道：“姐姐知道体谅我就好了。”
又道：“姐姐怎么不看戏去？”|又说：“姐姐怎么不去看戏？”
宝钗道：“我怕热，看了两出，热的很。|宝钗说：“我怕热，看了两出，热得很。
要走，客又不散。我少不得推身上不好，就来了。”|想走，客人又没散。我只好推说身体不舒服，就来了。”
宝玉听说，自己由不得脸上没意思，只得又搭讪笑道：|宝玉听了，不由得脸上挂不住，只好又找话说，笑道：
“怪不得他们拿姐姐比杨妃，原来也体丰怯热。”|“怪不得他们拿姐姐比杨贵妃，原来也是身体丰满、怕热。”
宝钗听说，不由的大怒，待要怎样，又不好怎样。|宝钗听了，不由得大怒，想发作，又不好发作。
回思了一回，脸红起来，便冷笑了两声，说道：|想了一会儿，脸红起来，就冷笑两声，说：
“我倒象杨妃，只是没一个好哥哥好兄弟可以作得杨国忠的！”|“我倒像杨贵妃，只是没有一个好哥哥好兄弟能做杨国忠的！”
! 宝钗说她也是“推身上不好”才来的，宝玉刚刚也是推病不去，宝钗这话无意中戳破了他，所以“脸上没意思”。
! 杨贵妃体态丰满，是美人，也是“祸水”。把一个未出嫁的闺秀比作杨妃，又说她胖，是很失礼的话。
! 宝钗一向温厚，唯独这一次动了真气。“没一个好哥哥好兄弟作得杨国忠”，既是自嘲哥哥薛蟠不成器，也是反刺宝玉：你这个“兄弟”也不成器。

# 七、宝钗借扇敲靛儿
二人正说著，可巧小丫头靛儿因不见了扇子，和宝钗笑道：“必是宝姑娘藏了我的。好姑娘，赏我罢。”|两人正说着，正好小丫头靛儿找不着扇子，对宝钗笑道：“一定是宝姑娘把我的扇子藏起来了。好姑娘，还给我吧。”
宝钗指他道：“你要仔细！我和你顽过，你再疑我。|宝钗指着她说：“你给我小心点！我跟你玩过吗，你就疑心我。
和你素日嘻皮笑脸的那些姑娘们跟前，你该问他们去。”|你该去问那些平时跟你嘻嘻哈哈的姑娘们。”
说的个靛儿跑了。|说得靛儿跑了。
宝玉自知又把话说造次了，当著许多人，更比才在林黛玉跟前更不好意思，便急回身又同别人搭讪去了。|宝玉知道自己又说错了话，当着这么多人，比刚才在林黛玉跟前还不好意思，就赶紧回身跟别人搭话去了。
! 回目“宝钗借扇机带双敲”就是这里。宝钗骂靛儿，其实一棒敲两个人：“嘻皮笑脸的那些姑娘们”，一敲宝玉，一敲黛玉。
! 宝钗平日待丫头宽厚，这次对一个小丫头这样厉害，可见她是借题发挥。

# 八、《负荆请罪》
林黛玉听见宝玉奚落宝钗，心中著实得意，才要搭言也趁势儿取个笑，|林黛玉听见宝玉讥讽宝钗，心里很得意，正想插话也趁机取笑一下，
不想靛儿因找扇子，宝钗又发了两句话，他便改口笑道：“宝姐姐，你听了两出什么戏？”|没想到靛儿来找扇子，宝钗又说了那两句话，她就改口笑道：“宝姐姐，你听了哪两出戏？”
宝钗因见林黛玉面上有得意之态，一定是听了宝玉方才奚落之言，遂了他的心愿，|宝钗见林黛玉脸上有得意的样子，一定是听了宝玉刚才讥讽的话，称了她的心，
忽又见问他这话，便笑道：“我看的是李逵骂了宋江，后来又赔不是。”|忽然又见她这样问，就笑道：“我看的是李逵骂了宋江，后来又赔不是。”
宝玉便笑道：“姐姐通今博古，色色都知道，怎么连这一出戏的名字也不知道，就说了这么一串子。这叫《负荆请罪》。”|宝玉就笑道：“姐姐博古通今，样样都知道，怎么连这出戏的名字都不知道，说了这么一大串。这叫《负荆请罪》。”
宝钗笑道：“原来这叫作《负荆请罪》！|宝钗笑道：“原来这叫《负荆请罪》！
你们通今博古，才知道‘负荆请罪’，我不知道什么是‘负荆请罪’！”|你们博古通今，才知道‘负荆请罪’，我可不知道什么叫‘负荆请罪’！”
一句话还未说完，宝玉林黛玉二人心里有病，听了这话早把脸羞红了。|一句话还没说完，宝玉、林黛玉两人心里有鬼，听了这话早已羞红了脸。
! “负荆请罪”是赔罪认错。宝钗说的“骂了又赔不是”，正是宝玉刚才去潇湘馆向黛玉赔罪的事。
! 宝钗故意不说戏名，引宝玉说出来，再用“你们”二字把宝黛一起点破。宝钗一向含而不露，这一回连敲三下，可见她真被惹恼了。

# 九、凤姐“吃生姜”
凤姐于这些上虽不通达，但见他三人形景，便知其意，便也笑著问人道：|凤姐虽然对这些典故不太懂，但看他们三人的样子，就知道是什么意思了，也笑着问大家：
“你们大暑天，谁还吃生姜呢？”|“你们大热天的，谁还吃生姜呢？”
众人不解其意，便说道：“没有吃生姜。”|大家不懂她的意思，就说：“没人吃生姜。”
凤姐故意用手摸著腮，诧异道：“既没人吃姜，怎么这么辣辣的？”|凤姐故意用手摸着腮，诧异地说：“既然没人吃姜，怎么这么火辣辣的？”
宝玉黛玉二人听见这话，越发不好过了。|宝玉、黛玉两人听了这话，越发难为情了。
宝钗再要说话，见宝玉十分讨愧，形景改变，也就不好再说，只得一笑收住。|宝钗还想再说，见宝玉十分惭愧，脸色都变了，也就不好再说，只好一笑作罢。
别人总未解得他四个人的言语，因此付之流水。|别人都没听懂他们四个人话里的意思，所以也就这样过去了。
一时宝钗凤姐去了，林黛玉笑向宝玉道：“你也试著比我利害的人了。|一会儿宝钗、凤姐走了，林黛玉笑着对宝玉说：“你也碰上比我厉害的人了吧。
谁都象我心拙口笨的，由著人说呢。”|谁都像我这么心笨嘴拙，任由人家说呢。”
宝玉正因宝钗多了心，自己没趣，又见林黛玉来问著他，越发没好气起来。|宝玉正因为宝钗多心，自己觉得没意思，又见林黛玉来问他，越发没好气了。
待要说两句，又恐林黛玉多心，说不得忍著气，无精打采一直出来。|想说两句，又怕林黛玉多心，只好忍着气，没精打采地一直走了出来。
! “火辣辣”是说脸被说得发烫，也说宝钗的话辣。凤姐看得最明白，却装糊涂，一句玩笑把场面圆了过去。
! 宝玉两头都不讨好：得罪了宝钗，又被黛玉取笑。他“忍著气”出门，下面就闯了大祸。

# 十、宝玉逗金钏
谁知目今盛暑之时，又当早饭已过，各处主仆人等多半都因日长神倦之时，|这时正是盛夏，又刚吃过早饭，各处的主子仆人大多因为白天长、人困倦，
宝玉背著手，到一处，一处鸦雀无闻。|宝玉背着手，走到一处，一处都静悄悄的。
从贾母这里出来，往西走了穿堂，便是凤姐的院落。|从贾母这里出来，往西穿过穿堂，就是凤姐的院子。
到他们院门前，只见院门掩著。|到了她们院门前，只见院门掩着。
知道凤姐素日的规矩，每到天热，午间要歇一个时辰的，进去不便，|知道凤姐平时的规矩，每到天热，中午要歇一个时辰，进去不方便，
遂进角门，来到王夫人上房内。|就进了角门，来到王夫人的上房。
只见几个丫头子手里拿著针线，却打盹儿呢。|只见几个小丫头手里拿着针线，却在打瞌睡。
王夫人在里间凉榻上睡著，金钏儿坐在旁边捶腿，也乜斜著眼乱恍。|王夫人在里间的凉榻上睡着，金钏儿坐在旁边给她捶腿，也眯着眼睛迷迷糊糊的。
宝玉轻轻的走到跟前，把他耳上带的坠子一摘，金钏儿睁开眼，见是宝玉。|宝玉轻轻走到跟前，把她耳朵上戴的坠子一摘，金钏儿睁开眼，见是宝玉。
宝玉悄悄的笑道：“就困的这么著？”|宝玉悄悄笑道：“就困成这样？”
金钏抿嘴一笑，摆手令他出去，仍合上眼，|金钏抿嘴一笑，摆手叫他出去，仍旧闭上眼睛，
宝玉见了他，就有些恋恋不舍的，悄悄的探头瞧瞧王夫人合著眼，|宝玉见了她，就有些恋恋不舍，悄悄探头看看王夫人闭着眼，
便自己向身边荷包里带的香雪润津丹掏了出来，便向金钏儿口里一送。|就从身边荷包里掏出随身带的香雪润津丹，往金钏儿嘴里一送。
金钏儿并不睁眼，只管噙了。|金钏儿也不睁眼，只管含在嘴里。
宝玉上来便拉著手，悄悄的笑道：“我明日和太太讨你，咱们在一处罢。”|宝玉上前就拉着她的手，悄悄笑道：“我明天跟太太要你，咱们在一处吧。”
金钏儿不答。|金钏儿不回答。
宝玉又道：“不然，等太太醒了我就讨。”|宝玉又说：“要不然，等太太醒了我就要。”
金钏儿睁开眼，将宝玉一推，笑道：“你忙什么！|金钏儿睁开眼，把宝玉一推，笑道：“你急什么！
‘金簪子掉在井里头，有你的只是有你的”，连这句话语难道也不明白？|‘金簪子掉在井里头，是你的总归是你的’，连这句话都不明白吗？
我倒告诉你个巧宗儿，你往东小院子里拿环哥儿同彩云去。”|我倒告诉你一件巧事，你到东小院去捉环哥儿和彩云去。”
宝玉笑道：“凭他怎么去罢，我只守著你。”|宝玉笑道：“随他们怎么样吧，我只守着你。”
! 香雪润津丹是一种口含的香丸。宝玉把它送进金钏嘴里，这是很亲昵的举动。
! “金簪子掉在井里头”，金钏随口说的俗语，竟成了她自己的谶语：她就是“金”，她后来就投了井。
! 金钏叫宝玉去捉贾环和彩云的“双”，这话被王夫人听见了，后来贾环也恨上了这件事。

# 十一、王夫人打金钏
只见王夫人翻身起来，照金钏儿脸上就打了个嘴巴子，指著骂道：|只见王夫人翻身起来，照着金钏儿的脸就打了一个耳光，指着她骂道：
“下作小娼妇，好好的爷们，都叫你教坏了。”|“下贱的小娼妇，好好的少爷，都叫你们教坏了。”
宝玉见王夫人起来，早一溜烟去了。|宝玉见王夫人起来了，早就一溜烟跑了。
这里金钏儿半边脸火热，一声不敢言语。|这里金钏儿半边脸火辣辣的，一声也不敢吭。
登时众丫头听见王夫人醒了，都忙进来。|丫头们听见王夫人醒了，都连忙进来。
王夫人便叫玉钏儿：“把你妈叫来，带出你姐姐去。”|王夫人就叫玉钏儿：“把你妈叫来，把你姐姐带出去。”
金钏儿听说，忙跪下哭道：“我再不敢了。太太要打骂，只管发落，别叫我出去就是天恩了。|金钏儿听了，连忙跪下哭道：“我再也不敢了。太太要打要骂，只管处置，别叫我出去就是天大的恩典了。
我跟了太太十来年，这会子撵出去，我还见人不见人呢！”|我跟了太太十来年，这会儿被撵出去，我还有脸见人吗！”
王夫人固然是个宽仁慈厚的人，从来不曾打过丫头们一下，|王夫人本是个宽厚仁慈的人，从来没打过丫头们一下，
今忽见金钏儿行此无耻之事，此乃平生最恨者，故气忿不过，打了一下，骂了几句。|今天忽然看见金钏儿做出这种不知羞耻的事，这是她平生最恨的，所以气不过，打了一下，骂了几句。
虽金钏儿苦求，亦不肯收留，到底唤了金钏儿之母白老媳妇来领了下去。|虽然金钏儿苦苦哀求，也不肯留她，到底叫金钏儿的母亲白老媳妇来把她领走了。
那金钏儿含羞忍辱的出去，不在话下。|金钏儿含羞忍辱地出去了。
! 王夫人其实是醒着的，宝玉和金钏的话她全听见了。她打的是金钏，骂的是“教坏了爷们”，却一句不说宝玉。
! 宝玉“一溜烟”跑了，一句话也没替金钏说。闯祸的是他，受罚的是金钏。这是宝玉一生最大的愧疚之一。
! 被主子撵出去的丫头，在当时就是名声扫地，“见人不见人”。金钏说的不是夸张，几天以后她就投了井。

# 十二、蔷薇架下画“蔷”
且说那宝玉见王夫人醒来，自己没趣，忙进大观园来。|宝玉见王夫人醒了，自己觉得没意思，连忙回大观园来。
只见赤日当空，树阴合地，满耳蝉声，静无人语。|只见烈日当空，树荫遮地，满耳都是蝉鸣，静悄悄的没有人声。
刚到了蔷薇花架，只听有人哽噎之声。|刚到蔷薇花架，只听见有人哽咽的声音。
宝玉心中疑惑，便站住细听，果然架下那边有人。|宝玉心里疑惑，就站住细听，果然花架那边有人。
如今五月之际，那蔷薇正是花叶茂盛之际，|如今正是五月，蔷薇正开得花繁叶茂，
宝玉便悄悄的隔著篱笆洞儿一看，只见一个女孩子蹲在花下，|宝玉就悄悄地隔着篱笆缝一看，只见一个女孩子蹲在花下，
手里拿著根绾头的簪子在地下抠土，一面悄悄的流泪，|手里拿着一根绾头发的簪子在地上抠土，一边悄悄流泪，
宝玉心中想道：“难道这也是个痴丫头，又象颦儿来葬花不成？”|宝玉心里想：“难道这也是个痴丫头，又像颦儿那样来葬花不成？”
因又自叹道：“若真也葬花，可谓‘东施效颦’，不但不为新特，且更可厌了。”|又自己叹道：“要是真的也来葬花，那就是‘东施效颦’了，不但不新奇，反而更讨厌了。”
想毕，便要叫那女子，说：“你不用跟著那林姑娘学了。”|想完，就要叫那女孩子，说：“你不用跟着林姑娘学了。”
话未出口，幸而再看时，这女孩子面生，不是个侍儿，|话还没说出口，幸好再一看，这女孩子面生，不是丫头，
倒象是那十二个学戏的女孩子之内的，却辨不出他是生旦净丑那一个角色来。|倒像是那十二个学戏的女孩子里的，却认不出她是唱生、旦、净、丑哪个角色的。
宝玉忙把舌头一伸，将口掩住，自己想道：“幸而不曾造次。|宝玉连忙把舌头一伸，捂住嘴，自己想：“幸好没冒失。
上两次皆因造次了，颦儿也生气，宝儿也多心，如今再得罪了他们，越发没意思了。”|前两回都是因为说话冒失，颦儿也生气，宝姐姐也多心，如今再得罪了她们，越发没意思了。”
一面想，一面又恨认不得这个是谁。|一边想，一边又恨自己认不出这是谁。
再留神细看，只见这女孩子眉蹙春山，眼颦秋水，面薄腰纤，袅袅婷婷，大有林黛玉之态。|再留神细看，只见这女孩子眉头微皱，眼含秋水，脸庞清瘦，腰身纤细，袅袅婷婷，很有林黛玉的神态。
宝玉早又不忍弃他而去，只管痴看。|宝玉早已不忍心丢下她走开，只管痴痴地看。
只见他虽然用金簪划地，并不是掘土埋花，竟是向土上画字。|只见她虽然用金簪划地，却不是挖土埋花，竟是在土上写字。
宝玉用眼随著簪子的起落，一直一画一点一勾的看了去，数一数，十八笔。|宝玉用眼睛跟着簪子起落，一竖一横、一点一勾地看下去，数一数，十八笔。
自己又在手心里用指头按著他方才下笔的规矩写了，猜是个什么字。|自己又在手心里用手指照着她刚才下笔的顺序写了一遍，猜是个什么字。
写成一想，原来就是个蔷薇花的“蔷”字。|写完一想，原来就是蔷薇花的“蔷”字。
! 宝玉刚闯了祸，转身就忘了，又去看别的女孩子。他的“痴”，是对一切女孩子都怜惜，也是不知轻重。
! 这个女孩子是龄官，“大有林黛玉之态”。第二十二回凤姐说过一个戏子像黛玉，说的就是她。

# 十三、几千个“蔷”字
宝玉想道：“必定是他也要作诗填词。|宝玉想：“一定是她也要作诗填词。
这会子见了这花，因有所感，或者偶成了两句，一时兴至恐忘，在地下画著推敲，也未可知。|这会儿见了这花，有所感触，或许偶然想出两句来，一时兴起怕忘了，在地上画着推敲，也说不定。
且看他底下再写什么。”|且看她下面再写什么。”
一面想，一面又看，只见那女孩子还在那里画呢，画来画去，还是个“蔷”字。|一边想，一边又看，只见那女孩子还在那里画，画来画去，还是个“蔷”字。
再看，还是个“蔷”字。|再看，还是个“蔷”字。
里面的原是早已痴了，画完一个又画一个，已经画了有几千个“蔷”。|里面那个早已痴了，画完一个又画一个，已经画了几千个“蔷”字。
外面的不觉也看痴了，两个眼睛珠儿只管随著簪子动，心里却想：|外面这个不知不觉也看痴了，两个眼珠只管跟着簪子转，心里却想：
“这女孩子一定有什么话说不出来的大心事，才这样个形景。|“这女孩子一定有什么说不出来的大心事，才会这样。
外面既是这个形景，心里不知怎么熬煎。|外表已经是这个样子，心里不知道怎么煎熬呢。
看他的模样儿这般单薄，心里那里还搁的住熬煎。可恨我不能替你分些过来。”|看她的模样这么单薄，心里哪里经得住煎熬。可恨我不能替你分担一些。”
! 龄官画的“蔷”是贾蔷的“蔷”。她爱着贾蔷，说不出口，只能一笔一笔写在地上。宝玉这时还不知道，第三十六回他才明白。
! “里面的痴了，外面的也看痴了”，一个痴情的女孩子，一个痴看的宝玉。这就是回目“龄官划蔷痴及局外”。

# 十四、雨中
伏中阴晴不定，片云可以至雨，忽一阵凉风过了，唰唰的落下一阵雨来。|伏天里阴晴不定，一片云就能下雨，忽然一阵凉风吹过，唰唰地下起一阵雨来。
宝玉看著那女子头上滴下水来，纱衣裳登时湿了。|宝玉看见那女孩子头上滴下水来，纱衣裳立刻湿了。
宝玉想道：“这时下雨。他这个身子，如何禁得骤雨一激！”|宝玉想：“这时候下雨了。她这身子，怎么经得起急雨一淋！”
因此禁不住便说道：“不用写了。你看下大雨，身上都湿了。”|因此忍不住就说：“别写了。你看下大雨了，身上都湿了。”
那女孩子听说倒唬了一跳，抬头一看，只见花外一个人叫他不要写了，下大雨了。|那女孩子听了吓了一跳，抬头一看，只见花外面有个人叫她别写了，下大雨了。
一则宝玉脸面俊秀，二则花叶繁茂，上下俱被枝叶隐住，刚露著半边脸，|一来宝玉面容俊秀，二来花叶繁密，上下都被枝叶挡住，只露出半边脸，
那女孩子只当是个丫头，再不想是宝玉，因笑道：|那女孩子只当是个丫头，再想不到是宝玉，就笑道：
“多谢姐姐提醒了我。难道姐姐在外头有什么遮雨的？”|“多谢姐姐提醒我。难道姐姐在外面有什么挡雨的？”
一句提醒了宝玉，“嗳哟”了一声，才觉得浑身冰凉。|一句话提醒了宝玉，“哎哟”了一声，才觉得浑身冰凉。
低头一看，自己身上也都湿了。|低头一看，自己身上也全湿了。
说声“不好”，只得一气跑回怡红院去了，心里却还记挂著那女孩子没处避雨。|说声“不好”，只好一口气跑回怡红院去了，心里还惦记着那女孩子没地方躲雨。
! 宝玉只顾心疼别人淋雨，忘了自己也在雨里。第三十五回傅家的婆子说宝玉“大雨淋的水鸡似的，他反告诉别人‘下雨了，快避雨去罢’”，说的就是这件事。
! 龄官把宝玉当作“姐姐”。在一个痴情的女孩子眼里，宝玉也像个女孩子，这正是宝玉最得意的。

# 十五、怡红院关门玩水
原来明日是端阳节，那文官等十二个女子都放了学，进园来各处顽耍。|原来第二天是端午节，文官等十二个女孩子都放了假，进园来到处玩耍。
可巧小生宝官，正旦玉官等两个女孩子，正在怡红院和袭人玩笑，被大雨阻住。|正巧唱小生的宝官、唱正旦的玉官两个女孩子，正在怡红院和袭人说笑，被大雨挡住了。
大家把沟堵了，水积在院内，把些绿头鸭，花㶉鶒，彩鸳鸯，捉的捉，赶的赶，缝了翅膀，放在院内顽耍，将院门关了。|大家把排水沟堵了，雨水积在院子里，把些绿头鸭、花㶉鶒、彩色鸳鸯捉的捉、赶的赶，把翅膀缝住，放在院子的积水里玩，把院门关上了。
袭人等都在游廊上嘻笑。|袭人等人都在游廊上嬉笑。
宝玉见关著门，便以手扣门，里面诸人只顾笑，那里听见。|宝玉见门关着，就用手敲门，里面的人只顾笑，哪里听得见。
叫了半日，拍的门山响，里面方听见了，估谅著宝玉这会子再不回来的。|叫了半天，把门拍得山响，里面才听见了，可大家估计宝玉这会儿不会回来。
袭人笑道：“谁这会子叫门，没人开去。”|袭人笑道：“谁这会儿叫门，没人去开。”
宝玉道：“是我。”|宝玉说：“是我。”
麝月道：“是宝姑娘的声音。”|麝月说：“是宝姑娘的声音。”
晴雯道：“胡说！宝姑娘这会子做什么来。”|晴雯说：“胡说！宝姑娘这会儿来做什么。”
袭人道：“让我隔著门缝儿瞧瞧，可开就开，要不可开，叫他淋著去。”|袭人说：“让我隔着门缝瞧瞧，能开就开，不能开就叫她淋着去。”
说著，便顺著游廊到门前，往外一瞧，只见宝玉淋的雨打鸡一般。|说着，就顺着游廊走到门前，往外一看，只见宝玉淋得像只落汤鸡。
袭人见了又是著忙又是可笑，忙开了门，笑的弯著腰拍手道：|袭人见了又着急又好笑，连忙开了门，笑得弯着腰拍手说：
“这么大雨地里跑什么？那里知道爷回来了。”|“这么大的雨，在雨地里跑什么？哪里知道爷回来了。”
! 这一回又是“叫门不开”。第二十六回黛玉在门外叫，晴雯不开；这一回宝玉在门外叫，里面只顾玩。怡红院的门，总是关着的。
! 麝月把宝玉的声音听成“宝姑娘”，这一句闲话，又把宝钗牵了进来。

# 十六、宝玉踢了袭人
宝玉一肚子没好气，满心里要把开门的踢几脚，|宝玉一肚子没好气，满心想把开门的人踢几脚，
及开了门，并不看真是谁，还只当是那些小丫头子们，便抬腿踢在肋上。|等门一开，也没看清是谁，还以为是那些小丫头，就抬腿踢在肋骨上。
袭人”嗳哟”了一声。|袭人“哎哟”了一声。
宝玉还骂道：“下流东西们！我素日担待你们得了意，一点儿也不怕，越发拿我取笑儿了。”|宝玉还骂道：“下贱东西们！我平时宽待你们，你们就得意了，一点都不怕，越发拿我取笑了。”
口里说著，一低头见是袭人哭了，方知踢错了，|嘴里说着，一低头看见是袭人在哭，才知道踢错了，
忙笑道：“嗳哟，是你来了！踢在那里了？”|连忙笑道：“哎哟，是你来了！踢在哪里了？”
袭人从来不曾受过大话的，今儿忽见宝玉生气踢他一下，又当著许多人，|袭人从来没受过一句重话，今天忽然被宝玉生气踢了一脚，又当着这么多人，
又是羞，又是气，又是疼，真一时置身无地。|又是羞，又是气，又是疼，一时真不知道该往哪里站。
待要怎么样，料著宝玉未必是安心踢他，少不得忍著说道：“没有踢著。还不换衣裳去。”|想怎么样，又料想宝玉未必是存心踢她，只好忍着说：“没踢着。还不快去换衣裳。”
宝玉一面进房来解衣，一面笑道：“我长了这么大，今日是头一遭儿生气打人，不想就偏遇见了你！”|宝玉一边进屋脱衣服，一边笑道：“我长这么大，今天是头一回生气打人，没想到偏偏碰上了你！”
袭人一面忍痛换衣裳，一面笑道：|袭人一边忍着痛帮他换衣裳，一边笑道：
“我是个起头儿的人，不论事大事小事好事歹，自然也该从我起。|“我是个领头的人，不管事大事小、事好事坏，自然都该从我开始。
但只是别说打了我，明儿顺了手也打起别人来。”|只是别说打了我，以后顺了手也打起别人来。”
宝玉道：“我才也不是安心。”|宝玉说：“我刚才也不是存心的。”
袭人道：“谁说你是安心了！素日开门关门，都是那起小丫头子们的事。|袭人说：“谁说你是存心的了！平时开门关门，都是那些小丫头们的事。
他们是憨皮惯了的，早已恨的人牙痒痒，他们也没个怕惧儿。|她们是皮惯了的，早就叫人恨得牙痒痒，她们也没个害怕。
你当是他们，踢一下子，唬唬他们也好些。|你当是她们，踢一下，吓吓她们也好。
才刚是我淘气，不叫开门的。”|刚才是我淘气，不让开门的。”
! 宝玉一向对女孩子最温柔，今天却抬脚就踢，还骂“下流东西们”。他这一天在宝钗那里受了气，在王夫人那里闯了祸，一肚子火发在了袭人身上。
! 袭人挨了打，第一句是“没有踢著”，还替宝玉开脱，说是自己“淘气”。她处处护着宝玉，连自己挨的这一脚都揽在身上。
! 宝玉说这是“头一遭儿生气打人”，他以为踢的是小丫头，可见他心里也觉得小丫头是可以踢的。

# 十七、袭人吐血
说著，那雨已住了，宝官，玉官也早去了。|说着，雨已经停了，宝官、玉官也早走了。
袭人只觉肋下疼的心里发闹，晚饭也不曾好生吃。|袭人只觉得肋下疼得心里发慌，晚饭也没好好吃。
至晚间洗澡时脱了衣服，只见肋上青了碗大一块，自己倒唬了一跳，又不好声张。|到晚上洗澡脱衣服时，只见肋骨上青了碗口大一块，自己倒吓了一跳，又不好声张。
一时睡下，梦中作痛，由不得“嗳哟”之声从睡中哼出。|一会儿睡下了，梦里也疼，不由得从睡梦中哼出“哎哟”声来。
宝玉虽说不是安心，因见袭人懒懒的，也睡不安稳。|宝玉虽说不是存心的，见袭人懒懒的，也睡不安稳。
忽夜间听得“嗳哟”，便知踢重了，自己下床悄悄的秉灯来照。|忽然夜里听见“哎哟”，就知道踢重了，自己下床悄悄拿灯来照。
刚到床前，只见袭人嗽了两声，吐出一口痰来，“嗳哟”一声，|刚到床前，只见袭人咳了两声，吐出一口痰来，“哎哟”一声，
睁开眼见了宝玉，倒唬了一跳道：“作什么？”|睁开眼看见宝玉，倒吓了一跳，说：“干什么？”
宝玉道：“你梦里‘嗳哟’，必定踢重了。我瞧瞧。”|宝玉说：“你梦里喊‘哎哟’，一定是踢重了。我看看。”
袭人道：“我头上发晕，嗓子里又腥又甜，你倒照一照地下罢。”|袭人说：“我头发晕，嗓子里又腥又甜，你倒照一照地上吧。”
宝玉听说，果然持灯向地下一照，只见一口鲜血在地。|宝玉听了，果然拿灯往地上一照，只见地上一口鲜血。
宝玉慌了，只说“了不得了！”|宝玉慌了，只说：“不得了了！”
袭人见了，也就心凉了半截。|袭人见了，心也凉了半截。
要知端的，且听下回分解。|要知后事如何，请看下回。
! 这一天，宝玉逗金钏害她被撵，说杨妃惹恼宝钗，踢伤袭人致她吐血。一天之内连闯三祸。
! 回目“宝钗借扇机带双敲，龄官划蔷痴及局外”，写的都是“痴”：宝钗的醋意、龄官的痴情、宝玉的痴看。最后落在袭人这一口血上。
</script>
<script type="text/plain" id="ch31">
# 一、袭人心灰
话说袭人见了自己吐的鲜血在地，也就冷了半截，想著往日常听人说：|袭人看见自己吐在地上的鲜血，心就凉了半截，想起平时常听人说：
“少年吐血，年月不保，纵然命长，终是废人了。”|“年纪轻轻就吐血，活不了几年；就算命长，也终究是个废人了。”
想起此言，不觉将素日想著后来争荣夸耀之心尽皆灰了，眼中不觉滴下泪来。|想起这话，不由得把平日想着将来争荣耀、出人头地的心思全都灰了，眼里不由得流下泪来。
宝玉见他哭了，也不觉心酸起来，因问道：“你心里觉的怎么样？”|宝玉见她哭了，也不由得心酸起来，就问：“你心里觉得怎么样？”
袭人勉强笑道：“好好的，觉怎么呢！”|袭人勉强笑道：“好好的，觉得怎么样呢！”
宝玉的意思即刻便要叫人烫黄酒，要山羊血黎洞丸来。|宝玉的意思是马上就要叫人烫黄酒，拿山羊血黎洞丸来。
袭人拉了他的手，笑道：“你这一闹不打紧，闹起多少人来，倒抱怨我轻狂。|袭人拉住他的手，笑道：“你这一闹不要紧，惊动了多少人，倒要怪我轻狂。
分明人不知道，倒闹的人知道了，你也不好，我也不好。|本来没人知道，你倒闹得大家都知道了，对你不好，对我也不好。
正经明儿你打发小子问问王太医去，弄点子药吃吃就好了。人不知鬼不觉的可不好？”|正经明天你打发小厮去问问王太医，弄点药吃吃就好了。人不知鬼不觉的，不好吗？”
宝玉听了有理，也只得罢了，向案上斟了茶来，给袭人漱了口。|宝玉听她说得有理，也只好作罢，从桌上倒了茶来，给袭人漱口。
袭人知道宝玉心内是不安稳的，待要不叫他伏侍，他又必不依，二则定要惊动别人，不如由他去罢：|袭人知道宝玉心里不安，想不让他伺候，他一定不肯；二来一定会惊动别人，不如由他去吧：
因此只在榻上由宝玉去伏侍。|所以只躺在榻上由宝玉伺候。
一交五更，宝玉也顾不的梳洗，忙穿衣出来，将王济仁叫来，亲自确问。|一到五更，宝玉也顾不上梳洗，连忙穿衣出来，把王济仁叫来，亲自仔细询问。
王济仁问原故，不过是伤损，便说了个丸药的名字，怎么服，怎么敷。|王济仁问了原因，不过是跌打损伤，就说了个丸药的名字，怎么吃、怎么敷。
宝玉记了，回园依方调治。不在话下。|宝玉记下了，回园里照方子调治。不必细说。
! “争荣夸耀之心”，袭人心里一直想着将来做宝玉的姨娘。这一口血，让她以为自己的前程完了。作者一笔点破了袭人的心事。
! 袭人吐了血还想着“人不知鬼不觉”，怕别人说她“轻狂”。她最在意的，是在太太们眼里的名声。

# 二、端午节宴，众人无趣
这日正是端阳佳节，蒲艾簪门，虎符系臂。|这天正是端午佳节，门上插着菖蒲和艾叶，手臂上系着虎形的符。
午间，王夫人治了酒席，请薛家母女等赏午。|中午，王夫人摆了酒席，请薛家母女等人过节。
宝玉见宝钗淡淡的，也不和他说话，自知是昨儿的原故。|宝玉见宝钗冷冷淡淡的，也不跟他说话，自己知道是昨天的缘故。
王夫人见宝玉没精打彩，也只当是金钏儿昨日之事，他没好意思的，越发不理他。|王夫人见宝玉没精打采，也只当是因为昨天金钏儿的事他不好意思，越发不理他。
林黛玉见宝玉懒懒的，只当是他因为得罪了宝钗的原故，心中不自在，形容也就懒懒的。|林黛玉见宝玉懒懒的，只当是因为他得罪了宝钗，心里不自在，样子也就懒懒的。
凤姐昨日晚间王夫人就告诉了他宝玉金钏的事，知道王夫人不自在，|凤姐昨天晚上就听王夫人说了宝玉和金钏的事，知道王夫人不痛快，
自己如何敢说笑，也就随著王夫人的气色行事，更觉淡淡的。|自己怎么敢说笑，也就看着王夫人的脸色行事，更显得冷冷淡淡的。
贾迎春姊妹见众人无意思，也都无意思了。|迎春姐妹见大家都没兴致，也都没兴致了。
因此，大家坐了一坐就散了。|因此，大家坐了一会儿就散了。
! 一张桌子上，人人心里各有一件事，人人都猜错了别人的心思。热闹的端午节，就这样冷冷清清地散了。

# 三、黛玉喜散，宝玉喜聚
林黛玉天性喜散不喜聚。他想的也有个道理，他说，|林黛玉天生喜欢散、不喜欢聚。她想得也有她的道理，她说：
”人有聚就有散，聚时欢喜，到散时岂不冷清？|“人有聚就有散，聚的时候欢喜，到散的时候岂不冷清？
既清冷则伤感，所以不如倒是不聚的好。|冷清了就会伤感，所以不如不聚的好。
比如那花开时令人爱慕，谢时则增惆怅，所以倒是不开的好。”|比如那花开的时候叫人喜爱，谢的时候就添惆怅，所以倒不如不开的好。”
故此人以为喜之时，他反以为悲。|所以别人觉得欢喜的时候，她反而觉得悲伤。
那宝玉的情性只愿常聚，生怕一时散了添悲，那花只愿常开，生怕一时谢了没趣；|宝玉的性情却只愿常聚，生怕一下子散了添悲伤；只愿花常开，生怕一下子谢了没意思；
只到筵散花谢，虽有万种悲伤，也就无可如何了。|直到宴席散了、花谢了，虽然有万种悲伤，也就没有办法了。
! 黛玉怕散，所以宁愿不聚；宝玉怕散，所以只求常聚。两人怕的是同一件事，态度却相反。
! 这几句是全书的总纲：“盛筵必散”，花必谢，人必散。宝玉不愿看见的结局，最后一样不少地都来了。

# 四、晴雯跌扇
因此，今日之筵，大家无兴散了，林黛玉倒不觉得，倒是宝玉心中闷闷不乐，回至自己房中长吁短叹。|所以，今天的宴席大家没兴致散了，林黛玉倒不觉得什么，倒是宝玉心里闷闷不乐，回到自己房里长吁短叹。
偏生晴雯上来换衣服，不防又把扇子失了手跌在地下，将股子跌折。|偏偏晴雯上来给他换衣服，一不小心又把扇子掉在地上，把扇骨跌断了。
宝玉因叹道：“蠢才，蠢才！将来怎么样？|宝玉就叹道：“蠢材，蠢材！将来怎么办？
明日你自己当家立事，难道也是这么顾前不顾后的？”|以后你自己当家过日子，难道也这样顾前不顾后？”
晴雯冷笑道：“二爷近来气大的很，行动就给脸子瞧。|晴雯冷笑道：“二爷最近脾气大得很，动不动就给人脸色看。
前儿连袭人都打了，今儿又来寻我们的不是。要踢要打凭爷去。|前天连袭人都打了，今天又来找我们的不是。要踢要打随爷便。
就是跌了扇子，也是平常的事。|就是摔了把扇子，也是平常的事。
先时连那么样的玻璃缸，玛瑙碗不知弄坏了多少，也没见个大气儿，这会子一把扇子就这么著了。何苦来！|以前那么贵的玻璃缸、玛瑙碗不知弄坏了多少，也没见你生过大气，这会儿一把扇子就这样了。何苦呢！
要嫌我们就打发我们，再挑好的使。好离好散的，倒不好？”|要是嫌弃我们，就打发我们走，再挑好的用。好聚好散，不好吗？”
宝玉听了这些话，气的浑身乱战，因说道：“你不用忙，将来有散的日子！”|宝玉听了这些话，气得浑身发抖，就说：“你不用急，将来总有散的日子！”
! 刚说完宝玉最怕“散”，晴雯就说“好离好散”，宝玉气得说“将来有散的日子”。一句气话，后来成了真：第七十七回晴雯被撵出去，病死在家里。
! 晴雯敢顶撞宝玉，在丫头里只有她一个。她心直口快，不肯受一点委屈，这是她最可爱的地方，也是她招祸的根源。

# 五、晴雯讥讽袭人
袭人在那边早已听见，忙赶过来向宝玉道：“好好的，又怎么了？可是我说的‘一时我不到，就有事故儿’。”|袭人在那边早已听见了，赶紧过来对宝玉说：“好好的，又怎么了？真是我说的‘我一会儿不在，就出事’。”
晴雯听了冷笑道：“姐姐既会说，就该早来，也省了爷生气。|晴雯听了冷笑道：“姐姐既然这么会说，就该早点来，也省得爷生气。
自古以来，就是你一个人伏侍爷的，我们原没伏侍过。|从古到今，就是你一个人伺候爷，我们本来就没伺候过。
因为你伏侍的好，昨日才挨窝心脚，我们不会伏侍的，到明儿还不知是个什么罪呢！”|因为你伺候得好，昨天才挨了窝心脚；我们不会伺候的，以后还不知道要受什么罪呢！”
袭人听了这话，又是恼，又是愧，待要说几句话，又见宝玉已经气的黄了脸，少不得自己忍了性子，|袭人听了这话，又恼又愧，想说几句，又见宝玉已经气得脸都黄了，只好自己忍住性子，
推晴雯道：“好妹妹，你出去逛逛，原是我们的不是。”|推着晴雯说：“好妹妹，你出去逛逛吧，原是我们的不是。”
晴雯听他说”我们”两个字，自然是他和宝玉了，不觉又添了酸意，冷笑几声，道：|晴雯听她说“我们”两个字，自然指的是她和宝玉，不由得又添了醋意，冷笑几声，说：
“我倒不知道你们是谁，别教我替你们害臊了！|“我倒不知道你们是谁，别叫我替你们害臊了！
便是你们鬼鬼祟祟干的那事儿，也瞒不过我去，那里就称起‘我们’来了。|就是你们偷偷摸摸干的那些事，也瞒不过我，哪里就称起‘我们’来了。
明公正道，连个姑娘还没挣上去呢，也不过和我似的，那里就称上‘我们’了！”|正经名分上，连个姨娘都还没挣上呢，也不过跟我一样是个丫头，哪里就称上‘我们’了！”
袭人羞的脸紫胀起来，想一想，原来是自己把话说错了。|袭人羞得脸都涨紫了，想一想，原来是自己把话说错了。
! “姑娘”在这里指侍妾、姨娘。袭人说“我们”，是把自己和宝玉算在一起，好像已经是宝玉的人了。晴雯一下子就抓住了这个字。
! “鬼鬼祟祟干的那事儿”，指第六回袭人和宝玉初试云雨情。这件事晴雯知道，当众说破，所以袭人羞得脸都紫了。

# 六、宝玉要撵晴雯
宝玉一面说：“你们气不忿，我明儿偏抬举他。”|宝玉在一边说：“你们不服气，我明天偏要抬举她。”
袭人忙拉了宝玉的手道：“他一个糊涂人，你和他分证什么？|袭人连忙拉住宝玉的手说：“她一个糊涂人，你跟她争什么？
况且你素日又是有担待的，比这大的过去了多少，今儿是怎么了？”|况且你平时最能容人，比这大的事都过去了多少，今天是怎么了？”
晴雯冷笑道：“我原是糊涂人，那里配和我说话呢！”|晴雯冷笑道：“我本来就是糊涂人，哪里配和你们说话呢！”
袭人听说道：“姑娘倒是和我拌嘴呢，是和二爷拌嘴呢？|袭人听了说：“姑娘到底是跟我吵呢，还是跟二爷吵呢？
要是心里恼我，你只和我说，不犯著当著二爷吵，要是恼二爷，不该这们吵的万人知道。|要是心里恼我，你只跟我说，犯不着当着二爷吵；要是恼二爷，也不该吵得人人都知道。
我才也不过为了事，进来劝开了，大家保重。|我刚才也不过是为了这件事，进来劝开，大家都好。
姑娘倒寻上我的晦气。又不象是恼我，又不象是恼二爷，夹枪带棒，终久是个什么主意？|姑娘倒找起我的麻烦来了。又不像是恼我，又不像是恼二爷，夹枪带棒的，到底是什么意思？
我就不多说，让你说去。”说著便往外走。|我就不多说了，让你说去。”说着就往外走。
宝玉向晴雯道：“你也不用生气，我也猜著你的心事了。|宝玉对晴雯说：“你也不用生气，我也猜着你的心思了。
我回太太去，你也大了，打发你出去好不好？”|我去回太太，你也大了，打发你出去好不好？”
晴雯听了这话，不觉又伤心起来，含泪说道：“为什么我出去？|晴雯听了这话，不由得又伤心起来，含着泪说：“为什么叫我出去？
要嫌我，变著法儿打发我出去，也不能够。”|就算嫌弃我，变着法子要打发我出去，也办不到。”
宝玉道：“我何曾经过这个吵闹？一定是你要出去了。不如回太太，打发你去吧。”|宝玉说：“我什么时候经过这种吵闹？一定是你想出去了。不如回了太太，打发你走吧。”
说著，站起来就要走。|说着，站起来就要走。
袭人忙回身拦住，笑道：“往那里去？”|袭人连忙回身拦住，笑道：“往哪里去？”
宝玉道：“回太太去。”|宝玉说：“去回太太。”
袭人笑道：“好没意思！真个的去回，你也不怕臊了？|袭人笑道：“真没意思！真的去回，你也不怕害臊？
便是他认真的要去，也等把这气下去了，等无事中说话儿回了太太也不迟。|就算她真的要走，也等这口气下去了，等没事的时候顺便回了太太也不迟。
这会子急急的当作一件正经事去回，岂不叫太太犯疑？”|这会儿急急忙忙当成一件正经事去回，岂不叫太太起疑心？”
宝玉道：“太太必不犯疑，我只明说是他闹著要去的。”|宝玉说：“太太一定不会起疑，我就明说是她闹着要走的。”
晴雯哭道：“我多早晚闹著要去了？饶生了气，还拿话压派我。|晴雯哭道：“我什么时候闹着要走了？自己生了气，还拿话来压我。
只管去回，我一头碰死了也不出这门儿。”|只管去回，我一头撞死也不出这个门。”
宝玉道：“这也奇了。你又不去，你又闹些什么？我经不起这吵，不如去了倒干净。”|宝玉说：“这就奇了。你又不走，你又闹什么？我受不了这吵闹，不如你走了倒干净。”
说著一定要去回。|说着非要去回不可。
! 晴雯说“一头碰死了也不出这门儿”，她宁死也要留在怡红院。可最后撵她出去的不是宝玉，是王夫人；宝玉那时一句话也没能替她说。
! 袭人说“岂不叫太太犯疑”，她最懂王夫人。王夫人最恨的就是丫头们闹事、勾引宝玉。

# 七、众人跪求
袭人见拦不住，只得跪下了。|袭人见拦不住，只好跪下了。
碧痕，秋纹，麝月等众丫鬟见吵闹，都鸦雀无闻的在外头听消息，|碧痕、秋纹、麝月等丫鬟见吵闹起来，都悄没声地在外面听动静，
这会子听见袭人跪下央求，便一齐进来都跪下了。|这会儿听见袭人跪下求情，就一齐进来都跪下了。
宝玉忙把袭人扶起来，叹了一声，在床上坐下，叫众人起去，|宝玉连忙把袭人扶起来，叹了一声，在床上坐下，叫大家起来，
向袭人道：“叫我怎么样才好！这个心使碎了也没人知道。”|对袭人说：“叫我怎么样才好！我这颗心操碎了也没人知道。”
说著不觉滴下泪来。|说着不由得掉下泪来。
袭人见宝玉流下泪来，自己也就哭了。|袭人见宝玉流泪，自己也哭了。
! 宝玉说“这个心使碎了也没人知道”。他对每一个女孩子都好，可她们彼此之间争风吃醋，他夹在中间，谁也护不住。

# 八、黛玉叫袭人“嫂子”
晴雯在旁哭著，方欲说话，只见林黛玉进来，便出去了。|晴雯在一旁哭着，正想说话，只见林黛玉进来了，她就出去了。
林黛玉笑道：“大节下怎么好好的哭起来？难道是为争粽子吃争恼了不成？”|林黛玉笑道：“大过节的，怎么好好的哭起来了？难道是为了抢粽子吃，抢恼了不成？”
宝玉和袭人嗤的一笑。|宝玉和袭人扑哧一笑。
黛玉道：“二哥哥不告诉我，我问你就知道了。”|黛玉说：“二哥哥不告诉我，我问你就知道了。”
一面说，一面拍著袭人的肩，笑道：“好嫂子，你告诉我。必定是你两个拌了嘴了。|一边说，一边拍着袭人的肩膀，笑道：“好嫂子，你告诉我。一定是你们两个拌嘴了。
告诉妹妹，替你们和劝和劝。”|告诉妹妹，我替你们劝和劝和。”
袭人推他道：“林姑娘你闹什么？我们一个丫头，姑娘只是混说。”|袭人推她说：“林姑娘你闹什么？我们不过是个丫头，姑娘净胡说。”
黛玉笑道：“你说你是丫头，我只拿你当嫂子待。”|黛玉笑道：“你说你是丫头，我只把你当嫂子看。”
宝玉道：“你何苦来替他招骂名儿。饶这么著，还有人说闲话，还搁的住你来说他。”|宝玉说：“你何苦替她招骂名。就这样还有人说闲话呢，哪里经得起你再这样说她。”
袭人笑道：“林姑娘，你不知道我的心事，除非一口气不来死了倒也罢了。”|袭人笑道：“林姑娘，你不知道我的心事，除非一口气上不来死了，倒也罢了。”
林黛玉笑道：“你死了，别人不知怎么样，我先就哭死了。”|林黛玉笑道：“你死了，别人不知道怎么样，我先就哭死了。”
宝玉笑道：“你死了，我作和尚去。”|宝玉笑道：“你死了，我做和尚去。”
袭人笑道：“你老实些罢，何苦还说这些话。”|袭人笑道：“你老实些吧，何苦还说这些话。”
林黛玉将两个指头一伸，抿嘴笑道：“作了两个和尚了。我从今以后都记著你作和尚的遭数儿。”|林黛玉伸出两个手指，抿着嘴笑道：“已经做了两回和尚了。我从今以后要记着你做和尚的次数。”
宝玉听得，知道是他点前儿的话，自己一笑也就罢了。|宝玉听了，知道她是在点前天的话，自己一笑也就算了。
! 黛玉叫袭人“好嫂子”，是开玩笑，也是试探。她心里清楚袭人和宝玉的关系，用玩笑说出来，大家都不尴尬。
! 宝玉前天对黛玉说“你死了，我做和尚”，今天又对袭人这么说。黛玉伸出两个指头，醋意全在笑里。宝玉的“做和尚”，人人都说得。

# 九、宝玉误把晴雯当袭人
一时黛玉去后，就有人说“薛大爷请”，宝玉只得去了。|一会儿黛玉走了，就有人来说“薛大爷请”，宝玉只好去了。
原来是吃酒，不能推辞，只得尽席而散。|原来是喝酒，推辞不掉，只好喝到散席。
晚间回来，已带了几分酒，踉跄来至自己院内，|晚上回来，已经有几分醉意，踉踉跄跄走进自己院子，
只见院中早把乘凉枕榻设下，榻上有个人睡著。|只见院子里早已摆好了乘凉的枕头和凉榻，榻上有个人睡着。
宝玉只当是袭人，一面在榻沿上坐下，一面推他，问道：“疼的好些了？”|宝玉以为是袭人，一边在榻沿上坐下，一边推她，问：“疼得好些了吗？”
只见那人翻身起来说：“何苦来，又招我！”|只见那人翻身起来说：“何苦呢，又来招惹我！”
宝玉一看，原来不是袭人，却是晴雯。|宝玉一看，原来不是袭人，是晴雯。
宝玉将他一拉，拉在身旁坐下，笑道：“你的性子越发惯娇了。|宝玉把她一拉，拉到身边坐下，笑道：“你的性子越来越娇惯了。
早起就是跌了扇子，我不过说了那两句，你就说上那些话。|早上不过是摔了扇子，我不过说了两句，你就说了那么多。
说我也罢了，袭人好意来劝，你又括上他，你自己想想，该不该？”|说我也就罢了，袭人好心来劝，你又扯上她，你自己想想，该不该？”
晴雯道：“怪热的，拉拉扯扯作什么！叫人来看见象什么！我这身子也不配坐在这里。”|晴雯说：“这么热，拉拉扯扯干什么！叫人看见像什么样子！我这身子也不配坐在这里。”
宝玉笑道：“你既知道不配，为什么睡著呢？”|宝玉笑道：“你既然知道不配，为什么还在这里睡着呢？”
晴雯没的话，嗤的又笑了，说：“你不来便使得，你来了就不配了。|晴雯没话可说，扑哧又笑了，说：“你不来就行，你来了就不配了。
起来，让我洗澡去。袭人麝月都洗了澡。我叫了他们来。”|起来，让我洗澡去。袭人、麝月都洗过了。我叫她们来。”
! 白天还吵得要撵人，晚上宝玉先来哄晴雯。宝玉从不记仇，这是他待女孩子的好处。
! 晴雯睡在宝玉的乘凉榻上，这本是袭人的位置。她嘴上说“不配”，人却睡在那里。

# 十、晴雯不肯同洗
宝玉笑道：“我才又吃了好些酒，还得洗一洗。你既没有洗，拿了水来咱们两个洗。”|宝玉笑道：“我刚才又喝了好些酒，还得洗一洗。你既然没洗，拿水来咱们两个一起洗。”
晴雯摇手笑道：“罢，罢，我不敢惹爷。|晴雯摆手笑道：“算了算了，我不敢招惹爷。
还记得碧痕打发你洗澡，足有两三个时辰，也不知道作什么呢。我们也不好进去的。|还记得碧痕伺候你洗澡，整整两三个时辰，也不知道干什么呢。我们也不好进去。
后来洗完了，进去瞧瞧，地下的水淹著床腿，连席子上都汪著水，也不知是怎么洗了，笑了几天。|后来洗完了，进去一看，地上的水淹到了床腿，连席子上都汪着水，也不知道是怎么洗的，大家笑了好几天。
我也没那工夫收拾，也不用同我洗去。|我也没那工夫收拾，也不用跟我一起洗。
今儿也凉快，那会子洗了，可以不用再洗。|今天也凉快，那会儿洗过了，可以不用再洗了。
我倒舀一盆水来，你洗洗脸通通头。|我倒是打一盆水来，你洗洗脸、梳梳头。
才刚鸳鸯送了好些果子来，都湃在那水晶缸里呢，叫他们打发你吃。”|刚才鸳鸯送了好些水果来，都冰在那水晶缸里呢，叫她们拿给你吃。”
宝玉笑道：“既这么著，你也不许洗去，只洗洗手来拿果子来吃罢。”|宝玉笑道：“既然这样，你也别去洗了，只洗洗手，拿果子来吃吧。”
! 晴雯说碧痕伺候宝玉洗澡“也不知道作什么”，暗指碧痕和宝玉有私情。晴雯拒绝同洗，可见她虽然泼辣，却清清白白。
! 晴雯最后被撵，罪名恰恰是“狐狸精”“勾引宝玉”。真正清白的是她，背了罪名的也是她。

# 十一、撕扇子
晴雯笑道：“我慌张的很，连扇子还跌折了，那里还配打发吃果子。|晴雯笑道：“我毛手毛脚的，连扇子都摔断了，哪里还配伺候你吃果子。
倘或再打破了盘子，还更了不得呢。”|要是再打破了盘子，那更不得了了。”
宝玉笑道：“你爱打就打，这些东西原不过是借人所用，你爱这样，我爱那样，各自性情不同。|宝玉笑道：“你爱打就打，这些东西本来就是给人用的，你喜欢这样，我喜欢那样，各人性情不同。
比如那扇子原是扇的，你要撕著玩也可以使得，只是不可生气时拿他出气。|比如扇子本来是扇风的，你要撕着玩也行，只是不能生气的时候拿它出气。
就如杯盘，原是盛东西的，你喜听那一声响，就故意的碎了也可以使得，只是别在生气时拿他出气。|就像杯盘，本来是盛东西的，你喜欢听那一声响，故意摔碎也行，只是别在生气的时候拿它出气。
这就是爱物了。”|这就是爱惜东西了。”
晴雯听了，笑道：“既这么说，你就拿了扇子来我撕。我最喜欢撕的。”|晴雯听了，笑道：“既然这么说，你就拿扇子来给我撕。我最喜欢撕东西了。”
宝玉听了，便笑著递与他。|宝玉听了，就笑着递给她。
晴雯果然接过来，嗤的一声，撕了两半，接著嗤嗤又听几声。|晴雯果然接过来，嗤的一声撕成两半，接着又听见嗤嗤几声。
宝玉在旁笑著说：“响的好，再撕响些！”|宝玉在旁边笑着说：“响得好，再撕响些！”
正说著，只见麝月走过来，笑道：“少作些孽罢。”|正说着，只见麝月走过来，笑道：“少造点孽吧。”
宝玉赶上来，一把将他手里的扇子也夺了递与晴雯。|宝玉赶上去，一把把她手里的扇子也抢过来递给晴雯。
晴雯接了，也撕了几半子，二人都大笑。|晴雯接过来，也撕成了几片，两人都大笑。
麝月道：“这是怎么说，拿我的东西开心儿？”|麝月说：“这是怎么说的，拿我的东西寻开心？”
宝玉笑道：“打开扇子匣子你拣去，什么好东西！”|宝玉笑道：“打开扇子匣子你随便挑，什么好东西！”
麝月道：“既这么说，就把匣子搬了出来，让他尽力的撕，岂不好？”|麝月说：“既然这么说，就把匣子搬出来，让她使劲撕，岂不好？”
宝玉笑道：“你就搬去。”|宝玉笑道：“你就去搬。”
麝月道：“我可不造这孽。他也没折了手，叫他自己搬去。”|麝月说：“我可不造这个孽。她手也没断，叫她自己搬去。”
晴雯笑著，倚在床上说道：“我也乏了，明儿再撕罢。”|晴雯笑着，靠在床上说：“我也累了，明天再撕吧。”
宝玉笑道：“古人云，‘千金难买一笑’，几把扇子能值几何！”|宝玉笑道：“古人说，‘千金难买一笑’，几把扇子能值几个钱！”
一面说著，一面叫袭人。|一边说着，一边叫袭人。
袭人才换了衣服走出来，小丫头佳蕙过来拾去破扇，大家乘凉，不消细说。|袭人刚换了衣服走出来，小丫头佳蕙过来把破扇子捡走，大家乘凉，不必细说。
! 回目“撕扇子作千金一笑”。早上为一把扇子吵到要撵人，晚上却一把一把地撕着玩。宝玉气的从来不是东西，是晴雯的话。
! 宝玉说“爱物”，是说东西是为人所用的，能叫人一笑，就是用得其所。这话听着荒唐，却是宝玉看重人胜过看重物。
! 晴雯撕扇，是她一生最快活的时刻。读到第七十七回她病死，再回头看这里，格外令人心酸。

# 十二、史湘云来了
至次日午间，王夫人，薛宝钗，林黛玉众姊妹正在贾母房内坐著，就有人回：“史大姑娘来了。”|到第二天中午，王夫人、薛宝钗、林黛玉和姐妹们正在贾母房里坐着，就有人来报：“史大姑娘来了。”
一时果见史湘云带领众多丫鬟媳妇走进院来。|一会儿果然看见史湘云带着许多丫鬟媳妇走进院子来。
宝钗，黛玉等忙迎至阶下相见。|宝钗、黛玉等人连忙迎到台阶下相见。
青年姊妹间经月不见，一旦相逢，其亲密自不必细说。|年轻姐妹们一个多月不见，一旦相逢，那份亲热自然不必细说。
一时进入房中，请安问好，都见过了。|一会儿进了屋，请安问好，都见过了。
贾母因说：“天热，把外头的衣服脱脱罢。”|贾母就说：“天热，把外面的衣服脱了吧。”
史湘云忙起身宽衣。|史湘云连忙起身脱外衣。
王夫人因笑道：“也没见穿上这些作什么？”|王夫人就笑道：“也不知道穿这么多干什么？”
史湘云笑道：“都是二婶婶叫穿的，谁愿意穿这些。”|史湘云笑道：“都是二婶婶叫穿的，谁愿意穿这些。”
! 湘云从小父母双亡，跟着叔叔婶婶过。大热天穿这么多，是婶婶要她穿得体面出门。一句“谁愿意穿这些”，看出她在家里做不得主。

# 十三、湘云的淘气旧事
宝钗一旁笑道：“姨娘不知道，他穿衣裳还更爱穿别人的衣裳。|宝钗在一旁笑道：“姨妈不知道，她穿衣裳更爱穿别人的衣裳。
可记得旧年三四月里，他在这里住著，把宝兄弟的袍子穿上，靴子也穿上，额子也勒上，|还记得去年三四月里，她在这里住着，把宝兄弟的袍子穿上，靴子也穿上，抹额也系上，
猛一瞧倒象是宝兄弟，就是多两个坠子。|猛一看倒像是宝兄弟，就是多了一对耳坠子。
他站在那椅子后边，哄的老太太只是叫‘宝玉，你过来，仔细那上头挂的灯穗子招下灰来，迷了眼。’|她站在那椅子后面，哄得老太太一个劲儿地叫：‘宝玉，你过来，小心上面挂的灯穗子落下灰来迷了眼。’
他只是笑，也不过去。|她只是笑，也不过去。
后来大家撑不住笑了，老太太才笑了，说‘倒扮上男人好看了’。”|后来大家忍不住笑了，老太太才笑了，说：‘扮成男人倒好看。’”
林黛玉道：“这算什么。惟有前年正月里接了他来，住了没两日就下起雪来，|林黛玉说：“这算什么。前年正月里接她来，住了没两天就下起雪来，
老太太和舅母那日想是才拜了影回来，老太太的一个新新的大红猩猩毡斗篷放在那里，|老太太和舅母那天大概是刚祭拜完祖先画像回来，老太太一件崭新的大红猩猩毡斗篷放在那里，
谁知眼错不见他就披了，又大又长，他就拿了个汗巾子拦腰系上，|谁知一眨眼她就披上了，又大又长，她就拿了条汗巾拦腰系上，
和丫头们在后院子扑雪人儿去，一跤栽到沟跟前，弄了一身泥水。”|和丫头们到后院去堆雪人，一跤摔到沟边，弄了一身泥水。”
说著，大家想著前情，都笑了。|说着，大家想起以前的事，都笑了。
宝钗笑向那周奶妈道：“周妈，你们姑娘还是那么淘气不淘气了？”|宝钗笑着对周奶妈说：“周妈，你们姑娘还那么淘气吗？”
周奶娘也笑了。|周奶妈也笑了。
迎春笑道：“淘气也罢了，我就嫌他爱说话。|迎春笑道：“淘气也就罢了，我就嫌她爱说话。
也没见睡在那里还是咭咭呱呱，笑一阵，说一阵，也不知那里来的那些话。”|没见过睡在那里还叽叽呱呱的，笑一阵说一阵，也不知道哪来那么多话。”
王夫人道：“只怕如今好了。前日有人家来相看，眼见有婆婆家了，还是那们著。”|王夫人说：“只怕现在好些了。前些天有人家来相亲，眼看就要有婆家了，还能那样吗。”
贾母因问：“今儿还是住著，还是家去呢？”|贾母就问：“今天是住下，还是回家？”
周奶娘笑道：“老太太没有看见衣服都带了来，可不住两天？”|周奶妈笑道：“老太太没看见衣服都带来了，可不是要住两天？”
! 湘云穿男装、披斗篷扑雪人，是个不拘小节的豪爽女孩。宝钗、黛玉一人说一件事，说的都是湘云的可爱。
! “有人家来相看”，湘云已经定了亲。这是全书第一次提到湘云的婚事。

# 十四、宝玉来了
史湘云问道：“宝玉哥哥不在家么？”|史湘云问：“宝玉哥哥不在家吗？”
宝钗笑道：“他再不想著别人，只想宝兄弟，两个人好憨的。这可见还没改了淘气。”|宝钗笑道：“她不想别人，只想着宝兄弟，两个人都是一样的傻气。可见还没改了淘气。”
贾母道：“如今你们大了，别提小名儿了。”|贾母说：“如今你们都大了，别再叫小名了。”

王夫人道：“这里老太太才说这一个，他又来提名道姓的了。”|王夫人说：“这里老太太刚说了这个，他又来叫名字了。”
林黛玉道：“你哥哥得了好东西，等著你呢。”|林黛玉说：“你哥哥得了好东西，等着你呢。”
史湘云道：“什么好东西？”|史湘云说：“什么好东西？”
宝玉笑道：“你信他呢！几日不见，越发高了。”|宝玉笑道：“你别信她！几天不见，又长高了。”
! 黛玉说的“好东西”，就是宝玉在清虚观揣起来的金麒麟。宝玉赶紧岔开，怕黛玉又提这件事。

# 十五、绛纹石戒指
湘云笑道：“袭人姐姐好？”|湘云笑道：“袭人姐姐好吗？”
宝玉道：“多谢你记挂。”|宝玉说：“多谢你惦记。”
湘云道：“我给他带了好东西来了。”|湘云说：“我给她带了好东西来。”
说著，拿出手帕子来，挽著一个疙瘩。|说着，拿出一块手帕，挽着一个结。

湘云笑道：“这是什么？”说著便打开。|湘云笑道：“这是什么？”说着就打开了。
众人看时，果然就是上次送来的那绛纹戒指，一包四个。|大家一看，果然就是上次送来的那种绛纹戒指，一包四个。
林黛玉笑道：“你们瞧瞧他这主意。|林黛玉笑道：“你们瞧瞧她这主意。
前儿一般的打发人给我们送了来，你就把他的带来岂不省事？|前些天一样打发人给我们送来了，你把她的一起带来岂不省事？
今儿巴巴的自己带了来，我当又是什么新奇东西，原来还是他。真真你是糊涂人。”|今天特地自己带来，我还以为又是什么新奇东西，原来还是这个。你真是个糊涂人。”
史湘云笑道：“你才糊涂呢！我把这理说出来，大家评一评谁糊涂。|史湘云笑道：“你才糊涂呢！我把道理说出来，大家评评到底谁糊涂。
给你们送东西，就是使来的不用说话，拿进来一看，自然就知是送姑娘们的了，|给你们送东西，派来的人不用说话，拿进来一看，自然就知道是送姑娘们的，
若带他们的东西，这得我先告诉来人，这是那一个丫头的，那是那一个丫头的，|要是带她们的东西，就得我先告诉来人，这是哪个丫头的，那是哪个丫头的，
那使来的人明白还好，再糊涂些，丫头的名字他也不记得，混闹胡说的，反连你们的东西都搅糊涂了。|那派来的人明白还好，要是糊涂些，丫头的名字都记不住，乱说一通，反倒连你们的东西都搅乱了。
若是打发个女人素日知道的还罢了，偏生前儿又打发小子来，可怎么说丫头们的名字呢？|要是打发个平时熟悉的女人来还罢了，偏偏前些天派的是小厮，叫他怎么说丫头们的名字呢？
横竖我来给他们带来，岂不清白。”|反正我自己来给她们带来，岂不清楚。”
说著，把四个戒指放下，说道：|说着，把四个戒指放下，说：
“袭人姐姐一个，鸳鸯姐姐一个，金钏儿姐姐一个，平儿姐姐一个：这倒是四个人的，难道小子们也记得这们清白？”|“袭人姐姐一个，鸳鸯姐姐一个，金钏儿姐姐一个，平儿姐姐一个：这是四个人的，难道小厮们也能记得这么清楚？”
众人听了都笑道：“果然明白。”|大家听了都笑道：“果然想得明白。”
宝玉笑道：“还是这么会说话，不让人。”|宝玉笑道：“还是这么会说话，一点不让人。”
! 湘云送戒指，连丫头们都记着，而且亲自带来，怕男仆传错了名字。她看着大大咧咧，心却细。
! 四个戒指里有一个是给金钏儿的。湘云还不知道，金钏儿前天已经被撵出去，今天就要投井了。

# 十六、黛玉讽金麒麟
林黛玉听了，冷笑道：“他不会说话，他的金麒麟会说话。”|林黛玉听了，冷笑道：“她不会说话，她的金麒麟会说话。”
一面说著，便起身走了。|一边说着，就起身走了。
幸而诸人都不曾听见，只有薛宝钗抿嘴一笑。|幸好大家都没听见，只有薛宝钗抿嘴一笑。
宝玉听见了，倒自己后悔又说错了话，忽见宝钗一笑，由不得也笑了。|宝玉听见了，倒后悔自己又说错了话，忽然看见宝钗一笑，也不由得笑了。
宝钗见宝玉笑了，忙起身走开，找了林黛玉去说话。|宝钗见宝玉笑了，连忙起身走开，去找林黛玉说话。
! 宝玉夸湘云“会说话”，黛玉立刻想到那只金麒麟。湘云有金麒麟，宝玉也揣着一只，“金”和“玉”又凑到了一起。
! 宝钗一笑，是笑黛玉又吃醋了。宝玉跟着一笑，宝钗立刻走开。她不愿和宝玉一起笑黛玉，处处避嫌。

# 十七、湘云论阴阳
贾母向湘云道：“吃了茶歇一歇，瞧瞧你的嫂子们去。园里也凉快，同你姐姐们去逛逛。”|贾母对湘云说：“喝了茶歇一歇，去看看你的嫂子们。园子里也凉快，和你姐姐们去逛逛。”
湘云答应了，将三个戒指儿包上，歇了一歇，便起身要瞧凤姐等人去。|湘云答应了，把三个戒指包好，歇了一会儿，就起身去看凤姐等人。
众奶娘丫头跟著，到了凤姐那里，说笑了一回，出来便往大观园来，|奶妈丫头们跟着，到了凤姐那里，说笑了一阵，出来就往大观园去，
见过了李宫裁，少坐片时，便往怡红院来找袭人。|见过了李纨，坐了一会儿，就往怡红院去找袭人。
因回头说道：“你们不必跟著，只管瞧你们的朋友亲戚去，留下翠缕伏侍就是了。”|就回头说：“你们不用跟着，只管去看你们的朋友亲戚，留下翠缕伺候就行了。”
众人听了，自去寻姑觅嫂，早剩下湘云翠缕两个人。|大家听了，各自去找姑姑嫂子了，只剩下湘云和翠缕两个人。
翠缕道：“这荷花怎么还不开？”|翠缕说：“这荷花怎么还不开？”
史湘云道：“时侯没到。”|史湘云说：“时候没到。”
翠缕道：“这也和咱们家池子里的一样，也是楼子花？”|翠缕说：“这也和咱们家池子里的一样，也是重瓣的楼子花吗？”
湘云道：“他们这个还不如咱们的。”|湘云说：“他们这个还不如咱们的。”
翠缕道：“他们那边有棵石榴，接连四五枝，真是楼子上起楼子，这也难为他长。”|翠缕说：“他们那边有棵石榴，接连开了四五层，真是楼上又起楼，也难为它长成这样。”
史湘云道：“花草也是同人一样，气脉充足，长的就好。”|史湘云说：“花草也和人一样，气血充足，就长得好。”
翠缕把脸一扭，说道：“我不信这话。若说同人一样，我怎么不见头上又长出一个头来的人？”|翠缕把脸一扭，说：“我不信这话。要说和人一样，我怎么没见过头上又长出一个头来的人？”
湘云听了由不得一笑，说道：“我说你不用说话，你偏好说。这叫人怎么好答言？|湘云听了不由得一笑，说：“我说你别说话，你偏爱说。这叫人怎么回答？
天地间都赋阴阳二气所生，或正或邪，或奇或怪，千变万化，都是阴阳顺逆。|天地间万物都是阴阳二气生成的，有正有邪，有奇有怪，千变万化，都是阴阳顺逆的结果。
多少一生出来，人罕见的就奇，究竟理还是一样。”|多少东西一生出来，人们少见的就觉得奇怪，说到底道理还是一样的。”
! 湘云和丫头翠缕边走边聊，一个是贵族小姐，一个是天真丫头，说的却是天地阴阳的大道理。这一段是全书少有的谐趣文字。

# 十八、“阴阳”问答
翠缕道：“这么说起来，从古至今，开天辟地，都是阴阳了？”|翠缕说：“这么说来，从古到今，开天辟地，都是阴阳了？”
湘云笑道：“糊涂东西，越说越放屁。什么‘都是些阴阳’，难道还有个阴阳不成！|湘云笑道：“糊涂东西，越说越胡说。什么‘都是些阴阳’，难道还有一个叫‘阴阳’的东西不成！
‘阴’‘阳’两个字还只是一字，阳尽了就成阴，阴尽了就成阳，|‘阴’‘阳’两个字其实只是一回事，阳到了尽头就成了阴，阴到了尽头就成了阳，
不是阴尽了又有个阳生出来，阳尽了又有个阴生出来。”|不是阴尽了又另外生出一个阳来，阳尽了又另外生出一个阴来。”
翠缕道：“这糊涂死了我！什么是个阴阳，没影没形的。我只问姑娘，这阴阳是怎么个样儿？”|翠缕说：“这可把我糊涂死了！什么叫阴阳，没影没形的。我只问姑娘，这阴阳是什么样子？”
湘云道：“阴阳可有什么样儿，不过是个气，器物赋了成形。|湘云说：“阴阳哪有什么样子，不过是一股气，东西有了这股气就成了形。
比如天是阳，地就是阴，水是阴，火就是阳，日是阳，月就是阴。”|比如天是阳，地就是阴；水是阴，火就是阳；太阳是阳，月亮就是阴。”
翠缕听了，笑道：“是了，是了，我今儿可明白了。|翠缕听了，笑道：“是了是了，我今天可明白了。
怪道人都管著日头叫‘太阳’呢，算命的管著月亮叫什么‘太阴星’，就是这个理了。”|怪不得人都把日头叫‘太阳’，算命的把月亮叫什么‘太阴星’，就是这个道理。”
湘云笑道：“阿弥陀佛！刚刚的明白了。”|湘云笑道：“阿弥陀佛！总算明白了。”
翠缕道：“这些大东西有阴阳也罢了，难道那些蚊子，虼蚤，蠓虫儿，花儿，草儿，瓦片儿，砖头儿也有阴阳不成？”|翠缕说：“这些大东西有阴阳也就罢了，难道那些蚊子、跳蚤、小飞虫、花儿、草儿、瓦片儿、砖头儿也有阴阳不成？”
湘云道：“怎么有没阴阳的呢？比如那一个树叶儿还分阴阳呢，|湘云说：“怎么会没有阴阳呢？比如一片树叶还分阴阳呢，
那边向上朝阳的便是阳，这边背阴覆下的便是阴。”|那边向上朝着太阳的就是阳，这边背着太阳朝下的就是阴。”
翠缕听了，点头笑道：“原来这样，我可明白了。|翠缕听了，点头笑道：“原来是这样，我可明白了。
只是咱们这手里的扇子，怎么是阳，怎么是阴呢？”|只是咱们手里的扇子，哪边是阳，哪边是阴呢？”
湘云道：“这边正面就是阳，那边反面就为阴。”|湘云说：“这边正面就是阳，那边反面就是阴。”
! 湘云说“阳尽了就成阴，阴尽了就成阳”，盛极必衰，衰极又生。这是阴阳的道理，也是贾府兴衰的道理。

# 十九、金麒麟的阴阳
翠缕又点头笑了，还要拿几件东西问，因想不起个什么来，|翠缕又点头笑了，还想拿几样东西来问，一时想不起什么，
猛低头就看见湘云宫绦上系的金麒麟，便提起来问道：“姑娘，这个难道也有阴阳？”|猛一低头看见湘云宫绦上系的金麒麟，就提起来问：“姑娘，这个难道也有阴阳？”
湘云道：“走兽飞禽，雄为阳，雌为阴，牝为阴，牡为阳。怎么没有呢！”|湘云说：“走兽飞禽，雄的是阳，雌的是阴；母的是阴，公的是阳。怎么会没有呢！”
翠缕道：“这是公的，到底是母的呢？”|翠缕说：“这个是公的，还是母的呢？”
湘云道：“这连我也不知道。”|湘云说：“这连我也不知道。”
翠缕道：“这也罢了，怎么东西都有阴阳，咱们人倒没有阴阳呢？”|翠缕说：“这也罢了，怎么东西都有阴阳，咱们人倒没有阴阳呢？”
湘云照脸啐了一口道“下流东西，好生走罢！越问越问出好的来了！”|湘云照着她的脸啐了一口说：“不害臊的东西，好好走路吧！越问越问出好话来了！”
翠缕笑道：“这有什么不告诉我的呢？我也知道了，不用难我。”|翠缕笑道：“这有什么不能告诉我的呢？我也知道了，不用难为我。”
湘云笑道：“你知道什么？”|湘云笑道：“你知道什么？”
翠缕道：“姑娘是阳，我就是阴。”|翠缕说：“姑娘是阳，我就是阴。”
说著，湘云拿手帕子握著嘴，呵呵的笑起来。|说着，湘云用手帕捂着嘴，呵呵地笑起来。
翠缕道：“说是了，就笑的这样了。”|翠缕说：“说对了，就笑成这样。”
湘云道：“很是，很是。”|湘云说：“很对，很对。”
翠缕道：“人规矩主子为阳，奴才为阴。我连这个大道理也不懂得？”|翠缕说：“按人的规矩，主子是阳，奴才是阴。我连这个大道理都不懂吗？”
湘云笑道：“你很懂得。”|湘云笑道：“你很懂。”
! 人的阴阳，就是男女。湘云一个未嫁的姑娘，被丫头问到这里，只能啐她一口。翠缕偏偏答出“主子为阳，奴才为阴”，天真得叫人发笑。
! 麒麟分公母，正是后文的伏笔：湘云这只是母的，宝玉揣着的那只是公的，一雌一雄，恰成一对。

# 二十、蔷薇架下拾麒麟
一面说，一面走，刚到蔷薇架下，湘云道：“你瞧那是谁掉的首饰，金晃晃在那里。”|一边说，一边走，刚到蔷薇架下，湘云说：“你看那是谁掉的首饰，金晃晃的在那里。”
翠缕听了，忙赶上拾在手里攥著，笑道：“可分出阴阳来了。”|翠缕听了，连忙赶上去捡起来攥在手里，笑道：“这下可分出阴阳来了。”
说著，先拿史湘云的麒麟瞧。|说着，先拿史湘云的麒麟来看。
湘云要他拣的瞧，翠缕只管不放手，笑道：|湘云要看她捡到的东西，翠缕只是不松手，笑道：
“是件宝贝，姑娘瞧不得。这是从那里来的？好奇怪！我从来在这里没见有人有这个。”|“是件宝贝，姑娘看不得。这是从哪里来的？好奇怪！我从来没在这里见过谁有这个。”
湘云笑道：“拿来我看。”|湘云笑道：“拿来我看。”
翠缕将手一撒，笑道：“请看。”|翠缕把手一摊，笑道：“请看。”
湘云举目一验，却是文彩辉煌的一个金麒麟，比自己佩的又大又有文彩。|湘云抬眼一看，竟是一只花纹灿烂的金麒麟，比自己戴的那只又大又精致。
湘云伸手擎在掌上，只是默默不语，正自出神，|湘云伸手托在掌心里，只是默默不说话，正在出神，
忽见宝玉从那边来了，笑问道：“你两个在这日头底下作什么呢？怎么不找袭人去？”|忽然看见宝玉从那边来了，笑着问：“你们两个在这大太阳底下做什么呢？怎么不去找袭人？”
湘云连忙将那麒麟藏起道：“正要去呢。咱们一处走。”|湘云连忙把麒麟藏起来，说：“正要去呢。咱们一起走。”
说著，大家进入怡红院来。|说着，大家走进了怡红院。
! 又是蔷薇架。昨天龄官在这里画“蔷”字，今天湘云在这里拾到金麒麟。
! 湘云托着麒麟“默默不语”“出神”，她心里想到了什么？这只麒麟和她自己的恰成一对，她已经定了亲，这里面的意思她不能说。
! 湘云一见宝玉就把麒麟藏了起来，可见她已经猜到这是宝玉的。

# 二十一、宝玉丢了麒麟
袭人正在阶下倚槛追风，忽见湘云来了，连忙迎下来，携手笑说一向久别情况。|袭人正靠着栏杆在台阶下乘凉，忽然看见湘云来了，连忙迎下来，拉着手笑着说起这些日子分别以来的情况。
一时进来归坐，宝玉因笑道：“你该早来，我得了一件好东西，专等你呢。”|一会儿进屋坐下，宝玉就笑道：“你该早点来，我得了一件好东西，专门等你呢。”
说著，一面在身上摸掏，掏了半天，呵呀了一声，便问袭人“那个东西你收起来了么？”|说着，一边在身上摸，摸了半天，“哎呀”一声，就问袭人：“那个东西你收起来了吗？”
袭人道：“什么东西？”|袭人说：“什么东西？”
宝玉道：“前儿得的麒麟。”|宝玉说：“前些天得的那只麒麟。”
袭人道：“你天天带在身上的，怎么问我？”|袭人说：“你天天带在身上的，怎么问我？”
宝玉听了，将手一拍说道：“这可丢了，往那里找去！”就要起身自己寻去。|宝玉听了，把手一拍说：“这下丢了，到哪里去找！”就要起身自己去找。
湘云听了，方知是他遗落的，便笑问道：“你几时又有了麒麟了？”|湘云听了，才确定是他丢的，就笑着问：“你什么时候又有了麒麟了？”
宝玉道：“前儿好容易得的呢，不知多早晚丢了，我也糊涂了。”|宝玉说：“前些天好不容易得到的，不知什么时候丢了，我也糊涂了。”
湘云笑道：“幸而是顽的东西，还是这么慌张。”|湘云笑道：“幸好是个玩的东西，你还是这么慌张。”
说著，将手一撒，“你瞧瞧，是这个不是？”|说着，把手一摊：“你看看，是不是这个？”
宝玉一见由不得欢喜非常，因说道……不知是如何，且听下回分解。|宝玉一见，不由得非常欢喜，就说……不知道说了什么，请看下回。
! 宝玉说“专等你呢”，这只麒麟是他特意为湘云留的，因为听说湘云也有一只。

! 湘云当面说宝玉怕黛玉，口无遮拦。宝钗、黛玉、湘云三人里，湘云最直，所以也最常碰钉子。

袭人道：“且别说顽话，正有一件事还要求你呢。”|袭人说：“先别说笑了，正有一件事要求你呢。”
史湘云便问”什么事？”|史湘云就问：“什么事？”
