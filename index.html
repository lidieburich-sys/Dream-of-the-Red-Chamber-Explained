因而悄悄走来，见机行事，以察二人之意。|所以悄悄走来，看情况行事，好观察两人的心意。
不想刚走来，正听见史湘云说经济一事，|没想到刚走来，正听见史湘云说仕途经济的事，
宝玉又说：“林妹妹不说这样混帐话，若说这话，我也和他生分了。”|宝玉又说：“林妹妹不说这种混账话，要是说这种话，我也和她疏远了。”
! 黛玉是来“查”宝玉和湘云的，却意外听到了宝玉对她最真的评价。她怕的是麒麟，听到的是知己。

# 八、喜惊悲叹
林黛玉听了这话，不觉又喜又惊，又悲又叹。|林黛玉听了这话，不由得又喜又惊，又悲又叹。
所喜者，果然自己眼力不错，素日认他是个知己，果然是个知己。|喜的是，自己果然没看错人，平时认定他是知己，他果然是知己。
所惊者，他在人前一片私心称扬于我，其亲热厚密，竟不避嫌疑。|惊的是，他在别人面前一片真心地称赞我，那样亲热，竟然不避嫌疑。
所叹者，你既为我之知己，自然我亦可为你之知己矣，|叹的是，你既然是我的知己，我自然也可以做你的知己，
既你我为知己，则又何必有金玉之论哉；|既然你我是知己，又何必有什么“金玉”之说呢；
既有金玉之论，亦该你我有之，则又何必来一宝钗哉！|既然有“金玉”之说，也该是你我之间的，又何必来一个宝钗呢！
所悲者，父母早逝，虽有铭心刻骨之言，无人为我主张。|悲的是，父母早亡，虽然有铭心刻骨的话，却没有人替我做主。
况近日每觉神思恍惚，病已渐成，医者更云气弱血亏，恐致劳怯之症，|况且最近常觉得精神恍惚，病已经渐渐重了，大夫又说气虚血亏，怕会成痨病，
你我虽为知己，但恐自不能久待，你纵为我知己，奈我薄命何！|你我虽然是知己，只怕我自己等不了多久；你就算是我的知己，又怎奈我命薄！
想到此间，不禁滚下泪来。|想到这里，不由得滚下泪来。
待进去相见，自觉无味，便一面拭泪，一面抽身回去了。|想进去见面，又觉得没意思，就一边擦眼泪，一边转身回去了。
! “喜惊悲叹”四个字，是黛玉一生的心事。宝玉是知己，这是喜；可婚姻要父母做主，她没有父母，这是悲；她身体又一天天坏下去，这是叹。
! “无人为我主张”，是黛玉悲剧的根本。在那个时代，婚姻不由自己，宝玉再爱她，没有长辈出头，一切都是空。
! “劳怯之症”就是肺痨，黛玉自己已经知道病会要她的命。

# 九、诉肺腑
这里宝玉忙忙的穿了衣裳出来，忽见林黛玉在前面慢慢的走著，似有拭泪之状，|宝玉匆匆穿好衣服出来，忽然看见林黛玉在前面慢慢走着，好像在擦眼泪，
便忙赶上来，笑道：“妹妹往那里去？怎么又哭了？又是谁得罪了你？”|就连忙赶上来，笑道：“妹妹到哪里去？怎么又哭了？又是谁得罪你了？”
林黛玉回头见是宝玉，便勉强笑道：“好好的，我何曾哭了。”|林黛玉回头见是宝玉，就勉强笑道：“好好的，我哪里哭了。”
宝玉笑道：“你瞧瞧，眼睛上的泪珠儿未干，还撒谎呢。”|宝玉笑道：“你看看，眼睛上的泪珠还没干，还撒谎呢。”
一面说，一面禁不住抬起手来替他拭泪。|一边说，一边忍不住抬起手来替她擦眼泪。
林黛玉忙向后退了几步，说道：“你又要死了！作什么这么动手动脚的！”|林黛玉连忙往后退了几步，说：“你又找死了！干什么这么动手动脚的！”
宝玉笑道：“说话忘了情，不觉的动了手，也就顾不的死活。”|宝玉笑道：“说话说得忘了情，不知不觉就动了手，也就顾不得死活了。”
林黛玉道：“你死了倒不值什么，只是丢下了什么金，又是什么麒麟，可怎么样呢？”|林黛玉说：“你死了倒没什么，只是丢下了什么金、又是什么麒麟的，可怎么办呢？”
一句话又把宝玉说急了，赶上来问道：“你还说这话，到底是咒我还是气我呢？”|一句话又把宝玉说急了，赶上来问：“你还说这话，到底是咒我还是气我？”
林黛玉见问，方想起前日的事来，遂自悔自己又说造次了，|林黛玉见他这样问，才想起前几天的事来，就后悔自己又说冒失了，
忙笑道：“你别著急，我原说错了。这有什么的，筋都暴起来，急的一脸汗。”|连忙笑道：“你别着急，我说错了。这有什么的，青筋都暴出来了，急得一脸汗。”
一面说，一面禁不住近前伸手替他拭面上的汗。|一边说，一边忍不住走上前伸手替他擦脸上的汗。
! 宝玉替黛玉擦泪，黛玉退开；黛玉替宝玉擦汗，却忍不住走上前。两人心意在这一来一回之间。
! “什么金，又是什么麒麟”，宝钗的金锁，湘云的金麒麟，黛玉一句话里两样都提了。

# 十、“你放心”
宝玉瞅了半天，方说道”你放心”三个字。|宝玉瞅了她半天，才说出“你放心”三个字。
林黛玉听了，怔了半天，方说道：“我有什么不放心的？我不明白这话。你倒说说怎么放心不放心？”|林黛玉听了，愣了半天，才说：“我有什么不放心的？我不明白这话。你倒说说怎么个放心不放心？”
宝玉叹了一口气，问道：“你果不明白这话？难道我素日在你身上的心都用错了？|宝玉叹了一口气，问：“你真不明白这话？难道我平时在你身上用的心都用错了？
连你的意思若体贴不著，就难怪你天天为我生气了。”|要是连你的心思都体会不到，就难怪你天天为我生气了。”
林黛玉道：“果然我不明白放心不放心的话。”|林黛玉说：“我真不明白放心不放心的话。”
宝玉点头叹道：“好妹妹，你别哄我。|宝玉点头叹道：“好妹妹，你别骗我。
果然不明白这话，不但我素日之意白用了，且连你素日待我之意也都辜负了。|要是真不明白这话，不但我平时的心意白用了，连你平时待我的心意也都辜负了。
你皆因总是不放心的原故，才弄了一身病。|你都是因为总不放心的缘故，才弄了一身病。
但凡宽慰些，这病也不得一日重似一日。”|只要宽心些，这病也不会一天比一天重。”
林黛玉听了这话，如轰雷掣电，细细思之，竟比自己肺腑中掏出来的还觉恳切，|林黛玉听了这话，像被雷电击中一样，细细一想，竟比从自己心肺里掏出来的话还要恳切，
竟有万句言语，满心要说，只是半个字也不能吐，却怔怔的望著他。|竟有千言万语，满心想说，却半个字也说不出来，只是呆呆地望着他。
此时宝玉心中也有万句言语，不知从那一句上说起，却也怔怔的望著黛玉。|这时宝玉心里也有千言万语，不知从哪一句说起，也呆呆地望着黛玉。
两个人怔了半天，林黛玉只咳了一声，两眼不觉滚下泪来，回身便要走。|两人呆了半天，林黛玉只咳了一声，两眼不由得滚下泪来，转身就要走。
宝玉忙上前拉住，说道：“好妹妹，且略站住，我说一句话再走。”|宝玉连忙上前拉住她，说：“好妹妹，先站一下，我说一句话你再走。”
林黛玉一面拭泪，一面将手推开，说道：“有什么可说的。你的话我早知道了！”|林黛玉一边擦泪，一边把他的手推开，说：“有什么可说的。你的话我早就知道了！”
口里说著，却头也不回竟去了。|嘴里说着，头也不回地走了。
! “你放心”三个字，是宝玉对黛玉最直接的表白。前面黛玉刚在窗外悲叹，宝玉这三个字正答在她心上。
! 回目“诉肺腑心迷活宝玉”。两人终于把心里话说透了，却谁也说不出更多。黛玉说“你的话我早知道了”，其实她一直都懂。

# 十一、宝玉错把袭人当黛玉
宝玉站著，只管发起呆来。|宝玉站在那里，只管发起呆来。
原来方才出来慌忙，不曾带得扇子，袭人怕他热，忙拿了扇子赶来送与他，|原来他刚才出来得匆忙，没带扇子，袭人怕他热，连忙拿了扇子赶来送给他，
忽抬头见了林黛玉和他站著。|忽然抬头看见林黛玉和他站在一起。
一时黛玉走了，他还站著不动，因而赶上来说道：“你也不带了扇子去，亏我看见，赶了送来。”|一会儿黛玉走了，他还站着不动，就赶上来说：“你也不带扇子去，幸亏我看见了，赶来送给你。”
宝玉出了神，见袭人和他说话，并未看出是何人来，便一把拉住，说道：|宝玉正在出神，见袭人和他说话，也没看清是谁，就一把拉住她说：
“好妹妹，我的这心事，从来也不敢说，今儿我大胆说出来，死也甘心！|“好妹妹，我这心事，从来不敢说，今天我大胆说出来，死也甘心！
我为你也弄了一身的病在这里，又不敢告诉人，只好掩著。|我为你也弄了一身的病，又不敢告诉别人，只好藏着。
只等你的病好了，只怕我的病才得好呢。睡里梦里也忘不了你！”|只有等你的病好了，我的病才能好。睡里梦里也忘不了你！”
袭人听了这话，吓得魄消魂散，只叫”神天菩萨，坑死我了！”|袭人听了这话，吓得魂飞魄散，只叫：“老天菩萨，可坑死我了！”
便推他道：“这是那里的话！敢是中了邪？还不快去？”|就推他说：“这是说的什么话！莫非中了邪？还不快去？”
宝玉一时醒过来，方知是袭人送扇子来，羞的满面紫涨，夺了扇子，便忙忙的抽身跑了。|宝玉一下子清醒过来，才知道是袭人送扇子来了，羞得满脸通红，夺过扇子，就急忙转身跑了。
! 宝玉对黛玉说不出口的话，全对着袭人说了出来。这是全书宝玉说得最露骨的一次表白，偏偏听见的是袭人。
! 袭人“魄消魂散”，她怕的不只是宝玉说胡话，更是知道了宝玉的心在黛玉身上。下一回她就去向王夫人进言了。

# 十二、袭人忧心
这里袭人见他去了，自思方才之言，一定是因黛玉而起，|袭人见他走了，自己想刚才那些话，一定是因为黛玉而起的，
如此看来，将来难免不才之事，令人可惊可畏。|这样看来，将来难免会出不体面的事，叫人又惊又怕。
想到此间，也不觉怔怔的滴下泪来，心下暗度如何处治方免此丑祸。|想到这里，也不由得怔怔地流下泪来，心里暗暗盘算该怎么处置才能免去这场丑祸。
正裁疑间，忽有宝钗从那边走来，笑道：“大毒日头地下，出什么神呢？”|正在犹豫，忽然宝钗从那边走来，笑道：“大太阳底下，出什么神呢？”
袭人见问，忙笑道：“那边两个雀儿打架，倒也好玩，我就看住了。”|袭人见她问，连忙笑道：“那边两只雀儿打架，挺好玩的，我就看住了。”
宝钗道：“宝兄弟这会子穿了衣服，忙忙的那去了？|宝钗说：“宝兄弟这会儿穿了衣服，急急忙忙到哪里去了？
我才看见走过去，倒要叫住问他呢。|我刚才看见他走过去，本想叫住问问他。
他如今说话越发没了经纬，我故此没叫他了，由他过去罢。”|他现在说话越来越没条理了，所以我就没叫他，让他过去了。”
袭人道：“老爷叫他出去。”|袭人说：“老爷叫他出去。”
宝钗听了，忙道：嗳哟！这么黄天暑热的，叫他做什么！别是想起什么来生了气，叫出去教训一场。”|宝钗听了，忙说：“哎哟！这么大热天，叫他做什么！别是想起什么来生了气，叫出去教训一顿。”
袭人笑道：“不是这个，想是有客要会。”|袭人笑道：“不是这个，想必是有客人要见。”
宝钗笑道：“这个客也没意思，这么热天，不在家里凉快，还跑些什么！”|宝钗笑道：“这个客人也没意思，这么热的天，不在家里凉快，还跑来跑去干什么！”
袭人笑道：“倒是你说说罢。”|袭人笑道：“倒是你说说他吧。”
! 袭人想的是“不才之事”“丑祸”。在她看来，宝玉和黛玉的私情是丑事，会坏了宝玉的名声，也坏了她自己的前程。
! “两个雀儿打架”，袭人随口编的谎，却正是宝黛平日吵吵闹闹的样子。

# 十三、宝钗说湘云在家的苦
宝钗因而问道：“云丫头在你们家做什么呢？”|宝钗就问：“云丫头在你们屋里做什么呢？”
袭人笑道：“才说了一会子闲话。你瞧，我前儿粘的那双鞋，明儿叫他做去。”|袭人笑道：“刚说了一会儿闲话。你看，我前些天粘好的那双鞋，明天叫她做去。”
宝钗听见这话，便两边回头，看无人来往，便笑道：|宝钗听了这话，就左右回头看看，见没人来往，就笑道：
“你这么个明白人，怎么一时半刻的就不会体谅人情。|“你这么个明白人，怎么一时就不会体谅人情了。
我近来看著云丫头神情，再风里言风里语的听起来，那云丫头在家里竟一点儿作不得主。|我最近看云丫头的神情，再加上风言风语听来的，云丫头在家里竟然一点也做不得主。
他们家嫌费用大，竟不用那些针线上的人，差不多的东西多是他们娘儿们动手。|她们家嫌花费大，竟然不用专做针线的人，差不多的东西都是她们娘儿们自己动手。
为什么这几次他来了，他和我说话儿，见没人在跟前，他就说家里累的很。|为什么这几次她来了，跟我说话，见没人在跟前，她就说家里累得很。
我再问他两句家常过日子的话，他就连眼圈儿都红了，口里含含糊糊待说不说的。|我再问她两句家常过日子的话，她连眼圈都红了，嘴里含含糊糊，想说又不说。
想其形景来，自然从小儿没爹娘的苦。我看著他，也不觉的伤起心来。”|看她那样子，自然是从小没爹娘的苦。我看着她，也不由得伤心起来。”
袭人见说这话，将手一拍，说：“是了，是了。|袭人听了这话，把手一拍，说：“是了，是了。
怪道上月我烦他打十根蝴蝶结子，过了那些日子才打发人送来，|怪不得上个月我托她打十根蝴蝶结子，过了那么多天才打发人送来，
还说‘打的粗，且在别处能著使罢，要匀净的，等明儿来住著再好生打罢’。|还说‘打得粗糙，先在别处凑合着用吧，要匀称精细的，等以后来住的时候再好好打’。
如今听宝姑娘这话，想来我们烦他他不好推辞，不知他在家里怎么三更半夜的做呢。|如今听宝姑娘这么一说，想来我们托她，她不好推辞，不知道她在家里怎么三更半夜地做呢。
可是我也糊涂了，早知是这样，我也不烦他了。”|可我也糊涂了，早知道是这样，我也不托她了。”
宝钗道：“上次他就告诉我，在家里做活做到三更天，|宝钗说：“上次她就告诉我，在家里做活做到三更天，
若是替别人做一点半点，他家的那些奶奶太太们还不受用呢。”|要是替别人做一点半点，她家的那些奶奶太太们还不高兴呢。”
! 湘云是侯门千金，在家里却要做针线到三更半夜。史家表面风光，其实已经开始节省开支了。
! 湘云的苦只肯对宝钗说，宝钗也替她瞒着，只悄悄告诉袭人。宝钗的体贴，是不动声色的。

# 十四、宝钗替袭人做活
袭人道：“偏生我们那个牛心左性的小爷，凭著小的大的活计，一概不要家里这些活计上的人作。我又弄不开这些。”|袭人说：“偏偏我们那个脾气又倔又怪的小爷，不管大小活计，一概不要家里那些做活的人做。我又忙不过来。”
宝钗笑道：“你理他呢！只管叫人做去，只说是你做的就是了。”|宝钗笑道：“你理他呢！只管叫人做去，就说是你做的不就行了。”
袭人笑道：“那里哄的信他，他才是认得出来呢。说不得我只好慢慢的累去罢了。”|袭人笑道：“哪里哄得了他，他才认得出来呢。没办法，我只好慢慢累着做吧。”
宝钗笑道：“你不必忙，我替你作些如何？”|宝钗笑道：“你不必着急，我替你做些怎么样？”
袭人笑道：“当真的这样，就是我的福了。晚上我亲自送过来。”|袭人笑道：“真要这样，那就是我的福气了。晚上我亲自送过来。”
! 黛玉一年做一个香袋，湘云做不了，宝钗主动替宝玉做针线。宝钗和袭人走得越来越近。

# 十五、金钏投井
一句话未了，忽见一个老婆子忙忙走来，说道：“这是那里说起！金钏儿姑娘好好的投井死了！”|话还没说完，忽然一个老婆子急急忙忙走来，说：“这是从哪里说起！金钏儿姑娘好好的投井死了！”
袭人唬了一跳，忙问”那个金钏儿？”|袭人吓了一跳，连忙问：“哪个金钏儿？”
老婆子道：“那里还有两个金钏儿呢？就是太太屋里的。|老婆子说：“哪里还有两个金钏儿？就是太太屋里的那个。
前儿不知为什么撵他出去，在家里哭天哭地的，也都不理会他，谁知找他不见了。|前些天不知为什么把她撵出去了，在家里哭天抢地的，也没人理她，谁知一下子找不着她了。
刚才打水的人在那东南角上井里打水，见一个尸首，赶著叫人打捞起来，谁知是他。|刚才打水的人在那东南角的井里打水，看见一具尸首，赶紧叫人打捞上来，谁知道是她。
他们家里还只管乱著要救活，那里中用了！”|她家里还在乱着要救活她，哪里还救得过来！”
宝钗道：“这也奇了。”|宝钗说：“这就奇怪了。”
袭人听说，点头赞叹，想素日同气之情，不觉流下泪来。|袭人听了，点头叹息，想起平日同是丫头的情分，不由得流下泪来。
宝钗听见这话，忙向王夫人处来道安慰。这里袭人回去不提。|宝钗听了这话，连忙到王夫人那里去安慰。袭人回去了，不提。
! 金钏说的“金簪子掉在井里头”，三天后成了真。一句俗语，一条人命。
! 宝钗听了只说“这也奇了”，转身就去安慰王夫人。她关心的不是金钏，是王夫人。

# 十六、宝钗安慰王夫人
却说宝钗来至王夫人处，只见鸦雀无闻，独有王夫人在里间房内坐著垂泪。|宝钗来到王夫人那里，只见静悄悄的，只有王夫人一个人在里屋坐着流泪。
宝钗便不好提这事，只得一旁坐了。|宝钗就不好提这件事，只好在一旁坐下。
王夫人便问：“你从那里来？”|王夫人就问：“你从哪里来？”
宝钗道：“从园里来。”|宝钗说：“从园子里来。”
王夫人道：“你从园里来，可见你宝兄弟？”|王夫人说：“你从园子里来，看见你宝兄弟了吗？”
宝钗道：“才倒看见了。他穿了衣服出去了，不知那里去。”|宝钗说：“刚才倒是看见了。他穿了衣服出去了，不知到哪里去。”
王夫人点头哭道：“你可知道一桩奇事？金钏儿忽然投井死了！”|王夫人点头哭道：“你知道一件奇事吗？金钏儿忽然投井死了！”
宝钗见说，道：“怎么好好的投井？这也奇了。”|宝钗听了，说：“怎么好好的投井？这也奇怪了。”
王夫人道：“原是前儿他把我一件东西弄坏了，我一时生气，打了他几下，撵了他下去。|王夫人说：“原是前些天她弄坏了我一件东西，我一时生气，打了她几下，把她撵了下去。
我只说气他两天，还叫他上来，谁知他这么气性大，就投井死了。岂不是我的罪过。”|我只说让她气两天，还叫她回来，谁知她气性这么大，就投井死了。这岂不是我的罪过。”
! 王夫人对宝钗撒了谎：说金钏是“弄坏了东西”，不说是因为宝玉。她要护住儿子的名声，也护住自己。
! 王夫人一开口先问“可见你宝兄弟”，她心里最惦记的还是宝玉。

# 十七、宝钗的一番话
宝钗叹道：“姨娘是慈善人，固然这么想。|宝钗叹道：“姨妈是慈善人，所以才这么想。
据我看来，他并不是赌气投井。|依我看，她并不是赌气投井的。
多半他下去住著，或是在井跟前憨顽，失了脚掉下去的。|多半是她下去住着，或是在井边贪玩，失脚掉下去的。
他在上头拘束惯了，这一出去，自然要到各处去顽顽逛逛，岂有这样大气的理！|她在上面拘束惯了，这一出去，自然要到处玩玩逛逛，哪有气性这么大的道理！
纵然有这样大气，也不过是个糊涂人，也不为可惜。”|就算真有这么大的气性，也不过是个糊涂人，也不值得可惜。”
王夫人点头叹道：“这话虽然如此说，到底我心不安。”|王夫人点头叹道：“话虽这么说，我心里到底不安。”
宝钗叹道：“姨娘也不必念念于兹，十分过不去，不过多赏他几两银子发送他，也就尽主仆之情了。”|宝钗叹道：“姨妈也不必总挂在心上，实在过意不去，不过多赏她家几两银子办丧事，也就尽到主仆的情分了。”
! 这是宝钗最受争议的一段话。为了宽王夫人的心，她说金钏是“失了脚掉下去的”，就算是自尽“也不为可惜”。
! 一个年轻姑娘死了，宝钗说她“糊涂”，说几两银子就能“尽主仆之情”。宝钗处处得体，可在这件事上，她的得体显得冷。
! 有人说宝钗是在安慰姨妈，不得不这样说；有人说这正看出她的世故冷漠。两种看法，作者都留了余地。

# 十八、宝钗献衣
王夫人道：“刚才我赏了他娘五十两银子，原要还把你妹妹们的新衣服拿两套给他妆裹。|王夫人说：“刚才我赏了她娘五十两银子，本来还想拿你妹妹们的两套新衣服给她入殓。
谁知凤丫头说可巧都没什么新做的衣服，只有你林妹妹作生日的两套。|谁知凤丫头说正好都没什么新做的衣服，只有你林妹妹过生日做的两套。
我想你林妹妹那个孩子素日是个有心的，况且他也三灾八难的，|我想你林妹妹那孩子平时心思重，况且她也是多灾多病的，
既说了给他过生日，这会子又给人妆裹去，岂不忌讳。|既然说了是给她过生日的，这会儿又拿去给死人穿，岂不犯忌讳。
因为这么样，我现叫裁缝赶两套给他。|因为这样，我现在叫裁缝赶做两套给她。
要是别的丫头，赏他几两银子就完了，只是金钏儿虽然是个丫头，素日在我跟前比我的女儿也差不多。”|要是别的丫头，赏她几两银子就完了，只是金钏儿虽然是个丫头，平时在我跟前和我的女儿也差不多。”
口里说著，不觉泪下。|嘴里说着，不由得流下泪来。
宝钗忙道：“姨娘这会子又何用叫裁缝赶去，我前儿倒做了两套，拿来给他岂不省事。|宝钗忙说：“姨妈这会儿又何必叫裁缝赶做，我前些天倒做了两套，拿来给她岂不省事。
况且他活著的时候也穿过我的旧衣服，身量又相对。”|况且她活着的时候也穿过我的旧衣服，身材也合适。”
王夫人道：“虽然这样，难道你不忌讳？”|王夫人说：“虽然这样，难道你不忌讳？”
宝钗笑道：“姨娘放心，我从来不计较这些。”|宝钗笑道：“姨妈放心，我从来不计较这些。”
一面说，一面起身就走。|一边说，一边起身就走。
王夫人忙叫了两个人来跟宝姑娘去。|王夫人连忙叫了两个人跟着宝姑娘去。
! 黛玉的衣服给死人穿“忌讳”，宝钗的衣服给死人穿“不计较”。一边是“三灾八难”的黛玉，一边是大方得体的宝钗，王夫人心里的天平又偏了一点。
! 宝钗献衣，替姨妈解了难，也在王夫人面前又一次显出她的懂事。这件事以后，王夫人越发喜欢宝钗。

# 十九、宝玉垂泪
一时宝钗取了衣服回来，只见宝玉在王夫人旁边坐著垂泪。|一会儿宝钗取了衣服回来，只见宝玉坐在王夫人旁边流泪。
王夫人正才说他，因宝钗来了，却掩了口不说了。|王夫人正在说他，因为宝钗来了，就闭口不说了。
宝钗见此光景，察言观色，早知觉了八分，于是将衣服交割明白。|宝钗见了这情景，察言观色，早已猜到了八分，于是把衣服交代清楚。
王夫人将他母亲叫来拿了去。再看下回便知。|王夫人把金钏的母亲叫来拿走了。且看下回。
! 宝钗“察言观色，早知觉了八分”，她猜到金钏的死和宝玉有关。可她什么也不说。
! 回目“含耻辱情烈死金钏”。金钏死于“耻辱”，死于“情烈”。害死她的，一个是宝玉的轻佻，一个是王夫人的一巴掌，一个是那个时代对丫头的轻贱。
</script>
<script type="text/plain" id="ch33">
# 一、宝玉撞上贾政
却说王夫人唤他母亲上来，拿几件簪环当面赏与，又吩咐请几众僧人念经超度。|王夫人把金钏的母亲叫来，当面赏了几件簪子首饰，又吩咐请几班和尚来念经超度。
他母亲磕头谢了出去。|她母亲磕头谢恩出去了。
原来宝玉会过雨村回来听见了，便知金钏儿含羞赌气自尽，|原来宝玉见过贾雨村回来，听说了这件事，就知道金钏儿是含羞赌气自尽的，
心中早又五内摧伤，进来被王夫人数落教训，也无可回说。|心里早已像五脏都碎了一样，进来又被王夫人数落教训了一顿，也没话可回。
见宝钗进来，方得便出来，茫然不知何往，背著手，低头一面感叹，一面慢慢的走著，信步来至厅上。|见宝钗进来，才找到机会出来，茫茫然不知往哪里去，背着手，低着头一边叹息一边慢慢走着，随脚走到了大厅上。
刚转过屏门，不想对面来了一人正往里走，可巧儿撞了个满怀。|刚转过屏门，没想到对面来了一个人正往里走，正好撞了个满怀。
只听那人喝了一声“站住！”|只听那人喝了一声：“站住！”

方才雨村来了要见你，叫你那半天你才出来，|刚才雨村来了要见你，叫了你半天你才出来，
既出来了，全无一点慷慨挥洒谈吐，仍是葳葳蕤蕤。|出来了，也一点没有慷慨潇洒的谈吐，还是那样萎靡不振。
我看你脸上一团思欲愁闷气色，这会子又咳声叹气。|我看你脸上一团心事重重、愁闷不乐的样子，这会儿又唉声叹气。
你那些还不足，还不自在？无故这样，却是为何？”|你还有什么不满足、不自在的？无缘无故这样，到底是为什么？”
宝玉素日虽是口角伶俐，只是此时一心总为金钏儿感伤，恨不得此时也身亡命殒，跟了金钏儿去。|宝玉平时虽然口齿伶俐，只是这时一心为金钏儿伤心，恨不得自己也立刻死了，跟金钏儿一起去。
如今见了他父亲说这些话，究竟不曾听见，只是怔呵呵的站著。|如今见父亲说这些话，其实一句也没听进去，只是呆呆地站着。
! 宝玉为金钏伤心欲死，在贾政眼里却是“思欲愁闷”、不成器。父子之间，一个不懂一个。
! 回目“手足耽耽小动唇舌”，指贾环；“不肖种种大承笞挞”，指宝玉挨打。这是全书最激烈的一场父子冲突。

# 二、忠顺王府来要人
贾政见他惶悚，应对不似往日，原本无气的，这一来倒生了三分气。|贾政见他惊慌失措，应答也不像往日，本来没生气，这一来倒生了三分气。
方欲说话，忽有回事人来回：“忠顺亲王府里有人来，要见老爷。”|正要说话，忽然有人来回报：“忠顺亲王府里来人了，要见老爷。”
贾政听了，心下疑惑，暗暗思忖道：“素日并不和忠顺府来往，为什么今日打发人来？”|贾政听了，心里疑惑，暗暗想道：“平时并不和忠顺王府来往，为什么今天打发人来？”
一面想一面令“快请”，急走出来看时，却是忠顺府长史官，忙接进厅上坐了献茶。|一边想一边吩咐“快请”，急忙出来一看，原来是忠顺王府的长史官，连忙接到厅上坐下献茶。
未及叙谈，那长史官先就说道：|还没来得及寒暄，那长史官先开口说：
“下官此来，并非擅造潭府，皆因奉王命而来，有一件事相求。|“下官这次来，并不是擅自登门，都是奉了王爷的命令而来，有一件事相求。
看王爷面上，敢烦老大人作主，不但王爷知情，且连下官辈亦感谢不尽。”|看在王爷的面子上，敢请老大人做主，不但王爷领情，连下官们也感激不尽。”
贾政听了这话，抓不住头脑，忙陪笑起身问道：|贾政听了这话，摸不着头脑，连忙赔笑起身问：
“大人既奉王命而来，不知有何见谕，望大人宣明，学生好遵谕承办。”|“大人既然奉王命而来，不知有什么吩咐，望大人说明，学生好遵命照办。”
那长史官便冷笑道：“也不必承办，只用大人一句话就完了。|那长史官就冷笑道：“也不必照办，只要大人一句话就完了。
我们府里有一个做小旦的琪官，一向好好在府里，如今竟三五日不见回去，|我们府里有一个唱小旦的琪官，一向好好地在府里，如今竟然三五天没回去，
各处去找，又摸不著他的道路，因此各处访察。|到处去找，又摸不着他的去处，因此到处打听。
这一城内，十停人倒有八停人都说，他近日和衔玉的那位令郎相与甚厚。|这城里十个人倒有八个人都说，他最近和府上那位含玉而生的公子交往很密切。
下官辈等听了，尊府不比别家，可以擅入索取，因此启明王爷。|下官们听了，想到贵府不比别家，可以随便进来要人，因此禀明了王爷。
王爷亦云：‘若是别的戏子呢，一百个也罢了，|王爷也说：‘要是别的戏子，一百个也就算了，
只是这琪官随机应答，谨慎老诚，甚合我老人家的心，竟断断少不得此人。’|只是这个琪官随机应变，谨慎老实，很合我老人家的心意，万万少不了这个人。’
故此求老大人转谕令郎，请将琪官放回，|所以求老大人转告令郎，请把琪官放回来，
一则可慰王爷谆谆奉恳，二则下官辈也可免操劳求觅之苦。”|一来可以安慰王爷的殷切恳求，二来下官们也可以免去四处寻找的辛苦。”
说毕，忙打一躬。|说完，连忙作了一个揖。
! 忠顺王府和贾府“素日并不来往”，第二十八回琪官的汗巾是北静王送的。北静王和贾府交好，忠顺王府却是另一派。宝玉卷进了两派王府之间。
! 长史官话说得客气，句句却是威胁：“尊府不比别家”，所以没有“擅入索取”，言下之意是，换了别家早就进来搜人了。

# 三、红汗巾露了底
贾政听了这话，又惊又气，即命唤宝玉来。|贾政听了这话，又惊又气，立刻叫人把宝玉叫来。

那琪官现是忠顺王爷驾前承奉的人，你是何等草芥，无故引逗他出来，如今祸及于我。”|那琪官是忠顺王爷跟前伺候的人，你是什么小草一样的东西，无缘无故勾引他出来，现在祸事都落到我头上了。”
宝玉听了唬了一跳，忙回道：“实在不知此事。|宝玉听了吓了一跳，连忙回答：“我实在不知道这件事。
究竟连‘琪官’两个字不知为何物，岂更又加‘引逗’二字！”说著便哭了。|连‘琪官’两个字是什么都不知道，哪里还谈得上‘勾引’！”说着就哭了。
贾政未及开言，只见那长史官冷笑道：“公子也不必掩饰。|贾政还没开口，只见那长史官冷笑道：“公子也不必掩饰。
或隐藏在家，或知其下落，早说了出来，我们也少受些辛苦，岂不念公子之德？”|或者藏在家里，或者知道他的下落，早点说出来，我们也少受些辛苦，岂不感念公子的恩德？”
宝玉连说不知，“恐是讹传，也未见得。”|宝玉连说不知道：“恐怕是谣传，也说不定。”
那长史官冷笑道：“现有据证，何必还赖？|那长史官冷笑道：“现在有证据，何必还抵赖？
必定当著老大人说了出来，公子岂不吃亏？|非要当着老大人的面说出来，公子岂不是吃亏？
既云不知此人，那红汗巾子怎么到了公子腰里？”|既然说不认识这个人，那条红汗巾怎么到了公子腰上？”
宝玉听了这话，不觉轰去魂魄，目瞪口呆，心下自思：|宝玉听了这话，不由得魂飞魄散，目瞪口呆，心里想：
“这话他如何得知！他既连这样机密事都知道了，大约别的瞒他不过，|“这事他怎么知道的！他连这么机密的事都知道了，别的大概也瞒不过他，
不如打发他去了，免的再说出别的事来。”|不如打发他走，免得他再说出别的事来。”
因说道：“大人既知他的底细，如何连他置买房舍这样大事倒不晓得了？|就说：“大人既然知道他的底细，怎么连他买房置地这样的大事倒不知道？
听得说他如今在东郊离城二十里有个什么紫檀堡，他在那里置了几亩田地几间房舍。想是在那里也未可知。”|听说他现在在东郊离城二十里的一个叫紫檀堡的地方，置了几亩田地、几间房子。想必在那里也说不定。”
那长史官听了，笑道：“这样说，一定是在那里。我且去找一回，若有了便罢，若没有，还要来请教。”|那长史官听了，笑道：“这么说，一定在那里。我先去找一找，要是找到了就罢，要是没有，还要来请教。”
说著，便忙忙的走了。|说着，就急急忙忙走了。
! 汗巾是贴身系在腰里的，长史官连这个都知道，可见王府早已派人盯着琪官。
! 宝玉为了脱身，供出了琪官的藏身之处。他说“免的再说出别的事来”，怕的是自己和琪官的事被抖出来。为了自保，他出卖了朋友。
! 紫檀堡离城二十里，琪官在那里置了田地房屋，是想脱离王府，自谋生路。这一说，他的生路也断了。

# 四、贾环告状
贾政此时气的目瞪口歪，一面送那长史官，一面回头命宝玉“不许动！回来有话问你！”|贾政这时气得目瞪口歪，一边送那长史官，一边回头命令宝玉：“不许动！回来有话问你！”
一直送那官员去了。|一直把那官员送出去了。
才回身，忽见贾环带著几个小厮一阵乱跑。|刚转身回来，忽然看见贾环带着几个小厮一阵乱跑。
贾政喝令小厮“快打，快打！”|贾政喝令小厮：“快打，快打！”
贾环见了他父亲，唬的骨软筋酥，忙低头站住。|贾环见了父亲，吓得浑身发软，连忙低头站住。
贾政便问：“你跑什么？带著你的那些人都不管你，不知往那里逛去，由你野马一般！”|贾政就问：“你跑什么？跟着你的那些人都不管你，不知到哪里逛去了，由着你像野马一样！”
喝令叫跟上学的人来。|喝令叫跟着上学的人来。
贾环见他父亲盛怒，便乘机说道：|贾环见父亲大怒，就趁机说：
“方才原不曾跑，只因从那井边一过，那井里淹死了一个丫头，|“刚才本来没跑，只因为从那井边经过，那井里淹死了一个丫头，
我看见人头这样大，身子这样粗，泡的实在可怕，所以才赶著跑了过来。”|我看见人头有这么大，身子有这么粗，泡得实在可怕，所以才赶紧跑过来。”
贾政听了惊疑，问道：“好端端的，谁去跳井？|贾政听了，又惊又疑，问：“好端端的，谁去跳井？
我家从无这样事情，自祖宗以来，皆是宽柔以待下人。|我家从来没有这种事，从祖宗以来，都是宽厚温和地对待下人。
——大约我近年于家务疏懒，自然执事人操克夺之权，致使生出这暴殄轻生的祸患。|大概是我近年来对家务疏忽懈怠，自然是管事的人掌握了刻薄下人的权力，才弄出这种逼人轻生的祸事。
若外人知道，祖宗颜面何在！”|要是外人知道了，祖宗的脸面往哪里放！”
喝令快叫贾琏、赖大、来兴。|喝令快叫贾琏、赖大、来兴来。
! 贾环说尸体“人头这样大，身子这样粗”，边说边比划，故意说得骇人。他是在火上浇油。
! 贾政说“我家从无这样事情”，“宽柔以待下人”。他不知道，逼死金钏的正是他的夫人和他的儿子。

# 五、“强奸不遂”
小厮们答应了一声，方欲叫去，贾环忙上前拉住贾政的袍襟，贴膝跪下道：|小厮们答应一声，正要去叫，贾环连忙上前拉住贾政的衣襟，贴着他的膝盖跪下说：
“父亲不用生气。此事除太太房里的人，别人一点也不知道。我听见我母亲说……”|“父亲不用生气。这件事除了太太房里的人，别人一点也不知道。我听见我母亲说……”
说到这里，便回头四顾一看。|说到这里，就回头四下看了看。
贾政知意，将眼一看众小厮，小厮们明白，都往两边后面退去。|贾政明白他的意思，用眼睛看了看小厮们，小厮们会意，都往两边后面退开了。
贾环便悄悄说道：“我母亲告诉我说，宝玉哥哥前日在太太屋里，拉著太太的丫头金钏儿强奸不遂，打了一顿。|贾环就悄悄说：“我母亲告诉我，宝玉哥哥前天在太太屋里，拉着太太的丫头金钏儿要强占她，没得逞，就把她打了一顿。
那金钏儿便赌气投井死了。”|那金钏儿就赌气投井死了。”
话未说完，把个贾政气的面如金纸，大喝”快拿宝玉来！”|话还没说完，把贾政气得脸色像金纸一样，大喝：“快把宝玉给我抓来！”
! 贾环说的是假话。宝玉确实调戏了金钏，但没有“强奸”，打金钏的也是王夫人，不是宝玉。贾环颠倒黑白，把罪名全推给了宝玉。
! 贾环的消息来自“我母亲”赵姨娘。赵姨娘恨宝玉，第二十五回还请马道婆作法害他。这一次，母子俩借贾政的手又害了宝玉一回。
! 贾环要支开小厮再说，显得事情机密，越发让贾政相信。他小小年纪，心机已经很深。

# 六、贾政暴怒
一面说一面便往里边书房里去，喝令“今日再有人劝我，我把这冠带家私一应交与他与宝玉过去！|一边说一边往里面书房去，喝令：“今天再有谁来劝我，我就把这官帽官服、家产全都交给他和宝玉去！
我免不得做个罪人，把这几根烦恼鬓毛剃去，寻个干净去处自了，也免得上辱先人下生逆子之罪。”|我少不得做个罪人，把这几根烦恼头发剃了，找个干净地方了此一生，也免得背上辱没祖先、生出逆子的罪名。”
众门客仆从见贾政这个形景，便知又是为宝玉了，一个个都是啖指咬舌，连忙退出。|门客仆人们见贾政这个样子，就知道又是为了宝玉，一个个都咬着手指、吐着舌头，连忙退了出去。
那贾政喘吁吁直挺挺坐在椅子上，满面泪痕，|贾政气喘吁吁、直挺挺地坐在椅子上，满脸泪痕，
一叠声“拿宝玉！拿大棍！拿索子捆上！把各门都关上！有人传信往里头去，立刻打死！”|一连声地喊：“抓宝玉来！拿大棍来！拿绳子捆上！把各个门都关上！有人往里面传信，立刻打死！”
众小厮们只得齐声答应，有几个来找宝玉。|小厮们只好齐声答应，有几个去找宝玉。
! 贾政下令关门，不许往里传信，就是怕贾母知道了来护着宝玉。他早就想好好教训这个儿子，这次是新仇旧恨一起算。

# 七、聋婆子
那宝玉听见贾政吩咐他“不许动”，早知多凶少吉，那里承望贾环又添了许多的话。|宝玉听见贾政吩咐他“不许动”，早知道凶多吉少，哪里想到贾环又添了那么多话。
正在厅上干转，怎得个人来往里头去捎信，偏生没个人，连焙茗也不知在那里。|正在厅上干着急打转，盼着有个人到里面去捎信，偏偏一个人也没有，连焙茗也不知道去哪里了。
正盼望时，只见一个老姆姆出来。|正盼着，只见一个老妈妈出来了。
宝玉如得了珍宝，便赶上来拉他，说道：“快进去告诉：老爷要打我呢！快去，快去！要紧，要紧！”|宝玉像得了宝贝一样，赶上去拉住她说：“快进去告诉：老爷要打我了！快去，快去！要紧，要紧！”
宝玉一则急了，说话不明白，二则老婆子偏生又聋，竟不曾听见是什么话，|宝玉一来急了，话说得不清楚，二来那老婆子偏偏又是个聋子，竟没听清是什么话，
把“要紧”二字只听作“跳井”二字，便笑道：“跳井让他跳去，二爷怕什么？”|把“要紧”两个字听成了“跳井”，就笑道：“跳井让她跳去，二爷怕什么？”
宝玉见是个聋子，便著急道：“你出去叫我的小厮来罢。”|宝玉见她是个聋子，就着急地说：“你出去叫我的小厮来吧。”
那婆子道：“有什么不了的事？老早的完了。太太又赏了衣服，又赏了银子，怎么不了事的！”|那婆子说：“有什么了结不了的事？早就完了。太太又赏了衣服，又赏了银子，怎么会了结不了！”
宝玉急的跺脚，正没抓寻处，只见贾政的小厮走来，逼著他出去了。|宝玉急得直跺脚，正没办法，只见贾政的小厮走来，逼着他出去了。
! “要紧”听成“跳井”，是全书著名的一笔。最紧急的时刻，偏偏遇上一个聋子，作者写得又滑稽又惊心。
! 婆子说“跳井让他跳去”“老早的完了”，金钏一条命，在下人眼里不过是赏了衣服银子就“了事”的小事。

# 八、宝玉挨打
贾政一见，眼都红紫了，也不暇问他在外流荡优伶、表赠私物，在家荒疏学业、淫辱母婢等语，|贾政一见他，眼睛都红紫了，也顾不上问他在外面和戏子鬼混、私赠东西，在家荒废学业、调戏母亲丫头这些事，
只喝令“堵起嘴来，著实打死！”|只喝令：“把嘴堵起来，给我狠狠地打死！”
小厮们不敢违拗，只得将宝玉按在凳上，举起大板打了十来下。|小厮们不敢违抗，只好把宝玉按在长凳上，举起大板子打了十来下。
贾政犹嫌打轻了，一脚踢开掌板的，自己夺过来，咬著牙狠命盖了三四十下。|贾政还嫌打得轻，一脚踢开拿板子的，自己夺过板子来，咬着牙狠命地打了三四十下。
众门客见打的不祥了，忙上前夺劝。|门客们见打得太凶，怕出事，连忙上前抢板子劝阻。
贾政那里肯听，说道：“你们问问他干的勾当可饶不可饶！|贾政哪里肯听，说：“你们问问他干的那些事，能饶不能饶！
素日皆是你们这些人把他酿坏了，到这步田地还来解劝。|平时都是你们这些人把他惯坏了，到了这个地步还来劝。
明日酿到他弑君杀父，你们才不劝不成！”|等以后惯到他杀君杀父，你们才不劝吗！”
! 贾政“堵起嘴来”，是不让宝玉辩解，也是怕他喊叫惊动里面。他心里早已判了宝玉的罪。
! “弑君杀父”，贾政把宝玉的罪说到最重。在他看来，不读书、交戏子、调戏丫头，一步步就会走到大逆不道。

# 九、王夫人护子
众人听这话不好听，知道气急了，忙又退出，只得觅人进去给信。|大家听这话说得太重，知道他气急了，连忙又退出来，只好找人进去报信。
王夫人不敢先回贾母，只得忙穿衣出来，也不顾有人没人，忙忙赶往书房中来，|王夫人不敢先告诉贾母，只好赶紧穿衣出来，也顾不上有没有外人，急急忙忙赶到书房来，
慌的众门客小厮等避之不及。|慌得门客小厮们都来不及回避。
王夫人一进房来，贾政更如火上浇油一般，那板子越发下去的又狠又快。|王夫人一进屋，贾政更是火上浇油，那板子打得越发又狠又快。
按宝玉的两个小厮忙松了手走开，宝玉早已动弹不得了。|按着宝玉的两个小厮连忙松手走开，宝玉早已动弹不得了。
贾政还欲打时，早被王夫人抱住板子。|贾政还要打，早被王夫人抱住了板子。
贾政道：“罢了，罢了！今日必定要气死我才罢！”|贾政说：“罢了，罢了！今天一定要气死我才罢休！”
王夫人哭道：“宝玉虽然该打，老爷也要自重。|王夫人哭道：“宝玉虽然该打，老爷也要保重身体。
况且炎天暑日的，老太太身上也不大好，打死宝玉事小，倘或老太太一时不自在了，岂不事大！”|况且大热天的，老太太身体也不太好，打死宝玉是小事，要是老太太一时气出病来，岂不是大事！”
贾政冷笑道：“倒休提这话。我养了这不肖的孽障，已不孝，|贾政冷笑道：“别提这话了。我养了这个不肖的孽障，已经是不孝了，
教训他一番，又有众人护持，不如趁今日一发勒死了，以绝将来之患！”|教训他一回，又有这么多人护着他，不如趁今天干脆勒死他，免得将来闯祸！”
说著，便要绳索来勒死。|说着，就要拿绳子来勒死他。
! 王夫人“不敢先回贾母”，她知道贾母一来，贾政就更下不来台。她先自己来，想把事情压下去。
! 王夫人不说宝玉没错，只说“老太太”。她懂得，在这个家里，能压住贾政的只有贾母。

# 十、王夫人哭贾珠
王夫人连忙抱住哭道：“老爷虽然应当管教儿子，也要看夫妻分上。|王夫人连忙抱住他哭道：“老爷虽然应当管教儿子，也要看在夫妻的情分上。
我如今已将五十岁的人，只有这个孽障，必定苦苦的以他为法，我也不敢深劝。|我如今已经快五十岁的人了，只有这一个孽障，老爷一定要拿他做样子，我也不敢多劝。
今日越发要他死，岂不是有意绝我。|今天越发要他死，岂不是存心要断我的后。
既要勒死他，快拿绳子来先勒死我，再勒死他。|既然要勒死他，快拿绳子来先勒死我，再勒死他。
我们娘儿们不敢含怨，到底在阴司里得个依靠。”|我们娘儿俩不敢有怨言，到了阴间也好有个依靠。”
说毕，爬在宝玉身上大哭起来。|说完，趴在宝玉身上大哭起来。
贾政听了此话，不觉长叹一声，向椅上坐了，泪如雨下。|贾政听了这话，不由得长叹一声，坐到椅子上，泪如雨下。
王夫人抱著宝玉，只见他面白气弱，底下穿著一条绿纱小衣皆是血渍，|王夫人抱着宝玉，只见他脸色苍白、气息微弱，下身穿的一条绿纱裤子全是血迹，
禁不住解下汗巾看，由臀至胫，或青或紫，或整或破，竟无一点好处，|忍不住解开汗巾看，从屁股到小腿，青一块紫一块，有的地方肿着，有的地方破了，竟没有一块好地方，
不觉失声大哭起来，“苦命的儿吓！”|不由得放声大哭起来：“我苦命的儿啊！”
因哭出”苦命儿”来，忽又想起贾珠来，便叫著“贾珠”哭道：“若有你活著，便死一百个我也不管了。”|因为哭出“苦命儿”来，忽然又想起贾珠来，就叫着“贾珠”哭道：“要是你还活着，就是死一百个，我也不管了。”
此时里面的人闻得王夫人出来，那李宫裁王熙凤与迎春姊妹早已出来了。|这时里面的人听说王夫人出来了，李纨、王熙凤和迎春姐妹早都出来了。
王夫人哭著贾珠的名字，别人还可，惟有宫裁禁不住也放声哭了。|王夫人哭着贾珠的名字，别人还罢了，只有李纨忍不住也放声大哭。
贾政听了，那泪珠更似滚瓜一般滚了下来。|贾政听了，眼泪更像滚瓜一样滚了下来。
! 贾珠是贾政和王夫人的长子，李纨的丈夫，二十岁不到就死了。王夫人说“若有你活著，便死一百个我也不管”，宝玉是她仅剩的儿子。
! 贾政也哭了。他打宝玉，是恨铁不成钢；他流泪，是想起了早死的长子。严父也是一个失去过儿子的父亲。

# 十一、贾母驾到
正没开交处，忽听丫鬟来说：“老太太来了。”|正闹得不可开交，忽然丫鬟来说：“老太太来了。”
一句话未了，只听窗外颤巍巍的声气说道：“先打死我，再打死他，岂不干净了！”|一句话还没说完，只听窗外一个颤巍巍的声音说：“先打死我，再打死他，岂不干净了！”
贾政见他母亲来了，又急又痛，连忙迎接出来，只见贾母扶著丫头，喘吁吁的走来。|贾政见母亲来了，又急又心疼，连忙迎出去，只见贾母扶着丫头，气喘吁吁地走来。
贾政上前躬身陪笑道：“大暑热天，母亲有何生气亲自走来？有话只该叫了儿子进去吩咐。”|贾政上前弯腰赔笑说：“大热天的，母亲有什么生气的事，还亲自走来？有话只该叫儿子进去吩咐。”
贾母听说，便止住步喘息一回，厉声说道：“你原来是和我说话！|贾母听了，就停住脚喘了一会儿，厉声说：“原来你是在跟我说话！
我倒有话吩咐，只是可怜我一生没养个好儿子，却教我和谁说去！”|我倒是有话要吩咐，只是可怜我这辈子没养个好儿子，叫我跟谁说去！”
贾政听这话不象，忙跪下含泪说道：“为儿的教训儿子，也为的是光宗耀祖。|贾政听这话不对头，连忙跪下含泪说：“做儿子的教训儿子，也是为了光宗耀祖。
母亲这话，我做儿的如何禁得起？”|母亲这话，我做儿子的怎么担当得起？”
贾母听说，便啐了一口，说道：“我说一句话，你就禁不起，你那样下死手的板子，难道宝玉就禁得起了？|贾母听了，就啐了一口，说：“我说一句话你就担当不起，你那样下死手的板子，难道宝玉就受得起了？
你说教训儿子是光宗耀祖，当初你父亲怎么教训你来！”|你说教训儿子是为了光宗耀祖，当初你父亲是怎么教训你的！”
说著，不觉就滚下泪来。|说着，不由得流下泪来。
! 贾母一开口就是“先打死我”，和王夫人那句“先勒死我”一样。在这个家里，母亲们护儿子，用的都是自己的命。
! “当初你父亲怎么教训你来”，有人说是贾代善当年也打过贾政，有人说是贾代善从没这样打过他。无论哪种，贾母这句话都是在压贾政。

# 十二、贾母要回南京
贾政又陪笑道：“母亲也不必伤感，皆是作儿的一时性起，从此以后再不打他了。”|贾政又赔笑说：“母亲也不必伤心，都是做儿子的一时性急，从今以后再也不打他了。”
贾母便冷笑道：“你也不必和我使性子赌气的。你的儿子，我也不该管你打不打。|贾母就冷笑道：“你也不必跟我使性子赌气。你的儿子，我也不该管你打不打。
我猜著你也厌烦我们娘儿们。不如我们赶早儿离了你，大家干净！”|我猜你也嫌我们娘儿们烦了。不如我们早点离开你，大家都干净！”
说著便令人去看轿马，“我和你太太宝玉立刻回南京去！”|说着就叫人去准备轿子车马：“我和你太太、宝玉立刻回南京去！”
家下人只得干答应著。|家人们只好干答应着。
贾母又叫王夫人道：“你也不必哭了。如今宝玉年纪小，你疼他，|贾母又对王夫人说：“你也不必哭了。如今宝玉年纪小，你疼他，
他将来长大成人，为官作宰的，也未必想著你是他母亲了。|他将来长大成人，做了官，也未必记得你是他母亲了。
你如今倒不要疼他，只怕将来还少生一口气呢。”|你现在倒不如别疼他，只怕将来还能少生一口气。”
贾政听说，忙叩头哭道：“母亲如此说，贾政无立足之地。”|贾政听了，连忙磕头哭道：“母亲这么说，贾政就没有立足之地了。”
贾母冷笑道：“你分明使我无立足之地，你反说起你来！|贾母冷笑道：“分明是你叫我没有立足之地，你反倒说起你自己来了！
只是我们回去了，你心里干净，看有谁来许你打。”|只是我们回去了，你心里就干净了，看还有谁来让你打。”
一面说，一面只令快打点行李车轿回去。|一边说，一边只叫人快收拾行李、准备车轿回去。
贾政苦苦叩求认罪。|贾政苦苦磕头求饶认罪。
! 贾母对王夫人说“他将来为官作宰，也未必想著你是他母亲”，表面是说宝玉，其实句句刺的是贾政：你做了官，就不记得我是你母亲了。
! 贾母要“回南京”，这是最重的话。孝道在上，贾政只能磕头认罪。整个贾府，没有人能违抗贾母。

# 十三、春凳抬宝玉
贾母一面说话，一面又记挂宝玉，忙进来看时，只见今日这顿打不比往日，|贾母一边说话，一边又惦记宝玉，连忙进来看，只见今天这顿打不比往常，
又是心疼，又是生气，也抱著哭个不了。|又心疼又生气，也抱着宝玉哭个不停。
王夫人与凤姐等解劝了一会，方渐渐的止住。|王夫人和凤姐等人劝了一会儿，才渐渐止住。
早有丫鬟媳妇等上来，要搀宝玉，凤姐便骂道：“糊涂东西，也不睁开眼瞧瞧！|早有丫鬟媳妇们上来要搀宝玉，凤姐就骂道：“糊涂东西，也不睁开眼睛看看！
打的这么个样儿，还要搀著走！还不快进去把那藤屉子春凳抬出来呢。”|打成这个样子，还要搀着走！还不快进去把那张藤面的春凳抬出来。”
众人听说连忙进去，果然抬出春凳来，将宝玉抬放凳上，随著贾母王夫人等进去，送至贾母房中。|大家听了连忙进去，果然抬出春凳来，把宝玉抬到凳上，跟着贾母、王夫人等人进去，送到贾母房里。
! 人人都在哭，只有凤姐想到要抬春凳。她在最乱的时候最清醒，这就是凤姐的能干。

# 十四、贾政后悔
彼时贾政见贾母气未全消，不敢自便，也跟了进去。|这时贾政见贾母的气还没全消，不敢自己走开，也跟了进去。
看看宝玉，果然打重了。|看看宝玉，果然是打重了。
再看看王夫人，“儿”一声，“肉”一声，|再看看王夫人，“儿啊”一声，“肉啊”一声，
“你替珠儿早死了，留著珠儿，免你父亲生气，我也不白操这半世的心了。|“你要是替珠儿早死了，留下珠儿，免得你父亲生气，我也不会白操这半辈子的心了。
这会子你倘或有个好歹，丢下我，叫我靠那一个！”|这会儿你要是有个三长两短，丢下我，叫我靠哪一个！”
数落一场，又哭“不争气的儿”。|数落了一阵，又哭“不争气的儿啊”。
贾政听了，也就灰心，自悔不该下毒手打到如此地步。|贾政听了，也就灰了心，后悔不该下这么狠的手，打到这个地步。
先劝贾母，贾母含泪说道：“你不出去，还在这里做什么！|先去劝贾母，贾母含着泪说：“你不出去，还在这里做什么！
难道于心不足，还要眼看著他死了才去不成！”|难道还没称心，还要亲眼看着他死了才走吗！”
贾政听说，方退了出来。|贾政听了，才退了出来。
! 王夫人哭“你替珠儿早死了”，又想要宝玉，又想要贾珠，这是一个母亲最痛的话。
! 贾政“灰心”“自悔”，他打完了也心疼，可是一个父亲在这个家里，连心疼都不能说出口。

# 十五、袭人问焙茗
此时薛姨妈同宝钗、香菱、袭人、史湘云也都在这里。|这时薛姨妈和宝钗、香菱、袭人、史湘云也都在这里。
袭人满心委屈，只不好十分使出来，见众人围著，灌水的灌水，打扇的打扇，自己插不下手去，|袭人满心委屈，只是不好全表露出来，见大家围着宝玉，喂水的喂水，扇扇子的扇扇子，自己插不上手，
便越性走出来到二门前，令小厮们找了焙茗来细问：|干脆走出来到二门前，叫小厮们找来焙茗仔细问：
“方才好端端的，为什么打起来？你也不早来透个信儿！”|“刚才好端端的，为什么打起来了？你也不早点来报个信！”
焙茗急的说：“偏生我没在跟前，打到半中间我才听见了。|焙茗急着说：“偏偏我不在跟前，打到一半我才听说。
忙打听原故，却是为琪官金钏姐姐的事。”|连忙打听原因，是为了琪官和金钏姐姐的事。”
袭人道：“老爷怎么得知道的？”|袭人说：“老爷怎么知道的？”
焙茗道：“那琪官的事，多半是薛大爷素日吃醋，没法儿出气，|焙茗说：“琪官的事，多半是薛大爷平时吃醋，没地方出气，
不知在外头唆挑了谁来，在老爷跟前下的火。|不知在外面挑唆了谁，到老爷面前点的火。
那金钏儿的事是三爷说的，我也是听见老爷的人说的。”|金钏儿的事是三爷说的，我也是听老爷身边的人说的。”
袭人听了这两件事都对景，心中也就信了八九分。|袭人听这两件事都对得上，心里也就信了八九分。
然后回来，只见众人都替宝玉疗治。|然后回来，只见大家都在给宝玉治伤。
调停完备，贾母令“好生抬到他房内去”。|收拾停当，贾母吩咐“好好抬到他房里去”。
众人答应，七手八脚，忙把宝玉送入怡红院内自己床上卧好。|大家答应着，七手八脚，赶紧把宝玉送回怡红院，在他自己床上躺好。
又乱了半日，众人渐渐散去，袭人方进前来经心服侍，问他端的。且听下回分解。|又忙乱了半天，大家渐渐散去，袭人才上前来尽心伺候，问他到底是怎么回事。请看下回。
! 焙茗说琪官的事是薛蟠“吃醋”告的状，这是冤枉了薛蟠，下一回薛蟠为这事和宝钗大吵一场。真正知道的是忠顺王府自己。
! 袭人“插不下手去”，宝玉身边围满了长辈和小姐们，一个丫头连靠近的位置都没有。她只能出去打听原因。
</script>
<script type="text/plain" id="ch34">
# 一、袭人看伤
话说袭人见贾母王夫人等去后，便走来宝玉身边坐下，含泪问他：“怎么就打到这步田地？”|袭人等贾母、王夫人她们走了，就来到宝玉身边坐下，含着泪问他：“怎么就打成这个样子？”
宝玉叹气说道：“不过为那些事，问他做什么！只是下半截疼得很，你瞧瞧，打坏了那里？”|宝玉叹着气说：“不过是为了那些事，问它做什么！只是下半身疼得很，你看看，打坏了哪里？”
袭人听说，便轻轻的伸手进去，将中衣褪下。|袭人听了，就轻轻伸手进去，把裤子往下褪。
宝玉略动一动，便咬著牙叫‘嗳哟’，袭人连忙停住手，如此三四次才褪了下来。|宝玉稍微一动，就咬着牙叫“哎哟”，袭人连忙停手，这样三四次才褪了下来。
袭人看时，只见腿上半段青紫，都有四指宽的僵痕高了起来。|袭人一看，只见大腿上半截青紫一片，都是四指宽的伤痕，高高肿起来了。
袭人咬著牙说道：“我的娘，怎么下这般的狠手！|袭人咬着牙说：“我的天，怎么下这么狠的手！
你但凡听我一句话，也不得到这步地位。|你但凡听我一句话，也不至于到这个地步。
幸而没动筋骨，倘或打出个残疾来，可叫人怎么样呢！”|幸好没伤着筋骨，要是打出个残疾来，可叫人怎么办呢！”
! 袭人说“你但凡听我一句话”，她平日劝宝玉的那些话，这一顿打都应验了。这是她下面去见王夫人的底气。

# 二、宝钗送药
正说著，只听丫鬟们说：“宝姑娘来了。”|正说着，只听丫鬟们说：“宝姑娘来了。”
袭人听见，知道穿不及中衣，便拿了一床袷纱被替宝玉盖了。|袭人听见，知道来不及给他穿裤子，就拿了一床夹纱被给宝玉盖上。
只见宝钗手里托著一丸药走进来，向袭人说道：|只见宝钗手里托着一丸药走进来，对袭人说：
“晚上把这药用酒研开，替他敷上，把那淤血的热毒散开，可以就好了。”|“晚上把这药用酒研开，给他敷上，把淤血的热毒散开，就能好了。”
说毕，递与袭人，又问道：“这会子可好些？”|说完，递给袭人，又问：“这会儿好些了吗？”
宝玉一面道谢说：“好了。”又让坐。|宝玉一边道谢说：“好了。”又让她坐。
宝钗见他睁开眼说话，不象先时，心中也宽慰了好些，便点头叹道：|宝钗见他睁开眼睛能说话了，不像刚才那样，心里也宽慰了许多，就点头叹道：
“早听人一句话，也不至今日。|“早听人一句劝，也不会有今天。
别说老太太，太太心疼，就是我们看著，心里也疼。”|别说老太太、太太心疼，就是我们看着，心里也疼。”
刚说了半句又忙咽住，自悔说的话急了，不觉的就红了脸，低下头来。|刚说了半句又连忙咽住了，后悔自己话说得太急了，不由得红了脸，低下头来。
! 宝钗是第一个带药来的人。她最周到，最先想到的不是哭，是治伤。
! “就是我们看著，心里也疼”，这是宝钗难得的真情流露。一个“我们”，一个“疼”字，说出口就后悔了，因为太露了。

# 三、宝玉心中大畅
宝玉听得这话如此亲切稠密，大有深意，忽见他又咽住不往下说，|宝玉听这话说得这样亲切，大有深意，忽然又见她咽住不往下说，
红了脸，低下头只管弄衣带，那一种娇羞怯怯，非可形容得出者，|红了脸，低着头只管摆弄衣带，那一种娇羞怯怯的样子，简直无法形容，
不觉心中大畅，将疼痛早丢在九霄云外，心中自思：|不由得心里非常痛快，把疼痛早丢到九霄云外去了，心里想：
“我不过挨了几下打，他们一个个就有这些怜惜悲感之态露出，令人可玩可观，可怜可敬。|“我不过挨了几下打，她们一个个就露出这样怜惜悲伤的神态，叫人又爱看、又怜惜、又感动。
假若我一时竟遭殃横死，他们还不知是何等悲感呢！|假如我一下子遭了横祸死了，她们还不知道会多么悲伤呢！
既是他们这样，我便一时死了，得他们如此，一生事业纵然尽付东流，亦无足叹惜，|既然她们这样，我就算一下子死了，能得到她们这样的怜爱，一生的事业就算全付东流，也不值得叹惜，
冥冥之中若不怡然自得，亦可谓糊涂鬼祟矣。”|在阴间要是还不能怡然自得，那就真是个糊涂鬼了。”
! 宝玉被打得半死，看见宝钗脸红，竟然“心中大畅”，觉得为此死了也值。这就是宝玉的“痴”：他看重女孩子的眼泪，胜过自己的性命。
! “一生事业纵然尽付东流”，在宝玉心里，女孩子们的真情比什么功名事业都重要。

# 四、宝钗明白哥哥的为人
想著，只听宝钗问袭人道：“怎么好好的动了气，就打起来了？”|正想着，只听宝钗问袭人：“怎么好好的动了气，就打起来了？”
袭人便把焙茗的话说了出来。|袭人就把焙茗的话说了出来。
宝玉原来还不知道贾环的话，见袭人说出方才知道。|宝玉原来还不知道贾环说的话，听袭人说了才知道。
因又拉上薛蟠，惟恐宝钗沉心，忙又止住袭人道：|又因为话里扯上了薛蟠，怕宝钗心里不舒服，连忙拦住袭人说：
“薛大哥哥从来不这样的，你们不可混猜度。”|“薛大哥从来不会这样的，你们不可以乱猜。”
宝钗听说，便知道是怕他多心，用话相拦袭人，因心中暗暗想道：|宝钗听了，就知道宝玉是怕她多心，才用话拦住袭人，心里暗暗想道：
“打的这个形象，疼还顾不过来，还是这样细心，怕得罪了人，可见在我们身上也算是用心了。|“打成这个样子，疼还顾不过来，还这么细心，怕得罪了人，可见在我们身上也算是用了心的。
你既这样用心，何不在外头大事上作工夫，老爷也喜欢了，也不能吃这样亏。|你既然这样用心，何不在外面的正经大事上下功夫，老爷也高兴，也不会吃这样的亏。
但你固然怕我沉心，所以拦袭人的话，难道我就不知我的哥哥素日恣心纵欲，毫无防范的那种心性。|你虽然怕我多心，所以拦住袭人的话，难道我就不知道我哥哥平时任性放纵、一点都不知道防范的那种脾气吗。
当日为一个秦钟，还闹的天翻地覆，自然如今比先又更利害了。”|当初为了一个秦钟，还闹得天翻地覆，现在自然比以前更厉害了。”
! 宝玉自己疼得要死，还先替薛蟠说话，怕宝钗难堪。他对人的体贴，几乎是本能的。
! 宝钗心里想的是“何不在外头大事上作工夫”。她感动于宝玉的细心，却还是希望他去走仕途。这就是宝钗和宝玉之间永远隔着的东西。
! 秦钟的事指第九回闹学堂，那次薛蟠也牵涉其中。宝钗对自己哥哥的为人看得清清楚楚。

# 五、宝钗的一番话
想毕，因笑道：“你们也不必怨这个，怨那个。|想完，就笑道：“你们也不必怨这个、怨那个。
据我想，到底宝兄弟素日不正，肯和那些人来往，老爷才生气。|依我看，到底是宝兄弟平时不正经，肯和那些人来往，老爷才生气。
就是我哥哥说话不防头，一时说出宝兄弟来，也不是有心调唆：|就算是我哥哥说话不注意，一时说出了宝兄弟，也不是存心挑唆：
一则也是本来的实话，二则他原不理论这些防嫌小事。|一来说的也是实话，二来他本来就不在意这些避嫌的小事。
袭姑娘从小儿只见宝兄弟这么样细心的人，|袭姑娘从小只见过宝兄弟这样细心的人，
你何尝见过我哥哥那天不怕地不怕，心里有什么口里就说什么的人。”|你哪里见过我哥哥那种天不怕地不怕、心里想什么嘴上就说什么的人。”
袭人因说出薛蟠来，见宝玉拦他的话，早已明白自己说造次了，恐宝钗没意思，|袭人因为说出了薛蟠，见宝玉拦她的话，早已明白自己说冒失了，怕宝钗没面子，
听宝钗如此说，更觉羞愧无言。|听宝钗这么说，更觉得羞愧，说不出话来。
宝玉又听宝钗这番话，一半是堂皇正大，一半是去己疑心，更觉比先畅快了。|宝玉又听宝钗这番话，一半是光明正大的道理，一半是替自己去掉了嫌疑，更觉得比刚才痛快了。
! 宝钗这番话说得极巧：先说宝玉“不正”，再替哥哥开脱，说就算是他说的也是“实话”。一番话，既不护短，又替薛蟠洗清了。
! 宝钗当着袭人说宝玉“素日不正，肯和那些人来往”，这话袭人最爱听，正说到她心里去了。

# 六、宝钗告辞
方欲说话时，只见宝钗起身说道：“明儿再来看你，你好生养著罢。|正想说话，只见宝钗起身说：“明天再来看你，你好好养着吧。
方才我拿了药来交给袭人，晚上敷上管就好了。”|刚才我拿了药交给袭人，晚上敷上保管就好了。”
说著便走出门去。|说着就走出门去。
袭人赶著送出院外，说：“姑娘倒费心了。改日宝二爷好了，亲自来谢。”|袭人赶着送出院子，说：“姑娘费心了。改天宝二爷好了，亲自来道谢。”
宝钗回头笑道：“有什么谢处。你只劝他好生静养，别胡思乱想的就好了。|宝钗回头笑道：“有什么好谢的。你只劝他好好静养，别胡思乱想就好了。
不必惊动老太太，太太众人，倘或吹到老爷耳朵里，虽然彼时不怎么样，将来对景，终是要吃亏的。”|不必惊动老太太、太太她们，万一传到老爷耳朵里，虽然当时不怎么样，将来一碰上什么事，终究是要吃亏的。”
说著，一面去了。|说着就走了。
袭人抽身回来，心内著实感激宝钗。|袭人转身回来，心里实在感激宝钗。
进来见宝玉沉思默默似睡非睡的模样，因而退出房外，自去栉沐。|进来见宝玉默默沉思，似睡非睡的样子，就退出房外，自己去梳洗了。
! 宝钗临走嘱咐“不必惊动”“将来对景”，她想得远：宝玉和丫头、戏子的事，现在过去了，将来再被翻出来，还要吃亏。
! 袭人“著实感激宝钗”，宝钗在袭人心里的分量越来越重。

# 七、梦中见蒋玉菡、金钏
宝玉默默的躺在床上，无奈臀上作痛，如针挑刀挖一般，更又热如火炙，|宝玉默默地躺在床上，无奈屁股上疼，像针挑刀挖一样，又热得像火烤，
略展转时，禁不住“嗳哟”之声。|稍一翻身，就忍不住“哎哟”出声。
那时天色将晚，因见袭人去了，却有两三个丫鬟伺候，此时并无呼唤之事，|那时天快黑了，见袭人去了，只有两三个丫鬟伺候，这时也没什么要使唤的，
因说道：“你们且去梳洗，等我叫时再来。”|就说：“你们先去梳洗，等我叫的时候再来。”
众人听了，也都退出。|大家听了，也都退出去了。
这里宝玉昏昏默默，只见蒋玉菡走了进来，诉说忠顺府拿他之事，|宝玉迷迷糊糊的，只见蒋玉菡走了进来，诉说忠顺王府抓他的事，
又见金钏儿进来哭说为他投井之情。|又见金钏儿进来哭诉为他投井的事。
宝玉半梦半醒，都不在意。|宝玉半梦半醒，都没在意。
! 宝玉挨打，为的就是这两个人。一个被抓回王府，一个投了井。他们在梦里来找宝玉，宝玉“都不在意”，因为他太疼了，也因为他无能为力。

# 八、黛玉来探
忽又觉有人推他，恍恍忽忽听得有人悲戚之声。|忽然又觉得有人推他，恍恍惚惚听见有人在哭。
宝玉从梦中惊醒，睁眼一看，不是别人，却是林黛玉。|宝玉从梦中惊醒，睁眼一看，不是别人，正是林黛玉。
宝玉犹恐是梦，忙又将身子欠起来，向脸上细细一认，|宝玉还怕是在做梦，连忙又把身子撑起来，往她脸上仔细一看，
只见两个眼睛肿的桃儿一般，满面泪光，不是黛玉，却是那个？|只见她两只眼睛肿得像桃子一样，满脸泪光，不是黛玉，又是谁？
宝玉还欲看时，怎奈下半截疼痛难忍，支持不住，便“嗳哟”一声，仍就倒下，|宝玉还想再看，无奈下半身疼得受不了，撑不住，就“哎哟”一声，又倒下了，
叹了一声，说道：“你又做什么跑来！|叹了一声，说：“你又跑来做什么！
虽说太阳落下去，那地上的馀气未散，走两趟又要受了暑，怎么得了！。|虽说太阳下山了，地上的热气还没散，走两趟又要中暑，怎么得了！
我虽然捱了打，并不觉疼痛。|我虽然挨了打，并不觉得疼。
我这个样儿，只装出来哄他们，好在外头布散与老爷听，其实是假的。你不可认真。”|我这个样子，是装出来哄他们的，好让他们在外面传给老爷听，其实是假的。你别当真。”
! 宝钗带着药来，黛玉带着眼泪来。宝钗劝宝玉“早听人一句话”，黛玉什么都没劝，只是哭得两眼像桃子。
! 宝玉疼得撑不住，开口第一句却是担心黛玉中暑，又骗她说“其实是假的”。他宁可自己疼，也不让黛玉为他伤心。

# 九、“你从此可都改了罢”
此时林黛玉虽不是嚎啕大哭，然越是这等无声之泣，气噎喉堵，更觉得利害。|这时林黛玉虽然不是嚎啕大哭，可越是这样无声地哭，哭得喉咙哽住、气都喘不上来，越显得厉害。
听了宝玉这番话，心中虽然有万句言语，只是不能说得。|听了宝玉这番话，心里虽然有千言万语，却说不出来。
半日，方抽抽噎噎的说道：“你从此可都改了罢！”|过了半天，才抽抽噎噎地说：“你从此都改了吧！”
宝玉听说，便长叹一声道：“你放心，别说这样话。就便为这些人死了，也是情愿的！”|宝玉听了，就长叹一声说：“你放心，别说这样的话。就算为这些人死了，我也是情愿的！”
! 黛玉说“你从此可都改了罢”，这是她唯一一次劝宝玉。可她不是劝他读书做官，只是心疼他挨打。
! 宝玉答“就便为这些人死了，也是情愿的”。“这些人”是琪官、金钏，是一切他怜惜的人。他一点也不打算改。
! 宝玉又说了一次“你放心”。上回是诉肺腑，这回是挨打以后。黛玉懂他，所以只劝了这一句，再不多说。

# 十、黛玉避凤姐
一句话未了，只见院外人说：“二奶奶来了。”|一句话还没说完，只听院外有人说：“二奶奶来了。”
林黛玉便知是凤姐来了，连忙立起身说道：“我从后院子去罢，回来再来。”|林黛玉就知道是凤姐来了，连忙站起来说：“我从后院走吧，等会儿再来。”
宝玉一把拉住道：“这可奇了，好好的怎么怕起他来。”|宝玉一把拉住她说：“这可奇了，好好的怎么怕起她来了。”
林黛玉急的跺脚，悄悄的说道：“你瞧瞧我的眼睛，又该他取笑开心呢。”|林黛玉急得跺脚，悄悄地说：“你看看我的眼睛，她又该拿我取笑了。”
宝玉听说赶忙的放手。|宝玉听了赶紧放手。
黛玉三步两步转过床后，出后院而去。|黛玉三步并作两步，转过床后，从后院走了。
凤姐从前头已进来了，问宝玉：“可好些了？想什么吃，叫人往我那里取去。”|凤姐已经从前面进来了，问宝玉：“好些了吗？想吃什么，叫人到我那里去拿。”
接著，薛姨妈又来了。一时贾母又打发了人来。|接着，薛姨妈又来了。一会儿贾母又打发人来了。
至掌灯时分，宝玉只喝了两口汤，便昏昏沉沉的睡去。|到点灯的时候，宝玉只喝了两口汤，就昏昏沉沉地睡了。
接著，周瑞媳妇，吴新登媳妇，郑好时媳妇这几个有年纪常往来的，听见宝玉捱了打，也都进来。|接着，周瑞媳妇、吴新登媳妇、郑好时媳妇这几个年纪大、常来往的，听说宝玉挨了打，也都进来了。
袭人忙迎出来，悄悄的笑道：“婶婶们来迟了一步，二爷才睡著了。”|袭人连忙迎出来，悄悄笑道：“婶子们来迟了一步，二爷刚睡着。”
说著，一面带他们到那边房里坐了，倒茶与他们吃。|说着，带她们到那边屋里坐下，倒茶给她们喝。
那几个媳妇子都悄悄的坐了一回，向袭人说：“等二爷醒了，你替我们说罢。”|那几个媳妇都悄悄坐了一会儿，对袭人说：“等二爷醒了，你替我们说一声吧。”
! 黛玉不怕人知道她来看宝玉，怕的是人看见她哭肿的眼睛。哭成这样，什么都藏不住了。
! 凤姐、薛姨妈、贾母的人、管家媳妇们，一拨拨来探望。宝玉挨打，成了全府的大事。

# 十一、王夫人叫人
袭人答应了，送他们出去。|袭人答应着，送她们出去。
刚要回来，只见王夫人使个婆子来，口称“太太叫一个跟二爷的人呢。”|刚要回来，只见王夫人派了一个婆子来，说：“太太叫一个跟二爷的人过去。”
袭人见说，想了一想，便回身悄悄的告诉晴雯、麝月、檀云、秋纹等说：|袭人听了，想了一想，就回身悄悄告诉晴雯、麝月、檀云、秋纹等人：
“太太叫人，你们好生在房里，我去了就来。”|“太太叫人，你们好好在房里守着，我去去就来。”
说毕，同那婆子一径出了园子，来至上房。|说完，和那婆子一起出了园子，来到上房。
王夫人正坐在凉榻上摇著芭蕉扇子，见他来了，说：“不管叫个谁来也罢了。你又丢下他来了，谁伏侍他呢？”|王夫人正坐在凉榻上摇着芭蕉扇，见她来了，说：“随便叫个谁来就行了。你又丢下他来了，谁伺候他呢？”
袭人见说，连忙陪笑回道：“二爷才睡安稳了，那四五个丫头如今也好了，会伏侍二爷了，太太请放心。|袭人听了，连忙赔笑回道：“二爷刚睡安稳了，那四五个丫头现在也懂事了，会伺候二爷了，太太请放心。
恐怕太太有什么话吩咐，打发他们来，一时听不明白，倒耽误了。”|我怕太太有什么话要吩咐，打发她们来，一时听不明白，倒误了事。”
! 王夫人说“不管叫个谁”，袭人偏要自己去。她要亲自见王夫人，这是她的机会。

# 十二、木樨清露、玫瑰清露
王夫人道：“也没甚话，白问问他这会子疼的怎么样。”|王夫人说：“也没什么话，只是问问他这会儿疼得怎么样。”
袭人道：“宝姑娘送去的药，我给二爷敷上了，比先好些了。|袭人说：“宝姑娘送去的药，我给二爷敷上了，比刚才好些了。
先疼的躺不稳，这会子都睡沉了，可见好些了。”|先前疼得躺不住，这会儿都睡熟了，可见是好些了。”
王夫人又问：“吃了什么没有？”|王夫人又问：“吃了什么没有？”
袭人道：“老太太给的一碗汤，喝了两口，只嚷干喝，要吃酸梅汤。|袭人说：“老太太给的一碗汤，喝了两口，只嚷着口干，要喝酸梅汤。
我想著酸梅是个收敛的东西，才刚捱了打，又不许叫喊，自然急的那热毒热血未免不存在心里，|我想着酸梅是收敛的东西，他刚挨了打，又不许喊叫，自然急得热毒热血难免郁积在心里，
倘或吃下这个去激在心里，再弄出大病来，可怎么样呢。|要是喝了这个，激在心里，再弄出大病来，可怎么办呢。
因此我劝了半天才没吃，只拿那糖腌的玫瑰卤子和了吃，吃了半碗，又嫌吃絮了，不香甜。”|所以我劝了半天他才没喝，只拿糖腌的玫瑰卤子冲了水喝，喝了半碗，又嫌喝腻了，不香甜。”
王夫人道：“嗳哟，你不该早来和我说。|王夫人说：“哎哟，你该早点来跟我说。
前儿有人送了两瓶子香露来，原要给他点子的，我怕他胡糟踏了，就没给。|前些天有人送来两瓶香露，本来要给他一些的，我怕他乱糟蹋，就没给。
既是他嫌那些玫瑰膏子絮烦，把这个拿两瓶子去。一碗水里只用挑一茶匙儿，就香的了不得呢。”|既然他嫌那些玫瑰膏腻烦，就把这个拿两瓶去。一碗水里只要挑一茶匙，就香得不得了。”
说著就唤彩云来，”把前儿的那几瓶香露拿了来。”|说着就叫彩云来：“把前些天的那几瓶香露拿来。”
袭人道：“只拿两瓶来罢，多了也白糟踏。等不够再要，再来取也是一样。”|袭人说：“只拿两瓶来吧，多了也白糟蹋。等不够了再要，再来取也一样。”
彩云听说，去了半日，果然拿了两瓶来，付与袭人。|彩云听了，去了半天，果然拿了两瓶来，交给袭人。
袭人看时，只见两个玻璃小瓶，却有三寸大小，上面螺丝银盖，鹅黄笺上写著“木樨清露”，那一个写著“玫瑰清露”|袭人一看，只见是两个玻璃小瓶，有三寸大小，上面是螺丝银盖，鹅黄色的签子上写着“木樨清露”，另一个写着“玫瑰清露”。
袭人笑道：“好金贵东西！这么个小瓶子，能有多少？”|袭人笑道：“好金贵的东西！这么个小瓶子，能装多少？”
王夫人道：“那是进上的，你没看见鹅黄笺子？你好生替他收著，别糟踏了。”|王夫人说：“那是进贡给皇上的，你没看见鹅黄色的签子吗？你好好替他收着，别糟蹋了。”
! 袭人说酸梅“收敛”，热毒郁在心里，说得头头是道。她处处显出自己伺候宝玉用心周到，这是说给王夫人听的。
! 鹅黄是皇家专用的颜色，香露是贡品。宝玉一挨打，连贡品都拿出来了。
! 袭人说“只拿两瓶”“多了白糟踏”，在王夫人面前显得懂事节俭。

# 十三、袭人进言
袭人答应著，方要走时，王夫人又叫：“站著，我想起一句话来问你。”|袭人答应着，正要走，王夫人又叫住她：“站着，我想起一句话来要问你。”
袭人忙又回来。|袭人连忙又回来。
王夫人见房内无人，便问道：“我恍惚听见宝玉今儿捱打，是环儿在老爷跟前说了什么话。|王夫人见屋里没别人，就问：“我恍惚听说宝玉今天挨打，是环儿在老爷跟前说了什么话。
你可听见这个了？你要听见，告诉我听听，我也不吵出来教人知道是你说的。”|你听说这个没有？你要是听说了，告诉我听听，我也不会闹出来让人知道是你说的。”
袭人道：“我倒没听见这话，为二爷霸占著戏子，人家来和老爷要，为这个打的。”|袭人说：“我倒没听说这话，是为了二爷扣留着戏子，人家来找老爷要人，为这个打的。”
王夫人摇头说道：“也为这个，还有别的原故。”|王夫人摇头说：“也是为这个，还有别的缘故。”
袭人道：“别的原故实在不知道了。我今儿在太太跟前大胆说句不知好歹的话。论理……”说了半截忙又咽住。|袭人说：“别的缘故我实在不知道了。我今天在太太跟前大胆说句不知轻重的话。照理……”说了一半又连忙咽住了。
王夫人道：“你只管说。”|王夫人说：“你只管说。”
袭人笑道：“太太别生气，我就说了。”|袭人笑道：“太太别生气，我就说了。”
王夫人道：“我有什么生气的，你只管说来。”|王夫人说：“我有什么好生气的，你只管说。”
袭人道：“论理，我们二爷也须得老爷教训两顿。若老爷再不管，将来不知做出什么事来呢。”|袭人说：“照理，我们二爷也该让老爷教训两顿。要是老爷再不管，将来不知道要做出什么事来呢。”
! 袭人明明从焙茗那里知道贾环告状的事，在王夫人面前却说“没听见”。她不愿卷进赵姨娘和王夫人之间的是非。
! 袭人说了半截又咽住，等王夫人三次催她才说。她这是欲擒故纵。
! 全府上下都在心疼宝玉挨打，只有袭人说宝玉“该打”。这话别人不敢说，王夫人却最想听。

# 十四、王夫人的苦衷
王夫人一闻此言，便合掌念声”阿弥陀佛”，由不得赶著袭人叫了一声：|王夫人一听这话，就合掌念了一声“阿弥陀佛”，不由得冲着袭人叫了一声：
“我的儿，亏了你也明白，这话和我的心一样。|“我的儿，亏得你也明白，这话正和我的心思一样。
我何曾不知道管儿子，先时你珠大爷在，我是怎么样管他，难道我如今倒不知管儿子了？|我哪里不知道要管儿子，从前你珠大爷在的时候，我是怎么管他的，难道我现在倒不知道管儿子了？
只是有个原故：如今我想，我已经快五十岁的人，通共剩了他一个，他又长的单弱，|只是有个缘故：现在我想，我已经快五十岁的人了，总共只剩下他一个，他又长得单薄，
况且老太太宝贝似的，若管紧了他，倘或再有个好歹，或是老太太气坏了，|况且老太太把他当宝贝似的，要是管紧了他，万一再有个好歹，或是把老太太气坏了，
那时上下不安，岂不倒坏了。所以就纵坏了他。|那时上上下下都不得安宁，岂不更糟了。所以就把他惯坏了。
我常常掰著口儿劝一阵，说一阵，气的骂一阵，哭一阵，彼时他好，过后儿还是不相干，端的吃了亏才罢了。|我常常苦口婆心地劝一阵、说一阵，气得骂一阵、哭一阵，当时他好了，过后还是老样子，到底吃了亏才算完。
若打坏了，将来我靠谁呢！”|要是打坏了，将来我靠谁呢！”
说著，由不得滚下泪来。|说着，不由得流下泪来。
! 王夫人一声“我的儿”，叫的是袭人。她把一个丫头当作女儿，是因为袭人说出了她不敢说的话。
! “若打坏了，将来我靠谁呢”，王夫人在乎的是宝玉，也是自己的将来。在贾府，母亲的地位靠儿子，她只剩这一个儿子了。

# 十五、袭人建议搬出园子
袭人见王夫人这般悲感，自己也不觉伤了心，陪著落泪。|袭人见王夫人这样伤心，自己也不由得难过起来，陪着流泪。
又道：“二爷是太太养的，岂不心疼。|又说：“二爷是太太亲生的，哪有不心疼的。
便是我们做下人的伏侍一场，大家落个平安，也算是造化了，要这样起来，连平安都不能了。|就是我们这些做下人的伺候一场，大家落个平安，也算是福气了；要是这样下去，连平安都保不住了。
那一日那一时我不劝二爷，只是再劝不醒。|哪一天哪一时我不劝二爷，只是怎么劝也劝不醒。
偏生那些人又肯亲近他，也怨不得他这样，总是我们劝的倒不好了。|偏偏那些人又爱亲近他，也难怪他这样，倒显得是我们劝得不好了。
今儿太太提起这话来，我还记挂著一件事，每要来回太太，讨太太个主意。|今天太太提起这话来，我还惦记着一件事，常想来回太太，讨太太一个主意。
只是我怕太太疑心，不但我的话白说了，且连葬身之地都没了。”|只是怕太太疑心，不但我的话白说了，还连葬身之地都没有了。”
王夫人听了这话内有因，忙问道：“我的儿，你有话只管说。|王夫人听出这话里有缘故，连忙问：“我的儿，你有话只管说。
近来我因听见众人背前背后都夸你，我只说你不过是在宝玉身上留心，或是诸人跟前和气，这些小意思好，|最近我听大家当面背后都夸你，我只当你不过是在宝玉身上用心，或是对大家和气，这些小地方好，
所以将你和老姨娘一体行事。|所以才把你和老姨娘们一样看待。
谁知你方才和我说的话全是大道理，正和我的想头一样。|谁知你刚才和我说的全是大道理，正和我的想法一样。
你有什么只管说什么，只别教别人知道就是了。”|你有什么只管说，只别叫别人知道就行了。”
袭人道：“我也没什么别的说。我只想著讨太太一个示下，怎么变个法儿，以后竟还教二爷搬出园外来住就好了。”|袭人说：“我也没别的话说。我只想讨太太一个主意，想个什么办法，以后还是让二爷搬出园子来住就好了。”
王夫人听了，吃一大惊，忙拉了袭人的手问道：“宝玉难道和谁作怪了不成？”|王夫人听了，大吃一惊，连忙拉住袭人的手问：“宝玉难道和谁做出什么不规矩的事了不成？”
! “将你和老姨娘一体行事”，王夫人已经把袭人当作宝玉的姨娘看待了。这是袭人一直想要的。
! 袭人提出让宝玉搬出园子，王夫人第一反应就是“和谁作怪了”。她最怕的就是宝玉和园里的女孩子出事。

# 十六、袭人的“大道理”
袭人连忙回道：“太太别多心，并没有这话。这不过是我的小见识。|袭人连忙回道：“太太别多心，并没有这种事。这不过是我的一点小见识。
如今二爷也大了，里头姑娘们也大了，况且林姑娘宝姑娘又是两姨姑表姊妹，|如今二爷也大了，园里的姑娘们也大了，况且林姑娘、宝姑娘又是姨表、姑表姐妹，
虽说是姊妹们，到底是男女之分，日夜一处起坐不方便，由不得叫人悬心，|虽说是姐妹，到底有男女之别，日夜在一起起居不方便，由不得叫人担心，
便是外人看著，也不像一家子的事，|就是外人看着，也不像是一家人该有的样子，
俗语说的‘没事常思有事’，世上多少无头脑的人，多半因为无心中做出，有心人看见，当作有心事，反说坏了。|俗话说‘没事常想有事’，世上多少没头脑的人，多半是无心中做了什么，被有心人看见，当作有意的事，反倒说坏了。
只是预先不防著，断然不好。|只是不预先防着，绝对不好。
二爷素日性格，太太是知道的。他又偏好在我们队里闹，|二爷平时的性情，太太是知道的。他又偏爱在我们女孩子堆里闹，
倘或不防，前后错了一点半点，不论真假，人多口杂，|要是不防着，前前后后错了一点半点，不管真假，人多嘴杂，
那起小人的嘴有什么避讳，心顺了，说的比菩萨还好，心不顺，就贬的连畜牲不如。|那些小人的嘴有什么忌讳，心里顺了，说得比菩萨还好；心里不顺，就贬得连畜生都不如。
二爷将来倘或有人说好，不过大家直过没事，|二爷将来要是有人说好，不过大家平平安安没事，
若要叫人说出一个不好字来，我们不用说，粉身碎骨，罪有万重，都是平常小事，|要是叫人说出一个“不好”来，我们就不用说了，粉身碎骨、罪该万死，都是平常小事，
但后来二爷一生的声名品行岂不完了，二则太太也难见老爷。|可是二爷一辈子的名声品行岂不完了，二来太太也难见老爷。
俗语又说‘君子防不然’，不如这会子防避的为是。|俗话又说‘君子防患于未然’，不如现在就防着才好。
太太事情多，一时固然想不到。我们想不到则可，既想到了，若不回明太太，罪越重了。|太太事情多，一时自然想不到。我们想不到也就罢了，既然想到了，要是不回明太太，罪过就更重了。
近来我为这事日夜悬心，又不好说与人，惟有灯知道罢了。”|最近我为这件事日夜担心，又不好跟别人说，只有灯知道罢了。”
! 袭人点名说了“林姑娘宝姑娘”，表面一视同仁，实际上她知道宝玉心里的是黛玉。上一回宝玉错把她当黛玉说了那番话，她“吓得魄消魂散”，这就是她今天进言的缘由。
! 袭人自己和宝玉早有私情，却来劝王夫人防着宝玉和姑娘们。她这番话，有人说是忠心，有人说是心机。
! “惟有灯知道罢了”，袭人说自己日夜忧心，说得动人。这一番话，奠定了她在王夫人心中的地位。

# 十七、王夫人托付宝玉
王夫人听了这话，如雷轰电掣的一般，正触了金钏儿之事，心内越发感爱袭人不尽，|王夫人听了这话，像被雷电击中一样，正好触动了金钏儿的事，心里越发感激喜爱袭人，
忙笑道：“我的儿，你竟有这个心胸，想的这样周全！|连忙笑道：“我的儿，你竟然有这样的心胸，想得这么周全！
我何曾又不想到这里，只是这几次有事就忘了。你今儿这一番话提醒了我。|我何尝没想到这一层，只是这几次一有事就忘了。你今天这一番话提醒了我。
难为你成全我娘儿两个声名体面，真真我竟不知道你这样好。|难为你成全我们娘儿俩的名声体面，我真不知道你这么好。
罢了，你且去罢，我自有道理。|好了，你先去吧，我自有主意。
只是还有一句话：你今既说了这样的话，我就把他交给你了，好歹留心，保全了他，就是保全了我。我自然不辜负你。”|只是还有一句话：你今天既然说了这样的话，我就把他交给你了，好歹留心，保全了他，就是保全了我。我自然不会亏待你。”
袭人连连答应著去了。|袭人连连答应着走了。
! “我就把他交给你了”，王夫人把宝玉托付给了袭人。从这一刻起，袭人成了王夫人安在宝玉身边的人。
! “我自然不辜负你”，这是许诺。第三十六回王夫人就从自己的月例里拿出钱来给袭人，等于是准了她姨娘的身份。
! 这一番话也种下了后来的祸根：第七十七回王夫人抄检大观园、撵走晴雯，起因都和“防着宝玉”有关。

# 十八、宝玉送旧帕子
回来正值宝玉睡醒，袭人回明香露之事。|回来时正好宝玉睡醒了，袭人把香露的事说了。
宝玉喜不自禁，即令调来尝试，果然香妙非常。|宝玉非常高兴，立刻叫人调来尝尝，果然香得很。
因心下记挂著黛玉，满心里要打发人去，只是怕袭人，便设一法，先使袭人往宝钗那里去借书。|因为心里惦记着黛玉，满心想打发人去看她，只是怕袭人，就想了个办法，先叫袭人到宝钗那里去借书。
袭人去了，宝玉便命晴雯来吩咐道：“你到林姑娘那里看看他做什么呢。他要问我，只说我好了。”|袭人走了，宝玉就叫晴雯来吩咐：“你到林姑娘那里去看看她在做什么。她要是问我，就说我好了。”
晴雯道：“白眉赤眼，做什么去呢？到底说句话儿，也象一件事。”|晴雯说：“无缘无故的，去做什么呢？到底说句话，也像有件事。”
宝玉道：“没有什么可说的。”|宝玉说：“没什么可说的。”
晴雯道：“若不然，或是送件东西，或是取件东西，不然我去了怎么搭讪呢？”|晴雯说：“要不然，或是送件东西，或是取件东西，不然我去了怎么搭话呢？”
宝玉想了一想，便伸手拿了两条手帕子撂与晴雯，笑道：“也罢，就说我叫你送这个给他去了。”|宝玉想了想，就伸手拿了两条手帕扔给晴雯，笑道：“也好，就说我叫你送这个给她。”
晴雯道：“这又奇了。他要这半新不旧的两条手帕子？他又要恼了，说你打趣他。”|晴雯说：“这又奇了。她要这半新不旧的两条手帕做什么？她又要恼了，说你取笑她。”
宝玉笑道：“你放心，他自然知道。”|宝玉笑道：“你放心，她自然明白。”
! 宝玉要送东西给黛玉，先把袭人支开。他已经觉察到袭人在防着他和黛玉。
! 宝玉偏偏派晴雯去。晴雯心直口快，不会多想，也不会去告诉别人。
! 宝玉又说了一句“你放心”。他相信黛玉一定懂。

# 十九、黛玉悟出帕子的意思
晴雯听了，只得拿了帕子往潇湘馆来。|晴雯听了，只好拿着手帕往潇湘馆去。
只见春纤正在栏杆上晾手帕子，见他进来，忙摆手儿，说：“睡下了。”|只见春纤正在栏杆上晾手帕，见她进来，连忙摆手说：“睡下了。”
晴雯走进来，满屋魆黑。并未点灯。|晴雯走进来，满屋漆黑，没有点灯。
黛玉已睡在床上，问是谁。|黛玉已经睡在床上，问是谁。
晴雯忙答道：“晴雯。”|晴雯连忙回答：“晴雯。”
黛玉道：“做什么？”|黛玉说：“做什么？”
晴雯道：“二爷送手帕子来给姑娘。”|晴雯说：“二爷叫我送手帕来给姑娘。”
黛玉听了，心中发闷，暗想：“做什么送手帕子来给我？”|黛玉听了，心里纳闷，暗想：“为什么送手帕来给我？”
因问：“这帕子是谁送他的？必是上好的，叫他留著送别人去罢，我这会子不用这个。”|就问：“这手帕是谁送他的？一定是上好的，叫他留着送别人吧，我这会儿用不着这个。”
晴雯笑道：“不是新的，就是家常旧的。”|晴雯笑道：“不是新的，就是平常用旧了的。”
林黛玉听见，越发闷住，著实细心搜求，思忖一时，方大悟过来，连忙说：“放下，去罢。”|林黛玉听了，越发纳闷，仔细琢磨，想了一会儿，才恍然大悟，连忙说：“放下，去吧。”
晴雯听了，只得放下，抽身回去，一路盘算，不解何意。|晴雯听了，只好放下，转身回去，一路上琢磨，不明白是什么意思。
! 春纤晾帕子，宝玉送帕子，帕子在这一回里处处出现。
! 黛玉先以为是别人送宝玉的好帕子，又起了疑心；一听是“家常旧的”，才明白了。旧帕子是宝玉用过的，送给她，是让她拿来擦眼泪，也是说：我的心，你都知道。
! 晴雯“不解何意”。她心里坦荡，想不到这一层，所以宝玉才派她去。

# 二十、黛玉的五种心情
这里林黛玉体贴出手帕子的意思来，不觉神魂驰荡：|林黛玉体会出手帕的意思来，不由得心神激荡：
宝玉这番苦心，能领会我这番苦意，又令我可喜，|宝玉这番苦心，能体会到我这番苦意，叫我欢喜；
我这番苦意，不知将来如何，又令我可悲，|我这番苦意，不知将来会怎样，又叫我悲伤；
忽然好好的送两块旧帕子来，若不是领我深意，单看了这帕子，又令我可笑，|忽然好好的送两块旧手帕来，要不是懂得我的深意，单看这手帕，又叫我好笑；
再想令人私相传递与我，又可惧，|再想到他叫人私下传给我，又叫我害怕；
我自己每每好哭，想来也无味，又令我可愧。|我自己常常爱哭，想来也没意思，又叫我惭愧。
如此左思右想，一时五内沸然炙起。|这样左思右想，一时五脏六腑像火烧一样翻腾起来。
黛玉由不得馀意绵缠，令掌灯，也想不起嫌疑避讳等事，|黛玉不由得情思缠绵，叫人点灯，也想不起什么嫌疑避讳了，
便向案上研墨蘸笔，便向那两块旧帕子上走笔写道：|就在桌上研墨蘸笔，在那两块旧手帕上写道：
! 可喜、可悲、可笑、可惧、可愧，黛玉的心事从来不是一种。“私相传递”是犯忌的，她知道，可她还是忍不住。
! 回目“情中情因情感妹妹”，这一回是宝黛之情最深的一回。宝玉挨了打，两人反倒更近了。

# 二十一、题帕三绝
~眼空蓄泪泪空垂，暗洒闲抛却为谁？|眼里含着泪，泪又白白地流下来，暗里洒、闲里抛，到底是为了谁？
~尺幅鲛鮹劳解赠，叫人焉得不伤悲！|你费心送来这一方手帕，叫我怎能不伤悲！（鲛鮹指手帕）
其二|第二首
~抛珠滚玉只偷潸，镇日无心镇日闲，|泪珠像珠玉一样滚落，只能偷偷地流，整天无心做事，整天闲着，
~枕上袖边难拂拭，任他点点与斑斑。|枕头上、衣袖边的泪痕难以擦去，就任它点点斑斑吧。
其三|第三首
~彩线难收面上珠，湘江旧迹已模糊，|彩线也串不起脸上的泪珠，湘江边竹上的旧泪痕已经模糊了，
~窗前亦有千竿竹，不识香痕渍也无？|我窗前也有千竿翠竹，不知道上面是否也染上了我的泪痕？
! 第三首用的是湘妃的典故：舜帝死后，娥皇、女英二妃泪洒竹上，竹子都成了斑竹。黛玉住在潇湘馆，窗前正是竹子。第三十七回探春给她起号“潇湘妃子”，就因为这个。
! 三首诗写的全是眼泪。黛玉前世是绛珠仙草，今生来还泪，这三首诗是她“还泪”最直接的写照。

# 二十二、病由此萌
林黛玉还要往下写时，觉得浑身火热，面上作烧，走至镜台揭起锦袱一照，|林黛玉还想往下写，觉得浑身发热，脸上发烧，走到镜台前揭开锦罩一照，
只见腮上通红，自羡压倒桃花，却不知病由此萌。|只见两腮通红，自己羡慕这脸色胜过桃花，却不知道病从这里开始了。
一时方上床睡去，犹拿著那帕子思索，不在话下。|过了一会儿才上床睡下，还拿着那手帕想心事。
! “自羡压倒桃花，却不知病由此萌”，作者冷冷一笔。黛玉脸红，是情动，也是病发。肺痨病人脸上常有潮红。情越深，病越重。

# 二十三、宝钗疑心哥哥
却说袭人来见宝钗，谁知宝钗不在园内，往他母亲那里去了，袭人便空手回来。|再说袭人来找宝钗，谁知宝钗不在园里，到她母亲那里去了，袭人就空手回来了。
等至二更，宝钗方回来。|等到二更，宝钗才回来。
原来宝钗素知薛蟠情性，心中已有一半疑是薛蟠调唆了人来告宝玉的，|原来宝钗一向知道薛蟠的脾气，心里已经有一半怀疑是薛蟠挑唆人来告宝玉的，
谁知又听袭人说出来，越发信了。|谁知又听袭人说出来，就更相信了。
究竟袭人是听焙茗说的，那焙茗也是私心窥度，并未据实，竟认准是他说的。|其实袭人是听焙茗说的，焙茗也是自己私下猜的，并没有真凭实据，却认准了是薛蟠说的。
那薛蟠都因素日有这个名声，其实这一次却不是他干的，被人生生的一口咬死是他，有口难分。|薛蟠都是因为平时有这个名声，其实这一次不是他干的，被人硬生生一口咬定是他，有嘴也说不清。
! 作者特意替薛蟠说明：这一次不是他。平时坏事做多了，真冤枉他的时候，连亲妹妹都不信。

# 二十四、薛蟠被冤
这日正从外头吃了酒回来，见过母亲，只见宝钗在这里，说了几句闲话，|这天薛蟠刚从外面喝了酒回来，见过母亲，看见宝钗也在，说了几句闲话，
因问：“听见宝兄弟吃了亏，是为什么？”|就问：“听说宝兄弟吃了亏，是为了什么？”
薛姨妈正为这个不自在，见他问时，便咬著牙道：“不知好歹的东西，都是你闹的，你还有脸来问！”|薛姨妈正为这事不痛快，见他问，就咬着牙说：“不知好歹的东西，都是你闹出来的，你还有脸来问！”
薛蟠见说，便怔了，忙问道：“我何尝闹什么？”|薛蟠听了，就愣了，连忙问：“我闹什么了？”
薛姨妈道：“你还装憨呢！人人都知道是你说的，还赖呢。”|薛姨妈说：“你还装傻！人人都知道是你说的，还赖呢。”
薛蟠道：“人人说我杀了人，也就信了罢？”|薛蟠说：“人人说我杀了人，也就信了吗？”
薛姨妈道：“连你妹妹都知道是你说的，难道他也赖你不成？”|薛姨妈说：“连你妹妹都知道是你说的，难道她也冤枉你不成？”
宝钗忙劝道：“妈和哥哥且别叫喊，消消停停的，就有个青红皂白了。”|宝钗连忙劝道：“妈和哥哥先别嚷，平心静气的，自然就能分出是非黑白了。”
因向薛蟠道：“是你说的也罢，不是你说的也罢，事情也过去了，不必较证，倒把小事儿弄大了。|又对薛蟠说：“是你说的也好，不是你说的也好，事情也过去了，不必争了，倒把小事闹大了。
我只劝你从此以后在外头少去胡闹，少管别人的事。|我只劝你从今以后在外面少去胡闹，少管别人的事。
天天一处大家胡逛，你是个不防头的人，过后儿没事就罢了。|天天跟大家一起乱逛，你是个说话不留神的人，过后没事也就罢了。
倘或有事，不是你干的，人人都也疑惑是你干的，不用说别人，我就先疑惑。”|万一出了事，就算不是你干的，人人也都怀疑是你干的，不用说别人，我就先怀疑。”
! 宝钗嘴上说“是你说的也罢，不是你说的也罢”，其实已经认定是他了。她最后一句“我就先疑惑”，等于当面说出来。
! 这一回宝钗对宝玉和对哥哥，说的是同一番道理：少和那些人来往。

# 二十五、薛蟠要打死宝玉
薛蟠本是个心直口快的人，一生见不得这样藏头露尾的事，|薛蟠本来是个心直口快的人，一辈子见不得这种藏头露尾的事，
又见宝钗劝他不要逛去，他母亲又说他犯舌，宝玉之打是他治的，|又见宝钗劝他别去逛，他母亲又说他多嘴，说宝玉挨打是他害的，
早已急的乱跳，赌身发誓的分辩。|早已急得乱跳，赌咒发誓地分辩。
又骂众人：“谁这样赃派我？我把那囚攮的牙敲了才罢！|又骂众人：“谁这样诬赖我？我非把那混蛋的牙敲掉不可！
分明是为打了宝玉，没的献勤儿，拿我来作幌子。|分明是因为宝玉挨了打，没处献殷勤，拿我来做挡箭牌。
难道宝玉是天王？他父亲打他一顿，一家子定要闹几天。|难道宝玉是天王老子？他父亲打他一顿，一家子非要闹几天。
那一回为他不好，姨爹打了他两下子，过后老太太不知怎么知道了，说是珍大哥哥治的，好好的叫了去骂了一顿。|有一回因为他不好，姨父打了他两下，过后老太太不知怎么知道了，说是珍大哥哥害的，好好的把珍大哥叫去骂了一顿。
今儿越发拉下我了！既拉上，我也不怕，越性进去把宝玉打死了，我替他偿了命，大家干净。”|今天越发把我拉进去了！既然拉上了，我也不怕，干脆进去把宝玉打死，我替他偿命，大家干净。”
一面嚷，一面抓起一根门闩来就跑。|一边嚷，一边抓起一根门闩就跑。
慌的薛姨妈一把抓住，骂道：“作死的孽障，你打谁去？你先打我来！”|慌得薛姨妈一把抓住他，骂道：“找死的孽障，你去打谁？你先打我！”
薛蟠急的眼似铜铃一般，嚷道：“何苦来！又不叫我去，又好好的赖我。|薛蟠急得眼睛瞪得像铜铃一样，嚷道：“何苦呢！又不让我去，又好好的冤枉我。
将来宝玉活一日，我担一日的口舌，不如大家死了清净。”|将来宝玉活一天，我就背一天的骂名，不如大家都死了清净。”
! 薛蟠说“难道宝玉是天王”，说出了全府上下没人敢说的话：宝玉挨一顿打，全家都围着他转，连外人都要背黑锅。
! 薛蟠鲁莽，却不阴险。他冤得跳脚，抓起门闩，是真急了。

# 二十六、宝钗兄妹争吵
宝钗忙也上前劝道：“你忍耐些儿罢。妈急的这个样儿，你不说来劝妈，你还反闹的这样。|宝钗也连忙上前劝道：“你忍着点吧。妈急成这个样子，你不来劝妈，反倒闹成这样。
别说是妈，便是旁人来劝你，也为你好，倒把你的性子劝上来了。”|别说是妈，就是别人来劝你，也是为你好，倒把你的火气劝上来了。”
薛蟠道：“这会子又说这话。都是你说的！”|薛蟠说：“这会儿又说这种话。都是你说的！”
宝钗道：“你只怨我说，再不怨你顾前不顾后的形景。”|宝钗说：“你只怪我说，就不怪你自己顾前不顾后的样子。”
薛蟠道：“你只会怨我顾前不顾后，你怎么不怨宝玉外头招风惹草的那个样子！|薛蟠说：“你只会怪我顾前不顾后，你怎么不怪宝玉在外面招蜂引蝶的那个样子！
别说多的，只拿前儿琪官的事比给你们听：那琪官，我们见过十来次的，我并未和他说一句亲热话，|别的不说，就拿前些天琪官的事给你们听听：那琪官，我们见过十来次了，我一句亲热话都没和他说过，
怎么前儿他见了，连姓名还不知道，就把汗巾儿给他了？难道这也是我说的不成？”|怎么前些天他一见面，连名字还不知道，就把汗巾给他了？难道这也是我说的不成？”
薛姨妈和宝钗急的说道：“还提这个！可不是为这个打他呢。可见是你说的了。”|薛姨妈和宝钗急得说：“还提这个！可不就是为这个打他的吗。可见就是你说的了。”
薛蟠道：“真真的气死人了！赖我说的我不恼，我只为一个宝玉闹的这样天翻地覆的。”|薛蟠说：“真是气死人了！冤枉我说的我不恼，我只恼为了一个宝玉闹得这样天翻地覆的。”
宝钗道：“谁闹了？你先持刀动杖的闹起来，倒说别人闹。”|宝钗说：“谁闹了？你先拿刀动棍地闹起来，倒说别人闹。”
! 薛蟠越辩越糟，一张嘴就说出了汗巾的事。他确实知道，所以人人都认定是他。
! 薛蟠说琪官“我们见过十来次”，宝玉“连姓名还不知道就把汗巾给他了”，话里有醋意。焙茗说他“素日吃醋”，倒也不是没有缘故。

# 二十七、“金要拣有玉的”
薛蟠见宝钗说的话句句有理，难以驳正，比母亲的话反难回答，|薛蟠见宝钗说的话句句有理，难以反驳，比母亲的话还难回答，
因此便要设法拿话堵回他去，就无人敢拦自己的话了，|因此就想找句话把她堵回去，就没人敢拦他的话了，
也因正在气头上，未曾想话之轻重，便说道：|也因为正在气头上，没想话的轻重，就说：
“好妹妹，你不用和我闹，我早知道你的心了。|“好妹妹，你不用跟我闹，我早就知道你的心思了。
从先妈和我说，你这金要拣有玉的才可正配，你留了心。|以前妈跟我说，你这金锁要找个有玉的才能配，你就留了心。
见宝玉有那劳什骨子，你自然如今行动护著他。”|见宝玉有那个破玉，你自然现在处处护着他。”
话未说了，把个宝钗气怔了，拉著薛姨妈哭道：“妈妈你听，哥哥说的是什么话！”|话还没说完，把宝钗气呆了，拉着薛姨妈哭道：“妈妈你听，哥哥说的是什么话！”
薛蟠见妹妹哭了，便知自己冒撞了，便赌气走到自己房里安歇不提。|薛蟠见妹妹哭了，就知道自己说冒失了，就赌气回自己房里睡了。
! 薛蟠一句话，把“金玉良缘”当面捅破了。这件事薛家母女心里都明白，只是从来不说。宝钗一向端庄，被当面说中心事，又羞又气，只能哭。
! “从先妈和我说”，原来“金要拣有玉的”是薛姨妈说的。“金玉良缘”从头就是薛家放出来的话。
! 回目“错里错以错劝哥哥”：薛蟠这次是被冤枉的，宝钗错怪了他，错上加错，所以叫“错里错”。

# 二十八、宝钗哭了一夜
这里薛姨妈气的乱战，一面又劝宝钗道：“你素日知那孽障说话没道理，明儿我叫他给你陪不是。”|薛姨妈气得浑身发抖，一边又劝宝钗说：“你平时知道那孽障说话没道理，明天我叫他给你赔不是。”
宝钗满心委屈气忿，待要怎样，又怕他母亲不安，少不得含泪别了母亲，各自回来，到房里整哭了一夜。|宝钗满心委屈气愤，想怎么样，又怕母亲不安，只好含着泪辞别母亲，自己回来，在房里哭了整整一夜。
次日早起来，也无心梳洗，胡乱整理整理，便出来瞧母亲。|第二天早上起来，也没心思梳洗，胡乱收拾了一下，就出来看母亲。
可巧遇见林黛玉独立在花阴之下，问他那里去。|正好碰见林黛玉一个人站在花荫下，问她到哪里去。
薛宝钗因说“家去”，口里说著，便只管走。|薛宝钗就说“回家去”，嘴里说着，只管往前走。
黛玉见他无精打采的去了，又见眼上有哭泣之状，大非往日可比，|黛玉见她没精打采地走了，又见她眼睛像哭过的样子，和往常大不一样，
便在后面笑道：“姐姐也自保重些儿。就是哭出两缸眼泪来，也医不好棒疮。”|就在后面笑道：“姐姐也要保重些。就算哭出两缸眼泪来，也治不好棒伤。”
不知宝钗如何答对，且听下回分解。|不知宝钗怎么回答，请看下回。
! 一向不动声色的宝钗，哭了整整一夜。她的委屈只能藏着，在人前还是那个端庄的宝姑娘。
! 黛玉以为宝钗是为宝玉挨打哭的，一句“两缸眼泪也医不好棒疮”，刻薄极了。昨夜黛玉自己哭肿了眼睛，今天却来笑宝钗。
