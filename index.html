! “总钥匙”说得极准：凤姐管家，平儿管凤姐的一切。凤姐的私房钱、放债的事，平儿全知道。

# 四、宝钗李纨评各房丫头
宝钗笑道：“这倒是真话。我们没事评论起人来，你们这几个都是百个里头挑不出一个来，妙在各人有各人的好处。”|宝钗笑道：“这倒是真话。我们没事的时候评论起人来，你们这几个都是一百个里挑不出一个来的，妙在各人有各人的好处。”
李纨道：“大小都有个天理。比如老太太屋里，要没那个鸳鸯如何使得。|李纨说：“大大小小都有个天理。比如老太太屋里，要是没有那个鸳鸯怎么行。
从太太起，那一个敢驳老太太的回，现在他敢驳回。偏老太太只听他一个人的话。|从太太起，哪一个敢驳老太太的话，现在只有她敢驳。偏偏老太太只听她一个人的。
老太太那些穿戴的，别人不记得，他都记得，要不是他经管著，不知叫人诓骗了多少去呢。|老太太那些穿戴的东西，别人不记得，她都记得，要不是她管着，不知道要被人骗去多少呢。
那孩子心也公道，虽然这样，倒常替人说好话儿，还倒不依势欺人的。”|那孩子心也公道，虽然这样得宠，倒常替人说好话，还不仗势欺人。”
惜春笑道：“老太太昨儿还说呢，他比我们还强呢。”|惜春笑道：“老太太昨天还说呢，她比我们还强。”
平儿道：“那原是个好的，我们那里比的上他。”|平儿说：“她本来就是个好的，我们哪里比得上她。”
宝玉道：“太太屋里的彩霞，是个老实人。”|宝玉说：“太太屋里的彩霞，是个老实人。”
探春道：“可不是，外头老实，心里有数儿。|探春说：“可不是，外表老实，心里有数。
太太是那么佛爷似的，事情上不留心，他都知道。|太太是那样像菩萨似的，事情上不留心，她都知道。
凡百一应事都是他提著太太行。|大大小小的事都是她提醒着太太去办。
连老爷在家出外去的一应大小事，他都知道。太太忘了，他背地里告诉太太。”|连老爷在家、出门的大小事，她都知道。太太忘了，她就背地里告诉太太。”
李纨道：“那也罢了。”|李纨说：“那也就罢了。”
! 这一段是大观园的“丫头谱”：鸳鸯是贾母的总管，彩霞是王夫人的总管，袭人是宝玉的总管，平儿是凤姐的总管。主子们的家，其实是这些丫头在管。
! 鸳鸯“敢驳老太太的回”，全府只有她一个。第四十六回贾赦要讨她做妾，她敢当着贾母的面拒绝，正是这份胆量。
! 王夫人“佛爷似的，事情上不留心”，王夫人是个糊涂人，所以后来才会被袭人、王善保家的左右。

# 五、李纨伤心
指著宝玉道：“这一个小爷屋里要不是袭人，你们度量到个什么田地！|李纨指着宝玉说：“这位小爷屋里要不是有袭人，你们想想会乱成什么样子！
凤丫头就是楚霸王，也得这两只膀子好举千斤鼎。他不是这丫头，就得这么周到了！”|凤丫头就算是楚霸王，也得有这两只膀子才举得起千斤鼎。她要不是有这个丫头，能这么周到吗！”
平儿笑道：“先时陪了四个丫头，死的死，去的去，只剩下我一个孤鬼了。”|平儿笑道：“当初陪嫁过来四个丫头，死的死，走的走，只剩下我一个孤零零的了。”
李纨道：“你倒是有造化的。凤丫头也是有造化的。|李纨说：“你倒是有福气的。凤丫头也是有福气的。
想当初你珠大爷在日，何曾也没两个人。|想当初你珠大爷在的时候，何尝没有两个屋里人。
你们看我还是那容不下人的？天天只见他两个不自在。|你们看我是那种容不下人的吗？可我天天只看见她们两个不自在。
所以你珠大爷一没了，趁年轻我都打发了。|所以你珠大爷一去世，趁她们还年轻，我就都打发出去了。
若有一个守得住，我倒有个膀臂。”|要是有一个能守得住，我倒也有个帮手。”
说著滴下泪来。|说着掉下泪来。
众人都道：“又何必伤心，不如散了倒好。”|大家都说：“又何必伤心，不如散了吧。”
说著便都洗了手，大家约往贾母王夫人处问安。|说着就都洗了手，大家约着到贾母、王夫人那里去问安。
! 平儿说“死的死，去的去”，凤姐陪嫁来的四个丫头，只剩下她一个。那三个去了哪里？有人说是被凤姐容不下，打发走了，甚至害死了。凤姐的狠毒，在这一句里若隐若现。
! 李纨丈夫早死，年纪轻轻守寡。她把丈夫的妾都打发了，是不想耽误她们一生，结果自己孤孤单单，连个帮手都没有。这是全书里李纨唯一一次流泪。
! 刚才还是满桌笑闹的螃蟹宴，李纨一句话，就散了。大观园里的热闹，底下总藏着说不出的悲伤。

# 六、月钱迟发的秘密
众婆子丫头打扫亭子，收拾杯盘。|婆子丫头们打扫亭子，收拾杯盘。
袭人和平儿同往前去，让平儿到房里坐坐，再喝一杯茶。|袭人和平儿一起往前走，请平儿到屋里坐坐，再喝杯茶。
平儿说：“不喝茶了，再来罢。”说著便要出去。|平儿说：“不喝茶了，下回再来吧。”说着就要走。
袭人又叫住问道：“这个月的月钱，连老太太和太太还没放呢，是为什么？”|袭人又叫住她问：“这个月的月钱，连老太太和太太那边都还没发呢，是为什么？”
平儿见问，忙转身至袭人跟前，见方近无人，才悄悄说道：“你快别问，横竖再迟几天就放了。”|平儿见她问，连忙转身走到袭人跟前，见附近没人，才悄悄说：“你快别问，反正再过几天就发了。”
袭人笑道：“这是为什么，唬得你这样？”|袭人笑道：“这是为什么，把你吓成这样？”
平儿悄悄告诉他道：“这个月的月钱，我们奶奶早已支了，放给人使呢。|平儿悄悄告诉她：“这个月的月钱，我们奶奶早就支出来了，放给别人用了。
等别处的利钱收了来，凑齐了才放呢。|等别处的利息收回来，凑齐了才能发呢。
因为是你，我才告诉你，你可不许告诉一个人去。”|因为是你，我才告诉你，你可不许告诉任何人。”
袭人道：“难道他还短钱使，还没个足厌？何苦还操这心。”|袭人说：“难道她还缺钱用，还没个满足？何苦还操这份心。”
平儿笑道：“何曾不是呢。这几年拿著这一项银子，翻出有几百来了。|平儿笑道：“可不是嘛。这几年拿着这笔银子，已经翻出好几百两来了。
他的公费月例又使不著，十两八两零碎攒了放出去，只他这梯己利钱，一年不到，上千的银子呢。”|她自己的月钱又用不着，十两八两零零碎碎攒起来放出去，光她这私房的利钱，一年不到，就有上千两银子呢。”
袭人笑道：“拿著我们的钱，你们主子奴才赚利钱，哄的我们呆呆的等著。”|袭人笑道：“拿着我们的钱，你们主仆俩去赚利息，哄得我们傻傻地等着。”
平儿道：“你又说没良心的话。你难道还少钱使？”|平儿说：“你又说没良心的话了。你难道还缺钱用？”
袭人道：“我虽不少，只是我也没地方使去，就只预备我们那一个。”|袭人说：“我虽然不缺，只是我也没地方花，就只预备着给我们那一位用。”
平儿道：“你倘若有要紧的事用钱使时，我那里还有几两银子，你先拿来使，明儿我扣下你的就是了。”|平儿说：“你要是有要紧的事要用钱，我那里还有几两银子，你先拿去用，以后我从你的月钱里扣就是了。”
袭人道：“此时也用不著，怕一时要用起来不够了，我打发人去取就是了。”|袭人说：“现在也用不着，怕到时候要用起来不够，我再打发人去取就是了。”
! 这是全书重要的揭露：凤姐挪用全府上下的月钱放高利贷，一年光利钱就上千两。上一回凤姐说“明儿一裹脑子扣的日子还有呢”，原来扣下的钱，是拿去生利息的。
! 放高利贷在当时是违法的。后来贾府被抄家，凤姐放债的事也成了罪状之一。凤姐的贪，是贾府败落的一个原因。
! 袭人说“就只预备我们那一个”，她攒下的钱都是为宝玉预备的。袭人对宝玉，确实是一片真心。

# 七、刘姥姥二进荣国府
平儿答应著，一径出了园门，来至家内，只见凤姐儿不在房里。|平儿答应着，径直出了园门，回到家里，只见凤姐不在屋里。
忽见上回来打抽丰的那刘姥姥和板儿又来了，坐在那边屋里，|忽然看见上回来打秋风的那个刘姥姥和板儿又来了，坐在那边屋里，
还有张材家的周瑞家的陪著，又有两三个丫头在地下倒口袋里的枣子倭瓜并些野菜。|还有张材家的、周瑞家的陪着，又有两三个丫头在地上倒口袋里的枣子、南瓜和一些野菜。
众人见他进来，都忙站起来了。|大家见她进来，都连忙站了起来。
刘姥姥因上次来过，知道平儿的身分，忙跳下地来问”姑娘好”，|刘姥姥因为上次来过，知道平儿的身份，连忙跳下地来问“姑娘好”，
又说：“家里都问好。早要来请姑奶奶的安看姑娘来的，因为庄家忙。|又说：“家里人都问好。早就想来给姑奶奶请安、看看姑娘的，因为庄稼活忙。
好容易今年多打了两石粮食，瓜果菜蔬也丰盛。|好不容易今年多打了两石粮食，瓜果蔬菜也丰收。
这是头一起摘下来的，并没敢卖呢，留的尖儿孝敬姑奶奶姑娘们尝尝。|这是头一茬摘下来的，没敢拿去卖，留下最好的来孝敬姑奶奶和姑娘们尝尝。
姑娘们天天山珍海味的也吃腻了，这个吃个野意儿，也算是我们的穷心。”|姑娘们天天吃山珍海味也吃腻了，吃点这个乡下野味，也算是我们穷人的一点心意。”
平儿忙道：“多谢费心。”又让坐，自己也坐了。|平儿连忙说：“多谢费心。”又让她坐，自己也坐下了。
! “打抽丰”就是打秋风，指借着关系向有钱人讨好处。第六回刘姥姥一进荣国府，凤姐给了她二十两银子。这一回她带着自家地里的瓜菜来道谢。
! 刘姥姥说“留的尖儿孝敬”，最好的没舍得卖，全拿来了。穷人家的谢礼，是一份实心。

# 八、二十多两银子一顿饭
又让张婶子周大娘坐，命小丫头倒茶去，|又让张婶子、周大娘坐，叫小丫头去倒茶，
周瑞张材两家的因笑道：“姑娘今日脸上有些春色，眼圈儿都红了。”|周瑞家的、张材家的就笑道：“姑娘今天脸上有些红润，眼圈都红了。”
平儿笑道：“可不是。我原是不吃的，大奶奶和姑娘们只是拉著死灌，不得已喝了两盅，脸就红了。”|平儿笑道：“可不是。我本来不喝的，大奶奶和姑娘们只是拉着我拼命灌，不得已喝了两杯，脸就红了。”
张材家的笑道：“我倒想著要吃呢，又没人让我。明儿再有人请姑娘，可带了我去罢。”|张材家的笑道：“我倒是想喝呢，又没人请我。以后再有人请姑娘，可带上我吧。”
说著大家都笑了。|说着大家都笑了。
周瑞家的道：“早起我就看见那螃蟹了，一斤只好秤两个三个。这么三大篓，想是有七八十斤呢。”|周瑞家的说：“早上我就看见那螃蟹了，一斤只能称两三个。这么三大篓，想必有七八十斤呢。”
周瑞家的道：“若是上上下下只怕还不够。”|周瑞家的又说：“要是上上下下都吃，只怕还不够。”
平儿道：“那里够，不过都是有名儿的吃两个子。那些散众的，也有摸得著的，也有摸不著的。”|平儿说：“哪里够，不过是有名分的人吃两个罢了。那些一般的人，有的轮得上，有的轮不上。”
刘姥姥道：“这样螃蟹，今年就值五分一斤。|刘姥姥说：“这样的螃蟹，今年要五分银子一斤。
十斤五钱，五五二两五，三五一十五，再搭上酒菜，一共倒有二十多两银子。|十斤就是五钱，五五二两五，三五一十五，再加上酒菜，一共得有二十多两银子。
阿弥陀佛！这一顿的钱够我们庄家人过一年了。”|阿弥陀佛！这一顿饭的钱够我们庄稼人过一年了。”
! 这是全书最有名的一笔账。刘姥姥扳着指头算，一顿螃蟹宴二十多两银子，够庄户人家过一年。
! 大观园里风雅的螃蟹宴，在刘姥姥的算盘里，是一家人一年的口粮。作者不加评论，贫富之差就这样摆在眼前。
! 平儿说“有名儿的吃两个子”，那么多螃蟹，下人们“也有摸得著的，也有摸不著的”。

# 九、贾母要见刘姥姥
平儿因问：“想是见过奶奶了？”|平儿就问：“想必已经见过奶奶了吧？”
刘姥姥道：“见过了，叫我们等著呢。”|刘姥姥说：“见过了，叫我们等着呢。”
说著又往窗外看天气，说道：“天好早晚了，我们也去罢，别出不去城才是饥荒呢。”|说着又往窗外看天色，说：“天不早了，我们也该走了，别出不了城门，那才麻烦呢。”
周瑞家的道：“这话倒是，我替你瞧瞧去。”|周瑞家的说：“这话也对，我替你去看看。”
说著一径去了，半日方来，笑道：“可是你老的福来了，竟投了这两个人的缘了。”|说着径直去了，过了半天才回来，笑道：“可真是您老人家的福气来了，竟然合了这两个人的缘分。”
平儿等问怎么样，周瑞家的笑道：|平儿等人问怎么样，周瑞家的笑道：
“二奶奶在老太太的跟前呢。我原是悄悄的告诉二奶奶，‘刘姥姥要家去呢，怕晚了赶不出城去。’|“二奶奶在老太太跟前呢。我本来是悄悄告诉二奶奶，‘刘姥姥要回家了，怕晚了赶不出城去。’
二奶奶说：‘大远的，难为他扛了那些沉东西来，晚了就住一夜明儿再去。’|二奶奶说：‘这么远的路，难为她扛了那么重的东西来，晚了就住一夜，明天再走。’
这可不是投上二奶奶的缘了。|这可不就是合了二奶奶的缘分。
这也罢了，偏生老太太又听见了，问刘姥姥是谁。二奶奶便回明白了。|这也罢了，偏偏老太太又听见了，问刘姥姥是谁。二奶奶就说明白了。
老太太说：‘我正想个积古的老人家说话儿，请了来我见一见。’|老太太说：‘我正想找个见多识广的老人家说说话，请来让我见一见。’
这可不是想不到天上缘分了。”|这可不是想不到的天大缘分了。”
说著，催刘姥姥下来前去。|说着，就催刘姥姥下炕去。
刘姥姥道：“我这生像儿怎好见的。好嫂子，你就说我去了罢。”|刘姥姥说：“我这副模样怎么好去见。好嫂子，你就说我已经走了吧。”
平儿忙道：“你快去罢，不相干的。我们老太太最是惜老怜贫的，比不得那个狂三诈四的那些人。|平儿连忙说：“你快去吧，不要紧的。我们老太太最是怜惜老人、可怜穷人的，比不得那些装腔作势的人。
想是你怯上，我和周大娘送你去。”|想必是你怕见大人物，我和周大娘送你去。”
说著，同周瑞家的引了刘姥姥往贾母这边来。|说着，和周瑞家的带着刘姥姥往贾母这边来了。
! “积古的老人家”，贾母身边全是年轻人和下人，想找个同辈的老人说说话。贾母的寂寞，在这一句里。
! 平儿说贾母“惜老怜贫”，第二十九回贾母心疼小道士，已经看出来了。

# 十、平儿准假
二门口该班的小厮们见了平儿出来，都站起来了，又有两个跑上来，赶著平儿叫“姑娘”。|二门口值班的小厮们见平儿出来，都站起来了，又有两个跑上来，追着平儿叫“姑娘”。
平儿问：“又说什么？”|平儿问：“又有什么事？”
那小厮笑道：“这会子也好早晚了，我妈病了，等著我去请大夫。好姑娘，我讨半日假可使的？”|那小厮笑道：“这会儿也不早了，我妈病了，等着我去请大夫。好姑娘，我请半天假行不行？”
平儿道：“你们倒好，都商议定了，一天一个告假，又不回奶奶，只和我胡缠。|平儿说：“你们倒好，都商量好了，一天一个来请假，又不去回奶奶，只跟我胡缠。
前儿住儿去了，二爷偏生叫他，叫不著，我应起来了，还说我作了情。你今儿又来了。”|前天住儿走了，二爷偏偏叫他，叫不着，我替他应付过去了，还说我做了人情。你今天又来了。”
周瑞家的道：“当真的他妈病了，姑娘也替他应著，放了他罢。”|周瑞家的说：“他妈真的病了，姑娘也替他担待着，放他去吧。”
平儿道：“明儿一早来。听著，我还要使你呢，再睡的日头晒著屁股再来！|平儿说：“明天一早就来。听着，我还要使唤你呢，再睡到太阳晒着屁股才来，看我怎么收拾你！
你这一去，带个信儿给旺儿，就说奶奶的话，问著他那剩的利钱。|你这一去，给旺儿带个信，就说是奶奶的话，问他那剩下的利钱。
明儿若不交了来，奶奶也不要了，就越性送他使罢。”|明天要是还不交来，奶奶也不要了，干脆就送给他用吧。”
那小厮欢天喜地答应去了。|那小厮欢天喜地地答应着走了。
! 小厮们请假不找凤姐找平儿，平儿心软，常替他们担着。平儿在凤姐手下，是一个缓冲。
! 平儿顺手叫小厮去催旺儿“剩的利钱”。旺儿是凤姐的心腹，替凤姐在外面放债。刚刚对袭人说的事，这里又落了实。

# 十一、刘姥姥见贾母
平儿等来至贾母房中，彼时大观园中姊妹们都在贾母前承奉。|平儿等人来到贾母房里，那时大观园里的姐妹们都在贾母跟前陪着。
刘姥姥进去，只见满屋里珠围翠绕，花枝招展，并不知都系何人。|刘姥姥进去，只见满屋子珠光宝气、花枝招展，也不知道都是些什么人。
只见一张榻上歪著一位老婆婆，身后坐著一个纱罗裹的美人一般的一个丫鬟在那里捶腿，凤姐儿站著正说笑。|只见一张榻上斜靠着一位老太太，身后坐着一个穿纱罗衣裳、美人一样的丫鬟在给她捶腿，凤姐站着正在说笑。
刘姥姥便知是贾母了，忙上来陪著笑，福了几福，口里说：“请老寿星安。”|刘姥姥就知道这是贾母了，连忙上前赔着笑，行了几个礼，嘴里说：“给老寿星请安。”
贾母亦欠身问好，又命周瑞家的端过椅子来坐著。|贾母也欠身问好，又叫周瑞家的端过椅子来让她坐。
那板儿仍是怯人，不知问候。|那板儿还是怕生，不知道问好。
贾母道：“老亲家，你今年多大年纪了？”|贾母说：“老亲家，你今年多大年纪了？”
刘姥姥忙立身答道：“我今年七十五了。”|刘姥姥连忙站起来回答：“我今年七十五了。”
贾母向众人道：“这么大年纪了，还这么健朗。比我大好几岁呢。|贾母对大家说：“这么大年纪了，还这么硬朗。比我大好几岁呢。
我要到这么大年纪，还不知怎么动不得呢。”|我要是到了这么大年纪，还不知道会怎么动不了呢。”
刘姥姥笑道：“我们生来是受苦的人，老太太生来是享福的。若我们也这样，那些庄家活也没人作了。”|刘姥姥笑道：“我们生来是受苦的人，老太太生来是享福的。要是我们也这样，那些庄稼活就没人干了。”
! 贾母叫刘姥姥“老亲家”，一个侯府的老太君，对一个乡下老婆子这样称呼，是给足了面子。
! 刘姥姥七十五岁还要干庄稼活，贾母比她小几岁却“动不得”。一个受苦，一个享福，刘姥姥一句话说得坦然，没有怨气。

# 十二、两个老人聊天
贾母道：“眼睛牙齿都还好？”|贾母说：“眼睛牙齿都还好吗？”
刘姥姥道：“都还好，就是今年左边的槽牙活动了。”|刘姥姥说：“都还好，就是今年左边的大牙有点松了。”
贾母道：“我老了，都不中用了，眼也花，耳也聋，记性也没了。|贾母说：“我老了，都不中用了，眼也花了，耳朵也聋了，记性也没了。
你们这些老亲戚，我都不记得了。亲戚们来了，我怕人笑我，我都不会，|你们这些老亲戚，我都不记得了。亲戚们来了，我怕人笑话我，就都不见，
不过嚼的动的吃两口，睡一觉，闷了时和这些孙子孙女儿顽笑一回就完了。”|不过是嚼得动的吃两口，睡一觉，闷了就和这些孙子孙女们玩笑一阵也就完了。”
刘姥姥笑道：“这正是老太太的福了。我们想这么著也不能。”|刘姥姥笑道：“这正是老太太的福气。我们想这样还不能呢。”
贾母道：“什么福，不过是个老废物罢了。”|贾母说：“什么福气，不过是个老废物罢了。”
说的大家都笑了。|说得大家都笑了。
贾母又笑道：“我才听见凤哥儿说，你带了好些瓜菜来，叫他快收拾去了，|贾母又笑道：“我刚才听凤丫头说，你带了好些瓜菜来，我叫她快收拾去了，
我正想个地里现撷的瓜儿菜儿吃。外头买的，不象你们田地里的好吃。”|我正想吃些地里现摘的瓜菜。外面买的，不像你们田里种的好吃。”
刘姥姥笑道：“这是野意儿，不过吃个新鲜。依我们想鱼肉吃，只是吃不起。”|刘姥姥笑道：“这是乡下的野味，不过吃个新鲜。依我们说，还想吃鱼肉呢，只是吃不起。”
! 贾母和刘姥姥聊的是牙齿、眼睛、记性，两个老人之间最家常的话。贾母在这里不像老太君，像一个普通的老人。
! 贾母想吃地里的瓜菜，刘姥姥想吃鱼肉。一个吃腻了山珍海味，一个吃不起鱼肉，两人互相羡慕。

# 十三、贾母留刘姥姥住下
贾母又道：“今儿既认著了亲，别空空儿的就去。|贾母又说：“今天既然认了亲，别空着手就走。
不嫌我这里，就住一两天再去。|要是不嫌弃我这里，就住一两天再走。
我们也有个园子，园子里头也有果子，你明日也尝尝，带些家去，你也算看亲戚一趟。”|我们也有个园子，园子里也有果子，你明天也尝尝，带些回去，也算你来看亲戚一趟。”
凤姐儿见贾母喜欢，也忙留道：“我们这里虽不比你们的场院大，空屋子还有两间。|凤姐见贾母高兴，也连忙挽留道：“我们这里虽然比不上你们的场院大，空屋子还有两间。
你住两天罢，把你们那里的新闻故事儿说些与我们老太太听听。”|你住两天吧，把你们那里的新鲜事讲些给我们老太太听听。”
贾母笑道：“凤丫头别拿他取笑儿。他是乡屯里的人，老实，那里搁的住你打趣他。”|贾母笑道：“凤丫头别拿她取笑。她是乡下人，老实，哪里经得起你打趣。”
说著，又命人去先抓果子与板儿吃。|说着，又叫人先去抓些果子给板儿吃。
板儿见人多了，又不敢吃。|板儿见人多，又不敢吃。
贾母又命拿些钱给他，叫小幺儿们带他外头顽去。|贾母又叫拿些钱给他，叫小厮们带他到外面去玩。
刘姥姥吃了茶，便把些乡村中所见所闻的事情说与贾母，贾母益发得了趣味。|刘姥姥喝了茶，就把乡下的所见所闻讲给贾母听，贾母越发觉得有趣。
正说著，凤姐儿便令人来请刘姥姥吃晚饭。|正说着，凤姐就叫人来请刘姥姥去吃晚饭。
贾母又将自己的菜拣了几样，命人送过去与刘姥姥吃。|贾母又从自己的菜里挑了几样，叫人送过去给刘姥姥吃。
! 凤姐说“场院”，就是乡下打谷子的空地。她拿刘姥姥的乡下话来逗，已经开始“打趣”了。贾母心善，替刘姥姥挡了一句。
! 贾母把自己的菜分给刘姥姥，这是贾母给的最大的体面。

# 十四、刘姥姥编故事
凤姐知道合了贾母的心，吃了饭便又打发过来。|凤姐知道刘姥姥合了贾母的心意，吃完饭又打发她过来。
鸳鸯忙令老婆子带了刘姥姥去洗了澡，自己挑了两件随常的衣服令给刘姥姥换上。|鸳鸯连忙叫老婆子带刘姥姥去洗了澡，自己挑了两件家常的衣服给刘姥姥换上。
那刘姥姥那里见过这般行事，忙换了衣裳出来，坐在贾母榻前，又搜寻些话出来说。|刘姥姥哪里见过这种排场，连忙换了衣裳出来，坐在贾母榻前，又搜肠刮肚找些话来说。
彼时宝玉姊妹们也都在这里坐著，他们何曾听见过这些话，自觉比那些瞽目先生说的书还好听。|那时宝玉和姐妹们也都在这里坐着，他们哪里听过这些话，觉得比那些盲人说书先生讲的书还好听。
那刘姥姥虽是个村野人，却生来的有些见识，况且年纪老了，世情上经历过的，|那刘姥姥虽然是个乡下人，却天生有些见识，况且年纪大了，人情世故都经历过，
见头一个贾母高兴，第二见这些哥儿姐儿们都爱听，便没了说的也编出些话来讲。|见第一是贾母高兴，第二是这些少爷小姐们都爱听，就算没话说了，也编出些话来讲。
! 刘姥姥“没了说的也编出些话来讲”，她是个聪明人，知道自己在这里的用处，就是逗老太太开心。她不是傻，是“有些见识”。
! 鸳鸯给刘姥姥洗澡换衣，是怕她身上的土气冲撞了贾母。刘姥姥一进门，就被收拾成了贾府能接受的样子。

# 十五、抽柴的女孩
因说道：“我们村庄上种地种菜，每年每日，春夏秋冬，风里雨里，那有个坐著的空儿，|就说道：“我们村子里种地种菜，一年到头，春夏秋冬，风里雨里，哪有坐着的空闲，
天天都是在那地头子上作歇马凉亭，什么奇奇怪怪的事不见呢。|天天都把地头当作歇脚的凉亭，什么奇奇怪怪的事没见过。
就象去年冬天，接连下了几天雪，地下压了三四尺深。|就像去年冬天，接连下了几天雪，地上积了三四尺深。
我那日起的早，还没出房门，只听外头柴草响。|我那天起得早，还没出房门，就听见外面柴草响。
我想著必定是有人偷柴草来了。|我想一定是有人来偷柴草了。
我爬著窗户眼儿一瞧，却不是我们村庄上的人。”|我趴在窗户眼上一看，却不是我们村里的人。”
贾母道：“必定是过路的客人们冷了，见现成的柴，抽些烤火去也是有的。”|贾母说：“一定是过路的客人冷了，看见现成的柴，抽些去烤火，也是有的。”
刘姥姥笑道：“也并不是客人，所以说来奇怪。老寿星当个什么人？|刘姥姥笑道：“也不是客人，所以说来奇怪。老寿星猜是什么人？
原来是一个十七八岁的极标致的一个小姑娘，梳著溜油光的头，穿著大红袄儿，白绫裙子……”|原来是一个十七八岁、长得非常漂亮的小姑娘，梳着油光光的头发，穿着大红袄，白绫裙子……”
! 刘姥姥一看宝玉姐妹们都在，就编了一个漂亮小姑娘的故事。她知道少爷小姐们爱听什么。
! 雪地里一个穿大红袄的女孩子，宝玉一听就入了迷。第四十九回下雪，姐妹们一色大红猩猩毡斗篷聚在一起，也是这样白雪映红衣的景象。

# 十六、马棚失火
刚说到这里，忽听外面人吵嚷起来，又说：“不相干的，别唬著老太太。”|刚说到这里，忽然听见外面有人吵嚷起来，又说：“不要紧的，别吓着老太太。”
贾母等听了，忙问怎么了，丫鬟回说”南院马棚里走了水，不相干，已经救下去了。”|贾母等人听了，连忙问怎么了，丫鬟回说：“南院马棚里失火了，不要紧，已经扑灭了。”
贾母最胆小的，听了这个话，忙起身扶了人出至廊上来瞧，只见东南上火光犹亮。|贾母最胆小，听了这话，连忙起身扶着人走到廊上来看，只见东南方向的火光还亮着。
贾母唬的口内念佛，忙命人去火神跟前烧香。|贾母吓得嘴里念佛，连忙叫人到火神像前烧香。
王夫人等也忙都过来请安，又回说：“已经下去了，老太太请进房去罢。”|王夫人等人也都连忙过来请安，又回说：“火已经灭了，老太太请回房吧。”
贾母足的看著火光息了方领众人进来。|贾母一直看着火光熄灭了，才领着大家进屋来。
宝玉且忙著问刘姥姥：“那女孩儿大雪地作什么抽柴草？倘或冻出病来呢？”|宝玉还急着问刘姥姥：“那女孩子大雪天抽柴草做什么？要是冻病了呢？”
贾母道：“都是才说抽柴草惹出火来了，你还问呢。别说这个了，再说别的罢。”|贾母说：“都是刚才说抽柴草，才惹出火来了，你还问呢。别说这个了，说点别的吧。”
宝玉听说，心内虽不乐，也只得罢了。|宝玉听了，心里虽然不高兴，也只好作罢。
! 刘姥姥正说到抽柴烤火，马棚就失了火。贾母迷信，认为是说火招来了火，不许再说。这是一个不祥的兆头。
! 马棚失火，不大不小，却是贾府后来一连串灾祸的预兆。
! 全屋人都在担心火，只有宝玉还在担心故事里那个女孩子会不会冻病。他对女孩子的怜惜，连编出来的人都算上。

# 十七、观音送孙子
刘姥姥便又想了一篇，说道：“我们庄子东边庄上，有个老奶奶子，今年九十多岁了。|刘姥姥就又想了一个，说道：“我们村子东边的村上，有个老奶奶，今年九十多岁了。
他天天吃斋念佛，谁知就感动了观音菩萨夜里来托梦说：|她天天吃斋念佛，谁知就感动了观音菩萨，夜里来给她托梦说：
‘你这样虔心，原来你该绝后的，如今奏了玉皇，给你个孙子。’|‘你这样虔诚，本来你命里该断子绝孙的，现在我奏明了玉皇大帝，给你一个孙子。’
原来这老奶奶只有一个儿子，这儿子也只一个儿子，好容易养到十七八岁上死了，哭的什么似的。|原来这老奶奶只有一个儿子，这儿子也只有一个儿子，好不容易养到十七八岁死了，哭得不得了。
后果然又养了一个，今年才十三四岁，生的雪团儿一般，聪明伶俐非常。|后来果然又生了一个，今年才十三四岁，长得像雪团一样白净，非常聪明伶俐。
可见这些神佛是有的。”|可见这些神佛是有的。”
这一夕话，实合了贾母王夫人的心事，连王夫人也都听住了。|这一番话，正合了贾母、王夫人的心事，连王夫人都听入了神。
! 刘姥姥这个故事编得极巧：老奶奶只有一个儿子，儿子只有一个孙子，孙子十七八岁死了，后来又得了一个。这和贾母、王夫人家一模一样：贾珠二十不到就死了，宝玉就是那个“又养了一个”。
! 刘姥姥不知道贾府的事，却说中了贾母、王夫人最大的心事。她察言观色的本事，可见一斑。

# 十八、黛玉笑宝玉
宝玉心中只记挂著抽柴的故事，因闷闷的心中筹画。|宝玉心里只惦记着抽柴的那个故事，就闷闷地在心里盘算。
探春因问他“昨日扰了史大妹妹，咱们回去商议著邀一社，又还了席，也请老太太赏菊花，何如？”|探春就问他：“昨天叨扰了史大妹妹，咱们回去商量着请一社，既还了席，也请老太太赏菊花，怎么样？”
宝玉笑道：“老太太说了，还要摆酒还史妹妹的席，叫咱们作陪呢。等著吃了老太太的，咱们再请不迟。”|宝玉笑道：“老太太说了，还要摆酒还史妹妹的席，叫咱们作陪呢。等吃了老太太的，咱们再请也不迟。”
探春道：“越往前去越冷了，老太太未必高兴。”|探春说：“越往后天越冷，老太太不一定有兴致。”
宝玉道：“老太太又喜欢下雨下雪的。不如咱们等下头场雪，请老太太赏雪岂不好？|宝玉说：“老太太又喜欢下雨下雪的。不如咱们等下头一场雪，请老太太赏雪，岂不好？
咱们雪下吟诗，也更有趣了。”|咱们在雪地里吟诗，也更有意思了。”
林黛玉忙笑道：“咱们雪下吟诗？依我说，还不如弄一捆柴火，雪下抽柴，还更有趣儿呢。”|林黛玉连忙笑道：“咱们在雪地里吟诗？依我说，还不如弄一捆柴火，在雪地里抽柴，那才更有意思呢。”
说著，宝钗等都笑了。|说着，宝钗等人都笑了。
宝玉瞅了他一眼，也不答话。|宝玉瞅了她一眼，也不答话。
! 宝玉说“雪下吟诗”，黛玉立刻接一句“雪下抽柴”，笑宝玉满脑子都是那个抽柴的女孩子。黛玉最懂宝玉的心思，也最会挖苦他。
! 宝玉说要赏雪吟诗，第五十回果然有芦雪庵即景联诗，那是大观园最热闹的一次诗会。

# 十九、茗玉小姐
一时散了，背地里宝玉足的拉了刘姥姥，细问那女孩儿是谁。|一会儿散了，宝玉背地里一把拉住刘姥姥，仔细问那女孩子是谁。
刘姥姥只得编了告诉他道：“那原是我们庄北沿地埂子上有一个小祠堂里供的，不是神佛，当先有个什么老爷。”|刘姥姥只好编了告诉他：“那原是我们村北边田埂上一座小祠堂里供着的，不是神佛，从前有个什么老爷。”
说著又想名姓。|说着又想姓名。
宝玉道：“不拘什么名姓，你不必想了，只说原故就是了。”|宝玉说：“不管什么姓名，你不用想了，只说是怎么回事就行了。”
刘姥姥道：“这老爷没有儿子，只有一位小姐，名叫茗玉。|刘姥姥说：“这位老爷没有儿子，只有一位小姐，名叫茗玉。
小姐知书识字，老爷太太爱如珍宝。|小姐知书识字，老爷太太把她当宝贝一样疼爱。
可惜这茗玉小姐生到十七岁，一病死了。”|可惜这茗玉小姐长到十七岁，一场病就死了。”
宝玉听了，跌足叹惜，又问后来怎么样。|宝玉听了，跺着脚叹息，又问后来怎么样了。
刘姥姥道：“因为老爷太太思念不尽，便盖了这祠堂，塑了这茗玉小姐的像，派了人烧香拨火。|刘姥姥说：“因为老爷太太想她想得不得了，就盖了这座祠堂，塑了茗玉小姐的像，派人烧香添火。
如今日久年深的，人也没了，庙也烂了，那个像就成了精。”|如今年深日久，人也没了，庙也破了，那个像就成了精。”
宝玉忙道：“不是成精，规矩这样人是虽死不死的。”|宝玉连忙说：“不是成精，按道理这样的人是虽然死了却不会真死的。”
! 刘姥姥随口编的故事，宝玉却当了真。一个知书识字、十七岁就死了的小姐，宝玉“跌足叹惜”。
! “茗玉”名字里有个“玉”，又是一个早逝的才女。有人说这是在暗指黛玉的结局。
! 宝玉说“这样人是虽死不死的”，在他心里，美好的女孩子死了，也会以别的方式活着。

# 二十、宝玉要修庙
刘姥姥道：“阿弥陀佛！原来如此。不是哥儿说，我们都当他成精。|刘姥姥说：“阿弥陀佛！原来是这样。要不是哥儿说，我们都当她成了精。
他时常变了人出来各村庄店道上闲逛。我才说这抽柴火的就是他了。|她常常变成人出来，在各个村子、店铺、路上闲逛。我刚才说的抽柴火的就是她。
我们村庄上的人还商议著要打了这塑像平了庙呢。”|我们村里的人还商量着要砸了这个塑像、平了这座庙呢。”
宝玉忙道：“快别如此。若平了庙，罪过不小。”|宝玉连忙说：“千万别这样。要是平了庙，罪过可不小。”
刘姥姥道：“幸亏哥儿告诉我，我明儿回去告诉他们就是了。”|刘姥姥说：“幸亏哥儿告诉我，我明天回去告诉他们就是了。”
宝玉道：“我们老太太，太太都是善人，合家大小也都好善喜舍，最爱修庙塑神的。|宝玉说：“我们老太太、太太都是善人，全家上下也都喜欢行善施舍，最爱修庙塑神像。
我明儿做一个疏头，替你化些布施，你就做香头，攒了钱把这庙修盖，再装潢了泥像，每月给你香火钱烧香岂不好？”|我明天写一个化缘的帖子，替你募些钱，你就做香头，攒了钱把这庙修好，再给泥像装扮装扮，每个月给你香火钱烧香，岂不好？”
刘姥姥道：“若这样，我托那小姐的福，也有几个钱使了。”|刘姥姥说：“要是这样，我托那小姐的福，也有几个钱用了。”
宝玉又问他地名庄名，来往远近，坐落何方。|宝玉又问她地名、村名，路有多远，在什么方向。
刘姥姥便顺口胡诌了出来。|刘姥姥就顺口胡编了出来。
! 宝玉要替一个编出来的小姐修庙，刘姥姥立刻想到“也有几个钱使了”。一个是痴，一个是穷，两人想到一处，却是两种心思。
! 宝玉什么都信，刘姥姥什么都敢编。作者写宝玉的痴，又不笑他，只是看着他痴。

# 二十一、茗烟找庙
宝玉信以为真，回至房中，盘算了一夜。|宝玉信以为真，回到房里，盘算了一整夜。
次日一早，便出来给了茗烟几百钱，按著刘姥姥说的方向地名，著茗烟去先踏看明白，回来再做主意。|第二天一早，就出来给了茗烟几百钱，按照刘姥姥说的方向地名，叫茗烟先去看清楚，回来再拿主意。
那茗烟去后，宝玉左等也不来，右等也不来，急的热锅上的蚂蚁一般。|茗烟走了以后，宝玉左等也不来，右等也不来，急得像热锅上的蚂蚁。
好容易等到日落，方见茗烟兴兴头头的回来。|好不容易等到太阳落山，才见茗烟兴冲冲地回来了。
宝玉忙道：“可有庙了？”|宝玉连忙问：“找到庙了吗？”
茗烟笑道：“爷听的不明白，叫我好找。那地名座落不似爷说的一样，|茗烟笑道：“爷没听明白，叫我好找。那地名方位和爷说的不一样，
所以找了一日，找到东北上田埂子上才有一个破庙。”|所以找了一整天，找到东北方向的田埂上，才有一座破庙。”
宝玉听说，喜的眉开眼笑，忙说道：“刘姥姥有年纪的人，一时错记了也是有的。你且说你见的。”|宝玉听了，高兴得眉开眼笑，连忙说：“刘姥姥年纪大了，一时记错了也是有的。你先说说你看见的。”
茗烟道：“那庙门却倒是朝南开，也是稀破的。|茗烟说：“那庙门倒是朝南开的，也是破破烂烂的。
我找的正没好气，一见这个，我说‘可好了’，连忙进去。|我找得正没好气，一看见这个，我说‘这下好了’，连忙进去。
一看泥胎，唬的我跑出来了，活似真的一般。”|一看那泥像，吓得我跑了出来，活像真的一样。”
宝玉喜的笑道：“他能变化人了，自然有些生气。”|宝玉高兴地笑道：“她能变成人，自然有些灵气。”
茗烟拍手道：“那里有什么女孩儿，竟是一位青脸红发的瘟神爷。”|茗烟拍手说：“哪里有什么女孩子，竟然是一位青脸红头发的瘟神爷。”
! 茗烟就是焙茗，宝玉的书童，名字前后改过几次。
! 宝玉一心要找“茗玉小姐”，茗烟找到的却是“青脸红发的瘟神爷”。美丽的梦，撞上了丑陋的现实。作者在这里开了宝玉一个大玩笑。
! 方向不对，宝玉还替刘姥姥圆说“有年纪的人错记了”。他宁可相信一切都是真的。

# 二十二、宝玉骂茗烟
宝玉听了，啐了一口，骂道：“真是一个无用的杀才！这点子事也干不来。”|宝玉听了，啐了一口，骂道：“真是个没用的东西！这点小事都办不好。”
茗烟道：“二爷又不知看了什么书，或者听了谁的混话，信真了，|茗烟说：“二爷又不知道看了什么书，或者听了谁的胡话，当了真，
把这件没头脑的事派我去碰头，怎么说我没用呢？”|把这件没头没脑的事派我去碰钉子，怎么还说我没用呢？”
宝玉见他急了，忙抚慰他道：“你别急。改日闲了你再找去。|宝玉见他急了，连忙安慰他说：“你别急。改天闲了你再去找。
若是他哄我们呢，自然没了，若真是有的，你岂不也积了阴骘。我必重重的赏你。”|要是她骗我们，自然就没有；要是真有，你岂不也积了阴德。我一定重重地赏你。”
正说著，只见二门上的小厮来说：“老太太房里的姑娘们站在二门口找二爷呢。”|正说着，只见二门上的小厮来说：“老太太房里的姑娘们站在二门口找二爷呢。”
要知端祥，下回分解。|要知后事如何，请看下回。
! 宝玉骂完茗烟，又立刻安慰他。他对下人发不起真火。
! 回目“村老妪谎谈承色笑，痴情子实意觅踪迹”：刘姥姥说谎是为了讨贾母欢心，宝玉找庙是一片实心。一个“谎”，一个“实”，一假一真，都写得可爱。
! 刘姥姥第二次进府，从这一回起要待上好几天。下一回贾母两宴大观园，刘姥姥成了全府的笑料，也看尽了贾府最后的繁华。

# 一、宝玉出主意
话说宝玉听了，忙进来看时，只见琥珀站在屏风跟前说：“快去吧，立等你说话呢。”|宝玉听了，赶紧进来一看，只见琥珀站在屏风前说：“快去吧，正等着你说话呢。”
宝玉来至上房，只见贾母正和王夫人众姊妹商议给史湘云还席。|宝玉来到上房，只见贾母正和王夫人、姐妹们商量给史湘云回请酒席。
宝玉因说道：“我有个主意。既没有外客，吃的东西也别定了样数，谁素日爱吃的拣样儿做几样。|宝玉就说：“我有个主意。既然没有外客，吃的东西也别定什么规矩，谁平时爱吃什么，就挑几样做。
也不要按桌席，每人跟前摆一张高几，各人爱吃的东西一两样，再一个什锦攒心盒子，自斟壶，岂不别致。”|也不要按桌摆席，每人面前摆一张高几，放上各人爱吃的一两样菜，再加一个什锦攒心盒子、一把自斟壶，岂不别致。”
贾母听了，说“很是”，忙命传与厨房：“明日就拣我们爱吃的东西作了，按著人数，再装了盒子来。早饭也摆在园里吃。”|贾母听了，说“很好”，连忙叫人传话给厨房：“明天就挑我们爱吃的做，按人数装好盒子送来。早饭也摆在园子里吃。”
商议之间早又掌灯，一夕无话。|商量着天就黑了，一夜无话。
! 每人一张几、各吃各爱的菜，像现在的分餐自助。宝玉不爱规矩，连吃饭也要别出心裁。
! 回目“史太君两宴大观园”：贾母在大观园里连摆两次宴，早饭一次，午后酒席一次，这是贾府最后的全盛景象。

# 二、李纨开楼取几
次日清早起来，可喜这日天气清朗。|第二天一早起来，可喜这天天气晴朗。
李纨清晨先起，看著老婆子丫头们扫那些落叶，并擦抹桌椅，预备茶酒器皿。|李纨一大早先起来，看着婆子丫头们扫落叶，擦桌椅，准备茶具酒具。
祇见丰儿带了刘姥姥板儿进来，说“大奶奶倒忙的紧。”|只见丰儿带着刘姥姥和板儿进来，说：“大奶奶倒是忙得很。”
李纨笑道：“我说你昨儿去不成，只忙著要去。”|李纨笑道：“我说你昨天走不成，你还急着要走。”
刘姥姥笑道：“老太太留下我，叫我也热闹一天去。”|刘姥姥笑道：“老太太留我，叫我也热闹一天再走。”
丰儿拿了几把大小钥匙，说道：“我们奶奶说了，外头的高几儿恐不够使，|丰儿拿着几把大大小小的钥匙，说：“我们奶奶说了，外面的高几怕不够用，
不如开了楼，把那收著的拿下来使一天罢。|不如开了楼，把收着的那些拿下来用一天。
奶奶原该亲自来的，因和太太说话呢，请大奶奶开了，带著人搬罢。”|奶奶本该亲自来的，因为正和太太说话，请大奶奶开了楼，带人去搬吧。”
李氏便令素云接了钥匙，又令婆子出去把二门上的小厮叫几个来。|李纨就叫素云接了钥匙，又叫婆子出去把二门上的小厮叫几个来。
李氏站在大观楼下往上看，令人上去开了缀锦阁，一张一张往下抬。|李纨站在大观楼下往上看，叫人上去打开缀锦阁，一张一张往下抬。
小厮老婆子丫头一齐动手，抬了二十多张下来。|小厮、婆子、丫头一齐动手，抬下来二十多张。
李纨道：“好生著，别慌慌张张鬼赶来似的，仔细碰了牙子。”|李纨说：“小心着，别慌慌张张像鬼追似的，当心碰坏了花边。”
又回头向刘姥姥笑道：“姥姥，你也上去瞧瞧。”|又回头对刘姥姥笑道：“姥姥，你也上去看看。”
刘姥姥听说，巴不得一声儿，便拉了板儿登梯上去。|刘姥姥听了，正巴不得，就拉着板儿登梯子上去了。
进里面，只见乌压压的堆著些围屏，桌椅，大小花灯之类，虽不大认得，只见五彩炫耀，各有奇妙。|进去一看，只见黑压压地堆着些围屏、桌椅、大大小小的花灯之类，虽然不大认得，只见五彩缤纷，各有各的奇妙。
念了几声佛，便下来了。|念了几声佛，就下来了。
然后锁上门，一齐才下来。|然后锁上门，大家才一起下来。
! 大观楼是元春省亲时建的正殿，缀锦阁是它旁边的楼阁。元春省亲时用的东西都收在这里，平时锁着。
! 刘姥姥“虽不大认得”，只能“念了几声佛”。乡下人看见富贵，说不出话来，只能念佛。

# 三、贾母给刘姥姥戴花
李纨道：“恐怕老太太高兴，越性把舡上划子，篙桨，遮阳幔子都搬了下来预备著。”|李纨说：“怕老太太有兴致，干脆把船上的划子、篙、桨、遮阳的帐子都搬下来预备着。”
众人答应，复又开了，色色的搬了下来。|大家答应着，又把门打开，样样都搬了下来。
令小厮传驾娘们到舡坞里撑出两只船来。|又叫小厮去传撑船的女船工们，到船坞里撑出两只船来。
正乱著安排，只见贾母已带了一群人进来了。|正忙乱着安排，只见贾母已经带着一群人进来了。
李纨忙迎上去，笑道：“老太太高兴，倒进来了。我只当还没梳头呢，才撷了菊花要送去。”|李纨连忙迎上去，笑道：“老太太兴致好，倒先进来了。我还以为您还没梳头呢，刚摘了菊花正要送去。”
一面说，一面碧月早捧过一个大荷叶式的翡翠盘子来，里面盛著各色的折枝菊花。|一边说，碧月早已捧过来一个荷叶形的大翡翠盘子，里面盛着各色带枝的菊花。
贾母便拣了一朵大红的簪于鬓上。|贾母就挑了一朵大红的插在鬓边。
因回头看见了刘姥姥，忙笑道：“过来带花儿。”|回头看见了刘姥姥，连忙笑道：“过来戴花。”
一语未完，凤姐便拉过刘姥姥，笑道：“让我打扮你。”|一句话还没说完，凤姐就把刘姥姥拉过来，笑道：“让我来打扮你。”
说著，将一盘子花横三竖四的插了一头。|说着，把一盘子花横七竖八地插了她满头。
贾母和众人笑的了不得。|贾母和大家笑得不得了。
刘姥姥笑道：“我这头也不知修了什么福，今儿这样体面起来。”|刘姥姥笑道：“我这脑袋也不知修了什么福，今天这么体面起来。”
众人笑道：“你还不拔下来摔到他脸上呢，把你打扮的成了个老妖精了。”|大家笑道：“你还不拔下来摔到她脸上，把你打扮成了个老妖精。”
刘姥姥笑道：“我虽老了，年轻时也风流，爱个花儿粉儿的，今儿老风流才好。”|刘姥姥笑道：“我虽然老了，年轻时也爱俏，爱戴个花擦个粉的，今天就老来俏一回才好。”
! 贾母只插一朵，凤姐给刘姥姥插了满头。从这里开始，刘姥姥成了大家取乐的对象。
! 刘姥姥被人笑成“老妖精”，自己也笑着说“老风流才好”。她不是不知道被人取笑，是心甘情愿陪着大家笑。

# 四、刘姥姥夸园子
说笑之间，已来至沁芳亭子上。|说说笑笑间，已经来到沁芳亭上。
丫鬟们抱了一个大锦褥子来，铺在栏杆榻板上。|丫鬟们抱来一条大锦褥子，铺在栏杆边的坐板上。
贾母倚柱坐下，命刘姥姥也坐在旁边，因问他：“这园子好不好？”|贾母靠着柱子坐下，叫刘姥姥也坐在旁边，问她：“这园子好不好？”
刘姥姥念佛说道：“我们乡下人到了年下，都上城来买画儿贴。|刘姥姥念着佛说：“我们乡下人到了过年，都要进城来买年画贴。
时常闲了，大家都说，怎么得也到画儿上去逛逛。|常常闲下来的时候，大家都说，怎么能到画里去逛逛就好了。
想著那个画儿也不过是假的，那里有这个真地方呢。|想着那画也不过是假的，哪里会有这样真的地方呢。
谁知我今儿进这园一瞧，竟比那画儿还强十倍。|谁知我今天进这园子一看，竟然比那画还强十倍。
怎么得有人也照著这个园子画一张，我带了家去，给他们见见，死了也得好处。”|怎么能有人照着这个园子画一张，我带回家去，给他们见见，死了也值了。”
贾母听说，便指著惜春笑道：“你瞧我这个小孙女儿，他就会画。等明儿叫他画一张如何？”|贾母听了，就指着惜春笑道：“你看我这个小孙女，她就会画。等以后叫她画一张怎么样？”
刘姥姥听了，喜的忙跑过来，拉著惜春说道：|刘姥姥听了，高兴得连忙跑过来，拉着惜春说：
“我的姑娘。你这么大年纪儿，又这么个好模样，还有这个能干，别是神仙托生的罢。”|“我的好姑娘。你这么小的年纪，又这么好的模样，还有这个本事，别是神仙投胎的吧。”
! 刘姥姥说大观园“比画儿还强十倍”，这是全书对大观园最朴素也最动人的赞美。乡下人做梦想进画里去逛，她真的进来了。
! 贾母一句话，叫惜春画大观园。第四十二回惜春就开始画《大观园图》，一画就是一年多。

# 五、刘姥姥跌跤
贾母少歇一回，自然领著刘姥姥都见识见识。|贾母稍微歇了一会儿，自然要领着刘姥姥到处见识见识。
先到了潇湘馆。|先到了潇湘馆。
一进门，只见两边翠竹夹路，土地下苍苔布满，中间羊肠一条石子漫的路。|一进门，只见两边翠竹夹着小路，地上长满了青苔，中间一条弯弯曲曲的石子小路。
刘姥姥让出路来与贾母众人走，自己却赶走土地。|刘姥姥把石子路让给贾母和众人走，自己却走在土地上。
琥珀拉著他说道：“姥姥，你上来走，仔细苍苔滑了。”|琥珀拉着她说：“姥姥，你上来走，小心青苔滑。”
刘姥姥道：“不相干的，我们走熟了的，姑娘们只管走罢。可惜你们的那绣鞋，别沾脏了。”|刘姥姥说：“不要紧的，我们走惯了，姑娘们只管走吧。可惜你们那绣花鞋，别弄脏了。”
他只顾上头和人说话，不防底下果踩滑了，咕咚一跤跌倒。|她只顾着上面和人说话，没防备脚下果然踩滑了，咕咚一声摔倒了。
众人拍手都哈哈的笑起来。|大家拍着手哈哈大笑起来。
贾母笑骂道：“小蹄子们，还不搀起来，只站著笑。”|贾母笑骂道：“小丫头们，还不扶起来，只站着笑。”
说话时，刘姥姥已爬了起来，自己也笑了，说道：“才说嘴就打了嘴。”|说话间，刘姥姥已经爬起来了，自己也笑了，说：“刚夸了口，就打了嘴。”
贾母问他：“可扭了腰了不曾？叫丫头们捶一捶。”|贾母问她：“扭着腰没有？叫丫头们给你捶捶。”
刘姥姥道：“那里说的我这么娇嫩了。那一天不跌两下子，都要捶起来，还了得呢。”|刘姥姥说：“哪里就那么娇嫩了。哪一天不摔两下，要是都捶起来，那还得了。”
! 刘姥姥把石子路让给主子们，自己走在泥地上，还替姑娘们的绣鞋着想。她懂得自己的身份。
! 一个七十五岁的老人摔了一跤，大家拍手大笑。贾府的人笑得开心，却没想到老人会不会摔伤，只有贾母问了一句。

# 六、黛玉的屋子
紫鹃早打起湘帘，贾母等进来坐下。|紫鹃早已掀起竹帘，贾母等人进来坐下。
林黛玉亲自用小茶盘捧了一盖碗茶来奉与贾母。|林黛玉亲自用小茶盘捧了一盖碗茶来敬给贾母。
王夫人道：“我们不吃茶，姑娘不用倒了。”|王夫人说：“我们不喝茶，姑娘不用倒了。”
林黛玉听说，便命丫头把自己窗下常坐的一张椅子挪到下首，请王夫人坐了。|林黛玉听了，就叫丫头把自己窗下常坐的一张椅子挪到下首，请王夫人坐。
刘姥姥因见窗下案上设著笔砚，又见书架上磊著满满的书，|刘姥姥看见窗下桌上摆着笔墨砚台，又见书架上堆着满满的书，
刘姥姥道：“这必定是那位哥儿的书房了。”|就说：“这一定是哪位少爷的书房了。”
贾母笑指黛玉道：“这是我这外孙女儿的屋子。”|贾母笑着指着黛玉说：“这是我这个外孙女的屋子。”
刘姥姥留神打量了黛玉一番，方笑道：“这那象个小姐的绣房，竟比那上等的书房还好。”|刘姥姥仔细打量了黛玉一番，才笑道：“这哪像个小姐的绣房，竟比那上等的书房还好。”
贾母因问：“宝玉怎么不见？”|贾母就问：“宝玉怎么不见？”
众丫头们答说：“在池子里舡上呢。”|丫头们回答：“在池子里的船上呢。”
贾母道：“谁又预备下舡了？”|贾母说：“谁又预备了船？”
李纨忙回说：“才开楼拿几，我恐怕老太太高兴，就预备下了。”|李纨连忙回说：“刚才开楼拿几，我怕老太太有兴致，就预备下了。”
贾母听了方欲说话时，有人回说：“姨太太来了。”|贾母听了正要说话，有人回说：“姨太太来了。”
贾母等刚站起来，只见薛姨妈早进来了，一面归坐，笑道：“今儿老太太高兴，这早晚就来了。”|贾母等人刚站起来，只见薛姨妈已经进来了，一边坐下，一边笑道：“今天老太太兴致好，这么早就来了。”
贾母笑道：“我才说来迟了的要罚他，不想姨太太就来迟了。”|贾母笑道：“我刚说来晚的要罚，没想到姨太太就来晚了。”
! 刘姥姥以为潇湘馆是“哥儿的书房”。黛玉的屋子里满是书，没有一点脂粉气。在当时，女子读书多是不被看重的，黛玉偏偏最爱读书。
! 黛玉亲自捧茶给贾母，又把自己常坐的椅子让给王夫人，礼数周全。她平时被人说“小性儿”，在长辈面前却处处得体。

# 七、软烟罗
说笑一会，贾母因见窗上纱的颜色旧了，便和王夫人说道：|说笑了一会儿，贾母见窗上的纱颜色旧了，就对王夫人说：
“这个纱新糊上好看，过了后来就不翠了。|“这种纱刚糊上的时候好看，过些时候就不绿了。
这个院子里头又没有个桃杏树，这竹子已是绿的，再拿这绿纱糊上反不配。|这个院子里又没有桃树杏树，竹子已经是绿的了，再用绿纱糊窗反倒不相配。
我记得咱们先有四五样颜色糊窗的纱呢，明儿给他把这窗上的换了。”|我记得咱们以前有四五种颜色糊窗的纱，明天给她把这窗上的换了。”
凤姐儿忙道：“昨儿我开库房，看见大板箱里还有好些匹银红蝉翼纱，|凤姐连忙说：“昨天我开库房，看见大板箱里还有好些匹银红色的蝉翼纱，
也有各样折枝花样的，也有流云卍福花样的，也有百蝶穿花花样的，|有各种折枝花样的，有流云卍字福纹的，有百蝶穿花图案的，
颜色又鲜，纱又轻软，我竟没见过这样的。|颜色又鲜艳，纱又轻又软，我竟然没见过这样的。
拿了两匹出来，作两床绵纱被，想来一定是好的。”|拿两匹出来，做两床绵纱被，想必一定很好。”
贾母听了笑道：“呸，人人都说你没有不经过不见过，连这个纱还不认得呢，明儿还说嘴。”|贾母听了笑道：“呸，人人都说你什么都经历过、什么都见过，连这种纱都不认得，以后还吹牛。”
薛姨妈等都笑说：“凭他怎么经过见过，如何敢比老太太呢？老太太何不教导了他，我们也听听。”|薛姨妈等人都笑道：“她再怎么经历过见过，怎么敢跟老太太比呢？老太太何不教教她，我们也听听。”
凤姐儿也笑说：“好祖宗，教给我罢。”|凤姐也笑道：“好祖宗，教教我吧。”
贾母笑向薛姨妈众人道：“那个纱，比你们的年纪还大呢。|贾母笑着对薛姨妈等人说：“那种纱，比你们的年纪还大呢。
怪不得他认作蝉翼纱，原也有些象，不知道的，都认作蝉翼纱。|难怪她认作蝉翼纱，本来也有些像，不知道的人都当成蝉翼纱。
正经名字叫作‘软烟罗’。”|正经名字叫‘软烟罗’。”
凤姐儿道：“这个名儿也好听。只是我这么大了，纱罗也见过几百样，从没听见过这个名色。”|凤姐说：“这个名字也好听。只是我这么大了，纱罗也见过几百种，从没听说过这个名字。”
贾母笑道：“你能够活了多大，见过几样没处放的东西，就说嘴来了。|贾母笑道：“你才活了多大，见过几样稀罕东西，就吹起牛来了。
那个软烟罗只有四样颜色：一样雨过天晴，一样秋香色，一样松绿的，一样就是银红的，|那种软烟罗只有四种颜色：一种是雨过天晴的淡青色，一种是秋香色，一种是松绿色，一种就是银红色，
若是做了帐子，糊了窗屉，远远的看著，就似烟雾一样，所以叫作‘软烟罗’。|要是做成帐子、糊了窗户，远远看去，就像烟雾一样，所以叫‘软烟罗’。
那银红的又叫作‘霞影纱’。|那银红色的又叫‘霞影纱’。
如今上用的府纱也没有这样软厚轻密的了。”|如今宫里用的上等纱，也没有这样又软又厚、又轻又密的了。”
! 凤姐当家，连库房里的东西都不认得，贾母一说就认出来了。“比你们的年纪还大”，这是贾府祖上鼎盛时的东西，如今已经没人认得了。
! “霞影纱”给黛玉糊窗，第七十九回宝玉祭晴雯，说“茜纱窗下，我本无缘”，正是这霞影纱糊的窗。
! 凤姐故意装作不认得，好让贾母显摆一回。贾母说得越得意，凤姐的目的就越达到了。

# 八、刘姥姥舍不得
薛姨妈笑道：“别说凤丫头没见，连我也没听见过。”|薛姨妈笑道：“别说凤丫头没见过，连我也没听说过。”
凤姐儿一面说，早命人取了一匹来了。|凤姐一边说，早已叫人取来一匹。
贾母说：“可不是这个！先时原不过是糊窗屉，后来我们拿这个作被作帐子，试试也竟好。|贾母说：“可不就是这个！以前本来只是糊窗户用的，后来我们拿它来做被子、做帐子，试了试竟然也很好。
明儿就找出几匹来，拿银红的替他糊窗子。”|明天就找出几匹来，拿银红色的替她糊窗户。”
凤姐答应著。|凤姐答应着。
众人都看了，称赞不已。|大家都看了，称赞不已。
刘姥姥也觑著眼看个不了，念佛说道：“我们想他作衣裳也不能，拿著糊窗子，岂不可惜？”|刘姥姥也眯着眼睛看个不停，念着佛说：“我们想拿它做衣裳都做不起，你们拿来糊窗户，岂不可惜？”
贾母道：“倒是做衣裳不好看。”|贾母说：“做衣裳倒不好看。”
凤姐忙把自己身上穿的一件大红绵纱袄子襟儿拉了出来，向贾母薛姨妈道：“看我的这袄儿。”|凤姐连忙把自己身上穿的一件大红绵纱袄的衣襟拉出来，对贾母、薛姨妈说：“看我这件袄子。”
贾母薛姨妈都说：“这也是上好的了，这是如今的上用内造的，竟比不上这个。”|贾母、薛姨妈都说：“这也是上好的了，这是如今宫里做的，竟比不上这个。”
凤姐儿道：“这个薄片子，还说是上用内造呢，竟连官用的也比不上了。”|凤姐说：“这么薄的料子，还说是宫里做的呢，竟连官府用的都比不上。”
! 刘姥姥舍不得的东西，贾府拿来糊窗户。刘姥姥说“岂不可惜”，贾母说“做衣裳不好看”。两个老人说的是同一块纱，看的却是两个世界。
! 凤姐身上穿的是宫里的东西，都比不上祖上留下的软烟罗。一代不如一代，从一块纱上就看得出来。

# 九、贾母送纱
贾母道：“再找一找，只怕还有青的。|贾母说：“再找一找，恐怕还有青色的。
若有时都拿出来，送这刘亲家两匹，做一个帐子我挂，|要是有，都拿出来，送这位刘亲家两匹，做一顶帐子我挂，
下剩的添上里子，做些夹背心子给丫头们穿，白收著霉坏了。”|剩下的加上里子，做些夹背心给丫头们穿，白放着要霉坏了。”
凤姐忙答应了，仍令人送去。|凤姐连忙答应了，叫人把纱送回去。
贾母起身笑道：“这屋里窄，再往别处逛去。”|贾母起身笑道：“这屋里窄，再到别处逛逛。”
刘姥姥念佛道：“人人都说大家子住大房。|刘姥姥念佛说：“人人都说大户人家住大房子。
昨儿见了老太太正房，配上大箱大柜大桌子大床，果然威武。|昨天见了老太太的正房，配着大箱子大柜子、大桌子大床，果然气派。
那柜子比我们那一间房子还大还高。|那柜子比我们家一间房子还大还高。
怪道后院子里有个梯子。我想并不上房晒东西，预备个梯子作什么？|怪不得后院里有个梯子。我想又不上房晒东西，预备个梯子做什么？
后来我想起来，定是为开顶柜收放东西，非离了那梯子，怎么得上去呢。|后来我想起来了，一定是为了开顶上的柜子放东西，不用那梯子，怎么上得去呢。
如今又见了这小屋子，更比大的越发齐整了。|如今又见了这小屋子，比那大的还要精致整齐。
满屋里的东西都只好看，都不知叫什么，我越看越舍不得离了这里。”|满屋子的东西都好看，都不知道叫什么，我越看越舍不得离开这里。”
凤姐道：“还有好的呢，我都带你去瞧瞧。”|凤姐说：“还有好的呢，我都带你去看看。”
说著一径离了潇湘馆。|说着就离开了潇湘馆。
! 刘姥姥说柜子比她家的房子还大。她在贾府里看什么都新鲜，可她心里比谁都清醒，知道自己是来见识的，不是来享受的。

# 十、凤姐鸳鸯商量取笑
远远望见池中一群人在那里撑舡。|远远看见池子里一群人在撑船。
贾母道：“他们既预备下船，咱们就坐。”|贾母说：“他们既然预备了船，咱们就坐。”
一面说著，便向紫菱洲蓼溆一带走来。|一边说着，就往紫菱洲、蓼溆一带走去。
未至池前，只见几个婆子手里都捧著一色捏丝戗金五彩大盒子走来。|还没走到池边，只见几个婆子手里都捧着一样的捏丝戗金五彩大盒子走来。
凤姐忙问王夫人早饭在那里摆。|凤姐连忙问王夫人早饭摆在哪里。
王夫人道：“问老太太在那里，就在那里罢了。”|王夫人说：“问老太太想在哪里，就在哪里吧。”
贾母听说，便回头说：“你三妹妹那里就好。你就带了人摆去，我们从这里坐了舡去。”|贾母听了，就回头说：“你三妹妹那里就好。你就带人去摆，我们从这里坐船过去。”
凤姐听说，便回身同了探春，李纨，鸳鸯，琥珀带著端饭的人等，抄著近路到了秋爽斋，就在晓翠堂上调开桌案。|凤姐听了，就转身和探春、李纨、鸳鸯、琥珀带着端饭的人，抄近路到了秋爽斋，就在晓翠堂上摆开桌子。
鸳鸯笑道：“天天咱们说外头老爷们吃酒吃饭都有一个篾片相公，拿他取笑儿。|鸳鸯笑道：“咱们天天说外面老爷们吃酒吃饭，都有一个陪着凑趣的清客相公，拿他来取笑。
咱们今儿也得了一个女篾片了。”|咱们今天也得了一个女清客了。”
李纨是个厚道人，听了不解。|李纨是个厚道人，听了不明白。
凤姐儿却知是说的是刘姥姥了，也笑说道：“咱们今儿就拿他取个笑儿。”|凤姐却知道说的是刘姥姥，也笑道：“咱们今天就拿她来取个乐。”
二人便如此这般的商议。|两人就如此这般地商量了一番。
李纨笑劝道：“你们一点好事也不做，又不是个小孩儿，还这么淘气，仔细老太太说。”|李纨笑着劝道：“你们一点好事也不做，又不是小孩子了，还这么淘气，当心老太太说你们。”
鸳鸯笑道：“很不与你相干，有我呢。”|鸳鸯笑道：“不关你的事，有我呢。”
! “篾片相公”就是第二十六回那些詹光、单聘仁之类的清客，专门陪老爷们吃喝、凑趣。鸳鸯把刘姥姥比作“女篾片”，就是拿她当取乐的玩意儿。
! 凤姐和鸳鸯，一个是贾母面前最得宠的孙媳妇，一个是贾母最信任的丫头。两人联手，下面就要上演全书最有名的一场闹剧。
! 只有李纨不懂，也只有李纨劝。她是厚道人，不忍心拿一个老人取乐。

# 十一、象牙镶金筷子
正说著，只见贾母等来了，各自随便坐下。|正说着，只见贾母等人来了，各自随便坐下。
先著丫鬟端过两盘茶来，大家吃毕。|先叫丫鬟端过两盘茶来，大家喝完。
凤姐手里拿著西洋布手巾，裹著一把乌木三镶银箸，敁敪人位，按席摆下。|凤姐手里拿着西洋布手巾，裹着一把乌木镶银的筷子，估量着人的座位，按席摆下。
贾母因说：“把那一张小楠木桌子抬过来，让刘亲家近我这边坐著。”|贾母就说：“把那张小楠木桌子抬过来，让刘亲家挨着我这边坐。”
众人听说，忙抬了过来。|大家听了，连忙抬了过来。
凤姐一面递眼色与鸳鸯，鸳鸯便拉了刘姥姥出去，悄悄的嘱咐了刘姥姥一席话，|凤姐一边给鸳鸯递眼色，鸳鸯就把刘姥姥拉了出去，悄悄嘱咐了她一番话，
又说：“这是我们家的规矩，若错了我们就笑话呢。”|又说：“这是我们家的规矩，要是错了，我们可要笑话的。”
调停已毕，然后归坐。|安排妥当，然后回座。
薛姨妈是吃过饭来的，不吃，只坐在一边吃茶。|薛姨妈是吃过饭来的，不吃，只坐在一边喝茶。
贾母带著宝玉，湘云，黛玉，宝钗一桌。|贾母带着宝玉、湘云、黛玉、宝钗一桌。
王夫人带著迎春姊妹三个人一桌，刘姥姥傍著贾母一桌。|王夫人带着迎春姐妹三个一桌，刘姥姥挨着贾母一桌。
贾母素日吃饭，皆有小丫鬟在旁边，拿著漱盂麈尾巾帕之物。|贾母平时吃饭，都有小丫鬟在旁边，拿着漱口盂、拂尘、手巾之类的东西。
如今鸳鸯是不当这差的了，今日鸳鸯偏接过麈尾来拂著。|鸳鸯如今已经不当这个差了，今天鸳鸯偏偏接过拂尘来亲自拂着。
丫鬟们知道他要撮弄刘姥姥，便躲开让他。|丫鬟们知道她要捉弄刘姥姥，就躲开让她。
鸳鸯一面侍立，一面悄向刘姥姥说道：“别忘了。”|鸳鸯一边站着伺候，一边悄悄对刘姥姥说：“别忘了。”
刘姥姥道：“姑娘放心。”|刘姥姥说：“姑娘放心。”
那刘姥姥入了坐，拿起箸来，沉甸甸的不伏手。|刘姥姥入了座，拿起筷子来，沉甸甸的不顺手。
原是凤姐和鸳鸯商议定了，单拿一双老年四楞象牙镶金的筷子与刘姥姥。|原来是凤姐和鸳鸯商量好了，单拿一双老式的四棱象牙镶金筷子给刘姥姥。
刘姥姥见了，说道：“这叉爬子比俺那里铁掀还沉，那里强的过他。”|刘姥姥见了，说：“这叉子比我们那里的铁锹还沉，哪里拿得动它。”
说的众人都笑起来。|说得大家都笑起来。
! 鸳鸯嘱咐刘姥姥的“规矩”，就是下面那几句粗话。刘姥姥明知是捉弄，还说“姑娘放心”。
! 象牙镶金的筷子又重又滑，是专门挑来让刘姥姥出丑的。“叉爬子”“铁掀”，刘姥姥用农具来比筷子，一开口就是笑料。

# 十二、“老刘，老刘，食量大似牛”
只见一个媳妇端了一个盒子站在当地，一个丫鬟上来揭去盒盖，里面盛著两碗菜。|只见一个媳妇端着一个盒子站在屋子中间，一个丫鬟上来揭开盒盖，里面盛着两碗菜。
李纨端了一碗放在贾母桌上。|李纨端了一碗放在贾母桌上。
凤姐儿偏拣了一碗鸽子蛋放在刘姥姥桌上。|凤姐偏偏挑了一碗鸽子蛋放在刘姥姥桌上。
贾母这边说声“请”，刘姥姥便站起身来，高声说道：|贾母这边一说“请”，刘姥姥就站起身来，大声说道：
“老刘，老刘，食量大似牛，吃一个老母猪不抬头。”|“老刘，老刘，饭量大如牛，吃起来像老母猪一样不抬头。”
自己却鼓著腮不语。|说完自己鼓着腮帮子一声不吭。
! 这就是鸳鸯教的“规矩”。刘姥姥说完“鼓著腮不语”，一本正经，所以更好笑。
! 凤姐给刘姥姥的是鸽子蛋，又小又圆又滑，配上那双象牙筷子，正是要她夹不起来。

# 十三、满屋大笑
众人先是发怔，后来一听，上上下下都哈哈的大笑起来。|大家先是一愣，后来一回味，上上下下都哈哈大笑起来。
史湘云撑不住，一口饭都喷了出来，|史湘云忍不住，一口饭全喷了出来，
林黛玉笑岔了气，伏著桌子嗳哟，|林黛玉笑岔了气，趴在桌子上直叫“哎哟”，
宝玉早滚到贾母怀里，贾母笑的搂著宝玉叫“心肝”，|宝玉早已滚到贾母怀里，贾母笑得搂着宝玉叫“心肝”，
王夫人笑的用手指著凤姐儿，只说不出话来，|王夫人笑得用手指着凤姐，只是说不出话来，
薛姨妈也撑不住，口里茶喷了探春一裙子，|薛姨妈也忍不住，嘴里的茶喷了探春一裙子，
探春手里的饭碗都合在迎春身上，|探春手里的饭碗都扣在了迎春身上，
惜春离了坐位，拉著他奶母叫揉一揉肠子。|惜春离开座位，拉着她的奶妈叫给她揉揉肚子。
地下的无一个不弯腰屈背，也有躲出去蹲著笑去的，也有忍著笑上来替他姊妹换衣裳的，|地上站着的人没有一个不笑弯了腰，有躲出去蹲着笑的，有忍着笑上来给姐妹们换衣服的，
独有凤姐鸳鸯二人撑著，还只管让刘姥姥。|只有凤姐和鸳鸯两人忍着，还只管让刘姥姥吃。
! 这是《红楼梦》最有名的一段“众人笑态”。湘云喷饭、黛玉岔气、宝玉滚怀、贾母叫心肝、王夫人指凤姐、薛姨妈喷茶、探春扣碗、惜春揉肠，一人一个样子，各有各的性情。
! 湘云豪爽，笑得最放肆；黛玉体弱，笑得岔了气；惜春年纪最小，要奶妈揉肚子。
! 满屋子人都笑倒了，只有始作俑者凤姐和鸳鸯撑着不笑。她们要的效果达到了。

# 十四、一两银子一个的鸽子蛋
刘姥姥拿起箸来，只觉不听使，又说道：“这里的鸡儿也俊，下的这蛋也小巧，怪俊的。我且肏攮一个。”|刘姥姥拿起筷子，只觉得不听使唤，又说：“这里的鸡也俊，下的蛋也小巧，怪好看的。我先捅一个塞嘴里尝尝。”（“肏攮”是乡下粗话，意思是往嘴里塞。）
众人方住了笑，听见这话又笑起来。|大家刚止住笑，听见这话又笑起来。
贾母笑的眼泪出来，琥珀在后捶著。|贾母笑得眼泪都出来了，琥珀在后面给她捶背。
贾母笑道：“这定是凤丫头促狭鬼儿闹的，快别信他的话了。”|贾母笑道：“这一定是凤丫头这个捣蛋鬼闹的，快别听她的话了。”
那刘姥姥正夸鸡蛋小巧，要肏攮一个，凤姐儿笑道：“一两银子一个呢，你快尝尝罢，那冷了就不好吃了。”|刘姥姥正夸鸡蛋小巧，要往嘴里塞一个，凤姐笑道：“一两银子一个呢，你快尝尝吧，凉了就不好吃了。”
刘姥姥便伸箸子要夹，那里夹的起来，满碗里闹了一阵好的，|刘姥姥就伸筷子去夹，哪里夹得起来，在满碗里折腾了好一阵子，
好容易撮起一个来，才伸著脖子要吃，偏又滑下来滚在地下，|好不容易夹起一个来，刚伸着脖子要吃，偏偏又滑下来滚到了地上，
忙放下箸子要亲自去捡，早有地下的人捡了出去了。|她连忙放下筷子要亲自去捡，早有地上伺候的人捡出去了。
刘姥姥叹道：“一两银子，也没听见响声儿就没了。”|刘姥姥叹道：“一两银子，连个响声都没听见就没了。”
众人已没心吃饭，都看著他笑。|大家已经没心思吃饭了，都看着她笑。
! 刘姥姥把鸽子蛋当成鸡蛋，凤姐说“一两银子一个”。一两银子是什么概念？第三十九回刘姥姥说一顿螃蟹宴二十两“够我们庄家人过一年”，这一个蛋就是半个月的饭钱。
! “一两银子，也没听见响声儿就没了”，众人只当是笑话。可对刘姥姥来说，这是真心疼。她要亲自去捡，是穷人舍不得糟蹋东西的本能。

# 十五、换了筷子
贾母又说：“这会子又把那个筷子拿了出来，又不请客摆大筵席。都是凤丫头支使的，还不换了呢。”|贾母又说：“这会儿又把那双筷子拿出来，又不是请客摆大宴席。都是凤丫头指使的，还不快换了。”
地下的人原不曾预备这牙箸，本是凤姐和鸳鸯拿了来的，|地上伺候的人原本没预备这象牙筷子，本来是凤姐和鸳鸯拿来的，
听如此说，忙收了过去，也照样换上一双乌木镶银的。|听贾母这么说，连忙收了过去，也照样换上一双乌木镶银的。
刘姥姥道：“去了金的，又是银的，到底不及俺们那个伏手。”|刘姥姥说：“去了金的，又来了银的，到底不如我们那个顺手。”
凤姐儿道：“菜里若有毒，这银子下去了就试的出来。”|凤姐说：“菜里要是有毒，这银筷子一伸下去就能试出来。”
刘姥姥道：“这个菜里若有毒，俺们那菜都成了砒霜了。那怕毒死了也要吃尽了。”|刘姥姥说：“这个菜里要是有毒，那我们那里的菜就都成了砒霜了。就算毒死了，我也要吃干净。”
贾母见他如此有趣，吃的又香甜，把自己的也端过来与他吃。|贾母见她这么有趣，吃得又香，把自己的菜也端过来给她吃。
又命一个老嬷嬷来，将各样的菜给板儿夹在碗上。|又叫一个老嬷嬷来，把各样的菜都给板儿夹到碗里。
! 富贵人家怕人下毒，用银筷子试毒。刘姥姥一句“俺们那菜都成了砒霜了”，说的是笑话，也是实话：在穷人看来，富人的提防真是多余。
! 刘姥姥“那怕毒死了也要吃尽了”，她吃的是一辈子没吃过的东西。贾母看她吃得香，把自己的菜也给了她，贾母是真心怜贫。

# 十六、“礼出大家”
一时吃毕，贾母等都往探春卧室中去说闲话。|一会儿吃完了，贾母等人都到探春的卧室里去说闲话。
这里收拾过残桌，又放了一桌。|这边收拾了残席，又摆了一桌。
刘姥姥看著李纨与凤姐儿对坐著吃饭，叹道：“别的罢了，我只爱你们家这行事。怪道说‘礼出大家’。|刘姥姥看着李纨和凤姐面对面坐着吃饭，叹道：“别的也就罢了，我就喜欢你们家这样的做派。怪不得说‘礼出大家’。”
凤姐儿忙笑道：“你别多心，才刚不过大家取笑儿。”|凤姐连忙笑道：“你别多心，刚才不过是大家开开玩笑。”
一言未了，鸳鸯也进来笑道：“姥姥别恼，我给你老人家赔个不是。”|一句话还没说完，鸳鸯也进来笑道：“姥姥别生气，我给您老人家赔个不是。”
刘姥姥笑道：“姑娘说那里话，咱们哄著老太太开个心儿，可有什么恼的！|刘姥姥笑道：“姑娘说哪里话，咱们哄着老太太开开心，有什么好恼的！
你先嘱咐我，我就明白了，不过大家取个笑儿。我要心里恼，也就不说了。”|你先嘱咐我的时候，我就明白了，不过是大家取个乐。我要是心里恼了，也就不那么说了。”
! 媳妇们要等婆婆们吃完了才能吃。刘姥姥说“礼出大家”，是真心佩服，也是一句客气话。
! 凤姐和鸳鸯取笑完了，都来赔不是。刘姥姥说“你先嘱咐我，我就明白了”，原来她从头到尾都知道是怎么回事，是心甘情愿地扮小丑。
! “咱们哄著老太太开个心儿”，刘姥姥把自己和凤姐、鸳鸯算在一起，都是哄老太太开心的人。她是乡下人，却一点也不糊涂。

# 十七、鸳鸯分菜
鸳鸯便骂人“为什么不倒茶给姥姥吃。”|鸳鸯就骂下人：“为什么不倒茶给姥姥喝。”
刘姥姥忙道：“刚才那个嫂子倒了茶来，我吃过了。姑娘也该用饭了。”|刘姥姥连忙说：“刚才那位嫂子倒了茶来，我喝过了。姑娘也该吃饭了。”
凤姐儿便拉鸳鸯：“你坐下和我们吃了罢，省的回来又闹。”|凤姐就拉鸳鸯说：“你坐下和我们一起吃吧，省得回头又闹。”
鸳鸯便坐下了。|鸳鸯就坐下了。
婆子们添上碗箸来，三人吃毕。|婆子们添上碗筷来，三个人吃完了。
刘姥姥笑道：“我看你们这些人都只吃这一点儿就完了，亏你们也不饿。怪只道风儿都吹的倒。”|刘姥姥笑道：“我看你们这些人都只吃这么一点就完了，亏你们也不饿。怪不得风一吹就倒。”
鸳鸯便问：“今儿剩的菜不少，都那去了？”|鸳鸯就问：“今天剩的菜不少，都到哪里去了？”
婆子们道：“都还没散呢，在这里等著一齐散与他们吃。”|婆子们说：“都还没分呢，在这里等着一起分给她们吃。”
鸳鸯道：“他们吃不了这些，挑两碗给二奶奶屋里平丫头送去。”|鸳鸯说：“她们吃不了这么多，挑两碗给二奶奶屋里的平丫头送去。”
凤姐儿道：“他早吃了饭了，不用给他。”|凤姐说：“她早吃过饭了，不用给她。”
鸳鸯道：“他不吃了，喂你们的猫。”|鸳鸯说：“她不吃，就喂你们的猫。”
婆子听了，忙拣了两样拿盒子送去。|婆子听了，连忙挑了两样装在盒子里送去。
鸳鸯道：“素云那去了？”|鸳鸯说：“素云到哪里去了？”
李纨道：“他们都在这里一处吃，又找他作什么。”|李纨说：“她们都在这里一起吃，又找她做什么。”
鸳鸯道：“这就罢了。”|鸳鸯说：“那就算了。”
凤姐儿道：“袭人不在这里，你倒是叫人送两样给他去。”|凤姐说：“袭人不在这里，你倒是叫人送两样给她去。”
鸳鸯听说，便命人也送两样去后，鸳鸯又问婆子们：“回来吃酒的攒盒可装上了？”|鸳鸯听了，就叫人也送两样去，送走以后，鸳鸯又问婆子们：“回头喝酒用的攒盒装好了没有？”
婆子道：“想必还得一会子。”|婆子说：“想必还得等一会儿。”
鸳鸯道：“催著些儿。”婆子应喏了。|鸳鸯说：“催着点。”婆子答应了。
! 刘姥姥说她们吃得少，“风儿都吹的倒”。在乡下，饭量大才是福气；在贾府，吃得少才是体面。
! 鸳鸯分菜，平儿、素云、袭人一个都不落下。各房的大丫头之间互相照应，自有一套人情。
! “他不吃了，喂你们的猫”，鸳鸯和凤姐说话，也是这样没大没小。

# 十八、探春的屋子
凤姐儿等来至探春房中，只见他娘儿们正说笑。|凤姐等人来到探春房里，只见她们娘儿们正在说笑。
探春素喜阔朗，这三间屋子并不曾隔断。|探春一向喜欢宽敞明亮，这三间屋子并没有隔开。
当地放著一张花梨大理石大案，案上磊著各种名人法帖，并数十方宝砚，各色笔筒，笔海内插的笔如树林一般。|屋子中间放着一张花梨木镶大理石的大书案，案上堆着各种名人字帖，还有几十方好砚台、各色笔筒，大笔筒里插着的笔像树林一样。
那一边设著斗大的一个汝窑花囊，插著满满的一囊水晶球儿的白菊。|那一边摆着一个斗大的汝窑花瓶，插着满满一瓶水晶球似的白菊花。
西墙上当中挂著一大幅米襄阳《烟雨图》，左右挂著一副对联，乃是颜鲁公墨迹，其词云：|西墙正中挂着一大幅米芾的《烟雨图》，左右挂着一副对联，是颜真卿的真迹，写的是：
~烟霞闲骨格，泉石野生涯。|有烟霞一样闲散的风骨，过泉石之间山野的生活。
案上设著大鼎。|书案上摆着一只大鼎。
左边紫檀架上放著一个大观窑的大盘，盘内盛著数十个娇黄玲珑大佛手。|左边紫檀木架上放着一个大观窑的大盘子，盘里盛着几十个娇黄玲珑的大佛手。
右边洋漆架上悬著一个白玉比目磬，旁边挂著小锤。|右边洋漆架上挂着一个白玉比目鱼形的磬，旁边挂着一把小锤。
! 探春的屋子“不曾隔断”，大书案、大花瓶、大鼎、大盘，样样都大。这是探春的胸襟：开阔、大气，一点不像闺阁小姐，倒像个男子的书房。
! 米芾（米襄阳）和颜真卿（颜鲁公）都是宋代、唐代最有名的书画家。探春屋里挂的是真迹，可见她的品位。
! “烟霞闲骨格，泉石野生涯”，探春心里向往的是山野的自由。可她最后远嫁海外，一生都不得自由。

# 十九、板儿闹，刘姥姥打
那板儿略熟了些，便要摘那锤子要击，丫鬟们忙拦住他。|板儿稍微熟了些，就要摘那小锤子去敲磬，丫鬟们连忙拦住他。
他又要佛手吃，探春拣了一个与他说：“顽罢，吃不得的。”|他又要佛手吃，探春挑了一个给他，说：“拿着玩吧，不能吃的。”
东边便设著卧榻，拔步床上悬著葱绿双绣花卉草虫的纱帐。|东边设着卧榻，拔步床上挂着葱绿色、两面绣着花草虫子的纱帐。
板儿又跑过来看，说：“这是蝈蝈，这是蚂蚱。”|板儿又跑过来看，说：“这是蝈蝈，这是蚂蚱。”
刘姥姥忙打了他一巴掌，骂道：“下作黄子，没干没净的乱闹。倒叫你进来瞧瞧，就上脸了。”|刘姥姥连忙打了他一巴掌，骂道：“下流东西，不干不净地乱闹。叫你进来看看，你就得寸进尺了。”
打的板儿哭起来，众人忙劝解方罢。|打得板儿哭起来，大家连忙劝解才算了。
! 板儿认得帐子上的蝈蝈蚂蚱，这是他在乡下天天见的东西。他认得出的，偏偏是绣在帐子上的虫子。
! 刘姥姥打板儿，是怕孩子在贵人面前失了礼。她自己可以扮丑逗笑，却不许孩子乱动人家的东西。
! 探春给板儿的佛手，后来又被巧姐要了去，换了板儿手里的柚子。第四十一回巧姐（大姐儿）用柚子换走了板儿手里的佛手。脂批说这一换伏下了两人日后的姻缘。

# 二十、贾母听鼓乐
贾母因隔著纱窗往后院内看了一回，说道：“后廊檐下的梧桐也好了，就只细些。”|贾母隔着纱窗往后院看了一会儿，说：“后廊檐下的梧桐也长好了，就是细了些。”
正说话，忽一阵风过，隐隐听得鼓乐之声。|正说着话，忽然一阵风过，隐隐约约听见鼓乐声。
贾母问”是谁家娶亲呢？这里临街倒近。”|贾母问：“是谁家娶亲呢？这里离街倒近。”
王夫人等笑回道：“街上的那里听的见，这是咱们的那十几个女孩子们演习吹打呢。”|王夫人等人笑着回道：“街上的哪里听得见，这是咱们那十几个女孩子在练习吹打呢。”
贾母便笑道：“既是他们演，何不叫他们进来演习。他们也逛一逛，咱们可又乐了。”|贾母就笑道：“既然她们在练，何不叫她们进来练。她们也能逛一逛，咱们也能乐一乐。”
凤姐听说，忙命人出去叫来，又一面吩咐摆下条桌，铺上红毡子。|凤姐听了，连忙叫人出去叫来，又一边吩咐摆下长条桌，铺上红毡子。
贾母道：“就铺排在藕香榭的水亭子上，借著水音更好听。|贾母说：“就摆在藕香榭的水亭子上，借着水声更好听。
回来咱们就在缀锦阁底下吃酒，又宽阔，又听的近。”|回头咱们就在缀锦阁底下喝酒，又宽敞，又听得近。”
众人都说那里好。|大家都说那里好。
! 隔着水听音乐，水把声音传得又远又清亮。贾母最会享受，连听戏都要讲究水音。
! 贾母问“谁家娶亲”，一个无心的问句，在全书的结局里格外刺耳：宝玉娶亲那天，黛玉正在潇湘馆咽气。

# 二十一、贾母说“两个玉儿可恶”
贾母向薛姨妈笑道：“咱们走罢。他们姊妹们都不大喜欢人来坐著，怕脏了屋子。|贾母对薛姨妈笑道：“咱们走吧。她们姐妹们都不大喜欢人来坐着，怕弄脏了屋子。
咱们别没眼色，正经坐一回子船喝酒去。”|咱们别没眼色，正经坐一会儿船、喝酒去。”
说著大家起身便走。|说着大家起身就走。
探春笑道：“这是那里的话，求著老太太姨太太来坐坐还不能呢。”|探春笑道：“这是哪里的话，求着老太太、姨太太来坐坐还求不来呢。”
贾母笑道：“我的这三丫头却好，只有两个玉儿可恶。回来吃醉了，咱们偏往他们屋里闹去。”|贾母笑道：“我这个三丫头倒好，只有两个玉儿可恶。回头喝醉了，咱们偏要到他们屋里闹去。”
! “两个玉儿”是宝玉和黛玉。贾母说他们“可恶”，是爱极了的反话。在贾母心里，宝玉和黛玉总是并提的一对。
! 贾母一句话，把探春夸了，把宝黛也点了。她说“怕脏了屋子”，说的就是黛玉。黛玉有洁癖，下一回刘姥姥醉卧怡红院，宝玉的屋子真被“闹”了。

# 二十二、坐船游园
说著，众人都笑了，一齐出来。|说着，大家都笑了，一起出来。
走不多远，已到了荇叶渚。|走了没多远，已经到了荇叶渚。
那姑苏选来的几个驾娘早把两只棠木舫撑来，|那几个从苏州选来的撑船女工早把两只棠木小船撑来了，
众人扶了贾母，王夫人，薛姨妈，刘姥姥，鸳鸯，玉钏儿上了这一只，落后李纨也跟上去。|大家扶着贾母、王夫人、薛姨妈、刘姥姥、鸳鸯、玉钏儿上了这一只，后来李纨也跟着上去了。
凤姐儿也上去，立在舡头上，也要撑舡。|凤姐也上去了，站在船头上，也要撑船。
贾母在舱内道：“这不是顽的，虽不是河里，也有好深的。你快不给我进来。”|贾母在船舱里说：“这可不是玩的，虽然不是河，也深得很。你还不快给我进来。”
凤姐儿笑道：“怕什么！老祖宗只管放心。”说著便一篙点开。|凤姐笑道：“怕什么！老祖宗只管放心。”说着就一篙把船撑开了。
到了池当中，舡小人多，凤姐只觉乱晃，忙把篙子递与驾娘，方蹲下了。|到了池子中间，船小人多，凤姐只觉得船乱晃，连忙把篙子递给船娘，才蹲了下来。
然后迎春姊妹等并宝玉上了那只，随后跟来。|然后迎春姐妹们和宝玉上了另一只，随后跟来。
其馀老嬷嬷散众丫鬟俱沿河随行。|其余的老嬷嬷和丫鬟们都沿着河岸跟着走。
! 凤姐要逞能撑船，到了池中心就慌了。她平日事事要强，在水上也不肯示弱，可是船一晃，就露了怯。

# 二十三、“留得残荷听雨声”
宝玉道：“这些破荷叶可恨，怎么还不叫人来拔去。”|宝玉说：“这些破荷叶真讨厌，怎么还不叫人来拔掉。”
宝钗笑道：“今年这几日，何曾饶了这园子闲了，天天逛，那里还有叫人来收拾的工夫。”|宝钗笑道：“今年这些天，哪里让这园子闲过，天天有人逛，哪还有叫人来收拾的工夫。”
林黛玉道：“我最不喜欢李义山的诗，只喜他这一句：‘留得残荷听雨声’。|林黛玉说：“我最不喜欢李商隐的诗，只喜欢他这一句：‘留得残荷听雨声’。
偏你们又不留著残荷了。”|偏偏你们又不留着残荷。”
宝玉道：“果然好句，以后咱们就别叫人拔去了。”|宝玉说：“果然是好句子，以后咱们就别叫人拔了。”
说著已到了花溆的萝港之下，觉得阴森透骨，两滩上衰草残菱，更助秋情。|说着已经到了花溆的萝港底下，只觉得阴森森的寒气透骨，两边滩上衰草残菱，更添了秋天的凄凉。
! 李义山就是唐代诗人李商隐，原句是“留得枯荷听雨声”，黛玉记成了“残荷”。李商隐的诗多写愁苦，黛玉说“最不喜欢”，其实她和李商隐最像。
! 宝玉要拔残荷，黛玉要留残荷。宝玉只爱花开，黛玉偏爱花残。第三十一回说“黛玉喜散不喜聚”，这里又是一证。
! 黛玉一句话，宝玉立刻改口“别叫人拔去了”。黛玉喜欢的，就是宝玉喜欢的。

# 二十四、蘅芜苑雪洞一般
贾母因见岸上的清厦旷朗，便问：“这是你薛姑娘的屋子不是？”|贾母见岸上的房屋清爽宽敞，就问：“这是你们薛姑娘的屋子吧？”
众人道：“是。”|大家说：“是。”
贾母忙命拢岸，顺著云步石梯上去，一同进了蘅芜苑，只觉异香扑鼻。|贾母连忙叫船靠岸，顺着云形的石台阶上去，大家一起进了蘅芜苑，只觉得一股奇异的香气扑鼻而来。
那些奇草仙藤愈冷逾苍翠，都结了实，似珊瑚豆子一般，累垂可爱。|那些奇花异草越冷越苍翠，都结了果实，像珊瑚豆子一样，一串串垂着，非常可爱。
及进了房屋，雪洞一般，一色玩器全无，|等进了屋子，就像雪洞一样，一件玩物摆设都没有，
案上只有一个土定瓶中供著数枝菊花，并两部书，茶奁茶杯而已。|桌上只有一个土定窑的瓶子里插着几枝菊花，还有两部书、一套茶具而已。
床上只吊著青纱帐幔，衾褥也十分朴素。|床上只挂着青纱帐子，被褥也十分朴素。
! 探春的屋子是满，宝钗的屋子是空。“雪洞一般”，四个字写尽了宝钗的冷。
! 蘅芜苑的花草“愈冷逾苍翠”，越冷越绿，就像宝钗：天生冷静，不为外物所动。宝钗吃的冷香丸，住的雪洞屋，名字里有个“雪”（薛），她一生都离不开一个“冷”字。
! 宝钗后来嫁给宝玉，宝玉出家，她守着空房过了一生。这雪洞一样的屋子，就是她将来的样子。

# 二十五、贾母要替宝钗收拾
贾母叹道：“这孩子太老实了。你没有陈设，何妨和你姨娘要些。|贾母叹道：“这孩子太老实了。你没有陈设，何不跟你姨妈要些。
我也不理论，也没想到，你们的东西自然在家里没带了来。”|我也没留意，也没想到，你们的东西自然在家里，没带过来。”
说著，命鸳鸯去取些古董来，又嗔著凤姐儿：“不送些玩器来与你妹妹，这样小器。”|说着，叫鸳鸯去取些古董来，又责怪凤姐：“也不送些玩物摆设给你妹妹，这么小气。”
王夫人凤姐儿等都笑回说：“他自己不要的。我们原送了来，他都退回去了。”|王夫人、凤姐等人都笑着回说：“是她自己不要的。我们本来送来了，她都退回去了。”
薛姨妈也笑说：“他在家里也不大弄这些东西的。”|薛姨妈也笑道：“她在家里也不大弄这些东西。”
贾母摇头说：“使不得。虽然他省事，倘或来一个亲戚，看著不象，|贾母摇头说：“这不行。虽然她图省事，要是来一个亲戚，看着不像样子，
二则年轻的姑娘们，房里这样素净，也忌讳。|二来年轻姑娘的屋子这么素净，也犯忌讳。
我们这老婆子，越发该住马圈去了。|那我们这些老婆子，越发该去住马棚了。
你们听那些书上戏上说的小姐们的绣房，精致的还了得呢。|你们听那些书里戏里说的小姐绣房，精致得不得了。
他们姊妹们虽不敢比那些小姐们，也不要很离了格儿。|她们姐妹虽然不敢跟那些小姐比，也不能太不像样。
有现成的东西，为什么不摆？若很爱素净，少几样倒使得。|有现成的东西，为什么不摆？要是很喜欢素净，少摆几样倒也可以。
我最会收拾屋子的，如今老了，没有这些闲心了。|我最会收拾屋子了，如今老了，没有这份闲心了。
他们姊妹们也还学著收拾的好，只怕俗气，有好东西也摆坏了。我看他们还不俗。|她们姐妹们也该学着收拾才好，只怕俗气，有好东西也摆坏了。我看她们还不俗。
如今让我替你收拾，包管又大方又素净。|现在让我来替你收拾，保管又大方又素净。
我的梯己两件，收到如今，没给宝玉看见过，若经了他的眼，也没了。”|我的两件私房东西，收到现在，没让宝玉看见过，要是让他看见了，也就没了。”
说著叫过鸳鸯来，亲吩咐道：“你把那石头盆景儿和那架纱桌屏，还有个墨烟冻石鼎，|说着叫过鸳鸯来，亲自吩咐道：“你把那个石头盆景、那架纱桌屏，还有一个墨烟冻石鼎，
这三样摆在这案上就够了。再把那水墨字画白绫帐子拿来，把这帐子也换了。”|这三样摆在桌上就够了。再把那顶水墨字画的白绫帐子拿来，把这帐子也换了。”
鸳鸯答应著，笑道：“这些东西都搁在东楼上的不知那个箱子里，还得慢慢找去，明儿再拿去也罢了。”|鸳鸯答应着，笑道：“这些东西都放在东楼上不知道哪个箱子里，还得慢慢找，明天再拿去吧。”
贾母道：“明日后日都使得，只别忘了。”|贾母说：“明天后天都行，只是别忘了。”
说著，坐了一回方出来，一径来至缀锦阁下。|说着，坐了一会儿才出来，一直来到缀锦阁下。
! 贾母说年轻姑娘屋子太素净“忌讳”，素净是守寡、丧事的颜色。贾母看出来的，是一个不祥的兆头。
! 宝钗连王夫人、凤姐送的东西都退回去了。她“守拙”到了极点，不要一点多余的东西。有人说这是她的品格，有人说这是她的心机：越素净，越显得稳重。
! 贾母要拿出自己的私房来替宝钗布置，这是贾母对宝钗格外的疼爱。

# 二十六、缀锦阁设宴
文官等上来请过安，因问“演习何曲”。|文官等人上来请过安，问：“要练什么曲子？”
贾母道：“只拣你们生的演习几套罢。”|贾母说：“只挑你们还不熟的练几套吧。”
文官等下来，往藕香榭去不提。|文官等人退下，往藕香榭去了。
这里凤姐儿已带著人摆设整齐，上面左右两张榻，榻上都铺著锦裀蓉簟，|这边凤姐已经带着人摆好了，上面左右两张榻，榻上都铺着锦缎垫子和芙蓉竹席，
每一榻前有两张雕漆几，也有海棠式的，也有梅花式的，也有荷叶式的，也有葵花式的，也有方的，也有圆的，其式不一。|每张榻前有两张雕漆小几，有海棠形的，有梅花形的，有荷叶形的，有葵花形的，有方的，有圆的，样式各不相同。
一个上面放著炉瓶，一分攒盒，一个上面空设著，预备放人所喜食物。|一张上面放着香炉花瓶和一份攒盒，一张上面空着，预备放各人喜欢吃的东西。
上面二榻四几，是贾母薛姨妈，下面一椅两几，是王夫人的，馀者都是一椅一几。|上首两张榻、四张几，是贾母和薛姨妈的；下首一把椅子、两张几，是王夫人的；其余的都是一把椅子、一张几。
东边是刘姥姥，刘姥姥之下便是王夫人。|东边是刘姥姥，刘姥姥下首是王夫人。
西边便是史湘云，第二便是宝钗，第三便是黛玉，第四迎春，探春，惜春挨次下去，宝玉在末。|西边是史湘云，第二是宝钗，第三是黛玉，第四是迎春，探春、惜春依次排下去，宝玉在最后。
李纨凤姐二人之几设于三层槛内，二层纱厨之外。|李纨、凤姐两人的几设在第三层门槛里面、第二层纱橱外面。
攒盒式样，亦随几之式样。|攒盒的样式，也跟着几的样式。
每人一把乌银洋錾自斟壶，一个十锦珐琅杯。|每人一把乌银洋錾花的自斟壶、一个十锦珐琅杯。
! 刘姥姥的座位排在王夫人上首，是客人的位置。贾母给足了她面子，也是为了让大家看她取乐。
! 湘云是这次宴会的客人（还她的席），所以坐在西边第一位。宝玉在末，因为他是男孩子，又是晚辈。

# 二十七、鸳鸯行令
大家坐定，贾母先笑道：“咱们先吃两杯，今日也行一令才有意思。”|大家坐定，贾母先笑道：“咱们先喝两杯，今天也行个酒令才有意思。”
薛姨妈等笑道：“老太太自然有好酒令，我们如何会呢，安心要我们醉了。我们都多吃两杯就有了。”|薛姨妈等人笑道：“老太太自然有好酒令，我们哪里会呢，这是存心要把我们灌醉。我们都多喝两杯就是了。”
贾母笑道：“姨太太今儿也过谦起来，想是厌我老了。”|贾母笑道：“姨太太今天也太谦虚了，想必是嫌我老了。”
薛姨妈笑道：“不是谦，只怕行不上来倒是笑话了。”|薛姨妈笑道：“不是谦虚，只怕行不上来，倒成了笑话。”
王夫人忙笑道：“便说不上来，就便多吃一杯酒，醉了睡觉去，还有谁笑话咱们不成。”|王夫人连忙笑道：“就算说不上来，也就多喝一杯酒，醉了就去睡觉，还有谁会笑话咱们不成。”
薛姨妈点头笑道：“依令。老太太到底吃一杯令酒才是。”|薛姨妈点头笑道：“就依令。老太太到底该先喝一杯令酒才是。”
贾母笑道：“这个自然。”说著便吃了一杯。|贾母笑道：“这是自然。”说着就喝了一杯。
凤姐儿忙走至当地，笑道：“既行令，还叫鸳鸯姐姐来行更好。”|凤姐连忙走到屋子中间，笑道：“既然要行令，还是叫鸳鸯姐姐来当令官更好。”
众人都知贾母所行之令必得鸳鸯提著，故听了这话，都说“很是”。|大家都知道贾母行的令一定要鸳鸯来提词，所以听了这话，都说“很对”。
凤姐儿便拉了鸳鸯过来。|凤姐就把鸳鸯拉了过来。
王夫人笑道：“既在令内，没有站著的理。”|王夫人笑道：“既然在令里，没有站着的道理。”
回头命小丫头子：“端一张椅子，放在你二位奶奶的席上。”|回头吩咐小丫头：“端一张椅子，放在你们二位奶奶的席上。”
鸳鸯也半推半就，谢了坐，便坐下，也吃了一钟酒，笑道：|鸳鸯也半推半就，谢了座，就坐下了，也喝了一杯酒，笑道：
“酒令大如军令，不论尊卑，惟我是主。违了我的话，是要受罚的。”|“酒令大如军令，不论地位高低，只有我说了算。违了我的话，是要受罚的。”
王夫人等都笑道：“一定如此，快些说来。”|王夫人等人都笑道：“一定这样，快说吧。”
! 回目“金鸳鸯三宣牙牌令”。鸳鸯姓金，所以叫“金鸳鸯”。“酒令大如军令，不论尊卑，惟我是主”，一个丫头当了令官，连贾母都要听她的。这是鸳鸯一生最风光的时刻。
! 王夫人让鸳鸯坐下，鸳鸯坐的是凤姐、李纨的席。鸳鸯在贾府的地位，几乎和主子奶奶一样。

# 二十八、刘姥姥要逃席
鸳鸯未开口，刘姥姥便下了席，摆手道：“别这样捉弄人家，我家去了。”|鸳鸯还没开口，刘姥姥就下了席，摆着手说：“别这样捉弄人，我回家去了。”
众人都笑道：“这却使不得。”|大家都笑道：“这可不行。”
鸳鸯喝令小丫头子们：“拉上席去！”|鸳鸯喝令小丫头们：“把她拉上席去！”
小丫头子们也笑著，果然拉入席中。|小丫头们也笑着，果然把她拉回了席上。
刘姥姥只叫“饶了我罢！”|刘姥姥只是叫：“饶了我吧！”
鸳鸯道：“再多言的罚一壶。”|鸳鸯说：“再多说话的罚一壶。”
刘姥姥方住了声。|刘姥姥这才不说话了。
! 刘姥姥刚被捉弄过一回，一听要行令就想跑。她心里明白，接下来又要出丑了。

# 二十九、牙牌令规矩
鸳鸯道：“如今我说骨牌副儿，从老太太起，顺领说下去，至刘姥姥止。|鸳鸯说：“现在我说骨牌的牌副，从老太太开始，依次说下去，到刘姥姥为止。
比如我说一副儿，将这三张牌拆开，先说头一张，次说第二张，再说第三张，|比如我说一副牌，把这三张牌拆开，先说第一张，再说第二张，再说第三张，
说完了，合成这一副儿的名字。|说完了，再合成这一副牌的名字。
无论诗词歌赋，成语俗话，比上一句，都要叶韵。错了的罚一杯。”|不管是诗词歌赋还是成语俗话，对上一句，都要押韵。说错了的罚一杯。”
众人笑道：“这个令好，就说出来。”|大家笑道：“这个令好，快说吧。”
! 骨牌就是牙牌，像麻将的前身，一副三张，每张有不同的点数和名字。鸳鸯每说一张牌，行令的人就要接一句押韵的诗词俗语。
! 每个人接的句子，都暗合各人的性情和命运。下面的牙牌令，句句是谶语。

# 三十、贾母与薛姨妈的令
鸳鸯道：“有了一副了。左边是张‘天’。”|鸳鸯说：“有了一副了。左边是一张‘天’牌。”
贾母道：“头上有青天。”|贾母说：“头上有青天。”
众人道：“好。”|大家说：“好。”
鸳鸯道：“当中是个‘五与六’。”|鸳鸯说：“中间是一张‘五与六’。”
贾母道：“六桥梅花香彻骨。”|贾母说：“六桥梅花香彻骨。”（杭州西湖苏堤上有六座桥，梅花香透骨髓。）
鸳鸯道：“剩得一张‘六与幺’。”|鸳鸯说：“剩下一张‘六与幺’。”
贾母道：“一轮红日出云霄。”|贾母说：“一轮红日出云霄。”
鸳鸯道：“凑成便是个‘蓬头鬼’。”|鸳鸯说：“合起来就是一副‘蓬头鬼’。”
贾母道：“这鬼抱住锺馗腿。”|贾母说：“这鬼抱住钟馗腿。”
说完，大家笑说：“极妙。”贾母饮了一杯。|说完，大家笑着说：“妙极了。”贾母喝了一杯。
鸳鸯又道：“有了一副。左边是个‘大长五’。”|鸳鸯又说：“又有了一副。左边是一张‘大长五’。”
薛姨妈道：“梅花朵朵风前舞。”|薛姨妈说：“梅花朵朵风前舞。”
鸳鸯道：“右边还是个‘大五长’。”|鸳鸯说：“右边还是一张‘大五长’。”
薛姨妈道：“十月梅花岭上香。”|薛姨妈说：“十月梅花岭上香。”
鸳鸯道：“当中‘二五’是杂七。”|鸳鸯说：“中间一张‘二五’，是杂七。”
薛姨妈道：“织女牛郎会七夕。”|薛姨妈说：“织女牛郎会七夕。”
鸳鸯道：“凑成‘二郎游五岳’。”|鸳鸯说：“合起来是‘二郎游五岳’。”
薛姨妈道：“世人不及神仙乐。”|薛姨妈说：“世人不及神仙乐。”
说完，大家称赏，饮了酒。|说完，大家称赞，喝了酒。
! 贾母一开口“头上有青天”，气象最大，她是一家之主。“鬼抱住锺馗腿”，钟馗是捉鬼的，鬼却抱住他的腿，滑稽又俏皮，贾母也会开玩笑。
! 薛姨妈说了两句梅花、一句七夕，都是吉祥话，四平八稳，正像她的为人。

# 三十一、湘云与宝钗的令
鸳鸯又道：“有了一副。左边‘长幺’两点明。”|鸳鸯又说：“又有了一副。左边是‘长幺’，两点分明。”
湘云道：“双悬日月照乾坤。”|湘云说：“双悬日月照乾坤。”
鸳鸯道：“右边‘长幺’两点明。”|鸳鸯说：“右边也是‘长幺’，两点分明。”
湘云道：“闲花落地听无声。”|湘云说：“闲花落地听无声。”
鸳鸯道：“中间还得‘幺四’来。”|鸳鸯说：“中间还要一张‘幺四’。”
湘云道：“日边红杏倚云栽。”|湘云说：“日边红杏倚云栽。”
鸳鸯道：“凑成‘樱桃九熟’。”|鸳鸯说：“合起来是‘樱桃九熟’。”
湘云道：“御园却被鸟衔出。”|湘云说：“御园却被鸟衔出。”
说完饮了一杯。|说完喝了一杯。
鸳鸯道：“有了一副。左边是‘长三’。”|鸳鸯说：“有了一副。左边是‘长三’。”
宝钗道：“双双燕子语梁间。”|宝钗说：“双双燕子语梁间。”
鸳鸯道：“右边是‘三长’。”|鸳鸯说：“右边是‘三长’。”
宝钗道：“水荇牵风翠带长。”|宝钗说：“水荇牵风翠带长。”
鸳鸯道：“当中‘三六’九点在。”|鸳鸯说：“中间‘三六’，共九点。”
宝钗道：“三山半落青天外。”|宝钗说：“三山半落青天外。”
鸳鸯道：“凑成‘铁锁练孤舟’。”|鸳鸯说：“合起来是‘铁锁练孤舟’。”
宝钗道：“处处风波处处愁。”|宝钗说：“处处风波处处愁。”
说完饮毕。|说完喝完了。
! 湘云的令最有气势：“双悬日月照乾坤”。可“闲花落地听无声”，一朵花默默落下，没人听见，有人说这正是湘云的结局。
! 宝钗前面说“双双燕子语梁间”，是夫妻成双；最后却落在“铁锁练孤舟”“处处风波处处愁”。一只孤舟被铁锁锁住，四处都是风浪愁苦，这就是宝钗将来守着空房的一生。
! “御园却被鸟衔出”，皇家园子里的樱桃被鸟叼了出去。有人说这暗指湘云的婚姻或贾府的变故。

# 三十二、黛玉说出《西厢》《牡丹亭》
鸳鸯又道：“左边一个‘天’。”|鸳鸯又说：“左边一张‘天’牌。”
黛玉道：“良辰美景奈何天。”|黛玉说：“良辰美景奈何天。”
宝钗听了，回头看著他。|宝钗听了，回过头来看着她。
黛玉只顾怕罚，也不理论。|黛玉只顾着怕挨罚，也没在意。
鸳鸯道：“中间‘锦屏’颜色俏。”|鸳鸯说：“中间是‘锦屏’，颜色俏丽。”
黛玉道：“纱窗也没有红娘报。”|黛玉说：“纱窗也没有红娘报。”
鸳鸯道：“剩了‘二六’八点齐。”|鸳鸯说：“剩下‘二六’，八点整齐。”
黛玉道：“双瞻玉座引朝仪。”|黛玉说：“双瞻玉座引朝仪。”
鸳鸯道：“凑成‘篮子’好采花。”|鸳鸯说：“合起来是‘篮子’，好采花。”
黛玉道：“仙杖香挑芍药花。”|黛玉说：“仙杖香挑芍药花。”
说完，饮了一口。|说完，喝了一口。
! “良辰美景奈何天”是《牡丹亭》里杜丽娘的唱词，“纱窗也没有红娘报”化自《西厢记》。这两部书在当时被视为“淫词艳曲”，闺阁小姐是不该读的。
! 黛玉一时情急，把私下读过的禁书说了出来。宝钗立刻“回头看著他”，她听出来了。第四十二回宝钗就私下找黛玉谈这件事，黛玉羞得满脸通红，两人从此和好。
! “纱窗也没有红娘报”，没有红娘替她传信，黛玉没有人为她做主。这是她心里最深的悲哀。

# 三十三、故意说错
鸳鸯道：“左边‘四五’成花九。”|鸳鸯说：“左边‘四五’，合成花九。”
迎春道：“桃花带雨浓。”|迎春说：“桃花带雨浓。”
众人道：“该罚！错了韵，而且又不象。”|大家说：“该罚！押错了韵，而且又不像。”
迎春笑著饮了一口。|迎春笑着喝了一口。
原是凤姐儿和鸳鸯都要听刘姥姥的笑话，故意都令说错，都罚了。|原来是凤姐和鸳鸯都想听刘姥姥说笑话，故意叫大家都说错，都罚了。
至王夫人，鸳鸯代说了个，下便该刘姥姥。|到了王夫人，鸳鸯替她说了一个，下面就该刘姥姥了。
! 迎春说错了，罚酒。“桃花带雨”，桃花被雨打得零落，迎春后来嫁给孙绍祖，被虐待致死，不到一年就死了。她的令，也是一句谶语。
! 凤姐和鸳鸯故意让大家说错，好快点轮到刘姥姥。这场酒令，从头到尾都是为了取笑刘姥姥。

# 三十四、刘姥姥行令
刘姥姥道：“我们庄家人闲了，也常会几个人弄这个，但不如说的这么好听。少不得我也试一试。”|刘姥姥说：“我们庄稼人闲了，也常有几个人玩这个，只是说得没这么好听。少不得我也试一试。”
众人都笑道：“容易说的。你只管说，不相干。”|大家都笑道：“容易说的。你只管说，不要紧。”
鸳鸯笑道：“左边‘四四’是个人。”|鸳鸯笑道：“左边‘四四’，是个人。”
刘姥姥听了，想了半日，说道：“是个庄家人罢。”|刘姥姥听了，想了半天，说：“是个庄稼人吧。”
众人哄堂笑了。|大家哄堂大笑。
贾母笑道：“说的好，就是这样说。”|贾母笑道：“说得好，就这样说。”
刘姥姥也笑道：“我们庄家人，不过是现成的本色，众位别笑。”|刘姥姥也笑道：“我们庄稼人，不过是说些现成的本色话，各位别笑。”
鸳鸯道：“中间‘三四’绿配红。”|鸳鸯说：“中间‘三四’，绿配红。”
刘姥姥道：“大火烧了毛毛虫。”|刘姥姥说：“大火烧了毛毛虫。”
众人笑道：“这是有的，还说你的本色。”|大家笑道：“这倒是有的，还是说你的本色。”
鸳鸯道：“右边‘幺四’真好看。”|鸳鸯说：“右边‘幺四’，真好看。”
刘姥姥道：“一个萝卜一头蒜。”|刘姥姥说：“一个萝卜一头蒜。”
众人又笑了。|大家又笑了。
鸳鸯笑道：“凑成便是一枝花。”|鸳鸯笑道：“合起来就是一枝花。”
刘姥姥两只手比著，说道：“花儿落了结个大倭瓜。”|刘姥姥两只手比划着，说：“花儿落了结个大南瓜。”
众人大笑起来。|大家大笑起来。
只听外面乱嚷——且听下回分解。|只听外面一阵乱嚷——请看下回。
! 刘姥姥的令句句是庄稼地里的东西：庄家人、毛毛虫、萝卜、蒜、大倭瓜。众人笑她俗，可这些才是她一辈子的日子。
! “花儿落了结个大倭瓜”，是全回最好的一句。大观园里的女孩子们都在叹花落，只有刘姥姥说：花落了，就结果子。花落不是结束，是收成。
! 据巧姐的判词和脂批推测，贾府败落、凤姐死后，是刘姥姥救出了巧姐，带她回了乡下。贾府的“花”落了，最后结出的“果”，就在这个乡下老婆婆手里。

  {id:"ch35", n:"第三十五回", title:"白玉钏亲尝莲叶羹　黄金莺巧结梅花络"},
  {id:"ch36", n:"第三十六回", title:"绣鸳鸯梦兆绛芸轩　识分定情悟梨香院"},

  {id:"ch38", n:"第三十八回", title:"林潇湘魁夺菊花诗　薛蘅芜讽和螃蟹咏"},
  {id:"ch39", n:"第三十九回", title:"村老妪谎谈承色笑　痴情子实意觅踪迹"},
  {id:"ch40", n:"第四十回", title:"史太君两宴大观园　金鸳鸯三宣牙牌令"},
];
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

function parse(text){
  const secs=[]; let cur=null;
  for(const raw of text.split("\n")){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith("# ")){ cur={title:line.slice(2),pairs:[],notes:[]}; secs.push(cur); continue; }
    if(line.startsWith("! ")){ cur.notes.push(line.slice(2)); continue; }
    let poem=false, l=line;
    if(l.startsWith("~")){ poem=true; l=l.slice(1); }
    const i=l.indexOf("|");
    cur.pairs.push({yw:l.slice(0,i), bh:l.slice(i+1), poem});
  }
  return secs;
}

function render(id){
  const app=document.getElementById("app");
  const idx=CHAPTERS.findIndex(c=>c.id===id);
  const ch=CHAPTERS[idx];
  let h=`<div class="hero"><h1>${ch.n}</h1><div>${ch.title}</div><div class="sub">一句原文 · 一句白话 · 伏笔与深意</div></div>`;
  const src=document.getElementById(id);
  if(!src){
    h+=`<div class="soon">本回正在整理中，敬请期待。</div>`;
  } else {
    const secs=parse(src.textContent);
    h+=`<nav class="toc"><b>本回目录</b>`+secs.map((s,i)=>`<a href="#${id}-s${i}">${esc(s.title)}</a>`).join("")+`</nav>`;
    secs.forEach((s,i)=>{
      h+=`<section class="sec"><h2 id="${id}-s${i}">${esc(s.title)}</h2>`;
      for(const p of s.pairs){
        h+=`<div class="pair"><div class="yw${p.poem?" poem":""}">${esc(p.yw)}</div><div class="bh">${esc(p.bh)}</div></div>`;
      }
      if(s.notes.length){
        h+=`<div class="note"><h3>伏笔与深意</h3><ul>${s.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`;
      }
      h+=`</section>`;
    });
  }
  const prev=CHAPTERS[idx-1], next=CHAPTERS[idx+1];
  h+=`<div class="pager"><span>${prev?`<a href="#${prev.id}">← ${prev.n}</a>`:""}</span><span>${next?`<a href="#${next.id}">${next.n} →</a>`:""}</span></div>`;
  app.innerHTML=h;
  document.getElementById("chap").value=id;
}

function route(){
  const hash=location.hash.slice(1);
  const chId=(hash.match(/^ch\d+/)||[])[0];
  const id=CHAPTERS.some(c=>c.id===chId)?chId:"ch1";
  if(document.getElementById("app").dataset.ch!==id){
    render(id); document.getElementById("app").dataset.ch=id;
    if(!hash.includes("-s")) window.scrollTo(0,0);
  }
  if(hash.includes("-s")){ const el=document.getElementById(hash); if(el) el.scrollIntoView(); }
}

// controls
const sel=document.getElementById("chap");
sel.innerHTML=CHAPTERS.map(c=>`<option value="${c.id}">${c.n}${document.getElementById(c.id)?"":"（整理中）"}</option>`).join("");
sel.onchange=()=>{ location.hash=sel.value; };

function toggle(btn,cls,key){
  const apply=on=>{ document.body.classList.toggle(cls,!on); btn.classList.toggle("on",on); };
  let on=store.get(key,true); apply(on);
  btn.onclick=()=>{ on=!on; apply(on); store.set(key,on); };
}
toggle(document.getElementById("bBh"),"hide-bh","hlm-bh");
toggle(document.getElementById("bNote"),"hide-note","hlm-note");

let fs=store.get("hlm-fs",parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||18);
const setFs=v=>{ fs=Math.max(14,Math.min(26,v)); document.documentElement.style.setProperty("--fs",fs+"px"); store.set("hlm-fs",fs); };
if(store.get("hlm-fs",null)!==null) setFs(fs);
document.getElementById("bMinus").onclick=()=>setFs(fs-1);
document.getElementById("bPlus").onclick=()=>setFs(fs+1);

const bDark=document.getElementById("bDark");
const setDark=d=>{ document.body.classList.toggle("dark",d); bDark.textContent=d?"☀":"☾"; store.set("hlm-dark",d); };
setDark(store.get("hlm-dark",false));
bDark.onclick=()=>setDark(!document.body.classList.contains("dark"));

// tap to peek 白话 when hidden
document.getElementById("app").addEventListener("click",e=>{
  if(!document.body.classList.contains("hide-bh")) return;
  const p=e.target.closest(".pair"); if(p) p.classList.toggle("peek");
});

const toTop=document.getElementById("totop");
window.addEventListener("scroll",()=>{ toTop.style.display=window.scrollY>600?"block":"none"; });
toTop.onclick=()=>window.scrollTo(0,0);

window.addEventListener("hashchange",route);
route();
</script>
