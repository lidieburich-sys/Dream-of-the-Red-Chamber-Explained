<script type="text/plain" id="ch2">
# 一、开篇诗
诗云：|开篇有诗说：
~一局输赢料不真，香销茶尽尚逡巡。|一盘棋谁输谁赢，下的人自己看不清；香烧完了、茶喝尽了，还在那里犹犹豫豫。
~欲知目下兴衰兆，须问傍观冷眼人。|想知道眼下是兴是衰的兆头，得去问旁边冷眼看着的人。
! “冷眼人”就是这一回的冷子兴。他姓冷，是个做古董生意的局外人，所以看贾府看得清楚。
! 下棋的人看不清输赢，说的是贾府里的人：他们身在其中，不知道家已经在走下坡路了。

# 二、封肃被叫去
却说封肃因听见公差传唤，忙出来陪笑启问。|封肃听见衙役来传人，连忙出来陪着笑问是什么事。
那些人只嚷：“快请出甄爷来！”|那些人只是嚷：“快请甄老爷出来！”
封肃忙陪笑道：“小人姓封，并不姓甄。|封肃连忙陪笑说：“小人姓封，不姓甄。
只有当日小婿姓甄，今已出家一二年了，不知可是问他？”|只有我从前那个女婿姓甄，现在已经出家一两年了，不知道是不是问他？”
那些公人道：“我们也不知什么‘真’‘假’，因奉太爷之命来问，|那些衙役说：“我们也不管什么‘真’（甄）‘假’（贾），是奉了老爷的命令来问的。
他既是你女婿，便带了你去亲见太爷面禀，省得乱跑。”|他既然是你女婿，就带你去见老爷当面回话，省得我们到处乱跑。”
说著，不容封肃多言，大家推拥他去了。|说着，不容封肃多说，大家推推搡搡把他带走了。
封家人个个都惊慌，不知何兆。|封家的人个个惊慌，不知道是什么兆头。
! 衙役随口一句“什么‘真’‘假’”，正点着全书“甄（真）”“贾（假）”的谐音。

# 三、原来新太爷是贾雨村
那天约二更时，只见封肃方回来，欢天喜地。|那天大约二更的时候，封肃才回来，满脸欢喜。
众人忙问端的。|大家连忙问是怎么回事。
他乃说道：“原来本府新升的太爷姓贾名化，本贯胡州人氏，曾与女婿旧日相交。|他就说：“原来本府新上任的知府姓贾名化，是胡州人，从前和我女婿有交情。
方才在咱门前过去，因见娇杏那丫头买线，所以他只当女婿移住于此。|刚才从咱们门口经过，看见娇杏那丫头在买线，就以为女婿搬到这里来住了。
我一一将原故回明，那太爷倒伤感叹息了一回，又问外孙女儿，我说看灯丢了。|我把前前后后的事一一回明白了，那位老爷倒伤心叹息了一阵，又问起外孙女，我说看灯的时候丢了。
太爷说：‘不妨，我自使番役务必探访回来。’|老爷说：‘不要紧，我派衙役去，一定把她找回来。’
说了一回话，临走倒送了我二两银子。”|说了一会儿话，临走还送了我二两银子。”
甄家娘子听了，不免心中伤感。|甄家娘子（封氏）听了，免不了心里难过。
一宿无话。|一夜无话。
! 贾化就是贾雨村。“贾化”谐音“假话”，“胡州”谐音“胡诌”，作者在名字上就告诉读者：这个人说的都是假话。
! 雨村说“务必探访回来”，可英莲后来就在他审的案子里出现，他却装作不认识（第四回）。

# 四、雨村娶娇杏
至次日，早有雨村遣人送了两封银子，四匹锦缎，答谢甄家娘子，|第二天，雨村一早就派人送来两封银子、四匹锦缎，答谢甄家娘子，
又寄一封密书与封肃，转托问甄家娘子要那娇杏作二房。|又给封肃捎了一封密信，托他去向甄家娘子讨娇杏来做二房（妾）。
封肃喜的屁滚尿流，巴不得去奉承，便在女儿前一力撺掇成了，|封肃高兴得屁滚尿流，巴不得去巴结，就在女儿面前竭力撺掇，把事办成了，
乘夜只用一乘小轿，便把娇杏送进去了。|当夜只用一顶小轿，就把娇杏送了进去。
雨村欢喜，自不必说，乃封百金赠封肃，外谢甄家娘子许多物事，|雨村的高兴自然不用说，就封了一百两银子送给封肃，另外又送了甄家娘子许多东西，
令其好生养赡，以待寻访女儿下落。|叫封肃好好养着女儿，等着打听外孙女的下落。
封肃回家无话。|封肃回家，这里不多说。
! 第一回士隐资助雨村五十两银子进京赶考，雨村连谢都没好好谢。现在士隐出家了，雨村拿银子“答谢”，顺手就讨了甄家的丫鬟。
! 封肃“喜的屁滚尿流”，前面他嫌弃女婿，这会儿巴结新贵，势利得一览无余。

# 五、娇杏扶正
却说娇杏这丫鬟，便是那年回顾雨村者。|这个丫鬟娇杏，就是那年回头看了雨村两眼的那个。
因偶然一顾，便弄出这段事来，亦是自己意料不到之奇缘。|因为偶然回头看了一眼，就引出这段事来，也是她自己意想不到的奇缘。
谁想他命运两济，不承望自到雨村身边，只一年便生了一子，|谁想到她运气这样好，没想到自从到了雨村身边，才一年就生了个儿子，
又半载，雨村嫡妻忽染疾下世，雨村便将他扶侧作正室夫人了。|又过了半年，雨村的正妻忽然得病死了，雨村就把她从妾扶正，做了正室夫人。
正是：|正是：
~偶因一著错，便为人上人。|偶然一个“错”着，就成了人上人。
! 娇杏谐音“侥幸”。小姐英莲（应怜）被拐卖，丫鬟娇杏（侥幸）做了夫人，命运就是这样颠倒。
! “一著错”是双关：一是说她当年“错”回头看了雨村；二是说雨村当年误以为她对自己有意（第一回），这一“错”反倒成全了她。

# 六、雨村做官又被革职
原来，雨村因那年士隐赠银之后，他于十六日便起身入都，|原来，那年士隐送了银子以后，雨村十六日就动身进京了，
至大比之期，不料他十分得意，已会了进士，选入外班，今已升了本府知府。|到了科举考试的时候，没想到他考得十分顺利，中了进士，被派到地方上做官，现在已经升为本府知府了。
虽才干优长，未免有些贪酷之弊，且又恃才侮上，那些官员皆侧目而视。|他虽然很有才干，却难免有些贪婪酷虐的毛病，又仗着有才看不起上司，那些官员都对他侧目而视。
不上一年，便被上司寻了个空隙，作成一本，|不到一年，就被上司找了个把柄，写了一道奏本，
参他“生情狡猾，擅纂礼仪，且沽清正之名，而暗结虎狼之属，致使地方多事，民命不堪”等语。|弹劾他“性情狡猾，擅自篡改礼仪，表面上沽名钓誉装清廉，暗地里勾结凶恶之徒，弄得地方上事端不断，百姓苦不堪言”等等。
龙颜大怒，即批革职。|皇上大怒，当即批示革职。
该部文书一到，本府官员无不喜悦。|吏部的公文一到，本府的官员没有一个不高兴的。
那雨村心中虽十分惭恨，却面上全无一点怨色，仍是嘻笑自若，|雨村心里虽然又羞又恨，脸上却一点怨气也没有，照样嘻嘻哈哈、若无其事，
交代过公事，将历年做官积的些资本并家小人属送至原籍，安排妥协，却是自己担风袖月，游览天下胜迹。|交代完公事，把这些年做官攒下的钱和家眷送回老家，安排妥当，自己却两袖清风，去游览天下名胜了。
! 雨村才中进士就“贪酷”，又“恃才侮上”。作者一笔就写出这个人：有才，但没有德。
! 被革职还能“嘻笑自若”，这份城府，正是他后来在官场上爬得高、也跌得重的本钱。

# 七、林如海和林黛玉
那日，偶又游至维扬地面，因闻得今岁鹾政点的是林如海。|这一天，他偶然游到了扬州，听说今年的盐政官派的是林如海。
这林如海姓林名海，表字如海，乃是前科的探花，今已升至兰台寺大夫，本贯姑苏人氏，|这林如海姓林名海，字如海，是上一科的探花，现在已经升为兰台寺大夫，籍贯是苏州，
今钦点出为巡盐御史，到任方一月有馀。|现在被皇上钦点出京做巡盐御史，到任才一个多月。
原来这林如海之祖，曾袭过列侯，今到如海，业经五世。|原来林如海的祖上袭过侯爵，到林如海已经是第五代了。
起初时，只封袭三世，因当今隆恩盛德，远迈前代，额外加恩，至如海之父，又袭了一代；|起初只允许承袭三代，因为当今皇上恩德深厚，远超前代，额外开恩，到林如海的父亲又袭了一代；
至如海，便从科第出身。|到了林如海，就靠科举考试出身了。
虽系钟鼎之家，却亦是书香之族。|林家虽然是世代富贵的人家，却也是读书的书香门第。
只可惜这林家支庶不盛，子孙有限，虽有几门，却与如海俱是堂族而已，没甚亲支嫡派的。|只可惜林家人丁不旺，子孙很少，虽然还有几支，都只是林如海的远房同族，没有什么亲近的嫡系。
今如海年已四十，只有一个三岁之子，偏又于去岁死了。|林如海今年已经四十岁，只有一个三岁的儿子，偏偏去年又死了。
虽有几房姬妾，奈他命中无子，亦无可如何之事。|虽然有几房妾，可他命中没有儿子，也没有办法。
今只有嫡妻贾氏，生得一女，乳名黛玉，年方五岁。|现在只有正妻贾氏生的一个女儿，小名叫黛玉，才五岁。
夫妻无子，故爱如珍宝，且又见他聪明清秀，便也欲使他读书识得几个字，|夫妻俩没有儿子，所以把她当成珍宝一样疼爱，又见她聪明清秀，就也想让她读书认几个字，
不过假充养子之意，聊解膝下荒凉之叹。|不过是把她当儿子养的意思，聊以排解膝下冷清的感叹。
! 林黛玉在这里第一次出场：五岁，聪明清秀，身子弱，是林家唯一的孩子。
! 巡盐御史管的是盐税，是最肥的差事之一。曹雪芹的祖父曹寅就做过巡盐御史，林如海身上有曹家的影子。
! 林家“支庶不盛”，林如海一死，黛玉就无家可归了。

# 八、雨村做了黛玉的老师
雨村正值偶感风寒，病在旅店，将一月光景方渐愈。|雨村正赶上受了风寒，病在旅店里，将近一个月才慢慢好起来。
一因身体劳倦，二因盘费不继，也正欲寻个合式之处，暂且歇下。|一来身体疲惫，二来路费接不上，也正想找个合适的地方暂时歇脚。
幸有两个旧友，亦在此境居住，因闻得盐政欲聘一西宾，雨村便相托友力，谋了进去，且作安身之计。|幸好有两个老朋友也住在这里，听说盐政大人要请一位家庭教师，雨村就托朋友帮忙谋得了这个差事，暂且作为安身之计。
妙在只一个女学生，并两个伴读丫鬟，这女学生年又小，身体又极怯弱，工课不限多寡，故十分省力。|妙在只有一个女学生和两个陪读的丫鬟，这女学生年纪又小，身体又很弱，功课不限多少，所以十分省力。
堪堪又是一载的光阴，谁知女学生之母贾氏夫人一疾而终。|眼看又过了一年，谁知女学生的母亲贾氏夫人得病去世了。
女学生侍汤奉药，守丧尽哀，遂又将辞馆别图。|女学生侍奉汤药，守丧时尽心哀痛，雨村就又打算辞去这个差事另谋出路。
林如海意欲令女守制读书，故又将他留下。|林如海想让女儿在守丧期间继续读书，所以又把他留下了。
近因女学生哀痛过伤，本自怯弱多病的，触犯旧症，遂连日不曾上学。|最近女学生因为哀痛过度，本来就体弱多病，旧病又发作了，所以接连几天没上学。
雨村闲居无聊，每当风日晴和，饭后便出来闲步。|雨村闲着无聊，每逢天气晴和，吃了饭就出来散步。
! 这就是回目上半句“贾夫人仙逝扬州城”。贾夫人就是贾敏，贾母的女儿、黛玉的母亲，作者只用了一句话交代她的死。
! 黛玉“侍汤奉药，守丧尽哀”，五六岁就失去了母亲。她的多病、多愁，从这里开始。

# 九、智通寺
这日，偶至郭外，意欲赏鉴那村野风光。|这一天，他偶然走到城外，想欣赏一下乡野风光。
忽信步至一山环水旋，茂林深竹之处，隐隐的有座庙宇，|随便走着，来到一个山环水绕、树林茂密、竹子深深的地方，隐隐约约有一座庙，
门巷倾颓，墙垣朽败，门前有额，题著“智通寺”三字，|门和巷子都倒塌了，墙也朽坏了，门前有一块匾，写着“智通寺”三个字，
门旁又有一副旧破的对联，云：“身后有馀忘缩手，眼前无路想回头。”|门旁边还有一副破旧的对联，写着：“身后有馀忘缩手，眼前无路想回头。”
雨村看了，因想到：“这两句话，文虽浅近，其意则深。|雨村看了，心想：“这两句话，文字虽然浅显，意思却很深。
我也曾游过些名山大刹，倒不曾见过这话头，|我也游过一些名山大寺，倒没见过这样的话，
其中想必有个翻过筋斗来的亦未可知，何不进去试试。”|里面想必有个经历过大起大落、看破世事的人，何不进去看看。”
想著走入，只有一个龙钟老僧在那里煮粥。|想着走了进去，只有一个老态龙钟的和尚在那里煮粥。
雨村见了，便不在意。|雨村见了，也就不在意了。
及至问他两句话，那老僧既聋且昏，齿落舌钝，所答非所问。|等到问他两句话，那老和尚又聋又糊涂，牙齿掉光、舌头不灵，答非所问。
! 对联的意思是：钱财权势积攒了很多，还不知道收手；等到走投无路了，才想回头。这正是贾府的写照，也是雨村自己的写照。
! “智通”，可里面只有一个又聋又昏的老和尚。雨村是聪明人，这次却“不在意”，他就是那个“忘缩手”的人。脂批说这老僧是“点醒”雨村的，可他没醒。

# 十、偶遇冷子兴
雨村不耐烦，便仍出来，意欲到那村肆中沽饮三杯，以助野趣，于是款步行来。|雨村不耐烦了，就又走出来，想到村里的小酒馆喝几杯，助助野游的兴致，于是慢慢走过去。
将入肆门，只见座上吃酒之客有一人起身大笑，接了出来，口内说：“奇遇，奇遇。”|刚要进酒馆的门，只见座上喝酒的客人里有一个人站起来大笑，迎了出来，嘴里说：“奇遇，奇遇。”
雨村忙看时，此人是都中在古董行中贸易的号冷子兴者，旧日在都相识。|雨村连忙一看，这人是在京城做古董生意的，名叫冷子兴，是以前在京城认识的。
雨村最赞这冷子兴是个有作为大本领的人，这子兴又借雨村斯文之名，故二人说话投机，最相契合。|雨村最称赞这冷子兴是个有作为、有本事的人，冷子兴又想借雨村读书人的名声，所以两人说话投机，最合得来。
雨村忙笑问道：“老兄何日到此？弟竟不知。今日偶遇，真奇缘也。”|雨村连忙笑着问：“老兄什么时候到这里的？我竟然不知道。今天偶然相遇，真是奇缘。”
子兴道：“去年岁底到家，今因还要入都，从此顺路找个敝友说一句话，|冷子兴说：“去年年底回的家，现在因为还要进京，顺路来找个朋友说句话，
承他之情，留我多住两日。我也无紧事，且盘桓两日，待月半时也就起身了。|承他的情，留我多住两天。我也没什么要紧事，就多待两天，到月中也就动身了。
今日敝友有事，我因闲步至此，且歇歇脚，不期这样巧遇！”|今天朋友有事，我随便走到这里，歇歇脚，没想到这么巧碰上了！”
一面说，一面让雨村同席坐了，另整上酒肴来。|一边说，一边请雨村同桌坐下，另外叫了酒菜来。
二人闲谈漫饮，叙些别后之事。|两人一边闲聊一边慢慢喝酒，说些分别以后的事。
! 一个想借对方的“斯文之名”，一个看重对方“有作为”，两人的交情是互相利用。冷子兴是周瑞家的女婿（第七回提到），所以他对贾府的事知道得这么清楚。

# 十一、“贵同宗家”
雨村因问：“近日都中可有新闻没有？”|雨村就问：“最近京城里有什么新闻没有？”
子兴道：“倒没有什么新闻，倒是老先生你贵同宗家，出了一件小小的异事。”|冷子兴说：“倒没什么新闻，倒是您老先生的本家，出了一件小小的奇事。”
雨村笑道：“弟族中无人在都，何谈及此？”|雨村笑道：“我族里没有人在京城，怎么说起这个？”
子兴笑道：“你们同姓，岂非同宗一族？”|冷子兴笑道：“你们同姓，难道不是同宗一族？”
雨村问是谁家。|雨村问是哪一家。
子兴道：“荣国府贾府中，可也玷辱了先生的门楣么？”|冷子兴说：“荣国府的贾家，总不会辱没了先生您的门第吧？”
雨村笑道：“原来是他家。|雨村笑道：“原来是他家。
若论起来，寒族人丁却不少，自东汉贾复以来，支派繁盛，各省皆有，谁逐细考查得来？|要说起来，我们贾家人丁倒是不少，从东汉的贾复以来，支派繁多，各省都有，谁能一一考查得清楚？
若论荣国一支，却是同谱。|要说荣国府这一支，倒是在同一本族谱上的。
但他那等荣耀，我们不便去攀扯，至今故越发生疏难认了。”|只是他家那样显赫，我们不便去攀附，所以到现在越来越生疏，难以相认了。”
! 雨村嘴上说“不便去攀扯”，第三回他就靠林如海的推荐信攀上了贾政，第四回又为了巴结贾家乱判了薛蟠的案子。这番话说得清高，做的却是另一回事。

# 十二、“外面的架子虽未甚倒，内囊却也尽上来了”
子兴叹道：“老先生休如此说。如今的这宁荣两门，也都萧疏了，不比先时的光景。”|冷子兴叹道：“老先生别这么说。如今这宁荣两府，也都冷落了，比不上从前的光景了。”
雨村道：“当日宁荣两宅的人口也极多，如何就萧疏了？”|雨村说：“当年宁荣两府的人口也极多，怎么就冷落了？”
冷子兴道：“正是，说来也话长。”|冷子兴说：“正是，说起来话就长了。”
雨村道：“去岁我到金陵地界，因欲游览六朝遗迹，那日进了石头城，从他老宅门前经过。|雨村说：“去年我到金陵一带，想游览六朝的古迹，那天进了石头城，从他家老宅门前经过。
街东是宁国府，街西是荣国府，二宅相连，竟将大半条街占了。|街东是宁国府，街西是荣国府，两座宅子连在一起，竟然占了大半条街。
大门前虽冷落无人，隔著围墙一望，里面厅殿楼阁，也还都峥嵘轩峻，|大门前虽然冷冷清清没有人，隔着围墙往里一看，里面的厅堂楼阁，也还都高大气派，
就是后一带花园子里面树木山石，也还都有蓊蔚洇润之气，那里象个衰败之家？”|就是后面那一带花园里的树木山石，也还都郁郁葱葱、滋润有生气，哪里像个衰败的人家？”
冷子兴笑道：“亏你是进士出身，原来不通！|冷子兴笑道：“亏你还是进士出身，原来这么不明白！
古人有云：‘百足之虫，死而不僵。’|古人说：‘百足之虫，死而不僵。’
如今虽说不及先年那样兴盛，较之平常仕宦之家，到底气象不同。|现在虽说不如从前那样兴盛，比起一般的官宦人家，到底气象不一样。
如今生齿日繁，事务日盛，主仆上下，安富尊荣者尽多，运筹谋画者无一，|如今人口一天比一天多，事情一天比一天繁杂，主子仆人上上下下，只知道享福摆阔的多得很，能出主意、会筹划的一个也没有；
其日用排场费用，又不能将就省俭，|他们日常的排场开销，又不肯将就节省，
如今外面的架子虽未甚倒，内囊却也尽上来了。|如今外面的架子虽然还没怎么倒，口袋里的钱却已经快掏空了。
这还是小事。|这还是小事。
更有一件大事：谁知这样钟鸣鼎食之家，翰墨诗书之族，如今的儿孙，竟一代不如一代了！”|还有一件大事：谁知这样富贵显赫、世代读书的人家，现在的儿孙竟然一代不如一代了！”
雨村听说，也纳罕道：“这样诗礼之家，岂有不善教育之理？|雨村听了，也奇怪地说：“这样讲诗书礼仪的人家，哪有不会教育子孙的道理？
别门不知，只说这宁、荣二宅，是最教子有方的。”|别家不知道，单说这宁荣二府，是最会教育子孙的。”
! “百足之虫，死而不僵”：百足虫（马陆）死了身子还不倒。贾府已经从里面坏了，外面还撑着架子。
! 冷子兴说了贾府的两种病：一是钱，“安富尊荣者尽多，运筹谋画者无一”；二是人，“一代不如一代”。这两句话，是读懂全书的钥匙。
! 秦可卿托梦（第十三回）、探春理家（第五十五回），都是想治这两种病，可都没治好。

# 十三、宁国府一支
子兴叹道：“正说的是这两门呢。待我告诉你：|冷子兴叹道：“我说的正是这两家。等我告诉你：
当日宁国公与荣国公是一母同胞弟兄两个。|当年宁国公和荣国公是同一个母亲生的亲兄弟。
宁公居长，生了四个儿子。|宁国公是哥哥，生了四个儿子。
宁公死后，贾代化袭了官，也养了两个儿子：长名贾敷，至八九岁上便死了，只剩了次子贾敬袭了官，|宁国公死后，贾代化承袭了官职，也生了两个儿子：大的叫贾敷，八九岁就死了，只剩下二儿子贾敬承袭了官职。
如今一味好道，只爱烧丹炼汞，馀者一概不在心上。|贾敬现在一心修道，只爱烧丹炼汞，别的事一概不放在心上。
幸而早年留下一子，名唤贾珍，因他父亲一心想作神仙，把官倒让他袭了。|幸好他早年留下一个儿子，叫贾珍，因为他父亲一心想当神仙，就把官职让给他承袭了。
他父亲又不肯回原籍来，只在都中城外和道士们胡羼。|他父亲又不肯回老家，只在京城城外和道士们混在一起。
这位珍爷倒生了一个儿子，今年才十六岁，名叫贾蓉。|这位珍大爷倒生了一个儿子，今年才十六岁，叫贾蓉。
如今敬老爹一概不管。|现在敬老爷什么都不管。
这珍爷那里肯读书，只一味高乐不了，把宁国府竟翻了过来，也没有人敢来管他。|这珍大爷哪里肯读书，只知道一味寻欢作乐，把宁国府闹得天翻地覆，也没有人敢管他。
! 宁府四代：宁国公（开国功臣）→贾代化→贾敬（修道不管家）→贾珍（只知享乐）→贾蓉。一代不如一代，这里看得最清楚。
! 贾珍“把宁国府竟翻了过来”，第七回焦大骂的“爬灰的爬灰”，第十三回秦可卿之死，都是这“翻过来”的结果。

# 十四、荣国府一支
再说荣府你听，方才所说异事，就出在这里。|再说荣国府，你听着，刚才说的奇事，就出在这里。
自荣公死后，长子贾代善袭了官，娶的也是金陵世勋史侯家的小姐为妻，生了两个儿子：长子贾赦，次子贾政。|荣国公死后，大儿子贾代善承袭了官职，娶的是金陵世代功臣史侯家的小姐，生了两个儿子：大儿子贾赦，二儿子贾政。
如今代善早已去世，太夫人尚在，长子贾赦袭著官，|现在贾代善早就去世了，老太太还健在，大儿子贾赦承袭着官职；
次子贾政，自幼酷喜读书，祖父最疼，原欲以科甲出身的，|二儿子贾政，从小特别爱读书，祖父最疼他，本来打算靠科举考试出身的，
不料代善临终时遗本一上，皇上因恤先臣，即时令长子袭官外，问还有几子，立刻引见，|没想到贾代善临终时递上遗本，皇上体恤老臣，当即让大儿子承袭官职之外，又问还有几个儿子，马上召见，
遂额外赐了这政老爹一个主事之衔，令其入部习学，如今现已升了员外郎了。|就额外赏了这位政老爷一个主事的官衔，让他到部里学习办事，现在已经升为员外郎了。
这政老爹的夫人王氏，头胎生的公子，名唤贾珠，十四岁进学，不到二十岁就娶了妻生了子，一病死了。|这位政老爷的夫人王氏，第一胎生的公子叫贾珠，十四岁就考中了秀才，不到二十岁就娶了妻、生了儿子，却一病死了。
第二胎生了一位小姐，生在大年初一，这就奇了，|第二胎生了一位小姐，生在大年初一，这就够奇怪了；
不想后来又生一位公子，说来更奇，一落胎胞，嘴里便衔下一块五彩晶莹的玉来，|没想到后来又生了一位公子，说起来更奇，一生下来，嘴里就衔着一块五彩晶莹的玉，
上面还有许多字迹，就取名叫作宝玉。|上面还有许多字迹，就给他取名叫宝玉。
你道是新奇异事不是？”|你说这是不是新奇的怪事？”
! “太夫人尚在”就是贾母，史家的小姐，史湘云是她的侄孙女。
! 贾政想考科举，最后是靠皇恩得了官，他自己并没有考中。所以他把科举的希望全寄托在儿子身上，对宝玉格外严厉。
! 贾珠死了，留下妻子李纨和儿子贾兰。大年初一生的小姐就是元春。

# 十五、抓周
雨村笑道：“果然奇异。只怕这人来历不小。”|雨村笑道：“果然奇怪。只怕这个人的来历不小。”
子兴冷笑道：“万人皆如此说，因而乃祖母便先爱如珍宝。|冷子兴冷笑道：“人人都这么说，所以他祖母先就把他当成珍宝一样疼爱。
那年周岁时，政老爹便要试他将来的志向，便将那世上所有之物摆了无数，与他抓取。|那年他满周岁时，政老爷要试试他将来的志向，就把世上各种各样的东西摆了许多，让他去抓。
谁知他一概不取，伸手只把些脂粉钗环抓来。|谁知他别的一概不拿，伸手只抓了些胭脂、香粉、钗环之类的东西。
政老爹便大怒了，说：“‘将来酒色之徒耳！’|政老爷就大怒了，说：‘将来不过是个贪酒好色的人罢了！’
因此便大不喜悦。|因此就很不喜欢他。
独那史老太君还是命根一样。|只有那位史老太君还是把他当命根子一样。
! “抓周”是旧俗：孩子满一岁时，摆上书、笔、算盘、刀剑、脂粉等东西，看他抓什么，来预测他将来的志向。
! 宝玉只抓脂粉钗环，贾政从此就“大不喜悦”。父子之间的隔阂，从宝玉一岁就开始了。

# 十六、“女儿是水作的骨肉”
说来又奇，如今长了七八岁，虽然淘气异常，但其聪明乖觉处，百个不及他一个。|说来又奇怪，他现在长到七八岁，虽然非常淘气，可聪明伶俐的地方，一百个孩子也比不上他一个。
说起孩子话来也奇怪，他说：|说起孩子话来也很奇怪，他说：
‘女儿是水作的骨肉，男人是泥作的骨肉。|‘女孩儿是水做的骨肉，男人是泥做的骨肉。
我见了女儿，我便清爽，见了男子，便觉浊臭逼人。’|我见了女孩儿，就觉得清爽；见了男人，就觉得一股浊臭扑鼻。’
你道好笑不好笑？将来色鬼无疑了！”|你说好笑不好笑？将来肯定是个色鬼！”
! 这是宝玉最有名的一句话。在宝玉眼里，女孩子纯洁清净，男人追名逐利、浑浊不堪。这不是好色，是他对世俗的反叛。
! 冷子兴说他“色鬼无疑”，代表了世俗的看法。下面雨村要反驳他。

# 十七、雨村说“正邪两赋”
雨村罕然厉色忙止道：“非也！可惜你们不知道这人来历。|雨村少有地板起脸，连忙制止他说：“不对！可惜你们不知道这个人的来历。
大约政老前辈也错以淫魔色鬼看待了。|大概政老前辈也错把他当成淫魔色鬼看待了。
若非多读书识事，加以致知格物之功，悟道参玄之力，不能知也。”|要不是多读书、多见识，再加上探究事理的功夫、参悟玄理的能力，是不能明白的。”
子兴见他说得这样重大，忙请教其端。|冷子兴见他说得这样严重，连忙请教其中的道理。
雨村道：“天地生人，除大仁大恶两种，馀者皆无大异。|雨村说：“天地生人，除了大仁和大恶两种，其余的都没有多大差别。
若大仁者，则应运而生，大恶者，则应劫而生。|大仁的人，顺应好运而生；大恶的人，顺应劫数而生。
运生世治，劫生世危。|顺应好运而生的，世道就太平；顺应劫数而生的，世道就危乱。
尧，舜，禹，汤，文，武，周，召，孔，孟，董，韩，周，程，张，朱，皆应运而生者。|尧、舜、禹、汤、周文王、周武王、周公、召公、孔子、孟子、董仲舒、韩愈、周敦颐、程颢程颐、张载、朱熹，都是顺应好运而生的。
蚩尤，共工，桀，纣，始皇，王莽，曹操，桓温，安禄山，秦桧等，皆应劫而生者。|蚩尤、共工、夏桀、商纣、秦始皇、王莽、曹操、桓温、安禄山、秦桧等人，都是顺应劫数而生的。
大仁者，修治天下，大恶者，挠乱天下。|大仁的人治理天下，大恶的人扰乱天下。
清明灵秀，天地之正气，仁者之所秉也，|清明灵秀，是天地的正气，是仁人所禀受的；
残忍乖僻，天地之邪气，恶者之所秉也。|残忍乖僻，是天地的邪气，是恶人所禀受的。
今当运隆祚永之朝，太平无为之世，清明灵秀之气所秉者，上至朝廷，下及草野，比比皆是。|现在正是国运昌盛长久的朝代、太平无事的时代，禀受清明灵秀之气的人，上到朝廷，下到民间，到处都是。
所馀之秀气，漫无所归，遂为甘露，为和风，洽然溉及四海。|剩下的灵秀之气，没有地方去，就化成了甘露、化成了和风，滋润着四海。
彼残忍乖僻之邪气，不能荡溢于光天化日之中，遂凝结充塞于深沟大壑之内，|那残忍乖僻的邪气，不能在光天化日之下散开，就凝结堵塞在深沟大谷里，
偶因风荡，或被云催，略有摇动感发之意，一丝半缕误而泄出者，|偶然被风一吹、被云一催，稍微有些摇动发散，有一丝半缕不小心泄露出来，
偶值灵秀之气适过，正不容邪，邪复妒正，两不相下，|正好碰上灵秀之气经过，正气容不下邪气，邪气又嫉妒正气，两不相让，
亦如风水雷电，地中既遇，既不能消，又不能让，必至搏击掀发后始尽。|就像风、水、雷、电在地底相遇，既不能消散，又不能退让，一定要互相搏击爆发以后才能消尽。
故其气亦必赋人，发泄一尽始散。|所以这股气也一定要附在人身上，发泄完了才散去。
使男女偶秉此气而生者，在上则不能成仁人君子，下亦不能为大凶大恶。|让偶然禀受这股气出生的男女，往上成不了仁人君子，往下也做不了大奸大恶。
置之于万万人中，其聪俊灵秀之气，则在万万人之上，|把他们放在千千万万人里，他们的聪明灵秀，在千万人之上；
其乖僻邪谬不近人情之态，又在万万人之下。|他们的乖张古怪、不近人情，又在千万人之下。
若生于公侯富贵之家，则为情痴情种，|要是生在公侯富贵人家，就成了情痴情种；
若生于诗书清贫之族，则为逸士高人，|要是生在清贫的读书人家，就成了隐士高人；
纵再偶生于薄祚寒门，断不能为走卒健仆，甘遭庸人驱制驾驭，必为奇优名倡。|就算偶然生在贫贱人家，也绝不会做跑腿的仆役，甘心受庸人使唤，一定会成为出色的艺人、名妓。
如前代之许由，陶潜，阮籍，嵇康，刘伶，王谢二族，顾虎头，陈后主，唐明皇，宋徽宗，|比如前代的许由、陶渊明、阮籍、嵇康、刘伶、王谢两大家族、顾恺之、陈后主、唐明皇、宋徽宗，
刘庭芝，温飞卿，米南宫，石曼卿，柳耆卿，秦少游，近日之倪云林，唐伯虎，祝枝山，|刘希夷、温庭筠、米芾、石延年、柳永、秦观，近代的倪瓒、唐寅、祝允明，
再如李龟年，黄幡绰，敬新磨，卓文君，红拂，薛涛，崔莺，朝云之流，此皆易地则同之人也。”|再如李龟年、黄幡绰、敬新磨、卓文君、红拂、薛涛、崔莺莺、朝云这些人，都是换个地方出生也一样的人。”
! 这就是有名的“正邪两赋”论：有一种人，同时禀受了天地的正气和邪气，所以聪明绝顶又不合流俗。宝玉、黛玉，书里的很多人物都是这一类。
! 雨村列的名单很有意思：隐士、名士、风流皇帝、才子、名伶、名妓，全是才华出众却不合礼教的人。作者借雨村的嘴，替宝玉这类人辩护。
! 讽刺的是，说这番大道理的雨村，自己却是一个十足的俗人。

# 十八、“成则王侯败则贼”
子兴道：“依你说，‘成则王侯败则贼’了。”|冷子兴说：“照你这么说，就是‘成功了是王侯，失败了是盗贼’了。”
雨村道：“正是这意。|雨村说：“正是这个意思。
你还不知，我自革职以来，这两年遍游各省，也曾遇见两个异样孩子。|你还不知道，我自从被革职以来，这两年游遍各省，也曾遇到过两个与众不同的孩子。
所以，方才你一说这宝玉，我就猜著了八九亦是这一派人物。|所以刚才你一说这个宝玉，我就猜到八九分，他也是这一类人物。
不用远说，只金陵城内，钦差金陵省体仁院总裁甄家，你可知么？”|不用说远的，就说金陵城里，钦差金陵省体仁院总裁甄家，你知道吗？”
子兴道：“谁人不知！这甄府和贾府就是老亲，又系世交。|冷子兴说：“谁不知道！这甄家和贾家是老亲戚，又是世交。
两家来往，极其亲热的。|两家来往，非常亲热。
便在下也和他家来往非止一日了。”|就连我也和他家来往不止一天了。”
! 甄家是贾家的“镜子”：一个“真”，一个“假”。甄家在金陵，贾家在京城；甄家先被抄家（第七十五回），贾家随后。
! “体仁院总裁”，和曹家世代担任的江宁织造很像。脂批说甄家写的是曹家的真事。

# 十九、甄宝玉
雨村笑道：“去岁我在金陵，也曾有人荐我到甄府处馆。|雨村笑道：“去年我在金陵，也有人推荐我到甄府去当家庭教师。
我进去看其光景，谁知他家那等显贵，却是个富而好礼之家，倒是个难得之馆。|我进去一看，谁知他家那么显贵，却是个富而好礼的人家，倒是个难得的好差事。
但这一个学生，虽是启蒙，却比一个举业的还劳神。|只是这个学生，虽然才刚启蒙，却比一个准备考科举的学生还费神。
说起来更可笑，他说：|说起来更可笑，他说：
‘必得两个女儿伴著我读书，我方能认得字，心里也明白，不然我自己心里糊涂。’|‘一定要有两个女孩儿陪着我读书，我才能认得字，心里也明白；不然我自己心里就糊涂。’
又常对跟他的小厮们说：|又常对跟着他的小厮们说：
‘这女儿两个字，极尊贵，极清净的，比那阿弥陀佛，元始天尊的这两个宝号还更尊荣无对的呢！|‘“女儿”这两个字，极其尊贵、极其清净，比“阿弥陀佛”“元始天尊”这两个神圣的名号还要尊荣无比！
你们这浊口臭舌，万不可唐突了这两个字，要紧。|你们这些污浊的嘴、臭烘烘的舌头，千万不要冒犯了这两个字，要紧。
但凡要说时，必须先用清水香茶漱了口才可，设若失错，便要凿牙穿腮等事。’|凡是要说的时候，一定要先用清水香茶漱了口才行；要是说错了，就要凿牙齿、穿腮帮子。’
其暴虐浮躁，顽劣憨痴，种种异常。|他那暴躁浮躁、顽皮呆痴，种种都和常人不同。
只一放了学，进去见了那些女儿们，其温厚和平，聪敏文雅，竟又变了一个。|可只要一放学，进去见了那些女孩子们，他就变得温和厚道、聪明文雅，竟然完全变了一个人。
因此，他令尊也曾下死笞楚过几次，无奈竟不能改。|因此他父亲也狠狠打过他几次，可他就是改不了。
每打的吃疼不过时，他便‘姐姐’‘妹妹’乱叫起来。|每次打得疼得受不了的时候，他就“姐姐”“妹妹”地乱叫起来。
后来听得里面女儿们拿他取笑：|后来听见里面的女孩子们拿他取笑：
‘因何打急了只管叫姐妹做甚？莫不是求姐妹去说情讨饶？你岂不愧些！’|‘为什么打急了只管叫姐妹？莫非是求姐妹去替你说情讨饶？你不觉得惭愧吗！’
他回答的最妙。他说：|他回答得最妙，他说：
‘急疼之时，只叫‘姐姐’妹妹’字样，或可解疼也未可知，|‘疼得急的时候，只要叫“姐姐”“妹妹”这几个字，也许就能止疼也说不定。
因叫了一声，便果觉不疼了，遂得了秘法：每疼痛之极，便连叫姐妹起来了。’|我叫了一声，果然就觉得不疼了，于是得了这个秘方：每次疼到极点，就连声叫起姐妹来了。’
你说可笑不可笑？|你说可笑不可笑？
也因祖母溺爱不明，每因孙辱师责子，因此我就辞了馆出来。|也因为他祖母溺爱糊涂，常常为了孙子羞辱老师、责备儿子，所以我就辞了差事出来了。
如今在这巡盐御史林家做馆了。|现在在这巡盐御史林家当家庭教师。
你看，这等子弟，必不能守祖父之根基，从师长之规谏的。|你看，这样的子弟，一定守不住祖辈的基业，也不会听老师长辈的规劝。
只可惜他家几个姊妹都是少有的。”|只可惜他家几个姐妹都是少有的好女孩。”
! 这个甄家的孩子就是甄宝玉，和贾宝玉同名、同貌、同脾气，是贾宝玉的“镜像”。第五十六回贾宝玉梦见了他。
! “女儿”二字比“阿弥陀佛”还尊贵，这正是贾宝玉的想法。一真一假两个宝玉，说的是同一种人。
! 雨村前面刚说这种人是“正邪两赋”的奇才，转头又说“必不能守祖父之根基”。他嘴上欣赏，心里还是世俗的看法。

# 二十、贾府的四位小姐
子兴道：“便是贾府中，现有的三个也不错。|冷子兴说：“就是贾府里，现有的三位小姐也都不错。
政老爹的长女，名元春，现因贤孝才德，选入宫作女史去了。|政老爷的大女儿叫元春，现在因为贤孝有才德，被选进宫当女史去了。
二小姐乃赦老爹前妻所出，名迎春，|二小姐是赦老爷前妻生的，叫迎春；
三小姐乃政老爹之庶出，名探春，|三小姐是政老爷的妾生的，叫探春；
四小姐乃宁府珍爷之胞妹，名唤惜春。|四小姐是宁府珍大爷的亲妹妹，叫惜春。
因史老夫人极爱孙女，都跟在祖母这边一处读书，听得个个不错。”|因为史老夫人非常疼爱孙女们，都跟在祖母这边一起读书，听说个个都不错。”
! 冷子兴说“三个”，其实列了四个，是因为元春已经进宫，现在家里只有三个。
! 元春、迎春、探春、惜春，四个名字的头一个字连起来是“元迎探惜”，谐音“原应叹息”。四姐妹的命运，全在这四个字里。

# 二十一、“敏”字
雨村道：“更妙在甄家的风俗，女儿之名，亦皆从男子之名命字，|雨村说：“更妙的是甄家的风俗，女孩儿的名字，也都照着男孩儿的名字来取，
不似别家另外用这些‘春’‘红’‘香’‘玉’等艳字的。|不像别家另外用‘春’‘红’‘香’‘玉’这些艳丽的字。
何得贾府亦乐此俗套？”|贾府怎么也喜欢这种俗套？”
子兴道：“不然。只因现今大小姐是正月初一日所生，故名元春，馀者方从了‘春’字。|冷子兴说：“不是这样。只因为大小姐是正月初一生的，所以叫元春，其余的才跟着用了‘春’字。
上一辈的，却也是从弟兄而来的。|上一辈的小姐，倒也是跟着兄弟们的名字取的。
现有对证：目今你贵东家林公之夫人，即荣府中赦，政二公之胞妹，在家时名唤贾敏。|现成就有证据：你现在的东家林大人的夫人，就是荣府赦、政二位老爷的亲妹妹，在家时叫贾敏。
不信时，你回去细访可知。”|不信的话，你回去仔细打听就知道了。”
雨村拍案笑道：“怪道这女学生读至凡书中有‘敏’字，皆念作‘密’字，每每如是，|雨村拍着桌子笑道：“怪不得我这个女学生读书时，凡是书里有‘敏’字，都念成‘密’字，每次都这样；
写字遇著‘敏’字，又减一二笔，我心中就有些疑惑。|写字碰到‘敏’字，又少写一两笔，我心里就有些疑惑。
今听你说的，是为此无疑矣。|今天听你这么一说，一定是这个缘故了。
怪道我这女学生言语举止另是一样，不与近日女子相同，|怪不得我这个女学生说话举止另有一种样子，和现在一般的女孩子不一样，
度其母必不凡，方得其女，今知为荣府之孙，又不足罕矣，可伤上月竟亡故了。”|我猜她母亲一定不平凡，才能有这样的女儿；现在知道她是荣府的外孙女，也就不稀奇了。可惜她母亲上个月竟然去世了。”
子兴叹道：“老姊妹四个，这一个是极小的，又没了。|冷子兴叹道：“老一辈姐妹四个，这一个是最小的，也没了。
长一辈的姊妹，一个也没了。|长一辈的姐妹，一个也不剩了。
只看这小一辈的，将来之东床如何呢。”|只看这小一辈的，将来嫁什么样的女婿了。”
! 古人要避父母的名讳，读书写字遇到父母名字里的字，要改读或少写笔画。黛玉把“敏”读成“密”、少写笔画，就是在避母亲贾敏的讳。五岁的孩子就这样守礼，可见林家的家教。
! “东床”指女婿，出自王羲之“东床坦腹”的典故。冷子兴说“将来之东床如何”，小一辈姐妹们的婚姻，正是全书最悲的地方。

# 二十二、贾琏和凤姐
雨村道：“正是。方才说这政公，已有衔玉之儿，又有长子所遗一个弱孙。|雨村说：“正是。刚才说这位政老爷，已经有了衔玉而生的儿子，又有大儿子留下的一个小孙子。
这赦老竟无一个不成？”|这位赦老爷难道一个儿子也没有吗？”
子兴道：“政公既有玉儿之后，其妾又生了一个，倒不知其好歹。|冷子兴说：“政老爷有了宝玉以后，他的妾又生了一个儿子，倒不知道是好是坏。
只眼前现有二子一孙，却不知将来如何。|眼前他有两个儿子、一个孙子，也不知道将来怎么样。
若问那赦公，也有二子，长名贾琏，今已二十来往了，|要说那位赦老爷，也有两个儿子，大的叫贾琏，现在已经二十来岁了，
亲上作亲，娶的就是政老爹夫人王氏之内侄女，今已娶了二年。|亲上加亲，娶的就是政老爷夫人王氏的亲侄女，现在已经娶了两年了。
这位琏爷身上现捐的是个同知，也是不肯读书，于世路上好机变，言谈去的，|这位琏二爷身上现在捐了个同知的官衔，也是不肯读书，在人情世故上倒很机灵，能说会道，
所以如今只在乃叔政老爷家住著，帮著料理些家务。|所以现在就住在他叔叔政老爷家里，帮着料理些家务。
谁知自娶了他令夫人之后，倒上下无一人不称颂他夫人的，琏爷倒退了一射之地：|谁知自从娶了他这位夫人以后，上上下下没有一个人不称赞他夫人的，琏二爷倒比她差了一大截：
说模样又极标致，言谈又爽利，心机又极深细，竟是个男人万不及一的。”|说模样又极漂亮，说话又爽快利落，心思又极深细，竟然是个男人一万个也比不上她一个的人。”
! “妾又生了一个，倒不知其好歹”，说的是赵姨娘生的贾环。冷子兴一句“不知好歹”，后面贾环的所作所为就是答案。
! 凤姐还没出场，冷子兴先替她做了介绍：“男人万不及一”。第三回凤姐“未见其人，先闻其声”，就从这里埋下伏笔。
! “退了一射之地”：一箭射出去的距离，比喻差得很远。

# 二十三、“正邪两赋”的一群人
雨村听了，笑道：“可知我前言不谬。|雨村听了，笑道：“可见我前面说的话没错。
你我方才所说的这几个人，都只怕是那正邪两赋而来一路之人，未可知也。”|你我刚才说的这几个人，只怕都是禀受正邪两种气而来的那一类人，也说不定。”
子兴道：“邪也罢，正也罢，只顾算别人家的帐，你也吃一杯酒才好。”|冷子兴说：“邪也好，正也好，只顾着算别人家的账，你也该喝一杯酒了。”
雨村道：“正是，只顾说话，竟多吃了几杯。”|雨村说：“正是，只顾说话，竟然多喝了几杯。”
子兴笑道：“说著别人家的闲话，正好下酒，即多吃几杯何妨。”|冷子兴笑道：“说着别人家的闲话，正好下酒，就算多喝几杯又何妨。”
! 一大户人家的兴衰、几代人的命运，在两个外人嘴里，不过是“别人家的闲话，正好下酒”。冷子兴这个“冷眼人”，冷得彻底。

# 二十四、有人来报喜
雨村向窗外看道：“天也晚了，仔细关了城。我们慢慢的进城再谈，未为不可。”|雨村往窗外看了看说：“天也晚了，小心城门关了。我们慢慢进城再谈，也未尝不可。”
于是，二人起身，算还酒帐。|于是两人起身，结清了酒账。
方欲走时，又听得后面有人叫道：“雨村兄，恭喜了！特来报个喜信的。”|正要走，又听见后面有人叫道：“雨村兄，恭喜了！我特地来给你报个喜信。”
雨村忙回头看时——|雨村连忙回头去看——
要知是谁，且听下回分解。|要知道是谁，请看下回分解。
! 来报喜的是和雨村一起被革职的张如圭，朝廷要重新起用旧官员了。下一回雨村靠林如海的推荐信攀上贾政，又陪着黛玉进京，黛玉就这样走进了贾府。
! 这一回像一张地图：读者还没走进贾府，就已经通过冷子兴的嘴，把宁荣两府的人认了一遍。
</script>

<script type="text/plain" id="ch26">
# 一、红玉的心事
话说宝玉养过了三十三天之后，不但身体强壮，亦且连脸上疮痕平服，仍回大观园内去。|宝玉养了三十三天以后，不但身体强壮了，连脸上的烫伤也平复了，仍旧搬回大观园去住。
这也不在话下。|这些不必细说。
且说近日宝玉病的时节，贾芸带著家下小厮坐更看守，昼夜在这里，|且说前些日子宝玉病着的时候，贾芸带着家里的小厮守夜看护，日夜都在这里，
那红玉同众丫鬟也在这里守著宝玉，彼此相见多日，都渐渐混熟了。|红玉和丫鬟们也在这里守着宝玉，彼此见面多日，渐渐都混熟了。
那红玉见贾芸手里拿的手帕子，倒象是自己从前掉的，待要问他，又不好问的。|红玉看见贾芸手里拿的手帕，很像自己以前丢的那块，想问他，又不好开口。
不料那和尚道士来过，用不著一切男人，贾芸仍种树去了。|没想到那和尚道士来过以后，用不着男人守着了，贾芸又回去种树了。
这件事待要放下，心内又放不下，待要问去，又怕人猜疑，|这件事想丢开，心里又丢不开；想去问，又怕别人起疑，
正是犹豫不决神魂不定之际，忽听窗外问道：“姐姐在屋里没有？”|正在犹豫不定、心神不宁的时候，忽然听见窗外有人问：“姐姐在屋里吗？”
红玉闻听，在窗眼内望外一看，原来是本院的个小丫头名叫佳蕙的，因答说：“在家里，你进来罢。”|红玉听了，从窗缝里往外一看，原来是本院一个叫佳蕙的小丫头，就答道：“在呢，你进来吧。”
佳蕙听了跑进来，就坐在床上，笑道：“我好造化！|佳蕙跑进来，就坐在床上，笑道：“我运气真好！
才刚在院子里洗东西，宝玉叫往林姑娘那里送茶叶，花大姐姐交给我送去。|刚才在院子里洗东西，宝玉叫往林姑娘那里送茶叶，袭人姐姐交给我送去。
可巧老太太那里给林姑娘送钱来，正分给他们的丫头们呢。|正好老太太那边给林姑娘送钱来，林姑娘正分给她的丫头们呢。
见我去了，林姑娘就抓了两把给我，也不知多少。你替我收著。”|见我去了，林姑娘就抓了两把给我，也不知道有多少。你替我收着。”
便把手帕子打开，把钱倒了出来，红玉替他一五一十的数了收起。|说着把手帕打开，把钱倒出来，红玉替她一五一十数好收起来。
! “花大姐姐”就是袭人，她本姓花。
! 黛玉随手抓两把钱给小丫头，出手大方，不像后来有人说的那样“小性儿”刻薄下人。

# 二、佳蕙替红玉抱不平
佳蕙道：“你这一程子心里到底觉怎么样？|佳蕙说：“你这一阵子心里到底觉得怎么样？
依我说，你竟家去住两日，请一个大夫来瞧瞧，吃两剂药就好了。”|依我说，你干脆回家住两天，请个大夫瞧瞧，吃两剂药就好了。”
红玉道：“那里的话，好好的，家去作什么！”|红玉说：“说什么呢，好好的，回家做什么！”
佳蕙道：“我想起来了，林姑娘生的弱，时常他吃药，你就和他要些来吃，也是一样。”|佳蕙说：“我想起来了，林姑娘身子弱，常常吃药，你就跟她要些来吃，也是一样的。”
红玉道：“胡说！药也是混吃的。”|红玉说：“胡说！药也是能乱吃的？”
佳蕙道：“你这也不是个长法儿，又懒吃懒喝的，终久怎么样？”|佳蕙说：“你这样也不是长久之计，又懒得吃懒得喝的，到底怎么办？”
红玉道：“怕什么，还不如早些儿死了倒干净！”|红玉说：“怕什么，还不如早点死了干净！”
佳蕙道：“好好的，怎么说这些话？”|佳蕙说：“好好的，怎么说这种话？”
红玉道：“你那里知道我心里的事！”|红玉说：“你哪里知道我心里的事！”
佳蕙点头想了一会，道：“可也怨不得，这个地方难站。|佳蕙点点头想了一会儿，说：“也难怪，这个地方难待。
就象昨儿老太太因宝玉病了这些日子，说跟著伏侍的这些人都辛苦了，|就像昨天，老太太因为宝玉病了这些日子，说跟着伺候的人都辛苦了，
如今身上好了，各处还完了愿，叫把跟著的人都按著等儿赏他们。|如今他身子好了，各处也还了愿，叫把跟着伺候的人都按等级赏一赏。
我们算年纪小，上不去，我也不抱怨，象你怎么也不算在里头？|我们年纪小，排不上，我也不抱怨；可像你，怎么也没算在里头？
我心里就不服。|我心里就不服。
袭人那怕他得十分儿，也不恼他，原该的。|袭人就算得十成的赏，也没人恼她，那是应该的。
说良心话，谁还敢比他呢？|凭良心说，谁敢跟她比呢？
别说他素日殷勤小心，便是不殷勤小心，也拼不得。|别说她平时殷勤小心，就是不殷勤小心，也比不过她。
可气晴雯，绮霰他们这几个，都算在上等里去，仗著老子娘的脸面，众人倒捧著他去。|可气的是晴雯、绮霰她们几个，都算进上等里去了，仗着爹妈的面子，大家倒捧着她们。
你说可气不可气？”|你说气人不气人？”
红玉道：“也不犯著气他们。|红玉说：“也犯不着生她们的气。
俗语说的好，‘千里搭长棚，没有个不散的筵席’，谁守谁一辈子呢？|俗话说得好，‘千里搭长棚，没有不散的宴席’，谁能守着谁一辈子呢？
不过三年五载，各人干各人的去了。那时谁还管谁呢？”|不过三年五年，各人干各人的去了，那时候谁还管谁呢？”
这两句话不觉感动了佳蕙的心肠，由不得眼睛红了，又不好意思好端端的哭，|这两句话不知不觉触动了佳蕙的心，忍不住红了眼圈，又不好意思平白无故地哭，
只得勉强笑道：“你这话说的却是。|只好勉强笑着说：“你这话说得对。
昨儿宝玉还说，明儿怎么样收拾房子，怎么样做衣裳，倒象有几百年的熬煎。”|昨天宝玉还说，以后要怎么收拾房子、怎么做衣裳，好像要在这里熬几百年似的。”
! “千里搭长棚，没有不散的筵席”，出自一个小丫头之口，却正是全书的主题。第十三回秦可卿托梦给凤姐，说的也是“盛筵必散”。
! 赏人按“等儿”，晴雯能排进上等，是“仗著老子娘的脸面”。怡红院里也有门第，也有亲疏。

# 三、描花样、找笔
红玉听了冷笑了两声，方要说话，只见一个未留头的小丫头子走进来，手里拿著些花样子并两张纸，|红玉听了冷笑两声，正要说话，只见一个还没留头发的小丫头走进来，手里拿着些花样和两张纸，
说道：“这是两个样子，叫你描出来呢。”|说：“这是两个样子，叫你描出来。”
说著向红玉掷下，回身就跑了。|说着往红玉跟前一扔，转身就跑了。
红玉向外问道：“倒是谁的？也等不得说完就跑，谁蒸下馒头等著你，怕冷了不成！”|红玉朝外问：“到底是谁的？话没说完就跑，是谁蒸好了馒头等着你，怕凉了不成！”
那小丫头在窗外只说得一声：“是绮大姐姐的。”抬起脚来咕咚咕咚又跑了。|那小丫头在窗外只说了一声“是绮大姐姐的”，抬起脚来咕咚咕咚又跑了。
红玉便赌气把那样子掷在一边，向抽屉内找笔，找了半天都是秃了的，|红玉赌气把样子扔在一边，到抽屉里找笔，找了半天都是秃了的，
因说道：“前儿一枝新笔，放在那里了？怎么一时想不起来。”|就说：“前天那支新笔放哪儿了？怎么一时想不起来。”
一面说著，一面出神，想了一会方笑道：“是了，前儿晚上莺儿拿了去了。”|一边说着，一边出神，想了一会儿才笑道：“对了，前天晚上莺儿拿去了。”
便向佳惠道：“你替我取了来。”|就对佳蕙说：“你替我去拿来。”
佳惠道：“花大姐姐还等著我替他抬箱子呢，你自己取去罢。”|佳蕙说：“袭人姐姐还等着我帮她抬箱子呢，你自己去拿吧。”
红玉道：“他等著你，你还坐著闲打牙儿？|红玉说：“她等着你，你还坐在这里闲聊天？
我不叫你取去，他也不等著你了。坏透了的小蹄子！”|我不叫你去拿，她就不等你了。坏透了的小丫头！”
说著，自己便出房来，出了怡红院，一径往宝钗院内来。|说着，自己出了屋子，出了怡红院，一直往宝钗的院子去。
! 小丫头扔下花样就跑，佳蕙也不肯替她跑腿。红玉在怡红院里，谁都能使唤她，她却使唤不动谁。

# 四、李嬷嬷去叫贾芸
刚至沁芳亭畔，只见宝玉的奶娘李嬷嬷从那边走来。|刚走到沁芳亭边，只见宝玉的奶妈李嬷嬷从那边走来。
红玉立住笑问道：“李奶奶，你老人家那去了？怎打这里来？”|红玉站住笑着问：“李奶奶，您老人家去哪儿了？怎么从这边来？”
李嬷嬷站住将手一拍道：“你说说，好好的又看上了那个种树的什么云哥儿雨哥儿的，|李嬷嬷站住，把手一拍说：“你说说，好好的又看上那个种树的什么云哥儿雨哥儿的，
这会子逼著我叫了他来。明儿叫上房里听见，可又是不好。”|这会儿逼着我去把他叫来。以后叫上房里知道了，又是不好。”
红玉笑道：“你老人家当真的就依了他去叫了？”|红玉笑道：“您老人家真的就依着他去叫了？”
李嬷嬷道：“可怎么样呢？”|李嬷嬷说：“那又能怎么样呢？”
红玉笑道：“那一个要是知道好歹，就回不进来才是。”|红玉笑道：“那个人要是知道好歹，就该推辞不进来才对。”
李嬷嬷道：“他又不痴，为什么不进来？”|李嬷嬷说：“他又不傻，为什么不进来？”
红玉道：“既是进来，你老人家该同他一齐来，回来叫他一个人乱碰，可是不好呢。”|红玉说：“既然要进来，您老人家该跟他一起来，回头叫他一个人乱撞，可不好。”
李嬷嬷道：“我有那样工夫和他走？|李嬷嬷说：“我哪有那个工夫陪他走？
不过告诉了他，回来打发个小丫头子或是老婆子，带进他来就完了。”|不过告诉他一声，回头打发个小丫头或老婆子带他进来就完了。”
说著，拄著拐杖一径去了。|说着，拄着拐杖径直走了。
红玉听说，便站著出神，且不去取笔。|红玉听了，就站在那里出神，也不去拿笔了。
! 红玉故意说“他就该回不进来”，又劝李嬷嬷“该同他一齐来”，句句在打听贾芸，又句句装作不在乎。
! 一听贾芸要来，连笔也不取了。

# 五、蜂腰桥四目相对
一时，只见一个小丫头子跑来，见红玉站在那里，便问道：“林姐姐，你在这里作什么呢？”|一会儿，一个小丫头跑来，见红玉站在那里，就问：“林姐姐，你在这儿做什么呢？”
红玉抬头见是小丫头子坠儿。|红玉抬头一看，是小丫头坠儿。
红玉道：“那去？”|红玉说：“你去哪儿？”
坠儿道：“叫我带进芸二爷来。”说著一径跑了。|坠儿说：“叫我去带芸二爷进来。”说着一溜烟跑了。
这里红玉刚走至蜂腰桥门前，只见那边坠儿引著贾芸来了。|这边红玉刚走到蜂腰桥门前，只见坠儿领着贾芸从那边来了。
那贾芸一面走，一面拿眼把红玉一溜，那红玉只装著和坠儿说话，也把眼去一溜贾芸：|贾芸一边走，一边拿眼睛瞟红玉；红玉只装作和坠儿说话，也拿眼睛瞟贾芸。
四目恰相对时，红玉不觉脸红了，一扭身往蘅芜苑去了。不在话下。|两人目光正好碰上，红玉不由得脸红了，一扭身往蘅芜苑去了。
! 红玉姓林，所以坠儿叫她“林姐姐”。她父亲林之孝是荣府的管家。
! 回目“蜂腰桥设言传心事”，指的就是这里和后面坠儿传帕子。桥名“蜂腰”，正是两人相会的窄处。

# 六、贾芸进怡红院
这里贾芸随著坠儿，逶迤来至怡红院中。|贾芸跟着坠儿，弯弯曲曲来到怡红院。
坠儿先进去回明了，然后方领贾芸进去。|坠儿先进去通报，然后才领贾芸进去。
贾芸看时，只见院内略略有几点山石，种著芭蕉，那边有两只仙鹤在松树下剔翎。|贾芸一看，只见院子里稀稀落落有几块山石，种着芭蕉，那边两只仙鹤在松树下梳理羽毛。
一溜回廊上吊著各色笼子，各色仙禽异鸟。|一排回廊上挂着各种鸟笼，养着各种珍禽异鸟。
上面小小五间抱厦，一色雕镂新鲜花样隔扇，上面悬著一个匾额，四个大字，题道是”怡红快绿”。|正面是五间小小的抱厦，一色雕着新鲜花样的隔扇，上面挂着一块匾，写着四个大字：“怡红快绿”。
贾芸想道：“怪道叫‘怡红院’，原来匾上是恁样四个字。”|贾芸心想：“怪不得叫‘怡红院’，原来匾上是这四个字。”
正想著，只听里面隔著纱窗子笑说道：“快进来罢。我怎么就忘了你两三个月！”|正想着，只听里面隔着纱窗笑道：“快进来吧。我怎么把你忘了两三个月！”
贾芸听得是宝玉的声音，连忙进入房内。|贾芸听出是宝玉的声音，连忙进屋。
抬头一看，只见金碧辉煌，文章闪灼，却看不见宝玉在那里。|抬头一看，只见金碧辉煌，花纹闪烁，却看不见宝玉在哪里。
一回头，只见左边立著一架大穿衣镜，从镜后转出两个一般大的十五六岁的丫头来说：“请二爷里头屋里坐。”|一回头，只见左边立着一架大穿衣镜，从镜子后面转出两个十五六岁、一般大的丫头来，说：“请二爷到里屋坐。”
贾芸连正眼也不敢看，连忙答应了。|贾芸连正眼都不敢看，连忙答应了。
又进一道碧纱厨，只见小小一张填漆床上，悬著大红销金撒花帐子。|又进了一道碧纱橱，只见一张小小的填漆床上，挂着大红洒金碎花的帐子。
宝玉穿著家常衣服，靸著鞋，倚在床上拿著本书，|宝玉穿着家常衣服，趿着鞋，靠在床上拿着一本书，
看见他进来，将书掷下，早堆著笑立起身来。|见他进来，把书一扔，满脸堆笑站了起来。
贾芸忙上前请了安。|贾芸赶紧上前请安。
宝玉让坐，便在下面一张椅子上坐了。|宝玉让座，他就在下首一张椅子上坐了。
宝玉笑道：“只从那个月见了你，我叫你往书房里来，谁知接接连连许多事情，就把你忘了。”|宝玉笑道：“自从那个月见了你，我叫你到书房来，谁知接连出了许多事，就把你忘了。”
贾芸笑道：“总是我没福，偏偏又遇著叔叔身上欠安。叔叔如今可大安了？”|贾芸笑道：“总是我没福气，偏偏又赶上叔叔身体不舒服。叔叔现在全好了吗？”
宝玉道：“大好了。我倒听见说你辛苦了好几天。”|宝玉说：“全好了。我倒听说你辛苦了好几天。”
贾芸道：“辛苦也是该当的。叔叔大安了，也是我们一家子的造化。”|贾芸说：“辛苦也是应该的。叔叔大好了，也是我们一家人的福气。”
! 这是第一次从一个外人的眼睛里看怡红院。贾芸被镜子弄得找不到人，后来刘姥姥在这里也会撞上同一面镜子。
! 贾芸比宝玉大好几岁，却管宝玉叫“叔叔”，上回还认他作“父亲”。旁支子弟要谋差事，只能这样屈身。

# 七、贾芸看袭人，宝玉说闲话
说著，只见有个丫鬟端了茶来与他。|正说着，有个丫鬟端茶给他。
那贾芸口里和宝玉说著话，眼睛却溜瞅那丫鬟：|贾芸嘴里跟宝玉说着话，眼睛却偷偷打量那丫鬟：
细挑身材，容长脸面，穿著银红袄儿，青缎背心，白绫细折裙。|细高身材，长圆脸儿，穿着银红色袄子，青缎背心，白绫细褶裙。
——不是别个，却是袭人。|不是别人，正是袭人。
那贾芸自从宝玉病了几天，他在里头混了两日，他却把那有名人口认记了一半。|贾芸自从宝玉病了那几天，在里头待了两天，就把有头有脸的人记住了一半。
他也知道袭人在宝玉房中比别个不同，|他也知道袭人在宝玉房里和别人不一样，
今见他端了茶来，宝玉又在旁边坐著，便忙站起来笑道：|如今见她端茶来，宝玉又坐在旁边，就连忙站起来笑道：
“姐姐怎么替我倒起茶来。我来到叔叔这里，又不是客，让我自己倒罢。”|“姐姐怎么替我倒起茶来了。我到叔叔这里又不是客，让我自己倒吧。”
宝玉道：“你只管坐著罢。丫头们跟前也是这样。”|宝玉说：“你只管坐着吧。在丫头们面前也这么客气。”
贾芸笑道：“虽如此说，叔叔房里姐姐们，我怎么敢放肆呢。”|贾芸笑道：“话虽这么说，叔叔房里的姐姐们，我怎么敢放肆呢。”
一面说，一面坐下吃茶。|一边说，一边坐下喝茶。
那宝玉便和他说些没要紧的散话。|宝玉就和他说些不要紧的闲话。
又说道谁家的戏子好，谁家的花园好，|说谁家的戏班子好，谁家的花园好，
又告诉他谁家的丫头标致，谁家的酒席丰盛，又是谁家有奇货，又是谁家有异物。|又告诉他谁家的丫头漂亮，谁家的酒席丰盛，谁家有稀罕东西，谁家有奇异宝贝。
那贾芸口里只得顺著他说，说了一会，见宝玉有些懒懒的了，便起身告辞。|贾芸嘴里只好顺着他说。说了一会儿，见宝玉有点倦了，就起身告辞。
宝玉也不甚留，只说：“你明儿闲了，只管来。”|宝玉也没怎么留，只说：“你以后有空，只管来。”
仍命小丫头子坠儿送他出去。|还是叫小丫头坠儿送他出去。
! 贾芸一进门就记住了“有名人口”，对袭人格外客气。他精明，懂得在大户人家看谁的脸色。
! 宝玉跟贾芸聊的全是戏子、花园、丫头、酒席。贾芸来是想谋差事，宝玉却只当他是来闲聊的。

# 八、贾芸借坠儿传帕
出了怡红院，贾芸见四顾无人，便把脚慢慢停著些走，口里一长一短和坠儿说话，|出了怡红院，贾芸见四下没人，就放慢脚步，一句长一句短地跟坠儿说话，
先问他“几岁了？名字叫什么？你父母在那一行上？|先问她：“几岁了？叫什么名字？你爹妈在哪一处当差？
在宝叔房内几年了？一个月多少钱？共总宝叔房内有几个女孩子？”|在宝叔房里几年了？一个月多少月钱？宝叔房里一共有几个女孩子？”
那坠儿见问，便一桩桩的都告诉他了。|坠儿见他问，就一件一件都告诉他了。
贾芸又道：“才刚那个与你说话的，他可是叫小红？”|贾芸又说：“刚才和你说话的那个，是叫小红吗？”
坠儿笑道：“他倒叫小红。你问他作什么？”|坠儿笑道：“她是叫小红。你问她做什么？”
贾芸道：“方才他问你什么手帕子，我倒拣了一块。”|贾芸说：“刚才她问你什么手帕，我倒捡到了一块。”
坠儿听了笑道：“他问了我好几遍，可有看见他的帕子。|坠儿听了笑道：“她问了我好几遍，有没有看见她的帕子。
我有那么大工夫管这些事！今儿他又问我，他说我替他找著了，他还谢我呢。|我哪有那么大工夫管这些事！今天她又问我，说我替她找着了，她还要谢我呢。
才在蘅芜苑门口说的，二爷也听见了，不是我撒谎。|刚才在蘅芜苑门口说的，二爷也听见了，不是我撒谎。
好二爷，你既拣了，给我罢。我看他拿什么谢我。”|好二爷，你既然捡着了，就给我吧。我看她拿什么谢我。”
原来上月贾芸进来种树之时，便拣了一块罗帕，便知是所在园内的人失落的，|原来上个月贾芸进园种树的时候，捡到了一块罗帕，知道是园里的人丢的，
但不知是那一个人的，故不敢造次。|只是不知道是谁的，所以不敢冒失。
今听见红玉问坠儿，便知是红玉的，心内不胜喜幸。|现在听说红玉向坠儿打听，就知道是红玉的了，心里十分欢喜。
又见坠儿追索，心中早得了主意，便向袖内将自己的一块取了出来，|又见坠儿来要，心里早有了主意，就从袖子里把自己的一块帕子拿了出来，
向坠儿笑道：“我给是给你，你若得了他的谢礼，不许瞒著我。”|对坠儿笑道：“给是给你，你要是得了她的谢礼，可不许瞒着我。”
坠儿满口里答应了，接了手帕子，送出贾芸，回来找红玉，不在话下。|坠儿满口答应，接过手帕，送走贾芸，回来找红玉去了。
! 关键一笔：贾芸给坠儿的不是捡到的那块，而是“自己的一块”。红玉的帕子他留下了，送出去的是他自己的。这就是“传心事”。
! 坠儿在中间传帕子，下一回宝钗在滴翠亭外就会听到她们说这件事。

# 九、宝玉闲逛，遇见贾兰
如今且说宝玉打发了贾芸去后，意思懒懒的歪在床上，似有朦胧之态。|再说宝玉打发走贾芸以后，懒懒地歪在床上，好像要睡着了。
袭人便走上来，坐在床沿上推他，说道：“怎么又要睡觉？闷的很，你出去逛逛不是？”|袭人走过来，坐在床沿上推他，说：“怎么又要睡觉？闷得慌，你出去逛逛不好吗？”
宝玉见说，便拉他的手笑道：“我要去，只是舍不得你。”|宝玉听了，拉着她的手笑道：“我想去，只是舍不得你。”
袭人笑道：“快起来罢！”一面说，一面拉了宝玉起来。|袭人笑道：“快起来吧！”一边说，一边把宝玉拉了起来。
宝玉道：“可往那去呢？怪腻腻烦烦的。”|宝玉说：“可去哪儿呢？腻烦得很。”
袭人道：“你出去了就好了。只管这么葳蕤，越发心里烦腻。”|袭人说：“你出去了就好了。老这么没精打采的，心里越发烦。”
宝玉无精打采的，只得依他。|宝玉没精打采的，只好依了她。
晃出了房门，在回廊上调弄了一回雀儿，出至院外，顺著沁芳溪看了一回金鱼。|晃出房门，在回廊上逗了一会儿鸟，出了院子，顺着沁芳溪看了一会儿金鱼。
只见那边山坡上两只小鹿箭也似的跑来，宝玉不解其意。|只见那边山坡上两只小鹿飞箭似的跑过来，宝玉不明白怎么回事。
正自纳闷，只见贾兰在后面拿著一张小弓追了下来，|正纳闷，只见贾兰拿着一张小弓从后面追下来，
一见宝玉在前面，便站住了，笑道：“二叔叔在家里呢，我只当出门去了。”|一见宝玉在前面，就站住了，笑道：“二叔叔在家呢，我还以为你出门了。”
宝玉道：“你又淘气了。好好的射他作什么？”|宝玉说：“你又淘气了。好好的射它们做什么？”
贾兰笑道：“这会子不念书，闲著作什么？所以演习演习骑射。”|贾兰笑道：“这会儿不念书，闲着干什么？所以练练骑射。”
宝玉道：“把牙栽了，那时才不演呢。”|宝玉说：“等你摔掉了牙，那时候就不练了。”
! 贾兰是李纨的儿子，小小年纪，不念书时就练骑射，是贾家子孙里少有的上进人。宝玉却劝他别练，一个要用功，一个只想闲着。

# 十、潇湘馆里“情思睡昏昏”
说著，顺著脚一径来至一个院门前，只见凤尾森森，龙吟细细。|说着，随脚走到一个院门前，只见竹叶茂密如凤尾，风吹竹响如龙吟细细。
举目望门上一看，只见匾上写著“潇湘馆”三字。|抬头往门上一看，匾上写着“潇湘馆”三个字。
宝玉信步走入，只见湘帘垂地，悄无人声。|宝玉随意走进去，只见竹帘垂到地上，静悄悄的没有人声。
走至窗前，觉得一缕幽香从碧纱窗中暗暗透出。|走到窗前，觉得一缕幽香从碧纱窗里悄悄透出来。
宝玉便将脸贴在纱窗上，往里看时，耳内忽听得细细的长叹了一声道：“‘每日家情思睡昏昏。’”|宝玉就把脸贴在纱窗上往里看，忽然听见里面细细地长叹一声，念道：“每日家情思睡昏昏。”
宝玉听了，不觉心内痒将起来，再看时，只见黛玉在床上伸懒腰。|宝玉听了，不由得心里痒痒起来。再一看，只见黛玉在床上伸懒腰。
宝玉在窗外笑道：“为甚么‘每日家情思睡昏昏’？”|宝玉在窗外笑道：“为什么‘每日家情思睡昏昏’？”
一面说，一面掀帘子进来了。|一边说，一边掀帘子进来了。
林黛玉自觉忘情，不觉红了脸，拿袖子遮了脸，翻身向里装睡著了。|林黛玉知道自己一时忘情，不由得红了脸，拿袖子遮住脸，翻身朝里装睡。
宝玉才走上来要搬他的身子，只见黛玉的奶娘并两个婆子却跟了进来说：|宝玉刚走过去要扳她的身子，只见黛玉的奶妈和两个婆子跟了进来，说：
“妹妹睡觉呢，等醒了再请来。”|“姑娘睡觉呢，等醒了再请您来。”
刚说著，黛玉便翻身坐了起来，笑道：“谁睡觉呢。”|刚说着，黛玉就翻身坐起来，笑道：“谁睡觉了。”
那两三个婆子见黛玉起来，便笑道：“我们只当姑娘睡著了。”|那两三个婆子见黛玉起来了，就笑道：“我们还以为姑娘睡着了。”
说著，便叫紫鹃说：“姑娘醒了，进来伺侯。”|说着，叫紫鹃：“姑娘醒了，进来伺候。”
一面说，一面都去了。|一边说，一边都走了。
黛玉坐在床上，一面抬手整理鬓发，一面笑向宝玉道：“人家睡觉，你进来作什么？”|黛玉坐在床上，一边抬手理鬓发，一边笑着对宝玉说：“人家睡觉，你进来做什么？”
宝玉见他星眼微饧，香腮带赤，不觉神魂早荡，一歪身坐在椅子上，笑道：“你才说什么？”|宝玉见她眼神迷蒙，脸颊泛红，不由得神魂飘荡，一歪身坐在椅子上，笑道：“你刚才说什么？”
黛玉道：“我没说什么。”|黛玉说：“我没说什么。”
宝玉笑道：“给你个榧子吃！我都听见了。”|宝玉笑道：“给你个榧子吃！我都听见了。”（打榧子是用手指打个响，表示“别装了”）
! “每日家情思睡昏昏”是《西厢记》里崔莺莺的唱词。第二十三回两人刚一起偷看过《西厢记》，黛玉独处时便不知不觉念了出来。
! 婆子们一进来，黛玉立刻坐起说“谁睡觉呢”。她装睡是躲宝玉，有人来了就不能再装，免得落下闲话。

# 十一、宝玉说错话，黛玉哭了
二人正说话，只见紫鹃进来。|两人正说着话，紫鹃进来了。
宝玉笑道：“紫鹃，把你们的好茶倒碗我吃。”|宝玉笑道：“紫鹃，把你们的好茶倒一碗给我喝。”
紫鹃道：“那里是好的呢？要好的，只是等袭人来。”|紫鹃说：“哪有什么好茶？要好的，只能等袭人来。”
黛玉道：“别理他，你先给我舀水去罢。”|黛玉说：“别理他，你先给我打水去。”
紫鹃笑道：“他是客，自然先倒了茶来再舀水去。”说著倒茶去了。|紫鹃笑道：“他是客，自然先倒茶再打水。”说着倒茶去了。
宝玉笑道：“好丫头，‘若共你多情小姐同鸳帐，怎舍得叠被铺床？’”|宝玉笑道：“好丫头，‘若共你多情小姐同鸳帐，怎舍得叠被铺床？’”（意思是：我要是和你家多情小姐同床，怎么舍得让你叠被铺床）
林黛玉登时撂下脸来，说道：“二哥哥，你说什么？”|林黛玉立刻沉下脸来，说：“二哥哥，你说什么？”
宝玉笑道：“我何尝说什么。”|宝玉笑道：“我没说什么呀。”
黛玉便哭道：“如今新兴的，外头听了村话来，也说给我听，|黛玉就哭道：“如今时兴这个，在外头听了粗话来，也说给我听；
看了混帐书，也来拿我取笑儿。我成了爷们解闷的。”|看了不正经的书，也来拿我取笑。我成了给爷们解闷的了。”
一面哭著，一面下床来往外就走。|一边哭，一边下床往外走。
宝玉不知要怎样，心下慌了，忙赶上来，”好妹妹，我一时该死，你别告诉去。|宝玉不知怎么办才好，心里慌了，连忙追上去说：“好妹妹，我一时该死，你别去告诉。
我再要敢，嘴上就长个疔，烂了舌头。”|我要是再敢，嘴上就长个疔疮，烂了舌头。”
! 这句也是《西厢记》里张生对红娘说的话。宝玉把自己比作张生，把黛玉比作崔莺莺，把紫鹃比作红娘。
! 黛玉自己念《西厢记》可以，宝玉拿来说她就不行。私下里的心思被当面说破，又涉及男女同床，对一个闺中小姐是很重的冒犯。

# 十二、薛蟠假传“老爷叫”
正说著，只见袭人走来说道：“快回去穿衣服，老爷叫你呢。”|正说着，袭人走来说：“快回去穿衣服，老爷叫你呢。”
宝玉听了，不觉打了个雷的一般，也顾不得别的，疾忙回来穿衣服。|宝玉听了，就像挨了一个雷，什么也顾不上了，急忙回去穿衣服。
出园来，只见焙茗在二门前等著，宝玉便问道：“你可知道叫我是为什么？”|出了园子，只见焙茗在二门前等着，宝玉就问：“你知道叫我是为什么吗？”
焙茗道：“爷快出来罢，横竖是见去的，到那里就知道了。”|焙茗说：“爷快出来吧，反正是要去见的，到那里就知道了。”
一面说，一面催著宝玉。|一边说，一边催着宝玉。
转过大厅，宝玉心里还自狐疑，只听墙角边一阵呵呵大笑，|转过大厅，宝玉心里还在嘀咕，只听墙角边一阵哈哈大笑，
回头只见薛蟠拍著手笑了出来，笑道：“要不说姨夫叫你，你那里出来的这么快。”|回头一看，薛蟠拍着手笑着走出来，笑道：“要不说是姨父叫你，你哪会出来得这么快。”
焙茗也笑道：“爷别怪我。”忙跪下了。|焙茗也笑道：“爷别怪我。”连忙跪下了。
宝玉怔了半天，方解过来了，是薛蟠哄他出来。|宝玉愣了半天，才明白过来，是薛蟠哄他出来的。
薛蟠连忙打恭作揖陪不是，又求”不要难为了小子，都是我逼他去的。”|薛蟠连忙作揖赔不是，又求他“别为难小厮，都是我逼他去的”。
宝玉也无法了，只好笑问道：“你哄我也罢了，怎么说我父亲呢？|宝玉也没办法，只好笑着问：“你哄我也就罢了，怎么拿我父亲说事呢？
我告诉姨娘去，评评这个理，可使得么？”|我去告诉姨妈，让她评评这个理，行不行？”
薛蟠忙道：“好兄弟，我原为求你快些出来，就忘了忌讳这句话。|薛蟠忙说：“好兄弟，我本来只想让你快点出来，就忘了这句话该忌讳。
改日你也哄我，说我的父亲就完了。”|改天你也哄我，说是我父亲叫我，就扯平了。”
宝玉道：“嗳，嗳，越发该死了。”|宝玉说：“哎，哎，越说越该死了。”
又向焙茗道：“反叛肏的，还跪著作什么！”焙茗连忙叩头起来。|又对焙茗说：“你这个反了天的东西，还跪着干什么！”焙茗连忙磕头起来。
! 薛蟠的父亲早已去世，所以“说我的父亲”是在拿死人开玩笑，宝玉才说他“越发该死”。薛蟠粗鲁，连这点忌讳都不懂。
! 宝玉一听“老爷叫”就像挨雷劈。父子之间的恐惧，为第三十三回宝玉挨打埋下伏笔。

# 十三、薛蟠的生日宴
薛蟠道：“要不是我也不敢惊动，只因明儿五月初三日是我的生日，|薛蟠说：“要不是有事，我也不敢惊动你，只因明天五月初三是我的生日，
谁知古董行的程日兴，他不知那里寻了来的这么粗这么长粉脆的鲜藕，这么大的大西瓜，|谁知古董行的程日兴，不知从哪里弄来这么粗、这么长、又粉又脆的鲜藕，这么大的大西瓜，
这么长一尾新鲜的鲟鱼，这么大的一个暹罗国进贡的灵柏香熏的暹猪。|这么长一条新鲜鲟鱼，还有这么大一只暹罗国进贡的、用灵柏香熏过的暹猪。
你说，他这四样礼可难得不难得？|你说，这四样礼难得不难得？
那鱼，猪不过贵而难得，这藕和瓜亏他怎么种出来的。|那鱼和猪不过是贵、难得罢了，这藕和瓜真不知他是怎么种出来的。
我连忙孝敬了母亲，赶著给你们老太太，姨父，姨母送了些去。|我赶紧孝敬了母亲，又赶着给你们老太太、姨父、姨妈送了些去。
如今留了些，我要自己吃，恐怕折福，左思右想，除我之外，惟有你还配吃，所以特请你来。|现在还留了些，我要自己吃，又怕折福，左思右想，除了我，只有你还配吃，所以特地请你来。
可巧唱曲儿的小幺儿又才来了，我同你乐一天何如？”|正好唱曲的小厮也刚来了，我陪你乐一天怎么样？”
一面说，一面来至他书房里。|一边说，一边来到他的书房。
只见詹光，程日兴，胡斯来，单聘仁等并唱曲儿的都在这里，|只见詹光、程日兴、胡斯来、单聘仁等人，还有唱曲的，都在这里，
见他进来，请安的，问好的，都彼此见过了。|见他进来，请安的请安，问好的问好，彼此都见过了。
吃了茶，薛蟠即命人摆酒来。|喝了茶，薛蟠就叫人摆酒。
说犹未了，众小厮七手八脚摆了半天，方才停当归坐。|话还没说完，小厮们七手八脚摆了半天，才收拾停当，大家入座。
宝玉果见瓜藕新异，因笑道：“我的寿礼还未送来，倒先扰了。”|宝玉果然见瓜和藕都新鲜稀奇，就笑道：“我的寿礼还没送来，倒先来叨扰了。”
薛蟠道：“可是呢，明儿你送我什么？”|薛蟠说：“可不是嘛，明天你送我什么？”
宝玉道：“我可有什么可送的？若论银钱吃的穿的东西，究竟还不是我的，|宝玉说：“我有什么可送的？要说银钱、吃的、穿的，说到底都不是我自己的，
惟有我写一张字，画一张画，才算是我的。”|只有我写一张字、画一张画，才算是我自己的。”
! 詹光（沾光）、单聘仁（善骗人）、胡斯来（胡厮赖）、程日兴（成日兴），都是谐音，是一群陪着富家子弟吃喝的清客。
! 宝玉说家里的钱物“究竟还不是我的”，他虽是富贵公子，却清楚自己什么都没有挣过。

# 十四、“庚黄”与“唐寅”
薛蟠笑道：“你提画儿，我才想起来。|薛蟠笑道：“你一提画，我才想起来。
昨儿我看人家一张春宫，画的著实好。|昨天我看了人家一张春宫画，画得真好。
上面还有许多的字，也没细看，只看落的款，是‘庚黄’画的。真真的好的了不得！”|上面还有许多字，我也没细看，只看了落款，是‘庚黄’画的。真是好得不得了！”
宝玉听说，心下猜疑道：“古今字画也都见过些，那里有个‘庚黄’？”|宝玉听了，心里琢磨：“古今的字画我也见过一些，哪有个叫‘庚黄’的？”
想了半天，不觉笑将起来，命人取过笔来，在手心里写了两个字，|想了半天，不由得笑起来，叫人拿过笔来，在手心里写了两个字，
又问薛蟠道：“你看真了是‘庚黄’？”|又问薛蟠：“你看清楚了，是‘庚黄’？”
薛蟠道：“怎么看不真！”|薛蟠说：“怎么会看不清！”
宝玉将手一撒，与他看道：“别是这两字罢？其实与‘庚黄’相去不远。”|宝玉把手一摊给他看，说：“别是这两个字吧？其实跟‘庚黄’差得不远。”
众人都看时，原来是“唐寅”两个字，|大家一看，原来是“唐寅”两个字，
都笑道：“想必是这两字，大爷一时眼花了也未可知”。|都笑道：“想必是这两个字，大爷一时眼花了也说不定。”
薛蟠只觉没意思，笑道：“谁知他‘糖银’‘果银’的。”|薛蟠觉得没面子，笑道：“谁知道他是‘糖银’还是‘果银’的。”
! 唐寅就是明代画家唐伯虎。薛蟠把“唐寅”认成“庚黄”，“唐”和“庚”、“寅”和“黄”字形相近。
! 众人给他打圆场说“眼花了”，薛蟠还要嘴硬说“糖银果银”，一个不学无术的“呆霸王”跃然纸上。

# 十五、冯紫英来访
正说著，小厮来回“冯大爷来了”。|正说着，小厮来报“冯大爷来了”。
宝玉便知是神武将军冯唐之子冯紫英来了。|宝玉知道是神武将军冯唐的儿子冯紫英来了。
薛蟠等一齐都叫“快请”。|薛蟠等人一齐说“快请”。
说犹未了，只见冯紫英一路说笑，已进来了。|话还没说完，冯紫英一路说笑着已经进来了。
众人忙起席让坐。|大家连忙起身让座。
冯紫英笑道：“好呀！也不出门了，在家里高乐罢。”|冯紫英笑道：“好啊！也不出门了，就在家里快活吧。”
宝玉薛蟠都笑道：“一向少会，老世伯身上康健？”|宝玉、薛蟠都笑道：“好久不见，老伯身体可好？”
紫英答道：“家父倒也托庇康健。近来家母偶著了些风寒，不好了两天。”|冯紫英答道：“家父托福身体还好。最近家母偶然受了些风寒，不舒服了两天。”
薛蟠见他面上有些青伤，便笑道：“这脸上又和谁挥拳的？挂了幌子了。”|薛蟠见他脸上有些青伤，就笑道：“这脸上又跟谁打架了？挂了彩了。”
冯紫英笑道：“从那一遭把仇都尉的儿子打伤了，我就记了再不怄气，如何又挥拳？|冯紫英笑道：“自从那一回把仇都尉的儿子打伤了，我就记着再也不跟人斗气了，怎么会又打架？
这个脸上，是前日打围，在铁网山教兔鹘捎一翅膀。”|这脸上的伤，是前几天打猎，在铁网山被兔鹘用翅膀扫了一下。”
宝玉道：“几时的话？”|宝玉问：“什么时候的事？”
紫英道：“三月二十八日去的，前儿也就回来了。”|冯紫英说：“三月二十八去的，前几天就回来了。”
宝玉道：“怪道前儿初三四儿，我在沈世兄家赴席不见你呢。|宝玉说：“怪不得前些天初三初四，我在沈世兄家赴宴没见到你。
我要问，不知怎么就忘了。单你去了，还是老世伯也去了？”|我本想问，不知怎么就忘了。是你一个人去的，还是老伯也去了？”
紫英道：“可不是家父去，我没法儿，去罢了。|冯紫英说：“可不是家父去的，我没办法，只好跟着去。
难道我闲疯了，咱们几个人吃酒听唱的不乐，寻那个苦恼去？|难道我闲疯了，咱们几个喝酒听曲不快活，偏去找那个罪受？
这一次，大不幸之中又大幸。”|这一回，是大不幸之中又有大幸。”
! 铁网山第十三回出现过：秦可卿的棺木就是“铁网山”上的樯木做的，原本是义忠亲王老千岁要用的，后来他“坏了事”。冯紫英随父亲去铁网山打围，又说“大不幸之中又大幸”，一般认为暗指朝中出了什么风波。
! 冯紫英欲言又止，作者故意留下悬念，后文也没有交代清楚。

# 十六、冯紫英匆匆离席
薛蟠众人见他吃完了茶，都说道：“且入席，有话慢慢的说。”|薛蟠等人见他喝完了茶，都说：“先入席，有话慢慢说。”
冯紫英听说，便立起身来说道：论理，我该陪饮几杯才是，只是今儿有一件大大要紧的事，回去还要见家父面回，实不敢领。|冯紫英听了，站起来说：“照理我该陪大家喝几杯，只是今天有一件非常要紧的事，回去还要当面禀告家父，实在不敢领。”
薛蟠宝玉众人那里肯依，死拉著不放。|薛蟠、宝玉等人哪里肯依，死拉着不放。
冯紫英笑道：“这又奇了。你我这些年，那回儿有这个道理的？果然不能遵命。|冯紫英笑道：“这就奇怪了。你我这些年，哪回有过这样的？实在是不能遵命。
若必定叫我领，拿大杯来，我领两杯就是了。”|要是非叫我喝，拿大杯来，我喝两杯就是了。”
众人听说，只得罢了，薛蟠执壶，宝玉把盏，斟了两大海。|大家听了，只好作罢。薛蟠拿壶，宝玉端杯，斟了两大碗。
那冯紫英站著，一气而尽。|冯紫英站着，一口气喝完了。
宝玉道：“你到底把这个‘不幸之幸’说完了再走。”|宝玉说：“你到底把这个‘不幸之中的幸’说完了再走。”
冯紫英笑道：“今儿说的也不尽兴。我为这个，还要特治一东，请你们去细谈一谈，二则还有所恳之处。”|冯紫英笑道：“今天说也说不痛快。为了这件事，我还要专门请一回客，请你们去细谈，二来还有事要求你们。”
说著执手就走。|说着拱拱手就走。
薛蟠道：“越发说的人热剌剌的丢不下。多早晚才请我们，告诉了。也免的人犹疑。”|薛蟠说：“越说越叫人心里痒痒的放不下。什么时候请我们，先告诉一声，免得人老惦记着。”
冯紫英道：“多则十日，少则八天。”|冯紫英说：“多则十天，少则八天。”
一面说，一面出门上马去了。|一边说，一边出门上马走了。
众人回来，依席又饮了一回方散。|大家回来，又入席喝了一阵才散。
! 冯紫英说要“特治一东”，下一回（第二十八回）就在他家宴请，宝玉在那里结识了蒋玉菡，又换了汗巾。这件事最后招来了第三十三回的一顿毒打。

# 十七、宝钗来说笑
宝玉回至园中，袭人正记挂著他去见贾政，不知是祸是福，|宝玉回到园中，袭人正惦记他去见贾政，不知是祸是福，
只见宝玉醉醺醺的回来，问其原故，宝玉一一向他说了。|只见宝玉醉醺醺地回来了，问他原因，宝玉一五一十告诉了她。
袭人道：“人家牵肠挂肚的等著，你且高乐去，也到底打发人来给个信儿。”|袭人说：“人家牵肠挂肚地等着，你倒快活去了，好歹也该打发人来报个信。”
宝玉道：“我何尝不要送信儿，只因冯世兄来了，就混忘了。”|宝玉说：“我何尝不想送信，只因冯世兄来了，就忘了。”
正说，只见宝钗走进来笑道：“偏了我们新鲜东西了。”|正说着，宝钗走进来笑道：“你吃了我们的新鲜东西了。”
宝玉笑道：“姐姐家的东西，自然先偏了我们了。”|宝玉笑道：“姐姐家的东西，自然是我们先吃了。”
宝钗摇头笑道：“昨儿哥哥倒特特的请我吃，我不吃，叫他留著请人送人罢。|宝钗摇头笑道：“昨天哥哥还特意请我吃，我没吃，叫他留着请人送人吧。
我知道我的命小福薄，不配吃那个。”|我知道我命小福薄，不配吃那个。”
说著，丫鬟倒了茶来，吃茶说闲话儿，不在话下。|说着，丫鬟倒了茶来，大家喝茶说闲话，不必细说。
! 宝钗晚上来怡红院坐，就是这一坐，引出了下面黛玉吃闭门羹的事。

# 十八、黛玉叫门，晴雯不开
却说那林黛玉听见贾政叫了宝玉去了，一日不回来，心中也替他忧虑。|再说林黛玉听说贾政把宝玉叫去了，一整天没回来，心里也替他担忧。
至晚饭后，闻听宝玉来了，心里要找他问问是怎么样了。|到晚饭后，听说宝玉回来了，心里想去找他问问到底怎么样了。
一步步行来，见宝钗进宝玉的院内去了，自己也便随后走了来。|一步步走过来，看见宝钗进了宝玉的院子，自己也随后跟了过来。
刚到了沁芳桥，只见各色水禽都在池中浴水，也认不出名色来，但见一个个文彩炫耀，好看异常，因而站住看了一会。|刚到沁芳桥，只见各种水鸟都在池子里洗澡，也认不出是什么鸟，只见一只只羽毛鲜艳，非常好看，就站住看了一会儿。
再往怡红院来，只见院门关著，黛玉便以手扣门。|再往怡红院去，只见院门关着，黛玉就用手敲门。
谁知晴雯和碧痕正拌了嘴，没好气，忽见宝钗来了，那晴雯正把气移在宝钗身上，|谁知晴雯和碧痕刚拌了嘴，正没好气，忽然宝钗来了，晴雯就把气撒到宝钗身上，
正在院内抱怨说：“有事没事跑了来坐著，叫我们三更半夜的不得睡觉！”|正在院子里抱怨：“有事没事跑来坐着，害我们三更半夜都不能睡觉！”
忽听又有人叫门，晴雯越发动了气，也并不问是谁，便说道：“都睡下了，明儿再来罢！”|忽然又听见有人叫门，晴雯越发来气，也不问是谁，就说：“都睡下了，明天再来吧！”
林黛玉素知丫头们的情性，他们彼此顽耍惯了，|林黛玉一向知道丫头们的脾气，她们彼此闹惯了，
恐怕院内的丫头没听真是他的声音，只当是别的丫头们来了，所以不开门，|怕院里的丫头没听出是她的声音，以为是别的丫头来了，所以不开门，
因而又高声说道：“是我，还不开么？”|就又高声说：“是我，还不开吗？”
晴雯偏生还没听出来，便使性子说道：“凭你是谁，二爷吩咐的，一概不许放人进来呢！”|晴雯偏偏还没听出来，就使性子说：“不管你是谁，二爷吩咐过的，一概不许放人进来！”
! 晴雯是迁怒宝钗，却把门关在了黛玉面前。一个误会，加上宝钗正好在里面，黛玉自然想到别处去。

# 十九、黛玉花阴下独泣
林黛玉听了，不觉气怔在门外，待要高声问他，逗起气来，自己又回思一番：|林黛玉听了，气得愣在门外。想高声问她，跟她吵起来，自己又回头一想：
“虽说是舅母家如同自己家一样，到底是客边。|“虽说舅母家跟自己家一样，到底还是寄居的客人。
如今父母双亡，无依无靠，现在他家依栖。如今认真淘气，也觉没趣。”|现在父母都不在了，无依无靠，住在他家。要是真闹起来，也没意思。”
一面想，一面又滚下泪珠来。|一边想，一边又掉下泪来。
正是回去不是，站著不是。|真是回去也不是，站着也不是。
正没主意，只听里面一阵笑语之声，细听一听，竟是宝玉‘宝钗二人。|正没主意，只听里面一阵说笑声，仔细一听，竟是宝玉和宝钗两个人。
林黛玉心中益发动了气，左思右想，忽然想起了早起的事来：|林黛玉心里越发生气，左思右想，忽然想起了早上的事：
“必竟是宝玉恼我要告他的原故。|“一定是宝玉恼我说要去告他的缘故。
但只我何尝告你了，你也打听打听，就恼我到这步田地。|可我哪里告你了，你也不打听打听，就恼我到这个地步。
你今儿不叫我进来，难道明儿就不见面了！”|你今天不叫我进来，难道明天就不见面了！”
越想越伤感起来，也不顾苍苔露冷，花径风寒，独立墙角边花阴之下，悲悲戚戚呜咽起来。|越想越伤心，也顾不上青苔上露水冷、花径上风寒，独自站在墙角花荫下，悲悲切切地呜咽起来。
原来这林黛玉秉绝代姿容，具希世俊美，不期这一哭，|原来这林黛玉有绝代的容貌、世上少见的美，没想到她这一哭，
那附近柳枝花朵上的宿鸟栖鸦一闻此声，俱忒楞楞飞起远避，不忍再听。|附近柳枝花丛里过夜的鸟雀、乌鸦一听到这声音，都扑棱棱飞起来远远躲开，不忍再听。
真是：|真是：
~花魂默默无情绪，鸟梦痴痴何处惊。|花的魂魄默默无言，没有一点情绪；鸟儿痴痴的梦，不知被什么惊醒。
因有一首诗道：|有一首诗写道：
~颦儿才貌世应希，独抱幽芳出绣闺，|颦儿的才貌世上少有，独自怀着幽香走出绣房，
~呜咽一声犹未了，落花满地鸟惊飞。|一声呜咽还没哭完，就落花满地、鸟雀惊飞。
那林黛玉正自啼哭，忽听“吱喽”一声，院门开处，不知是那一个出来。|林黛玉正在哭，忽然听见“吱呀”一声，院门开了，不知是谁出来。
要知端的，且听下回分解。|要知道是谁，请看下回。
! 黛玉气的不是晴雯，是“到底是客边”。父母双亡、寄人篱下，这是她所有敏感和眼泪的根。
! 她错以为是宝玉不让开门，下一回她就带着这份委屈去葬花，写下了《葬花吟》。
! “颦儿”是黛玉的小名，第三回宝玉初见她时给她取的字“颦颦”。
</script>
<script type="text/plain" id="ch27">
# 一、黛玉门外洒泪
话说林黛玉正自悲泣，忽听院门响处，只见宝钗出来了，宝玉袭人一群人送了出来。|林黛玉正在伤心哭泣，忽然听见院门一响，只见宝钗出来了，宝玉、袭人一群人送她出来。
待要上去问著宝玉，又恐当著众人问羞了宝玉不便，因而闪过一旁，让宝钗去了，|想上去问宝玉，又怕当着众人问，让宝玉下不来台，就闪到一边，让宝钗走了，
宝玉等进去关了门，方转过来，犹望著门洒了几点泪。|等宝玉他们进去关上门，才转过身来，还望着那门掉了几滴泪。
自觉无味，方转身回来，无精打彩的卸了残妆。|自己觉得没意思，才转身回去，没精打采地卸了妆。
紫鹃雪雁素日知道林黛玉的情性：无事闷坐，不是愁眉，便是长叹，|紫鹃、雪雁平日知道林黛玉的脾气：没事时闷坐着，不是皱着眉，就是长叹气，
且好端端的不知为了什么，常常的便自泪道不干的。|而且好端端的不知为什么，常常眼泪流个不停。
先时还有人解劝，怕他思父母，想家乡，受了委曲，只得用话宽慰解劝。|起初还有人劝，怕她想念父母、想家，或受了委屈，只好说些话宽慰她。
谁知后来一年一月的竟常常的如此，把这个样儿看惯，也都不理论了。|谁知后来一年年一月月总是这样，看惯了，也就都不管了。
所以也没人理，由他去闷坐，只管睡觉去了。|所以也没人理她，由她去闷坐，自己睡觉去了。
那林黛玉倚著床栏杆，两手抱著膝，眼睛含著泪，好似木雕泥塑的一般，直坐到二更多天方才睡了。一宿无话。|林黛玉靠着床栏杆，两手抱着膝盖，眼里含着泪，像木雕泥塑的一样，一直坐到二更多天才睡下。一夜无话。
! 黛玉没有冲上去质问，是怕“问羞了宝玉”。她再委屈，也先顾着宝玉的面子。
! “看惯了也都不理论了”，连贴身丫鬟都不再劝她。黛玉的眼泪，在旁人眼里已经成了寻常。

# 二、芒种节饯花神
至次日乃是四月二十六日，原来这日未时交芒种节。|第二天是四月二十六日，这天未时（下午一点到三点）交芒种节。
尚古风俗：凡交芒种节的这日，都要设摆各色礼物，祭饯花神，|按古时的风俗：凡是交芒种节这一天，都要摆设各种礼物，祭祀饯别花神，
言芒种一过，便是夏日了，众花皆卸，花神退位，须要饯行。|说是芒种一过就是夏天了，百花凋谢，花神退位，要给她送行。
然闺中更兴这件风俗，所以大观园中之人都早起来了。|闺阁里尤其讲究这个风俗，所以大观园里的人都早早起来了。
那些女孩子们，或用花瓣柳枝编成轿马的，或用绫锦纱罗叠成干旄旌幢的，都用彩线系了。|那些女孩子们，有的用花瓣柳枝编成轿子马匹，有的用绫锦纱罗折成旗子仪仗，都用彩线系着。
每一颗树上，每一枝花上，都系了这些物事。|每一棵树上、每一枝花上，都系上这些东西。
满园里绣带飘飖，花枝招展，更兼这些人打扮得桃羞杏让，燕妒莺惭，一时也道不尽。|满园子绣带飘飘，花枝招展，再加上这些人打扮得连桃花杏花都害羞让路，燕子黄莺都嫉妒惭愧，一时也说不尽。
! 饯花神，就是给春天送行。这一天热热闹闹，黛玉却要去葬花，春尽花落的悲意在这里最浓。

# 三、宝钗止步潇湘馆
且说宝钗、迎春、探春、惜春、李纨、凤姐等并巧姐、大姐、香菱与众丫鬟们在园内玩耍，独不见林黛玉。|宝钗、迎春、探春、惜春、李纨、凤姐等人，还有巧姐、大姐、香菱和丫鬟们都在园里玩，唯独不见林黛玉。
迎春因说道：“林妹妹怎么不见？好个懒丫头！这会子还睡觉不成？”|迎春就说：“林妹妹怎么不见？好个懒丫头！这会儿还在睡觉不成？”
宝钗道：“你们等著，我去闹了他来。”|宝钗说：“你们等着，我去把她闹起来。”
说著便丢下了众人，一直往潇湘馆来。|说着就离开众人，一直往潇湘馆来。
正走著，只见文官等十二个女孩子也来了，上来问了好，说了一回闲话。|正走着，只见文官等十二个唱戏的女孩子也来了，上来问好，说了一会儿闲话。
宝钗回身指道：“他们都在那里呢，你们找他们去罢。我叫林姑娘去就来。”|宝钗回身指着说：“她们都在那边呢，你们找她们去吧。我去叫林姑娘就来。”
说著便逶迤往潇湘馆来。|说着就慢慢往潇湘馆走去。
忽然抬头见宝玉进去了，宝钗便站住低头想了想：|忽然抬头看见宝玉进去了，宝钗就站住低头想了想：
宝玉和林黛玉是从小儿一处长大，他兄妹间多有不避嫌疑之处，嘲笑喜怒无常，|宝玉和林黛玉是从小一起长大的，他们兄妹之间有许多不避嫌疑的地方，说说笑笑、恼恼喜喜没个准，
况且林黛玉素习猜忌，好弄小性儿的。|何况林黛玉平时爱猜疑，好使小性子。
此刻自己也跟了进去，一则宝玉不便，二则黛玉嫌疑。|这时候自己也跟进去，一来宝玉不方便，二来黛玉会起疑心。
罢了，倒是回来的妙。想毕抽身回来。|算了，还是回去的好。想完就转身回来了。
! 宝钗看见宝玉进了潇湘馆，立刻止步。她处处想得周到，从不往宝黛之间挤。
! 宝钗心里对黛玉的评价是“素习猜忌，好弄小性儿”，话不说出口，心里却有数。

# 四、宝钗扑蝶
刚要寻别的姊妹去，忽见前面一双玉色蝴蝶，大如团扇，一上一下迎风翩跹，十分有趣。|刚要去找别的姐妹，忽然看见前面一对玉色蝴蝶，有团扇那么大，一上一下迎风飞舞，十分有趣。
宝钗意欲扑了来玩耍，遂向袖中取出扇子来，向草地下来扑。|宝钗想扑来玩，就从袖子里取出扇子，到草地上去扑。
只见那一双蝴蝶忽起忽落，来来往往，穿花度柳，将欲过河去了。|只见那一对蝴蝶忽高忽低，飞来飞去，穿过花丛柳枝，快要飞过河去了。
倒引的宝钗蹑手蹑脚的，一直跟到池中滴翠亭上，香汗淋漓，娇喘细细。|引得宝钗轻手轻脚，一直跟到池中的滴翠亭上，香汗淋漓，娇喘细细。
宝钗也无心扑了，刚欲回来，只听滴翠亭里边嘁嘁喳喳有人说话。|宝钗也没心思扑了，正要回去，只听滴翠亭里有人嘁嘁喳喳说话。
原来这亭子四面俱是游廊曲桥，盖造在池中水上，四面雕镂隔子糊著纸。|原来这亭子四面都是游廊曲桥，盖在池子中央的水上，四面雕花的窗格上糊着纸。
! 回目“滴翠亭杨妃戏彩蝶”，杨妃指宝钗。宝钗体态丰满，常被比作杨贵妃；黛玉清瘦，回目里比作赵飞燕。
! 一向端庄稳重的宝钗，难得这样像个少女，蹑手蹑脚追蝴蝶，追得香汗淋漓。

# 五、亭中密语
宝钗在亭外听见说话，便煞住脚往里细听，只听说道：|宝钗在亭外听见有人说话，就停住脚往里细听，只听一个说：
“你瞧瞧这手帕子，果然是你丢的那块，你就拿著，要不是，就还芸二爷去。”|“你看看这块手帕，要真是你丢的那块，你就拿着；要不是，就还给芸二爷去。”
又有一人说话：“可不是我那块！拿来给我罢。”|另一个说：“可不就是我那块！拿来给我吧。”
又听道：“你拿什么谢我呢？难道白寻了来不成。”|又听见说：“你拿什么谢我呢？难道我白找来不成？”
又答道：“我既许了谢你，自然不哄你。”|又答道：“我既然答应了谢你，自然不会骗你。”
又听说道：“我寻了来给你，自然谢我，但只是拣的人，你就不拿什么谢他？”|又听见说：“我找来给你，你自然谢我；可是捡到的那个人，你就不拿点什么谢他？”
又回道：“你别胡说。他是个爷们家，拣了我的东西，自然该还的。我拿什么谢他呢？”|又回答：“你别胡说。他是个爷们，捡了我的东西，自然该还我。我拿什么谢他呢？”
又听说道：“你不谢他，我怎么回他呢？况且他再三再四的和我说了，若没谢的，不许我给你呢。”|又听见说：“你不谢他，我怎么回复他呢？况且他再三再四跟我说了，要是没有谢礼，不许我给你呢。”
半晌，又听答道：“也罢，拿我这个给他，算谢他的罢。|过了半天，又听见回答：“也罢，把我这个给他，算是谢他的吧。
——你要告诉别人呢？须说个誓来。”|你要是告诉别人呢？得发个誓。”
又听说道：“我要告诉一个人，就长一个疔，日后不得好死！”|又听见说：“我要是告诉一个人，就长一个疔疮，将来不得好死！”
又听说道：“嗳呀！咱们只顾说话，看有人来悄悄在外头听见。|又听见说：“哎呀！咱们只顾说话，小心有人悄悄在外面听见。
不如把这隔子都推开了，便是有人见咱们在这里，他们只当我们说顽话呢。|不如把这窗格都推开，就算有人看见咱们在这里，也只当我们在说笑话。
若走到跟前，咱们也看的见，就别说了。”|要是有人走到跟前，咱们也看得见，就不说了。”
! 坠儿拿来的帕子，其实是贾芸自己的那一块（见上回），红玉却一口认定“可不是我那块”。她明知不是，也愿意收下。
! 红玉还要回赠贾芸一件东西，这是私相授受，在当时是犯忌的事。

# 六、金蝉脱壳
宝钗在外面听见这话，心中吃惊，想道：|宝钗在外面听见这些话，心里吃惊，想道：
“怪道从古至今那些奸淫狗盗的人，心机都不错。|“怪不得从古到今那些干偷鸡摸狗勾当的人，心眼都不少。
这一开了，见我在这里，他们岂不臊了。|这窗子一打开，看见我在这里，她们岂不羞死了。
况才说话的语音，大似宝玉房里的红儿的言语。|况且刚才说话的声音，很像宝玉房里的红儿。
他素昔眼空心大，是个头等刁钻古怪东西。|她向来眼界高、心气大，是个头等刁钻古怪的丫头。
今儿我听了他的短儿，一时人急造反，狗急跳墙，不但生事，而且我还没趣。|今天我听到了她的短处，她一时急了，人急造反、狗急跳墙，不但会惹出事来，我也没意思。
如今便赶著躲了，料也躲不及，少不得要使个‘金蝉脱壳’的法子。”|现在就是赶着躲，恐怕也来不及了，少不得要使个‘金蝉脱壳’的法子。”
犹未想完，只听”咯吱”一声，宝钗便故意放重了脚步，笑著叫道：“颦儿，我看你往那里藏！”|还没想完，只听“咯吱”一声，宝钗就故意把脚步放重，笑着叫道：“颦儿，我看你往哪里藏！”
一面说，一面故意往前赶。|一边说，一边故意往前追。
那亭内的红玉坠儿刚一推窗，只听宝钗如此说著往前赶，两个人都唬怔了。|亭子里的红玉和坠儿刚一推开窗，就听见宝钗这样说着往前赶，两个人都吓呆了。
宝钗反向他二人笑道：“你们把林姑娘藏在那里了？”|宝钗反倒笑着问她们两个：“你们把林姑娘藏到哪里去了？”
坠儿道：“何曾见林姑娘了。”|坠儿说：“没看见林姑娘呀。”
宝钗道：“我才在河那边看著林姑娘在这里蹲著弄水儿的。|宝钗说：“我刚才在河那边看见林姑娘在这里蹲着玩水。
我要悄悄的唬他一跳，还没有走到跟前，他倒看见我了，朝东一绕就不见了。别是藏在这里头了。”|我想悄悄吓她一跳，还没走到跟前，她倒先看见我了，往东一绕就不见了。别是藏在这里头了。”
一面说一面故意进去寻了一寻，抽身就走，口内说道：“一定是又钻在山子洞里去了。遇见蛇，咬一口也罢了。”|一边说，一边故意进去找了找，转身就走，嘴里说：“一定又钻到假山洞里去了。碰见蛇，咬她一口也好。”
一面说一面走，心中又好笑：这件事算遮过去了，不知他二人是怎样。|一边说一边走，心里又觉得好笑：这件事总算遮掩过去了，不知她们两个会怎么想。
! 这是全书里争议最大的情节之一。宝钗情急之下脱身，却把“偷听”的嫌疑推到了黛玉身上。
! 有人说宝钗是有心嫁祸，有人说她只是随口拿最熟的人作挡箭牌。无论哪种，红玉从此认定黛玉听见了她的秘密。
! 宝钗对红玉“眼空心大”“刁钻古怪”的判断，下面马上就应验了：红玉很快被凤姐看中，攀上了“高枝儿”。

# 七、红玉疑心黛玉
谁知红玉听了宝钗的话，便信以为真，让宝钗去远，便拉坠儿道：|谁知红玉听了宝钗的话，就信以为真，等宝钗走远了，就拉着坠儿说：
“了不得了！林姑娘蹲在这里，一定听了话去了！”|“不得了了！林姑娘蹲在这里，一定把我们的话都听去了！”
坠儿听说，也半日不言语。|坠儿听了，也半天不说话。
红玉又道：“这可怎么样呢？”|红玉又说：“这可怎么办呢？”
坠儿道：“便是听了，管谁筋疼，各人干各人的就完了。”|坠儿说：“就算听见了，又碍着谁了，各人干各人的就是了。”
红玉道：“若是宝姑娘听见，还倒罢了。|红玉说：“要是宝姑娘听见了，倒还罢了。
林姑娘嘴里又爱刻薄人，心里又细，他一听见了，倘或走露了风声，怎么样呢？”|林姑娘嘴上爱刻薄人，心思又细，她一听见了，万一走漏了风声，可怎么办？”
二人正说著，只见文官，香菱，司棋，待书等上亭子来了。|两人正说着，只见文官、香菱、司棋、待书等人上亭子来了。
二人只得掩住这话，且和他们顽笑。|两人只好不再提这事，先和她们说笑。
! 红玉说“若是宝姑娘听见，还倒罢了”。真正听见的正是宝钗，她却最放心宝钗，最怕黛玉。宝钗和黛玉在下人心中是什么样子，这一句就看出来了。

# 八、凤姐使唤红玉
只见凤姐儿站在山坡上招手叫，红玉连忙弃了众人，跑至凤姐跟前，|只见凤姐站在山坡上招手叫人，红玉连忙丢下众人，跑到凤姐跟前，
堆著笑问：“奶奶使唤作什么事？”|满脸堆笑问：“奶奶有什么事要使唤？”
凤姐打谅了一打谅，见他生的干净俏丽，说话知趣，因笑道：|凤姐打量了她一下，见她长得干净俏丽，说话也懂事，就笑道：
“我的丫头今儿没跟进我来。我这会子想起一件事来，要使唤个人出去，不知你能干不能干，说的齐全不齐全？”|“我的丫头今天没跟我进来。我这会儿想起一件事，要打发个人出去，不知你能不能干，话能不能说周全？”
红玉笑道：“奶奶有什么话，只管吩咐我说去。若说的不齐全，误了奶奶的事，凭奶奶责罚就是了。”|红玉笑道：“奶奶有什么话，只管吩咐我去说。要是说得不周全，误了奶奶的事，任凭奶奶责罚。”
凤姐笑道：“你是那位小姐房里的？我使你出去，他回来找你，我好替你说的。”|凤姐笑道：“你是哪位小姐房里的？我打发你出去，她回来找你，我好替你说一声。”
红玉道：“我是宝二爷房里的。”|红玉说：“我是宝二爷房里的。”
凤姐听了笑道：“嗳哟！你原来是宝玉房里的，怪道呢。|凤姐听了笑道：“哎哟！原来你是宝玉房里的，怪不得呢。
也罢了，等他问，我替你说。|也好，等他问起来，我替你说。
你到我们家，告诉你平姐姐：外头屋里桌子上汝窑盘子架儿底下放著一卷银子，|你到我家去，告诉你平姐姐：外屋桌子上汝窑盘子架底下放着一卷银子，
那是一百六十两，给绣匠的工价，等张材家的来要，当面称给他瞧了，再给他拿去。|那是一百六十两，是给绣匠的工钱，等张材家的来要，当面称给她看了，再给她拿去。
再里头床头间有一个小荷包拿了来。”|再把里屋床头那儿的一个小荷包拿来。”
! 红玉“连忙弃了众人”跑过去，凤姐一招手，她就抓住了这个机会。

# 九、晴雯讥讽红玉
红玉听说撤身去了，回来只见凤姐不在这山坡子上了。|红玉听了转身就去了，回来时凤姐已经不在山坡上了。
因见司棋从山洞里出来，站著系裙子，便赶上来问道：“姐姐，不知道二奶奶往那里去了？”|看见司棋从山洞里出来，站着系裙子，就赶上去问：“姐姐，知不知道二奶奶到哪里去了？”
司棋道：“没理论。”|司棋说：“没留意。”
红玉听了，抽身又往四下里一看，只见那边探春宝钗在池边看鱼。|红玉听了，转身又往四下一看，只见探春、宝钗在那边池边看鱼。
红玉上来陪笑问道：“姑娘们可知道二奶奶那去了？|红玉上去赔笑问：“姑娘们知道二奶奶去哪里了吗？”
探春道：“往你大奶奶院里找去。”|探春说：“到你大奶奶院里去找。”
红玉听了，才往稻香村来，顶头只见晴雯，绮霰，碧痕，紫绡，麝月，待书，入画，莺儿等一群人来了。|红玉听了，才往稻香村去，迎面碰见晴雯、绮霰、碧痕、紫绡、麝月、待书、入画、莺儿等一群人走来。
晴雯一见了红玉，便说道：“你只是疯罢！院子里花儿也不浇，雀儿也不喂，茶炉子也不爖，就在外头逛。”|晴雯一见红玉，就说：“你就知道疯玩！院子里的花也不浇，鸟也不喂，茶炉子也不生火，只在外头逛。”
红玉道：“昨儿二爷说了，今儿不用浇花，过一日浇一回罢。我喂雀儿的时侯，姐姐还睡觉呢。”|红玉说：“昨天二爷说了，今天不用浇花，隔一天浇一回。我喂鸟的时候，姐姐还在睡觉呢。”
碧痕道：“茶炉子呢？”|碧痕说：“那茶炉子呢？”
红玉道：“今儿不该我爖的班儿，有茶没茶别问我。”|红玉说：“今天不该我生火的班，有茶没茶别问我。”
绮霰道：“你听听他的嘴！你们别说了，让他逛去罢。”|绮霰说：“你们听听她这张嘴！你们别说了，让她逛去吧。”
红玉道：“你们再问问我逛了没有。二奶奶使唤我说话取东西的。”|红玉说：“你们再问问我是不是在逛。是二奶奶使唤我传话取东西的。”
说著将荷包举给他们看，方没言语了，大家分路走开。|说着把荷包举起来给她们看，她们这才不说话了，大家分头走开。
晴雯冷笑道：“怪道呢！原来爬上高枝儿去了，把我们不放在眼里。|晴雯冷笑道：“怪不得呢！原来是攀上高枝儿了，不把我们放在眼里。
不知说了一句话半句话，名儿姓儿知道了不曾呢，就把他兴的这样！|不知道说了一句半句话，人家知不知道她叫什么名字呢，就把她得意成这样！
这一遭半遭儿的算不得什么，过了后儿还得听呵！|这一回两回的算不了什么，过了以后还得听我们使唤！
有本事从今儿出了这园子，长长远远的在高枝儿上才算得。”|有本事从今天起出了这园子，长长久久待在高枝上，那才算数。”
一面说著去了。|一边说着走了。
! 司棋从山洞出来“站著系裙子”，看似闲笔，却是伏笔：第七十一回、第七十二回揭出她和表哥潘又安在园中私会。
! 晴雯的刻薄话，也说中了怡红院的规矩：小丫头不许往上走，谁往上走就招人嫉恨。可讽刺的是，红玉真的“出了这园子”，到凤姐那里去了。

# 十、红玉回话，凤姐大赞
这里红玉听说，不便分证，只得忍著气来找凤姐儿。|红玉听了，不好争辩，只得忍着气去找凤姐。
到了李氏房中，果见凤姐儿在这里和李氏说话儿呢。|到了李纨房里，果然见凤姐在这里和李纨说话。
红玉上来回道：“平姐姐说，奶奶刚出来了，他就把银子收了起来，才张材家的来讨，当面称了给他拿去了。”|红玉上前回话：“平姐姐说，奶奶刚出来，她就把银子收起来了；刚才张材家的来要，当面称了给她拿去了。”
说著将荷包递了上去，又道：|说着把荷包递上去，又说：
“平姐姐教我回奶奶：才旺儿进来讨奶奶的示下，好往那家子去。|“平姐姐叫我回奶奶：刚才旺儿进来请奶奶的示下，好往那家去。
平姐姐就把那话按著奶奶的主意打发他去了。”|平姐姐就照奶奶的意思把他打发去了。”
凤姐笑道：“他怎么按我的主意打发去了？”|凤姐笑道：“她是怎么照我的意思打发的？”
红玉道：“平姐姐说：我们奶奶问这里奶奶好。|红玉说：“平姐姐说：我们奶奶问这里奶奶好。
原是我们二爷不在家，虽然迟了两天，只管请奶奶放心。|原是我们二爷不在家，虽然迟了两天，只管请奶奶放心。
等五奶奶好些，我们奶奶还会了五奶奶来瞧奶奶呢。|等五奶奶好些了，我们奶奶还要约上五奶奶一起来看奶奶呢。
五奶奶前儿打发了人来说，舅奶奶带了信来了，问奶奶好，|五奶奶前天打发人来说，舅奶奶带了信来，问奶奶好，
还要和这里的姑奶奶寻两丸延年神验万全丹。|还想跟这里的姑奶奶要两丸延年神验万全丹。
若有了，奶奶打发人来，只管送在我们奶奶这里。|要是有了，奶奶打发人来，只管送到我们奶奶这里。
明儿有人去，就顺路给那边舅奶奶带去的。”|明天有人去，就顺路给那边舅奶奶带去。”
话未说完，李氏道：“嗳哟哟！这些话我就不懂了。什么‘奶奶’‘爷爷’的一大堆。”|话还没说完，李纨就说：“哎哟哟！这些话我可听不懂了。什么‘奶奶’‘爷爷’的一大堆。”
凤姐笑道：“怨不得你不懂，这是四五门子的话呢。”|凤姐笑道：“难怪你不懂，这是牵扯到四五家人的话呢。”
! 这一大段话里有五六个“奶奶”，李纨都听糊涂了，红玉却说得一清二楚。“我们奶奶”是凤姐，“这里奶奶”是那家的主母，“五奶奶”“舅奶奶”“姑奶奶”又各是一人。
! 红玉的口齿伶俐，正是凤姐最看重的。凤姐手下要的就是这样能办事的人。

# 十一、凤姐要认干女儿
说著又向红玉笑道：“好孩子，难为你说的齐全。别象他们扭扭捏捏的蚊子似的。|说着又对红玉笑道：“好孩子，难为你说得这么周全。不像她们扭扭捏捏的，跟蚊子哼哼似的。
嫂子你不知道，如今除了我随手使的几个丫头老婆之外，我就怕和他们说话。|嫂子你不知道，如今除了我手边用惯的几个丫头婆子，我最怕跟别人说话。
他们必定把一句话拉长了作两三截儿，咬文咬字，拿著腔儿，哼哼唧唧的，急的我冒火，他们那里知道！|她们一定要把一句话拉长成两三截，咬文嚼字，拿腔拿调，哼哼唧唧的，急得我直冒火，她们哪里知道！
先时我们平儿也是这么著，我就问著他：难道必定装蚊子哼哼就是美人了？|以前我们平儿也是这样，我就问她：难道一定要装蚊子哼哼才算美人？
说了几遭才好些儿了。”|说了几回才好些了。”
李宫裁笑道：“都象你泼皮破落户才好。”|李纨笑道：“都像你这个泼辣货才好。”
凤姐又道：“这一个丫头就好。方才两遭，说话虽不多，听那口声就简断。”|凤姐又说：“这个丫头就好。刚才两回，话虽不多，听那口气就干脆利落。”
说著又向红玉笑道：“你明儿伏侍我去罢。我认你作女儿，我一调理你就出息了。”|说着又对红玉笑道：“你以后跟着我吧。我认你做干女儿，我一调教你，你就出息了。”
红玉听了，扑哧一笑。|红玉听了，扑哧一笑。
凤姐道：“你怎么笑？你说我年轻，比你能大几岁，就作你的妈了？你还作春梦呢！|凤姐说：“你笑什么？你是说我年轻，比你大不了几岁，就做你的妈了？你还做梦呢！
你打听打听，这些人头比你大的大的，赶著我叫妈，我还不理。今儿抬举了你呢！”|你去打听打听，那些比你大得多的人，追着叫我妈，我还不理呢。今天是抬举你！”
红玉笑道：“我不是笑这个，我笑奶奶认错了辈数了。|红玉笑道：“我不是笑这个，我是笑奶奶认错了辈分了。
我妈是奶奶的女儿，这会子又认我作女儿。”|我妈是奶奶的干女儿，这会儿又认我做女儿。”
凤姐道：“谁是你妈？”|凤姐说：“谁是你妈？”
李宫裁笑道：“你原来不认得他？他是林之孝之女。”|李纨笑道：“原来你不认得她？她是林之孝的女儿。”
凤姐听了十分诧异，说道：“哦！原来是他的丫头。”|凤姐听了十分惊讶，说：“哦！原来是她的女儿。”
又笑道：“林之孝两口子都是锥子扎不出一声儿来的。|又笑道：“林之孝两口子都是锥子扎也扎不出一声来的。
我成日家说，他们倒是配就了的一对夫妻，一个天聋，一个地哑。|我常说他们倒是天生一对，一个天聋，一个地哑。
那里承望养出这么个伶俐丫头来！你十几岁了？”|哪里想到养出这么个伶俐丫头来！你十几岁了？”
红玉道：“十七岁了。”|红玉说：“十七岁了。”
! 林之孝家的比凤姐大得多，却认凤姐做干娘。大户人家的管家媳妇，靠攀附主子来保住地位。
! “天聋地哑”是说林之孝夫妇少言寡语，偏偏生出一个能说会道的女儿。

# 十二、“红玉”改名“红儿”
又问名字，红玉道：“原叫红玉的，因为重了宝二爷，如今只叫红儿了。”|又问名字，红玉说：“原来叫红玉，因为跟宝二爷的名字重了，现在只叫红儿。”
凤姐听说将眉一皱，把头一回，说道：“讨人嫌的很！得了玉的益似的，你也玉，我也玉。”|凤姐听了把眉一皱，把头一扭，说：“真讨厌！好像沾了‘玉’字就有好处似的，你也玉，我也玉。”
因说道：“既这么著肯跟，我还和他妈说，|又说：“既然这样，你愿意跟我，我还得跟你妈说一声。
‘赖大家的如今事多，也不知这府里谁是谁，你替我好好的挑两个丫头我使’，他一般答应著。|我原跟她说过：‘赖大家的如今事多，也不知道府里谁是谁，你替我好好挑两个丫头给我用’，她也答应了。
他饶不挑，倒把这女孩子送了别处去。难道跟我必定不好？”|她不但不挑，倒把自己的女儿送到别处去了。难道跟着我就一定不好？”
李氏笑道：“你可是又多心了。他进来在先，你说话在后，怎么怨的他妈！”|李纨笑道：“你又多心了。她进园在先，你说话在后，怎么能怪她妈！”
凤姐道：“既这么著，明儿我和宝玉说，叫他再要人去，叫这丫头跟我去。|凤姐说：“既然这样，明天我跟宝玉说，叫他另外再要人，让这丫头跟我。
可不知本人愿意不愿意？”|只是不知道她自己愿意不愿意？”
红玉笑道：“愿意不愿意，我们也不敢说。|红玉笑道：“愿意不愿意，我们也不敢说。
只是跟著奶奶，我们也学些眉眼高低，出入上下，大小的事也得见识见识。”|只是跟着奶奶，我们也能学些察言观色、进退应对，大大小小的事也能见识见识。”
刚说著，只见王夫人的丫头来请，凤姐便辞了李宫裁去了。|正说着，王夫人的丫头来请，凤姐就辞别李纨走了。
红玉回怡红院去，不在话下。|红玉回怡红院去了，不必细说。
! 一个丫头叫“红玉”，就因为“重了宝二爷”的名字而要改掉。“玉”字在贾府是忌讳，下人不能和主子重名。
! 红玉嘴上说“不敢说”，下一句就把愿意说得明明白白。她在怡红院熬不出头，在凤姐这里终于有了出路。

# 十三、宝玉追黛玉
如今且说林黛玉因夜间失寐，次日起来迟了，闻得众姊妹都在园中作饯花会，恐人笑他痴懒，连忙梳洗了出来。|再说林黛玉因为夜里没睡好，第二天起晚了，听说姐妹们都在园里饯花，怕别人笑她又痴又懒，连忙梳洗了出来。
刚到了院中，只见宝玉进门来了，笑道：“好妹妹，你昨儿可告我了不曾？教我悬了一夜心。”|刚到院子里，只见宝玉进门来了，笑道：“好妹妹，你昨天告我了没有？叫我悬了一夜的心。”
林黛玉便回头叫紫鹃道：“把屋子收拾了，撂下一扇纱屉，看那大燕子回来，把帘子放下来，拿狮子倚住，烧了香就把炉罩上。”|林黛玉就回头叫紫鹃说：“把屋子收拾好，放下一扇纱窗，看着那大燕子回来了，就把帘子放下来，拿狮子镇纸压住，烧完了香就把炉子罩上。”
一面说一面又往外走。|一边说一边又往外走。
宝玉见他这样，还认作是昨日中晌的事，那知晚间的这段公案，还打恭作揖的。|宝玉见她这样，还以为是为了昨天中午的事，哪里知道晚上还有这一段公案，还在那里作揖赔礼。
林黛玉正眼也不看，各自出了院门，一直找别的姊妹去了。|林黛玉正眼也不看他，自己出了院门，一直找别的姐妹去了。
宝玉心中纳闷，自己猜疑：看起这个光景来，不象是为昨日的事，|宝玉心里纳闷，自己猜想：看这个样子，不像是为了昨天那件事，
但只昨日我回来的晚了，又没有见他，再没有冲撞了他的去处了。|可是昨天我回来得晚，又没见到她，再没有别的地方冲撞她了呀。
一面想，一面由不得随后追了来。|一边想，一边不由自主地跟着追了出去。
! 宝玉以为黛玉还在气他说《西厢记》的话，哪知道是晴雯不开门那件事。两人各自误会，都没说破。
! 黛玉不理宝玉，却对紫鹃吩咐一长串琐事：燕子、帘子、香炉。故意说给宝玉听，就是不跟他说话。

# 十四、探春托宝玉买小玩意
只见宝钗探春正在那边看鹤舞，见黛玉去了，三个一同站著说话儿。|只见宝钗、探春正在那边看仙鹤跳舞，见黛玉来了，三个人一起站着说话。
又见宝玉来了，探春便笑道：“宝哥哥，身上好？我整整的三天没见你了。”|又见宝玉来了，探春就笑道：“宝哥哥，身体好吗？我整整三天没见你了。”
宝玉笑道：“妹妹身上好？我前儿还在大嫂子跟前问你呢。”|宝玉笑道：“妹妹身体好吗？我前天还在大嫂子那里问起你呢。”
探春道：“宝哥哥，你往这里来，我和你说话。”|探春说：“宝哥哥，你到这边来，我跟你说句话。”
宝玉听说，便跟了他，离了钗，玉两个，到了一棵石榴树下。|宝玉听了，就跟着她，离开宝钗、黛玉两人，到了一棵石榴树下。
探春因说道：“这几天老爷可曾叫你？”|探春就问：“这几天老爷叫过你没有？”
宝玉笑道：“没有叫。”|宝玉笑道：“没有叫。”
探春说：“昨儿我恍惚听见说老爷叫你出去的。”|探春说：“昨天我恍惚听说老爷叫你出去了。”
宝玉笑道：“那想是别人听错了，并没叫的。”|宝玉笑道：“那想必是别人听错了，并没有叫。”
探春又笑道：“这几个月，我又攒下有十来吊钱了，你还拿了去，|探春又笑道：“这几个月，我又攒了十来吊钱，你还是拿去，
明儿出门逛去的时侯，或是好字画，好轻巧顽意儿，替我带些来。”|以后出门逛的时候，或是好字画，或是好的小巧玩意儿，替我带些来。”
宝玉道：“我这么城里城外，大廊小庙的逛，也没见个新奇精致东西，|宝玉说：“我这样城里城外、大集小庙地逛，也没见什么新奇精致的东西，
左不过是那些金玉铜磁没处撂的古董，再就是绸缎吃食衣服了。”|左不过是那些金的玉的铜的瓷的、没地方放的古董，再就是绸缎、吃的、穿的了。”
探春道：“谁要这些。|探春说：“谁要这些。
怎么象你上回买的那柳枝儿编的小篮子，整竹子根抠的香盒儿，胶泥垛的风炉儿，这就好了。|像你上回买的那个柳条编的小篮子、整块竹根挖的香盒、胶泥捏的小风炉，这就很好。
我喜欢的什么似的，谁知他们都爱上了，都当宝贝似的抢了去了。”|我喜欢得不得了，谁知她们都爱上了，都当宝贝似的抢去了。”
宝玉笑道：“原来要这个。这不值什么，拿五百钱出去给小子们，管拉一车来。”|宝玉笑道：“原来要这个。这不值什么，拿五百钱给小厮们，保管拉一车来。”
探春道：“小厮们知道什么。|探春说：“小厮们懂什么。
你拣那朴而不俗，直而不拙者，这些东西，你多多的替我带了来。|你挑那些朴素而不俗气、简单而不笨拙的，这样的东西多替我带些来。
我还像上回的鞋作一双你穿，比那一双还加工夫，如何呢？”|我还像上回那样给你做一双鞋穿，比那一双还下工夫，怎么样？”
! 探春一开口先问“老爷可曾叫你”，可见她也关心宝玉。她在姐妹里最有主见，喜欢的东西“朴而不俗，直而不拙”，这也是她自己的性格。

# 十五、探春的怒气
宝玉笑道：“你提起鞋来，我想起个故事：那一回我穿著，可巧遇见了老爷，老爷就不受用，问是谁作的。|宝玉笑道：“你一提鞋，我想起一件事：那回我穿着，正好碰见老爷，老爷就不高兴，问是谁做的。
我那里敢提‘三妹妹’三个字，我就回说是前儿我生日，是舅母给的。|我哪敢提‘三妹妹’三个字，就回说是前些天我过生日，舅母给的。
老爷听了是舅母给的，才不好说什么，半日还说：‘何苦来！虚耗人力，作践绫罗，作这样的东西。’|老爷听说是舅母给的，才不好说什么，半天还说：‘何苦呢！白费人力，糟蹋绫罗，做这样的东西。’
我回来告诉了袭人，袭人说这还罢了，赵姨娘气的抱怨的了不得：|我回来告诉了袭人，袭人说这还算好的，赵姨娘气得抱怨个不停：
‘正经兄弟，鞋搭拉袜搭拉的没人看的见，且作这些东西！’”|‘自己的亲兄弟，鞋子袜子破破烂烂没人管，倒去做这些东西！’”
探春听说，登时沉下脸来，道：“这话糊涂到什么田地！|探春听了，立刻沉下脸来说：“这话糊涂到什么地步了！
怎么我是该作鞋的人么？环儿难道没有分例的，没有人的？|难道我是该做鞋的人吗？环儿难道没有份例、没有人伺候？
一般的衣裳是衣裳，鞋袜是鞋袜，丫头老婆一屋子，怎么抱怨这些话！给谁听呢！|衣裳照样是衣裳，鞋袜照样是鞋袜，丫头婆子一屋子，怎么抱怨这些话！说给谁听呢！
我不过是闲著没事儿，作一双半双，爱给那个哥哥弟弟，随我的心。谁敢管我不成！|我不过是闲着没事，做一双半双，爱给哪个哥哥弟弟，随我的心意。谁敢管我不成！
这也是白气。”|这也是白生气。”
宝玉听了，点头笑道：“你不知道，他心里自然又有个想头了。”|宝玉听了，点头笑道：“你不知道，她心里自然又有她的想法。”
探春听说，益发动了气，将头一扭，说道：“连你也糊涂了！|探春听了，越发生气，把头一扭，说：“连你也糊涂了！
他那想头自然是有的，不过是那阴微鄙贱的见识。|她那想法自然是有的，不过是些阴暗卑贱的见识。
他只管这么想，我只管认得老爷，太太两个人，别人我一概不管。|她只管这么想，我只认老爷、太太两个人，别人我一概不管。
就是姊妹弟兄跟前，谁和我好，我就和谁好，什么偏的庶的，我也不知道。|就是在姐妹兄弟面前，谁和我好，我就和谁好，什么嫡出庶出的，我也不管。
论理我不该说他，但忒昏愦的不象了！|论理我不该说她，可她也太糊涂得不像话了！
还有笑话呢：就是上回我给你那钱，替我带那顽的东西。|还有更可笑的呢：就是上回我给你钱，托你带玩意儿那件事。
过了两天，他见了我，也是说没钱使，怎么难，我也不理论。|过了两天，她见了我，又说没钱用，怎么怎么难，我也不理她。
谁知后来丫头们出去了，他就抱怨起来，说我攒的钱为什么给你使，倒不给环儿使呢。|谁知后来丫头们出去了，她就抱怨起来，说我攒的钱为什么给你用，倒不给环儿用。
我听见这话，又好笑又好气，我就出来往太太跟前去了。”|我听了这话，又好笑又好气，就出来到太太那里去了。”
正说著，只见宝钗那边笑道：“说完了，来罢。|正说着，只听宝钗在那边笑道：“说完了没有，过来吧。
显见的是哥哥妹妹了，丢下别人，且说梯己去。我们听一句儿就使不得了！”|看得出是亲哥哥亲妹妹，丢下别人说悄悄话去了。我们听一句都不行！”
说著，探春宝玉二人方笑著来了。|说着，探春和宝玉才笑着过来了。
! 赵姨娘是探春的生母，贾环是她的同母弟弟。探春却说“我只管认得老爷，太太两个人”，不认自己的亲娘。
! 探春是庶出，这是她一生的痛处。她越想摆脱“庶出”的身份，就越要和生母划清界限。第五十五回她理家时，和赵姨娘还有一场大冲突。

# 十六、宝玉兜着落花去花冢
宝玉因不见了林黛玉，便知他躲了别处去了，|宝玉见林黛玉不见了，就知道她躲到别处去了，
想了一想，索性迟两日，等他的气消一消再去也罢了。|想了想，干脆过两天，等她气消了再去找她。
因低头看见许多凤仙石榴等各色落花，锦重重的落了一地，|低头看见许多凤仙花、石榴花等各色落花，像锦缎一样厚厚铺了一地，
因叹道：“这是他心里生了气，也不收拾这花儿来了。待我送了去，明儿再问著他。”|就叹道：“这是她心里生气，连花也不来收拾了。等我送去，明天再问她。”
说著，只见宝钗约著他们往外头去。|说着，只见宝钗约她们往外边去。
宝玉道：“我就来。”|宝玉说：“我就来。”
说毕，等他二人去远了，便把那花兜了起来，登山渡水，过树穿花，|说完，等她们两个走远了，就把落花兜起来，爬山过水，穿树绕花，
一直奔了那日同林黛玉葬桃花的去处来。|一直奔向那天和林黛玉一起葬桃花的地方。
将已到了花冢，犹未转过山坡，只听山坡那边有呜咽之声，一行数落著，哭的好不伤感。|快到花冢了，还没转过山坡，就听见山坡那边有呜咽的声音，一边念叨一边哭，哭得好不伤心。
宝玉心下想道：“这不知是那房里的丫头，受了委曲，跑到这个地方来哭。”|宝玉心里想：“这不知是哪房的丫头受了委屈，跑到这里来哭。”
一面想，一面煞住脚步，听他哭道是：|一边想，一边停下脚步，听她哭着念道：
! 花冢是第二十三回宝玉和黛玉一起葬桃花时堆的。那天两人还在花下共读《西厢记》，如今却一个躲着一个。

# 十七、葬花吟
~花谢花飞花满天，红消香断有谁怜？|花儿凋谢，花瓣飞满天空；红色褪去，香气消散，有谁来怜惜？
~游丝软系飘春榭，落絮轻沾扑绣帘。|柔软的蛛丝飘挂在春天的亭榭上，飘落的柳絮轻轻沾上绣帘。
~闺中女儿惜春暮，愁绪满怀无释处，|闺中的女儿怜惜春天将尽，满怀愁绪无处排解，
~手把花锄出绣闺，忍踏落花来复去。|手拿花锄走出绣房，怎么忍心在落花上走来走去。
~柳丝榆荚自芳菲，不管桃飘与李飞。|柳丝和榆钱只顾自己繁茂，不管桃花李花飘落。
~桃李明年能再发，明年闺中知有谁？|桃花李花明年还能再开，明年闺房中还有谁在？
~三月香巢已垒成，梁间燕子太无情！|三月里燕子已经垒好了香巢，梁间的燕子太无情！
~明年花发虽可啄，却不道人去梁空巢也倾。|明年花开时虽然还能衔花筑巢，却不知道到时人已离去，屋梁空了，巢也倒了。
~一年三百六十日，风刀霜剑严相逼，|一年三百六十天，风像刀、霜像剑，严酷地逼迫着，
~明媚鲜妍能几时，一朝飘泊难寻觅。|鲜艳美丽能有多久？一旦漂泊零落，就再也难以寻找。
~花开易见落难寻，阶前闷杀葬花人，|花开时容易看见，落了就难以寻找，阶前愁坏了葬花的人，
~独倚花锄泪暗洒，洒上空枝见血痕。|独自倚着花锄暗暗落泪，泪洒在空枝上，看去像血痕。
~杜鹃无语正黄昏，荷锄归去掩重门。|杜鹃不再啼叫，正是黄昏，扛着花锄回去，掩上一重重门。
~青灯照壁人初睡，冷雨敲窗被未温。|青灯照着墙壁，人刚躺下，冷雨敲打着窗子，被子还没暖。
~怪奴底事倍伤神，半为怜春半恼春：|要问我为什么格外伤心，一半是怜惜春天，一半是恼恨春天：
~怜春忽至恼忽去，至又无言去不闻。|怜它忽然来到，恼它忽然离去；来时不说话，去时也无声无息。
~昨宵庭外悲歌发，知是花魂与鸟魂？|昨夜庭院外传来悲歌，不知是花的魂还是鸟的魂？
~花魂鸟魂总难留，鸟自无言花自羞。|花魂鸟魂都难以挽留，鸟儿默默无言，花儿独自含羞。
~愿奴胁下生双翼，随花飞到天尽头。|但愿我肋下生出一对翅膀，跟着落花飞到天的尽头。
~天尽头，何处有香丘？|天的尽头，哪里有埋葬香花的坟丘？
~未若锦囊收艳骨，一抔净土掩风流。|不如用锦囊收起花的遗骸，用一捧干净的泥土掩埋它的风流。
~质本洁来还洁去，强于污淖陷渠沟。|它本来洁净地来，还要洁净地去，总比陷落在污泥沟渠里强。
~尔今死去侬收葬，未卜侬身何日丧？|你今天死去有我来收葬，不知道我自己哪一天死去？
~侬今葬花人笑痴，他年葬侬知是谁？|我今天葬花，别人笑我痴；将来葬我的，不知会是谁？
~试看春残花渐落，便是红颜老死时。|看那春天将尽、花儿渐落，就是美人老去死亡的时候。
~一朝春尽红颜老，花落人亡两不知！|一旦春天过去，红颜老去，花落了，人也死了，两下都无人知晓！
宝玉听了不觉痴倒。|宝玉听了，不由得痴痴地呆住了。
要知端详，且听下回分解。|要知后事如何，请看下回。
! 《葬花吟》是黛玉一生的写照，也是她为自己写的挽歌。“质本洁来还洁去”，是她的人格；“他年葬侬知是谁”，是她的结局。
! “风刀霜剑严相逼”，写的是花，也是她寄人篱下的处境。“一年三百六十日”这句，后来常被人引来说黛玉在贾府的日子。
! 前八十回之后，黛玉“泪尽而逝”，花落人亡，正应了这首诗。宝玉听到“痴倒”，下一回他由花想到人，由人想到自己，想到最后一切都“无可寻觅”。
