<script type="text/plain" id="ch1">
# 楔子：作者自述
作者自云：因曾历过一番梦幻之后，故将真事隐去，而借通灵之说，撰此《石头记》一书也。|作者自己说：我经历过一番像梦一样的人生起落，所以把真事藏起来，借“通灵宝玉”的说法，写了《石头记》这本书。
故曰“甄士隐梦幻识通灵”。|所以这一回的标题叫“甄士隐梦幻识通灵”（“甄士隐”谐音“真事隐”）。
但书中所记何事，又因何而撰是书哉？|那书里写的是什么事？为什么要写这本书呢？
自又云：今风尘碌碌，一事无成，忽念及当日所有之女子，一一细推了去，觉其行止见识，皆出于我之上。|作者又说：我现在在世上忙忙碌碌，什么也没做成。忽然想起当年身边的那些女子，一个个细想下来，觉得她们的为人和见识都比我强。
何我堂堂之须眉，曾不若彼裙钗哉！|我一个堂堂男子汉，怎么反倒不如那些女孩子！（须眉指男子，裙钗指女子）
实愧则有余，悔又无益之大无可奈何之日也！|真是惭愧极了，后悔又没用，实在是无可奈何啊！
当此时，则自欲将已往所赖，上赖天恩，下承祖德，锦衣纨绔之时、饫甘餍美肥之日，|所以我想把过去写下来：那时上靠皇恩，下靠祖宗留下的家业，穿的是绫罗绸缎，吃的是山珍海味；
背父母教育之恩，负师兄规训之德，已至今日一事无成、半生潦倒之罪，编述一记，以告普天下人。|我却辜负了父母的教导和师友的规劝，落到今天一事无成、半辈子潦倒。我要把这些罪过写成一本书，告诉天下人。
我之罪固不能免，然闺阁中本自历历有人，万不可因我之不肖，自护其短，则一并使其泯灭也。|我的罪过当然逃不掉，可闺阁里确实有那么多了不起的女子。我不能因为自己不成器、想掩饰短处，就让她们也一起被埋没。
虽今日之茆椽蓬牖，瓦灶绳床，其风晨月夕，阶柳庭花，亦未有伤于我之襟怀笔墨者。|虽然我现在住茅草屋，用瓦灶、睡绳床，可清晨的风、夜里的月、阶前的柳、院里的花，都没有坏了我的心情，也没妨碍我写作。
虽我未学，下笔无文，何为不用假语村言，敷演出一段故事来，以悦人之耳目哉。|我虽然没学问，写不出好文章，可为什么不用些编出来的大白话，讲一段故事让大家看个高兴呢？（“假语村言”谐音“贾雨村”）
故曰“风尘怀闺秀”，乃是第一回题纲正义也。|所以标题又叫“风尘怀闺秀”，这就是第一回标题的本意。
开卷即云“风尘怀闺秀”，则知作者本意原为记述当日闺友闺情，并非怨世骂时之书矣。|一开头就说“风尘怀闺秀”，可见作者是要记下当年那些女子和她们的感情，不是要写一本骂社会、骂时政的书。
虽一时有涉于世态，然亦不得不叙者，但非其本旨耳，阅者切记之。|书里有时也会写到世态人情，那是不得不写，但不是重点，读者一定要记住。
诗曰：|有一首诗这样说：
~浮生着甚苦奔忙？盛席华筵终散场。|人生短暂，何必辛苦奔忙？再热闹的宴席，最后也要散场。
~悲喜千般同幻渺，古今一梦尽荒唐。|各种悲喜都像幻影一样虚无，从古到今就像一场梦，全是荒唐。
~谩言红袖啼痕重，更有情痴抱恨长。|别说女子们哭得满脸泪痕，还有痴情的人，心里的遗憾更长久。（谩言就是“别说”，红袖指女子）
~字字看来皆是血，十年辛苦不寻常！|这本书每个字都像是用血写的，这十年的辛苦可不一般！
! 这一段其实是早期评点者写的批语，后来被混进了正文，所以读起来像作者在讲话。真正的故事从下一段开始。

# 一、说书人开场
列位看官，你道此书从何而来？|各位读者，你们知道这本书是从哪儿来的吗？
说起根由虽近荒唐，细谙则深有趣味。|说起来历，听着有点荒唐，可细细品味，又很有意思。
待在下将此来历注明，方使闻者了然不惑。|等我把来历讲清楚，大家就明白了。
! 从这里起换成了说书人的口吻（“列位看官”“在下”），真正的故事开始了。
! “荒唐”接着前面的“满纸荒唐言”，又引出下一段的“大荒山”：表面越荒唐，越要细读。

# 二、女娲补天剩下的一块石头
原来，当年女娲氏炼石补天之时，于大荒山无稽崖炼成高经十二丈，方经二十四丈顽石三万六千五百零一块。|原来当年女娲炼石补天的时候，在大荒山无稽崖炼出了三万六千五百零一块顽石，每块高十二丈、宽二十四丈。
娲皇氏只用了三万六千五百块，只单单剩了一块未用，便弃在此山青埂峰下。|女娲只用了三万六千五百块，偏偏剩下一块没用上，就把它扔在了这座山的青埂峰下。
谁知此石自经煅炼之后，灵性已通，因见众石俱得补天，独自己无材不堪入选，|谁知道这块石头经过冶炼以后有了灵性。它看见别的石头都去补天了，只有自己因为没本事没被选上，
遂自怨自嗟，日夜悲号惭愧。|就自怨自叹，日日夜夜哭着，觉得很惭愧。
! 地名全是谐音：大荒山＝荒唐，无稽崖＝无稽之谈，青埂峰＝“情根”。
! 据脂批，“十二丈”对应金陵十二钗，“二十四丈”对应正副十二钗。
! 唯一“无用”的石头就是后来的贾宝玉，也是作者的自喻：石头的“惭愧”对应前文作者的“实愧则有余”。
! 这个“石”后来和林黛玉的“木”（绛珠仙草）组成“木石前盟”，与宝钗的“金玉良缘”相对。

# 三、一僧一道带石头下凡
一日，正当嗟悼之余，俄见一僧一道远远而来，生得骨骼不凡，丰神迥异，说说笑笑来至峰下，坐于石边高谈快论。|有一天，石头正在伤心叹气，忽然看见一个和尚和一个道士远远走来。两人骨相不凡，气度出众，说说笑笑来到峰下，坐在石头旁边聊得正起劲。
先是说些云山雾海神仙玄幻之事，后便说到红尘中荣华富贵。|先是聊些仙山云海、神仙玄妙的事，后来又聊到人间的荣华富贵。
此石听了，不觉打动凡心，也想要到人间去享一享这荣华富贵，但自恨粗蠢，不得已，便口吐人言，向那僧道说道：|石头听了，不知不觉动了凡心，也想到人间去享受享受。可它恨自己又粗又笨，没办法，只好开口说人话，对和尚道士说：
“大师，弟子蠢物，不能见礼了。|“两位大师，我是个笨东西，没法给您行礼了。
适闻二位谈那人世间荣耀繁华，心切慕之。|刚才听您二位谈人间的荣华热闹，我心里羡慕得很。
弟子质虽粗蠢，性却稍通，况见二师仙形道体，定非凡品，必有补天济世之材，利物济人之德。|我虽然外表粗笨，灵性还是有一点的。看您二位仙风道骨，一定不是凡人，必定有补天救世的本领、造福众人的德行。
如蒙发一点慈心，携带弟子得入红尘，在那富贵场中，温柔乡里受享几年，自当永佩洪恩，万劫不忘也。”|要是您肯发发慈悲，带我到人间去，在富贵人家、温柔乡里享几年福，我一定永远记着您的大恩，生生世世都不忘。”
二仙师听毕，齐憨笑道：“善哉，善哉！那红尘中有却有些乐事，但不能永远依恃。|两位仙师听完，一起笑道：“好啊，好啊！人间快乐的事倒是有一些，但靠不长久。
况又有美中不足、好事多魔八个字紧相连属，瞬息间则又乐极悲生，人非物换，究竟是到头一梦，万境归空，倒不如不去的好。”|况且“美中不足、好事多磨”这八个字总是紧跟着。转眼间就乐极生悲、物是人非，到头来不过一场梦，一切成空，还不如不去的好。”（“魔”在这里同“磨”）
这石凡心已炽，那里听得进这话去，乃复苦求再四。|石头的凡心已经烧得正旺，哪里听得进去，又再三苦苦哀求。
二仙知不可强制，乃叹道：“此亦静极思动，无中生有之数也。|两位仙人知道拦不住，就叹气说：“这也是静久了就想动、从无中生出有来的定数啊。
既如此，我们便携你去受享受享，只是到不得意时，切莫后悔。”|既然这样，我们就带你去享受享受。只是等你不如意的时候，千万别后悔。”
石道：“自然，自然。”|石头说：“当然，当然。”
那僧又道：“若说你性灵，却又如此质蠢，并更无奇贵之处。如此也只好踮脚而已。|和尚又说：“说你有灵性吧，你又这么笨重，也没什么稀奇珍贵的地方。这样子，也只能给人当个垫脚的陪衬罢了。
也罢，我如今大施佛法助你助，待劫终之日，复还本质，以了此案。你道好否？”|也罢，我现在就施展法力帮你一把。等这一劫结束，你再变回原样，把这桩事了结。你看好不好？”
石头听了，感谢不尽。|石头听了，感激不尽。
那僧便念咒书符，大展幻术，将一块大石登时变成一块鲜明莹洁的美玉，且又缩成扇坠大小的可佩可拿。|和尚就念咒画符，大施幻术，一下子把这块大石头变成了一块鲜亮晶莹的美玉，还缩成扇坠那么大，能戴在身上，也能拿在手里。
那僧托于掌上，笑道：“形体倒也是个宝物了！还只没有实在的好处，须得再镌上数字，使人一见便知是奇物方妙。|和尚把它托在掌心，笑着说：“样子倒像个宝贝了！可还没有真正的好处，得再刻上几个字，让人一看就知道是件奇物才好。
然后携你到那昌明隆盛之邦，诗礼簪缨之族，花锦繁华之地，温柔富贵之乡去安身乐业。”|然后带你到一个繁荣昌盛的国家、一户读书做官的世家、一处花团锦簇的繁华之地、一个温柔富贵的人家去安身享福。”
石头听了，喜不能禁，乃问：“不知弟子那几件奇处，又不知携了弟子到何处？望乞明示，使弟子不惑。”|石头听了，高兴得不得了，就问：“不知道我有哪几样奇特之处？又要带我去哪里？求您说明白，让我心里有个数。”
那僧笑道：“你且莫问，日后自然明白的。”|和尚笑道：“你先别问，以后自然就明白了。”
说着，便袖了那石，同那道人飘然而去，竟不知投奔何方何舍。|说完就把石头揣进袖子里，跟道士飘飘然走了，也不知去了哪里、投奔了谁家。
! 这一僧一道贯穿全书：仙界叫茫茫大士、渺渺真人，人间化成癞头和尚、跛足道人，每到关键时刻就会出现。
! “美中不足、好事多磨”“到头一梦，万境归空”是全书总纲，也预告了结局。
! 美玉就是“通灵宝玉”，宝玉衔玉而生；刻的字到第八回才揭晓。
! 据脂批，四个地方分别暗指京城、荣国府、大观园和宝玉的住处。

# 四、空空道人发现石头上的故事
后来，又不知过了几世几劫，因有个空空道人访道求仙，忽从这大荒山无稽崖青埂峰下经过，忽见一大块石上字迹分明，编述历历。|又不知过了多少世、多少劫，有个空空道人到处寻仙访道，正好路过大荒山无稽崖青埂峰下，忽然看见一块大石头上刻满了字，清清楚楚，有头有尾。
空空道人乃从头一看，原来就是无材补天，幻形入世，蒙茫茫大士，渺渺真人携入红尘，历尽离合悲欢炎凉世态的一段故事。|空空道人从头读下去，原来写的就是这块石头的故事：它因为没本事补天，变了模样来到人间，被茫茫大士、渺渺真人带进红尘，经历了种种离合悲欢、人情冷暖。
后面又有一首偈云：|故事后面还有一首偈（佛家的诗）：
~无材可与补苍天，枉入红尘若许年！|我没有本事去补苍天，白白在人间过了这么多年！
~此系身前身后事，倩谁寄去作神传？|这是我投胎前、投胎后的经历，请谁把它带到世上去流传呢？
诗后便是此石坠落之乡，投胎之处，亲自经历的一段陈迹故事。|诗后面写的，就是这块石头落到了哪里、投生在哪户人家，以及它亲身经历的一段往事。
其中家庭闺阁琐事，以及闲情诗词倒还全备，或可适趣解闷，然朝代年纪，地舆邦国，却反失落无考。|里面家里和闺阁中的琐事，还有闲时写的诗词，倒都很齐全，可以拿来消遣解闷；可是什么朝代、哪一年、在什么地方、什么国家，反倒都没写，查不出来。
! “石头记”就是“刻在石头上的记录”。石头回到青埂峰，说明结局已定：一切终归是空。
! 故意不写朝代，许多研究者认为是为了避开清代的文字狱。

# 五、空空道人和石头的对话
空空道人遂向石头说道：“石兄，你这一段故事，据你自己说有些趣味，故编写在此，意欲问世传奇。|空空道人就对石头说：“石兄，你这段故事，照你自己说挺有意思，所以刻在这里，想让它流传到世上。
据我看来，第一件，无朝代年纪可考，第二件，并无大贤大忠理朝廷治风俗的善政，其中只不过几个异样女子，或情或痴，或小才微善，亦无班姑，蔡女之德能。|可依我看，第一，它没有朝代年份可查；第二，它没写大贤大忠的人治理朝廷、整顿风俗。里面只有几个与众不同的女子，有的多情，有的痴心，有的有点小才小德，也比不上班昭、蔡文姬那样的才德。
我纵抄去，恐世人不爱看呢。”|我就算抄回去，恐怕世人也不爱看。”
石头笑答道：“我师何太痴耶！|石头笑着回答：“师父您怎么这么死心眼！
若云无朝代可考，今我师竟假借汉唐等年纪添缀，又有何难？|要是嫌没有朝代，您随便借个汉朝、唐朝的年号添上去，有什么难的？
但我想，历来野史，皆蹈一辙，莫如我这不借此套者，反倒新奇别致，不过只取其事体情理罢了，又何必拘拘于朝代年纪哉！|可我想，以前的野史小说都是一个套路，倒不如我这样不套老路子的，反而新鲜别致。只要事情合情合理就行，何必死抠朝代年份！
再者，市井俗人喜看理治之书者甚少，爱适趣闲文者特多。|再说，普通百姓爱看讲治国道理的书的很少，爱看消遣闲书的特别多。
历来野史，或讪谤君相，或贬人妻女，奸淫凶恶，不可胜数。|以前的野史，有的讥讽诽谤君王宰相，有的败坏别人妻女的名声，写奸淫凶恶的数都数不过来。
更有一种风月笔墨，其淫秽污臭，屠毒笔墨，坏人子弟，又不可胜数。|还有一种写男女风月的书，内容下流污秽，糟蹋笔墨，带坏年轻人，也多得数不清。
至若佳人才子等书，则又千部共出一套，且其中终不能不涉于淫滥，|至于才子佳人一类的书，更是千篇一律，而且写到最后总免不了淫乱，
以致满纸潘安、子建、西子、文君，不过作者要写出自己的那两首情诗艳赋来，故假拟出男女二人名姓，|满篇都是潘安、曹植那样的美男才子，西施、卓文君那样的美女才女。其实作者不过是想卖弄自己那两首情诗艳赋，才编出一男一女的名字来，
又必旁出一小人其间拨乱，亦如剧中之小丑然。|中间还一定要安排个小人捣乱，就像戏里的小丑一样。
且鬟婢开口即者也之乎，非文即理。|而且连丫鬟一开口都是“之乎者也”，不是掉书袋就是讲大道理。
故逐一看去，悉皆自相矛盾，大不近情理之话，|所以一本本看下来，全是自相矛盾、很不合情理的话，
竟不如我半世亲睹亲闻的这几个女子，虽不敢说强似前代书中所有之人，但事迹原委，亦可以消愁破闷，也有几首歪诗熟话，可以喷饭供酒。|还不如我这半辈子亲眼见到、亲耳听到的这几个女子。虽然不敢说她们比以前书里的人物都强，但她们的故事也能让人解愁消闷；里面还有几首打油诗、几句俏皮话，能让人笑得喷饭，拿来下酒助兴。
至若离合悲欢，兴衰际遇，则又追踪蹑迹，不敢稍加穿凿，徒为供人之目而反失其真传者。|至于里面的离合悲欢、兴衰遭遇，都是照着真事一步一步写的，不敢随便编造，免得只顾讨人爱看，反倒失了真。
今之人，贫者日为衣食所累，富者又怀不足之心，纵一时稍闲，又有贪淫恋色，好货寻愁之事，那里去有工夫看那理治之书？|现在的人，穷的天天为吃穿发愁，富的又总不知足；就算偶尔闲下来，又忙着贪色、贪财、自寻烦恼，哪有工夫看那些讲治国道理的书？
所以我这一段故事，也不愿世人称奇道妙，也不定要世人喜悦检读，|所以我这段故事，既不求世人叫好，也不一定要大家爱读，
只愿他们当那醉淫饱卧之时，或避世去愁之际，把此一玩，岂不省了些寿命筋力？|只希望他们在酒足饭饱、闲躺着没事的时候，或者想躲开烦恼的时候，拿来翻翻，岂不是能少耗点精力、多活几年？
就比那谋虚逐妄，却也省了口舌是非之害，腿脚奔忙之苦。|比起去追那些虚妄的东西，看书至少能少些口舌是非，少些东奔西跑的辛苦。
再者，亦令世人换新眼目，不比那些胡牵乱扯，忽离忽遇，满纸才人淑女，子建文君红娘小玉等通共熟套之旧稿。|再说，也能让世人换换口味。它不像那些东拉西扯、一会儿分开一会儿重逢、满篇才子佳人的老套旧稿，写来写去都是曹子建、卓文君、红娘、霍小玉这一类人。
我师意为何如？”|师父您觉得怎么样？”
! 这段话是作者的创作宣言：不写老套的才子佳人，只照真事写亲眼见过的女子。
! 书里丫鬟说话都很生活化，正是回应这里批评的“鬟婢开口即者也之乎”。

# 六、空空道人抄书，书名的由来
空空道人听如此说，思忖半晌，将《石头记》再检阅一遍，|空空道人听他这么说，想了半天，又把《石头记》仔细看了一遍，
因见上面虽有些指奸责佞贬恶诛邪之语，亦非伤时骂世之旨，|看到书里虽然有些指责奸臣小人、批判邪恶的话，但并没有讽刺时局、骂社会的意思，
及至君仁臣良父慈子孝，凡伦常所关之处，皆是称功颂德，眷眷无穷，实非别书之可比。|凡是写到君主仁爱、臣子贤良、父亲慈爱、儿子孝顺这些伦理纲常的地方，都在歌功颂德，情意深厚，确实不是别的书能比的。
虽其中大旨谈情，亦不过实录其事，又非假拟妄称，一味淫邀艳约，私订偷盟之可比。|书的主旨虽然是谈“情”，但只是如实记录，不像那些凭空编造、一味写幽会偷情、私订终身的书。
因毫不干涉时世，方从头至尾抄录回来，问世传奇。|因为书里一点也不牵涉当时的政事，他才从头到尾抄了回来，让它流传于世。
从此空空道人因空见色，由色生情，传情入色，自色悟空，遂易名为情僧，改《石头记》为《情僧录》，|从此空空道人从“空”看到了“色”，由“色”生出了“情”，又把“情”寄托在“色”里，最后从“色”中悟到了“空”。于是他改名叫“情僧”，把《石头记》改名为《情僧录》。（佛教里的“色”指世间一切有形的事物）
至吴玉峰题曰《红楼梦》，东鲁孔梅溪则题曰《风月宝鉴》。|后来吴玉峰给它题名《红楼梦》，东鲁的孔梅溪又题名《风月宝鉴》。
后因曹雪芹于悼红轩中披阅十载，增删五次，纂成目录，分出章回，则题曰《金陵十二钗》，并题一绝云：|再后来，曹雪芹在悼红轩里花了十年阅读修改，增删了五次，编好目录，分出章回，题名为《金陵十二钗》，还题了一首绝句：
~满纸荒唐言，一把辛酸泪！|满纸都是荒唐话，背后是一把辛酸泪！
~都云作者痴，谁解其中味？|人人都说作者痴，可谁懂得其中的滋味？
! “毫不干涉时世”“称功颂德”是保护色，为的是让书能安全流传，其实书里对贾府的腐败写得很深。
! “空→色→情→色→空”概括了全书路线，也是宝玉的一生。
! 曹雪芹把自己说成只是“披阅增删”的编者，其实他就是作者，又是一层真假游戏。

# 七、甄士隐登场
当日地陷东南，这东南一隅有处曰姑苏，有城曰阊门者，最是红尘中一二等富贵风流之地。|当年大地向东南塌陷，东南这一角有个地方叫姑苏，城里有座城门叫阊门，这一带是人间数一数二的富贵风流之地。
这阊门外有个十里街，街内有个仁清巷，巷内有个古庙，因地方窄狭，人皆呼作葫芦庙。|阊门外有条十里街，街里有条仁清巷，巷里有座古庙，因为地方窄小，大家都叫它葫芦庙。
庙旁住着一家乡宦，姓甄，名费，字士隐。|庙旁边住着一户退居家乡的官宦人家，主人姓甄，名费，字士隐。
嫡妻封氏，情性贤淑，深明礼义。|他的正妻封氏性情贤惠温柔，很懂礼义。
家中虽不甚富贵，然本地便也推他为望族了。|家里虽然算不上大富大贵，在本地也算有名望的人家。
因这甄士隐禀性恬淡，不以功名为念，每日只以观花修竹，酌酒吟诗为乐，倒是神仙一流人品。|甄士隐天性淡泊，不想求官求名，每天只是赏花、种竹、喝酒、作诗，倒像个神仙一样的人物。
只是一件不足：如今年已半百，膝下无儿，只有一女，乳名唤作英莲，年方三岁。|只有一件不如意：他已经五十岁了，还没有儿子，只有一个女儿，小名叫英莲，才三岁。
! 谐音：十里街＝“势利街”，仁清巷＝“人情巷”，葫芦庙＝“糊涂庙”，英莲＝“应怜”。
! 甄家由盛到衰，是贾府命运的预演。

# 八、士隐的梦：木石前盟
一日，炎夏永昼，士隐于书房闲坐，至手倦抛书，伏几少憩，不觉朦胧睡去。|有一天，正是夏天白昼漫长的时候，士隐在书房闲坐。书看累了，他把书一放，趴在小桌上歇一会儿，不知不觉迷迷糊糊睡着了。
梦至一处，不辨是何地方。|梦里他来到一个地方，认不出是哪儿。
忽见那厢来了一僧一道，且行且谈。|忽然看见那边走来一个和尚、一个道士，边走边聊。
只听道人问道：“你携了这蠢物，意欲何往？”|只听道士问：“你带着这个蠢东西，打算去哪儿？”
那僧笑道：“你放心，如今现有一段风流公案正该了结，这一干风流冤家，尚未投胎入世。|和尚笑道：“你放心。眼下正有一桩风流案子该了结了，这批风流冤家还没投胎到人间。
趁此机会，就将此蠢物夹带于中，使他去经历经历。”|趁这个机会，把这蠢东西夹在他们中间，让它也去经历经历。”
那道人道：“原来近日风流冤孽又将造劫历世去不成？但不知落于何方何处？”|道士说：“原来最近又有一批风流冤孽要下凡历劫了？不知道会落到什么地方？”
那僧笑道：“此事说来好笑，竟是千古未闻的罕事。|和尚笑道：“这事说来好笑，真是自古没听说过的稀罕事。
只因西方灵河岸上三生石畔，有绛珠草一株，时有赤瑕宫神瑛侍者，日以甘露灌溉，这绛珠草始得久延岁月。|在西方灵河岸边的三生石旁，长着一株绛珠草。当时赤瑕宫有位神瑛侍者，每天用甘露浇灌它，这株草才得以长久活下来。
后来既受天地精华，复得雨露滋养，遂得脱却草胎木质，得换人形，仅修成个女体，|后来它吸收了天地精华，又得到雨露滋养，终于脱去草木之身，变成人形，修成了一个女子，
终日游于离恨天外，饥则食蜜青果为膳，渴则饮灌愁海水为汤。|整天在离恨天外游荡，饿了吃“蜜青果”，渴了喝“灌愁海”的水。
只因尚未酬报灌溉之德，故其五内便郁结着一段缠绵不尽之意。|只因还没报答浇灌之恩，她心里一直郁结着一股缠绵不尽的情意。
恰近日这神瑛侍者凡心偶炽，乘此昌明太平朝世，意欲下凡造历幻缘，已在警幻仙子案前挂了号。|正巧最近这位神瑛侍者动了凡心，想趁着太平盛世下凡去经历一段幻缘，已经在警幻仙子那里登了记。
警幻亦曾问及，灌溉之情未偿，趁此倒可了结的。|警幻仙子也问起过绛珠草，说她欠下的浇灌之情还没还，正好趁这次了结。
那绛珠仙子道：‘他是甘露之惠，我并无此水可还。|绛珠仙子说：‘他给我的是甘露之恩，我没有这样的水能还他。
他既下世为人，我也去下世为人，但把我一生所有的眼泪还他，也偿还得过他了。’|他既然下凡做人，我也下凡做人，把我一辈子所有的眼泪都还给他，也就还得清了。’
因此一事，就勾出多少风流冤家来，陪他们去了结此案。”|因为这件事，又牵出许多风流冤家，陪他们一起下凡了结这桩案子。”
那道人道：“果是罕闻。实未闻有还泪之说。|道士说：“果然稀罕，真没听说过用眼泪还债的。
想来这一段故事，比历来风月事故更加琐碎细腻了。”|想来这段故事，要比以往那些风月故事细腻得多。”
那僧道：“历来几个风流人物，不过传其大概以及诗词篇章而已，至家庭闺阁中一饮一食，总未述记。|和尚说：“以往那些风流人物，不过传个大概，再加几首诗词罢了。家里闺房中的一饮一食，从来没人记下来。
再者，大半风月故事，不过偷香窃玉，暗约私奔而已，并不曾将儿女之真情发泄一二。|再说，大多数风月故事不过是偷情、幽会、私奔，从没把男女之间的真情写出一星半点。
想这一干人入世，其情痴色鬼，贤愚不肖者，悉与前人传述不同矣。”|我想这批人下凡以后，无论是痴情的还是好色的，贤明的还是愚笨的、不成器的，都会跟以前书里写的不一样。”
那道人道：“趁此何不你我也去下世度脱几个，岂不是一场功德？”|道士说：“何不趁这机会，咱俩也下凡去度化几个人，岂不是一场功德？”
那僧道：“正合吾意，你且同我到警幻仙子宫中，将蠢物交割清楚，待这一干风流孽鬼下世已完，你我再去。|和尚说：“正合我意。你先跟我到警幻仙子宫里，把这蠢东西交接清楚，等这批风流孽鬼都下凡了，咱俩再去。
如今虽已有一半落尘，然犹未全集。”|现在虽然已经下去一半了，还没到齐。”
道人道：“既如此，便随你去来。”|道士说：“既然这样，我就跟你去。”
! 木石前盟：绛珠草是林黛玉，神瑛侍者是贾宝玉。“还泪”预示黛玉一生多泪，最后泪尽而亡。
! “绛珠”是红色的珠子，暗指血泪；离恨天、灌愁海都预示她一生的愁苦。
! 在这个版本里，神瑛侍者投胎成宝玉，石头被“夹带”下凡，变成宝玉嘴里衔的玉。

# 九、士隐看到通灵宝玉
却说甄士隐俱听得明白，但不知所云“蠢物”系何东西。|甄士隐把这些话都听清楚了，只是不知道他们说的“蠢物”是什么东西。
遂不禁上前施礼，笑问道：“二仙师请了。”|他忍不住上前行礼，笑着说：“两位仙师好。”
那僧道也忙答礼相问。|和尚道士也连忙还礼问候。
士隐因说道：“适闻仙师所谈因果，实人世罕闻者。|士隐说：“刚才听仙师谈的因果，真是人间少有的事。
但弟子愚浊，不能洞悉明白，若蒙大开痴顽，备细一闻，弟子则洗耳谛听，稍能警省，亦可免沉伦之苦。”|只是我愚笨，听不太明白。要是您能开导开导，给我细细讲讲，我一定洗耳恭听。只要稍微能醒悟一点，也就能免去沉沦之苦了。”
二仙笑道：“此乃玄机不可预泄者。到那时不要忘我二人，便可跳出火坑矣。”|两位仙人笑道：“这是天机，不能提前泄露。到时候你别忘了我们俩，就能跳出火坑了。”
士隐听了，不便再问。|士隐听了，不好再问。
因笑道：“玄机不可预泄，但适云‘蠢物’，不知为何，或可一见否？”|他又笑着说：“天机不可泄露，那刚才说的‘蠢物’到底是什么？能不能让我看一眼？”
那僧道：“若问此物，倒有一面之缘。”|和尚说：“说起这东西，你倒和它有一面之缘。”
说着，取出递与士隐。|说着就拿出来递给士隐。
士隐接了看时，原来是块鲜明美玉，上面字迹分明，镌着“通灵宝玉”四字，后面还有几行小字。|士隐接过来一看，原来是一块鲜亮的美玉，上面清清楚楚刻着“通灵宝玉”四个字，背面还有几行小字。
正欲细看时，那僧便说已到幻境，便强从手中夺了去，与道人竟过一大石牌坊，上书四个大字，乃是“太虚幻境”。|他正想细看，和尚说已经到幻境了，就从他手里把玉夺了回去，和道士径直走过一座大石牌坊。牌坊上写着四个大字：“太虚幻境”。
两边又有一幅对联，道是：|两边还有一副对联，写的是：
~假作真时真亦假，无为有处有还无。|把假的当成真的，真的也就成了假的；把没有的当成有的，有的也就成了没有。
! “到那时不要忘我二人，便可跳出火坑”：预告士隐最后会跟道人出家。
! 这副对联是读懂全书的钥匙：甄（真）与贾（假）、有与无交织。第五回宝玉梦游太虚幻境时会再次看到它。

# 十、梦醒，僧道对英莲念诗
士隐意欲也跟了过去，方举步时，忽听一声霹雳，有若山崩地陷。|士隐也想跟过去，刚一抬脚，忽然听见一声霹雳，好像山崩地裂一样。
士隐大叫一声，定睛一看，只见烈日炎炎，芭蕉冉冉，所梦之事便忘了大半。|士隐大叫一声醒了过来，定神一看，只见外面烈日炎炎，芭蕉轻轻摇动，梦里的事已经忘了一大半。
又见奶母正抱了英莲走来。|又看见奶妈正抱着英莲走过来。
士隐见女儿越发生得粉妆玉琢，乖觉可喜，便伸手接来，抱在怀内，斗他顽耍一回，又带至街前，看那过会的热闹。|士隐看女儿长得越来越白嫩可爱，又乖巧机灵，就伸手接过来抱在怀里，逗她玩了一会儿，又抱到街口去看迎神赛会的热闹。
方欲进来时，只见从那边来了一僧一道：那僧则癞头跣脚，那道则跛足蓬头，疯疯癫癫，挥霍谈笑而至。|正要回家，只见那边走来一个和尚、一个道士：和尚满头癞疮，光着脚；道士瘸着腿，头发乱蓬蓬。两人疯疯癫癫，指手画脚、说说笑笑地走过来。
及至到了他门前，看见士隐抱着英莲，那僧便大哭起来，又向士隐道：“施主，你把这有命无运，累及爹娘之物，抱在怀内作甚？”|走到他家门前，看见士隐抱着英莲，和尚就大哭起来，对士隐说：“施主，这孩子有命无运，还要连累爹娘，你抱着她干什么？”
士隐听了，知是疯话，也不去睬他。|士隐知道是疯话，也不理他。
那僧还说：“舍我罢，舍我罢！”|和尚还在说：“把她舍给我吧，舍给我吧！”
士隐不耐烦，便抱女儿撤身要进去，那僧乃指着他大笑，口内念了四句言词道：|士隐不耐烦了，抱着女儿转身要进门。和尚就指着他大笑，嘴里念了四句话：
~惯养娇生笑你痴，菱花空对雪澌澌。|你把女儿娇生惯养，真是痴得可笑；这朵菱花，只能白白对着凄冷的飞雪。
~好防佳节元宵后，便是烟消火灭时！|要当心元宵节过后，那就是烟消火灭的时候！
! 癞头和尚、跛足道人就是梦里的两位仙人：仙界仙风道骨，人间邋遢疯癫。
! 诗句句是预言：“菱花”指英莲后改名香菱；“雪”谐音“薛”，指她落到薛蟠手里；“元宵后”她会走失；“烟消火灭”指甄家遭火灾。

# 十一、僧道分手
士隐听得明白，心下犹豫，意欲问他们来历。|士隐听得清清楚楚，心里犯起了嘀咕，想问问他们的来历。
只听道人说道：“你我不必同行，就此分手，各干营生去罢。|只听道士说：“咱俩不必一起走了，就在这儿分手，各干各的事去吧。
三劫后，我在北邙山等你，会齐了同往太虚幻境销号。”|三劫以后，我在北邙山等你，碰了头一起去太虚幻境销案。”
那僧道：“最妙，最妙！”|和尚说：“好极了，好极了！”
说毕，二人一去，再不见个踪影了。|说完，两人一走，就再也不见踪影了。
士隐心中此时自忖：这两个人必有来历，该试一问，如今悔却晚也。|士隐这时心里想：这两个人一定有来历，刚才该问一问的，现在后悔也晚了。
! 北邙山是古代有名的墓地，暗示要等一切结束，两人才会重聚“销号”。

# 十二、贾雨村登场
这士隐正痴想，忽见隔壁葫芦庙内寄居的一个穷儒-姓贾名化，表字时飞，别号雨村者走了出来。|士隐正发呆想着，忽然看见住在隔壁葫芦庙里的一个穷书生走了出来。这人姓贾，名化，字时飞，别号雨村。
这贾雨村原系胡州人氏，也是诗书仕宦之族，因他生于末世，父母祖宗根基已尽，人口衰丧，只剩得他一身一口，|贾雨村原是胡州人，也出身于读书做官的人家。只是他生在家族衰败的时候，祖上的家业已经败光，家里人死的死、散的散，只剩他孤身一人。
在家乡无益，因进京求取功名，再整基业。|留在家乡没有出路，就想进京考取功名，重振家业。
自前岁来此，又淹蹇住了，暂寄庙中安身，每日卖字作文为生，故士隐常与他交接。|他前年来到这里，因为穷困又被困住了，只好暂住在庙里，每天靠卖字、替人写文章过活。士隐因此常和他来往。
当下雨村见了士隐，忙施礼陪笑道：“老先生倚门伫望，敢是街市上有甚新闻否？”|雨村看见士隐，连忙行礼，赔着笑说：“老先生靠在门口张望，莫非街上有什么新鲜事？”
士隐笑道：“非也。适因小女啼哭，引他出来作耍，正是无聊之甚，兄来得正妙，请入小斋一谈，彼此皆可消此永昼。”|士隐笑道：“不是。刚才小女哭闹，我带她出来玩玩，正闲得无聊。你来得正好，请到我书房聊聊，咱俩都好打发这漫长的白天。”
说着，便令人送女儿进去，自与雨村携手来至书房中。|说着就叫人把女儿送进去，自己拉着雨村的手来到书房。
小童献茶。|小书童端上茶来。
方谈得三五句话，忽家人飞报：“严老爷来拜。”|刚聊了三五句，忽然仆人跑来报告：“严老爷来拜访了。”
士隐慌的忙起身谢罪道：“恕诳驾之罪，略坐，弟即来陪。”|士隐慌忙起身道歉：“把你请来又失陪，请多包涵。先坐一会儿，我马上回来陪你。”
雨村忙起身亦让道：“老先生请便。晚生乃常造之客，稍候何妨。”|雨村也忙站起来谦让：“老先生请便。我是常来的客人，等一会儿没关系。”
说着，士隐已出前厅去了。|说话间，士隐已经到前厅去了。
! 谐音：贾化＝“假话”，时飞＝“实非”，胡州＝“胡诌”。
! 脂批说“严老爷”谐音“炎”：“炎”一来，火也就要来了。

# 十三、丫鬟回头
这里雨村且翻弄书籍解闷。|雨村就在书房里翻书解闷。
忽听得窗外有女子嗽声，雨村遂起身往窗外一看，原来是一个丫鬟，在那里撷花，|忽然听见窗外有女子咳嗽，雨村起身往窗外一看，原来是一个丫鬟在那里摘花。
生得仪容不俗，眉目清明，虽无十分姿色，却亦有动人之处。|她模样不俗，眉清目秀，虽然算不上绝色，也自有动人的地方。
雨村不觉看的呆了。|雨村不知不觉看呆了。
那甄家丫鬟撷了花，方欲走时，猛抬头见窗内有人，敝巾旧服，虽是贫窘，然生得腰圆背厚，面阔口方，更兼剑眉星眼，直鼻权腮。|这个丫鬟摘完花正要走，猛一抬头，看见窗里有个人：戴着破头巾，穿着旧衣服，虽然一副穷相，却长得腰圆背厚、脸宽嘴方，还有一对剑眉、一双亮眼，鼻梁挺直，颧骨高耸。
这丫鬟忙转身回避，心下乃想：“这人生的这样雄壮，却又这样褴褛，想他定是我家主人常说的什么贾雨村了，|丫鬟连忙转身躲开，心里想：“这人长得这么魁梧，穿得却这么破烂，想必就是老爷常说的那个贾雨村了。
每有意帮助周济，只是没甚机会。|老爷常想接济他，只是一直没找到机会。
我家并无这样贫窘亲友，想定是此人无疑了。|我家没有这么穷的亲戚朋友，一定就是他了。
怪道又说他必非久困之人。”|难怪老爷还说，他不会一直穷下去。”
如此想来，不免又回头两次。|这么想着，她忍不住又回头看了两次。
雨村见他回了头，便自为这女子心中有意于他，便狂喜不尽，自为此女子必是个巨眼英雄，风尘中之知己也。|雨村见她回头，就以为这女子对自己有意，高兴得不得了，认定她一定是个慧眼识英雄的人，是自己落魄时的知己。
一时小童进来，雨村打听得前面留饭，不可久待，遂从夹道中自便出门去了。|一会儿小书童进来，雨村打听到前厅要留客人吃饭，知道不能久等，就从侧边的夹道自己出门走了。
士隐待客既散，知雨村自便，也不去再邀。|士隐送走客人，知道雨村已经自己走了，也就没再去请。
! 这个丫鬟后文叫娇杏，谐音“侥幸”：就因为这两次回头，她后来嫁给了雨村（第二回）。
! 雨村一厢情愿地往对自己有利的方向想，可见他自负。

# 十四、中秋夜，雨村吟诗
一日，早又中秋佳节。|转眼又到了中秋节。
士隐家宴已毕，乃又另具一席于书房，却自己步月至庙中来邀雨村。|士隐家的团圆饭吃完以后，他又在书房另摆了一桌酒席，自己踏着月色到庙里去请雨村。
原来雨村自那日见了甄家之婢曾回顾他两次，自为是个知己，便时刻放在心上。|原来雨村自从那天见甄家丫鬟回头看了他两次，就认定她是自己的知己，时时刻刻挂在心上。
今又正值中秋，不免对月有怀，因而口占五言一律云：|现在又是中秋，他对着月亮难免想起她，就随口吟了一首五言律诗：
~未卜三生愿，频添一段愁。|不知道我们有没有三生的缘分，倒平添了一段愁思。
~闷来时敛额，行去几回头。|我烦闷时只能皱着眉头；她走开时，曾几次回头看我。
~自顾风前影，谁堪月下俦？|我在风里看着自己孤单的影子，谁能陪我在月下作伴？
~蟾光如有意，先上玉人楼。|月光要是懂我的心意，就先照到那位美人的楼上吧。
雨村吟罢，因又思及平生抱负，苦未逢时，乃又搔首对天长叹，复高吟一联曰：|雨村吟完，又想到自己一生的抱负，苦于时运不济，就挠着头对天长叹，又高声吟了一副对联：
~玉在匵中求善价，钗于奁内待时飞。|美玉藏在匣子里，等人出个好价钱；玉钗放在梳妆盒里，等时机一到就飞上高处。（匵同“椟”，匣子）
! 雨村以“玉”和“钗”自比怀才待用，“时飞”正是他的字。
! 这一联也暗藏书中人物：“玉”暗指宝玉、黛玉，“钗”暗指宝钗。

# 十五、士隐资助雨村进京
恰值士隐走来听见，笑道：“雨村兄真抱负不浅也！”|正巧士隐走来听见了，笑道：“雨村兄真是抱负不小啊！”
雨村忙笑道：“不过偶吟前人之句，何敢狂诞至此。”|雨村忙笑着说：“不过随口念念前人的句子，哪敢这么狂妄。”
因问：“老先生何兴至此？”|又问：“老先生怎么有兴致过来？”
士隐笑道：“今夜中秋，俗谓‘团圆之节’，想尊兄旅寄僧房，不无寂寥之感，故特具小酌，邀兄到敝斋一饮，不知可纳芹意否？”|士隐笑道：“今晚是中秋，俗话叫‘团圆节’。我想你一个人客居在庙里，难免冷清，所以特地备了点酒菜，请你到我书房喝一杯，不知你肯不肯赏光？”
雨村听了，并不推辞，便笑道：“既蒙厚爱，何敢拂此盛情。”|雨村听了，一点也不推辞，笑着说：“承蒙您厚爱，哪敢辜负您的好意。”
说着，便同士隐复过这边书院中来。|说着就跟士隐回到这边书房来。
须臾茶毕，早已设下杯盘，那美酒佳肴自不必说。|不一会儿喝完茶，酒席已经摆好，好酒好菜自不用说。
二人归坐，先是款斟漫饮，次渐谈至兴浓，不觉飞觥限斝起来。|两人坐下，起先慢慢斟、慢慢喝，后来越聊越起劲，不知不觉就你一杯我一杯地拼起酒来。
当时街坊上家家箫管，户户弦歌，当头一轮明月，飞彩凝辉，二人愈添豪兴，酒到杯干。|这时街坊上家家吹箫、户户弹唱，头顶一轮明月光彩照人。两人兴致更高，酒一倒上就喝干。
雨村此时已有七八分酒意，狂兴不禁，乃对月寓怀，口号一绝云：|雨村这时已有七八分醉意，狂劲压不住，就对着月亮抒怀，随口吟了一首绝句：
~时逢三五便团圆，满把晴光护玉栏。|每逢十五月亮就圆，满天清亮的月光笼罩着玉石栏杆。
~天上一轮才捧出，人间万姓仰头看。|天上这轮明月刚刚升起，人间千千万万的百姓都抬头仰望。
士隐听了，大叫：“妙哉！吾每谓兄必非久居人下者，今所吟之句，飞腾之兆已见，不日可接履于云霓之上矣。可贺，可贺！”|士隐听了大叫：“好诗！我常说你不会久居人下。今天这首诗里已经有了飞黄腾达的兆头，不久你就要青云直上了。可喜可贺！”
乃亲斟一斗为贺。|就亲自斟了一大杯酒向他道贺。
雨村因干过，叹道：“非晚生酒后狂言，若论时尚之学，晚生也或可去充数沽名，只是目今行囊路费一概无措，神京路远，非赖卖字撰文即能到者。”|雨村一饮而尽，叹道：“不是我酒后说大话，要论科举考的那套学问，我也许还能去凑个数、博个功名。只是眼下行李路费一点着落都没有，京城又远，光靠卖字写文章是去不成的。”
士隐不待说完，便道：“兄何不早言。愚每有此心，但每遇兄时，兄并未谈及，愚故未敢唐突。|士隐不等他说完就说：“你怎么不早说！我早有这个心思，只是每次见你，你都没提起，我也就不敢冒昧。
今既及此，愚虽不才，‘义利’二字却还识得。|今天既然说到这儿，我虽然没什么本事，‘义’和‘利’哪个更重，我还是分得清的。
且喜明岁正当大比，兄宜作速入都，春闱一战，方不负兄之所学也。|正好明年是大考之年，你该赶快进京，参加春天的会试，才不辜负你的学问。
其盘费余事，弟自代为处置，亦不枉兄之谬识矣！”|路费和其他事情，我替你安排，也不枉你和我交了一场朋友！”
当下即命小童进去，速封五十两白银，并两套冬衣。|当即叫小书童进去，赶快包好五十两银子，再拿两套冬衣。
又云：“十九日乃黄道之期，兄可即买舟西上，待雄飞高举，明冬再晤，岂非大快之事耶！”|又说：“十九日是个好日子，你可以马上雇船进京。等你金榜题名、飞黄腾达，明年冬天我们再见，岂不是件痛快事！”
雨村收了银衣，不过略谢一语，并不介意，仍是吃酒谈笑。|雨村收下银子和衣服，只简单道了声谢，并不太放在心上，照旧喝酒说笑。
那天已交了三更，二人方散。|一直喝到三更天，两人才散。
士隐送雨村去后，回房一觉，直至红日三竿方醒。|士隐送走雨村，回房睡了一觉，直到太阳升得老高才醒。
因思昨夜之事，意欲再写两封荐书与雨村带至神都，使雨村投谒个仕宦之家为寄足之地。|想起昨晚的事，他打算再写两封推荐信让雨村带到京城，好让他去拜见几户官宦人家，有个落脚的地方。
因使人过去请时，那家人去了回来说：“和尚说，贾爷今日五鼓已进京去了，也曾留下话与和尚转达老爷，说‘读书人不在黄道黑道，总以事理为要，不及面辞了。’”|派人过去请他，仆人回来说：“和尚说，贾爷今天五更天就动身进京了。他留了话让和尚转告老爷：‘读书人不讲究什么好日子坏日子，凡事以事理为重，来不及当面告辞了。’”
士隐听了，也只得罢了。|士隐听了，也只好作罢。
! 这首咏月诗表面写月亮，其实写雨村的野心：他就是那轮“万姓仰头看”的月亮。
! 士隐真心待人，雨村却“略谢一语”、不辞而别。第四回他当了官，明知被拐的是恩人之女英莲，却不肯救她。

# 十六、元宵节英莲走失
真是闲处光阴易过，倏忽又是元霄佳节矣。|真是清闲的日子过得快，一转眼又到了元宵节。
士隐命家人霍启抱了英莲去看社火花灯，|士隐叫仆人霍启抱着英莲去看社火和花灯。
半夜中，霍启因要小解，便将英莲放在一家门槛上坐着。|到了半夜，霍启要去小便，就把英莲放在一户人家的门槛上坐着。
待他小解完了来抱时，那有英莲的踪影？|等他回来抱时，哪里还有英莲的影子？
急得霍启直寻了半夜，至天明不见，那霍启也就不敢回来见主人，便逃往他乡去了。|霍启急得找了大半夜，直到天亮也没找到，不敢回去见主人，就逃到外地去了。
那士隐夫妇，见女儿一夜不归，便知有些不妥，再使几人去寻找，回来皆云音响皆无。|士隐夫妇见女儿一夜没回来，就知道出事了，又派了几个人去找，回来都说一点消息也没有。
夫妻二人，半世只生此女，一旦失落，岂不思想，因此昼夜啼哭，几乎不曾寻死。|夫妻俩半辈子只有这一个女儿，一下子丢了，怎能不想？因此日日夜夜地哭，差点寻了短见。
看看的一月，士隐先就得了一病，当时封氏孺人也因思女构疾，日日请医疗治。|眼看过了一个月，士隐先病倒了；封氏夫人也因为想女儿想出了病，天天请医生来治。
! 霍启谐音“祸起”，甄家的灾祸从他开始。
! 和尚说的“好防佳节元宵后”应验了。

# 十七、葫芦庙失火
不想这日三月十五，葫芦庙中炸供，那些和尚不加小心，致使油锅火逸，便烧着窗纸。|没想到三月十五这天，葫芦庙里炸供品，和尚们不小心，油锅里的火窜了出来，烧着了窗户纸。
此方人家多用竹篱木壁者，大抵也因劫数，于是接二连三，牵五挂四，将一条街烧得如火焰山一般。|这一带人家多用竹篱笆、木板墙，大概也是命中的劫数，火一家接一家地烧过去，把整条街烧得像火焰山一样。
彼时虽有军民来救，那火已成了势，如何救得下？|当时虽然有官兵和百姓来救，可火势已经起来了，哪里救得下？
直烧了一夜，方渐渐的熄去，也不知烧了几家。|一直烧了一整夜才慢慢熄灭，也不知烧了多少户人家。
只可怜甄家在隔壁，早已烧成一片瓦砾场了。|可怜甄家就在庙隔壁，早已烧成了一片废墟。
只有他夫妇并几个家人的性命不曾伤了。|只有夫妻俩和几个仆人保住了性命。
急得士隐惟跌足长叹而已。|士隐急得只能跺脚长叹。
只得与妻子商议，且到田庄上去安身。|只好和妻子商量，先到乡下的田庄去住。
偏值近年水旱不收，鼠盗蜂起，无非抢田夺地，鼠窃狗偷，民不安生，因此官兵剿捕，难以安身。|偏偏这几年不是涝就是旱，庄稼没收成，盗贼成群，到处抢田夺地、偷鸡摸狗，百姓不得安生；官兵又四处围剿抓人，在那儿也住不下去。
士隐只得将田庄都折变了，便携了妻子与两个丫鬟投他岳丈家去。|士隐只好把田庄卖了，带着妻子和两个丫鬟去投奔岳父。
! 应验了“烟消火灭时”。火从“葫芦（糊涂）庙”烧起来。
! “水旱不收，鼠盗蜂起”说明所谓“太平盛世”底下并不太平。

# 十八、投奔岳父，受尽冷眼
他岳丈名唤封肃，本贯大如州人氏，虽是务农，家中都还殷实。|他岳父名叫封肃，老家在大如州，虽然是种田的，家里倒还殷实。
今见女婿这等狼狈而来，心中便有些不乐。|现在看女婿这么狼狈地来投靠，心里就有些不高兴。
幸而士隐还有折变田地的银子未曾用完，拿出来托他随分就价薄置些须房地，为后日衣食之计。|幸好士隐卖田庄的银子还没用完，就拿出来托岳父按市价买点房子和田地，好维持以后的生活。
那封肃便半哄半赚，些须与他些薄田朽屋。|封肃却连哄带骗，从中赚了一笔，只给他买了些贫瘠的田、破旧的屋。
士隐乃读书之人，不惯生理稼穑等事，勉强支持了一二年，越觉穷了下去。|士隐是个读书人，不会做生意，也不会种庄稼，勉强撑了一两年，越过越穷。
封肃每见面时，便说些现成话，且人前人后又怨他们不善过活，只一味好吃懒作等语。|封肃每次见面就说些风凉话，还在人前人后埋怨他们不会过日子，只知道好吃懒做。
士隐知投人不着，心中未免悔恨，再兼上年惊唬，急忿怨痛，已有积伤，暮年之人，贫病交攻，竟渐渐的露出那下世的光景来。|士隐知道自己投靠错了人，心里难免悔恨。再加上前一年受了惊吓，又急又气又怨又痛，早已落下病根。一个上了年纪的人，又穷又病，渐渐显出快不行了的样子。
! 封肃谐音“风俗”，代表世态炎凉、势利的人情，和“十里街（势利街）”呼应。

# 十九、跛足道人唱《好了歌》
可巧这日拄了拐杖挣挫到街前散散心时，忽见那边来了一个跛足道人，疯癫落脱，麻屣鹑衣，口内念着几句言词，道是：|这天，士隐拄着拐杖勉强走到街上散心，忽然看见那边来了一个瘸腿道士。他疯疯癫癫、放荡不羁，穿着麻鞋，衣服破破烂烂，嘴里念着几句词：
~世人都晓神仙好，惟有功名忘不了；古今将相在何方，荒冢一堆草没了。|世人都知道做神仙好，就是忘不了功名；古往今来的将相如今在哪里？只剩一堆荒坟，被野草淹没了。
~世人都晓神仙好，只有金银忘不了；终朝只恨聚无多，及到多时眼闭了。|世人都知道做神仙好，就是忘不了金银；整天只恨攒得不够多，等攒多了，眼睛也闭上了。
~世人都晓神仙好，只有娇妻忘不了；君生日日说恩情，君死又随人去了。|世人都知道做神仙好，就是忘不了娇妻；你活着时她天天说恩爱，你一死，她又跟别人走了。
~世人都晓神仙好，只有儿孙忘不了；痴心父母古来多，孝顺子孙谁见了。|世人都知道做神仙好，就是忘不了儿孙；自古以来痴心的父母很多，孝顺的子孙谁见过？
士隐听了，便迎上来道：“你满口说些什么？只听见些‘好’‘了’‘好’‘了’。|士隐听了，迎上去问：“你满嘴说的什么？我只听见些‘好’啊‘了’啊‘好’啊‘了’的。”
那道人笑道：“你若果听见‘好’‘了’二字，还算你明白。|道士笑道：“你要是真听出了‘好’‘了’这两个字，还算你明白。
可知世上万般，好便是了，了便是好。|要知道世上万事，好到头就是了，了结了才是好。
若不了，便不好，若要好，须是了。|放不下，就不会好；要想好，就得放下。
我这歌儿，便名《好了歌》。”|我这首歌，就叫《好了歌》。”
士隐本是有宿慧的，一闻此言，心中早已彻悟。|士隐本来就有天生的悟性，一听这话，心里早已彻底明白了。
因笑道：“且住！待我将你这《好了歌》解注出来何如？”|就笑着说：“等一等！我来给你这首《好了歌》作个注解怎么样？”
道人笑道：“你解，你解。”|道士笑道：“你解，你解。”
士隐乃说道：|士隐就说：
! 功名、金银、娇妻、儿孙，是世人最放不下的四样，书里的人物几乎都栽在这上面。
! “好”与“了”：再好的东西终会了结，只有放下，才能真正解脱。

# 二十、士隐注解《好了歌》，随道人出家
~陋室空堂、当年笏满床，衰草枯杨、曾为歌舞场；|如今的破屋空堂，当年满床堆着上朝用的笏板（家里做大官的人多）；现在满眼衰草枯杨的地方，曾经是唱歌跳舞的热闹场所。
~蛛丝儿结满雕梁，绿纱今又糊在蓬窗上。|雕花的屋梁上结满了蜘蛛网；而穷人家的破草窗上，如今又糊上了新绿纱（有人败落，有人发达）。
~说什么脂正浓、粉正香，如何两鬓又成霜；|说什么胭脂正浓、香粉正香，怎么转眼间两鬓就白了？
~昨日黄土陇头送白骨，今宵红灯帐底卧鸳鸯。|昨天还在黄土坟头埋葬死人，今晚就在红灯帐里成亲。
~金满箱、银满箱，转眼乞丐人皆谤；|金银装满了箱子，转眼却沦为乞丐，被人人嘲骂；
~正叹他人命不长，那知自己归来丧。|正感叹别人命短，哪知自己一回家就死了。
~训有方，保不定日后作强梁；|把儿子教得再好，也保不准他将来不当强盗；
~择膏粱，谁承望流落在烟花巷。|给女儿挑了户富贵人家，谁想到她最后会流落到妓院。
~因嫌纱帽小，致使锁枷扛；|嫌官做得小，拼命往上爬，结果戴上枷锁进了牢房；
~昨怜破袄寒，今嫌紫蟒长。|昨天还嫌破棉袄不暖，今天却嫌高官穿的紫蟒袍太长。
~乱哄哄你方唱罢我登场，反认他乡是故乡；|乱哄哄的，你刚唱完我就登场；大家都把异乡错当成了故乡。
~甚荒唐，到头来都是为他人作嫁衣裳。|真荒唐，到头来全是给别人做嫁衣裳，白忙一场。
那疯跛道人听了，拍掌笑道：“解得切，解得切！”|疯瘸道士听了，拍手笑道：“解得透，解得透！”
士隐便说一声“走罢！”将道人肩上褡裢抢了过来背着，竟不回家，同了疯道人飘飘而去。|士隐说了一声“走吧！”，就把道士肩上的褡裢抢过来自己背上，连家也不回，跟着疯道士飘飘然走了。
! 这段注解是全书的缩影：富贵转眼成空，荣辱随时颠倒。据脂批，好几句暗指书中人物的结局。
! “反认他乡是故乡”：人间只是暂住之地，真正的“故乡”是本来的归宿。
! 梦里说的“不要忘我二人，便可跳出火坑”应验了。士隐出家，也预示宝玉最后出家。

# 二十一、封氏守家，新太爷到任
当下烘动街坊，众人当作一件新闻传说。|这事一下子轰动了街坊，大家都当成新鲜事到处传。
封氏闻得此信，哭个死去活来，只得与父亲商议，遣人各处访寻，那讨音信？|封氏听到消息，哭得死去活来，只好和父亲商量，派人到处寻找，可哪里有半点音信？
无奈何，少不得依靠着他父母度日。|没办法，只好靠父母过日子。
幸而身边还有两个旧日的丫鬟伏侍，主仆三人，日夜作些针线发卖，帮着父亲用度。|幸好身边还有两个老丫鬟服侍，主仆三人日夜做针线活卖钱，贴补父亲家的开销。
那封肃虽然日日抱怨，也无可奈何了。|封肃虽然天天抱怨，也没办法了。
这日，那甄家大丫鬟在门前买线，忽听街上喝道之声，众人都说新太爷到任。|这天，甄家那个大丫鬟在门口买线，忽然听见街上有开道吆喝的声音，大家都说新来的知府大人上任了。
丫鬟于是隐在门内看时，只见军牢快手，一对一对的过去，俄而大轿抬着一个乌帽猩袍的官府过去。|丫鬟就躲在门里偷看，只见衙役差人一对一对走过去。不一会儿，一顶大轿抬着一位戴乌纱帽、穿大红官袍的官老爷过去了。
丫鬟倒发了个怔，自思这官好面善，倒象在那里见过的。|丫鬟愣了一下，心想这个官看着好眼熟，好像在哪里见过。
于是进入房中，也就丢过不在心上。|回到屋里，也就丢开不想了。
至晚间，正待歇息之时，忽听一片声打的门响，许多人乱嚷，说：“本府太爷差人来传人问话。”|到了晚上，正要休息，忽然听见一阵砸门声，很多人乱哄哄地嚷：“知府大人派人来传人问话！”
封肃听了，唬得目瞪口呆，不知有何祸事，且听下回分解。|封肃一听，吓得目瞪口呆，不知道惹了什么祸。到底怎么回事，请看下回。
! 这个大丫鬟就是当年回头的娇杏，新太爷就是当了官的贾雨村，下一回揭晓。
! 甄（真）家家破人散，贾（假）雨村飞黄腾达：“真”败落了，“假”却得了势。

<script type="text/plain" id="ch3">
# 一、雨村得到起复的消息
却说雨村忙回头看时，不是别人，乃是当日同僚一案参革的号张如圭者。|雨村连忙回头一看，不是别人，正是当年跟他同一个案子被革职的同僚，名叫张如圭。
他本系此地人，革后家居，今打听得都中奏准起复旧员之信，他便四下里寻情找门路，忽遇见雨村，故忙道喜。|他本是当地人，革职后一直闲在家里。这回打听到京城已经批准重新起用被革职的旧官员，他就四处托人找门路，正好碰见雨村，所以忙着道喜。
二人见了礼，张如圭便将此信告诉雨村，雨村自是欢喜，忙忙的叙了两句，遂作别各自回家。|两人见过礼，张如圭把这消息告诉雨村。雨村当然高兴，匆匆说了几句，就各自回家了。
冷子兴听得此言，便忙献计，令雨村央烦林如海，转向都中去央烦贾政。|冷子兴听了，赶紧出主意：让雨村去求林如海，再请林如海转托京城的贾政帮忙。
雨村领其意，作别回至馆中，忙寻邸报看真确了。|雨村明白了他的意思，告别回到林家书馆，赶紧找来朝廷的公报，确认消息是真的。
! 雨村一听能复官，马上就想到走贾家的门路。冷子兴上一回刚讲完贾府，这一回就派上了用场。

# 二、林如海写荐书
次日，面谋之如海。|第二天，雨村当面跟林如海商量。
如海道：“天缘凑巧，因贱荆去世，都中家岳母念及小女无人依傍教育，前已遣了男女船只来接，因小女未曾大痊，故未及行。|林如海说：“真是巧。我妻子去世后，京城的岳母惦记小女没人照顾教导，早就派了男女仆人和船来接，只因小女病还没好全，才没动身。
此刻正思向蒙训教之恩未经酬报，遇此机会，岂有不尽心图报之理。|我正想着您教导小女的恩情还没报答，碰上这个机会，哪有不尽心的道理。
但请放心。|您只管放心。
弟已预为筹画至此，已修下荐书一封，转托内兄务为周全协佐，方可稍尽弟之鄙诚，即有所费用之例，弟于内兄信中已注明白，亦不劳尊兄多虑矣。”|我早就替您想到了，已经写好一封推荐信，托我内兄一定尽力帮忙，也算我一点心意。至于要花的钱，我在信里都写明白了，不用您操心。”
雨村一面打恭，谢不释口，一面又问：“不知令亲大人现居何职？|雨村一边作揖，嘴里谢个不停，一边又问：“不知令亲大人现在担任什么官职？
只怕晚生草率，不敢骤然入都干渎。”|我怕自己冒冒失失，不敢贸然进京去打扰。”
如海笑道：“若论舍亲，与尊兄犹系同谱，乃荣公之孙：大内兄现袭一等将军，名赦，字恩侯，二内兄名政，字存周，现任工部员外郎，其为人谦恭厚道，大有祖父遗风，非膏粱轻薄仕宦之流，故弟方致书烦托。|林如海笑道：“说起我这亲戚，跟您还是同宗，是荣国公的孙子。大内兄承袭了一等将军，名赦，字恩侯；二内兄名政，字存周，现在是工部员外郎。他为人谦虚厚道，很有祖父的风范，不是那种轻浮的纨绔官员，所以我才写信托他。
否则不但有污尊兄之清操，即弟亦不屑为矣。”|不然的话，不但玷污您的清白，我自己也不屑这么做。”
雨村听了，心下方信了昨日子兴之言，于是又谢了林如海。|雨村听了，这才相信昨天冷子兴说的都是真的，于是又谢了林如海。
如海乃说：“已择了出月初二日小女入都，尊兄即同路而往，岂不两便？”|林如海又说：“已经定了下个月初二送小女进京，您就跟她同路，两边都方便。”
雨村唯唯听命，心中十分得意。|雨村连声答应，心里十分得意。
如海遂打点礼物并饯行之事，雨村一一领了。|林如海就准备礼物、设宴饯行，雨村一一收下。
! 林如海说贾政“谦恭厚道”“非膏粱轻薄”，其实是在给雨村的钻营找个体面的说法。
! “同谱”就是同宗。雨村本来跟贾府毫无关系，靠一个“贾”字攀上了亲。

# 三、黛玉拜别父亲
那女学生黛玉，身体方愈，原不忍弃父而往，无奈他外祖母致意务去，且兼如海说：|那女学生黛玉，病刚好，本来舍不得离开父亲，可外祖母一定要她去，林如海也劝她说：
“汝父年将半百，再无续室之意，且汝多病，年又极小，上无亲母教养，下无姊妹兄弟扶持，今依傍外祖母及舅氏姊妹去，正好减我顾盼之忧，何反云不往？”|“我快五十了，不打算再娶。你身体多病，年纪又小，上面没有母亲教养，下面没有兄弟姐妹照应。现在去投靠外祖母和舅舅家的姐妹们，正好让我少操些心，你怎么反倒说不去呢？”
黛玉听了，方洒泪拜别，随了奶娘及荣府几个老妇人登舟而去。|黛玉听了，才流着泪拜别父亲，跟着奶娘和荣府派来的几个老婆子上船走了。
雨村另有一只船，带两个小童，依附黛玉而行。|雨村另坐一条船，带着两个小书童，跟在黛玉的船后面走。
! 黛玉从此寄人篱下。“上无亲母，下无姊妹兄弟”是她一生孤独敏感的根源。

# 四、雨村谋得应天府
有日到了都中，进入神京，雨村先整了衣冠，带了小童，拿著宗侄的名帖，至荣府的门前投了。|过了些日子到了京城。雨村先整好衣帽，带着小书童，拿着写着“宗侄”的名帖，到荣府门前递上。
彼时贾政已看了妹丈之书，即忙请入相会。|那时贾政已经看过妹夫的信，马上请他进来见面。
见雨村相貌魁伟，言语不俗，且这贾政最喜读书人，礼贤下士，济弱扶危，大有祖风，况又系妹丈致意，因此优待雨村，更又不同，便竭力内中协助，题奏之日，轻轻谋了一个复职候缺，|贾政见雨村相貌堂堂，谈吐不俗；他本来就最喜欢读书人，待人谦和，爱帮扶弱者，很有祖上的风范，再加上是妹夫托付的，所以对雨村格外优待，在里面尽力帮忙。上奏的时候，轻轻松松就给他谋了个恢复原职、等候空缺的名分。
不上两个月，金陵应天府缺出，便谋补了此缺，拜辞了贾政，择日上任去了。|不到两个月，金陵应天府知府出了空缺，雨村就补了这个位子，辞别贾政，挑了日子上任去了。
不在话下。|这事暂且不提。
! 雨村拿“宗侄”名帖上门，一个“贾”字就攀上了荣府。
! 应天府就在金陵，正是薛家所在的地方。下一回他就要在这里审薛蟠的案子。

# 五、黛玉进府，步步留心
且说黛玉自那日弃舟登岸时，便有荣国府打发了轿子并拉行李的车辆久候了。|再说黛玉那天下船上岸时，荣国府派来的轿子和拉行李的车早就在等着了。
这林黛玉常听得母亲说过，他外祖母家与别家不同。|林黛玉常听母亲说，外祖母家跟别人家不一样。
他近日所见的这几个三等仆妇，吃穿用度，已是不凡了，何况今至其家。|这些天她见到的几个三等仆妇，吃的穿的用的就已经很讲究了，何况是到了贾府本家。
因此步步留心，时时在意，不肯轻易多说一句话，多行一步路，惟恐被人耻笑了他去。|所以她每一步都小心，时时留意，不肯随便多说一句话、多走一步路，生怕被人笑话。
自上了轿，进入城中从纱窗向外瞧了一瞧，其街市之繁华，人烟之阜盛，自与别处不同。|上了轿进城，从纱窗往外看了看，街上那么热闹，人那么多，果然跟别处不同。
又行了半日，忽见街北蹲著两个大石狮子，三间兽头大门，门前列坐著十来个华冠丽服之人。|又走了半天，忽然看见街北蹲着两个大石狮子，三间大门上装着兽头门环，门前坐着十来个衣帽华丽的人。
正门却不开，只有东西两角门有人出入。|正门不开，只有东西两边的角门有人进出。
正门之上有一匾，匾上大书“敕造宁国府”五个大字。|正门上挂着一块匾，写着“敕造宁国府”五个大字。（“敕造”就是奉皇帝之命建造）
黛玉想道：这必是外祖之长房了。|黛玉想：这一定是外祖家的长房了。
想著，又往西行，不多远，照样也是三间大门，方是荣国府了。|正想着，又往西走，没多远，也是同样的三间大门，这才是荣国府。
却不进正门，只进了西边角门。|轿子没进正门，只从西边角门进去。
那轿夫抬进去，走了一射之地，将转弯时，便歇下退出去了。|轿夫抬进去，走了大约一箭远，快转弯时就把轿子放下退出去了。
后面的婆子们已都下了轿，赶上前来。|后面的婆子们都已经下了轿，赶上前来。
另换了三四个衣帽周全十七八岁的小厮上来，复抬起轿子。|另外换了三四个衣帽整齐、十七八岁的小厮，又抬起轿子。
众婆子步下围随至一垂花门前落下。|婆子们走路跟着，一直到一座垂花门前才把轿子放下。
众小厮退出，众婆子上来打起轿帘，扶黛玉下轿。|小厮们退出去，婆子们上前掀起轿帘，扶黛玉下轿。
林黛玉扶著婆子的手，进了垂花门，两边是抄手游廊，当中是穿堂，当地放著一个紫檀架子大理石的大插屏。|林黛玉扶着婆子的手进了垂花门，两边是环抱的游廊，中间是穿堂，地上立着一座紫檀木架子的大理石大屏风。
转过插屏，小小的三间厅，厅后就是后面的正房大院。|绕过屏风，是三间小厅，厅后面就是正房大院。
正面五间上房，皆雕梁画栋，两边穿山游廊厢房，挂著各色鹦鹉，画眉等鸟雀。|正面五间上房，都是雕花的梁、彩画的柱；两边是游廊和厢房，挂着鹦鹉、画眉等各种鸟。
台矶之上，坐著几个穿红著绿的丫头，一见他们来了，便忙都笑迎上来，说：“刚才老太太还念呢，可巧就来了。”|台阶上坐着几个穿红戴绿的丫头，一见她们来了，都笑着迎上来说：“刚才老太太还念叨呢，正巧就来了。”
于是三四人争著打起帘笼，一面听得人回话：“林姑娘到了。”|三四个人抢着掀起门帘，一边听见有人通报：“林姑娘到了。”
! “步步留心，时时在意”八个字，写尽了黛玉在贾府的处境。
! 作者借黛玉的眼睛，第一次带读者走进贾府。人进得越深，门就越多。

# 六、拜见外祖母
黛玉方进入房时，只见两个人搀著一位鬓发如银的老母迎上来，黛玉便知是他外祖母。|黛玉刚进屋，就看见两个人搀着一位满头银发的老太太迎上来，黛玉知道这就是外祖母。
方欲拜见时，早被他外祖母一把搂入怀中，心肝儿肉叫著大哭起来。|她正要下拜，早被外祖母一把搂进怀里，“心肝儿肉”地叫着大哭起来。
当下地下侍立之人，无不掩面涕泣，黛玉也哭个不住。|旁边站着伺候的人没有不捂着脸流泪的，黛玉也哭个不停。
一时众人慢慢解劝住了，黛玉方拜见了外祖母。|过了一会儿，大家慢慢劝住了，黛玉才拜见了外祖母。
此即冷子兴所云之史氏太君，贾赦贾政之母也。|这就是冷子兴说的史老太君，贾赦、贾政的母亲。
当下贾母一一指与黛玉：“这是你大舅母，这是你二舅母，这是你先珠大哥的媳妇珠大嫂子。”|贾母一个个指给黛玉看：“这是你大舅母，这是你二舅母，这是你已故的珠大哥的媳妇，珠大嫂子。”
黛玉一一拜见过。|黛玉一一拜见了。
贾母又说：“请姑娘们来。|贾母又说：“去请姑娘们来。
今日远客才来，可以不必上学去了。”|今天远客刚到，可以不用上学了。”
众人答应了一声，便去了两个。|大家答应一声，去了两个人。
! 大舅母是邢夫人，二舅母是王夫人，珠大嫂子是李纨。

# 七、三春姊妹
不一时，只见三个奶嬷嬷并五六个丫鬟，簇拥著三个姊妹来了。|不一会儿，三个奶妈和五六个丫鬟簇拥着三位姑娘来了。
第一个肌肤微丰，合中身材，腮凝新荔，鼻腻鹅脂，温柔沉默，观之可亲。|第一个皮肤微胖，中等身材，脸颊像新剥的荔枝，鼻子像鹅油一样细腻，温柔安静，看着就让人亲近。
第二个削肩细腰，长挑身材，鸭蛋脸面，俊眼修眉，顾盼神飞，文彩精华，见之忘俗。|第二个肩膀瘦削，腰身纤细，个子高挑，鸭蛋脸，眼睛好看，眉毛修长，眼神灵动有光彩，一身文采风华，让人见了就忘掉俗气。
第三个身量未足，形容尚小。|第三个还没长成，模样还小。
其钗环裙袄，三人皆是一样的妆饰。|三人的首饰衣裙，都是一样的打扮。
黛玉忙起身迎上来见礼，互相厮认过，大家归了坐。|黛玉忙起身迎上去见礼，互相认过，大家坐下。
丫鬟们斟上茶来。|丫鬟们倒上茶来。
不过说些黛玉之母如何得病，如何请医服药，如何送死发丧。|说的不过是黛玉的母亲怎么得的病，怎么请医吃药，怎么去世发丧。
不免贾母又伤感起来，因说：“我这些儿女，所疼者独有你母，今日一旦先舍我而去，连面也不能一见，今见了你，我怎不伤心！”|贾母又难过起来，说：“我这些儿女里，最疼的就是你母亲。如今她先丢下我走了，连最后一面都没见上。现在见了你，我怎么能不伤心！”
说著，搂了黛玉在怀，又呜咽起来。|说着，把黛玉搂在怀里，又呜呜地哭起来。
众人忙都宽慰解释，方略略止住。|大家忙着安慰，才稍稍止住。
! 三人依次是迎春、探春、惜春。作者只给探春写了“顾盼神飞”的神采，暗示她是三人中最出色的。
! 贾母说最疼的是黛玉的母亲，这份疼爱后来就转到了黛玉身上。

# 八、黛玉的病与癞头和尚
众人见黛玉年貌虽小，其举止言谈不俗，身体面庞虽怯弱不胜，却有一段自然的风流态度，便知他有不足之症。|大家见黛玉年纪虽小，举止谈吐却不俗；身体和脸庞看着很柔弱，却有一种天然的风度，就知道她身上有病。
因问：“常服何药，如何不急为疗治？”|于是问她：“平常吃什么药？怎么不赶紧治一治？”
黛玉道：“我自来是如此，从会吃饮食时便吃药，到今日未断，请了多少名医修方配药，皆不见效。|黛玉说：“我从小就这样，从会吃饭起就吃药，到今天也没断过。请了许多名医开方配药，都不见效。
那一年我三岁时，听得说来了一个癞头和尚，说要化我去出家，我父母固是不从。|我三岁那年，听说来了个癞头和尚，要化我去出家，我父母当然不答应。
他又说：既舍不得他，只怕他的病一生也不能好的了。|他又说：既然舍不得她，只怕她的病一辈子也好不了。
若要好时，除非从此以后总不许见哭声，除父母之外，凡有外姓亲友之人，一概不见，方可平安了此一世。’|要想好，除非从今以后不让她听见哭声；除了父母，凡是外姓的亲友一概不见，才能平平安安过一辈子。’
疯疯癫癫，说了这些不经之谈，也没人理他。|他疯疯癫癫说了这些荒唐话，也没人理他。
如今还是吃人参养荣丸。”|现在还是吃人参养荣丸。”
贾母道：“正好，我这里正配丸药呢。|贾母说：“正好，我这里正在配丸药。
叫他们多配一料就是了。”|让他们多配一份就是了。”
! 和尚的两个条件，黛玉进贾府全都犯了：见了外姓亲戚，后来又天天哭。这是在预告她的结局。
! “还泪”的故事在这里接上了：黛玉一生不能不哭。

# 九、王熙凤出场
一语未了，只听后院中有人笑声，说：“我来迟了，不曾迎接远客！”|话还没说完，只听后院有人笑着说：“我来晚了，没迎接远客！”
黛玉纳罕道：“这些人个个皆敛声屏气，恭肃严整如此，这来者系谁，这样放诞无礼？”|黛玉暗暗奇怪：“这里的人个个都屏声静气、规规矩矩的，来的这是谁，这么随便放肆？”
心下想时，只见一群媳妇丫鬟围拥著一个人从后房门进来。|正想着，只见一群媳妇丫鬟簇拥着一个人从后门进来。
这个人打扮与众姑娘不同，彩绣辉煌，恍若神妃仙子：|这人的打扮跟姑娘们都不一样，满身彩绣，光彩夺目，好像神妃仙女：
头上戴著金丝八宝攒珠髻，绾著朝阳五凤挂珠钗，项上戴著赤金盘螭璎珞圈，裙边系著豆绿宫绦，双衡比目玫瑰佩，|头上戴着金丝穿成、镶嵌各种珠宝的发髻，插着五只凤凰朝着太阳、凤嘴垂着珠串的钗；脖子上戴着赤金盘龙项圈；裙边系着豆绿色宫绦，挂着一对比目鱼形状的玫瑰色玉佩；
身上穿著缕金百蝶穿花大红洋缎窄褙袄，外罩五彩刻丝石青银鼠褂，下著翡翠撒花洋绉裙。|身上穿着金线绣百蝶穿花的大红洋缎紧身袄，外面罩着五彩缂丝的石青色银鼠皮褂，下面是翡翠色撒花洋绉裙。
一双丹凤三角眼，两弯柳叶吊梢眉，身量苗条，体格风骚，粉面含春威不露，丹唇未起笑先开。|一双丹凤三角眼，两道柳叶吊梢眉；身材苗条，体态风流；粉脸上带着春意，威严藏而不露；红唇还没张开，笑声先传了出来。
黛玉连忙起身接见。|黛玉连忙起身相见。
贾母笑道，“你不认得他，他是我们这里有名的一个泼皮破落户儿，南省俗谓作‘辣子’，你只叫他‘凤辣子’就是了。”|贾母笑道：“你不认得她，她是我们这儿出了名的泼皮无赖，南方话叫‘辣子’，你就叫她‘凤辣子’好了。”
黛玉正不知以何称呼，只见众姊妹都忙告诉他道：“这是琏嫂子。”|黛玉正不知道该怎么称呼，姐妹们忙告诉她：“这是琏嫂子。”
黛玉虽不识，也曾听见母亲说过，大舅贾赦之子贾琏，娶的就是二舅母王氏之内侄女，自幼假充男儿教养的，学名王熙凤。|黛玉虽然不认识，也听母亲说过：大舅贾赦的儿子贾琏，娶的是二舅母王夫人的娘家侄女，从小当男孩子养大，学名叫王熙凤。
黛玉忙陪笑见礼，以“嫂”呼之。|黛玉忙笑着行礼，叫她“嫂子”。
这熙凤携著黛玉的手，上下细细打谅了一回，仍送至贾母身边坐下，因笑道：|熙凤拉着黛玉的手，上上下下细细打量了一番，又送回贾母身边坐下，笑着说：
“天下真有这样标致的人物，我今儿才算见了！|“天下真有这么漂亮的人，我今天才算见到了！
况且这通身的气派，竟不象老祖宗的外孙女儿，竟是个嫡亲的孙女，怨不得老祖宗天天口头心头一时不忘。|再看这一身的气派，不像老祖宗的外孙女，倒像亲孙女，难怪老祖宗天天挂在嘴上、放在心上。
只可怜我这妹妹这样命苦，怎么姑妈偏就去世了！”|只可怜我这妹妹命这么苦，姑妈怎么偏偏就去世了！”
说著，便用帕拭泪。|说着，就拿手帕擦眼泪。
贾母笑道：“我才好了，你倒来招我。|贾母笑道：“我刚好些，你又来惹我。
你妹妹远路才来，身子又弱，也才劝住了，快再休提前话。”|你妹妹远道才来，身子又弱，好不容易才劝住，快别再提了。”
这熙凤听了，忙转悲为喜道：“正是呢！|熙凤听了，马上转悲为喜说：“可不是嘛！
我一见了妹妹，一心都在他身上了，又是喜欢，又是伤心，竟忘记了老祖宗。|我一见妹妹，心思全在她身上，又高兴又伤心，竟把老祖宗给忘了。
该打，该打！”|该打，该打！”
又忙携黛玉之手，问：“妹妹几岁了？|又忙拉着黛玉的手问：“妹妹几岁了？
可也上过学？|上过学没有？
现吃什么药？|现在吃什么药？
在这里不要想家，想要什么吃的，什么玩的，只管告诉我，丫头老婆们不好了，也只管告诉我。”|在这儿别想家，想吃什么、玩什么，只管告诉我；丫头婆子们伺候得不好，也只管告诉我。”
一面又问婆子们：“林姑娘的行李东西可搬进来了？|一边又问婆子们：“林姑娘的行李搬进来没有？
带了几个人来？|带了几个人来？
你们赶早打扫两间下房，让他们去歇歇。”|你们赶紧收拾两间下人房，让他们去歇歇。”
! 别人都屏声静气，只有她未见其人先闻其声。这一笑就写出了她在贾府的地位。
! 她夸黛玉“竟是个嫡亲的孙女”，一句话夸了三个人：黛玉、贾母，还有在场的三位亲孙女。眼泪说来就来、说收就收，全看贾母的脸色。
! 判词说她“凡鸟偏从末世来”。“凡鸟”合起来是“凤”字。

# 十、凤姐管家
说话时，已摆了茶果上来。|说话间，茶点已经摆上来了。
熙凤亲为捧茶捧果。|熙凤亲自端茶递果子。
又见二舅母问他：“月钱放过了不曾？”|又听二舅母问她：“月钱发了没有？”
熙凤道：“月钱已放完了。|熙凤说：“月钱已经发完了。
才刚带著人到后楼上找缎子，找了这半日，也并没有见昨日太太说的那样的，想是太太记错了？”|刚才带人到后楼上找缎子，找了半天，也没看见昨天太太说的那种，是不是太太记错了？”
王夫人道：“有没有，什么要紧。”|王夫人说：“有没有，不要紧。”
因又说道：“该随手拿出两个来给你这妹妹去裁衣裳的，等晚上想著叫人再去拿罢，可别忘了。”|又说：“应该顺手拿两匹出来给你妹妹做衣裳。晚上记着叫人再去拿吧，可别忘了。”
熙凤道：“这倒是我先料著了，知道妹妹不过这两日到的，我已预备下了，等太太回去过了目好送来。”|熙凤说：“这我早想到了。知道妹妹这两天就到，我已经准备好了，等太太回去看过就送来。”
王夫人一笑，点头不语。|王夫人笑了笑，点点头没说话。
! 荣府管家的是凤姐，不是王夫人。“月钱”这一句是伏笔，后面会写到她拿月钱放高利贷。
! 王夫人刚提起缎子，凤姐就说早预备好了。是真早预备了，还是随口应下，作者没说破。

# 十一、拜见大舅贾赦
当下茶果已撤，贾母命两个老嬷嬷带了黛玉去见两个母舅。|茶点撤下后，贾母让两个老嬷嬷带黛玉去见两位舅舅。
时贾赦之妻邢氏忙亦起身，笑回道：“我带了外甥女过去，倒也便宜。”|这时贾赦的妻子邢夫人也忙站起来，笑着说：“我带外甥女过去，也方便。”
贾母笑道：“正是呢，你也去罢，不必过来了。”|贾母笑道：“正是，你也去吧，不用再过来了。”
邢夫人答应了一声“是”字，遂带了黛玉与王夫人作辞，大家送至穿堂前。|邢夫人答应一声“是”，就带着黛玉向王夫人告辞，大家送到穿堂前。
出了垂花门，早有众小厮们拉过一辆翠幄青䌷车，邢夫人携了黛玉，坐在上面，众婆子们放下车帘，方命小厮们抬起，拉至宽处，方驾上驯骡，亦出了西角门，往东过荣府正门，便入一黑油大门中，至仪门前方下来。|出了垂花门，小厮们早拉来一辆挂着翠绿帷幔的青绸车。邢夫人拉着黛玉坐上去，婆子们放下车帘，才叫小厮们抬起来，拉到宽敞的地方套上骡子，也从西角门出去，往东经过荣府正门，进了一座黑漆大门，到了仪门前才下车。
众小厮退出，方打起车帘，邢夫人搀著黛玉的手，进入院中。|小厮们退出去，才掀起车帘。邢夫人搀着黛玉的手进了院子。
黛玉度其房屋院宇，必是荣府中花园隔断过来的。|黛玉看这院子房屋，猜想一定是从荣府花园里隔出来的。
进入三层仪门，果见正房厢庑游廊，悉皆小巧别致，不似方才那边轩峻壮丽，且院中随处之树木山石皆在。|进了三层仪门，果然正房、厢房、游廊都小巧别致，不像刚才那边高大气派，院子里到处还留着树木和假山石。
一时进入正室，早有许多盛妆丽服之姬妾丫鬟迎著，邢夫人让黛玉坐了，一面命人到外面书房去请贾赦。|进了正房，早有许多打扮华丽的姬妾丫鬟迎着。邢夫人让黛玉坐下，一边叫人去外面书房请贾赦。
一时人来回话说：“老爷说了：‘连日身上不好，见了姑娘彼此倒伤心，暂且不忍相见。|一会儿有人回话说：“老爷说：‘这几天身上不舒服，见了姑娘彼此都伤心，暂时不忍心见面。
劝姑娘不要伤心想家，跟著老太太和舅母，即同家里一样。|劝姑娘别伤心想家，跟着老太太和舅母，就跟在自己家一样。
姊妹们虽拙，大家一处伴著，亦可以解些烦闷。|姐妹们虽然笨，大家在一起做伴，也能解解闷。
或有委屈之处，只管说得，不要外道才是。’”|要是受了委屈，只管说，别见外。’”
黛玉忙站起来，一一听了。|黛玉连忙站起来，一一听着。
再坐一刻，便告辞。|又坐了一会儿，就告辞。
邢夫人苦留吃过晚饭去，黛玉笑回道：“舅母爱惜赐饭，原不应辞，只是还要过去拜见二舅舅，恐领了赐去不恭，异日再领，未为不可。|邢夫人再三留她吃了晚饭再走。黛玉笑着说：“舅母疼我留饭，本不该推辞，只是还要去拜见二舅舅，吃了饭再去怕不恭敬，改天再来吃，也不迟。
望舅母容谅。”|请舅母原谅。”
邢夫人听说，笑道：“这倒是了。”|邢夫人听了笑道：“这倒也是。”
遂令两三个嬷嬷用方才的车好生送了姑娘过去，于是黛玉告辞。|就让两三个嬷嬷用刚才的车好好送姑娘过去，黛玉于是告辞。
邢夫人送至仪门前，又嘱咐了众人几句，眼看著车去了方回来。|邢夫人送到仪门前，又嘱咐了众人几句，看着车走远了才回去。
! 贾赦是长子，却住在从花园隔出来的偏院里，正院让给了弟弟贾政。兄弟俩在贾母心里的分量，从住处就看得出来。
! 贾赦推说身体不好不见外甥女，屋里却满是“姬妾丫鬟”。

# 十二、荣禧堂
一时黛玉进了荣府，下了车。|不一会儿黛玉回到荣府，下了车。
众嬷嬷引著，便往东转弯，穿过一个东西的穿堂，向南大厅之后，仪门内大院落，上面五间大正房，两边厢房鹿顶耳房钻山，四通八达，轩昂壮丽，比贾母处不同。|嬷嬷们领着往东拐，穿过一条东西向的穿堂，到了朝南大厅的后面。仪门里是个大院子，上面五间大正房，两边是厢房和耳房，四通八达，高大气派，跟贾母那里又不一样。
黛玉便知这方是正经正内室，一条大甬路，直接出大门的。|黛玉就知道这才是正经的正房，一条大甬路直通大门。
进入堂屋中，抬头迎面先看见一个赤金九龙青地大匾，匾上写著斗大的三个大字，是“荣禧堂”，后有一行小字：“某年月日，书赐荣国公贾源”，又有“万几宸翰之宝”。|进了堂屋，抬头先看见一块青底、赤金九条龙边框的大匾，上面写着斗大的三个字“荣禧堂”，后面一行小字：“某年月日，书赐荣国公贾源”，还盖着皇帝的印“万几宸翰之宝”。
大紫檀雕螭案上，设著三尺来高青绿古铜鼎，悬著待漏随朝墨龙大画，一边是金蜼彝，一边是玻璃盒。|大紫檀雕龙长案上，摆着三尺来高的青绿古铜鼎，墙上挂着一幅大臣候驾上朝的墨龙大画；案上一边是金质的古酒器，一边是玻璃盒子。
地下两溜十六张楠木交椅，又有一副对联，乃乌木联牌，镶著錾银的字迹，道是：|地上两排摆着十六张楠木交椅。还有一副乌木对联牌，镶着银字，写的是：
~座上珠玑昭日月，堂前黼黻焕烟霞。|座上客人佩戴的珠玉像日月一样闪耀，堂前官员的礼服像烟霞一样灿烂。
下面一行小字，道是：“同乡世教弟勋袭东安郡王穆莳拜手书”。|下面一行小字：“同乡世交晚辈、世袭东安郡王穆莳敬书”。
! 匾是皇帝写的，联是郡王写的。荣府的体面全在这间屋子里，可平时没人在这里住。

# 十三、拜见王夫人
原来王夫人时常居坐宴息，亦不在这正室，只在这正室东边的三间耳房内。|原来王夫人平时起居休息也不在这正房，只在正房东边的三间耳房里。
于是老嬷嬷引黛玉进东房门来。|于是老嬷嬷领黛玉进了东边的房门。
临窗大炕上铺著猩红洋罽，正面设著大红金钱蟒靠背，石青金钱蟒引枕，秋香色金钱蟒大条褥。|靠窗的大炕上铺着猩红色的进口毛毯，正面放着大红色金钱蟒纹的靠背、石青色金钱蟒纹的靠枕、秋香色金钱蟒纹的长褥子。
两边设一对梅花式洋漆小几。|两边放着一对梅花形的洋漆小桌。
左边几上文王鼎匙箸香盒，右边几上汝窑美人觚——觚内插著时鲜花卉，并茗碗痰盒等物。|左边桌上是文王鼎、香匙香箸和香盒；右边桌上是汝窑美人瓶，瓶里插着时令鲜花，还有茶碗、痰盒等东西。
地下面西一溜四张椅上，都搭著银红撒花椅搭，底下四副脚踏。|地上朝西的一排四张椅子，都搭着银红色撒花椅套，下面放着四个脚踏。
椅之两边，也有一对高几，几上茗碗瓶花俱备。|椅子两边也有一对高脚桌，桌上茶碗、花瓶都齐全。
其馀陈设，自不必细说。|别的陈设就不用细说了。
老嬷嬷们让黛玉炕上坐，炕沿上却有两个锦褥对设，黛玉度其位次，便不上炕，只向东边椅子上坐了。|老嬷嬷们让黛玉上炕坐，可炕沿上面对面放着两个锦褥。黛玉想到那是主人的座位，就没上炕，只在东边椅子上坐了。
本房内的丫鬟忙捧上茶来。|屋里的丫鬟忙端上茶来。
黛玉一面吃茶，一面打谅这些丫鬟们，妆饰衣裙，举止行动，果亦与别家不同。|黛玉一边喝茶，一边打量这些丫鬟，她们的打扮和举止，果然也跟别人家不同。
茶未吃了，只见一个穿红绫袄青缎掐牙背心的丫鬟走来笑说道：“太太说，请林姑娘到那边坐罢。”|茶还没喝完，一个穿红绫袄、青缎镶边背心的丫鬟走来笑着说：“太太说，请林姑娘到那边去坐。”
老嬷嬷听了，于是又引黛玉出来，到了东廊三间小正房内。|老嬷嬷听了，又领黛玉出来，到了东廊的三间小正房里。
正房炕上横设一张炕桌，桌上磊著书籍茶具，靠东壁面西设著半旧的青缎靠背引枕。|炕上横放着一张炕桌，桌上堆着书和茶具；靠东墙朝西放着半旧的青缎靠背和靠枕。
王夫人却坐在西边下首，亦是半旧的青缎靠背坐褥。|王夫人坐在西边下首，也是半旧的青缎靠背和坐褥。
见黛玉来了，便往东让。|看见黛玉来了，就让她往东边坐。
黛玉心中料定这是贾政之位。|黛玉心里断定东边是贾政的座位。
因见挨炕一溜三张椅子上，也搭著半旧的弹墨椅袱，黛玉便向椅上坐了。|看见挨着炕一排三张椅子，也搭着半旧的弹墨椅套，黛玉就在椅子上坐了。
王夫人再四携他上炕，他方挨王夫人坐了。|王夫人再三拉她上炕，她才挨着王夫人坐下。
! 黛玉两次不肯上炕，因为炕上是主人的座位。她果然“步步留心”。
! 正房富丽堂皇，王夫人日常用的却是“半旧”的东西。后面写宝钗的衣服也是“半新不旧”。

# 十四、王夫人说“混世魔王”
王夫人因说：“你舅舅今日斋戒去了，再见罢。|王夫人说：“你舅舅今天斋戒去了，以后再见吧。
只是有一句话嘱咐你：你三个姊妹倒都极好，以后一处念书认字学针线，或是偶一顽笑，都有尽让的。|只是有句话要嘱咐你：你三个姐妹都很好，以后一起念书认字、学针线，或者偶尔玩笑，都会让着你。
但我不放心的最是一件：我有一个孽根祸胎，是家里的‘混世魔王’，今日因庙里还愿去了，尚未回来，晚间你看见便知了。|只有一件我最不放心：我有个惹祸的孽障，是家里的‘混世魔王’。今天去庙里还愿了，还没回来，晚上你见了就知道。
你只以后不要睬他，你这些姊妹都不敢沾惹他的。”|你以后别理他，你这些姐妹都不敢招惹他。”
黛玉亦常听得母亲说过，二舅母生的有个表兄，乃衔玉而诞，顽劣异常，极恶读书，最喜在内帏厮混，外祖母又极溺爱，无人敢管。|黛玉也常听母亲说过：二舅母生了个表哥，生下来嘴里衔着玉，特别淘气，最讨厌读书，最喜欢在女孩子堆里混，外祖母又特别宠他，没人敢管。
今见王夫人如此说，便知说的是这表兄了。|现在听王夫人这么说，就知道说的是这位表哥。
因陪笑道：“舅母说的，可是衔玉所生的这位哥哥？|于是赔笑说：“舅母说的，是不是生下来衔着玉的那位哥哥？
在家时亦曾听见母亲常说，这位哥哥比我大一岁，小名就唤宝玉，虽极憨顽，说在姊妹情中极好的。|在家时也常听母亲说，这位哥哥比我大一岁，小名叫宝玉，虽然很淘气，对姐妹们却特别好。
况我来了，自然只和姊妹同处，兄弟们自是别院另室的，岂得去沾惹之理？”|况且我来了，自然只跟姐妹们在一起，兄弟们都住别的院子，哪有去招惹的道理？”
王夫人笑道：“你不知道原故：他与别人不同，自幼因老太太疼爱，原系同姊妹们一处娇养惯了的。|王夫人笑道：“你不知道缘故。他跟别人不一样，从小老太太疼他，一直跟姐妹们一起娇养惯了。
若姊妹们有日不理他，他倒还安静些，纵然他没趣，不过出了二门，背地里拿著他两个小幺儿出气，咕唧一会子就完了。|要是姐妹们哪天不理他，他倒还安静些；就算觉得没意思，也不过出了二门，背地里拿两个小厮出出气，嘀咕一阵就完了。
若这一日姊妹们和他多说一句话，他心里一乐，便生出多少事来。|要是哪天姐妹们跟他多说一句话，他心里一高兴，就会闹出好多事来。
所以嘱咐你别睬他。|所以嘱咐你别理他。
他嘴里一时甜言蜜语，一时有天无日，一时又疯疯傻傻，只休信他。”|他嘴里一会儿甜言蜜语，一会儿胡说八道，一会儿又疯疯傻傻，千万别信他。”
! 宝玉还没出场，先听三次介绍：冷子兴说他爱女孩，母亲说他是“混世魔王”，黛玉说他“在姊妹情中极好”。三种说法，三种眼光。

# 十五、在贾母处吃饭
黛玉一一的都答应著。|黛玉都一一答应着。
只见一个丫鬟来回：“老太太那里传晚饭了。”|这时一个丫鬟来报：“老太太那边开晚饭了。”
王夫人忙携黛玉从后房门由后廊往西，出了角门，是一条南北宽夹道。|王夫人忙拉着黛玉从后门出来，顺着后廊往西走，出了角门，是一条南北向的宽夹道。
南边是倒座三间小小的抱厦厅，北边立著一个粉油大影壁，后有一半大门，小小一所房室。|南边是三间朝北的小抱厦厅，北边立着一面白粉大影壁，影壁后面有一扇不大不小的门，里面是一所小房子。
王夫人笑指向黛玉道：“这是你凤姐姐的屋子，回来你好往这里找他来，少什么东西，你只管和他说就是了。”|王夫人笑着指给黛玉看：“这是你凤姐姐的屋子，以后你可以来这儿找她。缺什么东西，只管跟她说。”
这院门上也有四五个才总角的小厮，都垂手侍立。|这院门口也站着四五个刚扎起小辫的小厮，都垂着手站着伺候。
王夫人遂携黛玉穿过一个东西穿堂，便是贾母的后院了。|王夫人拉着黛玉穿过一条东西向的穿堂，就到了贾母的后院。
于是，进入后房门，已有多人在此伺候，见王夫人来了，方安设桌椅。|进了后门，已经有许多人在伺候，看见王夫人来了，才摆好桌椅。
贾珠之妻李氏捧饭，熙凤安箸，王夫人进羹。|贾珠的妻子李纨端饭，熙凤摆筷子，王夫人上汤。
贾母正面榻上独坐，两边四张空椅，熙凤忙拉了黛玉在左边第一张椅上坐了，黛玉十分推让。|贾母独自坐在正面的榻上，两边四张空椅子。熙凤忙拉黛玉坐左边第一张，黛玉再三推辞。
贾母笑道：“你舅母你嫂子们不在这里吃饭。|贾母笑道：“你舅母、你嫂子们不在这里吃饭。
你是客，原应如此坐的。”|你是客，本来就该这么坐。”
黛玉方告了座，坐了。|黛玉这才告了座，坐下了。
贾母命王夫人坐了。|贾母让王夫人也坐下。
迎春姊妹三个告了座方上来。|迎春姐妹三个告了座才上来。
迎春便坐右手第一，探春左第二，惜春右第二。|迎春坐右边第一，探春坐左边第二，惜春坐右边第二。
旁边丫鬟执著拂尘，漱盂，巾帕。|旁边丫鬟拿着拂尘、漱口盂和手巾。
李，凤二人立于案旁布让。|李纨、凤姐两人站在桌边夹菜让菜。
外间伺候之媳妇丫鬟虽多，却连一声咳嗽不闻。|外间伺候的媳妇丫鬟虽然很多，却连一声咳嗽都听不到。
寂然饭毕，各有丫鬟用小茶盘捧上茶来。|安安静静吃完饭，各有丫鬟用小茶盘端上茶来。
当日林如海教女以惜福养身，云饭后务待饭粒咽尽，过一时再吃茶，方不伤脾胃。|当初林如海教女儿惜福养身，说饭后一定要等饭咽下去，过一会儿再喝茶，才不伤脾胃。
今黛玉见了这里许多事情不合家中之式，不得不随的，少不得一一改过来，因而接了茶。|现在黛玉看这里许多规矩跟家里不一样，不得不跟着做，只好一一改过来，就接了茶。
早见人又捧过漱盂来，黛玉也照样漱了口。|早有人又端来漱口盂，黛玉也照着漱了口。
盥手毕，又捧上茶来，这方是吃的茶。|洗完手，又端上茶来，这才是喝的茶。
贾母便说：“你们去罢，让我们自在说话儿。”|贾母就说：“你们去吧，让我们自在说说话。”
王夫人听了，忙起身，又说了两句闲话，方引凤，李二人去了。|王夫人听了，忙起身，又说了几句闲话，才带凤姐、李纨走了。
贾母因问黛玉念何书。|贾母问黛玉念了什么书。
黛玉道：“只刚念了《四书》。”|黛玉说：“刚念完《四书》。”
黛玉又问姊妹们读何书。|黛玉又问姐妹们读什么书。
贾母道：“读的是什么书，不过是认得两个字，不是睁眼的瞎子罢了！”|贾母说：“读什么书！不过认识几个字，不当睁眼瞎罢了！”
! 饭桌的座次就是一张权力图：贾母独坐，媳妇们站着伺候，黛玉作为客人坐了首位。
! 黛玉说念了《四书》，贾母却说姑娘们“不过认得两个字”。后来宝玉问她，她就改口说“不曾读”。她在学着看人说话。

# 十六、宝玉出场
一语未了，只听外面一阵脚步响，丫鬟进来笑道：“宝玉来了！”|话还没说完，只听外面一阵脚步声，丫鬟进来笑道：“宝玉来了！”
黛玉心中正疑惑著：“这个宝玉，不知是怎生个惫懒人物，懵懂顽童？”|黛玉心里正嘀咕：“这个宝玉，不知是个怎样顽皮的家伙、糊涂的小孩？”
倒不见那蠢物也罢了。|不见那蠢东西倒也罢了。
心中想著，忽见丫鬟话未报完，已进来了一位年轻的公子：|正想着，丫鬟话还没报完，就进来一位年轻公子：
头上戴著束发嵌宝紫金冠，齐眉勒著二龙抢珠金抹额，穿一件二色金百蝶穿花大红箭袖，束著五彩丝攒花结长穗宫绦，外罩石青起花八团倭锻排穗褂，登著青缎粉底小朝靴。|头上戴着束发的镶宝石紫金冠，额上勒着二龙抢珠的金抹额；穿一件两色金线绣百蝶穿花的大红箭袖袍，腰系五彩丝线编花、垂着长穗的宫绦；外面罩着石青色八团花纹的日本缎排穗褂子，脚蹬青缎面白底小朝靴。
面若中秋之月，色如春晓之花，鬓若刀裁，眉如墨画，面如桃瓣，目若秋波。|脸像中秋的月亮，气色像春天早晨的花；鬓角像刀裁的一样整齐，眉毛像墨画的一样；脸像桃花瓣，眼睛像秋水。
虽怒时而若笑，即瞋视而有情。|就算生气的时候也像在笑，就算瞪着眼也含着情。
项上金螭璎珞，又有一根五色丝绦，系著一块美玉。|脖子上戴着金螭项圈，还有一根五色丝绳，系着一块美玉。
黛玉一见，便吃一大惊，心下想道：“好生奇怪，倒象在那里见过一般，何等眼熟到如此！”|黛玉一见，大吃一惊，心想：“真奇怪，好像在哪儿见过，怎么这么眼熟！”
只见这宝玉向贾母请了安，贾母便命：“去见你娘来。”|宝玉向贾母请了安，贾母就说：“去见你娘吧。”
宝玉即转身去了。|宝玉转身就去了。
一时回来，再看，已换了冠带：|一会儿回来，再看，已经换了装束：
头上周围一转的短发，都结成小辫，红丝结束，共攒至顶中胎发，总编一根大辫，黑亮如漆，从顶至梢，一串四颗大珠，用金八宝坠角，|头上一圈短发都编成小辫，用红丝绳扎着，一起拢到头顶的胎发上，合编成一根大辫子，黑亮得像漆一样；从头顶到辫梢缀着四颗大珠子，辫尾坠着金八宝坠子；
身上穿著银红撒花半旧大袄，仍旧带著项圈，宝玉，寄名锁，护身符等物，下面半露松花撒花绫裤腿，锦边弹墨袜，厚底大红鞋。|身上穿着半旧的银红撒花大袄，仍旧戴着项圈、宝玉、寄名锁、护身符这些东西；下面露出半截松花绿撒花绫裤腿，锦边弹墨袜子，厚底大红鞋。
越显得面如敷粉，唇若施脂，转盼多情，语言常笑。|越发显得脸像搽了粉，嘴唇像抹了胭脂；眼睛一转就含着情，说话总带着笑。
天然一段风骚，全在眉梢，平生万种情思，悉堆眼角。|天生的风流全在眉梢，一辈子的万种情思都堆在眼角。
看其外貌最是极好，却难知其底细。|看外表真是好极了，可他的底细就难说了。
后人有《西江月》二词，批宝玉极恰，其词曰：|后人写了两首《西江月》词，评宝玉评得极恰当，词是：
~无故寻愁觅恨，有时似傻如狂。纵然生得好皮囊，腹内原来草莽。|没缘没故地自寻烦恼，有时候像傻子又像疯子。虽然长了一副好皮囊，肚子里原来是一包草。
~潦倒不通世务，愚顽怕读文章。行为偏僻性乖张，那管世人诽谤！|落拓不懂人情世故，愚笨顽劣，怕读圣贤文章。行为古怪，性情别扭，哪管世人怎么骂！
~富贵不知乐业，贫穷难耐凄凉。可怜辜负好韶光，于国于家无望。|富贵时不知道好好经营家业，穷了又受不了凄凉。可惜白白辜负了大好年华，对国对家都没指望。
~天下无能第一，古今不肖无双。寄言纨绔与膏粱：莫效此儿形状！|天下最没本事的第一号，古往今来最不成器的独一份。奉劝那些富家子弟：千万别学这孩子的样子！
! 黛玉觉得眼熟，正是前世的神瑛侍者和绛珠草，在人间重逢了。
! 《西江月》表面是骂，其实是反话正说。“于国于家无望”，恰恰因为宝玉不肯走世人那条读书做官的路。

# 十七、宝黛初会
贾母因笑道：“外客未见，就脱了衣裳，还不去见你妹妹！”|贾母笑道：“客人还没见，就先换了衣服，还不快去见你妹妹！”
宝玉早已看见多了一个姊妹，便料定是林姑妈之女，忙来作揖。|宝玉早看见多了一个姐妹，猜到一定是林姑妈的女儿，忙过来作揖。
厮见毕归坐，细看形容，与众各别：|见过礼坐下，宝玉细看她的模样，跟别人都不一样：
两湾似蹙非蹙罥烟眉，一双似泣非泣含露目。|两道像皱非皱、如轻烟笼着的眉毛，一双像哭非哭、含着泪光的眼睛。
态生两靥之愁，娇袭一身之病。|两颊带着愁容，一身娇弱多病。
泪光点点，娇喘微微。|眼里泪光点点，呼吸轻轻细细。
闲静时如姣花照水，行动处似弱柳扶风。|安静时像娇美的花映在水里，走起路来像柔弱的柳枝在风中摇摆。
心较比干多一窍，病如西子胜三分。|心思比比干还多一窍，病态比西施还多三分。（比干是商朝忠臣，传说有七窍玲珑心）
宝玉看罢，因笑道：“这个妹妹我曾见过的。”|宝玉看完，笑道：“这个妹妹我见过的。”
贾母笑道：“可又是胡说，你又何曾见过他？”|贾母笑道：“又胡说了，你在哪儿见过她？”
宝玉笑道：“虽然未曾见过他，然我看著面善，心里就算是旧相识，今日只作远别重逢，亦未为不可。”|宝玉笑道：“虽然没见过，可我看着面熟，心里就当是老相识，今天就当久别重逢，也没什么不可以。”
贾母笑道：“更好，更好，若如此，更相和睦了。”|贾母笑道：“更好，更好，这样就更和睦了。”
宝玉便走近黛玉身边坐下，又细细打量一番，因问：“妹妹可曾读书？”|宝玉就走到黛玉身边坐下，又细细打量一番，问：“妹妹读过书吗？”
黛玉道：“不曾读，只上了一年学，些须认得几个字。”|黛玉说：“没读过，只上了一年学，认得几个字。”
宝玉又道：“妹妹尊名是那两个字？”|宝玉又问：“妹妹叫什么名字？”
黛玉便说了名。|黛玉就说了名字。
宝玉又问表字。|宝玉又问她的字。
黛玉道：“无字。”|黛玉说：“没有字。”
宝玉笑道：“我送妹妹一妙字，莫若‘颦颦’二字极妙。”|宝玉笑道：“我送妹妹一个妙字，‘颦颦’两个字最好。”
探春便问何出。|探春就问出自哪里。
宝玉道：“《古今人物通考》上说：‘西方有石名黛，可代画眉之墨。’|宝玉说：“《古今人物通考》上说：‘西方有一种石头叫黛，可以代替画眉的墨。’
况这林妹妹眉尖若蹙，用取这两个字，岂不两妙！”|何况林妹妹眉尖好像总皱着，用这两个字，岂不是两全其美！”（“颦”就是皱眉）
探春笑道：“只恐又是你的杜撰。”|探春笑道：“只怕又是你瞎编的。”
宝玉笑道：“除《四书》外，杜撰的太多，偏只我是杜撰不成？”|宝玉笑道：“除了《四书》，瞎编的书多着呢，难道偏偏只有我瞎编？”
! 两人都觉得“见过”，一个心里想，一个说出口。这就是木石前盟。
! “心较比干多一窍”写黛玉聪明敏感，“病如西子”写她体弱。两句就是她的一生。
! 宝玉随口就说除了《四书》都是杜撰，正是《西江月》里说的“愚顽怕读文章”。

# 十八、宝玉摔玉
又问黛玉：“可也有玉没有？”|宝玉又问黛玉：“你也有玉吗？”
众人不解其语，黛玉便忖度著因他有玉，故问我有也无，因答道：“我没有那个。|大家都不明白他的意思。黛玉想，因为他有玉，所以问我有没有，就回答说：“我没有那个。
想来那玉是一件罕物，岂能人人有的。”|想来那玉是件稀罕东西，哪能人人都有。”
宝玉听了，登时发作起痴狂病来，摘下那玉，就狠命摔去，骂道：“什么罕物，连人之高低不择，还说‘通灵’不‘通灵’呢！|宝玉听了，立刻发起疯来，摘下玉就狠狠地摔出去，骂道：“什么稀罕东西，连人的好坏都分不出，还说什么‘通灵’不‘通灵’！
我也不要这劳什子了！”|我不要这破玩意儿了！”
吓的众人一拥争去拾玉。|吓得大家一拥而上去抢着捡玉。
贾母急的搂了宝玉道：“孽障！|贾母急得搂住宝玉说：“孽障！
你生气，要打骂人容易，何苦摔那命根子！”|你生气了，要打人骂人都容易，何必摔你的命根子！”
宝玉满面泪痕泣道：“家里姐姐妹妹都没有，单我有，我说没趣，如今来了这们一个神仙似的妹妹也没有，可知这不是个好东西。”|宝玉满脸是泪，哭着说：“家里姐姐妹妹都没有，只有我有，我就说没意思。现在来了这么一个神仙似的妹妹也没有，可见这不是个好东西。”
贾母忙哄他道：“你这妹妹原有这个来的，因你姑妈去世时，舍不得你妹妹，无法处，遂将他的玉带了去了：|贾母忙哄他说：“你这妹妹原来也有玉的。你姑妈去世的时候舍不得你妹妹，没办法，就把她的玉带走了：
一则全殉葬之礼，尽你妹妹之孝心，二则你姑妈之灵，亦可权作见了女儿之意。|一来是陪葬的礼数，尽你妹妹的孝心；二来你姑妈在天之灵，也算能见到女儿了。
因此他只说没有这个，不便自己夸张之意。|所以她只说没有，是不好意思自己夸耀。
你如今怎比得他？|你现在怎么比得上她？
还不好生慎重带上，仔细你娘知道了。”|还不好好戴上，小心你娘知道了。”
说著，便向丫鬟手中接来，亲与他带上。|说着，从丫鬟手里接过玉，亲手给他戴上。
宝玉听如此说，想一想大有情理，也就不生别论了。|宝玉听她这么说，想想很有道理，也就不再闹了。
! 宝玉摔玉，是因为黛玉没有玉。他宁愿不要这块“通灵”宝玉，也要跟黛玉一样，这是“木石”对“金玉”的第一次反抗。
! 贾母随口编的谎话，宝玉一听就信了。可见在宝玉心里，玉远没有人要紧。

# 十九、安顿住处
当下，奶娘来请问黛玉之房舍。|这时，奶娘来请示黛玉住哪里。
贾母说：“今将宝玉挪出来，同我在套间暖阁儿里，把你林姑娘暂安置碧纱橱里。|贾母说：“把宝玉挪出来，跟我住在套间暖阁里，让林姑娘暂时住在碧纱橱里。（碧纱橱是用糊着绿纱的隔扇隔出来的小间）
等过了残冬，春天再与他们收拾房屋，另作一番安置罢。”|等过了冬天，开春再给他们收拾屋子，另外安排吧。”
宝玉道：“好祖宗，我就在碧纱橱外的床上很妥当，何必又出来闹的老祖宗不得安静。”|宝玉说：“好祖宗，我就睡碧纱橱外面的床上挺好，何必挪出来吵得老祖宗不安静。”
贾母想了一想说：“也罢了。”|贾母想了想说：“也好。”
每人一个奶娘并一个丫头照管，馀者在外间上夜听唤。|每人一个奶娘和一个丫头照料，其余的人在外间守夜听候使唤。
一面早有熙凤命人送了一顶藕合色花帐，并几件锦被缎褥之类。|另一边，熙凤早派人送来了一顶藕荷色的花帐子，还有几件锦被缎褥。
! 宝黛只隔一道纱橱，从小同住同吃，这是后来两人感情深厚的基础。

# 二十、丫鬟们：鹦哥与袭人
黛玉只带了两个人来：一个是自幼奶娘王嬷嬷，一个是十岁的小丫头，亦是自幼随身的，名唤作雪雁。|黛玉只带了两个人来：一个是从小的奶娘王嬷嬷，一个是十岁的小丫头，也是从小跟着的，叫雪雁。
贾母见雪雁甚小，一团孩气，王嬷嬷又极老，料黛玉皆不遂心省力的，便将自己身边的一个二等丫头，名唤鹦哥者与了黛玉。|贾母见雪雁太小，一团孩子气，王嬷嬷又太老，料想两人都照顾不周到，就把自己身边一个叫鹦哥的二等丫头给了黛玉。
外亦如迎春等例，每人除自幼乳母外，另有四个教引嬷嬷，除贴身掌管钗钏盥沐两个丫鬟外，另有五六个洒扫房屋来往使役的小丫鬟。|另外也照迎春她们的规矩：每人除了从小的奶妈，还有四个教导嬷嬷；除了两个贴身管首饰、梳洗的丫鬟，还有五六个打扫屋子、跑腿的小丫鬟。
当下，王嬷嬷与鹦哥陪侍黛玉在碧纱橱内。|当晚，王嬷嬷和鹦哥陪黛玉睡在碧纱橱里。
宝玉之乳母李嬷嬷，并大丫鬟名唤袭人者，陪侍在外面大床上。|宝玉的奶妈李嬷嬷和一个叫袭人的大丫鬟，陪宝玉睡在外面的大床上。
原来这袭人亦是贾母之婢，本名珍珠。|原来袭人也是贾母的丫鬟，本名珍珠。
贾母因溺爱宝玉，生恐宝玉之婢无竭力尽忠之人，素喜袭人心地纯良，克尽职任，遂与了宝玉。|贾母溺爱宝玉，怕宝玉的丫鬟里没有尽心尽力的人。她一向喜欢袭人心地纯良、做事尽职，就把她给了宝玉。
宝玉因知他本姓花，又曾见旧人诗句上有“花气袭人”之句，遂回明贾母，更名袭人。|宝玉知道她姓花，又在古人诗里见过“花气袭人”的句子，就禀明贾母，给她改名袭人。
这袭人亦有些痴处：伏侍贾母时，心中眼中只有一个贾母，如今服侍宝玉，心中眼中又只有一个宝玉。|这袭人也有点痴：伺候贾母时，心里眼里只有贾母；如今伺候宝玉，心里眼里又只有宝玉。
只因宝玉性情乖僻，每每规谏宝玉，心中著实忧郁。|只因宝玉性情古怪，她常常劝他，心里实在发愁。
! 鹦哥就是后来的紫鹃，黛玉最贴心的丫鬟。
! 袭人和紫鹃都是贾母给的。贾母把最好的丫鬟分给了宝玉和黛玉。
! 袭人“心中只有一个宝玉”，又常常规劝他，她后来成了王夫人眼中最可靠的人。

# 二十一、夜谈通灵玉
是晚，宝玉李嬷嬷已睡了，他见里面黛玉和鹦哥犹未安息，他自卸了妆，悄悄进来，笑问：“姑娘怎么还不安息？”|这天晚上，宝玉和李嬷嬷已经睡了。袭人见里面黛玉和鹦哥还没睡，就自己卸了妆，悄悄走进来，笑着问：“姑娘怎么还不睡？”
黛玉忙让：“姐姐请坐。”|黛玉忙让座：“姐姐请坐。”
袭人在床沿上坐了。|袭人在床沿上坐下。
鹦哥笑道：“林姑娘正在这里伤心，自己淌眼抹泪的说：‘今儿才来，就惹出你家哥儿的狂病，倘或摔坏了那玉，岂不是因我之过！’因此便伤心，我好容易劝好了”。|鹦哥笑道：“林姑娘正在这儿伤心，自己抹着眼泪说：‘今天才来，就惹得你家哥儿发了狂病，要是摔坏了那玉，岂不是我的过错！’所以伤心，我好不容易才劝好。”
袭人道：“姑娘快休如此，将来只怕比这个更奇怪的笑话儿还有呢！|袭人说：“姑娘快别这样，以后比这还奇怪的笑话只怕还多着呢！
若为他这种行止，你多心伤感，只怕你伤感不了呢。|要是为他这种举动你就多心伤感，只怕你伤感不过来呢。
快别多心！”|快别多心了！”
黛玉道：“姐姐们说的，我记著就是了。|黛玉说：“姐姐们说的，我记住了。
究竟那玉不知是怎么个来历？|那玉到底是什么来历？
上面还有字迹？”|上面还有字吗？”
袭人道：“连一家子也不知来历，上头还有现成的眼儿，听得说，落草时是从他口里掏出来的。|袭人说：“连全家人都不知道来历。上面还有现成的穿绳的小孔，听说是生下来时从他嘴里掏出来的。
等我拿来你看便知。”|等我拿来给你看看就知道了。”
黛玉忙止道：“罢了，此刻夜深，明日再看也不迟。”|黛玉忙拦住说：“算了，现在夜深了，明天再看也不迟。”
大家又叙了一回，方才安歇。|大家又聊了一会儿，才睡下。
! 黛玉进府第一夜就流泪，“还泪”从这里开始了。
! 黛玉说明天再看玉，后来这块玉却是宝钗先细看的（第八回）。

# 二十二、薛蟠打死人命
次日起来，省过贾母，因往王夫人处来，正值王夫人与熙凤在一处拆金陵来的书信看，又有王夫人之兄嫂处遣了两个媳妇来说话的。|第二天起来，黛玉给贾母请过安，又到王夫人那里，正碰上王夫人和熙凤在拆看金陵来的信，还有王夫人的哥哥嫂子派来两个媳妇在说话。
黛玉虽不知原委，探春等却都晓得是议论金陵城中所居的薛家姨母之子姨表兄薛蟠，倚财仗势，打死人命，现在应天府案下审理。|黛玉虽然不知道怎么回事，探春她们却都知道，说的是住在金陵城的薛姨妈的儿子、表哥薛蟠，仗着有钱有势打死了人，现在正在应天府里审理。
如今母舅王子腾得了信息，故遣他家内的人来告诉这边，意欲唤取进京之意。|现在舅舅王子腾得到消息，所以派家里人来告诉这边，意思是要叫他们进京来。
毕竟怎的，下回分解。|到底怎么样，下回再说。
! 应天府知府正是刚上任的贾雨村。下一回他就要审这个案子。

# 一、题诗
题曰：|题诗说：
~捐躯报国恩，未报躯犹在。|愿意舍身报答国恩，可恩还没报，身子还在。
~眼底物多情，君恩或可待。|眼前的东西都含着情意，君王的恩宠或许还能等到。
! 这首题诗反着读，就是在讽刺本回的贾雨村：嘴上说报国，心里盘算的是眼前的人情和自己的前程。

# 二、寡嫂李纨
却说黛玉同姊妹们至王夫人处，见王夫人与兄嫂处的来使计议家务，又说姨母家遭人命官司等语。|黛玉和姐妹们到了王夫人那里，见王夫人正和娘家哥嫂派来的人商量家事，又说起姨妈家出了人命官司。
因见王夫人事情冗杂，姊妹们遂出来，至寡嫂李氏房中来了。|看王夫人事情多，姐妹们就出来，到守寡的嫂子李纨房里去了。
原来这李氏即贾珠之妻。|这李氏就是贾珠的妻子。
珠虽夭亡，幸存一子，取名贾兰，今方五岁，已入学攻书。|贾珠虽然早死了，好在留下一个儿子，叫贾兰，今年五岁，已经上学读书了。
这李氏亦系金陵名宦之女，父名李守中，曾为国子监祭酒，族中男女无有不诵诗读书者。|李纨也是金陵名门官宦家的女儿，父亲叫李守中，做过国子监祭酒（掌管最高学府的官），家族里男男女女没有不读书的。
至李守中继承以来，便说“女子无才便有德”，故生了李氏时，便不十分令其读书，|可到李守中当家以后，他说“女子无才便是德”，所以生了李纨，就不太让她读书，
只不过将些《女四书》、《列女传》、《贤媛集》等三四种书，使他认得几个字，记得前朝这几个贤女便罢了，却只以纺绩井臼为要，因取名为李纨，字宫裁。|只拿《女四书》《列女传》《贤媛集》这三四种书，让她认几个字、记住前朝几个贤惠女子就够了，主要让她学纺纱织布、打水舂米这些家务，所以取名李纨，字宫裁。
因此这李纨虽青春丧偶，居家处膏粱锦绣之中，竟如槁木死灰一般，一概无见无闻，唯知侍亲养子，外则陪侍小姑等针黹诵读而已。|所以李纨虽然年纪轻轻就死了丈夫，住在富贵繁华的人家，却像枯木死灰一样，什么都不看不听，只知道伺候公婆、养育儿子，此外就是陪小姑子们做针线、读书。
今黛玉虽客寄于斯，日有这般姐妹相伴，除老父外，馀者也都无庸虑及了。|黛玉现在虽然寄住在这里，每天有这些姐妹陪着，除了惦记老父亲，别的也都不用操心了。
! “纨”是白色细绢，“宫裁”是裁剪的意思，名字里只有女红，没有才学。“李守中”的“守中”也是守规矩、不越线。
! “槁木死灰”四个字写尽了李纨：她是贾府里最守礼的人，也是活得最寂寞的人。

# 三、雨村接手人命案
如今且说雨村，因补授了应天府，一下马就有一件人命官司详至案下，乃是两家争买一婢，各不相让，以至殴伤人命。|再说贾雨村，他补了应天府知府，一上任就有一件人命官司报到他案前：两家争买一个丫头，互不相让，结果把人打死了。
彼时雨村即传原告之人来审。|雨村当即传原告来审问。
那原告道：“被殴死者乃小人之主人。|原告说：“被打死的是小人的主人。
因那日买了一个丫头，不想是拐子拐来卖的。|那天他买了一个丫头，没想到是人贩子拐来卖的。
这拐子先已得了我家的银子，我家小爷原说第三日方是好日子，再接入门。|这人贩子先收了我家的银子，我家少爷说第三天才是好日子，到时再接她进门。
这拐子便又悄悄的卖与薛家，被我们知道了，去找拿卖主，夺取丫头。|这人贩子又偷偷把她卖给了薛家，被我们知道了，就去抓人贩子、要回丫头。
无奈薛家原系金陵一霸，倚财仗势，众豪奴将我小主人竟打死了。|可薛家是金陵一霸，仗着有钱有势，一群凶悍的家奴竟把我家少爷打死了。
凶身主仆已皆逃走，无影无踪，只剩了几个局外之人。|凶手主仆都已经逃走了，无影无踪，只剩下几个不相干的人。
小人告了一年的状，竟无人作主。|小人告了一年的状，竟没人给做主。
望大老爷拘拿凶犯，剪恶除凶，以救孤寡，死者感戴天恩不尽！”|求大老爷捉拿凶犯，惩恶除凶，救救孤儿寡妇，死者在九泉之下也感激不尽！”
雨村听了大怒道：“岂有这样放屁的事！|雨村听了大怒说：“哪有这样混账的事！
打死人命就白白的走了，再拿不来的！”|打死了人就白白走了，还抓不回来！”
因发签差公人立刻将凶犯族中人拿来拷问，令他们实供藏在何处，一面再动海捕文书。|于是要发令签，派差役马上把凶犯的族人抓来拷问，逼他们说出凶犯藏在哪里，同时发通缉文书。
正要发签时，只见案边立的一个门子使眼色儿，不令他发签之意。|正要发签，只见案边站着的一个门子（衙门里的差役）给他使眼色，意思是别发签。
雨村心下甚为疑怪，只得停了手，即时退堂，至密室，侍从皆退去，只留门子服侍。|雨村心里很奇怪，只好停下，马上退堂，到了内室，让随从都出去，只留下这个门子伺候。
! 原告说告了一年状没人管。可见前任知府也是不敢管。
! 雨村一开始拍案大怒，像个清官。这是作者先扬后抑。

# 四、门子原是葫芦庙小沙弥
这门子忙上来请安，笑问：“老爷一向加官进禄，八九年来就忘了我了？”|门子忙上前请安，笑着问：“老爷这些年升官发财，八九年下来，就把我忘了？”
雨村道：“却十分面善得紧，只是一时想不起来。”|雨村说：“看着倒是很面熟，只是一时想不起来。”
那门子笑道：“老爷真是贵人多忘事，把出身之地竟忘了，不记当年葫芦庙里之事？”|门子笑道：“老爷真是贵人多忘事，连自己出身的地方都忘了，不记得当年葫芦庙里的事了？”
雨村听了，如雷震一惊，方想起往事。|雨村听了，像被雷劈了一样吃了一惊，这才想起往事。
原来这门子本是葫芦庙内一个小沙弥，因被火之后，无处安身，欲投别庙去修行，又耐不得清凉景况，因想这件生意倒还轻省热闹，遂趁年纪蓄了发，充了门子。|原来这门子本是葫芦庙里的一个小和尚。庙被火烧以后，他无处安身，想去别的庙修行，又受不了清苦，觉得当门子这行当轻松热闹，就趁着年轻留了头发，当了门子。
雨村那里料得是他，便忙携手笑道：“原来是故人。”|雨村哪想到是他，忙拉着他的手笑道：“原来是老朋友。”
又让坐了好谈。|又让他坐下好好谈。
这门子不敢坐。|门子不敢坐。
雨村笑道：“贫贱之交不可忘。|雨村笑道：“贫贱时的朋友不能忘。
你我故人也，二则此系私室，既欲长谈，岂有不坐之理？”|你我是老朋友，再说这是私室，既然要长谈，哪有不坐的道理？”
这门子听说，方告了座，斜签著坐了。|门子听了，才告了座，侧着身子坐了半边。
! 雨村一听“葫芦庙”就“如雷震一惊”，他最怕别人提起他落魄的过去。
! 他嘴上说“贫贱之交不可忘”，本回最后就把这个故人远远发配了。

# 五、护官符
雨村因问方才何故有不令发签之意。|雨村问他刚才为什么不让发签。
这门子道：“老爷既荣任到这一省，难道就没抄一张本省‘护官符’来不成？”|门子说：“老爷既然到这一省上任，难道没抄一张本省的‘护官符’吗？”
雨村忙问：“何为‘护官符’？|雨村忙问：“什么是‘护官符’？
我竟不知。”|我竟然不知道。”
门子道：“这还了得！|门子说：“这还了得！
连这个不知，怎能作得长远！|连这个都不知道，官怎么能做得长久！
如今凡作地方官者，皆有一个私单，上面写的是本省最有权有势，极富极贵的大乡绅名姓，各省皆然，倘若不知，一时触犯了这样的人家，不但官爵，只怕连性命还保不成呢！|如今凡是当地方官的，都有一张私下的单子，上面写着本省最有权有势、最富最贵的大户人家的名字，每个省都有。要是不知道，一时得罪了这样的人家，别说官位，只怕连命都保不住！
所以绰号叫作‘护官符’。|所以叫‘护官符’。
方才所说的这薛家，老爷如何惹他！|刚才说的这个薛家，老爷怎么能惹他！
他这件官司并无难断之处，皆因都碍著情分面上，所以如此。”|这件官司其实不难断，都是因为碍着情面，才拖成这样。”
一面说，一面从顺袋中取出一张抄写的“护官符”来，递与雨村，看时，上面皆是本地大族名宦之家的谚俗口碑。|一边说，一边从随身的口袋里拿出一张抄好的“护官符”递给雨村。雨村一看，上面都是本地大家族、大官宦人家的民间俗语。
其口碑排写得明白，下面所注的皆是自始祖官爵并房次。|俗语写得清清楚楚，下面还注着每家始祖的官爵和分支房头。
石头亦曾抄写了一张，今据石上所抄云：|石头当时也抄了一张，现在照着石头上抄的写在这里：
~贾不假，白玉为堂金作马。|贾家不是假的，用白玉砌厅堂，用黄金做马。（指贾家）
~阿房宫，三百里，住不下金陵一个史。|秦朝的阿房宫有三百里那么大，也住不下金陵一个史家。（指史家）
~东海缺少白玉床，龙王来请金陵王。|东海龙王缺一张白玉床，要来找金陵王家借。（指王家）
~丰年好大雪，珍珠如土金如铁。|丰收年下了好大的“雪”，珍珠多得像泥土，金子多得像铁块。（“雪”谐音“薛”，指薛家）
! 这就是贾、史、王、薛四大家族，全书的根基。贾母姓史，王夫人和凤姐姓王，薛姨妈姓王、嫁到薛家。
! 有人说这张“护官符”是全书的总纲：这四家的兴衰荣辱都绑在一起。

# 六、四大家族一荣俱荣
雨村犹未看完，忽听传点，人报：“王老爷来拜。”|雨村还没看完，忽听外面敲云板报事，有人通报：“王老爷来拜访。”
雨村听说，忙具衣冠出去迎接。|雨村听了，忙穿戴整齐出去迎接。
有顿饭工夫，方回来细问。|过了大约一顿饭的工夫，才回来接着细问。
这门子道：“这四家皆连络有亲，一损皆损，一荣皆荣，扶持遮饰，俱有照应的。|门子说：“这四家都有亲戚关系，一家倒霉家家倒霉，一家风光家家风光，互相扶持、互相遮掩，彼此照应。
今告打死人之薛，就系丰年大雪之‘雪’也。|现在被告打死人的薛家，就是‘丰年好大雪’的那个‘雪’。
也不单靠这三家，他的世交亲友在都在外者，本亦不少。|也不光靠这三家，他家在京城、在外地的世交亲友本来也不少。
老爷如今拿谁去？”|老爷现在去抓谁？”
雨村听如此说，便笑问门子道：“如你这样说来，却怎么了结此案？|雨村听他这么说，就笑着问门子：“照你这么说，这案子该怎么了结？
你大约也深知这凶犯躲的方向了？”|你大概也清楚凶犯躲在哪里吧？”
! “一损皆损，一荣皆荣”：后来贾府被抄，四大家族果然一起败落。
! 雨村话锋一转就问“怎么了结”，不再说要捉拿凶犯了。

# 七、冯渊和英莲
门子笑道：“不瞒老爷说，不但这凶犯的方向我知道，一并这拐卖之人我也知道，死鬼买主也深知道。|门子笑道：“不瞒老爷，不但凶犯在哪里我知道，连那个人贩子我也知道，死去的买主我也很清楚。
待我细说与老爷听：这个被打之死鬼，乃是本地一个小乡绅之子，名唤冯渊，自幼父母早亡，又无兄弟，只他一个人守著些薄产过日子。|我细细讲给老爷听：这个被打死的，是本地一个小乡绅的儿子，叫冯渊。他从小父母双亡，又没有兄弟，一个人守着一点薄产过日子。
长到十八九岁上，酷爱男风，最厌女子。|长到十八九岁，特别喜欢男色，最讨厌女人。
这也是前生冤孽，可巧遇见这拐子卖丫头，他便一眼看上了这丫头，立意买来作妾，立誓再不交结男子，也不再娶第二个了，所以三日后方过门。|这也是前世的冤孽，偏偏碰上人贩子卖丫头，他一眼就看上了，决心买来做妾，还发誓再也不交男朋友，也不再娶第二个，所以才要三天以后好日子再接进门。
谁晓这拐子又偷卖与薛家，他意欲卷了两家的银子，再逃往他省。|谁知道人贩子又偷偷卖给了薛家，想卷了两家的银子逃到外省去。
谁知又不曾走脱，两家拿住，打了个臭死，都不肯收银，只要领人。|结果没跑掉，被两家抓住，打了个半死。两家都不肯收回银子，只要领人。
那薛家公子岂是让人的，便喝著手下人一打，将冯公子打了个稀烂，抬回家去三日死了。|那薛家公子哪是肯让人的，一声令下叫手下人打，把冯公子打得稀烂，抬回家三天就死了。
这薛公子原是早已择定日子上京去的，头起身两日前，就偶然遇见这丫头，意欲买了就进京的，谁知闹出这事来。|这薛公子本来早就定好了日子要进京，动身前两天偶然碰见这丫头，想买了就走，没想到闹出这事来。
既打了冯公子，夺了丫头，他便没事人一般，只管带了家眷走他的路。|打死了冯公子，抢了丫头，他就跟没事人一样，带着家眷照样上路。
他这里自有兄弟奴仆在此料理，也并非为此些些小事值得他一逃走的。|这边自有他的族中兄弟和家奴料理，他也不是为这点小事才逃走的。
这且别说，老爷你当被卖之丫头是谁？”|这些先不说，老爷，您知道被卖的丫头是谁吗？”
雨村笑道：“我如何得知。”|雨村笑道：“我怎么会知道。”
门子冷笑道：“这人算来还是老爷的大恩人呢！|门子冷笑道：“说起来，这人还是老爷大恩人家的呢！
他就是葫芦庙旁住的甄老爷的小姐，名唤英莲的。”|她就是葫芦庙旁边住的甄老爷家的小姐，叫英莲。”
雨村骇然道：“原来就是他！|雨村大吃一惊：“原来就是她！
闻得养至五岁被人拐去，却如今才来卖呢？”|听说她五岁被拐走了，怎么到现在才卖？”
! 冯渊谐音“逢冤”，一遇英莲就送了命。
! 薛蟠打死人，在他眼里只是“些些小事”。“没事人一般”四个字写出了四大家族的横行。
! 第二回雨村答应甄家娘子一定找回英莲。如今英莲就在眼前，看他怎么做。

# 八、英莲的遭遇
门子道：“这一种拐子单管偷拐五六岁的儿女，养在一个僻静之处，到十一二岁，度其容貌，带至他乡转卖。|门子说：“这种人贩子专拐五六岁的孩子，养在偏僻的地方，等到十一二岁，看长相好坏，带到外地去卖。
当日这英莲，我们天天哄他顽耍，虽隔了七八年，如今十二三岁的光景，其模样虽然出脱得齐整好些，然大概相貌，自是不改，熟人易认。|当年这英莲，我们天天逗她玩。虽然隔了七八年，她现在十二三岁，模样长开了好看了些，可大概的相貌没变，熟人很容易认出来。
况且他眉心中原有米粒大小的一点胭脂痣，从胎里带来的，所以我却认得。|况且她眉心里有米粒大的一颗红痣，是胎里带来的，所以我认得。
偏生这拐子又租了我的房舍居住，那日拐子不在家，我也曾问他。|偏偏这人贩子又租了我的房子住，有一天人贩子不在家，我也问过她。
他是被拐子打怕了的，万不敢说，只说拐子系他亲爹，因无钱偿债，故卖他。|她被人贩子打怕了，万万不敢说，只说人贩子是她亲爹，因为没钱还债才卖她。
我又哄之再四，他又哭了，只说‘我不记得小时之事！’这可无疑了。|我又再三哄她，她就哭了，只说‘我不记得小时候的事！’这就没错了。
那日冯公子相看了，兑了银子，拐子醉了，他自叹道：‘我今日罪孽可满了！’|那天冯公子看中了她，付了银子，人贩子喝醉了，她自己叹气说：‘我今天的罪总算受到头了！’
后又听见冯公子令三日之后过门，他又转有忧愁之态。|后来又听说冯公子要三天以后才接她过门，她又发起愁来。
我又不忍其形景，等拐子出去，又命内人去解释他：|我不忍心看她那样子，等人贩子出去了，就让我老婆去开导她：
‘这冯公子必待好日期来接，可知必不以丫鬟相看。|‘这冯公子一定要等好日子来接你，可见不是把你当丫鬟看。
况他是个绝风流人品，家里颇过得，素习又最厌恶堂客，今竟破价买你，后事不言可知。|况且他是个很有风度的人，家境也不错，平时最讨厌女人，现在竟花大价钱买你，以后会怎样就不用说了。
只耐得三两日，何必忧闷！’|只要再忍两三天，何必发愁！’
他听如此说，方才略解忧闷，自为从此得所。|她听了这话，才稍微宽了心，以为从此有了好归宿。
谁料天下竟有这等不如意事，第二日，他偏又卖与薛家。|谁料天下竟有这么不如意的事，第二天，人贩子偏偏又把她卖给了薛家。
若卖与第二个人还好，这薛公子的混名人称‘呆霸王’，最是天下第一个弄性尚气的人，而且使钱如土，遂打了个落花流水，生拖死拽，把个英莲拖去，如今也不知死活。|要是卖给别人还好，这薛公子外号叫‘呆霸王’，是天下头一号任性斗气的人，而且花钱如流水。他把冯家打得落花流水，连拖带拽把英莲拖走了，现在也不知道是死是活。
这冯公子空喜一场，一念未遂，反花了钱，送了命，岂不可叹！”|这冯公子白高兴一场，心愿没实现，反倒花了钱、送了命，真是可叹！”
! 英莲眉心的胭脂痣，第一回就写过。“我不记得小时之事”是她被打怕了，也是真忘了。
! 她刚以为“罪孽可满了”，转眼又落进更大的火坑。“应怜”二字，这里应验了。

# 九、雨村的“大道理”
雨村听了，亦叹道：“这也是他们的孽障遭遇，亦非偶然。|雨村听了也叹气说：“这也是他们的冤孽，不是偶然的。
不然这冯渊如何偏只看准了这英莲？|不然冯渊怎么偏偏就看中了英莲？
这英莲受了拐子这几年折磨，才得了个头路，且又是个多情的，若能聚合了，倒是件美事，偏又生出这段事来。|英莲被人贩子折磨了这几年，才有了个出路，冯渊又是个多情的人，要是能成，倒是件好事，偏偏又出了这件事。
这薛家纵比冯家富贵，想其为人，自然姬妾众多，淫佚无度，未必及冯渊定情于一人者。|薛家就算比冯家富贵，想想他的为人，一定是妻妾成群、荒淫无度，未必比得上冯渊一心只爱一人。
这正是梦幻情缘，恰遇一对薄命儿女。|这真是一场梦幻般的姻缘，偏偏碰上一对命苦的男女。
且不要议论他，只目今这官司，如何剖断才好？”|先别议论这些了，眼下这官司该怎么判才好？”
门子笑道：“老爷当年何其明决，今日何反成了个没主意的人了！|门子笑道：“老爷当年多么果断，今天怎么反倒成了没主意的人了！
小的闻得老爷补升此任，亦系贾府、王府之力，此薛蟠即贾府之亲，老爷何不顺水行舟，作个整人情，将此案了结，日后也好去见贾府王府。”|小的听说老爷这次补上这个官，也是靠贾府、王府的力量。这薛蟠就是贾府的亲戚，老爷何不顺水推舟，做个大人情，把案子了结，以后也好去见贾府、王府。”
雨村道：“你说的何尝不是。|雨村说：“你说的也对。
但事关人命，蒙皇上隆恩，起复委用，实是重生再造，正当殚心竭力图报之时，岂可因私而废法？|可这事关系人命。我承蒙皇上大恩，重新起用，真是再生之恩，正该竭尽全力报答的时候，怎么能因私情而违法？
是我实不能忍为者。”|这是我实在不忍心做的。”
门子听了，冷笑道：“老爷说的何尝不是大道理，但只是如今世上是行不去的。|门子听了冷笑道：“老爷说的当然是大道理，可在如今这世上是行不通的。
岂不闻古人有云：‘大丈夫相时而动’，又曰‘趋吉避凶者为君子’。|没听古人说过吗：‘大丈夫要看时机行事’，又说‘趋吉避凶的才是君子’。
依老爷这一说，不但不能报效朝廷，亦且自身不保，还要三思为妥。”|照老爷这么做，不但报效不了朝廷，连自己都保不住，还是三思为好。”
! 题目“薄命女偏逢薄命郎”，薄命女是英莲，薄命郎是冯渊。
! 雨村嘴上一套“报效朝廷”的大道理，正好对上本回题诗的“捐躯报国恩”。他只是在等别人给他台阶下。

# 十、门子献计
雨村低了半日头，方说道：“依你怎么样？”|雨村低头想了半天，才说：“依你看怎么办？”
门子道：“小人已想了一个极好的主意在此：老爷明日坐堂，只管虚张声势，动文书发签拿人。|门子说：“小人已经想好一个绝妙的主意：老爷明天升堂，只管虚张声势，发文书、发令签抓人。
原凶自然是拿不来的，原告固是定要将薛家族中及奴仆人等拿几个来拷问。|真凶当然是抓不来的，原告一定会要求把薛家族人和家奴抓几个来拷问。
小的在暗中调停，令他们报个暴病身亡，令族中及地方上共递一张保呈，|小的在暗中安排，让他们报个薛蟠得急病死了，再叫薛家族人和地方上的人联名递一张担保书。
老爷只说善能扶鸾请仙，堂上设下乩坛，令军民人等只管来看。|老爷就说自己会扶乩请神仙，在公堂上设个乩坛，让军民百姓都来看。（扶乩是一种请神写字的迷信活动）
老爷就说：‘乩仙批了，死者冯渊与薛蟠原因夙孽相逢，今狭路既遇，原应了结。|老爷就说：‘乩仙批示了：死者冯渊和薛蟠是前世冤家，如今狭路相逢，本该了结。
薛蟠今已得了无名之病，被冯魂追索已死。|薛蟠已经得了怪病，被冯渊的鬼魂索命死了。
其祸皆因拐子某人而起，拐之人原系某乡某姓人氏，按法处治，馀不略及’等语。|这场祸都是人贩子某某引起的，这个人贩子是某乡某姓的人，依法惩处，其余的人都不追究。’
小人暗中嘱托拐子，令其实招。|小人再暗中交代人贩子，让他照实招认。
众人见乩仙批语与拐子相符，馀者自然也都不虚了。|大家看乩仙的批语和人贩子的口供对得上，其余的自然也就信了。
薛家有的是钱，老爷断一千也可，五百也可，与冯家作烧埋之费。|薛家有的是钱，老爷判一千两也行，五百两也行，给冯家作丧葬费。
那冯家也无甚要紧的人，不过为的是钱，见有了这个银子，想来也就无话了。|冯家也没什么要紧的人，不过是为了钱，见有了银子，想来也就不说什么了。
老爷细想此计如何？”|老爷细想想这个主意怎么样？”
雨村笑道：“不妥，不妥。|雨村笑道：“不妥，不妥。
等我再斟酌斟酌，或可压服口声。”|等我再考虑考虑，也许能压住大家的议论。”
二人计议，天色已晚，别无话说。|两人商量着，天已经晚了，没别的话。
! 活着的薛蟠被判成“已死”，死去的冯渊被说成索了命。真的成了假的，假的成了真的。
! 雨村嘴上说“不妥”，第二天就照着办了。

# 十一、乱判葫芦案
至次日坐堂，勾取一应有名人犯，雨村详加审问，果见冯家人口稀疏，不过赖此欲多得些烧埋之费，薛家仗势倚情，偏不相让，故致颠倒未决。|第二天升堂，传来所有相关的人，雨村仔细审问，果然冯家人丁稀少，不过想借此多要些丧葬费；薛家仗势依靠人情，偏不相让，所以案子一直拖着没结。
雨村便徇情枉法，胡乱判断了此案。|雨村就徇私枉法，胡乱判了这个案子。
冯家得了许多烧埋银子，也就无甚话说了。|冯家得了许多丧葬银子，也就没什么话说了。
雨村断了此案，急忙作书信二封，与贾政并京营节度使王子腾，不过说“令甥之事已完，不必过虑”等语。|雨村判完了案，急忙写了两封信，给贾政和京营节度使王子腾，不过是说“令甥的事已经办完，不用担心”之类的话。
此事皆由葫芦庙内之沙弥新门子所出，雨村又恐他对人说出当日贫贱时的事来，因此心中大不乐业，|这件事都是葫芦庙小和尚出身的新门子出的主意，雨村又怕他对别人说出自己当年贫贱时的事，所以心里很不痛快，
后来到底寻了个不是，远远的充发了他才罢。|后来到底找了个错处，把他远远地发配充军了才罢休。
! “葫芦僧乱判葫芦案”：“葫芦”谐音“糊涂”。案子判得糊涂，是故意糊涂。
! 雨村第一封信就是向贾府、王府邀功。他没有救恩人的女儿，还把出主意的故人发配了。这个人的本性到这里全露出来了。

# 十二、薛家的来历
当下言不著雨村。|雨村的事先不说了。
且说那买了英莲打死冯渊的薛公子，亦系金陵人氏，本是书香继世之家。|再说那个买了英莲、打死冯渊的薛公子，也是金陵人，家里本来是世代读书的人家。
只是如今这薛公子幼年丧父，寡母又怜他是个独根孤种，未免溺爱纵容，遂至老大无成，|只是这薛公子从小死了父亲，守寡的母亲又可怜他是独苗，难免溺爱纵容，结果长大了一事无成。
且家中有百万之富，现领著内帑钱粮，采办杂料。|家里有百万家财，现在还领着皇宫内库的钱粮，替宫里采办各种货物。
这薛公子学名薛蟠，表字文起，五岁上就性情奢侈，言语傲慢。|这薛公子学名薛蟠，字文起，五岁就挥霍奢侈，说话傲慢。
虽也上过学，不过略识几字，终日惟有斗鸡走马，游山玩水而已。|虽然也上过学，只认得几个字，整天只知道斗鸡、跑马、游山玩水。
虽是皇商，一应经济世事，全然不知，不过赖祖父之旧情分，户部挂虚名，支领钱粮，其馀事体，自有伙计老家人等措办。|虽然是皇商，做生意、管家业的事一点都不懂，不过靠着祖父的老关系，在户部挂个空名，领领钱粮，其余的事都由伙计和老家人去办。
寡母王氏乃现任京营节度使王子腾之妹，与荣国府贾政的夫人王氏，是一母所生的姊妹，今年方四十上下年纪，只有薛蟠一子。|他守寡的母亲王氏，是现任京营节度使王子腾的妹妹，和荣国府贾政的夫人王氏是亲姐妹，今年四十岁左右，只有薛蟠一个儿子。
! 薛家是“皇商”，有钱，但没有爵位。四大家族里，薛家靠的是钱，所以更要攀附贾家和王家。

# 十三、宝钗待选进京
还有一女，比薛蟠小两岁，乳名宝钗，生得肌骨莹润，举止娴雅。|还有一个女儿，比薛蟠小两岁，小名宝钗，长得肌肤晶莹细腻，举止文雅大方。
当日有他父亲在日，酷爱此女，令其读书识字，较之乃兄竟高过十倍。|她父亲在世时特别喜欢这个女儿，让她读书识字，比她哥哥强十倍。
自父亲死后，见哥哥不能依贴母怀，他便不以书字为事，只留心针黹家计等事，好为母亲分忧解劳。|父亲死后，她见哥哥不能体贴母亲，就不再把读书当正事，只用心做针线、管家务，好替母亲分担忧愁。
近因今上崇诗尚礼，征采才能，降不世出之隆恩，除聘选妃嫔外，凡仕宦名家之女，皆亲名达部，以备选为公主郡主入学陪侍，充为才人赞善之职。|最近当今皇上崇尚诗书礼仪，广招人才，降下了少有的恩典：除了选妃嫔以外，凡是官宦名门的女儿，都要把名字报到礼部，准备选去给公主、郡主陪读，充当才人、赞善一类的女官。
二则自薛蟠父亲死后，各省中所有的买卖承局，总管，伙计人等，见薛蟠年轻不谙世事，便趁时拐骗起来，京都中几处生意，渐亦消耗。|另外，薛蟠父亲死后，各省生意上的承办人、总管、伙计们，见薛蟠年轻不懂事，就趁机骗钱，京城里的几处生意也渐渐亏空了。
薛蟠素闻得都中乃第一繁华之地，正思一游，便趁此机会，一为送妹待选，二为望亲，三因亲自入部销算旧帐，再计新支，其实则为游览上国风光之意。|薛蟠早听说京城是天下第一繁华的地方，正想去玩，就趁这个机会：一是送妹妹去待选，二是探望亲戚，三是亲自到户部结算旧账、领取新款，其实就是想去京城逛逛。
因此早已打点下行装细软，以及馈送亲友各色土物人情等类，正择日一定起身，不想偏遇见了拐子重卖英莲。|所以早已收拾好行李细软，还有送亲友的各种土产礼物，正挑好日子要动身，没想到偏偏碰上人贩子重卖英莲。
薛蟠见英莲生得不俗，立意买他，又遇冯家来夺人，因恃强喝令手下豪奴将冯渊打死。|薛蟠见英莲长得不俗，决心要买，又碰上冯家来抢人，就仗势命令手下的恶奴把冯渊打死了。
他便将家中事务一一的嘱托了族中人并几个老家人，他便带了母妹竟自起身长行去了。|他把家里的事一一交代给族人和几个老家人，就带着母亲和妹妹自顾自上路了。
人命官司一事，他竟视为儿戏，自为花上几个臭钱，没有不了的。|人命官司，他竟当成儿戏，以为花几个臭钱，没有摆不平的。
! 宝钗本来比哥哥强十倍，父亲死后却放下书本，专心女红家务。她从小就懂得收敛自己，这是她“藏愚守拙”的开始。
! 宝钗进京是为了“待选”，进宫做女官。后来没选上，才在贾府长住下来。

# 十四、薛家进京
在路不记其日。|路上走了不知多少天。
那日已将入都时，却又闻得母舅王子腾升了九省统制，奉旨出都查边。|那天快到京城时，又听说舅舅王子腾升了九省统制，奉旨出京巡查边防去了。
薛蟠心中暗喜道：“我正愁进京去有个嫡亲的母舅管辖著，不能任意挥霍挥霍，偏如今又升出去了，可知天从人愿。”|薛蟠心里暗暗高兴：“我正发愁进京有亲舅舅管着，不能随便花天酒地，偏偏现在他升官出去了，真是天遂人愿。”
因和母亲商议道：“咱们京中虽有几处房舍，只是这十来年没人进京居住，那看守的人未免偷著租赁与人，须得先著几个人去打扫收拾才好。”|于是跟母亲商量：“咱们在京城虽然有几处房子，只是十来年没人去住，看房的人难免偷偷租给别人，得先派几个人去打扫收拾才好。”
他母亲道：“何必如此招摇！|他母亲说：“何必这么张扬！
咱们这一进京，原该先拜望亲友，或是在你舅舅家，或是你姨爹家。|咱们这次进京，本该先拜访亲友，或者住你舅舅家，或者住你姨父家。
他两家的房舍极是便宜的，咱们先能著住下，再慢慢的著人去收拾，岂不消停些。”|他们两家的房子都很宽敞方便，咱们先凑合住下，再慢慢派人去收拾，岂不从容些。”
薛蟠道：“如今舅舅正升了外省去，家里自然忙乱起身，咱们这工夫一窝一拖的奔了去，岂不没眼色。”|薛蟠说：“现在舅舅正升了外省的官，家里肯定忙着动身，咱们这时候拖家带口地跑去，岂不是没眼色。”
他母亲道：“你舅舅家虽升了去，还有你姨爹家。|他母亲说：“你舅舅家虽然要走了，还有你姨父家。
况这几年来，你舅舅姨娘两处，每每带信捎书，接咱们来。|何况这几年，你舅舅、姨妈两家常常捎信来，要接咱们去。
如今既来了，你舅舅虽忙著起身，你贾家姨娘未必不苦留我们。|现在既然来了，你舅舅虽然忙着走，你贾家姨妈一定会苦苦留我们的。
咱们且忙忙收拾房屋，岂不使人见怪？|咱们急急忙忙去收拾房子，岂不让人见怪？
你的意思我却知道，守著舅舅姨爹住著，未免拘紧了你，不如你各自住著，好任意施为。|你的心思我知道，跟着舅舅、姨父住，怕管着你，不如自己住，好随心所欲。
你既如此，你自去挑所宅子去住，我和你姨娘，姊妹们别了这几年，却要厮守几日，我带了你妹子投你姨娘家去，你道好不好？”|你既然这样，就自己去挑所宅子住吧。我和你姨妈姐妹分别了这些年，要在一起住几天，我带你妹妹去你姨妈家，你看好不好？”
薛蟠见母亲如此说，情知扭不过的，只得吩咐人夫一路奔荣国府来。|薛蟠见母亲这么说，知道拗不过，只好吩咐车夫一路往荣国府去。
! 薛姨妈看着软，其实拿得住儿子：一句“你自去挑所宅子”，薛蟠就没话说了。
! 薛家住进贾府，宝钗就来到了宝玉身边。“金玉良缘”从这里开场。

# 十五、住进梨香院
那时王夫人已知薛蟠官司一事，亏贾雨村维持了结，才放了心。|那时王夫人已经知道薛蟠的官司多亏贾雨村帮忙了结了，才放了心。
又见哥哥升了边缺，正愁又少了娘家的亲戚来往，略加寂寞。|又见哥哥升官去了边疆，正发愁少了娘家亲戚来往，有点寂寞。
过了几日，忽家人传报：“姨太太带了哥儿姐儿，合家进京，正在门外下车。”|过了几天，忽然家人来报：“姨太太带着少爷小姐，全家进京了，正在门外下车。”
喜的王夫人忙带了女媳人等，接出大厅，将薛姨妈等接了进去。|王夫人高兴得忙带着女儿、媳妇们迎到大厅，把薛姨妈她们接了进来。
姊妹们暮年相会，自不必说悲喜交集，泣笑叙阔一番。|姐妹俩上了年纪才相见，悲喜交加，又哭又笑地叙了一番别情，这就不用细说了。
忙又引了拜见贾母，将人情土物各种酬献了。|又忙领着去拜见贾母，把带来的各种土产礼物送上。
合家俱厮见过，忙又治席接风。|全家人都见过了，又忙着摆酒接风。
薛蟠已拜见过贾政，贾琏又引著拜见了贾赦、贾珍等。|薛蟠已经拜见了贾政，贾琏又领着他拜见了贾赦、贾珍等人。
贾政便使人上来对王夫人说：“姨太太已有了春秋，外甥年轻不知世路，在外住著恐有人生事。|贾政派人来对王夫人说：“姨太太上了年纪，外甥年轻不懂世事，住在外面怕惹出事来。
咱们东北角上梨香院一所十来间房，白空闲著，打扫了，请姨太太和姐儿哥儿住了甚好。”|咱们东北角的梨香院有十来间房，白空着，打扫出来，请姨太太和少爷小姐住，很好。”
王夫人未及留，贾母也就遣人来说“请姨太太就在这里住下，大家亲密些”等语。|王夫人还没来得及开口留，贾母也派人来说“请姨太太就在这里住下，大家亲近些”。
薛姨妈正要同居一处，方可拘紧些儿子，若另住在外，又恐他纵性惹祸，遂忙道谢应允。|薛姨妈正想住在一起，好管住儿子，要是住在外面，又怕他任性闯祸，就忙道谢答应了。
又私与王夫人说明：“一应日费供给一概免却，方是处常之法。”|又私下跟王夫人说明：“日常的花费供给一概不用你们出，这样才能长住。”
王夫人知他家不难于此，遂亦从其愿。|王夫人知道她家不缺这点钱，也就依了她。
从此后薛家母子就在梨香院住了。|从此薛家母子就在梨香院住下了。
! 王夫人放心，是因为“亏贾雨村维持了结”。贾府明知这是人命案，却当成了亲戚间的人情。
! 薛家自己出钱，不吃贾府的，所以能体面地长住下去。

# 十六、薛蟠越学越坏
原来这梨香院即当日荣公暮年养静之所，小小巧巧，约有十馀间房屋，前厅后舍俱全。|原来这梨香院是当年荣国公晚年静养的地方，小巧精致，有十几间房，前厅后屋都齐全。
另有一门通街，薛蟠家人就走此门出入。|另有一扇门通到街上，薛蟠和家人就从这扇门进出。
西南有一角门，通一夹道，出夹道便是王夫人正房的东边了。|西南有个角门通一条夹道，出了夹道就是王夫人正房的东边。
每日或饭后，或晚间，薛姨妈便过来，或与贾母闲谈，或与王夫人相叙。|每天饭后或晚上，薛姨妈就过来，有时跟贾母聊天，有时跟王夫人叙话。
宝钗日与黛玉迎春姊妹等一处，或看书下棋，或作针黹，倒也十分乐业。|宝钗每天和黛玉、迎春姐妹们在一起，或看书下棋，或做针线，倒也十分快乐。
只是薛蟠起初之心，原不欲在贾宅居住者，但恐姨父管约拘禁，料必不自在的，无奈母亲执意在此，且宅中又十分殷勤苦留，只得暂且住下，一面使人打扫出自己的房屋，再移居过去的。|只是薛蟠起初本不想住在贾府，怕姨父管着不自在。无奈母亲执意要住，贾府又热情挽留，只好暂时住下，同时派人去打扫自家的房子，准备以后搬过去。
谁知自从在此住了不上一月的光景，贾宅族中凡有的子侄，俱已认熟了一半，凡是那些纨绔气习者，莫不喜与他来往，今日会酒，明日观花，甚至聚赌嫖娼，渐渐无所不至，引诱的薛蟠比当日更坏了十倍。|谁知住了不到一个月，贾家族里的子侄他已经认识了一半。那些纨绔子弟，没有不喜欢跟他来往的，今天喝酒，明天赏花，甚至聚赌嫖娼，渐渐什么坏事都干，把薛蟠引诱得比以前坏了十倍。
虽然贾政训子有方，治家有法，|虽然贾政教子有方、治家有法，
一则族大人多，照管不到这些，|但一来家族大、人多，管不过来；
二则现任族长乃是贾珍，彼乃宁府长孙，又现袭职，凡族中事，自有他掌管，|二来现任族长是贾珍，他是宁府的长孙，又承袭了爵位，族里的事都归他管；
三则公私冗杂，且素性潇洒，不以俗务为要，每公暇之时，不过看书著棋而已，馀事多不介意。|三来贾政公事私事都多，而且性情洒脱，不把俗事放在心上，公事之余不过看看书、下下棋，别的事大多不在意。
况且这梨香院相隔两层房舍，又有街门另开，任意可以出入，所以这些子弟们竟可以放意畅怀的，因此遂将移居之念渐渐打灭了。|况且梨香院隔着两层房子，又另开了临街的门，可以随便进出，所以这些子弟们尽可以放开了玩，薛蟠也就渐渐打消了搬出去的念头。
日后如何，下回分解。|以后怎样，下回再说。
! 薛姨妈住进贾府是想“拘紧些儿子”，结果贾府的子弟把他带得更坏。贾府表面诗礼传家，里面已经烂了。
! 族长贾珍不管事，贾政也不管事。这正应了冷子兴那句“运筹谋画者无一”。
</script>
<script type="text/plain" id="ch5">
# 一、题诗
题曰：|题诗说：
~春困葳蕤拥绣衾，恍随仙子到红尘。|春天困倦，裹着绣花被子昏昏欲睡，恍惚间跟着仙子来到了尘世以外。
~问谁幻入华胥境，千古风流造业人。|问是谁做梦进了这仙境？是千古以来最多情、最会造情孽的人。
! “华胥境”是梦境的代称，“风流造业人”就是宝玉。本回写的就是他的一场梦。

# 二、宝钗来了，黛玉不忿
第四回中既将薛家母子在荣府内寄居等事略已表明，此回则暂不能写矣。|上一回已经把薛家母子住进荣府的事大致交代了，这一回就暂时不写了。
如今且说林黛玉自在荣府以来，贾母万般怜爱，寝食起居，一如宝玉，迎春，探春，惜春三个亲孙女倒且靠后，|再说林黛玉自从来到荣府，贾母百般疼爱，吃饭睡觉、日常起居都跟宝玉一样，迎春、探春、惜春三个亲孙女反倒排在后面了。
便是宝玉和黛玉二人之亲密友爱处，亦自较别个不同，日则同行同坐，夜则同息同止，真是言和意顺，略无参商。|宝玉和黛玉两人的亲密，也跟别人不一样：白天一起走一起坐，晚上一起歇一起睡，真是说话投机、心意相合，没有一点隔阂。
不想如今忽然来了一个薛宝钗，年岁虽大不多，然品格端方，容貌丰美，人多谓黛玉所不及。|没想到现在忽然来了个薛宝钗，年纪虽然大不了多少，可品行端正，容貌丰满美丽，很多人都说黛玉比不上她。
而且宝钗行为豁达，随分从时，不比黛玉孤高自许，目无下尘，故比黛玉大得下人之心。|而且宝钗为人大方，安守本分、随和应时，不像黛玉清高自负、看不起俗人，所以比黛玉更得下人的欢心。
便是那些小丫头子们，亦多喜与宝钗去顽。|连那些小丫头们，也大多喜欢跟宝钗玩。
因此黛玉心中便有些悒郁不忿之意，宝钗却浑然不觉。|所以黛玉心里有些郁闷不服气，宝钗却一点都没察觉。
那宝玉亦在孩提之间，况自天性所禀来的一片愚拙偏僻，视姊妹弟兄皆出一意，并无亲疏远近之别。|宝玉还是个孩子，又天生一股傻气和偏执，对姐妹兄弟都一样看待，没有亲疏远近之分。
其中因与黛玉同随贾母一处坐卧，故略比别个姊妹熟惯些。|只因为和黛玉一起跟着贾母住，所以跟她比跟别的姐妹熟一些。
既熟惯，则更觉亲密，既亲密，则不免一时有求全之毁，不虞之隙。|熟了就更亲密，亲密了，难免有时因为求全责备而闹别扭，生出意想不到的隔阂。
这日不知为何，他二人言语有些不合起来，黛玉又气的独在房中垂泪，宝玉又自悔言语冒撞，前去俯就，那黛玉方渐渐的回转来。|这天不知为什么，两人说话又闹起了别扭，黛玉气得一个人在房里掉眼泪，宝玉又后悔自己说话莽撞，过去赔不是，黛玉才慢慢回心转意。
! 宝钗一来，宝黛之间就有了第三个人。“求全之毁”是说越在乎对方，越容易挑剔。宝黛一辈子都在这样吵了又好。
! 宝钗“随分从时”，黛玉“孤高自许”，两人性格从这里开始对照。

# 三、宁府赏梅，宝玉要睡午觉
因东边宁府中花园内梅花盛开，贾珍之妻尤氏乃治酒，请贾母，邢夫人，王夫人等赏花。|因为东边宁府花园里梅花盛开，贾珍的妻子尤氏就摆了酒，请贾母、邢夫人、王夫人等去赏花。
是日先携了贾蓉之妻，二人来面请。|那天尤氏先带着贾蓉的妻子，两人亲自来请。
贾母等于早饭后过来，就在会芳园游顽，先茶后酒，不过皆是宁荣二府女眷家宴小集，并无别样新文趣事可记。|贾母等人吃过早饭就过去了，在会芳园游玩，先喝茶后喝酒，不过是宁荣两府女眷的家宴小聚，没什么新鲜有趣的事可写。
一时宝玉倦怠，欲睡中觉，贾母命人好生哄著，歇一回再来。|一会儿宝玉累了，想睡午觉，贾母让人好好哄着他去歇一会儿再来。
贾蓉之妻秦氏便忙笑回道：“我们这里有给宝叔收拾下的屋子，老祖宗放心，只管交与我就是了。”|贾蓉的妻子秦氏忙笑着说：“我们这里有给宝叔收拾好的屋子，老祖宗放心，只管交给我好了。”
又向宝玉的奶娘丫鬟等道：“嬷嬷，姐姐们，请宝叔随我这里来。”|又对宝玉的奶娘丫鬟们说：“嬷嬷、姐姐们，请宝叔跟我来这边。”
贾母素知秦氏是个极妥当的人，生的袅娜纤巧，行事又温柔和平，乃重孙媳中第一个得意之人，见他去安置宝玉，自是安稳的。|贾母一向知道秦氏是个很稳妥的人，长得苗条秀美，做事又温柔平和，是重孙媳妇里最让她满意的，见她去安顿宝玉，自然放心。
! 秦氏就是秦可卿，金陵十二钗里辈分最低、死得最早的一个。

# 四、宝玉嫌屋子，进了秦氏卧房
当下秦氏引了一簇人来至上房内间。|秦氏带着一群人来到上房的里间。
宝玉抬头看见一幅画贴在上面，画的人物固好，其故事乃是《燃藜图》，也不看系何人所画，心中便有些不快。|宝玉抬头看见墙上贴着一幅画，画的人物倒是好，可画的是《燃藜图》（讲刘向夜里苦读、神仙点燃藜杖为他照明的故事），他也不看是谁画的，心里就有些不高兴。
又有一幅对联，写的是：|又有一副对联，写的是：
~世事洞明皆学问，人情练达即文章。|把世上的事看透彻了，都是学问；把人情世故处理得老练周到，就是文章。
及看了这两句，纵然室宇精美，铺陈华丽，亦断断不肯在这里了，忙说：“快出去！快出去！”|看了这两句，就算屋子再精美、陈设再华丽，他也绝对不肯待在这里了，忙说：“快出去！快出去！”
秦氏听了笑道：“这里还不好，可往那里去呢？|秦氏听了笑道：“这里还不好，那去哪儿呢？
不然往我屋里去吧。”|要不去我屋里吧。”
宝玉点头微笑。|宝玉点头微笑。
有一个嬷嬷说道：“那里有个叔叔往侄儿房里睡觉的理？”|有个嬷嬷说：“哪有叔叔到侄儿媳妇房里睡觉的道理？”
秦氏笑道：“嗳哟哟，不怕他恼。|秦氏笑道：“哎呀呀，不怕他生气。
他能多大呢，就忌讳这些个！|他才多大，就忌讳这些！
上月你没看见我那个兄弟来了，虽然与宝叔同年，两个人若站在一处，只怕那个还高些呢。”|上个月我那弟弟来了你没看见，虽然跟宝叔同岁，两人要是站在一起，只怕他还高些呢。”
宝玉道：“我怎么没见过？|宝玉说：“我怎么没见过？
你带他来我瞧瞧。”|你带他来给我看看。”
众人笑道：“隔著二三十里，往那里带去，见的日子有呢。”|大家笑道：“隔着二三十里路，往哪儿带去？以后见面的日子多着呢。”
说著大家来至秦氏房中。|说着大家来到秦氏房里。
刚至房门，便有一股细细的甜香袭人而来。|刚到房门口，就有一股淡淡的甜香扑面而来。
宝玉觉得眼饧骨软，连说“好香！”|宝玉觉得眼皮发沉、骨头发软，连声说“好香！”
入房向壁上看时，有唐伯虎画的《海棠春睡图》，两边有宋学士秦太虚写的一副对联，其联云：|进房往墙上一看，挂着唐伯虎画的《海棠春睡图》，两边是宋朝学士秦观写的一副对联：
~嫩寒锁梦因春冷，芳气袭人是酒香。|微微的寒意锁住梦境，是因为春天还冷；扑鼻的芳香，原来是酒香。
案上设著武则天当日镜室中设的宝镜，一边摆著飞燕立著舞过的金盘，盘内盛著安禄山掷过伤了太真乳的木瓜。|桌上摆着武则天镜室里用过的宝镜，一边放着赵飞燕站在上面跳过舞的金盘，盘里盛着安禄山扔过、砸伤了杨贵妃的木瓜。
上面设著寿昌公主于含章殿下卧的榻，悬的是同昌公主制的联珠帐。|上面摆着寿昌公主在含章殿下睡过的榻，挂着同昌公主做的珍珠帐子。
宝玉含笑连说：“这里好！”|宝玉笑着连声说：“这里好！”
秦氏笑道：“我这屋子大约神仙也可以住得了。”|秦氏笑道：“我这屋子，大概神仙也住得了。”
说著亲自展开了西子浣过的纱衾，移了红娘抱过的鸳枕。|说着亲自铺开西施洗过的纱被，摆好红娘抱过的鸳鸯枕。
于是众奶母伏侍宝玉卧好，款款散了，只留袭人，媚人，晴雯，麝月四个丫鬟为伴。|于是奶妈们伺候宝玉躺好，慢慢都散了，只留下袭人、媚人、晴雯、麝月四个丫鬟陪着。
秦氏便吩咐小丫鬟们，好生在廊檐下看著猫儿狗儿打架。|秦氏就吩咐小丫鬟们，在廊檐下好好看着，别让猫狗打架吵着他。
! 宝玉最讨厌“世事洞明”“人情练达”这类劝人上进的话，一看就要走。
! 秦氏房里的陈设，件件都牵扯着历史上有名的美人和风流故事，作者故意写得夸张，暗示这间屋子不寻常。
! 秦氏说起“我那个兄弟”，就是第七回出场的秦钟。

# 五、梦游太虚幻境
那宝玉刚合上眼，便惚惚的睡去，犹似秦氏在前，遂悠悠荡荡，随了秦氏，至一所在。|宝玉刚合上眼，就迷迷糊糊睡着了，好像秦氏还在前面，就飘飘悠悠地跟着秦氏来到一个地方。
但见朱栏白石，绿树清溪，真是人迹稀逢，飞尘不到。|只见红色栏杆、白色石头，绿树清溪，真是人迹罕至、一尘不染。
宝玉在梦中欢喜，想道：“这个去处有趣，我就在这里过一生，纵然失了家也愿意，强如天天被父母师傅打呢。”|宝玉在梦里很高兴，想：“这地方有意思，我就在这儿过一辈子，就算没了家也愿意，总比天天被父母老师打强。”
正胡思之间，忽听山后有人作歌曰：|正胡思乱想，忽然听见山后有人唱歌：
~春梦随云散，飞花逐水流。|春梦随着云彩散去，落花跟着流水漂走。
~寄言众儿女，何必觅闲愁。|奉劝世上的少男少女，何必自寻烦恼。
宝玉听了是女子的声音。|宝玉听出是女子的声音。
歌声未息，早见那边走出一个人来，蹁跹袅娜，端的与人不同。|歌声还没停，那边就走出一个人来，步态轻盈，身姿婀娜，果然与凡人不同。
有赋为证：|有一篇赋为证：
~方离柳坞，乍出花房。但行处，鸟惊庭树，将到时，影度回廊。|她刚离开柳树环绕的小坞，又走出花丛中的房屋。她走过的地方，庭院树上的鸟都被惊起；快走到时，身影已经掠过回廊。
~仙袂乍飘兮，闻麝兰之馥郁，荷衣欲动兮，听环佩之铿锵。|仙衣的袖子一飘，就闻到麝香和兰花的浓香；荷叶般的衣裙一动，就听到玉佩叮当作响。
~靥笑春桃兮，云堆翠髻，唇绽樱颗兮，榴齿含香。|笑脸像春天的桃花，乌黑的发髻像堆起的云；嘴唇像绽开的樱桃，牙齿像石榴籽一样洁白含香。
~纤腰之楚楚兮，回风舞雪，珠翠之辉辉兮，满额鹅黄。|纤细的腰身楚楚动人，像旋风里飞舞的雪花；满头珠翠闪闪发光，额上点着鹅黄的妆饰。
~出没花间兮，宜嗔宜喜，徘徊池上兮，若飞若扬。|在花丛中时隐时现，生气也好看，欢喜也好看；在池边徘徊，好像要飞起来一样。
~蛾眉颦笑兮，将言而未语，莲步乍移兮，待止而欲行。|眉头似皱似笑，像要说话又没说出口；脚步刚一移动，像要停下又想往前走。
~羡彼之良质兮，冰清玉润，慕彼之华服兮，闪灼文章。|羡慕她美好的气质，像冰一样清澈、玉一样温润；喜爱她华丽的衣服，花纹闪闪发亮。
~爱彼之貌容兮，香培玉琢，美彼之态度兮，凤翥龙翔。|爱她的容貌，像香料培育、美玉雕琢出来的；赞美她的风度，像凤凰飞舞、蛟龙翱翔。
~其素若何，春梅绽雪。其洁若何，秋菊被霜。其静若何，松生空谷。其艳若何，霞映澄塘。|她的素雅像什么？像春天雪中绽放的梅花。她的高洁像什么？像秋天披着霜的菊花。她的安静像什么？像空谷里的青松。她的艳丽像什么？像映在清澈池塘里的彩霞。
~其文若何，龙游曲沼。其神若何，月射寒江。应惭西子，实愧王嫱。|她的文采像什么？像游在曲折池沼里的龙。她的神韵像什么？像照在寒江上的月光。西施见了应该惭愧，王昭君见了也自愧不如。
~奇矣哉，生于孰地，来自何方，信矣乎，瑶池不二，紫府无双。果何人哉？如斯之美也！|真奇怪啊，她生在哪里，从哪里来？真的啊，就是在瑶池仙境也找不出第二个，在神仙府第里也独一无二。她究竟是谁？竟美到这个地步！
! 这一大段赋是模仿曹植《洛神赋》写的，铺陈仙子之美。读的时候不必字字细抠，知道是在极力夸她美就行。

# 六、警幻仙姑
宝玉见是一个仙姑，喜的忙来作揖问道：“神仙姐姐不知从那里来，如今要往那里去？|宝玉见是一位仙姑，高兴地忙上前作揖问：“神仙姐姐从哪里来，现在要到哪里去？
也不知这是何处，望乞携带携带。”|也不知道这是什么地方，求您带上我吧。”
那仙姑笑道：“吾居离恨天之上，灌愁海之中，乃放春山遣香洞太虚幻境警幻仙姑是也：司人间之风情月债，掌尘世之女怨男痴。|仙姑笑道：“我住在离恨天之上、灌愁海之中，是放春山遣香洞太虚幻境的警幻仙姑，掌管人间的男女情债，管着尘世里女子的哀怨和男子的痴情。
因近来风流冤孽，缠绵于此处，是以前来访察机会，布散相思。|因为最近有一批风流冤孽在这一带纠缠，所以来察看时机，散布相思。
今忽与尔相逢，亦非偶然。|今天和你相遇，也不是偶然的。
此离吾境不远，别无他物，仅有自采仙茗一盏，亲酿美酒一瓮，素练魔舞歌姬数人，新填“红楼梦”仙曲十二支，试随吾一游否？”|这里离我的仙境不远，没别的东西招待，只有自己采的一杯仙茶、亲手酿的一坛美酒，几个练熟了歌舞的歌女，还有新写的《红楼梦》仙曲十二支，你愿意跟我去玩玩吗？”
宝玉听说，便忘了秦氏在何处，竟随了仙姑，至一所在，有石牌横建，上书“太虚幻境”四个大字，两边一副对联，乃是：|宝玉听了，就忘了秦氏在哪儿，跟着仙姑来到一个地方，横着立了一座石牌坊，上面写着“太虚幻境”四个大字，两边一副对联：
~假作真时真亦假，无为有处有还无。|把假的当成真的时候，真的也就成了假的；把没有当成有的地方，有的也就成了没有。
! “警幻”就是“警醒梦幻”。她的身份是情的掌管者，却要用情来点醒宝玉。
! “假作真时真亦假”第一回甄士隐梦里就出现过，这是全书真假交错的总纲。

# 七、孽海情天与薄命司
转过牌坊，便是一座宫门，上面横书四个大字，道是：“孽海情天”。|绕过牌坊，是一座宫门，上面横写着四个大字：“孽海情天”。
又有一副对联，大书云：|又有一副对联，大字写着：
~厚地高天，堪叹古今情不尽。|地厚天高，可叹从古到今，情总是没有尽头。
~痴男怨女，可怜风月债难偿。|痴情的男子、哀怨的女子，可怜他们欠下的情债总也还不清。
宝玉看了，心下自思道：“原来如此。|宝玉看了，心里想：“原来是这样。
但不知何为“古今之情”，何为“风月之债”？|可不知道什么是‘古今之情’，什么是‘风月之债’？
从今倒要领略领略。”|从今以后倒要领略领略。”
宝玉只顾如此一想，不料早把些邪魔招入膏肓了。|宝玉只顾这么一想，没料到早已把邪念招进了心里。
当下随了仙姑进入二层门内，至两边配殿，皆有匾额对联，一时看不尽许多，惟见有几处写的是：“痴情司”，“结怨司”，“朝啼司”，“夜怨司”，“春感司”，“秋悲司”。|他跟着仙姑进了第二层门，两边的配殿都有匾额对联，一时看不过来，只看见几处写着：“痴情司”“结怨司”“朝啼司”“夜怨司”“春感司”“秋悲司”。
看了，因向仙姑道：“敢烦仙姑引我到那各司中游玩游玩，不知可使得？”|看了以后，就对仙姑说：“麻烦仙姑带我到这些司里去逛逛，不知可不可以？”
仙姑道：“此各司中皆贮的是普天之下所有的女子过去未来的簿册，尔凡眼尘躯，未便先知的。”|仙姑说：“这些司里存的都是天下所有女子过去和未来的命运簿子，你是凡人肉眼，不能先知道。”
宝玉听了，那里肯依，复央之再三。|宝玉听了哪里肯，又再三哀求。
仙姑无奈，说：“也罢，就在此司内略随喜随喜罢了。”|仙姑没办法，说：“也罢，就在这个司里随便看看吧。”
宝玉喜不自胜，抬头看这司的匾上，乃是“薄命司”三字，两边对联写的是：|宝玉高兴极了，抬头看这个司的匾，是“薄命司”三个字，两边的对联写着：
~春恨秋悲皆自惹，花容月貌为谁妍。|春天的怨恨、秋天的悲伤，都是自己招来的；如花似月的容貌，又是为谁而美呢？
! 偏偏让宝玉进的是“薄命司”：书里的女子，几乎没有一个有好结局。

# 八、又副册：晴雯、袭人
宝玉看了，便知感叹。|宝玉看了，不禁感叹起来。
进入门来，只见有十数个大橱，皆用封条封著。|进了门，只见十几个大柜子，都用封条封着。
看那封条上，皆是各省的地名。|看那封条上写的，都是各省的地名。
宝玉一心只拣自己的家乡封条看，遂无心看别省的了。|宝玉一心只找自己家乡的封条看，别省的就没心思看了。
只见那边橱上封条上大书七字云：“金陵十二钗正册”。|只见那边一个柜子的封条上写着七个大字：“金陵十二钗正册”。
宝玉问道：“何为‘金陵十二钗正册’？”|宝玉问：“什么是‘金陵十二钗正册’？”
警幻道：“即贵省中十二冠首女子之册，故为‘正册’。”|警幻说：“就是你们省里最出众的十二个女子的簿册，所以叫‘正册’。”
宝玉道：“常听人说，金陵极大，怎么只十二个女子？|宝玉说：“常听人说金陵很大，怎么只有十二个女子？
如今单我家里，上上下下，就有几百女孩子呢。”|现在光我家里，上上下下就有几百个女孩子呢。”
警幻冷笑道：“贵省女子固多，不过择其紧要者录之。|警幻冷笑道：“你们省的女子当然多，不过挑最要紧的记下来。
下边二橱则又次之。|下面两个柜子是次一等的。
馀者庸常之辈，则无册可录矣。”|其余平平常常的，就没有册子可记了。”
宝玉听说，再看下首二橱上，果然写著“金陵十二钗副册”，又一个写著“金陵十二钗又副册”。|宝玉听了，再看下面两个柜子，果然一个写着“金陵十二钗副册”，一个写着“金陵十二钗又副册”。
宝玉便伸手先将“又副册”橱开了，拿出一本册来，揭开一看，只见这首页上画著一幅画，又非人物，也无山水，不过是水墨滃染的满纸乌云浊雾而已。|宝玉就先打开“又副册”的柜子，拿出一本册子，翻开一看，第一页上画着一幅画，既不是人物也不是山水，只是用水墨渲染的满纸乌云浊雾。
后有几行字迹，写的是：|后面有几行字，写的是：
~霁月难逢，彩云易散。心比天高，身为下贱。风流灵巧招人怨，寿夭多因毁谤生，多情公子空牵念。|雨后的明月难得遇见，彩色的云最容易散。心比天还高，身份却是低贱的丫鬟。聪明漂亮招来别人的怨恨，短命多半是因为遭人诽谤，多情的公子只能白白地挂念她。
宝玉看了，又见后面画著一簇鲜花，一床破席，也有几句言词，写道是：|宝玉看了，又见后面画着一簇鲜花、一张破席子，也有几句话，写道：
~枉自温柔和顺，空云似桂如兰。|白白地温柔和顺，白白地说她像桂花兰花一样芬芳。
~堪羡优伶有福，谁知公子无缘。|可羡慕那个戏子有福气，谁知道公子跟她没有缘分。
! 第一首是晴雯：“霁月”就是雨后晴天的月亮，暗含“晴”字；“彩云”暗含“雯”字。
! 第二首是袭人：“鲜花”是“花”，“破席”谐音“袭”。她最后嫁给了戏子蒋玉菡。

# 九、副册：香菱
宝玉看了不解。|宝玉看了不明白。
遂掷下这个，又去开了副册橱门，拿起一本册来，揭开看时，只见画著一株桂花，下面有一池沼，其中水涸泥干，莲枯藕败，后面书云：|就扔下这本，又去打开副册的柜门，拿起一本册子翻开看，只见画着一株桂花，下面一个池塘，池水干了，泥也干了，莲花枯了，藕也烂了，后面写着：
~根并荷花一茎香，平生遭际实堪伤。|她和荷花同根同茎，一样清香；一生的遭遇实在让人伤心。
~自从两地生孤木，致使香魂返故乡。|自从“两地生孤木”以后，她的芳魂就回故乡去了。
! 这是香菱（英莲）。“荷花”“莲”扣“英莲”，后来她改名“香菱”。
! “两地生孤木”合起来是“桂”字，指薛蟠后来娶的妻子夏金桂。香菱就死在她手里。

# 十、正册判词（上）
宝玉看了仍不解。|宝玉看了还是不明白。
便又掷了，再去取“正册”看，只见头一页上便画著两株枯木，木上悬著一围玉带，又有一堆雪，雪下一股金簪。|又扔下，再去拿“正册”看，只见第一页上画着两棵枯树，树上挂着一条玉带；又有一堆雪，雪里埋着一根金簪。
也有四句言词，道是：|也有四句话：
~可叹停机德，谁怜咏絮才。|可叹她有劝夫上进的贤德，谁又怜惜她咏絮的才华。
~玉带林中挂，金簪雪里埋。|玉带挂在树林里，金簪埋在雪堆里。
宝玉看了仍不解。|宝玉看了还是不明白。
待要问时，情知他必不肯泄漏，待要丢下，又不舍。|想问吧，知道她一定不肯泄露；想扔下吧，又舍不得。
遂又往后看时，只见画著一张弓，弓上挂著香橼。|就又往后看，只见画着一张弓，弓上挂着一个香橼（一种像柚子的果子）。
也有一首歌词云：|也有一首歌词：
~二十年来辨是非，榴花开处照宫闱。|二十年来她明辨是非，像石榴花开一样照亮了皇宫。
~三春争及初春景，虎兔相逢大梦归。|三个妹妹怎么比得上她这个长姐的风光？到了虎兔相逢的年月，她就大梦一场归去了。
后面又画著两人放风筝，一片大海，一只大船，船中有一女子掩面泣涕之状。|后面又画着两个人放风筝，一片大海，一只大船，船里有个女子捂着脸哭。
也有四句写云：|也有四句：
~才自精明志自高，生于末世运偏淆。|她才能精明，志向高远，可生在家族衰败的末世，运气偏偏不好。
~清明涕送江边望，千里东风一梦遥。|清明时节，家人在江边流泪送别；她乘着东风远去千里，故乡只能在梦里遥望了。
后面又画几缕飞云，一湾逝水。|后面又画着几缕飘飞的云、一湾流走的水。
其词曰：|词是：
~富贵又何为，襁褓之间父母违。|富贵又有什么用？还在襁褓里就失去了父母。
~展眼吊斜晖，湘江水逝楚云飞。|转眼间就对着夕阳悲伤，像湘江水流走、楚天的云飞散一样。
后面又画著一块美玉，落在泥垢之中。|后面又画着一块美玉，掉在污泥里。
其断语云：|判词说：
~欲洁何曾洁，云空未必空。|想要洁净，何曾真的洁净；说是看空了，也未必真的空。
~可怜金玉质，终陷淖泥中。|可怜她金玉一样的品质，最终还是陷进了污泥里。
! 第一首合写黛玉和宝钗：“玉带林”倒读是“林黛玉”，“雪”谐音“薛”，“金簪”就是宝钗。“停机德”说宝钗贤德，“咏絮才”说黛玉有才。
! 弓谐音“宫”，香橼谐音“元”：这是元春，后来入宫做了贵妃。“三春”指迎春、探春、惜春。
! 放风筝、大船远嫁：这是探春，最后远嫁他乡。
! 父母早亡、“湘江”“云”：这是史湘云。
! 美玉落泥：这是妙玉，带发修行的尼姑，下场最惨。

# 十一、正册判词（下）
后面忽见画著个恶狼，追扑一美女，欲啖之意。|后面忽然看见画着一只恶狼，扑向一个美女，要吃她的样子。
其书云：|上面写着：
~子系中山狼，得志便猖狂。|你的丈夫是一只中山狼，一得志就猖狂。
~金闺花柳质，一载赴黄粱。|可怜千金小姐如花似柳的身子，嫁过去一年就死了。
后面便是一所古庙，里面有一美人在内看经独坐。|后面是一座古庙，里面一个美人独自坐着看经。
其判云：|判词说：
~勘破三春景不长，缁衣顿改昔年妆。|她看破了三个姐姐的好景不长，就脱下往日的打扮，换上了黑色的僧衣。
~可怜绣户侯门女，独卧青灯古佛旁。|可怜一个侯门千金，只能独自睡在青灯古佛旁边。
后面便是一片冰山，上面有一只雌凤。|后面是一座冰山，上面有一只雌凤凰。
其判曰：|判词说：
~凡鸟偏从末世来，都知爱慕此生才。|这只凤凰偏偏生在家族的末世，人人都羡慕她的才干。
~一从二令三人木，哭向金陵事更哀。|“一从二令三人木”，最后哭着回到金陵，结局更加悲哀。
后面又是一座荒村野店，有一美人在那里纺绩。|后面又是一个荒村野店，有个美人在那里纺线。
其判云：|判词说：
~势败休云贵，家亡莫论亲。|家势败落了就别再说什么富贵，家破人亡了也别再讲什么亲戚。
~偶因济村妇，巧得遇恩人。|只因当年偶然接济过一个村妇，碰巧在危难时遇到了恩人。
后面又画著一盆茂兰，旁有一位凤冠霞帔的美人。|后面又画着一盆茂盛的兰花，旁边一位戴凤冠、穿霞帔的美人。
也有判云：|也有判词：
~桃李春风结子完，到头谁似一盆兰。|桃李在春风里开花结果都完了，到头来谁比得上这一盆兰花。
~如冰水好空相妒，枉与他人作笑谈。|她的品行像冰水一样清白，别人白白嫉妒她；可到头来也只是给别人当了笑谈。
后面又画著高楼大厦，有一美人悬梁自缢。|后面又画着高楼大厦，一个美人在上面上吊自尽。
其判云：|判词说：
~情天情海幻情身，情既相逢必主淫。|在情天情海里幻化出多情的身子，两情相遇一定会生出淫乱。
~漫言不肖皆荣出，造衅开端实在宁。|别说那些不成器的子孙都出在荣府，惹祸的根源其实在宁府。
宝玉还欲看时，那仙姑知他天分高明，性情颖慧，恐把仙机泄漏，遂掩了卷册，笑向宝玉道：“且随我去游玩奇景，何必在此打这闷葫芦！”|宝玉还想往下看，仙姑知道他天资聪明、悟性高，怕泄露了天机，就合上册子，笑着对宝玉说：“先跟我去看奇景吧，何必在这里猜这些闷葫芦！”
! 中山狼：迎春，嫁给孙绍祖（“子系”合起来是“孙”字），一年就被折磨死了。
! 古庙看经：惜春，最后出家为尼。
! 冰山雌凤：王熙凤。“凡鸟”合起来是“凤”字，冰山遇日就化，暗示她的权势靠不住。
! 荒村纺绩：巧姐，凤姐的女儿。“济村妇”就是下一回进府的刘姥姥，后来是她救了巧姐。
! 一盆兰：李纨，儿子贾兰后来做了官，她却没享到福。
! 悬梁自缢：秦可卿。“造衅开端实在宁”，贾府败落的祸根在宁府。
! 正册十二人：黛玉、宝钗、元春、探春、湘云、妙玉、迎春、惜春、凤姐、巧姐、李纨、秦可卿。宝玉看了却一个也没看懂。

# 十二、众仙子嫌宝玉是浊物
宝玉恍恍惚惚，不觉弃了卷册，又随了警幻来至后面。|宝玉恍恍惚惚，不知不觉放下册子，又跟着警幻来到后面。
但见珠帘绣幕，画栋雕檐，说不尽那光摇朱户金铺地，雪照琼窗玉作宫。|只见珍珠帘子、绣花帷幕，彩画的梁柱、雕花的屋檐，说不尽的光彩：阳光在红门上闪动，金子铺地；白雪映照着玉做的窗户和宫殿。
更见仙花馥郁，异草芬芳，真好个所在。|还有仙花浓香、奇草芬芳，真是个好地方。
又听警幻笑道：“你们快出来迎接贵客！”|又听警幻笑道：“你们快出来迎接贵客！”
一语未了，只见房中又走出几个仙子来，皆是荷袂蹁跹，羽衣飘舞，姣若春花，媚如秋月。|话没说完，只见房里又走出几个仙子，都是荷叶般的衣袖翩翩，羽毛做的衣服飘舞，娇美像春花，妩媚像秋月。
一见了宝玉，都怨谤警幻道：“我们不知系何‘贵客’，忙的接了出来！|她们一见宝玉，都埋怨警幻说：“我们不知道是什么‘贵客’，急忙迎了出来！
姐姐曾说今日今时必有绛珠妹子的生魂前来游玩，故我等久待。|姐姐说过今天这个时候，绛珠妹妹的生魂一定会来游玩，所以我们等了很久。
何故反引这浊物来污染这清净女儿之境？”|怎么反倒带了这么个浊物来，弄脏我们这清净的女儿之地？”
宝玉听如此说，便吓得欲退不能退，果觉自形污秽不堪。|宝玉听她们这么说，吓得想退又退不了，果然觉得自己肮脏不堪。
! “绛珠妹子”就是黛玉。仙子们等的本是她，来的却是宝玉。
! 宝玉平时说“女儿是水做的骨肉，男人是泥做的骨肉”，这里仙子们也嫌他是“浊物”。

# 十三、宁荣二公的嘱托
警幻忙携住宝玉的手，向众姊妹道：“你等不知原委：今日原欲往荣府去接绛珠，适从宁府所过，偶遇宁荣二公之灵，嘱吾云：|警幻忙拉住宝玉的手，对众姐妹说：“你们不知道原委：今天我本来要去荣府接绛珠，正好路过宁府，偶然遇到宁国公、荣国公的魂灵，他们嘱咐我说：
‘吾家自国朝定鼎以来，功名奕世，富贵传流，虽历百年，奈运终数尽，不可挽回者。|‘我们家自从本朝开国以来，世代功名显赫，富贵相传，虽然已经一百年了，无奈气数已尽，无法挽回。
故遗之子孙虽多，竟无可以继业。|所以留下的子孙虽然多，竟没有一个能继承家业的。
其中惟嫡孙宝玉一人，禀性乖张，生性怪谲，虽聪明灵慧，略可望成，无奈吾家运数合终，恐无人规引入正。|其中只有嫡孙宝玉一个，性情古怪、脾气别扭，虽然聪明灵秀，还有点指望，可我家气数该尽了，怕没人引导他走上正路。
幸仙姑偶来，万望先以情欲声色等事警其痴顽，或能使彼跳出迷人圈子，然后入于正路，亦吾兄弟之幸矣。’|幸好仙姑来了，千万先用情欲声色这些事点醒他的痴顽，或许能让他跳出迷人的圈子，然后走上正路，那就是我们兄弟的幸运了。’
如此嘱吾，故发慈心，引彼至此。|他们这样嘱托我，所以我发了慈悲心，把他带到这里来。
先以彼家上中下三等女子之终身册籍，令彼熟玩，尚未觉悟，故引彼再至此处，令其再历饮馔声色之幻，或冀将来一悟，亦未可知也。”|先让他看了他家上中下三等女子一生命运的册子，他还没醒悟，所以再带他到这里，让他再经历一番饮食声色的幻境，或许将来能有一天醒悟，也说不定。”
! 祖宗的魂灵都知道家运已尽，“竟无可以继业”。这是贾府衰败的又一次预告。
! 警幻的办法是“以情悟道”：先让宝玉尝尽情的滋味，再让他看破。这其实是全书的写法。

# 十四、群芳髓、千红一窟、万艳同杯
说毕，携了宝玉入室。|说完，拉着宝玉进了屋。
但闻一缕幽香，竟不知其所焚何物。|只闻到一缕幽香，不知道烧的是什么。
宝玉遂不禁相问。|宝玉忍不住问。
警幻冷笑道：“此香尘世中既无，尔何能知！|警幻冷笑道：“这种香人间没有，你怎么会知道！
此香乃系诸名山胜境内初生异卉之精，合各种宝林珠树之油所制，名‘群芳髓’。”|这香是用各处名山胜境里刚长出来的奇花的精华，加上各种宝树的油做成的，叫‘群芳髓’。”
宝玉听了，自是羡慕而已。|宝玉听了，只是羡慕。
大家入座，小丫鬟捧上茶来。|大家坐下，小丫鬟端上茶来。
宝玉自觉清香异味，纯美非常，因又问何名。|宝玉觉得清香奇特，纯美极了，又问叫什么。
警幻道：“此茶出在放春山遣香洞，又以仙花灵叶上所带之宿露而烹，此茶名曰‘千红一窟’。”|警幻说：“这茶产在放春山遣香洞，又用仙花灵叶上隔夜的露水来煮，名叫‘千红一窟’。”
宝玉听了，点头称赏。|宝玉听了，点头称赞。
因看房内，瑶琴，宝鼎，古画，新诗，无所不有，更喜窗下亦有唾绒，奁间时渍粉污。|再看屋里，瑶琴、宝鼎、古画、新诗，什么都有。他更喜欢的是窗下也有女子刺绣时吐出的线头，梳妆匣上还沾着脂粉。
壁上也见悬著一副对联，书云：|墙上也挂着一副对联：
~幽微灵秀地，无可奈何天。|这是一个幽深精微、灵秀美好的地方，却在一片无可奈何的天空下。
宝玉看毕，无不羡慕。|宝玉看完，样样都羡慕。
因又请问众仙姑姓名：一名痴梦仙姑，一名钟情大士，一名引愁金女，一名度恨菩提，各各道号不一。|又问众仙子的名字：一个叫痴梦仙姑，一个叫钟情大士，一个叫引愁金女，一个叫度恨菩提，各有各的道号。
少刻，有小丫鬟来调桌安椅，设摆酒馔。|一会儿，小丫鬟来摆桌椅、上酒菜。
真是：琼浆满泛玻璃盏，玉液浓斟琥珀杯。|真是：玻璃杯里满满的美酒，琥珀杯里斟着浓浓的玉液。
更不用再说那肴馔之盛。|菜肴的丰盛就更不用说了。
宝玉因闻得此酒清香甘冽，异乎寻常，又不禁相问。|宝玉闻到这酒清香甘甜，与众不同，又忍不住问。
警幻道：“此酒乃以百花之蕊，万木之汁，加以麟髓之醅，凤乳之曲酿成，因名为‘万艳同杯’。”|警幻说：“这酒是用百花的花蕊、万木的汁液，加上麒麟骨髓做的酒底、凤凰乳汁做的酒曲酿成的，所以叫‘万艳同杯’。”
宝玉称赏不迭。|宝玉称赞个不停。
! “千红一窟”谐音“千红一哭”，“万艳同杯”谐音“万艳同悲”。“群芳髓”谐音“群芳碎”。香、茶、酒的名字都在说：所有美好的女子都要一起哭、一起悲、一起碎。

# 十五、《红楼梦》十二支曲：引子、终身误、枉凝眉
饮酒间，又有十二个舞女上来，请问演何词曲。|喝酒的时候，又有十二个舞女上来，问演唱什么曲子。
警幻道：“就将新制《红楼梦》十二支演上来。”|警幻说：“就把新写的《红楼梦》十二支曲演上来。”
舞女们答应了，便轻敲檀板，款按银筝，听他歌道是：“开辟鸿蒙……”|舞女们答应了，就轻轻敲起檀板，慢慢弹起银筝，唱道：“开辟鸿蒙……”
方歌了一句，警幻便说道：“此曲不比尘世中所填传奇之曲，必有生旦净末之则，又有南北九宫之限。|刚唱了一句，警幻就说：“这曲子不像人间写的戏曲，一定要分生旦净末这些角色，还受南北曲宫调的限制。
此或咏叹一人，或感怀一事，偶成一曲，即可谱入管弦。|这些曲子有的咏叹一个人，有的感怀一件事，偶然写成一支，就可以配上乐器演唱。
若非个中人，不知其中之妙。|要不是局中人，不知道其中的妙处。
料尔亦未必深明此调。|料想你也未必懂得这些曲调。
若不先阅其稿，后听其歌，翻成嚼蜡矣。”|要是不先看曲词，再听演唱，就会味同嚼蜡了。”
说毕，回头命小丫鬟取了《红楼梦》原稿来，递与宝玉。|说完，回头叫小丫鬟拿来《红楼梦》的原稿，递给宝玉。
宝玉接来，一面目视其文，一面耳聆其歌曰：|宝玉接过来，一边看曲词，一边听演唱：
红楼梦引子|【红楼梦引子】
~开辟鸿蒙，谁为情种？都只为风月情浓；|自从开天辟地，谁是最痴情的人？都只因为男女之情太浓；
~趁著这奈何天，伤怀日，寂寥时，试遣愚衷，因此上演出这悲金悼玉的“红楼梦”。|趁着这无可奈何的天气、伤心的日子、寂寞的时候，试着抒发我的心意，所以演出了这悲叹“金”、哀悼“玉”的《红楼梦》。
终身误|【终身误】
~都道是金玉良缘，俺只念木石前盟。|大家都说金玉是良缘，我心里只记着木石前盟。
~空对著，山中高士晶莹雪；终不忘，世外仙姝寂寞林。|白白地对着山中高士一样晶莹的雪，始终忘不了世外仙女一样寂寞的林。
~叹人间，美中不足今方信。纵然是齐眉举案，到底意难平。|可叹人间的事，“美中不足”这话我今天才信。就算夫妻相敬如宾，心里到底还是不甘。
枉凝眉|【枉凝眉】
~一个是阆苑仙葩，一个是美玉无瑕。|一个是仙界的奇花，一个是没有瑕疵的美玉。
~若说没奇缘，今生偏又遇著他；若说有奇缘，如何心事终虚化？|要说没有奇缘，今生偏偏又遇见了他；要说有奇缘，为什么心事最终落了空？
~一个枉自嗟呀，一个空劳牵挂；一个是水中月，一个是镜中花。|一个白白地叹息，一个白白地牵挂；一个像水里的月亮，一个像镜子里的花。
~想眼中能有多少泪珠儿，怎经得秋流到冬，春流到夏？|想想眼睛里能有多少泪珠，怎么经得起从秋流到冬、从春流到夏？
! 《终身误》是宝玉的口吻：娶了宝钗（雪），心里还是忘不了黛玉（林）。“齐眉举案”说夫妻表面和睦。
! 《枉凝眉》写宝黛：黛玉是“阆苑仙葩”，宝玉是“美玉无瑕”。“眼中能有多少泪珠儿”呼应还泪的故事。

# 十六、恨无常、分骨肉、乐中悲
宝玉听了此曲，散漫无稽，不见得好处，但其声韵凄惋，竟能销魂醉魄。|宝玉听这些曲子，觉得散漫没有头绪，看不出好在哪里，可是声调凄凉婉转，竟让人魂都醉了。
因此也不察其原委，问其来历，就暂以此释闷而已。|所以也不追究里面的意思，不问来历，暂且拿来解闷罢了。
因又看下道：|于是又往下看：
恨无常|【恨无常】
~喜荣华正好，恨无常又到。|正欢喜荣华富贵到了顶点，可恨死亡又来了。
~眼睁睁，把万事全抛；荡悠悠，把芳魂消耗。|眼睁睁地把一切都抛下，飘飘荡荡地魂魄消散。
~望家乡，路远山高。故向爹娘梦里相寻告：儿命已入黄泉，天伦呵，须要退步抽身早。|望着家乡，路远山高。所以到爹娘的梦里告诉他们：女儿已经死了；爹娘啊，你们要趁早退身，躲开祸事。
分骨肉|【分骨肉】
~一帆风雨路三千，把骨肉家园齐来抛闪。|一条船在风雨里走了三千里路，把亲人和家园全都抛下了。
~恐哭损残年，告爹娘，休把儿悬念。|怕哭坏了年老的爹娘，告诉爹娘，别再挂念女儿。
~自古穷通皆有定，离合岂无缘？从今分两地，各自保平安。奴去也，莫牵连。|自古穷困和显达都是命中注定的，分离和团聚哪能没有缘分？从此分隔两地，各自保重平安。我走了，别再牵挂。
乐中悲|【乐中悲】
~襁褓中，父母叹双亡，纵居那绮罗丛，谁知娇养？|还在襁褓里，就可叹父母都死了；就算住在富贵人家，谁又娇惯过她？
~幸生来，英豪阔大宽宏量，从未将儿女私情略萦心上，好一似，霁月光风耀玉堂。|幸好她生来豪爽大度、心胸宽广，从没把儿女私情放在心上，就像雨后的明月清风照亮了华美的厅堂。
~厮配得才貌仙郎，博得个地久天长，准折得幼年时坎坷形状。|嫁了个才貌双全的好丈夫，本以为能天长地久，抵消小时候的坎坷。

! 《恨无常》写元春：荣华到顶时突然死去，托梦叫爹娘“退步抽身”。
! 《分骨肉》写探春远嫁。
! 《乐中悲》写史湘云：从小没了父母，婚后不久又跟丈夫离散。

# 十七、世难容、喜冤家、虚花悟
世难容|【世难容】

~你道是啖肉食腥膻，视绮罗俗厌；却不知太高人愈妒，过洁世同嫌。|你说吃肉腥膻，看绫罗俗气；却不知道太清高了别人越嫉妒，太洁净了世人都嫌弃。
~可叹这，青灯古殿人将老；辜负了，红粉朱楼春色阑；|可叹她在青灯古殿里渐渐老去，辜负了红楼里的青春年华；
~到头来，依旧是风尘肮脏违心愿。好一似，无瑕白玉遭泥陷；又何须，王孙公子叹无缘。|到头来还是落入污浊的尘世，违背了心愿。就像无瑕的白玉陷进了泥里，又何必让王孙公子感叹无缘呢。

! 《世难容》写妙玉，《喜冤家》写迎春，《虚花悟》写惜春出家。

好事终|【好事终】
~画梁春尽落香尘，擅风情，秉月貌，便是败家的根本；|彩画的屋梁下，春天过去，香尘飘落；擅长风情，长着美貌，就是败家的根源；
~箕裘颓堕皆从敬，家事消亡首罪宁，宿孽总因情。|家业败坏都是从贾敬开始的，家事衰亡首要罪过在宁府，前世的冤孽都是因为情。
收尾：飞鸟各投林|【收尾·飞鸟各投林】
~为官的、家业凋零，富贵的、金银散尽，有恩的、死里逃生，无情的、分明报应，|做官的，家业凋零；富贵的，金银散尽；有恩德的，死里逃生；无情无义的，明明白白遭了报应；
~欠命的、命已还，欠泪的、泪已尽。|欠了命的，命已经还了；欠了泪的，泪已经流尽了。
~冤冤相报实非轻，分离聚合皆前定；欲知命短问前生，老来富贵也真侥幸。|冤冤相报可不是小事，分离聚合都是前世定的；想知道为什么短命，去问前生；老了还能富贵，也真是侥幸。
~看破的、遁入空门，痴迷的、枉送了性命；好一似食尽鸟投林，落了片白茫茫大地真干净。|看破的，出家当了和尚尼姑；执迷不悟的，白白送了性命。就像鸟儿吃完了食各自飞回林子，只落得白茫茫一片大地，真干净。
! 《聪明累》写凤姐，“机关算尽太聪明”是她一生的结论。
! 《留馀庆》写巧姐，“恩人”是刘姥姥，“狠舅奸兄”是要卖掉她的亲戚。
! 《晚韶华》写李纨，《好事终》写秦可卿。“箕裘颓堕皆从敬”直指贾珍的父亲贾敬。
! 《飞鸟各投林》是全书结局的总写。“欠泪的、泪已尽”就是黛玉，“白茫茫大地真干净”是整个贾府的下场。

# 十九、警幻许配可卿
歌毕，还要歌副曲。|唱完了，还要唱副曲。
警幻见宝玉甚无趣味，因叹：“痴儿竟尚未悟！”|警幻见宝玉一点兴趣都没有，就叹气说：“傻孩子还是没有醒悟！”
那宝玉忙止歌姬不必再唱，自觉朦胧恍惚，告醉求卧。|宝玉忙叫歌女别再唱了，自己觉得迷迷糊糊，说喝醉了，要去躺躺。
警幻便命撤去残席，送宝玉至一香闺绣阁之中，其间铺陈之盛，乃素所未见之物。|警幻就叫人撤了酒席，把宝玉送到一间香闺绣房里，里面的陈设华丽，都是他从没见过的。
更可骇者，早有一位女子在内，其鲜艳妩媚，有似乎宝钗，风流袅娜，则又如黛玉。|更让他吃惊的是，里面早有一位女子，鲜艳妩媚像宝钗，风流婀娜又像黛玉。
正不知何意，忽警幻道：“尘世中多少富贵之家，那些绿窗风月，绣阁烟霞，皆被淫污纨袴与那些流荡女子悉皆玷辱。|宝玉正不知道是什么意思，警幻说：“人间多少富贵人家的闺房风月，都被那些下流的纨绔子弟和轻浮女子糟蹋了。
更可恨者，自古来多少轻薄浪子，皆以‘好色不淫’为饰，又以‘情而不淫’作案，此皆饰非掩丑之语也。|更可恨的是，自古以来多少轻薄浪子，都拿‘好色不淫’‘有情不淫’当借口，这都是掩饰丑行的话。
好色即淫，知情更淫。|好色就是淫，懂情更是淫。
是以巫山之会，云雨之欢，皆由既悦其色，复恋其情所致也。|所以男女欢会，都是因为先喜欢了对方的美色，又迷恋上了对方的情意。
吾所爱汝者，乃天下古今第一淫人也。”|我喜欢你，是因为你是古往今来天下第一个‘淫人’。”
宝玉听了，唬的忙答道：“仙姑差了。|宝玉听了，吓得忙说：“仙姑说错了。
我因懒于读书，家父母尚每垂训饬，岂敢再冒‘淫’字。|我因为懒得读书，爹娘还常常教训我，哪敢再担个‘淫’字。
况且年纪尚小，不知‘淫’字为何物。”|况且我年纪还小，不知道‘淫’是什么。”
警幻道：“非也。|警幻说：“不是这样。
淫虽一理，意则有别。|淫虽然是一个道理，意思却有区别。
如世之好淫者，不过悦容貌，喜歌舞，调笑无厌，云雨无时，恨不能尽天下之美女供我片时之趣兴，此皆皮肤淫滥之蠢物耳。|世上那些好色的人，不过是喜欢美貌、喜欢歌舞，调笑没完没了，只想着肉欲，恨不得让天下的美女都供自己一时取乐，这些都是只顾皮肉的蠢东西。
如尔则天分中生成一段痴情，吾辈推之为‘意淫’。|像你，天性里就生成一段痴情，我们把它叫做‘意淫’。
‘意淫’二字，惟心会而不可口传，可神通而不可语达。|‘意淫’这两个字，只能用心体会，不能用嘴说明；只能心领神会，不能用语言表达。
汝今独得此二字，在闺阁中，固可为良友，然于世道中未免迂阔怪诡，百口嘲谤，万目睚眦。|你独独有这两个字，在女孩子们中间当然是好朋友，可在世道上难免被看成迂腐古怪，被众人嘲笑、诽谤，被人冷眼相看。
今既遇令祖宁荣二公剖腹深嘱，吾不忍君独为我闺阁增光，见弃于世道，是以特引前来，醉以灵酒，沁以仙茗，警以妙曲，|现在既然你的祖宗宁荣二公推心置腹地嘱托我，我不忍心你只给女孩子们增光，却被世道抛弃，所以特地带你来，用灵酒让你醉，用仙茶让你清醒，用妙曲警醒你，
再将吾妹一人，乳名兼美字可卿者，许配于汝。|再把我的一个妹妹，小名兼美、字可卿的，许配给你。
今夕良时，即可成姻。|今晚是好时辰，就可以成亲。
不过令汝领略此仙闺幻境之风光尚如此，何况尘境之情景哉？|不过是让你领略一下：仙境里的风光也不过如此，何况人间呢？
而今后万万解释，改悟前情，留意于孔孟之间，委身于经济之道。”|从今以后千万要醒悟，改掉以前的痴情，把心思放在孔孟的学问上，投身到经世济民的正道中去。”
说毕便秘授以云雨之事，推宝玉入房，将门掩上自去。|说完，警幻又私下对他讲了男女之事，把宝玉推进房里，关上门走了。
! “意淫”是本书的关键词，不是字面上的意思，指的是宝玉对女孩子们出于真心的体贴和怜惜，不带占有。脂砚斋说宝玉是“情不情”，也是这个意思。
! “兼美”就是兼有宝钗、黛玉之美，字“可卿”，正和秦氏同名。梦与现实在这里重叠。
! 警幻的本意是让宝玉“看破”，回归“孔孟”“经济”的正路。可宝玉偏偏没有醒悟，反而更沉溺进去了。

# 二十、迷津惊梦
那宝玉恍恍惚惚，依警幻所嘱之言，未免有儿女之事，难以尽述。|宝玉迷迷糊糊，照警幻嘱咐的，在梦中与可卿成了亲，这里就不细说了。
至次日，便柔情缱绻，软语温存，与可卿难解难分。|到了第二天，两人情意缠绵，温言软语，跟可卿难舍难分。
因二人携手出去游顽之时，忽至一个所在，但见荆榛遍地，狼虎同群，迎面一道黑溪阻路，并无桥梁可通。|两人手拉手出去游玩，忽然来到一个地方，只见满地荆棘，豺狼虎豹成群，迎面一条黑水河挡住了路，没有桥可以过去。
正在犹豫之间，忽见警幻后面追来，告道：“快休前进，作速回头要紧！”|正犹豫着，忽然看见警幻从后面追来，喊道：“千万别往前走了，赶快回头！”
宝玉忙止步问道：“此系何处？”|宝玉忙停下脚步问：“这是什么地方？”
警幻道：“此即迷津也。|警幻说：“这就是迷津。
深有万丈，遥亘千里，中无舟楫可通，只有一个木筏，乃木居士掌舵，灰侍者撑篙，不受金银之谢，但遇有缘者渡之。|它深有万丈，长有千里，中间没有船可以通过，只有一只木筏，由木居士掌舵、灰侍者撑篙，不收金银酬谢，只渡有缘的人。
尔今偶游至此，设如堕落其中，则深负我从前谆谆警戒之语矣。”|你今天偶然游到这里，要是掉下去，就辜负了我先前苦口婆心的警告了。”
话犹未了，只听迷津内水响如雷，竟有许多夜叉海鬼将宝玉拖将下去。|话还没说完，只听迷津里水声像打雷一样，竟有许多夜叉海鬼要把宝玉拖下去。
吓得宝玉汗下如雨，一面失声喊叫：“可卿救我！”|吓得宝玉汗如雨下，失声大叫：“可卿救我！”
吓得袭人辈众丫鬟忙上来搂住，叫：“宝玉别怕，我们在这里！”|吓得袭人她们这些丫鬟忙上来抱住他，叫道：“宝玉别怕，我们在这儿！”
却说秦氏正在房外嘱咐小丫头们好生看著猫儿狗儿打架，忽听宝玉在梦中唤他的小名，因纳闷道：“我的小名这里从没人知道的，他如何知道，在梦里叫出来？”|再说秦氏正在房外嘱咐小丫头们好好看着别让猫狗打架，忽然听见宝玉在梦里叫她的小名，心里纳闷：“我的小名这里从来没人知道，他怎么知道，还在梦里叫出来？”
正是：|正是：
~一场幽梦同谁诉，千古情人独我知。|这一场幽梦能跟谁说？千古以来的痴情人，只有我自己知道。
! “迷津”就是情欲的深渊。“木居士”“灰侍者”指木雕泥塑、心如死灰，只有断了情的人才渡得过去。
! 宝玉在迷津前喊的是“可卿救我”，可见他没有醒悟，越陷越深。
! 秦氏的小名就叫可卿。梦中的仙女和现实的秦氏，作者故意写得分不清。
