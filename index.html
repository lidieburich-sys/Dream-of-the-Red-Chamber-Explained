# 一、黛玉远望怡红院
话说宝钗分明听见林黛玉刻薄他，因记挂著母亲哥哥，并不回头，一径去了。|宝钗明明听见林黛玉在挖苦她，因为惦记着母亲和哥哥，并不回头，径直走了。
这里林黛玉还自立于花阴之下，远远的却向怡红院内望著，|林黛玉还站在花荫下，远远地望着怡红院，
只见李宫裁，迎春，探春，惜春并各项人等都向怡红院内去过之后，一起一起的散尽了，|只见李纨、迎春、探春、惜春和各色人等都到怡红院去过之后，一拨一拨都散了，
只不见凤姐儿来，心里自己盘算道：“如何他不来瞧宝玉？|只是不见凤姐来，心里自己盘算：“她为什么不来看宝玉？
便是有事缠住了，他必定也是要来打个花胡哨，讨老太太和太太的好儿才是。|就算有事缠住了，她也一定要来做做样子，讨老太太和太太的欢心才是。
今儿这早晚不来，必有原故。”|今天这时候还不来，一定有缘故。”
一面猜疑，一面抬头再看时，只见花花簇簇一群人又向怡红院内来了。|一边猜疑，一边抬头再看，只见花花绿绿一群人又往怡红院来了。
定眼看时，只见贾母搭著凤姐儿的手，后头邢夫人王夫人跟著周姨娘并丫鬟媳妇等人都进院去了。|定睛一看，只见贾母扶着凤姐的手，后面邢夫人、王夫人带着周姨娘和丫鬟媳妇们都进院子去了。
黛玉看了不觉点头，想起有父母的人的好处来，早又泪珠满面。|黛玉看了不由得点头，想起有父母的人的好处来，早又泪流满面。
少顷，只见宝钗薛姨妈等也进入去了。|一会儿，只见宝钗、薛姨妈等人也进去了。
! 宝钗不回头，是她的修养，也是她的不屑。
! 黛玉看凤姐最透：凤姐不是不来，是要陪着贾母一起来，好讨老太太的欢心。
! 宝玉有祖母和母亲这么多人疼，黛玉只能远远看着，想起自己没有父母。这一回从黛玉的眼泪开始。

# 二、紫鹃催药
忽见紫鹃从背后走来，说道：“姑娘吃药去罢，开水又冷了。”|忽然紫鹃从背后走来，说：“姑娘回去吃药吧，开水又凉了。”
黛玉道：“你到底要怎么样？只是催，我吃不吃，管你什么相干！”|黛玉说：“你到底要怎么样？只管催，我吃不吃，跟你有什么相干！”
紫鹃笑道：“咳嗽的才好了些，又不吃药了。|紫鹃笑道：“咳嗽刚好了些，又不吃药了。
如今虽然是五月里，天气热，到底也该还小心些。|现在虽然是五月，天气热，到底也该小心些。
大清早起，在这个潮地方站了半日，也该回去歇息歇息了。”|一大早在这个潮湿的地方站了半天，也该回去歇歇了。”
一句话提醒了黛玉，方觉得有点腿酸，呆了半日，方慢慢的扶著紫鹃，回潇湘馆来。|一句话提醒了黛玉，才觉得腿有点酸，呆了半天，才慢慢扶着紫鹃回潇湘馆去。
! 黛玉在潮地上站了半天，就为了远远看宝玉那边。紫鹃句句是心疼，黛玉却冲她发脾气。

# 三、苍苔与《西厢记》
一进院门，只见满地下竹影参差，苔痕浓淡，|一进院门，只见满地竹影参差不齐，青苔深深浅浅，
不觉又想起《西厢记》中所云“幽僻处可有人行，点苍苔白露泠泠”二句来，|不由得又想起《西厢记》里那两句“幽僻处可有人行，点苍苔白露泠泠”，
因暗暗的叹道：“双文，双文，诚为命薄人矣。|就暗暗叹道：“双文啊双文，你真是个命薄的人。
然你虽命薄，尚有孀母弱弟，今日林黛玉之命薄，一并连孀母弱弟俱无。|可你虽然命薄，还有寡母和弟弟，今天我林黛玉的命薄，连寡母弱弟都没有。
古人云‘佳人命薄’，然我又非佳人，何命薄胜于双文哉！”|古人说‘佳人命薄’，可我又不是佳人，为什么命比双文还薄呢！”
! 双文是崔莺莺，《西厢记》的女主角。“幽僻处可有人行”，写的是幽静无人、只有青苔和露水，正是潇湘馆的样子。
! 黛玉自比崔莺莺，又觉得自己比崔莺莺还苦：莺莺还有母亲做主，黛玉却什么人都没有。这正应了第三十二回“无人为我主张”。

# 四、鹦哥念《葬花吟》
一面想，一面只管走，不防廊上的鹦哥见林黛玉来了，嘎的一声扑了下来，倒吓了一跳，|一边想，一边只管走，没防备廊上的鹦鹉见林黛玉来了，嘎的一声扑下来，倒吓了她一跳，
因说道：“作死的，又扇了我一头灰。”|就说：“找死的，又扇了我一头灰。”
那鹦哥仍飞上架去，便叫：“雪雁，快掀帘子，姑娘来了。”|那鹦鹉又飞回架子上，叫道：“雪雁，快掀帘子，姑娘来了。”
黛玉便止住步，以手扣架道：“添了食水不曾？”。|黛玉就停下脚步，用手敲敲架子说：“添了食和水没有？”
那鹦哥便长叹一声，竟大似林黛玉素日吁嗟音韵，接著念道：|那鹦鹉竟长叹一声，很像林黛玉平时叹气的声调，接着念道：
“侬今葬花人笑痴，他年葬侬知是谁？|“侬今葬花人笑痴，他年葬侬知是谁？
试看春尽花渐落，便是红颜老死时。|试看春尽花渐落，便是红颜老死时。
一朝春尽红颜老，花落人亡两不知！”|一朝春尽红颜老，花落人亡两不知！”
黛玉紫鹃听了都笑起来。|黛玉和紫鹃听了都笑起来。
紫鹃笑道：“这都是素日姑娘念的，难为他怎么记了。”|紫鹃笑道：“这都是姑娘平时念的，难为它怎么记住的。”
黛玉便令将架摘下来，另挂在月洞窗外的钩上，于是进了屋子，在月洞窗内坐了。|黛玉就叫人把鸟架摘下来，另挂在月洞窗外的钩子上，然后进屋，在月洞窗里坐下。
吃毕药，只见窗外竹影映入纱来，满屋内阴阴翠润，几簟生凉。|吃完药，只见窗外的竹影映进纱窗，满屋子绿荫荫的，桌上竹席都透着凉意。
黛玉无可释闷，便隔著纱窗调逗鹦哥作戏，又将素日所喜的诗词也教与他念。|黛玉没法解闷，就隔着纱窗逗鹦鹉玩，又把平时喜欢的诗词教它念。
这且不在话下。|这些不必细说。
! 鹦鹉学的是黛玉的叹气声，念的是《葬花吟》。黛玉平时叹得太多、念得太多，连鹦鹉都学会了。
! “花落人亡两不知”从鹦鹉嘴里念出来，黛玉和紫鹃都笑了。听着好笑，其实是这一回里最凄凉的地方。
! 潇湘馆里只有竹影、鹦哥、药，和黛玉一个人。和怡红院那边的热闹比起来，冷清得很。

# 五、薛蟠赔罪
且说薛宝钗来至家中，只见母亲正自梳头呢。|再说薛宝钗回到家里，只见母亲正在梳头。
一见他来了，便说道：“你大清早起跑来作什么？”|一见她来了，就说：“你一大早跑来做什么？”
宝钗道：“我瞧瞧妈身上好不好。昨儿我去了，不知他可又过来闹了没有？”|宝钗说：“我来看看妈身体好不好。昨天我走了，不知道他又过来闹了没有？”
一面说，一面在他母亲身旁坐了，由不得哭将起来。|一边说，一边在母亲身边坐下，不由得哭了起来。
薛姨妈见他一哭，自己撑不住，也就哭了一场，|薛姨妈见她一哭，自己也忍不住，也哭了一场，
一面又劝他：“我的儿，你别委曲了，你等我处分他。你要有个好歹，我指望那一个来！”|一边又劝她：“我的儿，你别委屈了，等我收拾他。你要是有个好歹，我还指望谁呢！”
薛蟠在外边听见，连忙跑了过来，对著宝钗，左一个揖，右一个揖，|薛蟠在外面听见了，连忙跑过来，对着宝钗左一个揖、右一个揖，
只说：“好妹妹，恕我这一次罢！|只说：“好妹妹，饶我这一次吧！
原是我昨儿吃了酒，回来的晚了，路上撞客著了，来家未醒，不知胡说了什么，连自己也不知道，怨不得你生气。”|原是我昨天喝了酒，回来晚了，路上撞了邪，回家还没醒，不知道胡说了什么，连自己都不知道，怪不得你生气。”
宝钗原是掩面哭的，听如此说，由不得又好笑了，遂抬头向地下啐了一口，说道：|宝钗本来捂着脸哭，听他这么说，不由得又好笑起来，就抬头朝地上啐了一口，说：
“你不用做这些像生儿。我知道你的心里多嫌我们娘儿两个，是要变著法儿叫我们离了你，你就心净了。”|“你不用装模作样。我知道你心里嫌弃我们娘儿俩，是想变着法子叫我们离开你，你就清净了。”
薛蟠听说，连忙笑道：“妹妹这话从那里说起来的，这样我连立足之地都没了。|薛蟠听了，连忙笑道：“妹妹这话从哪里说起，这样我连站的地方都没有了。
妹妹从来不是这样多心说歪话的人。”|妹妹从来不是这样多心、说歪话的人。”
薛姨妈忙又接著道：“你只会听见你妹妹的歪话，难道昨儿晚上你说的那话就应该的不成？当真是你发昏了！”|薛姨妈连忙接着说：“你只听见你妹妹说歪话，难道昨天晚上你说的那话就该说吗？真是你发昏了！”
! 薛蟠说自己是“撞客著了”，就是撞了邪，把醉话推给鬼神。他鲁莽，却疼妹妹，认错也认得痛快。
! 宝钗一边哭一边“由不得又好笑”。哥哥再混账，到底是亲哥哥，气也气不长。

# 六、薛蟠流泪
薛蟠道：“妈也不必生气，妹妹也不用烦恼，从今以后我再不同他们一处吃酒闲逛如何？”|薛蟠说：“妈也不必生气，妹妹也不用烦恼，从今以后我再也不跟他们一起喝酒闲逛了，怎么样？”
宝钗笑道：“这不明白过来了！”|宝钗笑道：“这不就明白过来了！”
薛姨妈道：“你要有这个横劲，那龙也下蛋了。”|薛姨妈说：“你要真有这股狠劲，那龙也会下蛋了。”
薛蟠道：“我若再和他们一处逛，妹妹听见了只管啐我，再叫我畜生，不是人，如何？|薛蟠说：“我要是再跟他们一起逛，妹妹听见了只管啐我，再骂我畜生、不是人，怎么样？
何苦来，为我一个人，娘儿两个天天操心！|何苦呢，为了我一个人，你们娘儿俩天天操心！
妈为我生气还有可恕，若只管叫妹妹为我操心，我更不是人了。|妈为我生气还情有可原，要是总叫妹妹为我操心，我就更不是人了。
如今父亲没了，我不能多孝顺妈多疼妹妹，反教娘生气妹妹烦恼，真连个畜生也不如了。”|如今父亲去世了，我不能多孝顺妈、多疼妹妹，反倒叫娘生气、妹妹烦恼，真是连畜生都不如了。”
口里说著，眼睛里禁不起也滚下泪来。|嘴里说着，眼睛里也忍不住滚下泪来。
薛姨妈本不哭了，听他一说又勾起伤心来。|薛姨妈本来不哭了，听他这么一说，又勾起了伤心。
宝钗勉强笑道：“你闹够了，这会子又招著妈哭起来了。”|宝钗勉强笑道：“你闹够了，这会儿又惹得妈哭起来了。”
薛蟠听说，忙收了泪，笑道：“我何曾招妈哭来！罢，罢，罢，丢下这个别提了。叫香菱来倒茶妹妹吃。”|薛蟠听了，连忙收了泪，笑道：“我什么时候惹妈哭了！算了算了，丢开这个别提了。叫香菱来给妹妹倒茶。”
! “那龙也下蛋了”，薛姨妈最了解儿子，知道他的保证靠不住。
! 薛蟠想起去世的父亲，竟流了泪。这个呆霸王也有真心，作者写他从不一味丑化。

# 七、薛蟠要给妹妹炸项圈
宝钗道：“我也不吃茶，等妈洗了手，我们就过去了。”|宝钗说：“我也不喝茶，等妈洗了手，我们就过去了。”
薛蟠道：“妹妹的项圈我瞧瞧，只怕该炸一炸去了。”|薛蟠说：“妹妹的项圈我看看，只怕该拿去炸一炸了。”
宝钗道：“黄澄澄的又炸他作什么？”|宝钗说：“黄澄澄的，又炸它做什么？”
薛蟠又道：“妹妹如今也该添补些衣裳了。要什么颜色花样，告诉我。”|薛蟠又说：“妹妹如今也该添些衣裳了。要什么颜色花样，告诉我。”
宝钗道：“连那些衣服我还没穿遍了，又做什么？”|宝钗说：“那些衣服我还没穿遍呢，又做什么？”
一时薛姨妈换了衣裳，拉著宝钗进去，薛蟠方出去了。|一会儿薛姨妈换好衣服，拉着宝钗进园去了，薛蟠才出去了。
! “炸”是把金器重新淬洗，让它发亮。项圈上挂的就是金锁，薛蟠昨天说“金要拣有玉的”，今天就要给妹妹炸项圈，笨拙地讨好，又碰到了妹妹的痛处。
! 宝钗一律推辞：项圈不炸，衣服不添。她一向不爱打扮，下面第四十回贾母去她屋里，“雪洞一般”。

# 八、宝玉想吃荷叶汤
这里薛姨妈和宝钗进园来瞧宝玉，到了怡红院中，只见抱厦里外回廊上许多丫鬟老婆站著，便知贾母等都在这里。|薛姨妈和宝钗进园来看宝玉，到了怡红院，只见抱厦里外和回廊上站着许多丫鬟婆子，就知道贾母等人都在这里。
母女两个进来，大家见过了，只见宝玉躺在榻上。|母女两个进来，大家见过了，只见宝玉躺在榻上。
薛姨妈问他可好些。|薛姨妈问他好些了没有。
宝玉忙欲欠身，口里答应著：“好些。”|宝玉连忙想欠身起来，嘴里答应着：“好些了。”
又说：“只管惊动姨娘姐姐，我当不起。”|又说：“总是惊动姨妈和姐姐，我当不起。”
薛姨妈忙扶他睡下，又问他：“想要什么，只管告诉我。”|薛姨妈连忙扶他躺下，又问他：“想要什么，只管告诉我。”
宝玉笑道：“我想起来，自然和姨娘要去的。”|宝玉笑道：“我想起来了，自然会跟姨妈要。”
王夫人又问：“你想什么吃？回来好给你送来的。”|王夫人又问：“你想吃什么？回头好给你送来。”
宝玉笑道：“也倒不想什么吃，倒是那一回做的那小荷叶儿小莲蓬儿的汤还好些。”|宝玉笑道：“也不想吃什么，倒是上回做的那种小荷叶小莲蓬的汤还好些。”
凤姐一旁笑道：“听听，口味不算高贵，只是太磨牙了。巴巴的想这个吃了。”|凤姐在一旁笑道：“听听，口味倒不算金贵，只是太麻烦了。偏偏想吃这个。”
贾母便一叠声的叫人做去。|贾母就一连声地叫人去做。
凤姐儿笑道：“老祖宗别急，等我想一想这模子谁收著呢。”|凤姐笑道：“老祖宗别急，等我想想这模子是谁收着呢。”
因回头吩咐个婆子去问管厨房的要去。|就回头吩咐一个婆子去问管厨房的要。
那婆子去了半天，来回说：“管厨房的说，四副汤模子都交上来了。”|那婆子去了半天，回来说：“管厨房的说，四副汤模子都交上来了。”
凤姐儿听说，想了一想，道：“我记得交给谁了，多半在茶房里。”|凤姐听了，想了想说：“我记得交给谁了，多半在茶房里。”
一面又遣人去问管茶房的，也不曾收。|一边又派人去问管茶房的，也没收着。
次后还是管金银器皿的送了来。|后来还是管金银器皿的送来了。
! 一碗汤，宝玉随口一提，贾母一叠声叫做，满府里为找一副模子跑了三处。宝玉挨了一顿打，成了全家的心头肉。

# 九、银模子与荷叶汤
薛姨妈先接过来瞧时，原来是个小匣子，里面装著四副银模子，都有一尺多长，一寸见方，|薛姨妈先接过来一看，原来是个小匣子，里面装着四副银模子，都有一尺多长、一寸见方，
上面凿著有豆子大小，也有菊花的，也有梅花的，也有莲蓬的，也有菱角的，共有三四十样，打的十分精巧。|上面凿着豆子大小的花样，有菊花的，有梅花的，有莲蓬的，有菱角的，一共三四十种，打得十分精巧。
因笑向贾母王夫人道：“你们府上也都想绝了，吃碗汤还有这些样子。|就笑着对贾母、王夫人说：“你们府上也真是想尽了法子，喝碗汤还有这么多花样。
若不说出来，我见这个也不认得这是作什么用的。”|要是不说出来，我看见这个也认不出是做什么用的。”
凤姐儿也不等人说话，便笑道：“姑妈那里晓得，这是旧年备膳，他们想的法儿。|凤姐也不等别人说话，就笑道：“姑妈哪里知道，这是那年预备膳食时，他们想出来的法子。
不知弄些什么面印出来，借点新荷叶的清香，全仗著好汤，究竟没意思，谁家常吃他了。|不知用什么面印出这些花样来，借一点新荷叶的清香，全靠好汤来调味，说到底也没什么意思，谁家平常吃它。
那一回呈样的作了一回，他今日怎么想起来了。”|那一回拿来试做过一次，他今天怎么想起来了。”
说著接了过来，递与个妇人，吩咐厨房里立刻拿几只鸡，另外添了东西，做出十来碗来。|说着接过来，递给一个媳妇，吩咐厨房立刻拿几只鸡，再添些东西，做出十来碗来。
王夫人道：“要这些做什么？”|王夫人说：“要这么多做什么？”
凤姐儿笑道：“有个原故：这一宗东西家常不大作，今儿宝兄弟提起来了，|凤姐笑道：“有个缘故：这样东西平时不怎么做，今天宝兄弟提起来了，
单做给他吃，老太太，姑妈，太太都不吃，似乎不大好。|单做给他吃，老太太、姑妈、太太都不吃，似乎不太好。
不如借势儿弄些大家吃，托赖连我也上个俊儿。”|不如趁机多做些大家吃，我也沾光尝个新鲜。”
贾母听了，笑道：“猴儿，把你乖的！拿著官中的钱你做人。”|贾母听了，笑道：“猴儿，看把你机灵的！拿公家的钱你来做人情。”
说的大家笑了。|说得大家都笑了。
凤姐也忙笑道：“这不相干。这个小东道我还孝敬的起。”|凤姐也连忙笑道：“这不要紧。这个小东道我还请得起。”
便回头吩咐妇人，”说给厨房里，只管好生添补著做了，在我的帐上来领银子。”|就回头吩咐那媳妇：“告诉厨房，只管好好地添料做，到我的账上来领银子。”
妇人答应著去了。|那媳妇答应着去了。
! 一碗汤要用几只鸡来吊，这是贾府的奢华。刘姥姥第四十一回吃茄鲞，也是这样，吃一道菜要十来只鸡配。
! 贾母说凤姐“拿著官中的钱你做人”，一句玩笑说中了凤姐的为人：她最会借公家的东西讨好贾母。

# 十、贾母夸宝钗
宝钗一旁笑道：“我来了这么几年，留神看起来，凤丫头凭他怎么巧，再巧不过老太太去。”|宝钗在一旁笑道：“我来了这么几年，留心看来，凤丫头不管怎么机灵，也机灵不过老太太。”
贾母听说，便答道：“我如今老了，那里还巧什么。|贾母听了，就回答：“我如今老了，哪里还机灵什么。
当日我象凤哥儿这么大年纪，比他还来得呢。|当年我像凤丫头这么大的时候，比她还能干呢。
他如今虽说不如我们，也就算好了，比你姨娘强远了。|她现在虽说比不上我们那时候，也算好的了，比你姨妈强多了。
你姨娘可怜见的，不大说话，和木头似的，在公婆跟前就不大显好。|你姨妈可怜见的，不大说话，像木头似的，在公婆面前就不太显得好。
凤儿嘴乖，怎么怨得人疼他。”|凤丫头嘴甜，怎么能怪人疼她。”
宝玉笑道：“若这么说，不大说话的就不疼了？”|宝玉笑道：“这么说，不大说话的就不疼了？”
贾母道：“不大说话的又有不大说话的可疼之处，嘴乖的也有一宗可嫌的，倒不如不说话的好。”|贾母说：“不大说话的也有不大说话的可疼之处，嘴甜的也有一样讨嫌的地方，倒不如不说话的好。”
宝玉笑道：“这就是了。我说大嫂子倒不大说话呢，老太太也是和凤姐姐的一样看待。|宝玉笑道：“这就对了。我说大嫂子倒不大说话呢，老太太也和凤姐姐一样看待。
若是单是会说话的可疼，这些姊妹里头也只是凤姐姐和林妹妹可疼了。”|要是只有会说话的才可疼，那这些姐妹里头就只有凤姐姐和林妹妹可疼了。”
贾母道：“提起姊妹，不是我当著姨太太的面奉承，千真万真，从我们家四个女孩儿算起，全不如宝丫头。”|贾母说：“说起姐妹们，不是我当着姨太太的面奉承，千真万确，从我们家四个女孩子算起，都比不上宝丫头。”
薛姨妈听说，忙笑道：“这话是老太太说偏了。”|薛姨妈听了，连忙笑道：“老太太这话说偏了。”
王夫人忙又笑道：“老太太时常背地里和我说宝丫头好，这倒不是假话。”|王夫人又连忙笑道：“老太太常常背地里跟我说宝丫头好，这倒不是假话。”
! 宝钗夸贾母，贾母就夸宝钗。宝钗的一句奉承，换来的是贾母当众说“四个女孩儿全不如宝丫头”。
! “我们家四个女孩儿”是元春、迎春、探春、惜春。黛玉是外孙女，不在这四个里，可贾母这话里也没提黛玉。
! 宝玉本想引贾母夸黛玉，“会说话的可疼”，凤姐和林妹妹。贾母却转头夸了宝钗。这是全书一个重要信号：贾母的心思在变。

# 十一、凤姐“人肉酸”
宝玉勾著贾母原为赞林黛玉的，不想反赞起宝钗来，倒也意出望外，便看著宝钗一笑。|宝玉引着贾母本来是想让她夸林黛玉的，没想到反倒夸起宝钗来，倒也出乎意料，就看着宝钗一笑。
宝钗早扭过头去和袭人说话去了。|宝钗早扭过头去和袭人说话了。
忽有人来请吃饭，贾母方立起身来，命宝玉好生养著，又把丫头们嘱咐了一回，|忽然有人来请吃饭，贾母才站起身来，叫宝玉好好养着，又嘱咐了丫头们一番，
方扶著凤姐儿，让著薛姨妈，大家出房去了。|才扶着凤姐，让着薛姨妈，大家出屋去了。
因问汤好了不曾，又问薛姨妈等：“想什么吃，只管告诉我，我有本事叫凤丫头弄了来咱们吃。”|又问汤做好了没有，又问薛姨妈等人：“想吃什么，只管告诉我，我有本事叫凤丫头弄来给咱们吃。”
薛姨妈笑道：“老太太也会怄他的。时常他弄了东西孝敬，究竟又吃不了多少。”|薛姨妈笑道：“老太太也会逗她。她常常弄了东西来孝敬，到底又吃不了多少。”
凤姐儿笑道：“姑妈倒别这样说。|凤姐笑道：“姑妈可别这么说。
我们老祖宗只是嫌人肉酸，若不嫌人肉酸，早已把我还吃了呢。”|我们老祖宗只是嫌人肉酸，要是不嫌人肉酸，早就把我也吃了。”
一句话没说了，引的贾母众人都哈哈的笑起来。|一句话还没说完，引得贾母和众人都哈哈大笑起来。
宝玉在房里也撑不住笑了。|宝玉在屋里也忍不住笑了。
袭人笑道：“真真的二奶奶的这张嘴怕死人！”|袭人笑道：“二奶奶这张嘴真是怕死人了！”
! 宝钗被当众夸奖，立刻扭头去和袭人说话，不接这个话茬。她处处得体，连受夸也不露喜色。
! 凤姐说贾母“嫌人肉酸”，粗话说得巧，又亲热又滑稽。她讨贾母欢心的本事，没人比得上。

# 十二、请莺儿打络子
宝玉伸手拉著袭人笑道：“你站了这半日，可乏了？”|宝玉伸手拉着袭人笑道：“你站了这么半天，累了吧？”
一面说，一面拉他身旁坐了。|一边说，一边拉她在身边坐下。
袭人笑道：“可是又忘了。趁宝姑娘在院子里，你和他说，烦他莺儿来打上几根络子。”|袭人笑道：“又差点忘了。趁宝姑娘在院子里，你跟她说，请她叫莺儿来打几根络子。”
宝玉笑道：“亏你提起来。”|宝玉笑道：“亏你提起来。”
说著，便仰头向窗外道：“宝姐姐，吃过饭叫莺儿来，烦他打几根络子，可得闲儿？”|说着，就仰头朝窗外说：“宝姐姐，吃过饭叫莺儿来，请她打几根络子，有空吗？”
宝钗听见，回头道：“怎么不得闲儿，一会叫他来就是了。”|宝钗听见，回头说：“怎么会没空，一会儿叫她来就是了。”
贾母等尚未听真，都止步问宝钗。|贾母等人还没听清，都停下来问宝钗。
宝钗说明了，大家方明白。|宝钗说明了，大家才明白。
贾母又说道：“好孩子，叫他来替你兄弟作几根。你要无人使唤，我那里闲著的丫头多呢，你喜欢谁，只管叫了来使唤。”|贾母又说：“好孩子，叫她来替你兄弟做几根。你要是没人使唤，我那里闲着的丫头多着呢，你喜欢谁，只管叫来使唤。”
薛姨妈宝钗等都笑道：“只管叫他来作就是了，有什么使唤的去处。他天天也是闲著淘气。”|薛姨妈、宝钗等人都笑道：“只管叫她来做就是了，又没什么要使唤她的。她天天也是闲着淘气。”
! 络子是用丝线编的网套，可以套扇子、香坠、汗巾，也可以套玉。上一回黛玉剪了玉上的穗子，这一回宝钗的丫头来给宝玉打络子。
! 贾母要把自己的丫头给宝钗用，对宝钗的疼爱又进了一步。

# 十三、贾母在王夫人处用饭
大家说著，往前迈步正走，忽见史湘云，平儿，香菱等在山石边掐凤仙花呢，见了他们走来，都迎上来了。|大家说着往前走，忽然看见史湘云、平儿、香菱等人在山石边掐凤仙花，见他们走来，都迎了上来。
少顷至园外，王夫人恐贾母乏了，便欲让至上房内坐。|一会儿出了园子，王夫人怕贾母累了，就想请她到上房坐。
贾母也觉腿酸，便点头依允。|贾母也觉得腿酸，就点头答应了。
王夫人便令丫头忙先去铺设坐位。|王夫人就叫丫头赶紧先去铺好座位。
那时赵姨娘推病，只有周姨娘与众婆娘丫头们忙著打帘子，立靠背，铺褥子。|那时赵姨娘推说有病，只有周姨娘和婆子丫头们忙着掀帘子、放靠背、铺褥子。
贾母扶著凤姐儿进来，与薛姨妈分宾主坐了。|贾母扶着凤姐进来，和薛姨妈分宾主坐下。
薛宝钗史湘云坐在下面。|薛宝钗、史湘云坐在下首。
王夫人亲捧了茶奉与贾母，李宫裁奉与薛姨妈。|王夫人亲自捧茶给贾母，李纨捧茶给薛姨妈。
贾母向王夫人道：“让他们小妯娌伏侍，你在那里坐了，好说话儿。”|贾母对王夫人说：“让她们小妯娌伺候，你在那边坐下，好说话。”
王夫人方向一张小杌子上坐下，便吩咐凤姐儿道：“老太太的饭在这里放，添了东西来。”|王夫人才在一张小凳子上坐下，就吩咐凤姐：“老太太的饭就在这里摆，再添些菜来。”
凤姐儿答应出去，便令人去贾母那边告诉，那边的婆娘忙往外传了，丫头们忙都赶过来。|凤姐答应着出去，叫人到贾母那边去说，那边的婆子赶紧往外传话，丫头们都赶了过来。
王夫人便令“请姑娘们去”。|王夫人就吩咐“去请姑娘们来”。
请了半天，只有探春惜春两个来了，迎春身上不耐烦，不吃饭，|请了半天，只有探春、惜春两个来了，迎春身体不舒服，不吃饭，
林黛玉自不消说，平素十顿饭只好吃五顿，众人也不著意了。|林黛玉就不用说了，平时十顿饭只能吃五顿，大家也不在意了。
! 赵姨娘“推病”不来，宝玉挨打是她和贾环挑起来的，这时她自然心虚，不敢露面。
! 宝钗、湘云陪着贾母吃饭，黛玉却“十顿饭只好吃五顿”，大家都“不著意了”。黛玉总是不在场，在长辈面前就越来越少了分量。

# 十四、凤姐布菜
少顷饭至，众人调放了桌子。|一会儿饭来了，大家摆好了桌子。
凤姐儿用手巾裹著一把牙箸站在地下，笑道：“老祖宗和姑妈不用让，还听我说就是了。”|凤姐用手巾裹着一把象牙筷子站在地上，笑道：“老祖宗和姑妈不用让来让去，听我安排就是了。”
贾母笑向薛姨妈道：“我们就是这样。”|贾母笑着对薛姨妈说：“我们就是这样。”
薛姨妈笑著应了。|薛姨妈笑着答应了。
于是凤姐放了四双：上面两双是贾母薛姨妈，两边是薛宝钗史湘云的。|于是凤姐摆了四双筷子：上首两双是贾母、薛姨妈的，两边是薛宝钗、史湘云的。
王夫人李宫裁等都站在地下看著放菜。|王夫人、李纨等人都站在地上看着上菜。
凤姐先忙著要干净家伙来，替宝玉拣菜。|凤姐先忙着要干净的碗碟来，替宝玉挑菜。
! 只有四个人坐下吃饭，王夫人、李纨、凤姐都站着伺候。媳妇在婆婆面前不能坐，这是规矩。
! 凤姐忙了一圈，最先想到的还是给宝玉拣菜。她讨好贾母，就先讨好宝玉。

# 十五、玉钏送汤
少顷，荷叶汤来，贾母看过了。|一会儿，荷叶汤送来了，贾母看过了。
王夫人回头见玉钏儿在那边，便令玉钏与宝玉送去。|王夫人回头看见玉钏儿在那边，就叫玉钏给宝玉送去。
凤姐道：“他一个人拿不去。”|凤姐说：“她一个人拿不了。”
可巧莺儿和喜儿都来了。|正好莺儿和喜儿都来了。
宝钗知道他们已吃了饭，便向莺儿道：“宝兄弟正叫你去打络子，你们两个一同去罢。”|宝钗知道她们已经吃过饭了，就对莺儿说：“宝兄弟正叫你去打络子，你们两个一起去吧。”
莺儿答应，同著玉钏儿出来。|莺儿答应着，和玉钏儿一起出来。
莺儿道：“这么远，怪热的，怎么端了去？”|莺儿说：“这么远，又热得很，怎么端过去？”
玉钏笑道：“你放心，我自有道理。”|玉钏笑道：“你放心，我自有办法。”
说著，便令一个婆子来，将汤饭等物放在一个捧盒里，令他端了跟著，他两个却空著手走。|说着，就叫一个婆子来，把汤饭等东西放在一个捧盒里，叫她端着跟在后面，她们两个却空着手走。
一直到了怡红院门内，玉钏儿方接了过来，同莺儿进入宝玉房中。|一直到了怡红院门里，玉钏儿才接过来，和莺儿一起进了宝玉的房间。
! 王夫人偏偏叫玉钏去送汤。玉钏是金钏的亲妹妹，姐姐刚为宝玉死了，现在却要妹妹去伺候宝玉。回目“白玉钏亲尝莲叶羹”就从这里开始。
! 玉钏让婆子端着走，到了门口才自己接过来，做个样子。丫头也有丫头的体面。

# 十六、宝玉哄玉钏
袭人，麝月，秋纹三个人正和宝玉顽笑呢，见他两个来了，都忙起来，笑道：|袭人、麝月、秋纹三个人正和宝玉说笑，见她们两个来了，都连忙起身，笑道：
“你两个怎么来的这么碰巧，一齐来了。”|“你们两个怎么这么巧，一起来了。”
一面说，一面接了下来。|一边说，一边接了下来。
玉钏便向一张杌子上坐了，莺儿不敢坐下。|玉钏就在一张凳子上坐下了，莺儿不敢坐。
袭人便忙端了个脚踏来，莺儿还不敢坐。|袭人连忙端来一个脚踏，莺儿还是不敢坐。
宝玉见莺儿来了，却倒十分欢喜，忽见了玉钏儿，便想到他姐姐金钏儿身上，又是伤心，又是惭愧，|宝玉见莺儿来了，倒是十分高兴，忽然看见玉钏儿，就想到了她姐姐金钏儿，又伤心又惭愧，
便把莺儿丢下，且和玉钏儿说话。|就把莺儿丢在一边，先和玉钏儿说话。
袭人见把莺儿不理，恐莺儿没好意思的，又见莺儿不肯坐，便拉了莺儿出来，到那边房里去吃茶说话儿去了。|袭人见宝玉不理莺儿，怕莺儿不好意思，又见莺儿不肯坐，就拉着莺儿出来，到那边屋里喝茶说话去了。
这里麝月等预备了碗箸来伺候吃饭。|这边麝月等人预备了碗筷来伺候吃饭。
宝玉只是不吃，问玉钏儿道：“你母亲身子好？”|宝玉只是不吃，问玉钏儿：“你母亲身体好吗？”
玉钏儿满脸怒色，正眼也不看宝玉，半日，方说了一个“好”字。|玉钏儿满脸怒色，正眼也不看宝玉，过了半天，才说了一个“好”字。
宝玉便觉没趣，半日，只得又陪笑问道：“谁叫你给我送来的？”|宝玉就觉得没意思，过了半天，只好又赔笑问：“谁叫你给我送来的？”
玉钏儿道：“不过是奶奶太太们！”|玉钏儿说：“还不是奶奶太太们！”
宝玉见他还是这样哭丧，便知他是为金钏儿的原故，|宝玉见她还是这副哭丧脸，就知道她是为了金钏儿的缘故，
待要虚心下气磨转他，又见人多，不好下气的，|想低声下气地哄她回心转意，又见人多，不好放下架子，
因而变尽方法，将人都支出去，然后又陪笑问长问短。|就想尽办法把人都支出去，然后又赔着笑问长问短。
那玉钏儿先虽不悦，只管见宝玉一些性子没有，凭他怎么丧谤，他还是温存和气，自己倒不好意思的了，脸上方有三分喜色。|玉钏儿起初虽然不高兴，可见宝玉一点脾气都没有，不管她怎么冷言冷语，他还是温柔和气，自己倒不好意思了，脸上才有了三分笑意。
! 宝玉问“你母亲身子好”，不敢提金钏，只能问她母亲。玉钏只答一个“好”字，满腔怨恨都在这一个字里。
! 莺儿是宝钗的丫头，宝玉一见玉钏就把莺儿丢下了。他心里对金钏的愧疚，比什么都重。

# 十七、玉钏亲尝莲叶羹
宝玉便笑求他：“好姐姐，你把那汤拿了来我尝尝。”|宝玉就笑着求她：“好姐姐，你把那汤拿来给我尝尝。”
玉钏儿道：“我从不会喂人东西，等他们来了再吃。”|玉钏儿说：“我从来不会喂人吃东西，等她们来了再吃。”
宝玉笑道：“我不是要你喂我。我因为走不动，你递给我吃了，你好赶早儿回去交代了，你好吃饭的。|宝玉笑道：“我不是要你喂我。我因为走不动，你递给我吃了，你好早点回去交差，好去吃饭。
我只管耽误时候，你岂不饿坏了。你要懒待动，我少不了忍了疼下去取来。”|我要是只管耽误时间，你岂不饿坏了。你要是懒得动，我只好忍着疼下去拿。”
说著便要下床来，扎挣起来，禁不住嗳哟之声。|说着就要下床，挣扎着起来，忍不住“哎哟”出声。
玉钏儿见他这般，忍不住起身说道：“躺下罢！那世里造了来的业，这会子现世现报。教我那一个眼睛看的上！”|玉钏儿见他这样，忍不住起身说：“躺下吧！上辈子造的孽，这会儿现世现报。叫我哪只眼睛看得上！”
一面说，一面哧的一声又笑了，端过汤来。|一边说，一边扑哧一声又笑了，端过汤来。
宝玉笑道：“好姐姐，你要生气只管在这里生罢，见了老太太，太太可放和气些，若还这样，你就又捱骂了。”|宝玉笑道：“好姐姐，你要生气只管在这里生吧，见了老太太、太太可要和气些，要是还这样，你又要挨骂了。”
玉钏儿道：“吃罢，吃罢！不用和我甜嘴蜜舌的，我可不信这样话！”|玉钏儿说：“吃吧吃吧！不用跟我甜言蜜语的，我可不信这种话！”
说著，催宝玉喝了两口汤。|说着，催宝玉喝了两口汤。
宝玉故意说：“不好吃，不吃了。”|宝玉故意说：“不好喝，不喝了。”
玉钏儿道：“阿弥陀佛！这还不好吃，什么好吃。”|玉钏儿说：“阿弥陀佛！这还不好喝，什么好喝。”
宝玉道：“一点味儿也没有，你不信，尝一尝就知道了。”|宝玉说：“一点味道都没有，你不信，尝一尝就知道了。”
玉钏儿真就赌气尝了一尝。|玉钏儿真就赌气尝了一口。
宝玉笑道：“这可好吃了。”|宝玉笑道：“这下可好喝了。”
玉钏儿听说，方解过意来，原是宝玉哄他吃一口，|玉钏儿听了，才明白过来，原来宝玉是哄她喝一口，
便说道：“你既说不好吃，这会子说好吃也不给你吃了。”|就说：“你既然说不好喝，这会儿说好喝也不给你喝了。”
宝玉只管央求陪笑要吃，玉钏儿又不给他，一面又叫人打发吃饭。|宝玉只管赔笑央求要喝，玉钏儿又不给他，一边又叫人来伺候他吃饭。
! “现世现报”，玉钏说宝玉挨打是报应，她心里认定姐姐是宝玉害死的。
! 宝玉骗玉钏尝一口汤，是想让她也尝尝这金贵的东西。他用孩子气的法子，向一个死去丫头的妹妹赔罪。
! “白玉钏亲尝莲叶羹”，就是这一口。玉钏的气消了三分，宝玉的愧疚却永远消不了。

# 十八、傅家的婆子
丫头方进来时，忽有人来回话：“傅二爷家的两个嬷嬷来请安，来见二爷。”|丫头刚进来，忽然有人来回话：“傅二爷家的两个嬷嬷来请安，要见二爷。”
宝玉听说，便知是通判傅试家的嬷嬷来了。|宝玉听了，就知道是通判傅试家的嬷嬷来了。
那傅试原是贾政的门生，历年来都赖贾家的名势得意，贾政也著实看待，故与别个门生不同，他那里常遣人来走动。|那傅试原是贾政的门生，这些年来都靠贾家的名声势力得意，贾政也很看重他，所以和别的门生不一样，他那里常派人来走动。
宝玉素习最厌愚男蠢女的，今日却如何又令两个婆子过来？|宝玉平时最讨厌那些愚笨的男人女人，今天为什么又叫两个婆子进来呢？
其中原来有个原故：只因那宝玉闻得傅试有个妹子，名唤傅秋芳，也是个琼闺秀玉，|这里面原来有个缘故：只因宝玉听说傅试有个妹妹，名叫傅秋芳，也是个闺阁美人，
常闻人传说才貌俱全，虽自未亲睹，然遐思遥爱之心十分诚敬，|常听人说她才貌双全，虽然自己没亲眼见过，可心里远远地想念敬慕，十分真诚，
不命他们进来，恐薄了傅秋芳，因此连忙命让进来。|不叫她们进来，怕怠慢了傅秋芳，所以连忙叫人请进来。
那傅试原是暴发的，因傅秋芳有几分姿色，聪明过人，|那傅试原是个暴发户，因为傅秋芳有几分姿色，又聪明过人，
那傅试安心仗著妹妹要与豪门贵族结姻，不肯轻意许人，所以耽误到如今。|傅试一心想靠妹妹和豪门贵族结亲，不肯轻易许配人家，所以耽误到了现在。
目今傅秋芳年已二十三岁，尚未许人。|如今傅秋芳已经二十三岁了，还没许配人家。
争奈那些豪门贵族又嫌他穷酸，根基浅薄，不肯求配。|无奈那些豪门贵族又嫌他家寒酸，根基浅薄，不肯来求亲。
那傅试与贾家亲密，也自有一段心事。|那傅试和贾家亲近，也自有一段心事。
今日遣来的两个婆子偏生是极无知识的，闻得宝玉要见，进来只刚问了好，说了没两句话。|今天派来的两个婆子偏偏是极没见识的，听说宝玉要见，进来刚问了好，没说两句话。
! 宝玉从没见过傅秋芳，只听人说她好，就“遐思遥爱”。他对女孩子的怜爱，连没见过的都算上。
! 傅试想把妹妹嫁进豪门，“与贾家亲密，也自有一段心事”，暗指他想把妹妹嫁给宝玉。一个二十三岁还没出嫁的姑娘，是被哥哥的野心耽误了。

# 十九、宝玉烫手问玉钏
那玉钏见生人来，也不和宝玉厮闹了，手里端著汤只顾听话。|玉钏见来了生人，也不和宝玉闹了，手里端着汤只顾听他们说话。
宝玉又只顾和婆子说话，一面吃饭，一面伸手去要汤。|宝玉又只顾和婆子说话，一边吃饭，一边伸手去要汤。
两个人的眼睛都看著人，不想伸猛了手，便将碗碰翻，将汤泼了宝玉手上。|两人的眼睛都看着别人，没想到手伸猛了，把碗碰翻了，汤泼在了宝玉手上。
玉钏儿倒不曾烫著，唬了一跳，忙笑了，“这是怎么说！”|玉钏儿倒没烫着，吓了一跳，连忙笑道：“这是怎么说的！”
慌的丫头们忙上来接碗。|慌得丫头们连忙上来接碗。
宝玉自己烫了手倒不觉的，却只管问玉钏儿：“烫了那里了？疼不疼？”|宝玉自己烫了手倒没觉得，却只管问玉钏儿：“烫着哪里了？疼不疼？”
玉钏儿和众人都笑了。|玉钏儿和大家都笑了。
玉钏儿道：“你自己烫了，只管问我。”|玉钏儿说：“你自己烫着了，倒只管问我。”
宝玉听说，方觉自己烫了。|宝玉听了，才觉得自己烫着了。
众人上来连忙收拾。|大家连忙上来收拾。
宝玉也不吃饭了，洗手吃茶，又和那两个婆子说了两句话。|宝玉也不吃饭了，洗了手喝茶，又和那两个婆子说了两句话。
然后两个婆子告辞出去，晴雯等送至桥边方回。|然后两个婆子告辞出去，晴雯等人送到桥边才回来。
! 宝玉自己被烫了，第一句却问玉钏疼不疼。这就是宝玉：女孩子的疼，他比自己的疼看得更重。

# 二十、婆子笑宝玉呆
那两个婆子见没人了，一行走，一行谈论。|那两个婆子见没人了，一边走，一边议论。
这一个笑道：“怪道有人说他家宝玉是外像好里头糊涂，中看不中吃的，果然有些呆气。|这一个笑道：“怪不得有人说他家宝玉是外表好看、里头糊涂，中看不中用的，果然有些呆气。
他自己烫了手，倒问人疼不疼，这可不是个呆子？”|他自己烫了手，倒问别人疼不疼，这可不是个呆子吗？”
那一个又笑道：“我前一回来，听见他家里许多人抱怨，千真万真的有些呆气。|那一个又笑道：“我上回来，听见他家里许多人抱怨，千真万确是有些呆气。
大雨淋的水鸡似的，他反告诉别人‘下雨了，快避雨去罢。’你说可笑不可笑？|大雨淋得他像落汤鸡似的，他反倒告诉别人‘下雨了，快去躲雨吧’。你说可笑不可笑？
时常没人在跟前，就自哭自笑的，看见燕子，就和燕子说话，河里看见了鱼，就和鱼说话，|常常没人在跟前，他就自己哭自己笑的，看见燕子就跟燕子说话，看见河里的鱼就跟鱼说话，
见了星星月亮，不是长吁短叹，就是咕咕哝哝的。|见了星星月亮，不是长吁短叹，就是嘀嘀咕咕的。
且是连一点刚性也没有，连那些毛丫头的气都受的。|而且一点刚性都没有，连那些小丫头的气都受。
爱惜东西，连个线头儿都是好的，糟踏起来，那怕值千值万的都不管了。”|爱惜东西的时候，连个线头都当宝贝；糟蹋起来，哪怕值千值万的都不管了。”
两个人一面说，一面走出园来，辞别诸人回去，不在话下。|两个人一边说，一边走出园子，告别众人回去了。
! 婆子们笑的这些“呆气”，正是宝玉最可贵的地方：心疼别人胜过自己，和燕子鱼儿说话，受得了丫头的气。世俗人眼里的“呆”，就是宝玉的“痴”。
! “大雨淋的水鸡似的”，说的是第三十回宝玉看龄官画蔷那件事。
! “连个线头儿都是好的，糟踏起来值千值万的都不管”，说的是第三十一回撕扇子。婆子们看不懂，作者借她们的嘴，替宝玉画了一幅像。

# 二十一、莺儿论络子
如今且说袭人见人去了，便携了莺儿过来，问宝玉打什么络子。|再说袭人见客人走了，就带着莺儿过来，问宝玉要打什么络子。
宝玉笑向莺儿道：“才只顾说话，就忘了你。烦你来不为别的，却为替我打几根络子。”|宝玉笑着对莺儿说：“刚才只顾说话，就把你忘了。请你来不为别的，是想请你替我打几根络子。”
莺儿道：“装什么的络子？”|莺儿说：“装什么的络子？”
宝玉见问，便笑道：“不管装什么的，你都每样打几个罢。”|宝玉见她问，就笑道：“不管装什么的，你每样都打几个吧。”
莺儿拍手笑道：“这还了得！要这样，十年也打不完了。”|莺儿拍手笑道：“这还了得！要这样，十年也打不完。”
宝玉笑道：“好姐姐，你闲著也没事，都替我打了罢。”|宝玉笑道：“好姐姐，你闲着也没事，都替我打了吧。”
袭人笑道：“那里一时都打得完，如今先拣要紧的打两个罢。”|袭人笑道：“哪里一下子都打得完，现在先挑要紧的打两个吧。”
莺儿道：“什么要紧，不过是扇子，香坠儿，汗巾子。”|莺儿说：“什么要紧的，不过是扇子、香坠、汗巾。”
宝玉道：“汗巾子就好。”|宝玉说：“汗巾就好。”
莺儿道：“汗巾子是什么颜色的？”|莺儿说：“汗巾是什么颜色的？”
宝玉道：“大红的。”|宝玉说：“大红的。”
莺儿道：“大红的须是黑络子才好看的，或是石青的才压的住颜色。”|莺儿说：“大红的要配黑络子才好看，或是石青色的才压得住颜色。”
宝玉道：“松花色配什么？”|宝玉说：“松花绿配什么？”
莺儿道：“松花配桃红。”|莺儿说：“松花绿配桃红。”
宝玉笑道：“这才娇艳。再要雅淡之中带些娇艳。”|宝玉笑道：“这才娇艳。还要素雅里带点娇艳的。”
莺儿道：“葱绿柳黄是我最爱的。”|莺儿说：“葱绿配柳黄是我最喜欢的。”
宝玉道：“也罢了，也打一条桃红，再打一条葱绿。”|宝玉说：“也好，就打一条桃红的，再打一条葱绿的。”
莺儿道：“什么花样呢？”|莺儿说：“什么花样呢？”
宝玉道：“共有几样花样？”|宝玉说：“一共有几种花样？”
莺儿道：“一炷香，朝天凳，象眼块，方胜，连环，梅花，柳叶。”|莺儿说：“一炷香、朝天凳、象眼块、方胜、连环、梅花、柳叶。”
宝玉道：“前儿你替三姑娘打的那花样是什么？”|宝玉说：“前些天你给三姑娘打的那个花样是什么？”
莺儿道：“那是攒心梅花。”|莺儿说：“那是攒心梅花。”
宝玉道：“就是那样好。”|宝玉说：“就是那样的好。”
一面说，一面叫袭人刚拿了线来，窗外婆子说姑娘们的饭都有了。|一边说，一边叫袭人拿来线，窗外的婆子说姑娘们的饭都好了。
宝玉道：“你们吃饭去，快吃了来罢。”|宝玉说：“你们去吃饭吧，快吃完了来。”
袭人笑道：“有客在这里。我们怎么好意思去的！”|袭人笑道：“有客人在这里，我们怎么好意思去！”
莺儿一面理线，一面笑道：“这话又打那里说起，正经快吃了来罢。”|莺儿一边理线，一边笑道：“这话又从哪里说起，正经快去吃了来吧。”
袭人等听说方去了，只留下两个小丫头听呼唤。|袭人她们听了才去了，只留下两个小丫头听使唤。
! 莺儿说起颜色搭配头头是道，宝钗的丫头也这样有见识。
! 宝玉要的是大红汗巾的络子。那条大红汗巾，就是琪官送的那一条。
! 回目“黄金莺巧结梅花络”，莺儿本名金莺，她打的“攒心梅花”，花样里藏着“心”字。

# 二十二、莺儿说宝钗的好处
宝玉一面看莺儿打络子，一面说闲话，因问他“十几岁了？”|宝玉一边看莺儿打络子，一边说闲话，就问她：“十几岁了？”
莺儿手里打著，一面答话说：“十六岁了。”|莺儿手里打着，一边回答：“十六岁了。”
宝玉道：“你本姓什么？”|宝玉说：“你本姓什么？”
莺儿道：“姓黄。”|莺儿说：“姓黄。”
宝玉笑道：“这个名姓倒对了，果然是个黄莺儿。”|宝玉笑道：“这个名字倒是对上了，果然是个黄莺儿。”
莺儿笑道：“我的名字本来是两个字，叫作金莺。姑娘嫌拗口，就单叫莺儿，如今就叫开了。”|莺儿笑道：“我的名字本来是两个字，叫金莺。姑娘嫌拗口，就只叫莺儿，现在就这么叫开了。”
宝玉道：“宝姐姐也算疼你了。明儿宝姐姐出阁，少不得是你跟去了。”|宝玉说：“宝姐姐也算疼你了。将来宝姐姐出嫁，少不得是你跟着去了。”
莺儿抿嘴一笑。|莺儿抿嘴一笑。
宝玉笑道：“我常常和袭人说，明儿不知那一个有福的消受你们主子奴才两个呢。”|宝玉笑道：“我常跟袭人说，将来不知道哪个有福气的人能得到你们主仆两个呢。”
莺儿笑道：“你还不知道我们姑娘有几样世人都没有的好处呢，模样儿还在次。”|莺儿笑道：“你还不知道我们姑娘有几样世上人都没有的好处呢，模样还在其次。”
宝玉见莺儿娇憨婉转，语笑如痴，早不胜其情了，那更提起宝钗来！|宝玉见莺儿娇憨柔婉，说笑时一副痴痴的样子，早已情不自禁了，何况又提起了宝钗！
便问他道：“好处在那里？好姐姐，细细告诉我听。”|就问她：“好处在哪里？好姐姐，仔细告诉我听。”
莺儿笑道：“我告诉你，你可不许又告诉他去。”|莺儿笑道：“我告诉你，你可不许又去告诉她。”
宝玉笑道：“这个自然的。”|宝玉笑道：“这是自然。”
! 莺儿本名“金莺”，名字里也有“金”。第八回宝玉看宝钗的金锁，就是莺儿说出“是个癞头和尚送的，说必须錾在金器上”，她最早透露了“金玉”之说。
! 宝玉说“不知那一个有福的消受你们主子奴才两个”，那个“有福的”后来正是他自己。陪嫁丫头将来也是姑爷屋里的人，所以莺儿只“抿嘴一笑”。

# 二十三、宝钗出主意络玉
正说著，只听外头说道：“怎么这样静悄悄的！”|正说着，只听外面有人说：“怎么这么静悄悄的！”
二人回头看时，不是别人，正是宝钗来了。|两人回头一看，不是别人，正是宝钗来了。
宝玉忙让坐。|宝玉连忙让座。
宝钗坐了，因问莺儿“打什么呢？”|宝钗坐下，就问莺儿：“打什么呢？”
一面问，一面向他手里去瞧，才打了半截。|一边问，一边往她手里看，才打了一半。
宝钗笑道：“这有什么趣儿，倒不如打个络子把玉络上呢。”|宝钗笑道：“这有什么意思，倒不如打个络子把玉套上呢。”
一句话提醒了宝玉，便拍手笑道：“倒是姐姐说得是，我就忘了。只是配个什么颜色才好？”|一句话提醒了宝玉，就拍手笑道：“还是姐姐说得对，我都忘了。只是配什么颜色才好？”
宝钗道：“若用杂色断然使不得，大红又犯了色，黄的又不起眼，黑的又过暗。|宝钗说：“要是用杂色，肯定不行；大红又和玉的穗子犯了色；黄的又不显眼；黑的又太暗。
等我想个法儿：把那金线拿来，配著黑珠儿线，一根一根的拈上，打成络子，这才好看。”|等我想个办法：把金线拿来，配上黑珠线，一根一根捻在一起，打成络子，这才好看。”
! 莺儿正要说宝钗的“好处”，宝钗就来了。那些“世人都没有的好处”，书里终究没说出来。
! 宝钗要用“金线”络“玉”。上一回黛玉剪了玉上的穗子，说“自有别人替他再穿好的去”，这里果然应验了，用的偏偏是金。
! 用金线去络玉，就是“金玉”二字合在一起。宝钗的心思，藏在一根络子里。

# 二十四、王夫人赏袭人两碗菜
宝玉听说，喜之不尽，一叠声便叫袭人来取金线。|宝玉听了，高兴得不得了，一连声叫袭人来拿金线。
正值袭人端了两碗菜走进来，告诉宝玉道：“今儿奇怪，才刚太太打发人给我送了两碗菜来。”|正好袭人端着两碗菜进来，告诉宝玉：“今天真奇怪，刚才太太打发人给我送了两碗菜来。”
宝玉笑道：“必定是今儿菜多，送来给你们大家吃的。”|宝玉笑道：“一定是今天菜多，送来给你们大家吃的。”
袭人道：“不是，指名给我送来的，还不叫我过去磕头。这可是奇了。”|袭人说：“不是，是指名给我送来的，还不叫我过去磕头谢恩。这可奇了。”
宝钗笑道：“给你的，你就吃了，这有什么可猜疑的。”|宝钗笑道：“给你的，你就吃，这有什么好猜疑的。”
袭人笑道：“从来没有的事，倒叫我不好意思的。”|袭人笑道：“从来没有过的事，倒叫我不好意思了。”
宝钗抿嘴一笑，说道：“这就不好意思了？明儿比这个更叫你不好意思的还有呢。”|宝钗抿嘴一笑，说：“这就不好意思了？以后比这个更叫你不好意思的还有呢。”
袭人听了话内有因，素知宝钗不是轻嘴薄舌奚落人的，自己方想起上日王夫人的意思来，便不再提，|袭人听出话里有话，一向知道宝钗不是那种轻嘴薄舌取笑人的人，自己才想起前几天王夫人的意思来，就不再提了，
将菜与宝玉看了，说：“洗了手来拿线。”|把菜给宝玉看了，说：“洗了手来拿线。”
说毕，便一直的出去了。|说完，就径直出去了。
吃过饭，洗了手，进来拿金线与莺儿打络子。|吃过饭，洗了手，进来拿金线给莺儿打络子。
此时宝钗早被薛蟠遣人来请出去了。|这时宝钗早已被薛蟠派人请出去了。
! 王夫人赏菜“指名”给袭人，又“不叫过去磕头”，这是给姨娘的待遇。上一回袭人进言，王夫人说“我自然不辜负你”，今天就兑现了。
! 宝钗一句“明儿比这个更叫你不好意思的还有呢”，她已经知道王夫人要抬举袭人了。宝钗消息灵通，又和王夫人亲近。
! 宝钗和袭人这时已经心照不宣。将来宝钗做了宝二奶奶，袭人就是她屋里的姨娘。

# 二十五、黛玉来了
这里宝玉正看著打络子，忽见邢夫人那边遣了两个丫鬟送了两样果子来与他吃，|宝玉正看着莺儿打络子，忽然邢夫人那边派了两个丫鬟送两样水果来给他吃，
问他“可走得了？若走得动，叫哥儿明儿过来散散心，太太著实记挂著呢。”|问他：“能走了吗？要是走得动，叫哥儿明天过来散散心，太太实在惦记着呢。”
宝玉忙道：“若走得了，必请太太的安去。疼的比先好些，请太太放心罢。”|宝玉连忙说：“要是能走了，一定去给太太请安。疼得比先前好些了，请太太放心吧。”
一面叫他两个坐下，一面又叫秋纹来，把才拿来的那果子拿一半送与林姑娘去。|一边叫她们两个坐下，一边又叫秋纹来，把刚送来的水果拿一半给林姑娘送去。
秋纹答应了，刚欲去时，只听黛玉在院内说话，宝玉忙叫“快请”。|秋纹答应着，刚要去，只听黛玉在院子里说话，宝玉连忙叫“快请”。
要知端的，且听下回分解。|要知后事如何，请看下回。
! 宝玉得了什么好东西，总要分一半给黛玉。这一回里，宝钗、莺儿、玉钏、袭人轮番来，宝玉心里惦记的还是潇湘馆。
! 这一回从黛玉远远望着怡红院开始，到黛玉自己走进怡红院结束。中间的金线、金莺、王夫人赏菜，都和“金”有关，黛玉却全不知道。
</script>
<script type="text/plain" id="ch36">
# 一、贾母护宝玉
话说贾母自王夫人处回来，见宝玉一日好似一日，心中自是欢喜。|贾母从王夫人那里回来，见宝玉一天比一天好，心里自然高兴。
因怕将来贾政又叫他，遂命人将贾政的亲随小厮头儿唤来，|因为怕以后贾政又叫他去，就叫人把贾政身边的小厮头儿叫来，
吩咐他“以后倘有会人待客诸样的事，你老爷要叫宝玉，你不用上来传话，就回他说我说了：|吩咐他：“以后要是有会客待客这一类的事，你家老爷要叫宝玉，你不用上来传话，就回他说是我说的：
一则打重了，得著实将养几个月才走得，|一来打得重了，得好好养几个月才能走路；
二则他的星宿不利，祭了星不见外人，过了八月才许出二门。”|二来他的星象不吉利，祭过星后不能见外人，过了八月才许出二门。”
那小厮头儿听了，领命而去。|那小厮头儿听了，领命走了。
贾母又命李嬷嬷袭人等来将此话说与宝玉，使他放心。|贾母又叫李嬷嬷、袭人等人来把这话告诉宝玉，让他放心。
! 贾母编了个“星宿不利”的理由，一口气给宝玉免了几个月的会客。贾政再严，也违不了母命。
! 第三十三回贾政打宝玉，贾母说要回南京。这一回贾母干脆替宝玉挡住了贾政，宝玉从此更加无人管束。

# 二、宝玉焚书
那宝玉本就懒与士大夫诸男人接谈，又最厌峨冠礼服贺吊往还等事，|宝玉本来就懒得跟那些官员男人们交谈，又最讨厌戴官帽穿礼服、婚丧喜事来来往往这些事，
今日得了这句话，越发得了意，不但将亲戚朋友一概杜绝了，|今天得了这句话，越发得意，不但把亲戚朋友一概谢绝了，
而且连家庭中晨昏定省亦发都随他的便了，|连家里早晚向长辈请安问候的规矩也随他的便了，
日日只在园中游卧，不过每日一清早到贾母王夫人处走走就回来了，|每天只在园子里游玩躺卧，不过每天一大早到贾母、王夫人那里走一趟就回来了，
却每每甘心为诸丫鬟充役，竟也得十分闲消日月。|却常常心甘情愿替丫鬟们跑腿干活，竟也过得十分清闲自在。
或如宝钗辈有时见机导劝，反生起气来，只说|有时像宝钗这些人找机会劝导他，他反倒生起气来，只说：
“好好的一个清净洁白女儿，也学的钓名沽誉，入了国贼禄鬼之流。|“好好的一个清净纯洁的女孩子，也学着沽名钓誉，变成了那些国贼禄鬼一类的人。
这总是前人无故生事，立言竖辞，原为导后世的须眉浊物。|这都是古人无缘无故生出事来，著书立说，本来是为了教导后世那些男人的。
不想我生不幸，亦且琼闺绣阁中亦染此风，真真有负天地钟灵毓秀之德！”|没想到我生得不幸，连闺阁里的女孩子也染上了这种风气，真是辜负了天地孕育灵秀的恩德！”
因此祸延古人，除四书外，竟将别的书焚了。|因此连古人也怪罪上了，除了四书以外，竟把别的书都烧了。
众人见他如此疯颠，也都不向他说这些正经话了。|大家见他这么疯疯癫癫，也都不再跟他说这些正经话了。
独有林黛玉自幼不曾劝他去立身扬名等语，所以深敬黛玉。|只有林黛玉从小没劝过他去立身扬名之类的话，所以他非常敬重黛玉。
! “国贼禄鬼”，宝玉把读书做官的人骂成国家的贼、为俸禄卖命的鬼。这是他最极端的话。
! 宝玉焚书，独留四书。四书是科举考试的根本，他再叛逆，也不敢烧。
! 第三十二回宝玉说“林姑娘从来说过这些混帐话不曾”，这里再一次点明：宝玉敬重黛玉，正是因为她从不劝他。

# 三、凤姐收礼
闲言少述。如今且说王凤姐自见金钏死后，忽见几家仆人常来孝敬他些东西，|闲话少说。再说王凤姐自从金钏死后，忽然发现有几家仆人常常来孝敬她东西，
又不时的来请安奉承，自己倒生了疑惑，不知何意。|又不时地来请安奉承，自己倒起了疑心，不知道是什么意思。
这日又见人来孝敬他东西，因晚间无人时笑问平儿道：|这天又见人来送东西，就在晚上没人的时候笑着问平儿：
“这几家人不大管我的事，为什么忽然这么和我贴近？”|“这几家人平时不大来找我，为什么忽然跟我这么亲近？”
平儿冷笑道：“奶奶连这个都想不起来了？|平儿冷笑道：“奶奶连这个都想不起来了？
我猜他们的女儿都必是太太房里的丫头，如今太太房里有四个大的，一个月一两银子的分例，下剩的都是一个月几百钱。|我猜他们的女儿一定都是太太房里的丫头。现在太太房里有四个大丫头，每月一两银子的月钱，剩下的都是每月几百钱。
如今金钏儿死了，必定他们要弄这两银子的巧宗儿呢。”|现在金钏儿死了，他们一定是想谋这一两银子的好差事呢。”
凤姐听了，笑道：“是了，是了，倒是你提醒了。|凤姐听了，笑道：“是了是了，倒是你提醒了我。
我看这些人也太不知足，钱也赚够了，苦事情又侵不著，弄个丫头搪塞著身子也就罢了，又还想这个。|我看这些人也太不知足了，钱也赚够了，苦差事又轮不到她们，弄个丫头差事混着也就罢了，还想着这个。
也罢了，他们几家的钱容易也不能花到我跟前，这是他们自寻的，送什么来，我就收什么，横竖我有主意。”|也罢，他们几家的钱也不容易花到我跟前来，这是他们自己找上门的，送什么来我就收什么，反正我自有主意。”
凤姐儿安下这个心，所以自管迁延著，等那些人把东西送足了，然后乘空方回王夫人。|凤姐打定了这个主意，所以就一直拖着，等那些人把东西送够了，然后才找机会去回王夫人。
! 金钏尸骨未寒，她的位置就成了别人争抢的“巧宗儿”。一条命，只值一两银子的月钱。
! 凤姐收礼，却不办事，“横竖我有主意”。她要的是钱，对谁来补这个缺并不在乎。

# 四、王夫人把金钏的月钱给玉钏
这日午间，薛姨妈母女两个与林黛玉等正在王夫人房里大家吃东西呢，|这天中午，薛姨妈母女两个和林黛玉等人正在王夫人房里一起吃东西，
凤姐儿得便回王夫人道：“自从玉钏儿姐姐死了，太太跟前少著一个人。|凤姐找了个机会回王夫人说：“自从金钏儿姐姐死了，太太跟前少了一个人。（原文这里误作“玉钏儿”。）
太太或看准了那个丫头好，就吩咐，下月好发放月钱的。”|太太要是看中了哪个丫头好，就吩咐一声，下个月好发月钱。”
王夫人听了，想了一想，道：“依我说，什么是例，必定四个五个的，够使就罢了，竟可以免了罢。”|王夫人听了，想了想说：“依我说，什么规矩一定要四个五个的，够用就行了，这个缺就免了吧。”
凤姐笑道：“论理，太太说的也是。这原是旧例，别人屋里还有两个呢，太太倒不按例了。|凤姐笑道：“照理太太说得也对。只是这原是老规矩，别人屋里还有两个呢，太太倒不按规矩了。
况且省下一两银子也有限。”|况且省下一两银子也有限。”
王夫人听了，又想一想，道：“也罢，这个分例只管关了来，不用补人，就把这一两银子给他妹妹玉钏儿罢。|王夫人听了，又想了想说：“也罢，这份月钱照样领来，不用补人，就把这一两银子给她妹妹玉钏儿吧。
他姐姐伏侍了我一场，没个好结果，剩下他妹妹跟著我，吃个双分子也不为过逾了。”|她姐姐伺候了我一场，没有个好结果，剩下她妹妹跟着我，拿双份也不算过分。”
凤姐答应著，回头找玉钏儿，笑道：“大喜，大喜。”|凤姐答应着，回头找到玉钏儿，笑道：“大喜，大喜。”
玉钏儿过来磕了头。|玉钏儿过来磕了头。
! 那几家送礼的全白送了，王夫人谁也不补，把金钏的月钱给了玉钏。凤姐收了礼，事却没办成，“横竖我有主意”原来是这个意思。
! 凤姐对玉钏说“大喜”，姐姐死了，妹妹拿双份月钱，算是“大喜”。王夫人用一两银子安慰自己的良心，也堵住玉钏的怨气。

# 五、凤姐算月钱账
王夫人问道：“正要问你，如今赵姨娘周姨娘的月例多少？”|王夫人问道：“正要问你，现在赵姨娘、周姨娘的月钱是多少？”
凤姐道：“那是定例，每人二两。赵姨娘有环兄弟的二两，共是四两，另外四串钱。”|凤姐说：“那是定例，每人二两。赵姨娘还有环兄弟的二两，一共是四两，另外还有四串钱。”
王夫人道：“可都按数给他们？”|王夫人说：“都按数给她们了吗？”
凤姐见问的奇怪，忙道：“怎么不按数给！”|凤姐见她问得奇怪，忙说：“怎么会不按数给！”
王夫人道：“前儿我恍惚听见有人抱怨，说短了一吊钱，是什么原故？”|王夫人说：“前些天我恍惚听见有人抱怨，说少了一吊钱，这是什么缘故？”
凤姐忙笑道：“姨娘们的丫头，月例原是人各一吊。|凤姐连忙笑道：“姨娘们的丫头，月钱原来是每人一吊。
从旧年他们外头商议的，姨娘们每位的丫头分例减半，人各五百钱，每位两个丫头，所以短了一吊钱。|从去年起，外面账房商量决定，每位姨娘的丫头月钱减半，每人五百钱，每位姨娘两个丫头，所以就少了一吊钱。
这也抱怨不著我，我倒乐得给他们呢，他们外头又扣著，难道我添上不成。|这也怪不到我身上，我倒乐意给她们呢，是外面账房扣着，难道要我自己贴上不成。
这个事我不过是接手儿，怎么来，怎么去，由不得我作主。|这件事我不过是经手，钱怎么来就怎么发，由不得我做主。
我倒说了两三回，仍旧添上这两分的。他们说只有这个项数，叫我也难再说了。|我也说过两三回，要把这两份添上。他们说只有这么多钱，叫我也不好再说了。
如今我手里每月连日子都不错给他们呢。|如今在我手里，每个月连日子都不差地发给她们。
先时在外头关，那个月不打饥荒，何曾顺顺溜溜的得过一遭儿。”|以前在外面账房领的时候，哪个月不拖欠，什么时候顺顺当当地领过一回。”
王夫人听说，也就罢了，半日又问：“老太太屋里几个一两的？”|王夫人听了，也就算了，过了半天又问：“老太太屋里有几个一两银子的？”
凤姐道：“八个。如今只有七个，那一个是袭人。”|凤姐说：“八个。现在只有七个，那一个是袭人。”
王夫人道：“这就是了。你宝兄弟也并没有一两的丫头，袭人还算是老太太房里的人。”|王夫人说：“这就对了。你宝兄弟屋里本来没有一两银子的丫头，袭人还算是老太太房里的人。”
! 抱怨“短了一吊钱”的是赵姨娘。王夫人问得“奇怪”，凤姐立刻听出有人告了她的状，一口气把账算得清清楚楚。
! 贾府开始削减开支，先从姨娘的丫头身上减。家道渐衰，最先受苦的是最底层的人。
! 王夫人问月钱，绕了一大圈，真正要问的是袭人。

# 六、王夫人从自己月例里给袭人
凤姐笑道：“袭人原是老太太的人，不过给了宝兄弟使。他这一两银子还在老太太的丫头分例上领。|凤姐笑道：“袭人原本是老太太的人，不过给了宝兄弟使唤。她这一两银子还是在老太太的丫头名额上领的。
如今说因为袭人是宝玉的人，裁了这一两银子，断然使不得。|如今要是说袭人是宝玉的人，就裁了她这一两银子，那绝对不行。
若说再添一个人给老太太，这个还可以裁他的。|要是说再添一个人给老太太，这个倒可以裁她的。
若不裁他的，须得环兄弟屋里也添上一个才公道均匀了。|要是不裁她的，就得在环兄弟屋里也添一个，才公平。
就是晴雯麝月等七个大丫头，每月人各月钱一吊，佳蕙等八个小丫头，每月人各月钱五百，|就说晴雯、麝月等七个大丫头，每人每月月钱一吊；佳蕙等八个小丫头，每人每月五百钱，
还是老太太的话，别人如何恼得气得呢。”|这还是老太太定的，别人怎么能恼怎么能气呢。”
薛姨娘笑道：“只听凤丫头的嘴，倒象倒了核桃车子的，只听他的帐也清楚，理也公道。”|薛姨妈笑道：“听凤丫头这张嘴，就像倒了一车核桃似的，噼里啪啦，听她算的账也清楚，道理也公道。”
凤姐笑道：“姑妈，难道我说错了不成？”|凤姐笑道：“姑妈，难道我说错了不成？”
薛姨妈笑道：“说的何尝错，只是你慢些说岂不省力。”|薛姨妈笑道：“说得哪里错了，只是你慢点说岂不省力。”
凤姐才要笑，忙又忍住了，听王夫人示下。|凤姐刚要笑，又连忙忍住了，听王夫人的吩咐。
王夫人想了半日，向凤姐儿道：“明儿挑一个好丫头送去老太太使，补袭人，把袭人的一分裁了。|王夫人想了半天，对凤姐说：“明天挑一个好丫头送去给老太太使唤，补袭人的缺，把袭人那一份裁了。
把我每月的月例二十两银子里，拿出二两银子一吊钱来给袭人。|从我每月二十两银子的月例里，拿出二两银子一吊钱来给袭人。
以后凡事有赵姨娘周姨娘的，也有袭人的，|以后凡是赵姨娘、周姨娘有的，袭人也有一份，
只是袭人的这一分都从我的分例上匀出来，不必动官中的就是了。”|只是袭人这一份都从我的月例里分出来，不必动公家的钱就是了。”
! 二两银子一吊钱，正是赵姨娘、周姨娘的月例。王夫人没有明说，却已经给了袭人姨娘的待遇。这是王夫人对袭人进言的回报。
! “不必动官中的”，从王夫人自己的钱里出，就不用经过贾政、贾母，也不用公开名分。王夫人这一手，是暗中抬举。

# 七、王夫人夸袭人
凤姐一一的答应了，笑推薛姨妈道：“姑妈听见了，我素日说的话如何？今儿果然应了我的话。”|凤姐一一答应了，笑着推推薛姨妈说：“姑妈听见了吧，我平时说的话怎么样？今天果然应了我的话。”
薛姨妈道：“早就该如此。|薛姨妈说：“早就该这样了。
模样儿自然不用说的，他的那一种行事大方，说话见人和气里头带著刚硬要强，这个实在难得。”|模样自然不用说，她那种做事大方、说话待人和气里又带着刚强要强的劲儿，这个实在难得。”
王夫人含泪说道：“你们那里知道袭人那孩子的好处？比我的宝玉强十倍！|王夫人含着泪说：“你们哪里知道袭人那孩子的好处？比我的宝玉强十倍！
宝玉果然是有造化的，能够得他长长远远的伏侍他一辈子，也就罢了。”|宝玉要是真有福气，能够让她长长久久地伺候他一辈子，也就够了。”
凤姐道：“既这么样，就开了脸，明放他在屋里岂不好？”|凤姐说：“既然这样，就给她开了脸，明明白白地放在屋里做姨娘，岂不好？”
王夫人道：“那就不好了，一则都年轻，二则老爷也不许，|王夫人说：“那就不好了，一来他们都年轻，二来老爷也不会答应，
三则那宝玉见袭人是个丫头，纵有放纵的事，倒能听他的劝，|三来宝玉看袭人还是个丫头，就算有放纵的地方，倒还能听她的劝，
如今作了跟前人，那袭人该劝的也不敢十分劝了。|要是做了屋里人，那袭人该劝的也不敢尽力劝了。
如今且浑著，等再过二三年再说。”|现在先这样含含糊糊的，等再过两三年再说。”
! “开脸”是女子出嫁或做妾时，用丝线绞去脸上的汗毛，表示身份改变了。凤姐说“开了脸”，就是正式收为宝玉的妾。
! 王夫人说“比我的宝玉强十倍”，把一个丫头抬到亲儿子之上，可见袭人那番话说得多么合她的心。
! “且浑著”，王夫人留了一手：袭人还是丫头，才能劝宝玉。名分不给，好处先给，袭人就会一心一意地替她看着宝玉。

# 八、凤姐骂人
说毕半日，凤姐见无话，便转身出来。|说了半天，凤姐见没别的事了，就转身出来。
刚至廊檐上，只见有几个执事的媳妇子正等他回事呢，|刚到廊檐下，只见几个管事的媳妇正等着向她回事，
见他出来，都笑道：“奶奶今儿回什么事，这半天？可是要热著了。”|见她出来，都笑道：“奶奶今天回什么事，这么半天？可别热着了。”
凤姐把袖子挽了几挽，跐著那角门的门槛子，笑道：“这里过门风倒凉快，吹一吹再走。”|凤姐把袖子挽了几挽，踩着那角门的门槛，笑道：“这里穿堂风倒凉快，吹一吹再走。”
又告诉众人道：“你们说我回了半日的话，太太把二百年头里的事都想起来问我，难道我不说罢。”|又告诉大家：“你们说我回了半天的话，太太把二百年前的事都想起来问我，难道我能不说吗。”
又冷笑道：“我从今以后倒要干几样克毒事了。抱怨给太太听，我也不怕。|又冷笑道：“我从今以后倒要干几件刻薄狠毒的事了。去跟太太抱怨，我也不怕。
糊涂油蒙了心，烂了舌头，不得好死的下作东西，别作娘的春梦！|那些猪油蒙了心、烂了舌头、不得好死的下贱东西，别做你娘的春秋大梦！
明儿一裹脑子扣的日子还有呢。|以后一股脑儿扣钱的日子还多着呢。
如今裁了丫头的钱，就抱怨了咱们。也不想一想是奴几，也配使两三个丫头！”|如今裁了丫头的月钱，就抱怨咱们。也不想想自己是什么奴才，也配使唤两三个丫头！”
一面骂，一面方走了，自去挑人回贾母话去，不在话下。|一边骂，一边才走了，自己去挑人回贾母的话去了。
! 凤姐在王夫人面前笑着算账，一出门就破口大骂。她知道是赵姨娘告的状，骂的就是赵姨娘。
! “也配使两三个丫头”，赵姨娘是姨娘，也就是半个奴才。凤姐当着下人骂她，一点情面都不留。这是凤姐的狠，也是她得罪人的地方。
! “明儿一裹脑子扣的日子还有呢”，凤姐放出狠话。第三十九回揭出她挪用月钱放高利贷，她扣的钱，原来另有用处。

# 九、宝钗进怡红院
却说王夫人等这里吃毕西瓜，又说了一回闲话，各自方散去。|王夫人她们吃完西瓜，又说了一会儿闲话，才各自散了。
宝钗与黛玉等回至园中，宝钗因约黛玉往藕香榭去，黛玉回说立刻要洗澡，便各自散了。|宝钗和黛玉等人回到园中，宝钗约黛玉去藕香榭，黛玉说马上要洗澡，就各自散了。
宝钗独自行来，顺路进了怡红院，意欲寻宝玉谈讲以解午倦。|宝钗一个人走着，顺路进了怡红院，想找宝玉聊聊天，解解午后的困倦。
不想一入院来，鸦雀无闻，一并连两只仙鹤在芭蕉下都睡著了。|没想到一进院子，静悄悄的，连两只仙鹤都在芭蕉下睡着了。
宝钗便顺著游廊来至房中，只见外间床上横三竖四，都是丫头们睡觉。|宝钗就顺着游廊来到屋里，只见外间床上横七竖八的，都是丫头们在睡觉。
转过十锦槅子，来至宝玉的房内。|转过十锦槅子，来到宝玉的房里。
宝玉在床上睡著了，袭人坐在身旁，手里做针线，旁边放著一柄白犀尘。|宝玉在床上睡着了，袭人坐在他身边，手里做着针线，旁边放着一柄白犀牛尾做的拂尘。
宝钗走近前来，悄悄的笑道：“你也过于小心了，这个屋里那里还有苍蝇蚊子，还拿蝇帚子赶什么？”|宝钗走上前来，悄悄笑道：“你也太小心了，这屋里哪还有苍蝇蚊子，还拿拂尘赶什么？”
袭人不防，猛抬头见宝钗，忙放下针线，起身悄悄笑道：|袭人没防备，猛一抬头看见宝钗，连忙放下针线，起身悄悄笑道：
“姑娘来了，我倒也不防，唬了一跳。|“姑娘来了，我也没留神，吓了一跳。
姑娘不知道，虽然没有苍蝇蚊子，谁知有一种小虫子，从这纱眼里钻进来，人也看不见，只睡著了，咬一口，就象蚂蚁夹的。”|姑娘不知道，虽然没有苍蝇蚊子，谁知有一种小虫子，从这纱窗眼里钻进来，人都看不见，只要一睡着，咬一口，就像蚂蚁夹了似的。”
宝钗道：“怨不得。这屋子后头又近水，又都是香花儿，这屋子里头又香。|宝钗说：“难怪。这屋子后面又挨着水，又种满了香花，这屋里头又香。
这种虫子都是花心里长的，闻香就扑。”|这种虫子都是花心里长的，闻到香味就扑过来。”
! 黛玉要洗澡，宝钗一个人去了怡红院。下面这一幕，黛玉本来不会看见。
! 宝钗说“花心里长的”虫子“闻香就扑”，听着是说虫子，有人读作是在说那些围着宝玉转的人。

# 十、宝钗绣鸳鸯
说著，一面又瞧他手里的针线，原来是个白绫红里的兜肚，|说着，又看她手里的针线活，原来是一个白绫面、红绸里的肚兜，
上面扎著鸳鸯戏莲的花样，红莲绿叶，五色鸳鸯。|上面绣着鸳鸯戏莲的图案，红色莲花、绿色荷叶，五彩鸳鸯。
宝钗道：“嗳哟，好鲜亮活计！这是谁的，也值的费这么大工夫？”|宝钗说：“哎哟，好鲜亮的活计！这是谁的，值得费这么大工夫？”
袭人向床上努嘴儿。|袭人朝床上努了努嘴。
宝钗笑道：“这么大了，还带这个？”|宝钗笑道：“这么大了，还戴这个？”
袭人笑道：“他原是不带，所以特特的做的好了，叫他看见由不得不带。|袭人笑道：“他本来是不戴的，所以特意做得好看些，叫他看见了忍不住要戴。
如今天气热，睡觉都不留神，哄他带上了，便是夜里纵盖不严些儿，也就不怕了。|如今天热，睡觉都不注意，哄他戴上了，就算夜里被子没盖严，也不怕着凉了。
你说这一个就用了工夫，还没看见他身上现带的那一个呢。”|你说这一个就费了工夫，还没看见他身上现在戴的那一个呢。”
宝钗笑道：“也亏你奈烦。”|宝钗笑道：“也亏你有这个耐心。”
袭人道：“今儿做的工夫大了，脖子低的怪酸的。”|袭人说：“今天做的时间长了，脖子低得酸得很。”
又笑道：“好姑娘，你略坐一坐，我出去走走就来。”说著便走了。|又笑道：“好姑娘，你稍微坐一坐，我出去走走就来。”说着就走了。
宝钗只顾看著活计，便不留心，一蹲身，刚刚的也坐在袭人方才坐的所在，|宝钗只顾看着那活计，一不留神，一蹲身，正好坐在了袭人刚才坐的地方，
因又见那活计实在可爱，不由的拿起针来，替他代刺。|又见那活计实在可爱，不由得拿起针来，替她绣了起来。
! 回目“绣鸳鸯梦兆绛芸轩”。鸳鸯是夫妻的象征，宝钗坐在宝玉床边绣鸳鸯，这个画面就是将来“宝二奶奶”的样子。
! 宝钗“刚刚的也坐在袭人方才坐的所在”，作者写得极巧：宝钗不知不觉坐到了袭人的位置上，也就是宝玉身边伺候的人的位置。
! 一向最懂避嫌的宝钗，竟独自坐在睡着的宝玉身边做针线。她是一时忘情，还是有意，作者不说。

# 十一、黛玉湘云窗外看见
不想林黛玉因遇见史湘云约他来与袭人道喜，二人来至院中，|没想到林黛玉遇见了史湘云，湘云约她一起来给袭人道喜，两人来到院子里，
见静悄悄的，湘云便转身先到厢房里去找袭人。|见静悄悄的，湘云就转身先到厢房里去找袭人。
林黛玉却来至窗外，隔著纱窗往里一看，|林黛玉却走到窗外，隔着纱窗往里一看，
只见宝玉穿著银红纱衫子，随便睡著在床上，宝钗坐在身旁做针线，旁边放著蝇帚子，|只见宝玉穿着银红纱衫，随随便便睡在床上，宝钗坐在他身边做针线，旁边放着拂尘，
林黛玉见了这个景儿，连忙把身子一藏，手握著嘴不敢笑出来，招手儿叫湘云。|林黛玉看见这个情景，连忙把身子一藏，捂着嘴不敢笑出声来，招手叫湘云。
湘云一见他这般景况，只当有什么新闻，忙也来一看，也要笑时，|湘云见她这个样子，以为有什么新鲜事，连忙也过来一看，也要笑，
忽然想起宝钗素日待他厚道，便忙掩住口。|忽然想起宝钗平时待她厚道，就连忙捂住嘴。
知道林黛玉不让人，怕他言语之中取笑，便忙拉过他来道：|知道林黛玉说话不饶人，怕她话里取笑宝钗，就连忙把她拉过来说：
“走罢。我想起袭人来，他说午间要到池子里去洗衣裳，想必去了，咱们那里找他去。”|“走吧。我想起袭人来了，她说中午要到池子里去洗衣服，想必是去了，咱们到那里去找她。”
林黛玉心下明白，冷笑了两声，只得随他走了。|林黛玉心里明白，冷笑了两声，只好跟她走了。
! 湘云和黛玉来给袭人“道喜”，可见袭人得了姨娘待遇的事，园子里已经都知道了。
! 黛玉看见宝钗坐在宝玉床边，第一反应是“握著嘴不敢笑”。她看见的是宝钗失了分寸，所以想笑，又想叫湘云来看。
! 湘云护着宝钗，拉黛玉走。第三十二回湘云说“这些姐姐们再没一个比宝姐姐好的”，这里她也是向着宝钗的。黛玉“冷笑了两声”，心里全都明白。

# 十二、“我偏说是木石姻缘”
这里宝钗只刚做了两三个花瓣，忽见宝玉在梦中喊骂说：|宝钗刚绣了两三个花瓣，忽然听见宝玉在梦里喊骂道：
“和尚道士的话如何信得？什么是金玉姻缘，我偏说是木石姻缘！”|“和尚道士的话怎么能信？什么金玉姻缘，我偏说是木石姻缘！”
薛宝钗听了这话，不觉怔了。|薛宝钗听了这话，不由得愣住了。
! 这是全书最有名的一句梦话。宝钗正坐在床边绣鸳鸯，宝玉在梦里大喊“木石姻缘”。金锁是和尚给的，所以宝玉说“和尚道士的话如何信得”。
! “金玉”是宝钗的金锁配宝玉的玉；“木石”是黛玉这棵绛珠草配宝玉这块顽石。宝玉在梦里把自己的心说得清清楚楚，偏偏听见的是宝钗。
! 回目“梦兆绛芸轩”，绛芸轩就是宝玉的屋子。这个梦是宝玉的心，也是一个凶兆：最后宝玉娶的是宝钗，“木石”终究没能成。

# 十三、凤姐叫袭人
忽见袭人走过来，笑道：“还没有醒呢。”|忽然袭人走过来，笑道：“还没醒呢。”
宝钗摇头。|宝钗摇摇头。
袭人又笑道：“我才碰见林姑娘史大姑娘，他们可曾进来？”|袭人又笑道：“我刚才碰见林姑娘和史大姑娘，她们进来过吗？”
宝钗道：“没见他们进来。”|宝钗说：“没看见她们进来。”
因向袭人笑道：“他们没告诉你什么话？”|又对袭人笑道：“她们没跟你说什么吗？”
袭人笑道：“左不过是他们那些玩话，有什么正经说的。”|袭人笑道：“不过是她们那些玩笑话，有什么正经的。”
宝钗笑道：“他们说的可不是玩话，我正要告诉你呢，你又忙忙的出去了。”|宝钗笑道：“她们说的可不是玩笑话，我正要告诉你，你又急急忙忙出去了。”
一句话未完，只见凤姐儿打发人来叫袭人。|一句话还没说完，只见凤姐打发人来叫袭人。
宝钗笑道：“就是为那话了。”|宝钗笑道：“就是为了那件事。”
袭人只得唤起两个丫鬟来，一同宝钗出怡红院，自往凤姐这里来。|袭人只好叫起两个丫鬟来，和宝钗一起出了怡红院，自己往凤姐那里去了。
果然是告诉他这话，又叫他与王夫人叩头，且不必去见贾母，倒把袭人不好意思的。|果然是告诉她这件事，又叫她去给王夫人磕头，暂时不必去见贾母，倒把袭人弄得不好意思了。
见过王夫人急忙回来，宝玉已醒了，问起原故，袭人且含糊答应，至夜间人静，袭人方告诉。|见过王夫人急忙回来，宝玉已经醒了，问起是怎么回事，袭人先含含糊糊地应付过去，到了夜里人静的时候，袭人才告诉他。
! 宝钗听了那句梦话，“摇头”，一句也不提。她装作什么都没听见。
! 宝钗说的“那话”，就是袭人得了二两银子的事。宝钗比袭人自己还先知道。
! “且不必去见贾母”，袭人原是贾母的人，王夫人暗中把她收了过来，所以不让她去见贾母。这件事，王夫人是瞒着贾母办的。

# 十四、袭人的冷话
宝玉喜不自禁，又向他笑道：“我可看你回家去不去了！|宝玉高兴得不得了，又对她笑道：“我倒要看看你还回不回家去了！
那一回往家里走了一趟，回来就说你哥哥要赎你，又说在这里没著落，终久算什么，|那回你回家去了一趟，回来就说你哥哥要赎你出去，又说在这里没个着落，终究算什么呢，
说了那么些无情无义的生分话唬我。|说了那么多无情无义、生分的话吓唬我。
从今以后，我可看谁来敢叫你去。”|从今以后，我倒要看看谁还敢叫你走。”
袭人听了，便冷笑道：“你倒别这么说。从此以后我是太太的人了，我要走连你也不必告诉，只回了太太就走。”|袭人听了，就冷笑道：“你倒别这么说。从今以后我是太太的人了，我要走连你都不用告诉，只要回了太太就走。”
宝玉笑道：“就便算我不好，你回了太太竟去了，叫别人听见说我不好，你去了你也没意思。”|宝玉笑道：“就算我不好，你回了太太就走了，叫别人听见说是我不好，你走了也没意思。”
袭人笑道：“有什么没意思，难道作了强盗贼，我也跟著罢。再不然，还有一个死呢。|袭人笑道：“有什么没意思的，难道你做了强盗贼，我也跟着你不成。再不然，还有一条死路呢。
人活百岁，横竖要死，这一口气不在，听不见看不见就罢了。”|人活一百岁，反正要死，这口气一断，听不见、看不见也就罢了。”
宝玉听见这话，便忙握他的嘴，说道：“罢，罢，罢，不用说这些话了。”|宝玉听见这话，连忙捂住她的嘴，说：“算了算了算了，别说这些话了。”
! 第十九回袭人回家，说哥哥要赎她出去，那是吓唬宝玉，好跟他“约法三章”。现在她得了王夫人的看重，再也不用走了。
! “我是太太的人了”，袭人说出了真话：她已经不只是宝玉的丫头，而是王夫人安在宝玉身边的人。
! “难道作了强盗贼，我也跟著”，八十回后宝玉出家，袭人果然没有跟着，后来嫁给了蒋玉菡。这一句话，也是谶语。

# 十五、宝玉论“文死谏，武死战”
袭人深知宝玉性情古怪，听见奉承吉利话又厌虚而不实，听了这些尽情实话又生悲感，|袭人深知宝玉脾气古怪，听到奉承吉利的话又嫌虚假不实，听了这些掏心窝的实话又生悲伤，
便悔自己说冒撞了，连忙笑著用话截开，只拣那宝玉素喜谈者问之。|就后悔自己说得冒失了，连忙笑着用别的话岔开，只挑宝玉平时喜欢聊的话题问他。
先问他春风秋月，再谈及粉淡脂萤，然后谈到女儿如何好，又谈到女儿死，袭人忙掩住口。|先问他春风秋月，再谈到胭脂水粉，然后谈到女孩子怎么好，又谈到女孩子死，袭人连忙闭了嘴。
宝玉谈至浓快时，见他不说了，便笑道：“人谁不死，只要死的好。|宝玉正谈到兴头上，见她不说了，就笑道：“人谁不死，只要死得好。
那些个须眉浊物，只知道文死谏，武死战，这二死是大丈夫死名死节。竟何如不死的好！|那些臭男人，只知道文官要拼死进谏，武将要拼死作战，这两种死是大丈夫为名节而死。其实哪里比得上不死好！
必定有昏君他方谏，他只顾邀名，猛拼一死，将来弃君于何地！|一定是有了昏君他才进谏，他只顾着博取名声，猛地拼死一谏，将来把君主置于何地！
必定有刀兵他方战，猛拼一死，他只顾图汗马之名，将来弃国于何地！所以这皆非正死。”|一定是有了战争他才去打仗，猛地拼死一战，他只顾着图个战功的名声，将来把国家置于何地！所以这些都不是死得其所。”
袭人道：“忠臣良将，出于不得已他才死。”|袭人说：“忠臣良将，是出于不得已才死的。”
宝玉道：“那武将不过仗血气之勇，疏谋少略，他自己无能，送了性命，这难道也是不得已！|宝玉说：“那些武将不过是凭着一股血气之勇，没有谋略，他自己无能，送了性命，这难道也是不得已！
那文官更不可比武官了，他念两句书窝在心里，若朝廷少有疵瑕，他就胡谈乱劝，|那些文官更比不上武官了，他念了两句书憋在心里，要是朝廷稍微有点小毛病，他就胡说乱劝，
只顾他邀忠烈之名，浊气一涌，即时拼死，这难道也是不得已！|只顾着博取忠烈的名声，一股浊气冲上来，立刻就去拼死，这难道也是不得已！
还要知道，那朝廷是受命于天，他不圣不仁，那天地断不把这万几重任与他了。|还要知道，朝廷是受命于天的，要是皇帝不圣明不仁德，天地绝不会把治理天下的重任交给他。
可知那些死的都是沽名，并不知大义。|可见那些死了的都是为了沽名钓誉，并不懂得大义。
! “文死谏，武死战”，是古人最推崇的忠臣气节。宝玉偏说这是“沽名”，是为了自己的名声，不顾君主和国家。这是宝玉最惊世骇俗的言论之一。
! 宝玉说朝廷“受命于天”，皇帝要是不好，天就不会让他当皇帝。他说得绕，意思是：皇帝都是好的，臣子去死谏，反倒显得皇帝昏庸。这是反话，也是讽刺。

# 十六、“眼泪流成大河”
比如我此时若果有造化，该死于此时的，趁你们在，我就死了，|比如我现在要是真有福气，该在这时候死的，趁你们都在，我就死了，
再能够你们哭我的眼泪流成大河，把我的尸首漂起来，送到那鸦雀不到的幽僻之处，随风化了，|再能让你们哭我的眼泪流成一条大河，把我的尸首漂起来，送到那连乌鸦麻雀都不去的偏僻地方，随风化掉，
自此再不要托生为人，就是我死的得时了。”|从此再也不投胎做人，那就是我死得正是时候了。”
袭人忽见说出这些疯话来，忙说困了，不理他。|袭人忽然见他说出这些疯话来，连忙说困了，不理他了。
那宝玉方合眼睡著，至次日也就丢开了。|宝玉这才合眼睡着了，到第二天也就丢开了。
! 宝玉的“正死”，是在女孩子们的眼泪里死去，从此不再做人。他不要功名，不要来世，只要眼前这些人的眼泪。
! 第三十四回宝玉挨打，想的也是“得他们如此，一生事业纵然尽付东流，亦无足叹惜”。宝玉一再说“死”，他心里最怕的是“散”，所以宁愿先死。

# 十七、龄官不肯唱
一日，宝玉因各处游的烦腻，便想起《牡丹亭》曲来，自己看了两遍，犹不惬怀，|一天，宝玉因为各处都逛腻了，就想起《牡丹亭》的曲子来，自己看了两遍，还是不满足，
因闻得梨香院的十二个女孩子中有小旦龄官最是唱的好，因著意出角门来找时，|听说梨香院十二个女孩子中唱小旦的龄官唱得最好，就特意出了角门去找她，
只见宝官玉官都在院内，见宝玉来了，都笑嘻嘻的让坐。|只见宝官、玉官都在院子里，见宝玉来了，都笑嘻嘻地让座。
宝玉因问“龄官独在那里？”|宝玉就问：“龄官在哪里？”
众人都告诉他说：“在他房里呢。”|大家都告诉他：“在她房里呢。”
宝玉忙至他房内，只见龄官独自倒在枕上，见他进来，文风不动。|宝玉连忙到她房里，只见龄官一个人躺在枕头上，见他进来，一动也不动。
宝玉素习与别的女孩子顽惯了的，只当龄官也同别人一样，|宝玉平时和别的女孩子玩惯了，以为龄官也和别人一样，
因进前来身旁坐下，又陪笑央他起来唱“袅晴丝”一套。|就走上前在她身边坐下，又赔着笑求她起来唱一套《袅晴丝》。
不想龄官见他坐下，忙抬身起来躲避，正色说道：“嗓子哑了。前儿娘娘传进我们去，我还没有唱呢。”|没想到龄官见他坐下，连忙起身躲开，正色说：“嗓子哑了。前些天娘娘召我们进宫，我都没唱呢。”
宝玉见他坐正了，再一细看，原来就是那日蔷薇花下划“蔷”字那一个。|宝玉见她坐正了，再仔细一看，原来就是那天在蔷薇花下画“蔷”字的那一个。
又见如此景况，从来未经过这番被人弃厌，自己便讪讪的红了脸，只得出来了。|又见她这样，宝玉从来没被人这样嫌弃过，自己就讪讪地红了脸，只好出来了。
! “袅晴丝”是《牡丹亭·惊梦》里的唱段，写杜丽娘游园。第二十三回黛玉听《牡丹亭》“如醉如痴”，宝玉也爱这出戏。
! 龄官“文风不动”，连贵妃都没唱，何况宝玉。她是全书唯一一个对宝玉冷淡、不把他当回事的女孩子。
! 宝玉“从来未经过这番被人弃厌”，园子里人人都捧着他，第一次碰了钉子。

# 十八、贾蔷买雀儿
宝官等不解何故，因问其所以。宝玉便说了，遂出来。|宝官等人不明白是怎么回事，就问他。宝玉说了，就出来了。
宝官便说道：“只略等一等，蔷二爷来了叫他唱，是必唱的。”|宝官就说：“稍微等一等，蔷二爷来了叫她唱，她一定唱。”
宝玉听了，心下纳闷，因问：“蔷哥儿那去了？”|宝玉听了，心里纳闷，就问：“蔷哥儿到哪里去了？”
宝官道：“才出去了，一定还是龄官要什么，他去变弄去了。”|宝官说：“刚出去了，一定又是龄官要什么，他去想办法弄去了。”
宝玉听了，以为奇特，少站片时，果见贾蔷从外头来了，|宝玉听了，觉得很奇怪，站了一会儿，果然看见贾蔷从外面回来了，
手里又提著个雀儿笼子，上面扎著个小戏台，并一个雀儿，兴兴头头的往里走著找龄官。|手里提着一个鸟笼子，上面扎着一个小戏台，还有一只鸟，兴冲冲地往里走着找龄官。
见了宝玉，只得站住。|见了宝玉，只好站住。
宝玉问他：“是个什么雀儿，会衔旗串戏台？”|宝玉问他：“这是什么鸟，会衔旗子在戏台上跑来跑去？”
贾蔷笑道：“是个玉顶金豆。”|贾蔷笑道：“是只玉顶金豆。”
宝玉道：“多少钱买的？”|宝玉说：“多少钱买的？”
贾蔷道：“一两八钱银子。”|贾蔷说：“一两八钱银子。”
一面说，一面让宝玉坐，自己往龄官房里来。|一边说，一边让宝玉坐，自己往龄官房里去了。
! 龄官要什么，贾蔷就去“变弄”什么。贾蔷是宁府的少爷，管着这班女戏子，却对一个小戏子百依百顺。
! 一两八钱银子买一只鸟，差不多是一个大丫头两个月的月钱。

# 十九、龄官的怨气
宝玉此刻把听曲子的心都没了，且要看他和龄官是怎样。|宝玉这会儿连听曲子的心思都没了，只想看看他和龄官是怎么回事。
只见贾蔷进去笑道：“你起来，瞧这个顽意儿。”|只见贾蔷进去笑道：“你起来，看看这个玩意儿。”
龄官起身问是什么，贾蔷道：“买了雀儿你顽，省得天天闷闷的无个开心。我先顽个你看。”|龄官起身问是什么，贾蔷说：“买了只鸟给你玩，省得你天天闷闷不乐的没个开心。我先玩给你看。”
说著，便拿些谷子哄的那个雀儿在戏台上乱串，衔鬼脸旗帜。|说着，就拿些谷子引那只鸟在戏台上跑来跑去，衔着鬼脸旗子。
众女孩子都笑道“有趣”，独龄官冷笑了两声，赌气仍睡去了。|女孩子们都笑着说“有趣”，只有龄官冷笑两声，赌气又躺下了。
贾蔷还只管陪笑，问他好不好。|贾蔷还只管赔着笑，问她好不好。
龄官道：“你们家把好好的人弄了来，关在这牢坑里学这个劳什子还不算，|龄官说：“你们家把好好的人买了来，关在这牢坑里学这个破玩意儿还不算，
你这会子又弄个雀儿来，也偏生干这个。你分明是弄了他来打趣形容我们，还问我好不好。”|你这会儿又弄只鸟来，偏偏也是干这个。你分明是弄它来取笑我们，还问我好不好。”
贾蔷听了，不觉慌起来，连忙赌身立誓。|贾蔷听了，不由得慌了，连忙赌咒发誓。
又道：“今儿我那里的香脂油蒙了心！费一二两银子买他来，原说解闷，就没有想到这上头。|又说：“今天我真是猪油蒙了心！花一二两银子买它来，本来是给你解闷的，就没想到这一层。
罢，罢，放了生，免免你的灾病。”|算了算了，放生吧，也免免你的灾病。”
说著，果然将雀儿放了，一顿把将笼子拆了。|说着，果然把鸟放了，三下两下把笼子拆了。
! “牢坑”，龄官说出了这班女戏子的处境：她们是买来的，关在梨香院学戏，供贾府取乐。笼子里会唱戏的鸟，就是她们自己。
! 贾蔷是主子，被一个戏子说得“慌起来”，立刻放鸟拆笼。他是真心爱龄官。

# 二十、龄官吐血
龄官还说：“那雀儿虽不如人，他也有个老雀儿在窝里，你拿了他来弄这个劳什子也忍得！|龄官还说：“那鸟虽然比不上人，它也有个老鸟在窝里，你把它抓来弄这个破玩意儿也忍心！
今儿我咳嗽出两口血来，太太叫大夫来瞧，不说替我细问问，你且弄这个来取笑。|今天我咳出两口血来，太太叫大夫来看，你不替我仔细问问，倒弄这个来取笑。
偏生我这没人管没人理的，又偏病。”说著又哭起来。|偏偏我这个没人管没人理的，又偏偏生病。”说着又哭起来。
贾蔷忙道：“昨儿晚上我问了大夫，他说不相干。他说吃两剂药，后儿再瞧。|贾蔷连忙说：“昨天晚上我问过大夫了，他说不要紧。他说吃两剂药，后天再看。
谁知今儿又吐了。这会子请他去。”说著，便要请去。|谁知今天又吐了。我这会儿就去请他。”说着，就要去请。
龄官又叫“站住，这会子大毒日头地下，你赌气子去请了来我也不瞧。”|龄官又叫：“站住，这会儿大太阳底下，你赌气去请了来，我也不看。”
贾蔷听如此说，只得又站住。|贾蔷听她这么说，只好又站住了。
宝玉见了这般景况，不觉痴了，这才领会了划”蔷”深意。|宝玉看见这个情景，不由得呆住了，这才明白了她画“蔷”字的深意。
自己站不住，也抽身走了。|自己站不住了，也转身走了。
贾蔷一心都在龄官身上，也不顾送，倒是别的女孩子送了出来。|贾蔷一心都在龄官身上，也顾不上送他，倒是别的女孩子送他出来了。
! “他也有个老雀儿在窝里”，龄官说的是鸟，也是自己：她也有父母，却被卖进了贾府。
! 龄官也咳血。第三十一回袭人吐血，这一回龄官吐血，黛玉更是日日咳嗽。这些女孩子的身子，都在一天天坏下去。
! 龄官叫贾蔷“站住”，不让他大太阳下去请大夫。她嘴上怨他，心里疼他。宝玉在旁边看着，第一次看见一个女孩子的情不在自己身上。

# 二十一、识分定
那宝玉一心裁夺盘算，痴痴的回至怡红院中，正值林黛玉和袭人坐著说话儿呢。|宝玉一心琢磨着，痴痴呆呆地回到怡红院，正赶上林黛玉和袭人坐着说话。
宝玉一进来，就和袭人长叹，说道：“我昨晚上的话竟说错了，怪道老爷说我是‘管窥蠡测’。|宝玉一进来，就对袭人长叹道：“我昨天晚上的话竟然说错了，怪不得老爷说我是‘管窥蠡测’。
昨夜说你们的眼泪单葬我，这就错了。我竟不能全得了。|昨晚说你们的眼泪只葬我一个，这就错了。我竟然不能全得到。
从此后只是各人各得眼泪罢了。”|从今以后，只能各人得各人的眼泪罢了。”
袭人昨夜不过是些顽话，已经忘了，不想宝玉今又提起来，便笑道：“你可真真有些疯了。”|袭人昨晚只当是些玩笑话，早已忘了，没想到宝玉今天又提起来，就笑道：“你可真是有些疯了。”
宝玉默默不对，自此深悟人生情缘，各有分定，|宝玉默默不答，从此深深领悟到人生的情缘，各有定分，
只是每每暗伤“不知将来葬我洒泪者为谁？”|只是常常暗自伤心：“不知道将来为我落泪送葬的会是谁？”
此皆宝玉心中所怀，也不可十分妄拟。|这些都是宝玉心里的想法，也不能随便揣测。
! “管窥蠡测”是用竹管看天、用瓢量海，比喻见识狭小。宝玉以为天下女孩子的眼泪都该为他流，看了龄官才知道，她的眼泪是为贾蔷流的。
! 回目“识分定情悟梨香院”：在梨香院，宝玉领悟到每个人的情缘都是注定的，“各人各得眼泪”。
! “不知将来葬我洒泪者为谁”，正和黛玉《葬花吟》“他年葬侬知是谁”遥相呼应。两人问的是同一个问题。

# 二十二、湘云回家
且说林黛玉当下见了宝玉如此形象，便知是又从那里著了魔来，也不便多问，|林黛玉当时见宝玉这个样子，就知道他又是从哪里着了魔回来，也不便多问，
因向他说道：“我才在舅母跟前听的明儿是薛姨妈的生日，叫我顺便来问你出去不出去。你打发人前头说一声去。”|就对他说：“我刚才在舅母那里听说明天是薛姨妈的生日，叫我顺便来问你去不去。你打发人到前面说一声去。”
宝玉道：“上回连大老爷的生日我也没去，这会子我又去，倘或碰见了人呢？我一概都不去。|宝玉说：“上回连大老爷的生日我都没去，这回我又去，要是碰见了人呢？我一概都不去。
这么怪热的，又穿衣裳，我不去姨妈也未必恼。”|这么热的天，又要穿礼服，我不去姨妈也不一定会恼。”
袭人忙道：“这是什么话？他比不得大老爷。这里又住的近，又是亲戚，你不去岂不叫他思量。|袭人连忙说：“这是什么话？她和大老爷不一样。这里又住得近，又是亲戚，你不去岂不叫她多心。
你怕热，只清早起到那里磕个头，吃钟茶再来，岂不好看。”|你怕热，只要一大早到那里磕个头，喝杯茶再回来，岂不体面。”
宝玉未说话，黛玉便先笑道：“你看著人家赶蚊子分上，也该去走走。”|宝玉还没说话，黛玉就先笑道：“你看在人家替你赶蚊子的份上，也该去走走。”
宝玉不解，忙问：“怎么赶蚊子？”|宝玉不明白，连忙问：“怎么赶蚊子？”
袭人便将昨日睡觉无人作伴，宝姑娘坐了一坐的话说了出来。|袭人就把昨天他睡觉时没人陪着，宝姑娘坐了一会儿的事说了出来。
宝玉听了，忙说：“不该。我怎么睡著了，亵渎了他。”|宝玉听了，连忙说：“不该。我怎么睡着了，怠慢了她。”
一面又说：“明日必去。”|一边又说：“明天一定去。”
! 黛玉那句“赶蚊子”，说的就是昨天窗外看见的那一幕。她到底还是说出来了，只是说得轻巧，像个玩笑。
! 宝玉不知道自己说了梦话，只说“亵渎了他”。他梦里喊的是“木石”，醒来对宝钗却是满心敬重。

# 二十三、“时常提著打发人接我去”
正说著，忽见史湘云穿的齐齐整整的走来辞说家里打发人来接他。|正说着，忽然看见史湘云穿得整整齐齐地走来辞行，说家里打发人来接她了。
宝玉林黛玉听说，忙站起来让坐。|宝玉、林黛玉听了，连忙站起来让座。
史湘云也不坐，宝林两个只得送他至前面。|史湘云也不坐，宝玉、黛玉两人只好送她到前面去。
那史湘云只是眼泪汪汪的，见有他家人在跟前，又不敢十分委曲。|史湘云只是眼泪汪汪的，见她家里的人在跟前，又不敢太露出委屈来。
少时薛宝钗赶来，愈觉缱绻难舍。|一会儿薛宝钗赶来了，越发觉得依依难舍。
还是宝钗心内明白，他家人若回去告诉了他婶娘，待他家去又恐受气，因此倒催他走了。|还是宝钗心里明白，她家的人要是回去告诉了她婶娘，等她回家去又怕受气，所以反倒催她快走。
众人送至二门前，宝玉还要往外送，倒是湘云拦住了。|大家送到二门前，宝玉还要往外送，倒是湘云拦住了他。
一时，回身又叫宝玉到跟前，悄悄的嘱道：“便是老太太想不起我来，你时常提著打发人接我去。”|过了一会儿，她又回身把宝玉叫到跟前，悄悄嘱咐道：“就算老太太想不起我来，你也要常常提着，打发人去接我。”
宝玉连连答应了。|宝玉连连答应了。
眼看著他上车去了，大家方才进来。|眼看着她上车走了，大家才回来。
要知端的，且听下回分解。|要知后事如何，请看下回。
! 湘云在家里“作不得主”，要做针线到三更，所以舍不得走，又不敢哭。宝钗最懂，怕她回去受婶娘的气，反倒催她快走。宝钗的体贴，总是这样不动声色。
! “你时常提著打发人接我去”，湘云最怕被忘记。第三十七回大观园起诗社，宝玉果然想起了她，立逼着贾母派人去接。
</script>
<script type="text/plain" id="ch37">
# 一、贾政点了学差
这年贾政又点了学差，择于八月二十日起身。|这一年贾政又被派了学差，选在八月二十日动身。
是日拜过宗祠及贾母起身，宝玉诸子弟等送至洒泪亭。|那天他拜过宗祠，辞别了贾母动身，宝玉和子弟们一直送到洒泪亭。
却说贾政出门去后，外面诸事不能多记。|贾政出门以后，外面的事不能一一细说。
单表宝玉每日在园中任意纵性的逛荡，真把光阴虚度，岁月空添。|单说宝玉每天在园子里随心所欲地闲逛，真是虚度光阴，白白长了岁数。
! 学差是朝廷派到各省去主持考试、督察学务的官，一去就是几年。贾政一走，宝玉头上再也没有人管了，大观园里最快活的日子从这里开始。
! “洒泪亭”，送别的地方叫这个名字，送走的是严父，宝玉心里大概并不怎么洒泪。

# 二、探春的花笺
这日正无聊之际，只见翠墨进来，手里拿著一副花笺送与他。|这天宝玉正闲得无聊，只见翠墨进来，手里拿着一张花笺送给他。
宝玉因道：“可是我忘了，才说要瞧瞧三妹妹去的，可好些了，你偏走来。”|宝玉就说：“可不是我忘了，刚才还说要去看看三妹妹的，她好些了吗，你倒先来了。”
翠墨道：“姑娘好了，今儿也不吃药了，不过是凉著一点儿。”|翠墨说：“姑娘好了，今天也不吃药了，不过是受了点凉。”
宝玉听说，便展开花笺看时，上面写道：|宝玉听了，就展开花笺看，上面写着：
娣探谨奉二兄文几：前夕新霁，月色如洗，因惜清景难逢，讵忍就卧，|妹妹探春恭敬地写给二哥书桌前：前天晚上雨后初晴，月色明亮得像洗过一样，因为珍惜这难得的美景，怎么忍心就去睡觉，
时漏已三转，犹徘徊于桐槛之下，未防风露所欺，致获采薪之患。|那时已经三更天了，还在梧桐树下的栏杆边徘徊，没想到被风露所侵，得了点小病。
昨蒙亲劳抚嘱，复又数遣侍儿问切，兼以鲜荔并真卿墨迹见赐，何痌瘃惠爱之深哉！|昨天承蒙你亲自来慰问叮嘱，又几次派丫头来关切问候，还送来了新鲜荔枝和颜真卿的墨迹，对我的关怀爱护多么深啊！
今因伏几凭床处默之时，因思及历来古人中处名攻利敌之场，犹置一些山滴水之区，|今天趁着靠着桌子、倚着床静坐的时候，想起历来古人即使身处争名夺利的场所，还要留出一点山水之地，
远招近揖，投辖攀辕，务结二三同志盘桓于其中，|远远近近地邀请朋友，热情挽留客人，一定要结交两三个志同道合的人在其中流连，
或竖词坛，或开吟社，虽一时之偶兴，遂成千古之佳谈。|或者设立词坛，或者开办诗社，虽然只是一时兴起，却成了千古流传的佳话。
娣虽不才，窃同叨栖处于泉石之间，而兼慕薛林之技。|妹妹虽然没什么才能，私下里也有幸住在这泉石之间，又一向仰慕宝钗、黛玉的才华。
风庭月榭，惜未宴集诗人，帘杏溪桃，或可醉飞吟盏。|有清风的庭院、有明月的亭榭，可惜还没有招集诗人宴饮；帘外的杏花、溪边的桃花，或许可以让我们醉中吟诗传杯。
孰谓莲社之雄才，独许须眉，直以东山之雅会，让余脂粉。|谁说结诗社的才华只属于男人？东山那样的风雅聚会，也可以让给我们女子。
若蒙棹雪而来，娣则扫花以待。此谨奉。|如果你能像王子猷雪夜乘船访友那样来，妹妹就扫开落花等候。特此奉上。
! 探春这封信写得极雅，用了一连串典故。“莲社”是东晋慧远在庐山结的白莲社，“东山”是谢安隐居东山、与名士雅集。探春说这些雅事不该只有男人做，女孩子也能做。
! “兼慕薛林之技”，探春起诗社，最看重的是宝钗和黛玉的诗才。
! “棹雪而来”用王子猷雪夜乘船访戴逵的典故。探春把哥哥比作名士，自己扫花以待，姐妹之间的情谊写得风雅动人。

# 三、贾芸送海棠
宝玉看了，不觉喜的拍手笑道：“倒是三妹妹的高雅，我如今就去商议。”|宝玉看了，不由得高兴得拍手笑道：“还是三妹妹高雅，我现在就去商量。”
一面说，一面就走，翠墨跟在后面。|一边说，一边就走，翠墨跟在后面。
刚到了沁芳亭，只见园中后门上值日的婆子手里拿著一个字帖走来，|刚到沁芳亭，只见园子后门值班的婆子手里拿着一张字帖走来，
见了宝玉，便迎上去，口内说道：“芸哥儿请安，在后门只等著，叫我送来的。”|见了宝玉，就迎上去，嘴里说：“芸哥儿来请安，在后门等着，叫我送来的。”
宝玉打开看时，写道是：|宝玉打开一看，上面写的是：
不肖男芸恭请父亲大人万福金安。|不孝的儿子贾芸恭敬地请父亲大人万福金安。
男思自蒙天恩，认于膝下，日夜思一孝顺，竟无可孝顺之处。|儿子想自从承蒙天恩，认在您的膝下，日夜想着要孝顺您，竟然找不到可以孝顺的地方。
前因买办花草，上托大人金福，竟认得许多花儿匠，并认得许多名园。|前些时候因为采买花草，托大人的洪福，竟然认识了许多花匠，又认识了许多有名的园子。
因忽见有白海棠一种，不可多得。故变尽方法，只弄得两盆。|因为忽然看见有一种白海棠，很难得。所以想尽办法，只弄到两盆。
大人若视男是亲男一般，便留下赏玩。|大人要是把儿子当作亲儿子一样看待，就请留下赏玩。
因天气暑热，恐园中姑娘们不便，故不敢面见。|因为天气炎热，怕园中的姑娘们不方便，所以不敢当面拜见。
奉书恭启，并叩台安！ 男芸跪书。|写信恭敬奉上，并叩问您安好！儿子贾芸跪着写。
宝玉看了，笑道：“独他来了，还有什么人？”|宝玉看了，笑道：“只有他一个人来了，还有别人吗？”
婆子道：“还有两盆花儿。”|婆子说：“还有两盆花。”
宝玉道：“你出去说，我知道了，难为他想著。你便把花儿送到我屋里去就是了。”|宝玉说：“你出去说，我知道了，难为他想着。你就把花送到我屋里去吧。”
一面说，一面同翠墨往秋爽斋来，只见宝钗，黛玉，迎春，惜春已都在那里了。|一边说，一边和翠墨往秋爽斋走，只见宝钗、黛玉、迎春、惜春都已经在那里了。
! 两封信放在一起，一雅一俗：探春的信典雅清丽，贾芸的信满纸“父亲大人”“男芸跪书”。贾芸比宝玉大好几岁，第二十四回认宝玉作“父亲”，这里写信也毕恭毕敬。
! 贾芸送的白海棠，正好成了诗社的第一个题目。一个旁支子弟的巴结，无意中成全了一段风雅。
! 宝玉问“还有什么人”，婆子答“还有两盆花儿”，答非所问，十分有趣。

# 四、众人聚秋爽斋
众人见他进来，都笑说：“又来了一个。”|大家见他进来，都笑着说：“又来了一个。”
探春笑道：“我不算俗，偶然起个念头，写了几个帖儿试一试，谁知一招皆到。”|探春笑道：“我还不算俗吧，偶然起了个念头，写了几张帖子试一试，谁知一请都来了。”
宝玉笑道：“可惜迟了，早该起个社的。”|宝玉笑道：“可惜晚了，早就该起个诗社的。”
黛玉道：“你们只管起社，可别算上我，我是不敢的。”|黛玉说：“你们只管起社，可别算上我，我是不敢的。”
迎春笑道：“你不敢谁还敢呢。”|迎春笑道：“你不敢，谁还敢呢。”
宝玉道：“这是一件正经大事，大家鼓舞起来，不要你谦我让的。|宝玉说：“这是一件正经大事，大家都打起精神来，不要你谦我让的。
各有主意自管说出来大家平章。宝姐姐也出个主意，林妹妹也说个话儿。”|各人有什么主意只管说出来，大家商量。宝姐姐也出个主意，林妹妹也说句话。”
宝钗道：“你忙什么，人还不全呢。”|宝钗说：“你急什么，人还没到齐呢。”
一语未了，李纨也来了，进门笑道：“雅的紧！要起诗社，我自荐我掌坛。|话还没说完，李纨也来了，进门笑道：“雅得很！要起诗社，我自荐当社长。
前儿春天我原有这个意思的。|今年春天我本来就有这个意思。
我想了一想，我又不会作诗，瞎乱些什么，因而也忘了，就没有说得。|我想了想，我又不会作诗，瞎张罗什么，所以也就忘了，没有说出来。
既是三妹妹高兴，我就帮你作兴起来。”|既然三妹妹有兴致，我就帮你张罗起来。”
! 宝玉说起诗社是“正经大事”。他平时最怕正经事，这件不是功名的“正经”，他最上心。
! 黛玉说“我是不敢的”，其实她最会作诗，下面一挥而就。她这是谦辞，也是故意要人来请。

# 五、起别号
黛玉道：“既然定要起诗社，咱们都是诗翁了，先把这些姐妹叔嫂的字样改了才不俗。”|黛玉说：“既然一定要起诗社，咱们都是诗翁了，先把这些姐姐妹妹、叔叔嫂子的称呼改了才不俗。”
李纨道：“极是，何不大家起个别号，彼此称呼则雅。|李纨说：“对极了，何不大家起个别号，彼此用别号称呼才雅。
我是定了‘稻香老农’，再无人占的。”|我就定了‘稻香老农’，再没人跟我抢的。”
探春笑道：“我就是‘秋爽居士’罢。”|探春笑道：“我就叫‘秋爽居士’吧。”
宝玉道：“居士，主人到底不恰，且又瘰赘。|宝玉说：“‘居士’‘主人’这类到底不恰当，又显得累赘。
这里梧桐芭蕉尽有，或指梧桐芭蕉起个倒好。”|你那里梧桐芭蕉都有，或者就拿梧桐芭蕉起个名倒好。”
探春笑道：“有了，我最喜芭蕉，就称‘蕉下客’罢。”|探春笑道：“有了，我最喜欢芭蕉，就叫‘蕉下客’吧。”
众人都道别致有趣。|大家都说别致有趣。
黛玉笑道：“你们快牵了他去，炖了脯子吃酒。”|黛玉笑道：“你们快把她牵走，炖成肉干下酒。”
众人不解。|大家不明白。
黛玉笑道：“古人曾云‘蕉叶覆鹿’。他自称‘蕉下客’，可不是一只鹿了？快做了鹿脯来。”|黛玉笑道：“古人说过‘蕉叶覆鹿’。她自称‘蕉下客’，可不就是一只鹿了？快做成鹿肉干来。”
众人听了都笑起来。|大家听了都笑起来。
! 李纨住稻香村，号“稻香老农”。她是寡妇，心如槁木，只守着儿子过日子，号也起得最朴素。
! “蕉叶覆鹿”出自《列子》：一个樵夫打死一只鹿，用蕉叶盖起来，后来忘了藏在哪里，以为是做了一场梦。黛玉一个典故，把探春说成了鹿。她的嘴快，学问也深。

# 六、潇湘妃子、蘅芜君
探春因笑道：你别忙中使巧话来骂人，我已替你想了个极当的美号了。”|探春就笑道：“你别忙着用巧话骂人，我已经替你想好了一个最恰当的雅号。”
又向众人道：“当日娥皇女英洒泪在竹上成斑，故今斑竹又名湘妃竹。|又对大家说：“当年娥皇、女英把眼泪洒在竹子上成了斑点，所以现在斑竹又叫湘妃竹。
如今他住的是潇湘馆，他又爱哭，将来他想林姐夫，那些竹子也是要变成斑竹的。|如今她住的是潇湘馆，她又爱哭，将来她想林姐夫的时候，那些竹子也要变成斑竹的。
以后都叫他作‘潇湘妃子’就完了。”|以后都叫她‘潇湘妃子’就行了。”
大家听说，都拍手叫妙。|大家听了，都拍手叫好。
林黛玉低了头方不言语。|林黛玉低着头，这才不说话了。
李纨笑道：“我替薛大妹妹也早已想了个好的，也只三个字。”|李纨笑道：“我替薛大妹妹也早就想好了一个，也是三个字。”
惜春迎春都问是什么。|惜春、迎春都问是什么。
李纨道：“我是封他‘蘅芜君’了，不知你们如何。”|李纨说：“我封她做‘蘅芜君’，不知道你们觉得怎么样。”
探春笑道：“这个封号极好。”|探春笑道：“这个封号非常好。”
! 娥皇、女英是尧的女儿、舜的妃子。舜南巡死在苍梧，二妃哭泣，泪洒在竹上成了斑点，后来投湘水而死。“潇湘妃子”这个号，暗含了黛玉以泪还债、为情而死的结局。
! 探春说“将来他想林姐夫”，林姐夫就是黛玉将来的丈夫。大家都知道是谁，黛玉也知道，所以“低了头方不言语”。
! 宝钗住蘅芜苑，蘅芜是一种香草。宝钗的号最平实，正像她的为人。

# 七、宝玉的号
宝玉道：“我呢？你们也替我想一个。”|宝玉说：“我呢？你们也替我想一个。”
宝钗笑道：“你的号早有了，‘无事忙’三字恰当的很。”|宝钗笑道：“你的号早就有了，‘无事忙’三个字最恰当了。”
李纨道：“你还是你的旧号‘绛洞花主’就好。”|李纨说：“你还是用你的老号‘绛洞花主’就好。”
宝玉笑道：“小时候干的营生，还提他作什么。”|宝玉笑道：“小时候干的事，还提它做什么。”
探春道：“你的号多的很，又起什么。我们爱叫你什么，你就答应著就是了。”|探春说：“你的号多得很，还起什么。我们爱叫你什么，你就答应着就是了。”
宝钗道：“还得我送你个号罢。有最俗的一个号，却于你最当。|宝钗说：“还是我送你一个号吧。有一个最俗的号，对你却最恰当。
天下难得的是富贵，又难得的是闲散，这两样再不能兼有，不想你兼有了，就叫你‘富贵闲人’也罢了。”|天下难得的是富贵，又难得的是清闲，这两样从来不能兼得，没想到你都占全了，就叫你‘富贵闲人’吧。”
宝玉笑道：“当不起，当不起，倒是随你们混叫去罢。”|宝玉笑道：“当不起，当不起，还是随你们乱叫吧。”
! “无事忙”“富贵闲人”，都是宝钗起的。宝钗看宝玉最清楚：没有正经事，却整天忙个不停；又富贵又清闲，什么都不缺，什么也不做。
! “富贵闲人”听着是夸，其实里面也有讽刺。宝钗总希望宝玉去做点正事。
! “绛洞花主”是宝玉小时候给自己起的号，意思是花丛中的主人。

# 八、菱洲、藕榭
李纨道：“二姑娘四姑娘起个什么号？”|李纨说：“二姑娘、四姑娘起什么号？”
迎春道：“我们又不大会诗，白起个号作什么？”|迎春说：“我们又不大会作诗，白起个号做什么？”
探春道：“虽如此，也起个才是。”|探春说：“话虽这么说，也该起一个才是。”
宝钗道：“他住的是紫菱洲，就叫他‘菱洲’，四丫头在藕香榭，就叫他‘藕榭’就完了。”|宝钗说：“她住的是紫菱洲，就叫她‘菱洲’；四丫头住在藕香榭，就叫她‘藕榭’就行了。”
! 迎春、惜春不会作诗，号也最随便，就用住处的名字。迎春懦弱、惜春冷淡，在诗社里也是陪衬。

# 九、李纨定社规
李纨道：“就是这样好。但序齿我大，你们都要依我的主意，管情说了大家合意。|李纨说：“就这样好。不过论年纪我最大，你们都要听我的主意，保管说出来大家都满意。
我们七个人起社，我和二姑娘四姑娘都不会作诗，须得让出我们三个人去。我们三个各分一件事。”|我们七个人起社，我和二姑娘、四姑娘都不会作诗，得把我们三个人让出去。我们三个各管一件事。”
探春笑道：“已有了号，还只管这样称呼，不如不有了。以后错了，也要立个罚约才好。”|探春笑道：“已经有了号，还这样叫来叫去，不如没有。以后叫错了，也要定个罚规才好。”
李纨道：“立定了社，再定罚约。我那里地方大，竟在我那里作社。|李纨说：“先把诗社立起来，再定罚规。我那里地方大，就在我那里作社。
我虽不能作诗，这些诗人竟不厌俗客，我作个东道主人，我自然也清雅起来了。|我虽然不会作诗，这些诗人要是不嫌弃我这个俗客，我做个东道主，我自然也就清雅起来了。
若是要推我作社长，我一个社长自然不够，必要再请两位副社长，就请菱洲藕榭二位学究来，|要是推我做社长，我一个社长自然不够，必须再请两位副社长，就请菱洲、藕榭两位先生来，
一位出题限韵，一位誊录监场。|一位负责出题限韵，一位负责誊写监场。
亦不可拘定了我们三个人不作，若遇见容易些的题目韵脚，我们也随便作一首。|也不一定我们三个人就不作，要是遇到容易些的题目韵脚，我们也随便作一首。
你们四个却是要限定的。若如此便起，若不依我，我也不敢附骥了。”|你们四个却是一定要作的。这样就起社，要是不依我，我也不敢跟着了。”
迎春惜春本性懒于诗词，又有薛林在前，听了这话便深合己意，二人皆说：“极是”。|迎春、惜春本来就懒得作诗，又有宝钗、黛玉在前面，听了这话正合心意，两人都说：“对极了。”
探春等也知此意，见他二人悦服，也不好强，只得依了。|探春等人也明白这个意思，见她们两个都高兴，也不好勉强，只好依了。
因笑道：“这话也罢了，只是自想好笑，好好的我起了个主意，反叫你们三个来管起我来了。”|就笑道：“这话也罢了，只是想想好笑，好好的我出了个主意，反倒叫你们三个来管我了。”
宝玉道：“既这样，咱们就往稻香村去。”|宝玉说：“既然这样，咱们就到稻香村去。”
李纨道：“都是你忙，今日不过商议了，等我再请。”|李纨说：“就你着急，今天不过是商量商量，等我以后再请。”
宝钗道：“也要议定几日一会才好。”|宝钗说：“也要商定几天聚一次才好。”
探春道：“若只管会的多，又没趣了。一月之中，只可两三次才好。”|探春说：“要是聚得太多，又没意思了。一个月里，只聚两三次才好。”
宝钗点头道：“一月只要两次就够了。”|宝钗点头说：“一个月只要两次就够了。
拟定日期，风雨无阻。|定好日子，风雨无阻。
除这两日外，倘有高兴的，他情愿加一社的，或情愿到他那里去，或附就了来，亦可使得，岂不活泼有趣。”|除了这两天以外，要是有人高兴，愿意另加一社，或者愿意到她那里去，或者凑到一起来，也都可以，岂不活泼有趣。”
众人都道：“这个主意更好。”|大家都说：“这个主意更好。”
! 起诗社的是探春，管诗社的却是李纨。探春有主意，李纨有身份，二人各得其所。
! 七个人里，作诗的是宝玉、宝钗、黛玉、探春四个。不会作诗的三个，正好一个评，一个出题，一个监场。

# 十、限韵
探春道：“只是原系我起的意，我须得先作个东道主人，方不负我这兴。”|探春说：“只是这原是我出的主意，我得先做一回东道主，才不辜负我这番兴致。”
李纨道：“既这样说，明日你就先开一社如何？”|李纨说：“既然这么说，明天你就先开一社，怎么样？”
探春道：“明日不如今日，此刻就很好。你就出题，菱洲限韵，藕榭监场。”|探春说：“明天不如今天，现在就很好。你就出题，菱洲限韵，藕榭监场。”
迎春道：“依我说，也不必随一人出题限韵，竟是拈阄公道。”|迎春说：“依我说，也不必由一个人出题限韵，还是抓阄公平。”
李纨道：“方才我来时，看见他们抬进两盆白海棠来，倒是好花。你们何不就咏起他来？”|李纨说：“刚才我来的时候，看见他们抬进两盆白海棠来，倒是好花。你们何不就咏它？”
迎春道：“都还未赏，先倒作诗。”|迎春说：“还没赏花，倒先作诗。”
宝钗道：“不过是白海棠，又何必定要见了才作。|宝钗说：“不过是白海棠，又何必一定要看见了才作。
古人的诗赋，也不过都是寄兴写情耳。若都是等见了作，如今也没这些诗了。”|古人的诗赋，也不过都是寄托兴致、抒写情怀罢了。要是都等看见了才作，如今也没有这些诗了。”
迎春道：“既如此，待我限韵。”|迎春说：“既然这样，等我来限韵。”
说著，走到书架前抽出一本诗来，随手一揭，这首竟是一首七言律，递与众人看了，都该作七言律。|说着，走到书架前抽出一本诗集来，随手一翻，翻到的是一首七言律诗，递给大家看了，就都该作七言律诗。
迎春掩了诗，又向一个小丫头道：“你随口说一个字来。”|迎春合上诗集，又对一个小丫头说：“你随口说一个字。”
那丫头正倚门立著，便说了个“门”字。|那丫头正靠着门站着，就说了个“门”字。
迎春笑道：“就是门字韵，‘十三元’了。头一个韵定要这‘门’字。”|迎春笑道：“就用门字韵，属于‘十三元’韵部。第一个韵脚一定要用这个‘门’字。”
说著，又要了韵牌匣子过来，抽出“十三元”一屉，又命那小丫头随手拿四块。|说着，又要来韵牌匣子，抽出“十三元”那一格，又叫那小丫头随手拿四块。
那丫头便拿了”盆”“魂”“痕”“昏”四块来。|那丫头就拿了“盆”“魂”“痕”“昏”四块来。
宝玉道：“这‘盆’‘门’两个字不大好作呢！”|宝玉说：“这‘盆’‘门’两个字不大好作呢！”
! 宝钗说诗是“寄兴写情”，不必见了才写。这是宝钗的诗论：写诗靠的是心，不是眼。
! 小丫头靠着门说了个“门”字，韵就这样定了。偶然得来的韵，倒最见诗人的本事。

# 十一、梦甜香
待书一样预备下四份纸笔，便都悄然各自思索起来。|待书照样预备了四份纸笔，大家就都静悄悄地各自思索起来。
独黛玉或抚梧桐，或看秋色，或又和丫鬟们嘲笑。|只有黛玉一会儿抚摸梧桐，一会儿看看秋色，一会儿又和丫鬟们说笑。
迎春又令丫鬟炷了一支”梦甜香”。|迎春又叫丫鬟点了一支“梦甜香”。
原来这”梦甜香”只有三寸来长，有灯草粗细，以其易烬，故以此烬为限，如香烬未成便要罚。|原来这“梦甜香”只有三寸来长，灯草那么粗细，因为它容易烧完，就用它烧完为限，香烧完了还没作成就要罚。
一时探春便先有了，自提笔写出，又改抹了一回，递与迎春。|一会儿探春先作好了，自己提笔写出来，又涂改了一番，递给迎春。
因问宝钗：“蘅芜君，你可有了？”|又问宝钗：“蘅芜君，你作好了吗？”
宝钗道：“有却有了，只是不好。”|宝钗说：“有倒是有了，只是不好。”
宝玉背著手，在回廊上踱来踱去，因向黛玉说道：“你听，他们都有了。”|宝玉背着手，在回廊上走来走去，就对黛玉说：“你听，她们都有了。”
黛玉道：“你别管我。”|黛玉说：“你别管我。”
宝玉又见宝钗已誊写出来，因说道：“了不得！香只剩了一寸了，我才有了四句。”|宝玉又见宝钗已经誊写出来了，就说：“不得了！香只剩一寸了，我才有了四句。”
又向黛玉道：“香就完了，只管蹲在那潮地下作什么？”|又对黛玉说：“香就要完了，你只管蹲在那潮地上做什么？”
黛玉也不理。|黛玉也不理他。
宝玉道：“可顾不得你了，好歹也写出来罢。”说著也走在案前写了。|宝玉说：“可顾不得你了，好歹我也写出来吧。”说着也走到桌前写了。
李纨道：“我们要看诗了，若看完了还不交卷是必罚的。”|李纨说：“我们要看诗了，要是看完了还不交卷，一定要罚。”
宝玉道：“稻香老农虽不善作却善看，又最公道，你就评阅优劣，我们都服的。”|宝玉说：“稻香老农虽然不善于作诗，却善于评诗，又最公道，你来评定好坏，我们都服气。”
众人都道：“自然。”|大家都说：“自然。”
于是先看探春的稿上写道是：|于是先看探春的诗稿，上面写的是：
! 人人都在苦思，黛玉却抚梧桐、看秋色、和丫鬟说笑。她不急，因为她根本不用苦想。
! 宝玉自己作不出来，还替黛玉着急。他心里最在意的，是黛玉别落了后。

# 十二、探春与宝钗的诗
咏白海棠·限门盆魂痕昏|《咏白海棠》，限用门、盆、魂、痕、昏五个韵字
~斜阳寒草带重门，苔翠盈铺雨后盆。|夕阳寒草围绕着一重重院门，雨后的花盆里铺满了翠绿的青苔。
~玉是精神难比洁，雪为肌骨易销魂。|它以玉为精神，那份洁白无可比拟；以雪为肌骨，叫人见了心动神摇。
~芳心一点娇无力，倩影三更月有痕。|一点芳心娇柔无力，三更的月光下留下它美丽的影子。
~莫谓缟仙能羽化，多情伴我咏黄昏。|别说这白衣仙子会羽化飞去，它多情地陪伴我吟诗到黄昏。
次看宝钗的是：|接着看宝钗的诗：
~珍重芳姿昼掩门，自携手瓮灌苔盆。|珍惜它的美好姿态，白天也关着门，亲自提着水瓮去浇灌长着青苔的花盆。
~胭脂洗出秋阶影，冰雪招来露砌魂。|洗去了胭脂，台阶上映出它秋天的素影；招来冰雪，露水打湿的石阶上凝着它的魂魄。
~淡极始知花更艳，愁多焉得玉无痕。|淡到了极点，才知道这花更加艳丽；愁绪太多，玉一样的花怎能没有泪痕。
~欲偿白帝凭清洁，不语婷婷日又昏。|想要报答秋神，只凭着这份清白；它默默无言，亭亭玉立，又到了黄昏。
李纨笑道：“到底是蘅芜君。”|李纨笑道：“到底是蘅芜君。”
说著又看宝玉的，道是：|说着又看宝玉的，写的是：
! 探春的诗写得开阔，“玉是精神难比洁”，有她自己的清高。
! 宝钗的“淡极始知花更艳”是名句，说的是海棠，也是她自己：不施脂粉、衣着朴素，却自有一种艳。“珍重芳姿昼掩门”，宝钗一向端庄自守，这一句正是她的写照。
! “白帝”是西方之神，掌管秋天。宝钗的海棠“凭清洁”报答秋神，就是守着自己的清白本分。

# 十三、宝玉的诗
~秋容浅淡映重门，七节攒成雪满盆。|秋天淡雅的姿容映照着一重重门，七节花枝攒聚，像满盆白雪。
~出浴太真冰作影，捧心西子玉为魂。|像刚出浴的杨贵妃，以冰为影；像捧着心口的西施，以玉为魂。
~晓风不散愁千点，宿雨还添泪一痕。|晨风吹不散它千点愁绪，夜雨又给它添了一道泪痕。
~独倚画栏如有意，清砧怨笛送黄昏。|它独自倚着画栏，好像有什么心意，捣衣声和哀怨的笛声送走了黄昏。
大家看了，宝玉说探春的好，李纨才要推宝钗这诗有身分，因又催黛玉。|大家看了，宝玉说探春的好，李纨正要推宝钗的诗最有身份，就又催黛玉。
黛玉道：“你们都有了？”|黛玉说：“你们都有了？”
说著提笔一挥而就，掷与众人。|说着提笔一挥就写成了，扔给大家。
李纨等看他写道是：|李纨等人看她写的是：
! 宝玉把海棠比作“出浴太真”“捧心西子”，杨贵妃和西施，比的是美人，不是花，有些俗。
! 黛玉等大家都写完了，才“一挥而就”，又“掷与众人”。她的才情和骄傲，都在这一挥一掷里。

# 十四、黛玉的诗
~半卷湘帘半掩门，碾冰为土玉为盆。|湘竹帘子半卷，门儿半掩，把冰碾碎当作泥土，拿玉做成花盆。
看了这句，宝玉先喝起彩来，只说”从何处想来！”又看下面道：|看了这两句，宝玉先叫起好来，只说：“这是从哪里想出来的！”又看下面写道：
~偷来梨蕊三分白，借得梅花一缕魂。|偷来梨花的三分洁白，借来梅花的一缕精魂。
众人看了也都不禁叫好，说“果然比别人又是一样心肠。”又看下面道是：|大家看了也都不由得叫好，说：“果然和别人的心思不一样。”又看下面写的是：
~月窟仙人缝缟袂，秋闺怨女拭啼痕。|像月宫里的仙女缝制白色的衣袖，又像秋夜闺中的怨女擦拭泪痕。
~娇羞默默同谁诉，倦倚西风夜已昏。|它娇羞默默，满腹心事向谁诉说？疲倦地倚着西风，夜已经深了。
! “碾冰为土玉为盆”，别人写花盆里的青苔、泥土，黛玉一下子写成冰和玉，整首诗立刻空灵起来。
! “偷来梨蕊三分白，借得梅花一缕魂”，是黛玉诗中最有名的一联，用“偷”“借”两个字，写出了海棠的白和清。
! “秋闺怨女拭啼痕”“娇羞默默同谁诉”，写的是海棠，也是黛玉自己：满腹心事，无人可诉。

# 十五、李纨评诗
众人看了，都道是这首为上。|大家看了，都说这首最好。
李纨道：“若论风流别致，自是这首，若论含蓄浑厚，终让蘅稿。”|李纨说：“要论风流别致，自然是这首；要论含蓄浑厚，还是要让蘅芜君这一首。”
探春道：“这评的有理，潇湘妃子当居第二。”|探春说：“这评得有道理，潇湘妃子应该排第二。”
李纨道：“怡红公子是压尾，你服不服？”|李纨说：“怡红公子排最后，你服不服？”
宝玉道：“我的那首原不好了，这评的最公。”|宝玉说：“我那首本来就不好，这评得最公道。”
又笑道：“只是蘅潇二首还要斟酌。”|又笑道：“只是宝钗和黛玉的两首，名次还要再斟酌。”
李纨道：“原是依我评论，不与你们相干，再有多说者必罚。”|李纨说：“本来就是按我的评，不关你们的事，再有多嘴的一定罚。”
宝玉听说，只得罢了。|宝玉听了，只好作罢。
! 大家都说黛玉第一，李纨却判宝钗第一。“风流别致”对“含蓄浑厚”，这也是两人为人的分别：一个才华外露，一个藏而不露。
! 李纨是寡妇，最讲究守礼含蓄，她偏爱宝钗是自然的。宝玉不服，替黛玉争，被李纨一句“必罚”堵了回去。
! “怡红公子”是宝玉在诗社里的号，因为他住怡红院。

# 十六、海棠社
李纨道：“从此后我定于每月初二、十六这两日开社，出题限韵都要依我。|李纨说：“从今以后，我定在每月初二、十六这两天开社，出题限韵都要听我的。
这其间你们有高兴的，你们只管另择日子补开，那怕一个月每天都开社，我只不管。|这中间你们有高兴的，只管另外选日子补开，哪怕一个月每天都开社，我也不管。
只是到了初二，十六这两日，是必往我那里去。”|只是到了初二、十六这两天，一定要到我那里去。”
宝玉道：“到底要起个社名才是。”|宝玉说：“到底要起个社名才是。”
探春道：“俗了又不好，特新了，刁钻古怪也不好。|探春说：“太俗了不好，太新奇了、刁钻古怪也不好。
可巧才是海棠诗开端，就叫个海棠社罢。虽然俗些，因真有此事，也就不碍了。”|正好是从海棠诗开头的，就叫海棠社吧。虽然俗了点，因为确实有这件事，也就不要紧了。”
说毕大家又商议了一回，略用些酒果，方各自散去。|说完大家又商量了一会儿，稍微吃了些酒和水果，才各自散了。
也有回家的，也有往贾母王夫人处去的。当下别人无话。|有回自己屋里的，也有到贾母、王夫人那里去的。当下别人没有什么话。
! 回目“秋爽斋偶结海棠社”。大观园的诗社，是女孩子们一生最风雅、最自由的时光。
! 海棠是因为贾芸送了两盆，社也就叫了海棠社。这么大的风雅事，起因却是一个旁支子弟的巴结。

# 十七、袭人打点送湘云东西
且说袭人因见宝玉看了字贴儿便慌慌张张的同翠墨去了，也不知是何事。|再说袭人见宝玉看了字帖就慌慌张张地跟翠墨走了，也不知道是什么事。
后来又见后门上婆子送了两盆海棠花来。|后来又见后门上的婆子送了两盆海棠花来。
袭人问是那里来的，婆子便将宝玉前一番缘故说了。|袭人问是哪里来的，婆子就把宝玉刚才的事说了。
袭人听说便命他们摆好，让他们在下房里坐了，|袭人听了就叫她们把花摆好，让她们在下房里坐着，
自己走到自己房内秤了六钱银子封好，又拿了三百钱走来，都递与那两个婆子道：|自己走到自己房里称了六钱银子封好，又拿了三百钱走来，都递给那两个婆子说：
“这银子赏那抬花来的小子们，这钱你们打酒吃罢。”|“这银子赏给那些抬花来的小厮们，这钱你们拿去买酒喝吧。”
那婆子们站起来，眉开眼笑，千恩万谢的不肯受，见袭人执意不收，方领了。|那两个婆子站起来，眉开眼笑，千恩万谢，推辞不肯收，见袭人坚持，才收下了。
袭人又道：“后门上外头可有该班的小子们？”|袭人又说：“后门外面有没有值班的小厮？”
婆子忙应道：“天天有四个，原预备里面差使的。姑娘有什么差使，我们吩咐去。”|婆子连忙应道：“天天有四个，原本就是预备里面差使的。姑娘有什么差事，我们去吩咐。”
袭人笑道：“有什么差使？今儿宝二爷要打发人到小侯爷家与史大姑娘送东西去，|袭人笑道：“有什么差事？今天宝二爷要打发人到小侯爷家给史大姑娘送东西去，
可巧你们来了，顺便出去叫后门小子们雇辆车来。回来你们就往这里拿钱，不用叫他们又往前头混碰去。”|正好你们来了，顺便出去叫后门的小厮雇一辆车来。回头你们就到这里来拿钱，不用叫他们再到前面去乱撞了。”
婆子答应著去了。|婆子答应着去了。
! 袭人赏钱、派车，样样处理得周到，俨然是怡红院的管家。她刚得了王夫人的看重，做事越发有主子的样子了。
! “小侯爷家”是湘云的叔叔史鼎家，湘云就住在那里。

# 十八、缠丝白玛瑙碟子
袭人回至房中，拿碟子盛东西与史湘云送去，却见槅子上碟槽空著。|袭人回到屋里，拿碟子装东西给史湘云送去，却见架子上放碟子的槽是空的。
因回头见晴雯，秋纹，麝月等都在一处做针黹，袭人问道：“这一个缠丝白玛瑙碟子那去了？”|回头见晴雯、秋纹、麝月等人都在一起做针线，袭人就问：“这个缠丝白玛瑙碟子到哪里去了？”
众人见问，都你看我我看你，都想不起来。|大家见她问，你看我、我看你，都想不起来。
半日，晴雯笑道：“给三姑娘送荔枝去的，还没送来呢。”|过了半天，晴雯笑道：“给三姑娘送荔枝去了，还没送回来呢。”
袭人道：“家常送东西的家伙也多，巴巴的拿这个去。”|袭人说：“平常送东西的家伙也多得是，偏偏拿这个去。”
晴雯道：“我何尝不也这样说。他说这个碟子配上鲜荔枝才好看。|晴雯说：“我何尝不这么说。他说这个碟子配上鲜荔枝才好看。
我送去，三姑娘见了也说好看，叫连碟子放著，就没带来。|我送去了，三姑娘见了也说好看，叫连碟子一起留下，我就没带回来。
你再瞧，那槅子尽上头的一对联珠瓶还没收来呢。”|你再看，架子最上面那一对联珠瓶也还没收回来呢。”
! 白玛瑙碟子配鲜红荔枝，宝玉连送东西的碟子都要挑颜色配得好看。探春信里说的“鲜荔”，就是这一碟。

# 十九、秋纹得赏
秋纹笑道：“提起瓶来，我又想起笑话。|秋纹笑道：“提起瓶子，我又想起一件笑话。
我们宝二爷说声孝心一动，也孝敬到二十分。|我们宝二爷说起孝心来，孝敬起来就是十二分。
因那日见园里桂花，折了两枝，原是自己要插瓶的，|那天他见园子里的桂花开了，折了两枝，本来是自己要插瓶的，
忽然想起来说，这是自己园里的才开的新鲜花，不敢自己先顽，|忽然想起来说，这是自己园子里刚开的新鲜花，不敢自己先玩，
巴巴的把那一对瓶拿下来，亲自灌水插好了，叫个人拿著，亲自送一瓶进老太太，又进一瓶与太太。|特地把那一对瓶子拿下来，亲自灌水插好，叫个人拿着，亲自送一瓶给老太太，又送一瓶给太太。
谁知他孝心一动，连跟的人都得了福了。可巧那日是我拿去的。|谁知他孝心一动，连跟着的人都得了福气。正好那天是我拿去的。
老太太见了这样，喜的无可无不可，见人就说：|老太太见了，高兴得不得了，见人就说：
‘到底是宝玉孝顺我，连一枝花儿也想的到。别人还只抱怨我疼他。’|‘到底是宝玉孝顺我，连一枝花都想得到。别人还只怪我疼他。’
你们知道，老太太素日不大同我说话的，有些不入他老人家的眼的。|你们知道，老太太平时不大跟我说话，我有些入不了她老人家的眼。
那日竟叫人拿几百钱给我，说我可怜见的，生的单柔。|那天竟然叫人拿了几百钱给我，说我可怜见的，长得单薄。
这可是再想不到的福气。几百钱是小事，难得这个脸面。|这可是想都想不到的福气。几百钱是小事，难得的是这个脸面。
及至到了太太那里，太太正和二奶奶，赵姨奶奶，周姨奶奶好些人翻箱子，找太太当日年轻的颜色衣裳，不知给那一个。|等到了太太那里，太太正和二奶奶、赵姨奶奶、周姨奶奶好些人翻箱子，找太太年轻时穿的颜色鲜艳的衣裳，不知道要给哪一个。
一见了，连衣裳也不找了，且看花儿。|一见了花，连衣裳也不找了，先看花。
又有二奶奶在旁边凑趣儿，夸宝玉又是怎么孝敬，又是怎样知好歹，有的没的说了两车话。|又有二奶奶在旁边凑趣，夸宝玉又是怎么孝顺，又是怎么懂事，有的没的说了一大堆。
当著众人，太太自为又增了光，堵了众人的嘴。|当着大家的面，太太觉得自己又增了光，堵住了大家的嘴。
太太越发喜欢了，现成的衣裳就赏了我两件。|太太越发高兴，现成的衣裳就赏了我两件。
衣裳也是小事，年年横竖也得，却不象这个彩头。”|衣裳也是小事，反正每年都能得，却不像这个体面。”
! “堵了众人的嘴”，众人是谁？赵姨娘就在场。王夫人当着赵姨娘的面，被凤姐夸宝玉孝顺，心里格外得意。
! 秋纹一个丫头，得了几百钱、两件旧衣裳，就当成天大的体面，四处夸耀。丫头们的眼界，就在这一点赏赐上。

# 二十、晴雯的骨气
晴雯笑道：“呸！没见世面的小蹄子！那是把好的给了人，挑剩下的才给你，你还充有脸呢。”|晴雯笑道：“呸！没见过世面的小丫头！那是把好的给了别人，挑剩下的才给你，你还觉得有脸呢。”
秋纹道：“凭他给谁剩的，到底是太太的恩典。”|秋纹说：“不管是给谁剩下的，到底是太太的恩典。”
晴雯道：“要是我，我就不要。若是给别人剩下的给我，也罢了。|晴雯说：“要是我，我就不要。要是给别人剩下的给我，也就罢了。
一样这屋里的人，难道谁又比谁高贵些？|同样是这屋里的人，难道谁又比谁高贵些？
把好的给他，剩下的才给我，我宁可不要，冲撞了太太，我也不受这口软气。”|把好的给她，剩下的才给我，我宁可不要，就算冲撞了太太，我也不受这口窝囊气。”
秋纹忙问：“给这屋里谁的？我因为前儿病了几天，家去了，不知是给谁的。|秋纹连忙问：“是给这屋里谁的？我因为前些天病了几天，回家去了，不知道是给谁的。
好姐姐，你告诉我知道知道。”|好姐姐，你告诉我知道知道。”
晴雯道：“我告诉了你，难道你这会退还太太去不成？”|晴雯说：“我告诉了你，难道你这会儿还能退还给太太不成？”
秋纹笑道：“胡说，我白听了喜欢喜欢。|秋纹笑道：“胡说，我只是听了高兴高兴。
那怕给这屋里的狗剩下的，我只领太太的恩典，也不犯管别的事。”|哪怕是给这屋里的狗剩下的，我只领太太的恩典，也犯不着管别的事。”
众人听了都笑道：“骂的巧，可不是给了那西洋花点子哈巴儿了。”|大家听了都笑道：“骂得巧，可不就是给了那只西洋花点子哈巴狗了。”
袭人笑道：“你们这起烂了嘴的！得了空就拿我取笑打牙儿。一个个不知怎么死呢。”|袭人笑道：“你们这些烂了嘴的！一有空就拿我取笑。一个个不知道将来怎么死呢。”
秋纹笑道：“原来姐姐得了，我实在不知道。我陪个不是罢。”|秋纹笑道：“原来是姐姐得了，我实在不知道。我赔个不是吧。”
袭人笑道：“少轻狂罢。你们谁取了碟子来是正经。”|袭人笑道：“少轻狂吧。你们谁去把碟子取回来才是正经。”
! 王夫人找出来的好衣裳，原来是给了袭人。“一样这屋里的人，难道谁又比谁高贵些”，晴雯不服的就是这个。
! 秋纹说“那怕给这屋里的狗剩下的”，大家笑说是“西洋花点子哈巴儿”，骂的就是袭人。丫头们嘴上说笑，心里对袭人得宠都有怨气。
! 晴雯说“宁可不要，冲撞了太太，我也不受这口软气”。这股骨气，是晴雯最可贵的地方，也是她最后被王夫人撵走的根源。

# 二十一、晴雯去取瓶
麝月道：“那瓶得空儿也该收来了。|麝月说：“那对瓶子有空也该收回来了。
老太太屋里还罢了，太太屋里人多手杂。|老太太屋里还好，太太屋里人多手杂。
别人还可以，赵姨奶奶一伙的人见是这屋里的东西，又该使黑心弄坏了才罢。|别人还罢了，赵姨奶奶那一伙人见是这屋里的东西，又该使坏心眼弄坏了才甘心。
太太也不大管这些，不如早些收来正经。”|太太也不大管这些，不如早点收回来才是正经。”
晴雯听说，便掷下针黹道：“这话倒是，等我取去。”|晴雯听了，就扔下针线说：“这话倒对，等我去取。”
秋纹道：“还是我取去罢，你取你的碟子去。”|秋纹说：“还是我去取吧，你去取你的碟子。”
晴雯笑道：“我偏取一遭儿去。是巧宗儿你们都得了，难道不许我得一遭儿？”|晴雯笑道：“我偏要去取一回。好差事你们都得了，难道不许我也得一回？”
麝月笑道：“通共秋丫头得了一遭儿衣裳，那里今儿又巧，你也遇见找衣裳不成。”|麝月笑道：“总共秋丫头才得了一回衣裳，哪里今天又这么巧，你也碰上找衣裳不成。”
晴雯冷笑道：“虽然碰不见衣裳，或者太太看见我勤谨，一个月也把太太的公费里分出二两银子来给我，也定不得。”|晴雯冷笑道：“虽然碰不上衣裳，说不定太太看我勤快，一个月也从太太的月钱里分出二两银子来给我，也说不定。”
说著，又笑道：“你们别和我装神弄鬼的，什么事我不知道。”|说着，又笑道：“你们别跟我装神弄鬼的，什么事我不知道。”
一面说，一面往外跑了。|一边说，一边往外跑了。
秋纹也同他出来，自去探春那里取了碟子来。|秋纹也和她一起出来，自己到探春那里去取了碟子回来。
! “一个月也把太太的公费里分出二两银子来给我”，晴雯这句话直接点破了袭人的事：王夫人从自己的月例里给袭人二两银子。这件事本是暗中办的，晴雯全知道。
! 晴雯嘴上不饶人，刀刀扎在袭人身上。她恨的不是袭人得赏，是袭人靠什么得的赏。

# 二十二、宋嬷嬷送东西
袭人打点齐备东西，叫过本处的一个老宋妈妈来，向他说道：|袭人把东西准备齐了，叫来本院的一个老宋妈妈，对她说：
“你先好生梳洗了，换了出门的衣裳来，如今打发你与史姑娘送东西去。”|“你先好好梳洗一下，换上出门的衣裳来，现在打发你给史姑娘送东西去。”
那宋嬷嬷道：“姑娘只管交给我，有话说与我，我收拾了就好一顺去的。”|那宋嬷嬷说：“姑娘只管交给我，有话就跟我说，我收拾好了就一起带去。”
袭人听说，便端过两个小掐丝盒子来。|袭人听了，就端过两个小掐丝盒子来。
先揭开一个，里面装的是红菱和鸡头两样鲜果，又那一个，是一碟子桂花糖蒸新栗粉糕。|先揭开一个，里面装的是红菱和鸡头米两样鲜果；又揭开另一个，是一碟桂花糖蒸新栗子粉糕。
又说道：“这都是今年咱们这里园里新结的果子，宝二爷送来与姑娘尝尝。|又说：“这都是今年咱们园子里新结的果子，宝二爷送来给姑娘尝尝。
再前日姑娘说这玛瑙碟子好，姑娘就留下顽罢。|还有，前些天姑娘说这玛瑙碟子好，姑娘就留下玩吧。
这绢包儿里头是姑娘上日叫我作的活计，姑娘别嫌粗糙，能著用罢。|这绢包里面是姑娘前些天叫我做的活计，姑娘别嫌粗糙，凑合着用吧。
替我们请安，替二爷问好就是了。”|替我们问安，替二爷问好就是了。”
宋嬷嬷道：“宝二爷不知还有什么说的，姑娘再问问去，回来又别说忘了。”|宋嬷嬷说：“宝二爷不知道还有什么话要说，姑娘再去问问，回头别又说忘了。”
袭人因问秋纹：“方才可见在三姑娘那里？”|袭人就问秋纹：“刚才在三姑娘那里看见他了吗？”
秋纹道：“他们都在那里商议起什么诗社呢，又都作诗。想来没话，你只去罢。”|秋纹说：“他们都在那里商量起什么诗社呢，又都在作诗。想来没什么话，你只管去吧。”
宋嬷嬷听了，便拿了东西出去，另外穿戴了。|宋嬷嬷听了，就拿着东西出去，另外换了衣服。
袭人又嘱咐他：“从后门出去，有小子和车等著呢。”|袭人又嘱咐她：“从后门出去，有小厮和车在那里等着呢。”
宋妈去后，不在话下。|宋妈走了，不必细说。
! 湘云前回替袭人做活计，这回袭人回送了果子点心和那只玛瑙碟子。湘云送东西亲自来，袭人送东西要派人去，一来一往，看得出谁的身份更自在。

# 二十三、宝玉要接湘云
宝玉回来，先忙著看了一回海棠，至房内告诉袭人起诗社的事。|宝玉回来，先忙着看了一会儿海棠，到屋里告诉袭人起诗社的事。
袭人也把打发宋妈妈与史湘云送东西去的话告诉了宝玉。|袭人也把打发宋妈妈给史湘云送东西的事告诉了宝玉。
宝玉听了，拍手道：“偏忘了他。我自觉心里有件事，只是想不起来，亏你提起来，正要请他去。|宝玉听了，拍手说：“偏偏把她忘了。我自己觉得心里有件事，只是想不起来，多亏你提起，正要去请她。
这诗社里若少了他还有什么意思。”|这诗社里要是少了她，还有什么意思。”
袭人劝道：“什么要紧，不过玩意儿。|袭人劝道：“有什么要紧，不过是玩意儿。
他比不得你们自在，家里又作不得主儿。|她比不得你们自在，家里又做不得主。
告诉他，他要来又由不得他，不来，他又牵肠挂肚的，没的叫他不受用。”|告诉她，她想来又由不得她；不来，她又牵肠挂肚的，平白叫她不痛快。”
宝玉道：“不妨事，我回老太太打发人接他去。”|宝玉说：“不要紧，我去回老太太，打发人去接她。”
正说著，宋妈妈已经回来，回复道生受，与袭人道乏，又说：|正说着，宋妈妈已经回来了，替湘云道了谢，又谢了袭人的辛苦，又说：
“问二爷作什么呢，我说和姑娘们起什么诗社作诗呢。|“史姑娘问二爷在做什么，我说和姑娘们起什么诗社作诗呢。
史姑娘说，他们作诗也不告诉他去，急的了不的。”|史姑娘说，他们作诗也不告诉她，急得不得了。”
宝玉听了立身便往贾母处来，立逼著叫人接去。|宝玉听了，站起来就往贾母那里去，非逼着叫人去接不可。
贾母因说：“今儿天晚了，明日一早再去。”|贾母就说：“今天天晚了，明天一早再去。”
宝玉只得罢了，回来闷闷的。|宝玉只好作罢，回来闷闷不乐的。
! 第三十六回湘云临走嘱咐宝玉“时常提著打发人接我去”，这一回宝玉果然逼着贾母去接她。
! 袭人说湘云“家里作不得主”，第三十二回宝钗对袭人说过湘云在家的苦，袭人都记住了。

# 二十四、湘云和诗
次日一早，便又往贾母处来催逼人接去。|第二天一早，宝玉又到贾母那里催着派人去接。
直到午后，史湘云才来，宝玉方放了心，见面时就把始末原由告诉他，又要与他诗看。|直到下午，史湘云才来，宝玉这才放了心，一见面就把前前后后告诉她，又要给她看诗。
李纨等因说道：“且别给他诗看，先说与他韵。|李纨等人就说：“先别给她看诗，先告诉她韵。
他后来，先罚他和了诗：若好，便请入社，若不好，还要罚他一个东道再说。”|她来晚了，先罚她和诗：要是好，就请她入社；要是不好，还要罚她做一回东道再说。”
史湘云道：“你们忘了请我，我还要罚你们呢。|史湘云说：“你们忘了请我，我还要罚你们呢。
就拿韵来，我虽不能，只得勉强出丑。容我入社，扫地焚香我也情愿。”|拿韵来吧，我虽然不会，也只好勉强出丑。只要让我入社，扫地烧香我也情愿。”
众人见他这般有趣，越发喜欢，都埋怨昨日怎么忘了他，遂忙告诉他韵。|大家见她这么有趣，越发喜欢，都埋怨昨天怎么把她忘了，就赶紧把韵告诉她。
史湘云一心兴头，等不得推敲删改，一面只管和人说著话，心内早已和成，即用随便的纸笔录出，|史湘云满心兴奋，等不及推敲修改，一边只管和人说着话，心里早已和成了，就随便拿纸笔写出来，
先笑说道：“我却依韵和了两首，好歹我却不知，不过应命而已。”说著递与众人。|先笑着说：“我依韵和了两首，好坏我也不知道，不过是交差罢了。”说着递给大家。
众人道：“我们四首也算想绝了，再一首也不能了。你倒弄了两首，那里有许多话说，必要重了我们。”|大家说：“我们四首也算想尽了，再作一首也不能了。你倒作了两首，哪有那么多话可说，一定会跟我们重复。”
一面说，一面看时，只见那两首诗写道：|一边说，一边看，只见那两首诗写的是：
! 别人限一炷香作一首，湘云边说话边作了两首。她的才思敏捷，是诗社里最快的。
! 湘云说“扫地焚香我也情愿”，她在家受拘束，到了大观园就像出了笼的鸟。

# 二十五、湘云的海棠诗
其一|第一首
~神仙昨日降都门，种得蓝田玉一盆。|神仙昨天降临京城，种下了一盆蓝田美玉一样的海棠。
~自是霜娥偏爱冷，非关倩女亦离魂。|这是因为霜神偏爱清冷，并不是像倩女那样魂魄离身。
~秋阴捧出何方雪，雨渍添来隔宿痕。|秋天的阴云里捧出的是哪里来的白雪？雨水又给它添上了隔夜的泪痕。
~却喜诗人吟不倦，岂令寂寞度朝昏。|可喜诗人们不倦地吟咏它，怎会叫它寂寞地度过早晚。
其二|第二首
~蘅芷阶通萝薜门，也宜墙角也宜盆。|长满香草的台阶通向爬满藤萝的院门，它种在墙角也好，种在盆里也好。
~花因喜洁难寻偶，人为悲秋易断魂。|花因为爱洁净，难以找到配偶；人因为悲秋，容易黯然神伤。
~玉烛滴乾风里泪，晶帘隔破月中痕。|蜡烛在风中流干了泪，水晶帘隔开了月光的影子。
~幽情欲向嫦娥诉，无奈虚廊夜色昏。|满怀幽情想向嫦娥倾诉，无奈空荡的回廊上夜色昏沉。
众人看一句，惊讶一句，看到了，赞到了，都说：“这个不枉作了海棠诗，真该要起海棠社了。”|大家看一句惊讶一句，看到哪里赞到哪里，都说：“这才不枉作了海棠诗，真该起海棠社了。”
史湘云道：“明日先罚我个东道，就让我先邀一社可使得？”|史湘云说：“明天先罚我做一回东道，就让我先请一社，行吗？”
众人道：“这更妙了。”|大家说：“这就更妙了。”
因又将昨日的与他评论了一回。|又把昨天的诗拿给她评论了一番。
! “倩女离魂”是元代杂剧，倩女思念情人，魂魄离开身体去追随他。湘云说海棠不是离魂，只是爱冷。
! “花因喜洁难寻偶”，有人说这是湘云的谶语：湘云后来嫁了一个好丈夫，可惜丈夫早亡，她终究“难寻偶”。
! 湘云的诗豪爽中有凄凉，“人为悲秋易断魂”，她看着爽朗，心里也有说不出的苦。

# 二十六、宝钗替湘云谋划
至晚，宝钗将湘云邀往蘅芜苑安歇去。|到了晚上，宝钗把湘云请到蘅芜苑去住。
湘云灯下计议如何设东拟题。|湘云在灯下盘算怎么做东、怎么出题。
宝钗听他说了半日，皆不妥当，因向他说道：|宝钗听她说了半天，都不妥当，就对她说：
“既开社，便要作东。虽然是顽意儿，也要瞻前顾后，|“既然开社，就要做东。虽然是玩意儿，也要前前后后想周全，
又要自己便宜，又要不得罪了人，然后方大家有趣。|又要自己方便，又不能得罪人，这样大家才有意思。
你家里你又作不得主，一个月通共那几串钱，你还不够盘缠呢。|你家里你又做不得主，一个月总共那几串钱，你自己用都不够呢。
这会子又干这没要紧的事，你婶子听见了，越发抱怨你了。|这会儿又干这种不要紧的事，你婶子听见了，越发要抱怨你了。
况且你就都拿出来，做这个东道也是不够。|况且你就算全拿出来，做这个东道也不够。
难道为这个家去要不成？还是往这里要呢？”|难道为这个回家去要不成？还是在这里要呢？”
一席话提醒了湘云，倒踌蹰起来。|一席话提醒了湘云，她倒犹豫起来了。
! 湘云只顾高兴，宝钗却替她算了一笔账：做东要花钱，她没钱，回家要钱婶子会骂，在这里要钱又没面子。宝钗想得最周全。

# 二十七、螃蟹宴的主意
宝钗道：“这个我已经有个主意。|宝钗说：“这件事我已经有了个主意。
我们当铺里有个伙计，他家田上出的很好的肥螃蟹，前儿送了几斤来。|我们当铺里有个伙计，他家田里出很好的肥螃蟹，前些天送了几斤来。
现在这里的人，从老太太起连上园里的人，有多一半都是爱吃螃蟹的。|现在这里的人，从老太太起，连园子里的人，有一大半都爱吃螃蟹。
前日姨娘还说要请老太太在园里赏桂花吃螃蟹，因为有事还没有请呢。|前些天姨妈还说要请老太太到园里赏桂花吃螃蟹，因为有事还没请呢。
你如今且把诗社别提起，只管普通一请。等他们散了，咱们有多少诗作不得的。|你现在先别提诗社，只当是普通请客。等他们散了，咱们想作多少诗不行。
我和我哥哥说，要几篓极肥极大的螃蟹来，再往铺子里取上几坛好酒，再备上四五桌果碟，|我跟我哥哥说，要几篓最肥最大的螃蟹来，再到铺子里取几坛好酒，再准备四五桌果碟，
岂不又省事又大家热闹了。”|岂不是又省事，大家又热闹了。”
湘云听了，心中自是感服，极赞他想的周到。|湘云听了，心里自然很感激佩服，极力称赞她想得周到。
宝钗又笑道：“我是一片真心为你的话。|宝钗又笑道：“我是一片真心为你着想。
你千万别多心，想著我小看了你，咱们两个就白好了。|你千万别多心，以为我小看了你，那咱们两个就白好了。
你若不多心，我就好叫他们办去的。”|你要是不多心，我就叫他们去办了。”
湘云忙笑道：“好姐姐，你这样说，倒多心待我了。|湘云连忙笑道：“好姐姐，你这么说，倒是你多心待我了。
凭他怎么糊涂，连个好歹也不知，还成个人了？|我再怎么糊涂，连好歹都不知道，还算个人吗？
我若不把姐姐当作亲姐姐一样看，上回那些家常话烦难事也不肯尽情告诉你了。”|我要是不把姐姐当作亲姐姐看，上回那些家里的烦心事也不会全都告诉你了。”
宝钗听说，便叫一个婆子来：“出去和大爷说，依前日的大螃蟹要几篓来，明日饭后请老太太姨娘赏桂花。|宝钗听了，就叫一个婆子来：“出去跟大爷说，照前些天那种大螃蟹要几篓来，明天饭后请老太太、姨妈赏桂花。
你说大爷好歹别忘了，我今儿已请下人了。”|你告诉大爷千万别忘了，我今天已经请好人了。”
那婆子出去说明，回来无话。|那婆子出去说了，回来也没什么话。
! 宝钗替湘云出钱办螃蟹宴，又再三说“你千万别多心”。她帮人帮得周到，连对方的面子都照顾到了。
! 宝钗说“从老太太起有多一半都是爱吃螃蟹的”，名义上是湘云请，实际是宝钗出钱。这一场螃蟹宴，讨了贾母的欢心，也全了湘云的面子。
! 有人说宝钗这是收买人心，有人说是真心体贴。湘云从此对宝钗更是死心塌地。

# 二十八、宝钗论诗
这里宝钗又向湘云道：“诗题也不要过于新巧了。|宝钗又对湘云说：“诗题也不要太新奇了。
你看古人诗中那些刁钻古怪的题目和那极险的韵了，|你看古人诗里那些刁钻古怪的题目和那些极难的韵，
若题过于新巧，韵过于险，再不得有好诗，终是小家气。|要是题目太新奇、韵太难，就作不出好诗来，终究显得小家子气。
诗固然怕说熟话，更不可过于求生，只要头一件立意清新，自然措词就不俗了。|作诗固然怕说烂熟的话，更不可以太过求新求怪，只要第一要紧的立意清新，用词自然就不俗了。
究竟这也算不得什么，还是纺绩针黹是你我的本等。|说到底这也算不得什么，纺纱织布、针线活计才是你我的本分。
一时闲了，倒是于你我深有益的书看几章是正经。”|一时闲了，倒是读几章对你我真正有益的书才是正经。”
湘云只答应著，因笑道：“我如今心里想著，昨日作了海棠诗，我如今要作个菊花诗如何？”|湘云只答应着，又笑道：“我现在心里想，昨天作了海棠诗，我现在想作菊花诗，怎么样？”
宝钗道：“菊花倒也合景，只是前人太多了。”|宝钗说：“菊花倒也应景，只是前人写得太多了。”
湘云道：“我也是如此想著，恐怕落套。”|湘云说：“我也是这么想，怕落了俗套。”
! 宝钗说“立意清新，措词就不俗”，这是很高明的诗论。她自己的诗正是这样，不求奇巧，自有分量。
! 宝钗又说“纺绩针黹是你我的本等”，作诗不算什么正事。她诗才极高，却始终把诗看得很轻，这是宝钗的“守拙”。

# 二十九、拟菊花题
宝钗想了一想，说道：“有了，如今以菊花为宾，以人为主，竟拟出几个题目来，|宝钗想了想，说：“有了，现在以菊花为宾、以人为主，拟出几个题目来，
都是两个字：一个虚字，一个实字，实字便用‘菊’字，虚字就用通用门的。|都是两个字：一个虚字，一个实字，实字就用‘菊’字，虚字就用常用的那些字。
如此又是咏菊，又是赋事，前人也没作过，也不能落套。|这样又是咏菊花，又是写人事，前人也没作过，也不会落俗套。
赋景咏物两关著，又新鲜，又大方。”|写景咏物两方面都照顾到了，又新鲜，又大方。”
湘云笑道：“这却很好。只是不知用何等虚字才好。你先想一个我听听。”|湘云笑道：“这倒很好。只是不知用什么虚字才好。你先想一个我听听。”
宝钗想了一想，笑道：“《菊梦》就好。”|宝钗想了想，笑道：“《菊梦》就好。”
湘云笑道：“果然好。我也有一个，《菊影》可使得？”|湘云笑道：“果然好。我也有一个，《菊影》行不行？”
宝钗道：“也罢了。只是也有人作过，若题目多，这个也夹的上。我又有了一个。”|宝钗说：“也还行。只是也有人作过，要是题目多，这个也可以夹在里面。我又想到一个。”
湘云道：“快说出来。”|湘云说：“快说出来。”
宝钗道：“《问菊》如何？”|宝钗说：“《问菊》怎么样？”
湘云拍案叫妙，因接说道：“我也有了，《访菊》如何？”|湘云拍着桌子叫好，接着说：“我也有了，《访菊》怎么样？”
宝钗也赞有趣，因说道：“越性拟出十个来，写上再来。”|宝钗也称赞有趣，就说：“干脆拟出十个来，写下来再说。”
说著，二人研墨蘸笔，湘云便写，宝钗便念，一时凑了十个。|说着，两人研墨蘸笔，湘云写，宝钗念，一会儿凑了十个。
湘云看了一遍，又笑道：“十个还不成幅，越性凑成十二个便全了，也如人家的字画册页一样。”|湘云看了一遍，又笑道：“十个还不成一套，干脆凑成十二个就全了，也像人家的字画册页一样。”
宝钗听说，又想了两个，一共凑成十二。|宝钗听了，又想了两个，一共凑成了十二个。
! “以菊花为宾，以人为主”，菊花题写的不是菊花本身，是人和菊花之间的事：忆它、访它、种它、问它。这个主意新颖极了。
! 十二个题目，正应了金陵十二钗。菊花诗里每一首，都有作者自己的影子。

# 三十、十二题的次序
又说道：“既这样，越性编出他个次序先后来。”|又说：“既然这样，干脆排出个先后次序来。”
湘云道：“如此更妙，竟弄成个菊谱了。”|湘云说：“这样更妙，简直成了一本菊谱了。”
宝钗道：“起首是《忆菊》，忆之不得，故访，第二是《访菊》，访之既得，便种，|宝钗说：“开头是《忆菊》，想念菊花而见不到，所以去寻访，第二是《访菊》；访到了，就种下，
第三是《种菊》，种既盛开，故相对而赏，第四是《对菊》，|第三是《种菊》；种了以后盛开了，就对着欣赏，第四是《对菊》；
相对而兴有余，故折来供瓶为玩，第五是《供菊》，|对着欣赏还觉得兴致未尽，就折来插在瓶里赏玩，第五是《供菊》；
既供而不吟，亦觉菊无彩色，第六便是《咏菊》，|插在瓶里却不吟诗，也觉得菊花没有光彩，第六就是《咏菊》；
既入词章，不可不供笔墨，第七便是《画菊》，|写进了诗词，也不能不用笔墨来画，第七就是《画菊》；
既为菊如是碌碌，究竟不知菊有何妙处，不禁有所问，第八便是《问菊》，|为菊花这样忙忙碌碌，到底不知道菊花有什么妙处，忍不住要问它，第八就是《问菊》；
菊如解语，使人狂喜不禁，第九便是《簪菊》，|菊花要是能懂人话，叫人狂喜不已，第九就是《簪菊》，把菊花插在头上；
如此人事虽尽，犹有菊之可咏者，《菊影》《菊梦》二首续在第十第十一，|这样人能做的事虽然都做完了，还有菊花本身可以吟咏的，《菊影》《菊梦》两首接在第十、第十一，
末卷便以《残菊》总收前题之盛。|最后一首用《残菊》，把前面的繁盛总收起来。
这便是三秋的妙景妙事都有了。”|这样，整个秋天的美景美事就都有了。”
湘云依说将题录出，又看了一回，又问“该限何韵？”|湘云照她说的把题目抄出来，又看了一遍，又问：“该限什么韵？”
宝钗道：“我平生最不喜限韵的，分明有好诗，何苦为韵所缚。|宝钗说：“我生平最不喜欢限韵，明明有好诗，何苦被韵束缚住。
咱们别学那小家派，只出题不拘韵。|咱们别学那些小家子气的做法，只出题目，不限韵。
原为大家偶得了好句取乐，并不为此而难人。”|本来是为了大家偶然得了好句子取乐，并不是为了难为人。”
湘云道：“这话很是。这样大家的诗还进一层。|湘云说：“这话很对。这样大家的诗还能更好一层。
但只咱们五个人，这十二个题目，难道每人作十二首不成？”|只是咱们五个人，这十二个题目，难道每人作十二首不成？”
宝钗道：“那也太难人了。将这题目誊好，都要七言律，明日贴在墙上。|宝钗说：“那也太难为人了。把这些题目抄好，都要作七言律诗，明天贴在墙上。
他们看了，谁作那一个就作那一个。有力量者，十二首都作也可，不能的，一首不成也可。|他们看了，谁想作哪一个就作哪一个。有本事的，十二首都作也行；不行的，一首都作不成也可以。
高才捷足者为尊。若十二首已全，便不许他后赶著又作，罚他就完了。”|才高手快的为尊。要是十二首已经全了，就不许后面的人再赶着作，罚他就是了。”
湘云道：“这倒也罢了。”|湘云说：“这样也好。”
二人商议妥贴，方才息灯安寝。|两人商量妥当，才熄灯睡觉。
要知端的，且听下回分解。|要知后事如何，请看下回。
! 从“忆”到“残”，十二首菊花诗是一个完整的故事：想念、寻找、得到、欣赏、吟咏、追问、梦见，最后凋残。这也是一个人一生的样子，也是贾府由盛到衰的样子。
! 以《残菊》“总收前题之盛”，热闹到最后，都要收在一个“残”字上。宝钗拟题，就埋下了全书的结局。
! 回目“蘅芜苑夜拟菊花题”。宝钗和湘云灯下拟题，一个出主意，一个写字，是两人最亲密的时候。
</script>
<script type="text/plain" id="ch38">
# 一、藕香榭赏桂
话说宝钗湘云二人计议已妥，一宿无话。|宝钗和湘云两人商量妥当，一夜无话。
湘云次日便请贾母等赏桂花。|第二天湘云就请贾母等人赏桂花。
贾母等都说道：“是他有兴头，须要扰他这雅兴。”|贾母等人都说：“是她有兴致，一定要去叨扰她这番雅兴。”
至午，果然贾母带了王夫人凤姐兼请薛姨妈等进园来。|到了中午，贾母果然带着王夫人、凤姐，又请了薛姨妈等人进园来。
贾母因问“那一处好？”|贾母就问：“哪里好？”
王夫人道：“凭老太太爱在那一处，就在那一处。”|王夫人说：“老太太喜欢在哪里，就在哪里。”
凤姐道：“藕香榭已经摆下了，那山坡下两棵桂花开的又好，河里的水又碧清，|凤姐说：“藕香榭已经摆好了，那山坡下两棵桂花开得正好，河里的水又碧绿清澈，
坐在河当中亭子上岂不敞亮，看著水眼也清亮。”|坐在河中间的亭子上岂不敞亮，看着水眼睛也清爽。”
贾母听了，说：“这话很是。”|贾母听了，说：“这话很对。”
说著，就引了众人往藕香榭来。|说着，就领着众人往藕香榭来。
原来这藕香榭盖在池中，四面有窗，左右有曲廊可通，亦是跨水接岸，后面又有曲折竹桥暗接。|原来这藕香榭建在池子中间，四面有窗，左右有曲折的回廊可以通行，也是跨着水连着岸，后面又有一座弯弯曲曲的竹桥暗暗连着。
众人上了竹桥，凤姐忙上来搀著贾母，口里说：|大家上了竹桥，凤姐连忙上来搀着贾母，嘴里说：
“老祖宗只管迈大步走，不相干的，这竹子桥规矩是咯吱咯喳的。”|“老祖宗只管迈大步走，不要紧的，这竹桥本来就是咯吱咯吱响的。”
! 名义上是湘云请客，地方却是凤姐安排好的，钱是宝钗出的。湘云只出了一个名。
! 凤姐时时刻刻搀着贾母，说话逗趣，她的心思全在讨老太太欢心上。

# 二、贾母说枕霞阁
一时进入榭中，只见栏杆外另放著两张竹案，一个上面设著杯箸酒具，一个上头设著茶筅茶盂各色茶具。|一会儿进了榭中，只见栏杆外面另外放着两张竹桌，一张上面摆着杯筷酒具，一张上面摆着茶筅、茶盂等各种茶具。
那边有两三个丫头煽风炉煮茶，这一边另外几个丫头也煽风炉烫酒呢。|那边有两三个丫头扇着风炉煮茶，这边另外几个丫头也扇着风炉烫酒。
贾母喜的忙问：“这茶想的到，且是地方，东西都干净。”|贾母高兴地连忙说：“这茶想得周到，地方也好，东西也都干净。”
湘云笑道：“这是宝姐姐帮著我预备的。”|湘云笑道：“这是宝姐姐帮我准备的。”
贾母道：“我说这个孩子细致，凡事想的妥当。”|贾母说：“我就说这孩子细致，什么事都想得妥当。”
一面说，一面又看见柱上挂的黑漆嵌蚌的对子，命人念。湘云念道：|一边说，一边又看见柱子上挂着的黑漆嵌贝壳的对联，叫人念。湘云念道：
~芙蓉影破归兰桨，菱藕香深写竹桥。|兰木船桨划回来，打破了水中荷花的倒影；菱角莲藕的香气浓郁，弥漫在竹桥上。
贾母听了，又抬头看匾，因回头向薛姨妈道：|贾母听了，又抬头看匾，就回头对薛姨妈说：
“我先小时，家里也有这么一个亭子，叫做什么‘枕霞阁’。|“我小时候，家里也有这么一个亭子，叫做什么‘枕霞阁’。
我那时也只象他们这么大年纪，同姊妹们天天顽去。|我那时也就像她们这么大，和姐妹们天天去玩。
那日谁知我失了脚掉下去，几乎没淹死，好容易救了上来，到底被那木钉把头碰破了。|那天谁知我失脚掉下去了，差点淹死，好不容易救了上来，到底被那木钉把头碰破了。
如今这鬓角上那指头顶大一块窝儿就是那残破了。|现在这鬓角上手指头那么大一块凹下去的地方，就是那次碰破的。
众人都怕经了水，又怕冒了风，都说活不得了，谁知竟好了。”|大家都怕伤口沾了水，又怕吹了风，都说活不成了，谁知竟然好了。”
! 湘云说“这是宝姐姐帮著我预备的”，湘云不掩宝钗的功劳，贾母也立刻夸宝钗。宝钗出钱出力，名声全落在了贾母的心里。
! 贾母是史家的女儿，湘云是她的侄孙女。“枕霞阁”是史家的亭子，贾母小时候在那里落水。后面湘云的号“枕霞旧友”就从这里来。

# 三、凤姐“寿星头”
凤姐不等人说，先笑道：“那时要活不得，如今这大福可叫谁享呢！|凤姐不等别人开口，先笑道：“那时要是活不成，如今这么大的福气叫谁来享呢！
可知老祖宗从小儿的福寿就不小，神差鬼使碰出那个窝儿来，好盛福寿的。|可见老祖宗从小福气寿数就不小，神差鬼使地碰出那个窝儿来，好盛福气寿数的。
寿星老儿头上原是一个窝儿，因为万福万寿盛满了，所以倒凸高出些来了。”|寿星老头头上本来也是一个窝儿，因为万福万寿装满了，所以反倒凸出来了。”
未及说完，贾母与众人都笑软了。|还没说完，贾母和众人都笑得直不起腰了。
贾母笑道：“这猴儿惯的了不得了，只管拿我取笑起来，恨的我撕你那油嘴。”|贾母笑道：“这猴儿被惯得不得了，只管拿我取笑起来，恨得我要撕你那张油嘴。”
凤姐笑道：“回来吃螃蟹，恐积了冷在心里，讨老祖宗笑一笑开开心，一高兴多吃两个就无妨了。”|凤姐笑道：“等会儿吃螃蟹，怕寒气积在心里，讨老祖宗笑一笑开开心，一高兴多吃两个也就不怕了。”
贾母笑道：“明儿叫你日夜跟著我，我倒常笑笑觉的开心，不许回家去。”|贾母笑道：“以后叫你日夜跟着我，我倒常常笑笑，觉得开心，不许你回家去。”
王夫人笑道：“老太太因为喜欢他，才惯的他这样，还这样说，他明儿越发无礼了。”|王夫人笑道：“老太太因为喜欢她，才把她惯成这样，还这么说，她以后越发没规矩了。”
贾母笑道：“我喜欢他这样，况且他又不是那不知高低的孩子。|贾母笑道：“我就喜欢她这样，况且她又不是那种不知轻重的孩子。
家常没人，娘儿们原该这样。横竖礼体不错就罢，没的倒叫他从神儿似的作什么。”|家里没外人的时候，娘儿们本来就该这样。反正大礼不错就行了，何必叫她像个泥塑的神像似的做什么。”
! 一个老人头上的伤疤，凤姐能说成寿星的福气，这是她的本事。贾母明知是奉承，听了还是高兴。
! 凤姐说“讨老祖宗笑一笑，多吃两个螃蟹无妨”，螃蟹性寒，老人吃了伤胃，凤姐用笑来替贾母“暖胃”，说得又孝顺又俏皮。
! 贾母说“横竖礼体不错就罢”，她喜欢凤姐，就是因为凤姐能把规矩和玩笑拿捏得恰到好处。

# 四、吃螃蟹
说著，一齐进入亭子，献过茶，凤姐忙著搭桌子，要杯箸。|说着，大家一起进了亭子，献过茶，凤姐忙着摆桌子、要杯筷。
上面一桌，贾母，薛姨妈，宝钗，黛玉，宝玉，|上首一桌，是贾母、薛姨妈、宝钗、黛玉、宝玉；
东边一桌，史湘云，王夫人，迎，探，惜，|东边一桌，是史湘云、王夫人、迎春、探春、惜春；
西边靠门一桌，李纨和凤姐的，虚设坐位，二人皆不敢坐，只在贾母王夫人两桌上伺候。|西边靠门一桌，是李纨和凤姐的，只是空设座位，两人都不敢坐，只在贾母、王夫人两桌上伺候。
凤姐吩咐：“螃蟹不可多拿来，仍旧放在蒸笼里，拿十个来，吃了再拿。”|凤姐吩咐：“螃蟹不要一次拿太多，还是放在蒸笼里，先拿十个来，吃完了再拿。”
一面又要水洗了手，站在贾母跟前剥蟹肉，头次让薛姨妈。|一边又要水洗了手，站在贾母跟前剥蟹肉，第一次先让薛姨妈。
薛姨妈道：“我自己掰著吃香甜，不用人让。”|薛姨妈说：“我自己掰着吃才香，不用人让。”
凤姐便奉与贾母。二次的便与宝玉，又说：“把酒烫的滚热的拿来。”|凤姐就递给贾母。第二次剥的给了宝玉，又说：“把酒烫得滚热拿来。”
又命小丫头们去取菊花叶儿桂花蕊熏的绿豆面子来，预备洗手。|又叫小丫头们去拿用菊花叶和桂花蕊熏过的绿豆面来，准备洗手用。
! 宝玉和宝钗、黛玉坐在贾母这一桌，湘云是主人，反倒坐在东边陪王夫人。
! 螃蟹放在蒸笼里，吃一个拿一个，是怕凉了。绿豆面加菊叶桂蕊，是去腥气洗手的。贾府吃个螃蟹，讲究到这种地步。

# 五、湘云张罗
史湘云陪著吃了一个，就下座来让人，又出至外头，令人盛两盘子与赵姨娘周姨娘送去。|史湘云陪着吃了一个，就离座去招呼别人，又走到外面，叫人盛两盘给赵姨娘、周姨娘送去。
又见凤姐走来道：“你不惯张罗，你吃你的去。我先替你张罗，等散了我再吃。”|又见凤姐走来说：“你不习惯张罗，你吃你的去。我先替你张罗，等散了我再吃。”
湘云不肯，又令人在那边廊上摆了两桌，让鸳鸯，琥珀，彩霞，彩云，平儿去坐。|湘云不肯，又叫人在那边廊上摆了两桌，请鸳鸯、琥珀、彩霞、彩云、平儿去坐。
鸳鸯因向凤姐笑道：“二奶奶在这里伺候，我们可吃去了。”|鸳鸯就对凤姐笑道：“二奶奶在这里伺候，我们可去吃了。”
凤姐儿道：“你们只管去，都交给我就是了。”|凤姐说：“你们只管去，都交给我就是了。”
说著，史湘云仍入了席。|说着，史湘云又回到席上。
凤姐和李纨也胡乱应个景儿。|凤姐和李纨也随便吃了点应个景。
! 湘云做主人，最先想到的是给赵姨娘、周姨娘送螃蟹。贾府里人人都不把赵姨娘放在眼里，湘云却记着她。湘云的厚道在这里。
! 湘云又给大丫头们摆了两桌。她自己在家受苦，最懂得体贴下面的人。

# 六、凤姐和鸳鸯斗嘴
凤姐仍是下来张罗，一时出至廊上，鸳鸯等正吃的高兴，|凤姐还是下来张罗，一会儿走到廊上，鸳鸯她们正吃得高兴，
见他来了，鸳鸯等站起来道：“奶奶又出来作什么？让我们也受用一会儿。”|见她来了，鸳鸯等人站起来说：“奶奶又出来做什么？让我们也享受一会儿。”
凤姐笑道：“鸳鸯小蹄子越发坏了，我替你当差，倒不领情，还抱怨我。还不快斟一钟酒来我喝呢。”|凤姐笑道：“鸳鸯小丫头越来越坏了，我替你当差，你倒不领情，还抱怨我。还不快倒一杯酒来给我喝。”
鸳鸯笑著忙斟了一杯酒，送至凤姐唇边，凤姐一扬脖子吃了。|鸳鸯笑着连忙倒了一杯酒，送到凤姐嘴边，凤姐一仰脖子喝了。
琥珀彩霞二人也斟上一杯，送至凤姐唇边，那凤姐也吃了。|琥珀、彩霞两人也各倒了一杯，送到凤姐嘴边，凤姐也都喝了。
平儿早剔了一壳黄子送来，凤姐道：“多倒些姜醋。”一面也吃了，|平儿早剔好了一壳蟹黄送来，凤姐说：“多倒些姜醋。”一边也吃了，
笑道：“你们坐著吃罢，我可去了。”|笑道：“你们坐着吃吧，我可要走了。”
鸳鸯笑道：“好没脸，吃我们的东西。”|鸳鸯笑道：“好不要脸，吃我们的东西。”
凤姐儿笑道：“你和我少作怪。你知道你琏二爷爱上了你，要和老太太讨了你作小老婆呢。”|凤姐笑道：“你少跟我作怪。你知道吗，你琏二爷看上了你，要跟老太太讨你去做小老婆呢。”
鸳鸯道：“啐，这也是作奶奶说出来的话！我不拿腥手抹你一脸算不得。”|鸳鸯说：“呸，这也是做奶奶的人说的话！我不拿沾着蟹腥的手抹你一脸，就不算数。”
说著赶来就要抹。|说着赶过来就要抹。
凤姐儿央道：“好姐姐，饶我这一遭儿罢。”|凤姐求道：“好姐姐，饶了我这一回吧。”
! 凤姐在主子面前伺候，到了丫头们这里，喝酒吃蟹、说笑打闹，像姐妹一样。鸳鸯是贾母最信任的丫头，凤姐也要让她三分。
! 凤姐说贾琏要讨鸳鸯做小老婆，是玩笑，也是伏笔：第四十六回贾赦真的要讨鸳鸯做妾，鸳鸯以死相拒。

# 七、平儿抹了凤姐一脸
琥珀笑道：“鸳丫头要去了，平丫头还饶他？|琥珀笑道：“鸳丫头要是被讨去了，平丫头还能饶了她？
你们看看他，没有吃了两个螃蟹，倒喝了一碟子醋，他也算不会揽酸了。”|你们看看她，螃蟹没吃两个，倒喝了一碟子醋，她也算是不会吃醋了。”
平儿手里正掰了个满黄的螃蟹，听如此奚落他，便拿著螃蟹照著琥珀脸上抹来，|平儿手里正掰着一个满是蟹黄的螃蟹，听琥珀这么取笑她，就拿着螃蟹照着琥珀脸上抹过去，
口内笑骂”我把你这嚼舌根的小蹄子！”|嘴里笑骂：“我把你这个嚼舌根的小丫头！”
琥珀也笑著往旁边一躲，平儿使空了，往前一撞，正恰恰的抹在凤姐儿腮上。|琥珀也笑着往旁边一躲，平儿扑了个空，往前一撞，正好抹在凤姐的腮帮子上。
凤姐儿正和鸳鸯嘲笑，不防唬了一跳，嗳哟了一声。|凤姐正在和鸳鸯说笑，没防备，吓了一跳，“哎哟”一声。
众人撑不住都哈哈的大笑起来。|大家忍不住都哈哈大笑起来。
凤姐也禁不住笑骂道：“死娼妇！吃离了眼了，混抹你娘的。”|凤姐也忍不住笑骂道：“死丫头！吃昏了眼了，乱抹你娘的。”
平儿忙赶过来替他擦了，亲自去端水。|平儿连忙赶过来替她擦了，亲自去端水。
鸳鸯道：“阿弥陀佛！这是个报应。”|鸳鸯说：“阿弥陀佛！这是报应。”
! “喝了一碟子醋”，琥珀笑平儿吃醋。平儿是贾琏的通房丫头，凤姐又是有名的醋坛子。贾琏真要讨了鸳鸯，平儿和凤姐都不好过。
! 平儿抹凤姐一脸蟹黄，是全书最热闹的一幕。主子奴才打成一团，这时的贾府，还是一片和乐。

# 八、贾母问乐什么
贾母那边听见，一叠声问：“见了什么这样乐，告诉我们也笑笑。”|贾母那边听见了，一连声问：“看见什么了这么乐，告诉我们也笑笑。”
鸳鸯等忙高声笑回道：“二奶奶来抢螃蟹吃，平儿恼了，抹了他主子一脸的螃蟹黄子。主子奴才打架呢。”|鸳鸯等人连忙大声笑着回道：“二奶奶来抢螃蟹吃，平儿恼了，抹了她主子一脸的螃蟹黄。主子奴才打架呢。”
贾母和王夫人等听了也笑起来。|贾母和王夫人等人听了也笑起来。
贾母笑道：“你们看他可怜见的，把那小腿子脐子给他点子吃也就完了。”|贾母笑道：“你们看她怪可怜的，把那小腿和蟹脐给她吃点也就是了。”
鸳鸯等笑著答应了，高声又说道：“这满桌子的腿子，二奶奶只管吃就是了。”|鸳鸯等人笑着答应了，又大声说：“这满桌子的蟹腿，二奶奶只管吃就是了。”
凤姐洗了脸走来，又伏侍贾母等吃了一回。|凤姐洗了脸走过来，又伺候贾母等人吃了一会儿。
黛玉独不敢多吃，只吃了一点儿夹子肉就下来了。|只有黛玉不敢多吃，只吃了一点蟹钳里的肉就离席了。
! 贾母顺着笑话说“把小腿子脐子给他吃”，蟹腿蟹脐是最不值钱的部分。贾母也会开玩笑，这一家人其乐融融。
! 满桌欢笑，只有黛玉“不敢多吃”。螃蟹性寒，她身体弱，什么热闹都只能沾一点边。

# 九、贾母回房
贾母一时不吃了，大家方散，都洗了手，也有看花的，也有弄水看鱼的，游玩了一回。|一会儿贾母不吃了，大家才散开，都洗了手，有的去看花，有的去玩水看鱼，游玩了一阵。
王夫人因回贾母说：“这里风大，才又吃了螃蟹，老太太还是回房去歇歇罢了。若高兴，明日再来逛逛。”|王夫人就对贾母说：“这里风大，刚才又吃了螃蟹，老太太还是回房去歇歇吧。要是高兴，明天再来逛逛。”
贾母听了，笑道：“正是呢。我怕你们高兴，我走了又怕扫了你们的兴。既这么说，咱们就都去罢。”|贾母听了，笑道：“正是呢。我怕你们正高兴，我走了又怕扫了你们的兴。既然这么说，咱们就都走吧。”
回头又嘱咐湘云：“别让你宝哥哥林姐姐多吃了。”|回头又嘱咐湘云：“别让你宝哥哥、林姐姐多吃了。”
湘云答应著。|湘云答应着。
又嘱咐湘云宝钗二人说：“你两个也别多吃。那东西虽好吃，不是什么好的，吃多了肚子疼。”|又嘱咐湘云、宝钗两人说：“你们两个也别多吃。那东西虽然好吃，却不是什么好东西，吃多了肚子疼。”
二人忙应著送出园外，仍旧回来，令将残席收拾了另摆。|两人连忙答应着，把贾母送出园外，又回来，叫人把残席收拾了重新摆。
! 贾母临走第一个嘱咐的是“宝哥哥林姐姐”，第二个才是“你两个”。宝玉和黛玉，在贾母心里始终连在一起。

# 十、诗社开席
宝玉道：“也不用摆，咱们且作诗。|宝玉说：“也不用摆了，咱们先作诗。
把那大团圆桌就放在当中，酒菜都放著。|把那张大圆桌就放在中间，酒菜都放着。
也不必拘定坐位，有爱吃的大家去吃，散坐岂不便宜。”|也不必固定座位，谁爱吃就去吃，随便坐岂不方便。”
宝钗道：“这话极是。”|宝钗说：“这话很对。”
湘云道：“虽如此说，还有别人。”|湘云说：“话虽这么说，还有别人呢。”
因又命另摆一桌，拣了热螃蟹来，请袭人，紫鹃，司棋，待书，入画，莺儿，翠墨等一处共坐。|就又叫另摆一桌，挑了热螃蟹来，请袭人、紫鹃、司棋、待书、入画、莺儿、翠墨等人坐在一起吃。
山坡桂树底下铺下两条花毡，命答应的婆子并小丫头等也都坐了，只管随意吃喝，等使唤再来。|在山坡桂树下铺了两条花毡，叫伺候的婆子和小丫头们也都坐下，只管随便吃喝，等要使唤的时候再来。
! 长辈一走，规矩就散了。宝玉说“不必拘定坐位”，正是大观园里最自在的时候。
! 湘云又想到了各房的大丫头，连婆子小丫头都铺了毡子请她们坐。湘云做东，人人有份。

# 十一、各人闲态
湘云便取了诗题，用针绾在墙上。|湘云就拿出诗题，用针别在墙上。
众人看了，都说：“新奇固新奇，只怕作不出来。”|大家看了，都说：“新奇倒是新奇，只怕作不出来。”
湘云又把不限韵的原故说了一番。|湘云又把不限韵的缘故说了一遍。
宝玉道：“这才是正理，我也最不喜限韵。”|宝玉说：“这才是正理，我也最不喜欢限韵。”
林黛玉因不大吃酒，又不吃螃蟹，自令人掇了一个绣墩倚栏杆坐著，拿著钓竿钓鱼。|林黛玉因为不大喝酒，又不吃螃蟹，自己叫人搬了一个绣墩，靠着栏杆坐着，拿着钓竿钓鱼。
宝钗手里拿著一枝桂花玩了一回，俯在窗槛上掐了桂蕊掷向水面，引的游鱼浮上来唼喋。|宝钗手里拿着一枝桂花玩了一会儿，俯在窗台上掐下桂花蕊扔到水面上，引得游鱼浮上来吞吃。
湘云出一回神，又让一回袭人等，又招呼山坡下的众人只管放量吃。|湘云出了一会儿神，又招呼袭人等人吃，又招呼山坡下的众人只管放开吃。
探春和李纨惜春立在垂柳阴中看鸥鹭。|探春和李纨、惜春站在垂柳的树荫里看鸥鹭。
迎春又独在花阴下拿著花针穿茉莉花。|迎春又一个人在花荫下拿着花针穿茉莉花。
宝玉又看了一回黛玉钓鱼，一回又俯在宝钗旁边说笑两句，一回又看袭人等吃螃蟹，自己也陪他饮两口酒。|宝玉一会儿看黛玉钓鱼，一会儿又俯在宝钗旁边说笑两句，一会儿又去看袭人她们吃螃蟹，自己也陪着喝两口酒。
袭人又剥一壳肉给他吃。|袭人又剥了一壳蟹肉给他吃。
! 这是一幅大观园行乐图：黛玉钓鱼，宝钗喂鱼，湘云张罗，探春看鸥鹭，迎春穿茉莉，宝玉东看看西看看。每个人做的事，都是她的性情。
! 迎春“独在花阴下”穿茉莉，她总是一个人，不声不响。

# 十二、黛玉要烧酒
黛玉放下钓竿，走至座间，拿起那乌银梅花自斟壶来，拣了一个小小的海棠冻石蕉叶杯。|黛玉放下钓竿，走到座位间，拿起那把乌银梅花自斟壶，挑了一个小小的海棠冻石蕉叶杯。
丫鬟看见，知他要饮酒，忙著走上来斟。|丫鬟看见了，知道她要喝酒，连忙走上来要给她倒。
黛玉道：“你们只管吃去，让我自斟，这才有趣儿。”|黛玉说：“你们只管吃去，让我自己倒，这才有意思。”
说著便斟了半盏，看时却是黄酒，因说道：|说着就倒了半杯，一看却是黄酒，就说：
“我吃了一点子螃蟹，觉得心口微微的疼，须得热热的喝口烧酒。”|“我吃了一点螃蟹，觉得心口微微有点疼，得热热地喝口烧酒。”
宝玉忙道：“有烧酒。”|宝玉连忙说：“有烧酒。”
便令将那合欢花浸的酒烫一壶来。|就叫人把那用合欢花泡的酒烫一壶来。
黛玉也只吃了一口便放下了。|黛玉也只喝了一口就放下了。
! 黛玉吃了一点螃蟹就“心口微微的疼”，她的身子连这点寒气都受不住。
! 宝玉一听黛玉要烧酒，立刻就说有，还特意叫烫合欢花酒。合欢，就是合家欢、夫妻欢。宝玉的心思，全在这一壶酒里。

# 十三、各人勾题
宝钗也走过来，另拿了一只杯来，也饮了一口，|宝钗也走过来，另拿了一只杯子，也喝了一口，
便蘸笔至墙上把头一个《忆菊》勾了，底下又赘了一个“蘅”字。|就蘸笔到墙上把第一个《忆菊》勾了，下面又添了一个“蘅”字。
宝玉忙道：“好姐姐，第二个我已经有了四句了，你让我作罢。”|宝玉连忙说：“好姐姐，第二个我已经有了四句了，你让我作吧。”
宝钗笑道：“我好容易有了一首，你就忙的这样。”|宝钗笑道：“我好不容易有了一首，你就急成这样。”
黛玉也不说话，接过笔来把第八个《问菊》勾了，接著把第十一个《菊梦》也勾了，也赘一个“潇”字。|黛玉也不说话，接过笔来把第八个《问菊》勾了，接着把第十一个《菊梦》也勾了，也添了一个“潇”字。
宝玉也拿起笔来，将第二个《访菊》也勾了，也赘上一个“绛”字。|宝玉也拿起笔来，把第二个《访菊》也勾了，也添上一个“绛”字。
探春走来看看道：“竟没有人作《簪菊》，让我作这《簪菊》。”|探春走过来看了看说：“竟然没人作《簪菊》，让我来作这个《簪菊》。”
又指著宝玉笑道：“才宣过总不许带出闺阁字样来，你可要留神。”|又指着宝玉笑道：“刚宣布过，诗里一概不许带出闺阁的字眼，你可要留神。”
说著，只见史湘云走来，将第四第五《对菊》《供菊》一连两个都勾了，也赘上一个“湘”字。|说着，只见史湘云走过来，把第四、第五《对菊》《供菊》一连两个都勾了，也添上一个“湘”字。
! 黛玉喝了一口酒，“也不说话”，一下子勾了两个题目。《问菊》《菊梦》，一个是问，一个是梦，最合她的性情。
! 探春提醒宝玉“不许带出闺阁字样”，《簪菊》是把菊花插在头上，最容易写成女子梳妆，宝玉最爱写女儿，所以要提醒他。

# 十四、湘云的号“枕霞旧友”
探春道：“你也该起个号。”|探春说：“你也该起个号。”
湘云笑道：“我们家里如今虽有几处轩馆，我又不住著，借了来也没趣。”|湘云笑道：“我们家里现在虽然有几处轩馆，我又不住在那里，借来用也没意思。”
宝钗笑道：“方才老太太说，你们家也有这个水亭叫‘枕霞阁’，难道不是你的。如今虽没了，你到底是旧主人。”|宝钗笑道：“刚才老太太说，你们家也有这样一个水亭叫‘枕霞阁’，难道不是你的。现在虽然没有了，你到底是旧主人。”
众人都道有理，宝玉不待湘云动手，便代将“湘”字抹了，改了一个“霞”字。|大家都说有理，宝玉不等湘云动手，就替她把“湘”字抹了，改成了一个“霞”字。
又有顿饭工夫，十二题已全，各自誊出来，都交与迎春，|又过了一顿饭的工夫，十二个题目都作完了，各人誊写出来，都交给迎春，
另拿了一张雪浪笺过来，一并誊录出来，某人作的底下赘明某人的号。|另外拿了一张雪浪纸过来，全部誊写在一起，谁作的就在下面注明谁的号。
李纨等从头看起：|李纨等人从头看起：
! “我又不住著”，湘云在叔叔家住，家里的轩馆没有一处是她的。她连起个号都没地方借。
! “如今虽没了”，史家的枕霞阁已经不在了。史家的败落，比贾家来得更早。
! 宝钗一句话，替湘云找到了号，又把贾母的话拿来用，又贴切又体面。宝钗处处都能想到别人想不到的地方。

# 十五、《忆菊》《访菊》《种菊》
忆菊|《忆菊》
蘅芜君|蘅芜君（宝钗）
~怅望西风抱闷思，蓼红苇白断肠时。|在西风中惆怅地远望，满怀愁思，正是蓼花红、芦苇白、令人断肠的时节。
~空篱旧圃秋无迹，瘦月清霜梦有知。|空空的篱笆、旧日的花圃里，看不到秋菊的踪迹；只有清瘦的月亮和寒霜，在梦里还知道它。
~念念心随归雁远，寥寥坐听晚砧痴，|心心念念跟着南归的大雁飞向远方，冷冷清清地坐着，痴痴地听着傍晚的捣衣声。
~谁怜我为黄花病，慰语重阳会有期。|谁可怜我为了菊花而病，只能安慰自己说重阳节总会到来。
访菊|《访菊》
怡红公子|怡红公子（宝玉）
~闲趁霜晴试一游，酒杯药盏莫淹留。|趁着霜后晴天，闲来出去游一游，别再被酒杯和药碗绊住。
~霜前月下谁家种，槛外篱边何处愁。|霜前月下，是谁家种的菊花？栏杆外、篱笆边，它在哪里发愁？
~蜡屐远来情得得，冷吟不尽兴悠悠。|穿着木屐远道而来，情意浓浓；冷冷地吟诗吟不尽，兴致悠长。
~黄花若解怜诗客，休负今朝挂杖头。|菊花要是懂得怜惜诗人，就别辜负我今天挂在手杖头上的酒钱。
种菊|《种菊》
怡红公子|怡红公子（宝玉）
~携锄秋圃自移来，篱畔庭前故故栽。|扛着锄头到秋天的花圃里亲自移来，在篱笆边、庭院前特意栽下。
~昨夜不期经雨活，今朝犹喜带霜开。|没想到昨夜一场雨让它活了，今天早上欣喜地看到它带着霜开了。
~冷吟秋色诗千首，醉酹寒香酒一杯。|面对秋色冷吟诗千首，醉中把一杯酒洒给这寒香。
~泉溉泥封勤护惜，好知井径绝尘埃。|用泉水浇灌、用泥土封培，勤加爱护，好让它知道这院中小路远离尘埃。
! 宝钗的《忆菊》写得深沉，“空篱旧圃秋无迹，瘦月清霜梦有知”是名句。“谁怜我为黄花病”，宝钗一向不露愁绪，诗里却有很深的寂寞。
! “挂杖头”用晋代阮修的典故：他出门总把一百文钱挂在手杖头上，到酒店就喝。宝玉的诗处处用名士的典故，是他向往的潇洒。

# 十六、《对菊》《供菊》《咏菊》
对菊|《对菊》
枕霞旧友|枕霞旧友（湘云）
~别圃移来贵比金，一丛浅淡一丛深。|从别的园圃移来，珍贵得像黄金，一丛颜色浅淡，一丛颜色深浓。
~萧疏篱畔科头坐，清冷香中抱膝吟。|在稀疏的篱笆边不戴帽子坐着，在清冷的香气中抱着膝盖吟诗。
~数去更无君傲世，看来惟有我知音。|数来数去，再没有比你更傲视世俗的了；看来看去，只有我是你的知音。
~秋光荏苒休辜负，相对原宜惜寸阴。|秋光匆匆流逝，不要辜负了；你我相对，本该珍惜每一寸光阴。
供菊|《供菊》
枕霞旧友|枕霞旧友（湘云）
~弹琴酌酒喜堪俦，几案婷婷点缀幽。|弹琴喝酒，喜欢有它做伴；它亭亭立在桌上，点缀出一片幽静。
~隔座香分三径露，抛书人对一枝秋。|隔着座位，分来了庭院小路上的露香；放下书本的人，对着这一枝秋色。
~霜清纸帐来新梦，圃冷斜阳忆旧游。|霜气清冷，纸帐里做了新梦；花圃寒凉，斜阳中回忆起旧日的游赏。
~傲世也因同气味，春风桃李未淹留。|它傲视世俗，也是因为和我气味相投；春风里的桃李，从来留不住我。
咏菊|《咏菊》
潇湘妃子|潇湘妃子（黛玉）
~无赖诗魔昏晓侵，绕篱欹石自沉音。|无可奈何，作诗的痴迷从早到晚缠着我，我绕着篱笆、靠着石头，独自低声吟哦。
~毫端蕴秀临霜写，口齿噙香对月吟。|笔尖蕴含着秀气，对着霜下的菊花书写；口齿间含着香气，对着月亮吟咏。
~满纸自怜题素怨，片言谁解诉秋心。|满纸都是自怜，写的是一片幽怨；我的片言只语，谁能懂得这秋天的心事？
~一从陶令平章后，千古高风说到今。|自从陶渊明品评过菊花以后，它的高风亮节千古以来一直被人传颂。
! 湘云的诗豪放洒脱，“科头坐”“抱膝吟”，不戴帽子、抱膝而坐，正是湘云不拘礼法的样子。
! “抛书人对一枝秋”，湘云这一句写得最好，下面黛玉专门夸了它。
! 黛玉的《咏菊》夺魁，“满纸自怜题素怨，片言谁解诉秋心”，写的是菊，更是她自己：满腹心事，无人能懂。
! “陶令”是陶渊明，他做过彭泽县令，爱菊，写过“采菊东篱下”。菊花从此成了隐士高洁的象征。

画菊|《画菊》
蘅芜君|蘅芜君（宝钗）
~诗馀戏笔不知狂，岂是丹青费较量。|作完诗，余兴未尽，随手画几笔，也不觉得狂妄，哪里是在绘画技法上费心计较。
~聚叶泼成千点墨，攒花染出几痕霜。|把叶子聚在一起，泼成千点墨色；把花攒在一起，染出几道霜痕。
~淡浓神会风前影，跳脱秋生腕底香。|浓淡之间，领会了它在风前的神韵；手腕灵动，笔下生出秋天的香气。
~莫认东篱闲采掇，粘屏聊以慰重阳。|别把它当成东篱下的真菊去随意采摘，把它贴在屏风上，暂且用来慰藉重阳节吧。
问菊|《问菊》
潇湘妃子|潇湘妃子（黛玉）
~欲讯秋情众莫知，喃喃负手叩东篱。|想问问秋天的心事，可众人都不知道，我背着手，喃喃自语，去叩问东篱下的菊花。
~孤标傲世偕谁隐，一样花开为底迟？|你孤高傲世，和谁一起隐居？同样是花，你为什么开得这样迟？
~圃露庭霜何寂寞，鸿归蛩病可相思？|花圃里的露水、庭院里的寒霜，多么寂寞；大雁南归、蟋蟀病弱的时候，你可也相思？
~休言举世无谈者，解语何妨片语时。|别说世上没有可以交谈的人，你若能懂人话，何妨跟我说上片刻。
簪菊|《簪菊》
蕉下客|蕉下客（探春）
~瓶供篱栽日日忙，折来休认镜中妆。|插在瓶里、栽在篱边，天天忙个不停；折下来插在头上，别当作是对镜梳妆。
~长安公子因花癖，彭泽先生是酒狂。|长安的公子爱花成癖，彭泽的陶先生是个酒狂。
~短鬓冷沾三径露，葛巾香染九秋霜。|短短的鬓发上冷冷地沾着小路上的露水，葛布头巾上染着深秋寒霜的香气。
~高情不入时人眼，拍手凭他笑路旁。|这份高雅的情怀，世俗的人看不上，任凭他们在路边拍手嘲笑。
! 黛玉的《问菊》是全书名作。“孤标傲世偕谁隐，一样花开为底迟”，问菊花为什么孤傲、为什么迟开，其实是问自己：为什么这样孤独，为什么与众不同。
! “休言举世无谈者，解语何妨片语时”，黛玉觉得满世界无人可说话，只好去和花说。
! 探春的《簪菊》不写女子插花，写男人插花：长安公子、彭泽先生。她听了自己的提醒，一点闺阁气都没有。“高情不入时人眼”，正是探春的志气。

蕉下客|蕉下客（探春）
~露凝霜重渐倾欹，宴赏才过小雪时。|露水凝结、寒霜沉重，菊花渐渐倾斜；赏菊的宴席刚过，已经到了小雪节气。
~蒂有余香金淡泊，枝无全叶翠离披。|花蒂上还有余香，金黄的颜色已经淡了；枝上没有完整的叶子，翠绿零零落落。
~半床落月蛩声病，万里寒云雁阵迟。|半床的落月光里，蟋蟀叫声微弱；万里寒云中，大雁的队伍迟迟飞过。
~明岁秋风知再会，暂时分手莫相思。|明年秋风起时，知道还能再相会，暂时分别，不要相思。
! 黛玉的《菊梦》“醒时幽怨同谁诉”，和《咏菊》“片言谁解诉秋心”、《问菊》“解语何妨片语时”一样，三首诗都在问：我能和谁说？
! “庄生蝶”是庄周梦见自己变成蝴蝶，醒来不知是庄周梦蝶，还是蝶梦庄周。黛玉说她梦里不想成仙，只想寻旧日的知己，这知己是谁，不言而喻。
! 探春的《残菊》收尾，“明岁秋风知再会，暂时分手莫相思”。探春后来远嫁，一去不回，这一句成了反讽：分了手，就再也没有会。

# 十九、潇湘妃子夺魁
众人看一首，赞一首，彼此称扬不已。|大家看一首，夸一首，彼此称赞不已。
李纨笑道：“等我从公评来。通篇看来，各有各人的警句。|李纨笑道：“等我公平地评一评。整体看来，各人都有各人的好句子。
今日公评：《咏菊》第一，《问菊》第二，《菊梦》第三，|今天公平评定：《咏菊》第一，《问菊》第二，《菊梦》第三，
题目新，诗也新，立意更新，恼不得要推潇湘妃子为魁了，|题目新，诗也新，立意更新，没办法，只好推潇湘妃子为第一了，
然后《簪菊》《对菊》《供菊》《画菊》《忆菊》次之。”|然后是《簪菊》《对菊》《供菊》《画菊》《忆菊》依次排下来。”
宝玉听说，喜的拍手叫”极是，极公道。”|宝玉听了，高兴得拍手叫道：“对极了，公道极了。”
黛玉道：“我那首也不好，到底伤于纤巧些。”|黛玉说：“我那首也不好，到底太纤细小巧了些。”
李纨道：“巧的却好，不露堆砌生硬。”|李纨说：“巧得好，不显得堆砌生硬。”
! 回目“林潇湘魁夺菊花诗”。上回海棠诗宝钗第一，这回菊花诗黛玉包揽了前三名。
! 宝玉听黛玉夺魁，比自己得了第一还高兴。上回他替黛玉不服，这回终于“极公道”了。
! 宝钗的《忆菊》排在最后，《画菊》也在后面。宝钗的诗稳重，可菊花题要的是性情，正是黛玉所长。

# 二十、互评警句
黛玉道：“据我看来，头一句好的是‘圃冷斜阳忆旧游’，这句背面傅粉。|黛玉说：“依我看，最好的一句是‘圃冷斜阳忆旧游’，这句是从反面着笔。
‘抛书人对一枝秋’已经妙绝，将供菊说完，没处再说，故翻回来想到未拆未供之先，意思深透。”|‘抛书人对一枝秋’已经妙极了，把供菊说完了，没处再说，所以翻回去想到还没折下、还没供起来之前，意思深透。”
李纨笑道：“固如此说，你的‘口齿噙香’句也敌的过了。”|李纨笑道：“话虽这么说，你的‘口齿噙香’这句也比得上了。”
探春又道：“到底要算蘅芜君沉著，‘秋无迹’，‘梦有知’，把个忆字竟烘染出来了。”|探春又说：“到底还是蘅芜君沉稳，‘秋无迹’‘梦有知’，把一个‘忆’字烘托渲染出来了。”
宝钗笑道：“你的‘短鬓冷沾’，‘葛巾香染’，也就把簪菊形容的一个缝儿也没了。”|宝钗笑道：“你的‘短鬓冷沾’‘葛巾香染’，也把簪菊写得一点缝隙都没有了。”
湘云道：“‘偕谁隐’，‘为底迟’，真个把个菊花问的无言可对。”|湘云说：“‘偕谁隐’‘为底迟’，真是把菊花问得无话可答了。”
李纨笑道：“你的‘科头坐’，‘抱膝吟’，竟一时也不能别开，菊花有知，也必腻烦了。”|李纨笑道：“你的‘科头坐’‘抱膝吟’，竟然一会儿也离不开，菊花要是有知，也一定嫌烦了。”
说的大家都笑了。|说得大家都笑了。
! 黛玉夸的是湘云的诗，探春夸宝钗，宝钗夸探春，湘云夸黛玉。姐妹之间互相欣赏，这是大观园最美好的样子。
! 李纨笑湘云对着菊花“科头坐”“抱膝吟”，菊花都要嫌烦，是笑湘云痴。

# 二十一、宝玉又落第
宝玉笑道：“我又落第。|宝玉笑道：“我又落榜了。
难道‘谁家种’，‘何处秋’，‘蜡屐远来’，‘冷吟不尽’，都不是访，|难道‘谁家种’‘何处秋’‘蜡屐远来’‘冷吟不尽’，都不算是访，
‘昨夜雨’，‘今朝霜’，都不是种不成？|‘昨夜雨’‘今朝霜’，都不算是种不成？
但恨敌不上‘口齿噙香对月吟’，‘清冷香中抱膝吟’，‘短鬓’，‘葛巾’，‘金淡泊’，‘翠离披’，‘秋无迹’，‘梦有知’这几句罢了。”|只恨比不上‘口齿噙香对月吟’‘清冷香中抱膝吟’‘短鬓’‘葛巾’‘金淡泊’‘翠离披’‘秋无迹’‘梦有知’这几句罢了。”
又道：“明儿闲了，我一个人作出十二首来。”|又说：“以后闲了，我一个人作出十二首来。”
李纨道：“你的也好，只是不及这几句新巧就是了。”|李纨说：“你的也好，只是比不上这几句新巧罢了。”
! 宝玉自己落第，却把姐妹们的好句子一句句背出来，背得一字不差。他嘴上不服，心里是真佩服。
! 宝玉诗里写的“何处秋”，原诗其实是“何处愁”，宝玉自己都记错了，可见他也不太在意自己的诗。

# 二十二、宝玉咏螃蟹
大家又评了一回，复又要了热蟹来，就在大圆桌子上吃了一回。|大家又评论了一会儿，又要了热螃蟹来，就在大圆桌上吃了一阵。
宝玉笑道：“今日持螯赏桂，亦不可无诗。我已吟成，谁还敢作呢？”|宝玉笑道：“今天拿着蟹钳赏桂花，也不能没有诗。我已经吟成了，谁还敢作？”
说著，便忙洗了手提笔写出。众人看道：|说着，就赶紧洗了手提笔写出来。大家看到：
~持螯更喜桂阴凉，泼醋擂姜兴欲狂。|拿着蟹钳，更喜欢桂树下的阴凉，浇上醋、捣上姜，兴致高得要发狂。
~饕餮王孙应有酒，横行公子却无肠。|我这个贪吃的王孙应该有酒相伴，那横着走的螃蟹公子却没有肚肠。
~脐间积冷馋忘忌，指上沾腥洗尚香。|螃蟹肚脐间积着寒气，嘴馋得忘了禁忌；手指上沾着腥味，洗了还留着香。
~原为世人美口腹，坡仙曾笑一生忙。|螃蟹原本就是为了满足世人的口腹之欲，难怪苏东坡曾经笑自己一生都为口腹奔忙。
! 螃蟹横着走，所以叫“横行公子”；螃蟹没有肠子，“无肠”又是没心肝的意思。宝玉的螃蟹诗写得俏皮，却还不够深。
! “饕餮王孙”是宝玉自嘲：他就是那个贪吃的公子哥儿。

# 二十三、黛玉咏螃蟹
黛玉笑道：“这样的诗，要一百首也有。”|黛玉笑道：“这样的诗，要一百首也有。”

~螯封嫩玉双双满，壳凸红脂块块香。|一对蟹钳里，满满地封着嫩玉似的肉；凸起的蟹壳里，一块块红脂香喷喷的。
~多肉更怜卿八足，助情谁劝我千觞。|肉多的地方，更爱你那八只脚；谁来劝我喝上千杯，助一助这份兴致。
~对斯佳品酬佳节，桂拂清风菊带霜。|对着这样的美味来过这美好的节日，桂花拂着清风，菊花带着寒霜。
宝玉看了正喝彩，黛玉便一把撕了，令人烧去，因笑道：|宝玉看了正要叫好，黛玉就一把撕了，叫人拿去烧了，还笑道：
“我的不及你的，我烧了他。你那个很好，比方才的菊花诗还好，你留著他给人看。”|“我的不如你的，我把它烧了。你那首很好，比刚才的菊花诗还好，你留着给人看吧。”
! 宝玉激她，黛玉“不答言，也不思索”，一挥就是一首，写得比宝玉还好，写完又撕了烧掉。她是要让宝玉知道：我不是作不出，是不屑作。
! 黛玉说宝玉的螃蟹诗“比方才的菊花诗还好”，是反话，笑宝玉的菊花诗不如螃蟹诗。
! 黛玉烧诗，是她的骄傲，也是她的习惯。第九十七回黛玉临终“焚稿断痴情”，烧掉了自己所有的诗稿。

# 二十四、宝钗讽螃蟹
宝钗接著笑道：“我也勉强了一首，未必好，写出来取笑儿罢。”|宝钗接着笑道：“我也勉强作了一首，不一定好，写出来给大家取笑吧。”
说著也写了出来。大家看时，写道是：|说着也写了出来。大家一看，写的是：
~桂霭桐阴坐举觞，长安涎口盼重阳。|在桂花的香雾、梧桐的树荫下坐着举杯，京城里的人都流着口水盼重阳。
~眼前道路无经纬，皮里春秋空黑黄。|它眼前的路不分横竖，横冲直撞；肚皮里的心计，不过是一包空空的黑膏黄膏。
看到这里，众人不禁叫绝。|看到这里，大家不由得叫绝。
宝玉道：“写得痛快！我的诗也该烧了。”|宝玉说：“写得痛快！我的诗也该烧了。”
又看底下道：|又看下面写道：
~酒未敌腥还用菊，性防积冷定须姜。|酒压不住腥气，还要用菊花；它性寒，怕积冷，一定要配姜。
~于今落釜成何益，月浦空馀禾黍香。|如今落进了锅里，又有什么用呢？月光下的水边，只空留着稻谷的香气。
众人看毕，都说这是食螃蟹绝唱，这些小题目，原要寓大意才算是大才，只是讽刺世人太毒了些。|大家看完，都说这是咏螃蟹的绝唱，这类小题目，本来就要寄托大意思才算是大才，只是讽刺世人太狠了些。
说著，只见平儿复进园来。不知作什么，且听下回分解。|说着，只见平儿又进园来了。不知她来做什么，请看下回。
! “眼前道路无经纬，皮里春秋空黑黄”，是全诗最狠的两句。螃蟹横行，不走正路；肚子里“春秋”（心计）满满，其实只是黑黄一包。骂的是那些横行霸道、满腹阴谋的人。
! “于今落釜成何益”，横行一世，最后都要落进锅里。宝钗一向温和，这首诗却毒辣得很。她讽刺的是谁？有人说是贾府里那些横行的爷们，有人说是她自己的哥哥薛蟠。
! 回目“薛蘅芜讽和螃蟹咏”。宝钗写诗从不露锋芒，这一首是例外。众人说她“讽刺世人太毒了些”，宝钗的端庄背后，原来看人看得这样透。

我成日家和人说笑，有个唐僧取经，就有个白马来驮他，|我常跟人说笑，有个唐僧去取经，就有一匹白马来驮他；

你就是你奶奶的一把总钥匙，还要这钥匙作什么？”|你就是你奶奶的一把总钥匙，还要这钥匙做什么？”
