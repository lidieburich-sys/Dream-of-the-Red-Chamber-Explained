<script type="text/plain" id="ch23">
# 一、刻石
话说贾元春自那日幸大观园回宫去后，便命将那日所有的题咏，命探春依次抄录妥协，|贾元春自从那天游大观园回宫以后，就把那天所有的题咏，叫探春按顺序抄写好，
自己编次，叙其优劣，又命在大观园勒石，为千古风流雅事。|自己编排次序、评定高下，又叫人在大观园里刻成石碑，作为千古流传的风流雅事。
因此，贾政命人各处选拔精工名匠，在大观园磨石镌字，|因此贾政叫人到处挑选手艺精湛的名匠，在大观园里磨石刻字，
贾珍率领蓉，萍等监工。|贾珍带着贾蓉、贾萍等人监工。
因贾蔷又管理著文官等十二个女戏并行头等事，不大得便，因此贾珍又将贾菖，贾菱唤来监工。|因为贾蔷又管着文官等十二个女戏子和戏装等事，不太方便，所以贾珍又把贾菖、贾菱叫来监工。
一日，汤蜡钉朱，动起手来。|一天，烫蜡、描红，动起工来。
这也不在话下。|这些也不多说。
! 元春叫探春抄录，第十八回也是探春誊录诗稿。元春看重的是探春的才干和稳妥。
! 文官是十二个女戏子之一，后来大观园散戏班时，她分给了贾母。

# 二、贾芹谋差事
且说那个玉皇庙并达摩庵两处，一班的十二个小沙弥并十二个小道士，如今挪出大观园来，贾政正想发到各庙去分住。|再说玉皇庙和达摩庵两处，那一班十二个小和尚和十二个小道士，现在从大观园搬出来了，贾政正想把他们分到各个庙里去住。
不想后街上住的贾芹之母周氏，正盘算著也要到贾政这边谋一个大小事务与儿子管管，也好弄些银钱使用，|没想到住在后街的贾芹的母亲周氏，正盘算着也要到贾政这边给儿子谋个大小差事管管，也好弄些银钱用，
可巧听见这件事出来，便坐轿子来求凤姐。|正好听说出了这件事，就坐着轿子来求凤姐。
凤姐因见他素日不大拿班作势的，便依允了，想了几句话便回王夫人说：|凤姐见她平时不怎么摆架子，就答应了，想好几句话就去回王夫人说：
“这些小和尚道士万不可打发到别处去，一时娘娘出来就要承应。|“这些小和尚小道士千万不能打发到别处去，说不定娘娘什么时候出来，就要用他们。
倘或散了，若再用时，可是又费事。|要是散了，再用的时候可就麻烦了。
依我的主意，不如将他们竟送到咱们家庙里铁槛寺去，月间不过派一个人拿几两银子去买柴米就完了。|依我的主意，不如干脆把他们送到咱们家庙铁槛寺去，每个月不过派一个人拿几两银子去买柴米就行了。
说声用，走去叫来，一点儿不费事呢。”|说一声要用，去叫来就是了，一点也不费事。”
王夫人听了，便商之于贾政。|王夫人听了，就去和贾政商量。
贾政听了笑道：“倒是提醒了我，就是这样。”|贾政听了笑道：“倒是提醒了我，就这么办。”
即时唤贾琏来。|马上叫贾琏来。
! 凤姐说得冠冕堂皇，全是替娘娘着想，其实是替贾芹谋一个肥差。二十四个小和尚小道士的“柴米钱”，就是贾芹的油水。
! 贾芹后来在铁槛寺聚赌嫖娼，闹出丑事，又是贾家衰败的一个缩影。

# 三、凤姐和贾琏争差事
当下贾琏正同凤姐吃饭，一闻呼唤，不知何事，放下饭便走。|这时贾琏正和凤姐吃饭，一听叫他，不知道什么事，放下饭就走。
凤姐一把拉住，笑道：“你且站住，听我说话。|凤姐一把拉住他，笑道：“你先站住，听我说话。
若是别的事我不管，若是为小和尚们的事，好歹依我这么著。”|要是别的事我不管，要是为了小和尚们的事，你好歹照我说的办。”
如此这般教了一套话。|就如此这般教了他一套话。
贾琏笑道：“我不知道，你有本事你说去。”|贾琏笑道：“我不知道，你有本事你自己说去。”
凤姐听了，把头一梗，把筷子一放，腮上似笑不笑的瞅著贾琏道：“你当真的，是玩话？”|凤姐听了，把头一扬，把筷子一放，脸上似笑非笑地瞅着贾琏说：“你是当真的，还是开玩笑？”
贾琏笑道：“西廊下五嫂子的儿子芸儿来求了我两三遭，要个事情管管。|贾琏笑道：“西廊下五嫂子的儿子芸儿来求了我两三回，要个差事管管。
我依了，叫他等著。|我答应了，叫他等着。
好容易出来这件事，你又夺了去。”|好不容易出了这件事，你又抢了去。”
凤姐儿笑道：“你放心。园子东北角子上，娘娘说了，还叫多多的种松柏树，楼底下还叫种些花草。|凤姐笑道：“你放心。园子东北角上，娘娘说了，还要多种些松柏树，楼底下还要种些花草。
等这件事出来，我管保叫芸儿管这件工程。”|等这件事出来了，我保证叫芸儿管这个工程。”
贾琏道：“果这样也罢了。|贾琏说：“要真这样也就算了。
只是昨儿晚上，我不过是要改个样儿，你就扭手扭脚的。”|只是昨天晚上，我不过是想换个样子，你就扭扭捏捏的。”
凤姐儿听了，嗤的一声笑了，向贾琏啐了一口，低下头便吃饭。|凤姐听了，“嗤”的一声笑了，朝贾琏啐了一口，低下头吃饭。
! 夫妻俩各有各的人要安插：凤姐要安排贾芹，贾琏答应了贾芸。一个差事，两边争抢。
! 贾琏最后一句是夫妻间的私房话，凤姐啐他一口，这是全书里写他俩难得的亲昵。

# 四、贾芹领了银子
贾琏已经笑著去了，到了前面见了贾政，果然是小和尚一事。|贾琏笑着走了，到前面见了贾政，果然是小和尚的事。
贾琏便依了凤姐主意，说道：“如今看来，芹儿倒大大的出息了，这件事竟交予他去管办。|贾琏就照凤姐的主意说：“现在看来，芹儿倒是大有长进了，这件事干脆交给他去办。
横竖照在里头的规例，每月叫芹儿支领就是了。”|反正照着在园里的规矩，每个月叫芹儿来支领就是了。”
贾政原不大理论这些事，听贾琏如此说，便如此依了。|贾政本来不太管这些事，听贾琏这么说，就照着办了。
贾琏回到房中告诉凤姐儿，凤姐即命人去告诉了周氏。|贾琏回到房里告诉凤姐，凤姐马上叫人去告诉了周氏。
贾芹便来见贾琏夫妻两个，感谢不尽。|贾芹就来见贾琏夫妇，千恩万谢。
凤姐又作情央贾琏先支三个月的，叫他写了领字，贾琏批票画了押，登时发了对牌出去。|凤姐又做人情，求贾琏先预支三个月的钱，叫贾芹写了领条，贾琏批了票、画了押，马上发出对牌去。
银库上按数发出三个月的供给来，白花花二三百两。|银库按数发出三个月的费用来，白花花的二三百两银子。
贾芹随手拈一块，撂予掌平的人，叫他们吃茶罢。|贾芹随手拿起一块，扔给管秤的人，叫他们拿去喝茶。
于是命小厮拿回家，与母亲商议。|然后叫小厮拿回家，和母亲商量。
登时雇了大叫驴，自己骑上，又雇了几辆车，至荣国府角门，唤出二十四个人来，坐上车，一径往城外铁槛寺去了。|马上雇了一头大叫驴，自己骑着，又雇了几辆车，到荣国府的角门，叫出二十四个人来，坐上车，直往城外铁槛寺去了。
当下无话。|这里不多说。
! 二十四个小和尚小道士，一个月的柴米钱就要七八十两。贾芹一到手就“随手拈一块”打赏，可见这笔钱的油水有多大。
! 第二十四回贾芸的舅舅卜世仁说“撞见了你们三房里的老四，骑著大叫驴，带著五辆车”，说的就是这一幕。

# 五、元春让姐妹们住进园子
如今且说贾元春，因在宫中自编大观园题咏之后，|再说贾元春在宫里编完大观园的题咏以后，
忽想起那大观园中景致，自己幸过之后，贾政必定敬谨封锁，不敢使人进去骚扰，岂不寥落。|忽然想起大观园的景致，自己游过以后，贾政一定会恭恭敬敬地封锁起来，不敢让人进去打扰，岂不是太冷清了。
况家中现有几个能诗会赋的姊妹，何不命他们进去居住，也不使佳人落魄，花柳无颜。|况且家里现有几个能作诗写赋的姐妹，何不叫她们进去住，也不让美人冷落、花柳失色。
却又想到宝玉自幼在姊妹丛中长大，不比别的兄弟，若不命他进去，只怕他冷清了，|又想到宝玉从小在姐妹堆里长大，和别的兄弟不一样，要是不叫他进去，只怕他会冷清，
一时不大畅快，未免贾母王夫人愁虑，须得也命他进园居住方妙。|一时不痛快，难免让贾母、王夫人担心，必须也叫他进园去住才好。
想毕，遂命太监夏守忠到荣国府来下一道谕，|想好了，就叫太监夏守忠到荣国府来传一道旨意，
命宝钗等只管在园中居住，不可禁约封锢，命宝玉仍随进去读书。|叫宝钗等人只管在园子里住，不要封锁禁闭，叫宝玉也跟着进去读书。
! 一道旨意，让大观园有了主人。元春想到了“佳人落魄，花柳无颜”，也想到了宝玉“冷清”，这位姐姐处处替弟弟打算。
! 这是宝玉一生最快乐的日子的开始。大观园是“女儿国”，是宝玉的理想国，也是一个注定要破灭的梦。

# 六、宝玉被叫去见贾政
贾政，王夫人接了这谕，待夏守忠去后，便来回明贾母，遣人进去各处收拾打扫，安设帘幔床帐。|贾政、王夫人接了这道旨意，等夏守忠走了，就来禀告贾母，派人进园到各处收拾打扫，安设帘幔床帐。
别人听了还自犹可，惟宝玉听了这谕，喜的无可不可。|别人听了还没什么，只有宝玉听了这道旨意，高兴得不得了。
正和贾母盘算，要这个，弄那个，忽见丫鬟来说：“老爷叫宝玉。”|正和贾母盘算着要这个要那个，忽然丫鬟来说：“老爷叫宝玉。”
宝玉听了，好似打了个焦雷，登时扫去兴头，脸上转了颜色，|宝玉听了，好像挨了一个炸雷，马上兴致全无，脸色都变了，
便拉著贾母扭的好似扭股儿糖，杀死不敢去。|拉着贾母扭来扭去像扭股糖一样，打死也不敢去。
贾母只得安慰他道：“好宝贝，你只管去，有我呢，他不敢委屈了你。|贾母只好安慰他说：“好宝贝，你只管去，有我呢，他不敢委屈你。
况且你又作了那篇好文章。|况且你又写了那么好的文章。
想是娘娘叫你进去住，他吩咐你几句，不过不教你在里头淘气。|想必是娘娘叫你进去住，他吩咐你几句，不过是不让你在里面淘气。
他说什么，你只好生答应著就是了。”|他说什么，你只管好好答应着就是了。”
一面安慰，一面唤了两个老嬷嬷来，吩咐“好生带了宝玉去，别叫他老子唬著他。”|一面安慰，一面叫来两个老嬷嬷，吩咐“好好带宝玉去，别叫他老子吓着他。”
老嬷嬷答应了。|老嬷嬷答应了。
! “好似打了个焦雷”：宝玉怕父亲，怕到这个地步。

# 七、金钏和宝玉
宝玉只得前去，一步挪不了三寸，蹭到这边来。|宝玉只好去了，一步挪不了三寸，磨磨蹭蹭地挪到这边来。
可巧贾政在王夫人房中商议事情，金钏儿，彩云，彩霞，绣鸾，绣凤等众丫鬟都在廊檐底下站著呢，|正好贾政在王夫人房里商量事情，金钏儿、彩云、彩霞、绣鸾、绣凤等丫鬟都在廊檐下站着，
一见宝玉来，都抿著嘴笑。|一见宝玉来，都抿着嘴笑。
金钏一把拉住宝玉，悄悄的笑道：“我这嘴上是才擦的香浸胭脂，你这会子可吃不吃了？”|金钏一把拉住宝玉，悄悄笑道：“我这嘴上是刚擦的香浸胭脂，你这会儿还吃不吃了？”
彩云一把推开金钏，笑道：“人家正心里不自在，你还奚落他。趁这会子喜欢，快进去罢。”|彩云一把推开金钏，笑道：“人家正心里不自在，你还取笑他。趁老爷这会儿高兴，快进去吧。”
宝玉只得挨进门去。|宝玉只好挨进门去。
! 金钏和宝玉开胭脂的玩笑，这一笔是伏线。第三十回宝玉又和金钏调笑，被王夫人听见，王夫人打了金钏一巴掌、把她撵出去，金钏投井而死。

# 八、贾政见宝玉
原来贾政和王夫人都在里间呢。|原来贾政和王夫人都在里间。
赵姨娘打起帘子，宝玉躬身进去。|赵姨娘掀起帘子，宝玉弯着身子进去。
只见贾政和王夫人对面坐在炕上说话，地下一溜椅子，迎春，探春，惜春，贾环四个人都坐在那里。|只见贾政和王夫人面对面坐在炕上说话，地上一排椅子，迎春、探春、惜春、贾环四个人都坐在那里。
一见他进来，惟有探春和惜春，贾环站了起来。|一见他进来，只有探春、惜春和贾环站了起来。
贾政一举目，见宝玉站在跟前，神彩飘逸，秀色夺人，|贾政一抬眼，见宝玉站在面前，神采飘逸，秀美夺目，
看看贾环，人物委琐，举止荒疏，|再看看贾环，相貌猥琐，举止粗俗，
忽又想起贾珠来，再看看王夫人只有这一个亲生的儿子，素爱如珍，自己的胡须将已苍白：|忽然又想起死去的贾珠来，再看看王夫人只有这一个亲生儿子，平时爱如珍宝，自己的胡子也快白了：
因这几件上，把素日嫌恶处分宝玉之心不觉减了八九。|因为这几件事，平时嫌弃责罚宝玉的心，不知不觉减了八九分。
半晌说道：“娘娘吩咐说，你日日外头嬉游，渐次疏懒，如今叫禁管，同你姊妹在园里读书写字。|过了半天才说：“娘娘吩咐说，你天天在外面玩耍，渐渐懒散了，现在叫人管着你，和姐妹们一起在园里读书写字。
你可好生用心习学，再如不守分安常，你可仔细！”|你可要好好用心学习，要是再不守本分，你可小心！”
宝玉连连的答应了几个“是”。|宝玉连声答应了几个“是”。
王夫人便拉他在身旁坐下。|王夫人就拉他在身边坐下。
他姊弟三人依旧坐下。|探春、惜春、贾环三个人又坐下了。
! 迎春没有站起来。她是姐姐，比宝玉大，所以不必起身，这是作者在细节处讲究的礼数。
! 一边是宝玉的“神彩飘逸”，一边是贾环的“人物委琐”。贾政心里的偏爱，连他自己都没察觉，贾环却天天感受得到。
! 这是全书里贾政对宝玉最温情的一刻：他也是一个渐渐老去、失去过长子的父亲。

# 九、“袭人”这个名字
王夫人摸挲著宝玉的脖项说道：“前儿的丸药都吃完了？”|王夫人摸着宝玉的脖子说：“前几天的丸药都吃完了？”
宝玉答道：“还有一丸。”|宝玉回答：“还有一丸。”
王夫人道：“明儿再取十丸来，天天临睡的时候，叫袭人伏侍你吃了再睡。”|王夫人说：“明天再拿十丸来，天天临睡的时候，叫袭人伺候你吃了再睡。”
宝玉道：“只从太太吩咐了，袭人天天晚上想著，打发我吃。”|宝玉说：“自从太太吩咐了，袭人天天晚上都记着，让我吃。”
贾政问道：“袭人是何人？”|贾政问：“袭人是什么人？”
王夫人道：“是个丫头。”|王夫人说：“是个丫头。”
贾政道：“丫头不管叫个什么罢了，是谁这样刁钻，起这样的名字？”|贾政说：“丫头随便叫个什么名字就行了，是谁这样刁钻，起这样的名字？”
王夫人见贾政不自在了，便替宝玉掩饰道：“是老太太起的。”|王夫人见贾政不高兴了，就替宝玉遮掩说：“是老太太起的。”
贾政道：“老太太如何知道这话，一定是宝玉。”|贾政说：“老太太怎么会知道这种话，一定是宝玉。”
宝玉见瞒不过，只得起身回道：|宝玉见瞒不过，只好站起来回答：
“因素日读诗，曾记古人有一句诗云：‘花气袭人知昼暖’。|“因为平时读诗，记得古人有一句诗说：‘花气袭人知昼暖’。
因这个丫头姓花，便随口起了这个名字。”|因为这个丫头姓花，就随口起了这个名字。”
王夫人忙又道：“宝玉，你回去改了罢。老爷也不用为这小事动气。”|王夫人连忙又说：“宝玉，你回去改了吧。老爷也不必为这点小事生气。”
贾政道：“究竟也无碍，又何用改。|贾政说：“其实也没什么妨碍，又何必改。
只是可见宝玉不务正，专在这些浓词艳赋上作工夫。”|只是可见宝玉不务正业，专在这些艳丽的诗词上下工夫。”
说毕，断喝一声：“作业的畜生，还不出去！”|说完，大喝一声：“作孽的畜生，还不出去！”
王夫人也忙道：“去罢，只怕老太太等你吃饭呢。”|王夫人也连忙说：“去吧，只怕老太太等你吃饭呢。”
! 一个丫鬟的名字，贾政一听就知道不是正经出处。“花气袭人”这样的句子，在他看来就是“浓词艳赋”。
! 第三回作者写袭人改名，用的是陆游的“花气袭人知骤暖”，这里宝玉说成“知昼暖”，各版本文字不同。
! 贾政刚才的温情只有片刻，一听“袭人”二字，就又变回了严父。

# 十、宝玉选怡红院，黛玉选潇湘馆
宝玉答应了，慢慢的退出去，向金钏儿笑著伸伸舌头，带著两个嬷嬷一溜烟去了。|宝玉答应着，慢慢退出去，对金钏儿笑着伸了伸舌头，带着两个嬷嬷一溜烟走了。
刚至穿堂门前，只见袭人倚门立在那里，一见宝玉平安回来，堆下笑来问道：“叫你作什么？”|刚到穿堂门前，只见袭人靠着门站在那里，一见宝玉平平安安回来了，满脸堆笑地问：“叫你去做什么？”
宝玉告诉他：“没有什么，不过怕我进园去淘气，吩咐吩咐。”|宝玉告诉她：“没什么，不过是怕我进园子去淘气，吩咐几句。”
一面说，一面回至贾母跟前，回明原委。|一边说，一边回到贾母跟前，说明了经过。
只见林黛玉正在那里，宝玉便问他：“你住那一处好？”|只见林黛玉正在那里，宝玉就问她：“你住哪一处好？”
林黛玉正心里盘算这事，忽见宝玉问他，便笑道：|林黛玉心里正在盘算这件事，忽然见宝玉问她，就笑道：
“我心里想著潇湘馆好，爱那几竿竹子隐著一道曲栏，比别处更觉幽静。”|“我心里想着潇湘馆好，喜欢那几竿竹子掩映着一道弯弯的栏杆，比别处更幽静。”
宝玉听了拍手笑道：“正和我的主意一样，我也要叫你住这里呢。|宝玉听了拍手笑道：“正和我的想法一样，我也想叫你住这里呢。
我就住怡红院，咱们两个又近，又都清幽。”|我就住怡红院，咱们两个离得又近，又都清幽。”
! 宝玉和黛玉想的一样，这就是“心有灵犀”。
! 潇湘馆用的是娥皇、女英泪洒湘竹的典故，黛玉自己选了这里，也就选了一生的眼泪。第三十七回探春给她起号“潇湘妃子”。

# 十一、各自搬进园子
两人正计较，就有贾政遣人来回贾母说：“二月二十二日子好，哥儿姐儿们好搬进去的。|两人正商量着，贾政就派人来回禀贾母说：“二月二十二日是好日子，哥儿姐儿们可以搬进去。
这几日内遣人进去分派收拾。”|这几天派人进去分派收拾。”
薛宝钗住了蘅芜苑，林黛玉住了潇湘馆，贾迎春住了缀锦楼，探春住了秋爽斋，惜春住了蓼风轩，李氏住了稻香村，宝玉住了怡红院。|薛宝钗住蘅芜苑，林黛玉住潇湘馆，贾迎春住缀锦楼，探春住秋爽斋，惜春住蓼风轩，李纨住稻香村，宝玉住怡红院。
每一处添两个老嬷嬷，四个丫头，除各人奶娘亲随丫鬟不算外，另有专管收拾打扫的。|每一处添两个老嬷嬷、四个丫头，除了各人的奶妈和贴身丫鬟不算，另外还有专管收拾打扫的。
至二十二日，一齐进去，登时园内花招绣带，柳拂香风，不似前番那等寂寞了。|到了二十二日，大家一起搬进去，园子里马上花枝招展、彩带飘飘，柳枝拂着香风，不像以前那样冷清了。
! 每个人的住处都合她的性情：宝钗的蘅芜苑雪洞一般，探春的秋爽斋开阔大气，惜春的蓼风轩冷清，李纨的稻香村朴素。
! 二月二十二日，脂批说这一天是作者特意选的，“花朝”前后，群芳入园。

# 十二、宝玉的四时即事诗
闲言少叙。|闲话少说。
且说宝玉自进花园以来，心满意足，再无别项可生贪求之心。|再说宝玉自从搬进园子以来，心满意足，再也没有别的贪求了。
每日只和姊妹丫头们一处，或读书，或写字，或弹琴下棋，作画吟诗，|每天只和姐妹丫头们在一起，或者读书，或者写字，或者弹琴下棋、画画作诗，
以至描鸾刺凤，斗草簪花，低吟悄唱，拆字猜枚，无所不至，倒也十分快乐。|甚至描花样、绣花鸟、斗草、戴花、低声吟唱、拆字猜拳，什么都玩，倒也十分快乐。
他曾有几首即事诗，虽不算好，却倒是真情真景，略记几首云：|他曾写过几首即事诗，虽然不算好，却是真情真景，大略记下几首：
春夜即事|《春夜即事》
~霞绡云幄任铺陈，隔巷蟆更听未真。|彩霞般的纱帐、云一样的帷幄随意铺开，隔着巷子的更鼓声听不真切。
~枕上轻寒窗外雨，眼前春色梦中人。|枕上带着微微的寒意，窗外下着雨；眼前的春色，就是梦中的人。
~盈盈烛泪因谁泣，点点花愁为我嗔。|烛泪盈盈，是为谁哭泣？花朵点点含愁，像是在为我生气。
~自是小鬟娇懒惯，拥衾不耐笑言频。|自然是小丫鬟娇懒惯了，裹着被子，不耐烦别人老说笑。
夏夜即事|《夏夜即事》
~倦绣佳人幽梦长，金笼鹦鹉唤茶汤。|绣花绣累了的美人做着长长的梦，金笼里的鹦鹉叫人送茶汤。
~窗明麝月开宫镜，室霭檀云品御香。|窗前明月像麝月打开的宫镜，屋里的香雾像檀云在品御香。
~琥珀杯倾荷露滑，玻璃槛纳柳风凉。|琥珀杯里倒出荷叶上滑润的露水，玻璃窗前吹进柳丝间的凉风。
~水亭处处齐纨动，帘卷朱楼罢晚妆。|水边的亭子里处处摇着白绢扇，卷起朱楼的帘子，美人卸下晚妆。
秋夜即事|《秋夜即事》
~绛芸轩里绝喧哗，桂魄流光浸茜纱。|绛芸轩里没有一点喧哗，月光流淌，浸透了红纱窗。
~苔锁石纹容睡鹤，井飘桐露湿栖鸦。|青苔锁住石纹，让仙鹤安睡；井边飘落梧桐的露水，打湿了栖息的乌鸦。
~抱衾婢至舒金凤，倚槛人归落翠花。|抱着被子的丫鬟来铺开绣金凤的被子，靠着栏杆的人回来，摘下头上的翠花。
~静夜不眠因酒渴，沉烟重拨索烹茶。|静夜里睡不着，是因为喝了酒口渴，重新拨开香灰，叫人煮茶。
冬夜即事|《冬夜即事》
~梅魂竹梦已三更，锦罽鹔衾睡未成。|梅花入魂、竹影入梦，已经三更了，盖着锦毯和鹔鹴裘还是睡不着。
~松影一庭惟见鹤，梨花满地不闻莺。|满院松影里只看见仙鹤，雪像梨花铺满地，听不见黄莺叫。
~女儿翠袖诗怀冷，公子金貂酒力轻。|女孩子们穿着翠袖，诗情也被冻得清冷；公子穿着金貂裘，酒力也显得淡薄。
~却喜侍儿知试茗，扫将新雪及时烹。|可喜的是丫鬟懂得品茶，扫来新下的雪及时煮茶。
! 诗里藏着丫鬟们的名字：“麝月”“檀云”“绛芸”。宝玉的生活，全是这些女孩子。
! 作者说这些诗“虽不算好，却倒是真情真景”。这是宝玉最无忧无虑的四季。

# 十三、宝玉出了名
因这几首诗，当时有一等势利人，见是荣国府十二三岁的公子作的，抄录出来各处称颂，|因为这几首诗，当时有一类势利的人，见是荣国府十二三岁的公子作的，抄出来到处称颂；
再有一等轻浮子弟，爱上那风骚妖艳之句，也写在扇头壁上，不时吟哦赏赞。|还有一类轻浮的子弟，喜欢那些风流艳丽的句子，也写在扇面和墙上，不时吟诵赞赏。
因此竟有人来寻诗觅字，倩画求题的。|因此竟然有人来求诗求字、求画求题的。
宝玉亦发得了意，镇日家作这些外务。|宝玉更加得意了，整天做这些“外务”。
! 势利人捧他是因为“荣国府公子”，轻浮子弟捧他是因为“风骚妖艳”，没有人真懂他的诗。

# 十四、宝玉烦闷，茗烟送书
谁想静中生烦恼，忽一日不自在起来，这也不好，那也不好，出来进去只是闷闷的。|谁知道清静中也会生出烦恼，忽然有一天他不自在起来，这也不好，那也不好，进进出出只是闷闷不乐。
园中那些人多半是女孩儿，正在混沌世界，天真烂漫之时，坐卧不避，嘻笑无心，|园子里的人多半是女孩子，正是懵懵懂懂、天真烂漫的时候，坐卧都不回避，嬉笑都没有心机，
那里知宝玉此时的心事。|哪里知道宝玉这时候的心事。
那宝玉心内不自在，便懒在园内，只在外头鬼混，却又痴痴的。|宝玉心里不自在，就懒得待在园里，只在外面瞎混，却又痴痴呆呆的。
茗烟见他这样，因想与他开心，左思右想，皆是宝玉顽烦了的，不能开心，惟有这件，宝玉不曾看见过。|茗烟见他这样，就想让他开心，左思右想，都是宝玉玩腻了的，不能让他开心，只有一样，宝玉没见过。
想毕，便走去到书坊内，把那古今小说并那飞燕，合德，武则天，杨贵妃的外传与那传奇角本买了许多来，引宝玉看。|想好了，就到书铺里，把那些古今小说和赵飞燕、赵合德、武则天、杨贵妃的野史外传，还有传奇剧本买了许多来，让宝玉看。
宝玉何曾见过这些书，一看见了便如得了珍宝。|宝玉哪里见过这些书，一看见就像得了宝贝一样。
茗烟又嘱咐他不可拿进园去，“若叫人知道了，我就吃不了兜著走呢。”|茗烟又嘱咐他不要拿进园里去，“要是叫人知道了，我就吃不了兜着走了。”
宝玉那里舍的不拿进园去，踟蹰再三，单把那文理细密的拣了几套进去，放在床顶上，无人时自己密看。|宝玉哪里舍得不拿进园去，犹豫再三，只把文笔细致的挑了几套带进去，放在床顶上，没人的时候自己偷偷看。
那粗俗过露的，都藏在外面书房里。|那些粗俗露骨的，都藏在外面书房里。
! “静中生烦恼”：宝玉十二三岁，正是情窦初开的年纪。园里的女孩子们还“混沌”，他却已经醒了。
! 这些都是当时的“禁书”。宝玉只挑“文理细密”的带进园，可见他读书有眼光。

# 十五、沁芳闸边，落红成阵
那一日正当三月中浣，早饭后，宝玉携了一套《会真记》，走到沁芳闸桥边桃花底下一块石上坐著，展开《会真记》，从头细玩。|那一天是三月中旬，早饭后，宝玉带了一套《会真记》，走到沁芳闸桥边的桃花树下，坐在一块石头上，打开《会真记》，从头细细品读。
正看到“落红成阵”，只见一阵风过，把树头上桃花吹下一大半来，落的满身满书满地皆是。|正看到“落红成阵”，只见一阵风吹过，把树上的桃花吹落一大半，落得他满身、满书、满地都是。
宝玉要抖将下来，恐怕脚步践踏了，只得兜了那花瓣，来至池边，抖在池内。|宝玉想把花抖下来，又怕被脚踩坏了，只好用衣襟兜着花瓣，走到池边，抖进池子里。
那花瓣浮在水面，飘飘荡荡，竟流出沁芳闸去了。|那些花瓣浮在水面上，飘飘荡荡，竟然流出沁芳闸去了。
! 《会真记》就是元稹的《莺莺传》，元代王实甫把它改编成了《西厢记》，这里宝玉看的其实是《西厢记》。
! “落红成阵”是《西厢记》里的句子，书里写落花，书外真的落花，作者把书和景叠在一起，写得极美。
! 宝玉怕花被践踏，把它们送进水里。他对落花的怜惜，和对女孩子的怜惜是一样的。

# 十六、黛玉葬花
回来只见地下还有许多，宝玉正踟蹰间，只听背后有人说道：“你在这里作什么？”|回来只见地上还有许多，宝玉正在犹豫，只听背后有人说：“你在这里做什么？”
宝玉一回头，却是林黛玉来了，肩上担著花锄，锄上挂著花囊，手内拿著花帚。|宝玉一回头，原来是林黛玉来了，肩上扛着花锄，锄头上挂着装花的口袋，手里拿着扫花的扫帚。
宝玉笑道：“好，好，来把这个花扫起来，撂在那水里。我才撂了好些在那里呢。”|宝玉笑道：“好，好，来把这些花扫起来，扔到那水里去。我刚扔了好些在那里呢。”
林黛玉道：“撂在水里不好。|林黛玉说：“扔在水里不好。
你看这里的水干净，只一流出去，有人家的地方脏的臭的混倒，仍旧把花遭塌了。|你看这里的水是干净的，可一流出去，到了有人家的地方，脏的臭的乱倒一通，还是把花糟蹋了。
那畸角上我有一个花冢，如今把他扫了，装在这绢袋里，拿土埋上，日久不过随土化了，岂不干净。”|那个角落里我有一个花冢，现在把花扫起来，装在这绢袋里，用土埋上，日子久了不过随土化了，岂不是干净。”
! 宝玉把花送进水里，黛玉说水流出去还是会被糟蹋，只有埋进土里才干净。她想得比宝玉更远、更绝。
! 这就是黛玉“质本洁来还洁去”的心愿。第二十七回她写《葬花吟》，“一抔净土掩风流”，“未若锦囊收艳骨”，就是从这里来的。
! 花冢，是黛玉给落花的坟。她葬的是花，哀的是自己。

# 十七、宝玉和黛玉共读《西厢》
宝玉听了喜不自禁，笑道：“待我放下书，帮你来收拾。”|宝玉听了高兴得不得了，笑道：“等我放下书，帮你收拾。”
黛玉道：“什么书？”|黛玉问：“什么书？”
宝玉见问，慌的藏之不迭，便说道：“不过是《中庸》《大学》。”|宝玉见她问，慌得赶紧往身后藏，就说：“不过是《中庸》《大学》。”
黛玉笑道：“你又在我跟前弄鬼。趁早儿给我瞧，好多著呢。”|黛玉笑道：“你又在我面前捣鬼。趁早给我看，这样最好。”
宝玉道：“好妹妹，若论你，我是不怕的。|宝玉说：“好妹妹，要说是你，我是不怕的。
你看了，好歹别告诉别人去。|你看了，好歹别告诉别人。
真真这是好书！你要看了，连饭也不想吃呢。”|这真是好书！你要是看了，连饭都不想吃了。”
一面说，一面递了过去。|一边说一边递了过去。
林黛玉把花具且都放下，接书来瞧，从头看去，越看越爱看，不到一顿饭工夫，将十六出俱已看完，|林黛玉把葬花的工具都放下，接过书来看，从头看下去，越看越爱看，不到一顿饭的工夫，就把十六出全看完了。
自觉词藻警人，馀香满口。|只觉得词句动人心魄，满口余香。
虽看完了书，却只管出神，心内还默默记诵。|虽然看完了书，却只管出神，心里还在默默背诵。
! 宝玉谎称是《中庸》《大学》，可见这在当时是不能让人看见的“淫词艳曲”。
! 黛玉“不到一顿饭工夫”看完十六出，还能“默默记诵”。她的才情，在这里一笔写出。

# 十八、“多愁多病身”和“倾国倾城貌”
宝玉笑道：“妹妹，你说好不好？”|宝玉笑道：“妹妹，你说好不好？”
林黛玉笑道：“果然有趣。”|林黛玉笑道：“果然有意思。”
宝玉笑道：“我就是个‘多愁多病身’，你就是那‘倾国倾城貌’。”|宝玉笑道：“我就是那个‘多愁多病身’，你就是那个‘倾国倾城貌’。”
林黛玉听了，不觉带腮连耳通红，登时直竖起两道似蹙非蹙的眉，瞪了两只似睁非睁的眼，微腮带怒，薄面含嗔，|林黛玉听了，不由得连脸带耳朵都红了，立刻竖起两道似皱非皱的眉毛，瞪着一双似睁非睁的眼睛，脸上带着怒气，含着嗔意，
指宝玉道：“你这该死的胡说！|指着宝玉说：“你这该死的胡说！
好好的把这淫词艳曲弄了来，还学了这些混话来欺负我。|好好的把这些淫词艳曲弄来，还学了这些混话来欺负我。
我告诉舅舅舅母去。”|我告诉舅舅舅母去。”
说到“欺负”两个字上，早又把眼睛圈儿红了，转身就走。|说到“欺负”两个字，眼圈早就又红了，转身就走。
! 《西厢记》里张生对莺莺说：“我是个多愁多病身，怎当他倾国倾城貌。”宝玉借这句话向黛玉表白，这是他第一次这样直白。
! “似蹙非蹙的眉”“似睁非睁的眼”，第三回宝玉初见黛玉时就是这样形容她的，这里作者又用了一次。
! 黛玉恼的不是宝玉说错了话，是他说中了她的心。她不能承认，只能说他“欺负”她。

# 十九、宝玉赌咒
宝玉著了急，向前拦住说道：“好妹妹，千万饶我这一遭，原是我说错了。|宝玉急了，上前拦住她说：“好妹妹，千万饶我这一回，是我说错了。
若有心欺负你，明儿我掉在池子里，教个癞头鼋吞了去，变个大忘八，|要是我有心欺负你，明天我掉进池子里，叫个癞头大鳖吞了去，变成个大王八，
等你明儿做了‘一品夫人’病老归西的时候，我往你坟上替你驮一辈子的碑去。”|等你将来做了‘一品夫人’老病去世的时候，我到你坟上替你驮一辈子的石碑去。”
说的林黛玉嗤的一声笑了，揉著眼睛，一面笑道：|说得林黛玉“嗤”的一声笑了，揉着眼睛，一边笑道：
“一般也唬的这个调儿，还只管胡说。|“一样也吓成这个样子，还只管胡说。
‘呸，原来是苗而不秀，是个银样镴枪头。’”|‘呸，原来是个光长苗不开花的，是个银样镴枪头。’”
宝玉听了，笑道：“你这个呢？我也告诉去。”|宝玉听了，笑道：“你这个呢？我也去告诉。”
林黛玉笑道：“你说你会过目成诵，难道我就不能一目十行么？”|林黛玉笑道：“你说你会过目成诵，难道我就不能一目十行吗？”
! 坟前驮碑的是赑屃（像龟的神兽），宝玉说要变成王八替她驮碑，又傻又真。他说的是“驮一辈子”。
! “银样镴枪头”也是《西厢记》里的话，意思是中看不中用。黛玉刚骂宝玉看“淫词艳曲”，自己转眼就用上了。她已经背下来了。
! 这是宝黛之间最甜蜜的一段。两个人借着《西厢记》，说出了平时说不出的话。

# 二十、袭人来叫宝玉
宝玉一面收书，一面笑道：“正经快把花埋了罢，别提那个了。”|宝玉一边收书，一边笑道：“正经快把花埋了吧，别提那个了。”
二人便收拾落花，正才掩埋妥协，|两人就收拾落花，刚刚埋好，
只见袭人走来，说道：“那里没找到，摸在这里来。|只见袭人走过来说：“哪里都没找到，原来摸到这里来了。
那边大老爷身上不好，姑娘们都过去请安，老太太叫打发你去呢。快回去换衣裳去罢。”|那边大老爷身体不好，姑娘们都过去请安了，老太太叫你也过去呢。快回去换衣服吧。”
宝玉听了，忙拿了书，别了黛玉，同袭人回房换衣不提。|宝玉听了，连忙拿了书，告别了黛玉，和袭人回房换衣服去了。
! 又是袭人来打断。每到宝黛最亲密的时候，总有人来把宝玉叫走。

# 二十一、《牡丹亭》
这里林黛玉见宝玉去了，又听见众姊妹也不在房，自己闷闷的。|这边林黛玉见宝玉走了，又听说姐妹们也不在屋里，自己闷闷的。
正欲回房，刚走到梨香院墙角上，只听墙内笛韵悠扬，歌声婉转。|正要回房，刚走到梨香院的墙角，只听见墙里笛声悠扬，歌声婉转。
林黛玉便知是那十二个女孩子演习戏文呢。|林黛玉就知道是那十二个女孩子在练戏。
只是林黛玉素习不大喜看戏文，便不留心，只管往前走。|只是林黛玉平时不大喜欢看戏，就没留心，只管往前走。
偶然两句吹到耳内，明明白白，一字不落，唱道是：|偶然有两句飘进耳朵里，明明白白，一字不差，唱的是：
“原来姹紫嫣红开遍，似这般都付与断井颓垣。”|“原来这满园的姹紫嫣红都开遍了，却像这样都交给了断井残墙。”
林黛玉听了，倒也十分感慨缠绵，便止住步侧耳细听，|林黛玉听了，倒也十分感慨缠绵，就停下脚步侧耳细听，
又听唱道是：“良辰美景奈何天，赏心乐事谁家院。”|又听唱道：“良辰美景，却无可奈何；赏心乐事，又是谁家的院子。”
听了这两句，不觉点头自叹，心下自思道：|听了这两句，不由得点头叹息，心里想：
“原来戏上也有好文章。可惜世人只知看戏，未必能领略这其中的趣味。”|“原来戏里也有好文章。可惜世人只知道看戏，未必能领略其中的趣味。”
想毕，又后悔不该胡想，耽误了听曲子。|想完，又后悔不该胡思乱想，耽误了听曲子。
! 这是汤显祖《牡丹亭·惊梦》里杜丽娘游园时唱的。杜丽娘十六岁，被关在深闺，第一次走进花园，看见满园春色无人欣赏，感叹青春虚度。
! 黛玉刚刚葬了花，又听见“姹紫嫣红”“付与断井颓垣”。满园的花，终究要凋零；满园的女孩子，终究要散去。

# 二十二、“如花美眷，似水流年”
又侧耳时，只听唱道：“则为你如花美眷，似水流年……”|又侧耳一听，只听唱道：“只为你这如花似玉的美人，年华却像流水一样逝去……”
林黛玉听了这两句，不觉心动神摇。|林黛玉听了这两句，不由得心动神摇。
又听道：“你在幽闺自怜”等句，亦发如醉如痴，站立不住，|又听到“你在深闺里独自怜惜自己”等句，更是如醉如痴，站都站不住了，
便一蹲身坐在一块山子石上，细嚼“如花美眷，似水流年”八个字的滋味。|就一蹲身坐在一块假山石上，细细品味“如花美眷，似水流年”这八个字的滋味。
忽又想起前日见古人诗中有“水流花谢两无情”之句，|忽然又想起前几天在古人诗里看到的“水流花谢两无情”这一句，
再又有词中有“流水落花春去也，天上人间”之句，|还有词里的“流水落花春去也，天上人间”这一句，
又兼方才所见《西厢记》中“花落水流红，闲愁万种”之句，|再加上刚才在《西厢记》里看到的“花落水流红，闲愁万种”这一句，
都一时想起来，凑聚在一处。|一时都想了起来，聚在了一起。
仔细忖度，不觉心痛神痴，眼中落泪。|仔细一想，不由得心痛神痴，眼里落下泪来。
正没个开交，忽觉背上击了一下，及回头看时，原来是……且听下回分解。|正在难过得不能自已，忽然觉得背上被人拍了一下，回头一看，原来是……请看下回分解。
正是：|正是：
~妆晨绣夜心无矣，对月临风恨有之。|早上梳妆、夜里绣花，心里却空空的；对着明月、临着清风，满怀的都是愁恨。
! “如花美眷，似水流年”：黛玉听见的，是自己的命运。她像花一样美，年华却像水一样流走。
! 作者把四段诗句叠在一起：崔涂的“水流花谢两无情”、李煜的“流水落花春去也”、《西厢记》的“花落水流红”，再加上《牡丹亭》。四个“花”和“水”，都是黛玉的眼泪。
! 这一回的回目“西厢记妙词通戏语，牡丹亭艳曲警芳心”：《西厢记》让宝黛互通了心意，《牡丹亭》让黛玉看见了自己的结局。
</script>

<script type="text/plain" id="ch24">
# 一、原来是香菱
话说林黛玉正自情思萦逗，缠绵固结之时，忽有人从背后击了一掌，说道：“你作什么一个人在这里？”|林黛玉正心思缠绕、愁绪郁结的时候，忽然有人从背后拍了她一掌，说：“你一个人在这里做什么？”
林黛玉倒唬了一跳，回头看时，不是别人，却是香菱。|林黛玉倒吓了一跳，回头一看，不是别人，正是香菱。
林黛玉道：“你这个傻丫头，唬我这么一跳好的。你这会子打那里来？”|林黛玉说：“你这个傻丫头，吓了我一大跳。你这会儿从哪里来？”
香菱嘻嘻的笑道：“我来寻我们的姑娘的，找他总找不著。|香菱嘻嘻笑道：“我来找我们姑娘，怎么也找不着她。
你们紫鹃也找你呢，说琏二奶奶送了什么茶叶来给你的。走罢，回家去坐著。”|你们紫鹃也在找你呢，说琏二奶奶送了什么茶叶来给你。走吧，回家去坐着。”
一面说著，一面拉著黛玉的手回潇湘馆来了。|一边说着，一边拉着黛玉的手回潇湘馆去了。
果然凤姐儿送了两小瓶上用新茶来。|果然凤姐送来了两小瓶宫里用的新茶。
林黛玉和香菱坐了。|林黛玉和香菱坐下了。
况他们有甚正事谈讲，不过说些这一个绣的好，那一个刺的精，又下一回棋，看两句书，香菱便走了。|她们哪有什么正经事谈，不过说些这个绣得好、那个刺得精，又下了一盘棋，看了两句书，香菱就走了。
不在话下。|这里不多说。
! 上一回结尾留的悬念，原来只是天真的香菱。香菱就是第一回走失的英莲，“傻丫头”三个字，是她一生的写照。
! 第四十八回香菱跟黛玉学诗，两人更亲近了。
! 凤姐送的这茶，第二十五回凤姐就拿它开黛玉的玩笑：“你既吃了我们家的茶，怎么还不给我们家作媳妇？”

# 二、宝玉向鸳鸯讨胭脂
如今且说宝玉因被袭人找回房去，果见鸳鸯歪在床上看袭人的针线呢，|再说宝玉被袭人找回房去，果然看见鸳鸯靠在床上看袭人做的针线，
见宝玉来了，便说道：“你往那里去了？老太太等著你呢，叫你过那边请大老爷的安去。还不快换了衣服走呢。”|见宝玉来了，就说：“你到哪里去了？老太太等着你呢，叫你到那边去给大老爷请安。还不快换了衣服走。”
袭人便进房去取衣服。|袭人就进屋去拿衣服。
宝玉坐在床沿上，褪了鞋等靴子穿的工夫，|宝玉坐在床沿上，脱了鞋等着穿靴子的工夫，
回头见鸳鸯穿著水红绫子袄儿，青缎子背心，束著白绉绸汗巾儿，脸向那边低著头看针线，脖子上戴著花领子。|回头看见鸳鸯穿着水红绫子袄，青缎子背心，系着白绉绸汗巾，脸朝那边低着头看针线，脖子上戴着绣花领子。
宝玉便把脸凑在他脖项上，闻那香油气，不住用手摩挲，其白腻不在袭人之下，|宝玉就把脸凑到她脖子上，闻她头发上的香油味，不停地用手摸，觉得她脖子的白腻不比袭人差，
便猴上身去涎皮笑道：“好姐姐，把你嘴上的胭脂赏我吃了罢。”|就像猴子一样缠到她身上，嬉皮笑脸地说：“好姐姐，把你嘴上的胭脂赏我吃了吧。”
一面说著，一面扭股糖似的粘在身上。|一边说着，一边像扭股糖一样粘在她身上。
鸳鸯便叫道：“袭人，你出来瞧瞧。你跟他一辈子，也不劝劝，还是这么著。”|鸳鸯就叫道：“袭人，你出来看看。你跟他一辈子，也不劝劝，还是这样。”
袭人抱了衣服出来，向宝玉道：“左劝也不改，右劝也不改，你到底是怎么样？|袭人抱着衣服出来，对宝玉说：“左劝也不改，右劝也不改，你到底要怎么样？
你再这么著，这个地方可就难住了。”|你再这样，这个地方可就待不下去了。”
一边说，一边催他穿了衣服，同鸳鸯往前面来见贾母。|一边说，一边催他穿好衣服，和鸳鸯一起到前面去见贾母。
! 刚刚还在和黛玉共读《西厢》，转身就向鸳鸯讨胭脂吃。宝玉对女孩子的“痴”，是不分对象的。
! 第十九回袭人要他改掉吃胭脂的毛病，他满口答应，这才过了几天。
! 鸳鸯是贾母最信任的大丫鬟。第四十六回贾赦要强娶她做妾，她宁死不从，发誓终身不嫁。

# 三、贾芸
见过贾母，出至外面，人马俱已齐备。|见过贾母，出到外面，人马都已经准备好了。
刚欲上马，只见贾琏请安回来了，正下马，二人对面，彼此问了两句话。|刚要上马，只见贾琏请安回来了，正在下马，两人面对面，互相问了两句话。
只见旁边转出一个人来，“请宝叔安”。|只见旁边转出一个人来，说：“给宝叔请安。”
宝玉看时，只见这人容长脸，长挑身材，年纪只好十八九岁，生得著实斯文清秀，|宝玉一看，只见这人长脸，高挑身材，年纪大约十八九岁，长得很斯文清秀，
倒也十分面善，只是想不起是那一房的，叫什么名字。|倒也很面熟，只是想不起是哪一房的，叫什么名字。
贾琏笑道：“你怎么发呆，连他也不认得？他是后廊上住的五嫂子的儿子芸儿。”|贾琏笑道：“你怎么发呆，连他也不认得？他是住在后廊上的五嫂子的儿子芸儿。”
宝玉笑道：“是了，是了，我怎么就忘了。”|宝玉笑道：“是了，是了，我怎么就忘了。”
因问他母亲好，这会子什么勾当。|就问他母亲好，这会儿来做什么。
贾芸指贾琏道：“找二叔说句话。”|贾芸指着贾琏说：“找二叔说句话。”
宝玉笑道：“你倒比先越发出挑了，倒象我的儿子。”|宝玉笑道：“你倒比以前越发出息了，倒像我的儿子。”
贾琏笑道：“好不害臊！人家比你大四五岁呢，就替你作儿子了？”|贾琏笑道：“好不害臊！人家比你大四五岁呢，就给你做儿子了？”
宝玉笑道：“你今年十几岁了？”|宝玉笑道：“你今年十几岁了？”
贾芸道：“十八岁。”|贾芸说：“十八岁。”
! 贾芸是贾家“草”字辈的穷亲戚，论辈分是宝玉的侄子。宝玉说他“象我的儿子”，是一句没心没肺的玩笑。

# 四、贾芸认“父”
原来这贾芸最伶俐乖觉，听宝玉这样说，便笑道：|原来这贾芸最聪明伶俐，听宝玉这样说，就笑道：
“俗语说的，`摇车里的爷爷，拄拐的孙孙'。|“俗话说，‘摇篮里的爷爷，拄拐棍的孙子’。
虽然岁数大，山高高不过太阳。|虽然我岁数大，可山再高也高不过太阳。
只从我父亲没了，这几年也无人照管教导。|自从我父亲去世，这几年也没人照管教导我。
如若宝叔不嫌侄儿蠢笨，认作儿子，就是我的造化了。”|要是宝叔不嫌侄儿笨，认我做儿子，就是我的福气了。”
贾琏笑道：“你听见了？认儿子不是好开交的呢。”|贾琏笑道：“你听见了？认儿子可不是闹着玩的。”
说著就进去了。|说着就进去了。
宝玉笑道：“明儿你闲了，只管来找我，别和他们鬼鬼祟祟的。|宝玉笑道：“以后你有空，只管来找我，别跟他们鬼鬼祟祟的。
这会子我不得闲儿。明儿你到书房里来，和你说天话儿，我带你园里顽耍去。”|这会儿我没空。明天你到书房里来，我跟你聊聊天，带你到园子里玩去。”
说著扳鞍上马，众小厮围随往贾赦这边来。|说着扶着马鞍上了马，众小厮围着跟着往贾赦那边去了。
! 宝玉一句玩笑，贾芸马上顺杆往上爬，当真要认宝玉做“父亲”。一个穷亲戚要在贾府里找出路，就得这样放下身段。
! 后来贾芸给宝玉送白海棠，信上落款真的是“不肖男芸恭请父亲大人万福金安”（第三十七回）。
! 据脂批，贾芸在贾府败落后还去探望过落难的宝玉，是个有情义的人。

# 五、宝玉去请安
见了贾赦，不过是偶感些风寒，先述了贾母问的话，然后自己请了安。|见了贾赦，原来不过是偶然受了点风寒，宝玉先转达了贾母问候的话，然后自己请了安。
贾赦先站起来回了贾母话，次后便唤人来：“带哥儿进去太太屋里坐著。”|贾赦先站起来回答了贾母的问候，然后叫人来：“带哥儿进去太太屋里坐着。”
宝玉退出，来至后面，进入上房。|宝玉退出来，到了后面，进了上房。
邢夫人见了他来，先倒站了起来，请过贾母安，宝玉方请安。|邢夫人见他来了，先站了起来，问过贾母好，宝玉才给她请安。
邢夫人拉他上炕坐了，方问别人好，又命人倒茶来。|邢夫人拉他上炕坐下，才问别人好，又叫人倒茶来。
一钟茶未吃完，只见那贾琮来问宝玉好。|一杯茶还没喝完，只见贾琮来问宝玉好。
邢夫人道：“那里找活猴儿去！你那奶妈子死绝了，也不收拾收拾你，弄的黑眉乌嘴的，那里象大家子念书的孩子！”|邢夫人说：“哪里来的活猴！你那奶妈死绝了，也不给你收拾收拾，弄得黑眉乌嘴的，哪里像大户人家读书的孩子！”
正说著，只见贾环，贾兰小叔侄两个也来了，请过安，邢夫人便叫他两个椅子上坐了。|正说着，只见贾环、贾兰叔侄两个也来了，请过安，邢夫人就叫他俩在椅子上坐了。
贾环见宝玉同邢夫人坐在一个坐褥上，邢夫人又百般摩挲抚弄他，早已心中不自在了，|贾环见宝玉和邢夫人坐在一个坐垫上，邢夫人又百般抚摸他，心里早就不自在了，
坐不多时，便和贾兰使眼色儿要走。|坐了没一会儿，就给贾兰使眼色要走。
贾兰只得依他，一同起身告辞。|贾兰只好依他，一起起身告辞。
宝玉见他们要走，自己也就起身，要一同回去。|宝玉见他们要走，自己也起身，要一起回去。
邢夫人笑道：“你且坐著，我还和你说话呢。”|邢夫人笑道：“你先坐着，我还有话跟你说呢。”
宝玉只得坐了。|宝玉只好坐下了。
邢夫人向他两个道：“你们回去，各人替我问你们各人母亲好。|邢夫人对他们两个说：“你们回去，各自替我问你们母亲好。
你们姑娘，姐姐，妹妹都在这里呢，闹的我头晕，今儿不留你们吃饭了。”|你们的姑姑、姐姐、妹妹都在这里，闹得我头晕，今天不留你们吃饭了。”
贾环等答应著，便出来回家去了。|贾环等人答应着，就出来回家去了。
! 贾琮是贾赦的庶子，是邢夫人名义上的儿子，邢夫人对他毫不客气；对宝玉却百般疼爱。这份偏心，是做给贾母看的。
! 贾环看着宝玉被人宠，心里又积了一笔怨。同样是庶子，贾琮被骂，贾环被冷落，只有宝玉是“凤凰”。

# 六、邢夫人留宝玉吃饭
宝玉笑道：“可是姐姐们都过来了，怎么不见？”|宝玉笑道：“不是说姐姐们都过来了吗，怎么没看见？”
邢夫人道：“他们坐了一会子，都往后头不知那屋里去了。”|邢夫人说：“她们坐了一会儿，都到后面不知哪间屋里去了。”
宝玉道：“大娘方才说有话说，不知是什么话？”|宝玉说：“大娘刚才说有话要说，不知是什么话？”
邢夫人笑道：“那里有什么话，不过是叫你等著，同你姊妹们吃了饭去。还有一个好玩的东西给你带回去玩。”|邢夫人笑道：“哪有什么话，不过是叫你等着，跟你姐妹们吃了饭再走。还有一个好玩的东西给你带回去玩。”
娘儿两个说话，不觉早又晚饭时节。|娘儿俩说着话，不知不觉又到了吃晚饭的时候。
调开桌椅，罗列杯盘，母女姊妹们吃毕了饭。|摆开桌椅，摆上杯盘，大家吃完了饭。
宝玉去辞贾赦，同姊妹们一同回家，见过贾母，王夫人等，各自回房安息。|宝玉去向贾赦告辞，和姐妹们一起回家，见过贾母、王夫人等人，各自回房休息。
不在话下。|这里不多说。

# 七、贾琏告诉贾芸差事给了贾芹
且说贾芸进去见了贾琏，因打听可有什么事情。|再说贾芸进去见了贾琏，就打听有没有什么差事。
贾琏告诉他：“前儿倒有一件事情出来，偏生你婶子再三求了我，给了贾芹了。|贾琏告诉他：“前几天倒是出了一件事，偏偏你婶子再三求我，给了贾芹了。
他许了我，说明儿园里还有几处要栽花木的地方，等这个工程出来，一定给你就是了。”|她答应了我，说以后园子里还有几处要种花木的地方，等这个工程出来，一定给你就是了。”
贾芸听了，半晌说道：“既是这样，我就等著罢。|贾芸听了，半天才说：“既然这样，我就等着吧。
叔叔也不必先在婶子跟前提我今儿来打听的话，到跟前再说也不迟。”|叔叔也不必先在婶子跟前提我今天来打听的事，到时候再说也不迟。”
贾琏道：“提他作什么，我那里有这些工夫说闲话儿呢。|贾琏说：“提这个做什么，我哪有工夫说这些闲话。
明儿一个五更，还要到兴邑去走一趟，须得当日赶回来才好。|明天五更天，还要到兴邑去一趟，得当天赶回来才好。
你先去等著，后日起更以后你来讨信儿，来早了我不得闲。”|你先回去等着，后天打过初更以后再来听消息，来早了我没空。”
说著便回后面换衣服去了。|说着就回后面换衣服去了。
! 贾芸一听就明白了：求贾琏没用，这个家是凤姐说了算。他叫贾琏别提，是要自己另想办法去走凤姐的门路。

# 八、贾芸找舅舅赊香料
贾芸出了荣国府回家，一路思量，想出一个主意来，便一径往他母舅卜世仁家来。|贾芸出了荣国府回家，一路上琢磨，想出一个主意来，就直接到他舅舅卜世仁家去了。
原来卜世仁现开香料铺，方才从铺子里来，|原来卜世仁开着一家香料铺，刚从铺子里回来，
忽见贾芸进来，彼此见过了，因问他这早晚什么事跑了来。|忽然看见贾芸进来，彼此见过面，就问他这么晚了跑来有什么事。
贾芸道：“有件事求舅舅帮衬帮衬。|贾芸说：“有件事求舅舅帮个忙。
我有一件事，用些冰片麝香使用，好歹舅舅每样赊四两给我，八月里按数送了银子来。”|我有一件事，要用些冰片和麝香，舅舅好歹每样赊给我四两，八月里按数把银子送来。”
卜世仁冷笑道：“再休提赊欠一事。|卜世仁冷笑道：“再别提赊账的事。
前儿也是我们铺子里一个伙计，替他的亲戚赊了几两银子的货，至今总未还上。|前些天也是我们铺子里一个伙计，替他的亲戚赊了几两银子的货，到现在都没还上。
因此我们大家赔上，立了合同，再不许替亲友赊欠。|因此我们大家赔了钱，立了合同，再也不许替亲友赊账。
谁要赊欠，就要罚他二十两银子的东道。|谁要是赊账，就要罚他二十两银子请客。
况且如今这个货也短，你就拿现银子到我们这不三不四的铺子里来买，也还没有这些，只好倒扁儿去。|况且现在这货也缺，你就是拿现银子到我们这不三不四的铺子里来买，也没有这么多，只好到别处去倒腾。
这是一。|这是第一。
二则你那里有正经事，不过赊了去又是胡闹。|第二，你哪里有什么正经事，不过是赊了去又胡闹。
你只说舅舅见你一遭儿就派你一遭儿不是。|你只说舅舅见你一回就数落你一回不是。
你小人儿家很不知好歹，也到底立个主见，赚几个钱，弄得穿是穿吃是吃的，我看著也喜欢。”|你小孩子家不知好歹，也该立个主意，赚几个钱，弄得有穿有吃的，我看着也高兴。”
! 卜世仁谐音“不是人”。外甥来求他，他先编了一大套推辞，再反过来教训外甥。
! 冰片、麝香是名贵的香料，贾芸要拿去送凤姐。他已经看准了：凤姐正要办端阳节礼。

# 九、贾芸回嘴
贾芸笑道：“舅舅说的倒干净。|贾芸笑道：“舅舅说得倒好听。
我父亲没的时候，我年纪又小，不知事。|我父亲去世的时候，我年纪小，不懂事。
后来听见我母亲说，都还亏舅舅们在我们家出主意，料理的丧事。|后来听我母亲说，都还多亏舅舅们在我们家出主意，料理的丧事。
难道舅舅就不知道的，还是有一亩地两间房子，如今在我手里花了不成？|难道舅舅不知道，我们家还有一亩地两间房子，是在我手里花掉的吗？
巧媳妇做不出没米的粥来，叫我怎么样呢？|巧媳妇也做不出没米的粥来，叫我怎么办呢？
还亏是我呢，要是别个，死皮赖脸三日两头儿来缠著舅舅，要三升米二升豆子的，舅舅也就没有法呢。”|还亏是我呢，要是别人，死皮赖脸地三天两头来缠着舅舅，要三升米两升豆子的，舅舅也没办法。”
! 贾芸话里有话：父亲死后，家里那一亩地两间房，是被“出主意”的舅舅们弄走的。这个舅舅不但不帮，还占了他家的便宜。

# 十、卜世仁留饭
卜世仁道：“我的儿，舅舅要有，还不是该的。|卜世仁说：“我的儿，舅舅要是有，还不是应该的。
我天天和你舅母说，只愁你没算计儿。|我天天跟你舅母说，只愁你没有算计。
你但凡立的起来，到你大房里，就是他们爷儿们见不著，便下个气，和他们的管家或者管事的人们嬉和嬉和，也弄个事儿管管。|你但凡能自立，到你们大房那边去，就算见不着那些老爷们，也低个头，和他们的管家或者管事的人套套近乎，也弄个差事管管。
前日我出城去，撞见了你们三房里的老四，骑著大叫驴，带著五辆车，有四五十和尚道士，往家庙去了。|前天我出城去，碰见你们三房的老四，骑着大叫驴，带着五辆车，有四五十个和尚道士，往家庙去了。
他那不亏能干，这事就到他了！”|他要不是能干，这差事怎么会落到他头上！”
贾芸听他韶刀的不堪，便起身告辞。|贾芸听他唠叨得不像话，就起身告辞。
卜世仁道：“怎么急的这样，吃了饭再去罢。”|卜世仁说：“怎么急成这样，吃了饭再走吧。”
一句未完，只见他娘子说道：“你又糊涂了。|一句话还没说完，只见他老婆说：“你又糊涂了。
说著没有米，这里买了半斤面来下给你吃，这会子还装胖呢。|说没有米了，这里刚买了半斤面来给你下面条吃，这会儿还充什么阔气。
留下外甥挨饿不成？”|留下外甥来挨饿不成？”
卜世仁说：“再买半斤来添上就是了。”|卜世仁说：“再买半斤来添上就是了。”
他娘子便叫女孩儿：“银姐，往对门王奶奶家去问，有钱借二三十个，明儿就送过来。”|他老婆就叫女儿：“银姐，到对门王奶奶家去问问，有钱借二三十个，明天就还过去。”
夫妻两个说话，那贾芸早说了几个“不用费事”，去的无影无踪了。|夫妻俩还在说话，贾芸早说了几声“不用麻烦了”，走得无影无踪了。
! 卜世仁夫妇一唱一和：丈夫假意留饭，妻子马上说家里没米，要去借钱。这就是穷亲戚之间的冷暖。
! 贾芹的差事，在卜世仁嘴里成了“能干”的证明。他不知道，贾芹靠的是凤姐。

# 十一、醉金刚倪二
不言卜家夫妇，且说贾芸赌气离了母舅家门，一径回归旧路，心下正自烦恼，一边想，一边低头只管走，|不说卜家夫妇，再说贾芸赌气离开舅舅家，顺着原路往回走，心里正烦恼，一边想，一边低头只管走，
不想一头就碰在一个醉汉身上，把贾芸唬了一跳。|没想到一头撞在一个醉汉身上，把贾芸吓了一跳。
听那醉汉骂道：“臊你娘的！瞎了眼睛，碰起我来了。”|只听那醉汉骂道：“他娘的！瞎了眼睛，撞到我身上来了。”
贾芸忙要躲身，早被那醉汉一把抓住，对面一看，不是别人，却是紧邻倪二。|贾芸连忙要躲，早被那醉汉一把抓住，面对面一看，不是别人，正是隔壁邻居倪二。
原来这倪二是个泼皮，专放重利债，在赌博场吃闲钱，专管打降吃酒。|原来这倪二是个泼皮无赖，专放高利贷，在赌场里抽头钱，专门打架喝酒。
如今正从欠钱人家索了利钱，吃醉回来，不想被贾芸碰了一头，正没好气，抡拳就要打。|这会儿正从欠钱的人家讨了利息，喝醉了回来，没想到被贾芸撞了一下，正没好气，抡起拳头就要打。
只听那人叫道：“老二住手！是我冲撞了你。”|只听那人叫道：“老二住手！是我撞了你。”
倪二听见是熟人的语音，将醉眼睁开看时，见是贾芸，忙把手松了，|倪二听见是熟人的声音，睁开醉眼一看，见是贾芸，连忙松了手，
趔趄著笑道：“原来是贾二爷，我该死，我该死。这会子往那里去？”|歪歪斜斜地笑道：“原来是贾二爷，我该死，我该死。这会儿到哪里去？”
贾芸道：“告诉不得你，平白的又讨了个没趣儿。”|贾芸说：“不能告诉你，平白无故又碰了一鼻子灰。”
倪二道：“不妨不妨，有什么不平的事，告诉我，替你出气。|倪二说：“不要紧，不要紧，有什么不平的事，告诉我，我替你出气。
这三街六巷，凭他是谁，有人得罪了我醉金刚倪二的街坊，管叫他人离家散！”|这三条街六条巷，不管是谁，有人得罪了我醉金刚倪二的街坊，保管叫他家破人散！”
! 刚刚碰了亲舅舅的钉子，转头就碰上一个放高利贷的泼皮。作者有意把两人对照：亲人冷漠，泼皮倒讲义气。这就是回目“醉金刚轻财尚义侠”。

# 十二、倪二借钱
贾芸道：“老二，你且别气，听我告诉你这原故。”|贾芸说：“老二，你先别生气，听我告诉你是怎么回事。”
说著，便把卜世仁一段事告诉了倪二。|说着就把卜世仁那一段事告诉了倪二。
倪二听了大怒，“要不是令舅，我便骂不出好话来，真真气死我倪二。|倪二听了大怒：“要不是你舅舅，我就骂不出好话来了，真气死我倪二了。
也罢，你也不用愁烦，我这里现有几两银子，你若用什么，只管拿去买办。|也罢，你也不用发愁，我这里现有几两银子，你要用什么，只管拿去买。
但只一件，你我作了这些年的街坊，我在外头有名放帐，你却从没有和我张过口。|只是有一件，你我做了这么多年街坊，我在外面是有名的放债的，你却从来没跟我开过口。
也不知你厌恶我是个泼皮，怕低了你的身分，也不知是你怕我难缠，利钱重？|也不知道你是嫌我是个泼皮，怕降低了你的身份，还是怕我难缠、利息重？
若说怕利钱重，这银子我是不要利钱的，也不用写文约，|要说怕利息重，这银子我是不要利息的，也不用写借据；
若说怕低了你的身分，我就不敢借给你了，各自走开。”|要说怕降低了你的身份，那我就不敢借给你了，各走各的。”
一面说，一面果然从搭包里掏出一卷银子来。|一边说，一边果然从腰包里掏出一卷银子来。
! 一个放高利贷的，借钱给邻居“不要利钱”“不用写文约”。倪二最在乎的不是钱，是别人瞧不瞧得起他。

# 十三、贾芸收下银子
贾芸心下自思：“素日倪二虽然是泼皮无赖，却因人而使，颇颇的有义侠之名。|贾芸心里想：“平时倪二虽然是个泼皮无赖，却是看人行事，很有些讲义气的名声。
若今日不领他这情，怕他臊了，倒恐生事。|要是今天不领他这个情，怕他脸上挂不住，反而惹出事来。
不如借了他的，改日加倍还他也倒罢了。”|不如借了他的，改天加倍还他也就是了。”
想毕笑道：“老二，你果然是个好汉，我何曾不想著你，和你张口。|想完笑道：“老二，你果然是条好汉，我何尝没想过找你开口。
但只是我见你所相与交结的，都是些有胆量的有作为的人，似我们这等无能无力的你倒不理。|只是我见你结交的都是些有胆量、有作为的人，像我们这样没本事的，你倒不理。
我若和你张口，你岂肯借给我。|我要是跟你开口，你哪里肯借给我。
今日既蒙高情，我怎敢不领，回家按例写了文约过来便是了。”|今天既然承你的好意，我怎么敢不领，回家照规矩写了借据送过来就是了。”
倪二大笑道：“好会说话的人。我却听不上这话。|倪二大笑道：“好会说话的人。我可听不惯这种话。
既说`相与交结'四个字，如何放帐给他，使他的利钱！|既然说了‘相与交结’四个字，怎么能放债给他，收他的利息！
既把银子借与他，图他的利钱，便不是相与交结了。|既然把银子借给他，图他的利息，就不是朋友交情了。
闲话也不必讲。|闲话也不必说了。
既肯青目，这是十五两三钱有零的银子，便拿去治买东西。|既然你看得起我，这是十五两三钱多的银子，就拿去买东西吧。
你要写什么文契，趁早把银子还我，让我放给那些有指望的人使去。”|你要是写什么借据，趁早把银子还给我，让我放给那些有指望还钱的人去用。”
贾芸听了，一面接了银子，一面笑道：“我便不写罢了，有何著急的。”|贾芸听了，一边接过银子，一边笑道：“我不写就是了，何必着急。”
倪二笑道：“这不是话。|倪二笑道：“这才像话。
天气黑了，也不让茶让酒，我还到那边有点事情去，你竟请回去。|天黑了，也不请你喝茶喝酒了，我还要到那边去办点事，你就请回吧。
我还求你带个信儿与舍下，叫他们早些关门睡罢，我不回家去了，|我还求你给我家里带个信，叫他们早点关门睡觉，我今晚不回家了，
倘或有要紧事儿，叫我们女儿明儿一早到马贩子王短腿家来找我。”|要是有要紧事，叫我女儿明天一早到马贩子王短腿家来找我。”
一面说，一面趔趄著脚儿去了，不在话下。|一边说，一边歪歪斜斜地走了，这里不多说。
! 贾芸心里算得明白：不收会得罪人，收了加倍还。他嘴上说的是恭维话，倪二却句句是真心话。
! 倪二说“相与交结”就不能图利，这是江湖人的义气。作者让一个泼皮说出了比读书人、亲舅舅都高的道理。

# 十四、贾芸称银子
且说贾芸偶然碰了这件事，心中也十分罕希，想那倪二倒果然有些意思，|贾芸偶然碰上这件事，心里也觉得很稀奇，想那倪二倒果然有点意思，
只是还怕他一时醉中慷慨，到明日加倍的要起来，便怎处，心内犹豫不决。|只是还怕他是一时醉了才慷慨，到明天加倍要起来，可怎么办，心里犹豫不决。
忽又想道：“不妨，等那件事成了，也可加倍还他。”|忽然又想：“不要紧，等那件事成了，也可以加倍还他。”
想毕，一直走到个钱铺里，将那银子称一称，十五两三钱四分二厘。|想好了，就一直走到一家钱铺里，把那银子称了称，十五两三钱四分二厘。
贾芸见倪二不撒谎，心下越发欢喜，|贾芸见倪二没撒谎，心里更高兴了，
收了银子，来至家门，先到隔壁将倪二的信捎了与他娘子知道，方回家来。|收好银子，回到家门口，先到隔壁把倪二的话捎给他老婆，才回自己家。
见他母亲自在炕上拈线，见他进来，便问那去了一日。|见他母亲正在炕上捻线，见他进来，就问他去哪里了一整天。
贾芸恐他母亲生气，便不说起卜世仁的事来，只说在西府里等琏二叔的，问他母亲吃了饭不曾。|贾芸怕母亲生气，就不提卜世仁的事，只说在西府里等琏二叔，又问母亲吃了饭没有。
他母亲已吃过了，说留的饭在那里。|他母亲已经吃过了，说给他留了饭。
小丫头子拿过来与他吃。|小丫头拿过来给他吃。
! 贾芸连倪二的银子都要亲自称一称，可见他做事谨慎，不轻信人。称出来一分不差，“十五两三钱四分二厘”。
! 贾芸不跟母亲说舅舅的事，怕她伤心。他是个孝顺的儿子。

# 十五、贾芸奉承凤姐
那天已是掌灯时候，贾芸吃了饭收拾歇息，一宿无话。|那时天已经点灯了，贾芸吃了饭收拾好睡下，一夜无话。
次日一早起来，洗了脸，便出南门，大香铺里买了冰麝，便往荣国府来。|第二天一早起来，洗了脸，就出了南门，到大香料铺里买了冰片和麝香，就往荣国府来了。
打听贾琏出了门，贾芸便往后面来。|打听到贾琏已经出门了，贾芸就往后面来。
到贾琏院门前，只见几个小厮拿著大高笤帚在那里扫院子呢。|到了贾琏院门前，只见几个小厮拿着高高的大扫帚在那里扫院子。
忽见周瑞家的从门里出来叫小厮们：“先别扫，奶奶出来了。”|忽然看见周瑞家的从门里出来叫小厮们：“先别扫了，奶奶出来了。”
贾芸忙上前笑问：“二婶婶那去？”|贾芸连忙上前笑着问：“二婶婶到哪里去？”
周瑞家的道：“老太太叫，想必是裁什么尺头。”|周瑞家的说：“老太太叫，想必是要裁什么布料。”
正说著，只见一群人簇著凤姐出来了。|正说着，只见一群人簇拥着凤姐出来了。
贾芸深知凤姐是喜奉承尚排场的，忙把手逼著，恭恭敬敬抢上来请安。|贾芸深知凤姐喜欢被人奉承、讲究排场，连忙垂着手，恭恭敬敬地抢上前去请安。
凤姐连正眼也不看，仍往前走著，只问他母亲好，“怎么不来我们这里逛逛？”|凤姐连正眼也不看他，仍往前走着，只问他母亲好，“怎么不来我们这里逛逛？”
贾芸道：“只是身上不大好，倒时常记挂著婶子，要来瞧瞧，又不能来。”|贾芸说：“只是身体不大好，倒是常常惦记着婶子，想来看看，又来不了。”
凤姐笑道：“可是会撒谎，不是我提起他来，你就不说他想我了。”|凤姐笑道：“真会撒谎，要不是我提起她来，你也不会说她想我了。”
贾芸笑道：“侄儿不怕雷打了，就敢在长辈前撒谎。|贾芸笑道：“侄儿要是不怕雷劈，才敢在长辈面前撒谎。
昨儿晚上还提起婶子来，说婶子身子生的单弱，事情又多，|昨天晚上我母亲还提起婶子来，说婶子身子单薄，事情又多，
亏婶子好大精神，竟料理的周周全全，要是差一点儿的，早累的不知怎么样呢。”|亏得婶子好大的精神，竟然样样料理得周周全全，要是差一点的人，早就累得不知怎么样了。”
! 凤姐“连正眼也不看”，贾芸却句句说到她心坎上。“好大精神”“料理的周周全全”，正是凤姐最爱听的话。

# 十六、冰片和麝香
凤姐听了满脸是笑，不由的便止了步，问道：“怎么好好的你娘儿们在背地里嚼起我来？”|凤姐听了满脸是笑，不由得停下脚步，问道：“怎么好好的，你们娘儿俩在背地里议论起我来了？”
贾芸道：“有个原故，只因我有个朋友，家里有几个钱，现开香铺。|贾芸说：“有个缘故，因为我有个朋友，家里有几个钱，开着一家香料铺。
只因他身上捐著个通判，前儿选了云南不知那一处，连家眷一齐去，把这香铺也不在这里开了。|因为他捐了个通判的官，前些天被派到云南不知哪个地方，连家眷一起去，这香料铺也不在这里开了。
便把帐物攒了一攒，该给人的给人，该贱发的贱发了，象这细贵的货，都分著送与亲朋。|就把账目货物清理了一下，该给人的给人，该贱卖的贱卖了，像这些精细贵重的货，都分着送给亲戚朋友。
他就一共送了我些冰片，麝香。|他就送了我一些冰片、麝香。
我就和我母亲商量，若要转买，不但卖不出原价来，|我就和母亲商量，要是转卖，不但卖不出原价，
而且谁家拿这些银子买这个作什么，便是很有钱的大家子，也不过使个几分几钱就挺折腰了，|而且谁家拿这么多银子买这个做什么，就是很有钱的大户人家，也不过用个几分几钱就够了；
若说送人，也没个人配使这些，倒叫他一文不值半文转卖了。|要说送人，也没有人配用这些，倒叫人一文不值半文地转卖了。
因此我就想起婶子来。|因此我就想起婶子来。
往年间我还见婶子大包的银子买这些东西呢，|往年我还见过婶子拿大包的银子买这些东西呢，
别说今年贵妃宫中，就是这个端阳节下，不用说这些香料自然是比往常加上十倍去的。|别说今年要往贵妃宫中送礼，就是这个端阳节，这些香料自然要比往常多用十倍。
因此想来想去，只孝顺婶子一个人才合式，方不算遭塌这东西。”|所以想来想去，只有孝敬婶子一个人才合适，才不算糟蹋这东西。”
一边说，一边将一个锦匣举起来。|一边说，一边把一个锦盒举起来。
! 贾芸编了一大套话：香料是朋友送的，不是买的；送给凤姐是因为“只有婶子配用”。他明明是用借来的钱买的，却说得像是凤姐在帮他的忙。
! “今年贵妃宫中”：元春封妃，贾府要给宫里送节礼，香料用量大增。贾芸算准了凤姐需要什么。

# 十七、凤姐不提差事
凤姐正是要办端阳的节礼，采买香料药饵的时节，|凤姐正是要办端午节礼、采买香料药材的时候，
忽见贾芸如此一来，听这一篇话，心下又是得意又是欢喜，|忽然见贾芸这样一来，听了这一番话，心里又得意又高兴，
便命丰儿：“接过芸哥儿的来，送了家去，交给平儿。”|就叫丰儿：“接过芸哥儿的东西，送回家去，交给平儿。”
因又说道：“看著你这样知好歹，怪道你叔叔常提你，说你说话儿也明白，心里有见识。”|又说：“看你这样懂事，怪不得你叔叔常提起你，说你说话明白，心里有见识。”
贾芸听这话入了港，便打进一步来，故意问道：“原来叔叔也曾提我的？”|贾芸听这话有门儿，就进一步，故意问道：“原来叔叔也提起过我？”
凤姐见问，才要告诉他与他管事情的那话，便忙又止住，心下想道：|凤姐见他问，刚要告诉他要给他差事的事，又连忙止住，心里想：
“我如今要告诉他那话，倒叫他看著我见不得东西似的，为得了这点子香，就混许他管事了。|“我要是现在告诉他那件事，倒叫他觉得我好像没见过东西似的，为了得了这点香料，就随便答应给他差事。
今儿先别提起这事。”|今天先别提这件事。”
想毕，便把派他监种花木工程的事都隐瞒的一字不提，随口说了两句淡话，便往贾母那里去了。|想好了，就把要派他监种花木工程的事瞒着一个字也不提，随口说了两句闲话，就往贾母那里去了。
贾芸也不好提的，只得回来。|贾芸也不好提，只好回去了。
! 凤姐收了礼，却偏不提差事。她要的是面子：不能让人觉得她是“为得了这点子香”才办事的。
! 凤姐爱钱，更爱体面。第十五回她收了三千两，嘴上也说“一个钱也不要”。

# 十八、绮霰斋里等宝玉
因昨日见了宝玉，叫他到外书房等著，贾芸吃了饭便又进来，到贾母那边仪门外绮霰斋书房里来。|因为昨天见了宝玉，宝玉叫他到外书房等着，贾芸吃了饭又进来，到贾母那边仪门外的绮霰斋书房里来。
只见焙茗，锄药两个小厮下象棋，为夺“车”正拌嘴，还有引泉、扫花、挑云、伴鹤四五个，又在房檐上掏小雀儿玩。|只见焙茗、锄药两个小厮在下象棋，为了抢一个“车”正在吵嘴，还有引泉、扫花、挑云、伴鹤四五个，又在屋檐上掏小鸟玩。
贾芸进入院内，把脚一跺，说道：“猴头们淘气，我来了。”|贾芸走进院子，把脚一跺，说：“猴崽子们淘气，我来了。”
众小厮看见贾芸进来，都才散了。|小厮们见贾芸进来，才都散了。
贾芸进入房内，便坐在椅子上问：“宝二爷没下来？”|贾芸进了屋，就坐在椅子上问：“宝二爷没下来吗？”
焙茗道：“今儿总没下来。二爷说什么，我替你哨探哨探去。”|焙茗说：“今天一直没下来。二爷有什么话，我替你去打探打探。”
说著，便出去了。|说着就出去了。
! 焙茗就是茗烟，这里改了名字。宝玉的小厮们名字也都很雅：锄药、引泉、扫花、挑云、伴鹤。

# 十九、遇见一个丫头
这里贾芸便看字画古玩，有一顿饭工夫还不见来，再看看别的小厮，都顽去了。|贾芸就在这里看字画古玩，等了一顿饭的工夫还不见人来，再看看别的小厮，都玩去了。
正是烦闷，只听门前娇声嫩语的叫了一声“哥哥”。|正在烦闷，只听门前娇声嫩气地叫了一声“哥哥”。
贾芸往外瞧时，看是一个十六七岁的丫头，生的倒也细巧干净。|贾芸往外一看，是一个十六七岁的丫头，长得倒也细巧干净。
那丫头见了贾芸，便抽身躲了过去。|那丫头看见贾芸，就转身躲开了。
恰值焙茗走来，见那丫头在门前，便说道：“好，好，正抓不著个信儿。”|正好焙茗走过来，见那丫头在门前，就说：“好，好，正找不到个传话的。”
贾芸见了焙茗，也就赶了出来，问怎么样。|贾芸见了焙茗，也赶出来，问怎么样。
焙茗道：“等了这一日，也没个人儿过来。这就是宝二爷房里的。|焙茗说：“等了这一天，也没个人过来。这就是宝二爷屋里的。
好姑娘，你进去带个信儿，就说廊上的二爷来了。”|好姑娘，你进去带个信，就说廊上的二爷来了。”
那丫头听说，方知是本家的爷们，便不似先前那等回避，下死眼把贾芸钉了两眼。|那丫头听了，才知道是本家的爷们，就不像刚才那样回避了，死死地盯着贾芸看了两眼。
听那贾芸说道：“什么是廊上廊下的，你只说是芸儿就是了。”|只听贾芸说：“什么廊上廊下的，你只说是芸儿就行了。”
! “下死眼把贾芸钉了两眼”：这个丫头一见贾芸就动了心。她就是下面要出场的小红。

# 二十、小红劝他回去
半晌，那丫头冷笑了一笑：“依我说，二爷竟请回家去，有什么话明儿再来。|过了一会儿，那丫头冷笑了一下：“依我说，二爷干脆请回家吧，有什么话明天再来。
今儿晚上得空儿我回了他。”|今天晚上有空我替你回他。”
焙茗道：“这是怎么说？”|焙茗说：“这是怎么说？”
那丫头道：“他今儿也没睡中觉，自然吃的晚饭早。晚上他又不下来。|那丫头说：“他今天也没睡午觉，自然晚饭吃得早。晚上他又不会下来。
难道只是耍的二爷在这里等著挨饿不成！|难道就叫二爷在这里干等着挨饿不成！
不如家去，明儿来是正经。|不如回家去，明天再来才是正经。
便是回来有人带信，那都是不中用的。他不过口里应著，他倒给带呢！”|就是待会儿有人替你带信，那也是不管用的。他们不过嘴上答应着，哪会真给你带呢！”
贾芸听这丫头说话简便俏丽，待要问他的名字，因是宝玉房里的，又不便问，|贾芸听这丫头说话简洁俏皮，想问她的名字，因为是宝玉屋里的，又不方便问，
只得说道：“这话倒是，我明儿再来。”|只好说：“这话说得对，我明天再来。”
说著便往外走。|说着就往外走。
焙茗道：“我倒茶去，二爷吃了茶再去。”|焙茗说：“我去倒茶，二爷喝了茶再走。”
贾芸一面走，一面回头说：“不吃茶，我还有事呢。”|贾芸一边走，一边回头说：“不喝茶了，我还有事呢。”
口里说话，眼睛瞧那丫头还站在那里呢。|嘴里说着话，眼睛还瞧着那丫头站在那里呢。
! 小红替贾芸着想：宝玉不会下来，别人带信也靠不住。她话里透着对怡红院里那些大丫头的不满。
! 贾芸“一面走，一面回头”，两人的情意从这一眼开始了。

# 二十一、凤姐派了差事
那贾芸一径回家。|贾芸直接回家了。
至次日来至大门前，可巧遇见凤姐往那边去请安，才上了车，|第二天来到大门前，正好碰见凤姐要到那边去请安，刚上了车，
见贾芸来，便命人唤住，隔窗子笑道：|见贾芸来了，就叫人喊住他，隔着车窗笑道：
“芸儿，你竟有胆子在我的跟前弄鬼。|“芸儿，你竟然有胆子在我面前耍花样。
怪道你送东西给我，原来你有事求我。|怪不得你送东西给我，原来是有事求我。
昨儿你叔叔才告诉我说你求他。”|昨天你叔叔才告诉我说你求过他。”
贾芸笑道：“求叔叔这事，婶子休提，我昨儿正后悔呢。|贾芸笑道：“求叔叔这件事，婶子别提了，我昨天正后悔呢。
早知这样，我竟一起头求婶子，这会子也早完了。|早知道这样，我一开始就求婶子，这会儿早就办成了。
谁承望叔叔竟不能的。”|谁想到叔叔竟然办不成。”
凤姐笑道：“怪道你那里没成儿，昨儿又来寻我。”|凤姐笑道：“怪不得你在那边没办成，昨天又来找我。”
贾芸道：“婶子辜负了我的孝心，我并没有这个意思。|贾芸说：“婶子辜负了我的孝心，我并没有这个意思。
若有这个意思，昨儿还不求婶子。|要是有这个意思，昨天还不就求婶子了。
如今婶子既知道了，我倒要把叔叔丢下，少不得求婶子好歹疼我一点儿。”|现在婶子既然知道了，我倒要把叔叔撇开，少不得求婶子好歹疼我一点。”
! 贾芸一句“谁承望叔叔竟不能的”，暗暗捧了凤姐、贬了贾琏。凤姐最爱听的，就是贾琏不如她。
! 贾琏说“提他作什么”，结果还是提了。

# 二十二、“你倒会拉长线儿”
凤姐冷笑道：“你们要拣远路儿走，叫我也难说。|凤姐冷笑道：“你们偏要绕远路走，叫我也难说。
早告诉我一声儿，有什么不成的，多大点子事，耽误到这会子。|早告诉我一声，有什么办不成的，多大点事，耽误到现在。
那园子里还要种花，我只想不出一个人来，你早来不早完了。”|那园子里还要种花，我正想不出一个人来，你早来不就早办成了。”
贾芸笑道：“既这样，婶子明儿就派我罢。”|贾芸笑道：“既然这样，婶子明天就派我吧。”
凤姐半晌道：“这个我看著不大好。等明年正月里烟火灯烛那个大宗儿下来，再派你罢。”|凤姐想了半天说：“这个我看着不大好。等明年正月里烟火灯烛那个大差事下来，再派你吧。”
贾芸道：“好婶子，先把这个派了我罢。果然这个办的好，再派我那个。”|贾芸说：“好婶子，先把这个派给我吧。要是这个办得好，再派我那个。”
凤姐笑道：“你倒会拉长线儿。|凤姐笑道：“你倒会放长线。
罢了，要不是你叔叔说，我不管你的事。|算了，要不是你叔叔说，我才不管你的事。
我也不过吃了饭就过来，你到午错的时候来领银子，后儿就进去种树。”|我也不过吃了饭就回来，你过了中午来领银子，后天就进去种树。”
说毕，令人驾起香车，一径去了。|说完，叫人赶着香车，一直走了。
! 凤姐故意说要派他“明年”的大差事，试他急不急。贾芸先要小的、再要大的，凤姐笑他“会拉长线儿”，这就是答应了。
! 凤姐嘴上说“要不是你叔叔说”，其实是收了贾芸的香料。她给贾琏留了面子，也给自己留了面子。

# 二十三、贾芸领银子
贾芸喜不自禁，来至绮霰斋打听宝玉，谁知宝玉一早便往北静王府里去了。|贾芸喜出望外，来到绮霰斋打听宝玉，谁知宝玉一早就到北静王府去了。
贾芸便呆呆的坐到晌午，打听凤姐回来，便写个领票来领对牌。|贾芸就呆呆地坐到中午，打听到凤姐回来了，就写了张领票来领对牌。
至院外，命人通报了，彩明走了出来，单要了领票进去，批了银数年月，一并连对牌交与了贾芸。|到了院外，叫人通报了，彩明走出来，只要了领票进去，批上银子数目和年月，连对牌一起交给了贾芸。
贾芸接了，看那批上银数批了二百两，心中喜不自禁，翻身走到银库上，交与收牌票的，领了银子。|贾芸接过来，看那上面批了二百两银子，心里高兴得不得了，转身走到银库，交给收牌票的人，领了银子。
回家告诉母亲，自是母子俱各欢喜。|回家告诉母亲，母子俩自然都很高兴。
次日一个五鼓，贾芸先找了倪二，将前银按数还他。|第二天五更，贾芸先找到倪二，把以前借的银子按数还给他。
那倪二见贾芸有了银子，他便按数收回，不在话下。|那倪二见贾芸有了银子，就按数收回了，这里不多说。
这里贾芸又拿了五十两，出西门找到花儿匠方椿家里去买树，不在话下。|贾芸又拿了五十两，出西门到花匠方椿家里去买树，这里不多说。
! 十五两银子的香料，换来二百两的差事。贾芸只花五十两买树，剩下的就是他的。这就是贾府差事的“油水”。
! 贾芸先还了倪二的钱，按数还清，没有拖欠。
! 花匠方椿，谐音“放春”，种花种树的人，名字也是春天。

# 二十四、宝玉忘了贾芸
如今且说宝玉，自那日见了贾芸，曾说明日著他进来说话儿。|再说宝玉，那天见了贾芸，说过叫他第二天进来说话。
如此说了之后，他原是富贵公子的口角，那里还把这个放在心上，因而便忘怀了。|这么说了以后，他本来就是富贵公子随口说说，哪里会放在心上，因此就忘了。
这日晚上，从北静王府里回来，见过贾母，王夫人等，回至园内，换了衣服，正要洗澡。|这天晚上，他从北静王府回来，见过贾母、王夫人等人，回到园里，换了衣服，正要洗澡。
袭人因被薛宝钗烦了去打结子，秋纹、碧痕两个去催水，檀云又因他母亲的生日接了出去，麝月又现在家中养病，|袭人被薛宝钗请去帮忙打络子，秋纹、碧痕两个去催洗澡水，檀云因为她母亲过生日被接出去了，麝月又正在家里养病，
虽还有几个作粗活听唤的丫头，估著叫不著他们，都出去寻伙觅伴的玩去了。|虽然还有几个做粗活、听使唤的丫头，估计叫不到她们，都出去找伙伴玩去了。
不想这一刻的工夫，只剩了宝玉在房内。|没想到这一会儿工夫，屋里只剩下宝玉一个人。
偏生的宝玉要吃茶，一连叫了两三声，方见两三个老嬷嬷走进来。|偏偏宝玉要喝茶，一连叫了两三声，才见两三个老嬷嬷走进来。
宝玉见了他们，连忙摇手儿说：“罢，罢，不用你们了。”|宝玉见了她们，连忙摆手说：“算了，算了，不用你们了。”
老婆子们只得退出。|老婆子们只好退出去了。
! 贾芸把宝玉一句随口的话当了真，宝玉却“那里还把这个放在心上”。富贵公子的一句话，是穷亲戚的一线希望。
! 宝玉嫌老嬷嬷，宁可自己倒茶。他眼里只有年轻的女孩子。

# 二十五、小红倒茶
宝玉见没丫头们，只得自己下来，拿了碗向茶壶去倒茶。|宝玉见没有丫头，只好自己下来，拿了碗到茶壶那里去倒茶。
只听背后说道：“二爷仔细烫了手，让我们来倒。”|只听背后有人说：“二爷小心烫了手，让我们来倒。”
一面说，一面走上来，早接了碗过去。|一边说，一边走上来，早把碗接过去了。
宝玉倒唬了一跳，问：“你在那里的？忽然来了，唬我一跳。”|宝玉倒吓了一跳，问：“你在哪里？忽然来了，吓我一跳。”
那丫头一面递茶，一面回说：“我在后院子里，才从里间的后门进来，难道二爷就没听见脚步响？”|那丫头一边递茶，一边回答：“我在后院里，刚从里间的后门进来，难道二爷没听见脚步声？”
宝玉一面吃茶，一面仔细打量那丫头：|宝玉一边喝茶，一边仔细打量那丫头：
穿著几件半新不旧的衣裳，倒是一头黑鬒鬒的好头发，挽著个䰖，容长脸面，细巧身材，却十分俏丽干净。|穿着几件半新不旧的衣服，倒是一头乌黑浓密的好头发，挽着一个发髻，长脸，细巧的身材，却十分俏丽干净。
! 小红等这个机会很久了。她“从里间的后门进来”，正好赶上宝玉一个人在。

# 二十六、“认不得的也多”
宝玉看了，便笑问道：“你也是我这屋里的人么？”|宝玉看了，就笑着问：“你也是我屋里的人吗？”
那丫头道：“是的。”|那丫头说：“是的。”
宝玉道：“既是这屋里的，我怎么不认得？”|宝玉说：“既然是这屋里的，我怎么不认得？”
那丫头听说，便冷笑了一声道：“认不得的也多，岂只我一个。|那丫头听了，就冷笑了一声说：“认不得的多着呢，岂止我一个。
从来我又不递茶递水，拿东拿西，眼见的事一点儿不作，那里认得呢。”|我从来不递茶递水、拿东拿西，看得见的事一点也不做，哪里认得呢。”
宝玉道：“你为什么不作那眼见的事？”|宝玉说：“你为什么不做那些看得见的事？”
那丫头道：“这话我也难说。|那丫头说：“这话我也难说。
只是有一句话回二爷：昨儿有个什么芸儿来找二爷。|只是有一句话要回二爷：昨天有个什么芸儿来找二爷。
我想二爷不得空儿，便叫焙茗回他，叫他今日早起来，不想二爷又往北府里去了。”|我想二爷没空，就叫焙茗回他，叫他今天早上来，没想到二爷又到北静王府去了。”
! “认不得的也多，岂只我一个”：小红话里带着怨气。怡红院里的近身差事被袭人、晴雯、秋纹她们占着，像她这样的小丫头，连主子的面都见不到。
! 小红一有机会就提起贾芸，可见她心里已经有了他。

# 二十七、秋纹碧痕回来了
刚说到这句话，只见秋纹，碧痕嘻嘻哈哈的说笑著进来，两个人共提著一桶水，一手撩著衣裳，趔趔趄趄，泼泼撒撒的。|刚说到这句话，只见秋纹、碧痕嘻嘻哈哈地说笑着进来，两个人一起提着一桶水，一只手撩着衣裳，歪歪斜斜，泼泼洒洒的。
那丫头便忙迎去接。|那丫头就连忙迎上去接。
那秋纹，碧痕正对著抱怨，“你湿了我的裙子”，那个又说“你踹了我的鞋”。|秋纹、碧痕正在互相抱怨，这个说“你弄湿了我的裙子”，那个又说“你踩了我的鞋”。
忽见走出一个人来接水，二人看时，不是别人，原来是小红。|忽然看见走出一个人来接水，两人一看，不是别人，原来是小红。
二人便都诧异，将水放下，忙进房来东瞧西望，并没个别人，只有宝玉，便心中大不自在。|两人都很惊讶，把水放下，连忙进屋东看西看，并没有别人，只有宝玉，心里就很不自在。
只得预备下洗澡之物，待宝玉脱了衣裳，二人便带上门出来，走到那边房内便找小红，问他方才在屋里说什么。|只好预备好洗澡的东西，等宝玉脱了衣服，两人就带上门出来，走到那边屋里找小红，问她刚才在屋里说什么。
小红道：“我何曾在屋里的？只因我的手帕子不见了，往后头找手帕子去。|小红说：“我哪里在屋里了？只是因为我的手帕不见了，到后面去找手帕。
不想二爷要茶吃，叫姐姐们一个没有，是我进去了，才倒了茶，姐姐们便来了。”|没想到二爷要喝茶，叫姐姐们一个都不在，是我进去了，才倒了茶，姐姐们就来了。”
! 小红丢的手帕，正是回目“痴女儿遗帕惹相思”的“帕”。这块手帕后来被贾芸捡到，成了两人的信物。

# 二十八、秋纹骂小红
秋纹听了，兜脸啐了一口，骂道：|秋纹听了，迎面啐了她一口，骂道：
“没脸的下流东西！正经叫你去催水去，你说有事故，倒叫我们去，你可等著做这个巧宗儿。|“没脸的下流东西！正经叫你去催水，你说有事，倒叫我们去，你倒在这里等着捡这个便宜。
一里一里的，这不上来了。|一步一步的，这不就爬上来了。
难道我们倒跟不上你了？|难道我们倒比不上你了？
你也拿镜子照照，配递茶递水不配！”|你也拿镜子照照，配不配递茶递水！”
碧痕道：“明儿我说给他们，凡要茶要水送东送西的事，咱们都别动，只叫他去便是了。”|碧痕说：“明天我跟她们说，凡是要茶要水、送东送西的事，咱们都别动，只叫她去就是了。”
秋纹道：“这么说，不如我们散了，单让他在这屋里呢。”|秋纹说：“这么说，不如我们都散了，就让她一个人在这屋里好了。”
二人你一句，我一句，正闹著，|两人你一句我一句，正闹着，
只见有个老嬷嬷进来传凤姐的话说：|只见一个老嬷嬷进来传凤姐的话说：
“明日有人带花儿匠来种树，叫你们严禁些，衣服裙子别混晒混晾的。|“明天有人带花匠来种树，叫你们小心些，衣服裙子别乱晒乱晾的。
那土山上一溜都拦著帏幕呢，可别混跑。”|那土山上一溜都拦着帏幕呢，可别乱跑。”
秋纹便问：“明儿不知是谁带进匠人来监工？”|秋纹就问：“明天不知是谁带工匠进来监工？”
那婆子道：“说什么后廊上的芸哥儿。”|那婆子说：“说是什么后廊上的芸哥儿。”
秋纹，碧痕听了都不知道，只管混问别的话。|秋纹、碧痕听了都不知道是谁，只管乱问别的话。
那小红听见了，心内却明白，就知是昨儿外书房所见那人了。|小红听见了，心里却明白，知道就是昨天在外书房见到的那个人。
! 宝玉屋里的丫鬟也分三六九等。小红倒了一杯茶，就被骂“下流东西”“拿镜子照照”。大丫头们守着自己的地位，不许小丫头往上爬。
! 小红听见“芸哥儿”三个字，心里一动。贾芸要进园子种树了。

# 二十九、小红的来历
原来这小红本姓林，小名红玉，只因“玉”字犯了林黛玉、宝玉，便都把这个字隐起来，便都叫他“小红”。|原来这小红本姓林，小名叫红玉，只因为“玉”字犯了林黛玉、宝玉的名讳，大家就把这个字隐去，都叫她“小红”。
原是荣国府中世代的旧仆，他父母现在收管各处房田事务。|她原是荣国府世代的老仆人家的孩子，她父母现在管着各处的房屋田产。
这红玉年方十六岁，因分人在大观园的时节，把他便分在怡红院中，倒也清幽雅静。|这红玉才十六岁，在给大观园分派人手的时候，被分到了怡红院里，倒也清静幽雅。
不想后来命人进来居住，偏生这一所儿又被宝玉占了。|没想到后来让人进园住，偏偏这一处又被宝玉占了。
这红玉虽然是个不谙事的丫头，却因他有三分容貌，心内著实妄想痴心的往上攀高，|这红玉虽然是个不太懂事的丫头，却因为有三分姿色，心里实在痴心妄想地要往高处攀，
每每的要在宝玉面前现弄现弄。|常常想在宝玉面前露一手。
只是宝玉身边一干人，都是伶牙利爪的，那里插的下手去。|只是宝玉身边那一帮人，都是伶牙俐齿、厉害得很的，哪里插得进手去。
不想今儿才有些消息，又遭秋纹等一场恶意，心内早灰了一半。|没想到今天才刚有点眉目，又遭了秋纹她们一场恶语，心里早就凉了一半。
! 小红的父亲是林之孝，管家之一。她是“家生子”，世代为奴。
! 小红本名“红玉”，和黛玉、宝玉一样有“玉”字。一个丫鬟连自己的名字都要避主子的讳。
! 小红想往上爬，在怡红院走不通。第二十七回她替凤姐传话，口齿伶俐，凤姐一眼看中，把她要去了。她在凤姐那里，才算找到了出路。

# 三十、手帕子
正闷闷的，忽然听见老嬷嬷说起贾芸来，不觉心中一动，|正闷闷不乐的时候，忽然听见老嬷嬷说起贾芸来，心里不由得一动，
便闷闷的回至房中，睡在床上暗暗盘算，翻来掉去，正没个抓寻。|就闷闷地回到房里，躺在床上暗暗盘算，翻来覆去，没个着落。
忽听窗外低低的叫道：“红玉，你的手帕子我拾在这里呢。”|忽然听见窗外低低地叫道：“红玉，你的手帕我捡到了，在这里呢。”
红玉听了忙走出来看，不是别人，正是贾芸。|红玉听了，连忙走出来看，不是别人，正是贾芸。
红玉不觉的粉面含羞，问道：“二爷在那里拾著的？”|红玉不由得脸红害羞，问道：“二爷在哪里捡到的？”
贾芸笑道：“你过来，我告诉你。”|贾芸笑道：“你过来，我告诉你。”
一面说，一面就上来拉他。|一边说，一边就上来拉她。
那红玉急回身一跑，却被门槛绊倒。|那红玉急忙转身一跑，却被门槛绊倒了。
要知端的，下回分解。|要知后事如何，请看下回分解。
! 这一段看起来像真的，下一回开头才说，原来是小红做的一个梦。
! 一块手帕，一个穷亲戚，一个想往上爬的丫头，这是全书少有的两情相悦。据脂批，贾府败落后，两人都还念着旧情，去狱神庙探望过落难的宝玉和凤姐。
</script>

<script type="text/plain" id="ch25">
# 一、原来是梦
话说红玉心神恍惚，情思缠绵，忽朦胧睡去，遇见贾芸要拉他，却回身一跑，被门槛绊了一跤，唬醒过来，方知是梦。|红玉心神恍惚，情思缠绵，迷迷糊糊睡着了，梦见贾芸要拉她，她转身一跑，被门槛绊了一跤，吓醒过来，才知道是梦。
因此翻来复去，一夜无眠。|因此翻来覆去，一夜没睡。
至次日天明，方才起来，就有几个丫头子来会他去打扫房子地面，提洗脸水。|到第二天天亮，刚起来，就有几个小丫头来约她去打扫屋子、提洗脸水。
这红玉也不梳洗，向镜中胡乱挽了一挽头发，洗了洗手，腰内束了一条汗巾子，便来打扫房屋。|这红玉也不梳洗，对着镜子胡乱挽了挽头发，洗了洗手，腰里系了一条汗巾，就来打扫屋子。
! 上一回结尾那一幕原来是梦。作者用梦写小红的心事：她日思夜想的，就是贾芸。

# 二、宝玉也留了心
谁知宝玉昨儿见了红玉，也就留了心。|谁知宝玉昨天见了红玉，也留了心。
若要直点名唤他来使用，一则怕袭人等寒心，|要是直接点名叫她来使唤，一来怕袭人她们寒心，
二则又不知红玉是何等行为，若好还罢了，若不好起来，那时倒不好退送的。|二来又不知道红玉是什么样的人，要是好还罢了，要是不好，那时候倒不好退回去了。
因此心下闷闷的，早起来也不梳洗，只坐著出神。|因此心里闷闷的，早上起来也不梳洗，只坐着出神。
一时下了窗子，隔著纱屉子，向外看的真切，|一会儿放下窗子，隔着纱窗，往外看得清清楚楚，
只见好几个丫头在那里扫地，都擦胭抹粉，簪花插柳的，独不见昨儿那一个。|只见好几个丫头在那里扫地，都搽胭脂抹粉、插花戴柳的，偏偏不见昨天那一个。
宝玉便靸了鞋晃出了房门，只装著看花儿，这里瞧瞧，那里望望，|宝玉就趿着鞋晃出房门，假装看花，这里瞧瞧，那里望望，
一抬头，只见西南角上游廊底下栏杆上似有一个人倚在那里，却恨面前有一株海棠花遮著，看不真切。|一抬头，只见西南角游廊下的栏杆上好像有个人靠在那里，可恨面前有一株海棠花挡着，看不清楚。
只得又转了一步，仔细一看，可不是昨儿那个丫头在那里出神。|只好又挪了一步，仔细一看，可不就是昨天那个丫头在那里出神。
待要迎上去，又不好去的。|想迎上去，又不好意思去。
正想著，忽见碧痕来催他洗脸，只得进去了。|正想着，忽然碧痕来催他洗脸，只好进去了。
不在话下。|这里不多说。
! 宝玉想用小红，又怕袭人“寒心”。怡红院里，连主子用谁都要看大丫头的脸色。
! 宝玉在找小红，小红在想贾芸。两人都在“出神”，想的却不是同一件事。

# 三、小红去潇湘馆借喷壶
却说红玉正自出神，忽见袭人招手叫他，只得走上前来。|红玉正在出神，忽然看见袭人招手叫她，只好走上前来。
袭人笑道：“我们这里的喷壶还没有收拾了来呢，你到林姑娘那里去，把他们的借来使使。”|袭人笑道：“我们这里的喷壶还没修好拿回来呢，你到林姑娘那里去，把她们的借来用用。”
红玉答应了，便走出来往潇湘馆去。|红玉答应着，就出来往潇湘馆去了。
正走上翠烟桥，抬头一望，只见山坡上高处都是拦著帏幕，方想起今儿有匠役在里头种树。|刚走上翠烟桥，抬头一看，只见山坡高处都拦着帏幕，才想起今天有工匠在里面种树。
因转身一望，只见那边远远一簇人在那里掘土，贾芸正坐在那山子石上。|转身一看，只见那边远远一群人在挖土，贾芸正坐在那块假山石上。
红玉待要过去，又不敢过去，只得闷闷的向潇湘馆取了喷壶回来，无精打彩自向房内倒著。|红玉想过去，又不敢过去，只好闷闷地到潇湘馆取了喷壶回来，无精打采地回自己屋里躺着。
众人只说他一时身上不爽快，都不理论。|大家只当她一时身上不舒服，都没理会。
! 远远看了一眼，“待要过去，又不敢过去”。一个丫头的心事，就这样压在心里。

# 四、贾环抄经
展眼过了一日，原来次日就是王子腾夫人的寿诞，那里原打发人来请贾母王夫人的，|转眼过了一天，原来第二天就是王子腾夫人的生日，那边早派人来请贾母、王夫人，
王夫人见贾母不自在，也便不去了。|王夫人见贾母身体不舒服，也就不去了。
倒是薛姨妈同凤姐儿并贾家几个姊妹，宝钗，宝玉一齐都去了，至晚方回。|倒是薛姨妈和凤姐，还有贾家几个姐妹、宝钗、宝玉都一起去了，到晚上才回来。
可巧王夫人见贾环下了学，便命他来抄个《金刚咒》唪诵唪诵。|正好王夫人见贾环放了学，就叫他来抄一遍《金刚咒》，好拿来念诵。
那贾环正在王夫人炕上坐著，命人点灯，拿腔作势的抄写。|贾环正坐在王夫人的炕上，叫人点灯，装模作样地抄写。
一时又叫彩云倒杯茶来，一时又叫玉钏儿来剪剪蜡花，一时又说金钏儿挡了灯影。|一会儿叫彩云倒杯茶来，一会儿叫玉钏儿来剪剪烛花，一会儿又说金钏儿挡了灯光。
众丫鬟们素日厌恶他，都不答理。|丫鬟们平时都讨厌他，都不理他。
只有彩霞还和他合的来，倒了一钟茶来递与他。|只有彩霞还和他合得来，倒了一杯茶递给他。
因见王夫人和人说话儿，他便悄悄的向贾环说道：|因为见王夫人在和别人说话，她就悄悄对贾环说：
“你安些分罢，何苦讨这个厌那个厌的。”|“你安分些吧，何苦招这个讨厌、招那个讨厌的。”
贾环道：“我也知道了，你别哄我。|贾环说：“我也知道了，你别哄我。
如今你和宝玉好，把我不答理，我也看出来了。”|现在你跟宝玉好，不理我了，我也看出来了。”
彩霞咬著嘴唇，向贾环头上戳了一指头，说道：“没良心的！狗咬吕洞宾，不识好人心。”|彩霞咬着嘴唇，在贾环头上戳了一指头，说：“没良心的！狗咬吕洞宾，不识好人心。”
! 贾环难得被王夫人叫来，就摆起主子的架子，“拿腔作势”使唤丫鬟。丫鬟们都厌恶他，只有彩霞对他好。
! 贾环疑心彩霞和宝玉好，下面宝玉偏偏就去拉彩霞的手，贾环的怨毒就爆发了。

# 五、宝玉撒娇
两人正说著，只见凤姐来了，拜见过王夫人。|两人正说着，只见凤姐来了，拜见了王夫人。
王夫人便一长一短的问他，今儿是那几位堂客，戏文好歹，酒席如何等语。|王夫人就一句一句地问她，今天有哪几位女客，戏好不好，酒席怎么样。
说了不多几句话，宝玉也来了，进门见了王夫人，不过规规矩矩说了几句，|说了没几句话，宝玉也来了，进门见了王夫人，不过规规矩矩地说了几句，
便命人除去抹额，脱了袍服，拉了靴子，便一头滚在王夫人怀里。|就叫人摘下抹额，脱了袍子，拉下靴子，一头滚到王夫人怀里。
王夫人便用手满身满脸摩挲抚弄他，宝玉也搬著王夫人的脖子说长道短的。|王夫人就用手在他身上脸上抚摸，宝玉也搂着王夫人的脖子说长道短。
王夫人道：“我的儿，你又吃多了酒，脸上滚热。|王夫人说：“我的儿，你又喝多了酒，脸上滚烫。
你还只是揉搓，一会闹上酒来。还不在那里静静的倒一会子呢。”|你还只顾揉搓，一会儿酒劲上来了。还不到那边静静地躺一会儿。”
说著，便叫人拿个枕头来。|说着就叫人拿个枕头来。
宝玉听说便下来，在王夫人身后倒下，又叫彩霞来替他拍著。|宝玉听了就下来，在王夫人身后躺下，又叫彩霞来替他拍着。
宝玉便和彩霞说笑，只见彩霞淡淡的，不大答理，两眼睛只向贾环处看。|宝玉就和彩霞说笑，只见彩霞淡淡的，不大理他，两只眼睛只往贾环那边看。
宝玉便拉他的手笑道：“好姐姐，你也理我理儿呢。”|宝玉就拉着她的手笑道：“好姐姐，你也理理我呀。”
一面说，一面拉他的手，彩霞夺手不肯，便说：“再闹，我就嚷了。”|一边说，一边拉她的手，彩霞抽回手不肯，就说：“再闹，我就喊了。”
! 同一个屋里，宝玉“一头滚在王夫人怀里”，贾环却要被支使着抄经。嫡子和庶子的待遇，就在贾环眼前。
! 彩霞心里只有贾环，宝玉偏偏来拉她的手。宝玉是无心的，可在贾环看来，宝玉连他唯一的一个人都要抢。

# 六、贾环推倒蜡灯
二人正闹著，原来贾环听的见，素日原恨宝玉，如今又见他和彩霞闹，心中越发按不下这口毒气。|两人正闹着，原来贾环都听见了，他平时就恨宝玉，现在又见宝玉和彩霞闹，心里更压不住这口毒气。
虽不敢明言，却每每暗中算计，只是不得下手，|虽然不敢明说，却常常暗中算计，只是找不到机会下手，
今见相离甚近，便要用热油烫瞎他的眼睛。|现在见离得很近，就想用热油烫瞎他的眼睛。
因而故意装作失手，把那一盏油汪汪的蜡灯向宝玉脸上只一推。|于是故意装作失手，把那一盏满是热油的蜡灯往宝玉脸上一推。
只听宝玉“嗳哟”了一声，满屋里众人都唬了一跳。|只听宝玉“哎哟”一声，满屋子的人都吓了一跳。
连忙将地下的戳灯挪过来，又将里外间屋的灯拿了三四盏看时，只见宝玉满脸满头都是油。|连忙把地上的落地灯挪过来，又把里外屋的灯拿了三四盏来照，只见宝玉满头满脸都是油。
王夫人又急又气，一面命人来替宝玉擦洗，一面又骂贾环。|王夫人又急又气，一面叫人来给宝玉擦洗，一面又骂贾环。
! “烫瞎他的眼睛”：这不是小孩子的恶作剧，是真正的恶意。贾环心里的恨，从第二十回“都欺负我不是太太养的”一路积到这里。

# 七、凤姐一句话
凤姐三步两步的上炕去替宝玉收拾著，一面笑道：|凤姐三步两步上了炕，替宝玉收拾着，一面笑道：
“老三还是这么慌脚鸡似的，我说你上不得高台盘。|“老三还是这么慌手慌脚的，我说你上不得台面。
赵姨娘时常也该教导教导他。”|赵姨娘也该常教导教导他。”
一句话提醒了王夫人，那王夫人不骂贾环，便叫过赵姨娘来骂道：|一句话提醒了王夫人，王夫人不骂贾环了，就把赵姨娘叫过来骂道：
“养出这样黑心不知道理下流种子来，也不管管！|“养出这样黑心肠、不懂道理的下流种子来，也不管管！
几番几次我都不理论，你们得了意了，越发上来了！”|好几次我都没跟你们计较，你们得意了，越来越放肆了！”
那赵姨娘素日虽然常怀嫉妒之心，不忿凤姐宝玉两个，也不敢露出来，|那赵姨娘平时虽然常怀嫉妒之心，不服凤姐和宝玉两个，却也不敢表露出来，
如今贾环又生了事，受这场恶气，不但吞声承受，而且还要走去替宝玉收拾。|现在贾环又惹了事，她受了这场恶气，不但要忍气吞声，还得走过去替宝玉收拾。
! 凤姐一句话，把矛头从贾环转到了赵姨娘身上。凤姐向来瞧不起赵姨娘，这一下，赵姨娘对凤姐的恨又深了一层。
! 赵姨娘“不忿凤姐宝玉两个”，这一句点明了下面魇魔法的对象。

# 八、宝玉替贾环遮掩
只见宝玉左边脸上烫了一溜燎泡出来，幸而眼睛竟没动。|只见宝玉左边脸上烫起了一串燎泡，幸好眼睛竟然没伤着。
王夫人看了，又是心疼，又怕明日贾母问怎么回答，急的又把赵姨娘数落一顿。|王夫人看了，又心疼，又怕明天贾母问起来怎么回答，急得又把赵姨娘数落了一顿。
然后又安慰了宝玉一回，又命取败毒消肿药来敷上。|然后又安慰了宝玉一番，又叫人拿解毒消肿的药来敷上。
宝玉道：“有些疼，还不妨事。明儿老太太问，就说是我自己烫的罢了。”|宝玉说：“有点疼，还不要紧。明天老太太问，就说是我自己烫的吧。”
凤姐笑道：“便说是自己烫的，也要骂人为什么不小心看著，叫你烫了！|凤姐笑道：“就算说是自己烫的，老太太也要骂人为什么不小心看着，让你烫着了！
横竖有一场气生的，到明儿凭你怎么说去罢。”|反正免不了一场气，到明天随你怎么说吧。”
王夫人命人好生送了宝玉回房去后，袭人等见了，都慌的了不得。|王夫人叫人好好送宝玉回房去，袭人她们见了，都慌得不得了。
! 宝玉被烫了，却说“是我自己烫的”。他不记恨贾环，只怕连累别人。这份宽厚，贾环永远不会懂。

# 九、黛玉来看宝玉
林黛玉见宝玉出了一天门，就觉闷闷的，没个可说话的人。|林黛玉见宝玉出门一整天，就觉得闷闷的，没有可以说话的人。
至晚正打发人来问了两三遍回来不曾，这遍方才回来，又偏生烫了。|到了晚上，派人来问了两三遍回来没有，这一遍才回来了，偏偏又被烫了。
林黛玉便赶著来瞧，只见宝玉正拿镜子照呢，左边脸上满满的敷了一脸的药。|林黛玉就赶来看他，只见宝玉正拿着镜子在照，左边脸上满满地敷了一脸的药。
林黛玉只当烫的十分利害，忙上来问怎么烫了，要瞧瞧。|林黛玉以为烫得很厉害，连忙上前问怎么烫了，要看看。
宝玉见他来了，忙把脸遮著，摇手叫他出去，不肯叫他看。|宝玉见她来了，连忙把脸遮住，摆手叫她出去，不肯让她看。
——知道他的癖性喜洁，见不得这些东西。|——他知道黛玉有洁癖，见不得这些东西。
林黛玉自己也知道自己也有这件癖性，知道宝玉的心内怕他嫌脏，|林黛玉自己也知道自己有这个毛病，知道宝玉心里是怕她嫌脏，
因笑道：“我瞧瞧烫了那里了，有什么遮著藏著的。”|就笑道：“我看看烫在哪里了，有什么好遮遮掩掩的。”
一面说一面就凑上来，强搬著脖子瞧了一瞧，问他疼的怎么样。|一边说一边凑上来，硬扳过他的脖子看了看，问他疼得怎么样。
宝玉道：“也不很疼，养一两日就好了。”|宝玉说：“也不太疼，养一两天就好了。”
林黛玉坐了一回，闷闷的回房去了。|林黛玉坐了一会儿，闷闷地回房去了。
一宿无话。|一夜无话。
! 宝玉怕黛玉嫌脏，黛玉偏要“强搬著脖子”看。两人都知道对方的心思，都替对方着想。
! 黛玉问了“两三遍”宝玉回来没有。他不在，她就没有说话的人。

# 十、马道婆来了
次日，宝玉见了贾母，虽然自己承认是自己烫的，不与别人相干，免不得那贾母又把跟从的人骂一顿。|第二天，宝玉见了贾母，虽然自己承认是自己烫的，跟别人没关系，贾母免不了还是把跟着的人骂了一顿。
过了一日，就有宝玉寄名的干娘马道婆进荣国府来请安。|过了一天，宝玉寄名的干娘马道婆来荣国府请安。
见了宝玉，唬一大跳，问起原由，说是烫的，便点头叹息一回，|见了宝玉，吓了一大跳，问起缘由，说是烫的，就点头叹息了一番，
向宝玉脸上用指头画了一画，口内嘟嘟囔囔的又持诵了一回，说道：|用手指在宝玉脸上画了一画，嘴里嘟嘟囔囔地又念了一阵咒，说：
“管保就好了，这不过是一时飞灾。”|“保管就好了，这不过是一时的飞来横祸。”
又向贾母道：“祖宗老菩萨那里知道，那经典佛法上说的利害，|又对贾母说：“老祖宗老菩萨哪里知道，那佛经上说得厉害，
大凡那王公卿相人家的子弟，只一生长下来，暗里便有许多促狭鬼跟著他，|凡是王公卿相人家的子弟，只要一生下来，暗地里就有许多捣蛋鬼跟着他，
得空便拧他一下，或掐他一下，或吃饭时打下他的饭碗来，或走著推他一跤，|一有机会就拧他一下，或者掐他一下，或者吃饭时打掉他的饭碗，或者走路时推他一跤，
所以往往的那些大家子孙多有长不大的。”|所以那些大户人家的子孙常常有长不大的。”
贾母听如此说，便赶著问：“这有什么佛法解释没有呢？”|贾母听她这么说，就赶紧问：“这有什么佛法可以化解吗？”
! “寄名的干娘”：旧时富贵人家怕孩子养不大，就让孩子认和尚道士或巫婆做干亲，叫“寄名”。
! 马道婆先吓唬贾母，再推销“佛法”。这是她骗钱的老套路。

# 十一、大海灯
马道婆道：“这个容易，只是替他多作些因果善事也就罢了。|马道婆说：“这个容易，只要替他多做些积德行善的事就行了。
再那经上还说，西方有位大光明普照菩萨，专管照耀阴暗邪祟，|那佛经上还说，西方有一位大光明普照菩萨，专门照亮阴暗、驱除邪祟，
若有善男子善女子虔心供奉者，可以永佑儿孙康宁安静，再无惊恐邪祟撞客之灾。”|要是有善男信女虔诚供奉，就可以永远保佑儿孙平安健康，再也不会有受惊、中邪的灾祸。”
贾母道：“倒不知怎么个供奉这位菩萨？”|贾母说：“不知道怎么供奉这位菩萨？”
马道婆道：“也不值些什么，不过除香烛供养之外，一天多添几斤香油，点上个大海灯。|马道婆说：“也花不了什么，不过除了香烛供品之外，每天多添几斤香油，点上一盏大海灯。
这海灯，便是菩萨现身法像，昼夜不敢息的。”|这海灯就是菩萨现身的法像，白天黑夜都不能灭的。”
贾母道：“一天一夜也得多少油？明白告诉我，我也好作这件功德的。”|贾母说：“一天一夜要多少油？明明白白告诉我，我也好做这件功德。”
马道婆听如此说，便笑道：“这也不拘，随施主菩萨们随心愿舍罢了。|马道婆听她这么说，就笑道：“这也没有定数，随施主们的心意施舍罢了。
象我们庙里，就有好几处的王妃诰命供奉的：|像我们庙里，就有好几家王妃诰命在供奉：
南安郡王府里的太妃，他许的多，愿心大，一天是四十八斤油，一斤灯草，那海灯也只比缸略小些，|南安郡王府里的太妃，她许的愿大，一天是四十八斤油、一斤灯草，那海灯也只比水缸小一点；
锦田侯的诰命次一等，一天不过二十四斤油，|锦田侯的诰命夫人差一等，一天不过二十四斤油；
再还有几家也有五斤的，三斤的，一斤的，都不拘数。|还有几家也有五斤的、三斤的、一斤的，都没有定数。
那小家子穷人家舍不起这些，就是四两半斤，也少不得替他点。”|那些小户穷人家舍不起这么多，就是四两半斤，我们也少不得替他们点上。”
贾母听了，点头思忖。|贾母听了，点头思索。
马道婆又道：“还有一件，若是为父母尊亲长上的，多舍些不妨，|马道婆又说：“还有一件，要是为父母长辈祈福，多舍些不要紧；
若是象老祖宗如今为宝玉，若舍多了倒不好，还怕哥儿禁不起，倒折了福。|要是像老祖宗现在为宝玉，舍多了反而不好，还怕哥儿承受不起，倒折了福。
也不当家花花的，要舍，大则七斤，小则五斤，也就是了。”|也不必太多，要舍的话，多则七斤，少则五斤，也就够了。”
贾母说：“既是这样说，你便一日五斤合准了，每月打趸来关了去。”|贾母说：“既然这么说，你就一天五斤算准了，每个月来一次总领了去。”
马道婆念了一声“阿弥陀佛慈悲大菩萨”。|马道婆念了一声“阿弥陀佛慈悲大菩萨”。
贾母又命人来吩咐：“以后大凡宝玉出门的日子，拿几串钱交给他的小子们带著，遇见僧道穷苦人好舍。”|贾母又叫人来吩咐：“以后凡是宝玉出门的日子，拿几串钱交给他的小厮们带着，碰见和尚道士和穷苦人好施舍。”
! 马道婆先说别家“四十八斤”“二十四斤”，再说宝玉不能舍多，“七斤五斤就够了”。先抬价再降价，贾母反倒觉得她替自己着想。这是精明的骗术。
! 一天五斤香油，一个月就是一百五十斤，这都进了马道婆的口袋。
! 第十二回凤姐只给贾瑞“渣末泡须”，贾府却每天给马道婆五斤香油。富贵人家的“善事”，常常不在该用的地方。

# 十二、马道婆到赵姨娘房里
说毕，那马道婆又坐了一回，便又往各院各房问安，闲逛了一回。|说完，那马道婆又坐了一会儿，就又到各院各房问安，闲逛了一阵。
一时来至赵姨娘房内，二人见过，赵姨娘命小丫头倒了茶来与他吃。|一会儿来到赵姨娘房里，两人见过，赵姨娘叫小丫头倒茶给她喝。
马道婆因见炕上堆著些零碎绸缎湾角，赵姨娘正粘鞋呢。|马道婆见炕上堆着些零碎的绸缎边角，赵姨娘正在粘鞋面。
马道婆道：“可是我正没了鞋面子了。|马道婆说：“可巧我正没有鞋面了。
赵奶奶你有零碎缎子，不拘什么颜色的，弄一双鞋面给我。”|赵奶奶你有零碎缎子，不管什么颜色的，给我弄一双鞋面。”
赵姨娘听说，便叹口气说道：|赵姨娘听了，就叹口气说：
“你瞧瞧那里头，还有那一块是成样的？成了样的东西，也不能到我手里来！|“你看看那里面，还有哪一块是像样的？像样的东西，也到不了我手里！
有的没的都在这里，你不嫌，就挑两块子去。”|有的没的都在这里，你不嫌弃，就挑两块去。”
马道婆见说，果真便挑了两块袖将起来。|马道婆听了，果真挑了两块塞进袖子里。
! 赵姨娘在贾府里只能拿“零碎绸缎湾角”。一句“成了样的东西，也不能到我手里来”，是她全部的委屈。
! 马道婆连这种边角料都要，可见她的贪。

# 十三、赵姨娘诉苦
赵姨娘问道：“前日我送了五百钱去，在药王跟前上供，你可收了没有？”|赵姨娘问：“前几天我送了五百钱去，在药王面前上供，你收到了没有？”
马道婆道：“早已替你上了供了。”|马道婆说：“早就替你上了供了。”
赵姨娘叹口气道：“阿弥陀佛！我手里但凡从容些，也时常的上个供，只是心有余力量不足。”|赵姨娘叹口气说：“阿弥陀佛！我手里要是宽裕些，也常常上个供，只是心有余而力不足。”
马道婆道：“你只管放心，将来熬的环哥儿大了，得个一官半职，那时你要作多大的功德不能？”|马道婆说：“你只管放心，将来熬到环哥儿长大了，得个一官半职，那时你想做多大的功德做不成？”
赵姨娘听说，鼻子里笑了一声，说道：|赵姨娘听了，鼻子里笑了一声，说：
“罢，罢，再别说起。如今就是个样儿，我们娘儿们跟的上这屋里那一个儿！|“算了，算了，别再说了。现在就是这个样子，我们娘儿俩哪里比得上这屋里的哪一个！
也不是有了宝玉，竟是得了活龙。|简直不是有了宝玉，是得了一条活龙。
他还是小孩子家，长的得人意儿，大人偏疼他些也还罢了，我只不伏这个主儿。”|他还是个小孩子，长得招人喜欢，大人偏疼他些也就罢了，我只是不服这个主儿。”
一面说，一面伸出两个指头儿来。|一边说，一边伸出两个手指头来。
马道婆会意，便问道：“可是琏二奶奶？”|马道婆会意，就问：“是琏二奶奶吗？”
赵姨娘唬的忙摇手儿，走到门前，掀帘子向外看看无人，方进来向马道婆悄悄说道：|赵姨娘吓得连忙摆手，走到门口，掀开帘子往外看看没人，才进来对马道婆悄悄说：
“了不得，了不得！提起这个主儿，这一分家私要不都叫他搬送到娘家去，我也不是个人。”|“不得了，不得了！说起这个主儿，这一份家产要不全被她搬到娘家去，我就不是人。”
! 伸出两个指头，指的是“二奶奶”凤姐。赵姨娘连名字都不敢说出口，可见凤姐的威势。
! 赵姨娘恨的两个人，一个是宝玉，一个是凤姐。宝玉挡着贾环的路，凤姐管着她的日子。

# 十四、马道婆引她上钩
马道婆见他如此说，便探他口气说道：|马道婆见她这样说，就试探她的口气说：
“我还用你说，难道都看不出来。也亏你们心里也不理论，只凭他去。倒也妙。”|“还用你说，难道大家都看不出来。也亏你们心里不计较，只由着她去。倒也好。”
赵姨娘道：“我的娘，不凭他去，难道谁还敢把他怎么样呢？”|赵姨娘说：“我的娘，不由着她去，难道谁还敢把她怎么样？”
马道婆听说，鼻子里一笑，半晌说道：|马道婆听了，鼻子里一笑，过了半天说：
“不是我说句造孽的话，你们没有本事！——也难怪别人。|“不是我说句造孽的话，是你们没本事！——也难怪别人。
明不敢怎样，暗里也就算计了，还等到这如今！”|明里不敢怎么样，暗里也就算计了，还等到现在！”
赵姨娘闻听这话里有道理，心内暗暗的欢喜，便说道：|赵姨娘听这话里有门道，心里暗暗高兴，就说：
“怎么暗里算计？我倒有这个意思，只是没这样的能干人。|“怎么暗里算计？我倒有这个意思，只是没有这样能干的人。
你若教给我这法子，我大大的谢你。”|你要是教给我这个法子，我大大地谢你。”
马道婆听说这话打拢了一处，便又故意说道：|马道婆听这话说到一块儿去了，又故意说：
“阿弥陀佛！你快休问我，我那里知道这些事。罪过，罪过。”|“阿弥陀佛！你快别问我，我哪里知道这些事。罪过，罪过。”
赵姨娘道：“你又来了。|赵姨娘说：“你又来了。
你是最肯济困扶危的人，难道就眼睁睁的看人家来摆布死了我们娘儿两个不成？|你是最肯救苦救难的人，难道就眼睁睁地看着人家把我们娘儿俩摆布死不成？
难道还怕我不谢你？”|难道还怕我不谢你？”
! 马道婆一步一步引诱：先说“你们没有本事”，再说“暗里也就算计了”，赵姨娘一问，她又装作不知道、念“罪过”。这是欲擒故纵。

# 十五、五百两的欠契
马道婆听说如此，便笑道：“若说我不忍叫你娘儿们受人委曲还犹可，若说谢我的这两个字，可是你错打算盘了。|马道婆听她这么说，就笑道：“要说我不忍心看你们娘儿俩受人委屈，那还说得过去；要说谢我这两个字，你可打错算盘了。
就便是我希图你谢，靠你有些什么东西能打动我？”|就算我图你的谢礼，你有什么东西能打动我？”
赵姨娘听这话口气松动了，便说道：|赵姨娘听这话口气松动了，就说：
“你这么个明白人，怎么糊涂起来了。|“你这么个明白人，怎么糊涂起来了。
你若果然法子灵验，把他两个绝了，明日这家私不怕不是我环儿的。|你要是法子真灵验，把他们两个除掉了，将来这份家产还怕不是我环儿的。
那时你要什么不得？”|那时你要什么没有？”
马道婆听了，低了头，半晌说道：“那时候事情妥了，又无凭据，你还理我呢！”|马道婆听了，低下头，半天才说：“到那时候事情办成了，又没有凭据，你还会理我吗！”
赵姨娘道：“这又何难。|赵姨娘说：“这又有什么难的。
如今我虽手里没什么，也零碎攒了几两梯己，还有几件衣服簪子，你先拿些去。|现在我手里虽然没什么，也零零碎碎攒了几两私房钱，还有几件衣服和簪子，你先拿些去。
下剩的，我写个欠银子文契给你，你要什么保人也有，那时我照数给你。”|剩下的，我写个欠银子的字据给你，你要什么保人也有，到时候我照数给你。”
马道婆道：“果然这样？”|马道婆说：“真的这样？”
赵姨娘道：“这如何还撒得谎。”|赵姨娘说：“这怎么还能撒谎。”
说著便叫过一个心腹婆子来，耳根底下嘁嘁喳喳说了几句话。|说着就叫来一个心腹婆子，在她耳边嘁嘁喳喳说了几句。
那婆子出去了，一时回来，果然写了个五百两欠契来。|那婆子出去了，一会儿回来，果然写了一张五百两的欠条来。
赵姨娘便印了个手模，走到橱柜里将梯己拿了出来，与马道婆看看，|赵姨娘就按了个手印，走到柜子里把私房钱拿出来，给马道婆看，
道：“这个你先拿了去做香烛供奉使费，可好不好？”|说：“这个你先拿去做香烛供品的费用，好不好？”
! “把他两个绝了”：赵姨娘要的是凤姐和宝玉的命。为了贾环能继承家产，她什么都敢做。
! 五百两银子，对一个连像样的绸缎都拿不到的姨娘来说，是天文数字。她把全部的私房钱都押上了。

# 十六、十个纸鬼
马道婆看看白花花的一堆银子，又有欠契，并不顾青红皂白，满口里应著，伸手先去抓了银子掖起来，然后收了欠契。|马道婆看着白花花的一堆银子，又有欠条，也不管青红皂白，满口答应着，伸手先把银子抓过来塞好，然后收了欠条。
又向裤腰里掏了半晌，掏出十个纸铰的青面白发的鬼来，并两个纸人，递与赵姨娘，|又在裤腰里掏了半天，掏出十个纸剪的青面白发的鬼，还有两个纸人，递给赵姨娘，
又悄悄的教他道：“把他两个的年庚八字写在这两个纸人身上，一并五个鬼都掖在他们各人的床上就完了。|又悄悄教她说：“把他们两个的生辰八字写在这两个纸人身上，连同五个鬼一起塞到他们各自的床上就行了。
我只在家里作法，自有效验。千万小心，不要害怕！”|我只在家里作法，自然会灵验。千万小心，不要害怕！”
正才说著，只见王夫人的丫鬟进来找道：“奶奶可在这里，太太等你呢。”|正说着，只见王夫人的丫鬟进来找：“奶奶在这里吗？太太等你呢。”
二人方散了，不在话下。|两人这才散了，这里不多说。
! 这就是回目里的“魇魔法”：把人的生辰八字写在纸人上，再配上纸鬼作法，就能让人中邪发狂。
! 十个鬼，每人五个，就是“姊弟逢五鬼”。凤姐是宝玉的堂嫂，又是他的表姐（王夫人的侄女），所以正文说“叔嫂”，回目说“姊弟”。
! 一个满口“阿弥陀佛”的出家人，袖子里藏着害人的纸鬼。马道婆后来事发被抓（第八十一回），这是后四十回的情节。

# 十七、凤姐开黛玉的玩笑
却说林黛玉因见宝玉近日烫了脸，总不出门，倒时常在一处说说话儿。|再说林黛玉因为宝玉最近烫了脸，一直不出门，倒常常在一起说说话。
这日饭后看了两篇书，自觉无趣，便同紫鹃雪雁做了一回针线，更觉烦闷。|这天饭后看了两篇书，觉得没意思，就和紫鹃、雪雁做了一会儿针线，更觉得烦闷。
便倚著房门出了一回神，信步出来，看阶下新迸出的稚笋，不觉出了院门。|就靠着房门出了一会儿神，随便走出来，看台阶下新冒出来的嫩笋，不知不觉出了院门。
一望园中，四顾无人，惟见花光柳影，鸟语溪声。|往园子里一看，四周没有人，只看见花光柳影，听见鸟叫溪流声。
林黛玉信步便往怡红院中来，只见几个丫头舀水，都在回廊上围著看画眉洗澡呢。|林黛玉随便走着就到了怡红院，只见几个丫头舀了水，都在回廊上围着看画眉洗澡呢。
听见房内有笑声，林黛玉便入房中看时，原来是李宫裁，凤姐，宝钗都在这里呢，|听见屋里有笑声，林黛玉就走进屋里一看，原来是李纨、凤姐、宝钗都在这里，
一见他进来都笑道：“这不又来了一个。”|一见她进来都笑道：“这不又来了一个。”
林黛玉笑道：“今儿齐全，谁下帖子请来的？”|林黛玉笑道：“今天人这么齐，是谁下帖子请来的？”
凤姐道：“前儿我打发了丫头送了两瓶茶叶去，你往那去了？”|凤姐说：“前几天我派丫头给你送了两瓶茶叶去，你到哪里去了？”
林黛玉笑道：“哦，可是倒忘了，多谢多谢。”|林黛玉笑道：“哦，倒忘了，多谢多谢。”
凤姐儿又道：“你尝了可还好不好？”|凤姐又问：“你尝了，好不好？”
没有说完，宝玉便说道：“论理可倒罢了，只是我说不大甚好，也不知别人尝著怎么样。”|还没说完，宝玉就说：“说起来倒也罢了，只是我觉得不太好，也不知道别人尝着怎么样。”
宝钗道：“味倒轻，只是颜色不大好些。”|宝钗说：“味道倒是清淡，只是颜色不大好。”
凤姐道：“那是暹罗进贡来的。我尝著也没什么趣儿，还不如我每日吃的呢。”|凤姐说：“那是暹罗进贡来的。我尝着也没什么意思，还不如我每天喝的呢。”
林黛玉道：“我吃著好，不知你们的脾胃是怎样？”|林黛玉说：“我喝着挺好，不知你们的口味是怎样的？”
宝玉道：“你果然爱吃，把我这个也拿了去吃罢。”|宝玉说：“你要是真爱喝，把我这份也拿去喝吧。”
凤姐笑道：“你要爱吃，我那里还有呢。”|凤姐笑道：“你要是爱喝，我那里还有呢。”
林黛玉道：“果真的，我就打发丫头取去了。”|林黛玉说：“真的吗，那我就派丫头去取了。”
凤姐道：“不用取去，我打发人送来就是了。|凤姐说：“不用去取，我派人送来就是了。
我明儿还有一件事求你，一同打发人送来。”|我明天还有一件事要求你，一起派人送来。”
! 这茶就是上一回开头凤姐送来的“上用新茶”。暹罗就是现在的泰国。大家都说不好，只有黛玉说好，宝玉马上要把自己的也给她。

# 十八、“怎么还不给我们家作媳妇？”
林黛玉听了笑道：“你们听听，这是吃了他们家一点子茶叶，就来使唤人了。”|林黛玉听了笑道：“你们听听，这是喝了她家一点茶叶，就来使唤人了。”
凤姐笑道：“倒求你，你倒说这些闲话，吃茶吃水的。|凤姐笑道：“我倒来求你，你倒说这些闲话，什么喝茶喝水的。
你既吃了我们家的茶，怎么还不给我们家作媳妇？”|你既然喝了我们家的茶，怎么还不给我们家做媳妇？”
众人听了一齐都笑起来。|大家听了一齐笑起来。
林黛玉红了脸，一声儿不言语，便回过头去了。|林黛玉红了脸，一声也不吭，就回过头去了。
李宫裁笑向宝钗道：“真真我们二婶子的诙谐是好的。”|李纨笑着对宝钗说：“真是我们二婶子的玩笑开得好。”
林黛玉道：“什么诙谐，不过是贫嘴贱舌讨人厌恶罢了。”|林黛玉说：“什么玩笑，不过是贫嘴贱舌讨人嫌罢了。”
说著便啐了一口。|说着就啐了一口。
凤姐笑道：“你别作梦！你给我们家作了媳妇，少什么？”|凤姐笑道：“你别做梦了！你给我们家做了媳妇，少什么？”
指宝玉道：“你瞧瞧，人物儿，门第配不上，根基配不上，家私配不上？那一点还玷辱了谁呢？”|指着宝玉说：“你瞧瞧，人品、门第配不上？根基配不上？家产配不上？哪一点会辱没了谁呢？”
! 旧时定亲要“下茶”，女方收了男方的茶礼，就是许了亲，所以说“吃了茶”就是许了人家。凤姐借茶开玩笑，当众说出了大家心里都明白的事。
! 凤姐这句玩笑，说明在贾府上下的心目中，宝黛的姻缘几乎是默认的。可最后娶黛玉的人没有出现，宝玉娶的是宝钗，出主意的正是凤姐（后四十回的“调包计”）。
! 李纨偏偏对着宝钗笑。宝钗在旁边听着，作者一个字也没写她的反应。

# 十九、宝玉留住黛玉
林黛玉抬身就走。|林黛玉起身就走。
宝钗便叫：“颦儿急了，还不回来坐著。走了倒没意思。”|宝钗就叫：“颦儿急了，还不回来坐着。走了倒没意思了。”
说著便站起来拉住。|说着就站起来拉住她。
刚至房门前，只见赵姨娘和周姨娘两个人进来瞧宝玉。|刚到房门口，只见赵姨娘和周姨娘两个人进来看宝玉。
李宫裁，宝钗宝玉等都让他两个坐。|李纨、宝钗、宝玉等人都请她俩坐。
独凤姐只和林黛玉说笑，正眼也不看他们。|只有凤姐只顾和林黛玉说笑，正眼也不看她们。
宝钗方欲说话时，只见王夫人房内的丫头来说：“舅太太来了，请奶奶姑娘们出去呢。”|宝钗正要说话，只见王夫人屋里的丫头来说：“舅太太来了，请奶奶、姑娘们出去呢。”
李宫裁听了，连忙叫著凤姐等走了。|李纨听了，连忙叫上凤姐等人走了。
赵，周两个忙辞了宝玉出去。|赵姨娘、周姨娘两个也连忙辞了宝玉出去了。
宝玉道：“我也不能出去，你们好歹别叫舅母进来。”|宝玉说：“我也不能出去，你们好歹别叫舅母进来。”
又道：“林妹妹，你先略站一站，我说一句话。”|又说：“林妹妹，你先稍微站一站，我说一句话。”
凤姐听了，回头向林黛玉笑道：“有人叫你说话呢。”|凤姐听了，回头对林黛玉笑道：“有人叫你说话呢。”
说著便把林黛玉往里一推，和李纨一同去了。|说着就把林黛玉往里一推，和李纨一起走了。
! “颦儿”是宝玉给黛玉起的字（第三回），宝钗也这样叫她。
! 赵姨娘进来，凤姐“正眼也不看”。赵姨娘刚刚花了五百两要凤姐的命，凤姐却浑然不知。
! 凤姐把黛玉“往里一推”，成全宝黛说话。凤姐这时候是真心撮合他们的。

# 二十、宝玉发狂
这里宝玉拉著林黛玉的袖子，只是嘻嘻的笑，心里有话，只是口里说不出来。|这边宝玉拉着林黛玉的袖子，只是嘻嘻地笑，心里有话，嘴上却说不出来。
此时林黛玉只是禁不住把脸红涨了，挣著要走。|这时林黛玉忍不住脸都涨红了，挣扎着要走。
宝玉忽然“嗳哟”了一声，说：“好头疼！”|宝玉忽然“哎哟”一声，说：“好头疼！”
林黛玉道：“该，阿弥陀佛！”|林黛玉说：“活该，阿弥陀佛！”
只见宝玉大叫一声：“我要死！”将身一纵，离地跳有三四尺高，口内乱嚷乱叫，说起胡话来了。|只见宝玉大叫一声：“我要死了！”身子一纵，离地跳起三四尺高，嘴里乱嚷乱叫，说起胡话来了。
林黛玉并丫头们都唬慌了，忙去报知王夫人，贾母等。|林黛玉和丫头们都吓慌了，连忙去报告王夫人、贾母等人。
此时王子腾的夫人也在这里，都一齐来时，宝玉益发拿刀弄杖，寻死觅活的，闹得天翻地覆。|这时王子腾的夫人也在这里，大家一起赶来时，宝玉更是拿刀弄棍，寻死觅活，闹得天翻地覆。
贾母，王夫人见了，唬的抖衣而颤，且“儿”一声“肉”一声放声恸哭。|贾母、王夫人见了，吓得浑身发抖，一声声“我的儿”“我的肉”地放声痛哭。
于是惊动诸人，连贾赦，邢夫人，贾珍，贾政，贾琏，贾蓉，贾芸，贾萍，薛姨妈，薛蟠并周瑞家的一干家中上上下下里里外外众媳妇丫头等，都来园内看视。|于是惊动了所有人，连贾赦、邢夫人、贾珍、贾政、贾琏、贾蓉、贾芸、贾萍、薛姨妈、薛蟠和周瑞家的等家里上上下下、里里外外的媳妇丫头，都到园子里来看。
登时园内乱麻一般。|园子里顿时乱成一团麻。
! 宝玉“心里有话，只是口里说不出来”，正要说的时候，魇魔法发作了。他要说的那句话，终究没有说出口。
! 黛玉说“该，阿弥陀佛”，本是玩笑，话音未落宝玉就发了狂。

# 二十一、凤姐也发狂
正没个主见，只见凤姐手持一把明晃晃钢刀砍进园来，见鸡杀鸡，见狗杀狗，见人就要杀人。|正没主意的时候，只见凤姐拿着一把明晃晃的钢刀砍进园来，见鸡杀鸡，见狗杀狗，见人就要杀人。
众人越发慌了。|大家更慌了。
周瑞媳妇忙带著几个有力量的胆壮的婆娘上去抱住，夺下刀来，抬回房去。|周瑞家的连忙带着几个有力气、胆子大的婆子上去抱住她，夺下刀来，抬回房去。
平儿，丰儿等哭的泪天泪地。|平儿、丰儿等人哭得死去活来。
贾政等心中也有些烦难，顾了这里，丢不下那里。|贾政等人心里也很为难，顾了这边，又放不下那边。
! 平时最精明强干的凤姐，拿着钢刀见人就杀。魇魔法让她露出了最凶狠的一面，这也是她判词里“机关算尽”的另一种写照。

# 二十二、薛蟠
别人慌张自不必讲，独有薛蟠更比诸人忙到十分去：|别人慌张自不必说，只有薛蟠比谁都忙得厉害：
又恐薛姨妈被人挤倒，又恐薛宝钗被人瞧见，又恐香菱被人臊皮，|又怕薛姨妈被人挤倒，又怕薛宝钗被人看见，又怕香菱被人调戏，
——知道贾珍等是在女人身上做功夫的，因此忙的不堪。|——他知道贾珍那些人是专在女人身上下功夫的，所以忙得不得了。
忽一眼瞥见了林黛玉风流婉转，已酥倒在那里。|忽然一眼瞥见了林黛玉风流婉转的样子，他已经骨头都酥了。
! 一片混乱中，作者忽然插进一段薛蟠的丑态，有讽刺，也有喜剧感。
! 连薛蟠都知道贾珍“在女人身上做功夫”，宁府的名声可想而知。

# 二十三、百般医治无效
当下众人七言八语，有的说请端公送祟的，有的说请巫婆跳神的，有的又荐玉皇阁的张真人，种种喧腾不一。|当时大家七嘴八舌，有的说请神汉来送鬼，有的说请巫婆来跳神，有的又推荐玉皇阁的张真人，种种说法，吵吵嚷嚷。
也曾百般医治祈祷，问卜求神，总无效验。|也曾想尽办法医治祈祷、算卦求神，都不见效。
堪堪日落。|眼看太阳就要落山了。
王子腾夫人告辞去后，次日王子腾也来瞧问。|王子腾夫人告辞走了以后，第二天王子腾也来探望。
接著小史侯家，邢夫人弟兄辈并各亲戚眷属都来瞧看，也有送符水的，也有荐僧道的，总不见效。|接着史侯家、邢夫人的兄弟和各位亲戚都来探望，有送符水的，有推荐和尚道士的，都不见效。
他叔嫂二人愈发糊涂，不省人事，睡在床上，浑身火炭一般，口内无般不说。|他们叔嫂二人越来越糊涂，不省人事，躺在床上，浑身像火炭一样烫，嘴里什么胡话都说。
到夜晚间，那些婆娘媳妇丫头们都不敢上前。|到了夜里，那些婆子媳妇丫头们都不敢上前。
因此把他二人都抬到王夫人的上房内，夜间派了贾芸带著小厮们挨次轮班看守。|因此把他们两人都抬到王夫人的上房里，夜里派贾芸带着小厮们轮班看守。
贾母，王夫人，邢夫人薛姨妈等寸地不离，只围著干哭。|贾母、王夫人、邢夫人、薛姨妈等人一步也不离开，只是围着干哭。
! 贾芸刚得了种树的差事，又被派来守夜。他正在园子里，离小红很近。

# 二十四、准备后事
此时贾赦，贾政又恐哭坏了贾母，日夜熬油费火，闹的人口不安，也都没了主意。|这时贾赦、贾政又怕哭坏了贾母，日夜点灯熬油，闹得全家不安，也都没了主意。
贾赦还各处去寻僧觅道。|贾赦还到处去找和尚道士。
贾政见不灵效，著实懊恼，因阻贾赦道：|贾政见不灵验，实在烦恼，就劝阻贾赦说：
“儿女之数，皆由天命，非人力可强者。|“儿女的寿数，都是天命，不是人力能勉强的。
他二人之病出于不意，百般医治不效，想天意该如此，也只好由他们去罢。”|他们两人的病来得突然，百般医治都不见效，想必是天意如此，也只好由他们去吧。”
贾赦也不理此话，仍是百般忙乱，那里见些效验。|贾赦也不理这话，仍旧百般忙乱，哪里有一点效果。
看看三日光阴，那凤姐和宝玉躺在床上，亦发连气都将没了。|眼看过了三天，凤姐和宝玉躺在床上，连气都快没了。
合家人口无不惊慌，都说没了指望，忙著将他二人的后世的衣履都治备下了。|全家没有一个不惊慌的，都说没指望了，忙着把他们两人的寿衣寿鞋都准备好了。
贾母，王夫人，贾琏，平儿，袭人这几个人更比诸人哭的忘餐废寝，觅死寻活。|贾母、王夫人、贾琏、平儿、袭人这几个人比别人哭得更厉害，饭也不吃、觉也不睡，寻死觅活的。
赵姨娘，贾环等自是称愿。|赵姨娘、贾环等人自然称心如意。
! 贾政说“儿女之数，皆由天命”，听着冷漠，其实是绝望。
! “赵姨娘，贾环等自是称愿”：全家都在哭，只有他们母子心里暗喜。作者一笔就写透了人心。

# 二十五、宝玉醒了一下
到了第四日早晨，贾母等正围著宝玉哭时，只见宝玉睁开眼说道：|到了第四天早上，贾母等人正围着宝玉哭，只见宝玉睁开眼睛说：
“从今以后，我可不在你家了！快收拾了，打发我走罢。”|“从今以后，我可不在你家了！快收拾收拾，打发我走吧。”
贾母听了这话，如同摘心去肝一般。|贾母听了这话，像被摘了心、挖了肝一样。
赵姨娘在旁劝道：“老太太也不必过于悲痛。|赵姨娘在旁边劝道：“老太太也不必太伤心了。
哥儿已是不中用了，不如把哥儿的衣服穿好，让他早些回去，也免些苦，|哥儿已经不中用了，不如把哥儿的寿衣穿好，让他早点回去，也少受些苦；
只管舍不得他，这口气不断，他在那世里也受罪不安生。”|只管舍不得他，这口气不断，他在那边也受罪不得安生。”
! “我可不在你家了”：宝玉说的是胡话，也是谶语。他最后真的离开了这个家。
! 赵姨娘急着劝贾母给宝玉“穿好衣服”，她盼着宝玉快死。

# 二十六、贾母骂赵姨娘
这些话没说完，被贾母照脸啐了一口唾沫，骂道：|这些话还没说完，就被贾母迎面啐了一口唾沫，骂道：
“烂了舌头的混帐老婆，谁叫你来多嘴多舌的！|“烂了舌头的混账老婆，谁叫你来多嘴多舌的！
你怎么知道他在那世里受罪不安生？怎么见得不中用了？|你怎么知道他在那边受罪不得安生？怎么见得他不中用了？
你愿他死了，有什么好处？你别做梦！|你盼他死了，有什么好处？你别做梦！
他死了，我只和你们要命。|他要是死了，我只跟你们要命。
素日都不是你们调唆著逼他写字念书，把胆子唬破了，见了他老子不象个避猫鼠儿？|平时还不是你们调唆着逼他写字念书，把他的胆子吓破了，见了他老子就像老鼠见了猫？
都不是你们这起淫妇调唆的！|还不都是你们这些淫妇调唆的！
这会子逼死了，你们遂了心，我饶那一个！”|这会儿逼死了，你们称了心，我饶了哪一个！”
一面骂，一面哭。|一边骂，一边哭。
贾政在旁听见这些话，心里越发难过，便喝退赵姨娘，自己上来委婉解劝。|贾政在旁边听见这些话，心里更加难过，就喝退了赵姨娘，自己上前委婉劝慰。
! 贾母一眼就看穿了赵姨娘：“你愿他死了，有什么好处？”老太太心里明镜似的。
! 贾母骂“逼他写字念书”，其实是在骂贾政。贾政在旁边听着，“心里越发难过”。

# 二十七、棺材做好了
一时又有人来回说：“两口棺椁都做齐了，请老爷出去看。”|一会儿又有人来回禀：“两口棺材都做好了，请老爷出去看看。”
贾母听了，如火上浇油一般，便骂：“是谁做了棺椁？”|贾母听了，像火上浇油一样，就骂：“是谁做的棺材？”
一叠声只叫把做棺材的拉来打死。|一声接一声地叫把做棺材的人拉来打死。
! 贾母不许任何人说宝玉要死，连棺材都不能提。这是一个祖母最后的倔强。

# 二十八、一僧一道
正闹的天翻地覆，没个开交，只闻得隐隐的木鱼声响，念了一句：|正闹得天翻地覆、没法收场的时候，只听见隐隐约约的木鱼声，有人念了一句：
“南无解冤孽菩萨。有那人口不利，家宅颠倾，或逢凶险，或中邪祟者，我们善能医治。”|“南无解冤孽菩萨。凡是有家人不平安、家宅不安宁，或者遇到凶险，或者中了邪的，我们都能医治。”
贾母，王夫人听见这些话，那里还耐得住，便命人去快请进来。|贾母、王夫人听见这些话，哪里还忍得住，就叫人快去请进来。
贾政虽不自在，奈贾母之言如何违拗，想如此深宅，何得听的这样真切，心中亦希罕，命人请了进来。|贾政虽然不太情愿，可贾母的话怎么能违背，又想这样深的宅院，怎么能听得这么清楚，心里也觉得稀奇，就叫人请了进来。
众人举目看时，原来是一个癞头和尚与一个跛足道人。|大家抬眼一看，原来是一个癞头和尚和一个瘸腿道士。
见那和尚是怎的模样：|只见那和尚是什么模样：
~鼻如悬胆两眉长，目似明星蓄宝光，|鼻子像悬着的胆，两道眉毛长长的；眼睛像明星，蕴藏着宝光；
~破衲芒鞋无住迹，腌臜更有满头疮。|穿着破袈裟、草鞋，四处漂泊没有定所，满头都是脏兮兮的疮。
那道人又是怎生模样：|那道士又是什么模样：
~一足高来一足低，浑身带水又拖泥。|一只脚高，一只脚低，浑身沾着水、拖着泥。
~相逢若问家何处，却在蓬莱弱水西。|要是相逢时问他家在哪里，他说在蓬莱仙山弱水的西边。
! 这就是第一回把石头带下凡的那一僧一道，第十二回给贾瑞送风月宝鉴的也是这个道人。他们每次出现，都是在命运的关口。
! 深宅大院里听得见木鱼声，贾政也觉得“希罕”。他们不是凡人。

# 二十九、“你家现有希世奇珍”
贾政问道：“你道友二人在那庙里焚修。”|贾政问：“你们二位道友在哪座庙里修行？”
那僧笑道：“长官不须多话。因闻得府上人口不利，故特来医治。”|那和尚笑道：“长官不必多问。我们听说府上有人不平安，所以特地来医治。”
贾政道：“倒有两个人中邪，不知你们有何符水？”|贾政说：“倒是有两个人中了邪，不知你们有什么符水？”
那道人笑道：“你家现有希世奇珍，如何还问我们有符水？”|那道士笑道：“你家现有稀世珍宝，怎么还问我们有没有符水？”
贾政听这话有意思，心中便动了，因说道：|贾政听这话有意思，心里就动了，于是说：
“小儿落草时虽带了一块宝玉下来，上面说能除邪祟，谁知竟不灵验。”|“小儿出生时虽然带了一块宝玉来，上面说能除邪祟，谁知竟然不灵验。”
那僧道：“长官你那里知道那物的妙用。|那和尚说：“长官您哪里知道那东西的妙用。
只因他如今被声色货利所迷，故不灵验了。|只因为它现在被声色财利迷住了，所以不灵验了。
你今且取他出来，待我们持颂持颂，只怕就好了。”|您现在把它拿出来，等我们念诵念诵，只怕就好了。”
! 通灵宝玉上刻着“一除邪祟”。第十五回北静王问灵不灵验，贾政说“未曾试过”，这一回才真正试了。
! “被声色货利所迷”：石头下凡十三年，在富贵温柔乡里沾染了尘埃，失去了灵性。

# 三十、和尚对玉说话
贾政听说，便向宝玉项上取下那玉来递与他二人。|贾政听了，就从宝玉脖子上取下那块玉递给他们两人。
那和尚接了过来，擎在掌上，长叹一声道：|那和尚接过来，托在手掌上，长叹一声说：
青埂峰一别，展眼已过十三载矣！|青埂峰一别，转眼已经过了十三年了！
人世光阴，如此迅速，尘缘满日，若似弹指！|人间的时光，竟然这样快，尘缘满了的那一天，就像弹一下手指那样短！
可羡你当时的那段好处：|可羡慕你当初的那段好时光：
~天不拘兮地不羁，心头无喜亦无悲，|天也不管，地也不拘，心里没有喜也没有悲；
~却因锻炼通灵后，便向人间觅是非。|却因为被炼得有了灵性，就跑到人间来惹是生非。
可叹你今日这番经历：|可叹你今天的这番经历：
~粉渍脂痕污宝光，绮栊昼夜困鸳鸯。|脂粉的痕迹弄脏了你的宝光，华丽的闺房里日夜困着成双的鸳鸯。
~沉酣一梦终须醒，冤孽偿清好散场！|沉醉的一场梦终究要醒，冤孽还清了就好散场！
! 宝玉十三岁，石头下凡十三年。和尚对着玉说话，就是对着宝玉的前身说话。
! “沉酣一梦终须醒，冤孽偿清好散场”：这是全书的预言。梦要醒，账要还，最后要散场。回目里的“红楼梦通灵”，说的就是这块在红楼一梦里蒙了尘的通灵玉。

# 三十一、三十三天后病好
念毕，又摩弄一回，说了些疯话，递与贾政道：|念完，又摩挲了一阵，说了些疯话，递给贾政说：
“此物已灵，不可亵渎，悬于卧室上槛，将他二人安在一室之内，除亲身妻母外，不可使阴人冲犯。|“这东西已经灵验了，不可亵渎，把它挂在卧室的门槛上方，把他们两人安置在一间屋里，除了亲生母亲和妻子以外，不能让别的女人冲撞。
三十三日之后，包管身安病退，复旧如初。”|三十三天以后，保管身体平安、病也好了，恢复得和原来一样。”
说著回头便走了。|说着转身就走了。
贾政赶著还说话，让二人坐了吃茶，要送谢礼，他二人早已出去了。|贾政追着还想说话，请他们坐下喝茶，要送谢礼，他们两人早已经出去了。
贾母等还只管著人去赶，那里有个踪影。|贾母等人还只管叫人去追，哪里还有踪影。
少不得依言将他二人就安放在王夫人卧室之内，将玉悬在门上。|只好按他们说的，把两人安放在王夫人的卧室里，把玉挂在门上。
王夫人亲身守著，不许别个人进来。|王夫人亲自守着，不许别人进来。
! “不可使阴人冲犯”：阴人指女人。宝玉的病，一半是魇魔，一半是“粉渍脂痕”，所以要远离女子。
! 一僧一道不要谢礼，来去无踪，和马道婆贪财害人正好相反。

# 三十二、醒了
至晚间他二人竟渐渐醒来，说腹中饥饿。|到了晚上，他们两人竟然渐渐醒了过来，说肚子饿了。
贾母，王夫人如得了珍宝一般，旋熬了米汤与他二人吃了，精神渐长，邪祟稍退，一家子才把心放下来。|贾母、王夫人像得了珍宝一样，马上熬了米汤给他们吃了，精神渐渐恢复，邪气稍稍退去，一家人才放下心来。
李宫裁并贾府三艳，薛宝钗，林黛玉，平儿，袭人等在外间听信息。|李纨和贾府三姐妹、薛宝钗、林黛玉、平儿、袭人等人在外间等消息。
闻得吃了米汤，省了人事，别人未开口，林黛玉先就念了一声“阿弥陀佛”。|听说吃了米汤、清醒过来了，别人还没开口，林黛玉先就念了一声“阿弥陀佛”。
! 黛玉第一个念“阿弥陀佛”。她不顾旁人，心里最急的就是她。

# 三十三、宝钗的玩笑
薛宝钗便回头看了他半日，嗤的一声笑。|薛宝钗就回头看了她半天，“嗤”的一声笑了。
众人都不会意，贾惜春道：“宝姐姐，好好的笑什么？”|大家都不明白，贾惜春问：“宝姐姐，好好的笑什么？”
宝钗笑道：“我笑如来佛比人还忙：又要讲经说法，又要普渡众生，|宝钗笑道：“我笑如来佛比人还忙：又要讲经说法，又要普度众生，
这如今宝玉，凤姐姐病了，又烧香还愿，赐福消灾，|现在宝玉、凤姐姐病了，又要烧香还愿、赐福消灾，
今才好些，又管林姑娘的姻缘了。你说忙的可笑不可笑。”|刚好一点，又要管林姑娘的姻缘了。你说忙得可笑不可笑。”
林黛玉不觉的红了脸，啐了一口道：|林黛玉不由得红了脸，啐了一口说：
“你们这起人不是好人，不知怎么死！|“你们这些人不是好人，不知道怎么死！
再不跟著好人学，只跟著凤姐贫嘴烂舌的学。”|不跟着好人学，只跟着凤姐学那些贫嘴烂舌的。”
一面说，一面摔帘子出去了。|一边说，一边摔帘子出去了。
不知端详，且听下回分解。|不知后事如何，请看下回分解。
! 宝钗也拿宝黛的姻缘开玩笑，和凤姐说“作媳妇”一样。可宝钗的玩笑里，有没有别的意思？作者没有说。
! 宝钗“回头看了他半日”才笑。这“半日”里，她在想什么？
! 这一回从小红的梦开始，到宝玉、凤姐死里逃生结束。贾环母子的恶、马道婆的贪、一僧一道的神秘，全在这一回里交织。宝玉这次没死，可“冤孽偿清好散场”的话已经说下了。
